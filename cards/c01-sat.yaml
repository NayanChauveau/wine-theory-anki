# yaml-language-server: $schema=../schema/cards.schema.json
# source: C01 (import/inbox/c01-sat.yaml)
# deck: SAT
# Original reviewed samples (not from the source extract).

cards:
  - id: sat-acidity-001
    type: mcq
    deck: SAT
    tags: [sat, acidity]
    status: reviewed
    en:
      question: "Which sensation is the most reliable guide to a wine’s acidity level?"
      choices:
        - { text: "The amount and duration of salivation", correct: true }
        - { text: "A drying grip on the gums", correct: false }
        - { text: "Warmth at the back of the throat", correct: false }
        - { text: "The thickness of the wine’s texture", correct: false }
      explanation: |
        Acidity stimulates saliva: the quicker and more persistent the mouth-watering response, the
        higher the perceived acidity. Tannin dries the gums, while alcohol produces warmth.
    fr:
      question: "Quelle sensation constitue l’indicateur le plus fiable du niveau d’acidité d’un vin ?"
      choices:
        - { text: "La quantité et la durée de la salivation", correct: true }
        - { text: "Une sensation asséchante sur les gencives", correct: false }
        - { text: "Une chaleur au fond de la gorge", correct: false }
        - { text: "L’épaisseur de la texture du vin", correct: false }
      explanation: |
        L’acidité stimule la salivation : plus la bouche salive rapidement et longtemps, plus
        l’acidité perçue est élevée. Les tanins assèchent les gencives, tandis que l’alcool procure
        une sensation de chaleur.
  - id: sat-tannin-001
    type: mcq
    deck: SAT
    tags: [sat, tannin]
    status: reviewed
    en:
      question: "Which sensation most directly indicates tannin on the palate?"
      choices:
        - { text: "A drying, astringent grip on the gums", correct: true }
        - { text: "Persistent salivation after swallowing", correct: false }
        - { text: "A warming sensation in the throat", correct: false }
        - { text: "A sweet taste on the tip of the tongue", correct: false }
      explanation: |
        Tannin binds with proteins in saliva, creating dryness and grip that are often easiest to
        feel on the gums. Acidity causes salivation, and alcohol contributes warmth.
    fr:
      question: "Quelle sensation indique le plus directement la présence de tanins en bouche ?"
      choices:
        - { text: "Une sensation asséchante et astringente sur les gencives", correct: true }
        - { text: "Une salivation persistante qui se prolonge après avoir avalé", correct: false }
        - { text: "Une sensation de chaleur dans la gorge", correct: false }
        - { text: "Un goût sucré sur le bout de la langue", correct: false }
      explanation: |
        Les tanins se lient aux protéines de la salive et créent une sensation d’assèchement et
        d’accroche, souvent plus facile à percevoir sur les gencives. L’acidité fait saliver et
        l’alcool apporte de la chaleur.
  - id: sat-climate-001
    type: mcq
    deck: SAT
    tags: [sat, climate]
    status: reviewed
    en:
      question: "Which structural profile most strongly suggests grapes ripened in relatively cool conditions?"
      choices:
        - { text: "High acidity, moderate alcohol and a lighter body", correct: true }
        - { text: "Low acidity, high alcohol and a full body", correct: false }
        - { text: "Moderate acidity, high alcohol and a full body", correct: false }
        - { text: "Low acidity, moderate alcohol and a lighter body", correct: false }
      explanation: |
        Cooler conditions generally slow sugar accumulation and acid loss, so wines often combine
        fresher acidity with less alcohol and body. Variety, yield and winemaking can modify the
        pattern, so it is evidence rather than proof of origin.
    fr:
      question: "Quel profil structurel suggère le plus fortement que les raisins ont mûri dans des conditions relativement fraîches ?"
      choices:
        - { text: "Acidité élevée, alcool modéré et corps plutôt léger", correct: true }
        - { text: "Faible acidité, alcool élevé et corps puissant", correct: false }
        - { text: "Acidité moyenne, alcool élevé et corps puissant", correct: false }
        - { text: "Faible acidité, alcool modéré et corps plutôt léger", correct: false }
      explanation: |
        Des conditions fraîches ralentissent généralement l’accumulation de sucre et la perte
        d’acidité : les vins associent donc souvent une acidité plus vive à moins d’alcool et de
        corps. Le cépage, le rendement et la vinification peuvent modifier ce schéma ; il s’agit
        d’un indice, non d’une preuve d’origine.
  - id: sat-medium-plus-minus-001
    type: mcq
    deck: SAT
    tags: [sat]
    status: reviewed
    source_id: c01-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When medium(−), medium and medium(+) appear on the same WSET Level 3 SAT scale, how should they be used?"
      choices:
        - { text: "As three distinct points between the two ends of that scale", correct: true }
        - { text: "As interchangeable labels for an uncertain middle assessment", correct: false }
        - { text: "As confidence ratings attached to a single medium assessment", correct: false }
        - { text: "As quality levels that replace the scale’s descriptive terms", correct: false }
      explanation: |
        The three medium values provide finer discrimination between the ends of a scale. They are
        separate assessment points, not confidence ratings; the taster chooses the one that best
        fits the wine.
    fr:
      question: "Lorsque medium(−), medium et medium(+) figurent sur une même échelle de l’ASD de niveau 3, comment faut-il les employer ?"
      choices:
        - { text: "Comme trois niveaux distincts entre les deux extrémités de l’échelle", correct: true }
        - { text: "Comme des termes interchangeables pour une évaluation moyenne incertaine", correct: false }
        - { text: "Comme des degrés de confiance associés à une seule évaluation moyenne", correct: false }
        - { text: "Comme des niveaux de qualité remplaçant les termes descriptifs de l’échelle", correct: false }
      explanation: |
        Les trois niveaux intermédiaires permettent de mieux distinguer les vins entre les
        extrémités d’une échelle. Il ne s’agit pas de degrés de confiance : le dégustateur choisit
        le niveau qui correspond le mieux au vin.
  - id: sat-white-colour-001
    type: mcq
    deck: SAT
    tags: [sat, appearance]
    status: reviewed
    source_id: c01-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which procedure gives the most representative assessment of a white wine’s colour?"
      choices:
        - { text: "Tilt the glass over a white surface and view a useful depth of wine", correct: true }
        - { text: "Keep the glass upright over white and judge the deepest central area", correct: false }
        - { text: "Tilt the glass over a dark surface and judge only the thinnest rim", correct: false }
        - { text: "Swirl the glass first and assess the colour against a direct light", correct: false }
      explanation: |
        A white background and a tilted glass make hue and intensity easier to compare. The almost
        colourless outer rim is too shallow to be representative, whereas a useful depth of wine
        shows the colour clearly.
    fr:
      question: "Quelle méthode donne l’évaluation la plus représentative de la couleur d’un vin blanc ?"
      choices:
        - { text: "Incliner le verre sur un fond blanc et observer une épaisseur suffisante de vin", correct: true }
        - { text: "Garder le verre droit sur fond blanc et juger la zone centrale la plus profonde", correct: false }
        - { text: "Incliner le verre sur un fond sombre et juger uniquement le bord le plus fin", correct: false }
        - { text: "Faire d’abord tourner le vin et évaluer sa couleur face à une lumière directe", correct: false }
      explanation: |
        Un fond blanc et un verre incliné facilitent la comparaison de la teinte et de l’intensité.
        Le bord extérieur, presque incolore, est trop mince pour être représentatif ; une épaisseur
        suffisante montre clairement la couleur.
  - id: sat-red-colour-001
    type: mcq
    deck: SAT
    tags: [sat, appearance]
    status: reviewed
    source_id: c01-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is the hue of a deeply coloured red wine usually easier to assess near the rim?"
      choices:
        - { text: "A thinner layer of wine reveals subtle differences in hue", correct: true }
        - { text: "Extra oxygen at the rim immediately changes the wine’s true hue", correct: false }
        - { text: "The white background strengthens pigments only at the glass edge", correct: false }
        - { text: "Tilting the glass concentrates suspended pigments around the rim", correct: false }
      explanation: |
        A dense core can look almost opaque and conceal distinctions such as purple, ruby or garnet.
        Tilting the glass over white creates a thinner band at the edge in which those differences
        remain visible.
    fr:
      question: "Pourquoi la teinte d’un vin rouge profondément coloré est-elle généralement plus facile à évaluer près du bord ?"
      choices:
        - { text: "Une couche de vin plus fine révèle les nuances subtiles de teinte", correct: true }
        - { text: "L’oxygène supplémentaire au bord modifie aussitôt la teinte réelle du vin", correct: false }
        - { text: "Le fond blanc renforce les pigments uniquement sur le pourtour du verre", correct: false }
        - { text: "L’inclinaison du verre concentre les pigments en suspension près du bord", correct: false }
      explanation: |
        Un centre dense peut sembler presque opaque et masquer des nuances comme le pourpre, le
        rubis ou le grenat. Incliner le verre sur fond blanc crée au bord une bande plus fine dans
        laquelle ces différences restent visibles.
