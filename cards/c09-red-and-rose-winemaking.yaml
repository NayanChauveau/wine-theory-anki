# yaml-language-server: $schema=../schema/cards.schema.json
# source: C09 (import/inbox/c09-red-and-rose-winemaking.yaml)
# deck: Red and Rosé Winemaking

cards:
  - id: red-destem-crush-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, grape-processing]
    status: reviewed
    source_id: c09-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On arrival at the winery, how is most fruit for red wine prepared for fermentation?"
      choices:
        - { text: "Kept as whole bunches, stems included", correct: false }
        - { text: "Destemmed and crushed", correct: true }
        - { text: "Pressed at once, with the juice fermented off the skins", correct: false }
        - { text: "Dried on racks for several weeks", correct: false }
      explanation: |
        A destemmer-crusher usually does both jobs in one pass: the stalks are
        knocked out and the berries are split just enough to free the juice,
        so yeast can start work and the skins sit in liquid from day one. The
        crush is kept gentle so the seeds are not broken.

  - id: red-cold-soak-timing-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cold-soak, maceration]
    status: reviewed
    source_id: c09-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At which point in red winemaking does a cold soak (cold maceration) take place?"
      choices:
        - { text: "After fermentation, before pressing", correct: false }
        - { text: "After pressing, before malolactic conversion", correct: false }
        - { text: "After malolactic conversion, before racking", correct: false }
        - { text: "After crushing, before fermentation starts", correct: true }
      explanation: |
        The crushed fruit is held cool for a few days, often with chilling
        jackets or dry ice. In the 1980s the Burgundy consultant Guy Accad
        became famous, and controversial, for pushing very long, very cold
        soaks protected by heavy sulphur additions.

  - id: red-cold-soak-aim-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cold-soak, extraction]
    status: reviewed
    source_id: c09-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is a red winemaker mainly trying to extract with a cold soak?"
      choices:
        - { text: "Firm tannin, with little colour", correct: false }
        - { text: "Seed tannin, before the skins soften", correct: false }
        - { text: "Colour and flavour, with little tannin", correct: true }
        - { text: "Glycerol and body, with little flavour", correct: false }
      explanation: |
        The red pigments (anthocyanins) and many aroma compounds in the skins
        dissolve readily in plain grape juice. The low temperature also slows
        spoilage microbes and wild yeasts, so the fruit can sit on its skins
        safely for several days.

  - id: red-ferment-temp-range-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, fermentation, temperature]
    status: reviewed
    source_id: c09-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Within which temperature band are most red wines fermented?"
      choices:
        - { text: "About 6–12 °C", correct: false }
        - { text: "About 12–22 °C", correct: false }
        - { text: "About 20–32 °C", correct: true }
        - { text: "About 32–40 °C", correct: false }
      explanation: |
        Where a wine sits in that band depends on the style: a light, fruity
        red is often kept towards the cooler end, a deeply coloured,
        structured red towards the warmer end. Fermentation gives off heat,
        so large vats need cooling to stay in range.

  - id: red-ferment-temp-ceiling-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, fermentation, temperature, yeast]
    status: reviewed
    source_id: c09-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Above roughly what temperature does a fermenting red put its yeast at serious risk?"
      choices:
        - { text: "About 28 °C", correct: false }
        - { text: "About 42 °C", correct: false }
        - { text: "About 50 °C", correct: false }
        - { text: "About 35 °C", correct: true }
      explanation: |
        Heat stress on top of rising alcohol can kill or stall the yeast, and
        a stuck ferment leaves sugar for spoilage bacteria that raise volatile
        acidity. Because the yeast itself releases heat, an uncooled vat can
        overshoot on its own.

  - id: red-cap-formation-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, fermentation, cap]
    status: reviewed
    source_id: c09-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do the skins and pulp in a fermenting red vat gather into a floating cap?"
      choices:
        - { text: "Rising alcohol makes the juice denser", correct: false }
        - { text: "Carbon dioxide bubbles carry them up", correct: true }
        - { text: "Yeast cells cling to them and lift them", correct: false }
        - { text: "Warm juice sinks below the cooler skins", correct: false }
      explanation: |
        Gas bubbles catch on the skins and buoy them to the surface, where
        they pack into a thick mat. Alcohol actually makes the liquid
        slightly less dense than juice, not more.

  - id: red-cap-left-floating-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, fermentation, cap, extraction]
    status: reviewed
    source_id: c09-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "If the cap on a fermenting red is never disturbed, what is the main effect on the wine?"
      choices:
        - { text: "Little colour, flavour or tannin is extracted", correct: true }
        - { text: "Deep colour and harsh tannin are extracted", correct: false }
        - { text: "Alcohol ends higher because less sugar is lost", correct: false }
        - { text: "Acidity rises as the skins release malic acid", correct: false }
      explanation: |
        Only the bottom of the mat touches the liquid, so most of the skin
        sits out of reach. The exposed top can also dry out and give acetic
        bacteria a foothold.

  - id: red-cap-management-levers-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, extraction]
    status: reviewed
    source_id: c09-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Once a cap-management technique has been chosen, which two settings let a red winemaker raise or lower extraction with it?"
      choices:
        - { text: "Vat material and lid type", correct: false }
        - { text: "Vat shape and valve position", correct: false }
        - { text: "Plunger size and vat height", correct: false }
        - { text: "Session length and sessions per day", correct: true }
      explanation: |
        A light, early-drinking red might get one short session a day; a
        red built for ageing might get several longer ones at the height of
        fermentation. Tasting the vat daily guides each change.

  - id: red-punchdown-pigeage-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, punching-down]
    status: reviewed
    source_id: c09-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which French cellar term names punching down the cap of a fermenting red?"
      choices:
        - { text: "Remontage", correct: false }
        - { text: "Délestage", correct: false }
        - { text: "Pigeage", correct: true }
        - { text: "Bâtonnage", correct: false }
      explanation: |
        In Burgundy it was traditionally done by treading the vat or by hand
        with wooden paddles on long poles. Remontage and délestage are other
        cap techniques; bâtonnage is stirring lees in a barrel.

  - id: red-punchdown-co2-hazard-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, punching-down, safety]
    status: reviewed
    source_id: c09-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What was the main danger for cellar workers punching down caps by hand over open vats?"
      choices:
        - { text: "Sulphur dioxide fumes", correct: false }
        - { text: "Carbon dioxide poisoning", correct: true }
        - { text: "Ethanol vapour poisoning", correct: false }
        - { text: "Hydrogen sulphide gas", correct: false }
      explanation: |
        The gas is heavier than air, so it pools just above the cap where the
        worker's head is, and can cause collapse without warning. Mechanical
        or pneumatic plungers, plus good ventilation, now do much of this
        work.

  - id: red-punchdown-vs-pumpover-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, punching-down, extraction]
    status: reviewed
    source_id: c09-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with pumping over, what does punching down usually give a fermenting red?"
      choices:
        - { text: "Lower alcohol at the end of fermentation", correct: false }
        - { text: "Paler colour but firmer tannin", correct: false }
        - { text: "Softer tannin from slower extraction", correct: false }
        - { text: "More colour and tannin per session", correct: true }
      explanation: |
        Plunging forces the whole mat of skins under the liquid and breaks it
        up, so fresh skin surfaces meet the juice each time. That intensity
        is why thin-skinned grapes are often plunged and why the number of
        sessions is watched closely.

  - id: red-tannin-late-ferment-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, extraction, tannin]
    status: reviewed
    source_id: c09-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At which stage of a red fermentation does heavy cap work most risk pulling out too much harsh tannin?"
      choices:
        - { text: "In the first hours after crushing", correct: false }
        - { text: "At peak fermentation, when the vat is hottest", correct: false }
        - { text: "Near the end, as the wine nears dryness", correct: true }
        - { text: "While the sugar level is still high", correct: false }
      explanation: |
        Tannin, especially from the seeds, dissolves far more readily once
        alcohol has built up. Many winemakers therefore ease off the cap work
        and cool the vat over the last days of fermentation.

  - id: red-pumpover-method-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, pumping-over]
    status: reviewed
    source_id: c09-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cap technique draws juice from the bottom of the vat and sprays it back over the top while the vat stays full?"
      choices:
        - { text: "Pumping over", correct: true }
        - { text: "Punching down", correct: false }
        - { text: "Rack and return", correct: false }
        - { text: "Rotary fermentation", correct: false }
      explanation: |
        A pump outside the vat lifts the juice from a valve near the base
        through a hose to a spray head or rotating arm, so the whole surface
        of the cap is soaked evenly.

  - id: red-pumpover-benefit-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, pumping-over]
    status: reviewed
    source_id: c09-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Apart from keeping the cap wet, which two jobs does a pump-over do well in a fermenting red?"
      choices:
        - { text: "Settling solids and shielding the must from oxygen", correct: false }
        - { text: "Aerating the must and releasing heat", correct: true }
        - { text: "Extracting seed tannin and raising acidity", correct: false }
        - { text: "Protecting aroma and settling the lees", correct: false }
      explanation: |
        Yeast needs some oxygen to build healthy cell walls early in
        fermentation, and moving warm juice through pipes and air sheds heat.
        The juice can also be routed through a heat exchanger on its way back
        to the top.

  - id: red-rack-return-method-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, rack-and-return]
    status: reviewed
    source_id: c09-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cap technique drains all the fermenting juice into a second vessel, then pumps it back over the skins left behind?"
      choices:
        - { text: "Punching down", correct: false }
        - { text: "Pumping over", correct: false }
        - { text: "Rotary fermentation", correct: false }
        - { text: "Rack and return", correct: true }
      explanation: |
        With the liquid gone, the cap slumps under its own weight and drains.
        When the juice is returned in one go, it floods the whole mass of
        skins at once rather than trickling over the top.

  - id: red-rack-return-frequency-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, rack-and-return, extraction]
    status: reviewed
    source_id: c09-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How often is rack and return usually done during one red fermentation?"
      choices:
        - { text: "Once or twice in total", correct: true }
        - { text: "Two or three times a day", correct: false }
        - { text: "About once a week through the ferment", correct: false }
        - { text: "Once a day until dry", correct: false }
      explanation: |
        Each cycle fully drains and re-soaks the skins, a much bigger
        operation than a pump-over. It also takes a spare tank and pump time,
        so in practice it is used as an occasional boost rather than a daily
        routine.

  - id: red-rack-return-heat-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cap, rack-and-return]
    status: reviewed
    source_id: c09-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides extraction, which practical benefit does rack and return bring to a fermenting red?"
      choices:
        - { text: "It shields the must from oxygen", correct: false }
        - { text: "It raises the must's acidity", correct: false }
        - { text: "It helps the vat shed heat", correct: true }
        - { text: "It settles out grape solids", correct: false }
      explanation: |
        Moving the entire volume of juice out of the vat and back breaks up
        hot spots, and the drained cap cools while it sits exposed. The
        transfer also splashes air into the juice.

  - id: red-rotary-tank-shape-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, rotary-fermentation, vessel]
    status: reviewed
    source_id: c09-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vessel shape is used for rotary fermentation of reds?"
      choices:
        - { text: "A tall, upright cylinder", correct: false }
        - { text: "An egg-shaped concrete vessel", correct: false }
        - { text: "A horizontal cylinder", correct: true }
        - { text: "A wide, conical vat", correct: false }
      explanation: |
        The tank turns on its long axis, driven by a motor. These vessels
        are costly, so they are mostly found in larger wineries that need to
        cut the time each batch spends on skins.

  - id: red-rotary-aim-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, rotary-fermentation, extraction]
    status: reviewed
    source_id: c09-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does turning the tank achieve during a rotary red fermentation?"
      choices:
        - { text: "Gentle aeration with little extraction", correct: false }
        - { text: "Cooling the must without a jacket", correct: false }
        - { text: "Separating the seeds from the skins", correct: false }
        - { text: "Skins kept steadily mixed through the juice", correct: true }
      explanation: |
        Because the skins never form a settled mat, extraction runs quickly
        and evenly, so colour and flavour can be reached in a shorter time on
        skins.

  - id: red-ferment-vessel-open-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, vessel, cap]
    status: reviewed
    source_id: c09-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vessel design suits red fermentations that rely on regular cap work?"
      choices:
        - { text: "Small, sealed stainless-steel tanks", correct: false }
        - { text: "Large, open-topped vats", correct: true }
        - { text: "Pressure-rated closed tanks", correct: false }
        - { text: "Narrow cylinders with a fixed lid", correct: false }
      explanation: |
        Plungers, hoses and workers need easy access to the surface of the
        cap. The vats can be wood, concrete or steel; what matters is the
        wide, reachable top.

  - id: red-barrel-ferment-contact-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, vessel, oak]
    status: reviewed
    source_id: c09-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are ordinary closed barrels rarely used to ferment reds on their skins?"
      choices:
        - { text: "Oak tannin would make the wine too bitter", correct: false }
        - { text: "The staves would split from fermentation heat", correct: false }
        - { text: "Skins and juice are very hard to keep in contact", correct: true }
        - { text: "Small barrels cannot shed fermentation heat", correct: false }
      explanation: |
        The cap jams under the bung-hole, out of reach of plunger or pump;
        large open-topped oak vats, by contrast, are a classic red fermenter.
        A few top estates get round this by removing one head of the barrel
        or by rolling barrels fitted with a door, a method known as
        vinification intégrale.

  - id: red-post-ferment-maceration-aim-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, maceration, tannin]
    status: reviewed
    source_id: c09-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main aim of leaving a red wine on its skins after fermentation has finished?"
      choices:
        - { text: "Preserving fresh fruit aromas", correct: false }
        - { text: "Extracting more tannin", correct: true }
        - { text: "Releasing heat from the vat", correct: false }
        - { text: "Settling out the yeast lees", correct: false }
      explanation: |
        Skins and seeds keep giving up tannin for as long as they sit in the
        wine. The vat is usually sealed and kept full during this phase,
        because the wine is no longer shielded by fermentation gas.

  - id: red-post-ferment-maceration-texture-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, maceration, tannin]
    status: reviewed
    source_id: c09-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What tannin texture do some winemakers seek from a long post-fermentation maceration?"
      choices:
        - { text: "Coarser and more drying", correct: false }
        - { text: "Greener and more bitter", correct: false }
        - { text: "Lighter and barely felt", correct: false }
        - { text: "Smoother and rounder", correct: true }
      explanation: |
        Over weeks on the skins, tannin molecules are thought to bind into
        longer chains that feel less grippy. Traditional Barolo cellars often
        keep Nebbiolo on its skins for a month or more.

  - id: red-free-run-first-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, free-run, pressing]
    status: reviewed
    source_id: c09-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Once a red has finished its time on skins, what is usually the first step?"
      choices:
        - { text: "Draining off the free-run wine", correct: true }
        - { text: "Pressing the full vat contents at once", correct: false }
        - { text: "Racking the wine straight into barrel", correct: false }
        - { text: "Adding a fining agent to the vat", correct: false }
      explanation: |
        The liquid that flows out under its own weight is usually most of
        the volume. Only then is the remaining mass of skins and seeds dug
        out of the vat and sent to the press.

  - id: red-press-wine-term-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pressing]
    status: reviewed
    source_id: c09-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which name is given to the red wine squeezed out of the skin mass after fermentation?"
      choices:
        - { text: "Free-run wine", correct: false }
        - { text: "Second wine", correct: false }
        - { text: "Piquette", correct: false }
        - { text: "Press wine", correct: true }
      explanation: |
        The French call it vin de presse. A second wine is a château's
        second label, and piquette is a light drink made by soaking spent
        pomace in water and fermenting it again.

  - id: red-press-wine-change-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pressing, extraction]
    status: reviewed
    source_id: c09-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "As pressing of red skins goes on and pressure rises, how does the wine coming off the press change?"
      choices:
        - { text: "Paler and softer", correct: false }
        - { text: "Fruitier and less tannic", correct: false }
        - { text: "Deeper in colour and more tannic", correct: true }
        - { text: "Lower in alcohol and paler", correct: false }
      explanation: |
        The first wine out tastes close to the free-run, then more is
        wrung from the skins. Kept apart, the harder pressings become a
        tool at blending time: a little can be added back to lift the
        colour or firm up the tannin of the final wine.

  - id: red-whole-bunch-stem-ripeness-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, whole-bunch, stems]
    status: reviewed
    source_id: c09-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Before fermenting a red with whole bunches, what does the winemaker most need to check?"
      choices:
        - { text: "That the stems are ripe", correct: true }
        - { text: "That the skins are thick", correct: false }
        - { text: "That the sugar level is very high", correct: false }
        - { text: "That the acidity is low", correct: false }
      explanation: |
        Green, sappy stalks release bitter, herbaceous flavours and harsh
        tannin into the wine. Ripe stalks have turned brown and woody
        (lignified), which is why growers often taste and snap them before
        deciding.

  - id: red-intracellular-enzymes-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, whole-bunch, intracellular-fermentation]
    status: reviewed
    source_id: c09-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When intact berries are kept away from oxygen, what makes the first alcohol inside them?"
      choices:
        - { text: "Wild yeasts from the skin bloom", correct: false }
        - { text: "An added cultured yeast", correct: false }
        - { text: "The berry's own enzymes", correct: true }
        - { text: "Lactic acid bacteria", correct: false }
      explanation: |
        Starved of oxygen, the berry's cells switch to an anaerobic
        metabolism that turns some sugar into alcohol and builds new aroma
        compounds. The same process breaks down part of the malic acid, so
        the wine can taste a little softer.

  - id: red-carbonic-co2-flush-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, carbonic-maceration]
    status: reviewed
    source_id: c09-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In full carbonic maceration, how is oxygen removed from around the intact bunches at the start?"
      choices:
        - { text: "A heavy sulphur dioxide dose", correct: false }
        - { text: "Chilling the vat near freezing", correct: false }
        - { text: "Filling the vat with carbon dioxide", correct: true }
        - { text: "Sealing the lid on the full vat", correct: false }
      explanation: |
        Being heavier than air, the gas sinks through the bunches and pushes
        the air up and out of the vat. A sealed lid alone would trap the air
        already caught between the bunches.

  - id: red-carbonic-berry-split-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, carbonic-maceration, intracellular-fermentation]
    status: reviewed
    source_id: c09-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "During full carbonic maceration, at roughly what alcohol level inside the berries do they start to split?"
      choices:
        - { text: "About 5% abv", correct: false }
        - { text: "About 2% abv", correct: true }
        - { text: "About 8% abv", correct: false }
        - { text: "About 11% abv", correct: false }
      explanation: |
        The berry's own metabolism cannot go much further, and its cells
        start to break down and leak juice, which yeast then ferments in
        the ordinary way.

  - id: red-carbonic-structure-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, carbonic-maceration, structure]
    status: reviewed
    source_id: c09-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which colour and tannin profile does full carbonic maceration typically give a red?"
      choices:
        - { text: "Pale colour but firm tannin", correct: false }
        - { text: "Good colour but little tannin", correct: true }
        - { text: "Deep colour and firm tannin", correct: false }
        - { text: "Pale colour and soft tannin", correct: false }
      explanation: |
        Inside the intact berry, pigment leaches from the skin into the
        pulp, but the skins and seeds are never worked against the juice, so
        little tannin comes out. Seed tannin in particular stays locked away.

  - id: red-carbonic-aromas-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, carbonic-maceration, aroma]
    status: reviewed
    source_id: c09-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which set of aromas points most clearly to a red made by carbonic maceration?"
      choices:
        - { text: "Blackcurrant, cedar, mint and graphite", correct: false }
        - { text: "Black pepper, violet, olive and smoked meat", correct: false }
        - { text: "Plum, fig, chocolate and prune", correct: false }
        - { text: "Kirsch, banana, bubblegum and cinnamon", correct: true }
      explanation: |
        These notes are made during fermentation inside the berry, not
        drawn from the grape variety. Esters such as ethyl cinnamate, linked
        to the cinnamon and strawberry note, are found at higher levels in
        carbonic wines.

  - id: red-semi-carbonic-co2-source-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, semi-carbonic-maceration]
    status: reviewed
    source_id: c09-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In semi-carbonic maceration, where does most of the carbon dioxide around the upper, intact bunches come from?"
      choices:
        - { text: "Gas piped in from cylinders before sealing", correct: false }
        - { text: "Yeast fermenting juice released at the bottom", correct: true }
        - { text: "Malolactic bacteria working in the juice", correct: false }
        - { text: "Cultured yeast sprayed over the top bunches", correct: false }
      explanation: |
        The weight of the fruit crushes the lowest bunches, and ambient yeast
        starts on that juice. The gas it gives off rises and blankets the
        intact berries above, which is how much traditional Beaujolais is
        made.

  - id: red-pinot-semi-carbonic-skins-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, semi-carbonic-maceration, pinot-noir]
    status: reviewed
    source_id: c09-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When some premium Pinot Noir starts with a semi-carbonic phase, how does the process usually continue?"
      choices:
        - { text: "The bunches are pressed early and the juice finishes in tank", correct: false }
        - { text: "The bunches stay sealed under carbon dioxide until pressing", correct: false }
        - { text: "Punch-downs break the berries and fermentation finishes on skins", correct: true }
        - { text: "The juice is drained off early and fermented as a separate rosé", correct: false }
      explanation: |
        Each plunge bursts more intact berries, so the carbonic share keeps
        shrinking until every grape is broken and a normal skin fermentation
        takes over. A post-fermentation maceration may follow.

  - id: red-pinot-whole-bunch-aroma-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, semi-carbonic-maceration, pinot-noir, aroma]
    status: reviewed
    source_id: c09-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with a classic carbonic red, what can a partly semi-carbonic start give a premium Pinot Noir?"
      choices:
        - { text: "Riper, jammier dark fruit", correct: false }
        - { text: "A more oxidative, nutty character", correct: false }
        - { text: "Subtle carbonic notes, well integrated", correct: true }
        - { text: "More obvious spice from new oak", correct: false }
      explanation: |
        Because only part of the fermentation happens inside intact berries,
        those aromas stay in the background and knit with the grape's own
        red-fruit and floral character instead of dominating it.

  - id: red-whole-bunch-submerged-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, whole-bunch, intracellular-fermentation]
    status: reviewed
    source_id: c09-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When whole bunches sit among crushed fruit in a red vat, what mainly keeps oxygen away from the intact berries?"
      choices:
        - { text: "They are submerged in the fermenting juice", correct: true }
        - { text: "A thick wax bloom seals each berry", correct: false }
        - { text: "Sulphur dioxide added at the crusher", correct: false }
        - { text: "Chilling the vat close to freezing", correct: false }
      explanation: |
        The juice from the crushed fruit is already fermenting and
        saturated with carbon dioxide, so berries lying in it have no air
        to draw on and some intracellular fermentation can begin.

  - id: red-whole-bunch-share-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, whole-bunch]
    status: reviewed
    source_id: c09-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a red ferment that mixes crushed fruit with whole bunches, how does the winemaker get more carbonic character?"
      choices:
        - { text: "By fermenting the vat warmer", correct: false }
        - { text: "By punching down more often", correct: false }
        - { text: "By raising the share of whole bunches", correct: true }
        - { text: "By lengthening post-fermentation maceration", correct: false }
      explanation: |
        More intact berries means more fruit going through its own
        oxygen-free fermentation inside its skin, so the intracellular
        contribution to the finished blend grows.

  - id: red-whole-bunch-share-effects-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, whole-bunch]
    status: reviewed
    source_id: c09-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with an all-crushed red ferment, which pair of effects is usually credited to including whole bunches among the crushed fruit?"
      choices:
        - { text: "Deeper colour and darker fruit", correct: false }
        - { text: "Higher alcohol and jammier fruit", correct: false }
        - { text: "Silkier texture and brighter fruit", correct: true }
        - { text: "More oak spice and a broader palate", correct: false }
      explanation: |
        Ripe stems can soak up a little pigment and alcohol, so a high whole-bunch share
        tends to give a slightly paler, lighter-feeling wine rather than a darker one.
        Domaine Dujac in Morey-Saint-Denis is a well-known Burgundy example of a
        whole-cluster house.

  - id: red-maturation-oak-decision-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, maturation, oak]
    status: reviewed
    source_id: c09-0052
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Between fermentation and bottling, which choice usually shapes the maturation of a red wine more than any other?"
      choices:
        - { text: "Whether to use oak", correct: true }
        - { text: "Whether to stir the lees", correct: false }
        - { text: "Whether to cold-stabilise", correct: false }
        - { text: "Whether to sterile-filter", correct: false }
      explanation: |
        Once that is settled, the follow-up questions are barrel size, age, toast and
        time in wood. Lees work and cold stabilisation are fine-tuning by comparison
        for most reds.

  - id: red-mlf-near-universal-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, mlf]
    status: reviewed
    source_id: c09-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How widespread is malolactic conversion among red wines?"
      choices:
        - { text: "Usual mainly in cool-climate reds", correct: false }
        - { text: "Limited mostly to premium oaked reds", correct: false }
        - { text: "Common in Burgundy, rare elsewhere", correct: false }
        - { text: "Almost all reds go through it", correct: true }
      explanation: |
        Sharp malic acid sits badly alongside tannin, and leaving it in the wine invites
        bacteria to convert it after bottling, with gas and haze. Many premium reds
        complete the conversion in barrel, which some makers feel helps the oak
        integrate.

  - id: red-lees-ageing-less-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, lees]
    status: reviewed
    source_id: c09-0054
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is long lees ageing a smaller part of red winemaking than of white winemaking?"
      choices:
        - { text: "Red lees settle too slowly to be stirred", correct: false }
        - { text: "Bolder red flavours tend to mask what lees add", correct: true }
        - { text: "Lees tend to strip fruit from red wines", correct: false }
        - { text: "Lees tend to make red wines more tannic", correct: false }
      explanation: |
        The bready, creamy notes that matter in a Muscadet sur lie or a barrel-aged
        Chardonnay are easily lost behind dark fruit, tannin and oak. Some red makers
        still keep their wine on fine lees for texture, but it is rarely the headline.

  - id: red-oak-subtle-integration-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, oak, maturation]
    status: reviewed
    source_id: c09-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A red producer wants oak to stay subtle and well integrated. Which barrel programme fits that aim?"
      choices:
        - { text: "Smaller barrels with a heavier toast", correct: false }
        - { text: "A higher share of new barriques", correct: false }
        - { text: "A switch from French to American oak", correct: false }
        - { text: "Larger casks and a mix of barrel ages", correct: true }
      explanation: |
        A large cask has less wood surface per litre, and a used barrel has already given
        up much of its extractable flavour. Many producers have moved this way after the
        fashion for all-new small barriques on premium reds lost ground.

  - id: red-oak-top-cuvee-regime-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, oak, quality]
    status: reviewed
    source_id: c09-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Within one red producer's range, how does oak treatment usually differ for the top wine compared with the entry-level wine?"
      choices:
        - { text: "Steel only, to keep the fruit pure", correct: false }
        - { text: "Longer in barrel, with more new oak", correct: true }
        - { text: "Oak chips added during fermentation", correct: false }
        - { text: "Concrete vats, to avoid oak flavour", correct: false }
      explanation: |
        Leading Bordeaux estates are a clear case: the grand vin typically sees all or
        most new barriques, while the second wine gets a smaller share of new wood and
        often a shorter stay.

  - id: red-oak-fruit-concentration-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, oak, quality]
    status: reviewed
    source_id: c09-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a red wine destined for a large proportion of new oak need deeply concentrated fruit?"
      choices:
        - { text: "So the wine can finish fermenting in barrel", correct: false }
        - { text: "So it needs less SO₂ while in barrel", correct: false }
        - { text: "So the fruit is not swamped by oak", correct: true }
        - { text: "So it picks up less wood tannin", correct: false }
      explanation: |
        New barrels release vanilla, toast and wood tannin quickly. A dilute wine ends up
        tasting mostly of the barrel; dense fruit can absorb those notes and come out
        layered instead.

  - id: red-blending-purpose-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, blending]
    status: reviewed
    source_id: c09-0059
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When a red winemaker blends separate lots, what is the main purpose?"
      choices:
        - { text: "To balance colour, body, tannin and flavour", correct: true }
        - { text: "To remove the need for fining later", correct: false }
        - { text: "To trigger the malolactic conversion", correct: false }
        - { text: "To prevent tartrate crystals in bottle", correct: false }
      explanation: |
        Each lot brings something the others lack. In the southern Rhône, for example,
        Syrah and Mourvèdre are added to Grenache for colour and backbone.

  - id: red-unfined-unfiltered-reason-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, clarification]
    status: reviewed
    source_id: c09-0063
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do some premium red producers keep fining and filtration to a minimum, or skip them?"
      choices:
        - { text: "To get the wine to market sooner", correct: false }
        - { text: "To keep more dissolved CO₂", correct: false }
        - { text: "To protect structure and flavour", correct: true }
        - { text: "To raise the wine's acidity", correct: false }
      explanation: |
        Fining agents bind tannin and other phenolics as well as haze, and a tight filter
        can hold back some flavour-carrying material. Such wines are often labelled
        "unfined" or "unfiltered", and buyers accept a deposit in older bottles.

  - id: red-clarity-sedimentation-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, clarification, maturation]
    status: reviewed
    source_id: c09-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "An unfiltered premium red is bright at bottling. Which cellar practice most likely got it there?"
      choices:
        - { text: "Regular stirring of the fine lees", correct: false }
        - { text: "Long maturation that lets solids settle", correct: true }
        - { text: "Micro-oxygenation in a sealed tank", correct: false }
        - { text: "Cold stabilisation before bottling", correct: false }
      explanation: |
        Over many months in barrel or vat, yeast cells and other particles slowly drop to
        the bottom. Racking the wine off that deposit, often several times, carries it
        towards brightness.

  - id: red-bulk-climate-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, climate]
    status: reviewed
    source_id: c09-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which growing conditions supply most high-volume, inexpensive red wine?"
      choices:
        - { text: "Hot and humid, with summer rain", correct: false }
        - { text: "Warm and maritime, with autumn rain", correct: false }
        - { text: "Cool and continental, with short summers", correct: false }
        - { text: "Warm and dry, with reliable sun", correct: true }
      explanation: |
        Reliable sun ripens big crops every year, and dry air keeps rot pressure low.
        Irrigation from rivers supplies the water, as in Australia's Riverland on the
        Murray.

  - id: red-bulk-varieties-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, grapes]
    status: reviewed
    source_id: c09-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which group of black grapes is widely used for high-volume, inexpensive reds?"
      choices:
        - { text: "Shiraz, Merlot and Grenache", correct: true }
        - { text: "Nebbiolo, Mencía and Cabernet Franc", correct: false }
        - { text: "Aglianico, Tannat and Xinomavro", correct: false }
        - { text: "Blaufränkisch, Nebbiolo and Sagrantino", correct: false }
      explanation: |
        All three crop generously and ripen reliably, and Cabernet Sauvignon joins them
        in many blends. Varietal names such as these also sell well on a supermarket
        shelf.

  - id: red-bulk-skin-colour-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, yield]
    status: reviewed
    source_id: c09-0067
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At high yields, what lets some black grapes still give fruity, adequately coloured wine?"
      choices:
        - { text: "Large berries with plenty of juice", correct: false }
        - { text: "Colour and flavour packed in the skins", correct: true }
        - { text: "Thin skins that release colour quickly", correct: false }
        - { text: "Late budding that escapes spring frost", correct: false }
      explanation: |
        Anthocyanins and many aroma compounds sit in the skin, not the pulp. A variety
        rich in them can lose some concentration to a big crop and still deliver a
        sound, deep-enough red.

  - id: red-bulk-varietal-blur-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, yield]
    status: reviewed
    source_id: c09-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When black grapes are cropped very heavily for inexpensive wine, what tends to happen to the differences between varieties?"
      choices:
        - { text: "They become more pronounced", correct: false }
        - { text: "They stay as clear as at low yields", correct: false }
        - { text: "They fade, so wines taste alike", correct: true }
        - { text: "They shift towards jammier, riper fruit", correct: false }
      explanation: |
        Aromas end up less intense and less complex, and the markers that separate one
        grape from another are the first to go. Blending across regions and varieties
        evens the result out further.

  - id: red-bulk-pinot-noir-rare-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, pinot-noir]
    status: reviewed
    source_id: c09-0069
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is Pinot Noir seldom chosen for high-volume, inexpensive red wine?"
      choices:
        - { text: "It ripens too late for most bulk regions", correct: false }
        - { text: "Its skins give harsh, excess tannin", correct: false }
        - { text: "Its natural acidity is far too low", correct: false }
        - { text: "It gives pale, thin wine at high yields", correct: true }
      explanation: |
        It is also a fussy vine to grow, so cheap Pinot Noir usually costs more to make
        than other entry-level reds, and it is often priced a step above them on the
        shelf.

  - id: red-bulk-style-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, style]
    status: reviewed
    source_id: c09-0071
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style are most high-volume, inexpensive reds made to?"
      choices:
        - { text: "Fruity, with soft and low tannin", correct: true }
        - { text: "Firm-tannined and built to cellar", correct: false }
        - { text: "Savoury, earthy and led by oak", correct: false }
        - { text: "Lean, high in acid and herbaceous", correct: false }
      explanation: |
        These wines are meant to be drunk soon after release, often without food.
        Some labels name the style rather than the grape, with words such as
        "Smooth Red" or "Fruity Red".

  - id: red-bulk-acidification-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, adjustment]
    status: reviewed
    source_id: c09-0074
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which must adjustment is most often needed for high-volume, inexpensive reds?"
      choices:
        - { text: "Chaptalisation with sucrose", correct: false }
        - { text: "Deacidification with chalk", correct: false }
        - { text: "Acidification with tartaric acid", correct: true }
        - { text: "Enrichment with concentrated must", correct: false }
      explanation: |
        Grapes picked at full ripeness from big crops often arrive with low acidity and
        high pH, which dulls the fruit and leaves the wine easier prey for spoilage
        microbes. Tartaric acid is used because it is the grape's own main acid and
        is rarely broken down by microbes.

  - id: red-bulk-cold-soak-skip-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, maceration]
    status: reviewed
    source_id: c09-0075
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a winery making large volumes of inexpensive red skip a pre-fermentation cold soak?"
      choices:
        - { text: "It extracts too much harsh seed tannin", correct: false }
        - { text: "It ties up tanks for too long", correct: true }
        - { text: "It raises the risk of a stuck fermentation", correct: false }
        - { text: "It strips colour from the skins", correct: false }
      explanation: |
        At harvest a large cellar needs each fermenter emptied and refilled quickly,
        and chilling big volumes of must also costs refrigeration capacity. The step
        is easier to justify for small premium batches.

  - id: red-bulk-ferment-temp-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, fermentation, temperature]
    status: reviewed
    source_id: c09-0077
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At roughly what temperature are high-volume, inexpensive reds commonly fermented?"
      choices:
        - { text: "About 26–30 °C", correct: false }
        - { text: "About 15–18 °C", correct: false }
        - { text: "About 30–34 °C", correct: false }
        - { text: "About 22–25 °C", correct: true }
      explanation: |
        The band is warm enough for steady colour extraction in a short ferment, yet cool
        enough to hold on to volatile aroma compounds. Exact settings vary by winery and
        grape.

  - id: red-bulk-cap-management-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, cap-management]
    status: reviewed
    source_id: c09-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How intensively is the cap usually worked when fermenting a high-volume, inexpensive red?"
      choices:
        - { text: "Fairly lightly for most of the ferment", correct: true }
        - { text: "Heavily, for deep colour and grip", correct: false }
        - { text: "Lightly at first, then hard at the end", correct: false }
        - { text: "Heavily throughout, then a long soak", correct: false }
      explanation: |
        A short ferment with modest pumping over gives enough colour for these wines.
        Frequent hard punch-downs cost labour and time that a high-throughput cellar
        tries to save.

  - id: red-bulk-structure-portion-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, blending, maceration]
    status: reviewed
    source_id: c09-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How might a maker of inexpensive red add a little more structure to the final blend?"
      choices:
        - { text: "Rack the wine off its gross lees earlier", correct: false }
        - { text: "Leave the cap floating undisturbed", correct: false }
        - { text: "Blend back a small, long-macerated lot", correct: true }
        - { text: "Cool the ferment sharply from the start", correct: false }
      explanation: |
        Most of the batch stays on a short, gentle regime. A small lot left longer on its
        skins becomes a firmer component that the blender can add in measured doses
        until the target is reached.

  - id: red-bulk-barrel-regime-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, oak]
    status: reviewed
    source_id: c09-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When an inexpensive red does go into barrel, which regime is typical?"
      choices:
        - { text: "Two years in new French barriques", correct: false }
        - { text: "A few months in used barrels", correct: true }
        - { text: "A year in new American oak barrels", correct: false }
        - { text: "Several years in large old casks", correct: false }
      explanation: |
        Second- or third-fill barrels cost little per bottle and give gentle oxygen to round the tannins
        with only a light wood flavour. A short stay keeps the wine moving towards
        release.

  - id: red-bulk-so2-bottling-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, bulk, so2, bottling]
    status: reviewed
    source_id: c09-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "An inexpensive red is meant to be drunk within months. What normally happens to its SO₂ level just before bottling?"
      choices:
        - { text: "It is left to fall, since the wine is drunk young", correct: false }
        - { text: "It is replaced by sorbate as the preservative", correct: false }
        - { text: "It is stripped out during the final filtration", correct: false }
        - { text: "It is topped up against oxidation", correct: true }
      explanation: |
        Free SO₂ is used up as it binds during maturation and handling. Even a short
        shelf life includes warm warehouses and time on a shop shelf, where an
        unprotected wine can turn flat and brown.

  - id: red-cabernet-thick-skin-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, grapes]
    status: reviewed
    source_id: c09-0087
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which berry trait gives Cabernet Sauvignon its deep colour and firm tannin?"
      choices:
        - { text: "Thick skins", correct: true }
        - { text: "Large, juicy berries", correct: false }
        - { text: "Thin, delicate skins", correct: false }
        - { text: "Loose, open bunches", correct: false }
      explanation: |
        Its berries are also small, so skin makes up a large share of each grape. The
        same tough skin helps the bunches resist rot through a long autumn hang time.

  - id: red-cabernet-underripe-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, ripeness]
    status: reviewed
    source_id: c09-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the typical result when Cabernet Sauvignon fails to ripen fully?"
      choices:
        - { text: "Jammy fruit and low acidity", correct: false }
        - { text: "Raisined fruit and high alcohol", correct: false }
        - { text: "Herbaceous notes and astringent tannin", correct: true }
        - { text: "Pale colour and very soft tannin", correct: false }
      explanation: |
        The green-pepper smell comes mainly from methoxypyrazines, especially IBMP, which
        break down in sunlight as the grapes ripen. Seed and skin tannins also stay hard
        when ripening stalls.

  - id: red-cabernet-merlot-role-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, merlot, blending]
    status: reviewed
    source_id: c09-0092
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a Cabernet Sauvignon-led blend, what does Merlot mainly contribute?"
      choices:
        - { text: "Extra colour and a spicy grip", correct: false }
        - { text: "Juicy plum fruit and a smoother feel", correct: true }
        - { text: "Floral lift and fresh red fruit", correct: false }
        - { text: "Higher acidity and firmer tannin", correct: false }
      explanation: |
        Merlot's fleshier fruit softens Cabernet's grip without hiding the
        blackcurrant. The pairing is the backbone of many New World
        "Bordeaux blends" as well as the Médoc.

  - id: red-cabernet-europe-partners-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, blending, europe]
    status: reviewed
    source_id: c09-0095
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Outside France, which two local European grapes are classic blending partners for Cabernet Sauvignon?"
      choices:
        - { text: "Nebbiolo and Mencía", correct: false }
        - { text: "Corvina and Graciano", correct: false }
        - { text: "Aglianico and Listán Negro", correct: false }
        - { text: "Sangiovese and Tempranillo", correct: true }
      explanation: |
        In Italy, Carmignano has long required some Cabernet alongside Sangiovese, and
        Tignanello made the pairing famous in the 1970s. Penedès and Navarra are known
        for Tempranillo–Cabernet blends.

  - id: red-cabernet-australia-regions-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, australia]
    status: reviewed
    source_id: c09-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of Australian regions has the strongest name for Cabernet Sauvignon?"
      choices:
        - { text: "Coonawarra and Margaret River", correct: true }
        - { text: "Hunter Valley and Rutherglen", correct: false }
        - { text: "Clare Valley and Eden Valley", correct: false }
        - { text: "Riverland and Riverina", correct: false }
      explanation: |
        Coonawarra's strip of red terra rossa over limestone gives minty blackcurrant
        reds, while Margaret River's Indian Ocean breezes give a more Bordeaux-like
        balance. Hunter is better known for Semillon and Shiraz, Rutherglen for
        fortified Muscat, Clare and Eden for Riesling, and the Riverland and Riverina for
        bulk wine.

  - id: red-cabernet-nz-region-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, new-zealand]
    status: reviewed
    source_id: c09-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which New Zealand region is best known for Cabernet Sauvignon-based reds?"
      choices:
        - { text: "Central Otago", correct: false }
        - { text: "Gisborne", correct: false }
        - { text: "Hawke's Bay", correct: true }
        - { text: "Marlborough", correct: false }
      explanation: |
        Its warm, free-draining Gimblett Gravels sites help late-ripening Bordeaux grapes
        get there in a cool country. Merlot is now more widely planted there and often leads
        the blend.

  - id: red-cabernet-south-africa-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, south-africa]
    status: reviewed
    source_id: c09-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which South African district has the strongest name for Cabernet Sauvignon?"
      choices:
        - { text: "Swartland", correct: false }
        - { text: "Stellenbosch", correct: true }
        - { text: "Elgin", correct: false }
        - { text: "Walker Bay", correct: false }
      explanation: |
        Mountain slopes such as the Simonsberg and Helderberg, plus cooling air from
        False Bay, suit long-ripening Cabernet. Elgin and Walker Bay are cooler maritime
        districts; Swartland is best known for Chenin Blanc and Rhône varieties.

  - id: red-cabernet-chile-valleys-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, chile]
    status: reviewed
    source_id: c09-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of Chilean valleys is best known for Cabernet Sauvignon?"
      choices:
        - { text: "Casablanca and San Antonio", correct: false }
        - { text: "Elqui and Limarí", correct: false }
        - { text: "Bío-Bío and Itata", correct: false }
        - { text: "Maipo and Colchagua", correct: true }
      explanation: |
        Puente Alto in Alto Maipo, on the Andes foothills, and Apalta in Colchagua are
        both famous Cabernet addresses. Casablanca and San Antonio are cool coastal
        valleys too chilly for Cabernet to ripen reliably; Elqui and Limarí sit far
        north, Bío-Bío and Itata far south.

  - id: red-cabernet-ferment-temp-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, fermentation, temperature]
    status: reviewed
    source_id: c09-0100
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Within which temperature band is Cabernet Sauvignon typically fermented?"
      choices:
        - { text: "About 22–25 °C", correct: false }
        - { text: "About 26–30 °C", correct: true }
        - { text: "About 17–20 °C", correct: false }
        - { text: "About 14–17 °C", correct: false }
      explanation: |
        That is hot enough to pull plenty of colour and tannin from the skins, yet cool
        enough to keep fresh blackcurrant fruit. Some makers push briefly higher near
        the peak of fermentation.

  - id: red-cabernet-unripe-tannin-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, extraction]
    status: reviewed
    source_id: c09-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A Cabernet Sauvignon crop arrives with ripe sugar but seeds and skins not fully ripe. Which fermentation approach suits it best?"
      choices:
        - { text: "A cooler ferment with gentle cap management", correct: true }
        - { text: "A hotter ferment with frequent punch-downs", correct: false }
        - { text: "Adding the stems back into the vat", correct: false }
        - { text: "Pressing hard and blending in all the press wine", correct: false }
      explanation: |
        Cabernet already carries plenty of tannin. When that tannin is green, heat and vigorous
        cap work pull out more of its bitter fraction, so winemakers ease off both rather than
        chase extra structure.

  - id: red-cabernet-new-oak-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, oak]
    status: reviewed
    source_id: c09-0103
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which trait lets premium Cabernet Sauvignon carry a high proportion of new oak?"
      choices:
        - { text: "Its light body and low tannin", correct: false }
        - { text: "Its high acidity and lean fruit", correct: false }
        - { text: "Its intense fruit and firm tannin", correct: true }
        - { text: "Its neutral, subdued aromas", correct: false }
      explanation: |
        Concentrated blackcurrant fruit and a medium to full frame absorb toast and vanilla
        without being masked. Château Mouton Rothschild, for example, routinely puts its grand
        vin into all-new barrels.

  - id: red-cabernet-oak-vessel-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, oak]
    status: reviewed
    source_id: c09-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which maturation vessel is most widely used for premium Cabernet Sauvignon?"
      choices:
        - { text: "Large, old Slavonian oak botti", correct: false }
        - { text: "French oak barriques", correct: true }
        - { text: "Large old foudres", correct: false }
        - { text: "Concrete tanks", correct: false }
      explanation: |
        Tight-grained oak from central French forests such as Tronçais and Bertranges (Nevers)
        gives subtle spice and cedar. Large Slavonian botti belong mainly to the Nebbiolo and
        Sangiovese traditions of Italy.

  - id: red-cabernet-oak-time-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, oak]
    status: reviewed
    source_id: c09-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How long does premium Cabernet Sauvignon typically spend in oak?"
      choices:
        - { text: "About 3 to 6 months", correct: false }
        - { text: "About 30 to 36 months", correct: false }
        - { text: "About 4 to 5 years", correct: false }
        - { text: "About 12 to 18 months", correct: true }
      explanation: |
        Shorter and much longer stays both exist, but a year to a year and a half is the common
        middle ground: long enough to soften tannin and pick up oak spice without drying the
        fruit.

  - id: red-cabernet-blend-reason-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, blending]
    status: reviewed
    source_id: c09-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which traits of Cabernet Sauvignon often lead winemakers to blend it rather than bottle it alone?"
      choices:
        - { text: "Firm tannin and excessive alcohol", correct: false }
        - { text: "Firm tannin and low acidity", correct: false }
        - { text: "Firm tannin and a lean mid-palate", correct: true }
        - { text: "Pale colour and a lack of fruit", correct: false }
      explanation: |
        Tasters sometimes call young Cabernet doughnut-shaped: fruit on the attack, a firm
        finish, and a gap in between. A fleshier partner fills that hole.

  - id: red-cabernet-australia-partner-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, cabernet-sauvignon, blending, australia]
    status: reviewed
    source_id: c09-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Australia, which grape often takes Merlot's usual place as Cabernet Sauvignon's blending partner?"
      choices:
        - { text: "Grenache", correct: false }
        - { text: "Mataro", correct: false }
        - { text: "Shiraz", correct: true }
        - { text: "Petit Verdot", correct: false }
      explanation: |
        The Cabernet–Shiraz blend is an Australian classic. Penfolds Bin 389, nicknamed "Poor
        Man's Grange", has been made this way since the 1960s.

  - id: red-merlot-international-harvest-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, merlot, viticulture]
    status: reviewed
    source_id: c09-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "For the \"international\" style of Merlot, when do growers usually pick?"
      choices:
        - { text: "As late as they safely can", correct: true }
        - { text: "Slightly early, to keep acidity", correct: false }
        - { text: "As soon as sugar meets the legal minimum", correct: false }
        - { text: "On the same day as their Cabernet Sauvignon", correct: false }
      explanation: |
        Extra hang time lowers acidity and builds sugar, colour and riper fruit. The trade-off
        is higher alcohol and a risk of losing freshness.

  - id: red-merlot-international-where-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, merlot, style]
    status: reviewed
    source_id: c09-0112
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Outside the New World, where is the riper, \"international\" style of Merlot commonly made?"
      choices:
        - { text: "Friuli and the Alto Adige valleys", correct: false }
        - { text: "Southern France and parts of Bordeaux", correct: true }
        - { text: "Trentino and the Veneto plains", correct: false }
        - { text: "Switzerland's Valais and Vaud", correct: false }
      explanation: |
        Languedoc varietal Merlot is usually picked ripe and plush. On the Right Bank, several
        châteaux moved to riper picking and lavish new oak from the 1990s, a shift often linked
        to the consultant Michel Rolland.

  - id: red-merlot-traditional-profile-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, merlot, style]
    status: reviewed
    source_id: c09-0113
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits the more restrained, traditional style of Merlot?"
      choices:
        - { text: "Medium body, fresher acidity, red fruit, a leafy hint", correct: true }
        - { text: "Full body, low acidity, jammy black fruit, sweet oak", correct: false }
        - { text: "Light body, very high acidity, sour cherry, no oak", correct: false }
        - { text: "Deep purple, full body, plum and velvety tannin", correct: false }
      explanation: |
        Picking before the fruit turns plummy keeps acidity and red-fruit freshness. In cooler
        years the leafy, vegetal edge becomes more noticeable.

  - id: red-merlot-traditional-home-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, merlot, style]
    status: reviewed
    source_id: c09-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which region remains the main home of the classic, traditional style of Merlot?"
      choices:
        - { text: "Languedoc", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Bolgheri", correct: false }
        - { text: "Napa Valley", correct: false }
      explanation: |
        Elsewhere the style is uncommon, because warmer sites and most export markets favour
        riper fruit. Bolgheri's Masseto, a pure Merlot, shows how lavish the Tuscan coast can
        make it.

  - id: red-merlot-extraction-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, merlot, extraction]
    status: reviewed
    source_id: c09-0115
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does Merlot usually need less vigorous extraction during fermentation than Cabernet Sauvignon?"
      choices:
        - { text: "Its suppler skins release colour and tannin readily", correct: true }
        - { text: "Its must ferments faster and runs much hotter", correct: false }
        - { text: "Its juice carries more acidity, which aids extraction", correct: false }
        - { text: "It is mostly fermented as whole, uncrushed bunches", correct: false }
      explanation: |
        Merlot gives up colour and tannin with less work. Heavy punch-downs on soft skins risk
        coarse, drying tannin rather than more fruit.

  - id: red-pinot-clones-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, viticulture]
    status: reviewed
    source_id: c09-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does Pinot Noir exist in an unusually large number of clones?"
      choices:
        - { text: "It is a recent crossing whose traits are still settling", correct: false }
        - { text: "Each appellation must register its own clone", correct: false }
        - { text: "It is a very old variety with time to mutate", correct: true }
        - { text: "Grafting onto rootstocks alters its genes", correct: false }
      explanation: |
        Every vegetative generation can carry a spontaneous mutation, and nurseries have
        selected many. The Dijon clones such as 115, 667 and 777 are planted from Burgundy to
        Oregon; Pinot Gris and Pinot Blanc are colour mutations of the same vine.

  - id: red-pinot-overwork-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, extraction]
    status: reviewed
    source_id: c09-0120
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is most at risk when Pinot Noir is extracted too hard?"
      choices:
        - { text: "Its fresh natural acidity", correct: false }
        - { text: "Its bright ruby colour", correct: false }
        - { text: "Its moderate alcohol level", correct: false }
        - { text: "Its primary fruit aromas", correct: true }
      explanation: |
        Excess heat and cap work pull out bitter seed tannin and cooked notes that bury the
        perfume the variety is prized for.

  - id: red-pinot-extraction-need-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, extraction]
    status: reviewed
    source_id: c09-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does Pinot Noir push winemakers to work harder for extraction than many black grapes do?"
      choices:
        - { text: "Its thin skins yield little colour and tannin", correct: true }
        - { text: "Its high acidity blocks colour extraction", correct: false }
        - { text: "Its high sugar slows the fermentation", correct: false }
        - { text: "Its pigments break down above 20 °C", correct: false }
      explanation: |
        Pinot Noir also lacks acylated anthocyanins, the more stable pigments most black grapes
        carry, so even ripe examples are relatively pale.

  - id: red-pinot-climate-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, climate]
    status: reviewed
    source_id: c09-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does Pinot Noir usually give its best wines?"
      choices:
        - { text: "Moderate to warm climates", correct: false }
        - { text: "Warm to hot climates", correct: false }
        - { text: "Cool to moderate climates", correct: true }
        - { text: "Hot, dry Mediterranean climates", correct: false }
      explanation: |
        It buds and ripens early, so a cool site lets it hang long enough to build aroma while
        keeping its acidity.

  - id: red-burgundy-regional-style-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, burgundy, style]
    status: reviewed
    source_id: c09-0123
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits a typical entry-level red Burgundy?"
      choices:
        - { text: "Medium body, soft acidity and sweet vanilla oak", correct: false }
        - { text: "Light body, marked acidity, a subtle touch of oak", correct: true }
        - { text: "Deep colour, firm tannin and no oak at all", correct: false }
        - { text: "Full body, high alcohol and ripe, jammy fruit", correct: false }
      explanation: |
        Oak at this level is there for a little structure rather than flavour. Most of these
        wines are meant to be drunk within a few years of the vintage.

  - id: red-burgundy-chambolle-style-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, burgundy, style]
    status: reviewed
    source_id: c09-0124
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Côte d'Or village is known for perfumed, delicate reds rather than sturdy ones?"
      choices:
        - { text: "Pommard", correct: false }
        - { text: "Chambolle-Musigny", correct: true }
        - { text: "Aloxe-Corton", correct: false }
        - { text: "Nuits-Saint-Georges", correct: false }
      explanation: |
        Reds from the better Côte d'Or sites gain intensity and complexity over entry-level
        Burgundy, but their character ranges widely. Chambolle sits at the floral, silky end;
        Pommard is the classic example of the sturdier, more tannic end.

  - id: red-pinot-cool-year-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, climate, faults]
    status: reviewed
    source_id: c09-0125
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aromas warn that Pinot Noir from a cool year has not ripened fully?"
      choices:
        - { text: "Cabbage and wet leaves", correct: true }
        - { text: "Dried fig and prune", correct: false }
        - { text: "Liquorice and black olive", correct: false }
        - { text: "Coffee and mocha", correct: false }
      explanation: |
        Underripe Pinot can also taste tart and thin. Site choice, especially well-exposed
        slopes, is the grower's main defence.

  - id: red-pinot-central-otago-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, new-zealand]
    status: reviewed
    source_id: c09-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which New Zealand Pinot Noir region has the most continental climate, with hot days and cold nights?"
      choices:
        - { text: "Marlborough", correct: false }
        - { text: "Martinborough", correct: false }
        - { text: "Central Otago", correct: true }
        - { text: "Nelson", correct: false }
      explanation: |
        Central Otago lies inland in the South Island, far from the moderating sea. Marlborough
        and Martinborough, the other leading Pinot Noir names, are more maritime.

  - id: red-pinot-mornington-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, australia]
    status: reviewed
    source_id: c09-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Victorian region, almost surrounded by sea, has a strong name for Pinot Noir?"
      choices:
        - { text: "Yarra Valley", correct: false }
        - { text: "Heathcote", correct: false }
        - { text: "Mornington Peninsula", correct: true }
        - { text: "Grampians", correct: false }
      explanation: |
        Water on three sides keeps the season cool and slow. The Yarra Valley and Tasmania are
        the other names most associated with Australian Pinot Noir.

  - id: red-pinot-south-africa-chile-001
    type: mcq
    deck: Red and Rosé Winemaking
