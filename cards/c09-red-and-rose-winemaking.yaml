      sources: [known-fact]
    en:
      question: "A Pinot Noir producer combines several lots of Pinot before bottling. How do those lots usually differ?"
      choices:
        - { text: "By vintage, to smooth out variation", correct: false }
        - { text: "By plot or cellar treatment", correct: true }
        - { text: "By appellation tier, grand cru with village", correct: false }
        - { text: "By ageing, adding old reserve wine", correct: false }
      explanation: |
        Separate parcels, barrels or whole-bunch shares give the blender building blocks, used
        to build complexity or keep a consistent house style. A Côte d'Or domaine may vinify
        each plot of a village wine apart before assembling it.

  - id: red-pinot-aged-notes-001
