    en:
      question: "Which pair gives one leading Pinot Noir area in South Africa and one in Chile?"
      choices:
        - { text: "Stellenbosch and Colchagua Valley", correct: false }
        - { text: "Paarl and Maipo Valley", correct: false }
        - { text: "Swartland and Cachapoal Valley", correct: false }
        - { text: "Walker Bay and Casablanca Valley", correct: true }
      explanation: |
        Walker Bay includes the Hemel-en-Aarde wards near Hermanus, cooled by the Atlantic.
        Casablanca owes its freshness to the cold Humboldt Current and morning fog.

  - id: red-pinot-hot-climate-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, climate]
    status: reviewed
    source_id: c09-0128
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A Pinot Noir vineyard is planted in a hot inland valley. Which flavour fault becomes likely?"
      choices:
        - { text: "Coarse, drying tannin", correct: false }
        - { text: "Peppery, herbal notes", correct: false }
        - { text: "Jammy, cooked fruit", correct: true }
        - { text: "Reductive, struck-match notes", correct: false }
      explanation: |
        Heat drives sugar ahead of aroma development while acidity falls, so cooked, stewed
        fruit replaces the fresh perfume.

  - id: red-pinot-pre-ferment-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, extraction]
    status: reviewed
    source_id: c09-0130
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which extraction practice do many Burgundy producers use on Pinot Noir?"
      choices:
        - { text: "Long post-fermentation maceration", correct: false }
        - { text: "A cold soak", correct: true }
        - { text: "Rack and return", correct: false }
        - { text: "Rotary fermentation", correct: false }
      explanation: |
        A few days of cool maceration before the yeast takes hold is common in the Côte d'Or.
        The late Henri Jayer of Vosne-Romanée is often credited with popularising it.

  - id: red-pinot-ferment-temp-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, fermentation]
    status: reviewed
    source_id: c09-0133
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A Burgundy domaine is fermenting Pinot Noir for a long-lived premium cuvée. Roughly what peak temperature is common?"
      choices:
        - { text: "About 20 °C", correct: false }
        - { text: "About 25 °C", correct: false }
        - { text: "About 30–32 °C", correct: true }
        - { text: "About 36–38 °C", correct: false }
      explanation: |
        Many Burgundian domaines start cool, then let the temperature climb naturally as
        fermentation peaks, so extraction happens near the top of the curve.

  - id: red-pinot-cooler-ferment-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, fermentation]
    status: reviewed
    source_id: c09-0135
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A producer wants an early-drinking, fruit-forward Pinot Noir. How is fermentation temperature usually set?"
      choices:
        - { text: "Hotter than for its premium cuvée", correct: false }
        - { text: "Cooler than for its premium cuvée", correct: true }
        - { text: "The same as for its premium cuvée", correct: false }
        - { text: "As hot as the yeast will tolerate", correct: false }
      explanation: |
        Lower temperatures hold on to fruity esters and limit tannin pick-up, which suits wines
        meant to be enjoyed young.

  - id: red-pinot-post-ferment-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, extraction]
    status: reviewed
    source_id: c09-0136
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "After alcoholic fermentation, how long is premium Pinot Noir usually left on its skins?"
      choices:
        - { text: "Two to four weeks more", correct: false }
        - { text: "Until malolactic conversion ends", correct: false }
        - { text: "Little or no extra time", correct: true }
        - { text: "Several months, to build tannin", correct: false }
      explanation: |
        With modest tannin and colour to gain from the skins, extra time adds little and can
        dull the fruit.

  - id: red-pinot-older-barrels-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, red, pinot-noir, oak]
    status: reviewed
    source_id: c09-0137
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which trait of Pinot Noir leads producers to favour older barrels with only a modest share of new oak?"
      choices:
        - { text: "Its high natural tannin", correct: false }
        - { text: "Its deep, stable colour", correct: false }
        - { text: "Its delicate, perfumed fruit", correct: true }
        - { text: "Its naturally low acidity", correct: false }
      explanation: |
        Premium examples commonly spend roughly 12 to 24 months in barrel. A high new-oak share
        is mostly reserved for the most concentrated wines, such as some grand cru Burgundies.

  - id: red-pinot-varietal-001
    type: mcq
