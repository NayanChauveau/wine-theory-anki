      sources: [known-fact]
    en:
      question: "Which notes can the finest Pinot Noirs develop after years in bottle?"
      choices:
        - { text: "Tar and dried roses", correct: false }
        - { text: "Cedar and cigar box", correct: false }
        - { text: "Black pepper and smoked meat", correct: false }
        - { text: "Forest floor and mushroom", correct: true }
      explanation: |
        Bottle age softens tannin and turns primary red fruit savoury. Mature Côte de Nuits
        grands crus such as Chambertin are classic examples.

  - id: rose-oak-use-001
    type: mcq
