    en:
      question: "How is most still red Pinot Noir bottled?"
      choices:
        - { text: "Blended with Gamay", correct: false }
        - { text: "Blended with Syrah", correct: false }
        - { text: "Blended with Merlot", correct: false }
        - { text: "As a single variety", correct: true }
      explanation: |
        Exceptions exist: Bourgogne Passe-Tout-Grains, for instance, combines Pinot Noir with
        Gamay.

  - id: red-pinot-lot-blending-001
    type: mcq
