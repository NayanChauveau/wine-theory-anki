      choices:
        - { text: "Fermented whole under CO₂, then pressed", correct: false }
        - { text: "Pressed promptly, as for a white wine", correct: true }
        - { text: "Partly dried on racks, then pressed", correct: false }
        - { text: "Fermented as a red, then fined to strip colour", correct: false }
      explanation: |
        Any black variety can be used; Grenache and Cinsault are common choices in southern
        France.

  - id: rose-direct-press-colour-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, rose, pressing, style]
    status: reviewed
    source_id: c09-0145
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which rosé production method usually gives the palest colour?"
      choices:
        - { text: "Short maceration", correct: false }
        - { text: "Saignée", correct: false }
        - { text: "Direct pressing", correct: true }
        - { text: "Blending red and white wine", correct: false }
      explanation: |
        Juice and skins meet only for the length of the press cycle, often a couple of hours,
        rather than for a planned soak.

  - id: rose-direct-press-tannin-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, rose, pressing]
    status: reviewed
    source_id: c09-0146
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When black grapes are direct-pressed for rosé, which unwanted extraction must the press cycle limit?"
      choices:
        - { text: "Tannin", correct: true }
        - { text: "Malic acid", correct: false }
        - { text: "Yeast nutrients", correct: false }
        - { text: "Aroma compounds", correct: false }
      explanation: |
        Hard pressing breaks skins and seeds and releases bitter phenolics that a pale, delicate
        rosé cannot hide, so producers keep pressures low.

  - id: rose-blending-eu-001
    type: mcq
    deck: Red and Rosé Winemaking
    tags: [winemaking, rose, blending, law]
    status: reviewed
    source_id: c09-0148
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Within the EU, which wine is the best-known case where rosé may be made by blending red and white wine?"
      choices:
        - { text: "Provence rosé", correct: false }
        - { text: "Tavel", correct: false }
        - { text: "Rosé d'Anjou", correct: false }
        - { text: "Rosé Champagne", correct: true }
      explanation: |
        For still rosé, EU rules do not allow blending red and white wine; the exceptions
        concern sparkling wine. Champagne houses typically add a little still red Pinot Noir
        from villages such as Bouzy.
