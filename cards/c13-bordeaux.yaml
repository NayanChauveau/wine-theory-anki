# yaml-language-server: $schema=../schema/cards.schema.json
# source: C13 (import/inbox/c13-bordeaux.yaml)
# deck: France::Bordeaux
# Original reviewed samples (not from the source extract).

cards:
  - id: bordeaux-left-bank-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    en:
      question: Which grape typically dominates Left Bank Bordeaux blends (Médoc and Graves)?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        The gravel soils of the **Médoc and Graves** favour **Cabernet Sauvignon**, which usually leads
        the blend. Merlot is the main grape on the clay-limestone Right Bank
        (Saint-Émilion, Pomerol).
    fr:
      question: Quel cépage domine généralement les assemblages de rive gauche (Médoc et Graves) ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        Les graves du **Médoc et des Graves** conviennent au **Cabernet Sauvignon**, qui mène
        souvent l’assemblage. Le Merlot domine la rive droite argilo-calcaire
        (Saint-Émilion, Pomerol).

  - id: bordeaux-right-bank-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    en:
      question: Which pair of appellations is on the Right Bank and typically Merlot-led?
      choices:
        - { text: "Pauillac and Margaux", correct: false }
        - { text: "Pessac-Léognan and Sauternes", correct: false }
        - { text: "Saint-Émilion and Pomerol", correct: true }
        - { text: "Entre-Deux-Mers and Graves", correct: false }
      explanation: |
        **Saint-Émilion** and **Pomerol** sit on the Right Bank (Libournais). Merlot dominates because
        the cooler clay and limestone soils ripen it more reliably than Cabernet Sauvignon.
        Pauillac and Margaux are Left Bank Médoc communes.
    fr:
      question: Quel couple d’appellations se trouve sur la rive droite et est généralement mené par le Merlot ?
      choices:
        - { text: "Pauillac et Margaux", correct: false }
        - { text: "Pessac-Léognan et Sauternes", correct: false }
        - { text: "Saint-Émilion et Pomerol", correct: true }
        - { text: "Entre-Deux-Mers et Graves", correct: false }
      explanation: |
        **Saint-Émilion** et **Pomerol** sont sur la rive droite (Libournais). Le Merlot y domine
        car les sols plus froids d’argile et de calcaire le mûrissent plus sûrement que le
        Cabernet Sauvignon. Pauillac et Margaux sont des communes du Médoc, rive gauche.

  - id: bordeaux-largest-aoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which French AOC vineyard ships the most wine?
      choices:
        - { text: "Chablis", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Sancerre", correct: false }
        - { text: "Bandol", correct: false }
      explanation: |
        **Bordeaux** is the giant by **volume** (and planted area) among French
        AOCs. **Champagne** usually beats it on export **value**. A large IGP
        such as Pays d’Oc can also move huge hectolitres — that is not an AOC.

  - id: bordeaux-climate-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How should you label the Gironde’s climate?
      choices:
        - { text: "Hot continental", correct: false }
        - { text: "Moderate maritime", correct: true }
        - { text: "Cool alpine", correct: false }
        - { text: "Tropical monsoon", correct: false }
      explanation: |
        The **Atlantic** keeps winters mild and summers moderate. That is
        **maritime**, not a landlocked continental swing.

  - id: bordeaux-gulf-stream-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gulf Stream do for Bordeaux’s growing season?
      choices:
        - { text: "It shortens it to June only", correct: false }
        - { text: "It lengthens it", correct: true }
        - { text: "It stops all rain", correct: false }
        - { text: "It freezes the Gironde each May", correct: false }
      explanation: |
        Warm ocean water arriving from the Caribbean **stretches** the season
        so late varieties can still finish.

  - id: bordeaux-october-ripen-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Into which month can Cabernet still be hanging in a slow Bordeaux year?
      choices:
        - { text: "They are always picked in July", correct: false }
        - { text: "Into October", correct: true }
        - { text: "Never after 14 July", correct: false }
        - { text: "Only in January under ice", correct: false }
      explanation: |
        Cabernet Sauvignon in particular can hang **into October**. That is
        why autumn rain is a vintage-maker.

  - id: bordeaux-frost-rare-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gulf Stream mainly spare the Gironde from in an average year?
      choices:
        - { text: "All rain after June", correct: false }
        - { text: "Widespread spring frost", correct: true }
        - { text: "Any need for drainage", correct: false }
        - { text: "Vintage variation", correct: false }
      explanation: |
        Mild Atlantic air makes **widespread spring frost** less common than
        in Chablis or Champagne. It is not a guarantee: **2017** and **2021**
        still froze large parts of the vineyard.

  - id: bordeaux-atlantic-rain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does sitting next to the Atlantic do to Bordeaux weather?
      choices:
        - { text: "It makes the vineyard bone-dry", correct: false }
        - { text: "It brings a lot of rain and humidity", correct: true }
        - { text: "It creates a polar winter every year", correct: false }
        - { text: "It stops clouds from forming", correct: false }
      explanation: |
        **Wet air and frequent rain** are the maritime tax. Humidity also
        feeds rot.

  - id: bordeaux-landes-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two landforms sit between the ocean and the Médoc vines?
      choices:
        - { text: "The Alps", correct: false }
        - { text: "The Landes forest and the coastal sand dunes", correct: true }
        - { text: "A glass roof over the Médoc", correct: false }
        - { text: "The Massif Central alone", correct: false }
      explanation: |
        The **Landes** pine belt and the **dunes** sit between the ocean and
        the vines. They do not stop rain; they knock the edge off the wind.

  - id: bordeaux-rain-risks-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can that frequent rain spoil a Bordeaux vintage?
      choices:
        - { text: "It only deepens colour", correct: false }
        - { text: "It can wreck flowering and fruit set, feed rot, and water down flavours at pick", correct: true }
        - { text: "Rain is illegal in the Gironde", correct: false }
        - { text: "It always raises alcohol", correct: false }
      explanation: |
        Three separate hits: **coulure / millerandage** at flower, **rot** in
        a wet summer, **dilution** if it pours at harvest.

  - id: bordeaux-vintage-rain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do Bordeaux vintages swing so much?
      choices:
        - { text: "Because every château must pick on the same Monday", correct: false }
        - { text: "Because rain can undo flowering, health or harvest concentration", correct: true }
        - { text: "Because the region has no rivers", correct: false }
        - { text: "Because frost happens every week", correct: false }
      explanation: |
        The **rain lottery** is the main reason 2013 and 2018 do not taste
        like twins. Heat spikes matter too; water is the classic exam lever.

  - id: bordeaux-sorting-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do ambitious châteaux dampen that vintage swing?
      choices:
        - { text: "By bottling every berry they grow", correct: false }
        - { text: "By throwing out diseased and unripe fruit", correct: true }
        - { text: "By irrigating with seawater", correct: false }
        - { text: "By picking in March", correct: false }
      explanation: |
        **Table sorting** (and optical sorters at the top addresses) keep
        green and rotten berries out of the grand vin. Second wines absorb
        the rest.

  - id: bordeaux-canopy-health-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After berry sorting, what vineyard change most improved average ripeness and health?
      choices:
        - { text: "A legal ban on all canopy work", correct: false }
        - { text: "Smarter canopy work and more targeted spray programmes", correct: true }
        - { text: "Planting only under glass", correct: false }
        - { text: "Picking two months earlier than in 1970", correct: false }
      explanation: |
        Open canopies dry the fruit and ripen it. Growers still spray — they
        just **spray less blindly**. Do not read that as “Bordeaux went
        spray-free”.

  - id: bordeaux-blended-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are almost all red Bordeaux, and most of the whites, made?
      choices:
        - { text: "As single-variety wines by law", correct: false }
        - { text: "As blends", correct: true }
        - { text: "Only as sparkling wine", correct: false }
        - { text: "Only from dried grapes", correct: false }
      explanation: |
        **Assemblage** is the house style. A 100% Merlot Pomerol exists, but
        it is the exception, not the rule the chapter teaches.

  - id: bordeaux-blend-why-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why blend in Bordeaux at all?
      choices:
        - { text: "EU law forbids naming a grape", correct: false }
        - { text: "The weather is too unreliable to bet the crop on one variety", correct: true }
        - { text: "Merlot is illegal on the Left Bank", correct: false }
        - { text: "Blending raises the legal alcohol by 3%", correct: false }
      explanation: |
        A cold wet week can wreck **one** flowering. A second variety that
        flowers later still has a crop.

  - id: bordeaux-staggered-ripen-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does that mix of varieties actually work?
      choices:
        - { text: "They all flower and ripen on the same morning", correct: false }
        - { text: "They flower and ripen on different clocks, so one bad week rarely kills the whole harvest", correct: true }
        - { text: "Only one variety is legal", correct: false }
        - { text: "Rain cannot fall after 1 June", correct: false }
      explanation: |
        **Merlot** flowers and ripens first; **Cabernet Sauvignon** last.
        A May storm or an October downpour usually hits one, not both.

  - id: bordeaux-varieties-count-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many grape varieties did the Bordeaux AOC list allow before the 2021 additions?
      choices:
        - { text: "Two, and only Cabernet", correct: false }
        - { text: "Thirteen", correct: true }
        - { text: "One hundred, including Riesling", correct: false }
        - { text: "None — only apple is legal", correct: false }
      explanation: |
        The historic set is **thirteen**. In **2021** INAO added Touriga
        Nacional, Marselan, Castets, Arinarnoa, Alvarinho and Liliorila to
        Bordeaux / Bordeaux Supérieur — not to every communal AOC.

  - id: bordeaux-five-main-count-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many varieties actually run the region?
      choices:
        - { text: "All thirteen equally", correct: false }
        - { text: "Three black and two white — five in daily use", correct: true }
        - { text: "Only Carmenère", correct: false }
        - { text: "Twenty-four official clones of Chardonnay", correct: false }
      explanation: |
        **Cabernet Sauvignon, Merlot, Cabernet Franc** plus **Sémillon** and
        **Sauvignon Blanc**. Petit Verdot, Malbec, Carmenère and Muscadelle
        are seasoning.

  - id: bordeaux-five-named-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which five grapes do most Bordeaux wines actually rely on?
      choices:
        - { text: "Pinot Noir, Gamay, Syrah, Viognier, Riesling", correct: false }
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Sémillon, Sauvignon Blanc", correct: true }
        - { text: "Chardonnay, Pinot Gris, Gewurztraminer, Muscat, Silvaner", correct: false }
        - { text: "Tempranillo, Garnacha, Graciano, Mazuelo, Viura", correct: false }
      explanation: |
        The Left Bank leans **Cabernet Sauvignon**; the Right Bank **Merlot**.
        **Cabernet Franc** is the common seasoning. Dry and sweet whites are
        **Sémillon** and **Sauvignon Blanc**.

  - id: bordeaux-cs-haut-medoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does Cabernet Sauvignon most clearly lead the blend?
      choices:
        - { text: "Pomerol’s clay plateau", correct: false }
        - { text: "The Haut-Médoc", correct: true }
        - { text: "Sauternes only", correct: false }
        - { text: "The high Alps", correct: false }
      explanation: |
        Warm **gravel in the Haut-Médoc** communes (Margaux through
        Saint-Estèphe) is Cabernet country. Pomerol is Merlot’s home.

  - id: bordeaux-cs-also-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where else is Cabernet Sauvignon a serious part of the mix?
      choices:
        - { text: "Only in Chablis grand cru", correct: false }
        - { text: "The Médoc AOC (old Bas-Médoc) and Graves", correct: true }
        - { text: "Only in Tokaj", correct: false }
        - { text: "Only in Champagne AOC", correct: false }
      explanation: |
        **Graves / Pessac-Léognan** gravel also ripens Cabernet. The cooler
        **Médoc AOC** (north of Saint-Estèphe, once called Bas-Médoc) still
        plants it, but Merlot often takes a bigger share there — do not say
        it “dominates” the way it does in Pauillac.

  - id: bordeaux-cs-gravel-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can Cabernet Sauvignon ripen reliably only on those Left Bank sites?
      choices:
        - { text: "The soil is solid ice", correct: false }
        - { text: "High gravel and stone content warms the vineyard and drains it", correct: true }
        - { text: "The law forbids Cabernet on gravel", correct: false }
        - { text: "Those sites sit above 2 000 m", correct: false }
      explanation: |
        **Graves** (the stones) store heat and shed water. Cabernet needs
        both. Cool clay on the Right Bank leaves it green in many years;
        Merlot is the safer bet there.

  - id: bordeaux-cs-share-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In Haut-Médoc and Graves, how high can Cabernet Sauvignon’s share of a blend go?
      choices:
        - { text: "It is illegal above 10%", correct: false }
        - { text: "Around three-quarters in a ripe year", correct: true }
        - { text: "Always 100% by AOC law", correct: false }
        - { text: "Cabernet is banned on the Left Bank", correct: false }
      explanation: |
        **About 75%** is a typical Left Bank ceiling in a good Cabernet year,
        not a legal cap. Some classed growths go higher; many sit nearer
        60–70% with Merlot filling the rest.

  - id: bordeaux-cf-where-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Right Bank AOC is Cabernet Franc’s main Bordeaux address?
      choices:
        - { text: "Only on the dunes of the Landes", correct: false }
        - { text: "Saint-Émilion", correct: true }
        - { text: "Only in Sauternes", correct: false }
        - { text: "Only north of the Loire", correct: false }
      explanation: |
        **Saint-Émilion** is Franc’s home (Cheval Blanc, Ausone). It is a
        seasoning grape on the Left Bank, not the lead.

  - id: bordeaux-cf-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Compared with Cabernet Sauvignon, what does ripe Cabernet Franc usually bring to the blend?
      choices:
        - { text: "Heavier body and more tannin", correct: false }
        - { text: "Less body and tannin, plus floral fruit", correct: true }
        - { text: "It only makes sweet wine", correct: false }
        - { text: "It has no aroma at all", correct: false }
      explanation: |
        Franc is the **perfume and lift**, not the tannic spine. If it is
        picked too early it goes stalky — same green trap as Cabernet
        Sauvignon, just on an earlier clock.

  - id: bordeaux-cf-soil-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can Cabernet Franc ripen on Saint-Émilion limestone where Cabernet Sauvignon often fails?
      choices:
        - { text: "Limestone is hotter than Médoc gravel", correct: false }
        - { text: "It ripens earlier, so cooler drained limestone is still enough", correct: true }
        - { text: "It only ripens on permafrost", correct: false }
        - { text: "AOC law bans Franc on any stone", correct: false }
      explanation: |
        Limestone is **drained but cooler** than Left Bank gravel. Franc’s
        **shorter cycle** finishes there; Cabernet Sauvignon often stays
        green. Warm gravel still suits Franc — it is not a cold-climate grape.

  - id: bordeaux-merlot-most-planted-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which black grape occupies more Bordeaux hectares than any other?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Carmenère", correct: false }
        - { text: "Muscadelle", correct: false }
      explanation: |
        **Merlot** is more than half the vineyard. It ripens earlier, so it
        is the safer plant on clay and in generic Bordeaux AOC.

  - id: bordeaux-merlot-premium-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In which two AOCs is Merlot the lead grape of the top reds?
      choices:
        - { text: "Only in Sauternes", correct: false }
        - { text: "Saint-Émilion and Pomerol", correct: true }
        - { text: "Only in Chablis", correct: false }
        - { text: "Only in the far north of the Médoc AOC", correct: false }
      explanation: |
        **Pétrus** and **Le Pin** are Merlot houses. **Cheval Blanc** is
        Franc-led; **Ausone** is a Merlot–Franc pair — so not every Right
        Bank icon is a Merlot monologue. Left Bank first growths remain
        Cabernet houses.

  - id: bordeaux-merlot-clay-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why plant Merlot rather than Cabernet Sauvignon on Saint-Émilion and Pomerol clay?
      choices:
        - { text: "Cabernet is illegal east of the Dordogne", correct: false }
        - { text: "Merlot can ripen on those cooler clay soils; Cabernet Sauvignon often stays green", correct: true }
        - { text: "Clay is too hot for Merlot", correct: false }
        - { text: "Merlot needs 2 000 m of altitude", correct: false }
      explanation: |
        Clay stays **cold and wet**. Merlot’s earlier cycle finishes; Cabernet
        Sauvignon’s does not, except on warmer gravel pockets (Figeac).

  - id: bordeaux-merlot-volume-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape fills most inexpensive, high-volume Bordeaux rouge?
      choices:
        - { text: "Petit Verdot, because it is the cheapest to farm", correct: false }
        - { text: "Merlot, because it ripens earlier and tastes softer", correct: true }
        - { text: "Riesling, because it is native to the Gironde", correct: false }
        - { text: "Only Carmenère", correct: false }
      explanation: |
        **Merlot** gives earlier sugar, lower tannin, and a crop on clay —
        useful for Bordeaux AOC sold in the first year. Softness is the
        tasting reason; reliability is the economic one.

  - id: bordeaux-pv-hot-years-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Bordeaux grape used to ripen fully only in the hottest summers?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Petit Verdot", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Muscadelle", correct: false }
      explanation: |
        **Petit Verdot** is late. In cooler decades it was a 1–3% spice jar.
        Warmer vintages now ripen it more often — do not say it *never*
        ripens today.

  - id: bordeaux-pv-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What structure does ripe Petit Verdot usually add?
      choices:
        - { text: "Pale colour and almost no tannin", correct: false }
        - { text: "Deep colour, firm tannin, and a slow ageing curve", correct: true }
        - { text: "Sparkling pressure only", correct: false }
        - { text: "Noble-rot sweetness", correct: false }
      explanation: |
        **Ink and structure** — a seasoning grape. **Château Palmer** has
        used a visible share; most Left Bank blends keep it to a few percent.

  - id: bordeaux-pv-role-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a splash of Petit Verdot add to a Left Bank blend?
      choices:
        - { text: "Only residual sugar", correct: false }
        - { text: "Colour, tannin and a spicy note", correct: true }
        - { text: "A legal right to the word Champagne", correct: false }
        - { text: "Nothing — it is used only for white wine", correct: false }
      explanation: |
        **Colour, tannin, spice** (violet / liquorice). Palmer and a few
        others have used more than a dash; most keep it tiny.

  - id: bordeaux-vessels-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Is there one agreed fermenter for Bordeaux red?
      choices:
        - { text: "Only Roman amphorae, by AOC law", correct: false }
        - { text: "No — estates use wood, stainless steel or concrete as they like", correct: true }
        - { text: "Only plastic bags", correct: false }
        - { text: "Only open-top Pinot vats, never oak", correct: false }
      explanation: |
        Stainless, wood and **concrete eggs / tanks** all appear. The region
        does not agree on one “best” fermenter.

  - id: bordeaux-blend-spring-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When do most châteaux assemble the grand vin?
      choices:
        - { text: "In the vineyard, before harvest", correct: false }
        - { text: "In the spring after the vintage", correct: true }
        - { text: "Twenty years after bottling only", correct: false }
        - { text: "On the day the flowers open", correct: false }
      explanation: |
        After malolactic and a first look at the lots: typically **March–
        June**. En primeur week sits on that early blend.

  - id: bordeaux-blend-late-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do some châteaux do instead of blending that first spring?
      choices:
        - { text: "They must blend before alcoholic fermentation", correct: false }
        - { text: "They keep parcels apart until the end of élevage", correct: true }
        - { text: "They are forbidden to blend at all", correct: false }
        - { text: "They bottle each berry separately", correct: false }
      explanation: |
        Late assemblage lets each lot finish barrel time on its own. Still
        a blend at the end — just not the March snapshot.

  - id: bordeaux-second-wine-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What happens to lots that miss the grand vin at a leading château?
      choices:
        - { text: "They must be distilled into Cognac on site", correct: false }
        - { text: "They become a second (sometimes third) wine, or are sold on to a négociant", correct: true }
        - { text: "They must be poured down the drain by law", correct: false }
        - { text: "They are relabelled as Sauternes", correct: false }
      explanation: |
        **Carruades de Lafite, Forts de Latour, Pagodes de Cos** — the
        named second wines. Surplus or lesser lots can also go to a
        **négociant** blend.

  - id: bordeaux-barrique-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is top-end red Bordeaux usually aged?
      choices:
        - { text: "Only in 10 000 L foudres, never small oak", correct: false }
        - { text: "In 225-litre barriques, a share of them new", correct: true }
        - { text: "Only in bottle, with no barrel time", correct: false }
        - { text: "Only in stainless steel for twenty years", correct: false }
      explanation: |
        The **Bordeaux barrique is 225 L**. First growths may use a very
        high share of **new** oak; many serious wines sit nearer 30–60%.
        Not every château is 100% new.

  - id: bordeaux-generic-no-oak-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How much barrel oak does generic Bordeaux AOC usually see?
      choices:
        - { text: "Three years in 100% new barriques", correct: false }
        - { text: "Little or none", correct: true }
        - { text: "A legal minimum of 24 months in new oak", correct: false }
        - { text: "Only acacia, never oak", correct: false }
      explanation: |
        Steel or concrete, then bottle. Chips or staves exist at the cheap
        end; **barrique ageing** is not the generic model.

  - id: bordeaux-semillon-sweet-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape leads Bordeaux’s sweet wines?
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Sémillon", correct: true }
        - { text: "Pinot Gris", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        **Sémillon** thins its skins and takes noble rot. Sauvignon Blanc
        is the acid partner, not the volume lead, in Sauternes and Barsac.

  - id: bordeaux-pl-blend-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Beside Sémillon, which grape builds the dry whites of Pessac-Léognan and Graves?
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Viognier", correct: false }
      explanation: |
        **Sauvignon Blanc** for lift and aroma; Sémillon for weight. Haut-
        Brion Blanc and the Pessac dry whites sit on that pair.

  - id: bordeaux-semillon-body-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Sémillon add to those dry Graves / Pessac-Léognan blends?
      choices:
        - { text: "Only red colour", correct: false }
        - { text: "Body", correct: true }
        - { text: "A legal ban on oak", correct: false }
        - { text: "Sparkling pressure", correct: false }
      explanation: |
        **Body** and a waxy texture. Sauvignon Blanc is the high-acid,
        high-aroma half.

  - id: bordeaux-sb-aroma-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fruit character do Sauvignon Blanc–led dry Bordeaux whites usually show?
      choices:
        - { text: "Overt banana and coconut only", correct: false }
        - { text: "Citrus and green fruit", correct: true }
        - { text: "Red cherry and tar", correct: false }
        - { text: "Oxidation and curry leaf only", correct: false }
      explanation: |
        **Grapefruit, lemon, gooseberry / apple** — cooler and less punchy
        than Marlborough, especially once Sémillon and oak join in.

  - id: bordeaux-sb-varietal-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Bordeaux wines are most often bottled as a single variety?
      choices:
        - { text: "Every red must be 100% Cabernet by law", correct: false }
        - { text: "Some dry whites made only from Sauvignon Blanc", correct: true }
        - { text: "Only Petit Verdot rosé", correct: false }
        - { text: "Only Muscadelle reds", correct: false }
      explanation: |
        **Entre-Deux-Mers** and generic dry whites can be straight Sauvignon
        Blanc. That is the usual exception to the blend rule — not the only
        one: some Pomerols are near-100% Merlot (Pétrus).


