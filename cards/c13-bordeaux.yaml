        - { text: "To classify only the Right Bank", correct: false }
        - { text: "To classify only the dry whites", correct: false }
      explanation: |
        Brokers ranked châteaux by **then-current prices**. Haut-Brion
        (Graves) was slipped into the Médoc red list; Sauternes had its own
        ladder.
    fr:
      question: Pourquoi le classement de 1855 a-t-il été dressé ?
      choices:
        - { text: "Pour remplacer les AOC communales", correct: false }
        - { text: "Pour l’Exposition universelle de Paris", correct: true }
        - { text: "Pour classer seulement la rive droite", correct: false }
        - { text: "Pour classer seulement les blancs secs", correct: false }
      explanation: |
        La chambre de commerce a listé les grands rouges du Médoc et les
        Sauternes. Les courtiers ont classé les châteaux selon les
        **prix d’alors**. Haut-Brion (Graves) a été glissé dans la liste
        des rouges du Médoc ; Sauternes avait son propre étage.

