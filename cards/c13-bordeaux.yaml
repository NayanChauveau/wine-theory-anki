  - id: bordeaux-class-estates-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a Bordeaux classification rank, unlike Burgundy’s crus?
      choices:
        - { text: "The individual vineyard plot", correct: false }
        - { text: "The estate (château), whatever its plots", correct: true }
        - { text: "The commune as a whole", correct: false }
        - { text: "The négociant brand that sells the wine", correct: false }
      explanation: |
        **Château Palmer** can buy or sell plots and the name still sits in
        1855. Burgundy ranks **climats**. That is why Bordeaux classed
        growths are brands as much as terroirs.
    fr:
      question: Que classe un classement bordelais, contrairement aux crus bourguignons ?
      choices:
        - { text: "La parcelle de vigne", correct: false }
        - { text: "La propriété (le château), quelles que soient ses parcelles", correct: true }
        - { text: "La commune dans son ensemble", correct: false }
        - { text: "La marque du négociant qui vend le vin", correct: false }
      explanation: |
        **Château Palmer** peut acheter ou vendre des parcelles : le nom reste dans le
        classement de 1855. La Bourgogne classe des **climats**. Voilà pourquoi les crus
        classés bordelais sont autant des marques que des terroirs.

  - id: bordeaux-1855-why-001
