        - { text: "Merlot-led reds in a similar, usually lighter register", correct: true }
        - { text: "Only Sauternes-style noble rot", correct: false }
        - { text: "Only pale Provence rosé", correct: false }
      explanation: |
        **Lussac, Montagne, Puisseguin, Saint-Georges** (the satellites)
        plus Fronsac and the Côtes: same grapes, less fame, often less
        concentration.
    fr:
      question: À quoi goûtent d’habitude les AOC qui ceignent Saint-Émilion et Pomerol ?
      choices:
        - { text: "Toujours 100 % Riesling", correct: false }
        - { text: "Des rouges menés par le Merlot, dans un registre voisin, souvent plus léger", correct: true }
        - { text: "Seulement de la pourriture noble façon Sauternes", correct: false }
        - { text: "Seulement du rosé pâle de Provence", correct: false }
      explanation: |
        Des **rouges menés par le Merlot, dans un registre voisin, souvent plus léger**.
        **Lussac, Montagne, Puisseguin, Saint-Georges** (les satellites)
        plus Fronsac et les Côtes : mêmes cépages, moins de renom,
        souvent moins de concentration.

  - id: bordeaux-cotes-name-001
