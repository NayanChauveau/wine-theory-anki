        - { text: "Merlot", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Petit Verdot", correct: false }
      explanation: |
        **Merlot** on clay and limestone. Cabernet Sauvignon is the
        exception (Figeac’s gravel), not the rule.
    fr:
      question: Sur les sols argileux de Saint-Émilion et de Pomerol, quel cépage mène généralement l’assemblage ?
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Petit Verdot", correct: false }
      explanation: |
        Le **Merlot** sur argile et calcaire. Le Cabernet Sauvignon est
        l’exception (les graves de Figeac), pas la règle.

  - id: bordeaux-rb-franc-001
    type: mcq
