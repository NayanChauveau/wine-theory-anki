      question: Comment les rouges des Graves du sud se comparent-ils d’habitude à Pessac-Léognan ?
      choices:
        - { text: "Toujours plus concentrés et 100 % Cabernet", correct: false }
        - { text: "Même famille, mais plus légers, plus simples, et souvent plus de Merlot", correct: true }
        - { text: "Ils sont seulement blancs et effervescents", correct: false }
        - { text: "Ils doivent s’étiqueter Pomerol", correct: false }
      explanation: |
        **Même famille, mais plus légers, plus simples, et souvent plus de Merlot**.
        **Pessac-Léognan** a pris les meilleures graves du nord en 1987.
