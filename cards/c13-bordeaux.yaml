        - { text: "Only botrytis-sweet white", correct: false }
        - { text: "Only sparkling Clairet", correct: false }
      explanation: |
        **Drink-now Merlot**. “Value” is a shop slogan, not a tasting
        score — the useful contrast is price and weight versus Pomerol.
    fr:
      question: Quel est le rouge habituel des Côtes de Bordeaux ?
      choices:
