    en:
      question: What extra requirements does Bordeaux Supérieur set compared with basic Bordeaux?
      choices:
        - { text: "A higher share of Cabernet Sauvignon", correct: false }
        - { text: "Lower yields and a higher minimum alcohol", correct: true }
        - { text: "Hand harvesting and estate bottling", correct: false }
        - { text: "At least two years in oak barrels", correct: false }
      explanation: |
        **Lower yields, longer élevage, higher min. ABV**. It is still a
        regional AOC, not a communal cru.
    fr:
      question: Quelles exigences supplémentaires pose Bordeaux Supérieur par rapport au Bordeaux de base ?
      choices:
        - { text: "Une part plus forte de Cabernet Sauvignon", correct: false }
        - { text: "Des rendements plus bas et un degré minimal plus élevé", correct: true }
        - { text: "Vendange manuelle et mise en bouteille à la propriété", correct: false }
        - { text: "Au moins deux ans d’élevage en fût", correct: false }
      explanation: |
        Les règles imposent notamment des **rendements plus bas**, un
        **élevage plus long** et un **degré minimal plus élevé**. Cela
        reste une AOC régionale, pas un cru communal.

  - id: bordeaux-white-rose-labels-001
