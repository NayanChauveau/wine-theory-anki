  - id: bordeaux-sweet-botrytis-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fungus makes the great sweet wines of Sauternes and Barsac possible?
      choices:
        - { text: "Only grey rot that always ruins the crop", correct: false }
        - { text: "Noble rot (Botrytis cinerea) on ripe grapes", correct: true }
        - { text: "Phylloxera on the leaves only", correct: false }
        - { text: "Truffle mycelium in the bottle", correct: false }
      explanation: |
        **Botrytis** punches the skins, concentrates sugar and adds honey /
        saffron. Cheaper sweet Bordeaux may just be late-picked without
        noble rot.
    fr:
      question: Quel champignon rend possibles les grands liquoreux de Sauternes et de Barsac ?
      choices:
        - { text: "Seulement la pourriture grise, qui ruine toujours la récolte", correct: false }
        - { text: "La pourriture noble (Botrytis cinerea) sur raisins mûrs", correct: true }
        - { text: "Le phylloxéra sur les seules feuilles", correct: false }
        - { text: "Un mycélium de truffe dans la bouteille", correct: false }
      explanation: |
        La **botrytis** perce les peaux, concentre le sucre et ajoute miel /
        safran. Un liquoreux bordelais moins cher peut n’être que vendangé
        tard, sans pourriture noble.

  - id: bordeaux-sweet-oak-001
