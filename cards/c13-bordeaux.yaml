      sources: [known-fact]
    en:
      question: How often is the Saint-Émilion classification meant to be reopened?
      choices:
        - { text: "Never — it is frozen like 1855", correct: false }
        - { text: "About once a decade", correct: true }
        - { text: "Every year", correct: false }
        - { text: "Every five years", correct: false }
      explanation: |
        The rule is **at least every ten years**. In 2022 the review ran
        late, and several châteaux sued or withdrew. It is not frozen
        like 1855.
    fr:
      question: À quelle fréquence le classement de Saint-Émilion est-il censé être rouvert ?
      choices:
        - { text: "Jamais — il est figé comme 1855", correct: false }
        - { text: "Environ une fois par décennie", correct: true }
        - { text: "Tous les ans", correct: false }
        - { text: "Tous les cinq ans", correct: false }
      explanation: |
        La règle, c’est **au moins tous les dix ans**. En 2022, la
        révision a pris du retard, et plusieurs châteaux ont fait un
        procès ou se sont retirés. Ce n’est pas figé comme 1855.

  - id: bordeaux-generic-aocs-001
