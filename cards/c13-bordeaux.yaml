        - { text: "On the warm gravel plateau north-west of the town", correct: true }
        - { text: "Only in the Médoc AOC", correct: false }
        - { text: "Under the city of Bordeaux", correct: false }
      explanation: |
        The **north-west plateau** is the Graves-like pocket. Merlot is
        still planted; **Cabernet Franc and some Cabernet Sauvignon** can
        ripen here. Franc also ripens on Ausone’s limestone côte — it does
        not “fail” there.
    fr:
      question: Où se tiennent Cheval Blanc et Figeac à l’intérieur de Saint-Émilion ?
      choices:
        - { text: "Sur les barres de Sauternes", correct: false }
        - { text: "Sur le plateau de graves chaudes au nord-ouest de la ville", correct: true }
        - { text: "Seulement dans l’AOC Médoc", correct: false }
        - { text: "Sous la ville de Bordeaux", correct: false }
      explanation: |
        Le **plateau du nord-ouest** est la poche façon Graves. On y
        plante encore du Merlot ; **Cabernet Franc et un peu de
        Cabernet Sauvignon** peuvent y mûrir. Le Franc mûrit aussi sur
        la côte calcaire d’Ausone — il n’y « échoue » pas.

  - id: bordeaux-st-em-cote-001
    type: mcq
