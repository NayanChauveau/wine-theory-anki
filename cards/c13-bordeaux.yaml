        **Acidité et élan**. Le Sémillon apporte le corps ; le Sauvignon
        Blanc empêche l’assemblage de devenir mou.

  - id: bordeaux-sb-sweet-acid-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why keep Sauvignon Blanc in a Sauternes or Barsac blend?
      choices:
        - { text: "It is the only legal grape", correct: false }
        - { text: "It supplies the acidity Sémillon loses", correct: true }
        - { text: "It brings the body", correct: false }
        - { text: "It is the volume grape of Sauternes", correct: false }
      explanation: |
        Botrytised Sémillon is rich and low-acid. A slice of **Sauvignon
        Blanc** keeps **Yquem** (and most Barsac/Sauternes blends) from
        tasting like syrup. **Climens** is the named exception: it is
        bottled as 100% Sémillon.
    fr:
      question: Pourquoi garder du Sauvignon Blanc dans un assemblage de Sauternes ou de Barsac ?
      choices:
        - { text: "C’est le seul cépage autorisé", correct: false }
        - { text: "Il fournit l’acidité que le Sémillon perd", correct: true }
        - { text: "Il apporte le corps", correct: false }
        - { text: "C’est le cépage de volume des Sauternes", correct: false }
      explanation: |
        Surtout en pourriture noble : le Sémillon botrytisé est riche et
        peu acide. Une part de **Sauvignon Blanc** empêche **Yquem** (et
        la plupart des assemblages de Barsac/Sauternes) de goûter comme
        un sirop. **Climens** est l’exception nommée : 100 % Sémillon.

  - id: bordeaux-muscadelle-flavour-001
