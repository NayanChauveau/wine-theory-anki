        - { text: "Seulement quand le Médoc le demande", correct: false }
      explanation: |
        **Environ une fois par décennie**.
        La règle est **au moins tous les dix ans**. Le tour de 2022 a été
        tardif et contentieux — le calendrier est le principe, pas une
        promesse de calme.

