        - { text: "Barrel-fermented, Muscadelle-led", correct: false }
        - { text: "Late-picked Sémillon, left off-dry", correct: false }
      explanation: |
        Steel, **Sauvignon Blanc**, drink young. That is **not**
        Pessac-Léognan cru classé blanc, which is often barrel-fermented
        Sémillon-plus-Sauvignon.
    fr:
      question: Comment élabore-t-on la plupart des blancs bon marché de Graves et d’Entre-Deux-Mers ?
      choices:
        - { text: "Sémillon fermenté en barrique, élevé en bois neuf", correct: false }
        - { text: "Sans chêne, surtout du Sauvignon Blanc", correct: true }
        - { text: "Fermentés en barrique, Muscadelle dominante", correct: false }
        - { text: "Sémillon vendangé tard, laissé demi-sec", correct: false }
      explanation: |
        Inox, **Sauvignon Blanc** (parfois un peu de Sémillon), à boire jeune. Ce n’est
        **pas** le blanc cru classé de Pessac-Léognan, souvent fermenté en fût.

  - id: bordeaux-best-dry-white-001
    type: mcq
    deck: France::Bordeaux
