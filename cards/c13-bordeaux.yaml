        - { text: "Entre-Deux-Mers", correct: true }
        - { text: "Pomerol", correct: false }
        - { text: "Saint-Estèphe", correct: false }
      explanation: |
        **Entre-Deux-Mers** = blanc sec. Le rouge des mêmes coteaux ne
