    en:
      question: How do Pomerol reds usually sit next to Saint-Émilion?
      choices:
        - { text: "Always paler and greener", correct: false }
        - { text: "Richer, with a spicier blackberry register", correct: true }
        - { text: "Always sparkling and white", correct: false }
        - { text: "Always 100% Cabernet Sauvignon", correct: false }
      explanation: |
        Tiny AOC. **Pétrus** sits on a button of blue clay; much of the
        rest is gravel over clay. Richer and spicier than a typical
        Saint-Émilion, not a different legal grape list.
    fr:
      question: Comment les rouges de Pomerol se tiennent-ils d’habitude face à Saint-Émilion ?
      choices:
        - { text: "Toujours plus pâles et plus verts", correct: false }
        - { text: "Plus riches, sur un registre de mûre plus épicé", correct: true }
        - { text: "Toujours effervescents et blancs", correct: false }
        - { text: "Toujours 100 % Cabernet Sauvignon", correct: false }
      explanation: |
        **Plus riches, sur un registre de mûre plus épicé**.
        Minuscule AOC. **Pétrus** siège sur un bouton d’argile bleue ;
        une bonne part du reste est graves sur argile. Plus riche et
        plus épicé qu’un Saint-Émilion typique, pas une liste légale de
        cépages différente.

  - id: bordeaux-garage-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What 1990s Right Bank fashion made tiny, very ripe, full-bodied reds from small plots?
      choices:
        - { text: "A legal ban on all oak", correct: false }
        - { text: "The garage / micro-cuvée wave", correct: true }
        - { text: "Only sparkling Clairet", correct: false }
        - { text: "A return to 100% Ugni Blanc", correct: false }
      explanation: |
        **Le Pin** was the prototype; **Valandraud** (Thienpont) is the
        named 1990s garagiste. Low yield, new oak, cult prices — not a
        new AOC.
    fr:
      question: Quelle mode des années 1990, sur la rive droite, a fait de tout petits rouges très mûrs et corsés sur de petites parcelles ?
      choices:
        - { text: "L’interdiction légale de tout chêne", correct: false }
        - { text: "La vague des vins de garage / micro-cuvées", correct: true }
        - { text: "Seulement le Clairet effervescent", correct: false }
        - { text: "Le retour à 100 % d’Ugni Blanc", correct: false }
      explanation: |
        La **vague des vins de garage / micro-cuvées**.
        **Le Pin** en est le prototype ; **Valandraud** (Thienpont) est
        le garagiste nommé des années 1990. Faible rendement, chêne
        neuf, prix de culte — pas une nouvelle AOC.

  - id: bordeaux-garagiste-term-001
