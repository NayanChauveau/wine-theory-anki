    status: reviewed
    source_id: c13-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does Sémillon lead a Sauternes blend?
      choices:
        - { text: "It is the only legal red grape", correct: false }
        - { text: "Thin skins take noble rot readily", correct: true }
        - { text: "It never ripens in the Gironde", correct: false }
        - { text: "AOC law bans Sauvignon Blanc", correct: false }
      explanation: |
        **Thin skins → Botrytis**. Sauvignon Blanc is the acid partner;
        Muscadelle a perfume dash. Sémillon is the volume and the rot.

  - id: bordeaux-sauternes-style-001
    type: mcq
