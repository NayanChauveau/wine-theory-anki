    en:
      question: What soils dominate the Médoc AOC (the old Bas-Médoc)?
      choices:
        - { text: "Only solid granite", correct: false }
        - { text: "Mostly clay, with some gravel patches", correct: true }
        - { text: "Only desert sand with no clay", correct: false }
        - { text: "Only volcanic basalt", correct: false }
      explanation: |
        **Clay first**, gravel as islands. That is why Merlot outplants
        Cabernet Sauvignon here, unlike Pauillac.
    fr:
      question: Quels sols dominent l’AOC Médoc (l’ancien Bas-Médoc) ?
      choices:
        - { text: "Seulement du granite massif", correct: false }
        - { text: "Surtout de l’argile, avec quelques îlots de graves", correct: true }
        - { text: "Seulement du sable de désert, sans argile", correct: false }
        - { text: "Seulement du basalte volcanique", correct: false }
      explanation: |
        **L’argile d’abord**, les graves en îlots. Voilà pourquoi le
        Merlot y dépasse le Cabernet Sauvignon, contrairement à
        Pauillac.

  - id: bordeaux-medoc-aoc-blend-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
