    en:
      question: What sits at the foot of the Saint-Émilion escarpment?
      choices:
        - { text: "The Haut-Médoc communal strip", correct: false }
        - { text: "Sandier, lesser vineyards and lighter wines", correct: true }
        - { text: "Only first-growth Pauillac châteaux", correct: false }
        - { text: "The Gulf Stream itself", correct: false }
      explanation: |
        The **plain** below the côte: more sand, less prestige, earlier
        and lighter bottles than Ausone’s slope.
    fr:
      question: Que trouve-t-on au pied de l’escarpement de Saint-Émilion ?
      choices:
        - { text: "La bande communale du Haut-Médoc", correct: false }
        - { text: "Des vignobles plus sablonneux, plus ordinaires, et des vins plus légers", correct: true }
        - { text: "Seulement des châteaux premier cru de Pauillac", correct: false }
        - { text: "Le Gulf Stream lui-même", correct: false }
      explanation: |
        Des **vignobles plus sablonneux, plus ordinaires, et des vins plus légers**.
        La **plaine** sous la côte : plus de sable, moins de prestige,
        des bouteilles plus précoces et plus légères que la pente
        d’Ausone.

  - id: bordeaux-pomerol-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0104
    review:
