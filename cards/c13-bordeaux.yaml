        - { text: "The EU requires cedar in every bottle", correct: false }
      explanation: |
        **Supermarket competition** (Chile, Australia, Languedoc) pushed
        sorting and ripeness. That is a trend, not a claim that every
        Bordeaux AOC is now a classed growth.
    fr:
      question: Pourquoi beaucoup de Bordeaux rouge du quotidien sont-ils devenus plus nets et plus mûrs ?
      choices:
        - { text: "Le cahier des charges interdit désormais tout travail de feuillage", correct: false }
