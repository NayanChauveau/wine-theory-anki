        - { text: "The Garonne and the Ciron", correct: false }
        - { text: "The Garonne and the Lot", correct: false }
      explanation: |
        **Garonne** from the south-east, **Dordogne** from the east. Their
        meeting is the **Gironde**. Left Bank = west of Garonne/Gironde.
    fr:
      question: Quels deux cours d’eau se rejoignent pour former l’estuaire de la Gironde ?
      choices:
        - { text: "La Dordogne et l’Isle", correct: false }
        - { text: "La Dordogne et la Garonne", correct: true }
        - { text: "La Garonne et le Ciron", correct: false }
        - { text: "La Garonne et le Lot", correct: false }
      explanation: |
        La **Garonne** vient du sud-est, la **Dordogne** de l’est. Leur
        rencontre est la **Gironde**. Rive gauche = à l’ouest de la
        Garonne/Gironde.

