      choices:
        - { text: "Seulement au village de Pomerol", correct: false }
        - { text: "Des AOC proches comme Loupiac, Cadillac, Sainte-Croix-du-Mont et Cérons", correct: true }
        - { text: "Seulement en grand cru de Chablis", correct: false }
