      choices:
        - { text: "Pauillac Grand Cru", correct: false }
        - { text: "Côtes de Bordeaux", correct: true }
        - { text: "Côtes du Rhône Villages", correct: false }
        - { text: "Vin de France seulement", correct: false }
      explanation: |
        **Côtes de Bordeaux** est une enveloppe régionale. Le nom de
        village passe en tête d’étiquette quand le vin s’y qualifie.

