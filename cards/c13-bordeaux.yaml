        - { text: "In Pomerol, under its communal classification", correct: false }
        - { text: "In Entre-Deux-Mers, under its white-wine list", correct: false }
      explanation: |
        The **1959 Graves** white classification now lives inside
        **Pessac-Léognan**. 1855 classed Sauternes, not dry white Médoc.
    fr:
      question: Où un blanc sec de Bordeaux peut-il porter les mots cru classé ?
      choices:
        - { text: "À Pauillac, au titre de la liste des rouges de 1855", correct: false }
        - { text: "À Pessac-Léognan, sur la liste des blancs des Graves", correct: true }
        - { text: "À Pomerol, au titre de son classement communal", correct: false }
        - { text: "En Entre-Deux-Mers, au titre de sa liste des blancs", correct: false }
      explanation: |
        Le classement des blancs des **Graves 1959** vit aujourd’hui
        dans **Pessac-Léognan**. 1855 a classé les Sauternes, pas le
        blanc sec du Médoc.

