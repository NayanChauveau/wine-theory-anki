    en:
      question: How much barrel ageing does generic Bordeaux AOC usually receive?
      choices:
        - { text: "About a year, a legal minimum", correct: false }
        - { text: "Little or none", correct: true }
        - { text: "About 18 months in used barriques", correct: false }
        - { text: "About 18 months, half in new oak", correct: false }
      explanation: |
        Steel or concrete, then bottle. Chips or staves exist at the cheap
        end; **barrique ageing** is not the generic model.
    fr:
      question: Quel élevage en barrique un Bordeaux AOC générique reçoit-il d’habitude ?
      choices:
        - { text: "Environ un an, minimum légal", correct: false }
        - { text: "Peu ou pas", correct: true }
        - { text: "Environ 18 mois en barriques usagées", correct: false }
        - { text: "Environ 18 mois, dont la moitié en bois neuf", correct: false }
      explanation: |
        Inox ou béton, puis mise. Copeaux ou douelles existent au bas de gamme ; l’**élevage
        en barrique** n’est pas le modèle générique.

  - id: bordeaux-semillon-sweet-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0037
    review:
