        - { text: "Pessac-Léognan", correct: true }
        - { text: "L’AOC Médoc seulement", correct: false }
        - { text: "Tokaj", correct: false }
      explanation: |
        **Pessac-Léognan** (créé en **1987**) est le nord des Graves :
