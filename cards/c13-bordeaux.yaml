  - id: bordeaux-edm-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0053
    review:
      fact_check: pass
      sources: [known-fact, inao-entre-deux-mers]
    en:
      question: What name is given to the land between the Dordogne and the Garonne?
      choices:
        - { text: "The Haut-Médoc", correct: false }
        - { text: "Entre-Deux-Mers", correct: true }
        - { text: "Pomerol", correct: false }
        - { text: "The Graves", correct: false }
      explanation: |
        **Entre-Deux-Mers** = “between two seas” (the two tidal rivers). The **AOC** of that
        name is known for dry white; a red version was only approved in 2023, and most red
        from these hills is still labelled Bordeaux or Bordeaux Supérieur.
    fr:
      question: Quel nom désigne la terre entre la Dordogne et la Garonne ?
      choices:
        - { text: "Le Haut-Médoc", correct: false }
        - { text: "Entre-Deux-Mers", correct: true }
        - { text: "Pomerol", correct: false }
        - { text: "Les Graves", correct: false }
      explanation: |
        **Entre-Deux-Mers** = « entre deux mers » (les deux fleuves à marée). L’**AOC** de ce
        nom est connue pour son blanc sec ; un rouge n’y a été homologué qu’en 2023, et la
        plupart des rouges de ces coteaux s’étiquettent encore Bordeaux ou Bordeaux Supérieur.

