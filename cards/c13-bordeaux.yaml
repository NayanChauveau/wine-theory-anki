        - { text: "Little or none", correct: true }
        - { text: "A legal minimum of 24 months in new oak", correct: false }
        - { text: "Always 18 months in 100% new oak", correct: false }
      explanation: |
        Steel or concrete, then bottle. Chips or staves exist at the cheap
        end; **barrique ageing** is not the generic model.
    fr:
      question: Quelle part de chêne en barrique un Bordeaux AOC générique reçoit-il d’habitude ?
      choices:
        - { text: "Trois ans en barriques 100 % neuves", correct: false }
        - { text: "Peu ou pas", correct: true }
        - { text: "Un minimum légal de 24 mois en chêne neuf", correct: false }
        - { text: "Toujours 18 mois en 100 % de chêne neuf", correct: false }
      explanation: |
        **Peu ou pas** de barrique.
        Inox ou béton, puis mise. Copeaux ou douelles existent au bas de
        gamme ; l’**élevage en barrique** n’est pas le modèle générique.

  - id: bordeaux-semillon-sweet-001
    type: mcq
