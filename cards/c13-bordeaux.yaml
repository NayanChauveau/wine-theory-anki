      question: Quelle AOC couvre les vignes au nord de Saint-Estèphe ?
      choices:
        - { text: "Listrac-Médoc", correct: false }
        - { text: "Médoc", correct: true }
        - { text: "Moulis", correct: false }
        - { text: "Haut-Médoc", correct: false }
      explanation: |
        L’**AOC Médoc** commence là où le Haut-Médoc s’arrête, au nord de Saint-Estèphe. «
        Bas-Médoc » n’est pas un nom légal sur l’étiquette.

  - id: bordeaux-medoc-aoc-soil-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What soils dominate the Médoc AOC (the old Bas-Médoc)?
      choices:
        - { text: "Mostly deep gravel", correct: false }
        - { text: "Mostly clay, some gravel", correct: true }
        - { text: "Mostly plateau limestone", correct: false }
        - { text: "Mostly Landes sand", correct: false }
      explanation: |
        **Clay first**, gravel as islands. That is why Merlot outplants
        Cabernet Sauvignon here, unlike Pauillac.
    fr:
      question: Quels sols dominent l’AOC Médoc (l’ancien Bas-Médoc) ?
      choices:
        - { text: "Surtout des graves profondes", correct: false }
        - { text: "Surtout de l’argile, quelques graves", correct: true }
        - { text: "Surtout du calcaire de plateau", correct: false }
        - { text: "Surtout des sables landais", correct: false }
      explanation: |
        **L’argile d’abord**, les graves en îlots. Voilà pourquoi le
        Merlot y dépasse le Cabernet Sauvignon, contrairement à
        Pauillac.

  - id: bordeaux-medoc-aoc-blend-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape usually leads a Médoc AOC blend?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        Cooler clay → **Merlot**, softer and earlier than a Saint-Estèphe Cabernet wine. The
        wines are generally made for earlier drinking than the communal crus.
    fr:
      question: Quel cépage mène d’habitude un assemblage d’AOC Médoc ?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        Argile plus fraîche → **Merlot**, plus souple et plus précoce qu’un vin de Cabernet de
        Saint-Estèphe. Les vins se boivent en général plus tôt que les crus communaux.

  - id: bordeaux-haut-medoc-north-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0085
