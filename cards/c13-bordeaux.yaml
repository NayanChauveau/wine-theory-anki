  - id: bordeaux-semillon-botrytis-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does Sémillon lead a Sauternes blend?
      choices:
        - { text: "It refuses noble rot", correct: false }
        - { text: "Thin skins take noble rot readily", correct: true }
        - { text: "It never ripens in the Gironde", correct: false }
        - { text: "AOC law bans Sauvignon Blanc", correct: false }
      explanation: |
        **Thin skins → Botrytis**. Sauvignon Blanc is the acid partner;
        Muscadelle a perfume dash. Sémillon is the volume and the rot.
    fr:
      question: Pourquoi le Sémillon mène-t-il un assemblage de Sauternes ?
      choices:
        - { text: "Il refuse la pourriture noble", correct: false }
        - { text: "Des peaux fines prennent facilement la pourriture noble", correct: true }
        - { text: "Il ne mûrit jamais en Gironde", correct: false }
        - { text: "Le cahier des charges interdit le Sauvignon Blanc", correct: false }
      explanation: |
        **Peaux fines → Botrytis**. Le Sauvignon Blanc est le
        partenaire d’acidité ; la Muscadelle, une pincée de parfum. Le
        Sémillon est le volume et la pourriture.

  - id: bordeaux-sauternes-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0128
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What keeps a top Sauternes from tasting like unrelieved syrup?
      choices:
        - { text: "A legal maximum of 2 g/L residual sugar", correct: false }
        - { text: "High acidity", correct: true }
        - { text: "Very low alcohol", correct: false }
        - { text: "A legal maximum of 45 g/L residual sugar", correct: false }
      explanation: |
        **Sweet + acid + botrytis + oak**. Alcohol is typically high
        (often 13–14%+). Yquem is the extreme of that balance, not a
        different recipe.
    fr:
      question: Qu’est-ce qui empêche un grand Sauternes de goûter comme un sirop sans relief ?
      choices:
        - { text: "Un maximum légal de 2 g/L de sucre résiduel", correct: false }
        - { text: "Une acidité élevée", correct: true }
        - { text: "Un degré très bas", correct: false }
        - { text: "Un maximum légal de 45 g/L de sucre résiduel", correct: false }
      explanation: |
        **Doux + acide + botrytis + chêne**. L’alcool est
        typiquement haut (souvent 13–14 % et plus). Yquem est
        l’extrême de cet équilibre, pas une autre recette.

