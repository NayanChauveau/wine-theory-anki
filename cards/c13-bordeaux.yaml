        - { text: "Bordeaux", correct: true }
        - { text: "Entre-Deux-Mers", correct: false }
        - { text: "Pessac-Léognan", correct: false }
      explanation: |
        **Sauternes** means sweet, and the Médoc names were red-only, so **Aile d’Argent**
        (Mouton) and **Y** (Yquem) are Bordeaux blanc. Bordeaux Supérieur is no option: its
        whites are sweet. Since the 2025 vintage a **Médoc blanc** also exists.
    fr:
      question: Quelle AOC porte traditionnellement un blanc sec produit par un château du Médoc ou de Sauternes ?
      choices:
        - { text: "Graves", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Entre-Deux-Mers", correct: false }
        - { text: "Pessac-Léognan", correct: false }
      explanation: |
        **Sauternes** veut dire liquoreux et les AOC du Médoc étaient réservées au rouge :
        **Aile d’Argent** (Mouton) et **Y** (Yquem) sont donc des Bordeaux blancs. Le Bordeaux
        Supérieur est exclu : ses blancs sont moelleux. Depuis le millésime 2025, il existe
        aussi un **Médoc blanc**.

