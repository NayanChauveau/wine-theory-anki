      choices:
        - { text: "The top rank of the Saint-Émilion classification", correct: false }
        - { text: "A separate AOC with stricter production rules", correct: true }
        - { text: "A single named vineyard, as in Burgundy", correct: false }
        - { text: "The label term reserved for classed châteaux", correct: false }
      explanation: |
        **Grand Cru** here is an **appellation** (yield, ageing), not a
        château ranking. Many bottles say Grand Cru without being classé.
    fr:
      question: Que désigne réellement la mention Saint-Émilion Grand Cru sur une étiquette ?
      choices:
        - { text: "Le rang le plus élevé du classement de Saint-Émilion", correct: false }
        - { text: "Une AOC distincte, aux règles de production plus strictes", correct: true }
        - { text: "Un vignoble délimité, comme en Bourgogne", correct: false }
        - { text: "La mention réservée aux châteaux classés", correct: false }
      explanation: |
        **Grand Cru** est ici une **appellation** (rendement, élevage), pas un classement de
        château. Beaucoup de bouteilles portent la mention Grand Cru sans être classées.

  - id: bordeaux-st-em-class-exists-001
