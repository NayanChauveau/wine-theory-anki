      fact_check: pass
      sources: [known-fact]
    en:
      question: Which black grape is the best match for Pessac-Léognan gravel?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Petit Verdot", correct: false }
      explanation: |
        Same logic as the Haut-Médoc: **warm, drained gravel** ripens
        Cabernet Sauvignon. Merlot still fills the cooler pockets.
    fr:
      question: Quel cépage noir convient le mieux aux graves de Pessac-Léognan ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Petit Verdot", correct: false }
      explanation: |
        Même logique que le Haut-Médoc : des **graves chaudes et
        drainées** mûrissent le Cabernet Sauvignon. Le Merlot remplit
        encore les poches plus fraîches.

  - id: bordeaux-pessac-vs-hm-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0093
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do Pessac-Léognan reds usually compare with Haut-Médoc reds?
      choices:
        - { text: "Fuller in body, with less aroma", correct: false }
        - { text: "A little lighter in body and more fragrant", correct: true }
        - { text: "Similar in body, but markedly sweeter", correct: false }
        - { text: "Lighter in aroma, with firmer tannins", correct: false }
      explanation: |
        More perfume, a shade less mass — think **Smith Haut Lafitte**,
        not **La Mission Haut-Brion**, which sits with Haut-Brion for
        density.
    fr:
      question: Comment les rouges de Pessac-Léognan se comparent-ils d’habitude aux rouges du Haut-Médoc ?
      choices:
        - { text: "Plus corsés, avec moins de parfum", correct: false }
        - { text: "Un peu plus légers en corps et plus parfumés", correct: true }
        - { text: "De corps voisin, mais nettement plus doux", correct: false }
        - { text: "Moins parfumés, avec des tanins plus fermes", correct: false }
      explanation: |
        Plus de parfum, un peu moins de masse — penser **Smith Haut
        Lafitte**, pas **La Mission Haut-Brion**, qui se range avec
        Haut-Brion pour la densité.

  - id: bordeaux-graves-vs-pessac-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0094
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do southern Graves reds usually compare with Pessac-Léognan?
      choices:
        - { text: "More concentrated and more Cabernet-led", correct: false }
        - { text: "Lighter, simpler, and often more Merlot", correct: true }
        - { text: "Similar in weight, but usually sweeter", correct: false }
        - { text: "More tannic and generally less Merlot-led", correct: false }
      explanation: |
        **Pessac-Léognan** took the best northern gravel in 1987. Remaining
        **Graves** AOC is a step down in concentration and leans more
        Merlot.
    fr:
      question: Comment les rouges des Graves du sud se comparent-ils d’habitude à Pessac-Léognan ?
      choices:
        - { text: "Plus concentrés et davantage menés par le Cabernet", correct: false }
        - { text: "Plus légers, plus simples, souvent plus de Merlot", correct: true }
        - { text: "De poids voisin, mais généralement plus doux", correct: false }
        - { text: "Plus tanniques et généralement moins marqués par le Merlot", correct: false }
      explanation: |
        **Pessac-Léognan** a pris les meilleures graves du nord en 1987. L’AOC **Graves**
        restante est un cran en dessous en concentration et penche davantage vers le Merlot.

  - id: bordeaux-rb-merlot-001
