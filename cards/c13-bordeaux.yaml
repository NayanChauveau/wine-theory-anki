        - { text: "Le gel a rendu chaque millésime minuscule", correct: false }
        - { text: "L’UE exige du cèdre dans chaque bouteille", correct: false }
      explanation: |
        Les **marques d’export doivent rivaliser avec des vins du Nouveau Monde au même prix**.
        La **concurrence des linéaires** (Chili, Australie, Languedoc) a
        poussé le tri et la maturité. C’est une tendance, pas l’affirmation
        que chaque Bordeaux AOC est devenu un cru classé.

