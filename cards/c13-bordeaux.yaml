        - { text: "Merlot", correct: true }
        - { text: "Riesling", correct: false }
        - { text: "Carmenère only", correct: false }
      explanation: |
        Cooler clay → **Merlot**, softer and earlier than a Saint-Estèphe
        Cabernet wine. Not every bottle is a fruit bomb; “easy” is the
        contrast with the communal crus.
    fr:
      question: Quel cépage mène d’habitude un assemblage d’AOC Médoc ?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Riesling", correct: false }
        - { text: "Carmenère seulement", correct: false }
      explanation: |
        Argile plus fraîche → **Merlot**, plus souple et plus précoce
        qu’un vin de Cabernet de Saint-Estèphe. Toutes les bouteilles ne
        sont pas un fruit très marqué ; « facile » est le contraste avec les
        crus communaux.

