      question: What fruit-and-oak signature do Haut-Médoc communal reds usually show when young?
      choices:
        - { text: "Red fruit and soft tannin", correct: false }
        - { text: "Blackcurrant, cedar, and firm tannin", correct: true }
        - { text: "Black fruit with no tannin", correct: false }
        - { text: "Floral notes and little oak", correct: false }
      explanation: |
        **Cassis + cedar + grip**. They can be tough at five years; the
        point of the communal crus is a long curve, not a nouveau.
    fr:
      question: Quelle signature de fruit et de chêne les rouges communaux du Haut-Médoc montrent-ils d’habitude dans leur jeunesse ?
      choices:
        - { text: "Fruits rouges et tanin souple", correct: false }
        - { text: "Cassis, cèdre et tanin ferme", correct: true }
        - { text: "Fruits noirs sans tanin", correct: false }
        - { text: "Notes florales et peu de bois", correct: false }
      explanation: |
        **Cassis + cèdre + poigne**. Ils peuvent être durs à cinq ans ;
        le point des crus communaux est une longue courbe, pas un vin primeur.

  - id: bordeaux-pessac-where-001
