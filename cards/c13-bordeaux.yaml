  - id: bordeaux-sweet-botrytis-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fungus makes the great sweet wines of Sauternes and Barsac possible?
      choices:
        - { text: "Grey rot (Botrytis) on unripe or split fruit", correct: false }
        - { text: "Noble rot (Botrytis cinerea) on ripe grapes", correct: true }
        - { text: "Sour rot on damaged bunches", correct: false }
        - { text: "Powdery mildew (oidium) on the berries", correct: false }
      explanation: |
        Same fungus as grey rot: **Botrytis** on ripe fruit, misty mornings
        then dry afternoons. Persistently wet, or unripe berries, and it
        is grey rot. Cheaper sweet Bordeaux may just be late-picked.
    fr:
      question: Quel champignon rend possibles les grands liquoreux de Sauternes et de Barsac ?
      choices:
        - { text: "La pourriture grise (Botrytis) sur raisins pas mûrs ou fendus", correct: false }
        - { text: "La pourriture noble (Botrytis cinerea) sur raisins mûrs", correct: true }
        - { text: "La pourriture acide des grappes déjà abîmées", correct: false }
        - { text: "L’oïdium de fin de saison sur les baies", correct: false }
      explanation: |
        Même champignon que la pourriture grise : la **botrytis** sur
        raisins mûrs, brume le matin puis après-midi sec. Trop d’eau, ou
        baies encore vertes, et c’est de la grise. Un liquoreux bordelais
        moins cher peut n’être que vendangé tard.

