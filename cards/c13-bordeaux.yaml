cards:
  - id: bordeaux-left-bank-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    en:
      question: Which grape typically dominates Left Bank Bordeaux blends (Médoc and Graves)?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        The gravel soils of the **Médoc and Graves** favour **Cabernet Sauvignon**, which usually leads
        the blend. Merlot is the main grape on the clay-limestone Right Bank
        (Saint-Émilion, Pomerol).
    fr:
      question: Quel cépage domine généralement les assemblages de rive gauche (Médoc et Graves) ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        Les graves du **Médoc et des Graves** conviennent au **Cabernet Sauvignon**, qui mène
        souvent l’assemblage. Le Merlot domine la rive droite argilo-calcaire
        (Saint-Émilion, Pomerol).

  - id: bordeaux-right-bank-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    en:
      question: Which pair of appellations is on the Right Bank and typically Merlot-led?
      choices:
        - { text: "Pauillac and Margaux", correct: false }
        - { text: "Pessac-Léognan and Sauternes", correct: false }
        - { text: "Saint-Émilion and Pomerol", correct: true }
        - { text: "Entre-Deux-Mers and Graves", correct: false }
      explanation: |
        **Saint-Émilion** and **Pomerol** sit on the Right Bank (Libournais). Merlot dominates because
        the cooler clay and limestone soils ripen it more reliably than Cabernet Sauvignon.
        Pauillac and Margaux are Left Bank Médoc communes.
    fr:
      question: Quel couple d’appellations se trouve sur la rive droite et est généralement mené par le Merlot ?
      choices:
        - { text: "Pauillac et Margaux", correct: false }
        - { text: "Pessac-Léognan et Sauternes", correct: false }
        - { text: "Saint-Émilion et Pomerol", correct: true }
        - { text: "Entre-Deux-Mers et Graves", correct: false }
      explanation: |
        **Saint-Émilion** et **Pomerol** sont sur la rive droite (Libournais). Le Merlot y domine
        car les sols plus froids d’argile et de calcaire le mûrissent plus sûrement que le
        Cabernet Sauvignon. Pauillac et Margaux sont des communes du Médoc, rive gauche.

  - id: bordeaux-largest-aoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which French AOC vineyard ships the most wine?
      choices:
        - { text: "Chablis", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Sancerre", correct: false }
        - { text: "Bandol", correct: false }
      explanation: |
        **Bordeaux** is the giant by **volume** (and planted area) among French
        AOCs. **Champagne** usually beats it on export **value**. A large IGP
        such as Pays d’Oc can also move huge hectolitres — that is not an AOC.
    fr:
      question: Quelle AOC française a le plus gros volume de vin ?
      choices:
        - { text: "Chablis", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Sancerre", correct: false }
        - { text: "Bandol", correct: false }
      explanation: |
        **Bordeaux** est le géant en **volume** (et en superficie) parmi les
        AOC françaises. **Champagne** le dépasse souvent en **valeur** à
        l’export. Une IGP vaste comme le Pays d’Oc peut aussi bouger d’énormes
        hectolitres — ce n’est pas une AOC.

  - id: bordeaux-climate-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How should you label the Gironde’s climate?
      choices:
        - { text: "Hot continental", correct: false }
        - { text: "Moderate maritime", correct: true }
        - { text: "Cool alpine", correct: false }
        - { text: "Tropical monsoon", correct: false }
      explanation: |
        The **Atlantic** keeps winters mild and summers moderate. That is
        **maritime**, not a landlocked continental swing.
    fr:
      question: Comment qualifier le climat de la Gironde ?
      choices:
        - { text: "Continental chaud", correct: false }
        - { text: "Maritime tempéré", correct: true }
        - { text: "Alpin frais", correct: false }
        - { text: "Tropical de mousson", correct: false }
      explanation: |
        L’**Atlantique** adoucit les hivers et tempère les étés. C’est un
        climat **maritime tempéré**, pas un continental enclavé.

  - id: bordeaux-gulf-stream-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gulf Stream do for Bordeaux’s growing season?
      choices:
        - { text: "It shortens it to June only", correct: false }
        - { text: "It lengthens it", correct: true }
        - { text: "It stops all rain", correct: false }
        - { text: "It freezes the Gironde each May", correct: false }
      explanation: |
        Warm ocean water arriving from the Caribbean **stretches** the season
        so late varieties can still finish.
    fr:
      question: Quel effet le Gulf Stream a-t-il sur la saison végétative à Bordeaux ?
      choices:
        - { text: "Il la réduit au seul mois de juin", correct: false }
        - { text: "Il l’allonge", correct: true }
        - { text: "Il arrête toute pluie", correct: false }
        - { text: "Il gèle la Gironde chaque mai", correct: false }
      explanation: |
        **Il l’allonge.** L’eau océanique chaude venue des Caraïbes
        étire la saison végétative, ce qui permet aux cépages tardifs
        de finir leur maturité.

  - id: bordeaux-october-ripen-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Into which month can Cabernet still be hanging in a slow Bordeaux year?
      choices:
        - { text: "They are always picked in July", correct: false }
        - { text: "Into October", correct: true }
        - { text: "Never after 14 July", correct: false }
        - { text: "Only in January under ice", correct: false }
      explanation: |
        Cabernet Sauvignon in particular can hang **into October**. That is
        why autumn rain is a vintage-maker.
    fr:
      question: Jusqu’à quel mois le Cabernet peut-il encore rester sur pied lors d’un millésime lent ?
      choices:
        - { text: "On le vendange toujours en juillet", correct: false }
        - { text: "Jusqu’en octobre", correct: true }
        - { text: "Jamais après le 14 juillet", correct: false }
        - { text: "Seulement en janvier sous la glace", correct: false }
      explanation: |
        Le Cabernet Sauvignon surtout peut rester sur pied **jusqu’en
        octobre**. D’où le rôle décisif de la pluie d’automne sur le
        millésime.

  - id: bordeaux-frost-rare-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gulf Stream mainly spare the Gironde from in an average year?
      choices:
        - { text: "All rain after June", correct: false }
        - { text: "Widespread spring frost", correct: true }
        - { text: "Any need for drainage", correct: false }
        - { text: "Vintage variation", correct: false }
      explanation: |
        Mild Atlantic air makes **widespread spring frost** less common than
        in Chablis or Champagne. It is not a guarantee: **2017** and **2021**
        still froze large parts of the vineyard.
    fr:
      question: De quoi le Gulf Stream préserve-t-il surtout la Gironde une année moyenne ?
      choices:
        - { text: "Toute pluie après juin", correct: false }
        - { text: "Un gel de printemps généralisé", correct: true }
        - { text: "Tout besoin de drainage", correct: false }
        - { text: "Toute variation de millésime", correct: false }
      explanation: |
        L’air atlantique doux rend un **gel de printemps généralisé** moins
        fréquent qu’à Chablis ou en Champagne. Ce n’est pas une garantie :
        **2017** et **2021** ont quand même gelé de vastes pans du vignoble.

  - id: bordeaux-atlantic-rain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does sitting next to the Atlantic do to Bordeaux weather?
      choices:
        - { text: "It makes the vineyard bone-dry", correct: false }
        - { text: "It brings a lot of rain and humidity", correct: true }
        - { text: "It creates a polar winter every year", correct: false }
        - { text: "It stops clouds from forming", correct: false }
      explanation: |
        **Wet air and frequent rain** are the maritime tax. Humidity also
        feeds rot.
    fr:
      question: Que change la proximité de l’Atlantique au temps bordelais ?
      choices:
        - { text: "Elle assèche complètement le vignoble", correct: false }
        - { text: "Elle apporte beaucoup de pluie et d’humidité", correct: true }
        - { text: "Elle impose un hiver polaire chaque année", correct: false }
        - { text: "Elle empêche les nuages de se former", correct: false }
      explanation: |
        Elle **apporte beaucoup de pluie et d’humidité** : c’est le tribut
        maritime. L’humidité nourrit aussi la pourriture.

  - id: bordeaux-landes-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two landforms sit between the ocean and the Médoc vines?
      choices:
        - { text: "The Alps", correct: false }
        - { text: "The Landes forest and the coastal sand dunes", correct: true }
        - { text: "A glass roof over the Médoc", correct: false }
        - { text: "The Massif Central alone", correct: false }
      explanation: |
        The **Landes** pine belt and the **dunes** sit between the ocean and
        the vines. They do not stop rain; they knock the edge off the wind.
    fr:
      question: Quels deux reliefs s’interposent entre l’océan et les vignes du Médoc ?
      choices:
        - { text: "Les Alpes", correct: false }
        - { text: "La forêt des Landes et les dunes littorales", correct: true }
        - { text: "Un toit de verre au-dessus du Médoc", correct: false }
        - { text: "Le seul Massif central", correct: false }
      explanation: |
        **La forêt des Landes et les dunes littorales** se dressent entre
        l’océan et les vignes. Elles n’arrêtent pas la pluie ; elles cassent
        la force du vent.

  - id: bordeaux-rain-risks-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can that frequent rain spoil a Bordeaux vintage?
      choices:
        - { text: "It only deepens colour", correct: false }
        - { text: "It can wreck flowering and fruit set, feed rot, and water down flavours at pick", correct: true }
        - { text: "Rain is illegal in the Gironde", correct: false }
        - { text: "It always raises alcohol", correct: false }
      explanation: |
        Three separate hits: **coulure / millerandage** at flower, **rot** in
        a wet summer, **dilution** if it pours at harvest.
    fr:
      question: Comment la pluie fréquente peut-elle gâcher un millésime bordelais ?
      choices:
        - { text: "Elle ne fait que foncer la robe", correct: false }
        - { text: "Elle peut ruiner la floraison et la nouaison, nourrir la pourriture et diluer les arômes à la vendange", correct: true }
        - { text: "La pluie est interdite en Gironde", correct: false }
        - { text: "Elle relève toujours le degré", correct: false }
      explanation: |
        Elle peut **ruiner la floraison et la nouaison, nourrir la pourriture et diluer les arômes à la vendange**.
        Trois coups distincts : **coulure / millerandage** à la fleur,
        **pourriture** un été humide, **dilution** s’il verse à la vendange.

  - id: bordeaux-vintage-rain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do Bordeaux vintages swing so much?
      choices:
        - { text: "Because every château must pick on the same Monday", correct: false }
        - { text: "Because rain can undo flowering, health or harvest concentration", correct: true }
        - { text: "Because the region has no rivers", correct: false }
        - { text: "Because frost happens every week", correct: false }
      explanation: |
        The **rain lottery** is the main reason 2013 and 2018 do not taste
        like twins. Heat spikes matter too; water is the classic exam lever.
    fr:
      question: Pourquoi les millésimes bordelais varient-ils autant ?
      choices:
        - { text: "Parce que chaque château doit vendanger le même lundi", correct: false }
        - { text: "Parce que la pluie peut compromettre la floraison, l’état sanitaire ou la concentration à la récolte", correct: true }
        - { text: "Parce que la région n’a pas de fleuves", correct: false }
        - { text: "Parce que le gel survient chaque semaine", correct: false }
      explanation: |
        Parce que la **pluie peut compromettre la floraison, l’état sanitaire
        ou la concentration à la récolte**. Cette loterie explique surtout
        que 2013 et 2018 ne se ressemblent pas. Les pics de chaleur comptent
        aussi ; l’eau reste le levier classique.

  - id: bordeaux-sorting-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do ambitious châteaux dampen that vintage swing?
      choices:
        - { text: "By bottling every berry they grow", correct: false }
        - { text: "By throwing out diseased and unripe fruit", correct: true }
        - { text: "By irrigating with seawater", correct: false }
        - { text: "By picking in March", correct: false }
      explanation: |
        **Table sorting** (and optical sorters at the top addresses) keep
        green and rotten berries out of the grand vin. Second wines absorb
        the rest.
    fr:
      question: Comment les châteaux ambitieux atténuent-ils cette variation de millésime ?
      choices:
        - { text: "En mettant en bouteille chaque baie récoltée", correct: false }
        - { text: "En écartant les raisins malades et les raisins verts", correct: true }
        - { text: "En irrigant à l’eau de mer", correct: false }
        - { text: "En vendangeant en mars", correct: false }
      explanation: |
        Ils **écartent les raisins malades et les raisins verts**.
        Le **tri sur table** (et les trieuses optiques chez les plus grandes
        adresses) tient les baies vertes et pourries hors du grand vin. Les
        seconds vins absorbent le reste.

  - id: bordeaux-canopy-health-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After berry sorting, what vineyard change most improved average ripeness and health?
      choices:
        - { text: "A legal ban on all canopy work", correct: false }
        - { text: "Smarter canopy work and more targeted spray programmes", correct: true }
        - { text: "Planting only under glass", correct: false }
        - { text: "Picking two months earlier than in 1970", correct: false }
      explanation: |
        Open canopies dry the fruit and ripen it. Growers still spray — they
        just **spray less blindly**. Do not read that as “Bordeaux went
        spray-free”.
    fr:
      question: Après le tri des baies, quel changement à la vigne a le plus amélioré maturité et état sanitaire moyens ?
      choices:
        - { text: "Une interdiction légale de tout travail de feuillage", correct: false }
        - { text: "Un travail du feuillage plus soigné et des traitements plus ciblés", correct: true }
        - { text: "Planter uniquement sous verre", correct: false }
        - { text: "Vendanger deux mois plus tôt qu’en 1970", correct: false }
      explanation: |
        Un **travail du feuillage plus soigné et des traitements plus ciblés**.
        Un feuillage ouvert sèche le fruit et le mûrit. On traite encore —
        on **traite moins à l’aveugle**. Cela ne veut pas dire que Bordeaux
        est devenu sans traitement.

  - id: bordeaux-blended-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are almost all red Bordeaux, and most of the whites, made?
      choices:
        - { text: "As single-variety wines by law", correct: false }
        - { text: "As blends", correct: true }
        - { text: "Only as sparkling wine", correct: false }
        - { text: "Only from dried grapes", correct: false }
      explanation: |
        **Assemblage** is the house style. A 100% Merlot Pomerol exists, but
        it is the exception, not the rule the chapter teaches.
    fr:
      question: Comment sont élaborés presque tous les rouges de Bordeaux, et la plupart des blancs ?
      choices:
        - { text: "En vins de cépage unique, par la loi", correct: false }
        - { text: "En assemblage", correct: true }
        - { text: "Uniquement en vin effervescent", correct: false }
        - { text: "Uniquement à partir de raisins séchés", correct: false }
      explanation: |
        L’**assemblage** est le style de la maison. Un Pomerol 100 % Merlot
        existe, mais c’est l’exception, pas la règle habituelle.

  - id: bordeaux-blend-why-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why blend in Bordeaux at all?
      choices:
        - { text: "EU law forbids naming a grape", correct: false }
        - { text: "The weather is too unreliable to bet the crop on one variety", correct: true }
        - { text: "Merlot is illegal on the Left Bank", correct: false }
        - { text: "Blending raises the legal alcohol by 3%", correct: false }
      explanation: |
        A cold wet week can wreck **one** flowering. A second variety that
        flowers later still has a crop.
    fr:
      question: Pourquoi assembler à Bordeaux ?
      choices:
        - { text: "Le droit de l’UE interdit de nommer un cépage", correct: false }
        - { text: "Le temps est trop irrégulier pour miser la récolte sur un seul cépage", correct: true }
        - { text: "Le Merlot est interdit sur la rive gauche", correct: false }
        - { text: "L’assemblage relève le degré légal de 3 %", correct: false }
      explanation: |
        Le **temps est trop irrégulier pour miser la récolte sur un seul cépage**.
        Une semaine froide et humide peut ruiner **une** floraison. Un second
        cépage qui fleurit plus tard garde une récolte.

  - id: bordeaux-staggered-ripen-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does that mix of varieties actually work?
      choices:
        - { text: "They all flower and ripen on the same morning", correct: false }
        - { text: "They flower and ripen on different clocks, so one bad week rarely kills the whole harvest", correct: true }
        - { text: "Only one variety is legal", correct: false }
        - { text: "Rain cannot fall after 1 June", correct: false }
      explanation: |
        **Merlot** flowers and ripens first; **Cabernet Sauvignon** last.
        A May storm or an October downpour usually hits one, not both.
    fr:
      question: Pourquoi ce mélange de cépages fonctionne-t-il vraiment ?
      choices:
        - { text: "Ils fleurissent et mûrissent tous le même matin", correct: false }
        - { text: "Ils fleurissent et mûrissent selon des calendriers différents, si bien qu’une mauvaise semaine tue rarement toute la récolte", correct: true }
        - { text: "Un seul cépage est autorisé", correct: false }
        - { text: "La pluie ne peut plus tomber après le 1er juin", correct: false }
      explanation: |
        Ils **fleurissent et mûrissent selon des calendriers différents**.
        Le **Merlot** fleurit et mûrit le premier ; le **Cabernet Sauvignon**
        le dernier. Un orage de mai ou une averse d’octobre touche en
        général l’un, pas les deux.

  - id: bordeaux-varieties-count-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many grape varieties did the Bordeaux AOC list allow before the 2021 additions?
      choices:
        - { text: "Two, and only Cabernet", correct: false }
        - { text: "Thirteen", correct: true }
        - { text: "One hundred, including Riesling", correct: false }
        - { text: "None — only apple is legal", correct: false }
      explanation: |
        The historic set is **thirteen**. In **2021** INAO added Touriga
        Nacional, Marselan, Castets, Arinarnoa, Alvarinho and Liliorila to
        Bordeaux / Bordeaux Supérieur — not to every communal AOC.
    fr:
      question: Combien de cépages le cahier des charges de l’AOC Bordeaux autorisait-il avant les ajouts de 2021 ?
      choices:
        - { text: "Deux, et seulement des Cabernet", correct: false }
        - { text: "Treize", correct: true }
        - { text: "Cent, Riesling compris", correct: false }
        - { text: "Aucun — seule la pomme est légale", correct: false }
      explanation: |
        L’ensemble historique compte **treize**. En **2021**, l’INAO a ajouté
        Touriga Nacional, Marselan, Castets, Arinarnoa, Alvarinho et
        Liliorila à Bordeaux / Bordeaux Supérieur — pas à chaque AOC
        communale.

  - id: bordeaux-five-main-count-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many varieties actually run the region?
      choices:
        - { text: "All thirteen equally", correct: false }
        - { text: "Three black and two white — five in daily use", correct: true }
        - { text: "Only Carmenère", correct: false }
        - { text: "Twenty-four official clones of Chardonnay", correct: false }
      explanation: |
        **Cabernet Sauvignon, Merlot, Cabernet Franc** plus **Sémillon** and
        **Sauvignon Blanc**. Petit Verdot, Malbec, Carmenère and Muscadelle
        are seasoning.
    fr:
      question: Combien de cépages portent réellement le quotidien de la région ?
      choices:
        - { text: "Les treize à parts égales", correct: false }
        - { text: "Trois noirs et deux blancs — cinq au quotidien", correct: true }
        - { text: "Seulement le Carmenère", correct: false }
        - { text: "Vingt-quatre clones officiels de Chardonnay", correct: false }
      explanation: |
        **Trois noirs et deux blancs — cinq au quotidien**.
        **Cabernet Sauvignon, Merlot, Cabernet Franc** plus **Sémillon** et
        **Sauvignon Blanc**. Petit Verdot, Malbec, Carmenère et Muscadelle
        assaisonnent.

  - id: bordeaux-five-named-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which five grapes do most Bordeaux wines actually rely on?
      choices:
        - { text: "Pinot Noir, Gamay, Syrah, Viognier, Riesling", correct: false }
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Sémillon, Sauvignon Blanc", correct: true }
        - { text: "Chardonnay, Pinot Gris, Gewurztraminer, Muscat, Silvaner", correct: false }
        - { text: "Tempranillo, Garnacha, Graciano, Mazuelo, Viura", correct: false }
      explanation: |
        The Left Bank leans **Cabernet Sauvignon**; the Right Bank **Merlot**.
        **Cabernet Franc** is the common seasoning. Dry and sweet whites are
        **Sémillon** and **Sauvignon Blanc**.
    fr:
      question: Sur quels cinq cépages s’appuient réellement la plupart des vins de Bordeaux ?
      choices:
        - { text: "Pinot Noir, Gamay, Syrah, Viognier, Riesling", correct: false }
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Sémillon, Sauvignon Blanc", correct: true }
        - { text: "Chardonnay, Pinot Gris, Gewurztraminer, Muscat, Silvaner", correct: false }
        - { text: "Tempranillo, Garnacha, Graciano, Mazuelo, Viura", correct: false }
      explanation: |
        La rive gauche penche vers le **Cabernet Sauvignon** ; la rive droite
        vers le **Merlot**. Le **Cabernet Franc** assaisonne souvent. Les
        blancs secs et liquoreux reposent sur **Sémillon** et **Sauvignon
        Blanc**.

  - id: bordeaux-cs-haut-medoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does Cabernet Sauvignon most clearly lead the blend?
      choices:
        - { text: "Pomerol’s clay plateau", correct: false }
        - { text: "The Haut-Médoc", correct: true }
        - { text: "Sauternes only", correct: false }
        - { text: "The high Alps", correct: false }
      explanation: |
        Warm **gravel in the Haut-Médoc** communes (Margaux through
        Saint-Estèphe) is Cabernet country. Pomerol is Merlot’s home.
    fr:
      question: Où le Cabernet Sauvignon mène-t-il le plus nettement l’assemblage ?
      choices:
        - { text: "Le plateau argileux de Pomerol", correct: false }
        - { text: "Le Haut-Médoc", correct: true }
        - { text: "Seulement à Sauternes", correct: false }
        - { text: "Les hautes Alpes", correct: false }
      explanation: |
        Les **graves chaudes du Haut-Médoc** (de Margaux à Saint-Estèphe)
        sont le pays du Cabernet. Pomerol est le fief du Merlot.

  - id: bordeaux-cs-also-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where else is Cabernet Sauvignon a serious part of the mix?
      choices:
        - { text: "Only in Chablis grand cru", correct: false }
        - { text: "The Médoc AOC (old Bas-Médoc) and Graves", correct: true }
        - { text: "Only in Tokaj", correct: false }
        - { text: "Only in Champagne AOC", correct: false }
      explanation: |
        **Graves / Pessac-Léognan** gravel also ripens Cabernet. The cooler
        **Médoc AOC** (north of Saint-Estèphe, once called Bas-Médoc) still
        plants it, but Merlot often takes a bigger share there — do not say
        it “dominates” the way it does in Pauillac.
    fr:
      question: Où ailleurs le Cabernet Sauvignon pèse-t-il vraiment dans l’assemblage ?
      choices:
        - { text: "Seulement en grand cru de Chablis", correct: false }
        - { text: "L’AOC Médoc (l’ancien Bas-Médoc) et les Graves", correct: true }
        - { text: "Seulement à Tokaj", correct: false }
        - { text: "Seulement en AOC Champagne", correct: false }
      explanation: |
        Les graves de **Graves / Pessac-Léognan** mûrissent aussi le
        Cabernet. L’**AOC Médoc** plus fraîche (au nord de Saint-Estèphe,
        jadis Bas-Médoc) en plante encore, mais le Merlot y prend souvent
        une plus grande part — on ne dira pas qu’il « domine » comme à
        Pauillac.

  - id: bordeaux-cs-gravel-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can Cabernet Sauvignon ripen reliably only on those Left Bank sites?
      choices:
        - { text: "The soil is solid ice", correct: false }
        - { text: "High gravel and stone content warms the vineyard and drains it", correct: true }
        - { text: "The law forbids Cabernet on gravel", correct: false }
        - { text: "Those sites sit above 2 000 m", correct: false }
      explanation: |
        **Graves** (the stones) store heat and shed water. Cabernet needs
        both. Cool clay on the Right Bank leaves it green in many years;
        Merlot is the safer bet there.
    fr:
      question: Pourquoi le Cabernet Sauvignon ne mûrit-il de façon fiable que sur ces terroirs de rive gauche ?
      choices:
        - { text: "Le sol est de la glace massive", correct: false }
        - { text: "Un fort taux de graves et de cailloux réchauffe le vignoble et le draine", correct: true }
        - { text: "La loi interdit le Cabernet sur les graves", correct: false }
        - { text: "Ces sites sont au-dessus de 2 000 m", correct: false }
      explanation: |
        Les **graves** (les cailloux) emmagasinent la chaleur et évacuent
        l’eau. Le Cabernet a besoin des deux. L’argile fraîche de rive
        droite le laisse souvent vert ; le Merlot y est le pari plus sûr.

  - id: bordeaux-cs-share-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In Haut-Médoc and Graves, how high can Cabernet Sauvignon’s share of a blend go?
      choices:
        - { text: "It is illegal above 10%", correct: false }
        - { text: "Around three-quarters in a ripe year", correct: true }
        - { text: "Always 100% by AOC law", correct: false }
        - { text: "Cabernet is banned on the Left Bank", correct: false }
      explanation: |
        **About 75%** is a typical Left Bank ceiling in a good Cabernet year,
        not a legal cap. Some classed growths go higher; many sit nearer
        60–70% with Merlot filling the rest.
    fr:
      question: Dans le Haut-Médoc et les Graves, jusqu’où peut aller la part de Cabernet Sauvignon dans un assemblage ?
      choices:
        - { text: "Il est interdit au-delà de 10 %", correct: false }
        - { text: "Environ les trois quarts lors d’une année mûre", correct: true }
        - { text: "Toujours 100 % par le cahier des charges", correct: false }
        - { text: "Le Cabernet est interdit sur la rive gauche", correct: false }
      explanation: |
        **Environ les trois quarts** (près de 75 %) est un plafond typique
        de rive gauche lors d’une bonne année à Cabernet, pas un plafond
        légal. Certains crus classés vont plus haut ; beaucoup restent
        vers 60–70 %, le Merlot comblant le reste.

  - id: bordeaux-cf-where-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Right Bank AOC is Cabernet Franc’s main Bordeaux address?
      choices:
        - { text: "Only on the dunes of the Landes", correct: false }
        - { text: "Saint-Émilion", correct: true }
        - { text: "Only in Sauternes", correct: false }
        - { text: "Only north of the Loire", correct: false }
      explanation: |
        **Saint-Émilion** is Franc’s home (Cheval Blanc, Ausone). It is a
        seasoning grape on the Left Bank, not the lead.
    fr:
      question: Quelle AOC de rive droite est la principale adresse bordelaise du Cabernet Franc ?
      choices:
        - { text: "Seulement sur les dunes des Landes", correct: false }
        - { text: "Saint-Émilion", correct: true }
        - { text: "Seulement à Sauternes", correct: false }
        - { text: "Seulement au nord de la Loire", correct: false }
      explanation: |
        **Saint-Émilion** est le fief du Franc (Cheval Blanc, Ausone). Sur
        la rive gauche, c’est un cépage d’assaisonnement, pas le meneur.

  - id: bordeaux-cf-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Compared with Cabernet Sauvignon, what does ripe Cabernet Franc usually bring to the blend?
      choices:
        - { text: "Heavier body and more tannin", correct: false }
        - { text: "Less body and tannin, plus floral fruit", correct: true }
        - { text: "It only makes sweet wine", correct: false }
        - { text: "It has no aroma at all", correct: false }
      explanation: |
        Franc is the **perfume and lift**, not the tannic spine. If it is
        picked too early it goes stalky — same green trap as Cabernet
        Sauvignon, just on an earlier clock.
    fr:
      question: Face au Cabernet Sauvignon, qu’apporte généralement un Cabernet Franc mûr à l’assemblage ?
      choices:
        - { text: "Plus de corps et plus de tanin", correct: false }
        - { text: "Moins de corps et de tanin, plus un fruit floral", correct: true }
        - { text: "Il ne donne que du vin liquoreux", correct: false }
        - { text: "Il n’a aucun arôme", correct: false }
      explanation: |
        **Moins de corps et de tanin, plus un fruit floral**.
        Le Franc apporte **parfum et légèreté**, pas l’épine tannique. Vendangé
        trop tôt, il devient végétal — le même piège vert que le Cabernet
        Sauvignon, simplement plus tôt.

  - id: bordeaux-cf-soil-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can Cabernet Franc ripen on Saint-Émilion limestone where Cabernet Sauvignon often fails?
      choices:
        - { text: "Limestone is hotter than Médoc gravel", correct: false }
        - { text: "It ripens earlier, so cooler drained limestone is still enough", correct: true }
        - { text: "It only ripens on permafrost", correct: false }
        - { text: "AOC law bans Franc on any stone", correct: false }
      explanation: |
        Limestone is **drained but cooler** than Left Bank gravel. Franc’s
        **shorter cycle** finishes there; Cabernet Sauvignon often stays
        green. Warm gravel still suits Franc — it is not a cold-climate grape.
    fr:
      question: Pourquoi le Cabernet Franc peut-il mûrir sur le calcaire de Saint-Émilion là où le Cabernet Sauvignon échoue souvent ?
      choices:
        - { text: "Le calcaire est plus chaud que les graves du Médoc", correct: false }
        - { text: "Il mûrit plus tôt, si bien qu’un calcaire drainé mais plus frais suffit encore", correct: true }
        - { text: "Il ne mûrit que sur le pergélisol", correct: false }
        - { text: "Le cahier des charges interdit le Franc sur toute pierre", correct: false }
      explanation: |
        Le calcaire est **drainé mais plus frais** que les graves de rive
        gauche. Le **cycle plus court** du Franc s’y termine ; le Cabernet
        Sauvignon reste souvent vert. Les graves chaudes conviennent aussi
        au Franc — ce n’est pas un cépage de climat froid.

  - id: bordeaux-merlot-most-planted-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which black grape occupies more Bordeaux hectares than any other?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Carmenère", correct: false }
        - { text: "Muscadelle", correct: false }
      explanation: |
        **Merlot** is more than half the vineyard. It ripens earlier, so it
        is the safer plant on clay and in generic Bordeaux AOC.
    fr:
      question: Quel cépage noir occupe plus d’hectares à Bordeaux que tout autre ?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Carmenère", correct: false }
        - { text: "Muscadelle", correct: false }
      explanation: |
        Le **Merlot** couvre plus de la moitié du vignoble. Plus précoce, il
        est le plant plus sûr sur l’argile et en AOC Bordeaux générique.

  - id: bordeaux-merlot-premium-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In which two AOCs is Merlot the lead grape of the top reds?
      choices:
        - { text: "Only in Sauternes", correct: false }
        - { text: "Saint-Émilion and Pomerol", correct: true }
        - { text: "Only in Chablis", correct: false }
        - { text: "Only in the far north of the Médoc AOC", correct: false }
      explanation: |
        **Pétrus** and **Le Pin** are Merlot houses. **Cheval Blanc** is
        Franc-led; **Ausone** is a Merlot–Franc pair — so not every Right
        Bank icon is a Merlot monologue. Left Bank first growths remain
        Cabernet houses.
    fr:
      question: Dans quelles deux AOC le Merlot mène-t-il les grands rouges ?
      choices:
        - { text: "Seulement à Sauternes", correct: false }
        - { text: "Saint-Émilion et Pomerol", correct: true }
        - { text: "Seulement à Chablis", correct: false }
        - { text: "Seulement à l’extrême nord de l’AOC Médoc", correct: false }
      explanation: |
        **Saint-Émilion et Pomerol**.
        **Pétrus** et **Le Pin** sont des maisons à Merlot. **Cheval Blanc**
        est mené par le Franc ; **Ausone** couple Merlot et Franc — tous les
        icônes de rive droite ne sont donc pas un monologue de Merlot. Les
        premiers crus de rive gauche restent des maisons à Cabernet.

  - id: bordeaux-merlot-clay-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why plant Merlot rather than Cabernet Sauvignon on Saint-Émilion and Pomerol clay?
      choices:
        - { text: "Cabernet is illegal east of the Dordogne", correct: false }
        - { text: "Merlot can ripen on those cooler clay soils; Cabernet Sauvignon often stays green", correct: true }
        - { text: "Clay is too hot for Merlot", correct: false }
        - { text: "Merlot needs 2 000 m of altitude", correct: false }
      explanation: |
        Clay stays **cold and wet**. Merlot’s earlier cycle finishes; Cabernet
        Sauvignon’s does not, except on warmer gravel pockets (Figeac).
    fr:
      question: Pourquoi planter du Merlot plutôt que du Cabernet Sauvignon sur les argiles de Saint-Émilion et de Pomerol ?
      choices:
        - { text: "Le Cabernet est interdit à l’est de la Dordogne", correct: false }
        - { text: "Le Merlot peut mûrir sur ces argiles plus fraîches ; le Cabernet Sauvignon reste souvent vert", correct: true }
        - { text: "L’argile est trop chaude pour le Merlot", correct: false }
        - { text: "Le Merlot a besoin de 2 000 m d’altitude", correct: false }
      explanation: |
        Le **Merlot peut mûrir sur ces argiles plus fraîches** ; le Cabernet Sauvignon reste souvent vert.
        L’argile reste **froide et humide**. Le cycle plus précoce du Merlot
        s’y termine ; celui du Cabernet Sauvignon non, sauf sur des poches
        de graves plus chaudes (Figeac).

  - id: bordeaux-merlot-volume-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape fills most inexpensive, high-volume Bordeaux rouge?
      choices:
        - { text: "Petit Verdot, because it is the cheapest to farm", correct: false }
        - { text: "Merlot, because it ripens earlier and tastes softer", correct: true }
        - { text: "Riesling, because it is native to the Gironde", correct: false }
        - { text: "Only Carmenère", correct: false }
      explanation: |
        **Merlot** gives earlier sugar, lower tannin, and a crop on clay —
        useful for Bordeaux AOC sold in the first year. Softness is the
        tasting reason; reliability is the economic one.
    fr:
      question: Quel cépage remplit la plupart des Bordeaux rouge bon marché et de gros volume ?
      choices:
        - { text: "Le Petit Verdot, parce qu’il est le moins cher à cultiver", correct: false }
        - { text: "Le Merlot, parce qu’il mûrit plus tôt et est plus souple en bouche", correct: true }
        - { text: "Le Riesling, parce qu’il est indigène de la Gironde", correct: false }
        - { text: "Seulement le Carmenère", correct: false }
      explanation: |
        Le **Merlot** donne du sucre plus tôt, moins de tanin, et une
        récolte sur l’argile — utile pour un Bordeaux AOC vendu dès la
        première année. La souplesse est la raison de dégustation ; la
        fiabilité, la raison économique.

  - id: bordeaux-pv-hot-years-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Bordeaux grape used to ripen fully only in the hottest summers?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Petit Verdot", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Muscadelle", correct: false }
      explanation: |
        **Petit Verdot** is late. In cooler decades it was a 1–3% spice jar.
        Warmer vintages now ripen it more often — do not say it *never*
        ripens today.
    fr:
      question: Quel cépage bordelais ne mûrissait pleinement, autrefois, que les étés les plus chauds ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Petit Verdot", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Muscadelle", correct: false }
      explanation: |
        Le **Petit Verdot** est tardif. Dans les décennies plus fraîches, il
        n’était qu’un pot d’épices à 1–3 %. Les millésimes plus chauds le
        mûrissent plus souvent — on ne dira pas qu’il ne mûrit *jamais*
        aujourd’hui.

  - id: bordeaux-pv-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What structure does ripe Petit Verdot usually add?
      choices:
        - { text: "Pale colour and almost no tannin", correct: false }
        - { text: "Deep colour, firm tannin, and a slow ageing curve", correct: true }
        - { text: "Sparkling pressure only", correct: false }
        - { text: "Noble-rot sweetness", correct: false }
      explanation: |
        **Ink and structure** — a seasoning grape. **Château Palmer** has
        used a visible share; most Left Bank blends keep it to a few percent.
    fr:
      question: Quelle structure un Petit Verdot mûr ajoute-t-il d’habitude ?
      choices:
        - { text: "Une robe pâle et presque pas de tanin", correct: false }
        - { text: "Une robe profonde, un tanin ferme et une courbe de garde lente", correct: true }
        - { text: "Seulement de la pression de vin effervescent", correct: false }
        - { text: "La douceur de la pourriture noble", correct: false }
      explanation: |
        **Une robe profonde, un tanin ferme et une courbe de garde lente**.
        **Encre et structure** — un cépage d’assaisonnement. **Château
        Palmer** en a utilisé une part visible ; la plupart des assemblages
        de rive gauche le tiennent à quelques pourcents.

  - id: bordeaux-pv-role-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a splash of Petit Verdot add to a Left Bank blend?
      choices:
        - { text: "Only residual sugar", correct: false }
        - { text: "Colour, tannin and a spicy note", correct: true }
        - { text: "A legal right to the word Champagne", correct: false }
        - { text: "Nothing — it is used only for white wine", correct: false }
      explanation: |
        **Colour, tannin, spice** (violet / liquorice). Palmer and a few
        others have used more than a dash; most keep it tiny.
    fr:
      question: Qu’ajoute une touche de Petit Verdot à un assemblage de rive gauche ?
      choices:
        - { text: "Seulement du sucre résiduel", correct: false }
        - { text: "De la couleur, du tanin et une note épicée", correct: true }
        - { text: "Le droit légal d’écrire Champagne", correct: false }
        - { text: "Rien — on ne l’emploie que pour le blanc", correct: false }
      explanation: |
        **Couleur, tanin, épice** (violette / réglisse). Palmer et quelques
        autres en ont mis plus qu’une pincée ; la plupart le gardent minuscule.

  - id: bordeaux-vessels-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Is there one agreed fermenter for Bordeaux red?
      choices:
        - { text: "Only Roman amphorae, by AOC law", correct: false }
        - { text: "No — estates use wood, stainless steel or concrete as they like", correct: true }
        - { text: "Only plastic bags", correct: false }
        - { text: "Only open-top Pinot vats, never oak", correct: false }
      explanation: |
        Stainless, wood and **concrete eggs / tanks** all appear. The region
        does not agree on one “best” fermenter.
    fr:
      question: Les rouges de Bordeaux fermentent-ils tous dans le même type de cuve ?
      choices:
        - { text: "Seulement des amphores romaines, par le cahier des charges", correct: false }
        - { text: "Non — les domaines choisissent bois, inox ou béton selon leur goût", correct: true }
        - { text: "Seulement des sacs en plastique", correct: false }
        - { text: "Seulement des cuves ouvertes à Pinot, jamais de chêne", correct: false }
      explanation: |
        Inox, bois et **œufs / cuves en béton** se croisent. La région ne
        s’accorde pas sur une « meilleure » cuve.

  - id: bordeaux-blend-spring-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When do most châteaux assemble the grand vin?
      choices:
        - { text: "In the vineyard, before harvest", correct: false }
        - { text: "In the spring after the vintage", correct: true }
        - { text: "Twenty years after bottling only", correct: false }
        - { text: "On the day the flowers open", correct: false }
      explanation: |
        After malolactic and a first look at the lots: typically **March–
        June**. En primeur week sits on that early blend.
    fr:
      question: Quand la plupart des châteaux assemblent-ils le grand vin ?
      choices:
        - { text: "À la vigne, avant la vendange", correct: false }
        - { text: "Au printemps qui suit le millésime", correct: true }
        - { text: "Vingt ans après la mise seulement", correct: false }
        - { text: "Le jour où les fleurs s’ouvrent", correct: false }
      explanation: |
        **Au printemps qui suit le millésime**.
        Après la malo et un premier regard sur les lots : typiquement
        **mars–juin**. La semaine des primeurs s’appuie sur cet assemblage
        précoce.

  - id: bordeaux-blend-late-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do some châteaux do instead of blending that first spring?
      choices:
        - { text: "They must blend before alcoholic fermentation", correct: false }
        - { text: "They keep parcels apart until the end of élevage", correct: true }
        - { text: "They are forbidden to blend at all", correct: false }
        - { text: "They bottle each berry separately", correct: false }
      explanation: |
        Late assemblage lets each lot finish barrel time on its own. Still
        a blend at the end — just not the March snapshot.
    fr:
      question: Que font certains châteaux au lieu d’assembler dès ce premier printemps ?
      choices:
        - { text: "Ils doivent assembler avant la fermentation alcoolique", correct: false }
        - { text: "Ils gardent les parcelles séparées jusqu’à la fin de l’élevage", correct: true }
        - { text: "Il leur est interdit d’assembler", correct: false }
        - { text: "Ils mettent chaque baie en bouteille à part", correct: false }
      explanation: |
        Ils **gardent les parcelles séparées jusqu’à la fin de l’élevage**.
        Un assemblage tardif laisse chaque lot finir son temps de barrique
        de son côté. C’est encore un assemblage à la fin — simplement pas
        l’instantané de mars.

  - id: bordeaux-second-wine-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What happens to lots that miss the grand vin at a leading château?
      choices:
        - { text: "They must be distilled into Cognac on site", correct: false }
        - { text: "They become a second (sometimes third) wine, or are sold on to a négociant", correct: true }
        - { text: "They must be poured down the drain by law", correct: false }
        - { text: "They are relabelled as Sauternes", correct: false }
      explanation: |
        **Carruades de Lafite, Forts de Latour, Pagodes de Cos** — the
        named second wines. Surplus or lesser lots can also go to a
        **négociant** blend.
    fr:
      question: Qu’advient-il des lots qui manquent le grand vin chez un château de premier plan ?
      choices:
        - { text: "Ils doivent être distillés sur place en Cognac", correct: false }
        - { text: "Ils deviennent un second vin (parfois un troisième), ou partent chez un négociant", correct: true }
        - { text: "La loi exige de les jeter à l’égout", correct: false }
        - { text: "On les réétiquette en Sauternes", correct: false }
      explanation: |
        Ils deviennent un **second vin** (parfois un troisième), ou partent chez un **négociant**.
        **Carruades de Lafite, Forts de Latour, Pagodes de Cos** — les
        seconds vins nommés. Les lots de surplus ou plus faibles peuvent
        aussi rejoindre un assemblage de **négociant**.

  - id: bordeaux-barrique-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is top-end red Bordeaux usually aged?
      choices:
        - { text: "Only in 10 000 L foudres, never small oak", correct: false }
        - { text: "In 225-litre barriques, a share of them new", correct: true }
        - { text: "Only in bottle, with no barrel time", correct: false }
        - { text: "Only in stainless steel for twenty years", correct: false }
      explanation: |
        The **Bordeaux barrique is 225 L**. First growths may use a very
        high share of **new** oak; many serious wines sit nearer 30–60%.
        Not every château is 100% new.
    fr:
      question: Comment élève-t-on d’habitude un rouge de Bordeaux haut de gamme ?
      choices:
        - { text: "Seulement en foudres de 10 000 L, jamais en petit chêne", correct: false }
        - { text: "En barriques de 225 litres, dont une part de bois neuf", correct: true }
        - { text: "Seulement en bouteille, sans passage en fût", correct: false }
        - { text: "Seulement en inox pendant vingt ans", correct: false }
      explanation: |
        La **barrique bordelaise fait 225 L**. Les premiers crus peuvent
        employer une très forte part de chêne **neuf** ; beaucoup de vins
        sérieux restent vers 30–60 %. Tous les châteaux ne sont pas à
        100 % de neuf.

  - id: bordeaux-generic-no-oak-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How much barrel oak does generic Bordeaux AOC usually see?
      choices:
        - { text: "Three years in 100% new barriques", correct: false }
        - { text: "Little or none", correct: true }
        - { text: "A legal minimum of 24 months in new oak", correct: false }
        - { text: "Only acacia, never oak", correct: false }
      explanation: |
        Steel or concrete, then bottle. Chips or staves exist at the cheap
        end; **barrique ageing** is not the generic model.
    fr:
      question: Quelle part de chêne en barrique voit d’habitude un Bordeaux AOC générique ?
      choices:
        - { text: "Trois ans en barriques 100 % neuves", correct: false }
        - { text: "Peu ou pas", correct: true }
        - { text: "Un minimum légal de 24 mois en chêne neuf", correct: false }
        - { text: "Seulement de l’acacia, jamais du chêne", correct: false }
      explanation: |
        **Peu ou pas** de barrique.
        Inox ou béton, puis mise. Copeaux ou douelles existent au bas de
        gamme ; l’**élevage en barrique** n’est pas le modèle générique.

  - id: bordeaux-semillon-sweet-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape leads Bordeaux’s sweet wines?
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Sémillon", correct: true }
        - { text: "Pinot Gris", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        **Sémillon** thins its skins and takes noble rot. Sauvignon Blanc
        is the acid partner, not the volume lead, in Sauternes and Barsac.
    fr:
      question: Quel cépage mène les vins liquoreux de Bordeaux ?
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Sémillon", correct: true }
        - { text: "Pinot Gris", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        Le **Sémillon** amincit ses peaux et prend la pourriture noble. Le
        Sauvignon Blanc est le partenaire d’acidité, pas le volume, à
        Sauternes et à Barsac.

  - id: bordeaux-pl-blend-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0038
    review:
