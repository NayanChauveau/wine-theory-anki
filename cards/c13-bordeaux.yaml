  - id: bordeaux-semillon-botrytis-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does Sémillon lead a Sauternes blend?
      choices:
        - { text: "Its thick skins resist grey rot", correct: false }
        - { text: "Its thin skins take noble rot readily", correct: true }
        - { text: "Its high acidity balances the sugar", correct: false }
        - { text: "Its grapey perfume dominates the blend", correct: false }
      explanation: |
        **Thin skins → Botrytis**. Sauvignon Blanc is the acid partner;
        Muscadelle a perfume dash. Sémillon is the volume and the rot.
    fr:
      question: Pourquoi le Sémillon mène-t-il un assemblage de Sauternes ?
      choices:
        - { text: "Ses peaux épaisses résistent à la pourriture grise", correct: false }
        - { text: "Ses peaux fines prennent facilement la pourriture noble", correct: true }
        - { text: "Son acidité élevée équilibre le sucre", correct: false }
        - { text: "Son parfum muscaté domine l’assemblage", correct: false }
      explanation: |
        **Peaux fines → botrytis**. Le Sauvignon Blanc apporte l’acidité ; la Muscadelle, une
        touche de parfum. Le Sémillon fait le volume et porte la pourriture noble.

  - id: bordeaux-sauternes-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0128
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What keeps a top Sauternes from tasting syrupy?
      choices:
        - { text: "Low alcohol, around 8% abv", correct: false }
        - { text: "High acidity", correct: true }
        - { text: "Moderate sweetness, under 45 g/L sugar", correct: false }
        - { text: "Tannin from long skin contact", correct: false }
      explanation: |
        **Sweetness + acidity + botrytis + oak**. Apricot and citrus-peel
        notes meet toast and vanilla; alcohol is typically high (often
        13–14%+). Yquem is the extreme of that balance, not a different recipe.
    fr:
      question: Qu’est-ce qui empêche un grand Sauternes de paraître sirupeux ?
      choices:
        - { text: "Un degré faible, vers 8 % vol.", correct: false }
        - { text: "Une acidité élevée", correct: true }
        - { text: "Une douceur modérée, moins de 45 g/L de sucre", correct: false }
        - { text: "Des tanins issus d’une longue macération", correct: false }
      explanation: |
        **Sucre + acidité + botrytis + chêne**. Aux notes d’abricot et
        d’écorce d’agrumes répondent le pain grillé et la vanille ; l’alcool
        est généralement élevé (souvent 13–14 % et plus). Yquem pousse cet
        équilibre à l’extrême, sans suivre une autre recette.

