        - { text: "The Cru Bourgeois list", correct: false }
        - { text: "The Crus Artisans list", correct: false }
      explanation: |
        1855 ranks Médoc reds (plus Haut-Brion) and Sauternes. Graves has
        its **1950s** list. Saint-Émilion has a **revisable** château
        ranking. Pomerol has none. Cru Bourgeois and Crus Artisans are
        Médoc **below** 1855.
    fr:
      question: Outre la liste de 1855, quelles autres listes officielles classent les châteaux de tête à Bordeaux ?
      choices:
        - { text: "Un classement de Pomerol et une liste de Fronsac", correct: false }
        - { text: "Les classements de Saint-Émilion et des Graves", correct: true }
        - { text: "La liste des Crus Bourgeois", correct: false }
        - { text: "La liste des Crus Artisans", correct: false }
      explanation: |
        1855 range le Médoc (plus Haut-Brion) et les Sauternes. Les Graves
        ont leur liste des **années 1950**. Saint-Émilion a un classement
        de châteaux **révisable**. Pomerol n’a pas de liste officielle.
        Crus Bourgeois et Crus Artisans, c’est le Médoc **sous** 1855.

