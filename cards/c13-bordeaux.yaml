      sources: [known-fact]
    en:
      question: Which grape leads Bordeaux’s sweet wines?
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Sémillon", correct: true }
        - { text: "Muscadelle", correct: false }
        - { text: "Sauvignon Gris", correct: false }
      explanation: |
        **Sémillon** has thin skins and takes noble rot readily. Sauvignon Blanc is the acid
        partner, not the volume lead, in Sauternes and Barsac.
    fr:
      question: Quel cépage mène les vins liquoreux de Bordeaux ?
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Sémillon", correct: true }
        - { text: "Muscadelle", correct: false }
        - { text: "Sauvignon Gris", correct: false }
      explanation: |
        Le **Sémillon** a la peau fine et prend bien la pourriture noble. Le Sauvignon Blanc
        apporte l’acidité, pas le volume, à Sauternes et à Barsac.

  - id: bordeaux-pl-blend-001
