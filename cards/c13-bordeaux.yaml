      choices:
        - { text: "Miel et marmelade, venus de la pourriture noble", correct: false }
        - { text: "Des notes grillées et de noisette, venues du chêne", correct: true }
        - { text: "Des notes de pétrole, venues du vieillissement", correct: false }
        - { text: "Un parfum muscaté, proche du raisin frais", correct: false }
      explanation: |
        La fermentation et l’élevage en fût peuvent apporter des **notes grillées et de
        noisette**, tandis que le Sémillon donne du corps et de la texture. Les agrumes
        restent présents : le bois ne remplace pas le fruit.

  - id: bordeaux-sweet-botrytis-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fungus makes the great sweet wines of Sauternes and Barsac possible?
      choices:
        - { text: "Grey rot (Botrytis) on unripe or split fruit", correct: false }
        - { text: "Noble rot (Botrytis cinerea) on ripe grapes", correct: true }
        - { text: "Sour rot on damaged bunches", correct: false }
        - { text: "Powdery mildew (oidium) on the berries", correct: false }
      explanation: |
        Same fungus as grey rot: **Botrytis** on ripe fruit, misty mornings
        then dry afternoons. Persistently wet, or unripe berries, and it
        is grey rot. Cheaper sweet Bordeaux may just be late-picked.
    fr:
      question: Quel champignon rend possibles les grands liquoreux de Sauternes et de Barsac ?
      choices:
        - { text: "La pourriture grise (Botrytis) sur raisins pas mûrs ou fendus", correct: false }
        - { text: "La pourriture noble (Botrytis cinerea) sur raisins mûrs", correct: true }
        - { text: "La pourriture acide des grappes déjà abîmées", correct: false }
        - { text: "L’oïdium de fin de saison sur les baies", correct: false }
      explanation: |
        Même champignon que la pourriture grise : le **botrytis** sur
        raisins mûrs, brume le matin puis après-midi sec. Trop d’eau, ou
        baies encore vertes, et c’est de la grise. Un liquoreux bordelais
        moins cher peut n’être que vendangé tard.

  - id: bordeaux-sweet-oak-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How long may a top Sauternes stay in (often new) barriques after ferment?
      choices:
        - { text: "Up to about six months", correct: false }
        - { text: "Up to about three years", correct: true }
        - { text: "Up to about one year", correct: false }
        - { text: "At least five years, by law", correct: false }
      explanation: |
        Top Sauternes is often **fermented and matured in barrique**.
        **Yquem** is the three-year poster child; many crus classés sit
        nearer 18–24 months, and not every lot is 100% new oak.
    fr:
      question: Combien de temps un grand Sauternes peut-il rester en barriques (souvent neuves) après la fermentation ?
      choices:
        - { text: "Jusqu’à environ six mois", correct: false }
        - { text: "Jusqu’à environ trois ans", correct: true }
        - { text: "Jusqu’à environ un an", correct: false }
        - { text: "Au moins cinq ans, de par la loi", correct: false }
      explanation: |
        Les grands Sauternes sont souvent **fermentés puis élevés en
        barrique**. **Yquem** est l’exemple emblématique des trois ans ;
        beaucoup de crus classés restent plutôt 18–24 mois et tous les
        lots ne voient pas uniquement des barriques neuves.

  - id: bordeaux-rivers-001
