cards:
  - id: bordeaux-left-bank-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    en:
      question: Which grape typically dominates Left Bank Bordeaux blends (Médoc and Graves)?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        The gravel soils of the **Médoc and Graves** favour **Cabernet Sauvignon**, which usually leads
        the blend. Merlot is the main grape on the clay-limestone Right Bank
        (Saint-Émilion, Pomerol).
    fr:
      question: Quel cépage domine généralement les assemblages de rive gauche (Médoc et Graves) ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        Les **graves** du Médoc et des **Graves** conviennent au **Cabernet Sauvignon**, qui mène
        souvent l’assemblage. Le Merlot domine la rive droite argilo-calcaire
        (Saint-Émilion, Pomerol).

  - id: bordeaux-right-bank-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    en:
      question: Which pair of appellations is on the Right Bank and typically Merlot-led?
      choices:
        - { text: "Pauillac and Margaux", correct: false }
        - { text: "Pessac-Léognan and Sauternes", correct: false }
        - { text: "Saint-Émilion and Pomerol", correct: true }
        - { text: "Entre-Deux-Mers and Graves", correct: false }
      explanation: |
        **Saint-Émilion** and **Pomerol** sit on the Right Bank (Libournais). Merlot dominates because
        the cooler clay and limestone soils ripen it more reliably than Cabernet Sauvignon.
        Pauillac and Margaux are Left Bank Médoc communes.
    fr:
      question: Quel couple d’appellations se trouve sur la rive droite et est généralement mené par le Merlot ?
      choices:
        - { text: "Pauillac et Margaux", correct: false }
        - { text: "Pessac-Léognan et Sauternes", correct: false }
        - { text: "Saint-Émilion et Pomerol", correct: true }
        - { text: "Entre-Deux-Mers et Graves", correct: false }
      explanation: |
        **Saint-Émilion** et **Pomerol** sont sur la rive droite (Libournais). Le Merlot y domine
        car les sols plus froids d’argile et de calcaire le mûrissent plus sûrement que le
        Cabernet Sauvignon. Pauillac et Margaux sont des communes du Médoc, rive gauche.

  - id: bordeaux-largest-aoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which French AOC wine region produces the most wine?
      choices:
        - { text: "Champagne", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Rhône Valley", correct: false }
        - { text: "Burgundy", correct: false }
      explanation: |
        **Bordeaux** is the giant by **volume** (and planted area) among French
        AOCs. **Champagne** usually beats it on export **value**. A large IGP
        such as Pays d’Oc can also move huge hectolitres — that is not an AOC.
    fr:
      question: Quel vignoble français d’AOC produit le plus gros volume de vin ?
      choices:
        - { text: "Champagne", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Vallée du Rhône", correct: false }
        - { text: "Bourgogne", correct: false }
      explanation: |
        **Bordeaux** est le géant en **volume** (et en superficie) parmi les
        AOC françaises. **Champagne** le dépasse souvent en **valeur** à
        l’export. Une IGP vaste comme le Pays d’Oc peut aussi bouger d’énormes
        hectolitres — ce n’est pas une AOC.

  - id: bordeaux-climate-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How should you label the Gironde’s climate?
      choices:
        - { text: "Cool continental", correct: false }
        - { text: "Moderate maritime", correct: true }
        - { text: "Warm maritime", correct: false }
        - { text: "Warm Mediterranean", correct: false }
      explanation: |
        The **Atlantic** keeps winters mild and summers moderate. That is
        **moderate maritime**, not a landlocked continental swing.
    fr:
      question: Comment qualifier le climat de la Gironde ?
      choices:
        - { text: "Continental frais", correct: false }
        - { text: "Maritime tempéré", correct: true }
        - { text: "Maritime chaud", correct: false }
        - { text: "Méditerranéen chaud", correct: false }
      explanation: |
        L’**Atlantique** adoucit les hivers et tempère les étés. C’est un
        climat **maritime tempéré**, pas un continental enclavé.

  - id: bordeaux-gulf-stream-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gulf Stream do for Bordeaux’s growing season?
      choices:
        - { text: "It shortens it", correct: false }
        - { text: "It lengthens it", correct: true }
        - { text: "It has no effect on its length", correct: false }
        - { text: "It makes the climate more continental", correct: false }
      explanation: |
        Warm ocean water arriving from the Caribbean **stretches** the season
        so late varieties can still finish.
    fr:
      question: Quel effet le Gulf Stream a-t-il sur la saison végétative à Bordeaux ?
      choices:
        - { text: "Il la raccourcit", correct: false }
        - { text: "Il l’allonge", correct: true }
        - { text: "Il n’a aucun effet sur sa durée", correct: false }
        - { text: "Il la rend plus continentale", correct: false }
      explanation: |
        L’eau océanique chaude venue des Caraïbes étire la saison
        végétative, ce qui permet aux cépages tardifs de finir leur
        maturité.

  - id: bordeaux-october-ripen-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In a late-ripening year, into which month can Cabernet still be hanging?
      choices:
        - { text: "Into August", correct: false }
        - { text: "Into October", correct: true }
        - { text: "Into November", correct: false }
        - { text: "Into June", correct: false }
      explanation: |
        Cabernet Sauvignon in particular can hang **into October**. That is
        why autumn rain is a vintage-maker.
    fr:
      question: Dans un millésime tardif, jusqu’à quel mois le Cabernet peut-il encore rester à la vigne ?
      choices:
        - { text: "Jusqu’en août", correct: false }
        - { text: "Jusqu’en octobre", correct: true }
        - { text: "Jusqu’en novembre", correct: false }
        - { text: "Jusqu’en juin", correct: false }
      explanation: |
        Le Cabernet Sauvignon surtout peut rester sur pied **jusqu’en
        octobre**. D’où le rôle décisif de la pluie d’automne sur le
        millésime.

  - id: bordeaux-frost-rare-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gulf Stream mainly spare the Gironde from in an average year?
      choices:
        - { text: "Summer hail storms", correct: false }
        - { text: "Widespread spring frost", correct: true }
        - { text: "Rain at harvest time", correct: false }
        - { text: "Humidity and fungal disease", correct: false }
      explanation: |
        Mild Atlantic air makes **widespread spring frost** less common than in Chablis or
        Champagne. It is not a guarantee: **2017** and **2021** still froze large parts of the
        vineyard. Rain, humidity and hail remain regular threats.
    fr:
      question: De quoi le Gulf Stream préserve-t-il surtout la Gironde une année moyenne ?
      choices:
        - { text: "Les orages de grêle en été", correct: false }
        - { text: "Un gel de printemps généralisé", correct: true }
        - { text: "La pluie à la vendange", correct: false }
        - { text: "L’humidité et les maladies fongiques", correct: false }
      explanation: |
        L’air atlantique doux rend un **gel de printemps généralisé** moins fréquent qu’à
        Chablis ou en Champagne. Ce n’est pas une garantie : **2017** et **2021** ont quand
        même gelé de vastes pans du vignoble. Pluie, humidité et grêle restent des menaces
        régulières.

  - id: bordeaux-atlantic-rain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does sitting next to the Atlantic do to Bordeaux weather?
      choices:
        - { text: "It dries out the summers", correct: false }
        - { text: "It brings a lot of rain and humidity", correct: true }
        - { text: "It creates a Mediterranean climate", correct: false }
        - { text: "It brings cold, harsh winters", correct: false }
      explanation: |
        **Wet air and frequent rain** are the maritime tax. Humidity also
        feeds rot.
    fr:
      question: Que change la proximité de l’Atlantique au temps bordelais ?
      choices:
        - { text: "Elle assèche les étés", correct: false }
        - { text: "Elle apporte beaucoup de pluie et d’humidité", correct: true }
        - { text: "Elle crée un climat méditerranéen", correct: false }
        - { text: "Elle apporte des hivers froids et rigoureux", correct: false }
      explanation: |
        Air humide et pluies fréquentes sont le revers du climat maritime. L’humidité favorise
        aussi la pourriture.

  - id: bordeaux-landes-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two natural barriers soften Atlantic winds before they reach the Médoc vineyards?
      choices:
        - { text: "The Landes forest and the Pyrenees", correct: false }
        - { text: "The Landes forest and the dunes", correct: true }
        - { text: "The coastal dunes and the Garonne", correct: false }
        - { text: "The Gironde estuary and its marshes", correct: false }
      explanation: |
        The **Landes** pine belt and the **dunes** sit between the ocean and
        the vines. They do not stop rain; they knock the edge off the wind.
    fr:
      question: Quelles deux barrières naturelles atténuent les vents atlantiques avant qu’ils n’atteignent les vignes du Médoc ?
      choices:
        - { text: "La forêt des Landes et les Pyrénées", correct: false }
        - { text: "La forêt des Landes et les dunes", correct: true }
        - { text: "Les dunes littorales et la Garonne", correct: false }
        - { text: "L’estuaire de la Gironde et ses marais", correct: false }
      explanation: |
        **La forêt des Landes et les dunes** se dressent entre
        l’océan et les vignes. Elles n’arrêtent pas la pluie ; elles cassent
        la force du vent.

  - id: bordeaux-rain-risks-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can frequent rain spoil a Bordeaux vintage?
      choices:
        - { text: "It delays budbreak but protects flowering and harvest", correct: false }
        - { text: "It wrecks flowering, feeds rot, or dilutes fruit", correct: true }
        - { text: "It reduces flowering but concentrates fruit at harvest", correct: false }
        - { text: "It improves flowering but blocks ripening through drought", correct: false }
      explanation: |
        Three separate hits: **coulure / millerandage** at flower, **rot** in
        a wet summer, **dilution** if it pours at harvest.
    fr:
      question: Comment la pluie fréquente peut-elle gâcher un millésime bordelais ?
      choices:
        - { text: "Elle retarde le débourrement mais protège la floraison et la vendange", correct: false }
        - { text: "Elle ruine la fleur, nourrit la pourriture ou dilue le fruit", correct: true }
        - { text: "Elle réduit la floraison mais concentre le fruit à la vendange", correct: false }
        - { text: "Elle favorise la floraison mais bloque la maturité par sécheresse", correct: false }
      explanation: |
        Trois coups distincts : **coulure / millerandage** à la fleur,
        **pourriture** un été humide, **dilution** s’il pleut fort à la vendange.

  - id: bordeaux-vintage-rain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which weather hazard is the classic reason Bordeaux vintages vary so much?
      choices:
        - { text: "Spring frost", correct: false }
        - { text: "Rain", correct: true }
        - { text: "Summer heatwaves", correct: false }
        - { text: "Hail", correct: false }
      explanation: |
        Rain at flowering cuts the crop, a wet summer feeds rot, and rain at harvest dilutes
        the fruit. That lottery is the main reason 2013 and 2018 do not taste like twins.
        Frost, hail and heat spikes matter too, but less regularly.
    fr:
      question: Quel aléa climatique explique classiquement que les millésimes bordelais varient autant ?
      choices:
        - { text: "Le gel de printemps", correct: false }
        - { text: "La pluie", correct: true }
        - { text: "Les canicules d’été", correct: false }
        - { text: "La grêle", correct: false }
      explanation: |
        La pluie à la fleur réduit la récolte, un été humide nourrit la pourriture et la pluie
        à la vendange dilue le fruit. Cette loterie explique surtout que 2013 et 2018 ne se
        ressemblent pas. Gel, grêle et pics de chaleur comptent aussi, mais moins
        régulièrement.

  - id: bordeaux-sorting-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do ambitious châteaux reduce the quality swing from one Bordeaux vintage to the next?
      choices:
        - { text: "By picking everything before the autumn rain", correct: false }
        - { text: "By rejecting diseased and unripe fruit", correct: true }
        - { text: "By ageing the wine longer in new oak", correct: false }
        - { text: "By lowering the planting density", correct: false }
      explanation: |
        **Table sorting** (and optical sorters at the top addresses) keep
        green and rotten berries out of the grand vin. Second wines absorb
        the rest.
    fr:
      question: Comment les châteaux ambitieux réduisent-ils l’écart de qualité d’un millésime bordelais à l’autre ?
      choices:
        - { text: "En vendangeant tout avant les pluies d’automne", correct: false }
        - { text: "En écartant les raisins malades et les raisins verts", correct: true }
        - { text: "En allongeant l’élevage en fût neuf", correct: false }
        - { text: "En réduisant la densité de plantation", correct: false }
      explanation: |
        Le **tri sur table** (et les trieuses optiques chez les plus grandes adresses) tient
        les baies vertes et pourries hors du grand vin. Les seconds vins absorbent le reste.

  - id: bordeaux-canopy-health-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which vineyard practices have helped Bordeaux growers improve average ripeness and grape health?
      choices:
        - { text: "Lower planting density and irrigation", correct: false }
        - { text: "Better canopy work and targeted sprays", correct: true }
        - { text: "Heavier fertilising and later pruning", correct: false }
        - { text: "Earlier picking and machine harvesting", correct: false }
      explanation: |
        Open canopies dry the fruit and ripen it. Growers still spray — they
        just **spray less blindly**. Do not read that as “Bordeaux went
        spray-free”.
    fr:
      question: Quelles pratiques viticoles ont aidé les producteurs bordelais à améliorer la maturité et l’état sanitaire des raisins ?
      choices:
        - { text: "Une densité plus faible et l’irrigation", correct: false }
        - { text: "Une meilleure gestion du feuillage et des traitements ciblés", correct: true }
        - { text: "Une fertilisation plus forte et une taille plus tardive", correct: false }
        - { text: "Une vendange plus précoce et mécanisée", correct: false }
      explanation: |
        Un feuillage ouvert sèche le fruit et le mûrit. On traite encore —
        on **traite moins à l’aveugle**. Cela ne veut pas dire que Bordeaux
        est devenu sans traitement.

  - id: bordeaux-blended-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do almost all red Bordeaux, and most of the whites, have in common?
      choices:
        - { text: "They are made from a single variety", correct: false }
        - { text: "They are blends of several varieties", correct: true }
        - { text: "They are aged in new oak barriques", correct: false }
        - { text: "They come from classified châteaux", correct: false }
      explanation: |
        **Assemblage** is the Bordeaux norm. A 100% Merlot Pomerol exists, but it is the
        exception.
    fr:
      question: Qu’ont en commun presque tous les rouges de Bordeaux, et la plupart des blancs ?
      choices:
        - { text: "Ils sont issus d’un seul cépage", correct: false }
        - { text: "Ils sont issus d’un assemblage de cépages", correct: true }
        - { text: "Ils sont élevés en barriques neuves", correct: false }
        - { text: "Ils viennent de châteaux classés", correct: false }
      explanation: |
        L’**assemblage** est la règle à Bordeaux. Un Pomerol 100 % Merlot existe, mais c’est
        l’exception.

  - id: bordeaux-blend-why-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the main reason Bordeaux growers plant and blend several varieties?
      choices:
        - { text: "The AOC rules require at least three varieties", correct: false }
        - { text: "The weather is too unreliable to rely on one variety", correct: true }
        - { text: "Single-variety wines cannot carry a château name", correct: false }
        - { text: "Blended wines can be released earlier", correct: false }
      explanation: |
        A cold wet week can wreck **one** flowering. A second variety that
        flowers later still has a crop.
    fr:
      question: Pour quelle raison principale plante-t-on et assemble-t-on plusieurs cépages à Bordeaux ?
      choices:
        - { text: "Le cahier des charges impose au moins trois cépages", correct: false }
        - { text: "Le temps est trop irrégulier pour miser sur un seul cépage", correct: true }
        - { text: "Un vin de cépage unique ne peut pas porter un nom de château", correct: false }
        - { text: "Les vins d’assemblage peuvent être commercialisés plus tôt", correct: false }
      explanation: |
        Une semaine froide et humide peut ruiner **une** floraison. Un second
        cépage qui fleurit plus tard garde une récolte.

  - id: bordeaux-staggered-ripen-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does a Merlot–Cabernet mix actually work in Bordeaux?
      choices:
        - { text: "They all flower and ripen together", correct: false }
        - { text: "They flower and ripen on different clocks", correct: true }
        - { text: "Only Merlot is late-ripening", correct: false }
        - { text: "Cabernet flowers before Merlot", correct: false }
      explanation: |
        **Merlot** flowers and ripens first; **Cabernet Sauvignon** last.
        A May storm or an October downpour usually hits one, not both.
    fr:
      question: Pourquoi un assemblage Merlot–Cabernet fonctionne-t-il vraiment à Bordeaux ?
      choices:
        - { text: "Ils fleurissent et mûrissent tous ensemble", correct: false }
        - { text: "Ils fleurissent et mûrissent selon des calendriers différents", correct: true }
        - { text: "Seul le Merlot a un cycle tardif", correct: false }
        - { text: "Le Cabernet fleurit avant le Merlot", correct: false }
      explanation: |
        Le **Merlot** fleurit et mûrit le premier ; le **Cabernet Sauvignon**
        le dernier. Un orage de mai ou une averse d’octobre touche en
        général l’un, pas les deux.

  - id: bordeaux-varieties-count-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many grape varieties did the Bordeaux AOC list allow before the 2021 additions?
      choices:
        - { text: "Five", correct: false }
        - { text: "Thirteen", correct: true }
        - { text: "Twenty", correct: false }
        - { text: "Seven", correct: false }
      explanation: |
        The historic set is **thirteen**. In **2021** INAO added Touriga
        Nacional, Marselan, Castets, Arinarnoa, Alvarinho and Liliorila to
        Bordeaux / Bordeaux Supérieur — not to every communal AOC.
    fr:
      question: Combien de cépages le cahier des charges de l’AOC Bordeaux autorisait-il avant les ajouts de 2021 ?
      choices:
        - { text: "Cinq", correct: false }
        - { text: "Treize", correct: true }
        - { text: "Vingt", correct: false }
        - { text: "Sept", correct: false }
      explanation: |
        L’ensemble historique compte **treize**. En **2021**, l’INAO a ajouté
        Touriga Nacional, Marselan, Castets, Arinarnoa, Alvarinho et
        Liliorila à Bordeaux / Bordeaux Supérieur — pas à chaque AOC
        communale.

  - id: bordeaux-five-main-count-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many grape varieties account for most Bordeaux wine production?
      choices:
        - { text: "Four black and two white", correct: false }
        - { text: "Three black and two white", correct: true }
        - { text: "Two black and three white", correct: false }
        - { text: "Four black and one white", correct: false }
      explanation: |
        **Cabernet Sauvignon, Merlot, Cabernet Franc** plus **Sémillon** and
        **Sauvignon Blanc**. Petit Verdot, Malbec, Carmenère and Muscadelle
        are supporting grapes.
    fr:
      question: Combien de cépages assurent l’essentiel de la production bordelaise ?
      choices:
        - { text: "Quatre noirs et deux blancs", correct: false }
        - { text: "Trois noirs et deux blancs", correct: true }
        - { text: "Deux noirs et trois blancs", correct: false }
        - { text: "Quatre noirs et un blanc", correct: false }
      explanation: |
        Cinq cépages courants : **Cabernet Sauvignon, Merlot, Cabernet
        Franc** plus **Sémillon** et **Sauvignon Blanc**. Petit Verdot,
        Malbec, Carmenère et Muscadelle restent des cépages d’appoint.

  - id: bordeaux-five-named-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which five grapes do most Bordeaux wines actually rely on?
      choices:
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Petit Verdot, Malbec", correct: false }
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Sémillon, Sauvignon Blanc", correct: true }
        - { text: "Sémillon, Sauvignon Blanc, Muscadelle, Sauvignon Gris, Colombard", correct: false }
        - { text: "Merlot, Cabernet Franc, Cabernet Sauvignon, Carmenère, Malbec", correct: false }
      explanation: |
        The Left Bank leans **Cabernet Sauvignon**; the Right Bank **Merlot**.
        **Cabernet Franc** is often the supporting grape. Dry and sweet whites are
        **Sémillon** and **Sauvignon Blanc**.
    fr:
      question: Sur quels cinq cépages s’appuient réellement la plupart des vins de Bordeaux ?
      choices:
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Petit Verdot, Malbec", correct: false }
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Sémillon, Sauvignon Blanc", correct: true }
        - { text: "Sémillon, Sauvignon Blanc, Muscadelle, Sauvignon Gris, Colombard", correct: false }
        - { text: "Merlot, Cabernet Franc, Cabernet Sauvignon, Carmenère, Malbec", correct: false }
      explanation: |
        La rive gauche penche vers le **Cabernet Sauvignon** ; la rive droite
        vers le **Merlot**. Le **Cabernet Franc** entre souvent en appoint. Les
        blancs secs et liquoreux reposent sur **Sémillon** et **Sauvignon
        Blanc**.

  - id: bordeaux-cs-haut-medoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where in Bordeaux does Cabernet Sauvignon most clearly lead the blend?
      choices:
        - { text: "Pomerol’s clay plateau", correct: false }
        - { text: "The Haut-Médoc", correct: true }
        - { text: "Saint-Émilion’s limestone côte", correct: false }
        - { text: "Entre-Deux-Mers", correct: false }
      explanation: |
        Warm **gravel in the Haut-Médoc** communes (Margaux through
        Saint-Estèphe) is Cabernet country. Pomerol is Merlot’s home.
    fr:
      question: Où, à Bordeaux, le Cabernet Sauvignon mène-t-il le plus nettement l’assemblage ?
      choices:
        - { text: "Le plateau argileux de Pomerol", correct: false }
        - { text: "Le Haut-Médoc", correct: true }
        - { text: "La côte calcaire de Saint-Émilion", correct: false }
        - { text: "L’Entre-Deux-Mers", correct: false }
      explanation: |
        Les **graves chaudes du Haut-Médoc** (de Margaux à Saint-Estèphe)
        sont le pays du Cabernet. Pomerol est le fief du Merlot.

  - id: bordeaux-cs-also-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Outside the leading Haut-Médoc communes, where else does Cabernet Sauvignon remain an important blending grape?
      choices:
        - { text: "Pomerol and the Saint-Émilion sandy plain", correct: false }
        - { text: "The Médoc AOC (old Bas-Médoc) and Graves", correct: true }
        - { text: "Sauternes and Barsac", correct: false }
        - { text: "Entre-Deux-Mers and the Côtes de Bordeaux", correct: false }
      explanation: |
        **Graves / Pessac-Léognan** gravel also ripens Cabernet. The cooler
        **Médoc AOC** (north of Saint-Estèphe, once called Bas-Médoc) still
        plants it, but Merlot often takes a bigger share there — do not say
        it “dominates” the way it does in Pauillac.
    fr:
      question: En dehors des principales communes du Haut-Médoc, où le Cabernet Sauvignon reste-t-il un cépage d’assemblage important ?
      choices:
        - { text: "Pomerol et la plaine sablonneuse de Saint-Émilion", correct: false }
        - { text: "L’AOC Médoc (l’ancien Bas-Médoc) et les Graves", correct: true }
        - { text: "Sauternes et Barsac", correct: false }
        - { text: "L’Entre-Deux-Mers et les Côtes de Bordeaux", correct: false }
      explanation: |
        À **Pessac-Léognan** comme dans les **Graves**, les graves mûrissent aussi le
        Cabernet. L’**AOC Médoc** plus fraîche (au nord de Saint-Estèphe,
        jadis Bas-Médoc) en plante encore, mais le Merlot y prend souvent
        une plus grande part — on ne dira pas qu’il « domine » comme à
        Pauillac.

  - id: bordeaux-cs-gravel-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does Cabernet Sauvignon ripen especially well on Left Bank gravel?
      choices:
        - { text: "The stones keep the soil cool and retain water", correct: false }
        - { text: "Gravel warms the vineyard and drains it", correct: true }
        - { text: "Gravel delays ripening by reflecting away heat", correct: false }
        - { text: "The stones increase fertility and vine vigour", correct: false }
      explanation: |
        **Gravel** (the stones) stores heat and sheds water. Cabernet needs
        both. Cool clay on the Right Bank leaves it green in many years;
        Merlot is the safer bet there.
    fr:
      question: Pourquoi le Cabernet Sauvignon mûrit-il particulièrement bien sur les graves de rive gauche ?
      choices:
        - { text: "Les cailloux gardent le sol frais et retiennent l’eau", correct: false }
        - { text: "Les graves réchauffent et drainent le vignoble", correct: true }
        - { text: "Les graves retardent la maturité en renvoyant la chaleur", correct: false }
        - { text: "Les cailloux augmentent la fertilité et la vigueur", correct: false }
      explanation: |
        Les graves emmagasinent la chaleur et évacuent l’eau. Le Cabernet
        a besoin des deux. L’argile fraîche de rive droite le laisse
        souvent vert ; le Merlot y est le pari plus sûr.

  - id: bordeaux-cs-share-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In Haut-Médoc and Graves, how high can Cabernet Sauvignon’s share of a blend go?
      choices:
        - { text: "Around a quarter", correct: false }
        - { text: "Around three-quarters", correct: true }
        - { text: "Around a third", correct: false }
        - { text: "Around half", correct: false }
      explanation: |
        **About 75%** is a typical Left Bank ceiling in a good Cabernet year,
        not a legal cap. Some classed growths go higher; many sit nearer
        60–70% with Merlot filling the rest.
    fr:
      question: Dans le Haut-Médoc et les Graves, jusqu’où peut aller la part de Cabernet Sauvignon dans un assemblage ?
      choices:
        - { text: "Environ un quart", correct: false }
        - { text: "Environ les trois quarts", correct: true }
        - { text: "Environ un tiers", correct: false }
        - { text: "Environ la moitié", correct: false }
      explanation: |
        Près de 75 % est un plafond typique de rive gauche lors d’une
        bonne année à Cabernet, pas un plafond légal. Certains crus
        classés vont plus haut ; beaucoup restent vers 60–70 %, le
        Merlot comblant le reste.

  - id: bordeaux-cf-where-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Bordeaux AOC is Cabernet Franc’s main address?
      choices:
        - { text: "Pomerol", correct: false }
        - { text: "Saint-Émilion", correct: true }
        - { text: "Pessac-Léognan", correct: false }
        - { text: "Pauillac", correct: false }
      explanation: |
        **Saint-Émilion** is Franc’s home (Cheval Blanc, Ausone). It is a
        supporting grape on the Left Bank, not the lead.
    fr:
      question: Quelle AOC bordelaise est la principale adresse du Cabernet Franc ?
      choices:
        - { text: "Pomerol", correct: false }
        - { text: "Saint-Émilion", correct: true }
        - { text: "Pessac-Léognan", correct: false }
        - { text: "Pauillac", correct: false }
      explanation: |
        **Saint-Émilion** est le fief du Franc (Cheval Blanc, Ausone). Sur
        la rive gauche, c’est un cépage d’appoint, pas le meneur.

  - id: bordeaux-cf-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Compared with Cabernet Sauvignon, what does ripe Cabernet Franc usually bring to the blend?
      choices:
        - { text: "Heavier body and more tannin", correct: false }
        - { text: "Less body and tannin, more floral fruit", correct: true }
        - { text: "More alcohol and less acidity", correct: false }
        - { text: "More colour and a later ripening date", correct: false }
      explanation: |
        Franc is the **perfume and lift**, not the tannic spine. It ripens earlier and gives
        less colour than Cabernet Sauvignon; picked too early it turns stalky, the same green
        trap.
    fr:
      question: Face au Cabernet Sauvignon, qu’apporte généralement un Cabernet Franc mûr à l’assemblage ?
      choices:
        - { text: "Plus de corps et plus de tanin", correct: false }
        - { text: "Moins de corps et de tanin, un fruit plus floral", correct: true }
        - { text: "Plus d’alcool et moins d’acidité", correct: false }
        - { text: "Plus de couleur et une maturité plus tardive", correct: false }
      explanation: |
        Le Cabernet Franc apporte **parfum et fraîcheur**, pas la charpente tannique. Il mûrit
        plus tôt et donne moins de couleur que le Cabernet Sauvignon ; vendangé trop tôt, il
        devient végétal, le même piège.

  - id: bordeaux-cf-soil-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can Cabernet Franc ripen on Saint-Émilion limestone where Cabernet Sauvignon often fails?
      choices:
        - { text: "Limestone is hotter than Médoc gravel", correct: false }
        - { text: "It ripens earlier on cooler limestone", correct: true }
        - { text: "It ripens later than Cabernet Sauvignon", correct: false }
        - { text: "It needs more heat than Cabernet Sauvignon", correct: false }
      explanation: |
        Limestone is **drained but cooler** than Left Bank gravel. Franc’s
        **shorter cycle** finishes there; Cabernet Sauvignon often stays
        green. Warm gravel still suits Franc — it is not a cold-climate grape.
    fr:
      question: Pourquoi le Cabernet Franc peut-il mûrir sur le calcaire de Saint-Émilion là où le Cabernet Sauvignon échoue souvent ?
      choices:
        - { text: "Le calcaire est plus chaud que les graves du Médoc", correct: false }
        - { text: "Il mûrit plus tôt sur un calcaire plus frais", correct: true }
        - { text: "Il mûrit plus tard que le Cabernet Sauvignon", correct: false }
        - { text: "Il exige plus de chaleur que le Cabernet Sauvignon", correct: false }
      explanation: |
        Le calcaire est **drainé mais plus frais** que les graves de rive
        gauche. Le **cycle plus court** du Franc s’y termine ; le Cabernet
        Sauvignon reste souvent vert. Les graves chaudes conviennent aussi
        au Franc — ce n’est pas un cépage de climat froid.

  - id: bordeaux-merlot-most-planted-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which black grape occupies more Bordeaux hectares than any other?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        **Merlot** is more than half the vineyard. Cabernet Sauvignon is
        second, then Cabernet Franc; none of them overtake Merlot. It
        ripens earlier, so it is the safer plant on clay and in generic
        Bordeaux AOC.
    fr:
      question: Quel cépage noir occupe plus d’hectares à Bordeaux que tout autre ?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        Le **Merlot** couvre plus de la moitié du vignoble. Le Cabernet
        Sauvignon est deuxième, puis le Cabernet Franc ; aucun ne dépasse
        le Merlot. Plus précoce, il est le plant plus sûr sur l’argile et
        en AOC Bordeaux générique.

  - id: bordeaux-merlot-premium-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In which two AOCs is Merlot the lead grape of the top reds?
      choices:
        - { text: "Saint-Émilion and Pauillac", correct: false }
        - { text: "Saint-Émilion and Pomerol", correct: true }
        - { text: "Pauillac and Margaux", correct: false }
        - { text: "Pomerol and Saint-Julien", correct: false }
      explanation: |
        **Pétrus** and **Le Pin** are Merlot houses. **Cheval Blanc** is
        Franc-led; **Ausone** is a Merlot–Franc pair — so not every Right
        Bank icon is a Merlot monologue. Left Bank first growths remain
        Cabernet houses.
    fr:
      question: Dans quelles deux AOC le Merlot mène-t-il les grands rouges ?
      choices:
        - { text: "Saint-Émilion et Pauillac", correct: false }
        - { text: "Saint-Émilion et Pomerol", correct: true }
        - { text: "Pauillac et Margaux", correct: false }
        - { text: "Pomerol et Saint-Julien", correct: false }
      explanation: |
        **Pétrus** et **Le Pin** sont des maisons à Merlot. **Cheval Blanc**
        est mené par le Franc ; **Ausone** couple Merlot et Franc — toutes les
        icônes de rive droite ne sont donc pas un monologue de Merlot. Les
        premiers crus de rive gauche restent des maisons à Cabernet.

  - id: bordeaux-merlot-clay-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why plant Merlot rather than Cabernet Sauvignon on Saint-Émilion and Pomerol clay?
      choices:
        - { text: "Merlot buds later and so escapes frost on clay", correct: false }
        - { text: "Merlot can still ripen on that cooler clay", correct: true }
        - { text: "Clay is too fertile for Cabernet Sauvignon to set fruit", correct: false }
        - { text: "Cabernet Sauvignon ripens too quickly on warm clay", correct: false }
      explanation: |
        Clay stays **cold and wet**. Merlot’s earlier cycle finishes; Cabernet
        Sauvignon’s does not, except on warmer gravel pockets (Figeac).
    fr:
      question: Pourquoi planter du Merlot plutôt que du Cabernet Sauvignon sur les argiles de Saint-Émilion et de Pomerol ?
      choices:
        - { text: "Le Merlot débourre plus tard et échappe au gel sur l’argile", correct: false }
        - { text: "Le Merlot peut encore mûrir sur cette argile plus fraîche", correct: true }
        - { text: "L’argile est trop fertile pour que le Cabernet Sauvignon noue", correct: false }
        - { text: "Le Cabernet Sauvignon mûrit trop vite sur une argile chaude", correct: false }
      explanation: |
        L’argile reste **froide et humide**. Le cycle plus précoce du Merlot s’y termine ;
        celui du Cabernet Sauvignon non, sauf sur des poches de graves plus chaudes (Figeac).

  - id: bordeaux-merlot-volume-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape usually dominates inexpensive, high-volume Bordeaux rouge?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        **Merlot** gives earlier sugar, lower tannin, and a crop on clay —
        useful for Bordeaux AOC sold in the first year. Softness is the
        tasting reason; reliability is the economic one.
    fr:
      question: Quel cépage domine généralement les Bordeaux rouges bon marché produits en gros volume ?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        Le **Merlot** donne du sucre plus tôt, moins de tanin, et une
        récolte sur l’argile — utile pour un Bordeaux AOC vendu dès la
        première année. La souplesse est la raison de dégustation ; la
        fiabilité, la raison économique.

  - id: bordeaux-pv-hot-years-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Bordeaux grape used to ripen fully only in the hottest summers?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Petit Verdot", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        **Petit Verdot** is late. In cooler decades it was a 1–3% supporting grape. Warmer
        vintages now ripen it more often — do not say it *never* ripens today.
    fr:
      question: Quel cépage bordelais ne mûrissait pleinement, autrefois, que les étés les plus chauds ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Petit Verdot", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        Le **Petit Verdot** est tardif. Dans les décennies plus fraîches, il n’entrait qu’en
        appoint, à 1–3 %. Les millésimes plus chauds le mûrissent plus souvent — on ne dira
        pas qu’il ne mûrit *jamais* aujourd’hui.

  - id: bordeaux-pv-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does ripe Petit Verdot usually add in colour and tannin?
      choices:
        - { text: "Pale colour and soft tannin", correct: false }
        - { text: "Deep colour and firm tannin", correct: true }
        - { text: "Deep colour but very soft tannin", correct: false }
        - { text: "Pale colour but firm tannin", correct: false }
      explanation: |
        **Ink and structure** — a supporting grape that evolves slowly in bottle. **Château
        Palmer** has used a visible share; most Left Bank blends keep it to a few percent.
    fr:
      question: Qu’apporte d’habitude un Petit Verdot mûr en couleur et en tanin ?
      choices:
        - { text: "Une robe pâle et un tanin souple", correct: false }
        - { text: "Une robe profonde et un tanin ferme", correct: true }
        - { text: "Une robe profonde mais un tanin très souple", correct: false }
        - { text: "Une robe pâle mais un tanin ferme", correct: false }
      explanation: |
        **Encre et structure** — un cépage d’appoint, qui évolue lentement en bouteille.
        **Château Palmer** en a utilisé une part visible ; la plupart des assemblages de rive
        gauche s’en tiennent à quelques pour cent.

  - id: bordeaux-pv-role-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a splash of Petit Verdot add to a Left Bank blend?
      choices:
        - { text: "Paler colour, softer tannin and lower acidity", correct: false }
        - { text: "Colour, tannin and a spicy note", correct: true }
        - { text: "Body, sweetness and a lower alcohol level", correct: false }
        - { text: "Floral perfume, softer tannin and paler colour", correct: false }
      explanation: |
        **Colour, tannin, spice** (violet / liquorice). Palmer and a few
        others have used more than a dash; most keep it tiny.
    fr:
      question: Qu’ajoute une touche de Petit Verdot à un assemblage de rive gauche ?
      choices:
        - { text: "Une robe plus pâle, un tanin plus souple et moins d’acidité", correct: false }
        - { text: "De la couleur, du tanin et une note épicée", correct: true }
        - { text: "Du corps, de la douceur et un degré plus bas", correct: false }
        - { text: "Un parfum floral, un tanin plus souple et une robe plus pâle", correct: false }
      explanation: |
        **Couleur, tanin, épice** (violette / réglisse). Palmer et quelques autres en ont mis
        plus qu’une pincée ; la plupart n’en mettent qu’une touche.

  - id: bordeaux-vessels-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which fermentation vessels do Bordeaux châteaux use for red wine?
      choices:
        - { text: "Almost always large oak vats", correct: false }
        - { text: "Wood, steel or concrete, depending on the estate", correct: true }
        - { text: "Almost always stainless-steel tanks", correct: false }
        - { text: "Almost always new oak barriques", correct: false }
      explanation: |
        Stainless, wood and **concrete eggs / tanks** all appear. The region
        does not agree on one “best” fermenter.
    fr:
      question: Dans quelles cuves les châteaux bordelais fermentent-ils leurs rouges ?
      choices:
        - { text: "Presque toujours de grandes cuves en bois", correct: false }
        - { text: "Bois, inox ou béton, selon la propriété", correct: true }
        - { text: "Presque toujours des cuves inox", correct: false }
        - { text: "Presque toujours des barriques neuves", correct: false }
      explanation: |
        Inox, bois et **œufs / cuves en béton** se croisent. La région ne
        s’accorde pas sur une « meilleure » cuve.

  - id: bordeaux-blend-spring-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When do most châteaux assemble the grand vin?
      choices:
        - { text: "At harvest, by fermenting the varieties together", correct: false }
        - { text: "In the spring after the vintage", correct: true }
        - { text: "Just before bottling, about two years later", correct: false }
        - { text: "In the autumn, straight after pressing", correct: false }
      explanation: |
        After malolactic and a first look at the lots, in the early months of the year — in
        time for the **en primeur** tastings held in spring.
    fr:
      question: Quand la plupart des châteaux assemblent-ils le grand vin ?
      choices:
        - { text: "À la vendange, en vinifiant les cépages ensemble", correct: false }
        - { text: "Au printemps qui suit la vendange", correct: true }
        - { text: "Juste avant la mise, environ deux ans plus tard", correct: false }
        - { text: "À l’automne, dès la fin du pressurage", correct: false }
      explanation: |
        Après la fermentation malolactique et une première dégustation des lots, dans les
        premiers mois de l’année — à temps pour les dégustations **en primeur** du printemps.

  - id: bordeaux-blend-late-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do some châteaux do instead of blending the first spring after harvest?
      choices:
        - { text: "They ferment all the varieties together in one vat", correct: false }
        - { text: "They keep parcels apart until the end of élevage", correct: true }
        - { text: "They sell each lot unblended to négociants", correct: false }
        - { text: "They bottle each variety as a separate wine", correct: false }
      explanation: |
        Late assemblage lets each lot finish barrel time on its own. Still
        a blend at the end — just not the March snapshot.
    fr:
      question: Que font certains châteaux au lieu d’assembler dès le premier printemps après la vendange ?
      choices:
        - { text: "Ils vinifient tous les cépages ensemble dans une même cuve", correct: false }
        - { text: "Ils gardent les parcelles séparées jusqu’à la fin de l’élevage", correct: true }
        - { text: "Ils vendent chaque lot non assemblé au négoce", correct: false }
        - { text: "Ils mettent chaque cépage en bouteille séparément", correct: false }
      explanation: |
        Un assemblage tardif laisse chaque lot finir son temps de barrique
        de son côté. C’est encore un assemblage à la fin — simplement pas
        l’instantané de mars.

  - id: bordeaux-second-wine-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What happens to lots that do not go into the grand vin at a leading château?
      choices:
        - { text: "They are kept to top up the next vintage’s grand vin", correct: false }
        - { text: "They become a second wine, or go to a négociant", correct: true }
        - { text: "They are sold as IGP wine under the château name", correct: false }
        - { text: "They are distilled, as the rules forbid selling them", correct: false }
      explanation: |
        **Carruades de Lafite, Forts de Latour, Pagodes de Cos** — the
        named second wines. Some estates also make a third wine; surplus
        or lesser lots can instead go to a **négociant** blend.
    fr:
      question: Qu’advient-il des lots qui n’entrent pas dans le grand vin chez un château de premier plan ?
      choices:
        - { text: "Ils servent à compléter le grand vin du millésime suivant", correct: false }
        - { text: "Ils deviennent un second vin, ou partent chez un négociant", correct: true }
        - { text: "Ils sont vendus en IGP sous le nom du château", correct: false }
        - { text: "Ils sont distillés, car la vente en est interdite", correct: false }
      explanation: |
        **Carruades de Lafite, Forts de Latour, Pagodes de Cos** — des seconds vins réputés.
        Certains châteaux font aussi un troisième vin ; les lots de surplus ou plus faibles
        peuvent partir dans un assemblage de **négociant**.

  - id: bordeaux-barrique-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is top-end red Bordeaux usually aged?
      choices:
        - { text: "In large old oak foudres", correct: false }
        - { text: "In 225-litre barriques, a share of them new", correct: true }
        - { text: "In 228-litre pièces, none of them new", correct: false }
        - { text: "In concrete vats, then in bottle", correct: false }
      explanation: |
        The **Bordeaux barrique is 225 L**. First growths may use a very
        high share of **new** oak; many serious wines sit nearer 30–60%.
        Not every château is 100% new.
    fr:
      question: Comment élève-t-on d’habitude un rouge de Bordeaux haut de gamme ?
      choices:
        - { text: "En grands foudres de chêne usagés", correct: false }
        - { text: "En barriques de 225 litres, dont une part de bois neuf", correct: true }
        - { text: "En pièces de 228 litres, sans bois neuf", correct: false }
        - { text: "En cuves béton, puis en bouteille", correct: false }
      explanation: |
        La **barrique bordelaise fait 225 L**. Les premiers crus peuvent
        employer une très forte part de chêne **neuf** ; beaucoup de vins
        sérieux restent vers 30–60 %. Tous les châteaux ne sont pas à
        100 % de neuf.

  - id: bordeaux-generic-no-oak-001
    type: mcq
    deck: France::Bordeaux
