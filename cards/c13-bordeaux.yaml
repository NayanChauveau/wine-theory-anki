        - { text: "Premier cru supérieur, as at Yquem", correct: false }
        - { text: "Einzellagen", correct: false }
      explanation: |
        **Vin de garage / garagiste** — cellar-in-a-shed myth, serious
        prices. The joke stuck; the wines did too.
    fr:
      question: Quels surnoms ont collé aux micro-cuvées de rive droite des années 1990 et à leurs auteurs ?
      choices:
        - { text: "Crus bourgeois seulement", correct: false }
        - { text: "Vins de garage et garagistes", correct: true }
        - { text: "Premier cru supérieur, comme à Yquem", correct: false }
        - { text: "Einzellagen", correct: false }
      explanation: |
        **Vin de garage / garagiste** — mythe de la cave-hangar, prix
        sérieux. La plaisanterie a tenu ; les vins aussi.

  - id: bordeaux-rb-satellites-001
    type: mcq
