        - { text: "Toujours liquoreux et botrytisés", correct: false }
        - { text: "Toujours effervescents", correct: false }
      explanation: |
        **Un peu plus légers en corps et plus parfumés**.
        Plus de parfum, un peu moins de masse — penser **Smith Haut
