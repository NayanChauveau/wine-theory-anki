    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0059
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Mouton was raised from second to first growth in 1973. How many ranks does that 1855 Médoc ladder still have?
      choices:
        - { text: "One, and only Yquem", correct: false }
        - { text: "Five (premier to cinquième cru classé)", correct: true }
        - { text: "Twenty-four, like the German Prädikat scale", correct: false }
        - { text: "None — 1855 ranks only bottles of water", correct: false }
      explanation: |
        **First through fifth**. Mouton was a deuxième until **1973**.

  - id: bordeaux-1855-sauternes-ranks-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Yquem sits alone as premier cru supérieur. How many ranks does the 1855 sweet-wine list have in total?
      choices:
        - { text: "Five, identical to the Médoc", correct: false }
        - { text: "Three, with Yquem alone at the top", correct: true }
        - { text: "Twelve, one per month", correct: false }
        - { text: "None — Sauternes was left out of 1855", correct: false }
      explanation: |
        **Premier cru supérieur** (Yquem only), then premier cru, then
        deuxième cru. Barsac properties sit on the same list.

  - id: bordeaux-first-growths-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which five châteaux sit at the top of the 1855 red list?
      choices:
        - { text: "Pétrus, Le Pin, Cheval Blanc, Ausone, Figeac", correct: false }
        - { text: "Lafite, Latour, Margaux, Mouton Rothschild, and Haut-Brion", correct: true }
        - { text: "Yquem, Climens, Coutet, Guiraud, Rieussec", correct: false }
        - { text: "Only Cos d’Estournel and Montrose", correct: false }
      explanation: |
        Four Haut-Médoc names plus **Haut-Brion** from Graves — the one
        outsider on the “Médoc” ladder. Mouton joined them in **1973**.

  - id: bordeaux-yquem-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Sauternes estate sits alone as premier cru supérieur in 1855?
      choices:
        - { text: "Château Margaux", correct: false }
        - { text: "Château d’Yquem", correct: true }
        - { text: "Château Pétrus", correct: false }
        - { text: "Château Palmer", correct: false }
      explanation: |
        **Yquem** is the only wine on that top sweet rung. Climens and
        Coutet are premiers crus, not supérieur.

  - id: bordeaux-cru-bourgeois-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0063
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Médoc distinction sits below 1855 and is now a five-year, three-tier list?
      choices:
        - { text: "Premier cru supérieur, as at Yquem", correct: false }
        - { text: "Cru Bourgeois", correct: true }
        - { text: "A Saint-Émilion AOC that replaced Pomerol", correct: false }
        - { text: "A legal ban on Merlot", correct: false }
      explanation: |
        It covers Médoc châteaux **not** in 1855. The old **vintage-by-vintage**
        submission is gone: since **2020** the Alliance runs a **five-year**
        list (Cru Bourgeois / Supérieur / Exceptionnel).

  - id: bordeaux-graves-class-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Apart from Haut-Brion’s 1855 place, where do Graves classed growths come from?
      choices:
        - { text: "Inside the 1855 five-rank Médoc ladder only", correct: false }
        - { text: "On a separate 1950s list, red and white, all called cru classé", correct: true }
        - { text: "Only as German Prädikat wines", correct: false }
        - { text: "They cannot use the words cru classé", correct: false }
      explanation: |
        The **1953/1959 Graves** classification. After **1987** every name
        on it sits in **Pessac-Léognan**. Haut-Brion is on this list *and*
        in 1855.

  - id: bordeaux-graves-no-ranks-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Are Graves crus classés split into first-to-fifth growths?
      choices:
        - { text: "Yes, five numbered ranks like 1855", correct: false }
        - { text: "No — the names are not ranked against each other", correct: true }
        - { text: "Yes, they use the Saint-Émilion A/B letters", correct: false }
        - { text: "Yes, by alcohol to one decimal place", correct: false }
      explanation: |
        **No internal ranking**. Haut-Brion, Haut-Bailly and a small white
        such as Couhins-Lurton share the same cru classé title.

  - id: bordeaux-st-em-grand-cru-aoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is Saint-Émilion Grand Cru, before anyone mentions a ranking?
      choices:
        - { text: "A synonym for Pomerol", correct: false }
        - { text: "A separate AOC with tighter rules than basic Saint-Émilion", correct: true }
        - { text: "The 1855 first-growth list", correct: false }
        - { text: "A sparkling-wine category", correct: false }
      explanation: |
        **Grand Cru** here is an **appellation** (yield, ageing), not a
        château ranking. Many bottles say Grand Cru without being classé.

  - id: bordeaux-st-em-class-exists-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides the Saint-Émilion Grand Cru AOC, what extra list ranks the leading estates?
      choices:
        - { text: "The 1855 Médoc list only", correct: false }
        - { text: "A revisable classification of châteaux (grand cru classé and premier grand cru classé)", correct: true }
        - { text: "A list of négociants in Libourne", correct: false }
        - { text: "There is no château ranking at all", correct: false }
      explanation: |
        The **classification** sits *inside* the Grand Cru AOC. Pomerol has
        no equivalent official ladder.

  - id: bordeaux-st-em-gcc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0067
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Below Premier Grand Cru Classé, what title do the other classed Saint-Émilion châteaux use?
      choices:
        - { text: "Cru Bourgeois Exceptionnel", correct: false }
        - { text: "Saint-Émilion Grand Cru Classé", correct: true }
        - { text: "Premier cru supérieur, as at Yquem", correct: false }
        - { text: "Cinquième cru classé", correct: false }
      explanation: |
        **Grand Cru Classé** is the wider classed tier. Above it sit the
        Premiers Grands Crus Classés.

  - id: bordeaux-st-em-pgcc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Who sits in Saint-Émilion Premier Grand Cru Classé A on the 2022 list?
      choices:
        - { text: "Ausone and Cheval Blanc only", correct: false }
        - { text: "Figeac and Pavie", correct: true }
        - { text: "Pétrus and Le Pin", correct: false }
        - { text: "Only Cru Bourgeois Exceptionnel names", correct: false }
      explanation: |
        **Ausone, Cheval Blanc and Angélus** withdrew before **2022**.
        **Pavie** stayed; **Figeac** was promoted. The A/B split remains —
        it is not an empty A tier.

  - id: bordeaux-st-em-review-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0069
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How often is the Saint-Émilion classification meant to be reopened?
      choices:
        - { text: "Never — it is frozen like 1855", correct: false }
        - { text: "About once a decade", correct: true }
        - { text: "Every harvest morning", correct: false }
        - { text: "Only when the Médoc asks", correct: false }
      explanation: |
        The rule is **at least every ten years**. The 2022 round was late
        and litigious — the timetable is the principle, not a promise of
        peace.

  - id: bordeaux-generic-aocs-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0070
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What are the two catch-all red (and dry-white) AOCs that cover the whole vineyard?
      choices:
        - { text: "Pauillac and Pomerol only", correct: false }
        - { text: "Bordeaux and Bordeaux Supérieur", correct: true }
        - { text: "Sauternes and Barsac only", correct: false }
        - { text: "Côtes du Rhône and Village", correct: false }
      explanation: |
        Regional labels. **Entre-Deux-Mers** is the extra white-only AOC
        on the wedge between the rivers.

  - id: bordeaux-superieur-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0071
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What extra hurdles does Bordeaux Supérieur set versus basic Bordeaux?
      choices:
        - { text: "It must be sparkling and white only", correct: false }
        - { text: "Tighter rules, including a higher minimum alcohol", correct: true }
        - { text: "It must be 100% Petit Verdot", correct: false }
        - { text: "It may only be sold in the Médoc", correct: false }
      explanation: |
        **Lower yields, longer élevage, higher min. ABV**. It is still a
        regional AOC, not a communal cru.

  - id: bordeaux-white-rose-labels-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Under which names is generic pink Bordeaux sold?
      choices:
        - { text: "Only as Pauillac rosé", correct: false }
        - { text: "Bordeaux Rosé or Bordeaux Clairet", correct: true }
        - { text: "Only as Médoc Grand Cru", correct: false }
        - { text: "Pink wine is illegal in the Gironde", correct: false }
      explanation: |
        **Bordeaux Rosé** is the pale one; **Clairet** is deeper. Generic
        dry white is simply labelled **Bordeaux**.

  - id: bordeaux-generic-improve-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0073
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why have many everyday Bordeaux reds become cleaner and riper?
      choices:
        - { text: "AOC law now bans all canopy work", correct: false }
        - { text: "Export brands must compete with similarly priced New World wine", correct: true }
        - { text: "Frost made every vintage tiny", correct: false }
        - { text: "The EU requires cedar in every bottle", correct: false }
      explanation: |
        **Supermarket competition** (Chile, Australia, Languedoc) pushed
        sorting and ripeness. That is a trend, not a claim that every
        Bordeaux AOC is now a classed growth.

  - id: bordeaux-generic-best-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0074
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Should a good generic Bordeaux rouge be built for a 30-year cellar?
      choices:
        - { text: "Yes — every bottle is a first growth", correct: false }
        - { text: "No — medium body, ripe fruit, drink it young; oak is only a hint", correct: true }
        - { text: "Yes — it is always late-harvest and sweet", correct: false }
        - { text: "Yes — it is always pale Provence-style rosé", correct: false }
      explanation: |
        **Drink now**, not a 30-year Latour. A cheap barrique or chip can
        add a **cedar** hint; that is optional.

  - id: bordeaux-generic-cheap-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0075
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do the weakest generic reds usually sit on the palate?
      choices:
        - { text: "Heavier than Pomerol, with melted tannins", correct: false }
        - { text: "Lighter body and greener, more astringent tannin", correct: true }
        - { text: "Always sweet and botrytised", correct: false }
        - { text: "Always sparkling", correct: false }
      explanation: |
        Underripe Merlot and Cabernet on cold clay: **thin and grippy**.
        That is the floor, not the supermarket sweet-spot.

  - id: bordeaux-rose-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0076
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In what register should you expect a standard Bordeaux Rosé (not Clairet)?
      choices:
        - { text: "Oxidised and nutty like a 20-year white", correct: false }
        - { text: "Pale, fresh red-berry fruit, for early drinking", correct: true }
        - { text: "Always as tannic as a Pauillac", correct: false }
        - { text: "Always botrytis-sweet", correct: false }
      explanation: |
        Short maceration, drink young: **red-berry refreshment**. Clairet
        is the darker, fuller cousin.

  - id: bordeaux-clairet-market-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0077
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does most Bordeaux Clairet actually sell?
      choices:
        - { text: "Only in Japan, by AOC law", correct: false }
        - { text: "On the French domestic market", correct: true }
        - { text: "Only as a UK supermarket own-label", correct: false }
        - { text: "Only in Sauternes village shops", correct: false }
      explanation: |
        **Clairet** is a French-table habit. Export lists lean pale rosé
        instead — that is why students outside France meet it less.

  - id: bordeaux-clairet-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Clairet differ from a typical pale French rosé?
      choices:
        - { text: "It is always white and sparkling", correct: false }
        - { text: "Deeper colour and more body, from a longer maceration", correct: true }
        - { text: "It must be 100% Sauvignon Blanc", correct: false }
        - { text: "It is paler than Provence and has no fruit", correct: false }
      explanation: |
        Longer skin contact → **darker, fuller**. It sits between a modern
        Provence pink and a light red.

  - id: bordeaux-generic-white-sb-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape now leads most inexpensive dry Bordeaux blanc?
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
        - { text: "Pinot Noir", correct: false }
        - { text: "Muscadelle only", correct: false }
      explanation: |
        Generic and **Entre-Deux-Mers** have swung to **Sauvignon Blanc**.
        Serious Pessac-Léognan blanc is still often Sémillon-plus-oak —
        do not flatten every white to grass.

  - id: bordeaux-city-site-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does the city of Bordeaux sit relative to the two Left Bank districts?
      choices:
        - { text: "North of the Médoc and south of Sauternes only", correct: false }
        - { text: "South of the Médoc and north of Graves", correct: true }
        - { text: "In the middle of Pomerol", correct: false }
        - { text: "On the Loire at Saumur", correct: false }
      explanation: |
        The urban strip is the hinge: **Médoc** down-river (north),
        **Graves / Pessac-Léognan** immediately south of town.

  - id: bordeaux-bas-medoc-name-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What informal name is still used for the northern tip of the Médoc peninsula?
      choices:
        - { text: "Haut-Médoc", correct: false }
        - { text: "Bas-Médoc", correct: true }
        - { text: "Sauternes", correct: false }
        - { text: "Pomerol", correct: false }
      explanation: |
        **Bas-Médoc** is the old geographic name for the cooler north. The
        AOC on the label is just **Médoc**.

  - id: bordeaux-medoc-aoc-label-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0082
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What AOC is used north of Saint-Estèphe when the wine is not Haut-Médoc?
      choices:
        - { text: "Pauillac", correct: false }
        - { text: "Médoc", correct: true }
        - { text: "Pomerol", correct: false }
        - { text: "Chablis", correct: false }
      explanation: |
        **Médoc AOC** starts where Haut-Médoc stops, north of Saint-Estèphe.
        “Bas-Médoc” will not be the legal name on the capsule.

  - id: bordeaux-medoc-aoc-soil-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What soils dominate the Médoc AOC (the old Bas-Médoc)?
      choices:
        - { text: "Only solid granite", correct: false }
        - { text: "Mostly clay, with some gravel patches", correct: true }
        - { text: "Only desert sand with no clay", correct: false }
        - { text: "Only volcanic basalt", correct: false }
      explanation: |
        **Clay first**, gravel as islands. That is why Merlot outplants
        Cabernet Sauvignon here, unlike Pauillac.

  - id: bordeaux-medoc-aoc-blend-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape usually leads a Médoc AOC blend?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Riesling", correct: false }
        - { text: "Carmenère only", correct: false }
      explanation: |
        Cooler clay → **Merlot**, softer and earlier than a Saint-Estèphe
        Cabernet wine. Not every bottle is a fruit bomb; “easy” is the
        contrast with the communal crus.

  - id: bordeaux-haut-medoc-north-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0085
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which communal AOC is the last famous stop before Médoc AOC begins?
      choices:
        - { text: "Margaux", correct: false }
        - { text: "Saint-Estèphe", correct: true }
        - { text: "Sauternes", correct: false }
        - { text: "Pomerol", correct: false }
      explanation: |
        **Saint-Estèphe** is the northernmost of the four big communes.
        Haut-Médoc AOC land also wraps around them; the prestige strip
        ends here.

  - id: bordeaux-communes-word-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do we call the village-level AOCs nested inside Haut-Médoc?
      choices:
        - { text: "AVAs", correct: false }
        - { text: "Communes", correct: true }
        - { text: "Einzellagen", correct: false }
        - { text: "DOCG zones", correct: false }
      explanation: |
        **Communal AOCs**: Saint-Estèphe, Pauillac, Saint-Julien, Margaux,
        plus **Moulis** and **Listrac** inland. Haut-Médoc is the district
        envelope.

  - id: bordeaux-four-communes-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0087
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: North to south along the Gironde, which four communes carry the highest Left Bank reputation?
      choices:
        - { text: "Pomerol, Fronsac, Canon-Fronsac, Castillon", correct: false }
        - { text: "Saint-Estèphe, Pauillac, Saint-Julien, Margaux", correct: true }
        - { text: "Sauternes, Barsac, Cérons, Cadillac", correct: false }
        - { text: "Chablis, Irancy, Saint-Bris, Joigny", correct: false }
      explanation: |
        Memorise that **north→south** order. **Moulis** and **Listrac**
        sit west of the gravel ridge and are not in that river-front four.

  - id: bordeaux-commune-cs-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0088
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In Saint-Estèphe, Pauillac, Saint-Julien and Margaux, which grape usually takes the largest share?
      choices:
        - { text: "Muscadelle", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Riesling", correct: false }
        - { text: "Gewurztraminer", correct: false }
      explanation: |
        Warm **gravel** → **Cabernet Sauvignon** lead, Merlot and Franc in
        support. Margaux can be a little more Merlot-friendly than Pauillac.

  - id: bordeaux-commune-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fruit-and-oak signature do Haut-Médoc communal reds usually show when young?
      choices:
        - { text: "Only banana and coconut, no tannin", correct: false }
        - { text: "Blackcurrant with cedar from oak, and firm tannin built to age", correct: true }
        - { text: "Only noble-rot saffron", correct: false }
        - { text: "Only pale Provençal strawberry", correct: false }
      explanation: |
        **Cassis + cedar + grip**. They can be tough at five years; the
        point of the communal crus is a long curve, not a nouveau.

  - id: bordeaux-pessac-where-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which AOC starts on the southern edge of Bordeaux city?
      choices:
        - { text: "Saint-Estèphe", correct: false }
        - { text: "Pessac-Léognan", correct: true }
        - { text: "Médoc AOC only", correct: false }
        - { text: "Tokaj", correct: false }
      explanation: |
        **Pessac-Léognan** (created **1987**) is northern Graves: suburbs
        and woods just south of town. Haut-Brion is inside the urban
        sprawl.

  - id: bordeaux-pessac-soil-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What soil type made Pessac-Léognan famous?
      choices:
        - { text: "Solid slate, like the Mosel", correct: false }
        - { text: "Gravel", correct: true }
        - { text: "Only peat bog", correct: false }
        - { text: "Only chalk with no stone", correct: false }
      explanation: |
        **Graves** means gravel. Sand and some clay sit underneath; the
        heat-holding stones are why Cabernet can finish here.

  - id: bordeaux-pessac-grape-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0092
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which black grape is the best match for Pessac-Léognan gravel?
      choices:
        - { text: "Pinot Noir", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Gamay", correct: false }
        - { text: "Nebbiolo", correct: false }
      explanation: |
        Same logic as the Haut-Médoc: **warm, drained gravel** ripens
        Cabernet Sauvignon. Merlot still fills the cooler pockets.

  - id: bordeaux-pessac-vs-hm-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0093
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Beside a few dense exceptions (Haut-Brion), how do Pessac reds usually sit next to Haut-Médoc?
      choices:
        - { text: "Always heavier and more tannic", correct: false }
        - { text: "A little lighter in body and more fragrant", correct: true }
        - { text: "Always sweet and botrytised", correct: false }
        - { text: "Always sparkling", correct: false }
      explanation: |
        More perfume, a shade less mass — think **Smith Haut Lafitte**,
        not **La Mission Haut-Brion**, which sits with Haut-Brion for
        density.

  - id: bordeaux-graves-vs-pessac-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0094
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do southern Graves reds usually compare with Pessac-Léognan?
      choices:
        - { text: "Always more concentrated and 100% Cabernet", correct: false }
        - { text: "Same family, but lighter, simpler, and often more Merlot", correct: true }
        - { text: "They are only white and sparkling", correct: false }
        - { text: "They must be labelled Pomerol", correct: false }
      explanation: |
        **Pessac-Léognan** took the best northern gravel in 1987. Remaining
        **Graves** AOC is a step down in concentration and leans more
        Merlot.

  - id: bordeaux-rb-merlot-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0095
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: On Saint-Émilion and Pomerol clay, which grape usually fills the vat?
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Sémillon", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        **Merlot** on clay and limestone. Cabernet Sauvignon is the
        exception (Figeac’s gravel), not the rule.

  - id: bordeaux-rb-franc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0096
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After Merlot, which black grape is the Right Bank’s usual partner?
      choices:
        - { text: "Pinot Noir", correct: false }
        - { text: "Cabernet Franc", correct: true }
        - { text: "Syrah", correct: false }
        - { text: "Grenache", correct: false }
      explanation: |
        **Cabernet Franc** (Cheval Blanc, Ausone). Cabernet Sauvignon is
        third, and only where gravel warms the plateau.

  - id: bordeaux-st-em-larger-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0097
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Between Saint-Émilion and Pomerol, which AOC is the much larger one?
      choices:
        - { text: "Pomerol", correct: false }
        - { text: "Saint-Émilion", correct: true }
        - { text: "They are the same to the hectare", correct: false }
        - { text: "Sauternes is larger than both and sits between them", correct: false }
      explanation: |
        **Saint-Émilion** (plus its satellites) dwarfs tiny **Pomerol**.
        Price per bottle can run the other way.

  - id: bordeaux-st-em-three-zones-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many broad vineyard settings do we split Saint-Émilion into?
      choices:
        - { text: "One, and only sand", correct: false }
        - { text: "Three", correct: true }
        - { text: "Twenty-four official climats", correct: false }
        - { text: "None — the AOC is a single flat field", correct: false }
      explanation: |
        A **gravel-and-sand plateau** toward Pomerol, a **clay-limestone
        côte** around the town, and **sandier, lesser land** on the plain.
        Do not turn that into a legal map of 24 crus.

  - id: bordeaux-st-em-plateau-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0099
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where do Cheval Blanc and Figeac sit inside Saint-Émilion?
      choices:
        - { text: "On the Sauternes bars", correct: false }
        - { text: "On the warm gravel plateau north-west of the town", correct: true }
        - { text: "Only in the Médoc AOC", correct: false }
        - { text: "Under the city of Bordeaux", correct: false }
      explanation: |
        The **north-west plateau** is the Graves-like pocket. Merlot is
        still planted; **Cabernet Franc and some Cabernet Sauvignon** can
        ripen here. Franc also ripens on Ausone’s limestone côte — it does
        not “fail” there.

  - id: bordeaux-st-em-cote-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0100
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What soils wrap the escarpment south and east of Saint-Émilion town?
      choices:
        - { text: "Only desert dune sand", correct: false }
        - { text: "Clay-limestone", correct: true }
        - { text: "Only slate", correct: false }
        - { text: "Only granite", correct: false }
      explanation: |
        The **côtes**: **argilo-calcaire**. **Ausone** and **Pavie** sit
        on this slope, not on Figeac’s gravel.

  - id: bordeaux-st-em-prestige-zones-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two Saint-Émilion landforms produce the most prestigious wines?
      choices:
        - { text: "Only the sandy plain at the foot of the slope", correct: false }
        - { text: "The gravel plateau and the clay-limestone côte", correct: true }
        - { text: "Only the Landes forest", correct: false }
        - { text: "Only the Médoc AOC dunes", correct: false }
      explanation: |
        **Cheval Blanc / Figeac** on gravel, **Ausone / Pavie** on the
        côte. The sandier land below the slope is the third, cheaper zone.

  - id: bordeaux-st-em-prestige-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0102
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do top Saint-Émilion reds usually feel, beyond the fruit?
      choices:
        - { text: "Pale, zero tannin, like a Provence rosé", correct: false }
        - { text: "Medium to high tannin with a plush, rich mid-palate", correct: true }
        - { text: "Always sparkling and bone-dry only", correct: false }
        - { text: "Always thin and green", correct: false }
      explanation: |
        Merlot (and Franc) give **plush fruit** — plum and red berry —
        with enough tannin to age into **cedar and tobacco**. They are not
        a light Nouveau.

  - id: bordeaux-st-em-plain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0103
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What sits at the foot of the Saint-Émilion escarpment?
      choices:
        - { text: "The Haut-Médoc communal strip", correct: false }
        - { text: "Sandier, lesser vineyards and lighter wines", correct: true }
        - { text: "Only first-growth Pauillac châteaux", correct: false }
        - { text: "The Gulf Stream itself", correct: false }
      explanation: |
        The **plain** below the côte: more sand, less prestige, earlier
        and lighter bottles than Ausone’s slope.

  - id: bordeaux-pomerol-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do Pomerol reds usually sit next to Saint-Émilion?
      choices:
        - { text: "Always paler and greener", correct: false }
        - { text: "Richer, with a spicier blackberry register", correct: true }
        - { text: "Always sparkling and white", correct: false }
        - { text: "Always 100% Cabernet Sauvignon", correct: false }
      explanation: |
        Tiny AOC. **Pétrus** sits on a button of blue clay; much of the
        rest is gravel over clay. Richer and spicier than a typical
        Saint-Émilion, not a different legal grape list.

  - id: bordeaux-garage-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What 1990s Right Bank fashion made tiny, very ripe, full-bodied reds from small plots?
      choices:
        - { text: "A legal ban on all oak", correct: false }
        - { text: "The garage / micro-cuvée wave", correct: true }
        - { text: "Only sparkling Clairet", correct: false }
        - { text: "A return to 100% Ugni Blanc", correct: false }
      explanation: |
        **Le Pin** was the prototype; **Valandraud** (Thienpont) is the
        named 1990s garagiste. Low yield, new oak, cult prices — not a
        new AOC.

  - id: bordeaux-garagiste-term-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What nicknames stuck to the 1990s micro-cuvée Right Bank reds and their makers?
      choices:
        - { text: "Crus bourgeois only", correct: false }
        - { text: "Vins de garage and garagistes", correct: true }
        - { text: "Premier cru supérieur, as at Yquem", correct: false }
        - { text: "Einzellagen", correct: false }
      explanation: |
        **Vin de garage / garagiste** — cellar-in-a-shed myth, serious
        prices. The joke stuck; the wines did too.

  - id: bordeaux-rb-satellites-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do the AOCs wrapped around Saint-Émilion and Pomerol usually taste like?
      choices:
        - { text: "Always 100% Riesling", correct: false }
        - { text: "Merlot-led reds in a similar, usually lighter register", correct: true }
        - { text: "Only Sauternes-style noble rot", correct: false }
        - { text: "Only pale Provence rosé", correct: false }
      explanation: |
        **Lussac, Montagne, Puisseguin, Saint-Georges** (the satellites)
        plus Fronsac and the Côtes: same grapes, less fame, often less
        concentration.

  - id: bordeaux-cotes-name-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0108
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What umbrella AOC, created in 2009, groups several lesser-known Bordeaux hillsides?
      choices:
        - { text: "Pauillac Grand Cru", correct: false }
        - { text: "Côtes de Bordeaux", correct: true }
        - { text: "Côtes du Rhône Villages", correct: false }
        - { text: "Vin de France only", correct: false }
      explanation: |
        **Côtes de Bordeaux** is a regional wrapper. The village name
        comes first on the label when the wine qualifies.

  - id: bordeaux-cotes-four-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0109
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Cadillac, Blaye, Castillon and Francs share which 2009 wrapper on the label?
      choices:
        - { text: "Pauillac, Margaux, Saint-Julien, Saint-Estèphe", correct: false }
        - { text: "Côtes de Bordeaux (with the village name in front)", correct: true }
        - { text: "Chablis, Irancy, Sancerre, Pouilly", correct: false }
        - { text: "Only Sauternes and Barsac", correct: false }
      explanation: |
        **Cadillac-Côtes de Bordeaux**, **Blaye-**, **Castillon-**,
        **Francs-**. **Côtes de Bourg** stayed out of that 2009 merger.

  - id: bordeaux-cotes-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0110
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the usual Côtes de Bordeaux red?
      choices:
        - { text: "A 40-year first-growth Cabernet cellar wine", correct: false }
        - { text: "An early-drinking, Merlot-led red, often cheaper than Pomerol", correct: true }
        - { text: "Only botrytis-sweet white", correct: false }
        - { text: "Only sparkling Clairet", correct: false }
      explanation: |
        **Drink-now Merlot**. “Value” is a shop slogan, not a tasting
        score — the useful contrast is price and weight versus Pomerol.

  - id: bordeaux-cotes-bourg-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Right Bank hillside AOC refused to fold into Côtes de Bordeaux?
      choices:
        - { text: "Pauillac", correct: false }
        - { text: "Côtes de Bourg", correct: true }
        - { text: "Sauternes", correct: false }
        - { text: "Chablis", correct: false }
      explanation: |
        **Côtes de Bourg** (or Bourg) kept its own name. Merlot country
        facing the Gironde, not a 2009 prefix.

  - id: bordeaux-edm-white-only-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0112
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which AOC on the wedge between the Dordogne and the Garonne is reserved for dry white?
      choices:
        - { text: "Pauillac", correct: false }
        - { text: "Entre-Deux-Mers", correct: true }
        - { text: "Pomerol", correct: false }
        - { text: "Saint-Estèphe", correct: false }
      explanation: |
        **Entre-Deux-Mers** = dry white. Red from the same hills cannot
        borrow that name.

  - id: bordeaux-edm-red-label-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0113
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A red from Entre-Deux-Mers country that misses Cadillac or another local AOC is labelled how?
      choices:
        - { text: "Entre-Deux-Mers rouge", correct: false }
        - { text: "Bordeaux or Bordeaux Supérieur", correct: true }
        - { text: "Pauillac", correct: false }
        - { text: "Pomerol", correct: false }
      explanation: |
        Red must take a **generic** AOC. Entre-Deux-Mers on the label
        means white.

  - id: bordeaux-graves-colours-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which colours may Graves and Pessac-Léognan put on the market?
      choices:
        - { text: "Red only, like Pomerol", correct: false }
        - { text: "Red and dry white", correct: true }
        - { text: "Only sparkling rosé", correct: false }
        - { text: "Only botrytis sweet wine, like Sauternes", correct: false }
      explanation: |
        Both colours are legal. **Haut-Brion** and **Haut-Brion Blanc**
        are the luxury pair; everyday Graves does the same split.

  - id: bordeaux-graves-edm-white-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0115
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are most inexpensive Graves and Entre-Deux-Mers whites made?
      choices:
        - { text: "Three years in 100% new oak, always Sémillon only", correct: false }
        - { text: "Unoaked Sauvignon Blanc (sometimes with a little Sémillon)", correct: true }
        - { text: "Always as red wine", correct: false }
        - { text: "Always as Sauternes", correct: false }
      explanation: |
        Steel, **Sauvignon Blanc**, drink young. That is **not**
        Pessac-Léognan cru classé blanc, which is often barrel-fermented
        Sémillon-plus-Sauvignon.

  - id: bordeaux-best-dry-white-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Haut-Brion Blanc and Smith Haut Lafitte blanc are labelled as which AOC?
      choices:
        - { text: "Only in Pomerol", correct: false }
        - { text: "Pessac-Léognan", correct: true }
        - { text: "Only in Saint-Estèphe", correct: false }
        - { text: "Only in Chablis", correct: false }
      explanation: |
        **Pessac-Léognan** (Haut-Brion Blanc, Laville / La Mission blanc,
        Smith Haut Lafitte blanc). Entre-Deux-Mers is the volume white.

  - id: bordeaux-white-cru-classe-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where can a dry white Bordeaux carry the words cru classé?
      choices:
        - { text: "Only in Pauillac", correct: false }
        - { text: "Pessac-Léognan, on the Graves white list", correct: true }
        - { text: "Only in Pomerol, which has an official ladder", correct: false }
        - { text: "Only in Champagne AOC", correct: false }
      explanation: |
        The **1959 Graves** white classification now lives inside
        **Pessac-Léognan**. 1855 classed Sauternes, not dry white Médoc.

  - id: bordeaux-pessac-blanc-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the usual recipe for a top Pessac-Léognan blanc?
      choices:
        - { text: "100% Riesling, no oak, always sparkling", correct: false }
        - { text: "Sémillon plus Sauvignon Blanc, fermented or aged at least partly in oak", correct: true }
        - { text: "100% Muscadelle, three years under flor", correct: false }
        - { text: "Only carbonic Gamay", correct: false }
      explanation: |
        **Sémillon + Sauvignon Blanc**, often a share of **new barriques**.
        Medium to full body, toast over citrus — not an Entre-Deux-Mers
        steel tank.

  - id: bordeaux-pessac-blanc-oak-note-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What oak flavour sits on barrel-aged Pessac-Léognan blanc?
      choices:
        - { text: "Only red cherry and tar", correct: false }
        - { text: "Toast", correct: true }
        - { text: "Only noble-rot saffron", correct: false }
        - { text: "No flavour at all", correct: false }
      explanation: |
        **Toast and nut** from barrel ferment and élevage. Fruit is still
        there; the wood is a layer, not a replacement.

  - id: bordeaux-medoc-sauternes-white-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0119
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: If a grower in the Médoc or in Sauternes bottles a dry white, which AOC can it use?
      choices:
        - { text: "Pauillac blanc or Sauternes sec", correct: false }
        - { text: "A generic Bordeaux (or Bordeaux Supérieur) name", correct: true }
        - { text: "Pomerol blanc only", correct: false }
        - { text: "Champagne AOC", correct: false }
      explanation: |
        **Médoc / Haut-Médoc / Sauternes** are not dry-white AOCs.
        **Aile d’Argent** (Mouton) is Bordeaux blanc from Pauillac vines.
        Sauternes on the label means sweet.

  - id: bordeaux-sweet-rivers-001
    type: mcq
