        - { text: "Sauternes et Barsac", correct: true }
        - { text: "Cadillac et Cérons", correct: false }
        - { text: "Saint-Macaire et Premières Côtes de Bordeaux", correct: false }
      explanation: |
        **Sauternes** et **Barsac** siègent là où le **Ciron** froid
        rencontre la **Garonne** — brume pour le botrytis. Loupiac,
        Cadillac et Sainte-Croix-du-Mont leur font face de l’autre
        rive.

  - id: bordeaux-botrytis-mist-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do the Garonne and the Ciron matter in the vineyards of Sauternes?
      choices:
        - { text: "They cool the vineyards and delay ripening", correct: false }
        - { text: "Their autumn mists encourage noble rot", correct: true }
        - { text: "They reflect sunlight and speed up ripening", correct: false }
        - { text: "They protect the vines from spring frost", correct: false }
      explanation: |
        Cold **Ciron** water meets the warmer **Garonne** → morning mist, then sunny
        afternoons. Those are the conditions *Botrytis cinerea* needs to develop as noble rot.
    fr:
      question: Pourquoi la Garonne et le Ciron comptent-ils pour le vignoble de Sauternes ?
      choices:
        - { text: "Ils rafraîchissent les vignes et retardent la maturité", correct: false }
        - { text: "Leurs brumes d’automne favorisent la pourriture noble", correct: true }
        - { text: "Ils reflètent le soleil et accélèrent la maturité", correct: false }
        - { text: "Ils protègent les vignes du gel de printemps", correct: false }
      explanation: |
        L’eau froide du **Ciron** rencontre la **Garonne** plus tiède : cela favorise les
        brumes matinales, suivies d’après-midi ensoleillés. Cette alternance crée les
        conditions propices au développement de *Botrytis cinerea* en pourriture noble.

  - id: bordeaux-passerillage-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When autumn stays too dry for noble rot, how else do Sauternais grapes concentrate?
      choices:
        - { text: "By freezing on the vine", correct: false }
        - { text: "By passerillage on the vine", correct: true }
        - { text: "By drying on straw mats after picking", correct: false }
        - { text: "By must concentration under vacuum", correct: false }
      explanation: |
        **Passerillage** (dry shrivel) is the fallback. It gives sweet
        wine without the honey-saffron of botrytis — commoner in the
        cheaper satellite AOCs than at Yquem.
    fr:
      question: Quand l’automne reste trop sec pour la pourriture noble, comment les raisins du Sauternais se concentrent-ils autrement ?
      choices:
        - { text: "Par le gel sur pied", correct: false }
        - { text: "Par passerillage sur pied", correct: true }
        - { text: "Par séchage sur paille après la vendange", correct: false }
        - { text: "Par concentration du moût sous vide", correct: false }
      explanation: |
        Le **passerillage** (flétrissement sans pourriture) est le recours. Il donne un vin
        doux sans les notes de miel et de safran du botrytis — plus courant dans les AOC
        voisines moins chères qu’à Yquem.

