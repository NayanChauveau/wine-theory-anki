        - { text: "Sable landais", correct: false }
        - { text: "Seulement de la craie, sans caillou", correct: false }
      explanation: |
        **Graves** : des cailloux, pas seulement le nom de l’AOC. Sable et
        un peu d’argile dessous ; les pierres qui retiennent la chaleur
        expliquent que le Cabernet puisse y finir.

