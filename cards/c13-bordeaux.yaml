        - { text: "Gravel", correct: true }
        - { text: "Only peat bog", correct: false }
        - { text: "Only chalk with no stone", correct: false }
      explanation: |
        **Graves** means gravel. Sand and some clay sit underneath; the
        heat-holding stones are why Cabernet can finish here.
    fr:
      question: Quel type de sol a fait la réputation de Pessac-Léognan ?
      choices:
        - { text: "Ardoise massive, comme la Moselle", correct: false }
        - { text: "Graves", correct: true }
        - { text: "Seulement de la tourbe", correct: false }
        - { text: "Seulement de la craie, sans caillou", correct: false }
      explanation: |
        **Graves** veut dire cailloux. Sable et un peu d’argile
        dessous ; les pierres qui retiennent la chaleur expliquent que
        le Cabernet puisse y finir.

