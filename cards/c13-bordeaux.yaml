        - { text: "A Merlot-led red for early drinking", correct: true }
        - { text: "A Cabernet Franc-led red with high acidity", correct: false }
        - { text: "A Malbec-led red, deep and rustic", correct: false }
      explanation: |
        **Drink-now Merlot**, usually good value. The useful contrast is price and weight
        versus Pomerol.
    fr:
      question: Quel est le rouge habituel des Côtes de Bordeaux ?
      choices:
        - { text: "Un rouge mené par le Cabernet Sauvignon, de longue garde", correct: false }
        - { text: "Un rouge mené par le Merlot, à boire tôt", correct: true }
        - { text: "Un rouge mené par le Cabernet Franc, à forte acidité", correct: false }
        - { text: "Un rouge mené par le Malbec, sombre et rustique", correct: false }
      explanation: |
        **Du Merlot à boire jeune**, souvent d’un bon rapport qualité-prix. Le contraste utile
        : le prix et le poids face à Pomerol.

  - id: bordeaux-cotes-bourg-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Right Bank hillside AOC stayed out of the Côtes de Bordeaux grouping?
      choices:
        - { text: "Castillon", correct: false }
        - { text: "Bourg", correct: true }
        - { text: "Francs", correct: false }
        - { text: "Blaye", correct: false }
      explanation: |
        **Côtes de Bourg** (also labelled Bourg) kept its own name. Merlot country facing the
        Gironde; Blaye, Castillon and Francs took the 2009 suffix.
    fr:
      question: Quelle AOC de coteaux de rive droite est restée à l’écart du regroupement Côtes de Bordeaux ?
      choices:
        - { text: "Castillon", correct: false }
        - { text: "Bourg", correct: true }
        - { text: "Francs", correct: false }
        - { text: "Blaye", correct: false }
      explanation: |
        Les **Côtes de Bourg** (on dit aussi Bourg) ont gardé leur nom. Pays du Merlot face à
        la Gironde ; Blaye, Castillon et Francs ont pris la mention de 2009.

  - id: bordeaux-edm-white-only-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0112
    review:
      fact_check: pass
      sources: [known-fact, inao-entre-deux-mers]
    en:
      question: Which AOC between the Dordogne and the Garonne is best known for dry white wine?
      choices:
        - { text: "Cadillac", correct: false }
        - { text: "Entre-Deux-Mers", correct: true }
        - { text: "Loupiac", correct: false }
        - { text: "Sainte-Croix-du-Mont", correct: false }
      explanation: |
        **Entre-Deux-Mers** is the dry-white name; Cadillac, Loupiac and Sainte-Croix-du-Mont
        make sweet whites. The AOC was white-only until a red version was approved in 2023;
        most red from these hills is still sold as Bordeaux or Bordeaux Supérieur.
    fr:
      question: Quelle AOC, entre Dordogne et Garonne, est surtout connue pour son blanc sec ?
      choices:
        - { text: "Cadillac", correct: false }
        - { text: "Entre-Deux-Mers", correct: true }
        - { text: "Loupiac", correct: false }
        - { text: "Sainte-Croix-du-Mont", correct: false }
      explanation: |
        L’**Entre-Deux-Mers** est le nom du blanc sec ; Cadillac, Loupiac et
        Sainte-Croix-du-Mont donnent des blancs liquoreux. L’AOC était réservée au blanc
        jusqu’à l’homologation d’un rouge en 2023 ; la plupart des rouges de ces coteaux se
        vendent encore en Bordeaux ou Bordeaux Supérieur.

  - id: bordeaux-edm-red-label-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0113
    review:
      fact_check: pass
      sources: [known-fact, inao-entre-deux-mers]
    en:
      question: Under which AOCs is most red wine from the Entre-Deux-Mers area sold?
      choices:
        - { text: "Cadillac or Loupiac", correct: false }
        - { text: "Bordeaux or Bordeaux Supérieur", correct: true }
        - { text: "Graves or Graves Supérieures", correct: false }
        - { text: "Bordeaux Clairet or Crémant de Bordeaux", correct: false }
      explanation: |
        Reds here have long taken a **regional** AOC, because Entre-Deux-Mers was a white-only
        name. A red Entre-Deux-Mers was approved in 2023, but it is a recent addition; for the
        exam, the name still means dry white.
    fr:
      question: Sous quelles AOC se vend la plupart du vin rouge produit dans l’Entre-Deux-Mers ?
      choices:
        - { text: "Cadillac ou Loupiac", correct: false }
        - { text: "Bordeaux ou Bordeaux Supérieur", correct: true }
        - { text: "Graves ou Graves Supérieures", correct: false }
        - { text: "Bordeaux Clairet ou Crémant de Bordeaux", correct: false }
      explanation: |
        Les rouges y prennent de longue date une AOC **régionale**, car Entre-Deux-Mers était
        un nom réservé au blanc. Un Entre-Deux-Mers rouge a été homologué en 2023, mais il
        reste récent ; pour l’examen, ce nom désigne toujours un blanc sec.

  - id: bordeaux-graves-colours-001
    type: mcq
