    en:
      question: How is top-end red Bordeaux usually aged?
      choices:
        - { text: "Only in large foudres", correct: false }
        - { text: "In 225-litre barriques, a share of them new", correct: true }
        - { text: "Only in bottle, with no barrel time", correct: false }
        - { text: "Only in stainless-steel tanks", correct: false }
      explanation: |
        The **Bordeaux barrique is 225 L**. First growths may use a very
        high share of **new** oak; many serious wines sit nearer 30–60%.
        Not every château is 100% new.
    fr:
      question: Comment élève-t-on d’habitude un rouge de Bordeaux haut de gamme ?
      choices:
        - { text: "Seulement en foudres de grande contenance", correct: false }
        - { text: "En barriques de 225 litres, dont une part de bois neuf", correct: true }
        - { text: "Seulement en bouteille, sans passage en fût", correct: false }
        - { text: "Seulement en cuves inox", correct: false }
      explanation: |
        La **barrique bordelaise fait 225 L**. Les premiers crus peuvent
        employer une très forte part de chêne **neuf** ; beaucoup de vins
        sérieux restent vers 30–60 %. Tous les châteaux ne sont pas à
        100 % de neuf.

  - id: bordeaux-generic-no-oak-001
    type: mcq
