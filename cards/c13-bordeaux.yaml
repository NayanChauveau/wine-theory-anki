        - { text: "Sauvignon Blanc", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Viognier", correct: false }
      explanation: |
        **Sauvignon Blanc** for lift and aroma; Sémillon for weight. Haut-
        Brion Blanc and the Pessac dry whites sit on that pair.
    fr:
      question: Outre le Sémillon, quel cépage construit les blancs secs de Pessac-Léognan et des Graves ?
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Viognier", correct: false }
      explanation: |
        Le **Sauvignon Blanc** pour l’élan et l’arôme ; le Sémillon pour le
        corps. Haut-Brion Blanc et les blancs secs de Pessac reposent sur
        ce couple.

  - id: bordeaux-semillon-body-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Sémillon add to those dry Graves / Pessac-Léognan blends?
      choices:
        - { text: "Only red colour", correct: false }
        - { text: "Body", correct: true }
        - { text: "A legal ban on oak", correct: false }
        - { text: "Sparkling pressure", correct: false }
      explanation: |
        **Body** and a waxy texture. Sauvignon Blanc is the high-acid,
        high-aroma half.
    fr:
      question: Qu’apporte le Sémillon à ces assemblages secs de Graves / Pessac-Léognan ?
      choices:
        - { text: "Seulement de la couleur rouge", correct: false }
        - { text: "Du corps", correct: true }
        - { text: "L’interdiction légale du chêne", correct: false }
        - { text: "De la pression de vin effervescent", correct: false }
      explanation: |
        Du **corps** et une texture cireuse. Le Sauvignon Blanc est la
        moitié plus acide et plus aromatique.

  - id: bordeaux-sb-aroma-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0039
    review:
      fact_check: pass
