        - { text: "Always as red wine", correct: false }
        - { text: "Always as Sauternes", correct: false }
      explanation: |
        Steel, **Sauvignon Blanc**, drink young. That is **not**
        Pessac-Léognan cru classé blanc, which is often barrel-fermented
        Sémillon-plus-Sauvignon.
    fr:
      question: Comment élabore-t-on la plupart des blancs bon marché de Graves et d’Entre-Deux-Mers ?
      choices:
        - { text: "Trois ans en 100 % bois neuf, toujours Sémillon seul", correct: false }
        - { text: "Sauvignon Blanc sans chêne (parfois avec un peu de Sémillon)", correct: true }
        - { text: "Toujours en vin rouge", correct: false }
        - { text: "Toujours en Sauternes", correct: false }
      explanation: |
        **Sauvignon Blanc sans chêne**, parfois avec un peu de Sémillon.
        Inox, à boire jeune. Ce n’est **pas** le blanc cru classé de
        Pessac-Léognan, souvent fermenté en fût.

