        - { text: "Citrus and green fruit", correct: true }
        - { text: "Red cherry and tar", correct: false }
        - { text: "Oxidation and curry leaf only", correct: false }
      explanation: |
        **Grapefruit, lemon, gooseberry / apple** — cooler and less punchy
        than Marlborough, especially once Sémillon and oak join in.
    fr:
      question: Quel registre de fruit montrent d’habitude les blancs secs de Bordeaux menés par le Sauvignon Blanc ?
      choices:
        - { text: "Seulement banane et noix de coco très marquées", correct: false }
        - { text: "Agrumes et fruits verts", correct: true }
        - { text: "Cerise rouge et goudron", correct: false }
        - { text: "Seulement oxydation et feuille de curry", correct: false }
      explanation: |
        **Agrumes et fruits verts**.
        **Pamplemousse, citron, groseille à maquereau / pomme** — plus
        frais et moins percutant que Marlborough, surtout une fois le Sémillon
        et le chêne de la partie.

  - id: bordeaux-sb-varietal-001
    type: mcq
