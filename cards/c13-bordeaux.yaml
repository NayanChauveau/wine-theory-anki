        - { text: "Clay-limestone", correct: true }
        - { text: "Only slate", correct: false }
        - { text: "Only granite", correct: false }
      explanation: |
        The **côtes**: **argilo-calcaire**. **Ausone** and **Pavie** sit
        on this slope, not on Figeac’s gravel.
    fr:
      question: Quels sols ceignent l’escarpement au sud et à l’est de la ville de Saint-Émilion ?
      choices:
        - { text: "Seulement du sable de dune désertique", correct: false }
        - { text: "Argilo-calcaire", correct: true }
        - { text: "Seulement de l’ardoise", correct: false }
        - { text: "Seulement du granite", correct: false }
      explanation: |
        Les **côtes** : **argilo-calcaire**. **Ausone** et **Pavie**
        sont sur cette pente, pas sur les graves de Figeac.

  - id: bordeaux-st-em-prestige-zones-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two Saint-Émilion landforms produce the most prestigious wines?
      choices:
        - { text: "Only the sandy plain at the foot of the slope", correct: false }
        - { text: "The gravel plateau and the clay-limestone côte", correct: true }
        - { text: "Only the Landes forest", correct: false }
        - { text: "Only the Médoc AOC dunes", correct: false }
      explanation: |
        **Cheval Blanc / Figeac** on gravel, **Ausone / Pavie** on the
        côte. The sandier land below the slope is the third, cheaper zone.
    fr:
      question: Quels deux types de terroir à Saint-Émilion donnent les vins les plus prestigieux ?
      choices:
        - { text: "Seulement la plaine sablonneuse au pied de la pente", correct: false }
        - { text: "Le plateau de graves et la côte argilo-calcaire", correct: true }
        - { text: "Seulement la forêt des Landes", correct: false }
        - { text: "Seulement les dunes de l’AOC Médoc", correct: false }
      explanation: |
        Le **plateau de graves et la côte argilo-calcaire**.
        **Cheval Blanc / Figeac** sur les graves, **Ausone / Pavie**
        sur la côte. Les terres plus sablonneuses sous la pente sont la
        troisième zone, moins chère.

  - id: bordeaux-st-em-prestige-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0102
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do top Saint-Émilion reds usually feel, beyond the fruit?
      choices:
        - { text: "Pale, zero tannin, like a Provence rosé", correct: false }
        - { text: "Medium to high tannin with a plush, rich mid-palate", correct: true }
        - { text: "Always sparkling and bone-dry only", correct: false }
        - { text: "Always thin and green", correct: false }
      explanation: |
        Merlot (and Franc) give **plush fruit** — plum and red berry —
        with enough tannin to age into **cedar and tobacco**. They are not
        a light Nouveau.
    fr:
      question: Quelle structure ont d’habitude les grands rouges de Saint-Émilion, au-delà du fruit ?
      choices:
        - { text: "Pâles, zéro tanin, comme un rosé de Provence", correct: false }
        - { text: "Tanin moyen à élevé, avec un milieu de bouche ample et riche", correct: true }
        - { text: "Toujours effervescents et seulement très secs", correct: false }
        - { text: "Toujours minces et verts", correct: false }
      explanation: |
        **Tanin moyen à élevé, avec un milieu de bouche ample et riche**.
        Merlot (et Franc) donnent un **fruit ample** — prune et baie
        rouge — avec assez de tanin pour vieillir vers **cèdre et
        tabac**. Ce n’est pas un vin primeur léger.

  - id: bordeaux-st-em-plain-001
    type: mcq
    deck: France::Bordeaux
