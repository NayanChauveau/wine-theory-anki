      question: Besides Sauternes and Barsac, where else in the Gironde is sweet wine made in a similar style?
      choices:
        - { text: "Only in Pomerol, Fronsac and Lalande", correct: false }
        - { text: "Nearby AOCs such as Loupiac and Cadillac", correct: true }
        - { text: "Only dry Entre-Deux-Mers communes", correct: false }
        - { text: "Only north of Saint-Estèphe, in the Médoc", correct: false }
      explanation: |
        Same rivers, usually less consistent rot and less oak ambition.
        They sit **across or beside** the Sauternais, not in the Médoc.
    fr:
      question: Outre Sauternes et Barsac, où ailleurs en Gironde fait-on du liquoreux dans un style voisin ?
      choices:
        - { text: "Seulement à Pomerol, Fronsac et Lalande", correct: false }
        - { text: "Des AOC proches comme Loupiac et Cadillac", correct: true }
        - { text: "Seulement les communes sèches d’Entre-Deux-Mers", correct: false }
        - { text: "Seulement au nord de Saint-Estèphe, dans le Médoc", correct: false }
      explanation: |
        Aussi Sainte-Croix-du-Mont et Cérons. Mêmes fleuves, pourriture
        en général moins régulière et moins d’ambition de chêne. Ils
        siègent **en face ou à côté** du
        Sauternais, pas dans le Médoc.

