        - { text: "They must be declassified to IGP only", correct: false }
        - { text: "They must stay in the grand vin", correct: false }
      explanation: |
        **Carruades de Lafite, Forts de Latour, Pagodes de Cos** — the
        named second wines. Surplus or lesser lots can also go to a
        **négociant** blend.
    fr:
      question: Qu’advient-il des lots qui n’entrent pas dans le grand vin chez un château de premier plan ?
      choices:
        - { text: "Ils doivent tous passer en Bordeaux générique", correct: false }
        - { text: "Ils deviennent un second vin, ou partent chez un négociant", correct: true }
        - { text: "Ils doivent être déclassés en IGP seulement", correct: false }
        - { text: "Ils doivent rester dans le grand vin", correct: false }
      explanation: |
        Ils deviennent un **second vin** (parfois un troisième), ou partent chez un **négociant**.
        **Carruades de Lafite, Forts de Latour, Pagodes de Cos** — les
        seconds vins nommés. Les lots de surplus ou plus faibles peuvent
        aussi rejoindre un assemblage de **négociant**.

  - id: bordeaux-barrique-001
