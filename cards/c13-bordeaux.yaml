        - { text: "Chaque bouteille doit désormais passer par le chêne", correct: false }
      explanation: |
        La **concurrence des linéaires** (Chili, Australie, Languedoc) a
        poussé le tri et la maturité. C’est une tendance, pas l’affirmation
        que chaque Bordeaux AOC est devenu un cru classé.

