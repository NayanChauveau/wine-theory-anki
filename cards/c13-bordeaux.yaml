      sources: [known-fact]
    en:
      question: Since 2009, which shared appellation family includes Cadillac, Blaye, Castillon and Francs?
      choices:
        - { text: "The Médoc communal appellations", correct: false }
        - { text: "Côtes de Bordeaux, preceded by the local name", correct: true }
        - { text: "The Saint-Émilion satellite appellations", correct: false }
        - { text: "The Sauternes and Barsac appellations", correct: false }
      explanation: |
        **Cadillac-Côtes de Bordeaux**, **Blaye-**, **Castillon-**,
        **Francs-**. **Côtes de Bourg** stayed out of that 2009 merger.
    fr:
      question: Depuis 2009, à quelle famille d’appellations commune appartiennent Cadillac, Blaye, Castillon et Francs ?
      choices:
        - { text: "Les appellations communales du Médoc", correct: false }
        - { text: "Côtes de Bordeaux, précédé du nom local", correct: true }
        - { text: "Les appellations satellites de Saint-Émilion", correct: false }
        - { text: "Les appellations de Sauternes et Barsac", correct: false }
      explanation: |
        **Cadillac-Côtes de Bordeaux**, **Blaye-**, **Castillon-**,
        **Francs-**. Les **Côtes de Bourg** sont restées hors de cette
        fusion de 2009.

  - id: bordeaux-cotes-style-001
    type: mcq
