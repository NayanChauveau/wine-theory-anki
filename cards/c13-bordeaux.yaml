    en:
      question: Why was the 1855 ranking drawn up?
      choices:
        - { text: "To replace every AOC with a single EU brand", correct: false }
        - { text: "For the Paris Universal Exhibition, the Chamber of Commerce listed the leading Médoc reds and Sauternes", correct: true }
        - { text: "Napoleon III wanted a map of Burgundy only", correct: false }
        - { text: "It was a 1990s marketing stunt by the EU", correct: false }
      explanation: |
        Brokers ranked châteaux by **then-current prices**. Haut-Brion
        (Graves) was slipped into the Médoc red list; Sauternes had its own
        ladder.
    fr:
      question: Pourquoi le classement de 1855 a-t-il été dressé ?
      choices:
        - { text: "Pour remplacer chaque AOC par une seule marque européenne", correct: false }
        - { text: "Pour l’Exposition universelle de Paris, la chambre de commerce a listé les grands rouges du Médoc et les Sauternes", correct: true }
        - { text: "Napoléon III voulait seulement une carte de Bourgogne", correct: false }
        - { text: "C’était un coup marketing de l’UE dans les années 1990", correct: false }
      explanation: |
        Pour l’**Exposition universelle de Paris**, la chambre de commerce a listé les grands rouges du Médoc et les Sauternes.
        Les courtiers ont classé les châteaux selon les **prix d’alors**.
        Haut-Brion (Graves) a été glissé dans la liste des rouges du
        Médoc ; Sauternes avait son propre étage.

