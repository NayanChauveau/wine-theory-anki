    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0120
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: The Ciron meets the Garonne beside which sweet-wine cluster?
      choices:
        - { text: "Only on the Loire at Vouvray", correct: false }
        - { text: "Sauternes and Barsac", correct: true }
        - { text: "Only in Pomerol village", correct: false }
        - { text: "Only north of Saint-Estèphe", correct: false }
      explanation: |
        **Sauternes** and **Barsac** sit where the cold **Ciron** meets
        the **Garonne** — mist for botrytis. Loupiac, Cadillac and
        Sainte-Croix-du-Mont face them across the river.

  - id: bordeaux-botrytis-mist-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do the Garonne and Ciron matter for Sauternes in the vineyard (not the cellar)?
      choices:
        - { text: "They heat the must during ferment", correct: false }
        - { text: "Autumn mist from the rivers sets up noble rot on the bunches", correct: true }
        - { text: "They make irrigation with seawater legal", correct: false }
        - { text: "They freeze every berry into icewine", correct: false }
      explanation: |
        Cold **Ciron** air over the warmer **Garonne** → morning mist,
        then sun. That is a **vineyard** condition for *Botrytis cinerea*,
        not a fermentation trick.

  - id: bordeaux-passerillage-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When autumn stays too dry for noble rot, how else do Sauternais grapes concentrate?
      choices:
        - { text: "By adding seawater", correct: false }
        - { text: "By passerillage — leaving grapes to shrivel on the vine", correct: true }
        - { text: "By a legal duty to chaptalise to 20%", correct: false }
        - { text: "By picking in July only", correct: false }
      explanation: |
        **Passerillage** (dry shrivel) is the fallback. It gives sweet
        wine without the honey-saffron of botrytis — commoner in the
        cheaper satellite AOCs than at Yquem.

