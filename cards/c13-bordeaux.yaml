        - { text: "Red only", correct: false }
        - { text: "Red and dry white", correct: true }
        - { text: "Dry white only", correct: false }
        - { text: "Red, dry white and rosé", correct: false }
      explanation: |
        Both colours are legal. **Haut-Brion** and **Haut-Brion Blanc**
        are the luxury pair; everyday Graves does the same split.
    fr:
      question: Quelles couleurs Graves et Pessac-Léognan peuvent-ils mettre sur le marché ?
      choices:
        - { text: "Rouge seulement", correct: false }
        - { text: "Rouge et blanc sec", correct: true }
        - { text: "Blanc sec seulement", correct: false }
        - { text: "Rouge, blanc sec et rosé", correct: false }
      explanation: |
        Les deux couleurs sont légales. **Haut-Brion** et **Haut-Brion
        Blanc** sont le couple de luxe ; le Graves courant fait le
        même partage.

  - id: bordeaux-graves-edm-white-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0115
    review:
