        - { text: "Frost made every vintage tiny", correct: false }
        - { text: "Every bottle must now be oak-aged", correct: false }
      explanation: |
        **Supermarket competition** (Chile, Australia, Languedoc) pushed
        sorting and ripeness. That is a trend, not a claim that every
        Bordeaux AOC is now a classed growth.
    fr:
      question: Pourquoi beaucoup de Bordeaux de tous les jours sont-ils devenus plus nets et plus mûrs ?
      choices:
