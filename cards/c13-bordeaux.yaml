      choices:
        - { text: "Haut-Médoc", correct: false }
        - { text: "Bas-Médoc", correct: true }
        - { text: "Sauternes", correct: false }
        - { text: "Pomerol", correct: false }
      explanation: |
        **Bas-Médoc** est l’ancien nom géographique du nord plus frais.
        L’AOC sur l’étiquette n’est que **Médoc**.

