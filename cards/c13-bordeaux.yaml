        - { text: "Up to about three years", correct: true }
        - { text: "It must be bottled the week of harvest", correct: false }
        - { text: "Oak is banned in Sauternes", correct: false }
      explanation: |
        **Yquem** is the three-year poster child. Many crus classés sit
        nearer 18–24 months, and not every lot is 100% new oak.
    fr:
      question: Combien de temps un grand Sauternes peut-il rester en barriques (souvent neuves) après la fermentation ?
      choices:
        - { text: "Quarante ans avant de pouvoir l’assembler", correct: false }
        - { text: "Jusqu’à environ trois ans", correct: true }
        - { text: "Il doit être mis la semaine de la vendange", correct: false }
        - { text: "Le chêne est interdit à Sauternes", correct: false }
      explanation: |
        **Jusqu’à environ trois ans**.
        **Yquem** est l’affiche des trois ans. Beaucoup de crus classés
        restent vers 18–24 mois, et tous les lots ne sont pas à 100 % de
        chêne neuf.

