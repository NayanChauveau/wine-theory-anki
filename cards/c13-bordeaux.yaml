    fr:
      question: Quel arôme la Muscadelle ajoute-t-elle à petite dose ?
      choices:
        - { text: "Goudron et roses comme le Nebbiolo", correct: false }
        - { text: "Une note florale et muscatée", correct: true }
        - { text: "Fumée et bacon", correct: false }
        - { text: "Aucune odeur", correct: false }
      explanation: |
        **Une note florale et muscatée**.
        Penser **parfum voisin du Muscat**, pas un cépage de tête. Quelques
        pourcents suffisent.

