cards:
  - id: bordeaux-left-bank-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    en:
      question: Which grape typically dominates Left Bank Bordeaux blends (Médoc and Graves)?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        The gravel soils of the **Médoc and Graves** favour **Cabernet Sauvignon**, which usually leads
        the blend. Merlot is the main grape on the clay-limestone Right Bank
        (Saint-Émilion, Pomerol).
    fr:
      question: Quel cépage domine généralement les assemblages de rive gauche (Médoc et Graves) ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        Les **graves** du Médoc et des **Graves** conviennent au **Cabernet Sauvignon**, qui mène
        souvent l’assemblage. Le Merlot domine la rive droite argilo-calcaire
        (Saint-Émilion, Pomerol).

  - id: bordeaux-right-bank-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    en:
      question: Which pair of appellations is on the Right Bank and typically Merlot-led?
      choices:
        - { text: "Pauillac and Margaux", correct: false }
        - { text: "Pessac-Léognan and Sauternes", correct: false }
        - { text: "Saint-Émilion and Pomerol", correct: true }
        - { text: "Entre-Deux-Mers and Graves", correct: false }
      explanation: |
        **Saint-Émilion** and **Pomerol** sit on the Right Bank (Libournais). Merlot dominates because
        the cooler clay and limestone soils ripen it more reliably than Cabernet Sauvignon.
        Pauillac and Margaux are Left Bank Médoc communes.
    fr:
      question: Quel couple d’appellations se trouve sur la rive droite et est généralement mené par le Merlot ?
      choices:
        - { text: "Pauillac et Margaux", correct: false }
        - { text: "Pessac-Léognan et Sauternes", correct: false }
        - { text: "Saint-Émilion et Pomerol", correct: true }
        - { text: "Entre-Deux-Mers et Graves", correct: false }
      explanation: |
        **Saint-Émilion** et **Pomerol** sont sur la rive droite (Libournais). Le Merlot y domine
        car les sols plus froids d’argile et de calcaire le mûrissent plus sûrement que le
        Cabernet Sauvignon. Pauillac et Margaux sont des communes du Médoc, rive gauche.

  - id: bordeaux-largest-aoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which French AOC vineyard ships the most wine?
      choices:
        - { text: "Chablis", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Sancerre", correct: false }
        - { text: "Bandol", correct: false }
      explanation: |
        **Bordeaux** is the giant by **volume** (and planted area) among French
        AOCs. **Champagne** usually beats it on export **value**. A large IGP
        such as Pays d’Oc can also move huge hectolitres — that is not an AOC.
    fr:
      question: Quelle AOC française a le plus gros volume de vin ?
      choices:
        - { text: "Chablis", correct: false }
        - { text: "Bordeaux", correct: true }
        - { text: "Sancerre", correct: false }
        - { text: "Bandol", correct: false }
      explanation: |
        **Bordeaux** est le géant en **volume** (et en superficie) parmi les
        AOC françaises. **Champagne** le dépasse souvent en **valeur** à
        l’export. Une IGP vaste comme le Pays d’Oc peut aussi bouger d’énormes
        hectolitres — ce n’est pas une AOC.

  - id: bordeaux-climate-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How should you label the Gironde’s climate?
      choices:
        - { text: "Hot continental", correct: false }
        - { text: "Moderate maritime", correct: true }
        - { text: "Cool alpine", correct: false }
        - { text: "Mediterranean", correct: false }
      explanation: |
        The **Atlantic** keeps winters mild and summers moderate. That is
        **maritime**, not a landlocked continental swing.
    fr:
      question: Comment qualifier le climat de la Gironde ?
      choices:
        - { text: "Continental chaud", correct: false }
        - { text: "Maritime tempéré", correct: true }
        - { text: "Alpin frais", correct: false }
        - { text: "Méditerranéen", correct: false }
      explanation: |
        L’**Atlantique** adoucit les hivers et tempère les étés. C’est un
        climat **maritime tempéré**, pas un continental enclavé.

  - id: bordeaux-gulf-stream-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gulf Stream do for Bordeaux’s growing season?
      choices:
        - { text: "It shortens it", correct: false }
        - { text: "It lengthens it", correct: true }
        - { text: "It has no effect on its length", correct: false }
        - { text: "It makes the climate more continental", correct: false }
      explanation: |
        Warm ocean water arriving from the Caribbean **stretches** the season
        so late varieties can still finish.
    fr:
      question: Quel effet le Gulf Stream a-t-il sur la saison végétative à Bordeaux ?
      choices:
        - { text: "Il la raccourcit", correct: false }
        - { text: "Il l’allonge", correct: true }
        - { text: "Il n’a aucun effet sur sa durée", correct: false }
        - { text: "Il la rend plus continentale", correct: false }
      explanation: |
        L’eau océanique chaude venue des Caraïbes étire la saison
        végétative, ce qui permet aux cépages tardifs de finir leur
        maturité.

  - id: bordeaux-october-ripen-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In a late-ripening year, into which month can Cabernet still be hanging?
      choices:
        - { text: "Into August", correct: false }
        - { text: "Into October", correct: true }
        - { text: "Into November", correct: false }
        - { text: "Into June", correct: false }
      explanation: |
        Cabernet Sauvignon in particular can hang **into October**. That is
        why autumn rain is a vintage-maker.
    fr:
      question: Dans un millésime tardif, jusqu’à quel mois le Cabernet peut-il encore rester à la vigne ?
      choices:
        - { text: "Jusqu’en août", correct: false }
        - { text: "Jusqu’en octobre", correct: true }
        - { text: "Jusqu’en novembre", correct: false }
        - { text: "Jusqu’en juin", correct: false }
      explanation: |
        Le Cabernet Sauvignon surtout peut rester sur pied **jusqu’en
        octobre**. D’où le rôle décisif de la pluie d’automne sur le
        millésime.

  - id: bordeaux-frost-rare-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gulf Stream mainly spare the Gironde from in an average year?
      choices:
        - { text: "All rain after June", correct: false }
        - { text: "Widespread spring frost", correct: true }
        - { text: "Any need for drainage", correct: false }
        - { text: "Vintage variation", correct: false }
      explanation: |
        Mild Atlantic air makes **widespread spring frost** less common than
        in Chablis or Champagne. It is not a guarantee: **2017** and **2021**
        still froze large parts of the vineyard.
    fr:
      question: De quoi le Gulf Stream préserve-t-il surtout la Gironde une année moyenne ?
      choices:
        - { text: "Toute pluie après juin", correct: false }
        - { text: "Un gel de printemps généralisé", correct: true }
        - { text: "Tout besoin de drainage", correct: false }
        - { text: "Toute variation de millésime", correct: false }
      explanation: |
        L’air atlantique doux rend un **gel de printemps généralisé** moins
        fréquent qu’à Chablis ou en Champagne. Ce n’est pas une garantie :
        **2017** et **2021** ont quand même gelé de vastes pans du vignoble.

  - id: bordeaux-atlantic-rain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does sitting next to the Atlantic do to Bordeaux weather?
      choices:
        - { text: "It dries out the summers", correct: false }
        - { text: "It brings a lot of rain and humidity", correct: true }
        - { text: "It creates a Mediterranean climate", correct: false }
        - { text: "It eliminates all mist", correct: false }
      explanation: |
        **Wet air and frequent rain** are the maritime tax. Humidity also
        feeds rot.
    fr:
      question: Que change la proximité de l’Atlantique au temps bordelais ?
      choices:
        - { text: "Elle assèche les étés", correct: false }
        - { text: "Elle apporte beaucoup de pluie et d’humidité", correct: true }
        - { text: "Elle crée un climat méditerranéen", correct: false }
        - { text: "Elle élimine toute brume", correct: false }
      explanation: |
        C’est le tribut maritime. L’humidité nourrit aussi la pourriture.

  - id: bordeaux-landes-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two landforms sit between the ocean and the Médoc vines?
      choices:
        - { text: "The dunes and nothing else", correct: false }
        - { text: "The Landes forest and the dunes", correct: true }
        - { text: "The marshes of the Gironde only", correct: false }
        - { text: "The gravel banks of Pauillac", correct: false }
      explanation: |
        The **Landes** pine belt and the **dunes** sit between the ocean and
        the vines. They do not stop rain; they knock the edge off the wind.
    fr:
      question: Quels deux reliefs s’interposent entre l’océan et les vignes du Médoc ?
      choices:
        - { text: "Les dunes et rien d’autre", correct: false }
        - { text: "La forêt des Landes et les dunes", correct: true }
        - { text: "Les marais de la Gironde seulement", correct: false }
        - { text: "Les bancs de graves de Pauillac", correct: false }
      explanation: |
        **La forêt des Landes et les dunes** se dressent entre
        l’océan et les vignes. Elles n’arrêtent pas la pluie ; elles cassent
        la force du vent.

  - id: bordeaux-rain-risks-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can frequent rain spoil a Bordeaux vintage?
      choices:
        - { text: "It only deepens colour at pick", correct: false }
        - { text: "It wrecks flowering, feeds rot, or dilutes fruit", correct: true }
        - { text: "It only hits Cabernet Sauvignon", correct: false }
        - { text: "It always raises alcohol and colour", correct: false }
      explanation: |
        Three separate hits: **coulure / millerandage** at flower, **rot** in
        a wet summer, **dilution** if it pours at harvest.
    fr:
      question: Comment la pluie fréquente peut-elle gâcher un millésime bordelais ?
      choices:
        - { text: "Elle ne fait que foncer la robe à la vendange", correct: false }
        - { text: "Elle ruine la fleur, nourrit la pourriture ou dilue le fruit", correct: true }
        - { text: "Elle n’atteint que le Cabernet Sauvignon", correct: false }
        - { text: "Elle relève toujours le degré et la robe", correct: false }
      explanation: |
        Trois coups distincts : **coulure / millerandage** à la fleur,
        **pourriture** un été humide, **dilution** s’il pleut fort à la vendange.

  - id: bordeaux-vintage-rain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, climate]
    status: reviewed
    source_id: c13-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do Bordeaux vintages swing so much?
      choices:
        - { text: "Because every variety ripens on the same day", correct: false }
        - { text: "Because rain can wreck the vintage", correct: true }
        - { text: "Because the soils are identical everywhere", correct: false }
        - { text: "Because the AOC forbids blending", correct: false }
      explanation: |
        The **rain lottery** is the main reason 2013 and 2018 do not taste
        like twins. Heat spikes matter too; water is the classic exam lever.
    fr:
      question: Pourquoi les millésimes bordelais varient-ils autant ?
      choices:
        - { text: "Parce que tous les cépages mûrissent le même jour", correct: false }
        - { text: "Parce que la pluie peut gâcher le millésime", correct: true }
        - { text: "Parce que les sols sont identiques partout", correct: false }
        - { text: "Parce que l’AOC interdit l’assemblage", correct: false }
      explanation: |
        Fleur, sanitaire ou concentration à la récolte : cette loterie
        explique surtout que 2013 et 2018 ne se ressemblent pas. Les
        pics de chaleur comptent aussi ; l’eau reste le levier classique.

  - id: bordeaux-sorting-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do ambitious châteaux reduce the quality swing from one Bordeaux vintage to the next?
      choices:
        - { text: "By bottling every berry they grow", correct: false }
        - { text: "By throwing out diseased and unripe fruit", correct: true }
        - { text: "By raising yields", correct: false }
        - { text: "By irrigating at will", correct: false }
      explanation: |
        **Table sorting** (and optical sorters at the top addresses) keep
        green and rotten berries out of the grand vin. Second wines absorb
        the rest.
    fr:
      question: Comment les châteaux ambitieux réduisent-ils l’écart de qualité d’un millésime bordelais à l’autre ?
      choices:
        - { text: "En mettant en bouteille chaque baie récoltée", correct: false }
        - { text: "En écartant les raisins malades et les raisins verts", correct: true }
        - { text: "En allongeant les rendements", correct: false }
        - { text: "En irrigant à volonté", correct: false }
      explanation: |
        Ils **écartent les raisins malades et les raisins verts**.
        Le **tri sur table** (et les trieuses optiques chez les plus grandes
        adresses) tient les baies vertes et pourries hors du grand vin. Les
        seconds vins absorbent le reste.

  - id: bordeaux-canopy-health-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After berry sorting, what vineyard change most improved average ripeness and health?
      choices:
        - { text: "Giving up all treatments", correct: false }
        - { text: "Better canopy work and targeted sprays", correct: true }
        - { text: "Lower planting density only", correct: false }
        - { text: "A switch to irrigation only", correct: false }
      explanation: |
        Open canopies dry the fruit and ripen it. Growers still spray — they
        just **spray less blindly**. Do not read that as “Bordeaux went
        spray-free”.
    fr:
      question: Après le tri des baies, quel changement à la vigne a le plus amélioré maturité et état sanitaire moyens ?
      choices:
        - { text: "Un abandon total des traitements", correct: false }
        - { text: "Un meilleur feuillage et des traitements ciblés", correct: true }
        - { text: "Une densité plus faible seulement", correct: false }
        - { text: "Un passage exclusif à l’irrigation", correct: false }
      explanation: |
        Un feuillage ouvert sèche le fruit et le mûrit. On traite encore —
        on **traite moins à l’aveugle**. Cela ne veut pas dire que Bordeaux
        est devenu sans traitement.

  - id: bordeaux-blended-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are almost all red Bordeaux, and most of the whites, made?
      choices:
        - { text: "Almost always as a single variety", correct: false }
        - { text: "As blends", correct: true }
        - { text: "By carbonic maceration", correct: false }
        - { text: "As systematic late-harvest wines", correct: false }
      explanation: |
        **Assemblage** is the house style. A 100% Merlot Pomerol exists, but
        it is the exception, not the rule the chapter teaches.
    fr:
      question: Comment sont élaborés presque tous les rouges de Bordeaux, et la plupart des blancs ?
      choices:
        - { text: "En cépage unique presque toujours", correct: false }
        - { text: "En assemblage", correct: true }
        - { text: "En macération carbonique", correct: false }
        - { text: "En vendange tardive systématique", correct: false }
      explanation: |
        L’**assemblage** est le style de la maison. Un Pomerol 100 % Merlot
        existe, mais c’est l’exception, pas la règle habituelle.

  - id: bordeaux-blend-why-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why blend in Bordeaux at all?
      choices:
        - { text: "The specification requires a single variety", correct: false }
        - { text: "The weather is too unreliable for one variety", correct: true }
        - { text: "The varieties all ripen on the same day", correct: false }
        - { text: "Blending is forbidden in communal AOCs", correct: false }
      explanation: |
        A cold wet week can wreck **one** flowering. A second variety that
        flowers later still has a crop.
    fr:
      question: Pourquoi assembler à Bordeaux ?
      choices:
        - { text: "Le cahier des charges impose un seul cépage", correct: false }
        - { text: "Le temps est trop irrégulier pour un seul cépage", correct: true }
        - { text: "Les cépages mûrissent tous le même jour", correct: false }
        - { text: "L’assemblage est interdit en AOC communale", correct: false }
      explanation: |
        Une semaine froide et humide peut ruiner **une** floraison. Un second
        cépage qui fleurit plus tard garde une récolte.

  - id: bordeaux-staggered-ripen-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does a Merlot–Cabernet mix actually work in Bordeaux?
      choices:
        - { text: "They all flower and ripen together", correct: false }
        - { text: "They flower and ripen on different clocks", correct: true }
        - { text: "Only Merlot is late-ripening", correct: false }
        - { text: "Cabernet flowers before Merlot", correct: false }
      explanation: |
        **Merlot** flowers and ripens first; **Cabernet Sauvignon** last.
        A May storm or an October downpour usually hits one, not both.
    fr:
      question: Pourquoi un assemblage Merlot–Cabernet fonctionne-t-il vraiment à Bordeaux ?
      choices:
        - { text: "Ils fleurissent et mûrissent tous ensemble", correct: false }
        - { text: "Ils fleurissent et mûrissent selon des calendriers différents", correct: true }
        - { text: "Seul le Merlot a un cycle tardif", correct: false }
        - { text: "Le Cabernet fleurit avant le Merlot", correct: false }
      explanation: |
        Le **Merlot** fleurit et mûrit le premier ; le **Cabernet Sauvignon**
        le dernier. Un orage de mai ou une averse d’octobre touche en
        général l’un, pas les deux.

  - id: bordeaux-varieties-count-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many grape varieties did the Bordeaux AOC list allow before the 2021 additions?
      choices:
        - { text: "Five", correct: false }
        - { text: "Thirteen", correct: true }
        - { text: "Twenty", correct: false }
        - { text: "Seven", correct: false }
      explanation: |
        The historic set is **thirteen**. In **2021** INAO added Touriga
        Nacional, Marselan, Castets, Arinarnoa, Alvarinho and Liliorila to
        Bordeaux / Bordeaux Supérieur — not to every communal AOC.
    fr:
      question: Combien de cépages le cahier des charges de l’AOC Bordeaux autorisait-il avant les ajouts de 2021 ?
      choices:
        - { text: "Cinq", correct: false }
        - { text: "Treize", correct: true }
        - { text: "Vingt", correct: false }
        - { text: "Sept", correct: false }
      explanation: |
        L’ensemble historique compte **treize**. En **2021**, l’INAO a ajouté
        Touriga Nacional, Marselan, Castets, Arinarnoa, Alvarinho et
        Liliorila à Bordeaux / Bordeaux Supérieur — pas à chaque AOC
        communale.

  - id: bordeaux-five-main-count-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many varieties actually run the region?
      choices:
        - { text: "All thirteen equally", correct: false }
        - { text: "Three black and two white", correct: true }
        - { text: "Only two black grapes", correct: false }
        - { text: "One white and four black", correct: false }
      explanation: |
        **Cabernet Sauvignon, Merlot, Cabernet Franc** plus **Sémillon** and
        **Sauvignon Blanc**. Petit Verdot, Malbec, Carmenère and Muscadelle
        are supporting grapes.
    fr:
      question: Combien de cépages portent vraiment le vignoble ?
      choices:
        - { text: "Les treize à parts égales", correct: false }
        - { text: "Trois noirs et deux blancs", correct: true }
        - { text: "Seulement deux noirs", correct: false }
        - { text: "Un blanc et quatre noirs", correct: false }
      explanation: |
        Cinq cépages courants : **Cabernet Sauvignon, Merlot, Cabernet
        Franc** plus **Sémillon** et **Sauvignon Blanc**. Petit Verdot,
        Malbec, Carmenère et Muscadelle restent des cépages d’appoint.

  - id: bordeaux-five-named-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which five grapes do most Bordeaux wines actually rely on?
      choices:
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Petit Verdot, Malbec", correct: false }
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Sémillon, Sauvignon Blanc", correct: true }
        - { text: "Sémillon, Sauvignon Blanc, Muscadelle, Sauvignon Gris, Colombard", correct: false }
        - { text: "Merlot, Cabernet Franc, Cabernet Sauvignon, Carmenère, Malbec", correct: false }
      explanation: |
        The Left Bank leans **Cabernet Sauvignon**; the Right Bank **Merlot**.
        **Cabernet Franc** is often the supporting grape. Dry and sweet whites are
        **Sémillon** and **Sauvignon Blanc**.
    fr:
      question: Sur quels cinq cépages s’appuient réellement la plupart des vins de Bordeaux ?
      choices:
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Petit Verdot, Malbec", correct: false }
        - { text: "Cabernet Sauvignon, Merlot, Cabernet Franc, Sémillon, Sauvignon Blanc", correct: true }
        - { text: "Sémillon, Sauvignon Blanc, Muscadelle, Sauvignon Gris, Colombard", correct: false }
        - { text: "Merlot, Cabernet Franc, Cabernet Sauvignon, Carmenère, Malbec", correct: false }
      explanation: |
        La rive gauche penche vers le **Cabernet Sauvignon** ; la rive droite
        vers le **Merlot**. Le **Cabernet Franc** entre souvent en appoint. Les
        blancs secs et liquoreux reposent sur **Sémillon** et **Sauvignon
        Blanc**.

  - id: bordeaux-cs-haut-medoc-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does Cabernet Sauvignon most clearly lead the blend?
      choices:
        - { text: "Pomerol’s clay plateau", correct: false }
        - { text: "The Haut-Médoc", correct: true }
        - { text: "Sauternes only", correct: false }
        - { text: "Entre-Deux-Mers", correct: false }
      explanation: |
        Warm **gravel in the Haut-Médoc** communes (Margaux through
        Saint-Estèphe) is Cabernet country. Pomerol is Merlot’s home.
    fr:
      question: Où le Cabernet Sauvignon mène-t-il le plus nettement l’assemblage ?
      choices:
        - { text: "Le plateau argileux de Pomerol", correct: false }
        - { text: "Le Haut-Médoc", correct: true }
        - { text: "Seulement à Sauternes", correct: false }
        - { text: "L’Entre-Deux-Mers", correct: false }
      explanation: |
        Les **graves chaudes du Haut-Médoc** (de Margaux à Saint-Estèphe)
        sont le pays du Cabernet. Pomerol est le fief du Merlot.

  - id: bordeaux-cs-also-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where else is Cabernet Sauvignon a serious part of the mix?
      choices:
        - { text: "Only in Pomerol", correct: false }
        - { text: "The Médoc AOC (old Bas-Médoc) and Graves", correct: true }
        - { text: "Only in Sauternes", correct: false }
        - { text: "Only in dry Entre-Deux-Mers white", correct: false }
      explanation: |
        **Graves / Pessac-Léognan** gravel also ripens Cabernet. The cooler
        **Médoc AOC** (north of Saint-Estèphe, once called Bas-Médoc) still
        plants it, but Merlot often takes a bigger share there — do not say
        it “dominates” the way it does in Pauillac.
    fr:
      question: Où ailleurs le Cabernet Sauvignon pèse-t-il vraiment dans l’assemblage ?
      choices:
        - { text: "Seulement à Pomerol", correct: false }
        - { text: "L’AOC Médoc (l’ancien Bas-Médoc) et les Graves", correct: true }
        - { text: "Seulement à Sauternes", correct: false }
        - { text: "Seulement en Entre-Deux-Mers blanc", correct: false }
      explanation: |
        À **Pessac-Léognan** comme dans les **Graves**, les graves mûrissent aussi le
        Cabernet. L’**AOC Médoc** plus fraîche (au nord de Saint-Estèphe,
        jadis Bas-Médoc) en plante encore, mais le Merlot y prend souvent
        une plus grande part — on ne dira pas qu’il « domine » comme à
        Pauillac.

  - id: bordeaux-cs-gravel-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can Cabernet Sauvignon ripen reliably only on Left Bank gravel?
      choices:
        - { text: "Cool clay holds too much water", correct: false }
        - { text: "Gravel warms the vineyard and drains it", correct: true }
        - { text: "Limestone is too hot for Cabernet", correct: false }
        - { text: "Sand never drains in the Médoc", correct: false }
      explanation: |
        **Gravel** (the stones) stores heat and sheds water. Cabernet needs
        both. Cool clay on the Right Bank leaves it green in many years;
        Merlot is the safer bet there.
    fr:
      question: Pourquoi le Cabernet Sauvignon ne mûrit-il de façon fiable que sur les graves de rive gauche ?
      choices:
        - { text: "Les argiles froides retiennent trop l’eau", correct: false }
        - { text: "Les graves réchauffent et drainent le vignoble", correct: true }
        - { text: "Le calcaire est trop chaud pour le Cabernet", correct: false }
        - { text: "Le sable ne draine jamais dans le Médoc", correct: false }
      explanation: |
        Les graves emmagasinent la chaleur et évacuent l’eau. Le Cabernet
        a besoin des deux. L’argile fraîche de rive droite le laisse
        souvent vert ; le Merlot y est le pari plus sûr.

  - id: bordeaux-cs-share-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In Haut-Médoc and Graves, how high can Cabernet Sauvignon’s share of a blend go?
      choices:
        - { text: "Rarely more than a quarter", correct: false }
        - { text: "Around three-quarters", correct: true }
        - { text: "Always less than 10%", correct: false }
        - { text: "Always bottled as 100%", correct: false }
      explanation: |
        **About 75%** is a typical Left Bank ceiling in a good Cabernet year,
        not a legal cap. Some classed growths go higher; many sit nearer
        60–70% with Merlot filling the rest.
    fr:
      question: Dans le Haut-Médoc et les Graves, jusqu’où peut aller la part de Cabernet Sauvignon dans un assemblage ?
      choices:
        - { text: "Rarement plus d’un quart", correct: false }
        - { text: "Environ les trois quarts", correct: true }
        - { text: "Toujours moins de 10 %", correct: false }
        - { text: "Toujours mis en 100 %", correct: false }
      explanation: |
        Près de 75 % est un plafond typique de rive gauche lors d’une
        bonne année à Cabernet, pas un plafond légal. Certains crus
        classés vont plus haut ; beaucoup restent vers 60–70 %, le
        Merlot comblant le reste.

  - id: bordeaux-cf-where-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Right Bank AOC is Cabernet Franc’s main Bordeaux address?
      choices:
        - { text: "Pomerol", correct: false }
        - { text: "Saint-Émilion", correct: true }
        - { text: "Sauternes", correct: false }
        - { text: "Pauillac", correct: false }
      explanation: |
        **Saint-Émilion** is Franc’s home (Cheval Blanc, Ausone). It is a
        supporting grape on the Left Bank, not the lead.
    fr:
      question: Quelle AOC de rive droite est la principale adresse bordelaise du Cabernet Franc ?
      choices:
        - { text: "Pomerol", correct: false }
        - { text: "Saint-Émilion", correct: true }
        - { text: "Sauternes", correct: false }
        - { text: "Pauillac", correct: false }
      explanation: |
        **Saint-Émilion** est le fief du Franc (Cheval Blanc, Ausone). Sur
        la rive gauche, c’est un cépage d’appoint, pas le meneur.

  - id: bordeaux-cf-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Compared with Cabernet Sauvignon, what does ripe Cabernet Franc usually bring to the blend?
      choices:
        - { text: "Heavier body and more tannin", correct: false }
        - { text: "Less body and tannin, more floral fruit", correct: true }
        - { text: "More alcohol and less acidity", correct: false }
        - { text: "It only makes sweet wine", correct: false }
      explanation: |
        Franc is the **perfume and lift**, not the tannic spine. If it is
        picked too early it goes stalky — same green trap as Cabernet
        Sauvignon, just on an earlier clock.
    fr:
      question: Face au Cabernet Sauvignon, qu’apporte généralement un Cabernet Franc mûr à l’assemblage ?
      choices:
        - { text: "Plus de corps et plus de tanin", correct: false }
        - { text: "Moins de corps et de tanin, plus de fruit floral", correct: true }
        - { text: "Plus d’alcool et moins d’acidité", correct: false }
        - { text: "Il ne donne que du vin liquoreux", correct: false }
      explanation: |
        Le Franc apporte **parfum et légèreté**, pas l’épine tannique. Vendangé
        trop tôt, il devient végétal — le même piège vert que le Cabernet
        Sauvignon, simplement plus tôt.

  - id: bordeaux-cf-soil-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can Cabernet Franc ripen on Saint-Émilion limestone where Cabernet Sauvignon often fails?
      choices:
        - { text: "Limestone is hotter than Médoc gravel", correct: false }
        - { text: "It ripens earlier on cooler limestone", correct: true }
        - { text: "It ripens later than Cabernet Sauvignon", correct: false }
        - { text: "It needs more heat than Cabernet Sauvignon", correct: false }
      explanation: |
        Limestone is **drained but cooler** than Left Bank gravel. Franc’s
        **shorter cycle** finishes there; Cabernet Sauvignon often stays
        green. Warm gravel still suits Franc — it is not a cold-climate grape.
    fr:
      question: Pourquoi le Cabernet Franc peut-il mûrir sur le calcaire de Saint-Émilion là où le Cabernet Sauvignon échoue souvent ?
      choices:
        - { text: "Le calcaire est plus chaud que les graves du Médoc", correct: false }
        - { text: "Il mûrit plus tôt sur un calcaire plus frais", correct: true }
        - { text: "Il mûrit plus tard que le Cabernet Sauvignon", correct: false }
        - { text: "Il exige plus de chaleur que le Cabernet Sauvignon", correct: false }
      explanation: |
        Le calcaire est **drainé mais plus frais** que les graves de rive
        gauche. Le **cycle plus court** du Franc s’y termine ; le Cabernet
        Sauvignon reste souvent vert. Les graves chaudes conviennent aussi
        au Franc — ce n’est pas un cépage de climat froid.

  - id: bordeaux-merlot-most-planted-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which black grape occupies more Bordeaux hectares than any other?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        **Merlot** is more than half the vineyard. Cabernet Sauvignon is
        second, then Cabernet Franc; none of them overtake Merlot. It
        ripens earlier, so it is the safer plant on clay and in generic
        Bordeaux AOC.
    fr:
      question: Quel cépage noir occupe plus d’hectares à Bordeaux que tout autre ?
      choices:
        - { text: "Petit Verdot", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        Le **Merlot** couvre plus de la moitié du vignoble. Le Cabernet
        Sauvignon est deuxième, puis le Cabernet Franc ; aucun ne dépasse
        le Merlot. Plus précoce, il est le plant plus sûr sur l’argile et
        en AOC Bordeaux générique.

  - id: bordeaux-merlot-premium-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In which two AOCs is Merlot the lead grape of the top reds?
      choices:
        - { text: "Only in Sauternes", correct: false }
        - { text: "Saint-Émilion and Pomerol", correct: true }
        - { text: "Pauillac and Margaux", correct: false }
        - { text: "Only in the far north of the Médoc AOC", correct: false }
      explanation: |
        **Pétrus** and **Le Pin** are Merlot houses. **Cheval Blanc** is
        Franc-led; **Ausone** is a Merlot–Franc pair — so not every Right
        Bank icon is a Merlot monologue. Left Bank first growths remain
        Cabernet houses.
    fr:
      question: Dans quelles deux AOC le Merlot mène-t-il les grands rouges ?
      choices:
        - { text: "Seulement à Sauternes", correct: false }
        - { text: "Saint-Émilion et Pomerol", correct: true }
        - { text: "Pauillac et Margaux", correct: false }
        - { text: "Seulement à l’extrême nord de l’AOC Médoc", correct: false }
      explanation: |
        **Pétrus** et **Le Pin** sont des maisons à Merlot. **Cheval Blanc**
        est mené par le Franc ; **Ausone** couple Merlot et Franc — toutes les
        icônes de rive droite ne sont donc pas un monologue de Merlot. Les
        premiers crus de rive gauche restent des maisons à Cabernet.

  - id: bordeaux-merlot-clay-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why plant Merlot rather than Cabernet Sauvignon on Saint-Émilion and Pomerol clay?
      choices:
        - { text: "Cabernet Sauvignon ripens earlier on that clay", correct: false }
        - { text: "Merlot can still ripen on that cooler clay", correct: true }
        - { text: "Clay is too hot for Merlot", correct: false }
        - { text: "Cabernet Sauvignon is the earlier grape there", correct: false }
      explanation: |
        Clay stays **cold and wet**. Merlot’s earlier cycle finishes; Cabernet
        Sauvignon’s does not, except on warmer gravel pockets (Figeac).
    fr:
      question: Pourquoi planter du Merlot plutôt que du Cabernet Sauvignon sur les argiles de Saint-Émilion et de Pomerol ?
      choices:
        - { text: "Le Cabernet Sauvignon y mûrit plus tôt", correct: false }
        - { text: "Le Merlot peut encore mûrir sur cette argile plus fraîche", correct: true }
        - { text: "L’argile est trop chaude pour le Merlot", correct: false }
        - { text: "Le Cabernet Sauvignon est le cépage plus précoce là-bas", correct: false }
      explanation: |
        Le Cabernet Sauvignon reste souvent vert. L’argile reste **froide
        et humide**. Le cycle plus précoce du Merlot s’y termine ; celui
        du Cabernet Sauvignon non, sauf sur des poches de graves plus
        chaudes (Figeac).

  - id: bordeaux-merlot-volume-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape fills most inexpensive, high-volume Bordeaux rouge?
      choices:
        - { text: "Petit Verdot, because it is earlier-ripening", correct: false }
        - { text: "Merlot, because it ripens earlier and tastes softer", correct: true }
        - { text: "Cabernet Sauvignon, because it is more tannic", correct: false }
        - { text: "Cabernet Franc, because it is only floral", correct: false }
      explanation: |
        **Merlot** gives earlier sugar, lower tannin, and a crop on clay —
        useful for Bordeaux AOC sold in the first year. Softness is the
        tasting reason; reliability is the economic one.
    fr:
      question: Quel cépage remplit la plupart des Bordeaux rouge bon marché et de gros volume ?
      choices:
        - { text: "Le Petit Verdot, parce qu’il est plus précoce", correct: false }
        - { text: "Le Merlot, parce qu’il mûrit plus tôt et est plus souple en bouche", correct: true }
        - { text: "Le Cabernet Sauvignon, parce qu’il est plus tannique", correct: false }
        - { text: "Le Cabernet Franc, parce qu’il n’est que floral", correct: false }
      explanation: |
        Le **Merlot** donne du sucre plus tôt, moins de tanin, et une
        récolte sur l’argile — utile pour un Bordeaux AOC vendu dès la
        première année. La souplesse est la raison de dégustation ; la
        fiabilité, la raison économique.

  - id: bordeaux-pv-hot-years-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Bordeaux grape used to ripen fully only in the hottest summers?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Petit Verdot", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Muscadelle", correct: false }
      explanation: |
        **Petit Verdot** is late. In cooler decades it was a 1–3% spice jar.
        Warmer vintages now ripen it more often — do not say it *never*
        ripens today.
    fr:
      question: Quel cépage bordelais ne mûrissait pleinement, autrefois, que les étés les plus chauds ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Petit Verdot", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Muscadelle", correct: false }
      explanation: |
        Le **Petit Verdot** est tardif. Dans les décennies plus fraîches, il
        n’était qu’un pot d’épices à 1–3 %. Les millésimes plus chauds le
        mûrissent plus souvent — on ne dira pas qu’il ne mûrit *jamais*
        aujourd’hui.

  - id: bordeaux-pv-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What structure does ripe Petit Verdot usually add?
      choices:
        - { text: "Pale colour and almost no tannin", correct: false }
        - { text: "Deep colour and firm tannin", correct: true }
        - { text: "Very low acidity and little colour", correct: false }
        - { text: "Soft tannin and a pale robe", correct: false }
      explanation: |
        **Ink and structure** — a supporting grape. **Château Palmer** has
        used a visible share; most Left Bank blends keep it to a few percent.
    fr:
      question: Quelle structure un Petit Verdot mûr ajoute-t-il d’habitude ?
      choices:
        - { text: "Une robe pâle et presque pas de tanin", correct: false }
        - { text: "Une robe profonde et un tanin ferme", correct: true }
        - { text: "Une acidité très basse et peu de couleur", correct: false }
        - { text: "Un tanin souple et une robe pâle", correct: false }
      explanation: |
        **Une robe profonde et un tanin ferme**, et une évolution lente en bouteille.
        **Encre et structure** — un cépage d’appoint. **Château
        Palmer** en a utilisé une part visible ; la plupart des assemblages
        de rive gauche le tiennent à quelques pourcents.

  - id: bordeaux-pv-role-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a splash of Petit Verdot add to a Left Bank blend?
      choices:
        - { text: "Only residual sugar", correct: false }
        - { text: "Colour, tannin and a spicy note", correct: true }
        - { text: "Only acidity", correct: false }
        - { text: "Only floral perfume, no colour", correct: false }
      explanation: |
        **Colour, tannin, spice** (violet / liquorice). Palmer and a few
        others have used more than a dash; most keep it tiny.
    fr:
      question: Qu’ajoute une touche de Petit Verdot à un assemblage de rive gauche ?
      choices:
        - { text: "Seulement du sucre résiduel", correct: false }
        - { text: "De la couleur, du tanin et une note épicée", correct: true }
        - { text: "Seulement de l’acidité", correct: false }
        - { text: "Seulement un parfum floral, sans couleur", correct: false }
      explanation: |
        **Couleur, tanin, épice** (violette / réglisse). Palmer et quelques
        autres en ont mis plus qu’une pincée ; la plupart le gardent minuscule.

  - id: bordeaux-vessels-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Is there one agreed fermenter for Bordeaux red?
      choices:
        - { text: "Only new barriques", correct: false }
        - { text: "No — wood, steel or concrete as they like", correct: true }
        - { text: "Only large foudres", correct: false }
        - { text: "Only concrete, never stainless steel", correct: false }
      explanation: |
        Stainless, wood and **concrete eggs / tanks** all appear. The region
        does not agree on one “best” fermenter.
    fr:
      question: Les rouges de Bordeaux fermentent-ils tous dans le même type de cuve ?
      choices:
        - { text: "Seulement en barriques neuves", correct: false }
        - { text: "Non — bois, inox ou béton, au choix", correct: true }
        - { text: "Seulement en foudres", correct: false }
        - { text: "Seulement en béton, jamais d’inox", correct: false }
      explanation: |
        Inox, bois et **œufs / cuves en béton** se croisent. La région ne
        s’accorde pas sur une « meilleure » cuve.

  - id: bordeaux-blend-spring-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, winemaking]
    status: reviewed
    source_id: c13-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When do most châteaux assemble the grand vin?
      choices:
        - { text: "In the vineyard, before harvest", correct: false }
        - { text: "In the spring after the vintage", correct: true }
        - { text: "After ten years in bottle", correct: false }
        - { text: "During alcoholic fermentation", correct: false }
      explanation: |
        After malolactic and a first look at the lots: typically **March–
        June**. En primeur week sits on that early blend.
    fr:
      question: Quand la plupart des châteaux assemblent-ils le grand vin ?
      choices:
        - { text: "À la vigne, avant la vendange", correct: false }
        - { text: "Au printemps qui suit le millésime", correct: true }
        - { text: "Après dix ans de bouteille", correct: false }
        - { text: "Pendant la fermentation alcoolique", correct: false }
      explanation: |
        Après la malo et un premier regard sur les lots : typiquement
        **mars–juin**. La semaine des primeurs s’appuie sur cet assemblage
        précoce.

  - id: bordeaux-blend-late-001
