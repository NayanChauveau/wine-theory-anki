      question: Which communal AOC is the northernmost of the Haut-Médoc, just before Médoc AOC begins?
      choices:
        - { text: "Margaux", correct: false }
        - { text: "Saint-Estèphe", correct: true }
        - { text: "Pauillac", correct: false }
        - { text: "Saint-Julien", correct: false }
      explanation: |
        **Saint-Estèphe** is the northernmost of the four big communes.
        Haut-Médoc AOC land also wraps around them; the prestige strip
        ends here.
    fr:
      question: Quelle AOC communale est la plus septentrionale du Haut-Médoc, juste avant le début de l’AOC Médoc ?
      choices:
        - { text: "Margaux", correct: false }
        - { text: "Saint-Estèphe", correct: true }
        - { text: "Pauillac", correct: false }
        - { text: "Saint-Julien", correct: false }
      explanation: |
        **Saint-Estèphe** ferme au nord la série des quatre grandes communes. L’AOC Haut-Médoc
        les enveloppe aussi ; la bande de prestige s’arrête ici.

  - id: bordeaux-communes-word-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0086
