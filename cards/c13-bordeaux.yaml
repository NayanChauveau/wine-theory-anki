      question: What do we call the village-level AOCs nested inside Haut-Médoc?
      choices:
        - { text: "Crus classés", correct: false }
        - { text: "Communes", correct: true }
        - { text: "Crus bourgeois", correct: false }
        - { text: "Satellite AOCs", correct: false }
      explanation: |
        **Communal AOCs**: Saint-Estèphe, Pauillac, Saint-Julien, Margaux,
        plus **Moulis** and **Listrac** inland. Haut-Médoc is the district
        envelope.
    fr:
      question: Comment nomme-t-on les AOC de village nichées dans le Haut-Médoc ?
      choices:
        - { text: "Crus classés", correct: false }
        - { text: "Communes", correct: true }
        - { text: "Crus bourgeois", correct: false }
        - { text: "AOC satellites", correct: false }
      explanation: |
        **AOC communales** : Saint-Estèphe, Pauillac, Saint-Julien,
        Margaux, plus **Moulis** et **Listrac** à l’intérieur des terres.
        Le Haut-Médoc est l’enveloppe de district.

  - id: bordeaux-four-communes-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0087
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: North to south along the Gironde, in what order do the four most famous Haut-Médoc communes lie?
      choices:
        - { text: "Margaux, Saint-Julien, Pauillac, Saint-Estèphe", correct: false }
        - { text: "Saint-Estèphe, Pauillac, Saint-Julien, Margaux", correct: true }
        - { text: "Pauillac, Saint-Estèphe, Margaux, Saint-Julien", correct: false }
        - { text: "Saint-Estèphe, Saint-Julien, Pauillac, Margaux", correct: false }
      explanation: |
        Memorise that **north→south** order. **Moulis** and **Listrac**
        sit west of the gravel ridge and are not in that river-front four.
    fr:
      question: Du nord au sud le long de la Gironde, dans quel ordre se suivent les quatre communes les plus réputées du Haut-Médoc ?
      choices:
        - { text: "Margaux, Saint-Julien, Pauillac, Saint-Estèphe", correct: false }
        - { text: "Saint-Estèphe, Pauillac, Saint-Julien, Margaux", correct: true }
        - { text: "Pauillac, Saint-Estèphe, Margaux, Saint-Julien", correct: false }
        - { text: "Saint-Estèphe, Saint-Julien, Pauillac, Margaux", correct: false }
      explanation: |
        Retenir cet ordre **nord→sud**. **Moulis** et **Listrac** sont à
        l’ouest de la croupe de graves et ne font pas partie de ce
        quatuor riverain.

  - id: bordeaux-commune-cs-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0088
    review:
