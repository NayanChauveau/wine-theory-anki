        - { text: "Trois", correct: true }
        - { text: "Vingt-quatre climats officiels", correct: false }
        - { text: "Aucun — l’AOC est un seul champ plat", correct: false }
      explanation: |
        **Trois**.
        Un **plateau de graves et de sables** vers Pomerol, une **côte
        argilo-calcaire** autour de la ville, et des **terres plus
        sablonneuses, plus ordinaires** sur la plaine. On n’en fera pas
        une carte légale de 24 crus.

