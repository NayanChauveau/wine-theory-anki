        - { text: "Only Petit Verdot rosé", correct: false }
        - { text: "Only Muscadelle reds", correct: false }
      explanation: |
        **Entre-Deux-Mers** and generic dry whites can be straight Sauvignon
        Blanc. That is the usual exception to the blend rule — not the only
        one: some Pomerols are near-100% Merlot (Pétrus).
    fr:
      question: Quels vins de Bordeaux se mettent le plus souvent en bouteille en cépage unique ?
      choices:
        - { text: "Chaque rouge doit être 100 % Cabernet par la loi", correct: false }
        - { text: "Certains blancs secs élaborés uniquement en Sauvignon Blanc", correct: true }
        - { text: "Seulement le rosé de Petit Verdot", correct: false }
        - { text: "Seulement les rouges de Muscadelle", correct: false }
      explanation: |
        **Certains blancs secs élaborés uniquement en Sauvignon Blanc**.
        L’**Entre-Deux-Mers** et les blancs secs génériques peuvent être du
        Sauvignon Blanc pur. C’est l’exception habituelle à la règle de
        l’assemblage — pas la seule : certains Pomerol approchent 100 %
        Merlot (Pétrus).

  - id: bordeaux-sb-acid-blend-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Sauvignon Blanc mainly contribute when it is the junior partner in a Bordeaux white?
      choices:
        - { text: "Deep red colour", correct: false }
        - { text: "High acidity", correct: true }
        - { text: "Noble rot on its own", correct: false }
        - { text: "A legal right to the word Sauternes", correct: false }
      explanation: |
        **Acidity and lift**. Sémillon brings the body; Sauvignon Blanc keeps
        the blend from going flabby.
    fr:
      question: Qu’apporte surtout le Sauvignon Blanc lorsqu’il est le cépage d’appoint d’un blanc de Bordeaux ?
      choices:
        - { text: "Une robe rouge profonde", correct: false }
        - { text: "Une acidité élevée", correct: true }
        - { text: "La pourriture noble à lui seul", correct: false }
        - { text: "Le droit légal d’écrire Sauternes", correct: false }
      explanation: |
        **Acidité et élan**. Le Sémillon apporte le corps ; le Sauvignon
        Blanc empêche l’assemblage de devenir mou.

  - id: bordeaux-sb-sweet-acid-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why keep Sauvignon Blanc in a Sauternes or Barsac blend?
      choices:
        - { text: "It is the only legal grape", correct: false }
        - { text: "It supplies the acidity that noble-rot Sémillon loses", correct: true }
        - { text: "It turns the wine red", correct: false }
        - { text: "It stops botrytis from ever forming", correct: false }
      explanation: |
        Botrytised Sémillon is rich and low-acid. A slice of **Sauvignon
        Blanc** keeps **Yquem** (and most Barsac/Sauternes blends) from
        tasting like syrup. **Climens** is the named exception: it is
        bottled as 100% Sémillon.
    fr:
      question: Pourquoi garder du Sauvignon Blanc dans un assemblage de Sauternes ou de Barsac ?
      choices:
        - { text: "C’est le seul cépage autorisé", correct: false }
        - { text: "Il fournit l’acidité que le Sémillon en pourriture noble perd", correct: true }
        - { text: "Il rougit le vin", correct: false }
        - { text: "Il empêche la botrytis de se former jamais", correct: false }
      explanation: |
        Il **fournit l’acidité que le Sémillon en pourriture noble perd**.
        Le Sémillon botrytisé est riche et peu acide. Une part de
        **Sauvignon Blanc** empêche **Yquem** (et la plupart des
        assemblages de Barsac/Sauternes) de goûter comme un sirop.
        **Climens** est l’exception nommée : il se met en 100 % Sémillon.

  - id: bordeaux-muscadelle-flavour-001
