        - { text: "Ugni Blanc", correct: false }
        - { text: "Chenin Blanc", correct: false }
      explanation: |
        **Sauvignon Blanc** for lift and aroma; Sémillon for weight.
        Haut-Brion Blanc and the Pessac dry whites sit on that pair.
    fr:
      question: Aux côtés du Sémillon, quel cépage entre habituellement dans l’assemblage des blancs secs de Pessac-Léognan et des Graves ?
      choices:
        - { text: "Colombard", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
        - { text: "Ugni Blanc", correct: false }
        - { text: "Chenin Blanc", correct: false }
      explanation: |
        Le **Sauvignon Blanc** pour la fraîcheur et l’arôme ; le Sémillon pour le corps.
        Haut-Brion Blanc et les blancs secs de Pessac reposent sur ce couple.

  - id: bordeaux-semillon-body-001
