    fr:
      question: Qui siège en Saint-Émilion Premier Grand Cru Classé A sur la liste de 2022 ?
      choices:
        - { text: "Ausone et Cheval Blanc", correct: false }
        - { text: "Figeac et Pavie", correct: true }
        - { text: "Pétrus et Le Pin", correct: false }
        - { text: "Angélus et Pavie", correct: false }
