      sources: [known-fact]
    en:
      question: In Saint-Estèphe, Pauillac, Saint-Julien and Margaux, which grape usually takes the largest share?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Petit Verdot", correct: false }
      explanation: |
        Warm **gravel** → **Cabernet Sauvignon** lead, Merlot and Franc in
        support. Margaux can be a little more Merlot-friendly than Pauillac.
    fr:
      question: À Saint-Estèphe, Pauillac, Saint-Julien et Margaux, quel cépage prend d’habitude la plus grande part ?
      choices:
        - { text: "Merlot", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Petit Verdot", correct: false }
      explanation: |
        **Graves** chaudes → le **Cabernet Sauvignon** mène, Merlot et
        Franc en soutien. Margaux peut être un peu plus ouvert au Merlot
        que Pauillac.

  - id: bordeaux-commune-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fruit-and-oak signature do Haut-Médoc communal reds usually show when young?
      choices:
        - { text: "Red fruit and soft tannin", correct: false }
        - { text: "Blackcurrant, cedar, and firm tannin", correct: true }
        - { text: "Jammy black fruit and low tannin", correct: false }
        - { text: "Floral notes and little oak", correct: false }
      explanation: |
        **Cassis + cedar + grip**. They can be tough at five years; the
        point of the communal crus is a long curve, not a nouveau.
    fr:
      question: Quelle signature de fruit et de chêne les rouges communaux du Haut-Médoc montrent-ils d’habitude dans leur jeunesse ?
      choices:
        - { text: "Fruits rouges et tanin souple", correct: false }
        - { text: "Cassis, cèdre et tanin ferme", correct: true }
        - { text: "Fruits noirs confiturés et peu de tanin", correct: false }
        - { text: "Notes florales et peu de bois", correct: false }
      explanation: |
        **Cassis, cèdre et poigne**. Ils peuvent être durs à cinq ans ; les crus communaux
        sont faits pour une longue garde, pas pour être bus en primeur.

  - id: bordeaux-pessac-where-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which AOC starts on the southern edge of Bordeaux city?
      choices:
        - { text: "Sauternes", correct: false }
        - { text: "Pessac-Léognan", correct: true }
        - { text: "Margaux", correct: false }
        - { text: "Entre-Deux-Mers", correct: false }
      explanation: |
        Created in **1987** as northern Graves: suburbs and woods just
        south of town. Haut-Brion is inside the urban sprawl.
    fr:
      question: Quelle AOC commence au bord sud de la ville de Bordeaux ?
      choices:
        - { text: "Sauternes", correct: false }
        - { text: "Pessac-Léognan", correct: true }
        - { text: "Margaux", correct: false }
        - { text: "Entre-Deux-Mers", correct: false }
      explanation: |
        Créée en **1987** : le nord des Graves, banlieues et bois juste
        au sud de la ville. Haut-Brion est dans le tissu urbain.

  - id: bordeaux-pessac-soil-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What soil type made Pessac-Léognan famous?
      choices:
        - { text: "Clay", correct: false }
        - { text: "Gravel", correct: true }
        - { text: "Sand", correct: false }
        - { text: "Limestone", correct: false }
      explanation: |
        **Graves** means gravel. Sand and some clay sit underneath; the
        heat-holding stones are why Cabernet can finish here.
    fr:
      question: Quel type de sol a fait la réputation de Pessac-Léognan ?
      choices:
        - { text: "Argile", correct: false }
        - { text: "Graves", correct: true }
        - { text: "Sable", correct: false }
        - { text: "Calcaire", correct: false }
      explanation: |
        **Graves** : des cailloux, pas seulement le nom de l’AOC. Sable et
        un peu d’argile dessous ; les pierres qui retiennent la chaleur
        expliquent que le Cabernet puisse y finir.

  - id: bordeaux-pessac-grape-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, left-bank]
    status: reviewed
    source_id: c13-0092
