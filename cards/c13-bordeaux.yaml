      explanation: |
        **Haut-Brion Blanc**, Laville / La Mission blanc, Smith Haut
        Lafitte blanc. Entre-Deux-Mers is the volume white.
    fr:
      question: Haut-Brion Blanc et Smith Haut Lafitte blanc s’étiquettent en quelle AOC ?
      choices:
        - { text: "Graves", correct: false }
        - { text: "Pessac-Léognan", correct: true }
        - { text: "Entre-Deux-Mers", correct: false }
        - { text: "Bordeaux Blanc", correct: false }
      explanation: |
        **Haut-Brion Blanc**, Laville / La Mission blanc, Smith Haut
        Lafitte blanc. Entre-Deux-Mers est le blanc de volume.

  - id: bordeaux-white-cru-classe-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where can a dry white Bordeaux carry the words cru classé?
      choices:
