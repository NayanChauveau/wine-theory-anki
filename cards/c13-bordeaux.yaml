        - { text: "Cabernet Franc", correct: true }
        - { text: "Petit Verdot", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        **Cheval Blanc** and **Ausone** are the named addresses.
        Cabernet Sauvignon is third, and only where gravel warms the
        plateau.
    fr:
      question: Après le Merlot, quel cépage noir est le partenaire habituel de la rive droite ?
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Cabernet Franc", correct: true }
        - { text: "Petit Verdot", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        **Cheval Blanc** et **Ausone** en sont les adresses-phares. Le
        Cabernet Sauvignon arrive troisième, et seulement là où les
        graves réchauffent le plateau.

  - id: bordeaux-st-em-larger-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0097
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Roughly how does Saint-Émilion’s vineyard area compare with Pomerol’s?
      choices:
        - { text: "About half the size", correct: false }
        - { text: "Several times larger", correct: true }
        - { text: "About the same size", correct: false }
        - { text: "Slightly smaller", correct: false }
      explanation: |
        **Saint-Émilion itself** covers far more vineyard area than tiny
        **Pomerol**; its four satellite appellations make the wider
        Saint-Émilion sector larger still. Price per bottle can run the
        other way.
    fr:
      question: Comment la superficie viticole de Saint-Émilion se compare-t-elle à peu près à celle de Pomerol ?
      choices:
        - { text: "Environ la moitié", correct: false }
        - { text: "Plusieurs fois plus vaste", correct: true }
        - { text: "À peu près la même", correct: false }
        - { text: "Un peu plus petite", correct: false }
      explanation: |
        **Saint-Émilion même** couvre bien plus de vignes que le minuscule
        **Pomerol** ; ses quatre appellations satellites agrandissent encore
        l’ensemble du secteur. Le prix à la bouteille peut aller dans
        l’autre sens.

  - id: bordeaux-st-em-three-zones-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many broad terroir types do we split Saint-Émilion into?
      choices:
        - { text: "Two", correct: false }
        - { text: "Three", correct: true }
        - { text: "Four", correct: false }
        - { text: "Five", correct: false }
      explanation: |
        A **gravel-and-sand plateau** toward Pomerol, a **clay-limestone
        côte** around the town, and **sandier, lesser land** on the plain.
        Do not turn that into a legal map of 24 crus.
    fr:
      question: En combien de grands types de terroir découpe-t-on Saint-Émilion ?
      choices:
        - { text: "Deux", correct: false }
        - { text: "Trois", correct: true }
        - { text: "Quatre", correct: false }
        - { text: "Cinq", correct: false }
      explanation: |
        Un **plateau de graves et de sables** vers Pomerol, une **côte
        argilo-calcaire** autour de la ville, et des **terres plus
        sablonneuses, plus ordinaires** sur la plaine. On n’en fera pas
        une carte légale de 24 crus.

  - id: bordeaux-st-em-plateau-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0099
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where are Cheval Blanc and Figeac in Saint-Émilion?
      choices:
        - { text: "On the clay-limestone côte", correct: false }
        - { text: "On the warm gravel plateau", correct: true }
        - { text: "On the sandy plain", correct: false }
        - { text: "In Pomerol, across the border", correct: false }
      explanation: |
        The **north-west plateau** is the Graves-like pocket. Merlot is
        still planted; **Cabernet Franc and some Cabernet Sauvignon** can
        ripen here. Franc also ripens on Ausone’s limestone côte — it does
        not “fail” there.
    fr:
      question: Où se situent Cheval Blanc et Figeac dans Saint-Émilion ?
      choices:
        - { text: "Sur la côte argilo-calcaire", correct: false }
        - { text: "Sur le plateau de graves chaudes", correct: true }
        - { text: "Sur la plaine sablonneuse", correct: false }
        - { text: "Dans Pomerol, de l’autre côté", correct: false }
      explanation: |
        Le **plateau du nord-ouest** est la poche façon Graves. On y
        plante encore du Merlot ; **Cabernet Franc et un peu de
        Cabernet Sauvignon** peuvent y mûrir. Le Franc mûrit aussi sur
        la côte calcaire d’Ausone — il n’y « échoue » pas.

  - id: bordeaux-st-em-cote-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0100
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What soils cover the escarpment south and east of Saint-Émilion town?
      choices:
        - { text: "Plain sands", correct: false }
        - { text: "Clay-limestone", correct: true }
        - { text: "Plateau gravel", correct: false }
        - { text: "Pomerol clays", correct: false }
      explanation: |
        The **côtes**: **argilo-calcaire**. **Ausone** and **Pavie** sit
        on this slope, not on Figeac’s gravel.
    fr:
      question: Quels sols couvrent l’escarpement au sud et à l’est de la ville de Saint-Émilion ?
      choices:
        - { text: "Sables de plaine", correct: false }
        - { text: "Argilo-calcaire", correct: true }
        - { text: "Graves de plateau", correct: false }
        - { text: "Argiles de Pomerol", correct: false }
      explanation: |
        Les **côtes** : **argilo-calcaire**. **Ausone** et **Pavie**
        sont sur cette pente, pas sur les graves de Figeac.

  - id: bordeaux-st-em-prestige-zones-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two Saint-Émilion landforms produce the most prestigious wines?
      choices:
        - { text: "The gravel plateau and the sandy plain", correct: false }
        - { text: "The gravel plateau and the clay-limestone côte", correct: true }
        - { text: "The clay-limestone côte and the sandy plain", correct: false }
      explanation: |
        **Cheval Blanc / Figeac** on gravel, **Ausone / Pavie** on the
        côte. The sandier land below the slope is the third, cheaper zone.
    fr:
      question: Quels deux types de terroir à Saint-Émilion donnent les vins les plus prestigieux ?
      choices:
        - { text: "Le plateau de graves et la plaine sablonneuse", correct: false }
        - { text: "Le plateau de graves et la côte argilo-calcaire", correct: true }
        - { text: "La côte argilo-calcaire et la plaine sablonneuse", correct: false }
      explanation: |
        **Cheval Blanc / Figeac** sur les graves, **Ausone / Pavie**
        sur la côte. Les terres plus sablonneuses sous la pente sont la
        troisième zone, moins chère.

  - id: bordeaux-st-em-prestige-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0102
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What structure do top Saint-Émilion reds usually show?
      choices:
        - { text: "Very high tannin and a lean, austere body", correct: false }
        - { text: "Medium to high tannin and a rich, soft texture", correct: true }
        - { text: "Low tannin and a light, simple body", correct: false }
        - { text: "Low tannin and a full, jammy body", correct: false }
      explanation: |
        Merlot (and Franc) give **plush fruit** — plum and red berry —
        with enough tannin to age into **cedar and tobacco**. They are not
        a light Nouveau.
    fr:
      question: Quelle structure ont d’habitude les grands rouges de Saint-Émilion ?
      choices:
        - { text: "Tanin très élevé, corps maigre et austère", correct: false }
        - { text: "Tanin moyen à élevé, texture riche et souple", correct: true }
        - { text: "Peu de tanin, corps léger et simple", correct: false }
        - { text: "Peu de tanin, corps plein et confituré", correct: false }
      explanation: |
        Merlot (et Franc) donnent un **fruit ample** — prune et fruits rouges — avec assez de
        tanin pour évoluer vers le **cèdre et le tabac**. Ce n’est pas un vin primeur léger.

  - id: bordeaux-st-em-plain-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0103
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What lies at the foot of the Saint-Émilion escarpment?
      choices:
        - { text: "Warm gravel soils and Cabernet-rich wines", correct: false }
        - { text: "Sandy soils and lighter-bodied wines", correct: true }
        - { text: "Clay-limestone soils and the most structured wines", correct: false }
        - { text: "Blue clay soils and the richest wines", correct: false }
      explanation: |
        The **plain** below the côte: more sand, less prestige, earlier
        and lighter bottles than Ausone’s slope.
    fr:
      question: Que trouve-t-on au pied de l’escarpement de Saint-Émilion ?
      choices:
        - { text: "Des graves chaudes et des vins riches en Cabernet", correct: false }
        - { text: "Des sols sablonneux et des vins plus légers", correct: true }
        - { text: "Des sols argilo-calcaires et les vins les plus structurés", correct: false }
        - { text: "Des argiles bleues et les vins les plus riches", correct: false }
      explanation: |
        La **plaine** sous la côte : plus de sable, moins de prestige,
        des bouteilles plus précoces et plus légères que la pente
        d’Ausone.

  - id: bordeaux-pomerol-style-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do Pomerol reds usually compare with Saint-Émilion?
      choices:
        - { text: "Lighter, with tarter red fruit", correct: false }
        - { text: "Richer, with a spicier blackberry register", correct: true }
        - { text: "More austere, with leaner herbal fruit", correct: false }
        - { text: "Less full-bodied, with softer strawberry fruit", correct: false }
      explanation: |
        Tiny AOC. **Pétrus** sits on a button of blue clay; much of the
        rest is gravel over clay. Richer and spicier than a typical
        Saint-Émilion, not a different legal grape list.
    fr:
      question: Comment les rouges de Pomerol se comparent-ils d’habitude à Saint-Émilion ?
      choices:
        - { text: "Plus légers, avec des fruits rouges plus acidulés", correct: false }
        - { text: "Plus riches, sur un registre de mûre plus épicé", correct: true }
        - { text: "Plus austères, avec un fruit végétal plus maigre", correct: false }
        - { text: "Moins corsés, avec un fruit de fraise plus souple", correct: false }
      explanation: |
        Minuscule AOC. **Pétrus** siège sur un bouton d’argile bleue ;
        une bonne part du reste est en graves sur argile. Plus riche et
        plus épicé qu’un Saint-Émilion typique, pas une liste légale de
        cépages différente.

  - id: bordeaux-garage-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What 1990s Right Bank fashion produced tiny quantities of very ripe, full-bodied reds from small plots?
      choices:
        - { text: "A return to second wines", correct: false }
        - { text: "The garage / micro-cuvée wave", correct: true }
        - { text: "The super-second movement", correct: false }
        - { text: "An official ranking of micro-cuvées", correct: false }
      explanation: |
        **Le Pin** (the Thienpont family, Pomerol) was the prototype; **Valandraud** (Jean-Luc
        Thunevin, Saint-Émilion) is the best-known 1990s garagiste. Low yield, new oak, cult
        prices — not a new AOC.
    fr:
      question: Quelle mode des années 1990, sur la rive droite, a produit en très petites quantités des rouges très mûrs et corsés issus de petites parcelles ?
      choices:
        - { text: "Un retour aux seconds vins", correct: false }
        - { text: "La vague des vins de garage / micro-cuvées", correct: true }
        - { text: "Le mouvement des super-seconds", correct: false }
        - { text: "Un classement officiel des micro-cuvées", correct: false }
      explanation: |
        **Le Pin** (famille Thienpont, Pomerol) en est le prototype ; **Valandraud** (Jean-Luc
        Thunevin, Saint-Émilion) est le garagiste le plus connu des années 1990. Faible
        rendement, chêne neuf, prix de vin culte — pas une nouvelle AOC.

  - id: bordeaux-garagiste-term-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What nickname stuck to the 1990s micro-cuvée reds of the Right Bank?
      choices:
        - { text: "Super-seconds", correct: false }
        - { text: "Vins de garage", correct: true }
        - { text: "Petits châteaux", correct: false }
        - { text: "Vins de soif", correct: false }
      explanation: |
        **Vin de garage**, made by **garagistes** — the myth of a cellar in a shed, with
        serious prices. The joke stuck; the wines did too.
    fr:
      question: Quel surnom est resté aux micro-cuvées de rive droite des années 1990 ?
      choices:
        - { text: "Super-seconds", correct: false }
        - { text: "Vins de garage", correct: true }
        - { text: "Petits châteaux", correct: false }
        - { text: "Vins de soif", correct: false }
      explanation: |
        **Vin de garage**, signé par des **garagistes** — le mythe du chai installé dans un
        garage, à des prix très sérieux. La plaisanterie est restée ; les vins aussi.

  - id: bordeaux-rb-satellites-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, right-bank]
    status: reviewed
    source_id: c13-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Compared with top Saint-Émilion and Pomerol, what style do nearby Right Bank appellations such as Lussac-Saint-Émilion and Fronsac usually produce?
      choices:
        - { text: "Cabernet Sauvignon-led reds with firmer tannins", correct: false }
        - { text: "Merlot-led reds that are often lighter and less concentrated", correct: true }
        - { text: "Cabernet Franc-led reds with higher acidity", correct: false }
        - { text: "Merlot-led reds that are generally fuller and more concentrated", correct: false }
      explanation: |
        The Saint-Émilion satellites — **Lussac, Montagne, Puisseguin
        and Saint-Georges** — as well as Fronsac and the Côtes rely on
        the same Right Bank grapes. Their wines are generally less
        concentrated than the leading wines of Saint-Émilion and Pomerol.
    fr:
      question: Par rapport aux grands vins de Saint-Émilion et de Pomerol, quel style produisent généralement les appellations voisines de la rive droite, comme Lussac-Saint-Émilion et Fronsac ?
      choices:
        - { text: "Des rouges dominés par le Cabernet Sauvignon, aux tanins plus fermes", correct: false }
        - { text: "Des rouges dominés par le Merlot, souvent plus légers et moins concentrés", correct: true }
        - { text: "Des rouges dominés par le Cabernet Franc, avec davantage d’acidité", correct: false }
        - { text: "Des rouges dominés par le Merlot, généralement plus corsés et concentrés", correct: false }
      explanation: |
        Les satellites de Saint-Émilion — **Lussac, Montagne, Puisseguin
        et Saint-Georges** — ainsi que Fronsac et les Côtes reposent sur
        les mêmes cépages de la rive droite. Leurs vins sont en général
        moins concentrés que les grands vins de Saint-Émilion et de Pomerol.

  - id: bordeaux-cotes-name-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0108
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What umbrella AOC, created in 2009, groups several lesser-known Bordeaux hillsides?
      choices:
        - { text: "Bordeaux Supérieur", correct: false }
        - { text: "Côtes de Bordeaux", correct: true }
        - { text: "Côtes de Bourg", correct: false }
        - { text: "Entre-Deux-Mers", correct: false }
      explanation: |
        **Côtes de Bordeaux** is a regional wrapper. The local name comes first on the label
        when the wine qualifies.
    fr:
      question: Quelle AOC parapluie, créée en 2009, regroupe plusieurs coteaux bordelais moins connus ?
      choices:
        - { text: "Bordeaux Supérieur", correct: false }
        - { text: "Côtes de Bordeaux", correct: true }
        - { text: "Côtes de Bourg", correct: false }
        - { text: "Entre-Deux-Mers", correct: false }
      explanation: |
        **Côtes de Bordeaux** est une enveloppe régionale. Le nom local passe en tête
        d’étiquette quand le vin y a droit.

  - id: bordeaux-cotes-four-001
    type: mcq
