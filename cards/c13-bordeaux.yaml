    fr:
      question: Qu’apporte surtout le Sauvignon Blanc lorsqu’il est le cépage d’appoint d’un blanc de Bordeaux ?
      choices:
        - { text: "Du corps et une texture cireuse", correct: false }
        - { text: "Une acidité élevée", correct: true }
        - { text: "Un parfum floral et muscaté", correct: false }
        - { text: "Des notes de miel et de noisette", correct: false }
      explanation: |
        **Acidité et fraîcheur**. Le Sémillon apporte le corps ; le Sauvignon Blanc empêche
        l’assemblage de devenir mou.

  - id: bordeaux-sb-sweet-acid-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why keep Sauvignon Blanc in a Sauternes or Barsac blend?
      choices:
        - { text: "It takes noble rot more readily than Sémillon", correct: false }
        - { text: "It supplies the acidity Sémillon lacks", correct: true }
        - { text: "It brings the body", correct: false }
        - { text: "It is the volume grape of Sauternes", correct: false }
      explanation: |
        Botrytised Sémillon is rich and low-acid. A slice of **Sauvignon
        Blanc** keeps **Yquem** (and most Barsac/Sauternes blends) from
        tasting like syrup. **Climens** is the named exception: it is
        bottled as 100% Sémillon.
    fr:
      question: Pourquoi garder du Sauvignon Blanc dans un assemblage de Sauternes ou de Barsac ?
      choices:
        - { text: "Il prend la pourriture noble plus facilement que le Sémillon", correct: false }
        - { text: "Il fournit l’acidité qui manque au Sémillon", correct: true }
        - { text: "Il apporte le corps", correct: false }
        - { text: "C’est le cépage de volume des Sauternes", correct: false }
      explanation: |
        Le Sémillon botrytisé est riche et peu acide. Une part de **Sauvignon Blanc** évite à
        **Yquem** (et à la plupart des assemblages de Barsac et de Sauternes) d’être sirupeux.
        **Climens** est l’exception connue : 100 % Sémillon.

