  - id: bordeaux-class-estates-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a Bordeaux classification rank, unlike Burgundy’s crus?
      choices:
        - { text: "Every individual vine row by altitude", correct: false }
        - { text: "The estate (the château), not a fixed vineyard map", correct: true }
        - { text: "Only the négociant’s office building", correct: false }
        - { text: "Only the bottle shape", correct: false }
      explanation: |
        **Château Palmer** can buy or sell plots and the name still sits in
        1855. Burgundy ranks **climats**. That is why Bordeaux classed
        growths are brands as much as terroirs.
    fr:
      question: Que classe un classement bordelais, contrairement aux crus bourguignons ?
      choices:
        - { text: "Chaque rang de vignes selon l’altitude", correct: false }
        - { text: "La propriété (le château), pas une carte de vignes figée", correct: true }
        - { text: "Seulement l’immeuble du négociant", correct: false }
        - { text: "Seulement la forme de la bouteille", correct: false }
      explanation: |
        C’est **la propriété (le château), pas une carte de vignes figée**.
        **Château Palmer** peut acheter ou vendre des parcelles : le nom
        reste dans 1855. La Bourgogne classe des **climats**. Voilà
        pourquoi les crus classés bordelais sont autant des marques que
        des terroirs.

  - id: bordeaux-1855-why-001
