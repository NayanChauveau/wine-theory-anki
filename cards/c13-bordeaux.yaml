    fr:
      question: Le Ciron rejoint la Garonne auprès de quel groupe de vins liquoreux ?
      choices:
        - { text: "Seulement sur la Loire à Vouvray", correct: false }
        - { text: "Sauternes et Barsac", correct: true }
        - { text: "Seulement au village de Pomerol", correct: false }
        - { text: "Seulement au nord de Saint-Estèphe", correct: false }
      explanation: |
        **Sauternes** et **Barsac** siègent là où le **Ciron** froid
        rencontre la **Garonne** — brume pour la botrytis. Loupiac,
        Cadillac et Sainte-Croix-du-Mont leur font face de l’autre
        rive.

  - id: bordeaux-botrytis-mist-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do the Garonne and Ciron matter for Sauternes in the vineyard (not the cellar)?
      choices:
        - { text: "They heat the must during ferment", correct: false }
        - { text: "Autumn mist from the rivers sets up noble rot on the bunches", correct: true }
        - { text: "They make irrigation with seawater legal", correct: false }
        - { text: "They freeze every berry into icewine", correct: false }
      explanation: |
        Cold **Ciron** air over the warmer **Garonne** → morning mist,
        then sun. That is a **vineyard** condition for *Botrytis cinerea*,
        not a fermentation trick.
    fr:
      question: Pourquoi la Garonne et le Ciron comptent-ils pour Sauternes à la vigne (pas au chai) ?
      choices:
        - { text: "Ils chauffent le moût pendant la fermentation", correct: false }
        - { text: "La brume d’automne née des fleuves prépare la pourriture noble sur les grappes", correct: true }
        - { text: "Ils rendent légale l’irrigation à l’eau de mer", correct: false }
        - { text: "Ils transforment chaque baie en vin de glace", correct: false }
      explanation: |
        La **brume d’automne** née des fleuves prépare la **pourriture noble** sur les grappes.
        L’air froid du **Ciron** sur la **Garonne** plus tiède → brume
        du matin, puis soleil. C’est une condition **de vigne** pour
        *Botrytis cinerea*, pas un tour de fermentation.

  - id: bordeaux-passerillage-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux, white]
    status: reviewed
    source_id: c13-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When autumn stays too dry for noble rot, how else do Sauternais grapes concentrate?
      choices:
        - { text: "By adding seawater", correct: false }
        - { text: "By passerillage — leaving grapes to shrivel on the vine", correct: true }
        - { text: "By a legal duty to chaptalise to 20%", correct: false }
        - { text: "By picking in July only", correct: false }
      explanation: |
        **Passerillage** (dry shrivel) is the fallback. It gives sweet
        wine without the honey-saffron of botrytis — commoner in the
        cheaper satellite AOCs than at Yquem.
    fr:
      question: Quand l’automne reste trop sec pour la pourriture noble, comment les raisins du Sauternais se concentrent-ils autrement ?
      choices:
        - { text: "En ajoutant de l’eau de mer", correct: false }
        - { text: "Par passerillage — en laissant les raisins se flétrir sur pied", correct: true }
        - { text: "Par l’obligation légale de chaptaliser à 20 %", correct: false }
        - { text: "En vendangeant seulement en juillet", correct: false }
      explanation: |
        Le **passerillage** (flétrissement à sec) est le recours. Il
        donne un vin doux sans le miel-safran de la botrytis — plus
        courant dans les AOC satellites moins chères qu’à Yquem.

