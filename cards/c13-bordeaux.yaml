        - { text: "La replantation après le phylloxéra", correct: false }
        - { text: "Un traité de commerce avec l’Angleterre", correct: false }
      explanation: |
        La chambre de commerce a fait lister les grands rouges du Médoc et les Sauternes. Les
        courtiers ont classé les châteaux selon les **prix d’alors**. Haut-Brion (Graves) a
        été glissé dans la liste des rouges du Médoc ; Sauternes a eu sa propre liste.

