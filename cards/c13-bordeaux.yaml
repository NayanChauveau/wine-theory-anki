        - { text: "Bordeaux Supérieur and Crémant de Bordeaux", correct: false }
        - { text: "Côtes de Bordeaux and Entre-Deux-Mers", correct: false }
      explanation: |
        **Bordeaux Rosé** is the pale one; **Clairet** is deeper. Médoc communes are red.
        Supérieur is the stricter regional AOC (red, plus a little sweet white). Crémant is
        sparkling.
    fr:
      question: Sous quels noms vend-on le Bordeaux rosé générique ?
      choices:
        - { text: "Pauillac Rosé et Médoc Clairet", correct: false }
        - { text: "Bordeaux Rosé et Bordeaux Clairet", correct: true }
        - { text: "Bordeaux Supérieur et Crémant de Bordeaux", correct: false }
        - { text: "Côtes de Bordeaux et Entre-Deux-Mers", correct: false }
      explanation: |
        Le **Bordeaux Rosé** est le plus pâle ; le **Clairet** est plus soutenu. Les
        communales du Médoc sont des rouges. Le Supérieur est l’AOC régionale plus stricte
        (rouge, et un peu de blanc moelleux). Le Crémant est effervescent.

  - id: bordeaux-generic-improve-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0073
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why have many everyday Bordeaux reds become cleaner and riper?
      choices:
        - { text: "New AOC rules halved the permitted yields", correct: false }
        - { text: "Export brands have to compete with New World wines", correct: true }
        - { text: "A run of frost years concentrated the crops", correct: false }
        - { text: "Oak ageing became compulsory for regional AOCs", correct: false }
      explanation: |
        **Supermarket competition** (Chile, Australia, Languedoc) pushed
        sorting and ripeness. That is a trend, not a claim that every
        Bordeaux AOC is now a classed growth.
    fr:
      question: Pourquoi beaucoup de Bordeaux de tous les jours sont-ils devenus plus nets et plus mûrs ?
      choices:
        - { text: "De nouvelles règles d’AOC ont divisé les rendements par deux", correct: false }
        - { text: "Les marques d’export doivent rivaliser avec le Nouveau Monde", correct: true }
        - { text: "Une série d’années de gel a concentré les récoltes", correct: false }
        - { text: "L’élevage sous bois est devenu obligatoire en AOC régionale", correct: false }
      explanation: |
        La **concurrence en grande distribution** (Chili, Australie, Languedoc) a poussé au
        tri et à la maturité. C’est une tendance : tous les Bordeaux AOC ne sont pas devenus
        des crus classés.

