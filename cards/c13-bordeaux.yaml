      choices:
        - { text: "Médoc and Haut-Médoc", correct: false }
        - { text: "Bordeaux and Bordeaux Supérieur", correct: true }
        - { text: "Graves and Côtes de Bordeaux", correct: false }
        - { text: "Entre-Deux-Mers and Graves", correct: false }
      explanation: |
        Regional labels, open to the whole Gironde vineyard. Bordeaux AOC also covers dry
        white and rosé; **Entre-Deux-Mers** is a district AOC, best known for dry white.
    fr:
      question: Quelles deux AOC régionales peuvent s’employer pour un rouge de tout le vignoble bordelais ?
      choices:
        - { text: "Médoc et Haut-Médoc", correct: false }
        - { text: "Bordeaux et Bordeaux Supérieur", correct: true }
        - { text: "Graves et Côtes de Bordeaux", correct: false }
        - { text: "Entre-Deux-Mers et Graves", correct: false }
      explanation: |
        Des appellations régionales, ouvertes à tout le vignoble girondin. L’AOC Bordeaux
        couvre aussi le blanc sec et le rosé ; l’**Entre-Deux-Mers** est une AOC de secteur,
        surtout connue pour son blanc sec.

  - id: bordeaux-superieur-001
    type: mcq
    deck: France::Bordeaux
    tags: [france, bordeaux]
    status: reviewed
    source_id: c13-0071
