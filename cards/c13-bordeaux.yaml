        Both colours are legal. **Haut-Brion** and **Haut-Brion Blanc**
        are the luxury pair; everyday Graves does the same split.
    fr:
      question: Quelles couleurs Graves et Pessac-Léognan peuvent-ils mettre sur le marché ?
      choices:
        - { text: "Rouge seulement, comme Pomerol", correct: false }
        - { text: "Rouge et blanc sec", correct: true }
        - { text: "Seulement du rosé effervescent", correct: false }
        - { text: "Seulement du liquoreux de botrytis, comme Sauternes", correct: false }
      explanation: |
        **Rouge et blanc sec**.
        Les deux couleurs sont légales. **Haut-Brion** et **Haut-Brion
        Blanc** sont le couple de luxe ; le Graves du quotidien fait le
