        - { text: "Seulement du blanc liquoreux de botrytis", correct: false }
        - { text: "Seulement du Clairet effervescent", correct: false }
      explanation: |
        **Merlot à boire maintenant**. « Bon rapport » est un slogan de
        rayon, pas une note de dégustation — le contraste utile est le
        prix et le poids face à Pomerol.

