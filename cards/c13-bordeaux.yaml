        - { text: "Blackcurrant with cedar from oak, and firm tannin built to age", correct: true }
        - { text: "Only noble-rot saffron", correct: false }
        - { text: "Only pale Provençal strawberry", correct: false }
      explanation: |
        **Cassis + cedar + grip**. They can be tough at five years; the
        point of the communal crus is a long curve, not a nouveau.
    fr:
      question: Quelle signature de fruit et de chêne les rouges communaux du Haut-Médoc montrent-ils d’habitude dans leur jeunesse ?
      choices:
        - { text: "Seulement banane et noix de coco, sans tanin", correct: false }
        - { text: "Cassis avec du cèdre venu du chêne, et un tanin ferme bâti pour la garde", correct: true }
        - { text: "Seulement du safran de pourriture noble", correct: false }
        - { text: "Seulement de la fraise pâle de Provence", correct: false }
      explanation: |
        **Cassis + cèdre + poigne**. Ils peuvent être durs à cinq ans ;
        le point des crus communaux est une longue courbe, pas un vin primeur.

  - id: bordeaux-pessac-where-001
