        south of town. Haut-Brion is inside the urban sprawl.
    fr:
      question: Quelle AOC commence au bord sud de la ville de Bordeaux ?
      choices:
        - { text: "Saint-Estèphe", correct: false }
        - { text: "Pessac-Léognan", correct: true }
        - { text: "L’AOC Médoc seulement", correct: false }
        - { text: "Pomerol", correct: false }
      explanation: |
        Créée en **1987** : le nord des Graves, banlieues et bois juste
        au sud de la ville. Haut-Brion est dans le tissu urbain.

