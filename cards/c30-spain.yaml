    en:
      question: "Which sequence gives the national baseline for oak ageing of red Crianza, Reserva and Gran Reserva?"
      choices:
        - { text: "3, 6 and 12 months", correct: false }
        - { text: "6, 12 and 18 months", correct: true }
        - { text: "6, 18 and 24 months", correct: false }
        - { text: "12, 18 and 36 months", correct: false }
      explanation: |
        The national baseline rises from six to twelve to eighteen months in oak. Rioja and Ribera
        del Duero, for example, require twenty-four months of oak for red Gran Reserva.

