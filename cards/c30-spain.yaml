        - { text: "It absorbs and reflects heat around the vines", correct: true }
        - { text: "It blocks sunlight with dense ground vegetation", correct: false }
        - { text: "Its pale surface reflects heat away from the canopy", correct: false }
      explanation: |
        Dark slate absorbs solar energy and reflective mica increases light around the canopy. This
        assists ripening but can intensify heat and drought stress.

  - id: spain-priorat-llicorella-water-001
