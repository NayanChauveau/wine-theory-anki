# yaml-language-server: $schema=../schema/cards.schema.json
# source: C30 (import/inbox/c30-spain.yaml)
# deck: Spain

cards:
  - id: spain-climate-count-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grouping is the usual map of Spanish vineyard climates?
      choices:
        - { text: "One Mediterranean band only", correct: false }
        - { text: "Three belts: Atlantic north-west, Mediterranean east, and a hot continental Meseta", correct: true }
        - { text: "Two, Atlantic versus everything else", correct: false }
        - { text: "Five, one per river", correct: false }
      explanation: |
        **Three belts: Atlantic north-west, Mediterranean east, and
        a hot continental Meseta.** Galicia, Catalunya-to-Levante,
        and the interior plateau.

  - id: spain-nw-maritime-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What climate sits on Spain’s Atlantic north-west coast?
      choices:
        - { text: "Hot continental, like the Meseta Central", correct: false }
        - { text: "Moderate maritime, driven by Atlantic weather", correct: true }
        - { text: "Warm Mediterranean, like Jumilla", correct: false }
        - { text: "Desert-arid, like inland Levante", correct: false }
      explanation: |
        **Moderate maritime, driven by Atlantic weather.** Galicia and
        the north coast sit in that belt, not the baked interior.

  - id: spain-nw-rain-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the main vineyard risk on Spain’s wet Atlantic north-west?
      choices:
        - { text: "Chronic drought only", correct: false }
        - { text: "High rainfall and the fungal pressure that comes with it", correct: true }
        - { text: "Winter freeze with no rain at all", correct: false }
        - { text: "Salt from an inland salt lake", correct: false }
      explanation: |
        **High rainfall and the fungal pressure that comes with it.**
        Heat and drought are the Spanish rule; Galicia is the wet
        exception.

  - id: spain-east-med-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: From Catalunya south along the Mediterranean shore toward Levante, which climate prevails?
      choices:
        - { text: "Cool maritime, like Rías Baixas", correct: false }
        - { text: "Warm Mediterranean", correct: true }
        - { text: "Alpine, like Alto Adige", correct: false }
        - { text: "Hot continental Meseta, cut off from any sea", correct: false }
      explanation: |
        **Warm Mediterranean.** The belt runs the east coast; summers
        get hotter as the map moves south.

  - id: spain-east-moderate-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What two features take the edge off heat on Spain’s Mediterranean east-coast vineyards?
      choices:
        - { text: "A legal cap on sunshine hours", correct: false }
        - { text: "The sea, or altitude", correct: true }
        - { text: "Permanent snow cover", correct: false }
        - { text: "Indoor glasshouse growing only", correct: false }
      explanation: |
        **The sea, or altitude.** Coastal breeze or a climb inland
        keeps many east-coast sites from simply baking.

  - id: spain-meseta-continental-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does the Meseta Central run hot-continental rather than maritime?
      choices:
        - { text: "It sits on the Atlantic beach", correct: false }
        - { text: "Mountains cut it off from cooling sea air", correct: true }
        - { text: "A law bans any summer heat", correct: false }
        - { text: "It is a foggy estuary", correct: false }
      explanation: |
        **Mountains cut it off from cooling sea air.** Winters can
        freeze; summers are very hot and dry.

  - id: spain-meseta-altitude-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: On the Meseta Central, what can still moderate fierce summer heat on some sites?
      choices:
        - { text: "A permanent sea fog", correct: false }
        - { text: "Altitude", correct: true }
        - { text: "A legal ban on sunshine", correct: false }
        - { text: "Growing vines below sea level only", correct: false }
      explanation: |
        **Altitude.** Height is the cooling tool once the mountains
        have blocked the sea.

  - id: spain-heat-drought-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Away from the Atlantic north-west, what two stresses dominate Spanish viticulture?
      choices:
        - { text: "Frost and excess rain every week", correct: false }
        - { text: "Heat and lack of water", correct: true }
        - { text: "Too little sunshine and too much snow", correct: false }
        - { text: "Only phylloxera, never climate", correct: false }
      explanation: |
        **Heat and lack of water.** Most of the map is dry and hot;
        the wet north-west is the outlier.

  - id: spain-nw-exception-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Spanish climate belt is the usual exception to drought-and-heat as the main vineyard problem?
      choices:
        - { text: "The Meseta Central", correct: false }
        - { text: "The Atlantic north-west", correct: true }
        - { text: "Inland Jumilla and Yecla", correct: false }
        - { text: "La Mancha’s hottest flats", correct: false }
      explanation: |
        **The Atlantic north-west.** Rain and fungal disease replace
        drought as the headache.

  - id: spain-dry-fungal-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Spanish vineyards see less rot than wetter Europe mainly because of what?
      choices:
        - { text: "A legal ban on fungi", correct: false }
        - { text: "A generally dry climate", correct: true }
        - { text: "A ban on all black grapes", correct: false }
        - { text: "Indoor vines only", correct: false }
      explanation: |
        **A generally dry climate.** Dry air is the one gift of a
        water-short vineyard.

  - id: spain-dry-stress-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What stress does a water-short Spanish vine usually face?
      choices:
        - { text: "Vines never feel any stress", correct: false }
        - { text: "Heavy drought stress on the vine", correct: true }
        - { text: "Mandatory flooding of every row", correct: false }
        - { text: "A legal ban on bush vines", correct: false }
      explanation: |
        **Heavy drought stress on the vine.** Low disease is the
        upside; thirsty vines are the downside.

  - id: spain-bush-vines-001
    type: mcq
    deck: Spain
    tags: [spain, viticulture]
    status: reviewed
    source_id: c30-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which planting system is the classic Spanish answer to heat and drought?
      choices:
        - { text: "High-density pergolas in every region", correct: false }
        - { text: "Low-density, bush-trained vines", correct: true }
        - { text: "Indoor hydroponics only", correct: false }
        - { text: "Flooded rice-paddy rows", correct: false }
      explanation: |
        **Low-density, bush-trained vines.** En vaso and wide spacing
        are the old dry-farming kit.

  - id: spain-bush-why-001
    type: mcq
    deck: Spain
    tags: [spain, viticulture]
    status: reviewed
    source_id: c30-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do low-density bush vines help Spanish fruit through a hot, dry season?
      choices:
        - { text: "They waste water and expose every bunch to full sun", correct: false }
        - { text: "Each vine gets more of the scarce water, and the canopy shades the fruit", correct: true }
        - { text: "They exist only to speed up machine harvest", correct: false }
        - { text: "The law requires bare, unshaded bunches", correct: false }
      explanation: |
        **Each vine gets more of the scarce water, and the canopy
        shades the fruit.** Spacing shares the rainfall; the bush
        hat keeps grapes from cooking.

  - id: spain-wire-train-001
    type: mcq
    deck: Spain
    tags: [spain, viticulture]
    status: reviewed
    source_id: c30-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which training change is spreading in Spanish vineyards once planted only as bush vines?
      choices:
        - { text: "A return to untrained wild vines only", correct: false }
        - { text: "Wire training", correct: true }
        - { text: "A legal ban on any trellis", correct: false }
        - { text: "Growing every vine in a pot", correct: false }
      explanation: |
        **Wire training.** Rows on wires are replacing some en vaso
        blocks where the site allows it.

  - id: spain-wire-machine-001
    type: mcq
    deck: Spain
    tags: [spain, viticulture]
    status: reviewed
    source_id: c30-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why are Spanish growers adding wires to vineyard rows?
      choices:
        - { text: "To block all machine access", correct: false }
        - { text: "To make machine harvesting practical", correct: true }
        - { text: "Wires are only a tourist decoration", correct: false }
        - { text: "To force every site onto a pergola", correct: false }
      explanation: |
        **To make machine harvesting practical.** Bush vines and
        steep Priorat slopes still stay hand-worked.

  - id: spain-cheap-red-001
    type: mcq
    deck: Spain
    tags: [spain, winemaking]
    status: reviewed
    source_id: c30-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are Spain’s cheapest reds usually handled in the cellar?
      choices:
        - { text: "Long ageing in 100% new French oak only", correct: false }
        - { text: "Often no oak, with semi-carbonic maceration to push fruit", correct: true }
        - { text: "Flor ageing, like Fino", correct: false }
        - { text: "Mandatory ten years in bottle before sale", correct: false }
      explanation: |
        **Often no oak, with semi-carbonic maceration to push fruit.**
        The supermarket Joven recipe, not a Reserva cellar.

  - id: spain-best-red-oak-001
    type: mcq
    deck: Spain
    tags: [spain, winemaking]
    status: reviewed
    source_id: c30-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Spain’s finest reds almost always see which cellar step?
      choices:
        - { text: "No oak is allowed on any premium red", correct: false }
        - { text: "Maturation in oak, usually with at least some new wood", correct: true }
        - { text: "Only chestnut amphorae, by law", correct: false }
        - { text: "Six weeks in steel, then sale", correct: false }
      explanation: |
        **Maturation in oak, usually with at least some new wood.**
        Inexpensive Joven bottles skip that step.

  - id: spain-oak-origin-001
    type: mcq
    deck: Spain
    tags: [spain, winemaking]
    status: reviewed
    source_id: c30-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two oak origins are now both common for Spanish reds?
      choices:
        - { text: "Only Slovenian oak, now banned", correct: false }
        - { text: "American oak (the historic default) and French oak", correct: true }
        - { text: "Only new Hungarian oak, by law", correct: false }
        - { text: "No oak has ever been used", correct: false }
      explanation: |
        **American oak (the historic default) and French oak.**
        Vanilla-heavy American casks were the old Rioja signature;
        French spice is now widespread.

  - id: spain-tempranillo-lead-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo]
    status: reviewed
    source_id: c30-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Rioja and Ribera prestige reds are built on which black grape?
      choices:
        - { text: "Airén", correct: false }
        - { text: "Tempranillo", correct: true }
        - { text: "Cava", correct: false }
        - { text: "Albariño", correct: false }
      explanation: |
        **Tempranillo.** Airén covers more hectares but is a volume
        white; Cava is a sparkling wine, not a grape.

  - id: spain-tempranillo-map-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo]
    status: reviewed
    source_id: c30-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Tempranillo’s plantings concentrate in which two belts of Spain?
      choices:
        - { text: "Only the wet Atlantic rías", correct: false }
        - { text: "Northern and central Spain", correct: true }
        - { text: "Only the Canary Islands", correct: false }
        - { text: "Jumilla and Yecla alone", correct: false }
      explanation: |
        **Northern and central Spain.** Rioja, Ribera del Duero and
        the Meseta are the heartland; Monastrell owns the hot
        south-east.

  - id: spain-tempranillo-profile-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo]
    status: reviewed
    source_id: c30-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What skin and acid profile does Tempranillo usually bring?
      choices:
        - { text: "Paper-thin skins and very high acidity", correct: false }
        - { text: "Thick skins and medium acidity", correct: true }
        - { text: "No skins and zero acid", correct: false }
        - { text: "White-grape skins only", correct: false }
      explanation: |
        **Thick skins and medium acidity.** Colour and tannin come
        easily; acid does not, if the site is too hot.

  - id: spain-tempranillo-acid-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo]
    status: reviewed
    source_id: c30-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When can Tempranillo lose the acidity it needs for balance?
      choices:
        - { text: "Only in a foggy, cool ría", correct: false }
        - { text: "In hot sites without a wide day–night temperature swing", correct: true }
        - { text: "Never; the grape is always high-acid", correct: false }
        - { text: "Only when it is blended with Graciano", correct: false }
      explanation: |
        **In hot sites without a wide day–night temperature swing.**
        Medium acid plus a baked night leaves a flabby red.

  - id: spain-tempranillo-sites-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo]
    status: reviewed
    source_id: c30-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which site features keep Tempranillo from going flabby in a Spanish summer?
      choices:
        - { text: "The hottest inland flats with no breeze", correct: false }
        - { text: "Sea influence and/or altitude to moderate summer heat", correct: true }
        - { text: "A legal ban on any cooling", correct: false }
        - { text: "Growing the grape only in Jumilla’s arid basin", correct: false }
      explanation: |
        **Sea influence and/or altitude to moderate summer heat.**
        Rioja’s western hills and high Ribera sites show the same
        pattern — height or Atlantic air, not a baked Meseta night.

  - id: spain-tempranillo-semicarb-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo, winemaking]
    status: reviewed
    source_id: c30-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which maceration is common when Tempranillo is vinified alone for early sale?
      choices:
        - { text: "A month of whole-bunch carbonic, then ten years in oak", correct: false }
        - { text: "Semi-carbonic maceration", correct: true }
        - { text: "Flor ageing under a yeast veil", correct: false }
        - { text: "No maceration; it is pressed as a white", correct: false }
      explanation: |
        **Semi-carbonic maceration.** Whole or part-bunch fruit gives
        a juicy, low-tannin Joven.

  - id: spain-tempranillo-joven-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo]
    status: reviewed
    source_id: c30-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What drinking window and fruit note mark a typical unoaked Tempranillo Joven?
      choices:
        - { text: "A 20-year cellar wine of leather only", correct: false }
        - { text: "Early drinking, with fresh strawberry", correct: true }
        - { text: "Always sweet and fortified", correct: false }
        - { text: "A sparkling wine aged on lees for five years", correct: false }
      explanation: |
        **Early drinking, with fresh strawberry.** The young,
        unoaked register, not a Gran Reserva.

  - id: spain-tempranillo-aged-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo]
    status: reviewed
    source_id: c30-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When Tempranillo is not a Joven strawberry bottle, what style does it usually take?
      choices:
        - { text: "Only sweet Moscatel", correct: false }
        - { text: "More concentrated, age-worthy, oaked blends", correct: true }
        - { text: "Cava base wine only, by law", correct: false }
        - { text: "A white blending grape in Rueda", correct: false }
      explanation: |
        **More concentrated, age-worthy, oaked blends.** Rioja and
        Ribera Reserva bottles sit in that camp.

  - id: spain-tempranillo-blend-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, tempranillo]
    status: reviewed
    source_id: c30-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A classic Spanish Tempranillo blend typically includes which local and international partners?
      choices:
        - { text: "Only Albariño and Verdejo", correct: false }
        - { text: "Garnacha, Graciano, Cariñena/Mazuelo, and internationals such as Cabernet Sauvignon", correct: true }
        - { text: "Only Riesling and Pinot Noir", correct: false }
        - { text: "Palomino and Pedro Ximénez only", correct: false }
      explanation: |
        **Garnacha, Graciano, Cariñena/Mazuelo, and internationals
        such as Cabernet Sauvignon.** Garnacha adds body; Graciano
        and Mazuelo add structure.

  - id: spain-garnacha-synonym-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, garnacha]
    status: reviewed
    source_id: c30-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Under which name does the rest of Europe usually list Garnacha Tinta?
      choices:
        - { text: "Tempranillo", correct: false }
        - { text: "Grenache", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Carignan", correct: false }
      explanation: |
        **Grenache.** Same grape as southern-Rhône Grenache; not
        Monastrell (Mourvèdre) and not Cariñena.

  - id: spain-garnacha-profile-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, garnacha]
    status: reviewed
    source_id: c30-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What ripening pace and alcohol level are typical of Garnacha Tinta?
      choices:
        - { text: "Very early ripening and low alcohol", correct: false }
        - { text: "Late ripening and high alcohol", correct: true }
        - { text: "A white grape with no alcohol", correct: false }
        - { text: "It can ripen in a cool, wet ría with ease", correct: false }
      explanation: |
        **Late ripening and high alcohol.** Garnacha needs a long
        warm season; alcohol climbs easily once the fruit is ripe.

  - id: spain-garnacha-uses-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, garnacha]
    status: reviewed
    source_id: c30-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Navarra pink and Priorat red share which lead grape?
      choices:
        - { text: "Airén", correct: false }
        - { text: "Garnacha Tinta", correct: true }
        - { text: "Albariño", correct: false }
        - { text: "Pedro Ximénez", correct: false }
      explanation: |
        **Garnacha Tinta.** Navarra rosado is the volume story;
        Priorat is the intense old-vine one. It also props
        up many Rioja blends.

  - id: spain-priorat-style-001
    type: mcq
    deck: Spain
    tags: [spain, priorat, garnacha]
    status: reviewed
    source_id: c30-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What body and intensity mark a typical Priorat red?
      choices:
        - { text: "Pale, light, and barely flavoured", correct: false }
        - { text: "Intense, complex, and full-bodied", correct: true }
        - { text: "Always a sweet fortified white", correct: false }
        - { text: "A simple, dilute picnic red", correct: false }
      explanation: |
        **Intense, complex, and full-bodied.** Garnacha-led, on
        llicorella slate — not “just another hot Spanish red.”
        **Álvaro Palacios** (L’Ermita) is a named extra.

  - id: spain-priorat-oldvines-001
    type: mcq
    deck: Spain
    tags: [spain, priorat, garnacha]
    status: reviewed
    source_id: c30-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What vine material usually drives Priorat’s concentration?
      choices:
        - { text: "High-yielding young vines on a fertile flat", correct: false }
        - { text: "Low-yielding old vines", correct: true }
        - { text: "Only brand-new international cuttings", correct: false }
        - { text: "Airén bush vines from La Mancha", correct: false }
      explanation: |
        **Low-yielding old vines.** Sparse Garnacha (and Cariñena)
        on poor llicorella gives the density; heat alone does not.

  - id: spain-monastrell-synonym-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, monastrell]
    status: reviewed
    source_id: c30-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Monastrell is the Spanish name for which Rhône grape?
      choices:
        - { text: "Grenache", correct: false }
        - { text: "Mourvèdre", correct: true }
        - { text: "Syrah", correct: false }
        - { text: "Cinsault", correct: false }
      explanation: |
        **Mourvèdre.** Same late-ripening black grape; Bandol is
        the French address, Jumilla the Spanish one.

  - id: spain-monastrell-fit-001
    type: mcq
    deck: Spain
    tags: [spain, grapes, monastrell]
    status: reviewed
    source_id: c30-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does Monastrell thrive in Spain’s hottest, driest south-east?
      choices:
        - { text: "It needs a cool, wet Atlantic climate to ripen", correct: false }
        - { text: "It is drought-tolerant and needs hot, sunny conditions to ripen", correct: true }
        - { text: "It is a white grape that hates sunshine", correct: false }
        - { text: "It ripens in the shade of a cool ría", correct: false }
      explanation: |
        **It is drought-tolerant and needs hot, sunny conditions to
