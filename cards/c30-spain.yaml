cards:
  - id: spain-climate-count-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which three broad climate settings are most useful for organising Spain’s major wine regions?"
      choices:
        - { text: "Atlantic north-west, continental east and Mediterranean interior", correct: false }
        - { text: "Atlantic north-west, Mediterranean east and continental interior", correct: true }
        - { text: "Continental north, Atlantic east and Mediterranean interior", correct: false }
        - { text: "Mediterranean north-west, continental coast and Atlantic centre", correct: false }
      explanation: |
        This is a study framework rather than a legal map. Atlantic influence dominates Galicia and
        the north coast, Mediterranean influence shapes the east, and the elevated interior has
        strong continental extremes.
    fr:
      question: "Quels sont les trois grands cadres climatiques les plus utiles pour organiser les principales régions viticoles espagnoles ?"
      choices:
        - { text: "Nord-ouest atlantique, est continental et intérieur méditerranéen", correct: false }
        - { text: "Nord-ouest atlantique, est méditerranéen et intérieur continental", correct: true }
        - { text: "Nord continental, est atlantique et intérieur méditerranéen", correct: false }
        - { text: "Nord-ouest méditerranéen, littoral continental et centre atlantique", correct: false }
      explanation: |
        Il s’agit d’un cadre d’étude et non d’un découpage légal. L’influence atlantique domine en
        Galice et sur la côte nord, l’influence méditerranéenne marque l’est, tandis que
        l’intérieur, situé en altitude, connaît de forts contrastes continentaux.

  - id: spain-nw-maritime-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate best describes Spain’s Atlantic north-west coast?"
      choices:
        - { text: "Warm Mediterranean with dry summers", correct: false }
        - { text: "Moderate maritime with substantial Atlantic rainfall", correct: true }
        - { text: "Hot continental with extreme summer drought", correct: false }
        - { text: "Warm continental with limited winter rain", correct: false }
      explanation: |
        Atlantic weather moderates temperature but brings much more rain and humidity than most
        Spanish regions. Galicia is the clearest wine-growing example.
    fr:
      question: "Quel climat décrit le mieux la côte atlantique du nord-ouest de l’Espagne ?"
      choices:
        - { text: "Méditerranéen chaud aux étés secs", correct: false }
        - { text: "Maritime modéré avec d’importantes précipitations atlantiques", correct: true }
        - { text: "Continental chaud marqué par une sécheresse estivale extrême", correct: false }
        - { text: "Continental chaud avec peu de pluies hivernales", correct: false }
      explanation: |
        L’Atlantique modère les températures, mais apporte bien davantage de pluie et d’humidité que
        dans la plupart des régions espagnoles. La Galice en est le principal exemple viticole.

  - id: spain-nw-rain-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard pressure is particularly important in Spain’s wet Atlantic north-west?"
      choices:
        - { text: "Severe drought during most growing seasons", correct: false }
        - { text: "Mildew and bunch rot promoted by rainfall and humidity", correct: true }
        - { text: "Chronic winter freeze across coastal vineyards", correct: false }
        - { text: "Rapid acid loss caused by persistently hot nights", correct: false }
      explanation: |
        Frequent rain and humid canopies favour fungal disease. Growers respond with open training
        systems, good airflow and careful disease monitoring.
    fr:
      question: "Quelle contrainte viticole est particulièrement importante dans le nord-ouest atlantique humide de l’Espagne ?"
      choices:
        - { text: "Une forte sécheresse pendant la plupart des saisons végétatives", correct: false }
        - { text: "Le mildiou et la pourriture favorisés par la pluie et l’humidité", correct: true }
        - { text: "Un gel hivernal chronique dans les vignobles côtiers", correct: false }
        - { text: "Une chute rapide de l’acidité due à des nuits constamment chaudes", correct: false }
      explanation: |
        Les pluies fréquentes et l’humidité du feuillage favorisent les maladies fongiques. Les
        viticulteurs privilégient des systèmes de conduite aérés, une bonne circulation de l’air et
        une surveillance attentive des maladies.

  - id: spain-east-med-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate broadly characterises Spain’s east coast from Catalunya towards the Levante?"
      choices:
        - { text: "Moderate maritime with year-round Atlantic rain", correct: false }
        - { text: "Warm Mediterranean with hot, generally dry summers", correct: true }
        - { text: "Cool continental with a short growing season", correct: false }
        - { text: "Hot continental with no maritime influence", correct: false }
      explanation: |
        The Mediterranean moderates winter temperatures, while summers are warm to hot and
        relatively dry. Local altitude and distance from the coast create important variations.
    fr:
      question: "Quel climat caractérise globalement la côte est de l’Espagne, de la Catalogne au Levante ?"
      choices:
        - { text: "Maritime modéré avec des pluies atlantiques toute l’année", correct: false }
        - { text: "Méditerranéen chaud aux étés généralement chauds et secs", correct: true }
        - { text: "Continental frais avec une courte saison végétative", correct: false }
        - { text: "Continental chaud sans aucune influence maritime", correct: false }
      explanation: |
        La Méditerranée adoucit les hivers, tandis que les étés sont chauds à très chauds et
        relativement secs. L’altitude et l’éloignement du littoral créent toutefois d’importantes
        variations locales.

  - id: spain-east-moderate-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two site influences can preserve freshness in warm vineyards along Spain’s Mediterranean side?"
      choices:
        - { text: "Fertile soils and sheltered valley floors", correct: false }
        - { text: "Sea breezes and higher altitude", correct: true }
        - { text: "Warm nights and low-density planting", correct: false }
        - { text: "High yields and late harvesting", correct: false }
      explanation: |
        Maritime airflow reduces daytime heat near the coast, while altitude lowers temperatures and
        increases diurnal range farther inland.
    fr:
      question: "Quelles deux influences peuvent préserver la fraîcheur des vignobles chauds du versant méditerranéen espagnol ?"
      choices:
        - { text: "Des sols fertiles et des fonds de vallée abrités", correct: false }
        - { text: "Les brises marines et l’altitude", correct: true }
        - { text: "Des nuits chaudes et une faible densité de plantation", correct: false }
        - { text: "Des rendements élevés et des vendanges tardives", correct: false }
      explanation: |
        Près du littoral, les mouvements d’air maritime atténuent la chaleur diurne. Plus loin dans
        les terres, l’altitude abaisse les températures et accroît l’amplitude thermique entre le
        jour et la nuit.

  - id: spain-meseta-continental-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does the Meseta Central experience stronger continental extremes than Spain’s coasts?"
      choices:
        - { text: "The plateau lies close to the Mediterranean coast", correct: false }
        - { text: "Mountain ranges restrict maritime influence", correct: true }
        - { text: "Its soils retain abundant summer rainfall", correct: false }
        - { text: "Coastal fog persists throughout the growing season", correct: false }
      explanation: |
        The plateau is surrounded or divided by mountain systems that reduce the moderating effect
        of the sea. Winters can be cold, while summers are hot and dry.
    fr:
      question: "Pourquoi la Meseta Central connaît-elle des contrastes continentaux plus marqués que les côtes espagnoles ?"
      choices:
        - { text: "Le plateau se trouve près du littoral méditerranéen", correct: false }
        - { text: "Les chaînes de montagnes limitent l’influence maritime", correct: true }
        - { text: "Ses sols retiennent d’abondantes pluies estivales", correct: false }
        - { text: "Le brouillard côtier persiste pendant toute la saison végétative", correct: false }
      explanation: |
        Le plateau est entouré ou compartimenté par des massifs montagneux qui réduisent l’effet
        modérateur de la mer. Les hivers peuvent être froids, alors que les étés sont chauds et
        secs.

  - id: spain-meseta-altitude-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What most often moderates summer heat in quality vineyards on the Meseta Central?"
      choices:
        - { text: "Persistent Atlantic fog", correct: false }
        - { text: "High elevation and cool nights", correct: true }
        - { text: "Heavy summer rainfall", correct: false }
        - { text: "Warm downslope winds", correct: false }
      explanation: |
        Much of the Meseta lies at considerable altitude. Cooler nights slow acid loss and can
        extend ripening despite intense daytime sun.
    fr:
      question: "Qu’est-ce qui tempère le plus souvent la chaleur estivale dans les vignobles de qualité de la Meseta Central ?"
      choices:
        - { text: "Un brouillard atlantique persistant", correct: false }
        - { text: "L’altitude et la fraîcheur nocturne", correct: true }
        - { text: "De fortes pluies estivales", correct: false }
        - { text: "Des vents catabatiques chauds", correct: false }
      explanation: |
        Une grande partie de la Meseta se situe à une altitude élevée. Les nuits plus fraîches
        ralentissent la perte d’acidité et peuvent prolonger la maturation malgré l’intensité du
        soleil en journée.

  - id: spain-heat-drought-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which paired hazards dominate viticulture across much of Spain’s dry interior?"
      choices:
        - { text: "Spring frost and excessive summer rain", correct: false }
        - { text: "Heat and water scarcity", correct: true }
        - { text: "Spring frost and summer hail", correct: false }
        - { text: "Humidity and waterlogged soils", correct: false }
      explanation: |
        High evapotranspiration and limited rainfall can cause severe vine stress. The intensity
        varies with elevation, soil water-holding capacity and access to irrigation.
    fr:
      question: "Quel couple de contraintes domine la viticulture dans une grande partie de l’intérieur sec de l’Espagne ?"
      choices:
        - { text: "Le gel de printemps et l’excès de pluie en été", correct: false }
        - { text: "La chaleur et le manque d’eau", correct: true }
        - { text: "Le gel de printemps et la grêle estivale", correct: false }
        - { text: "L’humidité et les sols gorgés d’eau", correct: false }
      explanation: |
        Une forte évapotranspiration et de faibles précipitations peuvent provoquer un stress
        hydrique sévère. Son intensité varie selon l’altitude, la capacité du sol à retenir l’eau et
        l’accès à l’irrigation.

  - id: spain-nw-exception-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Spanish zone is more likely to struggle with excess rain than with chronic drought?"
      choices:
        - { text: "The central Meseta around La Mancha", correct: false }
        - { text: "The Atlantic north-west around Galicia", correct: true }
        - { text: "The inland Levante around Jumilla", correct: false }
        - { text: "The upper Duero around Toro", correct: false }
      explanation: |
        Galicia’s Atlantic exposure brings frequent rain and fungal pressure. Most of the other
        listed areas are considerably drier and often face water stress.
    fr:
      question: "Quelle zone espagnole souffre plus volontiers d’un excès de pluie que d’une sécheresse chronique ?"
      choices:
        - { text: "La Meseta centrale autour de La Mancha", correct: false }
        - { text: "Le nord-ouest atlantique autour de la Galice", correct: true }
        - { text: "L’intérieur du Levante autour de Jumilla", correct: false }
        - { text: "Le haut Duero autour de Toro", correct: false }
      explanation: |
        L’exposition atlantique de la Galice apporte des pluies fréquentes et une forte pression
        fongique. Les autres zones proposées sont nettement plus sèches et souvent exposées au
        stress hydrique.

  - id: spain-dry-fungal-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main disease-related benefit of Spain’s generally dry growing season?"
      choices:
        - { text: "It prevents vine viruses from spreading", correct: false }
        - { text: "It lowers pressure from mildew and bunch rot", correct: true }
        - { text: "It mainly reduces bacterial disease pressure", correct: false }
        - { text: "It stops phylloxera reproducing in vineyard soils", correct: false }
      explanation: |
        Fungal diseases need moisture to infect and spread. Dry weather therefore reduces pressure,
        although humid coastal regions and rainy vintages remain exceptions.
    fr:
      question: "Quel est le principal avantage sanitaire d’une saison végétative généralement sèche en Espagne ?"
      choices:
        - { text: "Elle empêche la propagation des viroses de la vigne", correct: false }
        - { text: "Elle réduit la pression du mildiou et de la pourriture des grappes", correct: true }
        - { text: "Elle réduit surtout la pression des maladies bactériennes", correct: false }
        - { text: "Elle empêche le phylloxéra de se reproduire dans le sol", correct: false }
      explanation: |
        Les maladies fongiques ont besoin d’humidité pour infecter la vigne et se propager. Un temps
        sec réduit donc leur pression, même si les régions côtières humides et les millésimes
        pluvieux font exception.

  - id: spain-dry-stress-001
    type: mcq
    deck: Spain
    tags: [spain, climate]
    status: reviewed
    source_id: c30-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What happens when water scarcity becomes too severe for a Spanish vineyard?"
      choices:
        - { text: "Ripening accelerates without any loss of yield", correct: false }
        - { text: "Stomata close, slowing photosynthesis and ripening", correct: true }
        - { text: "Berries retain high acidity while sugar accumulation slows", correct: false }
        - { text: "Canopies grow more vigorously and create heavy shade", correct: false }
      explanation: |
        A vine conserves water by closing its stomata. Prolonged shutdown limits photosynthesis,
        delays flavour development and can reduce both yield and quality.
    fr:
      question: "Que se passe-t-il lorsque le manque d’eau devient trop important dans un vignoble espagnol ?"
      choices:
        - { text: "La maturation s’accélère sans aucune baisse de rendement", correct: false }
        - { text: "Les stomates se ferment, ce qui ralentit la photosynthèse et la maturation", correct: true }
        - { text: "Les baies conservent une forte acidité tandis que l’accumulation des sucres ralentit", correct: false }
        - { text: "La végétation devient plus vigoureuse et crée beaucoup d’ombre", correct: false }
      explanation: |
        La vigne ferme ses stomates pour économiser l’eau. Si ce blocage se prolonge, il limite la
        photosynthèse, retarde le développement des arômes et peut réduire à la fois le rendement et
        la qualité.

  - id: spain-bush-vines-001
    type: mcq
    deck: Spain
    tags: [spain, viticulture]
    status: reviewed
    source_id: c30-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which traditional vine-training arrangement is well adapted to hot, dry Spanish sites?"
      choices:
        - { text: "High-density vines on tall pergolas", correct: false }
        - { text: "Low-density, free-standing bush vines", correct: true }
        - { text: "Closely spaced vines on divided canopies", correct: false }
        - { text: "High-trained vines with large irrigated crops", correct: false }
      explanation: |
        Low planting density leaves more soil water available to each vine, while the bush canopy
        can shade bunches. The system is labour-intensive and difficult to mechanise.
    fr:
      question: "Quel mode de conduite traditionnel est bien adapté aux sites espagnols chauds et secs ?"
      choices:
        - { text: "Des vignes très serrées sur de hautes pergolas", correct: false }
        - { text: "Des vignes en gobelet, espacées et non palissées", correct: true }
        - { text: "Des vignes serrées à palissage divisé", correct: false }
        - { text: "Des vignes hautes, irriguées et très productives", correct: false }
      explanation: |
        Une faible densité laisse davantage d’eau du sol à chaque pied, tandis que la végétation du
        gobelet peut ombrager les grappes. Ce système exige beaucoup de travail manuel et se
        mécanise difficilement.

  - id: spain-bush-why-001
    type: mcq
    deck: Spain
    tags: [spain, viticulture]
    status: reviewed
    source_id: c30-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do low-density bush vines help grapes in a hot, water-limited Spanish vineyard?"
      choices:
        - { text: "They increase competition and expose bunches to afternoon sun", correct: false }
        - { text: "They reduce competition for water and provide fruit shade", correct: true }
        - { text: "They raise yields by creating a larger irrigated canopy", correct: false }
        - { text: "They align bunches for rapid mechanical harvesting", correct: false }
      explanation: |
        Wide spacing gives each vine access to a larger soil volume, and the self-shading canopy
        limits sunburn. These benefits explain the system’s persistence on dry sites.
    fr:
      question: "Comment des gobelets plantés à faible densité protègent-ils les raisins dans un vignoble espagnol chaud et pauvre en eau ?"
      choices:
        - { text: "Ils renforcent la concurrence et exposent les grappes au soleil de l’après-midi", correct: false }
        - { text: "Ils réduisent la concurrence pour l’eau et ombragent les raisins", correct: true }
        - { text: "Ils augmentent les rendements grâce à une végétation irriguée plus développée", correct: false }
        - { text: "Ils alignent les grappes pour accélérer la vendange mécanique", correct: false }
      explanation: |
        L’écartement important donne à chaque pied accès à un volume de sol plus vaste, tandis que
        l’auto-ombrage du gobelet limite les brûlures du soleil. Ces avantages expliquent le
        maintien de cette conduite dans les sites secs.

  - id: spain-wire-train-001
    type: mcq
    deck: Spain
    tags: [spain, viticulture]
    status: reviewed
    source_id: c30-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What vineyard change commonly accompanies modernisation in flatter Spanish regions?"
      choices:
        - { text: "Replacing trellises with irregular bush vines", correct: false }
        - { text: "Converting bush vines to wire-trained rows", correct: true }
        - { text: "Increasing vine density while removing access lanes", correct: false }
        - { text: "Raising vines onto traditional stone pergolas", correct: false }
      explanation: |
        Regular trellised rows organise shoots and fruit into an accessible zone. They also make
        canopy management and mechanised operations easier.
    fr:
      question: "Quelle évolution du vignoble accompagne souvent la modernisation des régions espagnoles les plus planes ?"
      choices:
        - { text: "Le remplacement des palissages par des gobelets irréguliers", correct: false }
        - { text: "La conversion des gobelets en rangs palissés", correct: true }
        - { text: "L’augmentation de la densité avec suppression des voies d’accès", correct: false }
        - { text: "La conduite des vignes sur des pergolas traditionnelles en pierre", correct: false }
      explanation: |
        Des rangs palissés réguliers regroupent les rameaux et les raisins dans une zone accessible.
        Ils facilitent aussi la gestion de la végétation et les opérations mécanisées.

  - id: spain-wire-machine-001
    type: mcq
    deck: Spain
    tags: [spain, viticulture]
    status: reviewed
    source_id: c30-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is wire training attractive to large Spanish vineyards on relatively flat land?"
      choices:
        - { text: "It protects fruit better from sun than low-trained bush vines", correct: false }
        - { text: "It makes pruning and harvesting easier to mechanise", correct: true }
        - { text: "It removes the need to manage yields and canopies", correct: false }
        - { text: "It gives each vine more soil water at higher density", correct: false }
      explanation: |
        Machines work efficiently along uniform rows with a defined fruiting zone. The producer must
        still manage exposure carefully in hot conditions.
    fr:
      question: "Pourquoi le palissage est-il intéressant dans les grands vignobles espagnols relativement plats ?"
      choices:
        - { text: "Il protège mieux les raisins du soleil que les gobelets bas", correct: false }
        - { text: "Il facilite la mécanisation de la taille et des vendanges", correct: true }
        - { text: "Il dispense de maîtriser les rendements et la végétation", correct: false }
        - { text: "Il procure davantage d’eau à chaque pied malgré une densité supérieure", correct: false }
      explanation: |
        Les machines travaillent efficacement le long de rangs réguliers dotés d’une zone fructifère
        bien définie. Dans les régions chaudes, le producteur doit néanmoins gérer avec soin
        l’exposition des grappes.

  - id: spain-cheap-red-001
    type: mcq
    deck: Spain
    tags: [spain, winemaking]
    status: reviewed
    source_id: c30-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which technique can create a soft, fruit-forward Spanish red for early release?"
      choices:
        - { text: "Extended extraction followed by long new-oak ageing", correct: false }
        - { text: "Semi-carbonic maceration followed by little or no oak", correct: true }
        - { text: "Oxidative maturation in old barrels for several years", correct: false }
        - { text: "Biological ageing under flor before bottling", correct: false }
      explanation: |
        Semi-carbonic maceration emphasises fresh fruit and limits harsh extraction. It is
        particularly associated with youthful styles rather than concentrated wines intended for
        long ageing.
    fr:
      question: "Quelle technique peut donner un rouge espagnol souple, fruité et destiné à une commercialisation rapide ?"
      choices:
        - { text: "Une extraction poussée suivie d’un long élevage en fûts neufs", correct: false }
        - { text: "Une macération semi-carbonique suivie de peu ou pas de bois", correct: true }
        - { text: "Un élevage oxydatif de plusieurs années en vieux fûts", correct: false }
        - { text: "Un élevage biologique sous voile avant la mise en bouteille", correct: false }
      explanation: |
        La macération semi-carbonique met en avant le fruit frais et limite l’extraction de tanins
        durs. Elle convient surtout aux styles jeunes plutôt qu’aux vins concentrés destinés à une
        longue garde.

  - id: spain-best-red-oak-001
    type: mcq
    deck: Spain
    tags: [spain, winemaking]
    status: reviewed
    source_id: c30-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do many premium Spanish reds undergo maturation in oak?"
      choices:
        - { text: "To remove acidity and prevent bottle development", correct: false }
        - { text: "To soften structure and add controlled spice and texture", correct: true }
        - { text: "To create carbonation before early bottling", correct: false }
        - { text: "To preserve primary fruit without exposing wine to oxygen", correct: false }
      explanation: |
        Gradual oxygen exposure can help tannins integrate, while oak contributes flavours and
        texture. Barrel age, size and the proportion of new wood determine the intensity.
    fr:
      question: "Pourquoi de nombreux rouges espagnols haut de gamme sont-ils élevés en fût ?"
      choices:
        - { text: "Pour supprimer l’acidité et empêcher l’évolution en bouteille", correct: false }
