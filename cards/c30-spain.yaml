        - { text: "Roots follow slate fissures to moisture stored at depth", correct: true }
        - { text: "Shallow slate stores ample water near the surface", correct: false }
        - { text: "Daily coastal fog supplies most vine water", correct: false }
      explanation: |
        The surface is dry and stony, but fractured rock permits roots to penetrate deeply. Access
        to stored moisture helps established vines survive prolonged drought.

