        - { text: "Only on the Mediterranean beach", correct: false }
        - { text: "On some of the highest ground, with sites over 850 m", correct: true }
        - { text: "Only in the Canary Islands", correct: false }
      explanation: |
        **On some of the highest ground, with sites over 850 m.**
        That height, not a sea breeze, sets up the cool nights.

