        - { text: "Estate-grown grapes and wine are handled separately", correct: true }
        - { text: "The wine must mature for five years before release", correct: false }
        - { text: "The blend must contain an international variety", correct: false }
      explanation: |
        The grapes must come from the recognised pago, and production and storage must remain
        distinct from other wines. This protects the identity of the individual site.

