      explanation: |
        **La Tâche**, **La Romanée**, **Romanée-Conti**, **Clos de Tart**
        — one owner. Clos de Vougeot is the opposite story.
    fr:
      question: Si un climat est un monopole, combien de domaines le possèdent-ils ?
      choices:
        - { text: "Deux", correct: false }
        - { text: "Un seul", correct: true }
        - { text: "Au moins cinq", correct: false }
        - { text: "Un nombre quelconque, si un seul domaine vinifie", correct: false }
      explanation: |
        **La Tâche, La Romanée, Romanée-Conti et Clos de Tart** n’ont chacun
        qu’un propriétaire. Clos de Vougeot illustre la situation inverse.

  - id: burgundy-parcelles-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0103
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is a typical Côte d’Or climat owned, unlike a Bordeaux château?
      choices:
        - { text: "One domaine normally owns and farms the whole climat", correct: false }
        - { text: "It is split into many parcels under different domaines", correct: true }
        - { text: "The village owns the vines and leases each vintage", correct: false }
        - { text: "One négociant controls every parcel in the appellation", correct: false }
      explanation: |
        **Clos de Vougeot** has dozens of owners inside one wall. That
        is why two “Clos de Vougeot” bottles can taste like strangers.
    fr:
      question: Comment un climat typique de la Côte d’Or est-il réparti entre propriétaires, contrairement à un château bordelais ?
      choices:
        - { text: "Un domaine possède et cultive normalement tout le climat", correct: false }
        - { text: "Il est divisé en nombreuses parcelles appartenant à différents domaines", correct: true }
        - { text: "Le village possède les vignes et les loue à chaque millésime", correct: false }
        - { text: "Un négociant contrôle toutes les parcelles de l’appellation", correct: false }
      explanation: |
        Le **Clos de Vougeot** compte des dizaines de propriétaires dans une
        seule enceinte. Deux bouteilles portant ce même nom peuvent donc
        présenter des styles très différents.

