    en:
      question: What sits at the bottom of the Burgundy AOC ladder for still red and white?
      choices:
        - { text: "Grand cru only", correct: false }
        - { text: "Regional Bourgogne Rouge and Bourgogne Blanc", correct: true }
        - { text: "Only Romanée-Conti", correct: false }
        - { text: "Premier cru supérieur, as at Yquem", correct: false }
      explanation: |
        Generic **Bourgogne**. There are other regionals (Aligoté,
        Hautes-Côtes, Mâcon) — this pair is the floor for Pinot and
        Chardonnay.

  - id: burgundy-regional-source-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Is every Bourgogne Rouge grown on a plot that never had a village right?
      choices:
        - { text: "Yes — declassification is illegal", correct: false }
        - { text: "No — some lots are declassified from a higher AOC", correct: true }
        - { text: "Yes — it must be a grand cru monopole", correct: false }
        - { text: "Yes — it may only come from the Landes", correct: false }
      explanation: |
        Plain or declassified juice. **DRC** and others bottle some
        village leftover as Bourgogne to protect the village label.

  - id: burgundy-declass-why-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why might a grower sell village-eligible wine as plain Bourgogne?
      choices:
        - { text: "EU law forbids village labels after 1 June", correct: false }
        - { text: "Yields ran too high, or they want to keep the village name for the best lots", correct: true }
        - { text: "Bourgogne always scores higher than grand cru", correct: false }
        - { text: "Pinot is illegal in Gevrey", correct: false }
      explanation: |
        **Yield over the village cap**, or a quality sort. DRC and others
        have long used a Bourgogne label for young vines or lesser
        barrels.

  - id: burgundy-bourgogne-grapes-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A generic Bourgogne Rouge or Blanc is usually which pair?
      choices:
        - { text: "Syrah and Viognier", correct: false }
        - { text: "Pinot Noir and Chardonnay", correct: true }
        - { text: "Cabernet Sauvignon and Sémillon", correct: false }
        - { text: "Only Riesling", correct: false }
      explanation: |
        The two stars. **Bourgogne Aligoté** is a separate label; César
        and others are footnotes.

  - id: burgundy-restricted-regional-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0092
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What sits between generic Bourgogne and a village AOC on the map?
      choices:
        - { text: "A 1855 first-growth rank", correct: false }
        - { text: "Tighter regional names such as Hautes-Côtes, Côte Chalonnaise, Mâcon and Mâcon-Villages", correct: true }
        - { text: "Only grand cru", correct: false }
        - { text: "Only Champagne AOC", correct: false }
      explanation: |
        **Hautes-Côtes**, **Côte Chalonnaise**, **Mâcon** and
        **Mâcon-Villages** are still regionals, not commune AOCs.

  - id: burgundy-commune-rank-001
    type: mcq
