        - { text: "Chablis and Gevrey-Chambertin", correct: true }
        - { text: "Chablis Grand Cru and Chambertin", correct: false }
        - { text: "Bourgogne Tonnerre and Côte de Nuits-Villages", correct: false }
      explanation: |
        **Chablis** (Yonne) and **Gevrey-Chambertin** (Nuits). Both can
        also host premiers and — in these two cases — grands crus.
    fr:
      question: Quelle paire réunit deux AOC communales, l’une dans l’Yonne et l’autre sur la Côte de Nuits ?
      choices:
        - { text: "Petit Chablis et Bourgogne Côte d’Or", correct: false }
        - { text: "Chablis et Gevrey-Chambertin", correct: true }
        - { text: "Chablis Grand Cru et Chambertin", correct: false }
        - { text: "Bourgogne Tonnerre et Côte de Nuits-Villages", correct: false }
      explanation: |
        **Chablis**, dans l’Yonne, et **Gevrey-Chambertin**, en Côte de Nuits,
        sont deux appellations communales. Toutes deux comprennent aussi des
        premiers crus et, dans ces deux cas, des grands crus.

  - id: burgundy-commune-share-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0097
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Is village Burgundy a sliver like grand cru, or a much bigger slice?
      choices:
        - { text: "A small slice of around 5%", correct: false }
        - { text: "A much bigger slice — about 40% including premier cru", correct: true }
        - { text: "The majority, at around 60%", correct: false }
        - { text: "About the same share as grand cru", correct: false }
      explanation: |
        Recent production averages put village wines at about **40%** when
        premier cru is included. Regional appellations remain the majority;
        grands crus are roughly 1%.
    fr:
      question: Les vins de village représentent-ils une part infime comme les grands crus, ou une part bien plus importante de la Bourgogne ?
      choices:
        - { text: "Une petite part d’environ 5 %", correct: false }
        - { text: "Une part bien plus importante, environ 40 % premiers crus compris", correct: true }
        - { text: "La majorité, soit environ 60 %", correct: false }
        - { text: "À peu près la même part que les grands crus", correct: false }
      explanation: |
        Les moyennes récentes placent les villages autour de **40 %** en
        incluant les premiers crus. Les régionales restent majoritaires ;
        les grands crus représentent environ 1 %.

  - id: burgundy-lieu-dit-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When may a village Burgundy add a vineyard name that is not premier or grand cru?
      choices:
        - { text: "Whenever several village parcels are blended", correct: false }
        - { text: "When the wine is a single lieu-dit that is not a cru", correct: true }
        - { text: "Only when the site is awaiting premier cru status", correct: false }
        - { text: "Whenever the producer owns the whole vineyard", correct: false }
      explanation: |
        A **lieu-dit** in smaller type. It is not a premier cru just
        because a plot is named.
    fr:
      question: Quand un Bourgogne de village peut-il ajouter le nom d’une parcelle qui n’est ni premier ni grand cru ?
      choices:
