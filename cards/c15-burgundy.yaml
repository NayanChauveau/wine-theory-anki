      choices:
        - { text: "Two", correct: false }
        - { text: "One", correct: true }
        - { text: "A minimum of five", correct: false }
        - { text: "Any number, provided one domaine makes the wine", correct: false }
      explanation: |
        **La Tâche**, **La Romanée**, **Romanée-Conti**, **Clos de Tart**
        — one owner. Clos de Vougeot is the opposite story.

  - id: burgundy-parcelles-001
    type: mcq
