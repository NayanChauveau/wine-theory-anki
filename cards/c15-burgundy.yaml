        - { text: "Premier cru and grand cru", correct: true }
        - { text: "Lieu-dit and monopole", correct: false }
        - { text: "Commune and climat", correct: false }
      explanation: |
        **Premier cru**, then **grand cru**. Pouilly-Fuissé now has
        premiers crus (2020) — still no grand cru in the Mâconnais.

  - id: burgundy-cru-meaning-001
