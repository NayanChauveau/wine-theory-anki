      sources: [known-fact]
    en:
      question: Which rank sits directly above regional AOCs such as Bourgogne, Mâcon and Hautes-Côtes?
      choices:
        - { text: "Restricted regional appellations", correct: false }
        - { text: "Commune (village) appellations", correct: true }
        - { text: "Premier cru appellations", correct: false }
        - { text: "Grand cru appellations", correct: false }
      explanation: |
        **Village / commune**: Gevrey-Chambertin, Meursault, Chablis.
        Premier and grand cru sit above that.
    fr:
      question: Quel rang se situe directement au-dessus des AOC régionales comme Bourgogne, Mâcon ou Hautes-Côtes ?
      choices:
        - { text: "Les appellations régionales restreintes", correct: false }
        - { text: "Les appellations communales ou villages", correct: true }
        - { text: "Les appellations premiers crus", correct: false }
        - { text: "Les appellations grands crus", correct: false }
      explanation: |
        Le niveau **village ou communal** comprend Gevrey-Chambertin,
        Meursault ou Chablis. Les premiers et grands crus se situent au-dessus.

  - id: burgundy-commune-examples-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0096
    review:
