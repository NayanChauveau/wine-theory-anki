        - { text: "Côte de Nuits-Villages", correct: true }
        - { text: "Bourgogne Côte d’Or", correct: false }
        - { text: "Côte de Beaune-Villages", correct: false }
      explanation: |
        **Comblanchien, Corgoloin, Prissey**, parts of Brochon / Fixin —
        not Gevrey or Vosne. Both colours are legal; red dominates.

  - id: burgundy-cdb-villages-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What colour is Côte de Beaune-Villages allowed to be?
      choices:
        - { text: "Red and white", correct: false }
        - { text: "Red only", correct: true }
        - { text: "White only", correct: false }
        - { text: "Red and rosé", correct: false }
      explanation: |
        **Red Pinot** only. Famous villages such as **Pommard** and
        **Volnay** stay on their own labels. It is not a white AOC.

  - id: burgundy-hautes-cotes-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Above the Côte scarp, which pair of Bourgogne AOCs names the windy plateau?
      choices:
        - { text: "Côte de Nuits-Villages and Côte de Beaune-Villages", correct: false }
        - { text: "Bourgogne Hautes-Côtes de Nuits and Hautes-Côtes de Beaune", correct: true }
        - { text: "Bourgogne Côte Chalonnaise and Bourgogne Côte d’Or", correct: false }
        - { text: "Mâcon-Villages and Bourgogne Tonnerre", correct: false }
      explanation: |
        **Hautes-Côtes de Nuits** and **Hautes-Côtes de Beaune**: cooler,
        windier plateau. Less body than the mid-slope crus — useful in
        hot years, lean in cold ones.

  - id: burgundy-chalonnaise-where-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0063
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After Santenay, which Burgundy hillside district comes next heading south?
      choices:
        - { text: "The Mâconnais", correct: false }
        - { text: "The Côte Chalonnaise", correct: true }
        - { text: "The Côte de Nuits", correct: false }
        - { text: "The Grand Auxerrois", correct: false }
      explanation: |
        After **Santenay** the hills break up: that is the
        **Chalonnaise**, then the Mâconnais. Not “Challonaise”.

  - id: burgundy-chalonnaise-grapes-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Mercurey rouge and Montagny blanc are built on which pair of grapes?
      choices:
        - { text: "Gamay and Aligoté", correct: false }
        - { text: "Chardonnay and Pinot Noir", correct: true }
        - { text: "Pinot Noir and Aligoté", correct: false }
        - { text: "Gamay and Chardonnay", correct: false }
      explanation: |
        Same pair as the Côte d’Or. **Aligoté** has its own village at
        **Bouzeron**; Gamay is minor here.

  - id: burgundy-chalonnaise-ripen-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does harvest timing on the Côte Chalonnaise compare with the Côte d’Or?
      choices:
        - { text: "It is usually earlier and ripening is more reliable", correct: false }
        - { text: "It is later, and ripening is less reliable", correct: true }
        - { text: "It is at the same time, with no meaningful difference", correct: false }
        - { text: "It is later, but ripening is more reliable", correct: false }
      explanation: |
        More **broken hills**, a cooler pocket: pick is later and some
        years never quite finish. That is the reliability gap, not a
        different grape list.

  - id: burgundy-chalonnaise-aspect-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do many Chalonnaise wines come out lighter-bodied than Côte d’Or peers?
      choices:
        - { text: "The soils are uniformly richer in heat-retaining gravel", correct: false }
        - { text: "Fewer vineyards enjoy a clean easterly aspect", correct: true }
        - { text: "Harvest is consistently earlier than on the Côte d’Or", correct: false }
        - { text: "The district lies further south and is uniformly hotter", correct: false }
      explanation: |
        The Côte d’Or is one long **E/SE** scarp. The Chalonnaise is a
        jumble of aspects — more shade, more wind, less consistent sun.

  - id: burgundy-chalonnaise-villages-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0067
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Burgundy district contains the village AOCs Rully, Mercurey, Givry, Montagny and Bouzeron?
      choices:
        - { text: "The Côte de Nuits", correct: false }
        - { text: "The Côte Chalonnaise", correct: true }
        - { text: "The Côte de Beaune", correct: false }
        - { text: "The Mâconnais", correct: false }
      explanation: |
        North to south: **Rully, Mercurey, Givry, Montagny**. **Bouzeron**
        is the fifth village AOC — do not treat the old “four” as a
        closed legal list.

  - id: burgundy-rully-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Chalonnaise village has long been a base for Crémant de Bourgogne?
      choices:
        - { text: "Mercurey", correct: false }
        - { text: "Rully", correct: true }
        - { text: "Givry", correct: false }
        - { text: "Montagny", correct: false }
      explanation: |
        **Rully** leans white and has long supplied **Crémant**. Mercurey
        is the red-reputation village.

  - id: burgundy-mercurey-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0069
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Chalonnaise village has the strongest red-wine name?
      choices:
        - { text: "Montagny", correct: false }
        - { text: "Mercurey", correct: true }
        - { text: "Rully", correct: false }
        - { text: "Bouzeron", correct: false }
      explanation: |
        **Mercurey** is the largest village AOC here and the red
        benchmark. Montagny is white only.

  - id: burgundy-givry-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0070
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is Givry’s place among the Chalonnaise villages?
      choices:
        - { text: "A large white-only AOC led by Chardonnay", correct: false }
        - { text: "A small AOC with a strong red reputation", correct: true }
        - { text: "The district’s main Aligoté-only village", correct: false }
        - { text: "The largest red AOC in the district", correct: false }
      explanation: |
        **Givry** rouge is well thought of; the AOC is compact. Do not
        nail “the smallest in Burgundy” — **Bouzeron** is tiny too.

  - id: burgundy-montagny-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0071
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What colour is Montagny allowed to be?
      choices:
        - { text: "Red and white, like Mercurey", correct: false }
        - { text: "White only", correct: true }
        - { text: "Red only", correct: false }
        - { text: "White and rosé", correct: false }
      explanation: |
        **Montagny** is a Chardonnay AOC. No red village wine under that
        name.

  - id: burgundy-chalonnaise-crus-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How far do Chalonnaise classifications go?
      choices:
        - { text: "Village level only, with no premiers crus", correct: false }
        - { text: "Premier cru climats exist; there are no grands crus", correct: true }
        - { text: "Premier and grand cru climats both exist", correct: false }
        - { text: "Regional and grand cru levels, but no village AOCs", correct: false }
      explanation: |
        **Premiers crus**, but no grand cru. The Mâconnais now also has
        premiers crus in Pouilly-Fuissé, Pouilly-Loché and Pouilly-Vinzelles;
        it still has no grand cru.

  - id: burgundy-chalonnaise-regional-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0073
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which regional AOC can label Pinot Noir or Chardonnay from the Chalonnaise outside a village AOC?
      choices:
        - { text: "Bourgogne Côte d’Or", correct: false }
        - { text: "Bourgogne Côte Chalonnaise", correct: true }
        - { text: "Côte de Beaune-Villages", correct: false }
        - { text: "Bourgogne Hautes-Côtes de Beaune", correct: false }
      explanation: |
        **Bourgogne Côte Chalonnaise**. Spelling is Chalonnaise, not
        “Challonaise”.

  - id: burgundy-macon-chard-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
