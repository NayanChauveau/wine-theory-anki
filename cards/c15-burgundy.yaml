        - { text: "The climat name, usually without the village", correct: true }
        - { text: "Both village and climat names in equal prominence", correct: false }
        - { text: "The producer name instead of the climat", correct: false }
      explanation: |
        **Musigny Grand Cru** — no “Chambolle” required. **Chablis Grand
        Cru** keeps the word Chablis; that is the northern exception.
