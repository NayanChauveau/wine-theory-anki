        - { text: "Pommard and Volnay", correct: true }
        - { text: "Meursault and Puligny only as red AOCs", correct: false }
        - { text: "Pomerol and Pauillac", correct: false }
      explanation: |
        **Pommard** and **Volnay** are Pinot villages. Meursault and
        Puligny can bottle a little red; it is not their story.

  - id: burgundy-white-trio-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0059
