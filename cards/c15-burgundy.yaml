        - { text: "The wine was declassified to Bourgogne Rouge", correct: false }
        - { text: "Only grands crus may print a climat", correct: false }
      explanation: |
        **Volnay Premier Cru** with no climat: a village 1er blend.
        Still premier cru — just not a single-climat wine.

