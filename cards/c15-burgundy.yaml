      question: Meursault plus which two neighbours form the Côte de Beaune white trio?
      choices:
        - { text: "Pommard and Volnay", correct: false }
        - { text: "Puligny-Montrachet and Chassagne-Montrachet", correct: true }
        - { text: "Aloxe-Corton and Savigny-lès-Beaune", correct: false }
        - { text: "Saint-Aubin and Santenay", correct: false }
      explanation: |
        The **white trio**. Montrachet itself is split between Puligny
        and Chassagne.

  - id: burgundy-cdnv-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Comblanchien, Corgoloin and Prissey usually bottle red (or white) as what AOC?
      choices:
