        - { text: "The majority, at around 60%", correct: false }
        - { text: "About the same share as grand cru", correct: false }
      explanation: |
        Recent production averages put village wines at about **40%** when
        premier cru is included. Regional appellations remain the majority;
        grands crus are roughly 1%.

