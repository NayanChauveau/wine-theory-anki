      question: Quel mode de consommation convient le mieux à un Mâcon rouge typique ?
      choices:
        - { text: "Corsé et tannique, après une longue garde", correct: false }
        - { text: "Léger et fruité, à boire jeune", correct: true }
        - { text: "Demi-sec, de préférence après cinq ans", correct: false }
        - { text: "Très boisé, de préférence après dix ans", correct: false }
      explanation: |
        Le **Gamay**, ou un Pinot Noir léger, donne ici des vins destinés à
        être bus jeunes. Ce n’est pas le profil d’un grand cru de Nuits.

  - id: burgundy-macon-villages-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Mâcon-Villages usually compare with generic Mâcon blanc?
      choices:
        - { text: "Lighter, less ripe and less defined", correct: false }
        - { text: "A step up in weight and definition", correct: true }
        - { text: "Similar in weight, but always sweeter", correct: false }
        - { text: "More neutral, with higher yields and less body", correct: false }
      explanation: |
        A step up in **weight**. **Mâcon-Villages** cannot be red.
        **Mâcon-Lugny** is the named volume village.
    fr:
      question: Comment Mâcon-Villages se compare-t-il généralement à un Mâcon blanc générique ?
      choices:
        - { text: "Plus léger, moins mûr et moins défini", correct: false }
        - { text: "Un cran au-dessus en matière et en définition", correct: true }
        - { text: "De poids similaire, mais toujours plus doux", correct: false }
        - { text: "Plus neutre, avec de plus hauts rendements et moins de corps", correct: false }
      explanation: |
        Mâcon-Villages gagne généralement en **matière**. Il ne peut pas être
        rouge ; **Mâcon-Lugny** est l’un des noms de village les plus diffusés.

  - id: burgundy-lugny-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Mâcon village name is the volume bestseller on export lists?
      choices:
        - { text: "Fuissé", correct: false }
        - { text: "Lugny", correct: true }
        - { text: "Vergisson", correct: false }
        - { text: "Solutré-Pouilly", correct: false }
      explanation: |
        **Mâcon-Lugny** (often the Cave de Lugny) is the supermarket
        face, not a claim that it outranks Pouilly-Fuissé for quality.
    fr:
      question: Quel nom de village mâconnais est un grand succès en volume sur les marchés d’exportation ?
      choices:
        - { text: "Fuissé", correct: false }
        - { text: "Lugny", correct: true }
        - { text: "Vergisson", correct: false }
        - { text: "Solutré-Pouilly", correct: false }
      explanation: |
        **Mâcon-Lugny**, souvent associé à la Cave de Lugny, est très présent
        en grande distribution. Ce succès commercial ne signifie pas qu’il
        surclasse Pouilly-Fuissé en qualité.

  - id: burgundy-pf-sv-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0082
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Beside Viré-Clessé, which two Mâconnais village AOCs do most lists lead with?
      choices:
        - { text: "Pouilly-Vinzelles and Pouilly-Loché", correct: false }
        - { text: "Pouilly-Fuissé and Saint-Véran", correct: true }
        - { text: "Mâcon-Villages and Mâcon-Lugny", correct: false }
        - { text: "Rully and Montagny", correct: false }
      explanation: |
        **Pouilly-Fuissé** and **Saint-Véran**. **Viré-Clessé** and the
        smaller Pouillys (Vinzelles, Loché) sit beside them — not
        invisible, just not the first two names.
    fr:
      question: Outre Viré-Clessé, quelles deux AOC villages du Mâconnais figurent le plus souvent en tête des listes ?
      choices:
        - { text: "Pouilly-Vinzelles et Pouilly-Loché", correct: false }
        - { text: "Pouilly-Fuissé et Saint-Véran", correct: true }
        - { text: "Mâcon-Villages et Mâcon-Lugny", correct: false }
        - { text: "Rully et Montagny", correct: false }
      explanation: |
        **Pouilly-Fuissé** et **Saint-Véran** sont les deux noms principaux.
        **Viré-Clessé**, Pouilly-Vinzelles et Pouilly-Loché complètent la
        liste sans être moins réels pour autant.

  - id: burgundy-pf-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fruit profile do Pouilly-Fuissé and Saint-Véran usually show?
      choices:
        - { text: "Green apple and lemon, with a light body", correct: false }
        - { text: "Ripe stone and tropical fruit", correct: true }
        - { text: "Red cherry and cranberry", correct: false }
        - { text: "Neutral fruit with very high acidity", correct: false }
      explanation: |
        Warmer south Burgundy: **peach, apricot, sometimes pineapple**.
        Many see some **barrel** time for texture — not every cuvée is
        a toast bomb.
    fr:
      question: Quel profil fruité Pouilly-Fuissé et Saint-Véran présentent-ils généralement ?
      choices:
        - { text: "Pomme verte et citron, avec un corps léger", correct: false }
        - { text: "Fruits à noyau mûrs et fruits tropicaux", correct: true }
        - { text: "Cerise rouge et canneberge", correct: false }
        - { text: "Fruit neutre et acidité très élevée", correct: false }
      explanation: |
        Dans ce sud bourguignon plus chaud dominent **pêche, abricot et
        parfois ananas**. Beaucoup de vins passent un temps en fût pour la
        texture, sans que toutes les cuvées soient fortement toastées.

  - id: burgundy-solutre-site-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where are many of the best Pouilly-Fuissé vineyards located?
      choices:
        - { text: "On flat, fertile soils beside the Saône", correct: false }
        - { text: "On the Roche de Solutré’s limestone, looking east or south-east", correct: true }
        - { text: "On north-facing granite above Lugny", correct: false }
        - { text: "On the coolest west-facing slopes of the Mâconnais", correct: false }
      explanation: |
        **Solutré** (and **Vergisson**) limestone, E/SE. That is the
        postcard cliff above Fuissé.
    fr:
      question: Où se trouvent bon nombre des meilleures vignes de Pouilly-Fuissé ?
      choices:
        - { text: "Sur les sols plats et fertiles près de la Saône", correct: false }
        - { text: "Sur les calcaires de la Roche de Solutré, exposés à l’est ou au sud-est", correct: true }
        - { text: "Sur les granites orientés au nord au-dessus de Lugny", correct: false }
        - { text: "Sur les versants ouest les plus frais du Mâconnais", correct: false }
      explanation: |
        Les calcaires de **Solutré** et de **Vergisson**, exposés à l’est ou
        au sud-est, accueillent nombre de grands sites. C’est la falaise
        emblématique qui domine Fuissé.

  - id: burgundy-solutre-amphitheatre-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0085
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What landform around the Roche de Solutré traps extra sun?
      choices:
        - { text: "A narrow, shaded valley", correct: false }
        - { text: "Amphitheatre-like slopes", correct: true }
        - { text: "A broad, exposed plateau", correct: false }
        - { text: "A deep river basin", correct: false }
      explanation: |
        A natural **bowl**. That is why these Chardonnays can be among
        Burgundy’s ripest — still not a Côte de Beaune grand cru by law.
    fr:
      question: Quelle forme de relief autour de la Roche de Solutré concentre davantage de soleil ?
      choices:
        - { text: "Une vallée étroite et ombragée", correct: false }
        - { text: "Des versants disposés en amphithéâtre", correct: true }
        - { text: "Un vaste plateau exposé aux vents", correct: false }
        - { text: "Un bassin fluvial profond", correct: false }
      explanation: |
        Ce **cirque naturel** concentre la chaleur. Les Chardonnays qui y
        poussent comptent ainsi parmi les plus mûrs de Bourgogne, sans être
        pour autant des grands crus de la Côte de Beaune.

  - id: burgundy-solutre-oak-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are many Roche de Solutré / Pouilly-Fuissé wines raised?
      choices:
        - { text: "Only in stainless steel to preserve a lean style", correct: false }
        - { text: "In oak, which can add a toasty note", correct: true }
        - { text: "Under flor for deliberate oxidation", correct: false }
        - { text: "In amphora with extended skin contact", correct: false }
      explanation: |
        Barrel time is common at the top. It is a **style choice**, not
        a legal duty — some growers stay in steel.
    fr:
      question: Comment de nombreux Pouilly-Fuissé issus du secteur de la Roche de Solutré sont-ils élevés ?
      choices:
        - { text: "Uniquement en cuve inox pour préserver un style maigre", correct: false }
        - { text: "Sous bois, qui peut apporter une note toastée", correct: true }
        - { text: "Sous voile pour provoquer une oxydation volontaire", correct: false }
        - { text: "En amphore avec une longue macération pelliculaire", correct: false }
      explanation: |
        L’élevage en fût est courant pour les meilleures cuvées. Il reste un
        **choix de style**, pas une obligation légale : certains producteurs
        privilégient la cuve inox.

  - id: burgundy-hierarchy-basis-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0087
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Burgundy’s AOC ladder rank, unlike Bordeaux’s château lists?
      choices:
        - { text: "The producer, regardless of vineyard origin", correct: false }
        - { text: "The quality of the vineyard site (the climat)", correct: true }
        - { text: "The grape variety used in each wine", correct: false }
        - { text: "The length of barrel ageing", correct: false }
      explanation: |
        **Climats**, not brands. A grower can own rows in several ranks;
        the name on the label follows the plot.
    fr:
      question: Que classe la hiérarchie des AOC bourguignonnes, contrairement aux classements de châteaux bordelais ?
      choices:
        - { text: "Le producteur, quelle que soit l’origine des raisins", correct: false }
        - { text: "La qualité du site viticole, ou climat", correct: true }
        - { text: "Le cépage utilisé pour chaque vin", correct: false }
        - { text: "La durée de l’élevage en fût", correct: false }
      explanation: |
        La hiérarchie porte sur les **climats**, pas sur les marques. Un même
        producteur peut posséder des rangs de vigne à plusieurs niveaux ;
        le nom porté par l’étiquette suit la parcelle.

  - id: burgundy-regional-floor-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0088
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which appellation level forms the base of Burgundy’s hierarchy for still red and white wines?
      choices:
        - { text: "Village Bourgogne Rouge and Bourgogne Blanc", correct: false }
        - { text: "Regional Bourgogne Rouge and Bourgogne Blanc", correct: true }
        - { text: "Premier Cru Bourgogne Rouge and Bourgogne Blanc", correct: false }
        - { text: "Bourgogne Grand Cru Rouge and Blanc", correct: false }
      explanation: |
        Generic **Bourgogne**. There are other regionals (Aligoté,
        Hautes-Côtes, Mâcon) — this pair is the floor for Pinot and
        Chardonnay.
    fr:
      question: Quel niveau d’appellation forme la base de la hiérarchie bourguignonne pour les vins tranquilles rouges et blancs ?
      choices:
        - { text: "Bourgogne Rouge et Bourgogne Blanc au niveau village", correct: false }
        - { text: "Bourgogne Rouge et Bourgogne Blanc au niveau régional", correct: true }
        - { text: "Bourgogne Rouge et Bourgogne Blanc Premier Cru", correct: false }
        - { text: "Bourgogne Rouge et Blanc Grand Cru", correct: false }
      explanation: |
        L’AOC régionale **Bourgogne** constitue la base. D’autres régionales
        existent — Aligoté, Hautes-Côtes, Mâcon — mais ce duo est le socle
        du Pinot Noir et du Chardonnay.

  - id: burgundy-regional-source-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which origin can legitimately supply a generic Bourgogne Rouge?
      choices:
        - { text: "Only parcels that can never claim a village AOC", correct: false }
        - { text: "Regional parcels or lots declassified from a higher AOC", correct: true }
        - { text: "Only premier cru parcels that miss their yield limit", correct: false }
        - { text: "Only parcels reserved exclusively for Bourgogne Rouge", correct: false }
      explanation: |
        The fruit may come from a regional parcel or be declassified.
        **DRC** and others bottle some village-eligible lots as Bourgogne
        to protect the quality associated with the village label.
    fr:
      question: Quelle origine peut légitimement fournir un Bourgogne Rouge générique ?
      choices:
        - { text: "Uniquement des parcelles qui ne peuvent jamais prétendre à une AOC village", correct: false }
        - { text: "Des parcelles régionales ou des lots déclassés d’une AOC supérieure", correct: true }
        - { text: "Uniquement des premiers crus dépassant leur rendement maximal", correct: false }
        - { text: "Uniquement des parcelles réservées exclusivement au Bourgogne Rouge", correct: false }
      explanation: |
        Les raisins peuvent provenir d’une parcelle régionale ou d’un
        **déclassement**. La DRC et d’autres domaines vendent certains lots
        admissibles en village comme Bourgogne pour protéger le nom du village.

  - id: burgundy-declass-why-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why might a grower sell village-eligible wine as plain Bourgogne?
      choices:
        - { text: "The wine completed malolactic fermentation too early", correct: false }
        - { text: "Yields ran too high, or they want to keep the village name for the best lots", correct: true }
        - { text: "The wine spent less than 18 months in oak", correct: false }
        - { text: "The grapes came from vines younger than ten years", correct: false }
      explanation: |
        **Yield over the village cap**, or a quality sort. DRC and others
        have long used a Bourgogne label for young vines or lesser
        barrels.
    fr:
      question: Pourquoi un producteur peut-il vendre en simple Bourgogne un vin admissible en appellation village ?
      choices:
        - { text: "La fermentation malolactique s’est terminée trop tôt", correct: false }
        - { text: "Le rendement est trop élevé, ou le nom du village est réservé aux meilleurs lots", correct: true }
        - { text: "Le vin a passé moins de 18 mois en fût", correct: false }
        - { text: "Les raisins proviennent de vignes âgées de moins de dix ans", correct: false }
      explanation: |
        Le rendement peut dépasser le plafond du village, ou le producteur
        peut opérer un **tri qualitatif**. La DRC et d’autres domaines ont
        ainsi déclassé de jeunes vignes ou des fûts moins convaincants.

  - id: burgundy-bourgogne-grapes-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A generic Bourgogne Rouge or Blanc is usually which pair?
      choices:
        - { text: "Gamay and Aligoté", correct: false }
        - { text: "Pinot Noir and Chardonnay", correct: true }
        - { text: "Pinot Noir and Aligoté", correct: false }
        - { text: "Gamay and Chardonnay", correct: false }
      explanation: |
        The two stars. **Bourgogne Aligoté** is a separate label; César
        and others are footnotes.
    fr:
      question: Quels sont généralement les cépages d’un Bourgogne Rouge et d’un Bourgogne Blanc génériques ?
      choices:
        - { text: "Gamay et Aligoté", correct: false }
        - { text: "Pinot Noir et Chardonnay", correct: true }
        - { text: "Pinot Noir et Aligoté", correct: false }
        - { text: "Gamay et Chardonnay", correct: false }
      explanation: |
        Ce sont les deux cépages majeurs. **Bourgogne Aligoté** porte une
        étiquette distincte ; César et les autres cépages restent marginaux.

  - id: burgundy-restricted-regional-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0092
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which category lies between generic Bourgogne and village AOCs in Burgundy’s geographical hierarchy?
      choices:
        - { text: "Premier cru climats that cover several districts", correct: false }
        - { text: "Geographically restricted regional AOCs", correct: true }
        - { text: "Commune AOCs without a village name", correct: false }
        - { text: "Grand cru AOCs grouped by subregion", correct: false }
      explanation: |
        **Hautes-Côtes**, **Côte Chalonnaise**, **Mâcon** and
        **Mâcon-Villages** are still regionals, not commune AOCs.
    fr:
      question: Quelle catégorie s’intercale entre Bourgogne générique et les AOC villages dans la hiérarchie géographique bourguignonne ?
      choices:
        - { text: "Les climats premiers crus couvrant plusieurs secteurs", correct: false }
        - { text: "Les AOC régionales à dénomination géographique restreinte", correct: true }
        - { text: "Les AOC communales ne portant pas de nom de village", correct: false }
        - { text: "Les AOC grands crus regroupées par sous-région", correct: false }
      explanation: |
        Les **Hautes-Côtes**, **Bourgogne Côte Chalonnaise**, **Mâcon** et
        **Mâcon-Villages** restent des appellations régionales, et non des
        AOC communales.

  - id: burgundy-commune-rank-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0095
    review:
