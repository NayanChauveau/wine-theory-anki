        - { text: "About 330", correct: false }
        - { text: "About 1,200", correct: false }
      explanation: |
        The current headline figure is about **640 Premier Cru climats**.
        The exact count can move when the INAO approves new classifications.

  - id: burgundy-premier-share-001
