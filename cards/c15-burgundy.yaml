        - { text: "About 1%", correct: true }
        - { text: "About 12%", correct: false }
        - { text: "About 30%", correct: false }
      explanation: |
        Grand Cru represents roughly **1%** of recent average production.
        Scarcity is one reason the bottles command such high prices.

