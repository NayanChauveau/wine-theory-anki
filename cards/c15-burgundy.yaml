    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What two ranks sit above village on the Burgundy ladder?
      choices:
        - { text: "Cru Bourgeois and Exceptionnel", correct: false }
        - { text: "Premier cru and grand cru", correct: true }
        - { text: "IGP and Vin de France", correct: false }
        - { text: "Only Eiswein", correct: false }
      explanation: |
        **Premier cru**, then **grand cru**. Pouilly-Fuissé now has
        premiers crus (2020) — still no grand cru in the Mâconnais.

  - id: burgundy-cru-meaning-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a Burgundy cru, in the premier / grand cru sense?
      choices:
        - { text: "Any négociant brand name", correct: false }
        - { text: "A classified climat with a long record of superior wine", correct: true }
        - { text: "A legal synonym for Bourgogne Rouge", correct: false }
        - { text: "A sparkling-only category", correct: false }
      explanation: |
        A **named, ranked site**. “Cru” on a Beaujolais bottle is a
        different village-level idea — do not mix the two.

  - id: burgundy-monopole-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0102
    review:
