        - { text: "Gamay", correct: true }
        - { text: "César", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        **Gamay** next to Beaujolais; a little **Pinot** as Bourgogne or
        Mâcon rouge. Not a Côte de Nuits Pinot belt.

  - id: burgundy-macon-aoc-001
    type: mcq
