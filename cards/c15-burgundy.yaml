      choices:
        - { text: "Never — only the commune word is legal", correct: false }
        - { text: "When the wine is a single lieu-dit that is not a cru", correct: true }
        - { text: "Only if it is Champagne", correct: false }
        - { text: "Only on a Bordeaux label", correct: false }
      explanation: |
        A **lieu-dit** in smaller type. It is not a premier cru just
        because a plot is named.

