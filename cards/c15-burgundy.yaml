  - id: burgundy-cru-meaning-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a Burgundy cru, in the premier / grand cru sense?
      choices:
        - { text: "Any named lieu-dit, whether classified or not", correct: false }
        - { text: "A classified climat with a long record of superior wine", correct: true }
        - { text: "A domaine ranked independently of its vineyards", correct: false }
        - { text: "A village AOC with no defined vineyard site", correct: false }
      explanation: |
        A **named, ranked site**. “Cru” on a Beaujolais bottle is a
        different village-level idea — do not mix the two.
    fr:
      question: Qu’est-ce qu’un cru bourguignon au sens de premier ou de grand cru ?
      choices:
        - { text: "Tout lieu-dit nommé, classé ou non", correct: false }
        - { text: "Un climat classé pour sa longue réputation de qualité", correct: true }
        - { text: "Un domaine classé indépendamment de ses vignes", correct: false }
        - { text: "Une AOC village sans site viticole délimité", correct: false }
      explanation: |
        C’est un **site nommé et classé**. Sur une bouteille de Beaujolais,
        le mot « cru » renvoie à une autre logique, celle d’une appellation
        de village : il ne faut pas confondre les deux.

