      question: Which Côte d’Or white grand cru is not in the Côte de Beaune?
      choices:
        - { text: "All in the Côte de Nuits, none in Beaune", correct: false }
        - { text: "Musigny Blanc, in Chambolle", correct: true }
        - { text: "Only in Chablis, which is on the Côte d’Or", correct: false }
        - { text: "There are no white grands crus", correct: false }
      explanation: |
        **Corton-Charlemagne** and the **Montrachet** family are Beaune.
        Tiny **Musigny Blanc** is in Chambolle. **Chablis** has its own
        seven GCs — they are not Côte d’Or, so they do not break this
        count.

  - id: burgundy-nuits-villages-ns-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: North to south along the Côte de Nuits prestige strip, which order is right?
      choices:
        - { text: "Nuits-Saint-Georges, then Gevrey, then Chablis", correct: false }
        - { text: "Gevrey-Chambertin, Morey, Chambolle, Vougeot, Vosne, then Nuits-Saint-Georges", correct: true }
        - { text: "Meursault, Puligny, Chassagne only", correct: false }
        - { text: "Pomerol, then Pauillac", correct: false }
      explanation: |
        Do not skip **Morey-Saint-Denis** and **Chambolle-Musigny** — they
        sit between Gevrey and Vougeot. Marsannay and Fixin sit further
        north.

  - id: burgundy-nsg-no-gc-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which famous Côte de Nuits village has premiers crus but no grand cru?
      choices:
        - { text: "Vosne-Romanée", correct: false }
        - { text: "Nuits-Saint-Georges", correct: true }
        - { text: "Gevrey-Chambertin", correct: false }
        - { text: "Chambolle-Musigny", correct: false }
      explanation: |
        **Nuits-Saint-Georges** stops at premier cru (Les Saint-Georges
        is the eternal almost-GC). Vosne has Romanée-Conti; Gevrey has
        Chambertin; Chambolle has Musigny.

  - id: burgundy-beaune-ns-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: North to south, which Côte de Beaune sequence is the usual teaching strip?
      choices:
        - { text: "Gevrey, Vosne, Nuits-Saint-Georges", correct: false }
        - { text: "Aloxe-Corton, Beaune, Pommard, Volnay, Meursault, Puligny, Chassagne", correct: true }
        - { text: "Chablis, then Pomerol", correct: false }
        - { text: "Only Santenay, then Dijon", correct: false }
      explanation: |
        That is the **key-village** ladder, not every AOC. Savigny,
        Saint-Aubin and Santenay sit beside it.

  - id: burgundy-corton-pair-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which hill at the north of the Côte de Beaune holds both a red and a white grand cru?
      choices:
        - { text: "The Clos de Vougeot wall only", correct: false }
        - { text: "Corton — Corton rouge and Corton-Charlemagne", correct: true }
        - { text: "Only the Mâcon acropolis", correct: false }
        - { text: "Mont Blanc", correct: false }
      explanation: |
        **Corton** is the red GC; **Corton-Charlemagne** (and Charlemagne)
        the white. Aloxe-Corton is the village name on many labels.

  - id: burgundy-beaune-colours-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two Côte de Beaune villages are the red specialists, with almost no white?
      choices:
