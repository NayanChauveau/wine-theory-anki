    en:
      question: Is every Bourgogne Rouge grown on a plot that never had a village right?
      choices:
        - { text: "Yes — village-eligible fruit must retain its village name", correct: false }
        - { text: "No — some lots are declassified from a higher AOC", correct: true }
        - { text: "No — but only premier cru fruit may be declassified", correct: false }
        - { text: "Yes — Bourgogne Rouge has its own exclusive parcels", correct: false }
      explanation: |
        Plain or declassified juice. **DRC** and others bottle some
        village leftover as Bourgogne to protect the village label.

  - id: burgundy-declass-why-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why might a grower sell village-eligible wine as plain Bourgogne?
      choices:
        - { text: "The wine completed malolactic fermentation too early", correct: false }
        - { text: "Yields ran too high, or they want to keep the village name for the best lots", correct: true }
        - { text: "The wine spent less than 18 months in oak", correct: false }
        - { text: "The grapes came from vines younger than ten years", correct: false }
      explanation: |
        **Yield over the village cap**, or a quality sort. DRC and others
        have long used a Bourgogne label for young vines or lesser
        barrels.

  - id: burgundy-bourgogne-grapes-001
    type: mcq
