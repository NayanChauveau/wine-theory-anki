      fact_check: pass
      sources: [known-fact]
    en:
      question: Below Mâcon-Villages, what single word is the regional Mâconnais AOC?
      choices:
        - { text: "Bourgogne", correct: false }
        - { text: "Mâcon", correct: true }
        - { text: "Mâconnais", correct: false }
        - { text: "Mâcon Supérieur", correct: false }
      explanation: |
        **Mâcon** (and Mâcon + village / Mâcon-Villages above it).

  - id: burgundy-macon-colours-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0077
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Unlike Mâcon-Villages, may a wine labelled only Mâcon be red?
      choices:
        - { text: "No — both appellations are white only", correct: false }
        - { text: "Yes", correct: true }
        - { text: "No — red requires a village name", correct: false }
        - { text: "Yes — but only as a Pinot Noir grand cru", correct: false }
      explanation: |
        Generic **Mâcon** is red or white. **Mâcon-Villages** is the
        white-only step up — do not mix the two names.

  - id: burgundy-macon-white-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Should a good generic Mâcon blanc taste like a barrel-heavy Meursault?
      choices:
        - { text: "Yes — full-bodied, heavily toasted and low in acidity", correct: false }
        - { text: "No — fresh apple or citrus, with only a possible creamy MLF note", correct: true }
        - { text: "No — lean, neutral and unable to undergo MLF", correct: false }
        - { text: "Yes — rich stone fruit and prominent new oak are required", correct: false }
      explanation: |
        Ripe but still **fresh**. A touch of MLF cream is common; it is
        not a Meursault barrel recipe by default.

  - id: burgundy-macon-red-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which drinking style best suits a typical Mâcon rouge?
      choices:
        - { text: "Full-bodied and tannic, for long ageing", correct: false }
        - { text: "Light, fruity, drink it young", correct: true }
        - { text: "Medium-sweet and best after five years", correct: false }
        - { text: "Heavily oaked and best after a decade", correct: false }
      explanation: |
        **Gamay** (or light Pinot): early drinking. Not a Nuits grand cru.

  - id: burgundy-macon-villages-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Mâcon-Villages usually compare with generic Mâcon blanc?
      choices:
        - { text: "Lighter, less ripe and less defined", correct: false }
        - { text: "A step up in weight and definition", correct: true }
        - { text: "Similar in weight, but always sweeter", correct: false }
        - { text: "More neutral, with higher yields and less body", correct: false }
      explanation: |
        A step up in **weight**. **Mâcon-Villages** cannot be red.
        **Mâcon-Lugny** is the named volume village.

  - id: burgundy-lugny-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Mâcon village name is the volume bestseller on export lists?
      choices:
        - { text: "Fuissé", correct: false }
        - { text: "Lugny", correct: true }
        - { text: "Vergisson", correct: false }
        - { text: "Solutré-Pouilly", correct: false }
      explanation: |
        **Mâcon-Lugny** (often the Cave de Lugny) is the supermarket
        face, not a claim that it outranks Pouilly-Fuissé for quality.

  - id: burgundy-pf-sv-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0082
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Beside Viré-Clessé, which two Mâconnais village AOCs do most lists lead with?
      choices:
        - { text: "Pouilly-Vinzelles and Pouilly-Loché", correct: false }
        - { text: "Pouilly-Fuissé and Saint-Véran", correct: true }
        - { text: "Mâcon-Villages and Mâcon-Lugny", correct: false }
        - { text: "Rully and Montagny", correct: false }
      explanation: |
        **Pouilly-Fuissé** and **Saint-Véran**. **Viré-Clessé** and the
        smaller Pouillys (Vinzelles, Loché) sit beside them — not
        invisible, just not the first two names.

  - id: burgundy-pf-style-001
    type: mcq
