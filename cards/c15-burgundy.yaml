        - { text: "The Côte Chalonnaise", correct: true }
        - { text: "The Médoc", correct: false }
        - { text: "Chablis only", correct: false }
      explanation: |
        North to south: **Rully, Mercurey, Givry, Montagny**. **Bouzeron**
        is the fifth village AOC — do not treat the old “four” as a
        closed legal list.

  - id: burgundy-rully-001
    type: mcq
