        - { text: "Mâcon", correct: true }
        - { text: "Chablis grand cru", correct: false }
        - { text: "Côte de Nuits-Villages", correct: false }
      explanation: |
        **Mâcon** (and Mâcon + village / Mâcon-Villages above it).

  - id: burgundy-macon-colours-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0077
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Unlike Mâcon-Villages, may a wine labelled only Mâcon be red?
      choices:
        - { text: "No — Mâcon is white only", correct: false }
        - { text: "Yes", correct: true }
        - { text: "No — it must be sparkling", correct: false }
        - { text: "No — it must be Sauternes-sweet", correct: false }
      explanation: |
        Generic **Mâcon** is red or white. **Mâcon-Villages** is the
        white-only step up — do not mix the two names.

  - id: burgundy-macon-white-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Should a good generic Mâcon blanc taste like a barrel-heavy Meursault?
      choices:
        - { text: "Yes — 100% new oak and no acid", correct: false }
        - { text: "No — fresh apple or citrus, with only a possible creamy MLF note", correct: true }
        - { text: "Yes — it must be noble-rot sweet", correct: false }
        - { text: "Yes — it is always red cherry and tar", correct: false }
      explanation: |
        Ripe but still **fresh**. A touch of MLF cream is common; it is
        not a Meursault barrel recipe by default.

  - id: burgundy-macon-red-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0079
    review:
