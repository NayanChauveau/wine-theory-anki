cards:
  - id: burgundy-climate-split-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, climate]
    status: reviewed
    source_id: c15-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Burgundy’s climate change from Chablis down to the Mâconnais?
      choices:
        - { text: "Cool maritime throughout, like the Loire estuary", correct: false }
        - { text: "Cool continental in the north, a notch warmer in the south", correct: true }
        - { text: "Cool continental in Chablis, Mediterranean in the Mâconnais", correct: false }
        - { text: "The same cool continental label everywhere", correct: false }
      explanation: |
        **Chablis** is the cold pole. The **Côte d’Or** and especially the
        **Mâconnais** are a step warmer — still continental, not Atlantic.
    fr:
      question: Comment le climat de Bourgogne change-t-il de Chablis au Mâconnais ?
      choices:
        - { text: "Maritime frais partout, comme l’estuaire de la Loire", correct: false }
        - { text: "Continental frais au nord, un cran plus tempéré au sud", correct: true }
        - { text: "Continental frais à Chablis, méditerranéen dans le Mâconnais", correct: false }
        - { text: "La même étiquette continentale fraîche partout", correct: false }
      explanation: |
        **Chablis** est le pôle froid. La **Côte d’Or** et surtout le
        **Mâconnais** sont un cran plus chauds — encore continentaux, pas
        atlantiques.

  - id: burgundy-rain-timing-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, climate]
    status: reviewed
    source_id: c15-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When does rain most often spoil a Burgundy crop?
      choices:
        - { text: "At budburst and again around véraison", correct: false }
        - { text: "At flowering, and again around harvest", correct: true }
        - { text: "At véraison and again after harvest", correct: false }
        - { text: "At budburst and again after harvest", correct: false }
      explanation: |
        A wet **June** hits fruit set (coulure). A wet **September** hits
        pick and feeds rot. **2013** is the named wet, late harvest.
    fr:
      question: Quand la pluie gâche-t-elle le plus souvent une récolte bourguignonne ?
      choices:
        - { text: "Au débourrement, puis de nouveau vers la véraison", correct: false }
        - { text: "À la floraison, puis de nouveau vers la vendange", correct: true }
        - { text: "À la véraison, puis de nouveau après la vendange", correct: false }
        - { text: "Au débourrement, puis de nouveau après la vendange", correct: false }
      explanation: |
        Un **juin** humide touche la nouaison (coulure). Un **septembre**
        humide gâche la vendange et nourrit la pourriture. **2013** est
        le millésime tardif et pluvieux qu’on cite.

  - id: burgundy-pinot-rot-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Tight bunches and thin skins make which Côte grape rot-prone in a wet September?
      choices:
        - { text: "Aligoté", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Gamay", correct: false }
      explanation: |
        Rain sits between **Pinot Noir**’s tight berries; **grey rot**
        follows. Chardonnay can rot too, but it is not the Côte grape
        whose cluster architecture is the textbook wet-September problem.
    fr:
      question: "Grappes serrées et peaux fines : quel cépage de la Côte pourrit facilement un septembre humide ?"
      choices:
        - { text: "Aligoté", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Gamay", correct: false }
      explanation: |
        L’eau reste coincée entre les baies serrées du **Pinot Noir** ;
        la **pourriture grise** suit. Le Chardonnay peut pourrir aussi,
        mais ce n’est pas lui dont l’architecture de grappe est le souci
        classique de la Côte un septembre humide.

  - id: burgundy-chablis-frost-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis, climate]
    status: reviewed
    source_id: c15-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which hazard is Chablis more famous for than the Côte d’Or?
      choices:
        - { text: "Hail", correct: false }
        - { text: "Spring frost", correct: true }
        - { text: "A wet harvest", correct: false }
        - { text: "Coulure at flowering", correct: false }
      explanation: |
        Further **north**, and in a frost pocket. Smudge pots, cables and
        aspersion are the local toolkit. The Côte d’Or still froze in
        **2021** — Chablis is the named specialist, not the only victim.
    fr:
      question: Pour quel aléa Chablis est-il plus connu que la Côte d’Or ?
      choices:
        - { text: "La grêle", correct: false }
        - { text: "Le gel de printemps", correct: true }
        - { text: "Une vendange pluvieuse", correct: false }
        - { text: "La coulure à la fleur", correct: false }
      explanation: |
        Plus au **nord**, et dans une poche de gel. Braseros, câbles et
        aspersion sont la boîte à outils locale. La Côte d’Or a quand
        même gelé en **2021** — Chablis est le spécialiste nommé, pas
        la seule victime.

  - id: burgundy-frost-may-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis, climate]
    status: reviewed
    source_id: c15-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Into which month can a Chablis frost still kill new shoots?
      choices:
        - { text: "March", correct: false }
        - { text: "May", correct: true }
        - { text: "April", correct: false }
        - { text: "June", correct: false }
      explanation: |
        Budburst is early; a late-spring hit is still on the calendar.
        **2021** struck in April; that is why aspersion stays up.
    fr:
      question: Jusqu’à quel mois un gel à Chablis peut-il encore tuer les jeunes pousses ?
      choices:
        - { text: "Mars", correct: false }
        - { text: "Mai", correct: true }
        - { text: "Avril", correct: false }
        - { text: "Juin", correct: false }
      explanation: |
        Le débourrement est précoce ; un coup de fin de printemps reste
        possible. **2021** a frappé en avril ; voilà pourquoi l’aspersion
        reste en place.

  - id: burgundy-hail-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, climate]
    status: reviewed
    source_id: c15-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides frost, which summer shock regularly shreds Côte d’Or crops?
      choices:
        - { text: "A long drought", correct: false }
        - { text: "Hail", correct: true }
        - { text: "Sunburn on exposed bunches", correct: false }
        - { text: "Persistent rain without ice", correct: false }
      explanation: |
        Storms track along the Côte. **2012–2014** battered Volnay and
        Meursault; nets and anti-hail cannon are now part of the landscape.
    fr:
      question: Outre le gel, quel choc d’été déchire régulièrement les récoltes de Côte d’Or ?
      choices:
        - { text: "Une longue sécheresse", correct: false }
        - { text: "La grêle", correct: true }
        - { text: "L’échaudage des grappes exposées", correct: false }
        - { text: "Une pluie persistante, sans glace", correct: false }
      explanation: |
        Les orages suivent la Côte. **2012–2014** ont tapé Volnay et
        Meursault ; filets et canons anti-grêle font désormais partie
        du paysage.

  - id: burgundy-village-sites-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where are vineyards classified as Bourgogne AOC, and many village-level sites, typically located on the Côte d’Or slope?
      choices:
        - { text: "On the upper slope and crest", correct: false }
        - { text: "On the flat or at the foot of the slope", correct: true }
        - { text: "Mid-slope, with the premiers crus", correct: false }
        - { text: "On the steepest upper mid-slope", correct: false }
      explanation: |
        The **plain** and the **slope-foot** are deeper, colder and more
        vigorous. Some village climats do sit mid-slope — “usually”, not
        “never mid-slope”.
    fr:
      question: Où se trouvent habituellement, sur le relief de la Côte d’Or, les vignes classées en AOC Bourgogne et beaucoup de parcelles de niveau village ?
      choices:
        - { text: "Sur le haut du coteau et la crête", correct: false }
        - { text: "À plat ou au pied du coteau", correct: true }
        - { text: "À mi-coteau, avec les premiers crus", correct: false }
        - { text: "Sur la partie la plus raide du haut de mi-coteau", correct: false }
      explanation: |
        La **plaine** et le **pied de coteau** sont plus profonds, plus
        froids et plus vigoureux. Certains climats de village sont à
        mi-pente — « d’habitude », pas « jamais à mi-coteau ».

  - id: burgundy-cru-midslope-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: On a Côte d’Or hillside, which band holds most of the classed climats?
      choices:
        - { text: "The valley floor", correct: false }
        - { text: "Mid-slope", correct: true }
        - { text: "The high plateau", correct: false }
        - { text: "The lower plain and slope foot", correct: false }
      explanation: |
        Best drainage and sun sit in that band. **Clos de Vougeot** still
        runs down into the village — “often”, not a legal altitude line.
    fr:
      question: Sur un coteau de Côte d’Or, quelle bande porte la plupart des climats classés ?
      choices:
        - { text: "Le fond de vallée", correct: false }
        - { text: "Le mi-coteau", correct: true }
        - { text: "Le haut plateau", correct: false }
        - { text: "La plaine basse et le pied du coteau", correct: false }
      explanation: |
        Meilleur drainage et meilleur soleil dans cette bande. Le **Clos
        de Vougeot** descend encore jusqu’au village — « souvent », pas
        une ligne d’altitude légale.

  - id: burgundy-midslope-frost-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, climate]
    status: reviewed
    source_id: c15-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is a mid-slope climat safer than the valley floor on a frost night?
      choices:
        - { text: "Cold air rises, so the valley stays warmer", correct: false }
        - { text: "Cold air drains downhill, off the mid-slope", correct: true }
        - { text: "The mid-slope holds more water, which blocks frost", correct: false }
        - { text: "The valley floor is always windier at night", correct: false }
      explanation: |
        **Katabatic** drainage: frost pools on the flats (and in hollows
        like parts of Chablis). Mid-slope is not frost-proof — just safer.
    fr:
      question: Pourquoi un climat de mi-coteau est-il plus à l’abri du gel qu’un fond de vallée ?
      choices:
        - { text: "L’air froid monte, donc la vallée reste plus chaude", correct: false }
        - { text: "L’air froid s’écoule vers le bas, hors du mi-coteau", correct: true }
        - { text: "Le mi-coteau retient plus d’eau, ce qui bloque le gel", correct: false }
        - { text: "Le fond de vallée est toujours plus venté la nuit", correct: false }
      explanation: |
        Drainage **katabatique** : le gel s’accumule à plat (et dans des
        creux, comme certains coins de Chablis). Le mi-coteau n’est pas
        à l’abri — seulement plus sûr.

  - id: burgundy-aspect-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which aspect do the Côte d’Or’s best climats usually take?
      choices:
        - { text: "Due north", correct: false }
        - { text: "South or east", correct: true }
        - { text: "Due west", correct: false }
        - { text: "North-west, into the Morvan", correct: false }
      explanation: |
        The Côte looks toward the **Saône**: roughly **east to
        south-east**. Chablis grands crus are the named exception — they
        face **south-west** over the Serein.
    fr:
      question: Quelle exposition prennent d’habitude les meilleurs climats de Côte d’Or ?
      choices:
        - { text: "Plein nord", correct: false }
        - { text: "Sud ou est", correct: true }
        - { text: "Plein ouest", correct: false }
        - { text: "Nord-ouest, vers le Morvan", correct: false }
      explanation: |
        La Côte regarde vers la **Saône** : grosso modo **est à
        sud-est**. Les grands crus de Chablis sont l’exception nommée —
        ils regardent le **sud-ouest**, au-dessus du Serein.

  - id: burgundy-westerlies-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, climate]
    status: reviewed
    source_id: c15-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides extra sun, what does an east-facing Côte d’Or slope keep off the vines?
      choices:
        - { text: "Cold north-easterly winds", correct: false }
        - { text: "The prevailing westerly winds", correct: true }
        - { text: "Warm southerly winds", correct: false }
        - { text: "Cool air draining toward the Saône", correct: false }
      explanation: |
        Hills to the west (and the **Morvan**) take the wet Atlantic
        punch. The Côte sits in a **lee**. It still rains — just less than
        a west-facing hill would see.
    fr:
      question: Outre un meilleur ensoleillement, de quoi l’orientation vers l’est protège-t-elle les vignes de la Côte d’Or ?
      choices:
        - { text: "Des vents froids de nord-est", correct: false }
        - { text: "Des vents dominants d’ouest", correct: true }
        - { text: "Des vents chauds du sud", correct: false }
        - { text: "De l’air frais qui s’écoule vers la Saône", correct: false }
      explanation: |
        Les hauteurs situées à l’ouest, dont le **Morvan**, encaissent les
        perturbations atlantiques. La Côte se trouve **sous le vent** : il y
        pleut toujours, mais moins que sur un versant exposé à l’ouest.

  - id: burgundy-soils-varied-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Is there one “Burgundy soil” you can name for the whole region?
      choices:
        - { text: "Yes — limestone has the same composition everywhere", correct: false }
        - { text: "No — the soils change over very short distances", correct: true }
        - { text: "Yes — marl is uniform from Chablis to the Mâconnais", correct: false }
        - { text: "No — but each district has one completely uniform soil", correct: false }
      explanation: |
        Limestone, marl, clay and scree in a **mosaic**. Chablis Kimmeridge
        is not Meursault’s limestone, and neither is a Gevrey combe.
    fr:
      question: Peut-on définir un seul « sol bourguignon » valable pour toute la région ?
      choices:
        - { text: "Oui : le calcaire a partout la même composition", correct: false }
        - { text: "Non : les sols changent sur de très courtes distances", correct: true }
        - { text: "Oui : les mêmes marnes s’étendent de Chablis au Mâconnais", correct: false }
        - { text: "Non : mais chaque sous-région possède un sol parfaitement uniforme", correct: false }
      explanation: |
        Calcaires, marnes, argiles et éboulis forment une **mosaïque**. Les
        marnes kimméridgiennes de Chablis ne sont ni les calcaires de
        Meursault, ni les sols d’une combe de Gevrey.

  - id: burgundy-faults-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can soil change over a few dozen metres along the Côte?
      choices:
        - { text: "One uniform limestone bed lies at every elevation", correct: false }
        - { text: "Many geological faults plus long erosion", correct: true }
        - { text: "River deposits cover the whole slope evenly", correct: false }
        - { text: "Aspect changes the bedrock from limestone to granite", correct: false }
      explanation: |
        The Côte is a **fault scarp**. Combes cut through it. That is why
        two walls of Clos de Vougeot do not drink the same.
    fr:
      question: Pourquoi le sol peut-il changer en quelques dizaines de mètres le long de la Côte ?
      choices:
        - { text: "Une même couche calcaire affleure à toutes les altitudes", correct: false }
        - { text: "De nombreuses failles, puis une longue érosion", correct: true }
        - { text: "Des dépôts fluviaux recouvrent uniformément tout le versant", correct: false }
        - { text: "L’exposition transforme le substrat calcaire en granite", correct: false }
      explanation: |
        La Côte est un **escarpement de faille**, entaillé par des combes.
        Voilà pourquoi deux parcelles du Clos de Vougeot ne donnent pas
        nécessairement le même vin.

  - id: burgundy-soil-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can two neighbouring Gevrey walls taste different even with the same grape and grower?
      choices:
        - { text: "Each wall must use a different Pinot clone", correct: false }
        - { text: "Changes in soil", correct: true }
        - { text: "Each wall has a different legal harvest date", correct: false }
        - { text: "Neighbouring walls always receive opposite exposures", correct: false }
      explanation: |
        **Soil** is the story on the label. Clone, vintage and grower move
        the wine as much — do not treat a clay/limestone line as destiny.
    fr:
      question: Pourquoi deux parcelles voisines de Gevrey peuvent-elles donner des vins différents avec le même cépage et le même producteur ?
      choices:
        - { text: "Chaque parcelle doit employer un clone différent de Pinot Noir", correct: false }
        - { text: "Les variations de sol", correct: true }
        - { text: "Chaque parcelle possède une date légale de vendange différente", correct: false }
        - { text: "Deux parcelles voisines ont toujours des expositions opposées", correct: false }
      explanation: |
        Le **sol** est au cœur du découpage parcellaire. Clone, millésime et
        producteur influencent aussi le vin : la limite entre argile et
        calcaire ne détermine pas tout à elle seule.

  - id: burgundy-hillside-soil-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do hillside soils on the Côte usually differ from the plain?
      choices:
        - { text: "They are deeper and wetter than the valley floor", correct: false }
        - { text: "They are shallower and better drained", correct: true }
        - { text: "They are deeper but equally well drained", correct: false }
        - { text: "They are shallower and retain more standing water", correct: false }
      explanation: |
        **Thin, drained** slopes. The plain below is the opposite: deep
        and fertile, hence regional Bourgogne rather than a grand cru.
    fr:
      question: Comment les sols des coteaux de la Côte diffèrent-ils généralement de ceux de la plaine ?
      choices:
        - { text: "Ils sont plus profonds et plus humides que ceux du fond de vallée", correct: false }
        - { text: "Ils sont moins profonds et mieux drainés", correct: true }
        - { text: "Ils sont plus profonds, mais tout aussi bien drainés", correct: false }
        - { text: "Ils sont moins profonds et retiennent davantage l’eau stagnante", correct: false }
      explanation: |
        Les sols de pente sont **minces et drainants**. En contrebas, ils
        deviennent profonds et fertiles : un profil plus fréquent pour une
        appellation régionale que pour un grand cru.

  - id: burgundy-plain-soil-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What are soils like on the flat land below the Côte?
      choices:
        - { text: "Shallow, stony and low in fertility", correct: false }
        - { text: "Deeper and more fertile", correct: true }
        - { text: "Thin limestone with the fastest drainage", correct: false }
        - { text: "Deep but markedly less fertile than the slope", correct: false }
      explanation: |
        **Deep, rich, wetter** — vigour and dilution. That is Bourgogne
        AOC country, not Musigny.
    fr:
      question: À quoi ressemblent les sols des terrains plats situés au pied de la Côte ?
      choices:
        - { text: "Peu profonds, caillouteux et peu fertiles", correct: false }
        - { text: "Plus profonds et plus fertiles", correct: true }
        - { text: "Minces, calcaires et très rapidement drainés", correct: false }
        - { text: "Profonds, mais nettement moins fertiles que ceux du coteau", correct: false }
      explanation: |
        Ils sont **profonds, riches et plus humides**, ce qui favorise la
        vigueur et peut diluer le fruit. C’est plutôt le domaine de
        Bourgogne AOC que celui de Musigny.

  - id: burgundy-four-grapes-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Alongside Pinot Noir and Chardonnay, which two grapes account for most of Burgundy’s remaining plantings?
      choices:
        - { text: "Sauvignon Blanc and César", correct: false }
        - { text: "Aligoté and Gamay", correct: true }
        - { text: "Pinot Blanc and Pinot Gris", correct: false }
        - { text: "Melon and Sacy", correct: false }
      explanation: |
        The workhorses. **Saint-Bris** Sauvignon and **Irancy** César sit
        outside that four — do not say the list is legally closed.
    fr:
      question: Avec le Pinot Noir et le Chardonnay, quels deux cépages représentent l’essentiel du vignoble bourguignon restant ?
      choices:
        - { text: "Sauvignon Blanc et César", correct: false }
        - { text: "Aligoté et Gamay", correct: true }
        - { text: "Pinot Blanc et Pinot Gris", correct: false }
        - { text: "Melon et Sacy", correct: false }
      explanation: |
        **Aligoté et Gamay** complètent les quatre cépages principaux.
        Le Sauvignon de **Saint-Bris** et le César d’**Irancy** existent
        aussi : la liste n’est donc pas juridiquement fermée.

  - id: burgundy-pinot-share-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Is Pinot Noir the majority of Burgundy’s hectares?
      choices:
        - { text: "Yes — it accounts for more than half", correct: false }
        - { text: "No — more than a third, not the majority", correct: true }
        - { text: "No — it accounts for less than a tenth", correct: false }
        - { text: "Yes — it narrowly exceeds Chardonnay", correct: false }
      explanation: |
        **More than a third**, not the majority. **Chardonnay** (Chablis
        + Mâconnais) often edges it on hectares. Do not nail a single
        percentage that moves with each census.
    fr:
      question: Le Pinot Noir occupe-t-il la majorité de la surface viticole bourguignonne ?
      choices:
        - { text: "Oui : il en représente plus de la moitié", correct: false }
        - { text: "Non : plus d’un tiers, mais pas la majorité", correct: true }
        - { text: "Non : il en représente moins d’un dixième", correct: false }
        - { text: "Oui : il dépasse légèrement le Chardonnay", correct: false }
      explanation: |
        Le Pinot Noir représente **plus d’un tiers**, mais pas la majorité.
        Grâce à Chablis et au Mâconnais, le **Chardonnay** le devance
        généralement. Le chiffre exact varie selon les recensements.

  - id: burgundy-pinot-where-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which part of Burgundy forms its main prestige belt for Pinot Noir?
      choices:
        - { text: "Chablis and the Grand Auxerrois", correct: false }
        - { text: "The Côte d’Or", correct: true }
        - { text: "The Mâconnais", correct: false }
        - { text: "The Côte Chalonnaise alone", correct: false }
      explanation: |
        **Côte de Nuits** and the red Côte de Beaune are the prestige
        belt. Chalonnaise and Irancy plant it too; Chablis barely does.
    fr:
      question: Quelle partie de la Bourgogne constitue le principal secteur de prestige du Pinot Noir ?
      choices:
        - { text: "Chablis et le Grand Auxerrois", correct: false }
        - { text: "La Côte d’Or", correct: true }
        - { text: "Le Mâconnais", correct: false }
        - { text: "La seule Côte Chalonnaise", correct: false }
      explanation: |
        La **Côte de Nuits** et les secteurs rouges de la Côte de Beaune
        forment ce cœur prestigieux. La Côte Chalonnaise et Irancy cultivent
        aussi le Pinot Noir ; Chablis, très peu.

  - id: burgundy-pinot-fruit-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fruit does young Côte d’Or Pinot usually show?
      choices:
        - { text: "Blackcurrant and blackberry", correct: false }
        - { text: "Red fruit", correct: true }
        - { text: "Peach and apricot", correct: false }
        - { text: "Citrus and green apple", correct: false }
      explanation: |
        **Strawberry / cherry / raspberry** come first. With age, the wine
        can develop earth, mushroom, sous-bois and sometimes game. A hot
        year (2018, 2020) can look darker, but the classic profile begins
        with red fruit.
    fr:
      question: Quels arômes fruités trouve-t-on généralement dans un jeune Pinot Noir de la Côte d’Or ?
      choices:
        - { text: "Cassis et mûre", correct: false }
        - { text: "Fruits rouges", correct: true }
        - { text: "Pêche et abricot", correct: false }
        - { text: "Agrumes et pomme verte", correct: false }
      explanation: |
        **Fraise, cerise et framboise** dominent dans la jeunesse. Avec
        l’évolution apparaissent des notes de terre, de champignon, de
        sous-bois et parfois de gibier. Un millésime chaud comme 2018 ou
        2020 peut donner un fruit plus noir, mais le profil classique
        commence par les fruits rouges.

  - id: burgundy-pinot-structure-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What acidity and tannin levels are typical of classic red Burgundy?
      choices:
        - { text: "Low acidity and high tannin", correct: false }
        - { text: "High acidity and low to medium tannin", correct: true }
        - { text: "Medium acidity and high tannin", correct: false }
        - { text: "Low acidity and low tannin", correct: false }
      explanation: |
        **High acid, modest tannin** — Pinot is not a Médoc. Whole-bunch
        and a long maceration can push the tannin up; that is a style
        choice, not the regional default.
    fr:
      question: Quels niveaux d’acidité et de tanins caractérisent un Bourgogne rouge classique ?
      choices:
        - { text: "Acidité faible et tanins élevés", correct: false }
        - { text: "Acidité élevée et tanins faibles à moyens", correct: true }
        - { text: "Acidité moyenne et tanins élevés", correct: false }
        - { text: "Acidité faible et tanins faibles", correct: false }
      explanation: |
        **Acidité élevée, tanins modérés** : le Pinot Noir n’est pas un
        Médoc. La vendange entière et une longue macération peuvent accroître
        les tanins, mais il s’agit d’un choix de style.

  - id: burgundy-whole-bunch-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which ferment choice has become more common again for Côte d’Or Pinot?
      choices:
        - { text: "Complete destemming for every cuvée", correct: false }
        - { text: "Keeping some or all of the bunches whole", correct: true }
        - { text: "Shortening maceration to a few hours", correct: false }
        - { text: "Fermenting only clarified free-run juice", correct: false }
      explanation: |
        **Whole-bunch / vendange entière**. **Dujac** and **DRC** never
        really left it; many newer domaines have come back to stems for
        perfume and a different tannin.
    fr:
      question: Quel choix de vinification est redevenu plus courant pour le Pinot Noir de la Côte d’Or ?
      choices:
        - { text: "Érafler intégralement chaque cuvée", correct: false }
        - { text: "Conserver une partie ou la totalité des grappes entières", correct: true }
        - { text: "Réduire la macération à quelques heures", correct: false }
        - { text: "Fermenter uniquement le jus de goutte clarifié", correct: false }
      explanation: |
        La **vendange entière** n’a jamais vraiment disparu chez **Dujac**
        ou à la **DRC**. De nombreux domaines y reviennent pour ses arômes
        et la structure tannique particulière apportée par les rafles.

  - id: burgundy-pinot-elevage-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How long do the serious Côte d’Or Pinots usually stay in barrel?
      choices:
        - { text: "About 6 to 9 months", correct: false }
        - { text: "About 16 to 18 months", correct: true }
        - { text: "About 30 to 36 months", correct: false }
        - { text: "About 3 to 4 months", correct: false }
      explanation: |
        **16–18 months** is the usual village / premier-cru clock. Some
        grands crus sit longer; a few domaines bottle sooner. Not a legal
        minimum.
    fr:
      question: Combien de temps les Pinot Noir sérieux de la Côte d’Or restent-ils généralement en fût ?
      choices:
        - { text: "Environ 6 à 9 mois", correct: false }
        - { text: "Environ 16 à 18 mois", correct: true }
        - { text: "Environ 30 à 36 mois", correct: false }
        - { text: "Environ 3 à 4 mois", correct: false }
      explanation: |
        **16 à 18 mois** est une durée courante pour les villages et les
        premiers crus. Certains grands crus restent plus longtemps en fût ;
        quelques domaines embouteillent plus tôt. Ce n’est pas un minimum légal.

  - id: burgundy-pinot-oak-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How much new oak does Côte d’Or Pinot typically see?
      choices:
        - { text: "A legally fixed 100% for every cru", correct: false }
        - { text: "Some new oak, the share set by the domaine — not a fixed recipe", correct: true }
        - { text: "A legally fixed maximum of 10%", correct: false }
        - { text: "No new oak for village wine, by AOC rule", correct: false }
      explanation: |
        Barrels, yes; **100% new** is a house choice (or a 1990s habit),
        not the regional default. Village wines often see little or none.
    fr:
      question: Quelle proportion de bois neuf reçoit généralement un Pinot Noir de la Côte d’Or ?
      choices:
        - { text: "Une proportion légale de 100 % pour chaque cru", correct: false }
        - { text: "Une part variable, décidée par le domaine", correct: true }
        - { text: "Un maximum légal fixé à 10 %", correct: false }
        - { text: "Aucun bois neuf pour un village, selon l’AOC", correct: false }
      explanation: |
        L’élevage en fût est courant, mais **100 % de bois neuf** relève du
        style d’un domaine, pas d’une norme régionale. Les vins de village
        en reçoivent souvent peu, voire pas du tout.

  - id: burgundy-chard-share-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape occupies more than half of Burgundy’s vineyard?
      choices:
        - { text: "Aligoté", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Gamay", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
      explanation: |
        **Chablis + Mâconnais + Côte de Beaune** put Chardonnay at
        roughly **57%** of current vineyard area. The exact share moves
        with each census.
    fr:
      question: Quel cépage occupe plus de la moitié du vignoble bourguignon ?
      choices:
        - { text: "Aligoté", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Gamay", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
      explanation: |
        Avec Chablis, le Mâconnais et la Côte de Beaune, le **Chardonnay**
        représente environ **57 %** de la surface actuelle. La proportion
        exacte évolue à chaque recensement.

  - id: burgundy-chard-gradient-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Chardonnay change from Chablis through the Côte d’Or to the Mâconnais?
      choices:
        - { text: "Riper in Chablis, leaner through the Côte and Mâconnais", correct: false }
        - { text: "Steely and high-acid in the north, more complex in the Côte d’Or, riper and fuller in Mâcon", correct: true }
        - { text: "High-acid throughout, with no meaningful north–south change", correct: false }
        - { text: "Lightest in the Côte d’Or and fullest in Chablis", correct: false }
      explanation: |
        A **north–south ripeness** line. Meursault is not Petit Chablis;
        a rich Pouilly-Fuissé is not a razor Chablis either.
    fr:
      question: Comment le style du Chardonnay évolue-t-il de Chablis au Mâconnais en passant par la Côte d’Or ?
      choices:
        - { text: "Plus mûr à Chablis, puis plus léger dans la Côte et le Mâconnais", correct: false }
        - { text: "Tendu et acide au nord, plus complexe dans la Côte, plus mûr et ample à Mâcon", correct: true }
        - { text: "Très acide partout, sans évolution notable du nord au sud", correct: false }
        - { text: "Plus léger dans la Côte d’Or et plus ample à Chablis", correct: false }
      explanation: |
        La maturité augmente globalement du **nord au sud**. Meursault ne
        ressemble pas à Petit Chablis, pas plus qu’un riche Pouilly-Fuissé
        ne ressemble à un Chablis très tranchant.

  - id: burgundy-chard-model-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which region established the barrel-fermented, lees-aged model for serious Chardonnay?
      choices:
        - { text: "Champagne", correct: false }
        - { text: "Burgundy", correct: true }
        - { text: "California", correct: false }
        - { text: "The Jura", correct: false }
      explanation: |
        The **Côte de Beaune** recipe (barrel ferment, MLF, lees) is what
        producers in California and Australia later emulated. Burgundy
        did not invent the variety — it set the prestige template.
    fr:
      question: Quelle région a établi le modèle de Chardonnay ambitieux fermenté en fût et élevé sur lies ?
      choices:
        - { text: "La Champagne", correct: false }
        - { text: "La Bourgogne", correct: true }
        - { text: "La Californie", correct: false }
        - { text: "Le Jura", correct: false }
      explanation: |
        Le modèle de la **Côte de Beaune** — fermentation en fût,
        fermentation malolactique et élevage sur lies — a ensuite été
        repris notamment en Californie et en Australie.

  - id: burgundy-chard-four-tech-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which four cellar practices define the classic Côte de Beaune Chardonnay style?
      choices:
        - { text: "Steel ferment, early bottling, no MLF and no lees contact", correct: false }
        - { text: "Barrel ferment, barrel ageing, malolactic and lees stirring", correct: true }
        - { text: "Barrel ferment, no MLF, filtration and immediate bottling", correct: false }
        - { text: "Steel ferment, barrel ageing, blocked MLF and no lees stirring", correct: false }
      explanation: |
        The four. Élevage is often **12–18 months** on the Côte d’Or, not
        a locked 6–9. Mâcon and village wines can be shorter.
    fr:
      question: Quelles quatre pratiques de cave définissent le style classique d’un Chardonnay de la Côte de Beaune ?
      choices:
        - { text: "Fermentation en cuve, mise précoce, sans malo ni lies", correct: false }
        - { text: "Fermentation et élevage en fût, malo et bâtonnage", correct: true }
        - { text: "Fermentation en fût, sans malo, puis filtration et mise immédiate", correct: false }
        - { text: "Fermentation en cuve, élevage en fût, malo bloquée et sans bâtonnage", correct: false }
      explanation: |
        Sur la Côte d’Or, l’élevage dure souvent **12 à 18 mois**, et non
        systématiquement 6 à 9 mois. Il peut être plus court à Mâcon ou
        pour certains vins de village.

  - id: burgundy-chard-oak-debate-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What oak question do white-Burgundy domaines still argue about?
      choices:
        - { text: "Whether every wine should avoid new oak completely", correct: false }
        - { text: "How much new wood, and how heavy the toast", correct: true }
        - { text: "Whether every premier cru needs the same toast level", correct: false }
        - { text: "Whether only grands crus may ferment in barrel", correct: false }
      explanation: |
        **Share of new barrels** and **toast**. Coche and Roulot do not
        make the same call as a 1990s “butter bomb”.
    fr:
      question: Quelle question liée au bois continue de diviser les domaines de Bourgogne blanc ?
      choices:
        - { text: "Faut-il bannir totalement le bois neuf pour chaque vin ?", correct: false }
        - { text: "Quelle proportion de bois neuf et quelle intensité de chauffe ?", correct: true }
        - { text: "Tous les premiers crus doivent-ils recevoir la même chauffe ?", correct: false }
        - { text: "Seuls les grands crus peuvent-ils fermenter en fût ?", correct: false }
      explanation: |
        La **proportion de fûts neufs** et leur **chauffe** façonnent le
        style. Des domaines comme Coche-Dury ou Roulot ne font pas les mêmes
        choix que les blancs très boisés des années 1990.

  - id: burgundy-chard-age-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How long can a top white Burgundy (Montrachet, Corton-Charlemagne) still improve?
      choices:
        - { text: "One to two years at most", correct: false }
        - { text: "Ten years or more", correct: true }
        - { text: "Three to five years at most", correct: false }
        - { text: "Six to nine months at most", correct: false }
      explanation: |
        **A decade-plus** for the grands crus when the cork holds.
        Village Mâcon is not on that clock.
    fr:
      question: Combien de temps un grand Bourgogne blanc, comme Montrachet ou Corton-Charlemagne, peut-il continuer à progresser ?
      choices:
        - { text: "Un à deux ans au maximum", correct: false }
        - { text: "Dix ans ou davantage", correct: true }
        - { text: "Trois à cinq ans au maximum", correct: false }
        - { text: "Six à neuf mois au maximum", correct: false }
      explanation: |
        Les grands crus peuvent évoluer favorablement pendant **plus de dix
        ans**, si le bouchon tient. Un Mâcon-Villages n’a pas le même horizon.

  - id: burgundy-premox-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fault showed up in many late-1990s and 2000s white Burgundies years too soon?
      choices:
        - { text: "Persistent reduction", correct: false }
        - { text: "Premature oxidation (premox)", correct: true }
        - { text: "Excessive volatile acidity", correct: false }
        - { text: "Unwanted malolactic fermentation", correct: false }
      explanation: |
        Bottles that should have been tight at eight years were already
        **nutty and tired**. The wave is dated to those vintages — not a
        floating “15 years ago”.
    fr:
      question: Quel défaut a touché trop tôt de nombreux Bourgognes blancs de la fin des années 1990 et des années 2000 ?
      choices:
        - { text: "Une réduction persistante", correct: false }
        - { text: "L’oxydation prématurée (premox)", correct: true }
        - { text: "Une acidité volatile excessive", correct: false }
        - { text: "Une fermentation malolactique indésirable", correct: false }
      explanation: |
        Des bouteilles qui auraient dû rester fraîches à huit ans étaient
        déjà **éventées, avec des notes de noix**. Le phénomène concerne
        surtout ces millésimes précis, plutôt qu’une vague période récente.

  - id: burgundy-premox-cause-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the agreed single cause of premature oxidation in 1990s–2000s white Burgundy?
      choices:
        - { text: "Corks alone", correct: false }
        - { text: "There is no agreed single cause", correct: true }
        - { text: "Low sulphur dioxide alone", correct: false }
        - { text: "Bâtonnage alone", correct: false }
      explanation: |
        Corks, low **SO2**, ripe years, bâtonnage, toast — theories, not
        a closed verdict. Do not pick one scapegoat as fact.
    fr:
      question: Quelle cause unique de l’oxydation prématurée des Bourgognes blancs des années 1990–2000 fait consensus ?
      choices:
        - { text: "Les bouchons seuls", correct: false }
        - { text: "Aucune cause unique ne fait consensus", correct: true }
        - { text: "Les faibles doses de dioxyde de soufre seules", correct: false }
        - { text: "Le bâtonnage seul", correct: false }
      explanation: |
        Bouchons, faible **SO₂**, millésimes mûrs, bâtonnage ou chauffe des
        fûts ont tous été avancés. Aucun de ces facteurs ne constitue à lui
        seul une explication définitivement établie.

  - id: burgundy-aligote-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What style does everyday Aligoté usually show?
      choices:
        - { text: "Full-bodied, low-acid and strongly oaked", correct: false }
        - { text: "A pale, fairly neutral white with high acidity", correct: true }
        - { text: "Aromatic, off-dry and medium-acid", correct: false }
        - { text: "Rich, tropical and low-acid", correct: false }
      explanation: |
        **High acid, modest aroma** — the Kir grape. That is the cheap
        default, not **Bouzeron**.
    fr:
      question: Quel style présente généralement un Aligoté courant ?
      choices:
        - { text: "Corsé, peu acide et fortement boisé", correct: false }
        - { text: "Pâle, assez neutre et doté d’une acidité élevée", correct: true }
        - { text: "Aromatique, demi-sec et d’acidité moyenne", correct: false }
        - { text: "Riche, tropical et peu acide", correct: false }
      explanation: |
        **Acidité élevée et arômes discrets** : c’est le cépage du kir.
        Ce profil décrit l’entrée de gamme, pas les meilleurs exemples de
        **Bouzeron**.

  - id: burgundy-aligote-quality-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When can Aligoté produce a more concentrated and expressive wine?
      choices:
        - { text: "When it is cropped heavily on the coolest plain", correct: false }
        - { text: "On sites where it fully ripens, such as Bouzeron", correct: true }
        - { text: "When it is picked early to preserve maximum acidity", correct: false }
        - { text: "When new oak is used to compensate for an unripe site", correct: false }
      explanation: |
        **Bouzeron** is the Aligoté village AOC. Old-vine bottlings from
        Ponsot and others also sit well above Kir.
    fr:
      question: Dans quelles conditions l’Aligoté peut-il donner un vin plus concentré et expressif ?
      choices:
        - { text: "Avec de hauts rendements sur les plaines les plus fraîches", correct: false }
        - { text: "Sur des sites où il mûrit pleinement, comme à Bouzeron", correct: true }
        - { text: "Avec une vendange précoce pour préserver un maximum d’acidité", correct: false }
        - { text: "Avec du bois neuf pour compenser un site insuffisamment mûr", correct: false }
      explanation: |
        **Bouzeron** est l’appellation village consacrée à l’Aligoté. Des
        cuvées de vieilles vignes, chez Ponsot entre autres, dépassent aussi
        largement le simple profil du kir.

  - id: burgundy-aligote-sites-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is Aligoté usually planted on less-favoured sites rather than the Côte’s prime mid-slopes?
      choices:
        - { text: "It needs more heat than Pinot Noir and Chardonnay", correct: false }
        - { text: "The best sites are already planted to Chardonnay and Pinot Noir", correct: true }
        - { text: "It performs best on the deepest, most fertile valley soils", correct: false }
        - { text: "Its yields are too low for the classified slopes", correct: false }
      explanation: |
        Growers put **Chardonnay and Pinot** on the mid-slope. Aligoté
        inherited the leftovers — except where a village (Bouzeron) or a
        stubborn domaine kept it.
    fr:
      question: Pourquoi l’Aligoté est-il généralement planté sur des sites moins favorisés que les meilleurs mi-coteaux de la Côte ?
      choices:
        - { text: "Il exige davantage de chaleur que le Pinot Noir et le Chardonnay", correct: false }
        - { text: "Les meilleurs sites sont déjà consacrés au Chardonnay et au Pinot Noir", correct: true }
        - { text: "Il réussit surtout sur les sols de vallée les plus profonds et fertiles", correct: false }
        - { text: "Ses rendements sont trop faibles pour les coteaux classés", correct: false }
      explanation: |
        Les producteurs réservent les mi-coteaux au **Chardonnay et au
        Pinot Noir**. L’Aligoté a hérité des autres sites, sauf là où une
        appellation comme Bouzeron ou un domaine déterminé l’a conservé.

  - id: burgundy-gamay-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is Gamay like in Burgundy proper (not a Beaujolais cru)?
      choices:
        - { text: "A structured, high-tannin red for long ageing", correct: false }
        - { text: "An early-drinking red with ripe berry fruit and low tannin", correct: true }
        - { text: "A pale, high-acid red with little fruit", correct: false }
        - { text: "A full-bodied red dominated by new oak", correct: false }
      explanation: |
        **Passetoutgrains** and Mâcon rouge: drink soon. Do not confuse
        that with **Moulin-à-Vent**.
    fr:
      question: Quel style le Gamay donne-t-il généralement en Bourgogne proprement dite, hors crus du Beaujolais ?
      choices:
        - { text: "Un rouge structuré et très tannique destiné à une longue garde", correct: false }
        - { text: "Un rouge à boire jeune, fruité et peu tannique", correct: true }
        - { text: "Un rouge pâle, très acide et peu fruité", correct: false }
        - { text: "Un rouge corsé dominé par le bois neuf", correct: false }
      explanation: |
        **Bourgogne Passetoutgrains** et Mâcon rouge sont généralement à
        boire jeunes. Il ne faut pas leur appliquer le profil d’un cru du
        Beaujolais structuré comme **Moulin-à-Vent**.

  - id: burgundy-gamay-aoc-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How high up the Burgundy ladder may Gamay go?
      choices:
        - { text: "Up to village AOC throughout the Côte d’Or", correct: false }
        - { text: "Some regional AOCs only — not village Côte d’Or or above", correct: true }
        - { text: "Up to premier cru in the Côte Chalonnaise", correct: false }
        - { text: "Only generic Bourgogne, never Mâcon", correct: false }
      explanation: |
        **Bourgogne Gamay**, **Bourgogne Passetoutgrains**, some Mâcon
        reds. Gevrey village and the grands crus are Pinot.
    fr:
      question: Jusqu’à quel niveau de la hiérarchie bourguignonne le Gamay peut-il accéder ?
      choices:
        - { text: "Jusqu’aux AOC villages partout en Côte d’Or", correct: false }
        - { text: "À certaines AOC régionales, mais pas aux villages de la Côte d’Or", correct: true }
        - { text: "Jusqu’aux premiers crus de la Côte Chalonnaise", correct: false }
        - { text: "Au seul Bourgogne générique, jamais à Mâcon", correct: false }
      explanation: |
        On le trouve dans **Bourgogne Gamay**, **Bourgogne Passetoutgrains**
        et certains Mâcon rouges. Gevrey village et les grands crus rouges
        reposent sur le Pinot Noir.

  - id: burgundy-chablis-where-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which river valley holds Burgundy’s northernmost vines?
      choices:
        - { text: "The Yonne valley", correct: false }
        - { text: "The Serein", correct: true }
        - { text: "The Saône valley", correct: false }
        - { text: "The Dheune valley", correct: false }
      explanation: |
        An isolated **Yonne** island, closer to Champagne than to Beaune.
        The river is the **Serein**.
    fr:
      question: Dans la vallée de quelle rivière se trouvent les vignes les plus septentrionales de Bourgogne ?
      choices:
        - { text: "L’Yonne", correct: false }
        - { text: "Le Serein", correct: true }
        - { text: "La Saône", correct: false }
        - { text: "La Dheune", correct: false }
      explanation: |
        Chablis forme un îlot viticole dans l’**Yonne**, plus proche de la
        Champagne que de Beaune. La rivière qui traverse le vignoble est
        le **Serein**.

  - id: burgundy-chablis-aspect-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which way do the best Chablis slopes usually face?
      choices:
        - { text: "North to north-east", correct: false }
        - { text: "South to south-west", correct: true }
        - { text: "East to north-east", correct: false }
        - { text: "West to north-west", correct: false }
      explanation: |
        Grands crus look **south-west** over the Serein. “South-facing”
        is the loose label; due east is not the Chablis grand-cru map.
    fr:
      question: Vers quelle direction les meilleurs coteaux de Chablis sont-ils généralement orientés ?
      choices:
        - { text: "Du nord au nord-est", correct: false }
        - { text: "Du sud au sud-ouest", correct: true }
        - { text: "De l’est au nord-est", correct: false }
        - { text: "De l’ouest au nord-ouest", correct: false }
      explanation: |
        Les grands crus dominent le Serein en regardant vers le **sud-ouest**.
        On résume parfois par « exposition sud », mais ils ne sont pas
        simplement tournés plein est.

  - id: burgundy-petit-chablis-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What AOC covers the lesser, often Portlandian, Chablis sites?
      choices:
        - { text: "Chablis", correct: false }
        - { text: "Petit Chablis", correct: true }
        - { text: "Chablis Premier Cru", correct: false }
        - { text: "Chablis Grand Cru", correct: false }
      explanation: |
        **Petit Chablis** is the plateau / harder limestone tier — not
        every modest bottle (some village Chablis is modest too).
    fr:
      question: Quelle AOC couvre les sites chablisiens moins favorisés, souvent situés sur des calcaires portlandiens ?
      choices:
        - { text: "Chablis", correct: false }
        - { text: "Petit Chablis", correct: true }
        - { text: "Chablis Premier Cru", correct: false }
        - { text: "Chablis Grand Cru", correct: false }
      explanation: |
        **Petit Chablis** correspond surtout aux plateaux et aux calcaires
        plus durs. Cela ne signifie pas que toute bouteille modeste porte
        cette AOC : certains Chablis génériques le sont aussi.

  - id: burgundy-chablis-frost-again-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis, climate]
    status: reviewed
    source_id: c15-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is spring frost harsher in Chablis than on most of the Côte d’Or?
      choices:
        - { text: "Its south-facing slopes cause earlier harvests", correct: false }
        - { text: "It sits further north, in a cold Serein valley pocket", correct: true }
        - { text: "Its drier summers make spring nights colder", correct: false }
        - { text: "Its limestone soils retain more night-time heat", correct: false }
      explanation: |
        **Latitude plus a frost hollow**. The Côte d’Or still froze in
        **2021**; Chablis has the worse baseline, which is why aspersion
        is so visible there.
    fr:
      question: Pourquoi le gel de printemps est-il plus sévère à Chablis que dans la majeure partie de la Côte d’Or ?
      choices:
        - { text: "Ses versants sud entraînent des vendanges plus précoces", correct: false }
        - { text: "Chablis est plus au nord, dans la cuvette froide du Serein", correct: true }
        - { text: "Ses étés plus secs refroidissent davantage les nuits de printemps", correct: false }
        - { text: "Ses sols calcaires emmagasinent davantage la chaleur nocturne", correct: false }
      explanation: |
        La combinaison d’une **latitude plus élevée** et d’une **cuvette à
        gel** accroît le risque. La Côte d’Or a aussi gelé en 2021, mais le
        danger de fond est plus marqué à Chablis, d’où l’aspersion très visible.

  - id: burgundy-chablis-frost-kit-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis, climate]
    status: reviewed
    source_id: c15-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do Chablis growers usually fight spring frost?
      choices:
        - { text: "Late pruning and higher yields", correct: false }
        - { text: "Aspersion sprinklers and heaters (candles or burners)", correct: true }
        - { text: "Windbreaks and extra canopy shading", correct: false }
        - { text: "Earlier budbreak and soil irrigation", correct: false }
      explanation: |
        **Aspersion** (a coat of ice) and **heaters**. Wind machines
        appear too; water and fire remain the two named tools.
    fr:
      question: Comment les viticulteurs de Chablis luttent-ils généralement contre le gel de printemps ?
      choices:
        - { text: "Par une taille tardive et des rendements plus élevés", correct: false }
        - { text: "Par aspersion et avec des chaufferettes ou bougies", correct: true }
        - { text: "Avec des brise-vent et davantage d’ombrage du feuillage", correct: false }
        - { text: "En avançant le débourrement et en irriguant le sol", correct: false }
      explanation: |
        L’**aspersion** protège les bourgeons sous une couche de glace ; les
        **chaufferettes** réchauffent l’air. Des tours antigel existent aussi,
        mais l’eau et le feu sont les deux moyens emblématiques.

  - id: burgundy-chablis-grape-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape variety is permitted in Chablis AOC?
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay only", correct: true }
        - { text: "Aligoté", correct: false }
        - { text: "Pinot Blanc", correct: false }
      explanation: |
        **100% Chardonnay**. Sauvignon lives next door in **Saint-Bris**,
        not in Chablis AOC.
    fr:
      question: Quel cépage est autorisé dans l’AOC Chablis ?
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay uniquement", correct: true }
        - { text: "Aligoté", correct: false }
        - { text: "Pinot Blanc", correct: false }
      explanation: |
        Chablis est élaboré à **100 % en Chardonnay**. Le Sauvignon se trouve
        dans l’AOC voisine de **Saint-Bris**, pas dans Chablis.

  - id: burgundy-chablis-village-aspect-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Compared with Premier and Grand Cru sites, where are most village Chablis vineyards located?
      choices:
        - { text: "On the same south-west slopes as the grands crus", correct: false }
        - { text: "On cooler north-facing slopes and flatter land", correct: true }
        - { text: "Only on steep south-facing limestone", correct: false }
        - { text: "Mostly on warmer mid-slopes above the premiers crus", correct: false }
      explanation: |
        **Village Chablis** takes the less favoured aspects. Some decent
        south-facing plots are still “only” village — classification, not
        a compass tattoo.
    fr:
      question: Par rapport aux premiers et grands crus, où se trouvent la plupart des vignes de Chablis générique ?
      choices:
        - { text: "Sur les mêmes coteaux sud-ouest que les grands crus", correct: false }
        - { text: "Sur des versants nord plus frais et des terrains plus plats", correct: true }
        - { text: "Uniquement sur des calcaires abrupts exposés au sud", correct: false }
        - { text: "Surtout sur des mi-coteaux plus chauds au-dessus des premiers crus", correct: false }
      explanation: |
        Chablis générique occupe en majorité des expositions moins favorisées.
        Certaines bonnes parcelles tournées au sud restent néanmoins classées
        en Chablis : la hiérarchie ne se réduit pas à une boussole.

  - id: burgundy-chablis-cru-aspect-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which hillside exposures contain most Premier and Grand Cru Chablis vineyards?
      choices:
        - { text: "North to north-east slopes", correct: false }
        - { text: "South to south-west slopes", correct: true }
        - { text: "Flat valley-floor sites", correct: false }
        - { text: "West to north-west slopes", correct: false }
      explanation: |
        Classified climats crowd the **south to south-west** bank of the
        Serein. Due east is the Côte d’Or story, not Chablis grand cru.
    fr:
      question: Quelles expositions regroupent la plupart des premiers et grands crus de Chablis ?
      choices:
        - { text: "Les versants nord à nord-est", correct: false }
        - { text: "Les versants sud à sud-ouest", correct: true }
        - { text: "Les terrains plats du fond de vallée", correct: false }
        - { text: "Les versants ouest à nord-ouest", correct: false }
      explanation: |
        Les climats classés se concentrent sur les coteaux **sud à sud-ouest**
        du Serein. L’exposition vers l’est est surtout le schéma de la Côte
        d’Or, pas celui des grands crus de Chablis.

  - id: burgundy-chablis-village-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fruit and acidity profile is typical of Petit Chablis and many village Chablis wines?
      choices:
        - { text: "Ripe tropical fruit and medium acidity", correct: false }
        - { text: "Austere green fruit and high acidity", correct: true }
        - { text: "Stone fruit, full body and low acidity", correct: false }
        - { text: "Citrus fruit, soft acidity and prominent new oak", correct: false }
      explanation: |
        **Green apple, lemon, steel**. A warm year or a good village site
        can taste riper — that is the ceiling, not the Petit Chablis
        default.
    fr:
      question: Quel profil de fruit et d’acidité caractérise Petit Chablis et de nombreux Chablis génériques ?
      choices:
        - { text: "Fruits tropicaux mûrs et acidité moyenne", correct: false }
        - { text: "Fruits verts austères et acidité élevée", correct: true }
        - { text: "Fruits à noyau, corps ample et faible acidité", correct: false }
        - { text: "Agrumes, acidité souple et bois neuf marqué", correct: false }
      explanation: |
        **Pomme verte, citron et tension** dominent. Un millésime chaud ou
        un bon site de Chablis peut donner davantage de maturité, mais ce
        n’est pas le profil habituel de Petit Chablis.

  - id: burgundy-chablis-cru-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do Premier and Grand Cru Chablis usually compare with village Chablis?
      choices:
        - { text: "Lighter-bodied, greener and lower in acidity", correct: false }
        - { text: "Riper citrus, more body, still high acidity", correct: true }
        - { text: "Similar in body but less ripe and more neutral", correct: false }
        - { text: "Fuller-bodied, but softer in acidity and dominated by oak", correct: false }
      explanation: |
        **Citrus over green apple**, more weight, acid still the spine.
        Les Clos is not a Mâcon fruit bomb.
    fr:
      question: Comment les premiers et grands crus de Chablis se comparent-ils généralement aux Chablis génériques ?
      choices:
        - { text: "Plus légers, plus végétaux et moins acides", correct: false }
        - { text: "Agrumes plus mûrs, davantage de corps et toujours une acidité élevée", correct: true }
        - { text: "Un corps semblable, mais moins de maturité et plus de neutralité", correct: false }
        - { text: "Plus corsés, mais moins acides et dominés par le bois", correct: false }
      explanation: |
        Les **agrumes remplacent la pomme verte**, le corps augmente, mais
        l’acidité reste l’ossature. Même Les Clos ne prend pas le profil
        opulent d’un Mâcon très mûr.

  - id: burgundy-chablis-oak-who-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do some top Chablis cru domaines raise the wine, instead of steel only?
      choices:
        - { text: "In new oak with heavy toast", correct: false }
        - { text: "In older oak barrels", correct: true }
        - { text: "In amphora with extended skin contact", correct: false }
        - { text: "In large new-oak vats", correct: false }
      explanation: |
        **Raveneau** and **Dauvissat** are the named old-oak houses.
        Most village wine never sees a barrel.
    fr:
      question: Comment certains grands domaines élèvent-ils leurs crus de Chablis plutôt que d’utiliser uniquement la cuve ?
      choices:
        - { text: "En fûts neufs fortement chauffés", correct: false }
        - { text: "En fûts de plusieurs vins", correct: true }
        - { text: "En amphores avec une longue macération pelliculaire", correct: false }
        - { text: "Dans de grands foudres neufs", correct: false }
      explanation: |
        **Raveneau** et **Dauvissat** sont les références classiques de
        l’élevage en fûts anciens. La plupart des Chablis génériques ne
        passent toutefois jamais en fût.

  - id: burgundy-chablis-oak-effect-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: If a Chablis cru sees used barrels, what should you taste besides fruit?
      choices:
        - { text: "A strong vanilla and coconut flavour", correct: false }
        - { text: "A rounder texture and a quiet savoury note, not coconut toast", correct: true }
        - { text: "Lower acidity and noticeable sweetness", correct: false }
        - { text: "A lighter texture and greener fruit", correct: false }
      explanation: |
        **Texture, not toast**. Used barrels should stay in the background;
        they should not shout Meursault.
    fr:
      question: Qu’apportent des fûts usagés à un cru de Chablis, en plus du fruit ?
      choices:
        - { text: "Des arômes intenses de vanille et de noix de coco", correct: false }
        - { text: "Une texture plus ronde et une discrète note savoureuse", correct: true }
        - { text: "Une acidité plus faible et une douceur perceptible", correct: false }
        - { text: "Une texture plus légère et un fruit plus végétal", correct: false }
      explanation: |
        Ils modifient surtout la **texture**, sans forte marque de chauffe.
        Le bois usagé doit rester en arrière-plan et ne pas donner au vin
        le caractère boisé d’un Meursault affirmé.

  - id: burgundy-chablis-steel-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy, chablis]
    status: reviewed
    source_id: c15-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do most growers keep Chablis tasting of fruit and stone, not wood?
      choices:
        - { text: "Ferment and age it in new barriques", correct: false }
        - { text: "Ferment and raise it in stainless steel or concrete", correct: true }
        - { text: "Ferment in steel, then age entirely in new oak", correct: false }
        - { text: "Ferment in old oak, then finish in new oak", correct: false }
      explanation: |
        **Inert vessels** are the regional default. Oak is the exception
        at the top, not the village recipe.
    fr:
      question: Comment la plupart des producteurs préservent-ils à Chablis l’expression du fruit et de la pierre plutôt que celle du bois ?
      choices:
        - { text: "Par fermentation et élevage en barriques neuves", correct: false }
        - { text: "Par fermentation et élevage en cuve inox ou béton", correct: true }
        - { text: "Par fermentation en cuve puis élevage intégral en bois neuf", correct: false }
        - { text: "Par fermentation en vieux fût puis finition en bois neuf", correct: false }
      explanation: |
        Les contenants **inertes** constituent la norme régionale. Le fût
        est surtout une option pour certains crus, pas la recette habituelle
        d’un Chablis générique.

  - id: burgundy-massif-west-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which upland sits west of the Côte d’Or and helps shape its slope?
      choices:
        - { text: "The Jura foothills", correct: false }
        - { text: "The Morvan uplands", correct: true }
        - { text: "The Vosges foothills", correct: false }
        - { text: "The Saône plain", correct: false }
      explanation: |
        Hills to the **west** (Morvan, the Massif’s northern edge). The
        Côte is the **east-facing scarp** of that block, not a river
        terrace on the Saône alone.
    fr:
      question: Quel massif situé à l’ouest de la Côte d’Or contribue à former son relief ?
      choices:
        - { text: "Les contreforts du Jura", correct: false }
        - { text: "Les hauteurs du Morvan", correct: true }
        - { text: "Les contreforts des Vosges", correct: false }
        - { text: "La plaine de la Saône", correct: false }
      explanation: |
        Les hauteurs du **Morvan**, à l’ouest, forment l’extrémité nord du
        Massif central. La Côte est l’escarpement oriental de cet ensemble,
        et non une simple terrasse de la Saône.

  - id: burgundy-cote-aspect-hills-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
