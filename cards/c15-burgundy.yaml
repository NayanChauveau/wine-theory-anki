      choices:
        - { text: "Village Bourgogne Rouge and Bourgogne Blanc", correct: false }
        - { text: "Regional Bourgogne Rouge and Bourgogne Blanc", correct: true }
        - { text: "Premier Cru Bourgogne Rouge and Bourgogne Blanc", correct: false }
        - { text: "Bourgogne Grand Cru Rouge and Blanc", correct: false }
      explanation: |
        Generic **Bourgogne**. There are other regionals (Aligoté,
        Hautes-Côtes, Mâcon) — this pair is the floor for Pinot and
        Chardonnay.

  - id: burgundy-regional-source-001
    type: mcq
