        - { text: "Premier cru climats exist; there are no grands crus", correct: true }
        - { text: "Only a German Prädikat scale", correct: false }
        - { text: "1855 first growths only", correct: false }
      explanation: |
        **Premiers crus**, no GC map. Same story in the Mâconnais until
        Pouilly-Fuissé’s recent 1er crus — still no grand cru there.

  - id: burgundy-chalonnaise-regional-001
    type: mcq
