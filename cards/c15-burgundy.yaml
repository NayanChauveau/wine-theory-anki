        - { text: "Pinot Noir and Chardonnay", correct: true }
        - { text: "Pinot Noir and Aligoté", correct: false }
        - { text: "Gamay and Chardonnay", correct: false }
      explanation: |
        The two stars. **Bourgogne Aligoté** is a separate label; César
        and others are footnotes.

  - id: burgundy-restricted-regional-001
    type: mcq
