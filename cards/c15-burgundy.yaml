    en:
      question: Which Chalonnaise village has long been a base for Crémant de Bourgogne?
      choices:
        - { text: "Pommard", correct: false }
        - { text: "Rully", correct: true }
        - { text: "Chablis", correct: false }
        - { text: "Sauternes", correct: false }
      explanation: |
        **Rully** leans white and has long supplied **Crémant**. Mercurey
        is the red-reputation village.

  - id: burgundy-mercurey-001
