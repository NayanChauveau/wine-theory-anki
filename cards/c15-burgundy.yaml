    en:
      question: Pouilly-Fuissé, Saint-Véran and most Mâcon blanc are which grape?
      choices:
        - { text: "Pinot Noir", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Riesling", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        **Chardonnay** country — this is a big reason Burgundy’s white
        hectare count beats Pinot.

  - id: burgundy-macon-red-grape-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0075
