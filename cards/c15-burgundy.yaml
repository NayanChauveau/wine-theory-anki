    en:
      question: Beside Viré-Clessé, which two Mâconnais village AOCs do most lists lead with?
      choices:
        - { text: "Gevrey-Chambertin and Vosne-Romanée", correct: false }
        - { text: "Pouilly-Fuissé and Saint-Véran", correct: true }
        - { text: "Pommard and Volnay", correct: false }
        - { text: "Sauternes and Barsac", correct: false }
      explanation: |
        **Pouilly-Fuissé** and **Saint-Véran**. **Viré-Clessé** and the
        smaller Pouillys (Vinzelles, Loché) sit beside them — not
        invisible, just not the first two names.

  - id: burgundy-pf-style-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fruit register do Pouilly-Fuissé and Saint-Véran usually show?
      choices:
        - { text: "Only green apple and no weight", correct: false }
        - { text: "Ripe stone and tropical fruit", correct: true }
        - { text: "Only red cherry and tar", correct: false }
        - { text: "Only noble-rot saffron", correct: false }
      explanation: |
        Warmer south Burgundy: **peach, apricot, sometimes pineapple**.
        Many see some **barrel** time for texture — not every cuvée is
        a toast bomb.

  - id: burgundy-solutre-site-001
    type: mcq
