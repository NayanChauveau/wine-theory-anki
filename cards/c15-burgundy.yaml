      sources: [known-fact]
    en:
      question: Next to a generic Mâcon blanc, how should a Mâcon-Villages usually sit?
      choices:
        - { text: "Less ripeness and a legal ban on Chardonnay", correct: false }
        - { text: "A step up in weight and definition", correct: true }
        - { text: "A grand cru Pinot ranking", correct: false }
        - { text: "A Sauternes classification", correct: false }
      explanation: |
        A step up in **weight**. **Mâcon-Villages** cannot be red.
        **Mâcon-Lugny** is the named volume village.

  - id: burgundy-lugny-001
    type: mcq
