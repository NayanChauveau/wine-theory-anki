      sources: [known-fact]
    en:
      question: Meursault plus which two neighbours form the Côte de Beaune white trio?
      choices:
        - { text: "Gevrey, Morey and Chambolle", correct: false }
        - { text: "Puligny-Montrachet and Chassagne-Montrachet", correct: true }
        - { text: "Pommard, Volnay and Corton only as reds", correct: false }
        - { text: "Sauternes, Barsac and Cadillac", correct: false }
      explanation: |
        The **white trio**. Montrachet itself is split between Puligny
        and Chassagne.

  - id: burgundy-cdnv-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Comblanchien, Corgoloin and Prissey usually bottle red (or white) as what AOC?
      choices:
        - { text: "Only Romanée-Conti", correct: false }
        - { text: "Côte de Nuits-Villages", correct: true }
        - { text: "Only sparkling wine from Chablis", correct: false }
        - { text: "Any Bordeaux Supérieur", correct: false }
      explanation: |
        **Comblanchien, Corgoloin, Prissey**, parts of Brochon / Fixin —
        not Gevrey or Vosne. Both colours are legal; red dominates.

  - id: burgundy-cdb-villages-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What colour is Côte de Beaune-Villages allowed to be?
      choices:
        - { text: "White only", correct: false }
        - { text: "Red only", correct: true }
        - { text: "Only sparkling Aligoté", correct: false }
        - { text: "Only Sauternes", correct: false }
      explanation: |
        **Red Pinot** only. Famous villages such as **Pommard** and
        **Volnay** stay on their own labels. It is not a white AOC.

  - id: burgundy-hautes-cotes-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Above the Côte scarp, which pair of Bourgogne AOCs names the windy plateau?
      choices:
        - { text: "Pauillac and Pomerol", correct: false }
        - { text: "Bourgogne Hautes-Côtes de Nuits and Hautes-Côtes de Beaune", correct: true }
        - { text: "Only Chablis grand cru", correct: false }
        - { text: "Sauternes and Barsac", correct: false }
      explanation: |
        **Hautes-Côtes de Nuits** and **Hautes-Côtes de Beaune**: cooler,
        windier plateau. Less body than the mid-slope crus — useful in
        hot years, lean in cold ones.

  - id: burgundy-chalonnaise-where-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0063
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After Santenay, which Burgundy hillside district comes next heading south?
      choices:
        - { text: "Chablis", correct: false }
        - { text: "The Côte Chalonnaise", correct: true }
        - { text: "The Médoc", correct: false }
        - { text: "Tokaj", correct: false }
      explanation: |
        After **Santenay** the hills break up: that is the
        **Chalonnaise**, then the Mâconnais. Not “Challonaise”.

  - id: burgundy-chalonnaise-grapes-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Mercurey rouge and Montagny blanc are built on which pair of grapes?
      choices:
        - { text: "Riesling and Gewurztraminer", correct: false }
        - { text: "Chardonnay and Pinot Noir", correct: true }
        - { text: "Cabernet Sauvignon and Merlot", correct: false }
        - { text: "Only Muscadelle", correct: false }
      explanation: |
        Same pair as the Côte d’Or. **Aligoté** has its own village at
        **Bouzeron**; Gamay is minor here.

  - id: burgundy-chalonnaise-ripen-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does harvest timing on the Côte Chalonnaise compare with the Côte d’Or?
      choices:
        - { text: "It is always two months earlier", correct: false }
        - { text: "It is later, and ripening is less reliable", correct: true }
        - { text: "Grapes are picked in March by law", correct: false }
        - { text: "There is no harvest — only icewine", correct: false }
      explanation: |
        More **broken hills**, a cooler pocket: pick is later and some
        years never quite finish. That is the reliability gap, not a
        different grape list.

  - id: burgundy-chalonnaise-aspect-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do many Chalonnaise wines come out lighter-bodied than Côte d’Or peers?
      choices:
        - { text: "A legal maximum of 8% alcohol", correct: false }
        - { text: "Fewer vineyards enjoy a clean easterly aspect", correct: true }
        - { text: "The AOC bans Pinot Noir", correct: false }
        - { text: "They must be bottled as Nouveau", correct: false }
      explanation: |
        The Côte d’Or is one long **E/SE** scarp. The Chalonnaise is a
        jumble of aspects — more shade, more wind, less consistent sun.

  - id: burgundy-chalonnaise-villages-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0067
    review:
