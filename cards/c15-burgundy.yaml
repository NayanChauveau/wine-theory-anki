        - { text: "Bourgogne Hautes-Côtes de Nuits and Hautes-Côtes de Beaune", correct: true }
        - { text: "Bourgogne Côte Chalonnaise and Bourgogne Côte d’Or", correct: false }
        - { text: "Mâcon-Villages and Bourgogne Tonnerre", correct: false }
      explanation: |
        **Hautes-Côtes de Nuits** and **Hautes-Côtes de Beaune**: cooler,
        windier plateau. Less body than the mid-slope crus — useful in
        hot years, lean in cold ones.
    fr:
      question: Quelles deux AOC bourguignonnes désignent le plateau venteux situé au-dessus de l’escarpement de la Côte ?
      choices:
        - { text: "Côte de Nuits-Villages et Côte de Beaune-Villages", correct: false }
        - { text: "Bourgogne Hautes-Côtes de Nuits et Hautes-Côtes de Beaune", correct: true }
        - { text: "Bourgogne Côte Chalonnaise et Bourgogne Côte d’Or", correct: false }
        - { text: "Mâcon-Villages et Bourgogne Tonnerre", correct: false }
      explanation: |
        Les **Hautes-Côtes de Nuits** et les **Hautes-Côtes de Beaune** sont
        plus fraîches et plus venteuses. Leurs vins ont souvent moins de
        corps que ceux du mi-coteau, avantage en année chaude, limite en année froide.

