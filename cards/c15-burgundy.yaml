      choices:
        - { text: "Under 1%, like grand cru", correct: false }
        - { text: "A much bigger slice — about a third", correct: true }
        - { text: "Exactly 100%", correct: false }
        - { text: "Village wine is illegal", correct: false }
      explanation: |
        **Around a third**. Regionals are the volume floor; grands crus
        are a sliver. Do not memorise a census integer.

  - id: burgundy-lieu-dit-001
