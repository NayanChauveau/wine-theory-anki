        - { text: "Bourgogne Côte Chalonnaise", correct: true }
        - { text: "Côtes du Rhône Villages", correct: false }
        - { text: "Vin de France only", correct: false }
      explanation: |
        **Bourgogne Côte Chalonnaise**. Spelling is Chalonnaise, not
        “Challonaise”.

  - id: burgundy-macon-chard-001
    type: mcq
