  - id: burgundy-chalonnaise-ripen-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does harvest timing on the Côte Chalonnaise compare with the Côte d’Or?
      choices:
        - { text: "It is usually earlier and ripening is more reliable", correct: false }
        - { text: "It is later, and ripening is less reliable", correct: true }
        - { text: "It is at the same time, with no meaningful difference", correct: false }
        - { text: "It is later, but ripening is more reliable", correct: false }
      explanation: |
        More **broken hills**, a cooler pocket: pick is later and some
        years never quite finish. That is the reliability gap, not a
        different grape list.
    fr:
      question: Comment la date des vendanges en Côte Chalonnaise se compare-t-elle généralement à celle de la Côte d’Or ?
      choices:
        - { text: "Elles sont plus précoces et la maturité plus régulière", correct: false }
        - { text: "Elles sont plus tardives et la maturité moins régulière", correct: true }
        - { text: "Elles ont lieu au même moment, sans différence notable", correct: false }
        - { text: "Elles sont plus tardives, mais la maturité plus régulière", correct: false }
      explanation: |
        Le relief plus **morcelé** forme une poche plus fraîche : la récolte
        intervient plus tard et la maturité reste parfois incomplète. La
        différence tient à cette fiabilité, pas à d’autres cépages.

  - id: burgundy-chalonnaise-aspect-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do many Chalonnaise wines come out lighter-bodied than Côte d’Or peers?
      choices:
        - { text: "The soils are uniformly richer in heat-retaining gravel", correct: false }
        - { text: "Fewer vineyards enjoy a clean easterly aspect", correct: true }
        - { text: "Harvest is consistently earlier than on the Côte d’Or", correct: false }
        - { text: "The district lies further south and is uniformly hotter", correct: false }
      explanation: |
        The Côte d’Or is one long **E/SE** scarp. The Chalonnaise is a
        jumble of aspects — more shade, more wind, less consistent sun.
    fr:
      question: Pourquoi de nombreux vins de la Côte Chalonnaise sont-ils plus légers que leurs équivalents de la Côte d’Or ?
      choices:
        - { text: "Les sols sont partout plus riches en graves qui retiennent la chaleur", correct: false }
        - { text: "Moins de vignes bénéficient d’une exposition nette à l’est", correct: true }
        - { text: "La vendange y est systématiquement plus précoce qu’en Côte d’Or", correct: false }
        - { text: "Le secteur est plus au sud et uniformément plus chaud", correct: false }
      explanation: |
        La Côte d’Or forme un long escarpement **est à sud-est**. En Côte
        Chalonnaise, les expositions sont plus variées, avec davantage
        d’ombre et de vent et un ensoleillement moins régulier.

