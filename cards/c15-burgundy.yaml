      sources: [known-fact]
    en:
      question: What rank sits above Bourgogne / Mâcon / Hautes-Côtes on the Burgundy ladder?
      choices:
        - { text: "Vin de France only", correct: false }
        - { text: "Commune (village) appellations", correct: true }
        - { text: "A German Einzellage with no AOC", correct: false }
        - { text: "Only icewine", correct: false }
      explanation: |
        **Village / commune**: Gevrey-Chambertin, Meursault, Chablis.
        Premier and grand cru sit above that.

  - id: burgundy-commune-examples-001
    type: mcq
