      sources: [known-fact]
    en:
      question: How should you treat a Mâcon rouge?
      choices:
        - { text: "As a 30-year Chambertin cellar wine", correct: false }
        - { text: "Light, fruity, drink it young", correct: true }
        - { text: "As a late-harvest sweet wine", correct: false }
        - { text: "As sparkling only", correct: false }
      explanation: |
        **Gamay** (or light Pinot): early drinking. Not a Nuits grand cru.

  - id: burgundy-macon-villages-001
    type: mcq
    deck: France::Burgundy
    tags: [france, burgundy]
    status: reviewed
    source_id: c15-0080
    review:
