        - { text: "Lorsque le vin provient d’un seul lieu-dit non classé en cru", correct: true }
        - { text: "Seulement si le site attend son classement en premier cru", correct: false }
        - { text: "Dès que le producteur possède toute la parcelle", correct: false }
      explanation: |
        Le nom du **lieu-dit** peut apparaître en caractères plus petits.
        Le fait qu’une parcelle soit nommée n’en fait pas un premier cru.

