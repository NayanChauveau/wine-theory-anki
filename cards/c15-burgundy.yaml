        - { text: "Mercurey", correct: true }
        - { text: "Chablis", correct: false }
        - { text: "Sauternes", correct: false }
      explanation: |
        **Mercurey** is the largest village AOC here and the red
        benchmark. Montagny is white only.

  - id: burgundy-givry-001
    type: mcq
