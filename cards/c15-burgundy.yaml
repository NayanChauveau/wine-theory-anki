      sources: [known-fact]
    en:
      question: What is Givry’s place among the Chalonnaise villages?
      choices:
        - { text: "It is a white-only grand cru in Chablis", correct: false }
        - { text: "A small AOC with a strong red reputation", correct: true }
        - { text: "The only sparkling AOC in France", correct: false }
        - { text: "A Médoc commune", correct: false }
      explanation: |
        **Givry** rouge is well thought of; the AOC is compact. Do not
        nail “the smallest in Burgundy” — **Bouzeron** is tiny too.

  - id: burgundy-montagny-001
    type: mcq
