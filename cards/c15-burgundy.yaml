        - { text: "When the wine comes from that single premier-cru climat", correct: true }
        - { text: "Whenever the climat name belongs to the producer", correct: false }
        - { text: "Only when the climat is a monopole", correct: false }
      explanation: |
        **Gevrey-Chambertin Clos Saint-Jacques 1er Cru**. If several
        1ers are blended, the climat name drops.

