      choices:
        - { text: "AVA", correct: false }
        - { text: "Village", correct: true }
        - { text: "Einzellage", correct: false }
        - { text: "DOCG", correct: false }
      explanation: |
        **Village** = commune AOC. Same rank, friendlier word.

  - id: burgundy-above-village-001
    type: mcq
