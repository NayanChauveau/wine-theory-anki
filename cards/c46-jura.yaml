  - id: jura-vin-jaune-profile-001
    type: mcq
    deck: France::Jura
    tags: [france, jura, vin-jaune, wine-style]
    status: reviewed
    review:
      fact_check: pass
      sources: [inao-chateau-chalon-specification]
    en:
      question: Which tasting profile most strongly indicates a mature Jura Vin Jaune?
      choices:
        - { text: "Dry and powerful, with walnut, mature apple and curry-like spice", correct: true }
        - { text: "Sweet and delicate, with fresh grape, rose and orange blossom", correct: false }
        - { text: "Dry and light, with gooseberry, grass and green bell pepper", correct: false }
        - { text: "Sweet and luscious, with botrytis, saffron and apricot", correct: false }
      explanation: |
        Long ageing under voile produces an intense, persistent wine rather than a simple
        fruit-driven white. Good examples can develop for decades in bottle while retaining
        their distinctive nutty and spicy character.
    fr:
      question: Quel profil de dégustation évoque le plus fortement un Vin Jaune du Jura arrivé à maturité ?
      choices:
        - { text: "Sec et puissant, avec des notes de noix, de pomme mûre et d’épices évoquant le curry", correct: true }
        - { text: "Doux et délicat, avec des notes de raisin frais, de rose et de fleur d’oranger", correct: false }
        - { text: "Sec et léger, avec des notes de groseille à maquereau, d’herbe et de poivron vert", correct: false }
        - { text: "Doux et opulent, avec des notes de botrytis, de safran et d’abricot", correct: false }
      explanation: |
        Le long élevage sous voile donne un vin intense et persistant, loin d’un blanc
        simplement fruité. Les meilleurs exemples peuvent évoluer pendant des décennies
        en bouteille tout en conservant leur caractère de noix et d’épices.

  - id: jura-macvin-production-001
    type: mcq
    deck: France::Jura
    tags: [france, jura, macvin, fortified]
    status: reviewed
    review:
      fact_check: pass
      sources: [inao-macvin-du-jura-specification]
    en:
      question: How is Macvin du Jura produced?
      choices:
        - { text: "Unfermented grape must is blended with aged Marc du Jura spirit", correct: true }
        - { text: "Fermenting wine is fortified with neutral grape spirit and aged under voile", correct: false }
        - { text: "Dried-grape must is fermented to dryness and blended with young wine", correct: false }
        - { text: "Finished wine is sweetened with concentrated must and carbonated in tank", correct: false }
      explanation: |
        Macvin is a vin de liqueur: roughly two parts fresh must are muted with one part
        grape-marc spirit. The mixture retains natural grape sugar and is matured in wood
        before release.
    fr:
      question: Comment élabore-t-on le Macvin du Jura ?
      choices:
        - { text: "Du moût non fermenté est assemblé à une eau-de-vie de Marc du Jura élevée", correct: true }
        - { text: "Un vin en fermentation est muté à l’alcool neutre puis élevé sous voile", correct: false }
        - { text: "Un moût de raisins séchés fermente à sec avant d’être assemblé à un vin jeune", correct: false }
        - { text: "Un vin fini est édulcoré au moût concentré puis gazéifié en cuve", correct: false }
      explanation: |
        Le Macvin est un vin de liqueur : environ deux parts de moût frais sont mutées
        avec une part d’eau-de-vie de marc. L’assemblage conserve les sucres naturels du
        raisin et poursuit son élevage sous bois avant la commercialisation.
