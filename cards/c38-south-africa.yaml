      choices:
        - { text: "Muskadel", correct: false }
        - { text: "Steen", correct: false }
        - { text: "Hanepoot", correct: true }
        - { text: "Hermitage", correct: false }
      explanation: |
        Muskadel is the Cape name for a different grape, Muscat Blanc à Petits Grains; Steen
        is the old local name for Chenin Blanc.

  - id: za-muscat-alexandria-style-001
    type: mcq
    deck: South Africa
    tags: [south-africa, muscat, sweet]
    status: reviewed
    source_id: c38-0047
