# deck: South Africa

cards:
  - id: za-robertson-cooling-001
    type: mcq
    deck: South Africa
    tags: [south-africa, breede-river-valley, robertson, climate]
    status: reviewed
    source_id: c38-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What keeps the Robertson district a little cooler than neighbouring Worcester?"
      choices:
        - { text: "Afternoon breezes off False Bay", correct: false }
        - { text: "Fog from the Benguela Current", correct: false }
        - { text: "South-easterly winds drawn up the valley", correct: true }
        - { text: "Vineyards planted above 500 metres", correct: false }
      explanation: |
        Robertson lies about 100 km inland, so the sea itself is far away; the cool
        air arrives as wind channelled up the valley from the south-east.
        Summers are still hot and dry enough that irrigation remains the norm.

  - id: za-robertson-premium-001
    type: mcq
    deck: South Africa
    tags: [south-africa, breede-river-valley, robertson, syrah, chardonnay]
    status: reviewed
    source_id: c38-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Beyond dependable wine for large brands, which two styles show the Robertson district at its best?"
      choices:
        - { text: "Syrah and full-bodied Chardonnay", correct: true }
        - { text: "Pinot Noir and Riesling", correct: false }
        - { text: "Pinotage and Viognier", correct: false }
        - { text: "Grenache and barrel-aged Sémillon", correct: false }
      explanation: |
        Lime-rich soils are a local asset. De Wetshof, a family estate near the town
        of Robertson, built its name on Chardonnay from the 1980s onward.

  - id: za-cape-south-coast-members-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, geography]
    status: reviewed
    source_id: c38-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Walker Bay, Elgin and Elim all belong to which region?"
      choices:
        - { text: "Coastal Region", correct: false }
        - { text: "Breede River Valley", correct: false }
        - { text: "Cape South Coast", correct: true }
        - { text: "Klein Karoo", correct: false }
      explanation: |
        Its vineyards are scattered along the southern shoreline, some as far east as
        Plettenberg Bay on the Garden Route, so most sites feel the ocean closely.

  - id: za-cape-south-coast-oldest-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, walker-bay]
    status: reviewed
    source_id: c38-0109
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Cape South Coast district has the longest modern track record for vineyards?"
      choices:
        - { text: "Elgin", correct: false }
        - { text: "Walker Bay", correct: true }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Plettenberg Bay", correct: false }
      explanation: |
        Its first modern vineyards date from the mid-1970s. Elgin was mainly apple
        country until growers began converting orchards to vines from the late 1980s.

  - id: za-hemel-en-aarde-district-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, walker-bay, hemel-en-aarde]
    status: reviewed
    source_id: c38-0110
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "The Hemel-en-Aarde wards sit within which district?"
      choices:
        - { text: "Elgin", correct: false }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Walker Bay", correct: true }
      explanation: |
        There are three: Hemel-en-Aarde Valley, Upper Hemel-en-Aarde Valley and
        Hemel-en-Aarde Ridge, rising inland from the coast.

  - id: za-hemel-en-aarde-grapes-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, hemel-en-aarde, pinot-noir, chardonnay]
    status: reviewed
    source_id: c38-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of grapes has made the Hemel-en-Aarde wards famous?"
      choices:
        - { text: "Chenin Blanc and Pinotage", correct: false }
        - { text: "Pinot Noir and Chardonnay", correct: true }
        - { text: "Cabernet Sauvignon and Merlot", correct: false }
        - { text: "Syrah and Viognier", correct: false }
      explanation: |
        Hamilton Russell Vineyards, founded in the 1970s, set the benchmark; clay-rich,
        stony shale soils and ocean air give tight, mineral wines.

  - id: za-hemel-en-aarde-other-grapes-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, hemel-en-aarde]
    status: reviewed
    source_id: c38-0112
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Beyond the varieties that built their name, which trio also succeeds in the Hemel-en-Aarde wards?"
      choices:
        - { text: "Chenin Blanc, Cinsault and Tinta Barocca", correct: false }
        - { text: "Colombard, Ruby Cabernet and Muscat", correct: false }
        - { text: "Sauvignon Blanc, Merlot and Syrah", correct: true }
        - { text: "Viognier, Grenache and Mourvèdre", correct: false }
      explanation: |
        Cool sites near the coast keep Sauvignon Blanc fresh, while warmer, more
        sheltered slopes can ripen Merlot and Syrah.

  - id: za-elgin-location-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elgin, geography]
    status: reviewed
    source_id: c38-0113
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Cape South Coast district lies just north-west of Walker Bay?"
      choices:
        - { text: "Elgin", correct: true }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Plettenberg Bay", correct: false }
      explanation: |
        It sits over Sir Lowry's Pass from Somerset West, roughly an hour's drive from
        Cape Town, which made it an easy source of cool-climate fruit for city cellars.

  - id: za-elgin-cooling-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elgin, climate]
    status: reviewed
    source_id: c38-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the key cooling factor in Elgin's vineyards?"
      choices:
        - { text: "Fog from the cold west-coast current", correct: false }
        - { text: "Altitude of its upland basin", correct: true }
        - { text: "Breezes funnelled in from Table Bay", correct: false }
        - { text: "Cool, moisture-holding clay soils", correct: false }
      explanation: |
        Most vineyards lie at roughly 200–400 m on a plateau ringed by mountains, so
        nights are cold. Ocean air from False Bay, some 15 km away, helps further.

  - id: za-elgin-reputation-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elgin, sauvignon-blanc]
    status: reviewed
    source_id: c38-0115
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style has given the Elgin district its strongest reputation?"
      choices:
        - { text: "Rich, barrel-fermented Chenin Blanc", correct: false }
        - { text: "Perfumed, oily Viognier", correct: false }
        - { text: "Intense, fresh Sauvignon Blanc", correct: true }
        - { text: "Honeyed, waxy Sémillon", correct: false }
      explanation: |
        Long, cool ripening keeps acidity high and preserves pyrazine-driven green
        notes alongside riper passion-fruit aromas.

  - id: za-elgin-other-grapes-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elgin]
    status: reviewed
    source_id: c38-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Apart from its signature white, which trio of varieties is showing promise in Elgin?"
      choices:
        - { text: "Pinotage, Cinsault and Chenin Blanc", correct: false }
        - { text: "Pinot Noir, Chardonnay and Syrah", correct: true }
        - { text: "Grenache, Carignan and Roussanne", correct: false }
        - { text: "Tempranillo, Touriga Nacional and Verdelho", correct: false }
      explanation: |
        Paul Cluver, one of the first wine estates in the area, is known for its
        Pinot Noir and Chardonnay; cool-climate Syrah from the district tends toward
        peppery, medium-bodied styles.

  - id: za-elim-district-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elim, geography]
    status: reviewed
    source_id: c38-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "The Elim ward belongs to which district?"
      choices:
        - { text: "Walker Bay", correct: false }
        - { text: "Elgin", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Cape Agulhas", correct: true }
      explanation: |
        Elim takes its name from a 19th-century Moravian mission village. The flat,
        wind-swept land lies only a few kilometres from the sea, south-east of
        Walker Bay.

  - id: za-elim-style-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elim, sauvignon-blanc]
    status: reviewed
    source_id: c38-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style of Sauvignon Blanc is the Elim ward best known for?"
      choices:
        - { text: "Ripe and tropical", correct: false }
        - { text: "Pungent and herbaceous", correct: true }
        - { text: "Flinty and barrel-fermented", correct: false }
        - { text: "Soft, light and neutral", correct: false }
      explanation: |
        Strong, near-constant sea winds slow ripening and keep berries small, which
        concentrates green, grassy flavours. Syrah is a newer success here too.

  - id: za-wine-of-origin-name-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin]
    status: reviewed
    source_id: c38-0119
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which official scheme certifies origin claims on South African wine labels?"
      choices:
        - { text: "Vintners Quality Alliance (VQA)", correct: false }
        - { text: "Denominación de Origen (DO)", correct: false }
        - { text: "Wine of Origin (WO)", correct: true }
        - { text: "Geographical Indication (GI) register", correct: false }
      explanation: |
        The scheme dates from 1973. Besides origin, it governs claims about vintage
        and grape variety, which must be met by a minimum share of the blend.

  - id: za-wo-seal-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin]
    status: reviewed
    source_id: c38-0120
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What extra mark appears on a South African bottle certified under the Wine of Origin scheme?"
      choices:
        - { text: "A capsule colour-coded by region", correct: false }
        - { text: "A government quality score", correct: false }
        - { text: "A numbered certification seal", correct: true }
        - { text: "A neck label naming the soil type", correct: false }
      explanation: |
        Each seal carries a unique number, so the origin, vintage and variety claims
        checked by the certifying body can be traced back to a specific batch.

  - id: za-wo-smallest-tier-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin]
    status: reviewed
    source_id: c38-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which is the smallest of the four tiers of production area in the Wine of Origin scheme?"
      choices:
        - { text: "District", correct: false }
        - { text: "Ward", correct: true }
        - { text: "Region", correct: false }
        - { text: "Geographical unit", correct: false }
      explanation: |
        Each tier nests inside a larger one; Simonsberg-Stellenbosch, for example, is a
        smaller named area within the Stellenbosch district. A few small areas are not
        attached to any district at all.

  - id: za-western-cape-tier-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin, western-cape]
    status: reviewed
    source_id: c38-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At which tier of the Wine of Origin scheme does the Western Cape sit?"
      choices:
        - { text: "Geographical unit", correct: true }
        - { text: "Region", correct: false }
        - { text: "District", correct: false }
        - { text: "Ward", correct: false }
      explanation: |
        This top tier broadly follows provincial borders. Other geographical units
        include Eastern Cape and KwaZulu-Natal.

  - id: za-region-boundaries-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin]
    status: reviewed
    source_id: c38-0124
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the Wine of Origin scheme, what do region and district boundaries tend to follow?"
      choices:
        - { text: "Provincial and municipal borders", correct: false }
        - { text: "Major landforms such as river valleys", correct: true }
        - { text: "Mapped zones of a single soil type", correct: false }
        - { text: "Lines of equal summer temperature", correct: false }
      explanation: |
        Names make the point: Breede River Valley and Olifants River are both
        regions traced along a river system rather than a political line.

  - id: za-estate-grapes-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, estate-wine]
    status: reviewed
    source_id: c38-0126
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where must the grapes for a South African Estate Wine come from?"
      choices:
        - { text: "Any vineyard within the same district", correct: false }
        - { text: "Vineyards farmed as one unit in one area", correct: true }
        - { text: "Any Western Cape vineyard under contract", correct: false }
        - { text: "Own vineyards plus a bought-in fifth", correct: false }
      explanation: |
        The vineyards may be split into several blocks, but they must be farmed
        together as a single registered unit within one geographical area.

  - id: za-estate-winemaking-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, estate-wine]
    status: reviewed
    source_id: c38-0126
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which production condition applies to a South African Estate Wine?"
      choices:
        - { text: "It must spend two years in oak", correct: false }
        - { text: "It must be a single-variety wine", correct: false }
        - { text: "It must be made on the estate itself", correct: true }
        - { text: "It must be made by a co-operative", correct: false }
      explanation: |
        The grapes must be vinified in the estate's own cellar on the registered unit,
        rather than sent to an outside winery.

  - id: za-estate-brand-range-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, estate-wine]
    status: reviewed
    source_id: c38-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Can a South African producer of Estate Wine also sell non-estate wine under its brand?"
      choices:
        - { text: "No, the brand must stay estate-exclusive", correct: false }
        - { text: "Yes, but under a separate brand name", correct: false }
        - { text: "Yes, under the same brand name", correct: true }
        - { text: "No, unless it registers as a co-operative", correct: false }
      explanation: |
        Since the rules were revised in the early 2000s, "estate" describes a wine
        rather than the whole business, so a top producer can add wines from
        bought-in fruit with a broader Wine of Origin claim.

  - id: za-ipw-scheme-001
    type: mcq
    deck: South Africa
    tags: [south-africa, sustainability, ipw]
    status: reviewed
    source_id: c38-0128
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is Integrated Production of Wine (IPW) in South Africa?"
      choices:
        - { text: "A compulsory organic certification", correct: false }
        - { text: "The body that certifies origin claims", correct: false }
        - { text: "A subsidy for bulk wine exports", correct: false }
        - { text: "A voluntary sustainability scheme", correct: true }
      explanation: |
        Introduced in the late 1990s, it audits both vineyards and cellars on
        matters such as water use, spraying, waste and biodiversity.

  - id: za-latitude-001
    type: mcq
    deck: South Africa
    tags: [south-africa, latitude, climate]
    status: reviewed
    source_id: c38-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Roughly which band of latitude do South Africa's vineyards occupy?"
      choices:
        - { text: "About 17–24° S", correct: false }
        - { text: "About 27–34° S", correct: true }
        - { text: "About 34–41° S", correct: false }
        - { text: "About 40–47° S", correct: false }
      explanation: |
        On latitude alone most of these vineyards would be hot; ocean and mountain
        influences pull many of them back to warm or moderate. Cape Town sits at about 34°
        S, close to Sydney and Santiago.

  - id: za-benguela-001
    type: mcq
    deck: South Africa
    tags: [south-africa, climate, ocean, benguela]
    status: reviewed
    source_id: c38-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which ocean current does most to cool the vineyards of South Africa's Western Cape?"
      choices:
        - { text: "Agulhas Current", correct: false }
        - { text: "Mozambique Current", correct: false }
        - { text: "Benguela Current", correct: true }
        - { text: "Humboldt Current", correct: false }
      explanation: |
        The Agulhas and Mozambique currents bring warm Indian Ocean water down the east
        coast, so they warm rather than cool. The cold water off the Cape's Atlantic shore
        keeps sea temperatures low even in midsummer.

  - id: za-benguela-flow-001
    type: mcq
    deck: South Africa
    tags: [south-africa, climate, ocean, benguela]
    status: reviewed
    source_id: c38-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which way does the cold current along South Africa's Atlantic coast carry its water?"
      choices:
        - { text: "Northward up the west coast", correct: true }
        - { text: "Southward down the west coast", correct: false }
        - { text: "Eastward round the Cape into False Bay", correct: false }
        - { text: "Westward, away from the coast", correct: false }
      explanation: |
        Its water starts in the cold seas towards Antarctica. Offshore winds also push
        surface water away from the coast, so cold deep water wells up to replace it and
        keeps the inshore sea chilly.

  - id: za-cape-doctor-001
    type: mcq
    deck: South Africa
    tags: [south-africa, climate, wind, cape-doctor]
    status: reviewed
    source_id: c38-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the name of the strong, regular summer wind that pushes ocean-cooled air into South Africa's coastal winelands?"
      choices:
        - { text: "Berg wind", correct: false }
        - { text: "Cape Doctor", correct: true }
        - { text: "Fremantle Doctor", correct: false }
        - { text: "Zonda", correct: false }
      explanation: |
        It can take a couple of degrees off vineyard temperatures and dries canopies, which
        lowers fungal disease pressure. A berg wind is the opposite: hot, dry air from the
        interior.

  - id: za-cape-doctor-direction-001
    type: mcq
    deck: South Africa
    tags: [south-africa, climate, wind, cape-doctor]
    status: reviewed
    source_id: c38-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "From which direction does the Cape's strong, regular summer wind usually blow?"
      choices:
        - { text: "North-west", correct: false }
        - { text: "North-east", correct: false }
        - { text: "South-west", correct: false }
        - { text: "South-east", correct: true }
      explanation: |
        It blows mainly from late spring to early autumn, driven by high pressure over the
        South Atlantic. The Cape's rain-bearing winter fronts arrive from the north-west
        instead.

  - id: za-mountain-variety-001
    type: mcq
    deck: South Africa
    tags: [south-africa, mountains, terroir, soil]
    status: reviewed
    source_id: c38-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can two Cape vineyards only a few kilometres apart produce markedly different wines?"
      choices:
        - { text: "Summer rainfall varies sharply from farm to farm", correct: false }
        - { text: "Mountains change altitude, aspect and soil quickly", correct: true }
        - { text: "Spring frost hits the valley floors most years", correct: false }
        - { text: "Hailstorms strike some farms nearly every summer", correct: false }
      explanation: |
        Cape soils switch from weathered granite on the slopes to sandstone-derived sands
        and shale within a single valley, so neighbouring blocks can ripen weeks apart.

  - id: za-slope-aspect-001
    type: mcq
    deck: South Africa
    tags: [south-africa, mountains, aspect]
    status: reviewed
    source_id: c38-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which slope aspect do Cape growers often favour when they want cooler, slower ripening?"
      choices:
        - { text: "North-facing", correct: false }
        - { text: "North-east-facing", correct: false }
        - { text: "South-facing", correct: true }
        - { text: "West-facing", correct: false }
      explanation: |
        South of the equator the midday sun crosses the northern sky, so south-facing slopes
        receive it at a lower angle. West-facing slopes catch the hottest part of the
        afternoon.

  - id: za-mountain-shade-001
    type: mcq
    deck: South Africa
    tags: [south-africa, mountains, climate]
    status: reviewed
    source_id: c38-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On a still summer day, how can a tall Cape mountain cool a vineyard at its foot?"
      choices:
        - { text: "Its snowcap keeps the soil cold into summer", correct: false }
        - { text: "It draws cooling afternoon thunderstorms", correct: false }
        - { text: "Its shadow cuts the hours of direct sun", correct: true }
        - { text: "Its rock face soaks up heat before it reaches vines", correct: false }
      explanation: |
        The effect is strongest when the shade falls in the afternoon, the hottest part of
        the day. Cape summers are dry, and snow on the peaks is a winter event that is gone
        long before harvest.

  - id: za-mountain-wind-001
    type: mcq
    deck: South Africa
    tags: [south-africa, mountains, wind, climate]
    status: reviewed
    source_id: c38-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Near the coast, how do the Cape's mountain ranges add to the cooling effect of the sea?"
      choices:
        - { text: "By triggering regular summer rainfall", correct: false }
        - { text: "By trapping sea fog in the valleys all day", correct: false }
        - { text: "By sending cold air down from summer snow", correct: false }
        - { text: "By channelling sea breezes through the vineyards", correct: true }
      explanation: |
        Gaps and valleys that line up with the prevailing breeze let cool sea air travel
        well inland. The effect fades with distance from the coast.

  - id: za-cabernet-planting-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cabernet-sauvignon, plantings]
    status: reviewed
    source_id: c38-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape has long covered the most vineyard area in South Africa?"
      choices:
        - { text: "Pinotage", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Shiraz", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
      explanation: |
        Thick skins and late ripening suit the long, dry Cape summer, and the grape is
        bottled both on its own and in blends. Rankings shift a little from year to year.

  - id: za-bordeaux-blend-001
