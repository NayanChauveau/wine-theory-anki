        - { text: "Full body, rich spiced berry fruit", correct: true }
        - { text: "Medium body, green leafy notes", correct: false }
        - { text: "Light body, tart sour cherry", correct: false }
      explanation: |
        Kanonkop's Black Label Pinotage, from Simonsberg-Stellenbosch, comes from bush vines
        planted in 1953 and is among the country's most expensive reds.

  - id: za-pinotage-coffee-001
    type: mcq
    deck: South Africa
    tags: [south-africa, pinotage, oak, style]
