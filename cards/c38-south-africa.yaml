        - { text: "Cloud cover from regular summer storms", correct: false }
        - { text: "Cool air draining down from the Karoo", correct: false }
      explanation: |
        The district runs from the coast near Somerset West up into the mountains around the
        town, with the Helderberg overlooking the bay at its southern end.

