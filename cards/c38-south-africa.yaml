    en:
      question: "Besides extended hang time, what can concentrate the sugar in grapes for South African dessert wines?"
      choices:
        - { text: "Noble rot", correct: true }
        - { text: "Grey rot", correct: false }
        - { text: "Sour rot", correct: false }
        - { text: "Powdery mildew", correct: false }
      explanation: |
        South African law has a separate Noble Late Harvest category for wines made from
        botrytis-affected grapes.

  - id: za-viognier-style-001
    type: mcq
    deck: South Africa
    tags: [south-africa, viognier, style]
    status: reviewed
    source_id: c38-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style is typical of South African Viognier?"
      choices:
        - { text: "Rich and perfumed, often lightly oaked", correct: true }
        - { text: "Lean and steely, with no oak", correct: false }
        - { text: "Light and off-dry, with a slight spritz", correct: false }
        - { text: "Crisp and grassy, with green fruit", correct: false }
      explanation: |
        Plantings grew quickly from a tiny base from the late 1990s, though the total area
        stays small. Some producers also co-ferment a little with Shiraz, as in Côte-Rôtie.

  - id: za-swartland-white-blend-001
    type: mcq
