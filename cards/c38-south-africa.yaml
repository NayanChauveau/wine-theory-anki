        - { text: "Grenache", correct: false }
        - { text: "Cinsault", correct: true }
        - { text: "Carignan", correct: false }
      explanation: |
        Abraham Perold made the cross at Stellenbosch in 1925. Cinsault was then known at
        the Cape as Hermitage, hence the name. Pinotage is still rarely planted outside
        South Africa.

