        - { text: "L’automne", correct: false }
        - { text: "L’hiver", correct: true }
      explanation: |
        Comme le reste du sud-ouest du Cap, la zone connaît un régime méditerranéen
        : les fronts froids apportent la pluie en hiver, de mai à août environ,
        tandis que les étés secs limitent les maladies cryptogamiques.

