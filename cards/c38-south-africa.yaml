    en:
      question: "Which province supplies the vast majority of South Africa's wine?"
      choices:
        - { text: "Northern Cape", correct: false }
        - { text: "Eastern Cape", correct: false }
        - { text: "Western Cape", correct: true }
        - { text: "KwaZulu-Natal", correct: false }
      explanation: |
        Most of the country's vineyards lie within a couple of hundred kilometres of Cape
        Town, where the ocean and mountain ranges take the edge off the heat.

  - id: za-coastal-region-001
    type: mcq
    deck: South Africa
    tags: [south-africa, western-cape, wine-of-origin, regions]
    status: reviewed
    source_id: c38-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides the Breede River Valley and the Cape South Coast, which region completes the trio of the Western Cape's main quality regions?"
      choices:
        - { text: "Olifants River", correct: false }
        - { text: "Klein Karoo", correct: false }
        - { text: "Boberg", correct: false }
        - { text: "Coastal Region", correct: true }
      explanation: |
        Klein Karoo and Olifants River are real regions too, but they are better known for
        fortified wines and for bulk volume respectively. Boberg is a small region reserved
        for fortified wines.

  - id: za-orange-river-province-001
    type: mcq
    deck: South Africa
    tags: [south-africa, northern-cape, orange-river, geography]
    status: reviewed
    source_id: c38-0054
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which South African province are the Orange River vineyards?"
      choices:
        - { text: "Western Cape", correct: false }
        - { text: "Northern Cape", correct: true }
        - { text: "Free State", correct: false }
        - { text: "Eastern Cape", correct: false }
      explanation: |
        The vines cluster around towns such as Upington and Kakamas, several hundred
        kilometres north of the Cape winelands. The official area name is Central Orange
        River.

  - id: za-orange-river-climate-001
    type: mcq
    deck: South Africa
    tags: [south-africa, orange-river, climate]
    status: reviewed
    source_id: c38-0055
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description best fits growing conditions along the Orange River?"
      choices:
        - { text: "Very hot, with irrigation essential", correct: true }
        - { text: "Cool, with frequent spring frost", correct: false }
        - { text: "Mild, with reliable summer rain", correct: false }
        - { text: "Cool and foggy, close to the coast", correct: false }
      explanation: |
        Rainfall is too low for vines to survive on their own, so growers draw water
        straight from the river. The long, intense summers ripen grapes quickly.

  - id: za-orange-river-style-001
    type: mcq
    deck: South Africa
    tags: [south-africa, orange-river, style]
    status: reviewed
    source_id: c38-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does the Orange River area mostly produce?"
      choices:
        - { text: "Premium reds for export", correct: false }
        - { text: "Traditional-method sparkling wine", correct: false }
        - { text: "Sweet botrytised Chenin Blanc", correct: false }
        - { text: "Inexpensive whites for the home market", correct: true }
      explanation: |
        Large co-operative cellars handle most of the crop, and little of it is seen on
        shelves abroad.

  - id: za-wo-wider-origin-001
    type: mcq
    deck: South Africa
    tags: [south-africa, wine-of-origin, labelling]
    status: reviewed
    source_id: c38-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A Stellenbosch winery blends its own grapes with fruit bought in Swartland. Which origin may it state on the label?"
      choices:
        - { text: "Stellenbosch", correct: false }
        - { text: "Coastal Region", correct: true }
        - { text: "Swartland", correct: false }
        - { text: "Breede River Valley", correct: false }
      explanation: |
        A named area on a South African origin label requires all the grapes to come from
        inside it. Both districts sit within the same larger region, so naming that region
        keeps the blend legal.

  - id: za-stellenbosch-rainfall-001
    type: mcq
    deck: South Africa
    tags: [south-africa, stellenbosch, climate]
    status: reviewed
    source_id: c38-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which season does Stellenbosch receive most of its rain?"
      choices:
        - { text: "Summer", correct: false }
        - { text: "Spring", correct: false }
        - { text: "Autumn", correct: false }
        - { text: "Winter", correct: true }
      explanation: |
        Like the rest of the south-western Cape, it has a Mediterranean pattern: cold fronts
        bring rain from roughly May to August, while dry summers keep fungal disease in
        check.

  - id: za-stellenbosch-false-bay-001
    type: mcq
    deck: South Africa
    tags: [south-africa, stellenbosch, climate, false-bay]
    status: reviewed
    source_id: c38-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which influence does most to temper summer heat in Stellenbosch's valleys?"
      choices:
        - { text: "Sea breezes off False Bay", correct: true }
