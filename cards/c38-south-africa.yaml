        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chenin Blanc", correct: true }
      explanation: |
        The Cape's first recorded wine was pressed in 1659 under Jan van Riebeeck, and
        Chenin was probably among the early Dutch-era vine imports.
    fr:
      question: "Quel cépage occupe la plus grande surface de vignoble en Afrique du Sud ?"
      choices:
        - { text: "Colombard", correct: false }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chenin Blanc", correct: true }
      explanation: |
        Le premier vin attesté au Cap a été pressé en 1659 sous Jan van Riebeeck,
        et le Chenin figurait sans doute parmi les premières vignes importées à
        l’époque hollandaise.

  - id: za-chenin-trend-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chenin-blanc, plantings]
    status: reviewed
    source_id: c38-0032
    review:
      fact_check: pass
