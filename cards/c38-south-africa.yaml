    en:
      question: "Which description best fits growing conditions along the Orange River?"
      choices:
        - { text: "Very hot, with irrigation essential", correct: true }
        - { text: "Cool, with frequent spring frost", correct: false }
        - { text: "Mild, with reliable summer rain", correct: false }
        - { text: "Cool and foggy, close to the coast", correct: false }
      explanation: |
        Rainfall is too low for vines to survive on their own, so growers draw water
        straight from the river. The long, intense summers ripen grapes quickly.
    fr:
      question: "Quelle description correspond le mieux aux conditions de culture le long du fleuve Orange ?"
      choices:
        - { text: "Très chaud, irrigation indispensable", correct: true }
        - { text: "Frais, gelées de printemps fréquentes", correct: false }
        - { text: "Doux, pluies d’été régulières", correct: false }
        - { text: "Frais et brumeux, près de la côte", correct: false }
      explanation: |
        Il pleut trop peu pour que la vigne survive seule : les viticulteurs pompent
        l’eau directement dans le fleuve. Les étés longs et intenses font mûrir les
        raisins rapidement.

