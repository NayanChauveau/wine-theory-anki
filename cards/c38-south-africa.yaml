      question: "Which aromas mark the Pinotage style made with heavily toasted oak staves?"
      choices:
        - { text: "Red cherry and violet", correct: false }
        - { text: "Mint and eucalyptus", correct: false }
        - { text: "Coffee and dark chocolate", correct: true }
        - { text: "Black pepper and green olive", correct: false }
      explanation: |
        Diemersfontein in Wellington is usually credited with launching this commercial
        style with its 2001 vintage. Staves or chips are cheaper than new barrels.

  - id: za-chenin-planting-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chenin-blanc, plantings]
    status: reviewed
    source_id: c38-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape covers the most vineyard area in South Africa?"
      choices:
        - { text: "Colombard", correct: false }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chenin Blanc", correct: true }
      explanation: |
        The Cape's first recorded wine was pressed in 1659 under Jan van Riebeeck, and
        Chenin was probably among the early Dutch-era vine imports.

  - id: za-chenin-trend-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chenin-blanc, plantings]
    status: reviewed
    source_id: c38-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Since about 1990, how has the vineyard area of Chenin Blanc in South Africa changed?"
      choices:
        - { text: "It has roughly doubled", correct: false }
        - { text: "It has shrunk", correct: true }
        - { text: "It has stayed broadly flat", correct: false }
        - { text: "It has grown steadily", correct: false }
      explanation: |
        Growers uprooted much of it for red and international varieties as export markets
        opened. It once filled close to a third of the national vineyard; the share is now
        just under a fifth.

  - id: za-chenin-everyday-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chenin-blanc, style]
    status: reviewed
    source_id: c38-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits a basic, inexpensive South African Chenin Blanc?"
      choices:
        - { text: "Easy-drinking, with simple stone fruit", correct: true }
        - { text: "Austere, with high acidity and wet wool", correct: false }
        - { text: "Full-bodied, with toasty oak and honey", correct: false }
        - { text: "Off-dry, with lime and petrol notes", correct: false }
      explanation: |
        Large co-operatives in warm inland areas pick at high yields and ferment cool in
        stainless steel to keep the wine fresh and cheap. The grape is also made in styles
        running from dry to sweet.

  - id: za-chenin-old-vines-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chenin-blanc, old-vines]
    status: reviewed
    source_id: c38-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What do old bush vines typically bring to South African Chenin Blanc?"
      choices:
        - { text: "Higher yields and a lighter body", correct: false }
        - { text: "Sharper acidity and lower alcohol", correct: false }
        - { text: "More concentration and a fuller texture", correct: true }
        - { text: "Greener, more herbaceous aromas", correct: false }
      explanation: |
        The Old Vine Project's Certified Heritage Vineyards seal, introduced around 2018,
        marks wines from vines at least 35 years old and shows the planting year on the
        bottle.

  - id: za-chenin-barrel-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chenin-blanc, oak]
    status: reviewed
    source_id: c38-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A premium South African Chenin Blanc is made in oak rather than steel. What does this typically add?"
      choices:
        - { text: "Sharper acidity and green fruit", correct: false }
        - { text: "A lighter body and floral lift", correct: false }
        - { text: "Extra body and toasty notes", correct: true }
        - { text: "Deeper colour and firm tannin", correct: false }
      explanation: |
        Chenin's naturally high acidity keeps a barrel-matured wine from tasting heavy. Lees
        contact in barrel adds a creamy texture.

  - id: za-colombard-brandy-001
    type: mcq
    deck: South Africa
    tags: [south-africa, colombard, brandy]
    status: reviewed
    source_id: c38-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape is grown in South Africa largely to make base wine for brandy?"
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay", correct: false }
        - { text: "Sémillon", correct: false }
        - { text: "Colombard", correct: true }
      explanation: |
        It keeps fresh acidity in hot inland vineyards, which suits a distillation base. It
        also makes cheap, fruity, often off-dry whites and ranks among the country's most
        planted whites.

  - id: za-sb-herbaceous-001
    type: mcq
    deck: South Africa
    tags: [south-africa, sauvignon-blanc, style]
    status: reviewed
    source_id: c38-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which character tends to run through South African Sauvignon Blanc at most price levels?"
      choices:
        - { text: "Smoky, flinty notes", correct: false }
        - { text: "Toasty oak and butter", correct: false }
        - { text: "Herbaceous, green notes", correct: true }
        - { text: "Ripe peach and apricot", correct: false }
      explanation: |
        The green aromas come from methoxypyrazines, the same compounds behind green bell
        pepper in under-ripe Cabernet Sauvignon.

  - id: za-sb-early-pick-001
    type: mcq
    deck: South Africa
    tags: [south-africa, sauvignon-blanc, harvest]
    status: reviewed
    source_id: c38-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In warmer South African sites, how do growers keep Sauvignon Blanc's fresh acidity and green flavours?"
      choices:
        - { text: "By leaving the bunches to hang longer", correct: false }
        - { text: "By stripping leaves around the bunches", correct: false }
        - { text: "By fermenting warm in new oak", correct: false }
        - { text: "By picking earlier", correct: true }
      explanation: |
        Acidity falls and pyrazine aromas fade as the grapes ripen and see sun, so an
        earlier harvest keeps both. Removing leaves exposes the bunches and speeds that
        loss.

  - id: za-chardonnay-site-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chardonnay, site]
    status: reviewed
    source_id: c38-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where are South Africa's finest Chardonnays most likely to be grown?"
      choices:
        - { text: "Warm, sheltered valley floors", correct: false }
        - { text: "Cool, ocean-influenced sites", correct: true }
        - { text: "Hot, irrigated inland plains", correct: false }
        - { text: "Dry, low-rainfall plateaus", correct: false }
      explanation: |
        Slow ripening keeps acidity and lets citrus and stone-fruit flavours build without
        excess alcohol. The best examples can stand beside good white Burgundy.

  - id: za-chardonnay-burgundian-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chardonnay, winemaking]
    status: reviewed
    source_id: c38-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cellar techniques shape the character of South Africa's best Chardonnays?"
      choices:
        - { text: "Carbonic maceration and early bottling", correct: false }
        - { text: "Cool steel fermentation with no MLF", correct: false }
        - { text: "Extended skin contact and amphora ageing", correct: false }
        - { text: "Barrel fermentation and lees stirring", correct: true }
      explanation: |
        Stirring the lees (bâtonnage) puts dead yeast cells back in suspension; they release
        mannoproteins that give a rounder, creamier texture.

  - id: za-hanepoot-001
    type: mcq
