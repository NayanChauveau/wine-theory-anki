    en:
      question: "How are most premium South African red wines matured?"
      choices:
        - { text: "In stainless steel, then bottled young", correct: false }
        - { text: "In concrete tanks, with no oak contact", correct: false }
        - { text: "In oak, with a share of new barrels", correct: true }
        - { text: "In large old casks, with no new oak", correct: false }
      explanation: |
        New barrels give the most toast, vanilla and spice. Mixing new and used barrels lets
        the winemaker set how much oak shows.

  - id: za-pinotage-parents-001
    type: mcq
    deck: South Africa
    tags: [south-africa, pinotage, crossing, cinsault]
    status: reviewed
    source_id: c38-0024
