  - id: za-chenin-barrel-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chenin-blanc, oak]
    status: reviewed
    source_id: c38-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A premium South African Chenin Blanc is made in oak rather than steel. What does this typically add?"
      choices:
        - { text: "Sharper acidity and green fruit", correct: false }
        - { text: "A lighter body and floral lift", correct: false }
        - { text: "Extra body and toasty notes", correct: true }
        - { text: "Deeper colour and firm tannin", correct: false }
      explanation: |
        Chenin's naturally high acidity keeps a barrel-matured wine from tasting heavy. Lees
        contact in barrel adds a creamy texture.
    fr:
      question: "Un Chenin Blanc sud-africain haut de gamme est vinifié en fût plutôt qu’en cuve inox. Qu’est-ce que cela apporte d’ordinaire ?"
      choices:
        - { text: "Une acidité plus vive et des fruits verts", correct: false }
        - { text: "Un corps plus léger et une note florale", correct: false }
        - { text: "Plus de corps et des notes toastées", correct: true }
        - { text: "Une couleur plus soutenue et des tanins fermes", correct: false }
      explanation: |
        L’acidité naturellement élevée du Chenin empêche un vin élevé en fût de
        paraître lourd. Le contact avec les lies en fût apporte une texture crémeuse.

  - id: za-colombard-brandy-001
    type: mcq
    deck: South Africa
    tags: [south-africa, colombard, brandy]
    status: reviewed
    source_id: c38-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape is grown in South Africa largely to make base wine for brandy?"
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay", correct: false }
        - { text: "Sémillon", correct: false }
        - { text: "Colombard", correct: true }
      explanation: |
        It keeps fresh acidity in hot inland vineyards, which suits a distillation base. It
        also makes cheap, fruity, often off-dry whites and ranks among the country's most
        planted whites.
    fr:
      question: "Quel cépage blanc est cultivé en Afrique du Sud surtout pour produire le vin de base du brandy ?"
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay", correct: false }
        - { text: "Sémillon", correct: false }
        - { text: "Colombard", correct: true }
      explanation: |
        Il garde une acidité fraîche dans les vignobles chauds de l’intérieur, ce
        qui convient à une base de distillation. Il donne aussi des blancs fruités,
        bon marché, souvent demi-secs, et compte parmi les blancs les plus plantés
        du pays.

  - id: za-sb-herbaceous-001
    type: mcq
    deck: South Africa
    tags: [south-africa, sauvignon-blanc, style]
    status: reviewed
    source_id: c38-0039
    review:
