      choices:
        - { text: "Des rendements plus élevés et un corps plus léger", correct: false }
        - { text: "Une acidité plus vive et moins d’alcool", correct: false }
        - { text: "Plus de concentration et une texture plus ample", correct: true }
        - { text: "Des arômes plus verts, plus herbacés", correct: false }
      explanation: |
        Le sceau Certified Heritage Vineyards de l’Old Vine Project, lancé vers
        2018, distingue les vins de vignes d’au moins 35 ans et indique l’année de
