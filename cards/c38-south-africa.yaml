    en:
      question: "Swartland's leading white blends usually build on Chenin Blanc with which partner grapes?"
      choices:
        - { text: "Sauvignon Blanc, Semillon and Muscadelle", correct: false }
        - { text: "Roussanne, Grenache Blanc and Viognier", correct: true }
        - { text: "Riesling, Gewurztraminer and Pinot Gris", correct: false }
        - { text: "Colombard, Muscat and Ugni Blanc", correct: false }
      explanation: |
        The Sadie Family's Palladius, first made in the early 2000s, is a well-known
        example: old-vine Chenin layered with southern French white grapes for texture and
        breadth.

  - id: za-western-cape-share-001
    type: mcq
    deck: South Africa
    tags: [south-africa, western-cape, geography]
    status: reviewed
    source_id: c38-0052
