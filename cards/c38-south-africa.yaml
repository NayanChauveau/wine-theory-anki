        - { text: "Merlot and Cabernet Franc", correct: true }
        - { text: "Cinsault and Carignan", correct: false }
        - { text: "Pinot Noir and Gamay", correct: false }
      explanation: |
        Meerlust Rubicon from Stellenbosch, first made around 1980, is a long-standing
        example. Many Cape estates bottle a blend like this alongside a varietal Cabernet.

  - id: za-merlot-style-001
    type: mcq
