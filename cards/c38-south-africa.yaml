      question: "Since about 1990, how has the vineyard area of Chenin Blanc in South Africa changed?"
      choices:
        - { text: "It has roughly doubled", correct: false }
        - { text: "It has shrunk", correct: true }
        - { text: "It has stayed broadly flat", correct: false }
        - { text: "It has grown steadily", correct: false }
      explanation: |
        Growers uprooted much of it for red and international varieties as export markets
        opened. It once filled close to a third of the national vineyard; the share is now
        just under a fifth.
    fr:
      question: "Depuis 1990 environ, comment la surface de Chenin Blanc a-t-elle évolué en Afrique du Sud ?"
      choices:
        - { text: "Elle a à peu près doublé", correct: false }
        - { text: "Elle a diminué", correct: true }
        - { text: "Elle est restée à peu près stable", correct: false }
        - { text: "Elle a progressé régulièrement", correct: false }
      explanation: |
        Avec l’ouverture des marchés d’export, les vignerons en ont arraché une
        grande partie au profit des rouges et des cépages internationaux. Il occupait
        près d’un tiers du vignoble national ; sa part est aujourd’hui d’un peu moins
        d’un cinquième.

  - id: za-chenin-everyday-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chenin-blanc, style]
    status: reviewed
    source_id: c38-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits a basic, inexpensive South African Chenin Blanc?"
      choices:
        - { text: "Easy-drinking, with simple stone fruit", correct: true }
        - { text: "Austere, with high acidity and wet wool", correct: false }
        - { text: "Full-bodied, with toasty oak and honey", correct: false }
        - { text: "Off-dry, with lime and petrol notes", correct: false }
      explanation: |
        Large co-operatives in warm inland areas pick at high yields and ferment cool in
        stainless steel to keep the wine fresh and cheap. The grape is also made in styles
        running from dry to sweet.
    fr:
      question: "Quel profil correspond à un Chenin Blanc sud-africain d’entrée de gamme, bon marché ?"
      choices:
        - { text: "Facile à boire, fruits à noyau simples", correct: true }
        - { text: "Austère, acidité élevée et laine mouillée", correct: false }
        - { text: "Ample, bois toasté et miel", correct: false }
        - { text: "Demi-sec, citron vert et hydrocarbure", correct: false }
      explanation: |
        Les grandes coopératives des zones chaudes de l’intérieur récoltent à hauts
        rendements et fermentent à basse température en cuve inox pour garder un vin
        frais et peu coûteux. Le cépage donne aussi des styles allant du sec au doux.

  - id: za-chenin-old-vines-001
    type: mcq
    deck: South Africa
