        - { text: "The eastern slopes, facing False Bay", correct: true }
        - { text: "The southern tip, close to Cape Point", correct: false }
      explanation: |
        The ward sits on the Cape Peninsula, just south of the city; Constantiaberg rises
        behind the vineyards and False Bay lies a few kilometres east.

