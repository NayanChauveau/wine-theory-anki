cards:
  - id: za-robertson-cooling-001
    type: mcq
    deck: South Africa
    tags: [south-africa, breede-river-valley, robertson, climate]
    status: reviewed
    source_id: c38-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What keeps the Robertson district a little cooler than neighbouring Worcester?"
      choices:
        - { text: "Afternoon breezes off False Bay", correct: false }
        - { text: "Fog from the Benguela Current", correct: false }
        - { text: "South-easterly winds drawn up the valley", correct: true }
        - { text: "Vineyards planted above 500 metres", correct: false }
      explanation: |
        Robertson lies about 100 km inland, so the sea itself is far away; the cool
        air arrives as wind channelled up the valley from the south-east.
        Summers are still hot and dry enough that irrigation remains the norm.
    fr:
      question: "Qu’est-ce qui rend le district de Robertson un peu plus frais que celui de Worcester, son voisin ?"
      choices:
        - { text: "Les brises d’après-midi venues de False Bay", correct: false }
        - { text: "Les brouillards du courant de Benguela", correct: false }
        - { text: "Les vents de sud-est remontant la vallée", correct: true }
        - { text: "Des vignes plantées au-dessus de 500 mètres", correct: false }
      explanation: |
        Robertson est à une centaine de kilomètres à l’intérieur des terres : la mer
        elle-même est loin, et l’air frais arrive avec le vent canalisé par la vallée
        depuis le sud-est. Les étés restent assez chauds et secs pour que l’irrigation
        demeure la règle.

  - id: za-robertson-premium-001
    type: mcq
    deck: South Africa
    tags: [south-africa, breede-river-valley, robertson, syrah, chardonnay]
    status: reviewed
    source_id: c38-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Beyond dependable wine for large brands, which two styles show the Robertson district at its best?"
      choices:
        - { text: "Syrah and full-bodied Chardonnay", correct: true }
        - { text: "Pinot Noir and Riesling", correct: false }
        - { text: "Pinotage and Viognier", correct: false }
        - { text: "Grenache and barrel-aged Sémillon", correct: false }
      explanation: |
        Lime-rich soils are a local asset. De Wetshof, a family estate near the town
        of Robertson, built its name on Chardonnay from the 1980s onward.
    fr:
      question: "Au-delà des vins fiables destinés aux grandes marques, quels deux styles montrent le district de Robertson sous son meilleur jour ?"
      choices:
        - { text: "Syrah et Chardonnay corsé", correct: true }
        - { text: "Pinot Noir et Riesling", correct: false }
        - { text: "Pinotage et Viognier", correct: false }
        - { text: "Grenache et Sémillon élevé en barrique", correct: false }
      explanation: |
        Les sols riches en calcaire sont un atout local. De Wetshof, domaine familial
        proche de la ville de Robertson, a bâti sa réputation sur le Chardonnay à partir
        des années 1980.

  - id: za-cape-south-coast-members-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, geography]
    status: reviewed
    source_id: c38-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Walker Bay, Elgin and Elim all belong to which region?"
      choices:
        - { text: "Coastal Region", correct: false }
        - { text: "Breede River Valley", correct: false }
        - { text: "Cape South Coast", correct: true }
        - { text: "Klein Karoo", correct: false }
      explanation: |
        Its vineyards are scattered along the southern shoreline, some as far east as
        Plettenberg Bay on the Garden Route, so most sites feel the ocean closely.
    fr:
      question: "Walker Bay, Elgin et Elim font partie de quelle région ?"
      choices:
        - { text: "Coastal Region", correct: false }
        - { text: "Breede River Valley", correct: false }
        - { text: "Cape South Coast", correct: true }
        - { text: "Klein Karoo", correct: false }
      explanation: |
        Ses vignobles s’égrènent le long du littoral sud, certains jusqu’à Plettenberg
        Bay, sur la Garden Route, à l’est : la plupart des parcelles ressentent de près
        l’influence de l’océan.

  - id: za-cape-south-coast-oldest-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, walker-bay]
    status: reviewed
    source_id: c38-0109
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Cape South Coast district has the longest modern track record for vineyards?"
      choices:
        - { text: "Elgin", correct: false }
        - { text: "Walker Bay", correct: true }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Plettenberg Bay", correct: false }
      explanation: |
        Its first modern vineyards date from the mid-1970s. Elgin was mainly apple
        country until growers began converting orchards to vines from the late 1980s.
    fr:
      question: "Quel district du Cape South Coast a le plus long historique viticole moderne ?"
      choices:
        - { text: "Elgin", correct: false }
        - { text: "Walker Bay", correct: true }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Plettenberg Bay", correct: false }
      explanation: |
        Ses premières vignes modernes datent du milieu des années 1970. Elgin était
        surtout une terre de vergers de pommiers, jusqu’à ce que les producteurs
        commencent à les remplacer par des vignes à partir de la fin des années 1980.

  - id: za-hemel-en-aarde-district-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, walker-bay, hemel-en-aarde]
    status: reviewed
    source_id: c38-0110
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "The Hemel-en-Aarde wards sit within which district?"
      choices:
        - { text: "Elgin", correct: false }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Walker Bay", correct: true }
      explanation: |
        There are three: Hemel-en-Aarde Valley, Upper Hemel-en-Aarde Valley and
        Hemel-en-Aarde Ridge, rising inland from the coast.
    fr:
      question: "Dans quel district se trouvent les wards de Hemel-en-Aarde ?"
      choices:
        - { text: "Elgin", correct: false }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Walker Bay", correct: true }
      explanation: |
        Ils sont trois : Hemel-en-Aarde Valley, Upper Hemel-en-Aarde Valley et
        Hemel-en-Aarde Ridge, qui s’élèvent de la côte vers l’intérieur des terres.

  - id: za-hemel-en-aarde-grapes-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, hemel-en-aarde, pinot-noir, chardonnay]
    status: reviewed
    source_id: c38-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of grapes has made the Hemel-en-Aarde wards famous?"
      choices:
        - { text: "Chenin Blanc and Pinotage", correct: false }
        - { text: "Pinot Noir and Chardonnay", correct: true }
        - { text: "Cabernet Sauvignon and Merlot", correct: false }
        - { text: "Syrah and Viognier", correct: false }
      explanation: |
        Hamilton Russell Vineyards, founded in the 1970s, set the benchmark; clay-rich,
        stony shale soils and ocean air give tight, mineral wines.
    fr:
      question: "Quel duo de cépages a fait la renommée des wards de Hemel-en-Aarde ?"
      choices:
        - { text: "Chenin Blanc et Pinotage", correct: false }
        - { text: "Pinot Noir et Chardonnay", correct: true }
        - { text: "Cabernet Sauvignon et Merlot", correct: false }
        - { text: "Syrah et Viognier", correct: false }
      explanation: |
        Hamilton Russell Vineyards, fondé dans les années 1970, a servi de référence ;
        des sols caillouteux de schiste argileux et l’air océanique donnent des vins
        tendus et minéraux.

  - id: za-hemel-en-aarde-other-grapes-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, hemel-en-aarde]
    status: reviewed
    source_id: c38-0112
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Beyond the varieties that built their name, which trio also succeeds in the Hemel-en-Aarde wards?"
      choices:
        - { text: "Chenin Blanc, Cinsault and Tinta Barocca", correct: false }
        - { text: "Colombard, Ruby Cabernet and Muscat", correct: false }
        - { text: "Sauvignon Blanc, Merlot and Syrah", correct: true }
        - { text: "Viognier, Grenache and Mourvèdre", correct: false }
      explanation: |
        Cool sites near the coast keep Sauvignon Blanc fresh, while warmer, more
        sheltered slopes can ripen Merlot and Syrah.
    fr:
      question: "Outre les cépages qui ont fait leur nom, quel trio réussit aussi dans les wards de Hemel-en-Aarde ?"
      choices:
        - { text: "Chenin Blanc, Cinsault et Tinta Barocca", correct: false }
        - { text: "Colombard, Ruby Cabernet et Muscat", correct: false }
        - { text: "Sauvignon Blanc, Merlot et Syrah", correct: true }
        - { text: "Viognier, Grenache et Mourvèdre", correct: false }
      explanation: |
        Les parcelles fraîches proches de la côte préservent la vivacité du Sauvignon
        Blanc, tandis que des coteaux plus chauds et mieux abrités peuvent mener le
        Merlot et la Syrah à maturité.

  - id: za-elgin-location-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elgin, geography]
    status: reviewed
    source_id: c38-0113
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Cape South Coast district lies just north-west of Walker Bay?"
      choices:
        - { text: "Elgin", correct: true }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Plettenberg Bay", correct: false }
      explanation: |
        It sits over Sir Lowry's Pass from Somerset West, roughly an hour's drive from
        Cape Town, which made it an easy source of cool-climate fruit for city cellars.
    fr:
      question: "Quel district du Cape South Coast se trouve juste au nord-ouest de Walker Bay ?"
      choices:
        - { text: "Elgin", correct: true }
        - { text: "Cape Agulhas", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Plettenberg Bay", correct: false }
      explanation: |
        Elgin s’étend passé le Sir Lowry’s Pass, en venant de Somerset West, à environ
        une heure de route du Cap : une source commode de raisins de climat frais pour
        les caves de la ville.

  - id: za-elgin-cooling-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elgin, climate]
    status: reviewed
    source_id: c38-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the key cooling factor in Elgin's vineyards?"
      choices:
        - { text: "Fog from the cold west-coast current", correct: false }
        - { text: "Altitude of its upland basin", correct: true }
        - { text: "Breezes funnelled in from Table Bay", correct: false }
        - { text: "Cool, moisture-holding clay soils", correct: false }
      explanation: |
        Most vineyards lie at roughly 200–400 m on a plateau ringed by mountains, so
        nights are cold. Ocean air from False Bay, some 15 km away, helps further.
    fr:
      question: "Quel est le principal facteur de fraîcheur des vignobles d’Elgin ?"
      choices:
        - { text: "Le brouillard du courant froid de la côte ouest", correct: false }
        - { text: "L’altitude de son bassin perché", correct: true }
        - { text: "Les brises canalisées depuis la baie de la Table", correct: false }
        - { text: "Des sols argileux frais qui retiennent l’eau", correct: false }
      explanation: |
        La plupart des vignes sont plantées vers 200–400 m sur un plateau cerné de
        montagnes, d’où des nuits froides. L’air marin venu de False Bay, à une
        quinzaine de kilomètres, renforce encore l’effet.

  - id: za-elgin-reputation-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elgin, sauvignon-blanc]
    status: reviewed
    source_id: c38-0115
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style has given the Elgin district its strongest reputation?"
      choices:
        - { text: "Rich, barrel-fermented Chenin Blanc", correct: false }
        - { text: "Perfumed, oily Viognier", correct: false }
        - { text: "Intense, fresh Sauvignon Blanc", correct: true }
        - { text: "Honeyed, waxy Sémillon", correct: false }
      explanation: |
        Long, cool ripening keeps acidity high and preserves pyrazine-driven green
        notes alongside riper passion-fruit aromas.
    fr:
      question: "Quel style a valu au district d’Elgin sa plus solide réputation ?"
      choices:
        - { text: "Chenin Blanc riche, fermenté en barrique", correct: false }
        - { text: "Viognier parfumé et gras", correct: false }
        - { text: "Sauvignon Blanc intense et vif", correct: true }
        - { text: "Sémillon miellé et cireux", correct: false }
      explanation: |
        Une maturation longue et fraîche maintient une acidité élevée et préserve les
        notes vertes dues aux pyrazines, aux côtés d’arômes plus mûrs de fruit de la
        passion.

  - id: za-elgin-other-grapes-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elgin]
    status: reviewed
    source_id: c38-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Apart from its signature white, which trio of varieties is showing promise in Elgin?"
      choices:
        - { text: "Pinotage, Cinsault and Chenin Blanc", correct: false }
        - { text: "Pinot Noir, Chardonnay and Syrah", correct: true }
        - { text: "Grenache, Carignan and Roussanne", correct: false }
        - { text: "Tempranillo, Touriga Nacional and Verdelho", correct: false }
      explanation: |
        Paul Cluver, one of the first wine estates in the area, is known for its
        Pinot Noir and Chardonnay; cool-climate Syrah from the district tends toward
        peppery, medium-bodied styles.
    fr:
      question: "Outre son blanc emblématique, quel trio de cépages se montre prometteur à Elgin ?"
      choices:
        - { text: "Pinotage, Cinsault et Chenin Blanc", correct: false }
        - { text: "Pinot Noir, Chardonnay et Syrah", correct: true }
        - { text: "Grenache, Carignan et Roussanne", correct: false }
        - { text: "Tempranillo, Touriga Nacional et Verdelho", correct: false }
      explanation: |
        Paul Cluver, l’un des premiers domaines viticoles du secteur, est réputé pour
        son Pinot Noir et son Chardonnay ; la Syrah de climat frais du district tend
        vers des styles poivrés, de corps moyen.

  - id: za-elim-district-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elim, geography]
    status: reviewed
    source_id: c38-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "The Elim ward belongs to which district?"
      choices:
        - { text: "Walker Bay", correct: false }
        - { text: "Elgin", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Cape Agulhas", correct: true }
      explanation: |
        Elim takes its name from a 19th-century Moravian mission village. The flat,
        wind-swept land lies only a few kilometres from the sea, south-east of
        Walker Bay.
    fr:
      question: "À quel district appartient le ward d’Elim ?"
      choices:
        - { text: "Walker Bay", correct: false }
        - { text: "Elgin", correct: false }
        - { text: "Swellendam", correct: false }
        - { text: "Cape Agulhas", correct: true }
      explanation: |
        Elim doit son nom à un village de mission morave du XIXe siècle. Ces terres
        plates, balayées par le vent, ne sont qu’à quelques kilomètres de la mer, au
        sud-est de Walker Bay.

  - id: za-elim-style-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cape-south-coast, elim, sauvignon-blanc]
    status: reviewed
    source_id: c38-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style of Sauvignon Blanc is the Elim ward best known for?"
      choices:
        - { text: "Ripe and tropical", correct: false }
        - { text: "Pungent and herbaceous", correct: true }
        - { text: "Flinty and barrel-fermented", correct: false }
        - { text: "Soft, light and neutral", correct: false }
      explanation: |
        Strong, near-constant sea winds slow ripening and keep berries small, which
        concentrates green, grassy flavours. Syrah is a newer success here too.
    fr:
      question: "Pour quel style de Sauvignon Blanc le ward d’Elim est-il surtout connu ?"
      choices:
        - { text: "Mûr et tropical", correct: false }
        - { text: "Intense et herbacé", correct: true }
        - { text: "Fumé et fermenté en barrique", correct: false }
        - { text: "Souple, léger et neutre", correct: false }
      explanation: |
        Des vents marins forts et presque constants ralentissent la maturation et
        gardent les baies petites, ce qui concentre les arômes verts et herbacés. La
        Syrah y réussit aussi depuis peu.

  - id: za-wine-of-origin-name-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin]
    status: reviewed
    source_id: c38-0119
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which official scheme certifies origin claims on South African wine labels?"
      choices:
        - { text: "Vintners Quality Alliance (VQA)", correct: false }
        - { text: "Denominación de Origen (DO)", correct: false }
        - { text: "Wine of Origin (WO)", correct: true }
        - { text: "Geographical Indication (GI) register", correct: false }
      explanation: |
        The scheme dates from 1973. Besides origin, it governs claims about vintage
        and grape variety, which must be met by a minimum share of the blend.
    fr:
      question: "Quel système officiel certifie les mentions d’origine sur les étiquettes des vins sud-africains ?"
      choices:
        - { text: "Vintners Quality Alliance (VQA)", correct: false }
        - { text: "Denominación de Origen (DO)", correct: false }
        - { text: "Wine of Origin (WO)", correct: true }
        - { text: "Registre des indications géographiques (IG)", correct: false }
      explanation: |
        Le système date de 1973. Outre l’origine, il encadre les mentions de millésime
        et de cépage, qui exigent chacune une part minimale du vin.

  - id: za-wo-seal-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin]
    status: reviewed
    source_id: c38-0120
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What extra mark appears on a South African bottle certified under the Wine of Origin scheme?"
      choices:
        - { text: "A capsule colour-coded by region", correct: false }
        - { text: "A government quality score", correct: false }
        - { text: "A numbered certification seal", correct: true }
        - { text: "A neck label naming the soil type", correct: false }
      explanation: |
        Each seal carries a unique number, so the origin, vintage and variety claims
        checked by the certifying body can be traced back to a specific batch.
    fr:
      question: "Quel signe supplémentaire figure sur une bouteille sud-africaine certifiée par le système Wine of Origin ?"
      choices:
        - { text: "Une capsule dont la couleur indique la région", correct: false }
        - { text: "Une note de qualité attribuée par l’État", correct: false }
        - { text: "Un sceau de certification numéroté", correct: true }
        - { text: "Une collerette indiquant le type de sol", correct: false }
      explanation: |
        Chaque sceau porte un numéro unique : les mentions d’origine, de millésime et de
        cépage vérifiées par l’organisme certificateur peuvent ainsi être rattachées à
        un lot précis.

  - id: za-wo-smallest-tier-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin]
    status: reviewed
    source_id: c38-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which is the smallest of the four tiers of production area in the Wine of Origin scheme?"
      choices:
        - { text: "District", correct: false }
        - { text: "Ward", correct: true }
        - { text: "Region", correct: false }
        - { text: "Geographical unit", correct: false }
      explanation: |
        Each tier nests inside a larger one; Simonsberg-Stellenbosch, for example, is a
        smaller named area within the Stellenbosch district. A few small areas are not
        attached to any district at all.
    fr:
      question: "Quel est le plus petit des quatre niveaux d’aire de production du système Wine of Origin ?"
      choices:
        - { text: "District", correct: false }
        - { text: "Ward", correct: true }
        - { text: "Region", correct: false }
        - { text: "Geographical Unit", correct: false }
      explanation: |
        Chaque niveau s’emboîte dans un niveau plus large ; Simonsberg-Stellenbosch, par
        exemple, est une aire nommée plus petite au sein du district de Stellenbosch.
        Quelques petites aires ne sont rattachées à aucun district.

  - id: za-western-cape-tier-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin, western-cape]
    status: reviewed
    source_id: c38-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At which tier of the Wine of Origin scheme does the Western Cape sit?"
      choices:
        - { text: "Geographical unit", correct: true }
        - { text: "Region", correct: false }
        - { text: "District", correct: false }
        - { text: "Ward", correct: false }
      explanation: |
        This top tier broadly follows provincial borders. Other geographical units
        include Eastern Cape and KwaZulu-Natal.
    fr:
      question: "À quel niveau du système Wine of Origin se situe le Western Cape ?"
      choices:
        - { text: "Geographical Unit", correct: true }
        - { text: "Region", correct: false }
        - { text: "District", correct: false }
        - { text: "Ward", correct: false }
      explanation: |
        Ce niveau supérieur suit à peu près les limites des provinces. Eastern Cape et
        KwaZulu-Natal sont d’autres Geographical Units.

  - id: za-region-boundaries-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, wine-of-origin]
    status: reviewed
    source_id: c38-0124
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the Wine of Origin scheme, what do region and district boundaries tend to follow?"
      choices:
        - { text: "Provincial and municipal borders", correct: false }
        - { text: "Major landforms such as river valleys", correct: true }
        - { text: "Mapped zones of a single soil type", correct: false }
        - { text: "Lines of equal summer temperature", correct: false }
      explanation: |
        Names make the point: Breede River Valley and Olifants River are both
        regions traced along a river system rather than a political line.
    fr:
      question: "Dans le système Wine of Origin, sur quoi s’appuient d’ordinaire les limites des régions et des districts ?"
      choices:
        - { text: "Les frontières provinciales et municipales", correct: false }
        - { text: "Les grands reliefs comme les vallées fluviales", correct: true }
        - { text: "Des zones cartographiées d’un seul type de sol", correct: false }
        - { text: "Des lignes d’égale température estivale", correct: false }
      explanation: |
        Les noms le disent : Breede River Valley et Olifants River sont deux régions
        tracées le long d’un réseau fluvial plutôt que d’une frontière politique.

  - id: za-estate-grapes-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, estate-wine]
    status: reviewed
    source_id: c38-0126
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where must the grapes for a South African Estate Wine come from?"
      choices:
        - { text: "Any vineyard within the same district", correct: false }
        - { text: "Vineyards farmed as one unit in one area", correct: true }
        - { text: "Any Western Cape vineyard under contract", correct: false }
        - { text: "Own vineyards plus a bought-in fifth", correct: false }
      explanation: |
        The vineyards may be split into several blocks, but they must be farmed
        together as a single registered unit within one geographical area.
    fr:
      question: "D’où doivent provenir les raisins d’un Estate Wine sud-africain ?"
      choices:
        - { text: "De n’importe quelle vigne située dans le même district", correct: false }
        - { text: "De vignes gérées en une seule unité, dans une même aire", correct: true }
        - { text: "De toute vigne du Western Cape liée par contrat", correct: false }
        - { text: "Des vignes du domaine, plus un cinquième de raisins achetés", correct: false }
      explanation: |
        Les vignes peuvent être réparties en plusieurs blocs, mais elles doivent être
        exploitées ensemble comme une seule unité enregistrée, dans une même aire
        géographique.

  - id: za-estate-winemaking-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, estate-wine]
    status: reviewed
    source_id: c38-0126
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which production condition applies to a South African Estate Wine?"
      choices:
        - { text: "It must spend two years in oak", correct: false }
        - { text: "It must be a single-variety wine", correct: false }
        - { text: "It must be made on the estate itself", correct: true }
        - { text: "It must be made by a co-operative", correct: false }
      explanation: |
        The grapes must be vinified in the estate's own cellar on the registered unit,
        rather than sent to an outside winery.
    fr:
      question: "Quelle condition de production s’applique à un Estate Wine sud-africain ?"
      choices:
        - { text: "Il doit passer deux ans en fût de chêne", correct: false }
        - { text: "Il doit être issu d’un seul cépage", correct: false }
        - { text: "Il doit être vinifié sur le domaine même", correct: true }
        - { text: "Il doit être élaboré par une coopérative", correct: false }
      explanation: |
        Les raisins doivent être vinifiés dans le chai propre au domaine, sur l’unité
        enregistrée, et non confiés à une cave extérieure.

  - id: za-estate-brand-range-001
    type: mcq
    deck: South Africa
    tags: [south-africa, labelling, estate-wine]
    status: reviewed
    source_id: c38-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Can a South African producer of Estate Wine also sell non-estate wine under its brand?"
      choices:
        - { text: "No, the brand must stay estate-exclusive", correct: false }
        - { text: "Yes, but under a separate brand name", correct: false }
        - { text: "Yes, under the same brand name", correct: true }
        - { text: "No, unless it registers as a co-operative", correct: false }
      explanation: |
        Since the rules were revised in the early 2000s, "estate" describes a wine
        rather than the whole business, so a top producer can add wines from
        bought-in fruit with a broader Wine of Origin claim.
    fr:
      question: "Un producteur sud-africain d’Estate Wine peut-il aussi vendre, sous sa marque, des vins qui ne sont pas des Estate Wines ?"
      choices:
        - { text: "Non, la marque doit rester réservée à l’Estate Wine", correct: false }
        - { text: "Oui, mais sous un autre nom de marque", correct: false }
        - { text: "Oui, sous le même nom de marque", correct: true }
        - { text: "Non, sauf à s’enregistrer comme coopérative", correct: false }
      explanation: |
        Depuis la révision des règles au début des années 2000, le terme « estate »
        qualifie un vin et non l’entreprise entière : un grand producteur peut donc
        ajouter des vins de raisins achetés, avec une mention Wine of Origin plus large.

  - id: za-ipw-scheme-001
    type: mcq
    deck: South Africa
    tags: [south-africa, sustainability, ipw]
    status: reviewed
    source_id: c38-0128
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is Integrated Production of Wine (IPW) in South Africa?"
      choices:
        - { text: "A compulsory organic certification", correct: false }
        - { text: "The body that certifies origin claims", correct: false }
        - { text: "A subsidy for bulk wine exports", correct: false }
        - { text: "A voluntary sustainability scheme", correct: true }
      explanation: |
        Introduced in the late 1990s, it audits both vineyards and cellars on
        matters such as water use, spraying, waste and biodiversity.
    fr:
      question: "Qu’est-ce que l’Integrated Production of Wine (IPW) en Afrique du Sud ?"
      choices:
        - { text: "Une certification bio obligatoire", correct: false }
        - { text: "L’organisme qui certifie les mentions d’origine", correct: false }
        - { text: "Une aide aux exportations de vin en vrac", correct: false }
        - { text: "Un programme volontaire de durabilité", correct: true }
      explanation: |
        Lancé à la fin des années 1990, il contrôle aussi bien les vignobles que les
        chais sur des points tels que l’usage de l’eau, les traitements, les déchets et
        la biodiversité.

  - id: za-latitude-001
    type: mcq
    deck: South Africa
    tags: [south-africa, latitude, climate]
    status: reviewed
    source_id: c38-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Roughly which band of latitude do South Africa's vineyards occupy?"
      choices:
        - { text: "About 17–24° S", correct: false }
        - { text: "About 27–34° S", correct: true }
        - { text: "About 34–41° S", correct: false }
        - { text: "About 40–47° S", correct: false }
      explanation: |
        On latitude alone most of these vineyards would be hot; ocean and mountain
        influences pull many of them back to warm or moderate. Cape Town sits at about 34°
        S, close to Sydney and Santiago.
    fr:
      question: "Dans quelle bande de latitude se situent à peu près les vignobles d’Afrique du Sud ?"
      choices:
        - { text: "Environ 17–24° S", correct: false }
        - { text: "Environ 27–34° S", correct: true }
        - { text: "Environ 34–41° S", correct: false }
        - { text: "Environ 40–47° S", correct: false }
      explanation: |
        À la seule latitude, la plupart de ces vignobles seraient très chauds ; l’océan
        et les montagnes en ramènent beaucoup à un climat chaud ou modéré. Le Cap se
        trouve vers 34° S, à peu près comme Sydney et Santiago.

  - id: za-benguela-001
    type: mcq
    deck: South Africa
    tags: [south-africa, climate, ocean, benguela]
    status: reviewed
    source_id: c38-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which ocean current does most to cool the vineyards of South Africa's Western Cape?"
      choices:
        - { text: "Agulhas Current", correct: false }
        - { text: "Mozambique Current", correct: false }
        - { text: "Benguela Current", correct: true }
        - { text: "Humboldt Current", correct: false }
      explanation: |
        The Agulhas and Mozambique currents bring warm Indian Ocean water down the east
        coast, so they warm rather than cool. The cold water off the Cape's Atlantic shore
        keeps sea temperatures low even in midsummer.
    fr:
      question: "Quel courant océanique rafraîchit le plus les vignobles du Western Cape, en Afrique du Sud ?"
      choices:
        - { text: "Courant des Aiguilles", correct: false }
        - { text: "Courant du Mozambique", correct: false }
        - { text: "Courant de Benguela", correct: true }
        - { text: "Courant de Humboldt", correct: false }
      explanation: |
        Les courants des Aiguilles et du Mozambique amènent les eaux chaudes de l’océan
        Indien le long de la côte est : ils réchauffent au lieu de rafraîchir. L’eau
        froide qui baigne la côte atlantique du Cap garde la mer fraîche même au cœur de
        l’été.

  - id: za-benguela-flow-001
    type: mcq
    deck: South Africa
    tags: [south-africa, climate, ocean, benguela]
    status: reviewed
    source_id: c38-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which way does the cold current along South Africa's Atlantic coast carry its water?"
      choices:
        - { text: "Northward up the west coast", correct: true }
        - { text: "Southward down the west coast", correct: false }
        - { text: "Eastward round the Cape into False Bay", correct: false }
        - { text: "Westward, away from the coast", correct: false }
      explanation: |
        Its water starts in the cold seas towards Antarctica. Offshore winds also push
        surface water away from the coast, so cold deep water wells up to replace it and
        keeps the inshore sea chilly.
    fr:
      question: "Dans quel sens le courant froid qui longe la côte atlantique de l’Afrique du Sud porte-t-il ses eaux ?"
      choices:
        - { text: "Vers le nord, en remontant la côte ouest", correct: true }
        - { text: "Vers le sud, en descendant la côte ouest", correct: false }
        - { text: "Vers l’est, en contournant le Cap jusqu’à False Bay", correct: false }
        - { text: "Vers l’ouest, en s’éloignant de la côte", correct: false }
      explanation: |
        Ses eaux viennent des mers froides proches de l’Antarctique. Les vents de terre
        poussent aussi l’eau de surface vers le large ; de l’eau froide profonde remonte
        alors la remplacer, ce qui garde la mer côtière fraîche.

  - id: za-cape-doctor-001
    type: mcq
    deck: South Africa
    tags: [south-africa, climate, wind, cape-doctor]
    status: reviewed
    source_id: c38-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the name of the strong, regular summer wind that pushes ocean-cooled air into South Africa's coastal winelands?"
      choices:
        - { text: "Berg wind", correct: false }
        - { text: "Cape Doctor", correct: true }
        - { text: "Fremantle Doctor", correct: false }
        - { text: "Zonda", correct: false }
      explanation: |
        It can take a couple of degrees off vineyard temperatures and dries canopies, which
        lowers fungal disease pressure. A berg wind is the opposite: hot, dry air from the
        interior.
    fr:
      question: "Comment s’appelle le vent d’été fort et régulier qui pousse l’air rafraîchi par l’océan vers les vignobles côtiers d’Afrique du Sud ?"
      choices:
        - { text: "Berg wind", correct: false }
        - { text: "Cape Doctor", correct: true }
        - { text: "Fremantle Doctor", correct: false }
        - { text: "Zonda", correct: false }
      explanation: |
        Il peut faire baisser d’un ou deux degrés la température des vignes et assèche
        le feuillage, ce qui réduit la pression des maladies cryptogamiques. Le berg
        wind est tout l’inverse : un air chaud et sec venu de l’intérieur des terres.

  - id: za-cape-doctor-direction-001
    type: mcq
    deck: South Africa
    tags: [south-africa, climate, wind, cape-doctor]
    status: reviewed
    source_id: c38-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "From which direction does the Cape's strong, regular summer wind usually blow?"
      choices:
        - { text: "North-west", correct: false }
        - { text: "North-east", correct: false }
        - { text: "South-west", correct: false }
        - { text: "South-east", correct: true }
      explanation: |
        It blows mainly from late spring to early autumn, driven by high pressure over the
        South Atlantic. The Cape's rain-bearing winter fronts arrive from the north-west
        instead.
    fr:
      question: "De quelle direction souffle d’ordinaire le vent d’été fort et régulier du Cap ?"
      choices:
        - { text: "Nord-ouest", correct: false }
        - { text: "Nord-est", correct: false }
        - { text: "Sud-ouest", correct: false }
        - { text: "Sud-est", correct: true }
      explanation: |
        Il souffle surtout de la fin du printemps au début de l’automne, poussé par les
        hautes pressions de l’Atlantique Sud. Les fronts pluvieux de l’hiver arrivent au
        contraire du nord-ouest.

  - id: za-mountain-variety-001
    type: mcq
    deck: South Africa
    tags: [south-africa, mountains, terroir, soil]
    status: reviewed
    source_id: c38-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can two Cape vineyards only a few kilometres apart produce markedly different wines?"
      choices:
        - { text: "Summer rainfall varies sharply from farm to farm", correct: false }
        - { text: "Mountains change altitude, aspect and soil quickly", correct: true }
        - { text: "Spring frost hits the valley floors most years", correct: false }
        - { text: "Hailstorms strike some farms nearly every summer", correct: false }
      explanation: |
        Cape soils switch from weathered granite on the slopes to sandstone-derived sands
        and shale within a single valley, so neighbouring blocks can ripen weeks apart.
    fr:
      question: "Pourquoi deux vignobles du Cap distants de quelques kilomètres peuvent-ils donner des vins très différents ?"
      choices:
        - { text: "La pluie d’été varie fortement d’un domaine à l’autre", correct: false }
        - { text: "Les montagnes font vite varier altitude, exposition et sol", correct: true }
        - { text: "Le gel de printemps touche les fonds de vallée la plupart des années", correct: false }
        - { text: "La grêle frappe certains domaines presque chaque été", correct: false }
      explanation: |
        Dans une même vallée, les sols passent du granite altéré des pentes aux sables
        issus du grès et aux schistes : des parcelles voisines peuvent mûrir à plusieurs
        semaines d’écart.

  - id: za-slope-aspect-001
    type: mcq
    deck: South Africa
    tags: [south-africa, mountains, aspect]
    status: reviewed
    source_id: c38-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which slope aspect do Cape growers often favour when they want cooler, slower ripening?"
      choices:
        - { text: "North-facing", correct: false }
        - { text: "North-east-facing", correct: false }
        - { text: "South-facing", correct: true }
        - { text: "West-facing", correct: false }
      explanation: |
        South of the equator the midday sun crosses the northern sky, so south-facing slopes
        receive it at a lower angle. West-facing slopes catch the hottest part of the
        afternoon.
    fr:
      question: "Quelle exposition les vignerons du Cap privilégient-ils souvent pour obtenir une maturation plus fraîche et plus lente ?"
      choices:
        - { text: "Exposition nord", correct: false }
        - { text: "Exposition nord-est", correct: false }
        - { text: "Exposition sud", correct: true }
        - { text: "Exposition ouest", correct: false }
      explanation: |
        Au sud de l’équateur, le soleil de midi passe dans la partie nord du ciel : les
        pentes exposées au sud le reçoivent sous un angle plus rasant. Les pentes
        exposées à l’ouest prennent le plus chaud de l’après-midi.

  - id: za-mountain-shade-001
    type: mcq
    deck: South Africa
    tags: [south-africa, mountains, climate]
    status: reviewed
    source_id: c38-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On a still summer day, how can a tall Cape mountain cool a vineyard at its foot?"
      choices:
        - { text: "Its snowcap keeps the soil cold into summer", correct: false }
        - { text: "It draws cooling afternoon thunderstorms", correct: false }
        - { text: "Its shadow cuts the hours of direct sun", correct: true }
        - { text: "Its rock face soaks up heat before it reaches vines", correct: false }
      explanation: |
        The effect is strongest when the shade falls in the afternoon, the hottest part of
        the day. Cape summers are dry, and snow on the peaks is a winter event that is gone
        long before harvest.
    fr:
      question: "Par une journée d’été sans vent, comment une haute montagne du Cap peut-elle rafraîchir une vigne à son pied ?"
      choices:
        - { text: "Sa neige garde le sol froid jusqu’en été", correct: false }
        - { text: "Elle attire des orages rafraîchissants l’après-midi", correct: false }
        - { text: "Son ombre réduit les heures de soleil direct", correct: true }
        - { text: "Sa paroi rocheuse absorbe la chaleur avant les vignes", correct: false }
      explanation: |
        L’effet est maximal quand l’ombre tombe l’après-midi, au plus chaud de la
        journée. Les étés du Cap sont secs, et la neige des sommets est un phénomène
        hivernal, disparu bien avant les vendanges.

  - id: za-mountain-wind-001
    type: mcq
    deck: South Africa
    tags: [south-africa, mountains, wind, climate]
    status: reviewed
    source_id: c38-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Near the coast, how do the Cape's mountain ranges add to the cooling effect of the sea?"
      choices:
        - { text: "By triggering regular summer rainfall", correct: false }
        - { text: "By trapping sea fog in the valleys all day", correct: false }
        - { text: "By sending cold air down from summer snow", correct: false }
        - { text: "By channelling sea breezes through the vineyards", correct: true }
      explanation: |
        Gaps and valleys that line up with the prevailing breeze let cool sea air travel
        well inland. The effect fades with distance from the coast.
    fr:
      question: "Près de la côte, comment les chaînes de montagnes du Cap renforcent-elles l’effet rafraîchissant de l’océan ?"
      choices:
        - { text: "En déclenchant des pluies d’été régulières", correct: false }
        - { text: "En retenant le brouillard marin dans les vallées toute la journée", correct: false }
        - { text: "En faisant descendre l’air froid des neiges d’été", correct: false }
        - { text: "En canalisant les brises marines à travers le vignoble", correct: true }
      explanation: |
        Les cols et les vallées orientés dans le sens du vent dominant laissent
        l’air marin frais pénétrer loin dans les terres. L’effet s’estompe à mesure
        qu’on s’éloigne de la côte.

  - id: za-cabernet-planting-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cabernet-sauvignon, plantings]
    status: reviewed
    source_id: c38-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape has long covered the most vineyard area in South Africa?"
      choices:
        - { text: "Pinotage", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Shiraz", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
      explanation: |
        Thick skins and late ripening suit the long, dry Cape summer, and the grape is
        bottled both on its own and in blends. Rankings shift a little from year to year.
    fr:
      question: "Quel cépage noir occupe depuis longtemps la plus grande surface de vignoble en Afrique du Sud ?"
      choices:
        - { text: "Pinotage", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Shiraz", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
      explanation: |
        Sa peau épaisse et sa maturité tardive conviennent au long été sec du Cap ;
        il est mis en bouteille seul comme en assemblage. Le classement des cépages
        bouge un peu d’une année à l’autre.

  - id: za-bordeaux-blend-001
    type: mcq
    deck: South Africa
    tags: [south-africa, cabernet-sauvignon, blends, stellenbosch]
    status: reviewed
    source_id: c38-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which partner grapes most often join Cabernet Sauvignon in South Africa's premium red blends?"
      choices:
        - { text: "Shiraz and Grenache", correct: false }
        - { text: "Merlot and Cabernet Franc", correct: true }
        - { text: "Cinsault and Carignan", correct: false }
        - { text: "Pinot Noir and Gamay", correct: false }
      explanation: |
        Meerlust Rubicon from Stellenbosch, first made around 1980, is a long-standing
        example. Many Cape estates bottle a blend like this alongside a varietal Cabernet.
    fr:
      question: "Quels cépages accompagnent le plus souvent le Cabernet Sauvignon dans les assemblages rouges haut de gamme d’Afrique du Sud ?"
      choices:
        - { text: "Shiraz et Grenache", correct: false }
        - { text: "Merlot et Cabernet Franc", correct: true }
        - { text: "Cinsault et Carignan", correct: false }
        - { text: "Pinot Noir et Gamay", correct: false }
      explanation: |
        Le Rubicon de Meerlust, à Stellenbosch, produit pour la première fois vers
        1980, en est un exemple ancien. Beaucoup de domaines du Cap proposent un tel
        assemblage à côté d’un Cabernet en monocépage.

  - id: za-merlot-style-001
    type: mcq
    deck: South Africa
    tags: [south-africa, merlot, style]
    status: reviewed
    source_id: c38-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best fits a typical South African Merlot from a warm site?"
      choices:
        - { text: "Full body with ripe plum fruit", correct: true }
        - { text: "Light body with tart red cherry", correct: false }
        - { text: "Medium body with green, leafy notes", correct: false }
        - { text: "Full body with black pepper and smoked meat", correct: false }
      explanation: |
        For years leafroll virus, widespread in older Cape vineyards, slowed ripening and
        was blamed for green, under-ripe reds. Cleaner plant material since the 1990s has
        eased the problem.
    fr:
      question: "Quel profil correspond le mieux à un Merlot sud-africain typique issu d’un site chaud ?"
      choices:
        - { text: "Corps ample, prune mûre", correct: true }
        - { text: "Corps léger, cerise rouge acidulée", correct: false }
        - { text: "Corps moyen, notes vertes et feuillues", correct: false }
        - { text: "Corps ample, poivre noir et viande fumée", correct: false }
      explanation: |
        Pendant des années, le virus de l’enroulement, répandu dans les vieilles
        vignes du Cap, a freiné la maturation et a été accusé de donner des rouges
        verts et peu mûrs. Un matériel végétal plus sain depuis les années 1990 a
        atténué le problème.

  - id: za-shiraz-planting-001
    type: mcq
    deck: South Africa
    tags: [south-africa, shiraz, syrah, plantings]
    status: reviewed
    source_id: c38-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape of Rhône origin covers the most vineyard area in South Africa?"
      choices:
        - { text: "Cinsault", correct: false }
        - { text: "Shiraz", correct: true }
        - { text: "Grenache Noir", correct: false }
        - { text: "Mourvèdre", correct: false }
      explanation: |
        Cape labels use both Shiraz and Syrah. Cinsault was once the country's workhorse red
        but now covers only a small area.
    fr:
      question: "Quel cépage noir d’origine rhodanienne occupe la plus grande surface de vignoble en Afrique du Sud ?"
      choices:
        - { text: "Cinsault", correct: false }
        - { text: "Shiraz", correct: true }
        - { text: "Grenache Noir", correct: false }
        - { text: "Mourvèdre", correct: false }
      explanation: |
        Les étiquettes du Cap emploient aussi bien Shiraz que Syrah. Le Cinsault,
        longtemps le rouge de masse du pays, ne couvre plus qu’une petite surface.

  - id: za-shiraz-warm-style-001
    type: mcq
    deck: South Africa
    tags: [south-africa, shiraz, syrah, style]
    status: reviewed
    source_id: c38-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description best fits Shiraz from a hot South African site?"
      choices:
        - { text: "Light body, crisp acidity, red berries", correct: false }
        - { text: "Medium body, high acidity, leafy notes", correct: false }
        - { text: "Full body, firm acidity, tart red fruit", correct: false }
        - { text: "Full body, high alcohol, ripe black fruit", correct: true }
      explanation: |
        Heat drives sugar, and so alcohol, up quickly. Earthy or meaty notes can join the
        dark fruit, especially as the wine ages.
    fr:
      question: "Quelle description correspond le mieux à une Shiraz issue d’un site chaud d’Afrique du Sud ?"
      choices:
        - { text: "Corps léger, acidité vive, petits fruits rouges", correct: false }
        - { text: "Corps moyen, acidité élevée, notes feuillues", correct: false }
        - { text: "Corps ample, acidité ferme, fruits rouges acidulés", correct: false }
        - { text: "Corps ample, alcool élevé, fruits noirs mûrs", correct: true }
      explanation: |
        La chaleur fait grimper vite le sucre, donc l’alcool. Des notes terreuses
        ou carnées peuvent s’ajouter aux fruits noirs, surtout avec l’âge.

  - id: za-shiraz-cool-style-001
    type: mcq
    deck: South Africa
    tags: [south-africa, shiraz, syrah, style]
    status: reviewed
    source_id: c38-0021
    review:
