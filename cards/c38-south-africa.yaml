    en:
      question: "Which character tends to run through South African Sauvignon Blanc at most price levels?"
      choices:
        - { text: "Smoky, flinty notes", correct: false }
        - { text: "Toasty oak and butter", correct: false }
        - { text: "Herbaceous, green notes", correct: true }
        - { text: "Ripe peach and apricot", correct: false }
      explanation: |
        The green aromas come from methoxypyrazines, the same compounds behind green bell
        pepper in under-ripe Cabernet Sauvignon.

  - id: za-sb-early-pick-001
    type: mcq
    deck: South Africa
    tags: [south-africa, sauvignon-blanc, harvest]
    status: reviewed
    source_id: c38-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In warmer South African sites, how do growers keep Sauvignon Blanc's fresh acidity and green flavours?"
      choices:
        - { text: "By leaving the bunches to hang longer", correct: false }
        - { text: "By stripping leaves around the bunches", correct: false }
        - { text: "By fermenting warm in new oak", correct: false }
        - { text: "By picking earlier", correct: true }
      explanation: |
        Acidity falls and pyrazine aromas fade as the grapes ripen and see sun, so an
        earlier harvest keeps both. Removing leaves exposes the bunches and speeds that
        loss.

  - id: za-chardonnay-site-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chardonnay, site]
    status: reviewed
    source_id: c38-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where are South Africa's finest Chardonnays most likely to be grown?"
      choices:
        - { text: "Warm, sheltered valley floors", correct: false }
        - { text: "Cool, ocean-influenced sites", correct: true }
        - { text: "Hot, irrigated inland plains", correct: false }
        - { text: "Dry, low-rainfall plateaus", correct: false }
      explanation: |
        Slow ripening keeps acidity and lets citrus and stone-fruit flavours build without
        excess alcohol. The best examples can stand beside good white Burgundy.

  - id: za-chardonnay-burgundian-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chardonnay, winemaking]
    status: reviewed
    source_id: c38-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cellar techniques shape the character of South Africa's best Chardonnays?"
      choices:
        - { text: "Carbonic maceration and early bottling", correct: false }
        - { text: "Cool steel fermentation with no MLF", correct: false }
        - { text: "Extended skin contact and amphora ageing", correct: false }
        - { text: "Barrel fermentation and lees stirring", correct: true }
      explanation: |
        Stirring the lees (bâtonnage) puts dead yeast cells back in suspension; they release
        mannoproteins that give a rounder, creamier texture.

