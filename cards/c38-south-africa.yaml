      sources: [known-fact]
    en:
      question: "Which character tends to run through South African Sauvignon Blanc at most price levels?"
      choices:
        - { text: "Smoky, flinty notes", correct: false }
        - { text: "Toasty oak and butter", correct: false }
        - { text: "Herbaceous, green notes", correct: true }
        - { text: "Ripe peach and apricot", correct: false }
      explanation: |
        The green aromas come from methoxypyrazines, the same compounds behind green bell
        pepper in under-ripe Cabernet Sauvignon.
    fr:
      question: "Quel caractère traverse le Sauvignon Blanc sud-africain à la plupart des niveaux de prix ?"
      choices:
        - { text: "Des notes fumées, de pierre à fusil", correct: false }
        - { text: "Du bois toasté et du beurre", correct: false }
        - { text: "Des notes herbacées, végétales", correct: true }
        - { text: "De la pêche et de l’abricot mûrs", correct: false }
      explanation: |
        Les arômes verts viennent des méthoxypyrazines, les mêmes composés qui
        donnent le poivron vert d’un Cabernet Sauvignon pas assez mûr.

  - id: za-sb-early-pick-001
    type: mcq
    deck: South Africa
    tags: [south-africa, sauvignon-blanc, harvest]
    status: reviewed
    source_id: c38-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In warmer South African sites, how do growers keep Sauvignon Blanc's fresh acidity and green flavours?"
      choices:
        - { text: "By leaving the bunches to hang longer", correct: false }
        - { text: "By stripping leaves around the bunches", correct: false }
        - { text: "By fermenting warm in new oak", correct: false }
        - { text: "By picking earlier", correct: true }
      explanation: |
        Acidity falls and pyrazine aromas fade as the grapes ripen and see sun, so an
        earlier harvest keeps both. Removing leaves exposes the bunches and speeds that
        loss.
    fr:
      question: "Dans les sites plus chauds d’Afrique du Sud, comment les vignerons préservent-ils l’acidité fraîche et les arômes verts du Sauvignon Blanc ?"
      choices:
        - { text: "En laissant les grappes plus longtemps sur pied", correct: false }
        - { text: "En effeuillant autour des grappes", correct: false }
        - { text: "En fermentant à chaud en fût neuf", correct: false }
        - { text: "En récoltant plus tôt", correct: true }
      explanation: |
        L’acidité baisse et les arômes de pyrazine s’estompent à mesure que le
        raisin mûrit et prend le soleil ; vendanger plus tôt préserve les deux.
        L’effeuillage expose les grappes et accélère cette perte.

  - id: za-chardonnay-site-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chardonnay, site]
    status: reviewed
    source_id: c38-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where are South Africa's finest Chardonnays most likely to be grown?"
      choices:
        - { text: "Warm, sheltered valley floors", correct: false }
        - { text: "Cool, ocean-influenced sites", correct: true }
        - { text: "Hot, irrigated inland plains", correct: false }
        - { text: "Dry, low-rainfall plateaus", correct: false }
      explanation: |
        Slow ripening keeps acidity and lets citrus and stone-fruit flavours build without
        excess alcohol. The best examples can stand beside good white Burgundy.
    fr:
      question: "Où les meilleurs Chardonnays d’Afrique du Sud ont-ils le plus de chances d’être cultivés ?"
      choices:
        - { text: "Dans des fonds de vallée chauds et abrités", correct: false }
        - { text: "Sur des sites frais, sous influence océanique", correct: true }
        - { text: "Dans des plaines intérieures chaudes et irriguées", correct: false }
        - { text: "Sur des plateaux secs, peu arrosés", correct: false }
      explanation: |
        Une maturation lente préserve l’acidité et laisse se développer les arômes
        d’agrumes et de fruits à noyau sans excès d’alcool. Les meilleurs exemples
        soutiennent la comparaison avec un bon bourgogne blanc.

  - id: za-chardonnay-burgundian-001
    type: mcq
    deck: South Africa
    tags: [south-africa, chardonnay, winemaking]
    status: reviewed
    source_id: c38-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cellar techniques shape the character of South Africa's best Chardonnays?"
      choices:
        - { text: "Carbonic maceration and early bottling", correct: false }
        - { text: "Cool steel fermentation with no MLF", correct: false }
        - { text: "Extended skin contact and amphora ageing", correct: false }
        - { text: "Barrel fermentation and lees stirring", correct: true }
      explanation: |
        Stirring the lees (bâtonnage) puts dead yeast cells back in suspension; they release
        mannoproteins that give a rounder, creamier texture.
    fr:
      question: "Quelles techniques de chai façonnent le caractère des meilleurs Chardonnays d’Afrique du Sud ?"
      choices:
        - { text: "Macération carbonique et mise en bouteille précoce", correct: false }
        - { text: "Fermentation fraîche en inox, sans malolactique", correct: false }
        - { text: "Macération pelliculaire longue et élevage en amphore", correct: false }
        - { text: "Fermentation en fût et bâtonnage des lies", correct: true }
      explanation: |
        Le bâtonnage remet en suspension les levures mortes ; elles libèrent des
        mannoprotéines qui donnent une texture plus ronde et plus crémeuse.

  - id: za-hanepoot-001
    type: mcq
    deck: South Africa
    tags: [south-africa, muscat, synonyms]
    status: reviewed
    source_id: c38-0046
    review:
      fact_check: pass
      sources: [known-fact]
