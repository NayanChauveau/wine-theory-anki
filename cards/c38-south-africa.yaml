      choices:
        - { text: "Fuller body and riper, jammy fruit", correct: false }
        - { text: "Firmer tannin and dried-fig notes", correct: false }
        - { text: "Higher alcohol and softer acidity", correct: false }
        - { text: "Lighter body and more black pepper", correct: true }
      explanation: |
        The peppery aroma comes largely from rotundone, a compound that builds up more in
        cooler, slower ripening conditions.

  - id: za-red-oak-001
    type: mcq
