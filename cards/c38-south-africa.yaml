    en:
      question: "Which description best fits Shiraz from a hot South African site?"
      choices:
        - { text: "Light body, crisp acidity, red berries", correct: false }
        - { text: "Medium body, high acidity, leafy notes", correct: false }
        - { text: "Full body, firm acidity, tart red fruit", correct: false }
        - { text: "Full body, high alcohol, ripe black fruit", correct: true }
      explanation: |
        Heat drives sugar, and so alcohol, up quickly. Earthy or meaty notes can join the
        dark fruit, especially as the wine ages.

  - id: za-shiraz-cool-style-001
