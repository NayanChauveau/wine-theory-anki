      fact_check: pass
      sources: [known-fact]
    en:
      question: "A premium South African Chenin Blanc is made in oak rather than steel. What does this typically add?"
      choices:
        - { text: "Sharper acidity and green fruit", correct: false }
        - { text: "A lighter body and floral lift", correct: false }
        - { text: "Extra body and toasty notes", correct: true }
        - { text: "Deeper colour and firm tannin", correct: false }
      explanation: |
        Chenin's naturally high acidity keeps a barrel-matured wine from tasting heavy. Lees
        contact in barrel adds a creamy texture.

  - id: za-colombard-brandy-001
    type: mcq
    deck: South Africa
    tags: [south-africa, colombard, brandy]
    status: reviewed
    source_id: c38-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape is grown in South Africa largely to make base wine for brandy?"
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay", correct: false }
        - { text: "Sémillon", correct: false }
        - { text: "Colombard", correct: true }
      explanation: |
        It keeps fresh acidity in hot inland vineyards, which suits a distillation base. It
        also makes cheap, fruity, often off-dry whites and ranks among the country's most
        planted whites.

  - id: za-sb-herbaceous-001
    type: mcq
    deck: South Africa
    tags: [south-africa, sauvignon-blanc, style]
    status: reviewed
