        - { text: "Merlot, Cabernet Franc and Malbec", correct: false }
      explanation: |
        The district's warmth suits grapes that need a long, hot season. Fairview, on the
        slopes of Paarl Mountain, is a well-known name for both Syrah and Pinotage.

