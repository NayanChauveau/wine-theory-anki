    en:
      question: "Which grape usually gives a red 'Cape blend' its identity?"
      choices:
        - { text: "Pinotage", correct: true }
        - { text: "Cinsault", correct: false }
        - { text: "Shiraz", correct: false }
        - { text: "Cabernet Sauvignon", correct: false }
      explanation: |
        The term has no legal definition. Most examples pair the local grape with Bordeaux
        varieties such as Cabernet Sauvignon and Merlot, sometimes with Shiraz.

  - id: za-pinotage-bush-vine-001
