      choices:
        - { text: "Traditional-method sparkling wine", correct: false }
        - { text: "Sweet dessert wine", correct: true }
        - { text: "Dry, oak-aged white", correct: false }
        - { text: "Crisp, early-picked dry white", correct: false }
      explanation: |
        Its grapey, floral aromas carry well into sweet wine, whether made from late-picked
        grapes or fortified. It is also widely grown as a table and raisin grape.

  - id: za-noble-rot-001
    type: mcq
