    en:
      question: "Pinotage was bred by crossing Pinot Noir with which grape?"
      choices:
        - { text: "Syrah", correct: false }
        - { text: "Grenache", correct: false }
        - { text: "Cinsault", correct: true }
        - { text: "Carignan", correct: false }
      explanation: |
        Abraham Perold made the cross at Stellenbosch in 1925. Cinsault was then known at
        the Cape as Hermitage, hence the name. Pinotage is still rarely planted outside
        South Africa.

  - id: za-cape-blend-001
    type: mcq
    deck: South Africa
    tags: [south-africa, pinotage, blends, cape-blend]
    status: reviewed
    source_id: c38-0028
