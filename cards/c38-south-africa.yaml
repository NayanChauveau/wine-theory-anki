    en:
      question: "Why are summer days usually hotter in Paarl, the large district just north of Stellenbosch, than in Stellenbosch itself?"
      choices:
        - { text: "It lies further inland, with less cooling from the sea", correct: true }
        - { text: "Hot berg winds blow in from the interior most summer days", correct: false }
        - { text: "Summer rainfall keeps humidity and night-time heat high", correct: false }
        - { text: "Its vineyards sit on the warm valley floor of the Breede River", correct: false }
      explanation: |
        Away from the ocean, nights cool down sharply, so the wide gap between day and night
        temperatures helps grapes keep some acidity. The town itself lies on the Berg River.

