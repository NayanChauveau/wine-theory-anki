        - { text: "Breede River Valley", correct: false }
      explanation: |
        Pour qu’une zone soit nommée sur une étiquette d’origine sud-africaine, tous
        les raisins doivent en provenir. Les deux districts appartiennent à la même
        région, la Coastal Region : la mentionner garde l’assemblage conforme.

  - id: za-stellenbosch-rainfall-001
