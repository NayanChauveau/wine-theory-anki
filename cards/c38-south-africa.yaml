        - { text: "Grown as untrellised bush vines", correct: false }
        - { text: "Grown without irrigation", correct: true }
        - { text: "Picked before the autumn rains", correct: false }
      explanation: |
        The vines rely on winter rain held in the soil. Deep roots matter, so the method
        works best with well-established vines on soils that store water.
    fr:
      question: "Un vigneron du Swartland dit qu’une vieille parcelle de Chenin Blanc est cultivée en sec. Qu’est-ce que cela vous apprend sur cette vigne ?"
      choices:
        - { text: "Cultivée sans traitements de synthèse", correct: false }
        - { text: "Conduite en gobelet, sans palissage", correct: false }
        - { text: "Cultivée sans irrigation", correct: true }
        - { text: "Vendangée avant les pluies d’automne", correct: false }
      explanation: |
        Cultiver en sec, c’est se passer d’irrigation : les vignes vivent de la
        pluie d’hiver retenue dans le sol. Il faut des racines profondes, si bien
        que la méthode réussit surtout avec des vignes bien établies, sur des sols
        qui stockent l’eau.

  - id: za-dry-farming-effect-001
    type: mcq
    deck: South Africa
    tags: [south-africa, swartland, viticulture, dry-farming]
    status: reviewed
    source_id: c38-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main effect of dry-farming on Swartland's vines?"
      choices:
        - { text: "Larger crops of lighter, fresher fruit", correct: false }
        - { text: "Bigger berries with thinner, softer skins", correct: false }
        - { text: "Smaller crops of more concentrated fruit", correct: true }
        - { text: "Later picking with greener, leafier flavours", correct: false }
      explanation: |
        Water stress slows shoot growth and keeps berries small, which raises the ratio of
        skin to juice.
    fr:
      question: "Quel est le principal effet de la culture en sec sur les vignes du Swartland ?"
      choices:
        - { text: "Des récoltes plus abondantes de fruits légers et frais", correct: false }
        - { text: "Des baies plus grosses à la pellicule fine et souple", correct: false }
        - { text: "Des rendements plus faibles et des fruits plus concentrés", correct: true }
        - { text: "Une récolte plus tardive aux arômes verts et herbacés", correct: false }
      explanation: |
        Le stress hydrique freine la croissance des rameaux et garde les baies
        petites. La proportion de pellicule par rapport au jus augmente, d’où des
        rendements réduits et un fruit plus concentré.

