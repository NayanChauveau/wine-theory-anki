    tags: [south-africa, paarl, climate]
    status: reviewed
    source_id: c38-0067
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are summer days usually hotter in Paarl, the large district just north of Stellenbosch, than in Stellenbosch itself?"
      choices:
        - { text: "It lies further inland, with less cooling from the sea", correct: true }
        - { text: "Hot berg winds blow in from the interior most summer days", correct: false }
        - { text: "Summer rainfall keeps humidity and night-time heat high", correct: false }
        - { text: "Its vineyards sit on the warm valley floor of the Breede River", correct: false }
      explanation: |
        Away from the ocean, nights cool down sharply, so the wide gap between day and night
        temperatures helps grapes keep some acidity. The town itself lies on the Berg River.
    fr:
      question: "Pourquoi les journées d’été sont-elles en général plus chaudes à Paarl, le grand district situé juste au nord de Stellenbosch, qu’à Stellenbosch même ?"
      choices:
        - { text: "Il est plus éloigné de la mer, qui le rafraîchit moins", correct: true }
        - { text: "Des vents chauds venus de l’intérieur y soufflent presque chaque jour d’été", correct: false }
        - { text: "Les pluies d’été y maintiennent une humidité et des nuits chaudes", correct: false }
        - { text: "Ses vignes occupent le fond chaud de la vallée de la Breede River", correct: false }
      explanation: |
        Loin de l’océan, Paarl profite moins de la fraîcheur marine le jour. Les
        nuits, en revanche, s’y rafraîchissent nettement, et ce fort écart entre
        jour et nuit aide le raisin à garder de l’acidité. La ville elle-même est au
        bord de la Berg River.

