    en:
      question: "Compared with Shiraz from warm Cape sites, how does Shiraz from cooler South African sites usually differ?"
      choices:
        - { text: "Fuller body and riper, jammy fruit", correct: false }
        - { text: "Firmer tannin and dried-fig notes", correct: false }
        - { text: "Higher alcohol and softer acidity", correct: false }
        - { text: "Lighter body and more black pepper", correct: true }
      explanation: |
        The peppery aroma comes largely from rotundone, a compound that builds up more in
        cooler, slower ripening conditions.
    fr:
      question: "Par rapport à une Shiraz de site chaud du Cap, en quoi une Shiraz de site plus frais d’Afrique du Sud diffère-t-elle d’habitude ?"
      choices:
        - { text: "Corps plus ample, fruit plus mûr et confituré", correct: false }
        - { text: "Tanins plus fermes, notes de figue sèche", correct: false }
        - { text: "Alcool plus élevé, acidité plus souple", correct: false }
        - { text: "Corps plus léger, poivre noir plus marqué", correct: true }
      explanation: |
        L’arôme poivré vient en grande partie de la rotundone, un composé qui
        s’accumule davantage quand la maturation est fraîche et lente.

  - id: za-red-oak-001
    type: mcq
    deck: South Africa
    tags: [south-africa, red, oak, winemaking]
    status: reviewed
    source_id: c38-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are most premium South African red wines matured?"
      choices:
        - { text: "In stainless steel, then bottled young", correct: false }
        - { text: "In concrete tanks, with no oak contact", correct: false }
        - { text: "In oak, with a share of new barrels", correct: true }
        - { text: "In large old casks, with no new oak", correct: false }
      explanation: |
        New barrels give the most toast, vanilla and spice. Mixing new and used barrels lets
        the winemaker set how much oak shows.
    fr:
      question: "Comment la plupart des rouges sud-africains haut de gamme sont-ils élevés ?"
      choices:
        - { text: "En cuve inox, puis mis en bouteille jeunes", correct: false }
        - { text: "En cuve béton, sans contact avec le bois", correct: false }
        - { text: "En fût de chêne, avec une part de bois neuf", correct: true }
        - { text: "En grands foudres anciens, sans bois neuf", correct: false }
      explanation: |
        Les fûts neufs apportent le plus de toasté, de vanille et d’épices. En
        mêlant fûts neufs et fûts usagés, le vinificateur dose la présence du bois.

  - id: za-pinotage-parents-001
    type: mcq
    deck: South Africa
    tags: [south-africa, pinotage, crossing, cinsault]
    status: reviewed
    source_id: c38-0024
    review:
      fact_check: pass
