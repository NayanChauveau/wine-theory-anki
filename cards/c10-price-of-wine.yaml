# yaml-language-server: $schema=../schema/cards.schema.json
# source: C10 (import/inbox/c10-price-of-wine.yaml)
# deck: Price of Wine

cards:
  - id: price-seven-brackets-001
    type: mcq
    deck: Price of Wine
    tags: [price]
    status: reviewed
    source_id: c10-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which set covers the main cost buckets that build a bottle’s price?
      choices:
        - { text: "Only the colour of the capsule", correct: false }
        - { text: "Growing, making, packing, moving and selling, tax, the retailer, and the market", correct: true }
        - { text: "Only the punt depth of the bottle", correct: false }
        - { text: "Only the winemaker’s tasting fee", correct: false }
      explanation: |
        Price is a stack: **grapes, cellar, pack, logistics, duty, the shop’s
        margin, and what buyers will pay**. Miss one bucket and the shelf price
        makes no sense.

  - id: price-plant-costs-001
    type: mcq
    deck: Price of Wine
    tags: [price, vineyard]
    status: reviewed
    source_id: c10-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do you actually pay to establish a vineyard?
      choices:
        - { text: "Only the harvest crates, nothing else", correct: false }
        - { text: "Land (dearer in famous places), soil work, vines and a trellis", correct: true }
        - { text: "Only a cork order for year one", correct: false }
        - { text: "Nothing — vines plant themselves", correct: false }
      explanation: |
        **Land** in Napa or the Côte d’Or can dwarf every other line. Then come
        ripping, plants and posts. That capital sits there for years before a
        crop.

  - id: price-labour-largest-001
    type: mcq
    deck: Price of Wine
    tags: [price, vineyard]
    status: reviewed
    source_id: c10-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Once a vineyard is planted, what is usually the biggest running cost?
      choices:
        - { text: "The label designer’s font licence", correct: false }
        - { text: "Labour", correct: true }
        - { text: "Only the cellar door biscuits", correct: false }
        - { text: "A legal cap on sunlight", correct: false }
      explanation: |
        **People** — pruning, canopy, picking — eat the budget on an established
        site, especially where a machine cannot go.

  - id: price-labour-cheap-001
    type: mcq
    deck: Price of Wine
    tags: [price, vineyard]
    status: reviewed
    source_id: c10-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do growers usually keep that labour bill down?
      choices:
        - { text: "By hiring a full permanent crew for every quiet winter week", correct: false }
        - { text: "Seasonal casual workers, or machines", correct: true }
        - { text: "By banning all pruning", correct: false }
        - { text: "By paying everyone in leftover corks", correct: false }
      explanation: |
        A **casual harvest crew** or a **tractor** replaces year-round wages.
        Quality and slope decide which option is even possible.

  - id: price-share-kit-001
    type: mcq
    deck: Price of Wine
    tags: [price, vineyard]
    status: reviewed
    source_id: c10-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How else can neighbouring growers cut labour or machine costs?
      choices:
        - { text: "By each buying a unused harvester that sits idle", correct: false }
        - { text: "By sharing crews or sharing machines", correct: true }
        - { text: "By never speaking to the next estate", correct: false }
        - { text: "By a law that forbids cooperatives", correct: false }
      explanation: |
        A **shared harvester** or a pooled pruning gang spreads the capital.
        Co-ops exist for the same reason.

  - id: price-steep-no-saving-001
    type: mcq
    deck: Price of Wine
    tags: [price, vineyard]
    status: reviewed
    source_id: c10-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where do those labour-saving tricks mostly fail?
      choices:
        - { text: "On a flat Central Valley grid", correct: false }
        - { text: "On steep or isolated sites a machine cannot reach", correct: true }
        - { text: "Only in underground cellars", correct: false }
        - { text: "On every site equally", correct: false }
      explanation: |
        **Mosel slate**, Priorat llicorella, Douro terraces: no cheap harvester,
        and a casual crew costs more to house. Isolation adds the same penalty.

  - id: price-grape-market-001
    type: mcq
    deck: Price of Wine
    tags: [price]
    status: reviewed
    source_id: c10-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides the work of growing them, what else sets the price of grapes?
      choices:
        - { text: "Only the colour of the picking crate", correct: false }
        - { text: "The market — what buyers will pay for that name and vintage", correct: true }
        - { text: "A single worldwide grape tariff that never moves", correct: false }
        - { text: "The punt depth of the bottle they might one day fill", correct: false }
      explanation: |
        **Demand** for Napa Cabernet or cheap bulk Airén moves the fruit price
        independently of how hard the year was to farm.

  - id: price-winery-kit-001
    type: mcq
    deck: Price of Wine
    tags: [price, winery]
    status: reviewed
    source_id: c10-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the most obvious cellar cost?
      choices:
        - { text: "Buying and looking after tanks, presses and the rest of the kit", correct: true }
        - { text: "Only the tasting-room flowers", correct: false }
        - { text: "A fee paid to the moon", correct: false }
        - { text: "Nothing — wineries have no equipment", correct: false }
      explanation: |
        **Stainless, presses, pumps, a bottling line** are capital that rusts
        and needs people. The pretty shop is extra.

  - id: price-shared-bottling-001
    type: mcq
    deck: Price of Wine
    tags: [price, winery]
    status: reviewed
    source_id: c10-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which cellar kit is commonly shared to avoid buying it twice?
      choices:
        - { text: "Every estate’s private bottling hall, unused 11 months a year", correct: false }
        - { text: "A mobile or co-op bottling line", correct: true }
        - { text: "A personal icewine press required by law", correct: false }
        - { text: "A gold-plated destemmer for each barrel", correct: false }
      explanation: |
        A **truck-mounted bottling line** or a **co-op hall** is the classic
        share. You do not need your own line for one week a year.

  - id: price-time-in-cellar-001
    type: mcq
    deck: Price of Wine
    tags: [price, winery]
    status: reviewed
    source_id: c10-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides kit, what cellar cost do people forget?
      choices:
        - { text: "The time the wine sits unsold before release", correct: true }
        - { text: "Only the colour of the tank paint", correct: false }
        - { text: "A tax on empty barrels that never applies", correct: false }
        - { text: "The winemaker’s hat size", correct: false }
      explanation: |
        **Ageing** is money asleep: warehouse, insurance, and cash you cannot
        use. Barolo or vintage Port prices that wait.

  - id: price-stock-tied-001
    type: mcq
    deck: Price of Wine
    tags: [price, winery]
    status: reviewed
    source_id: c10-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does long cellar time show up in the bottle price?
      choices:
        - { text: "Storage is free and stock can be sold the next morning", correct: false }
        - { text: "Warehouses cost money, and capital sits in unsold wine", correct: true }
        - { text: "The law refunds every month of ageing", correct: false }
        - { text: "Time in barrel legally reduces the tax to zero", correct: false }
      explanation: |
        You pay **rent on silence**. That delay is built into Rioja Gran Reserva
        or Champagne that cannot ship tomorrow.

  - id: price-packaging-parts-001
    type: mcq
    deck: Price of Wine
    tags: [price, packaging]
    status: reviewed
    source_id: c10-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which packaging pieces add to the cost of a bottle?
      choices:
        - { text: "Only the wine itself, never glass or paper", correct: false }
        - { text: "Glass, label, capsule, closure and carton — design and buying them", correct: true }
        - { text: "Only a handwritten tag with no bottle", correct: false }
        - { text: "A legal ban on any label", correct: false }
      explanation: |
        **Heavy glass and a designer label** can rival the juice in a cheap
        wine. Closure and shipper carton join the bill.

  - id: price-heavy-bottle-001
    type: mcq
    deck: Price of Wine
    tags: [price, packaging]
    status: reviewed
    source_id: c10-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which packs cost more to buy and to ship?
      choices:
        - { text: "A standard light bottle in a plain case", correct: false }
        - { text: "Odd-shaped or very heavy bottles", correct: true }
        - { text: "A bag-in-box with no extra glass", correct: false }
        - { text: "No container at all", correct: false }
      explanation: |
        A **trophy bottle** costs more glass and more freight. The light
        Bordeaux bottle exists because weight is money.

  - id: price-bottle-in-market-001
    type: mcq
    deck: Price of Wine
    tags: [price, packaging]
    status: reviewed
    source_id: c10-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can a producer sometimes cut packaging and freight cost?
      choices:
        - { text: "By shipping empty air in heavy glass", correct: false }
        - { text: "By bottling in the country where the wine will be sold", correct: true }
        - { text: "By a law that forbids bulk transport", correct: false }
        - { text: "By using only hand-blown crystal for every litre", correct: false }
      explanation: |
        **Bulk to the market**, then bottle there: less glass across an ocean.
        Australian and Chilean brands have long done this into the UK.

  - id: price-in-market-limits-001
    type: mcq
    deck: Price of Wine
    tags: [price, packaging]
    status: reviewed
    source_id: c10-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is bottling in the destination market not always possible?
      choices:
        - { text: "It is free and legal for every two-hectare domaine", correct: false }
        - { text: "You need scale, and some AOCs insist on bottling at origin", correct: true }
        - { text: "Only icewine may travel in bulk", correct: false }
        - { text: "The WTO bans all bulk wine", correct: false }
      explanation: |
        A **tiny estate** cannot fill a tanker. **Champagne, many crus, DOCG
        rules** want the cork put in at home. Scale plus the law decide.

  - id: price-tax-everywhere-001
    type: mcq
    deck: Price of Wine
    tags: [price, tax]
    status: reviewed
    source_id: c10-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do governments usually treat wine at the till?
      choices:
        - { text: "Almost none tax alcohol, and rates never differ", correct: false }
        - { text: "Nearly all tax it, and the rates vary wildly by country", correct: true }
        - { text: "Tax is illegal under every wine PDO", correct: false }
        - { text: "Only water is taxed, never wine", correct: false }
      explanation: |
        **Duty and VAT** are why the same Burgundy costs a different number in
        Stockholm and in Beaune.

  - id: price-tax-why-001
    type: mcq
    deck: Price of Wine
    tags: [price, tax]
    status: reviewed
    source_id: c10-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do states tax alcoholic drinks?
      choices:
        - { text: "Only to decorate the stamp", correct: false }
        - { text: "To raise the shelf price (and so cool demand) and to raise revenue", correct: true }
        - { text: "Because wine is legally classified as a vegetable", correct: false }
        - { text: "To make wine cheaper than water", correct: false }
      explanation: |
        Excise is both a **health lever** and a **cash register**. Nordic
        monopolies make the first obvious; most treasuries like the second.

  - id: price-retail-margin-001
    type: mcq
    deck: Price of Wine
    tags: [price, retail]
    status: reviewed
    source_id: c10-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do shops add to the landed cost of a wine?
      choices:
        - { text: "Nothing — retail is a charity", correct: false }
        - { text: "A margin so the store can make a profit", correct: true }
        - { text: "A legal requirement to sell below cost", correct: false }
        - { text: "Only a tax refund to the drinker", correct: false }
      explanation: |
        **Shops mark up** to pay rent, staff and risk. That is why the ex-cellar
        number and the shelf sticker are not the same.

  - id: price-restaurant-001
    type: mcq
    deck: Price of Wine
    tags: [price, retail]
    status: reviewed
    source_id: c10-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is the same bottle usually dearer in a restaurant than in a shop?
      choices:
        - { text: "Restaurants are legally banned from making a profit on wine", correct: false }
        - { text: "They take a bigger margin, and the price also pays for the room and the service", correct: true }
        - { text: "Wine is always cheaper with a meal", correct: false }
        - { text: "Shops are forbidden to discount", correct: false }
      explanation: |
        A list price funds **glassware, sommelier time, breakage and the night
        out**, not just the liquid. Two- or three-times retail is common.

  - id: price-market-forces-top-001
    type: mcq
    deck: Price of Wine
    tags: [price]
    status: reviewed
    source_id: c10-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the widest force sitting on top of all those costs?
      choices:
        - { text: "The colour of the capsule alone", correct: false }
        - { text: "What the destination market is willing to pay", correct: true }
        - { text: "A single global price set in 1855 that never moves", correct: false }
        - { text: "The winemaker’s shoe size", correct: false }
      explanation: |
        **Market forces** can lift a wine far above its cost stack — or leave a
        perfectly made bottle unsold. Costs set a floor; buyers set the ceiling.

  - id: price-scarcity-premium-001
    type: mcq
    deck: Price of Wine
    tags: [price]
    status: reviewed
    source_id: c10-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When can the shelf price sit far above the cost of making the wine?
      choices:
        - { text: "Only when nobody wants the bottle", correct: false }
        - { text: "When demand is high and supply is tight", correct: true }
        - { text: "Only when tax is zero and rent is free", correct: false }
        - { text: "Never — price always equals cost", correct: false }
      explanation: |
        **Scarce + wanted** is how a few hundred litres become a four-figure
        bottle. Cost is then a footnote.

  - id: price-bordeaux-demand-001
    type: mcq
    deck: Price of Wine
    tags: [price]
    status: reviewed
    source_id: c10-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which wines are the usual example of scarcity plus global demand?
      choices:
        - { text: "Basic bulk Airén from La Mancha", correct: false }
        - { text: "Top Bordeaux classed-growth wines", correct: true }
        - { text: "Any supermarket house white", correct: false }
        - { text: "Unlabelled tank samples", correct: false }
      explanation: |
        **Premier and classed growths** with tiny production and a world list
        are the usual example: price **rises** when demand outruns the crop.
        Bulk Airén is the opposite problem.

  - id: price-mosel-abandon-001
    type: mcq
    deck: Price of Wine
    tags: [price]
    status: reviewed
    source_id: c10-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where have some vineyards been pulled because the wine would not pay?
      choices:
        - { text: "Every hectare of the Médoc first growths", correct: false }
        - { text: "Some steep Mosel sites", correct: true }
        - { text: "Only underground Champagne caves", correct: false }
        - { text: "The Napa floor at any price", correct: false }
      explanation: |
        **Hand-worked slate** costs a fortune. If the bottle cannot sell for
        enough, the terrace goes to scrub. That is demand too **low**, not too
        high.

  - id: price-three-producers-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What are the three usual kinds of wine producer?
      choices:
        - { text: "Only restaurants, shops and bars", correct: false }
        - { text: "Co-operatives, merchants and estates", correct: true }
        - { text: "Only governments and charities", correct: false }
        - { text: "Only icewine specialists", correct: false }
      explanation: |
        **Co-op, négociant/merchant, domaine/estate** is the exam trio. Most
        bottles you meet were made by one of those three.

  - id: price-coop-define-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a wine co-operative?
      choices:
        - { text: "A shop that only sells corks", correct: false }
        - { text: "A winery owned by its members, usually the growers", correct: true }
        - { text: "A merchant that never takes grapes", correct: false }
        - { text: "A single-vineyard estate with no members", correct: false }
      explanation: |
        Growers **pool fruit and kit**. La Chablisienne or the big southern
        French co-ops are the picture: the members own the cellar.

  - id: price-coop-buyer-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the main comfort a co-op offers a small grower?
      choices:
        - { text: "No one will ever buy their grapes", correct: false }
        - { text: "A guaranteed buyer for the fruit", correct: true }
        - { text: "A legal ban on delivering any crop", correct: false }
        - { text: "They must sell only in another country", correct: false }
      explanation: |
        Membership means the cellar **must take** the grapes (rules vary). That
        beats hunting a négociant every October.

  - id: price-coop-quality-risk-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What quality headache can a co-op cellar face?
      choices:
        - { text: "Members always deliver identical grand-cru fruit", correct: false }
        - { text: "The winemakers may not fully control what members bring in", correct: true }
        - { text: "Co-ops are legally banned from sorting", correct: false }
        - { text: "They never receive any grapes", correct: false }
      explanation: |
        Payment by **kilo** tempts overcropped, underripe fruit. Good co-ops
        pay for quality; weak ones sit on a mixed pile they did not grow.

  - id: price-coop-quality-range-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What quality should you expect from co-operative wines?
      choices:
        - { text: "Always the worst wine in the region, by law", correct: false }
        - { text: "Any level — some co-ops bottle the best wine of their place", correct: true }
        - { text: "Only fortified wine under flor", correct: false }
        - { text: "Only sparkling red", correct: false }
      explanation: |
        **La Chablisienne**, Produttori del Barbaresco, some Alsace and Rhône
        co-ops sit at the top of the village. Others are bulk. The structure
        does not set the quality.

  - id: price-coop-europe-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where are grape-grower co-ops most typical?
      choices:
        - { text: "Only in New Zealand’s corporate estates", correct: false }
        - { text: "In Europe", correct: true }
        - { text: "Only in underground cellars in Australia", correct: false }
        - { text: "They do not exist anywhere", correct: false }
      explanation: |
        **Southern France, Italy, Germany, Spain** — tiny family holdings made
        the co-op the default cellar. New World average farms are larger.

  - id: price-coop-europe-why-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why did Europe grow so many co-ops?
      choices:
        - { text: "Every European estate is too large to need neighbours", correct: false }
        - { text: "Average holdings are too small to run a cellar on their own", correct: true }
        - { text: "EU law bans private wineries", correct: false }
        - { text: "There are no grapes in Europe", correct: false }
      explanation: |
        Inheritance split Burgundy and the Languedoc into **postage stamps**. A
        shared press is the only economic cellar.

  - id: price-merchant-role-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a wine merchant (négociant) actually buy?
      choices:
        - { text: "Only empty bottles from a glassworks", correct: false }
        - { text: "Grapes, juice or finished wine from growers or co-ops", correct: true }
        - { text: "Only the estate they already own, never a kilo more", correct: false }
        - { text: "Only tax stamps", correct: false }
      explanation: |
        The **négociant** is a blender and a brand: fruit or wine in, a label
        out. Jadot, Drouhin, the big Australian brands all play this game.

  - id: price-merchant-contracts-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can a merchant often steer fruit quality more tightly than a classic co-op?
      choices:
        - { text: "They must take every member’s grapes by statute", correct: false }
        - { text: "They buy on contract and can walk away from a bad lot", correct: true }
        - { text: "They are banned from writing contracts", correct: false }
        - { text: "They never taste the fruit", correct: false }
      explanation: |
        A **contract** can specify ripeness, variety, even vineyard. A co-op
        membership is a political promise to take the crop.

  - id: price-merchant-supply-risk-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What supply problem hits merchants when a region is short of grapes?
      choices:
        - { text: "Fruit is always surplus and free", correct: false }
        - { text: "They can pick more carefully — but they may not find enough kilos at all", correct: true }
        - { text: "The law forces growers to over-deliver", correct: false }
        - { text: "Merchants may not buy grapes, only corks", correct: false }
      explanation: |
        In a tiny vintage, growers keep the best for the **domaine**. The
        négociant who wanted a regular brand volume is left short.

  - id: price-merchant-scale-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: On what scale do merchants work?
      choices:
        - { text: "Only one legal size, 10 000 hl exactly", correct: false }
        - { text: "From tiny premium lots to huge multi-wine brands", correct: true }
        - { text: "Only as a single-barrel hobby", correct: false }
        - { text: "They are banned from blending more than one wine", correct: false }
      explanation: |
        A **micro-négociant** in Vosne and a **global brand** in the Central
        Valley are the same job at different volumes.

  - id: price-merchant-where-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where are large merchant brands especially common?
      choices:
        - { text: "Only inside a Burgundy grand cru wall", correct: false }
        - { text: "Outside Europe, where bigger holdings feed fewer suppliers", correct: true }
        - { text: "They do not exist outside a French village", correct: false }
        - { text: "Only in Antarctica", correct: false }
      explanation: |
        **Négociants** are central in Burgundy and Bordeaux. The useful contrast
        is **large branded merchants** on bigger New World farms — fewer growers
        per litre — not a claim that France has no merchants.

  - id: price-merchant-why-new-world-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is that big-merchant model easier outside Europe?
      choices:
        - { text: "Vineyards are smaller and you must visit 400 families", correct: false }
        - { text: "Average holdings are larger, so one buyer deals with fewer growers", correct: true }
        - { text: "There are no grapes outside Europe", correct: false }
        - { text: "Contracts are illegal in the New World", correct: false }
      explanation: |
        A **200 ha** Australian block is one conversation. A **0.3 ha**
        Burgundian strip is four hundred conversations.

  - id: price-brands-merchants-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which producer type sits behind many of the biggest wine brands?
      choices:
        - { text: "A two-barrel family estate only", correct: false }
        - { text: "Merchants", correct: true }
        - { text: "Only municipal water companies", correct: false }
        - { text: "Only restaurant sommeliers", correct: false }
      explanation: |
        A **brand** needs volume and a blend that tastes the same next year.
        That is a merchant’s job, not a 4 ha domaine’s.

  - id: price-negociant-name-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the French word for that merchant?
      choices:
        - { text: "Domaine", correct: false }
        - { text: "Négociant", correct: true }
        - { text: "Climat", correct: false }
        - { text: "Lieudit", correct: false }
      explanation: |
        **Négociant** (often *négociant-éleveur*) buys, ages and bottles.
        **Domaine** is the estate word.

  - id: price-estate-define-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What makes a producer an estate, not a merchant?
      choices:
        - { text: "They buy all their fruit on the spot market", correct: false }
        - { text: "They make wine only from grapes they grow", correct: true }
        - { text: "They never own a vine", correct: false }
        - { text: "They only print labels for other people", correct: false }
      explanation: |
        An **estate / domaine** bottles **its own grapes**. A merchant buys
        fruit or wine in. The two jobs are not the same.

  - id: price-estate-scale-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which producer type usually works on the smallest scale?
      choices:
        - { text: "Global merchant brands", correct: false }
        - { text: "Estates", correct: true }
        - { text: "National supermarket buyers", correct: false }
        - { text: "Shipping lines", correct: false }
      explanation: |
        A **domaine** is sized to its vines. Merchants and big co-ops can be
        industrial.

  - id: price-estate-control-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does that small estate scale usually buy you?
      choices:
        - { text: "The least control over farming and the cellar", correct: false }
        - { text: "The tightest control from vine to bottle", correct: true }
        - { text: "A legal ban on visiting the vineyard", correct: false }
        - { text: "More blending options than a global merchant", correct: false }
      explanation: |
        One team **grows and makes**. That is the domaine pitch. Blending
        options are fewer, not more.

  - id: price-estate-blend-limit-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the estate’s structural disadvantage?
      choices:
        - { text: "Unlimited fruit from 400 growers", correct: false }
        - { text: "Fewer blending options because they rely on their own crop", correct: true }
        - { text: "They must buy every grape in the village", correct: false }
        - { text: "They cannot print a label", correct: false }
      explanation: |
        If the **east-facing plot fails**, there is no tanker of backup juice.
        A négociant can phone the next valley.

  - id: price-estate-poor-vintage-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When does that lack of blending fruit hurt most?
      choices:
        - { text: "In a perfect, even vintage with surplus", correct: false }
        - { text: "In a poor growing year", correct: true }
        - { text: "Only when the label is gold", correct: false }
        - { text: "Never — estates always have spare regions", correct: false }
      explanation: |
        A **rot year** or a frost year leaves the domaine with what it grew.
        The merchant can still assemble a brand from somewhere else.

  - id: price-domaine-word-001
    type: mcq
    deck: Price of Wine
    tags: [price, producers]
    status: reviewed
    source_id: c10-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which French word is often used for an estate?
      choices:
        - { text: "Négociant", correct: false }
        - { text: "Domaine", correct: true }
        - { text: "Courtier", correct: false }
        - { text: "Tonnelier", correct: false }
      explanation: |
        **Domaine** (Burgundy, Loire, Alsace) means the farm that bottles its
        own grapes. Bordeaux more often says *château*. A négociant is the
        buyer; a courtier is the broker.

