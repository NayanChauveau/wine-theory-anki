      sources: [known-fact]
    en:
      question: How were southern vines traditionally trained against the sun?
      choices:
        - { text: "High pergola only", correct: false }
        - { text: "Low bush vines, leaves shading the fruit", correct: true }
        - { text: "Ungrafted desert posts", correct: false }
        - { text: "Indoor only", correct: false }
      explanation: |
        **Low bush vines, leaves shading the fruit.** The old
        Puglian and Sicilian picture.

  - id: sitaly-cordon-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which training is now the southern default?
      choices:
        - { text: "Only free-standing bush", correct: false }
        - { text: "Cordon training and trellising", correct: true }
        - { text: "No wires at all", correct: false }
        - { text: "Pergola on every new hectare", correct: false }
      explanation: |
        **Cordon training and trellising.** Bush survives on old
        plots and windy sites.

  - id: sitaly-mech-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why did Puglia adopt cordon and trellis so widely?
      choices:
        - { text: "The law bans any tractor", correct: false }
        - { text: "The flat plain can be mechanised", correct: true }
        - { text: "There is no flat land", correct: false }
        - { text: "Only hand-work is legal", correct: false }
      explanation: |
        **The flat plain can be mechanised.** Volume Puglia is
        tractor country.

  - id: sitaly-campania-docg-001
