        - { text: "High alpine", correct: false }
        - { text: "Polar", correct: false }
      explanation: |
        **Hot.** Sea breezes help; it is still a bake.

  - id: sitaly-puglia-black-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, puglia]
    status: reviewed
    source_id: c29-0026
