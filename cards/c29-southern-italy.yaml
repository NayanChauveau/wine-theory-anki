      sources: [known-fact]
    en:
      question: What mix of land does Campania offer vines?
      choices:
        - { text: "One flat desert only", correct: false }
        - { text: "Mountains, valleys and coastal plains", correct: true }
        - { text: "Alpine ice only", correct: false }
        - { text: "A single river island", correct: false }
      explanation: |
        **Mountains, valleys, coastal plains.** Vesuvius to the
        Irpinia hills.

  - id: sitaly-campania-range-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Campania’s mix of mountains, valleys and coast allow in the vineyard?
      choices:
        - { text: "Only one white grape", correct: false }
        - { text: "A wide range of black and white varieties", correct: true }
        - { text: "No Vitis vinifera", correct: false }
        - { text: "Only icewine", correct: false }
      explanation: |
        **A wide range of black and white varieties.** Fiano, Greco
        and Aglianico share the same region.

  - id: sitaly-fiano-greco-001
