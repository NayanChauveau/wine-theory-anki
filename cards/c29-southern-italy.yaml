        - { text: "Leaner, higher acid, green apple, stone fruit and passion fruit", correct: true }
        - { text: "Always a red wine", correct: false }
        - { text: "Sweet and fortified", correct: false }
      explanation: |
        **Leaner, higher acid, green apple, stone fruit and passion
        fruit.** Fiano is the broader one.

  - id: sitaly-greco-cellar-001
