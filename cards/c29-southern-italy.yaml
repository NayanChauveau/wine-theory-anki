cards:
  - id: sitaly-map-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which group best represents the principal wine regions of Southern Italy and the islands?"
      choices:
        - { text: "Piedmont, Lombardy, Veneto, Trentino, Friuli and Liguria", correct: false }
        - { text: "Campania, Basilicata, Puglia, Calabria, Sicily and Sardinia", correct: true }
        - { text: "Tuscany, Umbria, Marche, Lazio, Abruzzo and Emilia-Romagna", correct: false }
        - { text: "Alsace, Jura, Savoie, Champagne, Bordeaux and Burgundy", correct: false }
      explanation: |
        Southern Italy includes the mainland south of Lazio plus the major wine-producing islands. Each
        region has distinct grapes and conditions, so ‘the south’ is a broad geographic grouping rather
        than one uniform style.
    fr:
      question: "Quel groupe représente le mieux les principales régions viticoles du sud de l’Italie et des îles ?"
      choices:
        - { text: "Piémont, Lombardie, Vénétie, Trentin, Frioul et Ligurie", correct: false }
        - { text: "Campanie, Basilicate, Pouilles, Calabre, Sicile et Sardaigne", correct: true }
        - { text: "Toscane, Ombrie, Marches, Latium, Abruzzes et Émilie-Romagne", correct: false }
        - { text: "Alsace, Jura, Savoie, Champagne, Bordeaux et Bourgogne", correct: false }
      explanation: |
        Le sud de l’Italie comprend la partie continentale située au sud du Latium ainsi que les grandes
        îles viticoles. Chaque région possède ses cépages et ses conditions propres : « le Sud » est
        donc un vaste ensemble géographique, pas un style uniforme.

  - id: sitaly-climate-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, climate]
    status: reviewed
    source_id: c29-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which site factors most often moderate Southern Italy’s generally hot Mediterranean climate?"
      choices:
        - { text: "Low latitude and enclosed valleys", correct: false }
        - { text: "Altitude and maritime influence", correct: true }
        - { text: "High yields and fertile soils", correct: false }
        - { text: "Persistent summer rain and cloud", correct: false }
      explanation: |
        Elevation lowers temperatures and increases diurnal range, while proximity to the sea can bring
        cooling breezes. These effects help preserve acidity and extend ripening in places such as
        inland Campania, Vulture and Etna.
    fr:
      question: "Quels facteurs de site modèrent le plus souvent le climat méditerranéen généralement chaud du sud de l’Italie ?"
      choices:
        - { text: "La faible latitude et les vallées encaissées", correct: false }
        - { text: "L’altitude et l’influence maritime", correct: true }
        - { text: "Les rendements élevés et les sols fertiles", correct: false }
        - { text: "Les pluies et la nébulosité estivales persistantes", correct: false }
      explanation: |
        L’altitude abaisse les températures et accroît l’amplitude thermique quotidienne, tandis que la
        proximité de la mer peut apporter des brises rafraîchissantes. Ces effets aident à préserver
        l’acidité et à prolonger la maturation, notamment dans l’intérieur de la Campanie, au Vulture et
        sur l’Etna.

  - id: sitaly-agri-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the central viticultural risk in the hottest, driest parts of Southern Italy?"
      choices:
        - { text: "Autumn rain diluting late-ripening grapes", correct: false }
        - { text: "Drought stress that can stop ripening and reduce yield", correct: true }
        - { text: "Excessive vigour caused by abundant summer rainfall", correct: false }
        - { text: "Persistent spring frost on the coastal plains", correct: false }
      explanation: |
        Heat alone does not guarantee balanced ripeness. Where water is scarce, severe drought can shut
        down photosynthesis; site choice, old deep-rooted vines and permitted irrigation can therefore
        be important.
    fr:
      question: "Quel est le principal risque viticole dans les secteurs les plus chauds et les plus secs du sud de l’Italie ?"
      choices:
        - { text: "Les pluies d’automne diluant les cépages tardifs", correct: false }
        - { text: "Un stress hydrique pouvant bloquer la maturation et réduire le rendement", correct: true }
        - { text: "Une vigueur excessive due à d’abondantes pluies estivales", correct: false }
        - { text: "Un gel de printemps persistant dans les plaines côtières", correct: false }
      explanation: |
        La chaleur ne garantit pas à elle seule une maturité équilibrée. Lorsque l’eau manque, une
        sécheresse sévère peut interrompre la photosynthèse ; le choix du site, les vieilles vignes aux
        racines profondes et l’irrigation lorsqu’elle est autorisée peuvent donc compter.

  - id: sitaly-volume-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two southern regions are especially important for Italy’s large-volume wine production?"
      choices:
        - { text: "Basilicata and Molise", correct: false }
        - { text: "Puglia and Sicily", correct: true }
        - { text: "Campania and Valle d’Aosta", correct: false }
        - { text: "Liguria and Trentino", correct: false }
      explanation: |
        Puglia and Sicily have extensive vineyard areas and supply substantial volumes at regional IGT
        and DOC level. Both also contain lower-yielding sites capable of distinctive premium wines.
    fr:
      question: "Quelles sont les deux régions du Sud particulièrement importantes pour la production italienne de vin en grand volume ?"
      choices:
        - { text: "La Basilicate et le Molise", correct: false }
        - { text: "Les Pouilles et la Sicile", correct: true }
        - { text: "La Campanie et la Vallée d’Aoste", correct: false }
        - { text: "La Ligurie et le Trentin", correct: false }
      explanation: |
        Les Pouilles et la Sicile possèdent de vastes surfaces viticoles et fournissent d’importants
        volumes sous IGT régionale et DOC. Toutes deux comptent aussi des sites à faibles rendements
        capables de produire des vins haut de gamme distinctifs.

  - id: sitaly-bush-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can low-trained bush vines remain well suited to hot, dry southern sites?"
      choices:
        - { text: "They raise bunches high above the ground to increase ventilation", correct: false }
        - { text: "The canopy shades fruit and the free-standing form suits dry, windy sites", correct: true }
        - { text: "They place fruit in a uniform zone for mechanical harvesting", correct: false }
        - { text: "They promote a large canopy in fertile, rain-fed vineyards", correct: false }
      explanation: |
        Traditional alberello vines sit close to the ground and can shelter bunches from intense sun and
        wind. They are labour-intensive, so they are most defensible on old or quality-focused
        vineyards.
    fr:
      question: "Pourquoi les vignes basses conduites en gobelet peuvent-elles rester bien adaptées aux sites chauds et secs du Sud ?"
      choices:
        - { text: "Elles élèvent les grappes pour augmenter leur ventilation", correct: false }
        - { text: "Le feuillage ombrage les raisins ; le gobelet convient aux sites secs et venteux", correct: true }
        - { text: "Elles alignent les raisins dans une zone adaptée à la vendange mécanique", correct: false }
        - { text: "Elles favorisent un vaste feuillage dans les vignobles fertiles et pluvieux", correct: false }
      explanation: |
        Les vignes traditionnelles en alberello restent près du sol et peuvent protéger les grappes d’un
        soleil et d’un vent intenses. Elles demandent beaucoup de main-d’œuvre ; elles se justifient
        donc surtout dans les vieilles vignes ou les parcelles axées sur la qualité.

  - id: sitaly-cordon-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why have cordon-trained, trellised systems replaced many traditional bush vines in productive southern vineyards?"
      choices:
        - { text: "They shelter bunches from sun more effectively than low bush vines", correct: false }
        - { text: "They reduce labour and make mechanisation easier", correct: true }
        - { text: "They restrict yields without pruning or crop management", correct: false }
        - { text: "They preserve old vines better than free-standing systems", correct: false }
      explanation: |
        Trellising organises shoots and fruit into accessible rows, allowing more operations to be
        mechanised. The trade-off is that exposed canopies require careful management in intense heat.
    fr:
      question: "Pourquoi les systèmes palissés conduits en cordon ont-ils remplacé de nombreux gobelets traditionnels dans les vignobles productifs du Sud ?"
      choices:
        - { text: "Ils abritent mieux les grappes du soleil que les gobelets bas", correct: false }
        - { text: "Ils réduisent le travail et facilitent la mécanisation", correct: true }
        - { text: "Ils limitent les rendements sans taille ni gestion de la récolte", correct: false }
        - { text: "Ils préservent mieux les vieilles vignes que les systèmes autoportants", correct: false }
      explanation: |
        Le palissage organise les rameaux et les raisins en rangs accessibles, ce qui permet de
        mécaniser davantage d’opérations. En contrepartie, les couverts végétaux exposés demandent une
        gestion attentive sous une chaleur intense.

  - id: sitaly-mech-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which feature has particularly favoured mechanised viticulture on much of Puglia’s plains?"
      choices:
        - { text: "Small, fragmented terraces on steep slopes", correct: false }
        - { text: "Large, relatively flat vineyard areas", correct: true }
        - { text: "Old bush vines planted at irregular spacing", correct: false }
        - { text: "Mixed vineyards with narrow access routes", correct: false }
      explanation: |
        Compared with steep or fragmented regions, Puglia’s broad plains can accommodate regular
        trellised rows and machinery. This supports efficient, high-volume production, although quality
        depends on yield and canopy control.
    fr:
      question: "Quelle caractéristique a particulièrement favorisé la mécanisation de la viticulture dans une grande partie des plaines des Pouilles ?"
      choices:
        - { text: "De petites terrasses morcelées sur des pentes raides", correct: false }
        - { text: "De vastes surfaces viticoles relativement planes", correct: true }
        - { text: "De vieux gobelets plantés à intervalles irréguliers", correct: false }
        - { text: "Des vignes complantées aux voies d’accès étroites", correct: false }
      explanation: |
        Par rapport aux régions escarpées ou morcelées, les vastes plaines des Pouilles se prêtent aux
        rangs palissés réguliers et aux machines. Cela favorise une production efficace et volumique,
        dont la qualité dépend toutefois de la maîtrise des rendements et du couvert végétal.

  - id: sitaly-campania-docg-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which set correctly matches three leading Campania DOCGs with their principal grape?"
      choices:
        - { text: "Soave—Garganega; Barolo—Nebbiolo; Gavi—Cortese", correct: false }
        - { text: "Fiano di Avellino—Fiano; Greco di Tufo—Greco; Taurasi—Aglianico", correct: true }
        - { text: "Verdicchio di Matelica—Verdicchio; Conero—Montepulciano; Frascati—Malvasia", correct: false }
        - { text: "Etna—Nerello Mascalese; Sicilia—Nero d’Avola; Cerasuolo di Vittoria—Frappato", correct: false }
      explanation: |
        The elevated Avellino area is the source of Campania’s best-known white DOCGs, Fiano di Avellino
        and Greco di Tufo, and of Taurasi, a structured Aglianico-based red.
    fr:
      question: "Quelle série associe correctement trois DOCG majeures de Campanie à leur cépage principal ?"
      choices:
        - { text: "Soave—Garganega ; Barolo—Nebbiolo ; Gavi—Cortese", correct: false }
        - { text: "Fiano di Avellino—Fiano ; Greco di Tufo—Greco ; Taurasi—Aglianico", correct: true }
        - { text: "Verdicchio di Matelica—Verdicchio ; Conero—Montepulciano ; Frascati—Malvasia", correct: false }
        - { text: "Etna—Nerello Mascalese ; Sicilia—Nero d’Avola ; Cerasuolo di Vittoria—Frappato", correct: false }
      explanation: |
        La zone élevée d’Avellino produit les deux DOCG blanches les plus connues de Campanie, Fiano di
        Avellino et Greco di Tufo, ainsi que Taurasi, un rouge structuré à base d’Aglianico.

  - id: sitaly-campania-land-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do Campania’s inland hills benefit late-ripening grapes such as Aglianico?"
      choices:
        - { text: "They accelerate sugar accumulation through warmer nights", correct: false }
        - { text: "Elevation lengthens ripening while helping retain acidity", correct: true }
        - { text: "They shorten the season by exposing vines to stronger heat", correct: false }
        - { text: "They increase humidity and encourage earlier harvesting", correct: false }
      explanation: |
        Campania is warm, but inland elevation and large day–night temperature ranges moderate heat. A
        long season helps late-ripening Aglianico reach flavour maturity without losing all its acidity.
    fr:
      question: "En quoi les collines intérieures de Campanie favorisent-elles les cépages tardifs comme l’Aglianico ?"
      choices:
        - { text: "Elles accélèrent l’accumulation des sucres par des nuits plus chaudes", correct: false }
        - { text: "L’altitude prolonge la maturation tout en aidant à conserver l’acidité", correct: true }
        - { text: "Elles raccourcissent la saison en exposant les vignes à plus de chaleur", correct: false }
        - { text: "Elles augmentent l’humidité et favorisent une vendange plus précoce", correct: false }
      explanation: |
        La Campanie est chaude, mais l’altitude intérieure et les fortes amplitudes thermiques
        quotidiennes modèrent la chaleur. Une longue saison aide l’Aglianico tardif à atteindre sa
        maturité aromatique sans perdre toute son acidité.

  - id: sitaly-campania-range-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can Campania successfully produce both fresh whites and powerful reds?"
      choices:
        - { text: "Its coastal plain concentrates vineyards in similarly warm conditions", correct: false }
        - { text: "Its varied elevations, aspects and maritime influences create diverse mesoclimates", correct: true }
        - { text: "Its limestone soils impose one consistent ripening pattern", correct: false }
        - { text: "Its harvest dates are standardised across the region", correct: false }
      explanation: |
        Coastal influence, inland valleys, mountains and volcanic or limestone-derived soils create
        markedly different growing conditions. This diversity supports grapes ranging from high-acid
        Greco to late-ripening Aglianico.
    fr:
      question: "Pourquoi la Campanie peut-elle produire à la fois des blancs frais et des rouges puissants ?"
      choices:
        - { text: "Sa plaine côtière concentre les vignobles dans des conditions chaudes similaires", correct: false }
        - { text: "La diversité des altitudes, expositions et influences maritimes crée des mésoclimats variés", correct: true }
        - { text: "Ses sols calcaires imposent un schéma de maturation uniforme", correct: false }
        - { text: "Les dates de vendange sont standardisées dans toute la région", correct: false }
      explanation: |
        L’influence côtière, les vallées intérieures, les montagnes et les sols d’origine volcanique ou
        calcaire créent des conditions très différentes. Cette diversité convient à des cépages allant
        du Greco acide à l’Aglianico tardif.

  - id: sitaly-fiano-greco-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania, grapes]
    status: reviewed
    source_id: c29-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two local white grapes underpin Campania’s best-known dry white DOCGs?"
      choices:
        - { text: "Garganega and Trebbiano di Soave", correct: false }
        - { text: "Fiano and Greco", correct: true }
        - { text: "Vermentino and Vernaccia", correct: false }
        - { text: "Cortese and Arneis", correct: false }
      explanation: |
        Fiano is the key grape of Fiano di Avellino DOCG, while Greco leads Greco di Tufo DOCG. Both can
        combine concentration with freshness and develop complexity in bottle.
    fr:
      question: "Quels sont les deux cépages blancs locaux à la base des DOCG blanches sèches les plus connues de Campanie ?"
      choices:
        - { text: "Garganega et Trebbiano di Soave", correct: false }
        - { text: "Fiano et Greco", correct: true }
        - { text: "Vermentino et Vernaccia", correct: false }
        - { text: "Cortese et Arneis", correct: false }
      explanation: |
        Le Fiano est le cépage clé de Fiano di Avellino DOCG, tandis que le Greco domine Greco di Tufo
        DOCG. Tous deux peuvent allier concentration et fraîcheur, puis gagner en complexité en
        bouteille.

  - id: sitaly-fiano-docg-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which DOCG is Campania’s principal reference point for dry Fiano?"
      choices:
        - { text: "Greco di Tufo DOCG", correct: false }
        - { text: "Fiano di Avellino DOCG", correct: true }
        - { text: "Aglianico del Taburno DOCG", correct: false }
        - { text: "Taurasi DOCG", correct: false }
      explanation: |
        Fiano di Avellino DOCG is centred on the inland province of Avellino. Elevation helps the grape
        retain freshness despite Campania’s southern latitude.
    fr:
      question: "Quelle DOCG constitue la principale référence de Campanie pour le Fiano sec ?"
      choices:
        - { text: "Greco di Tufo DOCG", correct: false }
        - { text: "Fiano di Avellino DOCG", correct: true }
        - { text: "Aglianico del Taburno DOCG", correct: false }
        - { text: "Taurasi DOCG", correct: false }
      explanation: |
        Fiano di Avellino DOCG est centrée sur la province intérieure d’Avellino. L’altitude aide le
        cépage à conserver sa fraîcheur malgré la latitude méridionale de la Campanie.

  - id: sitaly-greco-docg-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which DOCG is Campania’s principal reference point for dry Greco?"
      choices:
        - { text: "Fiano di Avellino DOCG", correct: false }
        - { text: "Greco di Tufo DOCG", correct: true }
        - { text: "Aglianico del Vulture DOC", correct: false }
        - { text: "Salice Salentino DOC", correct: false }
      explanation: |
        Greco di Tufo DOCG takes its name from both the grape and the town of Tufo. The best wines
        combine high acidity and concentration and can evolve in bottle.
    fr:
      question: "Quelle DOCG constitue la principale référence de Campanie pour le Greco sec ?"
      choices:
        - { text: "Fiano di Avellino DOCG", correct: false }
        - { text: "Greco di Tufo DOCG", correct: true }
        - { text: "Aglianico del Vulture DOC", correct: false }
        - { text: "Salice Salentino DOC", correct: false }
      explanation: |
        Greco di Tufo DOCG tire son nom à la fois du cépage et de la commune de Tufo. Les meilleurs vins
        associent acidité élevée et concentration et peuvent évoluer en bouteille.

  - id: sitaly-fiano-style-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best describes a good young Fiano di Avellino?"
      choices:
        - { text: "Light-bodied, low in acidity, neutral and intended for very early drinking", correct: false }
        - { text: "Medium- to full-bodied and fresh, with citrus, stone-fruit and waxy notes", correct: true }
        - { text: "Deeply coloured, highly tannic and black-fruited", correct: false }
        - { text: "Sweet, sparkling and dominated by Muscat aromas", correct: false }
      explanation: |
        Fiano can give relatively textured, concentrated whites while retaining refreshing acidity. With
        bottle age, high-quality examples may develop honeyed, waxy and nutty complexity.
    fr:
      question: "Quel profil décrit le mieux un bon Fiano di Avellino jeune ?"
      choices:
        - { text: "Léger, peu acide, neutre et destiné à être bu très jeune", correct: false }
        - { text: "Moyennement corsé à corsé et frais, sur les agrumes, les fruits à noyau et des notes cireuses", correct: true }
        - { text: "Très coloré, très tannique et marqué par les fruits noirs", correct: false }
        - { text: "Doux, effervescent et dominé par les arômes muscatés", correct: false }
      explanation: |
        Le Fiano peut donner des blancs assez texturés et concentrés tout en conservant une acidité
        rafraîchissante. Avec l’âge, les meilleurs exemples peuvent développer une complexité miellée,
        cireuse et de fruits à coque.

  - id: sitaly-greco-style-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with Fiano, what profile is typical of young Greco di Tufo?"
      choices:
        - { text: "Softer acidity and overtly tropical sweetness", correct: false }
        - { text: "Higher acidity and a firmer, leaner profile with citrus and stone fruit", correct: true }
        - { text: "Lower acidity with pronounced red-cherry aromas", correct: false }
        - { text: "Deep colour and high tannin from skin contact", correct: false }
      explanation: |
        Greco di Tufo is commonly high in acidity and can feel more structured or austere than Fiano.
        Citrus, green or stone fruit and mineral or smoky nuances are typical reference points.
    fr:
      question: "Par rapport au Fiano, quel profil est typique d’un Greco di Tufo jeune ?"
      choices:
        - { text: "Une acidité plus douce et une sucrosité franchement tropicale", correct: false }
        - { text: "Une acidité plus élevée et un profil plus ferme et élancé, sur les agrumes et les fruits à noyau", correct: true }
        - { text: "Une acidité plus faible avec des arômes prononcés de cerise rouge", correct: false }
        - { text: "Une couleur profonde et des tanins élevés dus au contact avec les peaux", correct: false }
      explanation: |
        Greco di Tufo présente couramment une acidité élevée et peut sembler plus structuré ou austère
        que le Fiano. Agrumes, fruits verts ou à noyau et nuances minérales ou fumées sont des repères
        typiques.

  - id: sitaly-greco-cellar-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, campania]
    status: reviewed
    source_id: c29-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which winemaking approach best preserves the fresh fruit of most Greco di Tufo?"
      choices:
        - { text: "Hot fermentation with deliberate oxidation in new oak", correct: false }
        - { text: "Cool fermentation in inert vessels, sometimes followed by lees ageing", correct: true }
        - { text: "Month-long carbonic maceration of whole red bunches", correct: false }
        - { text: "Fortification before fermentation begins", correct: false }
      explanation: |
