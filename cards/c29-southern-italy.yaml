        - { text: "Negroamaro and Primitivo", correct: true }
        - { text: "Corvina and Rondinella", correct: false }
        - { text: "Pinot Noir and Gamay", correct: false }
      explanation: |
        **Negroamaro and Primitivo.** Primitivo is Zinfandel’s
        cousin.

  - id: sitaly-puglia-igt-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, puglia]
    status: reviewed
    source_id: c29-0028
    review:
