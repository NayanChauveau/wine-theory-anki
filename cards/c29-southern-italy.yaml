      choices:
        - { text: "Une fermentation chaude avec oxydation volontaire en fût neuf", correct: false }
        - { text: "Une fermentation fraîche en cuve inerte, parfois suivie d’un élevage sur lies", correct: true }
        - { text: "Une macération carbonique d’un mois en grappes entières rouges", correct: false }
        - { text: "Un mutage avant le début de la fermentation", correct: false }
      explanation: |
        La cuve inox thermorégulée est courante, car elle conserve le fruit et la fraîcheur. Certains
        producteurs apportent de la texture par un contact avec les lies ou utilisent du bois neutre
        sans faire des arômes de chêne la caractéristique dominante.

