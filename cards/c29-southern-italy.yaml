      question: "Which approach is common for fresh, inexpensive dry whites from Sicily?"
      choices:
        - { text: "Long oxidative ageing in new oak to suppress fruit", correct: false }
        - { text: "Protective stainless-steel fermentation to retain citrus and stone fruit", correct: true }
        - { text: "Extended extraction from black grape skins", correct: false }
        - { text: "Fortification followed by decades in a solera", correct: false }
      explanation: |
        Cool, inert fermentation limits oxidation and preserves primary fruit. Harvest timing and cooler
        sites are important because Sicily’s heat can otherwise reduce acidity.
    fr:
      question: "Quelle approche est courante pour les blancs secs, frais et bon marché de Sicile ?"
      choices:
        - { text: "Un long élevage oxydatif en fût neuf pour supprimer le fruit", correct: false }
        - { text: "Une fermentation protectrice en inox pour préserver agrumes et fruits à noyau", correct: true }
        - { text: "Une extraction prolongée sur des pellicules de raisins noirs", correct: false }
        - { text: "Un mutage suivi de décennies en solera", correct: false }
      explanation: |
        Une fermentation fraîche en milieu inerte limite l’oxydation et préserve le fruit primaire. La
        date de vendange et les sites plus frais comptent, car la chaleur sicilienne peut sinon diminuer
        l’acidité.

