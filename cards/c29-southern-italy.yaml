      choices:
        - { text: "Warm, oxidatively, in new barrique", correct: false }
        - { text: "In stainless steel; some houses use old oak and lees stirring", correct: true }
        - { text: "On skins for a month, by law", correct: false }
        - { text: "Boiled", correct: false }
      explanation: |
        **In stainless steel; some houses use old oak and lees
        stirring.** Texture, not makeup.

  - id: sitaly-greco-age-001
    type: mcq
    deck: Italy::Southern Italy
