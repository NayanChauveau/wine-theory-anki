# deck: Italy::Southern Italy

cards:
  - id: sitaly-map-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does “Southern Italy” cover on the wine map?
      choices:
        - { text: "Only Piedmont and Veneto", correct: false }
        - { text: "South of Lazio to the tip, including Puglia and Sicily", correct: true }
        - { text: "Only Alto Adige", correct: false }
        - { text: "The Loire valley", correct: false }
      explanation: |
        **South of Lazio to the tip, including Puglia and Sicily.**
        Campania and Basilicata sit in that block too.

  - id: sitaly-climate-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy, climate]
    status: reviewed
    source_id: c29-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Southern Italy’s climate change from inland to the sea?
      choices:
        - { text: "Cool and wet everywhere", correct: false }
        - { text: "Hot and dry inland, more humid on the coast; Apennine height and Puglian sea breezes take the edge off", correct: true }
        - { text: "Alpine ice only", correct: false }
        - { text: "A Breton monsoon", correct: false }
      explanation: |
        **Hot and dry inland, more humid on the coast; Apennine
        height and Puglian sea breezes take the edge off.** Etna and
        the Puglian flats are the two extremes.

  - id: sitaly-agri-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the south’s main rural economy?
      choices:
        - { text: "Only ski tourism", correct: false }
        - { text: "Agriculture", correct: true }
        - { text: "Offshore oil only", correct: false }
        - { text: "No farming at all", correct: false }
      explanation: |
        **Agriculture.** Grapes are one crop among wheat, olives and
        vegetables.

  - id: sitaly-volume-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two southern areas make the serious volumes of wine?
      choices:
        - { text: "Valle d’Aosta and Liguria", correct: false }
        - { text: "Puglia and Sicily", correct: true }
        - { text: "Only Barolo", correct: false }
        - { text: "Champagne", correct: false }
      explanation: |
        **Puglia and Sicily.** Campania is the DOCG count, not the
        litre count.

  - id: sitaly-bush-001
    type: mcq
    deck: Italy::Southern Italy
    tags: [italy, southern-italy]
    status: reviewed
    source_id: c29-0005
