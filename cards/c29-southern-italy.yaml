      sources: [known-fact]
    en:
      question: What is typical young Fiano like?
      choices:
        - { text: "Bone-dry, 11%, and only green apple", correct: false }
        - { text: "Medium to full, medium acid, stone fruit, melon and mango", correct: true }
        - { text: "Tannic and gamey", correct: false }
        - { text: "Always sparkling", correct: false }
      explanation: |
        **Medium to full, medium acid, stone fruit, melon and
        mango.** Most is drunk young; better bottles see oak and
        age toward wax and honey.

