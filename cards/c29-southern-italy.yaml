      choices:
        - { text: "Taurasi DOCG", correct: false }
        - { text: "Puglia IGT", correct: true }
        - { text: "Barolo DOCG", correct: false }
        - { text: "Only Champagne AOC", correct: false }
      explanation: |
        **Puglia IGT** — early-drinking, fruity volume. High yield on
