cards:
  - id: vine-crossing-define-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c01-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a controlled cross (cross-fertilisation) in grape breeding?
      choices:
        - { text: "Selecting and propagating a useful mutation found within an existing variety", correct: false }
        - { text: "Pollinating one chosen parent with another and raising the resulting seed", correct: true }
        - { text: "Joining a fruiting scion to a rootstock with complementary traits", correct: false }
        - { text: "Selecting several superior vines and propagating them together by cuttings", correct: false }
      explanation: |
        A cross combines genetic material from two parents through sexual reproduction. The seedling
        is genetically distinct and may be selected as a new variety; clonal or massal selection and
        grafting propagate or combine existing plant material without creating that seedling.

  - id: vine-crossing-how-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c01-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does a planned grape cross actually produce a new variety?
      choices:
        - { text: "A scion and rootstock fuse, combining their chromosomes in every new shoot", correct: false }
        - { text: "Pollen fertilises a chosen flower; a resulting seed is germinated and evaluated", correct: true }
        - { text: "A selected cane is rooted, and its cuttings gradually become a new genotype", correct: false }
        - { text: "Several clones are planted together, and their shared fruit becomes a new variety", correct: false }
      explanation: |
        Fertilisation produces a seed carrying a new combination of genes. Seedlings must then be
        grown and assessed because siblings vary. Chardonnay, for example, arose from Pinot × Gouais
        Blanc; a graft remains the original scion variety on a separate root system.

  - id: vine-growth-warmth-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which base temperature is commonly used to estimate useful growing-season heat for grapevines?
      choices:
        - { text: "Around 0 °C", correct: false }
        - { text: "Around 10 °C", correct: true }
        - { text: "Around 20 °C", correct: false }
        - { text: "Around 30 °C", correct: false }
      explanation: |
        A 10 °C base is widely used in growing-degree-day calculations for vines. It is a practical
        model for comparing heat accumulation, not a claim that all physiological activity starts or
        stops at exactly that temperature.

  - id: vine-heat-respiration-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, physiology]
    status: reviewed
    source_id: c03-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can prolonged heat well above a grapevine's optimum reduce its net carbon gain?
      choices:
        - { text: "Photosynthesis can be impaired while respiration continues consuming carbohydrates", correct: true }
        - { text: "Photosynthesis accelerates indefinitely while respiratory losses fall towards zero", correct: false }
        - { text: "Stomata remain fully open, so heat guarantees unrestricted carbon dioxide uptake", correct: false }
        - { text: "Stored carbohydrates become unavailable because roots enter winter dormancy", correct: false }
      explanation: |
        High temperature can depress photosynthesis, increase respiratory demand and intensify water
        stress, worsening the vine's carbon balance. The response and threshold depend on cultivar,
        acclimation, water status and duration; there is no universal 22 °C crossover.

  - id: vine-cycle-heat-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which climate factor most strongly sets the timing of each stage in the vine's annual cycle?
      choices:
        - { text: "Rainfall pattern", correct: false }
        - { text: "Temperature", correct: true }
        - { text: "Wind exposure", correct: false }
        - { text: "Relative humidity", correct: false }
      explanation: |
        Temperature is the main driver of phenology: accumulated spring warmth advances budburst and
        later stages, while cooler conditions delay them. Water status, cultivar and site also modify
        timing, but temperature provides the strongest broad climatic signal.

  - id: vine-budburst-cool-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In a cooler region, how does budburst usually compare with a warmer site?
      choices:
        - { text: "It usually occurs earlier because winter dormancy lasts longer", correct: false }
        - { text: "It usually occurs later because spring heat accumulates more slowly", correct: true }
        - { text: "It occurs at the same time because latitude affects harvest but not budburst", correct: false }
        - { text: "It depends on rainfall alone because temperature affects only berry ripening", correct: false }
      explanation: |
        Budburst generally waits for adequate accumulated warmth, so cool springs delay it relative to
        warmer sites. Cultivar, pruning, aspect and local conditions also shift the date; the climate
        comparison assumes those factors are otherwise similar.

  - id: vine-cycle-early-001
    type: cloze
    deck: The Vine
    tags: [vine, growth-cycle]
    status: reviewed
    source_id: c03-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      text: |
        After winter rest, the vine's growing season opens in this order:
        {{c1::budburst}}, then {{c2::early shoot and leaf growth}}, then
        {{c3::flowering and fruit set}}.
      extra: |
        Flowering and fruit set establish the potential crop. Berry growth, véraison and ripening then
        lead to harvest, followed by reserve storage, leaf fall and winter dormancy.

  - id: vine-cycle-late-001
    type: cloze
    deck: The Vine
    tags: [vine, growth-cycle]
    status: reviewed
    source_id: c03-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      text: |
        After flowering and fruit set, the vine's year finishes in this
        order: {{c1::véraison / berry ripening}}, then {{c2::harvest}},
        then {{c3::winter dormancy}}.
      extra: |
        Véraison begins the ripening phase rather than marking full maturity. After harvest, leaves can
        continue photosynthesising and replenishing reserves before leaf fall and dormancy.

  - id: vine-latitude-cool-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, latitude]
    status: reviewed
    source_id: c03-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: All else equal, how does moving a vineyard farther from the equator change typical temperature?
      choices:
        - { text: "It becomes warmer because summer days are longer", correct: false }
        - { text: "It becomes cooler on average as the annual solar angle declines", correct: true }
        - { text: "Its mean temperature remains unchanged because day length offsets solar angle", correct: false }
        - { text: "Its seasonal temperature range narrows as winters receive more direct sunlight", correct: false }
      explanation: |
        Higher latitudes receive less intense solar radiation on average and usually have cooler mean
        temperatures and stronger seasonality. Altitude, ocean currents and continentality can alter
        or outweigh the simple latitude trend at a particular site.

  - id: vine-four-inputs-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which four site resources are central to grapevine growth and fruit ripening?
      choices:
        - { text: "Heat, sunlight, water and mineral nutrients", correct: true }
        - { text: "Heat, wind speed, slope angle and soil colour", correct: false }
        - { text: "Sunlight, humidity, planting density and pruning", correct: false }
        - { text: "Water, altitude, trellis height and row direction", correct: false }
      explanation: |
        Heat regulates development, sunlight powers photosynthesis, water sustains transport and gas
        exchange, and mineral nutrients support metabolism and tissue growth. Vineyard design and
        management influence access to these resources but are not themselves the four resources.

  - id: vine-heat-sources-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which process best describes how a vineyard receives and redistributes heat?
      choices:
        - { text: "Solar radiation warms vine and ground; the ground can absorb and reradiate energy", correct: true }
        - { text: "Air movement creates heat independently of solar radiation and surface temperature", correct: false }
        - { text: "Irrigation supplies most vineyard heat as water evaporates from leaves and soil", correct: false }
        - { text: "Root respiration warms the canopy enough to determine the site's growing season", correct: false }
      explanation: |
        The sun is the primary energy source. Soil and stones absorb part of that radiation and later
        release heat, modifying temperatures close to the canopy. Dark Mosel slate and the galets of
        Châteauneuf-du-Pape illustrate the effect without creating heat independently.

  - id: vine-light-reflect-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can a pale or stony vineyard surface increase the light reaching a grapevine canopy?
      choices:
        - { text: "By reflecting part of the incoming solar radiation towards leaves and bunches", correct: true }
        - { text: "By converting mineral nutrients into light that enters the lower leaf surface", correct: false }
        - { text: "By increasing day length after sunset through stored heat in the stones", correct: false }
        - { text: "By concentrating ultraviolet radiation while blocking the visible wavelengths", correct: false }
      explanation: |
        Reflective ground can redirect sunlight into shaded parts of the canopy and fruit zone. The
        size of the effect depends on surface colour, angle, canopy structure and moisture; reflected
        light supplements rather than replaces direct sunlight.

  - id: vine-water-sources-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does a grapevine obtain the water it uses?
      choices:
        - { text: "Roots take up water supplied by rainfall or irrigation and retained in the soil profile", correct: true }
        - { text: "Leaves absorb most water directly from rain, dew and humid air during the night", correct: false }
        - { text: "Berries draw water from the atmosphere and then transfer it downwards to the roots", correct: false }
        - { text: "Roots create water from soil minerals when rainfall and irrigation are unavailable", correct: false }
      explanation: |
        Roots absorb water held in pores and fissures in soil and weathered rock. Rainfall replenishes
        that reserve, and irrigation can supplement it where permitted and necessary. Rooting depth,
        soil texture and effective soil volume govern how much remains accessible.

  - id: vine-nutrient-sources-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where can a vine obtain the mineral nutrients it needs?
      choices:
        - { text: "From the soil solution, replenished by minerals, organic matter and any fertiliser", correct: true }
        - { text: "From atmospheric carbon dioxide, which supplies nitrogen, phosphorus and potassium", correct: false }
        - { text: "From sunlight absorbed by leaves, which converts radiation directly into minerals", correct: false }
        - { text: "From irrigation alone, because dry soil and organic matter contain no plant nutrients", correct: false }
      explanation: |
        Roots take up dissolved mineral ions from the soil solution. Weathering, decomposition of
        organic matter and fertiliser can replenish that supply, while soil pH and water status affect
        whether nutrients are available to the vine.

  - id: vine-freeze-union-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, grafting]
    status: reviewed
    source_id: c03-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which part of a grafted vine is particularly vulnerable to winter cold and is often protected by hilling?
      choices:
        - { text: "The exposed graft union between scion and rootstock", correct: true }
        - { text: "The deepest fine roots below the winter frost line", correct: false }
        - { text: "The mature trunk well above the graft union", correct: false }
        - { text: "The distal buds on retained one-year-old canes", correct: false }
      explanation: |
        The union is exposed close to the soil surface and can be more cold-sensitive than protected
        underground tissues. If it dies, surviving rootstock suckers do not preserve the fruiting
        variety, so cold-climate growers may mound soil over the join.

  - id: vine-freeze-hilling-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, grafting]
    status: reviewed
    source_id: c03-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do growers usually shield a graft union from winter freeze?
      choices:
        - { text: "Bank soil over the union so the ground insulates it during the coldest period", correct: true }
        - { text: "Use wind machines whenever dormant wood approaches its minimum winter temperature", correct: false }
        - { text: "Delay winter pruning so retained canes conduct heat from the trellis into the union", correct: false }
        - { text: "Apply overhead irrigation until an ice layer encloses the dormant trunk and cordons", correct: false }
      explanation: |
        Hilling uses soil as insulation around the vulnerable join; some very cold regions bury
        retained canes as additional insurance. The mound is removed in spring to discourage the
        scion from rooting above the rootstock.

  - id: vine-spring-frost-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a spring frost do to a vine that has already burst?
      choices:
        - { text: "It can kill primary buds and green shoots, reducing the potential crop", correct: true }
        - { text: "It mainly kills deep roots while leaving exposed green growth unaffected", correct: false }
        - { text: "It advances flowering by increasing the vine's accumulated spring heat", correct: false }
        - { text: "It improves fruit set by shortening the period between budburst and bloom", correct: false }
      explanation: |
        De-acclimated green tissue is much less cold-hardy than dormant wood. Secondary or tertiary
        buds may produce replacement shoots after injury, but they are often less fruitful, so the
        crop can be substantially reduced.

  - id: vine-mild-winter-dormancy-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What can insufficient winter chilling do to grapevine budburst the following spring?
      choices:
        - { text: "Delay and desynchronise budburst across canes and vines", correct: true }
        - { text: "Advance every bud equally because dormancy ends without a chilling requirement", correct: false }
        - { text: "Increase cold hardiness so buds remain dormant throughout the growing season", correct: false }
        - { text: "Synchronise flowering even if individual buds open at widely different dates", correct: false }
      explanation: |
        Grapevine buds have a chilling requirement that varies by cultivar. In genuinely warm-winter
        regions, insufficient chill can cause delayed or uneven budburst and subsequent uneven crop
        development; an occasionally mild temperate winter is not automatically equivalent.

  - id: vine-tropical-double-crop-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can some tropical vineyards schedule more than one grape crop in a year?
      choices:
        - { text: "Use pruning and irrigation to impose separate growth and fruiting cycles", correct: true }
        - { text: "Rely on winter chilling to trigger two natural budbursts a few weeks apart", correct: false }
        - { text: "Leave every shoot unpruned so old and new bunches ripen simultaneously", correct: false }
        - { text: "Withhold water throughout both cycles so dormancy and flowering overlap", correct: false }
      explanation: |
        Where temperature permits year-round growth, growers can use pruning and control of irrigation
        to start and time production cycles rather than relying on winter dormancy. Brazil's São
        Francisco Valley is a prominent example, with harvest timing chosen for market needs.

  - id: vine-summer-heat-ripening-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Before heat becomes severe enough to shut down the canopy, what ripening tendency is associated with warmer conditions?
      choices:
        - { text: "Faster sugar accumulation and acid loss, leading to riper fruit profiles", correct: true }
        - { text: "Slower sugar accumulation and higher acidity, leading to leaner fruit profiles", correct: false }
        - { text: "Unchanged sugar and acid because temperature affects phenology but not composition", correct: false }
        - { text: "Lower potential alcohol and delayed flavour development despite earlier harvest", correct: false }
      explanation: |
        Warmer conditions generally accelerate sugar accumulation and acid respiration, altering the
        balance and style at harvest. Extreme heat and water stress can instead impair photosynthesis,
        cause sunburn or stall ripening, so the response is not unlimited.

  - id: vine-drought-collapse-001
    type: mcq
    deck: The Vine
    tags: [vine, water, climate]
    status: reviewed
    source_id: c03-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: If a hot summer also leaves the vine short of water, what can happen in the vineyard?
      choices:
        - { text: "Severe stress can close stomata, stall ripening, cause leaf loss and eventually kill vines", correct: true }
        - { text: "Severe stress increases transpiration, keeping leaves cool and photosynthesis near its maximum", correct: false }
        - { text: "Water shortage speeds berry growth because roots redirect moisture from the trunk", correct: false }
        - { text: "Deep roots make grapevines insensitive to prolonged deficits in the accessible soil", correct: false }
      explanation: |
        Stomatal closure conserves water but also limits carbon dioxide uptake and evaporative cooling.
        If stress intensifies, photosynthesis and ripening decline, leaves may abscise and hydraulic
        failure can kill tissue or whole vines. A controlled mild deficit is a different condition.

  - id: vine-photosynthesis-light-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In a shaded or cloudy canopy, what most often limits how fast photosynthesis can run?
      choices:
        - { text: "Light intensity at the leaf surface", correct: true }
        - { text: "Mineral concentration in ripe berry juice", correct: false }
        - { text: "Age of the permanent trunk wood", correct: false }
        - { text: "Number of seeds inside each berry", correct: false }
      explanation: |
        Photosynthetic rate rises with usable light until the leaf reaches saturation. Water status,
        carbon dioxide and temperature also constrain the process, but low irradiance is the direct
        limitation in a deeply shaded or overcast canopy.

  - id: vine-habitat-woodland-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which habitat best matches the natural climbing habit of many wild Vitis species?
      choices:
        - { text: "Woodland margins and riparian forests with trees for support", correct: true }
        - { text: "Open semi-arid grassland with no taller woody vegetation", correct: false }
        - { text: "High alpine heath above the natural tree line", correct: false }
        - { text: "Waterlogged salt marsh exposed to regular tidal flooding", correct: false }
      explanation: |
        Wild grapevines are lianas: they use neighbouring trees and shrubs as support while climbing
        towards light. Vineyard stakes and trellises manage this inherited growth habit in a regular,
        accessible form.

  - id: vine-habitat-canopy-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does a wild grapevine tend to flower and fruit most successfully after reaching a well-lit woodland canopy?
      choices:
        - { text: "Greater light supports photosynthesis and the carbon cost of reproduction", correct: true }
        - { text: "Higher wind speed replaces the need for leaf photosynthesis", correct: false }
        - { text: "Tree shade raises berry temperature and guarantees seed formation", correct: false }
        - { text: "Contact with branches changes vegetative shoots directly into flowers", correct: false }
      explanation: |
        A climbing vine can invest first in reaching stronger light, where its leaves can support the
        high carbon demand of flowering and fruit development. The response is physiological rather
        than a direct conversion triggered by touching a tree.

  - id: vine-habitat-dispersal-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does fruiting in a well-lit woodland canopy aid the natural dispersal of wild grapevines?
      choices:
        - { text: "Visible ripe berries attract animals that carry or deposit the seeds elsewhere", correct: true }
        - { text: "Direct sun makes seeds airborne so they disperse independently of animals", correct: false }
        - { text: "Canopy height prevents animals eating the fruit before seeds become viable", correct: false }
        - { text: "Light causes mature berries to root directly while still attached to the vine", correct: false }
      explanation: |
        Colourful, exposed berries are easier for birds and mammals to find. Animals consume the fruit
        and move the seeds away from the parent plant, helping the species colonise new supports and
        habitats.

  - id: vine-water-jobs-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which three jobs does water do for a grapevine in the growing season?
      choices:
        - { text: "Maintains cell turgor, enables evaporative cooling and contributes to berry growth", correct: true }
        - { text: "Raises soil salinity, closes stomata and prevents berries from expanding", correct: false }
        - { text: "Replaces mineral nutrition, fixes carbon and supplies heat to the canopy", correct: false }
        - { text: "Hardens dormant buds, lowers humidity and stops all respiratory losses", correct: false }
      explanation: |
        Water pressure keeps soft tissues expanded, transpiration removes heat from leaves and water
        forms much of the berry's volume. It also transports dissolved substances and is a reactant in
        photosynthesis, so the three functions are a learning framework rather than an exhaustive list.

  - id: vine-transpiration-001
    type: mcq
    deck: The Vine
    tags: [vine, water, physiology]
    status: reviewed
    source_id: c03-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is transpiration in a grapevine?
      choices:
        - { text: "Water vapour leaves mainly through stomata, helping draw water through the vine", correct: true }
        - { text: "Liquid water moves from leaves to roots through phloem as sugars accumulate", correct: false }
        - { text: "Roots consume oxygen and release carbon dioxide while producing new tissue", correct: false }
        - { text: "Mineral ions diffuse from the soil into roots without accompanying water flow", correct: false }
      explanation: |
        Evaporation from moist leaf surfaces and diffusion through stomata create tension in the xylem,
        drawing a continuous water column upwards. Transpiration also cools leaves but can intensify
        water stress when atmospheric demand is high.

  - id: vine-water-use-heat-001
    type: mcq
    deck: The Vine
    tags: [vine, water, climate]
    status: reviewed
    source_id: c03-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Holding relative humidity, wind and leaf area constant, what does higher air temperature usually do to grapevine transpiration?
      choices:
        - { text: "It usually increases transpiration by raising atmospheric demand for water", correct: true }
        - { text: "It usually decreases transpiration by lowering the vapour-pressure deficit", correct: false }
        - { text: "It leaves transpiration unchanged because stomata respond to light alone", correct: false }
        - { text: "It reverses xylem flow so water moves from leaves back to roots", correct: false }
      explanation: |
        Warmer air can hold more water vapour, so at unchanged relative humidity it increases the
        vapour-pressure deficit and potential water loss. Actual transpiration also depends on stomatal
        closure, wind, radiation, humidity and soil water availability.

  - id: vine-mild-deficit-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can a controlled moderate water deficit after canopy establishment improve vine balance?
      choices:
        - { text: "It restrains further shoot growth without necessarily stopping canopy photosynthesis", correct: true }
        - { text: "It stimulates lateral shoot growth and creates a denser, more shaded canopy", correct: false }
        - { text: "It prevents roots taking up minerals while increasing berry water content", correct: false }
        - { text: "It accelerates transpiration until leaves lose turgor and ripening stops", correct: false }
      explanation: |
        Moderate deficit can slow unwanted vegetative growth, improve fruit-zone exposure and help
        balance canopy and crop while leaves remain functional. The result depends on timing and
        severity; excessive stress closes stomata and restricts ripening.

  - id: vine-rain-flowering-001
    type: mcq
    deck: The Vine
    tags: [vine, water, growth-cycle]
    status: reviewed
    source_id: c03-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a major consequence of cold, rainy weather during grapevine flowering?
      choices:
        - { text: "Poor fertilisation and fruit set, reducing or making bunches uneven", correct: true }
        - { text: "Earlier véraison because flowers accumulate sugar before berries form", correct: false }
        - { text: "Greater bud fertility because rain warms the inflorescences", correct: false }
        - { text: "Faster berry dehydration because wet flowers transpire more rapidly", correct: false }
      explanation: |
        Unfavourable bloom weather can interfere with cap fall, pollination and fertilisation, causing
        coulure or uneven berry development. Rain near harvest creates different risks, including
        dilution, splitting and rot.

  - id: vine-drip-define-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which description distinguishes drip irrigation from flood or overhead-sprinkler irrigation?
      choices:
        - { text: "Emitters deliver small, controlled volumes close to individual vines", correct: true }
        - { text: "Water is released into furrows and allowed to flow across the whole block", correct: false }
        - { text: "Large sprinklers apply water above the canopy across a broad area", correct: false }
        - { text: "Subsoil is saturated once in winter and no growing-season water is applied", correct: false }
      explanation: |
        Drip lines use emitters to place water slowly and locally near the vine's active root zone.
        This gives greater control and usually reduces evaporation and runoff relative to broad-area
        systems, although installation, filtration and maintenance add cost.

  - id: vine-drip-metering-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What management advantage does a zoned drip-irrigation system offer?
      choices:
        - { text: "Watering time and volume can be adjusted by block or zone", correct: true }
        - { text: "Every emitter automatically measures vine water status without sensors", correct: false }
        - { text: "All soil differences are eliminated once equal volumes are applied", correct: false }
        - { text: "Roots are forced to remain directly beneath a single emitter", correct: false }
      explanation: |
        Valves and controllers can schedule separate irrigation zones, allowing doses to reflect soil,
        slope, variety or vine demand. Emitters meter delivery, but the system does not by itself sense
        stress or erase variation in soil and vine performance.

  - id: vine-drought-stomata-001
    type: mcq
    deck: The Vine
    tags: [vine, water, physiology]
    status: reviewed
    source_id: c03-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is an early physiological response when a grapevine experiences water deficit?
      choices:
        - { text: "Stomata partly close, reducing transpiration and carbon dioxide uptake", correct: true }
        - { text: "Stomata open wider, increasing water loss while conserving carbon", correct: false }
        - { text: "Xylem reverses direction and returns leaf water to the soil", correct: false }
        - { text: "Photosynthesis accelerates because leaf cooling is no longer needed", correct: false }
      explanation: |
        Stomatal closure limits water loss, but it also restricts carbon dioxide entry and therefore
        photosynthesis. It can protect the vine during a short deficit; prolonged or severe stress can
        still impair canopy function and ripening.

  - id: vine-excess-water-vigour-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In warm conditions with adequate nitrogen, what is a likely effect of abundant soil water?
      choices:
        - { text: "Strong shoot and lateral growth that may create a dense canopy", correct: true }
        - { text: "Immediate shoot cessation and early entry into winter dormancy", correct: false }
        - { text: "Permanent stomatal closure despite plentiful root-zone water", correct: false }
        - { text: "Complete suppression of berry expansion after fruit set", correct: false }
      explanation: |
        Water and nitrogen availability can sustain vigorous vegetative growth. If unmanaged, a dense
        canopy shades leaves and fruit, retains humidity and competes with the crop; water alone does
        not determine vigour because soil, rootstock, temperature and crop load also matter.

  - id: vine-vigour-sugar-001
    type: mcq
    deck: The Vine
    tags: [vine, water, physiology]
    status: reviewed
    source_id: c03-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can prolonged shoot growth during ripening delay grape maturity?
      choices:
        - { text: "Growing shoot tips remain competing sinks for the vine's carbohydrates", correct: true }
        - { text: "New shoots convert berry sugar back into mineral nitrogen", correct: false }
        - { text: "Actively growing leaves cease photosynthesis as soon as véraison begins", correct: false }
        - { text: "Shoot growth blocks water movement through every fruiting cane", correct: false }
      explanation: |
        Both expanding shoots and ripening berries require carbohydrates. Continued vegetative growth
        can compete with the crop and often accompanies excess shading, so balanced vines are more
        likely to ripen fruit evenly than vines dominated by shoot growth.

  - id: vine-vigour-shade-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which problem is most directly caused by an excessively dense grapevine canopy?
      choices:
        - { text: "Poor light and airflow around fruit and interior leaves", correct: true }
        - { text: "Excess ultraviolet exposure on every bunch surface", correct: false }
        - { text: "Rapid drying of bunches after rain because wind speed rises", correct: false }
        - { text: "Loss of all photosynthetic leaf area before véraison", correct: false }
      explanation: |
        Crowded foliage shades fruit and inner leaves and restricts airflow. The resulting humid,
        slow-drying fruit zone can increase disease pressure and make ripening less even; canopy
        management aims to improve exposure without causing sunburn.

  - id: vine-hail-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can a severe hailstorm close to véraison cause both immediate and later losses?
      choices:
        - { text: "It can wound berries and foliage, inviting rot and damaging future fruiting wood", correct: true }
        - { text: "It dilutes berry juice but leaves skins, leaves and shoots physically intact", correct: false }
        - { text: "It sterilises damaged berries, so disease risk falls after the storm", correct: false }
        - { text: "It affects only the current crop because shoots and buds cannot be injured", correct: false }
      explanation: |
        Hail can split or bruise berries, destroy leaf area and break shoots. Wounds raise the risk of
        rot in the current crop, while damage to canes or buds may also reduce the following year's
        potential. Nets can reduce damage where their use is practical and permitted.

  - id: vine-maritime-rain-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can frequent growing-season rain be especially challenging in a maritime vineyard?
      choices:
        - { text: "It can disrupt fruit set and sustain fungal-disease pressure near harvest", correct: true }
        - { text: "It always lowers humidity around bunches and shortens leaf-wetness periods", correct: false }
        - { text: "It guarantees even ripening by removing all variation in water supply", correct: false }
        - { text: "It prevents vigorous canopy growth even when soils remain moist", correct: false }
      explanation: |
        Cool, wet flowering weather can reduce fruit set, while rain and humidity later in the season
        favour downy mildew and bunch rots and may delay harvest. Maritime influence moderates
        temperature, but does not mean that every maritime region or vintage is equally wet.

  - id: vine-soil-ideal-001
    type: mcq
    deck: The Vine
    tags: [vine, soil, water]
    status: reviewed
    source_id: c03-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which soil combination most often helps a grower maintain balanced vine growth?
      choices:
        - { text: "Good drainage, moderate fertility and enough available water to avoid severe stress", correct: true }
        - { text: "Poor drainage, abundant nitrogen and a permanently saturated root zone", correct: false }
        - { text: "Very low water-holding capacity with no possibility of irrigation", correct: false }
        - { text: "High salinity, shallow rooting depth and rapid surface runoff", correct: false }
      explanation: |
        There is no universally ideal soil type. In many sites, drainage protects roots from
        waterlogging, moderate fertility limits excessive vigour, and sufficient stored or supplied
        water keeps the vine functional through the growing season.

  - id: vine-water-season-001
    type: mcq
    deck: The Vine
    tags: [vine, water, growth-cycle]
    status: reviewed
    source_id: c03-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When is a controlled water deficit commonly used to restrain shoot growth and berry size without directly starving early establishment?
      choices:
        - { text: "After fruit set and before véraison", correct: true }
        - { text: "From budburst through flowering", correct: false }
        - { text: "Only after severe leaf wilting begins at véraison", correct: false }
        - { text: "During winter dormancy, before roots become active", correct: false }
      explanation: |
        Regulated deficit irrigation is often applied between fruit set and véraison, when moderate
        stress can curb vegetative growth and limit berry expansion. The exact timing and severity
        depend on cultivar, site and production goal; severe stress can reduce yield or delay ripening.

  - id: vine-nutrient-vigour-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the most likely effect of excessive nitrogen availability in a vineyard?
      choices:
        - { text: "Strong vegetative growth and a denser canopy", correct: true }
        - { text: "Earlier shoot cessation and reduced leaf area", correct: false }
        - { text: "Lower disease pressure because bunches dry faster", correct: false }
        - { text: "Guaranteed higher fruit quality regardless of yield", correct: false }
      explanation: |
        Nitrogen supports growth, but excess supply can prolong shoot development, increase shading
        and create a humid canopy. These effects can delay ripening and favour disease, so growers aim
        for adequate nutrition rather than maximum nutrient availability.

  - id: vine-chlorosis-define-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What vineyard symptom does the term chlorosis describe?
      choices:
        - { text: "Yellowing of normally green leaf tissue because chlorophyll is deficient", correct: true }
        - { text: "Necrotic lesions caused specifically by downy mildew infection", correct: false }
        - { text: "Reddening of berry skins as anthocyanins accumulate at véraison", correct: false }
        - { text: "Callus formation where the scion and rootstock have joined", correct: false }
      explanation: |
        Chlorosis is a symptom, not a single disease: affected tissue lacks enough chlorophyll and
        appears pale or yellow. Iron unavailability is a common vineyard cause, but magnesium,
        nitrogen, root damage and other problems can also produce chlorotic patterns.

  - id: vine-chlorosis-yield-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can severe, persistent leaf chlorosis reduce grape yield and quality?
      choices:
        - { text: "Reduced chlorophyll limits photosynthesis and the carbohydrates available to fruit", correct: true }
        - { text: "Yellow leaves absorb more light and divert extra sugar into the berries", correct: false }
        - { text: "Chlorosis increases root pressure until berries split in every vintage", correct: false }
        - { text: "It converts fruiting buds into roots during the following winter", correct: false }
      explanation: |
        Chlorotic leaves capture less light and generally photosynthesise less effectively. If the
        condition is severe, the vine has fewer carbohydrates for growth, fruit development and
        reserves, which can depress both current performance and future productivity.

  - id: vine-chlorosis-iron-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In lime-induced chlorosis, why can a vine show iron deficiency even when the soil contains iron?
      choices:
        - { text: "High-pH conditions make much of the iron poorly available for root uptake", correct: true }
        - { text: "Calcium carbonate converts iron directly into chlorophyll outside the roots", correct: false }
        - { text: "Iron remains available, but the scion sends it permanently into old wood", correct: false }
        - { text: "High pH dissolves iron so rapidly that it is lost through leaf transpiration", correct: false }
      explanation: |
        In alkaline, carbonate-rich soils, iron may be present but chemically unavailable to the
        roots. Because iron is needed for normal chlorophyll formation, young leaves commonly develop
        interveinal yellowing while their veins remain greener.

  - id: vine-chlorosis-limestone-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients, soil]
    status: reviewed
    source_id: c03-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which site condition creates the greatest risk of lime-induced iron chlorosis?
      choices:
        - { text: "A calcareous soil with high pH and abundant active lime", correct: true }
        - { text: "An acidic sandy soil with little calcium carbonate", correct: false }
        - { text: "A neutral loam with freely available iron and good drainage", correct: false }
        - { text: "A volcanic soil whose pH is low and carbonate content minimal", correct: false }
      explanation: |
        High pH and active calcium carbonate reduce iron availability. On susceptible sites, growers
        can select lime-tolerant rootstocks such as Fercal or 41 B; suitability still depends on the
        site's other constraints, including water supply and desired vigour.

  - id: vine-species-pair-001
    type: mcq
    deck: The Vine
    tags: [vine, species]
    status: reviewed
    source_id: c03-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which pairing correctly describes the main roles of European and American *Vitis* material in most grafted vineyards?
      choices:
        - { text: "*V. vinifera* supplies the fruiting scion; American species contribute rootstock traits", correct: true }
        - { text: "American species supply every fruiting scion; *V. vinifera* is used only below ground", correct: false }
        - { text: "Both groups are mixed as seeds at planting, producing a graft union as they germinate", correct: false }
        - { text: "*V. vinifera* supplies both parts because American species cannot resist soil pests", correct: false }
      explanation: |
        Most internationally important wine varieties are *V. vinifera*. Their scions are commonly
        grafted to rootstocks derived from American species such as *V. riparia*, *V. rupestris* and
        *V. berlandieri*, selected for phylloxera resistance and site adaptation.

  - id: vine-vinifera-wine-001
    type: mcq
    deck: The Vine
    tags: [vine, species]
    status: reviewed
    source_id: c03-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: To which species do Chardonnay, Cabernet Sauvignon and Riesling all belong?
      choices:
        - { text: "*Vitis vinifera*", correct: true }
        - { text: "*Vitis riparia*", correct: false }
        - { text: "*Vitis rupestris*", correct: false }
        - { text: "*Vitis labrusca*", correct: false }
      explanation: |
        These three cultivars are all *Vitis vinifera*, the species responsible for most classic wine
        varieties. Other *Vitis* species are important in rootstocks, breeding and some regional
        fruiting varieties, so *vinifera* is dominant rather than exclusive.

  - id: vine-american-phylloxera-001
    type: mcq
    deck: The Vine
    tags: [vine, species, grafting]
    status: reviewed
    source_id: c03-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why are rootstocks derived from American *Vitis* species widely used beneath *V. vinifera* scions?
      choices:
        - { text: "Their roots tolerate or resist phylloxera attack better than *vinifera* roots", correct: true }
        - { text: "Their roots prevent every fungal disease from infecting the *vinifera* canopy", correct: false }
        - { text: "Their roots change the scion genetically into an American grape species", correct: false }
        - { text: "Their roots eliminate the effects of drought, salinity and soil pH on the vine", correct: false }
      explanation: |
        Phylloxera can fatally damage susceptible *vinifera* roots. American species co-evolved with
        the insect and provide useful resistance or tolerance, while the grafted *vinifera* scion
        retains the fruit characteristics of the chosen wine variety.

  - id: vine-cutting-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c03-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the genetic relationship between a healthy grapevine cutting and the vine from which it was taken?
      choices:
        - { text: "It is a vegetatively propagated copy, apart from any later mutation", correct: true }
        - { text: "It combines genes from the source vine and the soil in which it roots", correct: false }
        - { text: "It is a seedling with a new combination of parental genes", correct: false }
        - { text: "It contains only rootstock genes once its own roots develop", correct: false }
      explanation: |
        A cutting is a piece of vegetative material induced to form roots and shoots. It normally
        preserves the source vine's genotype, unlike sexual propagation from seed. Mutations can arise
        over time and are one source of clonal variation within a variety.

  - id: vine-variety-name-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c03-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In viticulture, what does a grape variety such as Chardonnay represent?
      choices:
        - { text: "A cultivar within a species", correct: true }
        - { text: "A single certified clone within a cultivar", correct: false }
        - { text: "A rootstock-scion combination", correct: false }
        - { text: "A species containing all wine grapes", correct: false }
      explanation: |
        Chardonnay is a cultivar of *Vitis vinifera*. A clone is a selected vegetative line within a
        cultivar, while a grafted plant combines a scion cultivar with a genetically distinct
        rootstock; these levels should not be used interchangeably.

  - id: vine-clone-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c03-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a grapevine clone?
      choices:
        - { text: "A new variety grown from a seeded cross of two parents", correct: false }
        - { text: "The vegetatively propagated line of one mother vine, kept for a stable set of traits", correct: true }
        - { text: "Any single vine in a row, regardless of origin", correct: false }
        - { text: "A hybrid whose parents come from two species", correct: false }
      explanation: |
        **The vegetatively propagated line of one mother vine, kept
        for a stable set of traits.** Pinot Noir Dijon 115 is a clone,
        still Pinot Noir. One random vine in a mixed block is not
        "a clone." A seed-grown seedling is a new genotype.

  - id: vine-hybrid-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c03-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a grapevine hybrid?
      choices:
        - { text: "A vinifera × vinifera cross such as Cabernet Sauvignon", correct: false }
        - { text: "A vine whose parents come from two different vine species", correct: true }
        - { text: "A cutting taken from one mother vine", correct: false }
        - { text: "A vinifera scion grafted onto an American rootstock", correct: false }
      explanation: |
        **A vine whose parents come from two different vine species.**
        Vidal and Seyval are named hybrids. Cabernet Sauvignon is a
        vinifera **cross** (Cabernet Franc × Sauvignon Blanc), not a
        hybrid. A graft is still two plants, not a seedling.

  - id: vine-hybrid-rootstock-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding, grafting]
    status: reviewed
    source_id: c03-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Hybrids and American-species crosses are most often planted as what in the vineyard?
      choices:
        - { text: "The only legal fruiting varieties in every European AOC", correct: false }
        - { text: "Rootstocks", correct: true }
        - { text: "Oak alternatives in the cellar", correct: false }
        - { text: "Replacing drip emitters", correct: false }
      explanation: |
        **Rootstocks.** Most commercial roots are American species or
        interspecific crosses (1103 Paulsen, SO4, 3309). A few hybrids
        are still grown for fruit — Vidal in Canada is the named
        exception — but that is not their main job.

  - id: vine-rootstock-nematode-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides phylloxera resistance, what pest problem can some rootstocks also help with?
      choices:
        - { text: "Only birds eating ripe berries", correct: false }
        - { text: "Nematodes in the soil", correct: true }
        - { text: "Cork taint in bottle", correct: false }
        - { text: "Spring frost on burst shoots", correct: false }
      explanation: |
        **Nematodes in the soil.** Some American-based stocks tolerate
        root-knot or dagger nematodes that would wreck own-rooted
        vinifera. Phylloxera is still the first reason to graft.

  - id: vine-rootstock-drought-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting, water]
    status: reviewed
    source_id: c03-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides phylloxera resistance, what climate stress can some rootstocks also help a vine survive?
      choices:
        - { text: "A legal cap on sunshine hours", correct: false }
        - { text: "Drought", correct: true }
        - { text: "Bottle shock after bottling", correct: false }
        - { text: "Coulure caused by rain at flowering", correct: false }
      explanation: |
        **Drought.** Deep or efficient roots (110 Richter, 1103
        Paulsen) keep a vine going on a dry site. They do not remove
        the need for water; they improve the vine's reach.

  - id: vine-grafting-define-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is grafting on a grapevine?
      choices:
        - { text: "Growing a new variety from a seeded cross", correct: false }
        - { text: "Joining a fruiting scion, usually vinifera, onto a rootstock", correct: true }
        - { text: "Selecting a clone by taking cuttings from one mother vine", correct: false }
        - { text: "Crossing two different vine species to make a hybrid", correct: false }
      explanation: |
        **Joining a fruiting scion, usually vinifera, onto a
        rootstock.** The top remains the wine grape; the roots are
        usually American or a hybrid stock. Grafting copies nothing
        new and breeds nothing new.

  - id: vine-bench-graft-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grafting method do nurseries use most often today?
      choices:
        - { text: "Head grafting an old trunk in the field", correct: false }
        - { text: "Bench grafting", correct: true }
        - { text: "Sowing seeds of the scion onto the rootstock", correct: false }
        - { text: "Tying two live vines together and waiting for a hybrid", correct: false }
      explanation: |
        **Bench grafting.** The join is made indoors on the nursery
        bench, then the plants are callused and sold. Head grafting
        is the field method for changing an established vineyard.

  - id: vine-bench-graft-how-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is bench grafting carried out?
      choices:
        - { text: "A whole mature vine is planted on top of another in the row", correct: false }
        - { text: "Short cane pieces of scion and rootstock are machine-joined, then kept warm so the join fuses", correct: true }
        - { text: "Pollen from one species is brushed onto another and the seed is sown", correct: false }
        - { text: "Only the leaves of two vines are pinned together", correct: false }
      explanation: |
        **Short cane pieces of scion and rootstock are machine-joined,
        then kept warm so the join fuses.** The warm, humid callusing
        room grows the callus. That is still two genotypes sharing
        one plant, not a cross.

  - id: vine-head-graft-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grafting method puts a new scion onto an established trunk in the vineyard?
      choices:
        - { text: "Bench grafting in a nursery callusing room", correct: false }
        - { text: "Head grafting", correct: true }
        - { text: "Crossing two vinifera parents for seed", correct: false }
        - { text: "Massal selection of cuttings only", correct: false }
      explanation: |
        **Head grafting.** Also called top-working: the existing vine
        stays in place and a new scion is put on the trunk. Nurseries
        prefer bench grafting for new plants.

  - id: vine-head-graft-when-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When does a grower usually choose head grafting?
      choices:
        - { text: "When raising brand-new plants on the nursery bench", correct: false }
        - { text: "When an established vineyard must change variety from one season to the next", correct: true }
        - { text: "When breeding a hybrid from two species", correct: false }
        - { text: "When the vine is still a rooted cutting in the pot", correct: false }
      explanation: |
        **When an established vineyard must change variety from one
        season to the next.** Pulling vines and replanting costs years
        of crop. Head grafting keeps the old roots and puts a new
        fruiting variety on top.

  - id: vine-head-graft-how-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is head grafting done on an established vine?
      choices:
        - { text: "The whole vine is pulled and a seedling is sown in its place", correct: false }
        - { text: "The vine is cut back to the trunk, then a bud or cutting of the new variety is grafted onto that trunk", correct: true }
        - { text: "Pollen of the new variety is dusted on the old flowers", correct: false }
        - { text: "Only the rootstock is replaced; the old canopy stays", correct: false }
      explanation: |
        **The vine is cut back to the trunk, then a bud or cutting of
        the new variety is grafted onto that trunk.** Next season's
        shoots are the new cultivar on the old roots. That is a field
        join, not a nursery bench graft and not a seed-grown cross.

  - id: vine-head-graft-advantages-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why might a grower head-graft an established vineyard instead of replanting it?
      choices:
        - { text: "It changes the cultivar while retaining the established trunk and root system", correct: true }
        - { text: "It replaces an unsuitable rootstock while leaving the existing cultivar unchanged", correct: false }
        - { text: "It creates a seedling population from which a new cultivar can be selected", correct: false }
        - { text: "It renews exhausted soil by moving each vine to a different position", correct: false }
      explanation: |
        Top-working keeps the mature below-ground system and changes the fruiting cultivar above it.
        This can restore production sooner and at lower establishment cost than removing the vines,
        preparing the site and waiting for replants to mature.

  - id: vine-graft-wax-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0052
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the main purpose of applying grafting wax or a sealing compound around a fresh graft?
      choices:
        - { text: "To seal exposed tissue and limit moisture loss while the union calluses", correct: true }
        - { text: "To supply rooting hormones that make the scion replace the rootstock", correct: false }
        - { text: "To stop sap flow so the scion remains dormant through the growing season", correct: false }
        - { text: "To create an instant bond even when the cambial layers are misaligned", correct: false }
      explanation: |
        A new graft is vulnerable to desiccation before vascular connections form. Wax, tape or a
        suitable grafting compound helps keep the cut surfaces moist and protected; good cambial
        contact and callus growth are what unite scion and rootstock.

  - id: vine-leaf-role-001
    type: mcq
    deck: The Vine
    tags: [vine, anatomy, physiology]
    status: reviewed
    source_id: c03-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the principal physiological role of grapevine leaves?
      choices:
        - { text: "Photosynthesis, producing sugars that support growth and ripening", correct: true }
        - { text: "Anchorage, holding the vine securely in the soil during strong winds", correct: false }
        - { text: "Water storage, supplying the roots through prolonged summer drought", correct: false }
        - { text: "Winter protection, insulating dormant buds from freezing temperatures", correct: false }
      explanation: |
        Chlorophyll in exposed leaves captures light energy and uses it to make carbohydrates. The
        resulting sugars fuel shoot and root growth, berry development and the storage of reserves.

  - id: vine-photosynthesis-equation-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology, photosynthesis]
    status: reviewed
    source_id: c03-0054
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which transformation summarises photosynthesis in a functioning grapevine leaf?
      choices:
        - { text: "Water and carbon dioxide use light energy to form sugars and oxygen", correct: true }
        - { text: "Sugars and oxygen are converted into carbon dioxide, water and energy", correct: false }
        - { text: "Sugars are converted by yeast into alcohol, carbon dioxide and heat", correct: false }
        - { text: "Water and minerals combine without light to form sugars and nitrogen", correct: false }
      explanation: |
        Photosynthesis stores light energy in carbohydrates made from carbon dioxide and water, with
        oxygen released. The reverse-looking sugar-and-oxygen pathway is respiration; alcoholic
        fermentation is a microbial cellar process rather than leaf photosynthesis.

  - id: vine-tendril-role-001
    type: mcq
    deck: The Vine
    tags: [vine, anatomy]
    status: reviewed
    source_id: c03-0055
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do tendrils help a grapevine in its natural climbing habit?
      choices:
        - { text: "They coil around nearby supports and help hold growing shoots in place", correct: true }
        - { text: "They transport sugars from exposed leaves towards developing grape bunches", correct: false }
        - { text: "They regulate water loss by opening and closing pores on the canopy", correct: false }
        - { text: "They lignify into the fruiting canes retained at winter pruning", correct: false }
      explanation: |
        Grapevines are climbers rather than self-supporting trees. Tendrils respond to contact and
        coil around branches, wires or other structures, helping shoots reach and remain in the light.

  - id: vine-pruning-dormant-001
    type: mcq
    deck: The Vine
    tags: [vine, pruning, growth-cycle]
    status: reviewed
    source_id: c03-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When is the main structural pruning of a grapevine normally carried out in a temperate vineyard?
      choices:
        - { text: "During winter dormancy, after leaf fall and before budburst", correct: true }
        - { text: "During flowering, while the inflorescences are releasing pollen", correct: false }
        - { text: "At véraison, as the berries soften and begin to change colour", correct: false }
        - { text: "Immediately before harvest, once the target sugar level is reached", correct: false }
      explanation: |
        Dormant pruning selects the buds and fruiting wood that will carry the next crop. Timing within
        winter varies with frost risk and labour needs, but pruning is completed before active shoot
        growth makes the work damaging and impractical.

  - id: vine-permanent-wood-001
    type: mcq
    deck: The Vine
    tags: [vine, anatomy, training]
    status: reviewed
    source_id: c03-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which structures normally make up a trained grapevine's permanent woody framework?
      choices:
        - { text: "The trunk and, where the system uses them, perennial arms or cordons", correct: true }
        - { text: "The current season's green shoots, leaves and flower clusters", correct: false }
        - { text: "The one-year-old fruiting canes and their newly opened buds", correct: false }
        - { text: "The root hairs, fine feeder roots and surface cover crop", correct: false }
      explanation: |
        The trunk persists from year to year, as do cordons or short arms in systems that retain them.
        Canes and spurs are selected from younger wood at pruning, while green shoots are renewed each
        growing season.

  - id: vine-first-crop-001
    type: mcq
    deck: The Vine
    tags: [vine, establishment, yield]
    status: reviewed
    source_id: c03-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Under normal establishment, around which growing season is a grapevine's first commercial crop commonly expected?
      choices:
        - { text: "The first growing season", correct: false }
        - { text: "The third growing season", correct: true }
        - { text: "The fifth growing season", correct: false }
        - { text: "The seventh growing season", correct: false }
      explanation: |
        Growers usually remove early clusters so a young vine can establish roots and its permanent
        framework. A light crop may be possible earlier on a vigorous site, but the third season is a
        common first-bearing benchmark rather than a legal or biological deadline.

  - id: vine-training-purpose-001
    type: mcq
    deck: The Vine
    tags: [vine, training]
    status: reviewed
    source_id: c03-0059
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a grapevine training system principally determine?
      choices:
        - { text: "The spatial form and support of the vine's permanent framework and canopy", correct: true }
        - { text: "The number of buds retained on fruiting wood at each dormant pruning", correct: false }
        - { text: "The genetic identity of the scion cultivar and the chosen rootstock", correct: false }
        - { text: "The soil texture, nutrient supply and depth available to the roots", correct: false }
      explanation: |
        Training gives the vine its durable shape and positions new growth in space, often with a
        trellis. Pruning works within that framework to renew fruiting wood and regulate bud number;
        the two decisions are related but not synonymous.

  - id: vine-head-cordon-training-001
    type: mcq
    deck: The Vine
    tags: [vine, training]
    status: reviewed
    source_id: c03-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which contrast correctly distinguishes head training from cordon training?
      choices:
        - { text: "Head: framework centred on the trunk top; cordon: permanent arms extend from it", correct: true }
        - { text: "Head: permanent arms run along the wire; cordon: the framework ends at the trunk top", correct: false }
        - { text: "Head: the trunk runs horizontally; cordon: permanent wood forms a vertical fan", correct: false }
        - { text: "Head: defined by a high trunk; cordon: defined by a low trunk", correct: false }
      explanation: |
        A head-trained vine has little permanent wood beyond the trunk and perhaps short arms. A
        cordon-trained vine carries one or more perennial horizontal arms. Either framework can be
        paired with different pruning and canopy arrangements where local conditions permit.

  - id: vine-cordon-large-framework-001
    type: mcq
    deck: The Vine
    tags: [vine, training, cordon]
    status: reviewed
    source_id: c03-0063
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A vigorous, widely spaced vine must fill a long section of trellis. Which training feature is most useful?
      choices:
        - { text: "Permanent arms can extend along wires and distribute fruiting positions over a wide canopy", correct: true }
        - { text: "A compact head concentrates replacement canes around one point at the trunk top", correct: false }
        - { text: "A low goblet keeps several short arms close to the centre of the vine", correct: false }
        - { text: "Multiple upright trunks terminate below the wire without horizontal permanent arms", correct: false }
      explanation: |
        One or more cordons provide a durable horizontal framework from which spurs and shoots can be
        spaced. This makes it possible to fill longer or divided canopies, provided the site supplies
        enough vigour and the trellis can support the structure.

  - id: vine-pruning-purpose-001
    type: mcq
    deck: The Vine
    tags: [vine, pruning, balance]
    status: reviewed
    source_id: c03-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the main purpose of dormant pruning in an established vineyard?
      choices:
        - { text: "To select fruiting wood and bud number so crop and vegetative growth remain balanced", correct: true }
        - { text: "To fix the permanent shape and trunk height chosen when the vine is first trained", correct: false }
        - { text: "To position green shoots during the season so light and air penetrate the canopy", correct: false }
        - { text: "To remove immature bunches after véraison and reduce the crop close to harvest", correct: false }
      explanation: |
        Pruning renews fruiting wood, limits the number of growing points and helps maintain the
        intended vine size. Training establishes the longer-term framework; pruning manages the
        annual crop and canopy within it.

  - id: vine-canopy-define-001
    type: mcq
    deck: The Vine
    tags: [vine, anatomy, canopy]
    status: reviewed
    source_id: c03-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In vineyard management, what does the grapevine canopy comprise?
      choices:
        - { text: "The current season's shoots, leaves, tendrils and reproductive growth", correct: true }
        - { text: "The trunk, permanent cordons and roots retained through winter", correct: false }
        - { text: "The posts, wires and stakes that support the trained vine", correct: false }
        - { text: "The soil surface, cover crop and vegetation between the rows", correct: false }
      explanation: |
        The canopy is the vine's seasonally renewed, above-ground green growth, including the leaves
        that intercept light and the shoots that carry bunches. The permanent framework and the
        trellis support that canopy but are not themselves its green tissues.

  - id: vine-trellis-define-001
    type: mcq
    deck: The Vine
    tags: [vine, training, trellis]
    status: reviewed
    source_id: c03-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the function of a vineyard trellis?
      choices:
        - { text: "Posts and wires support and position permanent wood, fruiting canes and annual shoots", correct: true }
        - { text: "A permanent woody shape determines where the trunk and cordons develop", correct: false }
        - { text: "An annual pruning pattern determines which buds and fruiting wood remain", correct: false }
        - { text: "A vineyard layout determines row direction and the spacing between vines", correct: false }
      explanation: |
        A trellis is the physical support system used to hold vine structures and organise the
        canopy. The chosen training and pruning system determines how the vine is arranged on those
        posts and wires.

  - id: vine-bush-site-001
    type: mcq
    deck: The Vine
    tags: [vine, training, bush-vine]
    status: reviewed
    source_id: c03-0067
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which site is most naturally suited to traditional low, free-standing bush vines?
      choices:
        - { text: "A warm, dry, sunny site where moderate vigour and an open canopy limit disease pressure", correct: true }
        - { text: "A humid, fertile site where very vigorous shoots require a broad divided canopy", correct: false }
        - { text: "A frost-prone valley floor where a high fruiting zone improves cold-air drainage", correct: false }
        - { text: "A cool, wet site where dense foliage must be held upright for rapid drying", correct: false }
      explanation: |
        Bush training is inexpensive and the low canopy can shade bunches in hot sunshine, but it is
        hard to mechanise and poorly suited to excessive vigour or humidity. Gobelet vines in the
        Southern Rhône and old bush vines in Barossa are classic examples.

  - id: vine-density-dry-site-001
    type: mcq
    deck: The Vine
    tags: [vine, planting-density, water]
    status: reviewed
    source_id: c03-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can wider vine spacing be advantageous on a dry site with little or no irrigation?
      choices:
        - { text: "Each vine can explore a larger soil volume with less immediate competition for scarce water", correct: true }
        - { text: "Closer spacing forces roots deeper and therefore increases the water available to each vine", correct: false }
        - { text: "Closer spacing shades the soil enough to remove water as a limit on vine growth", correct: false }
        - { text: "Wider spacing reduces each vine's leaf area because it has less room to develop", correct: false }
      explanation: |
        Where water supply limits growth, fewer vines per hectare can give each root system access to
        more soil water. The best spacing still depends on soil depth, rooting pattern, vigour,
        machinery and yield goals; low density is not a universal drought cure.

  - id: vine-low-nutrients-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients, vigour]
    status: reviewed
    source_id: c03-0069
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: If mineral nutrients are genuinely limiting, what is the likely effect even when a vine has sufficient water?
      choices:
        - { text: "Restricted shoot growth, weaker canopy development and potentially lower yield", correct: true }
        - { text: "Excessive vegetative growth because water is the sole control on vine vigour", correct: false }
        - { text: "Unchanged shoot growth but lower sugar because nutrients affect berry chemistry alone", correct: false }
        - { text: "A smaller root system but the same canopy because stored reserves renew indefinitely", correct: false }
      explanation: |
        Water and mineral nutrition are separate requirements. Vines can draw on stored reserves and
        may tolerate modest soil fertility, but a true deficiency—especially of nitrogen—reduces
        growth and fruitfulness rather than guaranteeing a vigorous canopy.

  - id: vine-bud-load-vigour-001
    type: mcq
    deck: The Vine
    tags: [vine, pruning, vigour]
    status: reviewed
    source_id: c03-0070
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: On a well-watered, vigorous vine, what can result from retaining too few buds at winter pruning?
      choices:
        - { text: "The vine's resources are concentrated into fewer shoots, increasing their vigour", correct: true }
        - { text: "Each retained shoot becomes weaker because more reserves remain stored in the roots", correct: false }
        - { text: "The canopy becomes smaller because shoot number alone determines total leaf area", correct: false }
        - { text: "Crop load rises because the remaining shoots compensate by carrying more bunches", correct: false }
      explanation: |
        Severe pruning does not necessarily tame a vigorous vine: stored reserves and water are shared
        among fewer growing points, so individual shoots can become stronger. Retaining more buds can
        moderate shoot vigour, but excessive bud load may overcrop or crowd the canopy.

  - id: vine-yield-bud-estimate-001
    type: mcq
    deck: The Vine
    tags: [vine, yield, pruning]
    status: reviewed
    source_id: c03-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which observation provides an early starting point for estimating a vine's potential crop after winter pruning?
      choices:
        - { text: "The number of fruitful buds retained on its canes or spurs", correct: true }
        - { text: "The final berry weight recorded at the previous harvest", correct: false }
        - { text: "The sugar concentration expected on the next picking date", correct: false }
        - { text: "The number of leaves remaining on the dormant winter vine", correct: false }
      explanation: |
        Retained buds indicate how many shoots may emerge, and fruitful shoots carry a broadly
        estimable number of bunches. A fuller forecast also needs bud fruitfulness, bud survival,
        fruit set and expected bunch weight.

  - id: vine-yield-estimate-risks-001
    type: mcq
    deck: The Vine
    tags: [vine, yield, hazards]
    status: reviewed
    source_id: c03-0073
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can a yield estimate based on retained winter buds overstate the crop ultimately harvested?
      choices:
        - { text: "Frost, poor fruit set, pests or disease can remove potential crop after pruning", correct: true }
        - { text: "Warm flowering weather, good fruit set and increasing berry size raise crop potential", correct: false }
        - { text: "Uniform budburst, healthy shoots and balanced water supply preserve crop potential", correct: false }
        - { text: "High bud fruitfulness, successful flowering and low disease maintain crop potential", correct: false }
      explanation: |
        Bud count measures potential, not guaranteed yield. Bud or shoot loss, unsuccessful flowering
        and fruit set, and later pest or disease damage can all reduce the number or weight of bunches
        that reach harvest.

  - id: vine-green-harvest-001
    type: mcq
    deck: The Vine
    tags: [vine, yield, green-harvest]
    status: reviewed
    source_id: c03-0074
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A grower removes selected unripe bunches around véraison to reduce crop load. What is this operation?
      choices:
        - { text: "Green harvesting", correct: true }
        - { text: "Shoot positioning", correct: false }
        - { text: "Replacement-cane pruning", correct: false }
        - { text: "Post-harvest hedging", correct: false }
      explanation: |
        Green harvesting is a form of bunch thinning carried out before or around véraison. Removing
        crop can help the remaining bunches ripen where yield exceeds the vine's capacity, although
        the response depends on timing, vine balance and site.

  - id: vine-leaf-damage-ripening-001
    type: mcq
    deck: The Vine
    tags: [vine, canopy, photosynthesis]
    status: reviewed
    source_id: c03-0076
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can extensive damage to functional grapevine leaves delay or limit fruit ripening?
      choices:
        - { text: "Less active leaf area reduces photosynthesis and the sugar supply to berries", correct: true }
        - { text: "Lower transpiration is the main cause of slower sugar accumulation in the berries", correct: false }
        - { text: "The remaining leaves compensate completely by receiving more light, whatever the damage", correct: false }
        - { text: "Leaf loss affects berry colour through shade but leaves sugar production unchanged", correct: false }
      explanation: |
        Healthy exposed leaves are the main source of assimilates used for berry ripening and reserve
        storage. The impact depends on severity and timing: a vine can compensate for limited damage,
        but major defoliation reduces its photosynthetic capacity.

  - id: vine-nematode-virus-vector-001
    type: mcq
    deck: The Vine
    tags: [vine, pests, nematodes, viruses]
    status: reviewed
    source_id: c03-0077
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which additional threat is associated with some dagger nematodes in vineyards?
      choices:
        - { text: "Transmission of grapevine fanleaf virus while feeding on roots", correct: true }
        - { text: "Transmission of grapevine leafroll viruses between neighbouring canopies", correct: false }
        - { text: "Transmission of the bacterium responsible for Pierce's disease", correct: false }
        - { text: "Transmission of powdery mildew spores from soil to young leaves", correct: false }
      explanation: |
        Xiphinema index is important not only for feeding damage but also as the vector of grapevine
        fanleaf virus. Vector control matters because very small surviving populations can transmit
        disease to new vines on a replanted site.

  - id: vine-nematode-management-001
    type: mcq
    deck: The Vine
    tags: [vine, pests, nematodes, rootstocks]
    status: reviewed
    source_id: c03-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which strategy best reduces nematode risk when establishing or replanting a vineyard?
      choices:
        - { text: "Site testing, clean plants and a rootstock resistant to the nematodes found", correct: true }
        - { text: "Choose a vigorous scion and rely on shoot growth to compensate for any root damage", correct: false }
        - { text: "Apply a surface fungicide after planting and retain the original susceptible rootstock", correct: false }
        - { text: "Use untested planting material but extend irrigation to reduce visible stress symptoms", correct: false }
      explanation: |
        Management is preventive and species-specific. Pre-plant sampling, certified material,
        sanitation, suitable rotations or authorised soil treatment, and an appropriate resistant or
        tolerant rootstock can reduce risk; none is a universal guarantee of eradication.

  - id: vine-mildew-tissues-001
    type: mcq
    deck: The Vine
    tags: [vine, disease, mildew]
    status: reviewed
    source_id: c03-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grapevine tissues can powdery mildew and downy mildew infect during the growing season?
      choices:
        - { text: "Green tissues, including leaves, shoots, inflorescences and developing berries", correct: true }
        - { text: "Mature trunk wood and deep roots rather than leaves or young berries", correct: false }
        - { text: "Berry skins after véraison but not shoots, leaves or inflorescences", correct: false }
        - { text: "Flowers during fruit set but not the vegetative parts of the canopy", correct: false }
      explanation: |
        Both diseases can attack a broad range of actively growing tissues. Their biology and weather
        requirements differ—downy mildew needs free water for infection, whereas powdery mildew does
        not—but protecting the green canopy and young fruit is central to control.

  - id: vine-botrytis-bunch-risk-001
    type: mcq
    deck: The Vine
    tags: [vine, disease, botrytis]
    status: reviewed
    source_id: c03-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grapevine tissue is the main commercial concern when grey rot develops near harvest?
      choices:
        - { text: "Ripening berries and bunches", correct: true }
        - { text: "Shoot tips and expanding young leaves", correct: false }
        - { text: "Inflorescences before fruit set", correct: false }
        - { text: "One-year-old canes after leaf fall", correct: false }
      explanation: |
        Botrytis can infect flowers and other young tissues, but grey rot becomes especially damaging
        when it decays ripe or nearly ripe bunches. Compact clusters, wounds, humidity and prolonged
        wetness increase the risk.

  - id: vine-open-canopy-disease-001
    type: mcq
    deck: The Vine
    tags: [vine, canopy, disease]
    status: reviewed
    source_id: c03-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can an open, well-arranged canopy help reduce fungal disease pressure?
      choices:
        - { text: "Faster drying through better light penetration and air movement", correct: true }
        - { text: "Higher berry sugar makes ripe fruit resistant to fungal infection", correct: false }
        - { text: "Reduced leaf area lowers vine nitrogen enough to starve canopy pathogens", correct: false }
        - { text: "A wider fruiting zone forms a physical barrier that keeps spores away from bunches", correct: false }
      explanation: |
        Many infections are favoured by humidity or long periods of surface wetness. Shoot positioning,
        thinning and selective leaf removal can improve ventilation, drying and spray penetration,
        while excessive exposure may create sunburn risk in hot climates.

  - id: vine-virus-no-field-cure-001
    type: mcq
    deck: The Vine
    tags: [vine, disease, viruses]
    status: reviewed
    source_id: c03-0082
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the practical implication when a vineyard vine is confirmed to have a damaging virus disease?
      choices:
        - { text: "There is no curative field treatment; prevention, vector control and removal of infected vines are central", correct: true }
        - { text: "A routine fungicide programme eliminates the virus from the vine's vascular tissue", correct: false }
        - { text: "Extra nitrogen suppresses virus replication and restores certified clean status", correct: false }
        - { text: "Winter pruning removes the infection because viruses remain in leaves and shoots", correct: false }
      explanation: |
        Viruses are systemic and cannot be cured in an established vine by normal vineyard sprays.
        Growers rely on tested propagation material, control of vectors where possible, diagnosis and
        roguing or replanting infected vines.

  - id: vine-budburst-hemisphere-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, budburst]
    status: reviewed
    source_id: c03-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which calendar pairing is broadly typical for grapevine budburst in temperate wine regions?
      choices:
        - { text: "March–April in the Northern Hemisphere; September–October in the Southern Hemisphere", correct: true }
        - { text: "May–June in the Northern Hemisphere; November–December in the Southern Hemisphere", correct: false }
        - { text: "July–August in the Northern Hemisphere; January–February in the Southern Hemisphere", correct: false }
        - { text: "September–October in the Northern Hemisphere; March–April in the Southern Hemisphere", correct: false }
      explanation: |
        Budburst begins in early spring, roughly six months apart between hemispheres. Exact timing
        varies substantially with latitude, altitude, variety, site and vintage, so the month ranges
        are study landmarks rather than fixed deadlines.

  - id: vine-flowering-hemisphere-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, flowering]
    status: reviewed
    source_id: c03-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which calendar pairing is broadly typical for grapevine flowering and fruit set in temperate wine regions?
      choices:
        - { text: "May–June in the Northern Hemisphere; November–December in the Southern Hemisphere", correct: true }
        - { text: "March–April in the Northern Hemisphere; September–October in the Southern Hemisphere", correct: false }
        - { text: "July–September in the Northern Hemisphere; January–March in the Southern Hemisphere", correct: false }
        - { text: "November–December in the Northern Hemisphere; May–June in the Southern Hemisphere", correct: false }
      explanation: |
        Flowering normally follows budburst by several weeks in late spring or early summer. The
        six-month hemispheric offset is only approximate; temperature, cultivar and season can move
        the event earlier or later.

  - id: vine-veraison-hemisphere-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, veraison]
    status: reviewed
    source_id: c03-0085
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which calendar pairing broadly covers véraison and berry ripening in temperate wine regions?
      choices:
        - { text: "July–September in the Northern Hemisphere; January–March in the Southern Hemisphere", correct: true }
        - { text: "March–April in the Northern Hemisphere; September–October in the Southern Hemisphere", correct: false }
        - { text: "May–June in the Northern Hemisphere; November–December in the Southern Hemisphere", correct: false }
        - { text: "January–March in the Northern Hemisphere; July–September in the Southern Hemisphere", correct: false }
      explanation: |
        Véraison marks the transition into ripening and normally occurs in summer, followed by harvest
        later in the season. The three-month bands are broad study landmarks; variety, site, climate
        and vintage all change the actual dates.

  - id: vine-budburst-temperature-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, budburst, temperature]
    status: reviewed
    source_id: c03-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which mean air-temperature benchmark is commonly associated with the start of grapevine budburst and active growth?
      choices:
        - { text: "About 10 °C", correct: true }
        - { text: "About 0 °C", correct: false }
        - { text: "About 20 °C", correct: false }
        - { text: "About 30 °C", correct: false }
      explanation: |
        About 10 °C is a useful base-temperature benchmark, not a universal switch. Cultivar,
        accumulated warmth, soil temperature, site and vine condition all influence when individual
        buds actually open.

  - id: vine-budburst-protection-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, disease-management]
    status: reviewed
    source_id: c03-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do many vineyard disease-monitoring and protection programmes become active from budburst?
      choices:
        - { text: "New susceptible green tissue begins to emerge and can require timely protection", correct: true }
        - { text: "Young leaves are resistant, so monitoring can pause until bunch closure", correct: false }
        - { text: "Budburst treatments cure systemic viruses before they reach the new shoots", correct: false }
        - { text: "Disease risk becomes independent of weather as soon as buds begin to open", correct: false }
      explanation: |
        Budburst starts a period of rapid production of young leaves and shoots that may be vulnerable
        to pests and diseases. Actual spray timing depends on pathogen, weather, local risk, label and
        integrated-pest-management advice; budburst does not mandate one universal treatment.

  - id: vine-early-growth-energy-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, carbohydrates]
    status: reviewed
    source_id: c03-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is rapid shoot growth supplied with energy between budburst and the development of a functional leaf canopy?
      choices:
        - { text: "Stored reserves dominate first; expanding leaves increasingly supply sugars", correct: true }
        - { text: "Young shoots photosynthesise fully before their first leaves have opened", correct: false }
        - { text: "Roots manufacture sugars from mineral nutrients until flowering is complete", correct: false }
        - { text: "Developing inflorescences export stored sugars to feed the shoot tips", correct: false }
      explanation: |
        Early shoots initially depend strongly on reserves stored in perennial wood and roots. As leaf
        area expands and becomes photosynthetically active, current-season assimilation takes over a
        growing share of the energy supply.

  - id: vine-flowering-weather-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, flowering, climate]
    status: reviewed
    source_id: c03-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which weather pattern is most favourable for successful grapevine flowering and fruit set?
      choices:
        - { text: "Warm, dry and sunny conditions with limited disruptive wind or rain", correct: true }
        - { text: "Cool, wet and windy conditions throughout cap fall and fertilisation", correct: false }
        - { text: "Hot drought severe enough to stop photosynthesis and desiccate flowers", correct: false }
        - { text: "Repeated frost events while flowers are open and berries begin to set", correct: false }
      explanation: |
        Grapevines usually self-pollinate, so insect activity is not the key requirement. Cold, rain,
        strong wind or heat stress can interfere with flowering and fertilisation, causing poor set
        such as coulure or uneven berry development.

  - id: vine-fruit-set-define-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, fruit-set]
    status: reviewed
    source_id: c03-0092
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What happens during fruit set in a grapevine inflorescence?
      choices:
        - { text: "Successfully fertilised flowers begin developing into berries while others may fall", correct: true }
        - { text: "Green berries soften, accumulate colour and enter the main ripening phase", correct: false }
        - { text: "Dormant buds open and produce the shoots that will carry inflorescences", correct: false }
        - { text: "Mature berries detach from their pedicels and are ready for harvest", correct: false }
      explanation: |
        Fruit set follows flowering and fertilisation. Not every flower becomes a berry: some drop,
        and poor weather or vine imbalance can reduce the proportion retained and affect final bunch
        size.

  - id: vine-fruitset-veraison-interval-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, berry-development]
    status: reviewed
    source_id: c03-0093
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: As a broad study benchmark, how long does the green berry-growth period from fruit set to véraison often last?
      choices:
        - { text: "Roughly six to eight weeks", correct: true }
        - { text: "Roughly one to two weeks", correct: false }
        - { text: "Roughly three to four months", correct: false }
        - { text: "Roughly nine to ten months", correct: false }
      explanation: |
        Six to eight weeks is a useful approximation for the pre-véraison growth period, not a fixed
        biological deadline. Temperature, variety, water status and the way stages are recorded can
        shorten or extend the interval.

  - id: vine-veraison-define-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, veraison]
    status: reviewed
    source_id: c03-0094
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which change best defines véraison in grape development?
      choices:
        - { text: "The onset of ripening, marked by berry softening and colour or translucency change", correct: true }
        - { text: "The completion of flowering, marked by the first fertilised flowers becoming berries", correct: false }
        - { text: "The start of dormancy, marked by leaf fall and shoot lignification", correct: false }
        - { text: "The achievement of harvest maturity, marked by a fixed sugar concentration", correct: false }
      explanation: |
        At véraison, berries soften and coloured cultivars begin accumulating red or blue pigments;
        white berries become more translucent. It begins the ripening phase but does not mean the
        grapes are ready to pick.

  - id: vine-ripening-changes-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, ripening]
    status: reviewed
    source_id: c03-0095
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which set of changes generally occurs in grapes from véraison towards harvest?
      choices:
        - { text: "Sugar and berry volume rise, acidity falls, and flavour and colour compounds develop", correct: true }
        - { text: "Berry volume falls, sugar remains stable, and acidity and green aromas increase", correct: false }
        - { text: "Water and sugar fall, acidity remains stable, and phenolic compounds disappear", correct: false }
        - { text: "Berry size and sugar remain unchanged while skin colour alone develops", correct: false }
      explanation: |
        Ripening shifts the berry from a hard, acidic, green stage towards a softer, sweeter and more
        flavourful fruit. Changes in acids, phenolics, aromas and water are not perfectly linear and
        differ with cultivar and conditions.

  - id: vine-dormancy-transition-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, dormancy]
    status: reviewed
    source_id: c03-0096
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which combination accompanies a grapevine's transition into winter dormancy?
      choices:
        - { text: "Shoots lignify, leaves fall and carbohydrate reserves accumulate in perennial tissues", correct: true }
        - { text: "Buds burst, shoots elongate and stored carbohydrates are rapidly mobilised", correct: false }
        - { text: "Flowers open, fertilisation occurs and unfertilised flowers are shed", correct: false }
        - { text: "Berries soften, sugar rises and pigments accumulate in the skins", correct: false }
      explanation: |
        As growth ends, shoots mature into canes and mobile nutrients and carbohydrates are stored in
        roots, trunk and other perennial wood. Leaf fall then leaves the vine dormant until adequate
        winter chilling and spring warmth permit renewed growth.

  - id: vine-machine-harvest-mechanism-001
    type: mcq
    deck: The Vine
    tags: [vine, harvest, mechanisation]
    status: reviewed
    source_id: c03-0102
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which sequence best describes a conventional over-row machine harvesting wine grapes?
      choices:
        - { text: "Beaters shake the fruiting zone; detached berries fall onto collectors and move to a bin", correct: true }
        - { text: "Rotating blades cut intact bunches at their stems and lower them onto a sorting belt", correct: false }
        - { text: "Air jets lift intact bunches from the trellis before a vacuum draws them into a tank", correct: false }
        - { text: "Optical grippers pick individual berries without contacting shoots, leaves or trellis wires", correct: false }
      explanation: |
        The harvester straddles the row and uses flexible rods or beaters to shake ripe berries free.
        Catch plates and conveyors collect them; most rachises remain on the vine, although leaves,
        petioles and other matter can enter the load unless sorting systems remove it.
