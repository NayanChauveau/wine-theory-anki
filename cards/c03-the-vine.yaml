cards:
  - id: vine-crossing-define-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c01-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is a controlled cross in grape breeding?"
      choices:
        - { text: "Selecting and propagating a useful mutation found within an existing variety", correct: false }
        - { text: "Pollinating one chosen parent with another and raising the resulting seed", correct: true }
        - { text: "Joining a fruiting scion to a rootstock with complementary traits", correct: false }
        - { text: "Selecting several superior vines and propagating them together by cuttings", correct: false }
      explanation: |
        A cross combines genetic material from two parents through sexual reproduction. The seedling
        is genetically distinct and may be selected as a new variety; clonal or massal selection and
        grafting propagate or combine existing plant material without creating that seedling.
    fr:
      question: "En sélection de la vigne, qu’est-ce qu’un croisement dirigé ?"
      choices:
        - { text: "Repérer une mutation utile apparue dans un cépage existant, puis la multiplier", correct: false }
        - { text: "Polliniser un parent choisi avec le pollen d’un autre, puis semer les pépins obtenus", correct: true }
        - { text: "Greffer un greffon productif sur un porte-greffe aux qualités complémentaires", correct: false }
        - { text: "Choisir plusieurs souches d’élite et les multiplier ensemble par bouturage", correct: false }
      explanation: |
        Un croisement réunit le patrimoine génétique de deux parents par reproduction sexuée. Le
        semis obtenu est génétiquement nouveau et peut devenir un cépage à part entière ; la sélection
        clonale ou massale et le greffage multiplient ou associent du matériel existant sans créer de
        nouveau semis.

  - id: vine-crossing-how-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c01-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a planned grape cross actually produce a new variety?"
      choices:
        - { text: "A scion and rootstock fuse, combining their chromosomes in every new shoot", correct: false }
        - { text: "Pollen fertilises a chosen flower; a resulting seed is germinated and evaluated", correct: true }
        - { text: "A selected cane is rooted, and its cuttings gradually become a new genotype", correct: false }
        - { text: "Several clones are planted together, and their shared fruit becomes a new variety", correct: false }
      explanation: |
        Fertilisation produces a seed carrying a new combination of genes, and sibling seedlings
        differ, so each must be grown and assessed. Pinotage (Pinot Noir × Cinsault, South Africa,
        1925) is a planned example; Chardonnay arose the same way, but spontaneously, from Pinot ×
        Gouais Blanc. A graft stays the scion variety on a separate root system.
    fr:
      question: "Comment un croisement dirigé donne-t-il concrètement naissance à un nouveau cépage ?"
      choices:
        - { text: "Greffon et porte-greffe fusionnent et mêlent leurs chromosomes dans chaque rameau", correct: false }
        - { text: "Le pollen féconde une fleur choisie ; le pépin obtenu est semé puis évalué", correct: true }
        - { text: "Un sarment choisi est enraciné, et ses boutures deviennent peu à peu un nouveau génotype", correct: false }
        - { text: "Plusieurs clones plantés ensemble donnent un raisin commun qui devient un nouveau cépage", correct: false }
      explanation: |
        La fécondation produit un pépin porteur d’une combinaison de gènes inédite ; les semis issus
        d’un même croisement diffèrent, il faut donc les cultiver et les juger un à un. Le Pinotage
        (Pinot Noir × Cinsault, Afrique du Sud, 1925) est un croisement dirigé ; le Chardonnay est né
        de la même façon, mais spontanément, de Pinot × Gouais Blanc. Une vigne greffée reste, elle,
        le cépage du greffon sur un autre système racinaire.

  - id: vine-growth-warmth-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which base temperature is commonly used to estimate useful growing-season heat for grapevines?"
      choices:
        - { text: "Around 0 °C", correct: false }
        - { text: "Around 10 °C", correct: true }
        - { text: "Around 20 °C", correct: false }
        - { text: "Around 30 °C", correct: false }
      explanation: |
        A 10 °C base is widely used in growing-degree-day calculations for vines. It is a practical
        model for comparing heat accumulation, not a claim that all physiological activity starts or
        stops at exactly that temperature.
    fr:
      question: "Quelle température de base retient-on couramment pour estimer la chaleur utile à la vigne pendant la saison ?"
      choices:
        - { text: "Environ 0 °C", correct: false }
        - { text: "Environ 10 °C", correct: true }
        - { text: "Environ 20 °C", correct: false }
        - { text: "Environ 30 °C", correct: false }
      explanation: |
        Une base de 10 °C sert couramment au calcul des degrés-jours de croissance de la vigne. C’est
        un modèle pratique pour comparer l’accumulation de chaleur d’un site à l’autre, pas un seuil
        exact où toute activité de la plante démarrerait ou s’arrêterait.

  - id: vine-heat-respiration-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, physiology]
    status: reviewed
    source_id: c03-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can prolonged heat well above a grapevine's optimum reduce its net carbon gain?"
      choices:
        - { text: "Photosynthesis slows while respiration keeps burning sugars", correct: true }
        - { text: "Respiration stops, so unused sugars build up and block photosynthesis", correct: false }
        - { text: "Sugars move to the berries faster than the leaves can fix new carbon", correct: false }
        - { text: "Heat stops root uptake of nitrogen, so leaves lose their chlorophyll", correct: false }
      explanation: |
        High temperature depresses photosynthesis while respiration speeds up, and water stress often
        adds to the damage, so the vine's carbon balance worsens. The threshold varies with variety,
        acclimation, water status and how long the heat lasts.
    fr:
      question: "Pourquoi une chaleur prolongée, bien au-dessus de l’optimum de la vigne, peut-elle réduire son gain net en carbone ?"
      choices:
        - { text: "La photosynthèse ralentit, mais la respiration continue de brûler des sucres", correct: true }
        - { text: "La respiration s’arrête, et les sucres inutilisés finissent par bloquer la photosynthèse", correct: false }
        - { text: "Les sucres partent vers les baies plus vite que les feuilles ne fixent de carbone", correct: false }
        - { text: "La chaleur bloque l’absorption d’azote, et les feuilles perdent leur chlorophylle", correct: false }
      explanation: |
        Une forte chaleur freine la photosynthèse alors que la respiration s’accélère, et le stress
        hydrique aggrave souvent les choses : le bilan carboné de la vigne se dégrade. Le seuil varie
        selon le cépage, l’acclimatation, l’alimentation en eau et la durée de la chaleur.

  - id: vine-cycle-heat-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate factor most strongly sets the timing of each stage in the vine's annual cycle?"
      choices:
        - { text: "Rainfall pattern", correct: false }
        - { text: "Temperature", correct: true }
        - { text: "Wind exposure", correct: false }
        - { text: "Relative humidity", correct: false }
      explanation: |
        Temperature is the main driver of phenology: accumulated spring warmth advances budburst and
        later stages, while cooler conditions delay them. Water status, cultivar and site also modify
        timing, but temperature provides the strongest broad climatic signal.
    fr:
      question: "Quel facteur climatique règle le plus fortement le calendrier de chaque stade du cycle annuel de la vigne ?"
      choices:
        - { text: "Le régime des pluies", correct: false }
        - { text: "La température", correct: true }
        - { text: "L’exposition au vent", correct: false }
        - { text: "L’humidité relative", correct: false }
      explanation: |
        La température pilote la phénologie : la chaleur accumulée au printemps avance le
        débourrement et les stades suivants, la fraîcheur les retarde. L’alimentation en eau, le
        cépage et le site modulent ce calendrier, mais la température reste le signal climatique
        dominant.

  - id: vine-budburst-cool-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a cooler region, when does budburst usually occur compared with a warmer site?"
      choices:
        - { text: "Earlier, because a longer, colder winter releases dormancy sooner", correct: false }
        - { text: "Later, because spring warmth builds up more slowly", correct: true }
        - { text: "About the same time, because day length rather than warmth triggers it", correct: false }
        - { text: "About the same time; cool sites mainly differ at the end of the season", correct: false }
      explanation: |
        Once winter chilling is satisfied, buds still need enough accumulated warmth to open, so cool
        springs delay budburst relative to warmer sites. Cultivar, pruning date, aspect and local
        conditions also shift the date; the comparison assumes those are otherwise similar.
    fr:
      question: "Dans une région plus fraîche, quand le débourrement a-t-il lieu d’habitude par rapport à un site plus chaud ?"
      choices:
        - { text: "Plus tôt, car un hiver plus long et plus froid lève la dormance plus vite", correct: false }
        - { text: "Plus tard, car la chaleur printanière s’accumule plus lentement", correct: true }
        - { text: "À peu près en même temps, car c’est la durée du jour, non la chaleur, qui le déclenche", correct: false }
        - { text: "À peu près en même temps ; les sites frais diffèrent surtout en fin de saison", correct: false }
      explanation: |
        Une fois les besoins en froid satisfaits, les bourgeons attendent encore assez de chaleur
        cumulée pour s’ouvrir : un printemps frais retarde donc le débourrement. Le cépage, la date de
        taille, l’exposition et les conditions locales décalent aussi la date ; la comparaison suppose
        ces facteurs comparables.

  - id: vine-cycle-early-001
    type: cloze
    deck: The Vine
    tags: [vine, growth-cycle]
    status: reviewed
    source_id: c03-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      text: |
        After winter rest, the vine's growing season opens in this order:
        {{c1::budburst}}, then {{c2::early shoot and leaf growth}}, then
        {{c3::flowering and fruit set}}.
      extra: |
        Flowering and fruit set establish the potential crop. Berry growth, véraison and ripening then
        lead to harvest, followed by reserve storage, leaf fall and winter dormancy.
    fr:
      text: |
        Après le repos hivernal, la saison de la vigne s’ouvre dans cet ordre :
        {{c1::débourrement}}, puis {{c2::croissance des rameaux et des feuilles}},
        puis {{c3::floraison et nouaison}}.
      extra: |
        La floraison et la nouaison fixent la récolte potentielle. Viennent ensuite le grossissement
        des baies, la véraison et la maturation jusqu’aux vendanges, puis la mise en réserve, la chute
        des feuilles et la dormance hivernale.

  - id: vine-cycle-late-001
    type: cloze
    deck: The Vine
    tags: [vine, growth-cycle]
    status: reviewed
    source_id: c03-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      text: |
        After flowering and fruit set, the vine's year finishes in this
        order: {{c1::véraison / berry ripening}}, then {{c2::harvest}},
        then {{c3::winter dormancy}}.
      extra: |
        Véraison begins the ripening phase rather than marking full maturity. After harvest, leaves can
        continue photosynthesising and replenishing reserves before leaf fall and dormancy.
    fr:
      text: |
        Après la floraison et la nouaison, l’année de la vigne se termine dans
        cet ordre : {{c1::véraison / maturation}}, puis {{c2::vendanges}},
        puis {{c3::dormance hivernale}}.
      extra: |
        La véraison ouvre la phase de maturation, elle ne marque pas la maturité complète. Après les
        vendanges, les feuilles peuvent encore photosynthétiser et reconstituer les réserves pendant
        que les sarments s’aoûtent, avant la chute des feuilles et la dormance.

  - id: vine-latitude-cool-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, latitude]
    status: reviewed
    source_id: c03-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "All else equal, how does moving a vineyard farther from the equator change typical temperature?"
      choices:
        - { text: "Warmer, because summer days are longer", correct: false }
        - { text: "Cooler on average, because the sun sits lower in the sky", correct: true }
        - { text: "Unchanged on average, because longer days offset the lower sun", correct: false }
        - { text: "More even through the year, as winters receive more direct sun", correct: false }
      explanation: |
        Higher latitudes receive less intense solar radiation on average and usually have cooler mean
        temperatures and stronger seasonality. Altitude, ocean currents and continentality can alter
        or outweigh the simple latitude trend at a particular site.
    fr:
      question: "Toutes choses égales par ailleurs, que devient la température d’un vignoble quand on l’éloigne de l’équateur ?"
      choices:
        - { text: "Plus chaude, car les journées d’été sont plus longues", correct: false }
        - { text: "Plus fraîche en moyenne, car le soleil est plus bas dans le ciel", correct: true }
        - { text: "Inchangée en moyenne, car les jours plus longs compensent un soleil plus bas", correct: false }
        - { text: "Plus régulière sur l’année, car les hivers reçoivent un soleil plus direct", correct: false }
      explanation: |
        Aux latitudes élevées, le rayonnement solaire est en moyenne moins intense : les températures
        moyennes baissent et les saisons sont plus contrastées. L’altitude, les courants marins et la
        continentalité peuvent nuancer, voire inverser, cette tendance sur un site donné.

  - id: vine-four-inputs-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which four site resources are central to grapevine growth and fruit ripening?"
      choices:
        - { text: "Heat, sunlight, water and mineral nutrients", correct: true }
        - { text: "Heat, sunlight, air humidity and wind", correct: false }
        - { text: "Sunlight, water, air humidity and altitude", correct: false }
        - { text: "Heat, water, wind and altitude", correct: false }
      explanation: |
        Heat regulates development, sunlight powers photosynthesis, water sustains transport and gas
        exchange, and mineral nutrients support metabolism and growth. Carbon dioxide is also
        essential, but it barely varies from site to site; humidity, wind and altitude shape access to
        the four resources rather than being resources themselves.
    fr:
      question: "Quelles sont les quatre ressources du site essentielles à la croissance de la vigne et à la maturation du raisin ?"
      choices:
        - { text: "Chaleur, lumière, eau et éléments minéraux", correct: true }
        - { text: "Chaleur, lumière, humidité de l’air et vent", correct: false }
        - { text: "Lumière, eau, humidité de l’air et altitude", correct: false }
        - { text: "Chaleur, eau, vent et altitude", correct: false }
      explanation: |
        La chaleur règle le développement, la lumière alimente la photosynthèse, l’eau assure le
        transport et les échanges gazeux, et les éléments minéraux nourrissent le métabolisme et la
        croissance. Le gaz carbonique est lui aussi indispensable, mais il ne varie guère d’un site à
        l’autre ; humidité, vent et altitude modulent l’accès à ces ressources sans en être.

  - id: vine-heat-sources-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does most of the heat in a vineyard come from?"
      choices:
        - { text: "Direct sunlight, part of it stored by soil and stones and released later", correct: true }
        - { text: "Warm air flowing in from nearby lowland, which outweighs direct sunlight", correct: false }
        - { text: "Heat conducted up from deep soil layers that stay warm all year", correct: false }
        - { text: "Direct sunlight on the leaves, while stony soils draw heat away from the vines", correct: false }
      explanation: |
        The sun is the primary energy source. Soil and stones absorb part of that radiation and later
        release heat, warming the air close to the canopy. Dark Mosel slate and the galets of
        Châteauneuf-du-Pape are classic examples.
    fr:
      question: "D’où vient l’essentiel de la chaleur que reçoit un vignoble ?"
      choices:
        - { text: "Du soleil, dont une partie est stockée par le sol et les pierres puis restituée", correct: true }
        - { text: "De l’air chaud venu des plaines voisines, qui l’emporte sur le soleil direct", correct: false }
        - { text: "Des couches profondes du sol, chaudes toute l’année, qui la transmettent vers le haut", correct: false }
        - { text: "Du soleil sur les feuilles, tandis que les sols caillouteux pompent la chaleur des souches", correct: false }
      explanation: |
        Le soleil est la source d’énergie principale. Le sol et les pierres en absorbent une partie et
        la restituent plus tard, ce qui réchauffe l’air près du feuillage : l’ardoise sombre de la
        Moselle et les galets roulés de Châteauneuf-du-Pape en sont des exemples classiques.

  - id: vine-light-reflect-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a pale, reflective vineyard surface affect the light reaching a vine canopy?"
      choices:
        - { text: "It bounces extra light up into the lower canopy and fruit zone", correct: true }
        - { text: "It mainly sends back heat, warming the fruit zone without adding usable light", correct: false }
        - { text: "It cuts canopy light by sending sunlight straight back to the sky", correct: false }
        - { text: "It changes soil warmth but not the light reaching the leaves", correct: false }
      explanation: |
        Reflective ground redirects sunlight into shaded parts of the canopy and fruit zone. The size
        of the effect depends on surface colour, angle, canopy structure and moisture; reflected light
        supplements direct sunlight rather than replacing it.
    fr:
      question: "Comment un sol clair et réfléchissant peut-il modifier la lumière que reçoit le feuillage de la vigne ?"
      choices:
        - { text: "Il renvoie un surplus de lumière vers la partie basse du feuillage et les grappes", correct: true }
        - { text: "Il renvoie surtout de la chaleur, ce qui réchauffe les grappes sans apporter de lumière utile", correct: false }
        - { text: "Il prive le feuillage de lumière en renvoyant le soleil vers le ciel", correct: false }
        - { text: "Il modifie la chaleur du sol, mais pas la lumière reçue par les feuilles", correct: false }
      explanation: |
        Un sol réfléchissant redirige la lumière vers les parties ombragées du feuillage et la zone des
        grappes. L’effet dépend de la couleur et de l’inclinaison du sol, de la structure du feuillage
        et de l’humidité ; cette lumière s’ajoute au rayonnement direct sans le remplacer.

  - id: vine-water-sources-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a grapevine obtain the water it uses?"
      choices:
        - { text: "Through its roots, from rain or irrigation water held in the soil", correct: true }
        - { text: "Mostly through its leaves, from rain, dew and humid night air", correct: false }
        - { text: "Through its roots, from water released as soil minerals weather", correct: false }
        - { text: "Through its bark and canes, which soak up rain over winter", correct: false }
      explanation: |
        Roots absorb water held in pores and fissures in soil and weathered rock. Rainfall replenishes
        that reserve, and irrigation can supplement it where permitted and necessary. Rooting depth,
        soil texture and effective soil volume govern how much remains accessible.
    fr:
      question: "Comment la vigne se procure-t-elle l’eau qu’elle utilise ?"
      choices:
        - { text: "Par ses racines, à partir de l’eau de pluie ou d’irrigation retenue dans le sol", correct: true }
        - { text: "Surtout par ses feuilles, grâce à la pluie, la rosée et l’air humide de la nuit", correct: false }
        - { text: "Par ses racines, à partir de l’eau libérée par l’altération des minéraux du sol", correct: false }
        - { text: "Par son écorce et ses sarments, qui absorbent la pluie pendant l’hiver", correct: false }
      explanation: |
        Les racines puisent l’eau retenue dans les pores et les fissures du sol et de la roche
        altérée. La pluie recharge cette réserve, que l’irrigation peut compléter là où elle est
        autorisée et nécessaire. La profondeur d’enracinement, la texture et le volume de sol
        exploitable fixent la part réellement accessible.

  - id: vine-nutrient-sources-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does a vine get the mineral nutrients it needs?"
      choices:
        - { text: "From the soil, via rock minerals, decaying organic matter and any fertiliser", correct: true }
        - { text: "Mostly from rainwater, which carries the nutrients the vine needs", correct: false }
        - { text: "Mostly through its leaves, from nitrogen and minerals in the air", correct: false }
        - { text: "From the soil, where organic matter adds carbon but no usable minerals", correct: false }
      explanation: |
        Roots take up dissolved mineral ions from the soil solution. Weathering, decomposition of
        organic matter and fertiliser replenish that supply, while soil pH and water status affect
        whether nutrients are available to the vine.
    fr:
      question: "Où la vigne puise-t-elle les éléments minéraux dont elle a besoin ?"
      choices:
        - { text: "Dans le sol : roche altérée, matière organique décomposée, engrais éventuels", correct: true }
        - { text: "Surtout dans l’eau de pluie, qui apporte les éléments nutritifs nécessaires", correct: false }
        - { text: "Surtout par ses feuilles, à partir de l’azote et des minéraux de l’air", correct: false }
        - { text: "Dans le sol, où la matière organique apporte du carbone mais aucun minéral utile", correct: false }
      explanation: |
        Les racines absorbent les ions minéraux dissous dans la solution du sol. L’altération de la
        roche, la décomposition de la matière organique et les engrais renouvellent ce stock, tandis
        que le pH et l’état hydrique du sol décident de leur disponibilité pour la vigne.

  - id: vine-freeze-union-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, grafting]
    status: reviewed
    source_id: c03-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which part of a grafted vine must survive a severe winter freeze for the fruiting variety to grow back?"
      choices:
        - { text: "The graft union of scion and rootstock", correct: true }
        - { text: "The fine roots of the rootstock near the surface", correct: false }
        - { text: "The trunk at the height of the fruiting wire", correct: false }
        - { text: "The buds on the one-year-old canes", correct: false }
      explanation: |
        The union sits just above the soil and is more exposed than underground tissue. If it dies,
        only rootstock suckers regrow and the variety is lost, which is why growers in very cold
        regions mound soil over the join.
    fr:
      question: "Quelle partie d’une vigne greffée doit survivre à un hiver très rigoureux pour que le cépage puisse repartir ?"
      choices:
        - { text: "Le point de greffe sur le porte-greffe", correct: true }
        - { text: "Les racines superficielles du porte-greffe", correct: false }
        - { text: "Le tronc à hauteur du fil porteur", correct: false }
        - { text: "Les bourgeons des sarments d’un an", correct: false }
      explanation: |
        Le point de greffe se trouve juste au-dessus du sol, plus exposé que les tissus enterrés.
        S’il gèle, seuls des rejets du porte-greffe repoussent et le cépage est perdu : d’où le
        buttage des souches dans les régions aux hivers très froids.

  - id: vine-freeze-hilling-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, grafting]
    status: reviewed
    source_id: c03-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do growers in very cold regions usually protect the graft union over winter?"
      choices:
        - { text: "Mound soil over the union to insulate it through winter", correct: true }
        - { text: "Prune hard in autumn so the vine enters winter with less wood", correct: false }
        - { text: "Spray the trunks with water so a protective coat of ice forms", correct: false }
        - { text: "Place oil heaters along the rows during deep cold spells", correct: false }
      explanation: |
        Hilling uses soil as insulation around the vulnerable join; in the coldest regions, such as
        Ningxia in northern China, whole vines are buried. The mound is removed in spring so the scion
        does not root above the rootstock.
    fr:
      question: "Comment les vignerons des régions très froides protègent-ils d’habitude le point de greffe pendant l’hiver ?"
      choices:
        - { text: "Ils buttent la souche pour isoler le point de greffe tout l’hiver", correct: true }
        - { text: "Ils taillent court à l’automne pour que la vigne entre en hiver avec moins de bois", correct: false }
        - { text: "Ils arrosent les troncs pour qu’une couche de glace protectrice se forme", correct: false }
        - { text: "Ils disposent des chaufferettes au fioul dans les rangs lors des grands froids", correct: false }
      explanation: |
        Le buttage isole le point de greffe sous une couche de terre ; dans les régions les plus
        froides, comme le Ningxia en Chine, on enterre même toute la vigne. On débutte au printemps
        pour éviter que le greffon ne s’affranchisse en émettant ses propres racines.

  - id: vine-spring-frost-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main risk when a spring frost strikes a vine after budburst?"
      choices:
        - { text: "Young shoots and buds can be killed, cutting that year's crop", correct: true }
        - { text: "Leaves are scorched, but the crop is spared as bunches form later", correct: false }
        - { text: "The trunk splits, and the vine usually dies before summer", correct: false }
        - { text: "Sap flow stops, delaying flowering but not reducing the crop", correct: false }
      explanation: |
        Green tissue out of dormancy is far less cold-hardy than dormant wood, and the young shoots
        already carry the season's flower clusters. Secondary buds may push replacement shoots, but
        they are less fruitful; the April 2021 frosts across France show how much crop can be lost.
    fr:
      question: "Quel est le principal risque quand une gelée de printemps frappe la vigne après le débourrement ?"
      choices:
        - { text: "Les jeunes pousses et les bourgeons peuvent geler, ce qui ampute la récolte", correct: true }
        - { text: "Les feuilles grillent, mais la récolte est épargnée car les grappes se forment plus tard", correct: false }
        - { text: "Le tronc éclate et la souche meurt le plus souvent avant l’été", correct: false }
        - { text: "La sève s’arrête, ce qui retarde la floraison sans réduire la récolte", correct: false }
      explanation: |
        Sortis de dormance, les tissus verts résistent bien moins au froid que le bois, et les jeunes
        rameaux portent déjà les inflorescences de l’année. Les contre-bourgeons peuvent repartir,
        mais ils sont moins fertiles : les gelées d’avril 2021 en France ont montré l’ampleur des
        pertes possibles.

  - id: vine-mild-winter-dormancy-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What can insufficient winter chilling do to grapevine budburst the following spring?"
      choices:
        - { text: "Make it later and uneven along canes and across vines", correct: true }
        - { text: "Make it earlier and even along canes and across vines", correct: false }
        - { text: "Make it later but more even, as buds wait for warmth together", correct: false }
        - { text: "Make it earlier, as buds stay in a lighter dormancy", correct: false }
      explanation: |
        Grapevine buds have a chilling requirement that varies by cultivar. In genuinely warm-winter
        regions, insufficient chill can cause delayed or uneven budburst and subsequent uneven crop
        development; an occasionally mild temperate winter is not automatically equivalent.
    fr:
      question: "Que peut provoquer un manque de froid hivernal sur le débourrement de la vigne au printemps suivant ?"
      choices:
        - { text: "Un débourrement plus tardif et irrégulier, le long des sarments comme entre souches", correct: true }
        - { text: "Un débourrement plus précoce et homogène, le long des sarments comme entre souches", correct: false }
        - { text: "Un débourrement plus tardif mais plus homogène, les bourgeons attendant ensemble la chaleur", correct: false }
        - { text: "Un débourrement plus précoce, les bourgeons restant dans une dormance plus légère", correct: false }
      explanation: |
        Les bourgeons de la vigne ont un besoin en froid qui varie selon le cépage. Dans les régions
        aux hivers vraiment doux, un froid insuffisant peut retarder le débourrement et le rendre
        irrégulier, puis désynchroniser le développement de la récolte ; un hiver tempéré
        ponctuellement doux n’a pas forcément cet effet.

  - id: vine-tropical-double-crop-001
    type: mcq
    deck: The Vine
    tags: [vine, climate, growth-cycle]
    status: reviewed
    source_id: c03-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can some tropical vineyards harvest the same vines more than once a year?"
      choices:
        - { text: "Prune and manage irrigation to restart the cycle on demand", correct: true }
        - { text: "Rely on two rainy seasons, each triggering a natural budburst", correct: false }
        - { text: "Graft a different variety onto the vines after each harvest", correct: false }
        - { text: "Leave the vines unpruned so new bunches keep forming", correct: false }
      explanation: |
        Where temperature permits year-round growth, growers can use pruning and control of irrigation
        to start and time production cycles rather than relying on winter dormancy. Brazil's São
        Francisco Valley is a prominent example, with harvest timing chosen for market needs.
    fr:
      question: "Comment certains vignobles tropicaux parviennent-ils à vendanger les mêmes vignes plus d’une fois par an ?"
      choices:
        - { text: "Ils relancent le cycle à la demande par la taille et l’irrigation", correct: true }
        - { text: "Ils comptent sur deux saisons des pluies, chacune déclenchant un débourrement", correct: false }
        - { text: "Ils regreffent un autre cépage sur les souches après chaque vendange", correct: false }
        - { text: "Ils ne taillent pas, pour que de nouvelles grappes se forment en continu", correct: false }
      explanation: |
        Là où la température permet une croissance toute l’année, la taille et la maîtrise de
        l’irrigation lancent et calent chaque cycle, sans attendre de dormance hivernale. La vallée du
        São Francisco, au Brésil, en est l’exemple phare : la date de vendange y est choisie selon le
        marché.

  - id: vine-summer-heat-ripening-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a warm but not extreme summer, how does grape ripening usually compare with a cooler one?"
      choices:
        - { text: "Sugar rises faster and acidity falls faster", correct: true }
        - { text: "Sugar rises faster and acidity holds up better", correct: false }
        - { text: "Sugar rises more slowly and acidity falls faster", correct: false }
        - { text: "Sugar and acidity both change more slowly", correct: false }
      explanation: |
        Warmth speeds sugar accumulation and the respiration of malic acid, so the fruit is riper and
        less acidic at a given date. Extreme heat and water stress can instead shut down
        photosynthesis, scorch the fruit or stall ripening.
    fr:
      question: "Lors d’un été chaud mais sans excès, comment la maturation du raisin se compare-t-elle à celle d’un été plus frais ?"
      choices:
        - { text: "Le sucre monte plus vite et l’acidité baisse plus vite", correct: true }
        - { text: "Le sucre monte plus vite et l’acidité se maintient mieux", correct: false }
        - { text: "Le sucre monte plus lentement et l’acidité baisse plus vite", correct: false }
        - { text: "Le sucre et l’acidité évoluent tous deux plus lentement", correct: false }
      explanation: |
        La chaleur accélère l’accumulation des sucres et la combustion de l’acide malique : à date
        égale, le raisin est plus mûr et moins acide. Une chaleur extrême et un stress hydrique
        peuvent au contraire bloquer la photosynthèse, griller les baies ou stopper la maturation.

  - id: vine-drought-collapse-001
    type: mcq
    deck: The Vine
    tags: [vine, water, climate]
    status: reviewed
    source_id: c03-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "If a hot summer also leaves the vine severely short of water, what can happen?"
      choices:
        - { text: "Stomata close, ripening stalls and leaves may drop", correct: true }
        - { text: "Stomata open wider, so leaves cool and ripening speeds up", correct: false }
        - { text: "Berries swell faster as the vine draws water from its trunk", correct: false }
        - { text: "Shoot growth surges as roots search deeper for water", correct: false }
      explanation: |
        Stomatal closure conserves water but also limits carbon dioxide uptake and evaporative cooling.
        If stress intensifies, photosynthesis and ripening decline, leaves may fall and hydraulic
        failure can kill shoots or whole vines. A controlled mild deficit is a different condition.
    fr:
      question: "Si un été chaud prive aussi la vigne d’eau de façon sévère, que peut-il se passer ?"
      choices:
        - { text: "Les stomates se ferment, la maturation se bloque et les feuilles peuvent tomber", correct: true }
        - { text: "Les stomates s’ouvrent davantage : les feuilles refroidissent et la maturation s’accélère", correct: false }
        - { text: "Les baies grossissent plus vite, la vigne puisant l’eau de son tronc", correct: false }
        - { text: "La pousse des rameaux s’emballe tandis que les racines cherchent l’eau en profondeur", correct: false }
      explanation: |
        La fermeture des stomates économise l’eau mais freine l’entrée du CO₂ et le refroidissement
        des feuilles. Si le stress s’aggrave, la photosynthèse et la maturation déclinent, les feuilles
        tombent et la rupture hydraulique peut tuer des rameaux, voire des souches entières. Un
        déficit léger et maîtrisé est une tout autre situation.

  - id: vine-photosynthesis-light-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "For well-watered leaves deep inside a dense vine canopy, what most often limits the rate of photosynthesis?"
      choices:
        - { text: "The amount of light reaching the leaves", correct: true }
        - { text: "The carbon dioxide level in the air", correct: false }
        - { text: "The nitrogen supply in the soil", correct: false }
        - { text: "The sugar already stored in the berries", correct: false }
      explanation: |
        Photosynthetic rate rises with usable light until the leaf reaches saturation. Water, nitrogen,
        carbon dioxide and temperature also constrain the process, but low light is the direct
        limitation for leaves deep in a dense canopy. Sugar already in the berries does not set the
        leaf's rate; ripening fruit is a sink that draws sugar from the leaves.
    fr:
      question: "Pour des feuilles bien alimentées en eau au cœur d’un feuillage dense, qu’est-ce qui limite le plus souvent la vitesse de la photosynthèse ?"
      choices:
        - { text: "La lumière qui atteint les feuilles", correct: true }
        - { text: "La teneur en gaz carbonique de l’air", correct: false }
        - { text: "L’azote disponible dans le sol", correct: false }
        - { text: "Le sucre déjà accumulé dans les baies", correct: false }
      explanation: |
        La photosynthèse s’accélère avec la lumière disponible jusqu’à saturation de la feuille. L’eau,
        l’azote, le gaz carbonique et la température la limitent aussi, mais au cœur d’un feuillage dense,
        c’est le manque de lumière qui freine en premier. Le sucre déjà présent dans les baies ne fixe
        pas ce rythme : les raisins en maturation sont un puits qui attire les sucres des feuilles.

  - id: vine-habitat-woodland-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the wild, where do most Vitis species typically grow?"
      choices:
        - { text: "Forest edges and riverside woodland", correct: true }
        - { text: "Open dry grassland and steppe", correct: false }
        - { text: "Rocky slopes above the tree line", correct: false }
        - { text: "Coastal dunes and salt marsh", correct: false }
      explanation: |
        Wild grapevines are lianas: they use neighbouring trees and shrubs as support while climbing
        towards light. Vineyard stakes and trellises manage this inherited growth habit in a regular,
        accessible form.
    fr:
      question: "À l’état sauvage, où poussent le plus souvent les espèces de Vitis ?"
      choices:
        - { text: "En lisière de forêt et dans les bois de bord de rivière", correct: true }
        - { text: "Dans les prairies sèches et les steppes", correct: false }
        - { text: "Sur les pentes rocheuses au-dessus de la limite des arbres", correct: false }
        - { text: "Dans les dunes littorales et les prés salés", correct: false }
      explanation: |
        Les vignes sauvages sont des lianes : elles s’appuient sur les arbres et les arbustes voisins
        pour grimper vers la lumière. Les piquets et le palissage reprennent ce port grimpant sous une
        forme régulière et accessible.

  - id: vine-habitat-canopy-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a wild grapevine tend to flower and fruit best once it climbs to the top of the woodland canopy?"
      choices:
        - { text: "More light lets the leaves fund flower and fruit formation", correct: true }
        - { text: "Cooler air at the top of the trees triggers flower formation", correct: false }
        - { text: "Longer days at the top of the trees trigger flower formation", correct: false }
        - { text: "Stress from the long climb switches the vine over to flowering", correct: false }
      explanation: |
        A climbing vine first invests in reaching stronger light, where its leaves can meet the high
        carbon cost of flowering and fruiting. Day length is the same at the top and foot of a tree;
        what changes is the intensity of light reaching the leaves.
    fr:
      question: "Pourquoi une vigne sauvage fleurit-elle et fructifie-t-elle mieux une fois parvenue au sommet des arbres ?"
      choices:
        - { text: "Plus de lumière permet aux feuilles de fournir les sucres pour former fleurs et fruits", correct: true }
        - { text: "L’air plus frais au sommet des arbres déclenche la formation des fleurs", correct: false }
        - { text: "Les jours plus longs au sommet des arbres déclenchent la formation des fleurs", correct: false }
        - { text: "Le stress de la longue montée finit par faire basculer la vigne vers la floraison", correct: false }
      explanation: |
        Une liane consacre d’abord sa croissance à atteindre une lumière plus forte, où ses feuilles peuvent
        couvrir le coût élevé en carbone de la floraison et de la fructification. La durée du jour est
        la même au pied et au sommet d’un arbre ; c’est l’intensité de la lumière reçue qui change.

  - id: vine-habitat-dispersal-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology]
    status: reviewed
    source_id: c03-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does fruiting in a well-lit woodland canopy aid the natural dispersal of wild grapevines?"
      choices:
        - { text: "Birds spot the ripe berries, eat them and drop the seeds elsewhere", correct: true }
        - { text: "Wind shakes the ripe berries loose and carries the seeds away", correct: false }
        - { text: "The berries dry on the vine and split, flinging out the seeds", correct: false }
        - { text: "Insects feeding on the sunlit berries carry the seeds to new sites", correct: false }
      explanation: |
        Colourful, exposed berries are easy for birds and mammals to find. The seeds pass through the
        animal and are deposited away from the parent plant, helping the species colonise new supports
        and habitats.
    fr:
      question: "En quoi fructifier au sommet bien éclairé des arbres aide-t-il la vigne sauvage à disperser ses pépins ?"
      choices:
        - { text: "Les oiseaux repèrent les baies mûres, les mangent et rejettent les pépins plus loin", correct: true }
        - { text: "Le vent détache les baies mûres et emporte les pépins au loin", correct: false }
        - { text: "Les baies sèchent sur la souche, éclatent et projettent leurs pépins", correct: false }
        - { text: "Les insectes qui se nourrissent des baies au soleil emportent les pépins ailleurs", correct: false }
      explanation: |
        Colorées et bien exposées, les baies sont faciles à repérer pour les oiseaux et les
        mammifères. Les pépins traversent le tube digestif et sont déposés loin de la plante mère, ce
        qui permet à l’espèce de coloniser de nouveaux supports et de nouveaux milieux.

  - id: vine-water-jobs-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which three jobs does water do for a grapevine in the growing season?"
      choices:
        - { text: "Keeps cells firm, cools the leaves and swells the berries", correct: true }
        - { text: "Keeps cells firm, warms the leaves and hardens the canes", correct: false }
        - { text: "Warms the leaves, thickens the skins and swells the berries", correct: false }
        - { text: "Cools the leaves, thickens the skins and hardens the canes", correct: false }
      explanation: |
        Turgor keeps soft tissues expanded, transpiration removes heat from leaves and water makes up
        most of the berry's volume. Water also carries dissolved nutrients and takes part in
        photosynthesis, so these three jobs are a framework rather than a complete list.
    fr:
      question: "Quels sont les trois rôles de l’eau pour la vigne pendant la saison de croissance ?"
      choices:
        - { text: "Maintenir les cellules turgescentes, rafraîchir les feuilles, faire grossir les baies", correct: true }
        - { text: "Maintenir les cellules turgescentes, réchauffer les feuilles, aoûter les sarments", correct: false }
        - { text: "Réchauffer les feuilles, épaissir les pellicules, faire grossir les baies", correct: false }
        - { text: "Rafraîchir les feuilles, épaissir les pellicules, aoûter les sarments", correct: false }
      explanation: |
        La turgescence maintient les tissus tendres gonflés, la transpiration évacue la chaleur des
        feuilles et l’eau forme l’essentiel du volume de la baie. Elle transporte aussi les éléments
        minéraux dissous et participe à la photosynthèse : ces trois rôles sont un repère, pas une
        liste complète.

  - id: vine-transpiration-001
    type: mcq
    deck: The Vine
    tags: [vine, water, physiology]
    status: reviewed
    source_id: c03-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is transpiration in a grapevine?"
      choices:
        - { text: "Water vapour leaves mainly through stomata, helping draw water through the vine", correct: true }
        - { text: "Liquid water moves from leaves to roots through phloem as sugars accumulate", correct: false }
        - { text: "Roots consume oxygen and release carbon dioxide while producing new tissue", correct: false }
        - { text: "Mineral ions diffuse from the soil into roots without accompanying water flow", correct: false }
      explanation: |
        Evaporation inside the leaf and diffusion out through the stomata create tension in the xylem,
        drawing a continuous water column upwards. Transpiration also cools leaves but can intensify
        water stress when atmospheric demand is high.
    fr:
      question: "Qu’est-ce que la transpiration chez la vigne ?"
      choices:
        - { text: "La vapeur d’eau sort surtout par les stomates, ce qui aspire l’eau à travers la plante", correct: true }
        - { text: "L’eau liquide descend des feuilles aux racines par le phloème à mesure que les sucres s’accumulent", correct: false }
        - { text: "Les racines consomment de l’oxygène et rejettent du gaz carbonique en formant de nouveaux tissus", correct: false }
        - { text: "Les ions minéraux diffusent du sol vers les racines sans flux d’eau associé", correct: false }
      explanation: |
        L’évaporation dans la feuille et la sortie de vapeur par les stomates créent une tension dans
        le xylème, qui tire vers le haut une colonne d’eau continue. La transpiration rafraîchit aussi
        les feuilles, mais peut aggraver le stress hydrique quand l’air est très desséchant.

  - id: vine-water-use-heat-001
    type: mcq
    deck: The Vine
    tags: [vine, water, climate]
    status: reviewed
    source_id: c03-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "With relative humidity, wind and leaf area unchanged, what does hotter air usually do to a vine's transpiration?"
      choices:
        - { text: "It rises, as warmer air draws more water from the leaves", correct: true }
        - { text: "It falls, as warmer air lowers the vapour-pressure deficit", correct: false }
        - { text: "It stays the same, as stomata respond to light rather than heat", correct: false }
        - { text: "It stays the same, as soil water rather than air sets the rate", correct: false }
      explanation: |
        Warmer air can hold more water vapour, so at unchanged relative humidity the vapour-pressure
        deficit and potential water loss both increase. Actual transpiration also depends on stomatal
        closure, radiation and soil water availability.
    fr:
      question: "À humidité relative, vent et surface foliaire constants, quel effet un air plus chaud a-t-il d’habitude sur la transpiration de la vigne ?"
      choices:
        - { text: "Elle augmente, car l’air plus chaud tire davantage d’eau des feuilles", correct: true }
        - { text: "Elle diminue, car l’air plus chaud réduit le déficit de pression de vapeur", correct: false }
        - { text: "Elle ne change pas, car les stomates réagissent à la lumière, pas à la chaleur", correct: false }
        - { text: "Elle ne change pas, car c’est l’eau du sol, pas l’air, qui en fixe le rythme", correct: false }
      explanation: |
        Un air plus chaud peut contenir davantage de vapeur d’eau : à humidité relative égale, le
        déficit de pression de vapeur augmente, et avec lui les pertes d’eau potentielles. La
        transpiration réelle dépend aussi de la fermeture des stomates, du rayonnement et de l’eau
        disponible dans le sol.

  - id: vine-mild-deficit-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can a controlled, moderate water deficit after the canopy is established improve vine balance?"
      choices:
        - { text: "It slows shoot growth while the leaves keep working", correct: true }
        - { text: "It pushes lateral growth, thickening the canopy round the fruit", correct: false }
        - { text: "It makes the berries swell larger, raising the yield", correct: false }
        - { text: "It raises nitrogen uptake, giving greener, healthier leaves", correct: false }
      explanation: |
        A moderate deficit curbs unwanted vegetative growth, opens up the fruit zone and helps balance
        canopy and crop while leaves stay functional; berries also tend to stay smaller. The result
        depends on timing and severity: excessive stress closes stomata and restricts ripening.
    fr:
      question: "Pourquoi un déficit hydrique modéré et maîtrisé, une fois le feuillage en place, peut-il améliorer l’équilibre de la vigne ?"
      choices:
        - { text: "Il freine la pousse des rameaux tandis que les feuilles restent actives", correct: true }
        - { text: "Il stimule les entre-cœurs et épaissit le feuillage autour des grappes", correct: false }
        - { text: "Il fait grossir les baies et augmente le rendement", correct: false }
        - { text: "Il favorise l’absorption d’azote et donne des feuilles plus vertes", correct: false }
      explanation: |
        Un déficit modéré freine la croissance végétative superflue, aère la zone des grappes et
        équilibre feuillage et récolte tant que les feuilles restent fonctionnelles ; les baies restent
        aussi plus petites. Tout dépend du moment et de l’intensité : un stress excessif ferme les
        stomates et freine la maturation.

  - id: vine-rain-flowering-001
    type: mcq
    deck: The Vine
    tags: [vine, water, growth-cycle]
    status: reviewed
    source_id: c03-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is a major consequence of cold, rainy weather during grapevine flowering?"
      choices:
        - { text: "Poor fruit set, giving smaller or straggly bunches", correct: true }
        - { text: "Split berries, as the skins burst from water uptake", correct: false }
        - { text: "Fewer flower clusters forming on this year's shoots", correct: false }
        - { text: "Diluted sugar in the berries at harvest", correct: false }
      explanation: |
        Cold, wet bloom weather disrupts cap fall, pollination and fertilisation, causing coulure
        (flowers or tiny berries drop) and millerandage (normal berries mixed with small, often
        seedless ones). Splitting and dilution are risks of rain close to harvest.
    fr:
      question: "Quelle est une conséquence majeure d’un temps froid et pluvieux pendant la floraison de la vigne ?"
      choices:
        - { text: "Une mauvaise nouaison et des grappes clairsemées", correct: true }
        - { text: "Des baies qui éclatent en absorbant trop d’eau", correct: false }
        - { text: "Moins d’inflorescences sur les rameaux de l’année", correct: false }
        - { text: "Des baies moins sucrées, diluées à la vendange", correct: false }
      explanation: |
        Un temps froid et humide à la floraison gêne la chute des capuchons, la pollinisation et la
        fécondation : c’est la coulure (fleurs ou jeunes baies qui tombent) et le millerandage (baies
        normales mêlées de petites baies, souvent sans pépins). L’éclatement et la dilution sont des
        risques de pluie à l’approche des vendanges.

  - id: vine-drip-define-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description distinguishes drip irrigation from flood or overhead-sprinkler irrigation?"
      choices:
        - { text: "Emitters deliver small, controlled volumes close to individual vines", correct: true }
        - { text: "Water is released into furrows and allowed to flow across the whole block", correct: false }
        - { text: "Large sprinklers apply water above the canopy across a broad area", correct: false }
        - { text: "Subsoil is saturated once in winter and no growing-season water is applied", correct: false }
      explanation: |
        Drip lines use emitters to place water slowly and locally near the vine's active root zone.
        This gives greater control and usually reduces evaporation and runoff relative to broad-area
        systems, although installation, filtration and maintenance add cost.
    fr:
      question: "Qu’est-ce qui distingue l’irrigation au goutte-à-goutte de l’irrigation par submersion ou par aspersion ?"
      choices:
        - { text: "Des goutteurs apportent de petits volumes maîtrisés au pied de chaque souche", correct: true }
        - { text: "L’eau est lâchée dans des rigoles et s’écoule sur toute la parcelle", correct: false }
        - { text: "De grands asperseurs arrosent par-dessus le feuillage sur une large surface", correct: false }
        - { text: "Le sous-sol est saturé une fois en hiver, sans aucun apport pendant la saison", correct: false }
      explanation: |
        Les lignes de goutte-à-goutte déposent l’eau lentement, au plus près des racines actives. Le
        contrôle est meilleur et l’évaporation comme le ruissellement sont en général moindres qu’avec
        les systèmes qui arrosent toute la surface, mais l’installation, la filtration et l’entretien
        ont un coût.

  - id: vine-drip-metering-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What management advantage does a zoned drip-irrigation system offer?"
      choices:
        - { text: "Water can be timed and dosed separately for each block", correct: true }
        - { text: "Emitters sense vine stress and switch themselves on", correct: false }
        - { text: "It also cools the canopy on hot afternoons", correct: false }
        - { text: "It spreads water evenly over the whole vineyard floor", correct: false }
      explanation: |
        Valves and controllers can schedule separate irrigation zones, allowing doses to reflect soil,
        slope, variety or vine demand. Emitters meter delivery, but the system does not by itself sense
        stress, and drip wets only a strip near the vines rather than the canopy or the whole floor.
    fr:
      question: "Quel avantage de conduite offre un goutte-à-goutte découpé en secteurs ?"
      choices:
        - { text: "On règle la durée et la dose d’eau parcelle par parcelle", correct: true }
        - { text: "Les goutteurs détectent le stress de la vigne et se déclenchent seuls", correct: false }
        - { text: "Il rafraîchit aussi le feuillage les après-midi de forte chaleur", correct: false }
        - { text: "Il répartit l’eau uniformément sur tout le sol de la parcelle", correct: false }
      explanation: |
        Vannes et programmateurs pilotent chaque secteur séparément : la dose peut suivre le sol, la
        pente, le cépage ou les besoins de la vigne. Les goutteurs dosent l’apport, mais le système ne
        mesure pas seul le stress, et il n’humidifie qu’une bande au pied des souches, ni le feuillage
        ni tout le sol.

  - id: vine-drought-stomata-001
    type: mcq
    deck: The Vine
    tags: [vine, water, physiology]
    status: reviewed
    source_id: c03-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is an early physiological response when a grapevine experiences water deficit?"
      choices:
        - { text: "Stomata partly close, cutting water loss and CO₂ uptake", correct: true }
        - { text: "Stomata open wider to cool the leaves as water runs short", correct: false }
        - { text: "Stomata partly close, cutting water loss but not CO₂ uptake", correct: false }
        - { text: "The vine drops its lower leaves first, keeping stomata open", correct: false }
      explanation: |
        The same pores let water vapour out and carbon dioxide in, so closing them limits both and
        slows photosynthesis. That protects the vine during a short deficit; prolonged or severe
        stress can still impair canopy function and ripening.
    fr:
      question: "Quelle est l’une des premières réactions physiologiques de la vigne face à un déficit hydrique ?"
      choices:
        - { text: "Les stomates se ferment en partie, réduisant pertes d’eau et entrée de CO₂", correct: true }
        - { text: "Les stomates s’ouvrent davantage pour rafraîchir les feuilles quand l’eau manque", correct: false }
        - { text: "Les stomates se ferment en partie, réduisant les pertes d’eau mais pas l’entrée de CO₂", correct: false }
        - { text: "La vigne perd d’abord ses feuilles du bas en gardant ses stomates ouverts", correct: false }
      explanation: |
        Les mêmes pores laissent sortir la vapeur d’eau et entrer le gaz carbonique : les fermer
        limite les deux et ralentit la photosynthèse. Cela protège la vigne lors d’un déficit bref ;
        un stress long ou sévère peut tout de même altérer le feuillage et la maturation.

  - id: vine-excess-water-vigour-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In warm conditions with adequate nitrogen, what is a likely effect of abundant soil water?"
      choices:
        - { text: "Vigorous shoot growth and a dense, shaded canopy", correct: true }
        - { text: "An early stop to shoot growth, focusing the vine on ripening", correct: false }
        - { text: "Smaller, more concentrated berries with thicker skins", correct: false }
        - { text: "Earlier véraison and faster sugar accumulation", correct: false }
      explanation: |
        Water and nitrogen sustain vegetative growth. If unmanaged, a dense canopy shades leaves and
        fruit, holds humidity and competes with the crop; water alone does not set vigour, since soil,
        rootstock, temperature and crop load also matter.
    fr:
      question: "Par temps chaud et avec assez d’azote, quel est l’effet probable d’une eau abondante dans le sol ?"
      choices:
        - { text: "Une forte vigueur et un feuillage dense qui fait de l’ombre", correct: true }
        - { text: "Un arrêt de croissance précoce qui recentre la vigne sur la maturation", correct: false }
        - { text: "Des baies plus petites et plus concentrées, à la pellicule épaisse", correct: false }
        - { text: "Une véraison plus précoce et une accumulation de sucre plus rapide", correct: false }
      explanation: |
        L’eau et l’azote entretiennent la croissance végétative. Sans gestion, un feuillage dense
        ombrage feuilles et grappes, retient l’humidité et concurrence la récolte ; l’eau seule ne fixe
        pas la vigueur, le sol, le porte-greffe, la température et la charge en raisin comptent aussi.

  - id: vine-vigour-sugar-001
    type: mcq
    deck: The Vine
    tags: [vine, water, physiology]
    status: reviewed
    source_id: c03-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can prolonged shoot growth during ripening delay grape maturity?"
      choices:
        - { text: "Growing shoot tips compete with the bunches for the vine's sugars", correct: true }
        - { text: "Shoot growth draws potassium away, so the berries cannot store sugar", correct: false }
        - { text: "New leaves cool the canopy until photosynthesis stops for the season", correct: false }
        - { text: "Elongating shoots stretch the canes and restrict sap flow to the bunches", correct: false }
      explanation: |
        Expanding shoots are sinks: they import carbohydrates instead of exporting them. While they
        keep growing, less sugar reaches the berries, and the extra foliage often shades the fruit
        too. Vines that stop growing around véraison usually ripen more evenly.
    fr:
      question: "Pourquoi une croissance des rameaux qui se prolonge pendant la maturation peut-elle retarder la maturité du raisin ?"
      choices:
        - { text: "Les apex en croissance disputent les sucres de la vigne aux grappes", correct: true }
        - { text: "La pousse accapare le potassium, et les baies ne stockent plus de sucre", correct: false }
        - { text: "Les jeunes feuilles refroidissent le feuillage jusqu’à stopper la photosynthèse", correct: false }
        - { text: "L’allongement des rameaux étire les sarments et freine la sève vers les grappes", correct: false }
      explanation: |
        Un rameau qui pousse consomme des glucides au lieu d’en exporter. Tant que la croissance
        continue, moins de sucre gagne les baies, et le surplus de feuillage ombrage souvent les
        grappes. Une vigne qui s’arrête de pousser vers la véraison mûrit plus régulièrement.

  - id: vine-vigour-shade-001
    type: mcq
    deck: The Vine
    tags: [vine, water]
    status: reviewed
    source_id: c03-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which problem is most directly caused by an excessively dense grapevine canopy?"
      choices:
        - { text: "Shaded fruit and stagnant, humid air in the bunch zone", correct: true }
        - { text: "Sunburned berries from excessive direct light on the fruit", correct: false }
        - { text: "Faster sugar build-up thanks to the extra leaf area", correct: false }
        - { text: "Rapid drying of the bunch zone after each shower", correct: false }
      explanation: |
        Inner leaves in a crowded canopy are shaded and contribute little sugar. The fruit zone stays
        damp after rain, which favours botrytis and mildew, and shaded bunches ripen less evenly.
        Shoot positioning and leaf removal open it up, but overdoing it risks sunburn.
    fr:
      question: "Quel problème découle le plus directement d’un feuillage de vigne trop dense ?"
      choices:
        - { text: "Des grappes à l’ombre et un air humide qui stagne dans la zone des grappes", correct: true }
        - { text: "Des baies échaudées par trop de lumière directe sur les grappes", correct: false }
        - { text: "Une accumulation de sucre plus rapide grâce à la surface foliaire en plus", correct: false }
        - { text: "Un séchage rapide de la zone des grappes après chaque averse", correct: false }
      explanation: |
        Dans un feuillage entassé, les feuilles intérieures sont à l’ombre et produisent peu de
        sucre. La zone des grappes reste humide après la pluie, ce qui favorise la pourriture grise
        et le mildiou. Palissage et effeuillage l’aèrent, mais en excès ils exposent à l’échaudage.

  - id: vine-hail-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What makes a severe hailstorm close to véraison so damaging for a vineyard?"
      choices:
        - { text: "It wounds berries, inviting rot, and can damage next year's fruiting wood", correct: true }
        - { text: "It chills the soil and delays ripening into the following season", correct: false }
        - { text: "It knocks off pollen and causes coulure in the newly set bunches", correct: false }
        - { text: "It sends the vine into early dormancy, halting sugar loading", correct: false }
      explanation: |
        Split berries are an open door for grey rot and sour rot in the weeks before picking. Broken
        or bruised shoots are the canes that would be kept at pruning, so the following crop can
        suffer too. Fruit set is long over by véraison, so coulure is no longer the risk. Burgundy,
        Mendoza and Bordeaux have all lost vintages to summer hail.
    fr:
      question: "Qu’est-ce qui rend un violent orage de grêle aux abords de la véraison si dommageable pour un vignoble ?"
      choices:
        - { text: "Il blesse les baies, ouvrant la porte aux pourritures, et abîme le bois de l’an prochain", correct: true }
        - { text: "Il refroidit le sol et repousse la maturité jusqu’à la saison suivante", correct: false }
        - { text: "Il fait tomber le pollen et provoque de la coulure sur les grappes juste nouées", correct: false }
        - { text: "Il plonge la vigne en dormance précoce et stoppe l’accumulation de sucre", correct: false }
      explanation: |
        Une baie éclatée laisse entrer la pourriture grise et la pourriture acide dans les semaines
        qui précèdent la vendange. Les rameaux cassés ou meurtris sont ceux que l’on garderait à la
        taille : la récolte suivante en pâtit aussi. La nouaison est achevée depuis longtemps à la
        véraison : la coulure n’est plus à craindre. La Bourgogne, Mendoza et Bordeaux ont tous
        perdu des millésimes à cause de la grêle d’été.

  - id: vine-maritime-rain-001
    type: mcq
    deck: The Vine
    tags: [vine, climate]
    status: reviewed
    source_id: c03-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can frequent growing-season rain be especially challenging in a maritime vineyard?"
      choices:
        - { text: "It can upset fruit set and keep fungal disease pressure high", correct: true }
        - { text: "It raises spring frost risk because wet soils lose heat fastest", correct: false }
        - { text: "It thickens berry skins and slows sugar loading until harvest", correct: false }
        - { text: "It leaches nitrogen until shoots stop growing by midsummer", correct: false }
      explanation: |
        Cool, wet weather at flowering can cause coulure and millerandage, and humid conditions later
        feed downy mildew and grey rot while delaying harvest. Wet soils actually store heat, so they
        lower rather than raise the risk of a radiation frost.
    fr:
      question: "Pourquoi des pluies fréquentes pendant la saison végétative posent-elles un problème particulier dans un vignoble à climat maritime ?"
      choices:
        - { text: "Elles peuvent perturber la nouaison et entretenir la pression des maladies", correct: true }
        - { text: "Elles aggravent le risque de gel de printemps, un sol humide perdant vite sa chaleur", correct: false }
        - { text: "Elles épaississent la pellicule et freinent l’accumulation de sucre jusqu’à la vendange", correct: false }
        - { text: "Elles lessivent l’azote au point d’arrêter la pousse dès le milieu de l’été", correct: false }
      explanation: |
        Un temps frais et humide à la floraison provoque coulure et millerandage ; plus tard,
        l’humidité nourrit le mildiou et la pourriture grise et retarde la vendange. Un sol humide
        stocke au contraire la chaleur : il réduit le risque de gelée de printemps.

  - id: vine-soil-ideal-001
    type: mcq
    deck: The Vine
    tags: [vine, soil, water]
    status: reviewed
    source_id: c03-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which soil combination most often helps a grower maintain balanced vine growth?"
      choices:
        - { text: "Good drainage, moderate fertility and an adequate water supply", correct: true }
        - { text: "Poor drainage, high fertility and an adequate water supply", correct: false }
        - { text: "Good drainage, high fertility and abundant water all season", correct: false }
        - { text: "Poor drainage, moderate fertility and abundant water all season", correct: false }
      explanation: |
        There is no single ideal soil. Drainage keeps roots out of waterlogged ground, modest fertility
        stops vigour running away, and enough stored or irrigated water avoids severe stress. Too
        much nitrogen and water gives leaves at the expense of fruit; too little starves the vine.
    fr:
      question: "Quelle combinaison de sol aide le plus souvent un vigneron à garder une vigne équilibrée ?"
      choices:
        - { text: "Un bon drainage, une fertilité modérée et une alimentation en eau suffisante", correct: true }
        - { text: "Un mauvais drainage, une forte fertilité et une alimentation en eau suffisante", correct: false }
        - { text: "Un bon drainage, une forte fertilité et de l’eau en abondance toute la saison", correct: false }
        - { text: "Un mauvais drainage, une fertilité modérée et de l’eau en abondance toute la saison", correct: false }
      explanation: |
        Il n’existe pas de sol idéal unique. Le drainage évite l’asphyxie des racines, une fertilité
        modeste limite l’excès de vigueur, et une réserve en eau ou une irrigation suffisante évite
        un stress sévère. Trop d’azote et d’eau donne des feuilles plutôt que des raisins ; trop
        peu affame la vigne.

  - id: vine-water-season-001
    type: mcq
    deck: The Vine
    tags: [vine, water, growth-cycle]
    status: reviewed
    source_id: c03-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When is a moderate water deficit most often applied to curb shoot growth and berry size?"
      choices:
        - { text: "Between fruit set and véraison", correct: true }
        - { text: "From budburst to flowering", correct: false }
        - { text: "During flowering and fruit set", correct: false }
        - { text: "In the final weeks before harvest", correct: false }
      explanation: |
        This is regulated deficit irrigation. Stress early in the season stunts the canopy or ruins
        fruit set; after véraison, shoots have mostly stopped and berries respond less to water
        deficit. Mild stress between set and véraison checks both shoots and berry growth.
    fr:
      question: "À quel moment applique-t-on le plus souvent un déficit hydrique modéré pour freiner la pousse et la taille des baies ?"
      choices:
        - { text: "Entre la nouaison et la véraison", correct: true }
        - { text: "Du débourrement à la floraison", correct: false }
        - { text: "Pendant la floraison et la nouaison", correct: false }
        - { text: "Dans les dernières semaines avant la vendange", correct: false }
      explanation: |
        C’est le principe de l’irrigation déficitaire contrôlée. Un stress trop précoce bride le
        feuillage ou compromet la nouaison ; après la véraison, la pousse est presque arrêtée et les
        baies réagissent moins au manque d’eau. Entre nouaison et véraison, un stress léger freine
        à la fois les rameaux et le grossissement des baies.

  - id: vine-nutrient-vigour-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the most likely effect of excessive nitrogen availability in a vineyard?"
      choices:
        - { text: "Vigorous shoot growth and a dense canopy", correct: true }
        - { text: "Early shoot stopping and a smaller canopy", correct: false }
        - { text: "Smaller berries with thicker, darker skins", correct: false }
        - { text: "Pale yellow leaves and weak shoot growth", correct: false }
      explanation: |
        Nitrogen drives leaf and shoot growth. In excess it prolongs shoot development, shades the
        fruit and keeps the canopy humid, which can delay ripening and favour botrytis. Pale leaves
        and weak shoots are the signs of nitrogen shortage, not surplus.
    fr:
      question: "Quel est l’effet le plus probable d’un excès d’azote disponible dans un vignoble ?"
      choices:
        - { text: "Une pousse vigoureuse et un feuillage dense", correct: true }
        - { text: "Un arrêt de pousse précoce et un feuillage réduit", correct: false }
        - { text: "Des baies plus petites à la pellicule épaisse et foncée", correct: false }
        - { text: "Des feuilles jaune pâle et des rameaux chétifs", correct: false }
      explanation: |
        L’azote stimule la croissance des feuilles et des rameaux. En excès, il prolonge la pousse,
        ombrage les grappes et entretient l’humidité dans le feuillage, ce qui retarde la maturité
        et favorise la pourriture grise. Des feuilles pâles et des rameaux chétifs signalent au
        contraire un manque d’azote.

  - id: vine-chlorosis-define-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What vineyard symptom does the term chlorosis describe?"
      choices:
        - { text: "Yellowing of leaves, often between green veins", correct: true }
        - { text: "Browning and drying of leaf edges under drought", correct: false }
        - { text: "Red discolouration of leaves from leafroll virus", correct: false }
        - { text: "The colour change of berry skins at véraison", correct: false }
      explanation: |
        Chlorosis is a symptom, not a disease: the leaves make too little chlorophyll. Iron made unavailable by lime is the classic vineyard
        cause, giving yellow young leaves with green veins, but magnesium or nitrogen shortage and
        root damage can also turn leaves pale.
    fr:
      question: "Quel symptôme le terme de chlorose désigne-t-il à la vigne ?"
      choices:
        - { text: "Le jaunissement des feuilles, souvent entre des nervures vertes", correct: true }
        - { text: "Le brunissement et le dessèchement du bord des feuilles en cas de sécheresse", correct: false }
        - { text: "Le rougissement des feuilles dû au virus de l’enroulement", correct: false }
        - { text: "Le changement de couleur de la pellicule à la véraison", correct: false }
      explanation: |
        La chlorose est un symptôme, pas une maladie : la feuille manque de chlorophylle. La cause classique au vignoble est le fer
        rendu indisponible par le calcaire : jeunes feuilles jaunes aux nervures restées vertes.
        Une carence en magnésium ou en azote, ou des racines abîmées, font aussi pâlir les feuilles.

  - id: vine-chlorosis-yield-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can severe, persistent leaf chlorosis reduce grape yield and quality?"
      choices:
        - { text: "Less chlorophyll means less photosynthesis and less sugar for fruit", correct: true }
        - { text: "Yellow leaves transpire faster and push the vine into water stress", correct: false }
        - { text: "The pale canopy reflects heat onto the bunches and scorches them", correct: false }
        - { text: "It blocks potassium transport, so berries cannot accumulate sugar", correct: false }
      explanation: |
        A chlorotic leaf captures less light, so the vine has fewer carbohydrates for growth, fruit
        and winter reserves. Untreated severe cases weaken the vine year after year, which is why
        lime-tolerant rootstocks matter on chalk and limestone.
    fr:
      question: "Pourquoi une chlorose foliaire sévère et persistante peut-elle réduire le rendement et la qualité du raisin ?"
      choices:
        - { text: "Moins de chlorophylle, donc moins de photosynthèse et de sucres pour les baies", correct: true }
        - { text: "Les feuilles jaunes transpirent davantage et plongent la vigne dans le stress hydrique", correct: false }
        - { text: "Le feuillage pâle renvoie la chaleur sur les grappes et les échaude", correct: false }
        - { text: "Elle bloque le transport du potassium, et les baies n’accumulent plus de sucre", correct: false }
      explanation: |
        Une feuille chlorosée capte moins de lumière : la vigne dispose de moins de glucides pour
        pousser, mûrir ses raisins et constituer ses réserves. Non traitée, une chlorose sévère
        affaiblit le cep d’année en année, d’où l’importance des porte-greffes résistants au calcaire.

  - id: vine-chlorosis-iron-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients]
    status: reviewed
    source_id: c03-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In lime-induced chlorosis, why can a vine show iron deficiency even when the soil contains iron?"
      choices:
        - { text: "At high pH, the iron is held in forms the roots cannot take up", correct: true }
        - { text: "The vine absorbs calcium in its place inside the chlorophyll", correct: false }
        - { text: "Limestone drains so fast that the iron is washed below the roots", correct: false }
        - { text: "Active lime makes the soil too acidic for iron to be absorbed", correct: false }
      explanation: |
        In alkaline, carbonate-rich soils, iron is present but chemically locked up. Iron is needed
        to make chlorophyll (the molecule itself is built around magnesium), so the youngest leaves
        yellow between veins that stay green.
    fr:
      question: "Dans la chlorose calcaire, pourquoi une vigne peut-elle manquer de fer alors que le sol en contient ?"
      choices:
        - { text: "À pH élevé, le fer prend des formes que les racines n’absorbent pas", correct: true }
        - { text: "La vigne absorbe du calcium qui prend sa place dans la chlorophylle", correct: false }
        - { text: "Le calcaire draine si vite que le fer est entraîné sous les racines", correct: false }
        - { text: "Le calcaire actif acidifie trop le sol pour que le fer soit absorbé", correct: false }
      explanation: |
        En sol alcalin riche en carbonates, le fer est bien là mais chimiquement bloqué. Le fer est
        nécessaire à la fabrication de la chlorophylle (dont la molécule s’organise autour du
        magnésium) : les jeunes feuilles jaunissent entre des nervures qui restent vertes.

  - id: vine-chlorosis-limestone-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients, soil]
    status: reviewed
    source_id: c03-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which site condition gives the greatest risk of iron chlorosis in vines?"
      choices:
        - { text: "A calcareous, high-pH soil rich in active lime", correct: true }
        - { text: "An acidic sandy soil low in calcium carbonate", correct: false }
        - { text: "A slate soil with low pH and many stones", correct: false }
        - { text: "A well-drained, acidic granite soil", correct: false }
      explanation: |
        Active calcium carbonate and high pH lock up iron. Cognac, Champagne and parts of Burgundy
        plant lime-tolerant rootstocks such as Fercal or 41 B for this reason; acidic slate and
        granite pose the opposite set of problems.
    fr:
      question: "Quelle situation expose le plus la vigne à la chlorose ferrique ?"
      choices:
        - { text: "Un sol calcaire à pH élevé, riche en calcaire actif", correct: true }
        - { text: "Un sol sableux acide, pauvre en carbonate de calcium", correct: false }
        - { text: "Un sol de schiste à pH bas et très caillouteux", correct: false }
        - { text: "Un sol granitique acide et bien drainé", correct: false }
      explanation: |
        Le calcaire actif et un pH élevé bloquent le fer. C’est pourquoi la Champagne, le Cognaçais
        ou une partie de la Bourgogne plantent des porte-greffes résistants au calcaire comme le
        Fercal ou le 41 B ; schistes et granites acides posent les problèmes inverses.

  - id: vine-species-pair-001
    type: mcq
    deck: The Vine
    tags: [vine, species]
    status: reviewed
    source_id: c03-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In most grafted vineyards, which roles do European and American *Vitis* species play?"
      choices:
        - { text: "*V. vinifera* for the fruiting scion; American species for the rootstock", correct: true }
        - { text: "American species for the fruiting scion; *V. vinifera* for the rootstock", correct: false }
        - { text: "*V. vinifera* for both parts; American species only for breeding", correct: false }
        - { text: "*V. labrusca* for the fruiting scion; *V. vinifera* for the rootstock", correct: false }
      explanation: |
        The classic wine varieties are *vinifera* and supply the fruit. Their roots are vulnerable to
        phylloxera, so they are grafted onto rootstocks bred from *V. riparia*, *V. rupestris* and
        *V. berlandieri*, which also bring tolerance of lime, drought or nematodes.
    fr:
      question: "Dans la plupart des vignobles greffés, quel rôle jouent les espèces de *Vitis* européenne et américaines ?"
      choices:
        - { text: "*V. vinifera* pour le greffon ; espèces américaines pour le porte-greffe", correct: true }
        - { text: "Espèces américaines pour le greffon ; *V. vinifera* pour le porte-greffe", correct: false }
        - { text: "*V. vinifera* pour les deux ; espèces américaines pour la sélection seulement", correct: false }
        - { text: "*V. labrusca* pour le greffon ; *V. vinifera* pour le porte-greffe", correct: false }
      explanation: |
        Les grands cépages à vin sont des *vinifera* et donnent le raisin. Leurs racines ne résistent
        pas au phylloxéra : on les greffe donc sur des porte-greffes issus de *V. riparia*,
        *V. rupestris* et *V. berlandieri*, qui apportent aussi une tolérance au calcaire, à la
        sécheresse ou aux nématodes.

  - id: vine-vinifera-wine-001
    type: mcq
    deck: The Vine
    tags: [vine, species]
    status: reviewed
    source_id: c03-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "To which species do Chardonnay, Cabernet Sauvignon and Riesling all belong?"
      choices:
        - { text: "*Vitis vinifera*", correct: true }
        - { text: "*Vitis riparia*", correct: false }
        - { text: "*Vitis rupestris*", correct: false }
        - { text: "*Vitis labrusca*", correct: false }
      explanation: |
        Almost all classic wine varieties are *Vitis vinifera*, native to Europe and western Asia.
        *V. riparia* and *V. rupestris* are mainly rootstock parents, and *V. labrusca* gives
        Concord, with its distinctive "foxy" aroma.
    fr:
      question: "À quelle espèce appartiennent à la fois le Chardonnay, le Cabernet Sauvignon et le Riesling ?"
      choices:
        - { text: "*Vitis vinifera*", correct: true }
        - { text: "*Vitis riparia*", correct: false }
        - { text: "*Vitis rupestris*", correct: false }
        - { text: "*Vitis labrusca*", correct: false }
      explanation: |
        Presque tous les grands cépages à vin sont des *Vitis vinifera*, espèce originaire d’Europe
        et d’Asie occidentale. *V. riparia* et *V. rupestris* servent surtout de parents de
        porte-greffes ; *V. labrusca* a donné le Concord, au goût « foxé » caractéristique.

  - id: vine-american-phylloxera-001
    type: mcq
    deck: The Vine
    tags: [vine, species, grafting]
    status: reviewed
    source_id: c03-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are rootstocks derived from American *Vitis* species widely used beneath *V. vinifera* scions?"
      choices:
        - { text: "Their roots resist or tolerate phylloxera far better than *vinifera* roots", correct: true }
        - { text: "They pass their resistance to downy and powdery mildew to the canopy", correct: false }
        - { text: "They protect the scion from Pierce's disease carried by sharpshooters", correct: false }
        - { text: "They stop fungal trunk diseases from entering the grafted *vinifera* wood", correct: false }
      explanation: |
        American species evolved alongside phylloxera, so their roots survive its feeding. The
        rootstock does not change the scion's genes: the *vinifera* canopy stays just as prone to
        mildew and to Pierce's disease as an ungrafted vine.
    fr:
      question: "Pourquoi greffe-t-on si largement les *V. vinifera* sur des porte-greffes issus d’espèces américaines ?"
      choices:
        - { text: "Leurs racines supportent bien mieux le phylloxéra que celles des *vinifera*", correct: true }
        - { text: "Ils transmettent au feuillage leur résistance au mildiou et à l’oïdium", correct: false }
        - { text: "Ils protègent le greffon de la maladie de Pierce transmise par des cicadelles", correct: false }
        - { text: "Ils empêchent les maladies du bois de gagner le tronc du *vinifera* greffé", correct: false }
      explanation: |
        Les espèces américaines ont évolué au contact du phylloxéra : leurs racines supportent ses
        piqûres. Le porte-greffe ne modifie pas les gènes du greffon, dont le feuillage reste aussi
        sensible au mildiou ou à la maladie de Pierce qu’un *vinifera* franc de pied.

  - id: vine-cutting-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c03-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the genetic relationship between a healthy grapevine cutting and the vine from which it was taken?"
      choices:
        - { text: "A genetically identical copy, barring later mutation", correct: true }
        - { text: "A new individual mixing the genes of two parents", correct: false }
        - { text: "A blend of the mother vine's scion and rootstock genes", correct: false }
        - { text: "A copy whose genes adapt to its new site within a few years", correct: false }
      explanation: |
        A cutting is vegetative propagation: it carries the source vine's genotype unchanged, unlike
        a seedling. Taken from the scion of a grafted vine, it holds only scion genes. Occasional
        bud mutations are what give rise to different clones of one variety.
    fr:
      question: "Quel lien génétique unit une bouture de vigne saine au cep sur lequel elle a été prélevée ?"
      choices:
        - { text: "Une copie génétiquement identique, mutation ultérieure mise à part", correct: true }
        - { text: "Un nouvel individu qui mêle les gènes de deux parents", correct: false }
        - { text: "Un mélange des gènes du greffon et du porte-greffe du cep mère", correct: false }
        - { text: "Une copie dont les gènes s’adaptent au nouveau site en quelques années", correct: false }
      explanation: |
        La bouture est une multiplication végétative : elle conserve tel quel le génotype du cep
        d’origine, contrairement à un semis. Prélevée sur le greffon d’une vigne greffée, elle ne
        porte que les gènes du greffon. Ce sont des mutations de bourgeon occasionnelles qui font
        naître les différents clones d’un cépage.

  - id: vine-variety-name-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c03-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In viticulture, what does a grape variety such as Chardonnay represent?"
      choices:
        - { text: "A cultivar within a species", correct: true }
        - { text: "A single certified clone within a cultivar", correct: false }
        - { text: "A rootstock-scion combination", correct: false }
        - { text: "A species of the genus *Vitis*", correct: false }
      explanation: |
        Chardonnay is a cultivar of *Vitis vinifera*. It includes many clones, such as the Dijon
        clones 76, 95 and 96, and it can be grafted onto any of several rootstocks without
        becoming a different variety.
    fr:
      question: "En viticulture, que représente un cépage comme le Chardonnay ?"
      choices:
        - { text: "Un cultivar au sein d’une espèce", correct: true }
        - { text: "Un seul clone agréé au sein d’un cultivar", correct: false }
        - { text: "Une association porte-greffe–greffon", correct: false }
        - { text: "Une espèce du genre *Vitis*", correct: false }
      explanation: |
        Le Chardonnay est un cultivar de *Vitis vinifera*. Il compte de nombreux clones, comme les
        clones dijonnais 76, 95 et 96, et peut être greffé sur divers porte-greffes sans devenir un
        autre cépage.

  - id: vine-clone-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c03-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What distinguishes a named grapevine clone from the wider variety to which it belongs?"
      choices:
        - { text: "It descends vegetatively from one selected mother vine", correct: true }
        - { text: "It is grown from seed of two vines of the same variety", correct: false }
        - { text: "It groups all vines of the variety in one named region", correct: false }
        - { text: "It is the variety grafted onto one specific rootstock", correct: false }
      explanation: |
        A clone is chosen for traits such as yield, bunch size or virus-free status and multiplied by
        cuttings or grafting. Pinot Noir clones can differ markedly in berry size and productivity
        while all remaining Pinot Noir.
    fr:
      question: "Qu’est-ce qui distingue un clone de vigne du cépage auquel il appartient ?"
      choices:
        - { text: "Il descend par voie végétative d’un seul cep mère sélectionné", correct: true }
        - { text: "Il est issu de pépins de deux ceps du même cépage", correct: false }
        - { text: "Il regroupe tous les ceps du cépage dans une région donnée", correct: false }
        - { text: "C’est le cépage greffé sur un porte-greffe précis", correct: false }
      explanation: |
        Un clone est choisi pour des caractères comme le rendement, la taille des grappes ou
        l’absence de virus, puis multiplié par bouturage ou greffage. Les clones de Pinot Noir
        diffèrent nettement par la taille des baies et la productivité, tout en restant du Pinot Noir.

  - id: vine-hybrid-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding]
    status: reviewed
    source_id: c03-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the usual viticultural distinction, which plant counts as a hybrid rather than a crossing?"
      choices:
        - { text: "A seedling whose parents come from different *Vitis* species", correct: true }
        - { text: "A seedling from two parents that are both *V. vinifera*", correct: false }
        - { text: "A *V. vinifera* scion grafted onto an American-derived rootstock", correct: false }
        - { text: "A cutting taken from a selected mother vine and rooted directly", correct: false }
      explanation: |
        Vidal Blanc, with *vinifera* and American ancestry, is a hybrid; Cabernet Sauvignon, born of
        Cabernet Franc and Sauvignon Blanc, is a crossing. A grafted vine keeps two separate
        genotypes joined physically rather than combined by pollination.
    fr:
      question: "Selon la distinction habituelle en viticulture, quelle plante est un hybride et non un croisement ?"
      choices:
        - { text: "Un semis dont les parents appartiennent à des espèces de *Vitis* différentes", correct: true }
        - { text: "Un semis issu de deux parents qui sont tous deux des *V. vinifera*", correct: false }
        - { text: "Un greffon de *V. vinifera* greffé sur un porte-greffe d’origine américaine", correct: false }
        - { text: "Une bouture prélevée sur un cep mère sélectionné et enracinée directement", correct: false }
      explanation: |
        Le Vidal, aux ancêtres *vinifera* et américains, est un hybride ; le Cabernet Sauvignon, né
        du Cabernet Franc et du Sauvignon Blanc, est un croisement. Une vigne greffée réunit
        physiquement deux génotypes distincts, sans les mêler par pollinisation.

  - id: vine-hybrid-rootstock-001
    type: mcq
    deck: The Vine
    tags: [vine, breeding, grafting]
    status: reviewed
    source_id: c03-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the principal vineyard use of crosses among American *Vitis* species?"
      choices:
        - { text: "Rootstocks for pest resistance and soil adaptation", correct: true }
        - { text: "Pollinisers planted among *vinifera* rows to aid fruit set", correct: false }
        - { text: "Mother vines supplying *vinifera* budwood to nurseries", correct: false }
        - { text: "Fruit for most of Europe's quality wine appellations", correct: false }
      explanation: |
        Crosses such as 101-14 (*riparia* × *rupestris*) or 110 R (*berlandieri* × *rupestris*)
        combine phylloxera resistance with traits like lime or drought tolerance and a chosen level
        of vigour. *Vinifera* flowers are self-fertile, so no polliniser rows are needed.
    fr:
      question: "À quoi servent principalement, au vignoble, les croisements entre espèces américaines de *Vitis* ?"
      choices:
        - { text: "De porte-greffes résistants aux ravageurs et adaptés au sol", correct: true }
        - { text: "De pollinisateurs plantés entre les rangs de *vinifera*", correct: false }
        - { text: "De pieds mères fournissant les greffons de *vinifera*", correct: false }
        - { text: "De raisins pour la plupart des grandes appellations d’Europe", correct: false }
      explanation: |
        Des croisements comme le 101-14 (*riparia* × *rupestris*) ou le 110 R (*berlandieri* ×
        *rupestris*) associent la résistance au phylloxéra à une tolérance au calcaire ou à la
        sécheresse et à une vigueur choisie. La fleur de *vinifera* est autofertile : nul besoin
        de rangs de pollinisateurs.

  - id: vine-rootstock-nematode-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a grower choose a nematode-resistant rootstock even on a site already protected from phylloxera?"
      choices:
        - { text: "Nematodes damage roots, and some species spread viruses", correct: true }
        - { text: "Nematodes carry downy mildew spores from soil to leaves", correct: false }
        - { text: "Nematodes attack young grafts and stop the union callusing", correct: false }
        - { text: "Nematodes carry phylloxera eggs between nearby vineyards", correct: false }
      explanation: |
        Root-knot nematodes weaken the root system, and the dagger nematode *Xiphinema index*
        transmits fanleaf virus. Resistance is specific to each pest, so growers identify the
        nematodes present before choosing a rootstock.
    fr:
      question: "Pourquoi un vigneron peut-il choisir un porte-greffe résistant aux nématodes, même sur un site déjà protégé du phylloxéra ?"
      choices:
        - { text: "Les nématodes abîment les racines et certains transmettent des virus", correct: true }
        - { text: "Les nématodes portent les spores du mildiou du sol vers les feuilles", correct: false }
        - { text: "Les nématodes attaquent les jeunes greffes et empêchent la soudure", correct: false }
        - { text: "Les nématodes transportent les œufs du phylloxéra entre vignobles", correct: false }
      explanation: |
        Les nématodes à galles affaiblissent le système racinaire, et le nématode *Xiphinema index*
        transmet le court-noué. La résistance est propre à chaque ravageur : on identifie les
        nématodes présents avant de choisir le porte-greffe.

  - id: vine-rootstock-drought-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting, water]
    status: reviewed
    source_id: c03-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which rootstock choice best helps a vineyard cope with limited water availability?"
      choices:
        - { text: "110 R (*berlandieri* × *rupestris*)", correct: true }
        - { text: "Riparia Gloire de Montpellier", correct: false }
        - { text: "101-14 Mgt (*riparia* × *rupestris*)", correct: false }
        - { text: "SO4 (*berlandieri* × *riparia*)", correct: false }
      explanation: |
        110 R, like 140 Ru and 1103 P, comes from *berlandieri* × *rupestris*: it roots deeply and
        is widely planted on dry sites. Riparia Gloire and 101-14 (*riparia* × *rupestris*) are
        shallow-rooted and suit cool, moist, fertile soils. SO4 (*berlandieri* × *riparia*) is
        also less tolerant of drought and is better placed on cool, fairly moist soils.
    fr:
      question: "Quel choix de porte-greffe aide le mieux un vignoble à faire face au manque d’eau ?"
      choices:
        - { text: "110 R (*berlandieri* × *rupestris*)", correct: true }
        - { text: "Riparia Gloire de Montpellier", correct: false }
        - { text: "101-14 Mgt (*riparia* × *rupestris*)", correct: false }
        - { text: "SO4 (*berlandieri* × *riparia*)", correct: false }
      explanation: |
        Le 110 R, comme le 140 Ru ou le 1103 P, est issu de *berlandieri* × *rupestris* : il
        s’enracine profondément et il est très planté en terrain sec. Le Riparia Gloire et le
        101-14 (*riparia* × *rupestris*), à enracinement superficiel, conviennent plutôt aux sols
        frais, humides et fertiles. Le SO4 (*berlandieri* × *riparia*) résiste lui aussi moins à
        la sécheresse et se plaît davantage en sols frais.

  - id: vine-grafting-define-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does grafting create in a commercial grapevine?"
      choices:
        - { text: "A physical union of two genetically distinct plants", correct: true }
        - { text: "A new variety combining scion and rootstock genes", correct: false }
        - { text: "A vine whose rootstock slowly takes on the scion's genes", correct: false }
        - { text: "A cutting rooted directly in the vineyard on its own roots", correct: false }
      explanation: |
        Grafting joins the cambium of a fruiting scion to that of a rootstock so that sap can flow
        between them. Each part keeps its own genotype: shoots that sprout below the union are
        rootstock shoots and bear none of the scion's fruit.
    fr:
      question: "Que crée le greffage chez une vigne cultivée ?"
      choices:
        - { text: "L’union physique de deux plantes génétiquement distinctes", correct: true }
        - { text: "Un nouveau cépage qui combine les gènes du greffon et du porte-greffe", correct: false }
        - { text: "Un cep dont le porte-greffe acquiert peu à peu les gènes du greffon", correct: false }
        - { text: "Une bouture enracinée directement au vignoble, franche de pied", correct: false }
      explanation: |
        Le greffage soude le cambium d’un greffon à celui d’un porte-greffe pour que la sève
        circule de l’un à l’autre. Chacun garde son génotype : les pousses nées sous le point de
        greffe sont des gourmands du porte-greffe, qui ne portent pas les raisins du greffon.

  - id: vine-bench-graft-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which operation is characteristic of bench grafting in a grapevine nursery?"
      choices:
        - { text: "Joining dormant scion and rootstock cuttings indoors before planting", correct: true }
        - { text: "Replacing the variety on trunks already established in the vineyard", correct: false }
        - { text: "Budding a scion onto a rootstock already rooted in the vineyard", correct: false }
        - { text: "Rooting a scion cutting first, then adding a rootstock after harvest", correct: false }
      explanation: |
        Bench grafts are assembled by hand or machine, often with an omega cut, from dormant wood in
        winter. They are then callused and rooted in the nursery before being sold as young vines.
        Grafting onto vines already in the ground is field grafting.
    fr:
      question: "Quelle opération caractérise le greffage sur table en pépinière viticole ?"
      choices:
        - { text: "L’assemblage à l’abri de boutures dormantes de greffon et de porte-greffe", correct: true }
        - { text: "Le changement de cépage sur des troncs déjà installés au vignoble", correct: false }
        - { text: "L’écussonnage d’un greffon sur un porte-greffe déjà enraciné au vignoble", correct: false }
        - { text: "L’enracinement d’abord d’une bouture de greffon, puis l’ajout d’un porte-greffe", correct: false }
      explanation: |
        La greffe sur table se fait à la main ou à la machine, souvent en oméga, sur du bois dormant
        en hiver. Les greffés passent ensuite en stratification puis en pépinière avant d’être
        vendus comme plants. Greffer des ceps déjà en place, c’est greffer sur place.

  - id: vine-bench-graft-how-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is a newly assembled bench graft held under warm, humid conditions before nursery planting?"
      choices:
        - { text: "To promote callusing at the union while preventing drying out", correct: true }
        - { text: "To harden the union against the cold it will face outdoors", correct: false }
        - { text: "To keep the buds dormant until the union has fully healed", correct: false }
        - { text: "To kill fungal spores on the cut surfaces before planting", correct: false }
      explanation: |
        Warmth, around 25–30 °C, speeds callus growth that bridges the cambium of scion and
        rootstock; humidity stops the cut wood drying out. Warmth also wakes the buds, and humid air
        does nothing to sterilise the cut surfaces.
    fr:
      question: "Pourquoi place-t-on une greffe sur table tout juste assemblée au chaud et à l’humidité avant de la mettre en pépinière ?"
      choices:
        - { text: "Pour favoriser la formation du cal tout en évitant le dessèchement", correct: true }
        - { text: "Pour endurcir la soudure contre le froid qu’elle subira dehors", correct: false }
        - { text: "Pour garder les bourgeons en dormance jusqu’à la soudure complète", correct: false }
        - { text: "Pour tuer les spores de champignons sur les plaies de coupe", correct: false }
      explanation: |
        Une chaleur de 25 à 30 °C accélère la formation du cal qui relie les cambiums du greffon et
        du porte-greffe ; l’humidité empêche le bois coupé de se dessécher. La chaleur réveille
        aussi les bourgeons, et l’air humide ne stérilise en rien les plaies de coupe.

  - id: vine-head-graft-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which method changes the scion variety while retaining an established vine's trunk and root system?"
      choices:
        - { text: "Head grafting or top-working", correct: true }
        - { text: "Bench grafting of dormant nursery cuttings", correct: false }
        - { text: "Mass selection within the existing variety", correct: false }
        - { text: "Propagation of own-rooted scion cuttings", correct: false }
      explanation: |
        The vine is cut back and buds or scion wood of the new variety are inserted on the retained
        trunk. California and Chile used it widely to swap varieties with market demand without
        losing a mature root system.
    fr:
      question: "Quelle méthode change le cépage du greffon tout en conservant le tronc et les racines d’un cep installé ?"
      choices:
        - { text: "Le surgreffage", correct: true }
        - { text: "Le greffage sur table de boutures dormantes", correct: false }
        - { text: "La sélection massale au sein du cépage en place", correct: false }
        - { text: "La multiplication de boutures franches de pied", correct: false }
      explanation: |
        On rabat le cep et on insère sur le tronc conservé des bourgeons ou du bois du nouveau
        cépage. La Californie et le Chili l’ont beaucoup pratiqué pour suivre la demande sans
        sacrifier un système racinaire adulte.

  - id: vine-head-graft-when-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which situation is the best candidate for head grafting rather than complete replanting?"
      choices:
        - { text: "The vines are healthy, but a different variety is wanted", correct: true }
        - { text: "The rootstock is poorly suited to the soil and its pH", correct: false }
        - { text: "The trunks are badly affected by a trunk disease", correct: false }
        - { text: "The block needs a new row spacing and trellis", correct: false }
      explanation: |
        Head grafting only changes what grows above the graft. A wrong rootstock, diseased permanent
        wood or an unsuitable vineyard layout all remain after the operation, so those problems call
        for replanting.
    fr:
      question: "Dans quelle situation le surgreffage est-il préférable à une replantation complète ?"
      choices:
        - { text: "Les ceps sont sains, mais on veut un autre cépage", correct: true }
        - { text: "Le porte-greffe est mal adapté au sol et à son pH", correct: false }
        - { text: "Les troncs sont gravement atteints d’une maladie du bois", correct: false }
        - { text: "La parcelle doit changer d’écartement et de palissage", correct: false }
      explanation: |
        Le surgreffage ne change que ce qui pousse au-dessus de la greffe. Un porte-greffe mal
        choisi, un vieux bois malade ou une plantation mal conçue restent en place après
        l’opération : ces cas appellent une replantation.

  - id: vine-head-graft-how-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sequence correctly describes head grafting an established vine to a new variety?"
      choices:
        - { text: "Cut back the canopy, graft the new variety onto the trunk, then train its shoots", correct: true }
        - { text: "Lift the vine, graft the new variety onto its roots in the nursery, then replant", correct: false }
        - { text: "Plant cuttings of the new variety between rows, then pull out the old vines", correct: false }
        - { text: "Cut the vine down to the roots, then train root suckers as the new variety", correct: false }
      explanation: |
        Buds (T-budding, chip budding) or cleft grafts are set on sound retained wood in spring.
        Suckers from below the graft are rootstock shoots, so they would not produce the new
        variety and must be removed.
    fr:
      question: "Quelle séquence décrit correctement le surgreffage d’un cep installé ?"
      choices:
        - { text: "Rabattre le cep, greffer le nouveau cépage sur le tronc, puis palisser ses pousses", correct: true }
        - { text: "Arracher le cep, greffer le nouveau cépage sur ses racines en pépinière, puis replanter", correct: false }
        - { text: "Planter des boutures du nouveau cépage dans l’interrang, puis arracher les vieux ceps", correct: false }
        - { text: "Recéper le cep au ras du sol, puis former les rejets comme nouveau cépage", correct: false }
      explanation: |
        On pose au printemps une greffe en écusson (en T ou à œil boisé) ou des greffes en fente sur du
        bois sain conservé. Les rejets nés sous la greffe sont des pousses du porte-greffe : ils ne
        donnent pas le nouveau cépage et doivent être supprimés.

  - id: vine-head-graft-advantages-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a grower head-graft an established vineyard instead of replanting it?"
      choices:
        - { text: "It keeps the mature roots, so the new variety crops sooner", correct: true }
        - { text: "It replaces an ill-adapted rootstock without uprooting", correct: false }
        - { text: "It clears trunk disease by renewing all the old wood", correct: false }
        - { text: "It allows a new row spacing without replanting", correct: false }
      explanation: |
        A head-grafted vine can give a commercial crop in the second season, against three or four
        years for a new planting, and it skips the cost of site preparation and young plants. The
        rootstock, trunk and spacing all stay as they were.
    fr:
      question: "Pourquoi un vigneron peut-il surgreffer une vigne en place plutôt que de la replanter ?"
      choices:
        - { text: "Il garde les racines adultes : le nouveau cépage produit plus vite", correct: true }
        - { text: "Il remplace un porte-greffe mal adapté sans arracher les ceps", correct: false }
        - { text: "Il élimine les maladies du bois en renouvelant le vieux bois", correct: false }
        - { text: "Il permet de changer l’écartement des rangs sans replanter", correct: false }
      explanation: |
        Un cep surgreffé peut donner une récolte commerciale dès la deuxième saison, contre trois
        ou quatre ans pour une plantation neuve, et évite le coût de la préparation du sol et des
        plants. Porte-greffe, tronc et écartement restent inchangés.

  - id: vine-graft-wax-001
    type: mcq
    deck: The Vine
    tags: [vine, grafting]
    status: reviewed
    source_id: c03-0052
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main purpose of applying grafting wax or a sealing compound around a fresh graft?"
      choices:
        - { text: "To keep the cut tissue from drying out while it calluses", correct: true }
        - { text: "To supply nutrients that feed the callus as it forms", correct: false }
        - { text: "To stop sap flow so the scion stays dormant until spring", correct: false }
        - { text: "To keep phylloxera away from the union until it heals", correct: false }
      explanation: |
        Until vascular links form, a fresh graft has no water supply across the union and dries out
        easily. Wax or tape keeps the surfaces moist; the actual join comes from good cambial
        contact and callus growth.
    fr:
      question: "À quoi sert principalement le mastic ou la cire appliqués autour d’une greffe fraîche ?"
      choices:
        - { text: "À protéger les plaies du dessèchement pendant la formation du cal", correct: true }
        - { text: "À apporter des éléments nutritifs qui nourrissent le cal", correct: false }
        - { text: "À bloquer la sève pour que le greffon dorme jusqu’au printemps", correct: false }
        - { text: "À tenir le phylloxéra à l’écart du point de greffe jusqu’à la soudure", correct: false }
      explanation: |
        Tant que les vaisseaux ne sont pas reliés, l’eau ne traverse pas la soudure et la greffe se
        dessèche vite. Cire ou ruban gardent les surfaces humides ; c’est le bon contact des
        cambiums et la formation du cal qui assurent la soudure.

  - id: vine-leaf-role-001
    type: mcq
    deck: The Vine
    tags: [vine, anatomy, physiology]
    status: reviewed
    source_id: c03-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the principal physiological role of grapevine leaves?"
      choices:
        - { text: "Photosynthesis, making sugars for growth and ripening", correct: true }
        - { text: "Storing carbohydrate reserves for next spring's budburst", correct: false }
        - { text: "Absorbing rain and dew through the leaf surface", correct: false }
        - { text: "Carrying water and minerals from roots to the fruit", correct: false }
      explanation: |
        Chlorophyll in exposed leaves captures light to make sugars that feed shoots, roots and
        berries. Winter reserves are stored in the trunk, arms and roots, not in the leaves that
        fall each autumn; water travels in the xylem of the wood.
    fr:
      question: "Quel est le rôle physiologique principal des feuilles de vigne ?"
      choices:
        - { text: "La photosynthèse, source des sucres de la pousse et de la maturation", correct: true }
        - { text: "Le stockage des réserves de glucides pour le débourrement suivant", correct: false }
        - { text: "L’absorption de la pluie et de la rosée par la surface des feuilles", correct: false }
        - { text: "Le transport de l’eau et des minéraux des racines vers les raisins", correct: false }
      explanation: |
        La chlorophylle des feuilles exposées capte la lumière pour fabriquer les sucres qui
        nourrissent rameaux, racines et baies. Les réserves d’hiver sont stockées dans le tronc, les
        bras et les racines, pas dans des feuilles qui tombent à l’automne ; l’eau circule dans le
        xylème du bois.

  - id: vine-photosynthesis-equation-001
    type: mcq
    deck: The Vine
    tags: [vine, physiology, photosynthesis]
    status: reviewed
    source_id: c03-0054
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which transformation summarises photosynthesis in a functioning grapevine leaf?"
      choices:
        - { text: "Light energy turns carbon dioxide and water into sugar and oxygen", correct: true }
        - { text: "Sugar and oxygen are broken down into carbon dioxide, water and energy", correct: false }
        - { text: "Light energy turns oxygen and water into sugar and carbon dioxide", correct: false }
        - { text: "Light energy turns carbon dioxide and nitrogen into sugar and water", correct: false }
      explanation: |
        The leaf takes in CO₂ through its stomata and water from the roots, and releases oxygen. The
        breakdown of sugar with oxygen is respiration, which runs day and night and speeds up in hot
        weather, burning some of the acid and sugar.
    fr:
      question: "Quelle transformation résume la photosynthèse dans une feuille de vigne active ?"
      choices:
        - { text: "L’énergie lumineuse transforme le gaz carbonique et l’eau en sucre et oxygène", correct: true }
        - { text: "Le sucre et l’oxygène sont dégradés en gaz carbonique, eau et énergie", correct: false }
        - { text: "L’énergie lumineuse transforme l’oxygène et l’eau en sucre et gaz carbonique", correct: false }
        - { text: "L’énergie lumineuse transforme le gaz carbonique et l’azote en sucre et eau", correct: false }
      explanation: |
        La feuille absorbe le CO₂ par ses stomates et l’eau venue des racines, et rejette de
        l’oxygène. La dégradation du sucre par l’oxygène, c’est la respiration : elle a lieu jour
        et nuit et s’accélère par forte chaleur, consommant une partie des acides et des sucres.

  - id: vine-tendril-role-001
    type: mcq
    deck: The Vine
    tags: [vine, anatomy]
    status: reviewed
    source_id: c03-0055
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do tendrils help a grapevine in its natural climbing habit?"
      choices:
        - { text: "They coil around supports and hold growing shoots in place", correct: true }
        - { text: "They carry sugars from the leaves towards the bunches", correct: false }
        - { text: "They open and close to regulate the canopy's water loss", correct: false }
        - { text: "They harden into the canes kept at winter pruning", correct: false }
      explanation: |
        A wild vine climbs trees towards the light. Tendrils grow opposite leaves, coil on contact
        and lignify once they grip; in a trained vineyard they wind around wires and can make
        winter pruning slower.
    fr:
      question: "Comment les vrilles aident-elles la vigne, plante grimpante à l’état naturel ?"
      choices:
        - { text: "Elles s’enroulent autour des supports et maintiennent les rameaux", correct: true }
        - { text: "Elles acheminent les sucres des feuilles vers les grappes", correct: false }
        - { text: "Elles s’ouvrent et se ferment pour réguler la transpiration", correct: false }
        - { text: "Elles s’aoûtent pour devenir les sarments gardés à la taille", correct: false }
      explanation: |
        À l’état sauvage, la vigne grimpe aux arbres pour gagner la lumière. Les vrilles poussent
        face aux feuilles, s’enroulent au contact et se lignifient une fois accrochées ; au vignoble,
        elles s’agrippent aux fils et peuvent ralentir la taille d’hiver.

  - id: vine-pruning-dormant-001
    type: mcq
    deck: The Vine
    tags: [vine, pruning, growth-cycle]
    status: reviewed
    source_id: c03-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When is the main structural pruning of a grapevine normally carried out in a temperate vineyard?"
      choices:
        - { text: "In winter, between leaf fall and budburst", correct: true }
        - { text: "In late spring, once shoots are 10–20 cm long", correct: false }
        - { text: "In early summer, just after flowering", correct: false }
        - { text: "In late summer, around véraison", correct: false }
      explanation: |
        Winter pruning chooses the canes or spurs, and so the bud numbers, for the next crop. The
        spring and summer jobs, such as shoot thinning, trimming and leaf removal, only adjust the
        canopy. Growers in frost-prone sites often prune late to delay budburst.
    fr:
      question: "Quand la taille principale de la vigne a-t-elle normalement lieu dans un vignoble tempéré ?"
      choices:
        - { text: "En hiver, entre la chute des feuilles et le débourrement", correct: true }
        - { text: "À la fin du printemps, quand les rameaux font 10 à 20 cm", correct: false }
        - { text: "Au début de l’été, juste après la floraison", correct: false }
        - { text: "À la fin de l’été, autour de la véraison", correct: false }
      explanation: |
        La taille d’hiver choisit les baguettes ou les coursons, donc le nombre d’yeux, de la
        récolte suivante. L’ébourgeonnage, le rognage et l’effeuillage du printemps et de l’été ne
        font qu’ajuster le feuillage. Dans les sites gélifs, on taille souvent tard pour retarder
        le débourrement.

  - id: vine-permanent-wood-001
    type: mcq
    deck: The Vine
    tags: [vine, anatomy, training]
    status: reviewed
    source_id: c03-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which structures normally make up a trained grapevine's permanent woody framework?"
      choices:
        - { text: "The trunk and, where used, arms or cordons", correct: true }
        - { text: "The current season's green shoots and flower clusters", correct: false }
        - { text: "The one-year-old fruiting canes and their buds", correct: false }
        - { text: "The suckers and water shoots growing from the trunk base", correct: false }
      explanation: |
        A Guyot vine keeps only a short trunk and replaces its fruiting cane each winter, whereas a
        cordon-trained vine keeps horizontal arms and is spur-pruned along them. Canes, spurs and
        green shoots are renewed every year.
    fr:
      question: "Quelles structures forment normalement la charpente permanente d’une vigne conduite ?"
      choices:
        - { text: "Le tronc et, selon la taille, les bras ou cordons", correct: true }
        - { text: "Les rameaux verts de l’année et leurs inflorescences", correct: false }
        - { text: "Les sarments d’un an porteurs de fruits et leurs yeux", correct: false }
        - { text: "Les gourmands et rejets qui poussent au pied du tronc", correct: false }
      explanation: |
        Une vigne en Guyot ne garde qu’un tronc court et renouvelle sa baguette chaque hiver, alors
        qu’un cordon conserve des bras horizontaux taillés en coursons. Baguettes, coursons et
        rameaux verts sont renouvelés chaque année.

  - id: vine-first-crop-001
    type: mcq
    deck: The Vine
    tags: [vine, establishment, yield]
    status: reviewed
    source_id: c03-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Under normal establishment, around which growing season is a newly planted grapevine's first commercial crop commonly expected?"
      choices:
        - { text: "The first growing season", correct: false }
        - { text: "The third growing season", correct: true }
        - { text: "The fifth growing season", correct: false }
        - { text: "The seventh growing season", correct: false }
      explanation: |
        Growers usually remove early clusters so a young vine can establish roots and its permanent
        framework. A light crop may be possible earlier on a vigorous site, but the third season is a
        common first-bearing benchmark rather than a legal or biological deadline.
    fr:
      question: "Dans des conditions d’installation normales, vers quelle saison de végétation attend-on en général la première récolte commerciale d’une jeune vigne ?"
      choices:
        - { text: "La première saison de végétation", correct: false }
        - { text: "La troisième saison de végétation", correct: true }
        - { text: "La cinquième saison de végétation", correct: false }
        - { text: "La septième saison de végétation", correct: false }
      explanation: |
        Les premières grappes sont souvent supprimées pour que la jeune vigne installe ses racines et
        sa charpente. Sur un site vigoureux, une petite récolte est parfois possible plus tôt : la
        troisième feuille est un repère courant, pas une limite légale ou biologique.

  - id: vine-training-purpose-001
    type: mcq
    deck: The Vine
    tags: [vine, training]
    status: reviewed
    source_id: c03-0059
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does a grapevine training system principally determine?"
      choices:
        - { text: "The spatial form and support of the vine's permanent framework and canopy", correct: true }
        - { text: "The number of buds retained on fruiting wood at each dormant pruning", correct: false }
        - { text: "The genetic identity of the scion cultivar and the chosen rootstock", correct: false }
        - { text: "The soil texture, nutrient supply and depth available to the roots", correct: false }
      explanation: |
        Training gives the vine its durable shape and positions new growth in space, often with a
        trellis. Pruning works within that framework to renew fruiting wood and regulate bud number;
        the two decisions are related but not synonymous.
    fr:
      question: "Que détermine avant tout le mode de conduite d’une vigne ?"
      choices:
        - { text: "La forme de la charpente permanente et de la végétation, et leur support", correct: true }
        - { text: "Le nombre d’yeux laissés sur les bois fructifères à chaque taille d’hiver", correct: false }
        - { text: "L’identité génétique du cépage greffé et du porte-greffe choisi", correct: false }
        - { text: "La texture, la richesse et la profondeur du sol exploré par les racines", correct: false }
      explanation: |
        La conduite donne à la vigne sa forme durable et place la nouvelle végétation dans l’espace,
        souvent sur un palissage. La taille agit à l’intérieur de cette charpente pour renouveler les
        bois fructifères et régler la charge en yeux : les deux choix sont liés, mais distincts.

  - id: vine-head-cordon-training-001
    type: mcq
    deck: The Vine
    tags: [vine, training]
    status: reviewed
    source_id: c03-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which contrast correctly distinguishes head training from cordon training?"
      choices:
        - { text: "Head: framework centred on the trunk top; cordon: permanent arms extend from it", correct: true }
        - { text: "Head: permanent arms run along the wire; cordon: the framework ends at the trunk top", correct: false }
        - { text: "Head: the trunk runs horizontally; cordon: permanent wood forms a vertical fan", correct: false }
        - { text: "Head: defined by a high trunk; cordon: defined by a low trunk", correct: false }
      explanation: |
        A head-trained vine has little permanent wood beyond the trunk and perhaps short arms. A
        cordon-trained vine carries one or more perennial horizontal arms. Either framework can be
        paired with different pruning and canopy arrangements where local conditions permit.
    fr:
      question: "Quelle opposition distingue correctement la conduite sur tête de la conduite en cordon ?"
      choices:
        - { text: "Tête : charpente regroupée en haut du tronc ; cordon : bras permanents qui en partent", correct: true }
        - { text: "Tête : bras permanents le long du fil ; cordon : charpente arrêtée en haut du tronc", correct: false }
        - { text: "Tête : tronc couché à l’horizontale ; cordon : bois permanent dressé en éventail", correct: false }
        - { text: "Tête : définie par un tronc haut ; cordon : défini par un tronc bas", correct: false }
      explanation: |
        Une vigne conduite sur tête garde peu de bois permanent au-delà du tronc, parfois quelques
        bras courts. Une vigne en cordon porte un ou plusieurs bras horizontaux pérennes. Chacune de
        ces charpentes peut s’associer à différents modes de taille et de palissage.

  - id: vine-cordon-large-framework-001
    type: mcq
    deck: The Vine
    tags: [vine, training, cordon]
    status: reviewed
    source_id: c03-0063
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A vigorous, widely spaced vine must fill a long section of trellis. Which training feature is most useful?"
      choices:
        - { text: "Permanent arms extend along the wires and spread fruiting positions widely", correct: true }
        - { text: "A compact head concentrates replacement canes around one point at the trunk top", correct: false }
        - { text: "A low goblet keeps several short arms close to the centre of the vine", correct: false }
        - { text: "Several upright trunks stop below the wire, with no horizontal permanent arms", correct: false }
      explanation: |
        One or more cordons provide a durable horizontal framework from which spurs and shoots can be
        spaced. This makes it possible to fill longer or divided canopies, provided the site supplies
        enough vigour and the trellis can support the structure.
    fr:
      question: "Une vigne vigoureuse et largement espacée doit occuper une grande longueur de palissage. Quel élément de conduite est le plus utile ?"
      choices:
        - { text: "Des bras permanents qui suivent les fils et répartissent les coursons sur la longueur", correct: true }
        - { text: "Une tête compacte qui regroupe les baguettes de remplacement en haut du tronc", correct: false }
        - { text: "Un gobelet bas qui garde plusieurs bras courts près du centre du cep", correct: false }
        - { text: "Plusieurs troncs dressés arrêtés sous le fil, sans bras horizontaux permanents", correct: false }
      explanation: |
        Un ou plusieurs cordons forment une charpente horizontale durable, sur laquelle on espace les
        coursons et les rameaux. On peut ainsi garnir un palissage long ou divisé, à condition que le
        site donne assez de vigueur et que les fils supportent la structure.

  - id: vine-pruning-purpose-001
    type: mcq
    deck: The Vine
    tags: [vine, pruning, balance]
    status: reviewed
    source_id: c03-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main purpose of dormant pruning in an established vineyard?"
      choices:
        - { text: "To select fruiting wood and bud number so crop and vegetative growth stay balanced", correct: true }
        - { text: "To fix the permanent shape and trunk height chosen when the vine is first trained", correct: false }
        - { text: "To position green shoots during the season so light and air penetrate the canopy", correct: false }
        - { text: "To remove immature bunches after véraison and reduce the crop close to harvest", correct: false }
      explanation: |
        Pruning renews fruiting wood, limits the number of growing points and helps maintain the
        intended vine size. Training establishes the longer-term framework; pruning manages the
        annual crop and canopy within it.
    fr:
      question: "Quel est le but principal de la taille d’hiver dans un vignoble en production ?"
      choices:
        - { text: "Choisir les bois fructifères et la charge en yeux pour équilibrer récolte et vigueur", correct: true }
        - { text: "Fixer la forme permanente et la hauteur de tronc choisies à la formation du cep", correct: false }
        - { text: "Placer les rameaux verts en saison pour faire entrer lumière et air dans le feuillage", correct: false }
        - { text: "Retirer des grappes vertes après la véraison pour réduire la récolte avant vendange", correct: false }
      explanation: |
        La taille renouvelle les bois fructifères, limite le nombre de points de croissance et
        maintient le cep à la taille voulue. La conduite fixe la charpente à long terme ; la taille
        règle chaque année la récolte et la végétation à l’intérieur de cette charpente.

  - id: vine-canopy-define-001
    type: mcq
    deck: The Vine
    tags: [vine, anatomy, canopy]
    status: reviewed
    source_id: c03-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In vineyard management, what does the grapevine canopy comprise?"
      choices:
        - { text: "The current season's shoots, leaves, tendrils and reproductive growth", correct: true }
        - { text: "The trunk, permanent cordons and roots retained through winter", correct: false }
        - { text: "The posts, wires and stakes that support the trained vine", correct: false }
        - { text: "The soil surface, cover crop and vegetation between the rows", correct: false }
      explanation: |
        The canopy is the vine's seasonally renewed, above-ground green growth, including the leaves
        that intercept light and the shoots that carry bunches. The permanent framework and the
        trellis support that canopy but are not themselves its green tissues.
    fr:
      question: "En conduite du vignoble, que recouvre le couvert végétal (la canopée) d’une vigne ?"
      choices:
        - { text: "Les rameaux, feuilles, vrilles et organes reproducteurs de l’année", correct: true }
        - { text: "Le tronc, les cordons permanents et les racines conservés l’hiver", correct: false }
        - { text: "Les piquets, fils et tuteurs qui soutiennent la vigne palissée", correct: false }
        - { text: "La surface du sol, l’enherbement et la végétation de l’inter-rang", correct: false }
      explanation: |
        La canopée est la végétation verte aérienne, renouvelée chaque saison : les feuilles qui
        captent la lumière et les rameaux qui portent les grappes. La charpente permanente et le
        palissage la soutiennent, mais n’en font pas partie.

  - id: vine-trellis-define-001
    type: mcq
    deck: The Vine
    tags: [vine, training, trellis]
    status: reviewed
    source_id: c03-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In vineyard terminology, what is a trellis?"
      choices:
        - { text: "The posts and wires that support and position the vine's wood and shoots", correct: true }
        - { text: "The permanent woody shape that sets where the trunk and cordons grow", correct: false }
        - { text: "The yearly choice of which buds and fruiting wood are kept at pruning", correct: false }
        - { text: "The row direction and vine spacing chosen when the vineyard is planted", correct: false }
      explanation: |
        A trellis is the physical support system used to hold vine structures and organise the
        canopy. The chosen training and pruning system determines how the vine is arranged on those
        posts and wires.
    fr:
      question: "En viticulture, que désigne le palissage (le treillage) ?"
      choices:
        - { text: "Les piquets et les fils qui soutiennent et placent les bois et les rameaux", correct: true }
        - { text: "La forme ligneuse permanente qui fixe la place du tronc et des cordons", correct: false }
        - { text: "Le choix annuel des yeux et des bois fructifères gardés à la taille", correct: false }
        - { text: "L’orientation des rangs et l’écartement choisis à la plantation", correct: false }
      explanation: |
        Le palissage est le support matériel qui tient la charpente et organise la végétation. Le
        mode de conduite et la taille décident ensuite de la façon dont la vigne s’installe sur ces
        piquets et ces fils.

  - id: vine-bush-site-001
    type: mcq
    deck: The Vine
    tags: [vine, training, bush-vine]
    status: reviewed
    source_id: c03-0067
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which site is most naturally suited to traditional low, free-standing bush vines?"
      choices:
        - { text: "A warm, dry, sunny site where moderate vigour keeps disease pressure low", correct: true }
        - { text: "A humid, fertile site where very vigorous shoots need a broad divided canopy", correct: false }
        - { text: "A frost-prone valley floor where buds need to sit well above the cold air", correct: false }
        - { text: "A cool, wet site where dense foliage must be held upright to dry quickly", correct: false }
      explanation: |
        Bush training is inexpensive and the low canopy can shade bunches in hot sunshine, but it is
        hard to mechanise and poorly suited to excessive vigour or humidity. Gobelet vines in the
        Southern Rhône and old bush vines in Barossa are classic examples.
    fr:
      question: "Quel site convient le mieux aux vignes basses en gobelet traditionnel, sans palissage ?"
      choices:
        - { text: "Un site chaud, sec et ensoleillé, où une vigueur modérée limite les maladies", correct: true }
        - { text: "Un site humide et fertile, où des rameaux très vigoureux exigent un rideau divisé", correct: false }
        - { text: "Un fond de vallée gélif, où les bourgeons doivent rester loin de l’air froid", correct: false }
        - { text: "Un site frais et humide, où le feuillage dense doit être relevé pour sécher vite", correct: false }
      explanation: |
        Le gobelet coûte peu, et sa végétation basse ombrage les grappes sous un soleil fort ; il se
        mécanise mal et supporte mal l’excès de vigueur ou d’humidité. Les gobelets de la vallée du
        Rhône méridionale et les vieilles vignes de la Barossa en sont des exemples classiques.

  - id: vine-density-dry-site-001
    type: mcq
    deck: The Vine
    tags: [vine, planting-density, water]
    status: reviewed
    source_id: c03-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can wider vine spacing be advantageous on a dry site with little or no irrigation?"
      choices:
        - { text: "Each vine can draw on a larger soil volume with less competition for water", correct: true }
        - { text: "Each vine grows a larger canopy, and a larger canopy lowers its water demand", correct: false }
        - { text: "Fewer roots per hectare raise the soil's capacity to store winter rainfall", correct: false }
        - { text: "Roots stay near the surface and catch light showers before they evaporate", correct: false }
      explanation: |
        Where water supply limits growth, fewer vines per hectare give each root system access to more
        soil water. A larger canopy actually transpires more, and the best spacing still depends on
        soil depth, vigour, machinery and yield goals.
    fr:
      question: "Pourquoi un écartement plus large entre les ceps peut-il être un atout sur un site sec, peu ou pas irrigué ?"
      choices:
        - { text: "Chaque cep exploite un plus grand volume de sol, avec moins de concurrence pour l’eau", correct: true }
        - { text: "Chaque cep développe un feuillage plus grand, ce qui réduit ses besoins en eau", correct: false }
        - { text: "Moins de racines par hectare augmentent la réserve en eau d’hiver du sol", correct: false }
        - { text: "Les racines restent en surface et captent les petites pluies avant l’évaporation", correct: false }
      explanation: |
        Quand l’eau limite la croissance, moins de ceps à l’hectare laissent à chaque système
        racinaire davantage d’eau du sol. Un feuillage plus grand transpire au contraire davantage ;
        le bon écartement dépend aussi de la profondeur du sol, de la vigueur et de la mécanisation.

  - id: vine-low-nutrients-001
    type: mcq
    deck: The Vine
    tags: [vine, nutrients, vigour]
    status: reviewed
    source_id: c03-0069
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "If mineral nutrients are genuinely limiting, what is the likely effect even when a vine has sufficient water?"
      choices:
        - { text: "Restricted shoot growth, a weaker canopy and potentially lower yield", correct: true }
        - { text: "Strong shoot growth, because water supply rather than nutrition sets vigour", correct: false }
        - { text: "Normal shoot growth but lower sugar, since nutrients act mainly on ripening", correct: false }
        - { text: "A smaller root system but a normal canopy, fed by reserves in the wood", correct: false }
      explanation: |
        Water and mineral nutrition are separate requirements. Vines can draw on stored reserves and
        tolerate modest fertility, but a true deficiency, especially of nitrogen, reduces growth and
        fruitfulness rather than leaving a vigorous canopy.
    fr:
      question: "Si les éléments minéraux manquent réellement, quel effet attendre chez une vigne qui dispose pourtant d’assez d’eau ?"
      choices:
        - { text: "Une pousse freinée, un feuillage plus faible et un rendement souvent moindre", correct: true }
        - { text: "Une pousse vigoureuse, car c’est l’eau et non la nutrition qui fixe la vigueur", correct: false }
        - { text: "Une pousse normale mais moins de sucre, les minéraux agissant surtout sur la maturation", correct: false }
        - { text: "Un système racinaire réduit mais un feuillage normal, nourri par les réserves du bois", correct: false }
      explanation: |
        L’eau et la nutrition minérale sont deux besoins distincts. La vigne puise dans ses réserves
        et s’accommode d’une fertilité modeste, mais une vraie carence, surtout en azote, réduit la
        croissance et la fertilité au lieu de laisser un feuillage vigoureux.

  - id: vine-bud-load-vigour-001
    type: mcq
    deck: The Vine
    tags: [vine, pruning, vigour]
    status: reviewed
    source_id: c03-0070
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On a well-watered, vigorous vine, what can result from retaining too few buds relative to its capacity at winter pruning?"
      choices:
        - { text: "The vine's resources are concentrated into fewer shoots, increasing their vigour", correct: true }
        - { text: "Each retained shoot becomes weaker because more reserves remain stored in the roots", correct: false }
        - { text: "Total leaf area falls in step with bud number, so the vine loses vigour", correct: false }
        - { text: "Crop load rises because the remaining shoots compensate by carrying more bunches", correct: false }
      explanation: |
        Severe pruning does not tame a vigorous vine: stored reserves and water are shared among fewer
        growing points, so individual shoots grow stronger. Retaining more buds can moderate shoot
        vigour, but an excessive bud load may overcrop or crowd the canopy.
    fr:
      question: "Sur une vigne vigoureuse et bien alimentée en eau, que peut provoquer une taille d’hiver qui laisse trop peu d’yeux au regard de son potentiel ?"
      choices:
        - { text: "Les ressources se concentrent sur moins de rameaux, qui gagnent en vigueur", correct: true }
        - { text: "Chaque rameau gardé s’affaiblit, car plus de réserves restent stockées dans les racines", correct: false }
        - { text: "La surface foliaire baisse en proportion des yeux, et la vigne perd de sa vigueur", correct: false }
        - { text: "La charge en raisins augmente, les rameaux restants portant davantage de grappes", correct: false }
      explanation: |
        Une taille sévère ne calme pas une vigne vigoureuse : réserves et eau se partagent entre
        moins de points de croissance, et chaque rameau pousse plus fort. Garder plus d’yeux modère
        la vigueur, mais une charge excessive risque la surproduction ou un feuillage entassé.

  - id: vine-yield-bud-estimate-001
    type: mcq
    deck: The Vine
    tags: [vine, yield, pruning]
    status: reviewed
    source_id: c03-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which input provides an early starting point for estimating a vine's potential crop after winter pruning?"
      choices:
        - { text: "The number of fruitful buds retained on its canes or spurs", correct: true }
        - { text: "The final berry weight recorded at the previous harvest", correct: false }
        - { text: "The sugar concentration expected on the next picking date", correct: false }
        - { text: "The canopy leaf area measured at the previous véraison", correct: false }
      explanation: |
        Retained buds indicate how many shoots may emerge, and fruitful shoots carry a broadly
        estimable number of bunches. A fuller forecast also needs bud fruitfulness, bud survival,
        fruit set and expected bunch weight.
    fr:
      question: "Après la taille d’hiver, quelle donnée offre un premier point de départ pour estimer la récolte potentielle d’une vigne ?"
      choices:
        - { text: "Le nombre d’yeux fertiles laissés sur les baguettes ou les coursons", correct: true }
        - { text: "Le poids final des baies relevé à la vendange précédente", correct: false }
        - { text: "La richesse en sucre attendue à la prochaine date de vendange", correct: false }
        - { text: "La surface foliaire mesurée à la véraison précédente", correct: false }
      explanation: |
        Les yeux conservés indiquent combien de rameaux peuvent sortir, et un rameau fertile porte un
        nombre de grappes assez prévisible. Une prévision complète tient aussi compte de la
        fertilité des yeux, de leur survie, de la nouaison et du poids des grappes.

  - id: vine-yield-estimate-risks-001
    type: mcq
    deck: The Vine
    tags: [vine, yield, hazards]
    status: reviewed
    source_id: c03-0073
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A grower forecasts yield from the buds counted at winter pruning. Which later factor most often makes the actual crop fall short?"
      choices:
        - { text: "Losses from frost, poor fruit set, pests or disease", correct: true }
        - { text: "A cool, late ripening season that delays harvest", correct: false }
        - { text: "A switch from spur to cane pruning that winter", correct: false }
        - { text: "Leaving fewer buds per vine than in earlier years", correct: false }
      explanation: |
        A bud count is only a starting point. Bud fruitfulness and position refine it, but weather and
        biological losses after pruning, including damaged shoots, failed fruit set and diseased fruit,
        can still reduce the number and weight of bunches that reach harvest. Bud number and pruning
        system are already in the count, and a late harvest delays the crop rather than removing bunches.
    fr:
      question: "Un vigneron estime sa récolte à partir des yeux comptés à la taille d’hiver. Quel facteur ultérieur fait le plus souvent baisser la récolte réelle ?"
      choices:
        - { text: "Pertes dues au gel, à la coulure, aux ravageurs ou aux maladies", correct: true }
        - { text: "Une maturation fraîche qui retarde la vendange", correct: false }
        - { text: "Le passage de la taille courte à la taille longue cet hiver-là", correct: false }
        - { text: "Moins d’yeux laissés par cep que les années précédentes", correct: false }
      explanation: |
        Le comptage des yeux n’est qu’un point de départ. La fertilité et la position des yeux
        l’affinent, mais après la taille, gel, coulure, ravageurs et maladies peuvent encore réduire le
        nombre et le poids des grappes qui arrivent à la vendange. Le nombre d’yeux et le mode de
        taille sont déjà dans le comptage, et une vendange tardive décale la récolte sans retirer de grappes.

  - id: vine-green-harvest-001
    type: mcq
    deck: The Vine
    tags: [vine, yield, green-harvest]
    status: reviewed
    source_id: c03-0074
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A grower removes selected unripe bunches around véraison to reduce crop load. What is this operation called?"
      choices:
        - { text: "Green harvesting", correct: true }
        - { text: "Shoot thinning", correct: false }
        - { text: "Leaf removal", correct: false }
        - { text: "Summer hedging", correct: false }
      explanation: |
        Green harvesting is a form of bunch thinning carried out before or around véraison. Shoot
        thinning happens much earlier, in spring, and hedging trims shoot tips rather than fruit;
        the benefit of removing crop depends on timing, vine balance and site.
    fr:
      question: "Un vigneron retire une partie des grappes encore vertes vers la véraison pour alléger la charge. Comment s’appelle cette opération ?"
      choices:
        - { text: "La vendange en vert", correct: true }
        - { text: "L’ébourgeonnage", correct: false }
        - { text: "L’effeuillage", correct: false }
        - { text: "Le rognage", correct: false }
      explanation: |
        La vendange en vert est un éclaircissage de grappes réalisé avant ou pendant la véraison.
        L’ébourgeonnage se fait bien plus tôt, au printemps, et le rognage coupe l’extrémité des
        rameaux, pas les grappes ; l’effet dépend du moment, de l’équilibre du cep et du site.

  - id: vine-leaf-damage-ripening-001
    type: mcq
    deck: The Vine
    tags: [vine, canopy, photosynthesis]
    status: reviewed
    source_id: c03-0076
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can extensive damage to functional grapevine leaves delay or limit fruit ripening?"
      choices:
        - { text: "Less active leaf area reduces photosynthesis and the sugar supply to berries", correct: true }
        - { text: "Lower transpiration is the main cause of slower sugar accumulation in the berries", correct: false }
        - { text: "The surviving leaves get more light, but the extra sugar goes to the roots", correct: false }
        - { text: "Leaf loss affects berry colour through shade but leaves sugar production unchanged", correct: false }
      explanation: |
        Healthy exposed leaves are the main source of assimilates used for berry ripening and reserve
        storage. The impact depends on severity and timing: a vine can compensate for limited damage,
        but major defoliation reduces its photosynthetic capacity.
    fr:
      question: "Pourquoi des dégâts importants sur les feuilles actives d’une vigne peuvent-ils retarder ou freiner la maturation ?"
      choices:
        - { text: "Moins de surface foliaire active réduit la photosynthèse et l’apport de sucre aux baies", correct: true }
        - { text: "La baisse de transpiration est la cause principale d’une accumulation de sucre plus lente", correct: false }
        - { text: "Les feuilles restantes reçoivent plus de lumière, mais le sucre en plus part aux racines", correct: false }
        - { text: "La perte de feuilles agit sur la couleur par l’ombre, sans toucher à la production de sucre", correct: false }
      explanation: |
        Les feuilles saines et exposées fournissent l’essentiel des sucres qui servent à la maturation
        et aux réserves. Tout dépend de l’intensité et du moment : la vigne compense des dégâts
        limités, mais une forte défoliation réduit sa capacité de photosynthèse.

  - id: vine-nematode-virus-vector-001
    type: mcq
    deck: The Vine
    tags: [vine, pests, nematodes, viruses]
    status: reviewed
    source_id: c03-0077
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides direct root damage, which further threat is linked to some dagger nematodes (Xiphinema) in vineyards?"
      choices:
        - { text: "Transmission of grapevine fanleaf virus while feeding on roots", correct: true }
        - { text: "Transmission of grapevine leafroll viruses between neighbouring canopies", correct: false }
        - { text: "Transmission of the bacterium responsible for Pierce's disease", correct: false }
        - { text: "Transmission of the phytoplasma responsible for flavescence dorée", correct: false }
      explanation: |
        Xiphinema index is important not only for feeding damage but also as the vector of grapevine
        fanleaf virus. Leafroll is spread mainly by mealybugs, Pierce's disease and flavescence dorée
        by sap-sucking leafhoppers; even small surviving nematode populations can infect replanted vines.
    fr:
      question: "Outre les dégâts directs sur les racines, quelle autre menace est liée à certains nématodes du genre Xiphinema ?"
      choices:
        - { text: "La transmission du virus du court-noué en se nourrissant sur les racines", correct: true }
        - { text: "La transmission des virus de l’enroulement d’une souche voisine à l’autre", correct: false }
        - { text: "La transmission de la bactérie responsable de la maladie de Pierce", correct: false }
        - { text: "La transmission du phytoplasme responsable de la flavescence dorée", correct: false }
      explanation: |
        Xiphinema index abîme les racines, mais il est surtout le vecteur du court-noué.
        L’enroulement est transmis surtout par des cochenilles, la maladie de Pierce et la
        flavescence dorée par des cicadelles ; quelques nématodes survivants suffisent à
        contaminer une replantation.

  - id: vine-nematode-management-001
    type: mcq
    deck: The Vine
    tags: [vine, pests, nematodes, rootstocks]
    status: reviewed
    source_id: c03-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which strategy best reduces nematode risk when establishing or replanting a vineyard?"
      choices:
        - { text: "Soil testing, certified plants and a rootstock resistant to the nematodes found", correct: true }
        - { text: "A vigorous scion whose strong shoot growth offsets damage to the roots", correct: false }
        - { text: "A fungicide drench after planting, keeping the existing susceptible rootstock", correct: false }
        - { text: "Replanting straight after grubbing up, with extra irrigation to offset root stress", correct: false }
      explanation: |
        Management is preventive and species-specific. Pre-plant sampling, certified material, a
        fallow or rotation, authorised soil treatment where allowed, and a resistant or tolerant
        rootstock all reduce risk; fungicides do not target nematodes.
    fr:
      question: "Quelle stratégie réduit le mieux le risque de nématodes à la plantation ou à la replantation d’une vigne ?"
      choices:
        - { text: "Analyse du sol, plants certifiés et porte-greffe résistant aux nématodes trouvés", correct: true }
        - { text: "Un greffon vigoureux, dont la forte pousse compense les dégâts aux racines", correct: false }
        - { text: "Un fongicide appliqué au sol après plantation, en gardant le porte-greffe sensible", correct: false }
        - { text: "Replanter juste après l’arrachage, en irriguant davantage pour compenser le stress", correct: false }
      explanation: |
        La lutte est préventive et dépend de l’espèce. Analyse avant plantation, plants certifiés,
        repos du sol ou rotation, traitement autorisé et porte-greffe résistant ou tolérant réduisent
        le risque ; un fongicide ne vise pas les nématodes.

  - id: vine-mildew-tissues-001
    type: mcq
    deck: The Vine
    tags: [vine, disease, mildew]
    status: reviewed
    source_id: c03-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grapevine tissues can powdery mildew and downy mildew infect during the growing season?"
      choices:
        - { text: "Green tissues: leaves, shoots, inflorescences and young berries", correct: true }
        - { text: "Mature trunk wood and deep roots rather than leaves or young berries", correct: false }
        - { text: "Berry skins after véraison but not shoots, leaves or inflorescences", correct: false }
        - { text: "Flowers during fruit set but not the vegetative parts of the canopy", correct: false }
      explanation: |
        Both diseases can attack a broad range of actively growing tissues. Their biology and weather
        requirements differ (downy mildew needs free water for infection, powdery mildew does not),
        but protecting the green canopy and young fruit is central to control.
    fr:
      question: "Quels organes de la vigne l’oïdium et le mildiou peuvent-ils infecter pendant la saison de végétation ?"
      choices:
        - { text: "Les organes verts : feuilles, rameaux, inflorescences et jeunes baies", correct: true }
        - { text: "Le vieux bois du tronc et les racines profondes, pas les feuilles ni les baies", correct: false }
        - { text: "La pellicule des baies après la véraison, pas les rameaux, feuilles ni inflorescences", correct: false }
        - { text: "Les fleurs pendant la nouaison, pas les parties végétatives du feuillage", correct: false }
      explanation: |
        Les deux maladies s’attaquent à tous les tissus en croissance active. Leur biologie diffère :
        le mildiou a besoin d’eau libre pour infecter, l’oïdium non. Mais dans les deux cas, la
        protection porte sur le feuillage vert et les jeunes grappes.

  - id: vine-botrytis-bunch-risk-001
    type: mcq
    deck: The Vine
    tags: [vine, disease, botrytis]
    status: reviewed
    source_id: c03-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination most increases the risk of damaging Botrytis grey rot close to harvest?"
      choices:
        - { text: "Tight ripe bunches, split skins and a long humid spell", correct: true }
        - { text: "Loose green bunches, sound skins and a long humid spell", correct: false }
        - { text: "Tight ripe bunches, sound skins and dry, breezy weather", correct: false }
        - { text: "Loose ripe bunches, an open fruit zone and a hot, dry spell", correct: false }
      explanation: |
        Botrytis can infect flowers and remain latent, but grey rot becomes especially damaging in
        ripe or nearly ripe bunches. Tight clusters and damaged skins favour entry and spread, while
        humidity and long wetness periods support infection and slow bunch drying.
    fr:
      question: "Quelle combinaison accroît le plus le risque de pourriture grise (Botrytis) dommageable à l’approche des vendanges ?"
      choices:
        - { text: "Grappes compactes et mûres, peaux éclatées et longue période humide", correct: true }
        - { text: "Grappes lâches encore vertes, peaux saines et longue période humide", correct: false }
        - { text: "Grappes compactes et mûres, peaux saines et temps sec et venté", correct: false }
        - { text: "Grappes lâches et mûres, zone fructifère aérée et période chaude et sèche", correct: false }
      explanation: |
        Le Botrytis peut infecter dès la floraison et rester latent, mais la pourriture grise fait le
        plus de dégâts sur des baies mûres ou presque. Grappes serrées et peaux blessées facilitent
        l’entrée et la propagation ; l’humidité et l’eau stagnante entretiennent l’infection.

  - id: vine-open-canopy-disease-001
    type: mcq
    deck: The Vine
    tags: [vine, canopy, disease]
    status: reviewed
    source_id: c03-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can an open, well-arranged canopy help reduce fungal disease pressure?"
      choices:
        - { text: "Faster drying through better light penetration and air movement", correct: true }
        - { text: "Higher berry sugar makes the ripe fruit resistant to fungal infection", correct: false }
        - { text: "Reduced leaf area lowers vine nitrogen enough to starve canopy pathogens", correct: false }
        - { text: "A wider fruiting zone forms a barrier that keeps spores off the bunches", correct: false }
      explanation: |
        Many infections are favoured by humidity or long periods of surface wetness. Shoot positioning,
        thinning and selective leaf removal can improve ventilation, drying and spray penetration,
        while excessive exposure may create sunburn risk in hot climates.
    fr:
      question: "Comment une végétation aérée et bien disposée aide-t-elle à réduire la pression des maladies fongiques ?"
      choices:
        - { text: "Elle sèche plus vite grâce à une meilleure pénétration de la lumière et de l’air", correct: true }
        - { text: "Le surcroît de sucre rend les baies mûres résistantes aux champignons", correct: false }
        - { text: "Moins de feuilles abaisse assez l’azote du cep pour affamer les pathogènes", correct: false }
        - { text: "Une zone fructifère plus large fait barrière et tient les spores loin des grappes", correct: false }
      explanation: |
        Beaucoup d’infections profitent de l’humidité ou de longues périodes de mouillage. Palissage,
        ébourgeonnage et effeuillage ciblé améliorent l’aération, le séchage et la pénétration des
        traitements ; en climat chaud, trop exposer les grappes risque l’échaudage.

  - id: vine-virus-no-field-cure-001
    type: mcq
    deck: The Vine
    tags: [vine, disease, viruses]
    status: reviewed
    source_id: c03-0082
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the practical implication when a vineyard vine is confirmed to have a damaging virus disease?"
      choices:
        - { text: "No field cure exists: prevention, vector control and removing infected vines", correct: true }
        - { text: "A routine fungicide programme clears the virus from the vine's vascular tissue", correct: false }
        - { text: "Heat treatment of the standing vine in summer clears the virus from its tissue", correct: false }
        - { text: "Winter pruning removes the infection because viruses stay in leaves and shoots", correct: false }
      explanation: |
        Viruses are systemic and cannot be cured in an established vine by normal vineyard sprays.
        Growers rely on tested propagation material, control of vectors where possible, diagnosis and
        roguing or replanting infected vines. Heat treatment and meristem culture are used only to
        clean propagation material in the nursery, never on planted vines.
    fr:
      question: "Que faire en pratique quand une vigne en place est atteinte d’une virose grave ?"
      choices:
        - { text: "Pas de traitement curatif : prévention, lutte antivecteurs, arrachage des ceps", correct: true }
        - { text: "Un programme fongicide classique élimine le virus des vaisseaux du cep", correct: false }
        - { text: "Une thermothérapie du cep en place pendant l’été élimine le virus de ses tissus", correct: false }
        - { text: "La taille d’hiver supprime l’infection, le virus restant dans feuilles et rameaux", correct: false }
      explanation: |
        Les virus envahissent toute la plante et aucun traitement au vignoble ne les élimine d’un cep
        installé. On s’appuie sur des plants testés, la lutte contre les vecteurs quand elle est
        possible, le diagnostic, puis l’arrachage ou la replantation des ceps atteints. Thermothérapie
        et culture de méristèmes servent seulement à assainir le matériel de multiplication en
        pépinière, jamais des ceps déjà plantés.

  - id: vine-budburst-hemisphere-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, budburst]
    status: reviewed
    source_id: c03-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which calendar pairing is broadly typical for grapevine budburst in temperate wine regions?"
      choices:
        - { text: "March–April in the Northern Hemisphere; September–October in the Southern Hemisphere", correct: true }
        - { text: "May–June in the Northern Hemisphere; November–December in the Southern Hemisphere", correct: false }
        - { text: "July–August in the Northern Hemisphere; January–February in the Southern Hemisphere", correct: false }
        - { text: "September–October in the Northern Hemisphere; March–April in the Southern Hemisphere", correct: false }
      explanation: |
        Budburst begins in early spring, roughly six months apart between hemispheres. Exact timing
        varies substantially with latitude, altitude, variety, site and vintage, so the month ranges
        are study landmarks rather than fixed deadlines.
    fr:
      question: "Dans les régions viticoles tempérées, quelles périodes correspondent en gros au débourrement de la vigne ?"
      choices:
        - { text: "Mars–avril dans l’hémisphère Nord ; septembre–octobre dans l’hémisphère Sud", correct: true }
        - { text: "Mai–juin dans l’hémisphère Nord ; novembre–décembre dans l’hémisphère Sud", correct: false }
        - { text: "Juillet–août dans l’hémisphère Nord ; janvier–février dans l’hémisphère Sud", correct: false }
        - { text: "Septembre–octobre dans l’hémisphère Nord ; mars–avril dans l’hémisphère Sud", correct: false }
      explanation: |
        Le débourrement ouvre le printemps de la vigne, à environ six mois d’écart entre les deux
        hémisphères. La date réelle varie beaucoup avec la latitude, l’altitude, le cépage, le site et
        le millésime : ces mois sont des repères, pas des échéances.

  - id: vine-flowering-hemisphere-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, flowering]
    status: reviewed
    source_id: c03-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which calendar pairing is broadly typical for grapevine flowering and fruit set in temperate wine regions?"
      choices:
        - { text: "May–June in the Northern Hemisphere; November–December in the Southern Hemisphere", correct: true }
        - { text: "March–April in the Northern Hemisphere; September–October in the Southern Hemisphere", correct: false }
        - { text: "July–September in the Northern Hemisphere; January–March in the Southern Hemisphere", correct: false }
        - { text: "November–December in the Northern Hemisphere; May–June in the Southern Hemisphere", correct: false }
      explanation: |
        Flowering normally follows budburst by several weeks in late spring or early summer. The
        six-month hemispheric offset is only approximate; temperature, cultivar and season can move
        the event earlier or later.
    fr:
      question: "Dans les régions viticoles tempérées, quelles périodes correspondent en gros à la floraison et à la nouaison ?"
      choices:
        - { text: "Mai–juin dans l’hémisphère Nord ; novembre–décembre dans l’hémisphère Sud", correct: true }
        - { text: "Mars–avril dans l’hémisphère Nord ; septembre–octobre dans l’hémisphère Sud", correct: false }
        - { text: "Juillet–septembre dans l’hémisphère Nord ; janvier–mars dans l’hémisphère Sud", correct: false }
        - { text: "Novembre–décembre dans l’hémisphère Nord ; mai–juin dans l’hémisphère Sud", correct: false }
      explanation: |
        La floraison suit le débourrement de plusieurs semaines, à la fin du printemps ou au début de
        l’été. Le décalage de six mois entre hémisphères reste approximatif : température, cépage et
        millésime avancent ou retardent l’événement.

  - id: vine-veraison-hemisphere-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, veraison]
    status: reviewed
    source_id: c03-0085
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which calendar pairing broadly covers véraison and berry ripening in temperate wine regions?"
      choices:
        - { text: "July–September in the Northern Hemisphere; January–March in the Southern Hemisphere", correct: true }
        - { text: "March–April in the Northern Hemisphere; September–October in the Southern Hemisphere", correct: false }
        - { text: "May–June in the Northern Hemisphere; November–December in the Southern Hemisphere", correct: false }
        - { text: "January–March in the Northern Hemisphere; July–September in the Southern Hemisphere", correct: false }
      explanation: |
        Véraison marks the transition into ripening and normally occurs in summer, followed by harvest
        later in the season. The three-month bands are broad study landmarks; variety, site, climate
        and vintage all change the actual dates.
    fr:
      question: "Dans les régions viticoles tempérées, quelles périodes couvrent en gros la véraison et la maturation des baies ?"
      choices:
        - { text: "Juillet–septembre dans l’hémisphère Nord ; janvier–mars dans l’hémisphère Sud", correct: true }
        - { text: "Mars–avril dans l’hémisphère Nord ; septembre–octobre dans l’hémisphère Sud", correct: false }
        - { text: "Mai–juin dans l’hémisphère Nord ; novembre–décembre dans l’hémisphère Sud", correct: false }
        - { text: "Janvier–mars dans l’hémisphère Nord ; juillet–septembre dans l’hémisphère Sud", correct: false }
      explanation: |
        La véraison marque l’entrée en maturation et tombe normalement en été, avant les vendanges.
        Ces fourchettes de trois mois sont des repères larges : cépage, site, climat et millésime
        déplacent les dates réelles.

  - id: vine-budburst-temperature-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, budburst, temperature]
    status: reviewed
    source_id: c03-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which base-temperature benchmark is commonly used when relating spring warmth to grapevine budburst and active growth?"
      choices:
        - { text: "About 10 °C", correct: true }
        - { text: "About 5 °C", correct: false }
        - { text: "About 15 °C", correct: false }
        - { text: "About 20 °C", correct: false }
      explanation: |
        About 10 °C is the base used in grapevine heat summations such as Winkler degree-days, not a
        universal switch for each bud. Cultivar, accumulated warmth, soil temperature, site and vine
        condition all influence when individual buds actually open.
    fr:
      question: "Quelle température de base sert couramment de repère pour relier la chaleur du printemps au débourrement et à la reprise de croissance de la vigne ?"
      choices:
        - { text: "Environ 10 °C", correct: true }
        - { text: "Environ 5 °C", correct: false }
        - { text: "Environ 15 °C", correct: false }
        - { text: "Environ 20 °C", correct: false }
      explanation: |
        Environ 10 °C est la base des sommes de températures de la vigne, comme les degrés-jours de
        Winkler ; ce n’est pas un interrupteur pour chaque bourgeon. Cépage, chaleur accumulée,
        température du sol, site et état du cep influencent le moment où les yeux s’ouvrent.

  - id: vine-budburst-protection-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, disease-management]
    status: reviewed
    source_id: c03-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do many vineyard disease-monitoring and protection programmes become active from budburst?"
      choices:
        - { text: "New susceptible green tissue begins to emerge and can require timely protection", correct: true }
        - { text: "Young leaves resist infection, so monitoring is better spent on the dormant wood", correct: false }
        - { text: "Budburst treatments clear systemic viruses before they reach the new shoots", correct: false }
        - { text: "Spores overwinter only on open buds, so they can be cleared in a single pass", correct: false }
      explanation: |
        Budburst starts a period of rapid production of young leaves and shoots that may be vulnerable
        to pests and diseases. Actual spray timing depends on pathogen, weather, local risk, label and
        integrated-pest-management advice; budburst does not mandate one universal treatment.
    fr:
      question: "Pourquoi beaucoup de programmes de surveillance et de protection sanitaire du vignoble démarrent-ils au débourrement ?"
      choices:
        - { text: "De nouveaux tissus verts sensibles apparaissent et peuvent demander une protection", correct: true }
        - { text: "Les jeunes feuilles résistent aux infections : mieux vaut surveiller le vieux bois", correct: false }
        - { text: "Un traitement au débourrement élimine les virus avant qu’ils n’atteignent les rameaux", correct: false }
        - { text: "Les spores hivernent sur les bourgeons ouverts et s’éliminent en un seul passage", correct: false }
      explanation: |
        Le débourrement lance une production rapide de jeunes feuilles et de rameaux exposés aux
        ravageurs et aux maladies. Le calendrier réel des traitements dépend du pathogène, de la
        météo, du risque local et des conseils de protection intégrée ; il n’y a pas de traitement
        unique imposé.

  - id: vine-early-growth-energy-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, carbohydrates]
    status: reviewed
    source_id: c03-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is rapid shoot growth supplied with energy between budburst and the development of a functional leaf canopy?"
      choices:
        - { text: "Stored reserves dominate first; expanding leaves increasingly supply sugars", correct: true }
        - { text: "Green stems photosynthesise enough to fuel shoot growth until flowering", correct: false }
        - { text: "Roots manufacture sugars from mineral nutrients until flowering is complete", correct: false }
        - { text: "Developing inflorescences export stored sugars to feed the shoot tips", correct: false }
      explanation: |
        Early shoots initially depend strongly on reserves stored in perennial wood and roots. As leaf
        area expands and becomes photosynthetically active, current-season assimilation takes over a
        growing share of the energy supply.
    fr:
      question: "Entre le débourrement et la mise en place d’un feuillage fonctionnel, d’où vient l’énergie de la pousse rapide des rameaux ?"
      choices:
        - { text: "D’abord des réserves, puis de plus en plus des sucres des nouvelles feuilles", correct: true }
        - { text: "De la photosynthèse des tiges vertes, suffisante jusqu’à la floraison", correct: false }
        - { text: "De sucres fabriqués par les racines à partir des minéraux, jusqu’à la floraison", correct: false }
        - { text: "Des inflorescences, qui exportent leurs sucres vers l’extrémité des rameaux", correct: false }
      explanation: |
        Les jeunes rameaux vivent d’abord largement sur les réserves du vieux bois et des racines. À
        mesure que la surface foliaire s’étend et devient active, la photosynthèse de l’année prend
        une part croissante de l’approvisionnement.

  - id: vine-flowering-weather-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, flowering, climate]
    status: reviewed
    source_id: c03-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which weather pattern is most favourable for successful grapevine flowering and fruit set?"
      choices:
        - { text: "Warm, dry, settled weather with little wind or rain", correct: true }
        - { text: "Mild, humid, still weather that keeps the flowers moist", correct: false }
        - { text: "Cool, overcast weather that slows and prolongs flowering", correct: false }
        - { text: "Showery, breezy weather that carries pollen between vines", correct: false }
      explanation: |
        Grapevines usually self-pollinate, so neither wind nor insects need to carry pollen. Cold,
        rain, humidity on the flowers or strong wind interfere with flowering and fertilisation,
        causing poor set such as coulure or millerandage.
    fr:
      question: "Quel temps favorise le plus une bonne floraison et une bonne nouaison de la vigne ?"
      choices:
        - { text: "Un temps chaud, sec et stable, avec peu de vent et de pluie", correct: true }
        - { text: "Un temps doux, humide et calme, qui garde les fleurs humides", correct: false }
        - { text: "Un temps frais et couvert, qui ralentit et allonge la floraison", correct: false }
        - { text: "Un temps d’averses et de brise, qui porte le pollen d’un cep à l’autre", correct: false }
      explanation: |
        La vigne s’autopollinise le plus souvent : ni le vent ni les insectes n’ont à transporter le
        pollen. Le froid, la pluie, l’humidité sur les fleurs ou un vent fort perturbent la floraison
        et la fécondation, d’où coulure ou millerandage.

  - id: vine-fruit-set-define-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, fruit-set]
    status: reviewed
    source_id: c03-0092
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What happens during fruit set in a grapevine inflorescence?"
      choices:
        - { text: "Fertilised flowers start to develop into berries; others may drop", correct: true }
        - { text: "Green berries soften, accumulate colour and enter the main ripening phase", correct: false }
        - { text: "Dormant buds open and produce the shoots that will carry inflorescences", correct: false }
        - { text: "Mature berries detach easily from their pedicels and are ready for harvest", correct: false }
      explanation: |
        Fruit set follows flowering and fertilisation. Not every flower becomes a berry: some drop,
        and poor weather or vine imbalance can reduce the proportion retained and affect final bunch
        size.
    fr:
      question: "Que se passe-t-il lors de la nouaison d’une inflorescence de vigne ?"
      choices:
        - { text: "Les fleurs fécondées commencent à devenir des baies, d’autres peuvent tomber", correct: true }
        - { text: "Les baies vertes ramollissent, se colorent et entrent en pleine maturation", correct: false }
        - { text: "Les bourgeons dormants s’ouvrent et donnent les rameaux qui porteront les fleurs", correct: false }
        - { text: "Les baies mûres se détachent facilement du pédicelle et sont prêtes à vendanger", correct: false }
      explanation: |
        La nouaison suit la floraison et la fécondation. Toutes les fleurs ne donnent pas une baie :
        certaines tombent, et un temps défavorable ou un cep déséquilibré réduisent la proportion
        retenue, donc la taille finale des grappes.

  - id: vine-fruitset-veraison-interval-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, berry-development]
    status: reviewed
    source_id: c03-0093
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "As a broad study benchmark, how long does the green berry-growth period from fruit set to véraison often last?"
      choices:
        - { text: "Roughly six to eight weeks", correct: true }
        - { text: "Roughly two weeks", correct: false }
        - { text: "Roughly three to four months", correct: false }
        - { text: "Roughly five to six months", correct: false }
      explanation: |
        Six to eight weeks is a useful approximation for the pre-véraison growth period, not a fixed
        biological deadline. Temperature, variety, water status and the way stages are recorded can
        shorten or extend the interval.
    fr:
      question: "Comme repère général, combien de temps dure souvent la croissance des baies vertes, de la nouaison à la véraison ?"
      choices:
        - { text: "Environ six à huit semaines", correct: true }
        - { text: "Environ deux semaines", correct: false }
        - { text: "Environ trois à quatre mois", correct: false }
        - { text: "Environ cinq à six mois", correct: false }
      explanation: |
        Six à huit semaines est une bonne approximation de la phase herbacée, pas une échéance
        biologique fixe. La température, le cépage, l’alimentation en eau et la façon de noter les
        stades peuvent raccourcir ou allonger cet intervalle.

  - id: vine-veraison-define-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, veraison]
    status: reviewed
    source_id: c03-0094
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which change best defines véraison in grape development?"
      choices:
        - { text: "The onset of ripening, marked by berry softening and colour or translucency change", correct: true }
        - { text: "The completion of flowering, marked by the first fertilised flowers becoming berries", correct: false }
        - { text: "The start of dormancy, marked by leaf fall and shoot lignification", correct: false }
        - { text: "The achievement of harvest maturity, marked by a target sugar concentration", correct: false }
      explanation: |
        At véraison, berries soften and coloured cultivars begin accumulating red or blue pigments;
        white berries become more translucent. It begins the ripening phase but does not mean the
        grapes are ready to pick.
    fr:
      question: "Quel changement définit le mieux la véraison dans le développement du raisin ?"
      choices:
        - { text: "Le début de la maturation : la baie ramollit, se colore ou devient translucide", correct: true }
        - { text: "La fin de la floraison : les premières fleurs fécondées deviennent des baies", correct: false }
        - { text: "L’entrée en dormance : chute des feuilles et aoûtement des rameaux", correct: false }
        - { text: "La maturité de vendange : la baie atteint la richesse en sucre visée", correct: false }
      explanation: |
        À la véraison, les baies ramollissent ; les cépages noirs accumulent leurs pigments rouges ou
        bleus, les blancs deviennent plus translucides. La maturation commence, mais le raisin est
        encore loin d’être bon à vendanger.

  - id: vine-ripening-changes-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, ripening]
    status: reviewed
    source_id: c03-0095
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which set of changes generally occurs in grapes from véraison towards harvest?"
      choices:
        - { text: "Berries soften, sugar rises, acidity falls and colour develops", correct: true }
        - { text: "Berries soften, sugar holds steady, acidity rises and colour develops", correct: false }
        - { text: "Berries firm up, sugar rises, acidity rises and colour develops", correct: false }
        - { text: "Berries firm up, sugar holds steady, acidity falls and colour develops", correct: false }
      explanation: |
        Ripening shifts the berry from a hard, acidic, green stage towards a softer, sweeter and more
        flavourful fruit, mainly through falling malic acid. Berry size may later plateau or fall
        through dehydration, and aroma and phenolic changes differ with cultivar and conditions.
    fr:
      question: "Quels changements observe-t-on en général dans le raisin entre la véraison et la vendange ?"
      choices:
        - { text: "La baie ramollit, le sucre monte, l’acidité baisse et la couleur se forme", correct: true }
        - { text: "La baie ramollit, le sucre stagne, l’acidité monte et la couleur se forme", correct: false }
        - { text: "La baie durcit, le sucre monte, l’acidité monte et la couleur se forme", correct: false }
        - { text: "La baie durcit, le sucre stagne, l’acidité baisse et la couleur se forme", correct: false }
      explanation: |
        La maturation fait passer la baie d’un stade dur, acide et vert à un fruit plus tendre, plus
        sucré et plus aromatique, surtout par la baisse de l’acide malique. La baie peut ensuite
        stagner ou perdre du volume en se déshydratant ; arômes et composés phénoliques varient selon
        le cépage et les conditions.

  - id: vine-dormancy-transition-001
    type: mcq
    deck: The Vine
    tags: [vine, growth-cycle, dormancy]
    status: reviewed
    source_id: c03-0096
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination accompanies a grapevine's transition into winter dormancy?"
      choices:
        - { text: "Shoots lignify, leaves fall and reserves build up in perennial wood and roots", correct: true }
        - { text: "Buds burst, shoots elongate and stored carbohydrates are rapidly mobilised", correct: false }
        - { text: "Flowers open, fertilisation occurs and unfertilised flowers are shed", correct: false }
        - { text: "Berries soften, sugar rises and pigments accumulate in the skins", correct: false }
      explanation: |
        As growth ends, shoots mature into canes and mobile nutrients and carbohydrates are stored in
        roots, trunk and other perennial wood. Leaf fall then leaves the vine dormant until adequate
        winter chilling and spring warmth permit renewed growth.
    fr:
      question: "Qu’est-ce qui accompagne l’entrée de la vigne en dormance hivernale ?"
      choices:
        - { text: "Les rameaux s’aoûtent, les feuilles tombent et les réserves s’accumulent dans le bois", correct: true }
        - { text: "Les bourgeons éclatent, les rameaux s’allongent et les réserves sont mobilisées", correct: false }
        - { text: "Les fleurs s’ouvrent, la fécondation a lieu et les fleurs non fécondées tombent", correct: false }
        - { text: "Les baies ramollissent, le sucre monte et les pigments s’accumulent dans la peau", correct: false }
      explanation: |
        En fin de croissance, les rameaux deviennent des sarments, et nutriments et sucres sont mis
        en réserve dans les racines, le tronc et le vieux bois. La chute des feuilles laisse ensuite
        la vigne en repos jusqu’à ce que le froid hivernal puis la chaleur du printemps relancent la
        pousse.

  - id: vine-machine-harvest-mechanism-001
    type: mcq
    deck: The Vine
    tags: [vine, harvest, mechanisation]
    status: reviewed
    source_id: c03-0102
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sequence best describes a conventional over-row machine harvesting wine grapes?"
      choices:
        - { text: "Beaters shake the fruiting zone; loosened berries fall onto collectors and go to a bin", correct: true }
        - { text: "Rotating blades cut whole bunches at their stems and lower them onto a sorting belt", correct: false }
        - { text: "Suction heads draw individual berries off the bunches straight into an onboard tank", correct: false }
        - { text: "Pinch belts strip bunches from the canes and lift them onto a hopper conveyor", correct: false }
      explanation: |
        The harvester straddles the row and uses flexible rods or beaters to shake ripe berries free.
        Catch plates and conveyors collect them; most stalks remain on the vine, although leaves,
        petioles and other matter can enter the load unless sorting systems remove it.
    fr:
      question: "Quelle séquence décrit le mieux le travail d’une machine à vendanger enjambeuse classique ?"
      choices:
        - { text: "Des secoueurs agitent la zone des grappes ; les baies tombent sur des écailles puis en benne", correct: true }
        - { text: "Des lames rotatives coupent les grappes entières au pédoncule et les posent sur un tapis de tri", correct: false }
        - { text: "Des têtes aspirantes arrachent les baies une à une des grappes et les envoient en cuve embarquée", correct: false }
        - { text: "Des courroies pincent les grappes, les arrachent et les montent vers une trémie", correct: false }
      explanation: |
        La machine enjambe le rang et ses baguettes souples secouent la végétation pour détacher les
        baies mûres. Écailles et convoyeurs les récupèrent ; la plupart des rafles restent sur le cep,
        mais feuilles et débris peuvent passer si aucun tri ne les retire.
