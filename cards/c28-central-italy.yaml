    status: reviewed
    source_id: c28-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Between which cities do Chianti’s Apennine foothills sit?
      choices:
        - { text: "Rome, Naples and Bari", correct: false }
        - { text: "Pisa, Florence and Siena", correct: true }
        - { text: "Venice, Trieste and Udine", correct: false }
        - { text: "Turin, Alba and Asti", correct: false }
      explanation: |
        **Pisa, Florence and Siena.** The historic Chianti triangle.

  - id: citaly-chianti-seven-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many named sub-zones sit under Chianti DOCG?
      choices:
        - { text: "Two, like Bordeaux banks", correct: false }
        - { text: "Seven", correct: true }
        - { text: "One only", correct: false }
        - { text: "A hundred climats", correct: false }
      explanation: |
        **Seven** (Rufina, Colli Senesi, and the others). Chianti
        Classico is a separate DOCG, not one of the seven.

  - id: citaly-chianti-grape-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany, grapes]
    status: reviewed
    source_id: c28-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which variety has to be the majority grape in Chianti?
      choices:
        - { text: "Cabernet Sauvignon only", correct: false }
        - { text: "Sangiovese", correct: true }
        - { text: "Nebbiolo", correct: false }
        - { text: "Corvina", correct: false }
      explanation: |
        **Sangiovese.** Blending partners are allowed; it still leads.

  - id: citaly-chianti-blend-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Is a typical Chianti a single-variety wine or a blend?
      choices:
        - { text: "Always 100% Cabernet", correct: false }
        - { text: "Often a blend", correct: true }
        - { text: "Blending is illegal", correct: false }
        - { text: "Only white grapes may be blended", correct: false }
      explanation: |
        **Often a blend.** Canaiolo, Colorino, and sometimes a little
        Cabernet or Merlot sit beside Sangiovese.

  - id: citaly-chianti-docg-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What name do high-volume Chiantis from the wide zone usually wear?
      choices:
        - { text: "Brunello di Montalcino DOCG", correct: false }
        - { text: "Chianti DOCG", correct: true }
        - { text: "Barolo DOCG", correct: false }
        - { text: "Only IGT Sicilia", correct: false }
      explanation: |
        **Chianti DOCG.** The generic wrapper, not a sub-zone word.

  - id: citaly-chianti-subzone-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can a tighter Chianti name the map more precisely?
      choices:
        - { text: "It must drop any place name", correct: false }
        - { text: "By adding the sub-zone if the fruit is from there", correct: true }
        - { text: "By writing Premier Cru", correct: false }
        - { text: "Only as Vin de France", correct: false }
      explanation: |
        **Add the sub-zone** — Chianti Rufina, Chianti Colli Senesi.

  - id: citaly-chianti-best-sub-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides the Classico DOCG, which two Chianti names are the usual quality picks?
      choices:
        - { text: "Barolo and Barbaresco", correct: false }
        - { text: "Chianti Rufina and Chianti Colli Senesi", correct: true }
        - { text: "Soave and Valpolicella", correct: false }
        - { text: "Etna and Vittoria", correct: false }
      explanation: |
        **Rufina and Colli Senesi.** Rufina is the cooler, higher
        one; Colli Senesi is the large Siena-side zone. Classico is
        not a Chianti sub-zone.

  - id: citaly-classico-not-sub-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Chianti Classico sit relative to Chianti’s seven sub-zones?
      choices:
        - { text: "It is one of the seven", correct: false }
        - { text: "It is a separate DOCG, not a Chianti sub-zone", correct: true }
        - { text: "It is only an IGT", correct: false }
        - { text: "It is in Piedmont", correct: false }
      explanation: |
        **A separate DOCG.** The black rooster zone is not “Chianti
        + Classico” as a sub-zone.

  - id: citaly-classico-high-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Do Chianti Classico vines sit higher or lower than generic Chianti?
      choices:
        - { text: "Lower, on a coastal flat", correct: false }
        - { text: "At higher altitude", correct: true }
        - { text: "Below sea level", correct: false }
        - { text: "There is no height difference", correct: false }
      explanation: |
        **Higher.** That is why Classico stays fresher.

  - id: citaly-classico-effect-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Chianti Classico’s extra height do in the glass?
      choices:
        - { text: "It bakes all the acid out", correct: false }
        - { text: "More acidity and more herbal aromas", correct: true }
        - { text: "It forces a sweet wine", correct: false }
        - { text: "It bans Sangiovese", correct: false }
      explanation: |
        **More acid, more herbs.** The hill signature versus a warm
        Colli Senesi bottle.

  - id: citaly-classico-12-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How long must Chianti Classico age before release?
      choices:
        - { text: "No wait at all", correct: false }
        - { text: "12 months", correct: true }
        - { text: "Five years, like Brunello", correct: false }
        - { text: "Ten years in new oak", correct: false }
      explanation: |
        **12 months.** Riserva and Gran Selezione wait longer.

  - id: citaly-classico-riserva-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is Chianti Classico Riserva’s legal ageing?
      choices:
        - { text: "Six weeks in steel", correct: false }
        - { text: "24 months, including at least 3 months in bottle", correct: true }
        - { text: "No bottle time is allowed", correct: false }
        - { text: "Ten years, all in barrique", correct: false }
      explanation: |
        **24 months, ≥3 in bottle.** Gran Selezione sits above that.

  - id: citaly-gran-selezione-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which word sits above Riserva on a Chianti Classico label?
      choices:
        - { text: "IGT only", correct: false }
        - { text: "Gran Selezione", correct: true }
        - { text: "Premier Cru", correct: false }
        - { text: "Cru Bourgeois", correct: false }
      explanation: |
        **Gran Selezione.** Above Riserva, from 2014.

  - id: citaly-gs-rules-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What extra bars sit on Chianti Classico Gran Selezione?
      choices:
        - { text: "Any fruit from anywhere in Italy", correct: false }
        - { text: "Estate-grown fruit and six months more ageing than Riserva", correct: true }
        - { text: "No ageing at all", correct: false }
        - { text: "It must be white", correct: false }
      explanation: |
        **Estate fruit, six months more than Riserva** (30 months).
        UGAs are a later map extra.

  - id: citaly-gs-oak-law-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Gran Selezione law say about oak?
      choices:
        - { text: "100% new barrique is mandatory", correct: false }
        - { text: "Nothing — oak is the producer’s choice", correct: true }
        - { text: "Oak is banned", correct: false }
        - { text: "Only chestnut is legal", correct: false }
      explanation: |
        **No oak rule.** Ageing time is fixed; the vessel is not.

  - id: citaly-gs-oak-practice-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In practice, do Gran Selezione wines see oak?
      choices:
        - { text: "Almost never", correct: false }
        - { text: "The vast majority spend at least part of their time in oak", correct: true }
        - { text: "Oak is illegal on them", correct: false }
        - { text: "They are all sparkling", correct: false }
      explanation: |
        **Most see some oak.** The law is silent; the cellars are
        not.

  - id: citaly-south-tuscany-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0027
    review:
      fact_check: pass
