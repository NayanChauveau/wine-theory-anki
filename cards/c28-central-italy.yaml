cards:
  - id: citaly-apennines-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy]
    status: reviewed
    source_id: c28-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which mountain chain forms the geographic spine of Central Italy?"
      choices:
        - { text: "The Alps", correct: false }
        - { text: "The Apennines", correct: true }
        - { text: "The Pyrenees", correct: false }
        - { text: "The Dolomites alone", correct: false }
      explanation: |
        The Apennines run along the peninsula and create elevation, varied exposures and a climatic
        divide between the Tyrrhenian and Adriatic sides.
    fr:
      question: "Quelle chaîne de montagnes forme l’épine dorsale géographique de l’Italie centrale ?"
      choices:
        - { text: "Les Alpes", correct: false }
        - { text: "Les Apennins", correct: true }
        - { text: "Les Pyrénées", correct: false }
        - { text: "Les seules Dolomites", correct: false }
      explanation: |
        Les Apennins parcourent la péninsule et créent de l’altitude, des expositions variées et une
        séparation climatique entre les versants tyrrhénien et adriatique.

  - id: citaly-plant-hills-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy]
    status: reviewed
    source_id: c28-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where are many of Central Italy’s quality vineyards planted?"
      choices:
        - { text: "On waterlogged coastal flats", correct: false }
        - { text: "On Apennine hills, foothills and valleys", correct: true }
        - { text: "Only on high plateaux above 1,200 metres", correct: false }
        - { text: "Exclusively on volcanic islands", correct: false }
      explanation: |
        Slopes offer drainage, sunlight and cooling with elevation. Fertile valley floors generally
        favour higher yields and simpler wine.
    fr:
      question: "Où sont plantés de nombreux vignobles de qualité d’Italie centrale ?"
      choices:
        - { text: "Sur des plaines côtières gorgées d’eau", correct: false }
        - { text: "Sur les collines, contreforts et vallées des Apennins", correct: true }
        - { text: "Uniquement sur de hauts plateaux au-dessus de 1 200 mètres", correct: false }
        - { text: "Exclusivement sur des îles volcaniques", correct: false }
      explanation: |
        Les pentes offrent drainage, ensoleillement et fraîcheur liée à l’altitude. Les fonds de vallée
        fertiles favorisent généralement des rendements supérieurs et des vins plus simples.

  - id: citaly-cool-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, climate]
    status: reviewed
    source_id: c28-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two influences most commonly moderate summer heat in Central Italian vineyards?"
      choices:
        - { text: "Atlantic fog and polar winds", correct: false }
        - { text: "Elevation in the Apennine hills and sea breezes near the coast", correct: true }
        - { text: "Permanent cloud and glacial lakes", correct: false }
        - { text: "Monsoon rain and desert winds", correct: false }
      explanation: |
        Altitude increases diurnal range inland, while maritime air cools western and eastern coastal
        zones. Their importance varies greatly by region and site.
    fr:
      question: "Quelles sont les deux influences qui modèrent le plus souvent la chaleur estivale dans les vignobles d’Italie centrale ?"
      choices:
        - { text: "Le brouillard atlantique et les vents polaires", correct: false }
        - { text: "L’altitude des collines apennines et les brises marines près des côtes", correct: true }
        - { text: "Une nébulosité permanente et des lacs glaciaires", correct: false }
        - { text: "Les pluies de mousson et les vents désertiques", correct: false }
      explanation: |
        L’altitude augmente l’amplitude thermique quotidienne à l’intérieur des terres, tandis que l’air
        maritime rafraîchit les zones côtières occidentales et orientales. Leur importance varie
        fortement selon la région et le site.

  - id: citaly-tuscany-where-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where is Tuscany located within Central Italy?"
      choices:
        - { text: "On the Adriatic coast east of the Apennines", correct: false }
        - { text: "On the western side, facing the Tyrrhenian Sea", correct: true }
        - { text: "In the Po plain immediately south of the Alps", correct: false }
        - { text: "At the toe of the Italian peninsula", correct: false }
      explanation: |
        Tuscany extends from the Apennines to the Tyrrhenian coast. Its inland hills and maritime plain
        support markedly different wine styles.
    fr:
      question: "Où se situe la Toscane en Italie centrale ?"
      choices:
        - { text: "Sur la côte adriatique, à l’est des Apennins", correct: false }
        - { text: "Sur le versant occidental, face à la mer Tyrrhénienne", correct: true }
        - { text: "Dans la plaine du Pô, immédiatement au sud des Alpes", correct: false }
        - { text: "À la pointe de la botte italienne", correct: false }
      explanation: |
        La Toscane s’étend des Apennins à la côte tyrrhénienne. Ses collines intérieures et sa plaine
        maritime produisent des styles de vins très différents.

  - id: citaly-tuscany-three-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sequence correctly describes Tuscany’s principal vineyard landscapes from north and inland toward the coast?"
      choices:
        - { text: "Flat delta, high desert and tropical coast", correct: false }
        - { text: "Apennine foothills, rolling southern hills and a flatter coastal zone", correct: true }
        - { text: "Alpine glaciers, volcanic islands and river marshes", correct: false }
        - { text: "Granite plateau, slate valley and chalk plain", correct: false }
      explanation: |
        Chianti occupies northern and central hills, Montalcino and Montepulciano lie farther south and
        east, and the Maremma and Bolgheri sectors face the coast.
    fr:
      question: "Quelle succession décrit correctement les principaux paysages viticoles toscans, du nord et de l’intérieur vers la côte ?"
      choices:
        - { text: "Delta plat, haut désert et côte tropicale", correct: false }
        - { text: "Contreforts apennins, collines méridionales ondulées et zone côtière plus plate", correct: true }
        - { text: "Glaciers alpins, îles volcaniques et marais fluviaux", correct: false }
        - { text: "Plateau granitique, vallée d’ardoise et plaine crayeuse", correct: false }
      explanation: |
        Chianti occupe les collines du nord et du centre, Montalcino et Montepulciano se trouvent plus
        au sud et à l’est, tandis que la Maremme et Bolgheri font face à la côte.

  - id: citaly-sangiovese-lead-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany, grapes]
    status: reviewed
    source_id: c28-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape underpins Tuscany’s most important traditional inland red wines?"
      choices:
        - { text: "Nebbiolo", correct: false }
        - { text: "Sangiovese", correct: true }
        - { text: "Corvina", correct: false }
        - { text: "Aglianico", correct: false }
      explanation: |
        Sangiovese is central to Chianti, Brunello di Montalcino and Vino Nobile di Montepulciano,
        though local biotypes and blending rules vary.
    fr:
      question: "Quel cépage noir constitue la base des principaux rouges traditionnels de l’intérieur de la Toscane ?"
      choices:
        - { text: "Nebbiolo", correct: false }
        - { text: "Sangiovese", correct: true }
        - { text: "Corvina", correct: false }
        - { text: "Aglianico", correct: false }
      explanation: |
        Le Sangiovese est au cœur de Chianti, Brunello di Montalcino et Vino Nobile di Montepulciano,
        même si les biotypes locaux et les règles d’assemblage varient.

  - id: citaly-sangiovese-profile-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany, grapes]
    status: reviewed
    source_id: c28-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile is typical of quality Tuscan Sangiovese?"
      choices:
        - { text: "Deep colour, low acidity, soft tannins and jammy black fruit", correct: false }
        - { text: "High acidity and tannins, with sour cherry, plum and dried-herb notes", correct: true }
        - { text: "Pale colour, residual sweetness and grapey perfume", correct: false }
        - { text: "Full body, low tannin and dried-grape flavours", correct: false }
      explanation: |
        The grape’s acidity and tannins support food pairing and bottle ageing. Site, extraction and oak
        can move the style from fragrant and medium-bodied to powerful and concentrated.
    fr:
      question: "Quel profil est typique d’un Sangiovese toscan de qualité ?"
      choices:
        - { text: "Couleur profonde, faible acidité, tanins souples et fruits noirs confiturés", correct: false }
        - { text: "Acidité et tanins élevés, avec griotte, prune et notes d’herbes séchées", correct: true }
        - { text: "Couleur pâle, sucre résiduel et parfum muscaté", correct: false }
        - { text: "Corps puissant, faibles tanins et arômes de raisins séchés", correct: false }
      explanation: |
        L’acidité et les tanins du cépage favorisent les accords à table et la garde. Le site,
        l’extraction et le bois peuvent faire varier le style d’un vin parfumé et moyennement corsé à un
        vin puissant et concentré.

  - id: citaly-sangiovese-oak-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which wood-ageing options are commonly used for premium Tuscan Sangiovese?"
      choices:
        - { text: "Only new 225-litre barrels are permitted", correct: false }
        - { text: "Large traditional casks, smaller barrels or a combination", correct: true }
        - { text: "Oak is prohibited for every Tuscan denomination", correct: false }
        - { text: "Only acacia vessels may be used", correct: false }
      explanation: |
        Large casks give less overt oak flavour, while smaller barrels can add spice, toast and faster
        oxygen exposure. Rules differ by denomination and category.
    fr:
      question: "Quelles options d’élevage sous bois sont couramment employées pour le Sangiovese toscan haut de gamme ?"
      choices:
        - { text: "Seules les barriques neuves de 225 litres sont autorisées", correct: false }
        - { text: "Grands foudres traditionnels, petits fûts ou combinaison des deux", correct: true }
        - { text: "Le bois est interdit dans toutes les dénominations toscanes", correct: false }
        - { text: "Seuls les contenants en acacia peuvent être employés", correct: false }
      explanation: |
        Les grands foudres marquent moins le vin, tandis que les petits fûts peuvent apporter épices,
        notes grillées et échanges d’oxygène plus rapides. Les règles varient selon la dénomination et
        la catégorie.

  - id: citaly-sangiovese-age-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which tertiary aromas can develop as high-quality Tuscan Sangiovese ages?"
      choices:
        - { text: "Fresh grape, banana and bubble gum", correct: false }
        - { text: "Leather, earth, dried herbs and game", correct: true }
        - { text: "Gooseberry, cut grass and asparagus", correct: false }
        - { text: "Coconut, pineapple and vanilla alone", correct: false }
      explanation: |
        Youthful cherry and plum become more dried and savoury with bottle age, while tannins soften and
        integrate.
    fr:
      question: "Quels arômes tertiaires peuvent apparaître avec le vieillissement d’un Sangiovese toscan de grande qualité ?"
      choices:
        - { text: "Raisin frais, banane et bonbon anglais", correct: false }
        - { text: "Cuir, terre, herbes séchées et gibier", correct: true }
        - { text: "Groseille à maquereau, herbe coupée et asperge", correct: false }
        - { text: "Noix de coco, ananas et vanille uniquement", correct: false }
      explanation: |
        Les arômes juvéniles de cerise et de prune deviennent plus séchés et savoureux avec la garde,
        tandis que les tanins s’assouplissent et s’intègrent.

  - id: citaly-tuscany-red-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape colour accounts for the large majority of Tuscany’s vineyard area?"
      choices:
        - { text: "White grapes used mainly for aromatic wine", correct: false }
        - { text: "Black grapes led by Sangiovese", correct: true }
        - { text: "Grey-skinned grapes led by Pinot Grigio", correct: false }
        - { text: "Equal areas of white and black grapes", correct: false }
      explanation: |
        Tuscany’s international identity is dominated by red wine. White varieties remain important
        locally, including Vernaccia and Vermentino.
    fr:
      question: "Quelle couleur de raisin représente la grande majorité du vignoble toscan ?"
      choices:
        - { text: "Les cépages blancs destinés surtout aux vins aromatiques", correct: false }
        - { text: "Les cépages noirs dominés par le Sangiovese", correct: true }
        - { text: "Les cépages gris dominés par le Pinot Grigio", correct: false }
        - { text: "Des surfaces égales de cépages blancs et noirs", correct: false }
      explanation: |
        L’identité internationale de la Toscane est dominée par les vins rouges. Les cépages blancs
        restent importants localement, notamment la Vernaccia et le Vermentino.

  - id: citaly-chianti-where-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description best defines the broad Chianti DOCG production area?"
      choices:
        - { text: "Only the historic hills between Florence and Siena", correct: false }
        - { text: "A large part of central Tuscany across six provinces", correct: true }
        - { text: "The coastal strip around Bolgheri alone", correct: false }
        - { text: "The municipality of Montalcino alone", correct: false }
      explanation: |
        Chianti DOCG extends well beyond the historic Chianti Classico zone and covers areas in Arezzo,
        Florence, Pisa, Pistoia, Prato and Siena.
    fr:
      question: "Quelle description définit le mieux la vaste zone de production de Chianti DOCG ?"
      choices:
        - { text: "Uniquement les collines historiques entre Florence et Sienne", correct: false }
        - { text: "Une grande partie de la Toscane centrale répartie sur six provinces", correct: true }
        - { text: "La seule bande côtière autour de Bolgheri", correct: false }
        - { text: "La seule commune de Montalcino", correct: false }
      explanation: |
        Chianti DOCG s’étend largement au-delà de la zone historique de Chianti Classico et couvre des
        secteurs des provinces d’Arezzo, Florence, Pise, Pistoia, Prato et Sienne.

  - id: citaly-chianti-seven-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How many named subzones does Chianti DOCG have following the 2026 addition of Terre di Vinci?"
      choices:
        - { text: "Seven", correct: false }
        - { text: "Eight", correct: true }
        - { text: "Nine", correct: false }
        - { text: "Eleven", correct: false }
      explanation: |
        Terre di Vinci joined Colli Aretini, Colli Fiorentini, Colli Senesi, Colline Pisane, Montalbano,
        Montespertoli and Rufina. Chianti Classico remains a separate DOCG.
    fr:
      question: "Combien de sous-zones nommées Chianti DOCG compte-t-elle depuis l’ajout de Terre di Vinci en 2026 ?"
      choices:
        - { text: "Sept", correct: false }
        - { text: "Huit", correct: true }
        - { text: "Neuf", correct: false }
        - { text: "Onze", correct: false }
      explanation: |
        Terre di Vinci a rejoint Colli Aretini, Colli Fiorentini, Colli Senesi, Colline Pisane,
        Montalbano, Montespertoli et Rufina. Chianti Classico reste une DOCG distincte.

  - id: citaly-chianti-grape-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany, grapes]
    status: reviewed
    source_id: c28-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape must form the principal component of red Chianti DOCG?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Sangiovese", correct: true }
        - { text: "Merlot", correct: false }
        - { text: "Montepulciano", correct: false }
      explanation: |
        Other authorised Tuscan grapes may contribute within the production code’s limits, but
        Sangiovese defines the wine’s structure and identity.
    fr:
      question: "Quel cépage doit constituer la composante principale du Chianti DOCG rouge ?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Sangiovese", correct: true }
        - { text: "Merlot", correct: false }
        - { text: "Montepulciano", correct: false }
      explanation: |
        D’autres cépages toscans autorisés peuvent participer dans les limites du cahier des charges,
        mais le Sangiovese définit la structure et l’identité du vin.

  - id: citaly-chianti-blend-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are many Chianti DOCG wines blends rather than pure Sangiovese?"
      choices:
        - { text: "The denomination prohibits varietal Sangiovese", correct: false }
        - { text: "Permitted grapes can adjust colour, fruit, tannin or aroma", correct: true }
        - { text: "White grapes must always form at least half of the wine", correct: false }
        - { text: "Cabernet Sauvignon is compulsory in every subzone", correct: false }
      explanation: |
        Traditional local and international varieties may complement Sangiovese, although varietal
        Sangiovese is also possible when the applicable rules are met.
    fr:
      question: "Pourquoi de nombreux Chianti DOCG sont-ils des assemblages plutôt que des Sangiovese purs ?"
      choices:
        - { text: "La dénomination interdit le Sangiovese monocépage", correct: false }
        - { text: "Les cépages autorisés peuvent ajuster la couleur, le fruit, les tanins ou les arômes", correct: true }
        - { text: "Les cépages blancs doivent toujours constituer au moins la moitié du vin", correct: false }
        - { text: "Le Cabernet Sauvignon est obligatoire dans chaque sous-zone", correct: false }
      explanation: |
        Des cépages locaux traditionnels et internationaux peuvent compléter le Sangiovese, même si un
        Sangiovese monocépage reste possible lorsque les règles applicables sont respectées.

  - id: citaly-chianti-docg-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which denomination identifies red wine from the broad Chianti production area without a subzone?"
      choices:
        - { text: "Chianti Classico DOCG", correct: false }
        - { text: "Chianti DOCG", correct: true }
        - { text: "Toscana DOC", correct: false }
        - { text: "Brunello di Montalcino DOCG", correct: false }
      explanation: |
        Generic Chianti DOCG covers a much larger area than Chianti Classico and accounts for
        substantial production. A subzone may be added only when its stricter origin and production
        rules are met.
    fr:
      question: "Quelle dénomination identifie un rouge issu de la vaste zone de Chianti sans mention de sous-zone ?"
      choices:
        - { text: "Chianti Classico DOCG", correct: false }
        - { text: "Chianti DOCG", correct: true }
        - { text: "Toscana DOC", correct: false }
        - { text: "Brunello di Montalcino DOCG", correct: false }
      explanation: |
        Chianti DOCG générique couvre une zone bien plus vaste que Chianti Classico et représente une
        production importante. Une sous-zone ne peut être ajoutée que si ses règles plus strictes
        d’origine et de production sont respectées.

  - id: citaly-chianti-subzone-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does a Chianti DOCG subzone name such as Rufina indicate?"
      choices:
        - { text: "The wine was merely bottled in that area", correct: false }
        - { text: "The grapes and production meet the rules of a smaller delimited area", correct: true }
        - { text: "The wine is automatically a Gran Selezione", correct: false }
        - { text: "The blend contains only international grapes", correct: false }
      explanation: |
        Subzones have defined boundaries and more specific requirements than generic Chianti. The
        indication communicates origin rather than a guaranteed score or style.
    fr:
      question: "Que signifie une sous-zone de Chianti DOCG comme Rufina ?"
      choices:
        - { text: "Le vin a simplement été mis en bouteille dans ce secteur", correct: false }
        - { text: "Les raisins et la production respectent les règles d’une zone délimitée plus petite", correct: true }
        - { text: "Le vin est automatiquement une Gran Selezione", correct: false }
        - { text: "L’assemblage contient uniquement des cépages internationaux", correct: false }
      explanation: |
        Les sous-zones possèdent des limites définies et des exigences plus précises que Chianti
        générique. La mention communique une origine et non une note ou un style garanti.

  - id: citaly-chianti-best-sub-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair contains two established Chianti DOCG subzones with strong reputations for quality?"
      choices:
        - { text: "Montalcino and Montepulciano", correct: false }
        - { text: "Rufina and Colli Senesi", correct: true }
        - { text: "Bolgheri and Maremma", correct: false }
        - { text: "Barolo and Barbaresco", correct: false }
      explanation: |
        Rufina’s elevated sites often give fragrant, high-acid wines, while Colli Senesi surrounds
        important southern Tuscan wine territory. Neither is part of the separate Chianti Classico DOCG.
    fr:
      question: "Quelle paire réunit deux sous-zones établies de Chianti DOCG jouissant d’une solide réputation qualitative ?"
      choices:
        - { text: "Montalcino et Montepulciano", correct: false }
        - { text: "Rufina et Colli Senesi", correct: true }
        - { text: "Bolgheri et Maremma", correct: false }
        - { text: "Barolo et Barbaresco", correct: false }
      explanation: |
        Les sites élevés de Rufina donnent souvent des vins parfumés et très acides, tandis que Colli
        Senesi entoure d’importants territoires viticoles du sud toscan. Aucune ne fait partie de la
        DOCG distincte Chianti Classico.

  - id: citaly-classico-not-sub-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the legal relationship between Chianti Classico and Chianti DOCG?"
      choices:
        - { text: "Chianti Classico is one of Chianti’s eight subzones", correct: false }
        - { text: "Chianti Classico is a separate DOCG with its own production code", correct: true }
        - { text: "Chianti Classico is an IGT within Chianti", correct: false }
        - { text: "Chianti Classico is merely an ageing term", correct: false }
      explanation: |
        Since 1996, Chianti Classico has been legally independent. Its historic territory lies between
        Florence and Siena and cannot simultaneously produce generic Chianti DOCG.
    fr:
      question: "Quelle est la relation juridique entre Chianti Classico et Chianti DOCG ?"
      choices:
        - { text: "Chianti Classico est l’une des huit sous-zones de Chianti", correct: false }
        - { text: "Chianti Classico est une DOCG distincte dotée de son propre cahier des charges", correct: true }
        - { text: "Chianti Classico est une IGT au sein de Chianti", correct: false }
        - { text: "Chianti Classico est une simple mention d’élevage", correct: false }
      explanation: |
        Depuis 1996, Chianti Classico est juridiquement indépendant. Son territoire historique se situe
        entre Florence et Sienne et ne peut pas produire simultanément du Chianti DOCG générique.

  - id: citaly-classico-high-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do many Chianti Classico vineyards compare with the broader Chianti zone?"
      choices:
        - { text: "They lie mainly on warmer coastal flats", correct: false }
        - { text: "They occupy relatively elevated, well-drained hills", correct: true }
        - { text: "They are restricted to fertile valley floors", correct: false }
        - { text: "They sit entirely below 100 metres", correct: false }
      explanation: |
        The historic zone is a hilly plateau, commonly around 200–600 metres. Its cooler nights and
        poorer soils can help retain acidity and control vigour.
    fr:
      question: "Comment de nombreux vignobles de Chianti Classico se comparent-ils à ceux de la vaste zone de Chianti ?"
      choices:
        - { text: "Ils se trouvent surtout dans des plaines côtières plus chaudes", correct: false }
        - { text: "Ils occupent des collines relativement élevées et bien drainées", correct: true }
        - { text: "Ils sont limités aux fonds de vallée fertiles", correct: false }
        - { text: "Ils se situent tous sous 100 mètres", correct: false }
      explanation: |
        La zone historique forme un plateau vallonné, souvent situé entre 200 et 600 mètres. Ses nuits
        plus fraîches et ses sols plus pauvres peuvent préserver l’acidité et maîtriser la vigueur.

  - id: citaly-classico-effect-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What stylistic effect is commonly associated with Chianti Classico’s higher hill sites?"
      choices:
        - { text: "Lower acidity and more jammy fruit", correct: false }
        - { text: "Fresher acidity and more floral or herbal definition", correct: true }
        - { text: "Higher residual sugar and lower tannin", correct: false }
        - { text: "Darker colour caused solely by altitude", correct: false }
      explanation: |
        Cooler temperatures slow ripening and preserve freshness. Sangiovese still needs favourable
        exposure to mature its tannins fully.
    fr:
      question: "Quel effet stylistique est couramment associé aux sites de coteau plus élevés de Chianti Classico ?"
      choices:
        - { text: "Acidité plus faible et fruit plus confituré", correct: false }
        - { text: "Acidité plus fraîche et définition florale ou herbacée plus nette", correct: true }
        - { text: "Sucre résiduel plus élevé et tanins plus faibles", correct: false }
        - { text: "Couleur plus profonde causée uniquement par l’altitude", correct: false }
      explanation: |
        Les températures plus fraîches ralentissent la maturation et préservent la fraîcheur. Le
        Sangiovese exige néanmoins une bonne exposition pour mûrir pleinement ses tanins.

  - id: citaly-classico-12-001
    type: mcq
