      choices:
        - { text: "A high alpine wall", correct: false }
        - { text: "Relatively flat and cooled by sea breezes", correct: true }
        - { text: "A desert with no wind", correct: false }
        - { text: "Permanently iced", correct: false }
      explanation: |
        **Flat, sea-cooled.** Bolgheri and the Maremma.

