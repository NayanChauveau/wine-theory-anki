        - { text: "Barolo and Barbaresco", correct: false }
        - { text: "Brunello di Montalcino and Vino Nobile di Montepulciano", correct: true }
        - { text: "Soave and Prosecco", correct: false }
        - { text: "Gavi and Asti", correct: false }
      explanation: |
        **Brunello and Vino Nobile.** Both Sangiovese stories, warmer
        than Chianti.

  - id: citaly-south-style-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do Brunello and Vino Nobile usually sit next to Chianti?
      choices:
        - { text: "Lighter and sweeter", correct: false }
        - { text: "More intense and fuller-bodied", correct: true }
        - { text: "Always white", correct: false }
        - { text: "Identical, by law", correct: false }
      explanation: |
        **More intense, fuller.** Warmer sites, thicker Sangiovese.

  - id: citaly-brunello-law-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What are Brunello di Montalcino’s two hard legal bars?
      choices:
        - { text: "Any grape, six weeks in steel", correct: false }
        - { text: "100% Sangiovese, and five years’ ageing with at least two in oak", correct: true }
        - { text: "No oak and no wait", correct: false }
        - { text: "It must be a white blend", correct: false }
      explanation: |
        **100% Sangiovese; 5 years, 2 in wood.** Biondi-Santi is the
        named extra.

  - id: citaly-nobile-law-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Vino Nobile di Montepulciano differ legally from Brunello?
      choices:
        - { text: "It must be 100% Cabernet", correct: false }
        - { text: "Sangiovese may be blended, and the wine needs two years before release", correct: true }
        - { text: "It is white-only", correct: false }
        - { text: "No ageing is required", correct: false }
      explanation: |
        **Blend allowed; two years.** Not Brunello’s 100% / five-year
        bar.

  - id: citaly-declass-when-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When might a Brunello or Vino Nobile house drop to the DOC below?
      choices:
        - { text: "Only in a perfect vintage", correct: false }
        - { text: "In a particularly poor vintage", correct: true }
        - { text: "Declassification is illegal", correct: false }
        - { text: "Only if the wine is sparkling", correct: false }
      explanation: |
        **A poor vintage** — or young vines, or a second wine. The
        DOC is the safety net.

  - id: citaly-rosso-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
