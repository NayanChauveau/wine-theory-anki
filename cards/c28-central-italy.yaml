        - { text: "1 October in the year after harvest", correct: true }
        - { text: "1 January in the third year after harvest", correct: false }
        - { text: "1 January in the fifth year after harvest", correct: false }
      explanation: |
        The rule gives the wine roughly a year of maturation but is expressed as a release date rather
        than a simple twelve-month requirement.
    fr:
      question: "Quelle est la première date de commercialisation autorisée pour un Chianti Classico standard ?"
      choices:
        - { text: "Le 1er mars de l’année suivant la récolte", correct: false }
        - { text: "Le 1er octobre de l’année suivant la récolte", correct: true }
        - { text: "Le 1er janvier de la troisième année suivant la récolte", correct: false }
        - { text: "Le 1er janvier de la cinquième année suivant la récolte", correct: false }
      explanation: |
        La règle accorde au vin environ un an de maturation, mais s’exprime sous la forme d’une date de
        commercialisation plutôt que d’une simple exigence de douze mois.

  - id: citaly-classico-riserva-001
    type: mcq
