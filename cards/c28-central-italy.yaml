      choices:
        - { text: "Barolo DOCG and Barbaresco DOCG", correct: false }
        - { text: "Rosso di Montalcino DOC and Rosso di Montepulciano DOC", correct: true }
        - { text: "Chianti Classico Gran Selezione", correct: false }
        - { text: "Only IGT Sicilia", correct: false }
      explanation: |
        **Rosso di Montalcino and Rosso di Montepulciano.** Earlier
        drinking, same hills.

  - id: citaly-coast-001
