    en:
      question: "What minimum maturation is required for Chianti Classico Riserva?"
      choices:
        - { text: "18 months with no bottle requirement", correct: false }
        - { text: "24 months, including at least 3 months in bottle", correct: true }
        - { text: "30 months, including at least 6 months in bottle", correct: false }
        - { text: "Five years, including two in oak", correct: false }
      explanation: |
        The period is calculated from 1 January after the harvest. The code does not prescribe that the
        wine spend all or any fixed portion of the remaining time in oak.
    fr:
      question: "Quelle maturation minimale est exigée pour Chianti Classico Riserva ?"
      choices:
        - { text: "18 mois sans exigence de bouteille", correct: false }
        - { text: "24 mois, dont au moins 3 mois en bouteille", correct: true }
        - { text: "30 mois, dont au moins 6 mois en bouteille", correct: false }
        - { text: "Cinq ans, dont deux sous bois", correct: false }
      explanation: |
        La période est calculée à partir du 1er janvier suivant la récolte. Le cahier des charges
        n’impose pas que le vin passe tout ou partie fixe du temps restant sous bois.

  - id: citaly-gran-selezione-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0023
    review:
