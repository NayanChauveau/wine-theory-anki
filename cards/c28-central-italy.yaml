cards:
  - id: citaly-apennines-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy]
    status: reviewed
    source_id: c28-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What mountain range dominates Central Italy south of the Po?
      choices:
        - { text: "The Alps only", correct: false }
        - { text: "The Apennines, running the length of the peninsula", correct: true }
        - { text: "The Vosges", correct: false }
        - { text: "There are no mountains", correct: false }
      explanation: |
        **The Apennines.** Chianti, Umbria and Marche hang off those
        folds.

  - id: citaly-plant-hills-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy]
    status: reviewed
    source_id: c28-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: On which Central Italian landform are the vines usually found?
      choices:
        - { text: "Only on a coastal desert", correct: false }
        - { text: "In the hills and valleys of the Apennines", correct: true }
        - { text: "Indoor only", correct: false }
        - { text: "On the Po delta only", correct: false }
      explanation: |
        **Apennine hills and valleys.** Altitude is the cooling tool.

  - id: citaly-cool-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, climate]
    status: reviewed
    source_id: c28-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What two things moderate heat in Central Italy?
      choices:
        - { text: "Indoor air-con only", correct: false }
        - { text: "Apennine-foothill altitude, or coastal sea breezes", correct: true }
        - { text: "A legal ban on sunshine", correct: false }
        - { text: "Permanent ice", correct: false }
      explanation: |
        **Height inland, sea air on the coast.** Montalcino feels the
        first; Bolgheri the second.

  - id: citaly-tuscany-where-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which side of Central Italy does Tuscany occupy?
      choices:
        - { text: "The Adriatic north-east only", correct: false }
        - { text: "Down the western coast of Central Italy", correct: true }
        - { text: "On Sicily", correct: false }
        - { text: "North of Bolzano", correct: false }
      explanation: |
        **West coast of Central Italy** — Tyrrhenian side, Florence
        to the Maremma.

  - id: citaly-tuscany-three-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What three landscapes make up Tuscany?
      choices:
        - { text: "One flat lagoon only", correct: false }
        - { text: "Mountainous Chianti in the north, hills and valleys to the south, and a flat coastal plain", correct: true }
        - { text: "Only alpine ice", correct: false }
        - { text: "A single river island", correct: false }
      explanation: |
        **North Chianti mountains, southern hills, coastal plain.**
        Three climates; Sangiovese leads inland, internationals the
        coast.

  - id: citaly-sangiovese-lead-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany, grapes]
    status: reviewed
    source_id: c28-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which black grape is Tuscany’s prestige lead inland?
      choices:
        - { text: "Nebbiolo", correct: false }
        - { text: "Sangiovese", correct: true }
        - { text: "Corvina", correct: false }
        - { text: "Aglianico", correct: false }
      explanation: |
        **Sangiovese.** Cabernet is the Super-Tuscan extra, not the
        regional lead.

  - id: citaly-sangiovese-profile-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany, grapes]
    status: reviewed
    source_id: c28-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is typical Tuscan Sangiovese like in the glass?
      choices:
        - { text: "Low acid, low tannin, and deep inky colour", correct: false }
        - { text: "High tannin, high acid, red cherry, plum and dried herbs", correct: true }
        - { text: "A white grape", correct: false }
        - { text: "Sweet and sparkling only", correct: false }
      explanation: |
        **High tannin, high acid, cherry, plum, dried herbs.** It is
        late-ripening and usually sees oak; those sit in the Why, not
        the SAT line.

  - id: citaly-sangiovese-oak-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two oak formats do Tuscan cellars use on Sangiovese?
      choices:
        - { text: "Only chestnut amphorae", correct: false }
        - { text: "Small barrels and/or larger casks", correct: true }
        - { text: "No oak is legal", correct: false }
        - { text: "Only new 100% barrique, by law", correct: false }
      explanation: |
        **Small barrels and/or large casks.** Brunello houses still
        argue that split.

  - id: citaly-sangiovese-age-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After years in bottle, which savoury register can Sangiovese show?
      choices:
        - { text: "Lychee and roses only", correct: false }
        - { text: "Meaty, gamey aromas", correct: true }
        - { text: "A legal ban on any development", correct: false }
        - { text: "It always stays primary cherry", correct: false }
      explanation: |
        **Meaty and gamey.** The mature Chianti / Brunello register.

  - id: citaly-tuscany-red-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which colour of grape covers most Tuscan hectares?
      choices:
        - { text: "White only", correct: false }
        - { text: "Black, with a little white", correct: true }
        - { text: "Only grey Pinot", correct: false }
        - { text: "No black grapes are legal", correct: false }
      explanation: |
        **Black, plus some white.** Vernaccia di San Gimignano is the
        named white extra.

  - id: citaly-chianti-where-001
    type: mcq
