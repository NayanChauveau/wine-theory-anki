        - { text: "Lower and warmer, with cool south-west maritime breezes", correct: true }
        - { text: "Indoor only", correct: false }
        - { text: "Permanently iced", correct: false }
      explanation: |
        **Lower, warmer, SW sea air.** Montalcino and Montepulciano
        sit in that belt.

  - id: citaly-south-names-001
    type: mcq
    deck: Italy::Central Italy
