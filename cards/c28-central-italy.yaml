        - { text: "Gran Selezione", correct: true }
        - { text: "Classico Storico", correct: false }
        - { text: "Vigna Riserva", correct: false }
      explanation: |
        Gran Selezione is the denomination’s most restrictive category, with estate-grown fruit, longer
        maturation and tighter grape-composition rules.
    fr:
      question: "Quelle catégorie se situe au-dessus de Riserva au sein de Chianti Classico DOCG ?"
      choices:
        - { text: "Superiore", correct: false }
        - { text: "Gran Selezione", correct: true }
        - { text: "Classico Storico", correct: false }
        - { text: "Vigna Riserva", correct: false }
      explanation: |
        Gran Selezione est la catégorie la plus restrictive de la dénomination, avec des raisins de
        l’exploitation, une maturation plus longue et des règles d’encépagement plus strictes.

  - id: citaly-gs-rules-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination is required for Chianti Classico Gran Selezione?"
      choices:
        - { text: "Purchased fruit, 24 months ageing and at least 80% Sangiovese", correct: false }
        - { text: "Estate-grown fruit, 30 months ageing and a higher Sangiovese requirement", correct: true }
        - { text: "Any Tuscan fruit, 12 months ageing and compulsory Cabernet", correct: false }
        - { text: "Dried grapes, 36 months ageing and fortification", correct: false }
      explanation: |
        Current rules specify at least 90% Sangiovese, with only authorised indigenous black grapes for
        the remainder, plus at least 3 months in bottle within the 30-month maturation.
    fr:
      question: "Quelle combinaison est exigée pour Chianti Classico Gran Selezione ?"
      choices:
        - { text: "Raisins achetés, 24 mois d’élevage et au moins 80 % de Sangiovese", correct: false }
        - { text: "Raisins de l’exploitation, 30 mois d’élevage et proportion de Sangiovese plus élevée", correct: true }
        - { text: "Tout raisin toscan, 12 mois d’élevage et Cabernet obligatoire", correct: false }
        - { text: "Raisins séchés, 36 mois d’élevage et mutage", correct: false }
      explanation: |
        Les règles actuelles fixent au moins 90 % de Sangiovese, seuls des cépages noirs indigènes
        autorisés pouvant compléter l’assemblage, ainsi qu’au moins 3 mois en bouteille dans les 30 mois
        de maturation.

  - id: citaly-gs-oak-law-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does the Chianti Classico Gran Selezione production code require regarding oak?"
      choices:
        - { text: "At least 18 months in new barriques", correct: false }
        - { text: "No specific vessel or minimum time in oak", correct: true }
        - { text: "Maturation only in large Slavonian casks", correct: false }
        - { text: "No contact with wood at any stage", correct: false }
      explanation: |
        The code fixes total maturation and bottle ageing, but producers choose whether and how to use
        wood. Oak character is therefore a stylistic decision, not a category requirement.
    fr:
      question: "Qu’impose le cahier des charges de Chianti Classico Gran Selezione concernant le bois ?"
      choices:
        - { text: "Au moins 18 mois en barriques neuves", correct: false }
        - { text: "Aucun contenant précis ni durée minimale sous bois", correct: true }
        - { text: "Élevage uniquement en grands foudres de Slavonie", correct: false }
        - { text: "Aucun contact avec le bois à quelque étape que ce soit", correct: false }
      explanation: |
        Le cahier des charges fixe la maturation totale et l’élevage en bouteille, mais les producteurs
        choisissent s’ils utilisent du bois et comment. Le caractère boisé relève donc du style, pas de
        la catégorie.

  - id: citaly-gs-oak-practice-001
    type: mcq
    deck: Italy::Central Italy
    tags: [italy, central-italy, tuscany]
    status: reviewed
    source_id: c28-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do many Gran Selezione producers use oak even though it is not legally required?"
      choices:
        - { text: "Oak is needed to raise the wine’s residual sugar", correct: false }
        - { text: "Controlled oxygen and wood can soften tannins and add complexity", correct: true }
        - { text: "Oak converts permitted grapes into Sangiovese", correct: false }
        - { text: "Barrels are required to create carbonation", correct: false }
      explanation: |
        Sangiovese’s tannins and concentration can benefit from maturation in large casks or smaller
        barrels. Vessel age and size determine how strongly oak flavours the wine.
    fr:
      question: "Pourquoi de nombreux producteurs de Gran Selezione utilisent-ils le bois alors qu’il n’est pas légalement obligatoire ?"
      choices:
        - { text: "Le bois est nécessaire pour augmenter le sucre résiduel", correct: false }
        - { text: "L’oxygène maîtrisé et le bois peuvent assouplir les tanins et ajouter de la complexité", correct: true }
        - { text: "Le bois transforme les cépages autorisés en Sangiovese", correct: false }
        - { text: "Les fûts sont nécessaires pour créer l’effervescence", correct: false }
      explanation: |
        Les tanins et la concentration du Sangiovese peuvent profiter d’un élevage en grands foudres ou
        en petits fûts. L’âge et la taille du contenant déterminent l’intensité du goût boisé.

