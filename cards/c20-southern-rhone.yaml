cards:
  - id: srhone-valence-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone"]
    status: reviewed
    source_id: c20-0001
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which town broadly marks the northern gateway to the Southern Rhône wine area?"
      choices:
        - { text: "Valence", correct: false }
        - { text: "Montélimar", correct: true }
        - { text: "Vienne", correct: false }
        - { text: "Tain-l’Hermitage", correct: false }
      explanation: |
        The valley opens into plains and gentler hills around Montélimar. Valence is more closely associated
        with the southern end of the Northern Rhône.
    fr:
      question: "Quelle ville marque approximativement la porte d’entrée septentrionale du vignoble du Rhône méridional ?"
      choices:
        - { text: "Valence", correct: false }
        - { text: "Montélimar", correct: true }
        - { text: "Vienne", correct: false }
        - { text: "Tain-l’Hermitage", correct: false }
      explanation: |
        La vallée s’élargit en plaines et collines plus douces autour de Montélimar. Valence est plutôt associée
        à l’extrémité sud du Rhône septentrional.
  - id: srhone-flatter-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone"]
    status: reviewed
    source_id: c20-0002
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "How does the Southern Rhône’s relief generally differ from that of the Northern Rhône?"
      choices:
        - { text: "It is dominated by narrower and steeper river walls", correct: false }
        - { text: "It has more plains, plateaux and gently sloping hills", correct: true }
        - { text: "It consists mainly of high-altitude granite terraces", correct: false }
        - { text: "It has one continuous south-facing slope", correct: false }
      explanation: |
        The valley broadens south of Montélimar. Important vineyards occur on terraces and hills as well as
        plains, but extreme slopes are less dominant than in the north.
    fr:
      question: "Comment le relief du Rhône méridional diffère-t-il généralement de celui du Rhône septentrional ?"
      choices:
        - { text: "Il est dominé par des parois fluviales plus étroites et plus raides", correct: false }
        - { text: "Il comprend davantage de plaines, de plateaux et de collines aux pentes douces", correct: true }
        - { text: "Il se compose surtout de terrasses granitiques d’altitude", correct: false }
        - { text: "Il forme un seul coteau continu exposé au sud", correct: false }
      explanation: |
        La vallée s’élargit au sud de Montélimar. Des vignobles importants occupent terrasses et collines autant
        que plaines, mais les pentes extrêmes dominent moins qu’au nord.
  - id: srhone-stones-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","soil"]
    status: reviewed
    source_id: c20-0003
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which description best reflects Southern Rhône vineyard soils?"
      choices:
        - { text: "They are uniformly deep and fertile alluvium", correct: false }
        - { text: "They vary: clay, limestone, sand, gravel and rounded stones", correct: true }
        - { text: "They consist almost entirely of granite and schist", correct: false }
        - { text: "They are dominated by waterlogged peat", correct: false }
      explanation: |
        The south has no single soil type. Châteauneuf-du-Pape alone includes galets over clay as well as sand,
        sandstone and limestone.
    fr:
      question: "Quelle description correspond le mieux aux sols viticoles du Rhône méridional ?"
      choices:
        - { text: "Ils sont uniformément constitués d’alluvions profondes et fertiles", correct: false }
        - { text: "Ils sont variés : argile, calcaire, sable, graviers et galets roulés", correct: true }
        - { text: "Ils se composent presque entièrement de granite et de schiste", correct: false }
        - { text: "Ils sont dominés par des tourbières gorgées d’eau", correct: false }
      explanation: |
        Le sud ne possède pas un type de sol unique. Châteauneuf-du-Pape comprend à lui seul des galets sur
        argile, mais aussi du sable, du grès et du calcaire.
  - id: srhone-stones-heat-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","soil"]
    status: reviewed
    source_id: c20-0004
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "How can a surface layer of stones influence ripening in the Southern Rhône?"
      choices:
        - { text: "It keeps the soil permanently cool", correct: false }
        - { text: "It absorbs daytime heat and releases it after sunset", correct: true }
        - { text: "It prevents roots from reaching water reserves", correct: false }
        - { text: "It increases rainfall around the bunches", correct: false }
      explanation: |
        Rounded stones warm strongly in the sun and can extend heat around the vine into the evening. Their
        importance varies with site and is not the only factor in ripening.
    fr:
      question: "Comment une couche de pierres en surface peut-elle influencer la maturation dans le Rhône méridional ?"
      choices:
        - { text: "Elle maintient le sol constamment frais", correct: false }
        - { text: "Elle absorbe la chaleur du jour et la restitue après le coucher du soleil", correct: true }
        - { text: "Elle empêche les racines d’atteindre les réserves d’eau", correct: false }
        - { text: "Elle augmente les précipitations autour des grappes", correct: false }
      explanation: |
        Les galets chauffent fortement au soleil et peuvent prolonger la chaleur autour du cep en soirée. Leur
        importance varie selon le site et ils ne constituent pas le seul facteur de maturation.
  - id: srhone-galets-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","soil"]
    status: reviewed
    source_id: c20-0005
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "What are the galets roulés associated with some Châteauneuf-du-Pape vineyards?"
      choices:
        - { text: "Thin plates of local schist", correct: false }
        - { text: "Large rounded stones deposited by the Rhône", correct: true }
        - { text: "Sharp fragments of decomposed granite", correct: false }
        - { text: "Soft chalk pebbles formed in the vineyard", correct: false }
      explanation: |
        These rounded river stones can form a dense surface cover over clay-rich soils. Other Châteauneuf
        parcels are sandy or limestone-rich and may show few galets.
    fr:
      question: "Que sont les galets roulés associés à certaines parcelles de Châteauneuf-du-Pape ?"
      choices:
        - { text: "De fines plaques de schiste local", correct: false }
        - { text: "De gros galets arrondis déposés par le Rhône", correct: true }
        - { text: "Des fragments anguleux de granite décomposé", correct: false }
        - { text: "Des cailloux de craie tendre formés dans le vignoble", correct: false }
      explanation: |
        Ces galets fluviaux peuvent former une couverture dense au-dessus de sols riches en argile. D’autres
        parcelles de Châteauneuf sont sableuses ou calcaires et présentent peu de galets.
  - id: srhone-climate-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","climate"]
    status: reviewed
    source_id: c20-0006
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which climate best describes the Southern Rhône?"
      choices:
        - { text: "Cool maritime with rainfall evenly spread through summer", correct: false }
        - { text: "Mediterranean, with warm dry summers and generally mild winters", correct: true }
        - { text: "Moderate continental with short cool summers", correct: false }
        - { text: "Alpine with frequent summer frost", correct: false }
      explanation: |
        Strong sunshine and summer dryness favour late-ripening Grenache and Mourvèdre. Drought, heat and the
        mistral are important hazards.
    fr:
      question: "Quel climat décrit le mieux le Rhône méridional ?"
      choices:
        - { text: "Océanique frais avec des pluies estivales régulières", correct: false }
        - { text: "Méditerranéen, avec des étés chauds et secs et des hivers généralement doux", correct: true }
        - { text: "Continental modéré avec des étés courts et frais", correct: false }
        - { text: "Alpin avec de fréquentes gelées estivales", correct: false }
      explanation: |
        Le fort ensoleillement et la sécheresse estivale favorisent le Grenache et le Mourvèdre tardifs. La
        sécheresse, la chaleur et le mistral sont des risques importants.
  - id: srhone-drought-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","climate"]
    status: reviewed
    source_id: c20-0007
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which growing-season hazard is especially important in the Southern Rhône’s Mediterranean climate?"
      choices:
        - { text: "Persistent waterlogging", correct: false }
        - { text: "Drought and water stress", correct: true }
        - { text: "Insufficient winter dormancy every year", correct: false }
        - { text: "Lack of sunlight during ripening", correct: false }
      explanation: |
        Hot, dry summers and freely draining stony soils can leave vines short of water. Old vines and deeper
        clay reserves may improve resilience.
    fr:
      question: "Quel risque de la saison végétative est particulièrement important dans le climat méditerranéen du Rhône méridional ?"
      choices:
        - { text: "L’engorgement permanent des sols", correct: false }
        - { text: "La sécheresse et le stress hydrique", correct: true }
        - { text: "L’absence systématique de dormance hivernale", correct: false }
        - { text: "Le manque d’ensoleillement pendant la maturation", correct: false }
      explanation: |
        Les étés chauds et secs et les sols caillouteux très drainants peuvent priver la vigne d’eau. Les
        vieilles vignes et les réserves des argiles profondes peuvent améliorer la résistance.
  - id: srhone-mistral-south-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","climate"]
    status: reviewed
    source_id: c20-0007
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which wind strongly influences the Southern Rhône?"
      choices:
        - { text: "The autan", correct: false }
        - { text: "The mistral", correct: true }
        - { text: "The tramontane", correct: false }
        - { text: "The foehn", correct: false }
      explanation: |
        This cold, dry northerly can reduce fungal pressure and clear skies, but violent gusts may damage vines
        and increase evaporation.
    fr:
      question: "Quel vent influence fortement le Rhône méridional ?"
      choices:
        - { text: "L’autan", correct: false }
        - { text: "Le mistral", correct: true }
        - { text: "La tramontane", correct: false }
        - { text: "Le foehn", correct: false }
      explanation: |
        Ce vent du nord froid et sec peut réduire la pression des maladies et dégager le ciel, mais ses rafales
        violentes risquent d’abîmer les vignes et d’accroître l’évaporation.
  - id: srhone-mistral-why-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","climate"]
    status: reviewed
    source_id: c20-0008
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Why are many Southern Rhône vineyards highly exposed to the mistral?"
      choices:
        - { text: "Dense forest traps the wind over every site", correct: false }
        - { text: "The broad, open valley offers less shelter than the northern slopes", correct: true }
        - { text: "The Mediterranean reverses the wind towards the north", correct: false }
        - { text: "High humidity intensifies every northerly breeze", correct: false }
      explanation: |
        South of Montélimar the valley broadens, giving the wind a long, unobstructed path. Local hills and
        windbreaks can still create protection.
    fr:
      question: "Pourquoi de nombreux vignobles du Rhône méridional sont-ils très exposés au mistral ?"
      choices:
        - { text: "La forêt dense emprisonne le vent sur chaque site", correct: false }
        - { text: "La vallée large et ouverte offre moins d’abri que les coteaux septentrionaux", correct: true }
        - { text: "La Méditerranée renverse le vent vers le nord", correct: false }
        - { text: "Une forte humidité intensifie chaque brise du nord", correct: false }
      explanation: |
        Au sud de Montélimar, la vallée s’élargit et offre au vent un long couloir dégagé. Les collines et les
        haies locales peuvent néanmoins apporter une protection.
  - id: srhone-windbreaks-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone"]
    status: reviewed
    source_id: c20-0009
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which vineyard feature can reduce mistral damage in the Southern Rhône?"
      choices:
        - { text: "Drainage ditches running downslope", correct: false }
        - { text: "Rows of trees or walls acting as windbreaks", correct: true }
        - { text: "High-density planting without supports", correct: false }
        - { text: "Bare soil kept free of vegetation", correct: false }
      explanation: |
        Cypress, poplar and built walls can slow gusts around exposed parcels. They reduce rather than eliminate
        the wind.
    fr:
      question: "Quel aménagement viticole peut réduire les dégâts du mistral dans le Rhône méridional ?"
      choices:
        - { text: "Des fossés de drainage dans le sens de la pente", correct: false }
        - { text: "Des rangées d’arbres ou des murs servant de brise-vent", correct: true }
        - { text: "Une forte densité de plantation sans support", correct: false }
        - { text: "Un sol nu maintenu sans végétation", correct: false }
      explanation: |
        Des cyprès, des peupliers ou des murs peuvent ralentir les rafales autour des parcelles exposées. Ils
        atténuent le vent sans le supprimer.
  - id: srhone-grenache-train-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone"]
    status: reviewed
    source_id: c20-0010
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which training system is traditionally well suited to Grenache in the Southern Rhône?"
      choices:
        - { text: "A tall overhead pergola", correct: false }
        - { text: "Low, free-standing gobelet", correct: true }
        - { text: "A single stake on very steep terraces", correct: false }
        - { text: "A high vertical trellis with a long trunk", correct: false }
      explanation: |
        Grenache’s strong, upright growth suits bush training. A low gobelet also reduces wind exposure and
        shades bunches from intense sun.
    fr:
      question: "Quel système de conduite convient traditionnellement bien au Grenache dans le Rhône méridional ?"
      choices:
        - { text: "Une haute pergola couvrant les rangs", correct: false }
        - { text: "Un gobelet bas et autoportant", correct: true }
        - { text: "Un échalas individuel sur des terrasses très raides", correct: false }
        - { text: "Un haut palissage vertical à tronc long", correct: false }
      explanation: |
        Le port dressé et robuste du Grenache convient au gobelet. Une conduite basse réduit aussi l’exposition
        au vent et protège les grappes du soleil intense.
  - id: srhone-syrah-trellis-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone"]
    status: reviewed
    source_id: c20-0010
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Why is Syrah commonly trellised in the Southern Rhône?"
      choices:
        - { text: "Its shoots need support and an organised canopy", correct: false }
        - { text: "It can ripen only when trained above two metres", correct: true }
        - { text: "Appellation law prohibits bush-trained Syrah", correct: false }
        - { text: "Trellising automatically protects it from drought", correct: false }
      explanation: |
        Syrah has less self-supporting growth than Grenache. Wires help manage shoots and fruit exposure,
        especially on sites that permit mechanisation.
    fr:
      question: "Pourquoi la Syrah est-elle couramment palissée dans le Rhône méridional ?"
      choices:
        - { text: "Ses rameaux ont besoin de soutien et d’une végétation organisée", correct: false }
        - { text: "Elle ne peut mûrir que si elle est conduite à plus de deux mètres", correct: true }
        - { text: "Le cahier des charges interdit la Syrah en gobelet", correct: false }
        - { text: "Le palissage la protège automatiquement de la sécheresse", correct: false }
      explanation: |
        La Syrah se soutient moins naturellement que le Grenache. Les fils facilitent la conduite des rameaux et
        l’exposition des grappes, surtout sur les sites mécanisables.
  - id: srhone-blends-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone"]
    status: reviewed
    source_id: c20-0011
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "How do Southern Rhône reds usually differ from Northern Rhône reds in their varietal composition?"
      choices:
        - { text: "They are normally pure Syrah", correct: false }
        - { text: "They are commonly blends led by Grenache", correct: true }
        - { text: "They are normally pure Mourvèdre", correct: false }
        - { text: "They exclude all secondary varieties", correct: false }
      explanation: |
        Grenache often leads, supported by Syrah, Mourvèdre, Cinsault and other authorised grapes. Northern red
        crus instead centre on Syrah.
    fr:
      question: "Comment les rouges du Rhône méridional diffèrent-ils généralement des rouges septentrionaux par leur composition variétale ?"
      choices:
        - { text: "Ils sont habituellement composés uniquement de Syrah", correct: false }
        - { text: "Ce sont couramment des assemblages dominés par le Grenache", correct: true }
        - { text: "Ils sont habituellement composés uniquement de Mourvèdre", correct: false }
        - { text: "Ils excluent tous les cépages secondaires", correct: false }
      explanation: |
        Le Grenache domine souvent, complété par la Syrah, le Mourvèdre, le Cinsault et d’autres cépages
        autorisés. Les crus rouges septentrionaux reposent au contraire sur la Syrah.
  - id: srhone-dozen-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone"]
    status: reviewed
    source_id: c20-0012
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "How broad are the permitted grape lists in many Southern Rhône appellations?"
      choices:
        - { text: "They are limited to Syrah and Grenache", correct: false }
        - { text: "They can include numerous principal and secondary varieties", correct: true }
        - { text: "They require exactly three varieties in every wine", correct: false }
        - { text: "They permit only one variety chosen by each commune", correct: false }
      explanation: |
        The south preserves a long tradition of mixed plantings and blending. Exact lists and proportions differ
        by appellation, so no single recipe applies throughout the region.
    fr:
      question: "Quelle est l’ampleur des listes de cépages autorisés dans de nombreuses appellations du Rhône méridional ?"
      choices:
        - { text: "Elles se limitent à la Syrah et au Grenache", correct: false }
        - { text: "Elles peuvent comprendre de nombreux cépages principaux et secondaires", correct: true }
        - { text: "Elles imposent exactement trois cépages dans chaque vin", correct: false }
        - { text: "Elles n’autorisent qu’un cépage choisi par chaque commune", correct: false }
      explanation: |
        Le sud conserve une longue tradition de complantation et d’assemblage. Les listes et proportions exactes
        varient selon l’appellation : aucune recette unique ne s’applique à toute la région.
  - id: srhone-grenache-area-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","grapes"]
    status: reviewed
    source_id: c20-0013
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which black variety occupies the largest vineyard area in the Southern Rhône?"
      choices:
        - { text: "Syrah", correct: false }
        - { text: "Grenache", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Cinsault", correct: false }
      explanation: |
        Grenache’s tolerance of heat, drought and wind makes it central to the region. Syrah and Mourvèdre
        commonly reinforce its colour, tannin and complexity.
    fr:
      question: "Quel cépage noir occupe la plus grande superficie dans le Rhône méridional ?"
      choices:
        - { text: "La Syrah", correct: false }
        - { text: "Le Grenache", correct: true }
        - { text: "Le Mourvèdre", correct: false }
        - { text: "Le Cinsault", correct: false }
      explanation: |
        La tolérance du Grenache à la chaleur, à la sécheresse et au vent en fait le cépage central de la
        région. Syrah et Mourvèdre renforcent souvent sa couleur, ses tanins et sa complexité.
  - id: srhone-grenache-why-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","grapes"]
    status: reviewed
    source_id: c20-0015
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Why does Grenache ripen more reliably in the Southern Rhône than in the Northern Rhône?"
      choices:
        - { text: "It requires a short, cool growing season", correct: false }
        - { text: "It benefits from the south’s long, warm growing season", correct: true }
        - { text: "It ripens before all other Rhône varieties", correct: false }
        - { text: "It needs high summer rainfall to complete ripening", correct: false }
      explanation: |
        Grenache is late ripening and needs sustained heat. The Mediterranean south supplies a longer, warmer
        season than the cooler northern slopes.
    fr:
      question: "Pourquoi le Grenache mûrit-il plus régulièrement dans le Rhône méridional que septentrional ?"
      choices:
        - { text: "Il exige une saison végétative courte et fraîche", correct: false }
        - { text: "Il profite de la longue et chaude saison végétative du sud", correct: true }
        - { text: "Il mûrit avant tous les autres cépages rhodaniens", correct: false }
        - { text: "Il a besoin de fortes pluies estivales pour achever sa maturation", correct: false }
      explanation: |
        Le Grenache est tardif et demande une chaleur prolongée. Le sud méditerranéen offre une saison plus
        longue et plus chaude que les coteaux septentrionaux plus frais.
  - id: srhone-grenache-flavour-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","grapes"]
    status: reviewed
    source_id: c20-0016
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which flavour profile is typical of ripe Southern Rhône Grenache?"
      choices:
        - { text: "Blackcurrant, mint and firm herbaceous tannin", correct: false }
        - { text: "Concentrated red fruit with warm spice and dried-herb notes", correct: true }
        - { text: "High-acid citrus with green-apple aromas", correct: false }
        - { text: "Violet, black pepper and dense black fruit only", correct: false }
      explanation: |
        Ripe Grenache commonly shows strawberry or raspberry fruit, generous alcohol and garrigue-like spice.
        Its colour and tannin are usually moderate.
    fr:
      question: "Quel profil aromatique est typique d’un Grenache mûr du Rhône méridional ?"
      choices:
        - { text: "Cassis, menthe et tanins végétaux fermes", correct: false }
        - { text: "Fruits rouges concentrés avec épices chaudes et herbes sèches", correct: true }
        - { text: "Agrumes très acides avec arômes de pomme verte", correct: false }
        - { text: "Violette, poivre noir et fruits noirs denses uniquement", correct: false }
      explanation: |
        Le Grenache mûr présente souvent des fruits comme la fraise ou la framboise, un alcool généreux et des
        épices évoquant la garrigue. Sa couleur et ses tanins restent généralement modérés.
  - id: srhone-grenache-baked-001
    type: mcq
    deck: "France::Southern Rhône"
    tags: ["france","southern-rhone","grapes"]
    status: reviewed
    source_id: c20-0017
    review:
      fact_check: pass
