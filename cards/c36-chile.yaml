        - { text: "Atacama", correct: false }
        - { text: "Coquimbo", correct: true }
        - { text: "Central Valley", correct: false }
      explanation: |
        It is the most northerly of Chile's main wine regions, bordering the Atacama
        Desert. Choapa, the southernmost of the three, is by far the least planted.
    fr:
      question: "À quelle région viticole chilienne appartiennent les vallées d’Elqui, de Limarí et de Choapa ?"
      choices:
        - { text: "Aconcagua", correct: false }
        - { text: "Atacama", correct: false }
        - { text: "Coquimbo", correct: true }
        - { text: "Vallée Centrale", correct: false }
      explanation: |
        C’est la plus septentrionale des grandes régions viticoles du Chili, en bordure
        du désert d’Atacama. Choapa, la plus méridionale des trois vallées, est de loin
        la moins plantée.

  - id: chile-coquimbo-scale-001
    type: mcq
    deck: Chile
