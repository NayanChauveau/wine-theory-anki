        - { text: "Limarí", correct: true }
        - { text: "San Antonio", correct: false }
        - { text: "Bío-Bío", correct: false }
      explanation: |
        Le calcaire est rare au Chili ; ici, il s’allie à l’air frais venu de l’océan
        pour donner tension et élégance. Le vignoble Talinay de Tabalí, à environ 12 km
        du Pacifique sur une ancienne terrasse marine, en est un exemple connu.

  - id: chile-muscat-alexandria-001
