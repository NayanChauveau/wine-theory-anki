        - { text: "Syrah", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Carmenère", correct: true }
      explanation: |
        Nearly lost from Bordeaux after phylloxera, it survived in Chile mixed into
        vineyards sold as Merlot. Ampelographer Jean-Michel Boursiquot identified it
        there in 1994.
    fr:
      question: "Quel cépage rouge est largement promu comme le cépage emblématique du Chili ?"
      choices:
        - { text: "País", correct: false }
        - { text: "Syrah", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Carmenère", correct: true }
      explanation: |
        Presque disparu du Bordelais après le phylloxéra, il a survécu au Chili, mêlé à
        des vignes vendues comme du Merlot. L’ampélographe Jean-Michel Boursiquot l’y a
        identifié en 1994.

  - id: chile-syrah-cool-coastal-001
    type: mcq
    deck: Chile
    tags: [chile, syrah, style]
    status: reviewed
    source_id: c36-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Syrah from Chile's cooler coastal sites usually differ from Syrah grown in warm inland valleys?"
      choices:
        - { text: "Fuller body and more jammy fruit", correct: false }
        - { text: "Lighter body and peppery notes", correct: true }
        - { text: "Softer acidity and raisined fruit", correct: false }
        - { text: "Higher alcohol and sweeter tannins", correct: false }
      explanation: |
        Chile grows Syrah in a wide range of sites. The pepper note comes from
        rotundone, a compound that tends to build up in grapes ripened slowly in cool
        conditions.
    fr:
      question: "En quoi la Syrah des sites côtiers plus frais du Chili diffère-t-elle généralement de celle des vallées chaudes de l’intérieur ?"
      choices:
        - { text: "Plus de corps et un fruit plus confituré", correct: false }
        - { text: "Un corps plus léger et des notes poivrées", correct: true }
        - { text: "Une acidité plus souple et un fruit passerillé", correct: false }
        - { text: "Plus d’alcool et des tanins plus doux", correct: false }
      explanation: |
        Le Chili cultive la Syrah dans une grande diversité de sites. La note poivrée
        vient de la rotundone, un composé qui tend à s’accumuler dans les raisins mûris
        lentement en conditions fraîches.

  - id: chile-syrah-colchagua-001
    type: mcq
    deck: Chile
