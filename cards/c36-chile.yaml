        - { text: "Light, pale and low in tannin", correct: false }
        - { text: "Tannic and long-aged in new oak", correct: false }
        - { text: "Off-dry with a hint of sweetness", correct: false }
      explanation: |
        Soft tannins and plummy fruit suit supermarket price points. Fuller-bodied,
        more complex Merlot is also made, usually from lower-yielding sites and with
        some oak.
    fr:
      question: "Quel style de Merlot chilien a le mieux réussi à l’export ?"
      choices:
        - { text: "Bon marché, de corps moyen et fruité", correct: true }
        - { text: "Léger, pâle et peu tannique", correct: false }
        - { text: "Tannique et longuement élevé en fût neuf", correct: false }
        - { text: "Demi-sec, avec une légère douceur", correct: false }
      explanation: |
        Ses tanins souples et ses arômes de prune conviennent aux prix de la grande
        distribution. On produit aussi des Merlot plus corsés et plus complexes, en
        général sur des sites à rendements plus faibles et avec un peu de bois.

  - id: chile-carmenere-ripening-001
    type: mcq
    deck: Chile
    tags: [chile, carmenere, viticulture]
    status: reviewed
    source_id: c36-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which conditions does Carmenère need to succeed in Chile?"
      choices:
        - { text: "A short season on cool coastal slopes", correct: false }
        - { text: "A long, warm and sunny season", correct: true }
        - { text: "High rainfall and deep, fertile soils", correct: false }
        - { text: "Morning fog and strong afternoon winds", correct: false }
      explanation: |
        It ripens late, often weeks after Merlot. Warm inland sites give it the time
        it needs before autumn sets in.
    fr:
      question: "De quelles conditions le Carmenère a-t-il besoin pour réussir au Chili ?"
      choices:
        - { text: "Une saison courte sur des coteaux côtiers frais", correct: false }
        - { text: "Une saison longue, chaude et ensoleillée", correct: true }
        - { text: "Des pluies abondantes et des sols profonds et fertiles", correct: false }
        - { text: "Du brouillard le matin et du vent fort l’après-midi", correct: false }
      explanation: |
        Il mûrit tard, souvent plusieurs semaines après le Merlot. Les sites chauds de
        l’intérieur lui laissent le temps nécessaire avant l’arrivée de l’automne.

  - id: chile-carmenere-underripe-001
    type: mcq
    deck: Chile
    tags: [chile, carmenere, style]
    status: reviewed
    source_id: c36-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Carmenère usually taste when picked before it is fully ripe?"
      choices:
        - { text: "Jammy, with dried-fruit notes", correct: false }
        - { text: "Floral, soft and low in tannin", correct: false }
        - { text: "Green and overtly herbaceous", correct: true }
        - { text: "Light-bodied and peppery", correct: false }
      explanation: |
        Methoxypyrazines, the compounds behind green-pepper aromas, fall as grapes
        ripen. Well-made Carmenère is full-bodied and tannic, with black fruit and a
        gentle herbal note in balance rather than a green streak.
    fr:
      question: "Quel goût a généralement un Carmenère vendangé avant sa pleine maturité ?"
      choices:
        - { text: "Confituré, avec des notes de fruits secs", correct: false }
        - { text: "Floral, souple et peu tannique", correct: false }
        - { text: "Vert, aux notes franchement herbacées", correct: true }
        - { text: "Léger et poivré", correct: false }
      explanation: |
        Les méthoxypyrazines, composés responsables des arômes de poivron vert,
        diminuent à mesure que le raisin mûrit. Un Carmenère bien fait est corsé et
        tannique, avec des fruits noirs et une légère note herbacée bien intégrée,
        plutôt qu’une veine verte.

  - id: chile-carmenere-signature-001
    type: mcq
    deck: Chile
    tags: [chile, carmenere]
    status: reviewed
    source_id: c36-0027
    review:
