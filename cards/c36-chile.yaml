      choices:
        - { text: "Pinot Noir", correct: false }
        - { text: "Syrah", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
        - { text: "Chardonnay", correct: false }
      explanation: |
        It covers about 1,000 hectares there. Pinot Noir is a clear second, with
        roughly half that area.

  - id: chile-san-antonio-pinot-style-001
    type: mcq
    deck: Chile
    tags: [chile, san-antonio, pinot-noir, style]
    status: reviewed
    source_id: c36-0069
