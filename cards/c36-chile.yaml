  - id: chile-do-breadth-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, do]
    status: reviewed
    source_id: c36-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the usual criticism of Chile's traditional valley DOs as a guide to wine style?"
      choices:
        - { text: "They are too small to supply large brands", correct: false }
        - { text: "They cover very large and varied areas", correct: true }
        - { text: "They impose strict yield and ageing limits", correct: false }
        - { text: "They cannot appear on export labels", correct: false }
      explanation: |
        Cool and hot sites can sit within the same valley name, so the DO alone says little
        about style; a smaller place name on the label gives a far better clue.
    fr:
      question: "Quelle critique fait-on habituellement aux DO de vallée traditionnelles du Chili, en tant que repère de style ?"
      choices:
        - { text: "Elles sont trop petites pour fournir les grandes marques", correct: false }
        - { text: "Elles couvrent des territoires très vastes et variés", correct: true }
        - { text: "Elles imposent des limites strictes de rendement et d’élevage", correct: false }
        - { text: "Elles ne peuvent pas figurer sur les étiquettes à l’export", correct: false }
      explanation: |
        Des sites frais et des sites chauds peuvent relever du même nom de vallée : la DO
        seule renseigne peu sur le style, alors qu’un nom de lieu plus précis sur
        l’étiquette est un bien meilleur indice.

  - id: chile-reserva-terms-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, reserva]
    status: reviewed
    source_id: c36-0119
    review:
      fact_check: pass
      sources: [sag, iura-decreto-464]
    en:
      question: "What do terms such as Reserva and Gran Reserva mainly require on a Chilean label?"
      choices:
        - { text: "A minimum period of ageing before release", correct: false }
        - { text: "Grapes from a single named vineyard", correct: false }
        - { text: "Lower maximum yields per hectare", correct: false }
        - { text: "A slightly higher minimum alcohol", correct: true }
      explanation: |
        Reserva needs half a degree above the legal minimum and Gran Reserva a full degree;
        Gran Reserva must also have seen some oak, but no ageing time is set. In
        practice producers use the terms mostly to rank their own ranges.
    fr:
      question: "Qu’exigent principalement des mentions comme Reserva et Gran Reserva sur une étiquette chilienne ?"
      choices:
        - { text: "Une durée minimale d’élevage avant la mise en marché", correct: false }
        - { text: "Des raisins d’un seul vignoble nommé", correct: false }
        - { text: "Des rendements maximaux plus bas à l’hectare", correct: false }
        - { text: "Un degré d’alcool minimal un peu plus élevé", correct: true }
      explanation: |
        Reserva exige +0,5 % vol. au-dessus du minimum légal et Gran Reserva +1 % vol. ;
        un Gran Reserva doit aussi être passé par le bois, mais aucune durée d’élevage
        n’est fixée. En pratique, les producteurs se servent surtout de ces mentions pour
        hiérarchiser leurs propres gammes.
