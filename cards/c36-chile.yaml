# deck: Chile

cards:
  - id: chile-vineyard-shape-001
    type: mcq
    deck: Chile
    tags: [chile, geography]
    status: reviewed
    source_id: c36-0001
    review:
      fact_check: pass
      sources: [known-fact, trade-press]
    en:
      question: "Which description best fits the overall shape of Chile's vineyard land?"
      choices:
        - { text: "A compact block around a single river basin", correct: false }
        - { text: "Wide from east to west but short from north to south", correct: false }
        - { text: "Long from north to south but narrow from east to west", correct: true }
        - { text: "A ring of scattered oases around the Atacama Desert", correct: false }
      explanation: |
        The main valleys run from Elqui near 30° S down to Bío-Bío near 37° S, roughly
        900 km, and outlying plantings push the span further. Between the Pacific and
        the Andes there is seldom more than about 100 km of usable land.
    fr:
      question: "Quelle description correspond le mieux à la forme générale du vignoble chilien ?"
      choices:
        - { text: "Un bloc compact autour d’un seul bassin fluvial", correct: false }
        - { text: "Large d’est en ouest mais court du nord au sud", correct: false }
        - { text: "Long du nord au sud mais étroit d’est en ouest", correct: true }
        - { text: "Un chapelet d’oasis autour du désert d’Atacama", correct: false }
      explanation: |
        Les principales vallées s’étendent de l’Elqui, vers 30° S, jusqu’au Bío-Bío,
        vers 37° S, soit environ 900 km, et des plantations plus isolées allongent
        encore cette bande. Entre le Pacifique et les Andes, la largeur exploitable
        dépasse rarement une centaine de kilomètres.

  - id: chile-west-east-sequence-001
    type: mcq
    deck: Chile
    tags: [chile, geography]
    status: reviewed
    source_id: c36-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Travelling inland from the Pacific at the latitude of Santiago, in what order do you cross Chile's main landforms?"
      choices:
        - { text: "Central Valley, Coastal Range, Andes", correct: false }
        - { text: "Coastal Range, Andes, Central Valley", correct: false }
        - { text: "Andean foothills, Central Valley, Coastal Range", correct: false }
        - { text: "Coastal Range, Central Valley, Andes", correct: true }
      explanation: |
        The two mountain chains run parallel down most of the country. Around
        Santiago they draw apart, leaving a long depression between them that stretches
        south for hundreds of kilometres.
    fr:
      question: "En partant du Pacifique vers l’intérieur, à la latitude de Santiago, dans quel ordre traverse-t-on les grands reliefs du Chili ?"
      choices:
        - { text: "Vallée Centrale, cordillère de la Côte, Andes", correct: false }
        - { text: "Cordillère de la Côte, Andes, Vallée Centrale", correct: false }
        - { text: "Piémont andin, Vallée Centrale, cordillère de la Côte", correct: false }
        - { text: "Cordillère de la Côte, Vallée Centrale, Andes", correct: true }
      explanation: |
        Les deux chaînes de montagnes courent parallèlement sur presque toute la
        longueur du pays. Vers Santiago, elles s’écartent et laissent entre elles une
        longue dépression qui se prolonge vers le sud sur des centaines de kilomètres.

  - id: chile-coastal-range-gaps-001
    type: mcq
    deck: Chile
    tags: [chile, geography, climate]
    status: reviewed
    source_id: c36-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What has cut the openings through Chile's Coastal Range?"
      choices:
        - { text: "Rivers draining west from the Andes", correct: true }
        - { text: "Fault lines running north to south", correct: false }
        - { text: "Lava channels from coastal volcanoes", correct: false }
        - { text: "Glacial troughs from the last ice age", correct: false }
      explanation: |
        Each river gives its name to a wine valley: the Aconcagua, Maipo, Rapel and
        Maule all flow from the Andes to the sea, and their corridors let marine air
        reach vineyards behind the coastal hills.
    fr:
      question: "Qu’est-ce qui a ouvert des brèches dans la cordillère de la Côte chilienne ?"
      choices:
        - { text: "Des fleuves descendant des Andes vers l’ouest", correct: true }
        - { text: "Des failles orientées du nord au sud", correct: false }
        - { text: "Des coulées de lave de volcans côtiers", correct: false }
        - { text: "Des vallées glaciaires de la dernière glaciation", correct: false }
      explanation: |
        Chaque fleuve donne son nom à une vallée viticole : l’Aconcagua, le Maipo, le
        Rapel et le Maule descendent tous des Andes jusqu’à la mer, et leurs couloirs
        laissent l’air marin atteindre les vignes situées derrière les collines
        côtières.

  - id: chile-climate-type-001
    type: mcq
    deck: Chile
    tags: [chile, climate]
    status: reviewed
    source_id: c36-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is the climate of Chile's main central wine valleys usually classed?"
      choices:
        - { text: "Cool maritime", correct: false }
        - { text: "Warm Mediterranean", correct: true }
        - { text: "Moderate continental", correct: false }
        - { text: "Hot continental", correct: false }
      explanation: |
        Most rain falls in the southern-hemisphere winter, from about May to August,
        while the growing season is long, sunny and largely rain-free. Local cooling
        from the ocean and the mountains then decides how warm each site really is.
    fr:
      question: "Comment classe-t-on généralement le climat des grandes vallées viticoles du centre du Chili ?"
      choices:
        - { text: "Maritime frais", correct: false }
        - { text: "Méditerranéen chaud", correct: true }
        - { text: "Continental modéré", correct: false }
        - { text: "Continental chaud", correct: false }
      explanation: |
        L’essentiel des pluies tombe pendant l’hiver austral, de mai à août environ,
        tandis que la saison de végétation est longue, ensoleillée et presque sans
        pluie. Les influences rafraîchissantes de l’océan et des montagnes décident
        ensuite de la chaleur réelle de chaque site.

  - id: chile-dry-summer-disease-001
    type: mcq
    deck: Chile
    tags: [chile, climate, vine-health]
    status: reviewed
    source_id: c36-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main viticultural advantage of Chile's dry growing season?"
      choices:
        - { text: "Larger berries and higher yields", correct: false }
        - { text: "Slower, later ripening", correct: false }
        - { text: "Higher natural acidity at harvest", correct: false }
        - { text: "Low fungal disease pressure", correct: true }
      explanation: |
        Mildew and rot spores need moisture on leaves and bunches to germinate. With
        little summer rain, growers spray less often, which also makes organic farming
        easier than in damp regions.
    fr:
      question: "Quel est le principal avantage viticole de la saison de végétation sèche du Chili ?"
      choices:
        - { text: "Des baies plus grosses et des rendements plus élevés", correct: false }
        - { text: "Une maturation plus lente et plus tardive", correct: false }
        - { text: "Une acidité naturelle plus élevée à la vendange", correct: false }
        - { text: "Une faible pression des maladies cryptogamiques", correct: true }
      explanation: |
        Les spores du mildiou et de la pourriture ont besoin d’humidité sur les feuilles
        et les grappes pour germer. Avec peu de pluie en été, les viticulteurs traitent
        moins souvent, ce qui facilite aussi la conduite en bio par rapport aux régions
        humides.

  - id: chile-irrigation-snowmelt-001
    type: mcq
    deck: Chile
    tags: [chile, climate, irrigation]
    status: reviewed
    source_id: c36-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does most of the irrigation water for vineyards in Chile's central valleys come from?"
      choices:
        - { text: "Summer rain falling on the Coastal Range", correct: false }
        - { text: "Rivers fed by Andean snow and ice", correct: true }
        - { text: "Groundwater from beneath the Atacama", correct: false }
        - { text: "Winter rain stored on the valley floors", correct: false }
      explanation: |
        Snow builds up on the high Andes in winter and melts through spring and summer,
        just when vines need water. Furrow irrigation from canals was the traditional
        method; drip systems now dominate in newer plantings.
    fr:
      question: "D’où vient l’essentiel de l’eau d’irrigation des vignobles des vallées centrales du Chili ?"
      choices:
        - { text: "Des pluies d’été tombées sur la cordillère de la Côte", correct: false }
        - { text: "Des fleuves nourris par la neige et la glace andines", correct: true }
        - { text: "Des nappes souterraines situées sous l’Atacama", correct: false }
        - { text: "Des pluies d’hiver stockées au fond des vallées", correct: false }
      explanation: |
        La neige s’accumule l’hiver sur les hauts sommets andins et fond au printemps et
        en été, juste quand la vigne a besoin d’eau. L’irrigation à la raie depuis des
        canaux était la méthode traditionnelle ; le goutte-à-goutte domine désormais
        dans les plantations récentes.

  - id: chile-south-cooler-wetter-001
    type: mcq
    deck: Chile
    tags: [chile, climate, southern-regions]
    status: reviewed
    source_id: c36-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with the Maipo Valley, what are growing conditions like in Chile's southern valleys such as Bío-Bío?"
      choices:
        - { text: "Warmer and drier", correct: false }
        - { text: "Cooler and drier", correct: false }
        - { text: "Cooler and wetter", correct: true }
        - { text: "Warmer and wetter", correct: false }
      explanation: |
        Moving south takes vineyards further from the subtropical high-pressure zone
        and closer to the westerly storm track. Old dry-farmed vines in parts of the
        south can survive without irrigation for that reason.
    fr:
      question: "Par rapport à la vallée du Maipo, comment sont les conditions de culture dans les vallées du sud du Chili, comme le Bío-Bío ?"
      choices:
        - { text: "Plus chaudes et plus sèches", correct: false }
        - { text: "Plus fraîches et plus sèches", correct: false }
        - { text: "Plus fraîches et plus humides", correct: true }
        - { text: "Plus chaudes et plus humides", correct: false }
      explanation: |
        En descendant vers le sud, les vignobles s’éloignent de la zone de hautes
        pressions subtropicales et se rapprochent de la trajectoire des tempêtes
        d’ouest. C’est pourquoi, dans certaines parties du sud, de vieilles vignes
        non irriguées parviennent à survivre.

  - id: chile-el-nino-rain-001
    type: mcq
    deck: Chile
    tags: [chile, climate, vintage]
    status: reviewed
    source_id: c36-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does an El Niño year typically bring to Chile's wine regions?"
      choices:
        - { text: "Severe drought", correct: false }
        - { text: "Stronger cooling from the Humboldt Current", correct: false }
        - { text: "Much heavier rainfall", correct: true }
        - { text: "A hotter, rain-free harvest", correct: false }
      explanation: |
        El Niño is a Pacific-wide pattern: warmer surface water off South America
        weakens the cold upwelling and steers more storms over central Chile. Its
        opposite phase, La Niña, tends to bring drought instead.
    fr:
      question: "Qu’apporte généralement une année El Niño aux régions viticoles du Chili ?"
      choices:
        - { text: "Une sécheresse sévère", correct: false }
        - { text: "Un rafraîchissement accru par le courant de Humboldt", correct: false }
        - { text: "Des pluies bien plus abondantes", correct: true }
        - { text: "Une vendange plus chaude et sans pluie", correct: false }
      explanation: |
        El Niño est un phénomène qui concerne tout le Pacifique : des eaux de surface
        plus chaudes au large de l’Amérique du Sud affaiblissent la remontée d’eau
        froide et dirigent davantage de tempêtes vers le centre du Chili. Sa phase
        opposée, La Niña, tend au contraire à apporter la sécheresse.

  - id: chile-humboldt-direction-001
    type: mcq
    deck: Chile
    tags: [chile, climate, humboldt]
    status: reviewed
    source_id: c36-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which direction does the Humboldt Current flow along Chile's coast?"
      choices:
        - { text: "Southward, from equatorial waters", correct: false }
        - { text: "Northward, from Antarctic waters", correct: true }
        - { text: "Eastward, from the central South Pacific", correct: false }
        - { text: "Westward, away from the Chilean coast", correct: false }
      explanation: |
        Offshore winds also push surface water away from the coast, so colder water
        wells up from the depths. The sea therefore stays chilly even in midsummer,
        cooling the air that blows inland.
    fr:
      question: "Dans quelle direction le courant de Humboldt longe-t-il la côte chilienne ?"
      choices:
        - { text: "Vers le sud, depuis les eaux équatoriales", correct: false }
        - { text: "Vers le nord, depuis les eaux antarctiques", correct: true }
        - { text: "Vers l’est, depuis le centre du Pacifique Sud", correct: false }
        - { text: "Vers l’ouest, en s’éloignant de la côte chilienne", correct: false }
      explanation: |
        Les vents de terre poussent aussi les eaux de surface vers le large, si bien que
        de l’eau plus froide remonte des profondeurs. La mer reste donc froide même au
        cœur de l’été et rafraîchit l’air qui souffle vers l’intérieur des terres.

  - id: chile-humboldt-low-coast-001
    type: mcq
    deck: Chile
    tags: [chile, climate, humboldt, costa]
    status: reviewed
    source_id: c36-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where in Chile's wine valleys is the cooling effect of Pacific winds strongest?"
      choices:
        - { text: "On the Central Valley floor south of Santiago", correct: false }
        - { text: "On the eastern side of the highest coastal peaks", correct: false }
        - { text: "In the Andean foothills above 800 metres", correct: false }
        - { text: "Near the sea, where the coastal hills are low", correct: true }
      explanation: |
        Where the coastal hills are low and close to the shore, afternoon winds arrive
        almost unchecked. Higher ridges further inland block much of that air, so
        nearby sites behind them can be markedly warmer.
    fr:
      question: "Dans les vallées viticoles chiliennes, où l’effet rafraîchissant des vents du Pacifique est-il le plus marqué ?"
      choices:
        - { text: "Au fond de la Vallée Centrale, au sud de Santiago", correct: false }
        - { text: "Sur le versant est des plus hauts sommets côtiers", correct: false }
        - { text: "Dans le piémont andin, au-dessus de 800 mètres", correct: false }
        - { text: "Près de la mer, où les collines côtières sont basses", correct: true }
      explanation: |
        Là où les collines côtières sont basses et proches du rivage, les vents
        d’après-midi arrivent presque sans obstacle. Plus à l’intérieur, des crêtes plus
        élevées bloquent une grande partie de cet air, si bien que les sites voisins
        abrités derrière elles peuvent être nettement plus chauds.

  - id: chile-andes-night-air-001
    type: mcq
    deck: Chile
    tags: [chile, climate, andes]
    status: reviewed
    source_id: c36-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What gives vineyards in Chile's Andean foothills an especially wide day–night temperature range?"
      choices:
        - { text: "Afternoon fog drifting in from the Pacific", correct: false }
        - { text: "Cold air flowing down from the mountains at night", correct: true }
        - { text: "Cloud banks that block the morning sun", correct: false }
        - { text: "Breezes off large high-altitude lakes", correct: false }
      explanation: |
        Dense, chilled air slides downslope after sunset and settles over the vines.
        Puente Alto in Alto Maipo is a classic example: hot days build ripe fruit,
        while cool nights help the grapes keep acidity and colour.
    fr:
      question: "Qu’est-ce qui donne aux vignobles du piémont andin chilien un écart de température jour–nuit particulièrement marqué ?"
      choices:
        - { text: "Le brouillard d’après-midi venu du Pacifique", correct: false }
        - { text: "L’air froid qui descend des montagnes la nuit", correct: true }
        - { text: "Des bancs de nuages qui masquent le soleil du matin", correct: false }
        - { text: "Les brises de grands lacs d’altitude", correct: false }
      explanation: |
        L’air dense et refroidi glisse le long des pentes après le coucher du soleil et
        se pose sur les vignes. Puente Alto, dans l’Alto Maipo, en est un exemple
        classique : les journées chaudes donnent des fruits mûrs, tandis que les nuits
        fraîches aident les raisins à garder acidité et couleur.

  - id: chile-central-valley-floor-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, viticulture]
    status: reviewed
    source_id: c36-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why has the floor of Chile's Central Valley long supplied much of the country's volume wine?"
      choices:
        - { text: "Cool ocean breezes slow ripening on the flat land", correct: false }
        - { text: "Summer rain is reliable enough to avoid irrigation", correct: false }
        - { text: "Its broad, flat land is sheltered and easy to farm", correct: true }
        - { text: "Its poor, stony soils keep vigour naturally low", correct: false }
      explanation: |
        Mechanisation and canal irrigation are simple on level ground, so big crops
        are cheap to grow. The shelter cuts both ways: warm, settled conditions suit
        fruity everyday reds more than taut, fresh whites.
    fr:
      question: "Pourquoi le fond de la Vallée Centrale fournit-il depuis longtemps une grande partie des vins de volume du Chili ?"
      choices:
        - { text: "Les brises océaniques fraîches y ralentissent la maturation", correct: false }
        - { text: "Les pluies d’été y suffisent pour se passer d’irrigation", correct: false }
        - { text: "Ses terres larges et plates sont abritées et faciles à cultiver", correct: true }
        - { text: "Ses sols pauvres et caillouteux limitent naturellement la vigueur", correct: false }
      explanation: |
        La mécanisation et l’irrigation par canaux sont simples sur un terrain plat, si
        bien que les gros rendements y coûtent peu. Cet abri a son revers : des
        conditions chaudes et stables conviennent mieux aux rouges fruités de tous les
        jours qu’aux blancs tendus et frais.

  - id: chile-costa-andes-terms-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, do]
    status: reviewed
    source_id: c36-0017
    review:
      fact_check: pass
      sources: [iura-decreto-464, trade-press, decanter]
    en:
      question: "Which three optional label terms show a Chilean wine's east–west position within its valley?"
      choices:
        - { text: "Bajo, Medio and Alto", correct: false }
        - { text: "Litoral, Interior and Montaña", correct: false }
        - { text: "Poniente, Centro and Oriente", correct: false }
        - { text: "Costa, Entre Cordilleras and Andes", correct: true }
      explanation: |
        They were added to the DO rules in 2011. Chile's valley DOs are stacked one
        after another down the country, and each stretches from the coast towards the
        Andes, so a single valley name can cover sites with very different exposure
        to the sea and the mountains. The terms appear alongside the valley name, and
        at least 85% of the wine must come from qualifying areas.
    fr:
      question: "Quelles trois mentions facultatives d’étiquette indiquent la position est–ouest d’un vin chilien au sein de sa vallée ?"
      choices:
        - { text: "Bajo, Medio et Alto", correct: false }
        - { text: "Litoral, Interior et Montaña", correct: false }
        - { text: "Poniente, Centro et Oriente", correct: false }
        - { text: "Costa, Entre Cordilleras et Andes", correct: true }
      explanation: |
        Elles ont été ajoutées à la réglementation des DO en 2011. Les DO de vallée
        chiliennes se succèdent du nord au sud du pays, et chacune s’étire de la côte
        vers les Andes : un même nom de vallée peut donc couvrir des sites très
        diversement exposés à la mer et aux montagnes. Ces mentions figurent à côté du
        nom de la vallée, et au moins 85 % du vin doit provenir des zones concernées.

  - id: chile-emiliana-organic-001
    type: mcq
    deck: Chile
    tags: [chile, sustainability, organic, producers]
    status: reviewed
    source_id: c36-0019
    review:
      fact_check: pass
      sources: [producer-site, wines-of-chile, trade-press, wineanorak]
    en:
      question: "Which Chilean winery, advised by viticulturist Álvaro Espinoza, became a leading name in organic and biodynamic farming?"
      choices:
        - { text: "Santa Rita", correct: false }
        - { text: "Errázuriz", correct: false }
        - { text: "Emiliana", correct: true }
        - { text: "Montes", correct: false }
      explanation: |
        Its conversion began in the late 1990s, and its red blend Coyam (first vintage
        2001) was among the first organic wines it released. Pioneers like this,
        backed by industry bodies, made sustainable methods mainstream; a national
        Sustainability Code followed in 2011.
    fr:
      question: "Quel domaine chilien, conseillé par le consultant en viticulture Álvaro Espinoza, est devenu une référence de la culture biologique et biodynamique ?"
      choices:
        - { text: "Santa Rita", correct: false }
        - { text: "Errázuriz", correct: false }
        - { text: "Emiliana", correct: true }
        - { text: "Montes", correct: false }
      explanation: |
        Sa conversion a commencé à la fin des années 1990, et son assemblage rouge Coyam
        (premier millésime 2001) a figuré parmi ses premiers vins biologiques. Des
        pionniers de ce type, soutenus par les organismes de la filière, ont fait entrer
        les méthodes durables dans la pratique courante ; un code national de durabilité
        a suivi en 2011.

  - id: chile-most-planted-001
    type: mcq
    deck: Chile
    tags: [chile, grapes, cabernet-sauvignon]
    status: reviewed
    source_id: c36-0020
    review:
      fact_check: pass
      sources: [sag-catastro-2022, usda-fas, odepa]
    en:
      question: "Which grape covers the largest vineyard area in Chile?"
      choices:
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "País", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Carmenère", correct: false }
      explanation: |
        The 2022 national vineyard survey put it at about 37,000 ha, close to 29% of
        all wine-grape plantings. Merlot, País and Carmenère each had only a little
        over 10,000 ha.
    fr:
      question: "Quel cépage occupe la plus grande surface de vignoble au Chili ?"
      choices:
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "País", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Carmenère", correct: false }
      explanation: |
        Le recensement national du vignoble de 2022 lui attribuait environ 37 000 ha,
        soit près de 29 % de l’ensemble des cépages de cuve. Le Merlot, le País et le
        Carmenère dépassaient chacun à peine 10 000 ha.

  - id: chile-cabernet-herbaceous-001
    type: mcq
    deck: Chile
    tags: [chile, cabernet-sauvignon, style]
    status: reviewed
    source_id: c36-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Alongside very ripe black fruit, which character often appears in premium Chilean Cabernet Sauvignon?"
      choices:
        - { text: "A floral, violet lift", correct: false }
        - { text: "A dried-fig, raisined note", correct: false }
        - { text: "A smoky, struck-match note", correct: false }
        - { text: "A herbaceous, minty edge", correct: true }
      explanation: |
        Chilean Cabernet ranges from simple fruity bottles to concentrated, oak-aged
        wines built to age. The green note is linked to pyrazines in the grapes; a
        eucalyptus-like edge can also come from trees planted near some vineyards.
    fr:
      question: "Outre des fruits noirs très mûrs, quel caractère trouve-t-on souvent dans les Cabernet Sauvignon chiliens haut de gamme ?"
      choices:
        - { text: "Une touche florale de violette", correct: false }
        - { text: "Une note de figue sèche, passerillée", correct: false }
        - { text: "Une note fumée, d’allumette craquée", correct: false }
        - { text: "Une pointe herbacée, mentholée", correct: true }
      explanation: |
        Le Cabernet chilien va du vin simple et fruité aux cuvées concentrées, élevées
        en fût et faites pour vieillir. La note verte est liée aux pyrazines du raisin ;
        une touche d’eucalyptus peut aussi venir d’arbres plantés près de certains
        vignobles.

