    en:
      question: "Which profile is typical of Pinot Noir from the coolest sites of the San Antonio Valley?"
      choices:
        - { text: "Black cherry, mocha and high alcohol", correct: false }
        - { text: "Stewed plum, raisin and soft acidity", correct: false }
        - { text: "Dark berry, vanilla and firm tannin", correct: false }
        - { text: "Red berry fruit with herbal notes", correct: true }
      explanation: |
        Slow ripening under ocean influence keeps the fruit in the fresh red range;
        the herbal tone shows where sites are coolest or yields are high.

  - id: chile-casablanca-syrah-east-001
    type: mcq
    deck: Chile
    tags: [chile, casablanca, syrah]
    status: reviewed
    source_id: c36-0070
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which red grape does particularly well in the warmer eastern sites of the Casablanca Valley?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Syrah", correct: true }
        - { text: "Carmenère", correct: false }
        - { text: "Pinot Noir", correct: false }
      explanation: |
        The eastern end lies furthest from the sea, so it gets more warmth than the
        western blocks. That is enough to ripen this grape into structured wines with
        a peppery edge, but not enough for later varieties.

  - id: chile-central-valley-majority-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, plantings]
    status: reviewed
    source_id: c36-0073
    review:
      fact_check: pass
      sources: [wines-of-chile]
    en:
      question: "Which Chilean wine region holds most of the country's vineyard area?"
      choices:
        - { text: "Aconcagua", correct: false }
        - { text: "Central Valley", correct: true }
        - { text: "Southern Regions", correct: false }
        - { text: "Coquimbo", correct: false }
      explanation: |
        It has done so since the industry began. Maule alone has more vineyard area
        than any other single valley in Chile.

  - id: chile-central-valley-volume-grapes-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, merlot, chardonnay, commercial]
    status: reviewed
    source_id: c36-0075
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two grapes are often behind the inexpensive, fruity wines of Chile's Central Valley?"
      choices:
        - { text: "Pinot Noir and Riesling", correct: false }
        - { text: "Carignan and Cinsault", correct: false }
        - { text: "Syrah and Viognier", correct: false }
        - { text: "Merlot and Chardonnay", correct: true }
      explanation: |
        Warmth, fertile soils and irrigation allow generous yields of soft, fruity
        varietal wine at entry prices, much of it sold under large export brands.

  - id: chile-central-valley-subregions-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, geography]
    status: reviewed
    source_id: c36-0076
    review:
      fact_check: pass
      sources: [sag]
    en:
      question: "Rapel, Curicó and Maule share the Central Valley region with which fourth sub-region?"
      choices:
        - { text: "Aconcagua", correct: false }
        - { text: "Cachapoal", correct: false }
        - { text: "Maipo", correct: true }
        - { text: "Itata", correct: false }
      explanation: |
        It is the northernmost of the four and wraps around Santiago itself; the
        capital's suburbs now cover some of its historic vineyards.

  - id: chile-rapel-halves-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, rapel, geography]
    status: reviewed
    source_id: c36-0078
    review:
      fact_check: pass
      sources: [sag, wines-of-chile]
    en:
      question: "Cachapoal and Colchagua are the two halves of which larger valley?"
      choices:
        - { text: "Rapel", correct: true }
        - { text: "Maipo", correct: false }
        - { text: "Curicó", correct: false }
        - { text: "Maule", correct: false }
      explanation: |
        Cachapoal is the northern half, around Rancagua; Colchagua lies to the south,
        around Santa Cruz. Their rivers, the Cachapoal and the Tinguiririca, join to
        form the Rapel, but labels usually show the more specific valley name.

  - id: chile-maipo-heartland-001
    type: mcq
    deck: Chile
    tags: [chile, maipo, history]
    status: reviewed
    source_id: c36-0079
    review:
      fact_check: pass
      sources: [producer-site]
    en:
      question: "Why did the Maipo Valley become the historic heart of Chilean wine?"
      choices:
        - { text: "Its fog-cooled coastal sites", correct: false }
        - { text: "Its closeness to Santiago", correct: true }
        - { text: "Its reliable summer rainfall", correct: false }
        - { text: "Its old, dry-farmed vineyards", correct: false }
      explanation: |
        Wealthy Santiago families founded estates on the edge of the capital in the
        nineteenth century; Cousiño Macul, set up in 1856, still farms land there.

  - id: chile-maipo-shelter-001
    type: mcq
    deck: Chile
    tags: [chile, maipo, climate]
    status: reviewed
    source_id: c36-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does little ocean influence reach the main Maipo vineyards south of Santiago?"
      choices:
        - { text: "The coast lies over 300 km away", correct: false }
        - { text: "The Humboldt Current is warm here", correct: false }
        - { text: "Winds blow from the east all day", correct: false }
        - { text: "Mountains almost encircle the valley", correct: true }
      explanation: |
        The sea is only about 100 km west, but hills of the coastal range block most
        marine air. Western Maipo has newer coastal plantings, but they are a small
        share of the valley.

  - id: chile-cachapoal-climate-001
    type: mcq
    deck: Chile
    tags: [chile, rapel, cachapoal, climate]
    status: reviewed
    source_id: c36-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description best fits the climate of the Cachapoal Valley?"
      choices:
        - { text: "Cool, with daily coastal fog", correct: false }
        - { text: "Warm, and shut off from sea breezes", correct: true }
        - { text: "Cool and wet, with autumn rains", correct: false }
        - { text: "Dry, high and desert-bright", correct: false }
      explanation: |
        Hills of the coastal range stand between the valley and the Pacific, so
        afternoons stay hot and late varieties ripen without trouble.

  - id: chile-cachapoal-carmenere-001
    type: mcq
    deck: Chile
    tags: [chile, rapel, cachapoal, carmenere]
    status: reviewed
    source_id: c36-0087
    review:
      fact_check: pass
      sources: [wines-of-chile, producer-site]
    en:
      question: "Which grape is the warm floor of the Cachapoal Valley best known for?"
      choices:
        - { text: "Pinot Noir", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Carignan", correct: false }
        - { text: "Carmenère", correct: true }
      explanation: |
        This late ripener needs the heat the sheltered valley floor provides. Concha
        y Toro's Carmín de Peumo comes from its old Peumo vineyard, beside the
        Cachapoal River.

  - id: chile-cachapoal-east-001
    type: mcq
    deck: Chile
    tags: [chile, rapel, cachapoal, cabernet-sauvignon, syrah]
    status: reviewed
    source_id: c36-0087
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where in the Cachapoal Valley do Cabernet Sauvignon and Syrah perform best?"
      choices:
        - { text: "At the cooler eastern end", correct: true }
        - { text: "On the warm central floor", correct: false }
        - { text: "At the breezy western end", correct: false }
        - { text: "On the low northern plain", correct: false }
      explanation: |
        The land climbs toward the Andes there, so nights are fresher and the season
        runs longer. That suits wines built on structure rather than sheer ripeness.

  - id: chile-colchagua-vs-cachapoal-001
    type: mcq
    deck: Chile
    tags: [chile, rapel, colchagua, cachapoal, climate]
    status: reviewed
    source_id: c36-0088
    review:
      fact_check: pass
      sources: [wines-of-chile]
    en:
      question: "Compared with the Cachapoal Valley, what sets the Colchagua Valley apart?"
      choices:
        - { text: "Smaller, and more sheltered from the sea", correct: false }
        - { text: "Higher, and closer to the Andes", correct: false }
        - { text: "Larger, and partly open to ocean air", correct: true }
        - { text: "Cooler, and largely fog-bound", correct: false }
      explanation: |
        Colchagua is also more varied. Its warm centre still gets some Pacific
        influence, which grows as the valley runs west toward the coast.

  - id: chile-colchagua-apalta-001
    type: mcq
    deck: Chile
    tags: [chile, rapel, colchagua, apalta]
    status: reviewed
    source_id: c36-0092
    review:
      fact_check: pass
      sources: [producer-site]
    en:
      question: "As Colchagua plantings climbed the valley slopes, which hillside area gained a premium reputation?"
      choices:
        - { text: "Puente Alto", correct: false }
        - { text: "Apalta", correct: true }
        - { text: "Peumo", correct: false }
        - { text: "Leyda", correct: false }
      explanation: |
        Its vines fill a horseshoe of granitic hills north of the Tinguiririca River.
        Montes named its Syrah "Folly" because neighbours thought planting such
        steep slopes was mad; Lapostolle's Clos Apalta comes from the same bowl.

  - id: chile-colchagua-west-whites-001
    type: mcq
    deck: Chile
    tags: [chile, rapel, colchagua, white]
    status: reviewed
    source_id: c36-0093
    review:
      fact_check: pass
      sources: [producer-site]
    en:
      question: "Which style increasingly stands out from Colchagua's western reaches toward the Pacific?"
      choices:
        - { text: "Old-vine Carignan", correct: false }
        - { text: "High-quality whites", correct: true }
        - { text: "Inexpensive blended reds", correct: false }
        - { text: "Late-harvest sweet wines", correct: false }
      explanation: |
        Paredones, only a few kilometres from the sea, is the best-known example;
        Casa Silva's Cool Coast Sauvignon Blanc comes from there.

  - id: chile-maule-southernmost-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, maule, geography]
    status: reviewed
    source_id: c36-0094
    review:
      fact_check: pass
      sources: [sag]
    en:
      question: "Which valley is the southernmost sub-region of Chile's Central Valley region?"
      choices:
        - { text: "Curicó", correct: false }
        - { text: "Itata", correct: false }
        - { text: "Colchagua", correct: false }
        - { text: "Maule", correct: true }
      explanation: |
        Together with Curicó, its northern neighbour, it forms the southern end of
        the region, and it is the largest valley in Chile by vineyard area.

  - id: chile-curico-maule-blends-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, curico, maule, commercial]
    status: reviewed
    source_id: c36-0095
    review:
      fact_check: pass
      sources: [known-fact, wines-of-chile]
    en:
      question: "Which pair of valleys is the main source of fruit for Chile's inexpensive blended wines?"
      choices:
        - { text: "Casablanca and San Antonio", correct: false }
        - { text: "Curicó and Maule", correct: true }
        - { text: "Elqui and Limarí", correct: false }
        - { text: "Itata and Bío-Bío", correct: false }
      explanation: |
        Warm summers and fertile soils give big, dependable crops of both red and
        white grapes. Much of Curicó's large Sauvignon Blanc area, for instance,
        goes into entry-level wine.

  - id: chile-maule-acidity-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, maule, climate, blending]
    status: reviewed
    source_id: c36-0096
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What makes Maule fruit especially useful to blenders, compared with Curicó fruit?"
      choices:
        - { text: "More sugar from a warmer climate", correct: false }
        - { text: "Deeper colour from higher altitude", correct: false }
        - { text: "Higher acidity from a cooler climate", correct: true }
        - { text: "Riper tannin from a longer season", correct: false }
      explanation: |
        Lying further south, Maule ripens a little more slowly, so a share of its
        wine can freshen softer, warmer-grown lots in a large blend.

  - id: chile-maule-old-vines-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, maule, old-vines, viticulture]
    status: reviewed
    source_id: c36-0097
    review:
      fact_check: pass
      sources: [sag, trade-press]
    en:
      question: "Where are most of the Maule Valley's old, dry-farmed vineyards found?"
      choices:
        - { text: "In the Andean foothills to the east", correct: false }
        - { text: "Around Talca, in the mid-valley", correct: false }
        - { text: "In the hills to the west", correct: true }
        - { text: "On river terraces near the Andes", correct: false }
      explanation: |
        This rain-fed area of the coastal range, around Cauquenes, is known as the
        secano interior; Chilean rules now recognise the name for traditional wines
        from País and Cinsault.

  - id: chile-maule-carignan-001
    type: mcq
    deck: Chile
    tags: [chile, central-valley, maule, carignan, old-vines]
    status: reviewed
    source_id: c36-0098
    review:
      fact_check: pass
      sources: [trade-press]
    en:
      question: "Which grape leads the old-vine revival in the Maule Valley?"
      choices:
        - { text: "Cinsault", correct: false }
        - { text: "Carignan", correct: true }
        - { text: "Carmenère", correct: false }
        - { text: "Syrah", correct: false }
      explanation: |
        Low-yielding bush vines give full-bodied, intensely concentrated wines.
        The VIGNO growers' association sets its own rules: wines must be mostly
        this grape, from dry-farmed bush vines at least 30 years old.

  - id: chile-southern-regions-members-001
    type: mcq
    deck: Chile
    tags: [chile, southern-regions, itata, bio-bio, malleco, geography]
    status: reviewed
    source_id: c36-0100
    review:
      fact_check: pass
      sources: [trade-gov, wines-of-chile]
    en:
      question: "Itata, Bío-Bío and Malleco together make up which Chilean wine region?"
      choices:
        - { text: "Southern Regions", correct: true }
        - { text: "Central Valley", correct: false }
        - { text: "Austral", correct: false }
        - { text: "Aconcagua", correct: false }
      explanation: |
        These valleys lie south of the Central Valley region. Further south still, the
        small Austral region covers newer plantings in Cautín and Osorno.

  - id: chile-itata-old-vine-grapes-001
    type: mcq
    deck: Chile
    tags: [chile, southern-region, itata, pais]
    status: reviewed
    source_id: c36-0102
    review:
      fact_check: pass
      sources: [known-fact, trade-press]
    en:
      question: "Which two grapes have traditionally dominated the old vineyards of Chile's Itata Valley?"
      choices:
        - { text: "Cabernet Sauvignon and Merlot", correct: false }
        - { text: "País and Muscat of Alexandria", correct: true }
        - { text: "Pinot Noir and Chardonnay", correct: false }
        - { text: "Carignan and Carmenère", correct: false }
      explanation: |
        Many of these vines are dry-farmed bush vines planted generations ago. País is the
        same variety as California's Mission grape and the Canary Islands' Listán Prieto,
        brought to the Americas by Spanish settlers. Bío-Bío shares the same traditional base.

  - id: chile-itata-biobio-market-001
    type: mcq
    deck: Chile
    tags: [chile, southern-region, itata, bio-bio, market]
    status: reviewed
    source_id: c36-0103
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where has most wine from Chile's Itata and Bío-Bío valleys traditionally been sold?"
      choices:
        - { text: "Bulk export to Europe", correct: false }
        - { text: "Bottled export to the USA", correct: false }
        - { text: "Within Chile itself", correct: true }
        - { text: "Across the border in Argentina", correct: false }
      explanation: |
        Much of it was inexpensive everyday wine for Chilean drinkers. Only recently have
        small-batch bottlings of old-vine País and Cinsault begun to appear on export lists.

  - id: chile-biobio-new-varieties-001
    type: mcq
    deck: Chile
    tags: [chile, southern-region, bio-bio, pinot-noir, chardonnay]
    status: reviewed
    source_id: c36-0104
    review:
      fact_check: pass
      sources: [known-fact, trade-press]
    en:
      question: "Which two grapes have shown great promise in newer plantings in Chile's Bío-Bío Valley?"
      choices:
        - { text: "Cabernet Sauvignon and Carmenère", correct: false }
        - { text: "Carignan and Grenache", correct: false }
        - { text: "Malbec and Petit Verdot", correct: false }
        - { text: "Pinot Noir and Chardonnay", correct: true }
      explanation: |
        A long, slow ripening season keeps natural acidity high, which suits early-ripening
        varieties that can turn flabby in the warmer valleys further north. Late ripeners
        risk being caught by autumn rain here.

  - id: chile-malleco-grapes-001
    type: mcq
    deck: Chile
    tags: [chile, southern-region, malleco, chardonnay, pinot-noir]
    status: reviewed
    source_id: c36-0108
    review:
      fact_check: pass
      sources: [vine-connections, decanter]
    en:
      question: "Which two grapes account for most of the small output of Chile's Malleco Valley?"
      choices:
        - { text: "Cabernet Sauvignon and Carmenère", correct: false }
        - { text: "Syrah and Viognier", correct: false }
        - { text: "Carignan and Cinsault", correct: false }
        - { text: "Chardonnay and Pinot Noir", correct: true }
      explanation: |
        Viña Aquitania put the valley on the map with its Sol de Sol Chardonnay from
        Traiguén, planted in the early 1990s and first released around 2000. Premium
        producers have since been looking at the area.

  - id: chile-do-tiers-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, do]
    status: reviewed
    source_id: c36-0109
    review:
      fact_check: pass
      sources: [sag, wipo-lex]
    en:
      question: "In Chile's Denominación de Origen hierarchy, which tier sits directly below the sub-region?"
      choices:
        - { text: "The area", correct: false }
        - { text: "The zone", correct: true }
        - { text: "The province", correct: false }
        - { text: "The district", correct: false }
      explanation: |
        The full ladder runs region, sub-region, zone, area. The area is the smallest unit and
        is usually named after a single commune.

  - id: chile-main-regions-order-001
    type: mcq
    deck: Chile
    tags: [chile, geography, regions]
    status: reviewed
    source_id: c36-0110
    review:
      fact_check: pass
      sources: [sag, wipo-lex]
    en:
      question: "Which of Chile's main wine regions lies between Coquimbo and the Central Valley?"
      choices:
        - { text: "Atacama", correct: false }
        - { text: "Southern Regions", correct: false }
        - { text: "Aconcagua", correct: true }
        - { text: "Austral", correct: false }
      explanation: |
        From north to south the four main regions are Coquimbo, Aconcagua, Central Valley and
        Southern Regions. Atacama and Austral are small fringe regions at either end with very
        little wine.

  - id: chile-subregion-count-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, do, regions]
    status: reviewed
    source_id: c36-0111
    review:
      fact_check: pass
      sources: [sag, wipo-lex, iura-decreto-464]
    en:
      question: "Across Chile's four main wine regions, how many sub-regions are there in total?"
      choices:
        - { text: "Nine", correct: false }
        - { text: "Thirteen", correct: true }
        - { text: "Seventeen", correct: false }
        - { text: "Twenty-one", correct: false }
      explanation: |
        The split is three, three, four and three from north to south, with the central
        region the only one holding four. Small fringe regions at either end of the
        country add a few more valleys of their own.

  - id: chile-subregions-valleys-001
    type: mcq
    deck: Chile
    tags: [chile, geography, do]
    status: reviewed
    source_id: c36-0112
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What geographical feature do most of Chile's wine sub-regions follow?"
      choices:
        - { text: "Strips running parallel to the coastline", correct: false }
        - { text: "River valleys running from the Andes to the Pacific", correct: true }
        - { text: "Bands of similar altitude on the Andean slopes", correct: false }
        - { text: "Soil units mapped by geological survey", correct: false }
      explanation: |
        Most take their name from the river that runs through them, as the Aconcagua,
        Maipo and Itata do.

  - id: chile-do-admin-basis-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, do]
    status: reviewed
    source_id: c36-0113
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What were the boundaries of Chile's wine regions largely drawn along?"
      choices:
        - { text: "Climate zones based on heat summation", correct: false }
        - { text: "Lines of latitude", correct: false }
        - { text: "Administrative regions", correct: true }
        - { text: "Dominant soil types", correct: false }
      explanation: |
        Coquimbo and Atacama, for instance, are the names of political regions of the
        country as well as of wine regions.

  - id: chile-do-breadth-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, do]
    status: reviewed
    source_id: c36-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the usual criticism of Chile's traditional valley DOs as a guide to wine style?"
      choices:
        - { text: "They are too small to supply large brands", correct: false }
        - { text: "They cover very large and varied areas", correct: true }
        - { text: "They impose strict yield and ageing limits", correct: false }
        - { text: "They cannot appear on export labels", correct: false }
      explanation: |
        Cool and hot sites can sit within the same valley name, so the DO alone says little
        about style; a smaller place name on the label gives a far better clue.

  - id: chile-reserva-terms-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, reserva]
    status: reviewed
    source_id: c36-0119
    review:
      fact_check: pass
      sources: [sag, iura-decreto-464]
    en:
      question: "What do terms such as Reserva and Gran Reserva mainly require on a Chilean label?"
      choices:
        - { text: "A minimum period of ageing before release", correct: false }
        - { text: "Grapes from a single named vineyard", correct: false }
        - { text: "Lower maximum yields per hectare", correct: false }
        - { text: "A slightly higher minimum alcohol", correct: true }
      explanation: |
        Reserva needs half a degree above the legal minimum and Gran Reserva a full degree;
        Gran Reserva must also have seen some oak, but no ageing time is set. In practice producers use the
        terms mostly to rank their own ranges.
