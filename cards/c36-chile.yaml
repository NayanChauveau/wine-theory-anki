      question: "What geographical feature do most of Chile's wine sub-regions follow?"
      choices:
        - { text: "Strips running parallel to the coastline", correct: false }
        - { text: "River valleys running from the Andes to the Pacific", correct: true }
        - { text: "Bands of similar altitude on the Andean slopes", correct: false }
        - { text: "Soil units mapped by geological survey", correct: false }
      explanation: |
        Most take their name from the river that runs through them, as the Aconcagua,
        Maipo and Itata do.
    fr:
      question: "Quel élément géographique la plupart des sous-régions viticoles chiliennes suivent-elles ?"
      choices:
        - { text: "Des bandes parallèles au littoral", correct: false }
        - { text: "Des vallées fluviales allant des Andes au Pacifique", correct: true }
        - { text: "Des étages d’altitude sur les pentes andines", correct: false }
        - { text: "Des unités de sol cartographiées par les géologues", correct: false }
      explanation: |
        La plupart portent le nom du fleuve qui les traverse, comme l’Aconcagua, le Maipo
        ou l’Itata.

