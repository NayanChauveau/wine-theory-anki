        - { text: "Dans la plaine basse, au nord", correct: false }
      explanation: |
        Le terrain s’y élève vers les Andes : les nuits sont plus fraîches et la saison
        dure plus longtemps. Cela convient à des vins bâtis sur la structure plutôt que
        sur la seule maturité.

