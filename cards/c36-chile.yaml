      choices:
        - { text: "Casablanca", correct: false }
        - { text: "Elqui", correct: false }
        - { text: "Colchagua", correct: true }
        - { text: "Bío-Bío", correct: false }
      explanation: |
        Ses coteaux chauds et ensoleillés allient chaleur et bon drainage : la Syrah y
        mûrit pleinement et gagne en concentration. Les vallées côtières et
        septentrionales, plus fraîches, donnent un style plus léger et plus poivré.

