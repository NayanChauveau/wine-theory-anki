  - id: chile-do-tiers-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, do]
    status: reviewed
    source_id: c36-0109
    review:
      fact_check: pass
      sources: [sag, wipo-lex]
    en:
      question: "In Chile's Denominación de Origen hierarchy, which tier sits directly below the sub-region?"
      choices:
        - { text: "The area", correct: false }
        - { text: "The zone", correct: true }
        - { text: "The province", correct: false }
        - { text: "The district", correct: false }
      explanation: |
        The full ladder runs region, sub-region, zone, area. The area is the smallest unit and
        is usually named after a single commune.
    fr:
      question: "Dans la hiérarchie des Denominación de Origen chiliennes, quel niveau se trouve juste en dessous de la sous-région ?"
      choices:
        - { text: "L’aire", correct: false }
        - { text: "La zone", correct: true }
        - { text: "La province", correct: false }
        - { text: "Le district", correct: false }
      explanation: |
        L’échelle complète va de la région à la sous-région, puis à la zone et enfin à
        l’aire. L’aire est la plus petite unité et porte généralement le nom d’une seule
        commune.

  - id: chile-main-regions-order-001
    type: mcq
    deck: Chile
    tags: [chile, geography, regions]
    status: reviewed
    source_id: c36-0110
    review:
      fact_check: pass
      sources: [sag, wipo-lex]
    en:
      question: "Which of Chile's main wine regions lies between Coquimbo and the Central Valley?"
      choices:
        - { text: "Atacama", correct: false }
        - { text: "Southern Regions", correct: false }
        - { text: "Aconcagua", correct: true }
        - { text: "Austral", correct: false }
      explanation: |
        From north to south the four main regions are Coquimbo, Aconcagua, Central Valley and
        Southern Regions. Atacama and Austral are small fringe regions at either end with very
        little wine.
    fr:
      question: "Quelle grande région viticole chilienne se situe entre Coquimbo et la Vallée Centrale ?"
      choices:
        - { text: "Atacama", correct: false }
        - { text: "Régions du Sud", correct: false }
        - { text: "Aconcagua", correct: true }
        - { text: "Austral", correct: false }
      explanation: |
        Du nord au sud, les quatre grandes régions sont Coquimbo, Aconcagua, Vallée
        Centrale et Régions du Sud. Atacama et Austral sont de petites régions
        périphériques, aux deux extrémités, qui produisent très peu de vin.

  - id: chile-subregion-count-001
    type: mcq
    deck: Chile
    tags: [chile, labelling, do, regions]
    status: reviewed
    source_id: c36-0111
    review:
      fact_check: pass
      sources: [sag, wipo-lex, iura-decreto-464]
    en:
      question: "Across Chile's four main wine regions, how many sub-regions are there in total?"
      choices:
        - { text: "Nine", correct: false }
        - { text: "Thirteen", correct: true }
        - { text: "Seventeen", correct: false }
        - { text: "Twenty-one", correct: false }
      explanation: |
        The split is three, three, four and three from north to south, with the central
        region the only one holding four. Small fringe regions at either end of the
        country add a few more valleys of their own.
    fr:
      question: "Combien de sous-régions compte-t-on au total dans les quatre grandes régions viticoles du Chili ?"
      choices:
        - { text: "Neuf", correct: false }
        - { text: "Treize", correct: true }
        - { text: "Dix-sept", correct: false }
        - { text: "Vingt et une", correct: false }
      explanation: |
        Elles se répartissent en trois, trois, quatre et trois du nord au sud : la région
        centrale est la seule à en compter quatre. Les petites régions périphériques, aux
        deux extrémités du pays, ajoutent quelques vallées.

  - id: chile-subregions-valleys-001
    type: mcq
