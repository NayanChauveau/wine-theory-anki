        - { text: "Large in area and mostly bulk wine", correct: false }
        - { text: "Large in area and mostly premium", correct: false }
        - { text: "Small in area and mostly premium", correct: true }
      explanation: |
        Much of the region's vineyard land grows grapes for Pisco rather than for
        table wine, so wine plantings stay modest and focus on ambitious bottlings.
    fr:
      question: "Comment résumer la production de vin de la région de Coquimbo, au Chili ?"
      choices:
        - { text: "Petites surfaces, surtout du vin en vrac", correct: false }
        - { text: "Grandes surfaces, surtout du vin en vrac", correct: false }
        - { text: "Grandes surfaces, surtout du haut de gamme", correct: false }
        - { text: "Petites surfaces, surtout du haut de gamme", correct: true }
      explanation: |
        Une grande partie du vignoble de la région produit des raisins pour le pisco
        plutôt que pour le vin de table : les plantations destinées au vin restent
        modestes et visent des cuvées ambitieuses.

  - id: chile-coquimbo-cooling-001
    type: mcq
    deck: Chile
    tags: [chile, coquimbo, climate]
    status: reviewed
    source_id: c36-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What tempers the brilliant sunshine in the valleys of Chile's Coquimbo region?"
      choices:
        - { text: "Frequent summer rain", correct: false }
        - { text: "Persistent cloud cover", correct: false }
        - { text: "Sea breezes and cold mountain air", correct: true }
        - { text: "Shade from steep valley walls", correct: false }
      explanation: |
        The valleys run west to east, so ocean air funnels in by day while air off
        the high Andes chills the vines at night. Each valley differs in detail, but
        all share this pattern.
    fr:
      question: "Qu’est-ce qui tempère l’ensoleillement éclatant des vallées de la région de Coquimbo, au Chili ?"
      choices:
        - { text: "Des pluies d’été fréquentes", correct: false }
        - { text: "Une couverture nuageuse persistante", correct: false }
        - { text: "Les brises marines et l’air froid des Andes", correct: true }
        - { text: "L’ombre des versants abrupts des vallées", correct: false }
      explanation: |
        Les vallées sont orientées d’ouest en est : l’air océanique s’y engouffre le
        jour, tandis que l’air descendu des hautes Andes refroidit les vignes la nuit.
        Chaque vallée a ses nuances, mais toutes suivent ce schéma.

  - id: chile-elqui-altitude-001
    type: mcq
