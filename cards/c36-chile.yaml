        - { text: "Bottled export to the USA", correct: false }
        - { text: "Within Chile itself", correct: true }
        - { text: "Across the border in Argentina", correct: false }
      explanation: |
        Much of it was inexpensive everyday wine for Chilean drinkers. Only recently have
        small-batch bottlings of old-vine País and Cinsault begun to appear on export lists.
    fr:
      question: "Où la majeure partie des vins des vallées d’Itata et de Bío-Bío a-t-elle traditionnellement été vendue ?"
      choices:
        - { text: "En vrac, à l’export vers l’Europe", correct: false }
        - { text: "En bouteille, à l’export vers les États-Unis", correct: false }
        - { text: "Sur le marché intérieur chilien", correct: true }
        - { text: "En Argentine, de l’autre côté de la frontière", correct: false }
      explanation: |
        Il s’agissait surtout de vin courant bon marché, bu par les Chiliens. Ce n’est que
        récemment que de petites cuvées de País et de Cinsault de vieilles vignes ont
        commencé à apparaître à l’export.

  - id: chile-biobio-new-varieties-001
    type: mcq
    deck: Chile
    tags: [chile, southern-regions, bio-bio, pinot-noir, chardonnay]
    status: reviewed
    source_id: c36-0104
    review:
      fact_check: pass
      sources: [known-fact, trade-press]
    en:
      question: "Which two grapes have shown great promise in newer plantings in Chile's Bío-Bío Valley?"
      choices:
        - { text: "Cabernet Sauvignon and Carmenère", correct: false }
        - { text: "Carignan and Grenache", correct: false }
        - { text: "Malbec and Petit Verdot", correct: false }
        - { text: "Pinot Noir and Chardonnay", correct: true }
      explanation: |
        A long, slow ripening season keeps natural acidity high, which suits early-ripening
        varieties that can turn flabby in the warmer valleys further north. Late ripeners
        risk being caught by autumn rain here.
    fr:
      question: "Quels deux cépages se sont montrés très prometteurs dans les plantations récentes de la vallée de Bío-Bío, au Chili ?"
      choices:
        - { text: "Cabernet Sauvignon et Carmenère", correct: false }
        - { text: "Carignan et Grenache", correct: false }
        - { text: "Malbec et Petit Verdot", correct: false }
        - { text: "Pinot Noir et Chardonnay", correct: true }
      explanation: |
        Une saison de maturation longue et lente préserve une acidité naturelle élevée, ce
        qui convient aux cépages précoces, qui risquent de manquer de fraîcheur dans les
        vallées plus chaudes du nord. Ici, les cépages tardifs peuvent être surpris par
        les pluies d’automne.

