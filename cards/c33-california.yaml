    en:
      question: What keeps Lodi AVA cooler than most of the Central Valley?
      choices:
        - { text: "Altitude in the Sierra foothills", correct: false }
        - { text: "Fog funnelled through the Petaluma Gap", correct: false }
        - { text: "Bay breezes drawn in across the Delta", correct: true }
        - { text: "Cool water from the Mokelumne River", correct: false }
      explanation: |
        Heat over the valley pulls cool air from San Francisco Bay
        inland through the low, flat Delta most afternoons. The
        Petaluma Gap does a similar job for parts of Sonoma County.
    fr:
      question: "Qu’est-ce qui rend l’AVA Lodi plus fraîche que la majeure partie de la Central Valley ?"
      choices:
        - { text: "L’altitude des contreforts de la Sierra", correct: false }
        - { text: "Le brouillard canalisé par la Petaluma Gap", correct: false }
        - { text: "Les brises de la baie aspirées à travers le Delta", correct: true }
        - { text: "L’eau fraîche de la rivière Mokelumne", correct: false }
      explanation: |
        La chaleur de la vallée aspire presque chaque après-midi l’air frais
        de la baie de San Francisco à travers le Delta, bas et plat. La
        Petaluma Gap joue un rôle comparable pour une partie du comté de
        Sonoma.

