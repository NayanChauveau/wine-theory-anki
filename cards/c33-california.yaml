        - { text: "From pale and earthy to ripe cherry and spice", correct: true }
        - { text: "From pale and unoaked to light and tart", correct: false }
        - { text: "From tart cranberry to off-dry candied strawberry", correct: false }
      explanation: |
        Most sit at the riper end: layers of red cherry and strawberry with
        sweet spice from oak. A smaller group is lighter in colour, with
        gamey and vegetal notes. Site and oak use decide where a wine falls.
    fr:
      question: "Quelle palette aromatique couvrent d’habitude les Pinots Noirs de Californie ?"
      choices:
        - { text: "Du cassis dense au cèdre et au moka", correct: false }
        - { text: "Du pâle et terreux à la cerise mûre épicée", correct: true }
        - { text: "Du pâle sans bois au léger et acidulé", correct: false }
        - { text: "De la canneberge acidulée à la fraise confite demi-sèche", correct: false }
      explanation: |
        La plupart se situent du côté mûr : cerise rouge et fraise, avec
        les épices douces apportées par le fût. Une minorité est plus pâle,
        avec des notes animales et végétales. Le site et l’usage du bois
        décident de la place d’un vin dans cette palette.

  - id: calif-syrah-role-001
