        - { text: "Mourvèdre", correct: false }
        - { text: "Cinsault", correct: false }
      explanation: |
        Syrah rose with the "Rhône Rangers" from the 1980s, led by
        producers such as Randall Grahm of Bonny Doon. Grenache and
        Mourvèdre are planted too, but on a much smaller scale. Petite
        Sirah, a Syrah offspring from southern France rather than a Rhône
        classic, sits some way behind.
    fr:
      question: "Quel cépage noir du Rhône est le plus planté en Californie ?"
      choices:
        - { text: "Grenache", correct: false }
        - { text: "Syrah", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Cinsault", correct: false }
      explanation: |
        La Syrah a pris son essor avec les « Rhône Rangers » dans les années
        1980, menés notamment par Randall Grahm (Bonny Doon). Grenache et
        Mourvèdre existent aussi, mais à bien plus petite échelle. La Petite
        Sirah, descendante de la Syrah née dans le sud de la France plutôt
        que classique du Rhône, se tient assez loin derrière.

