        - { text: "La San Joaquin Valley", correct: true }
        - { text: "Le comté de Sonoma", correct: false }
        - { text: "Le comté de Monterey", correct: false }
      explanation: |
        C’est la partie sud de la Central Valley, un long bassin chaud, plat
        et irrigué, qui englobe aussi le comté de San Joaquin autour de Lodi.

