        - { text: "Mendocino County", correct: false }
        - { text: "Lake County", correct: false }
      explanation: |
        The AVA follows the lower Russian River west of Santa Rosa,
        around Sebastopol and Forestville. The river itself rises in
        Mendocino County, but the AVA lies wholly in Sonoma.
    fr:
      question: "Dans quel comté se trouve l’AVA Russian River Valley ?"
      choices:
        - { text: "Le comté de Napa", correct: false }
        - { text: "Le comté de Sonoma", correct: true }
        - { text: "Le comté de Mendocino", correct: false }
        - { text: "Le comté de Lake", correct: false }
      explanation: |
        L’AVA suit le cours inférieur de la Russian River, à l’ouest de
        Santa Rosa, autour de Sebastopol et de Forestville. La rivière
        prend sa source dans le comté de Mendocino, mais l’AVA est
        entièrement dans celui de Sonoma.

