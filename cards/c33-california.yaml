        - { text: "Corps ample, robe profonde, tanins veloutés, mûre et prune", correct: true }
        - { text: "Corps moyen, tanins fermes et accrocheurs, groseille acidulée", correct: false }
        - { text: "Corps moyen, acidité élevée, notes végétales et herbacées", correct: false }
