        Ruby Cabernet crosses Carignan with Cabernet Sauvignon.
        Rubired has red flesh as well as red skin and is prized
        for deepening the colour of cheap blends.
    fr:
      question: "Quelle paire de cépages a été créée en Californie pour supporter la chaleur de la Central Valley ?"
      choices:
