      choices:
        - { text: "Oakville et Stags Leap District", correct: false }
        - { text: "Los Carneros et Russian River Valley", correct: true }
        - { text: "Lodi et Paso Robles Estrella District", correct: false }
        - { text: "Calistoga et Alexander Valley", correct: false }
      explanation: |
        L’air de la baie de San Pablo rafraîchit Carneros et le brouillard
        remonte la vallée de la Russian River : le raisin garde son acidité
        à une maturité modérée et demande moins de bois pour rester équilibré.

