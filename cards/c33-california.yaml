        - { text: "Very full, high alcohol, ripe fruit, heavy oak", correct: true }
        - { text: "Medium body, high acidity, citrus, lees and light oak", correct: false }
        - { text: "Full body, high acidity, green apple and no oak", correct: false }
      explanation: |
        Acidity was low, and ripe peach and banana fruit met buttery notes from malolactic
        conversion and hazelnut and toast from new barrels. Later, many
        producers turned to cooler sites and lighter oak in reaction.
    fr:
      question: "Quel style a d’abord fait la réputation des Chardonnays californiens haut de gamme ?"
      choices:
        - { text: "Tendu, acidité élevée, agrumes vifs, sans bois", correct: false }
        - { text: "Très ample, alcool élevé, fruit mûr, bois marqué", correct: true }
        - { text: "Corps moyen, acidité élevée, agrumes, lies, bois discret", correct: false }
        - { text: "Corps ample, acidité élevée, pomme verte, sans bois", correct: false }
      explanation: |
        Acidité faible, pêche et banane mûres, notes beurrées de la fermentation malolactique,
        noisette et toasté des fûts neufs. Plus tard, beaucoup de producteurs
        ont réagi en se tournant vers des sites plus frais et un boisé plus léger.

