        Merlot keeps more colour, structure and fresh fruit.
    fr:
      question: "Qu’ont en commun les zones de Californie qui produisent les meilleurs Merlot ?"
      choices:
        - { text: "Elles sont plus chaudes que la Central Valley", correct: false }
        - { text: "Elles sont plus fraîches que la Central Valley", correct: true }
        - { text: "Elles sont davantage irriguées", correct: false }
        - { text: "Elles donnent des rendements plus élevés par pied", correct: false }
      explanation: |
        Brouillard, brises de la baie ou vent de l’après-midi à Monterey
        ralentissent la maturation : le Merlot garde plus de couleur, de
        structure et de fruit frais.

