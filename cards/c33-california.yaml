    fr:
      question: "Quel effet climatique l’exposition est a-t-elle sur les vignobles des Mayacamas, dans le comté de Napa ?"
      choices:
        - { text: "Le plein soleil d’après-midi, d’où des sites plus chauds", correct: false }
        - { text: "Peu de soleil l’après-midi, d’où des sites plus frais", correct: true }
        - { text: "Peu de soleil le matin, d’où des sites plus frais", correct: false }
        - { text: "Un brouillard marin constant, d’où des sites plus frais", correct: false }
      explanation: |
        Ils reçoivent la lumière plus douce du matin et passent à
        l’ombre quand la chaleur de l’après-midi culmine : ils restent
        plus frais que les versants exposés à l’ouest, en face.

