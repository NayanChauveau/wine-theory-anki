  - id: calif-sonoma-climates-001
    type: mcq
    deck: USA::California
    tags: [usa, california, sonoma, climate]
    status: reviewed
    source_id: c33-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does Sonoma County span a wider range of growing climates than Napa County?"
      choices:
        - { text: "It reaches east into the hot Central Valley", correct: false }
        - { text: "It runs from the Pacific coast to inland valleys", correct: true }
        - { text: "It lies at a lower latitude than Napa", correct: false }
        - { text: "Each of its valleys opens onto San Pablo Bay", correct: false }
      explanation: |
        Western Sonoma faces the cold Pacific and its fog, while
        Alexander Valley, inland, runs hot. Napa lies wholly inland
        behind the Mayacamas and is cooled mainly from San Pablo Bay
        at its southern end.
    fr:
      question: "Pourquoi le comté de Sonoma offre-t-il une gamme de climats viticoles plus large que le comté de Napa ?"
      choices:
        - { text: "Il s’étend à l’est jusqu’à la chaude Central Valley", correct: false }
        - { text: "Il va de la côte Pacifique aux vallées intérieures", correct: true }
        - { text: "Il est situé plus au sud que Napa", correct: false }
        - { text: "Toutes ses vallées s’ouvrent sur la baie de San Pablo", correct: false }
      explanation: |
        L’ouest du comté fait face au Pacifique froid et à son brouillard,
        tandis qu’Alexander Valley, à l’intérieur, est chaude. Napa est
        entièrement à l’intérieur des terres, derrière les Mayacamas, et
        est surtout rafraîchie par la baie de San Pablo, au sud.

