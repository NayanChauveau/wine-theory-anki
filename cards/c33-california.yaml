      question: "What is the usual style of inexpensive, high-volume California Chardonnay?"
      choices:
        - { text: "Lean, high in acidity, unoaked and mineral", correct: false }
        - { text: "Ripe and fruity, modest acidity, oak-chip toast", correct: true }
        - { text: "Full and buttery, fermented in new oak barrels", correct: false }
        - { text: "Light, off-dry and spritzy, with floral notes", correct: false }
      explanation: |
        Warm, high-yield fruit gives ripe flavour but modest acidity. A toasty
        note, when there is one, comes from oak staves or chips in tank, a
        cheap stand-in for barrel fermentation.
    fr:
      question: "Quel est le style habituel du Chardonnay californien bon marché, produit en grand volume ?"
      choices:
        - { text: "Tendu, acidité élevée, sans bois, aux notes minérales", correct: false }
        - { text: "Fruité et mûr, acidité modeste, toasté de copeaux", correct: true }
        - { text: "Ample et beurré, fermenté et élevé en fûts neufs", correct: false }
        - { text: "Léger, demi-sec et perlant, aux arômes floraux", correct: false }
      explanation: |
        Des raisins de climat chaud, à fort rendement, donnent un fruit mûr
        mais une acidité modeste. La note toastée, quand elle existe, vient de
        douelles ou de copeaux plongés en cuve, substitut bon marché de la
        fermentation en fût.

