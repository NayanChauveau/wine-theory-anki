        - { text: "Rubired et Ruby Cabernet", correct: true }
        - { text: "Carignan et Alicante Bouschet", correct: false }
        - { text: "Barbera et Colombard", correct: false }
      explanation: |
        Harold Olmo, à UC Davis, a obtenu les deux au milieu du XXᵉ siècle.
        Le Ruby Cabernet croise Carignan et Cabernet Sauvignon. Le Rubired,
        à pulpe colorée comme sa peau, sert à renforcer la couleur des
        assemblages bon marché.

