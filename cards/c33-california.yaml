    en:
      question: "What does daytime fog in the Santa Maria Valley’s low-lying sites do to the grapes?"
      choices:
        - { text: "It speeds up sugar build-up", correct: false }
        - { text: "It slows ripening", correct: true }
        - { text: "It brings budburst forward", correct: false }
        - { text: "It shortens the growing season", correct: false }
      explanation: |
        Fog can sit on the valley floor well into the day,
        cutting sunlight and warmth, so the season stretches out.
    fr:
      question: "Quel effet le brouillard qui persiste en journée a-t-il sur le raisin dans les sites bas de la Santa Maria Valley ?"
      choices:
        - { text: "Il accélère l’accumulation des sucres", correct: false }
        - { text: "Il ralentit la maturation", correct: true }
        - { text: "Il avance le débourrement", correct: false }
        - { text: "Il raccourcit la saison de végétation", correct: false }
      explanation: |
        Le brouillard peut stagner sur le fond de vallée tard dans la
        journée, ce qui réduit lumière et chaleur : la saison
        s’allonge.

