        - { text: "Modérée, avec des vents secs de l’intérieur", correct: false }
      explanation: |
        Le brouillard traîne souvent jusqu’en fin de matinée et les nuits
        sont froides : le Pinot Noir et le Chardonnay mûrissent lentement
