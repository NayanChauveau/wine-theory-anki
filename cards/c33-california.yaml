        - { text: "Des règles de sous-AVA qui imposent un cépage par district", correct: false }
        - { text: "Un fort écart de latitude d’un bout à l’autre de la vallée", correct: false }
      explanation: |
        La vallée ne fait qu’une cinquantaine de kilomètres : la
        latitude change à peine et aucune règle n’impose de cépage.
        Ce qui varie, c’est la part de brouillard, de brise, d’altitude
        et d’exposition que reçoit chaque parcelle.

