        - { text: "Plus fraîches, car plus proches de la Petaluma Gap", correct: false }
        - { text: "Nettement plus chaudes", correct: true }
      explanation: |
        Plus loin de la Petaluma Gap, elles reçoivent un brouillard plus
        mince et des après-midi plus chauds. D’où la place des rouges plus
        mûrs (Zinfandel, Cabernet) plutôt que du Pinot Noir.

