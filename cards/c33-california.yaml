    en:
      question: "Which trio of AVAs is a usual source of premium California Pinot Noir?"
      choices:
        - { text: "Oakville, Rutherford and Stags Leap District", correct: false }
        - { text: "Russian River Valley, Los Carneros and Santa Maria Valley", correct: true }
        - { text: "Lodi, Paso Robles and Calistoga", correct: false }
        - { text: "Dry Creek Valley, Alexander Valley and Howell Mountain", correct: false }
      explanation: |
        Each is cooled by the Pacific: Russian River by fog moving up the
        river corridor, Carneros by air off San Pablo Bay, Santa Maria by an
        east–west valley open to the ocean. The other trios are warm
        Cabernet or Zinfandel country.
    fr:
      question: "Quel trio d’AVA est une source habituelle de Pinot Noir haut de gamme en Californie ?"
      choices:
        - { text: "Oakville, Rutherford et Stags Leap District", correct: false }
        - { text: "Russian River Valley, Los Carneros et Santa Maria Valley", correct: true }
        - { text: "Lodi, Paso Robles et Calistoga", correct: false }
        - { text: "Dry Creek Valley, Alexander Valley et Howell Mountain", correct: false }
      explanation: |
        Toutes trois sont rafraîchies par le Pacifique : Russian River par le
        brouillard qui remonte la vallée du fleuve, Carneros par l’air venu de
        la baie de San Pablo, Santa Maria par une vallée orientée est–ouest,
        ouverte sur l’océan. Les autres trios sont des terres chaudes de
        Cabernet ou de Zinfandel.

  - id: calif-pinot-site-driven-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can two premium California Pinot Noirs taste quite unlike each other?"
      choices:
        - { text: "Each county's AVA rules impose different clones", correct: false }
        - { text: "Vineyard site and winemaking choices vary widely", correct: true }
        - { text: "Most are topped up with Syrah to a house recipe", correct: false }
        - { text: "Picking dates are set by law at different sugar levels", correct: false }
      explanation: |
        A cool, fog-swept Sonoma Coast site and a warmer inland pocket ripen
        Pinot very differently, and producers then choose picking date,
        whole-bunch share and new oak. AVAs set no clone or picking rules.
    fr:
      question: "Pourquoi deux Pinots Noirs haut de gamme de Californie peuvent-ils être si différents ?"
      choices:
        - { text: "Les règles d’AVA imposent des clones différents par comté", correct: false }
        - { text: "Le site et les choix de vinification varient beaucoup", correct: true }
        - { text: "La plupart sont complétés de Syrah selon une recette maison", correct: false }
        - { text: "La loi fixe la date de vendange à des niveaux de sucre différents", correct: false }
      explanation: |
        Un site frais du Sonoma Coast balayé par le brouillard et une poche plus
        chaude à l’intérieur ne mûrissent pas le Pinot de la même façon ;
        le producteur choisit ensuite la date de vendange, la part de
        vendange entière et de bois neuf. Les AVA ne fixent ni clone ni
        date de récolte.

