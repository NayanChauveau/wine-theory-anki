      explanation: |
        Beaucoup de vieilles vignes de Lodi poussent franches de pied dans
        des sols sableux profonds, où le phylloxéra se propage mal. Lodi
        cultive bien d’autres cépages, mais son vin le plus connu reste le
        Zinfandel de vieilles vignes.

