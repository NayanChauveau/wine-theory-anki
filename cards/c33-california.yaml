        - { text: "La Petaluma Gap", correct: true }
        - { text: "La Templeton Gap", correct: false }
        - { text: "Le détroit de Carquinez", correct: false }
      explanation: |
        L’air océanique frais s’engouffre par cette trouée basse l’après-midi
        et le soir, et le brouillard remonte aussi la vallée de la rivière.
        La Templeton Gap joue le même rôle bien plus au sud, pour Paso Robles.

  - id: calif-starita-marine-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0151
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What chiefly keeps the Sta. Rita Hills AVA in Santa Barbara County so cool?
      choices:
        - { text: "Altitude, with most vines above 1,000 m", correct: false }
        - { text: "Marine air pulled in from the nearby Pacific", correct: true }
        - { text: "A more northerly latitude than Napa Valley", correct: false }
        - { text: "Cold air draining off the nearby Santa Ynez Mountains", correct: false }
      explanation: |
        The Santa Ynez Valley runs east–west, an unusual
        orientation on this coast, so ocean fog and wind blow
        straight up it. Sta. Rita Hills sits at its western,
        ocean-facing end and stays cooler than the warmer eastern
        part of the valley.
    fr:
      question: "Qu’est-ce qui rend surtout l’AVA Sta. Rita Hills, dans le comté de Santa Barbara, si fraîche ?"
      choices:
        - { text: "L’altitude, la plupart des vignes dépassant 1 000 m", correct: false }
        - { text: "L’air marin aspiré depuis le Pacifique tout proche", correct: true }
        - { text: "Une latitude plus septentrionale que Napa Valley", correct: false }
        - { text: "L’air froid descendant des monts Santa Ynez voisins", correct: false }
      explanation: |
        La vallée de Santa Ynez est orientée est–ouest, chose rare sur
        cette côte : le brouillard et le vent de l’océan s’y engouffrent
        directement. Sta. Rita Hills occupe son extrémité ouest, face à
        l’océan, et reste plus fraîche que l’est de la vallée.

  - id: calif-starita-pinot-001
