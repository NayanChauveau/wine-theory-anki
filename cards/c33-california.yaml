        - { text: "Cooler, being closer to the Petaluma Gap", correct: false }
        - { text: "Noticeably warmer", correct: true }
      explanation: |
        They sit further from the Petaluma Gap, so the fog thins
        out and afternoons run hotter. That is why riper reds
        (Zinfandel, Cabernet) lead there rather than Pinot Noir.
    fr:
      question: "Côté températures, comment Dry Creek Valley et Alexander Valley se comparent-elles à Russian River Valley ?"
      choices:
        - { text: "Nettement plus fraîches et brumeuses", correct: false }
