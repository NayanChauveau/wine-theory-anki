        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Merlot", correct: false }
      explanation: |
        Cool marine air suits Pinot Noir here. The name is
        abbreviated to "Sta." because Chile’s Viña Santa Rita
        objected to the full "Santa Rita Hills" on US labels.
    fr:
      question: "Pour quel cépage noir l’AVA Sta. Rita Hills est-elle surtout connue ?"
      choices:
        - { text: "Zinfandel", correct: false }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Merlot", correct: false }
      explanation: |
        L’air marin frais convient au Pinot Noir. Le nom est abrégé en
        « Sta. » parce que la maison chilienne Viña Santa Rita s’est
        opposée à « Santa Rita Hills » en toutes lettres sur les
        étiquettes américaines.

