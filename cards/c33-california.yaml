        - { text: "Des arômes verts, pas mûrs, et une acidité souple", correct: false }
        - { text: "Un fruit concentré et une acidité élevée", correct: true }
      explanation: |
        Un long séjour sur souche construit les arômes, tandis que
        l’air frais empêche l’acidité de chuter avant la vendange.

