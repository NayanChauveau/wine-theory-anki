cards:
  - id: calif-length-001
    type: mcq
    deck: USA::California
    tags: [usa, california]
    status: reviewed
    source_id: c33-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Roughly how far is it from California's border with Oregon to its border with Mexico?"
      choices:
        - { text: "About 400 kilometres", correct: false }
        - { text: "About 1,100 kilometres", correct: true }
        - { text: "About 2,500 kilometres", correct: false }
        - { text: "About 650 kilometres", correct: false }
      explanation: |
        The state spans close to ten degrees of latitude, yet a vineyard a few
        kilometres from the Pacific can be cooler than one far to the north but
        cut off from the sea. Distance from the ocean matters more than distance
        from the equator.
    fr:
      question: "Quelle distance sépare à peu près la frontière de la Californie avec l’Oregon de sa frontière avec le Mexique ?"
      choices:
        - { text: "Environ 400 kilomètres", correct: false }
        - { text: "Environ 1 100 kilomètres", correct: true }
        - { text: "Environ 2 500 kilomètres", correct: false }
        - { text: "Environ 650 kilomètres", correct: false }
      explanation: |
        L’État couvre près de dix degrés de latitude. Pourtant, une vigne
        située à quelques kilomètres du Pacifique peut être plus fraîche
        qu’une autre bien plus au nord mais coupée de la mer : la distance à
        l’océan compte davantage que la distance à l’équateur.

  - id: calif-latitude-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How much does latitude shape the climate of California vineyards?"
      choices:
        - { text: "Latitude sets a steady north–south heat gradient", correct: false }
        - { text: "Latitude counts for less than ocean, fog and mountains", correct: true }
        - { text: "Latitude keeps the far north too cold for black grapes", correct: false }
        - { text: "Latitude puts most vineyards north of Bordeaux", correct: false }
      explanation: |
        The cold Pacific, the fog it breeds and the Coast Ranges that block or
        let in marine air decide whether a site is cool or hot. Mendocino, in
        the far north, still ripens Zinfandel, and California's vineyards lie
        well south of Bordeaux (about 45°N).
    fr:
      question: "Quel poids a la latitude face aux autres facteurs du climat viticole californien ?"
      choices:
        - { text: "La latitude impose un dégradé de chaleur du nord au sud", correct: false }
        - { text: "La latitude compte moins que l’océan, le brouillard et les reliefs", correct: true }
        - { text: "La latitude rend l’extrême nord trop froid pour les cépages noirs", correct: false }
        - { text: "La latitude place la plupart des vignes plus au nord que Bordeaux", correct: false }
      explanation: |
        C’est le Pacifique froid, le brouillard qu’il engendre et les chaînes
        côtières, qui bloquent ou laissent entrer l’air marin, qui font
        qu’un site est frais ou chaud. Le Mendocino, tout au nord, mûrit
        encore le Zinfandel, et le vignoble californien se situe bien au sud
        de Bordeaux (environ 45° N).

  - id: calif-current-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cold ocean current lies behind the fogs and sea breezes that cool coastal California vineyards?"
      choices:
        - { text: "The Humboldt Current", correct: false }
        - { text: "The California Current", correct: true }
        - { text: "The Benguela Current", correct: false }
        - { text: "The Labrador Current", correct: false }
      explanation: |
        It flows south from northern Pacific waters along the whole coast, and
        upwelling keeps the sea cold even in summer. The Humboldt plays the
        same role for Chile, the Benguela for South Africa's west coast.
    fr:
      question: "Quel courant océanique froid est à l’origine des brouillards et des brises marines qui rafraîchissent le vignoble côtier californien ?"
      choices:
        - { text: "Le courant de Humboldt", correct: false }
        - { text: "Le courant de Californie", correct: true }
        - { text: "Le courant de Benguela", correct: false }
        - { text: "Le courant du Labrador", correct: false }
      explanation: |
        Il descend du nord du Pacifique le long de toute la côte, et les
        remontées d’eau profonde gardent la mer froide même en été. Le
        Humboldt joue le même rôle au Chili, le Benguela sur la côte ouest de
        l’Afrique du Sud.

  - id: calif-north-of-la-001
    type: mcq
    deck: USA::California
    tags: [usa, california]
    status: reviewed
    source_id: c33-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Relative to Los Angeles, where do most California vineyards lie?"
      choices:
        - { text: "South of it, toward San Diego", correct: false }
        - { text: "North of it", correct: true }
        - { text: "East of it, in the inland desert basins", correct: false }
        - { text: "Evenly split north and south of it", correct: false }
      explanation: |
        The North Coast, the Central Coast and the Central Valley all sit
        north of the city. Temecula Valley, in Riverside County, is the main
        vineyard area to the south, and it is small.
    fr:
      question: "Par rapport à Los Angeles, où se trouve la majeure partie du vignoble californien ?"
      choices:
        - { text: "Au sud, vers San Diego", correct: false }
        - { text: "Au nord", correct: true }
        - { text: "À l’est, dans les bassins désertiques de l’intérieur", correct: false }
        - { text: "À parts égales au nord et au sud", correct: false }
      explanation: |
        North Coast, Central Coast et Central Valley sont toutes au nord de
        la ville. Au sud, la principale zone viticole est Temecula Valley,
        dans le comté de Riverside, et elle reste petite.

  - id: calif-coast-mountains-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "North of Los Angeles, how does the California coastline differ from the south?"
      choices:
        - { text: "It is flatter, with wide coastal plains", correct: false }
        - { text: "It is more mountainous", correct: true }
        - { text: "It is lower, with long lagoons and marshes", correct: false }
        - { text: "It is broken by many wide river deltas", correct: false }
      explanation: |
        The Coast Ranges run close to the shore for hundreds of kilometres, so
        marine air reaches far inland only where the hills are breached.
    fr:
      question: "Au nord de Los Angeles, en quoi le littoral californien diffère-t-il de celui du sud ?"
      choices:
        - { text: "Il est plus plat, avec de larges plaines côtières", correct: false }
        - { text: "Il est plus montagneux", correct: true }
        - { text: "Il est plus bas, bordé de lagunes et de marais", correct: false }
        - { text: "Il est entaillé par de nombreux grands deltas", correct: false }
      explanation: |
        Les chaînes côtières longent le rivage sur des centaines de
        kilomètres : l’air marin ne pénètre loin dans les terres que là où le
        relief s’ouvre.

  - id: calif-range-shield-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What do California's coastal mountains do to the climate of inland vineyards?"
      choices:
        - { text: "They hold cool ocean air in the inland valleys", correct: false }
        - { text: "They shield much of the state from ocean cooling", correct: true }
        - { text: "They catch summer storms that water inland vines", correct: false }
        - { text: "They steer cold air south into the Central Valley", correct: false }
      explanation: |
        Behind them, summers are hot and dry. Marine air gets through only
        where the ranges are breached, as at the Golden Gate, which lets the
        cooling reach San Pablo Bay and Carneros.
    fr:
      question: "Quel effet les montagnes côtières de Californie ont-elles sur le climat des vignobles de l’intérieur ?"
      choices:
        - { text: "Elles retiennent l’air océanique frais dans les vallées intérieures", correct: false }
        - { text: "Elles privent une grande partie de l’État de la fraîcheur océanique", correct: true }
        - { text: "Elles arrêtent des orages d’été qui arrosent les vignes de l’intérieur", correct: false }
        - { text: "Elles dirigent l’air froid vers le sud, dans la Central Valley", correct: false }
      explanation: |
        Derrière elles, les étés sont chauds et secs. L’air marin ne passe que
        là où le relief s’interrompt, comme au Golden Gate, par lequel la
        fraîcheur gagne la baie de San Pablo et Carneros.

  - id: calif-evening-fog-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On a typical summer evening, what cools California's coastal vineyards?"
      choices:
        - { text: "Dry Santa Ana winds blowing off the desert", correct: false }
        - { text: "Cold ocean air, often with fog, drawn inland", correct: true }
        - { text: "Evening thunderstorms rolling in from the sea", correct: false }
        - { text: "Cold air draining down from the Sierra Nevada", correct: false }
      explanation: |
        As the inland valleys heat up, they draw marine air in behind them,
        so night temperatures drop sharply and acidity is kept. Santa Ana
        winds do the opposite: hot, dry and offshore, mostly in autumn.
    fr:
      question: "Par un soir d’été ordinaire, qu’est-ce qui rafraîchit les vignobles côtiers de Californie ?"
      choices:
        - { text: "Les vents secs de Santa Ana qui soufflent du désert", correct: false }
        - { text: "L’air marin froid, souvent brumeux, aspiré dans les terres", correct: true }
        - { text: "Des orages en soirée qui remontent depuis la mer", correct: false }
        - { text: "L’air froid qui dévale les pentes de la Sierra Nevada", correct: false }
      explanation: |
        En chauffant, les vallées intérieures aspirent l’air marin : les nuits
        se rafraîchissent nettement et l’acidité se maintient. Les vents de
        Santa Ana font l’inverse : chauds, secs et soufflant vers la mer,
        surtout à l’automne.

  - id: calif-fog-burnoff-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When and how does summer fog usually clear from coastal California vineyards?"
      choices:
        - { text: "Before dawn, as land breezes push it out to sea", correct: false }
        - { text: "In the morning, as the sun burns it off", correct: true }
        - { text: "In late afternoon, once the sea breeze drops", correct: false }
        - { text: "Overnight, as the cooling air dries it out", correct: false }
      explanation: |
        On cool sites it can hang on until late morning. The afternoon then
        often brings a sea breeze, and the fog rolls back in at dusk.
    fr:
      question: "Quand et comment le brouillard d’été se dissipe-t-il d’habitude sur le vignoble côtier californien ?"
      choices:
        - { text: "Avant l’aube, repoussé vers la mer par la brise de terre", correct: false }
        - { text: "Le matin, quand le soleil le dissipe", correct: true }
        - { text: "En fin d’après-midi, quand la brise marine tombe", correct: false }
        - { text: "La nuit, quand l’air qui se refroidit l’assèche", correct: false }
      explanation: |
        Sur les sites frais, il peut persister jusqu’en fin de matinée.
        L’après-midi amène souvent une brise marine, et le brouillard revient
        au crépuscule.

  - id: calif-fog-daytime-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does morning fog affect daytime temperatures in cool coastal California vineyards?"
      choices:
        - { text: "It traps heat, so mornings run warmer than inland", correct: false }
        - { text: "Its cooling lasts well into the day", correct: true }
        - { text: "It has little effect, as it clears before sunrise", correct: false }
        - { text: "It cools the afternoons but not the mornings", correct: false }
      explanation: |
        The warm, sunny part of the day starts late, so sugars build slowly
        while acidity holds. That is why the foggiest pockets suit Pinot Noir
        and Chardonnay rather than Cabernet Sauvignon.
    fr:
      question: "Quel effet le brouillard matinal a-t-il sur les températures diurnes dans les vignobles côtiers frais de Californie ?"
      choices:
        - { text: "Il retient la chaleur : les matinées y sont plus chaudes qu’à l’intérieur", correct: false }
        - { text: "Sa fraîcheur se prolonge tard dans la journée", correct: true }
        - { text: "Il compte peu, car il se lève avant l’aube", correct: false }
        - { text: "Il rafraîchit les après-midi, mais pas les matinées", correct: false }
      explanation: |
        La partie chaude et ensoleillée de la journée commence tard : les
        sucres montent lentement et l’acidité se maintient. C’est pourquoi
        les poches les plus brumeuses conviennent au Pinot Noir et au
        Chardonnay plutôt qu’au Cabernet Sauvignon.

  - id: calif-fog-unripe-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a very foggy summer on the California coast, what can happen to ripening?"
      choices:
        - { text: "Sugars build faster, as fog spares vines heat stress", correct: false }
        - { text: "Grapes can struggle to ripen fully", correct: true }
        - { text: "Acidity drops quickly, giving flabby wines", correct: false }
        - { text: "Harvest comes early, as cool nights speed up colour", correct: false }
      explanation: |
        The coolest pockets, such as western Sonoma County or the Sta. Rita
        Hills, feel it first. Growers there favour early-ripening Pinot Noir
        and Chardonnay for exactly this reason.
    fr:
      question: "Lors d’un été très brumeux sur la côte californienne, que peut-il arriver à la maturation ?"
      choices:
        - { text: "Les sucres montent plus vite, le brouillard épargnant à la vigne le stress thermique", correct: false }
        - { text: "Le raisin peut avoir du mal à atteindre sa pleine maturité", correct: true }
        - { text: "L’acidité chute vite et les vins manquent de fraîcheur", correct: false }
        - { text: "Les vendanges sont précoces, les nuits fraîches accélérant la coloration", correct: false }
      explanation: |
        Les poches les plus fraîches, comme l’ouest du comté de Sonoma ou les
        Sta. Rita Hills, le ressentent en premier. C’est justement pour cela
        qu’on y plante des cépages précoces : Pinot Noir et Chardonnay.

  - id: calif-fog-gaps-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does Pacific fog reach furthest inland in California?"
      choices:
        - { text: "Behind the highest stretches of the coastal mountains", correct: false }
        - { text: "Through gaps in the coastal mountains", correct: true }
        - { text: "Over hilltops, high above the valley floors", correct: false }
        - { text: "Into basins closed off from the sea by ridges", correct: false }
      explanation: |
        Fog is low and dense, so it follows openings rather than climbing
        over ridges. The Golden Gate and the Petaluma Gap are classic
        examples, and hillside vineyards often sit in sun above the fog line.
    fr:
      question: "Où le brouillard du Pacifique pénètre-t-il le plus loin à l’intérieur des terres en Californie ?"
      choices:
        - { text: "Derrière les portions les plus hautes des montagnes côtières", correct: false }
        - { text: "Par les brèches des montagnes côtières", correct: true }
        - { text: "Sur les sommets, bien au-dessus des fonds de vallée", correct: false }
        - { text: "Dans les cuvettes fermées à la mer par des crêtes", correct: false }
      explanation: |
        Le brouillard est bas et dense : il suit les ouvertures au lieu de
        franchir les crêtes. Le Golden Gate et le Petaluma Gap en sont des
        exemples classiques, et les vignes de coteau sont souvent au soleil,
        au-dessus de la mer de brouillard.

  - id: calif-funnel-counties-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two California counties have valleys that funnel cold Pacific air far inland?"
      choices:
        - { text: "Fresno and Kern", correct: false }
        - { text: "Monterey and Santa Barbara", correct: true }
        - { text: "Amador and El Dorado", correct: false }
        - { text: "Riverside and San Bernardino", correct: false }
      explanation: |
        The Salinas Valley draws wind straight off Monterey Bay, and in Santa
        Barbara County the Santa Maria and Santa Ynez valleys open on to the
        ocean. Fresno and Kern sit in the hot Central Valley; Amador and El
        Dorado in the Sierra Foothills.
    fr:
      question: "Quels deux comtés californiens ont des vallées qui canalisent l’air froid du Pacifique loin dans les terres ?"
      choices:
        - { text: "Fresno et Kern", correct: false }
        - { text: "Monterey et Santa Barbara", correct: true }
        - { text: "Amador et El Dorado", correct: false }
        - { text: "Riverside et San Bernardino", correct: false }
      explanation: |
        La Salinas Valley aspire le vent directement depuis la baie de
        Monterey ; dans le comté de Santa Barbara, les vallées de Santa Maria
        et de Santa Ynez s’ouvrent sur l’océan. Fresno et Kern sont dans la
        Central Valley brûlante, Amador et El Dorado dans les Sierra Foothills.

  - id: calif-funnel-aspect-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do certain Central Coast valleys funnel cold ocean air far inland?"
      choices:
        - { text: "They run parallel to the coast, behind a low ridge", correct: false }
        - { text: "They open at right angles to the ocean", correct: true }
        - { text: "Their floors lie below sea level, so cold air pools", correct: false }
        - { text: "Their rivers flow inland, pulling air along with them", correct: false }
      explanation: |
        A valley that faces the sea becomes a wind tunnel as the interior
        heats up. In Santa Barbara County the Transverse Ranges run east–west,
        which is why the Sta. Rita Hills stay so cool so far south.
    fr:
      question: "Pourquoi certaines vallées de la Central Coast canalisent-elles l’air océanique froid loin dans les terres ?"
      choices:
        - { text: "Elles longent la côte, derrière une crête peu élevée", correct: false }
        - { text: "Elles s’ouvrent perpendiculairement à l’océan", correct: true }
        - { text: "Leur fond est sous le niveau de la mer, où l’air froid stagne", correct: false }
        - { text: "Leurs rivières coulent vers l’intérieur et entraînent l’air", correct: false }
      explanation: |
        Une vallée tournée vers la mer devient un couloir à vent quand
        l’intérieur se réchauffe. Dans le comté de Santa Barbara, les
        Transverse Ranges sont orientées est–ouest : voilà pourquoi les
        Sta. Rita Hills restent si fraîches aussi loin au sud.

  - id: calif-inland-heat-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where the coastal ranges cut California vineyards off from marine air, what climate usually results?"
      choices:
        - { text: "Cool, as cold air pools behind the ranges", correct: false }
        - { text: "Hot and sunny", correct: true }
        - { text: "Moderate, with fog cooling every night", correct: false }
        - { text: "Wet in summer, as the ranges trap rain clouds", correct: false }
      explanation: |
        With no fog or sea breeze, summer days often pass 35 °C. Big crops
        ripen easily there, but the wines tend toward soft acidity and ripe,
        simple fruit.
    fr:
      question: "Là où les chaînes côtières coupent le vignoble californien de l’air marin, quel climat en résulte d’habitude ?"
      choices:
        - { text: "Frais, car l’air froid stagne derrière les montagnes", correct: false }
        - { text: "Chaud et ensoleillé", correct: true }
        - { text: "Tempéré, avec un brouillard qui rafraîchit chaque nuit", correct: false }
        - { text: "Humide en été, les montagnes retenant les nuages de pluie", correct: false }
      explanation: |
        Sans brouillard ni brise marine, les journées d’été dépassent souvent
        35 °C. De gros rendements y mûrissent sans peine, mais les vins ont
        tendance à manquer d’acidité et à offrir un fruit mûr et simple.

  - id: calif-central-valley-hot-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which California wine area is the classic hot zone cut off from ocean cooling?"
      choices:
        - { text: "Los Carneros", correct: false }
        - { text: "The Central Valley", correct: true }
        - { text: "The Russian River Valley", correct: false }
        - { text: "The Santa Maria Valley", correct: false }
      explanation: |
        It grows most of the state's grapes for volume wine. Lodi, at its
        northern end, is a partial exception: afternoon breezes come up
        through the delta from San Francisco Bay. The other three are
        fog-cooled Pinot Noir country.
    fr:
      question: "Quelle zone viticole californienne est l’exemple type d’une région chaude coupée de l’influence océanique ?"
      choices:
        - { text: "Los Carneros", correct: false }
        - { text: "La Central Valley", correct: true }
        - { text: "La Russian River Valley", correct: false }
        - { text: "La Santa Maria Valley", correct: false }
      explanation: |
        Elle produit l’essentiel du raisin de l’État pour les vins de volume.
        Lodi, à son extrémité nord, fait en partie exception : des brises
        l’après-midi remontent le delta depuis la baie de San Francisco. Les
        trois autres sont des terres à Pinot Noir rafraîchies par le
        brouillard.

  - id: calif-dry-summer-001
    type: mcq
    deck: USA::California
    tags: [usa, california, climate]
    status: reviewed
    source_id: c33-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Across all of California's wine regions, which weather feature marks the ripening season?"
      choices:
        - { text: "Frequent thunderstorms around harvest", correct: false }
        - { text: "Little or no rain", correct: true }
        - { text: "High humidity, with mildew the main threat", correct: false }
        - { text: "Cool, cloudy days under coastal fog", correct: false }
      explanation: |
        Rain falls mainly in winter, the Mediterranean pattern. Fungal disease
        pressure is low at harvest, but vines often depend on irrigation.
        Fog cools the coast; inland areas see little of it.
    fr:
      question: "Dans toutes les régions viticoles de Californie, quel trait météo marque la période de maturation ?"
      choices:
        - { text: "Des orages fréquents autour des vendanges", correct: false }
        - { text: "Peu ou pas de pluie", correct: true }
        - { text: "Une forte humidité, avec le mildiou comme menace principale", correct: false }
        - { text: "Des journées fraîches et grises sous le brouillard côtier", correct: false }
      explanation: |
        La pluie tombe surtout en hiver, selon le schéma méditerranéen. La
        pression des maladies cryptogamiques est faible aux vendanges, mais la
        vigne dépend souvent de l’irrigation. Le brouillard rafraîchit la
        côte ; l’intérieur en voit peu.

  - id: calif-drip-001
    type: mcq
    deck: USA::California
    tags: [usa, california, viticulture]
    status: reviewed
    source_id: c33-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do California growers usually make up for the lack of rain while grapes ripen?"
      choices:
        - { text: "With overhead misting of the canopy", correct: false }
        - { text: "With drip irrigation", correct: true }
        - { text: "With cover crops that hold water in the soil", correct: false }
        - { text: "By picking early, before drought sets in", correct: false }
      explanation: |
        Drip lines put measured water at the root zone, so growers can steer
        vine vigour as well as keep vines alive. Cover crops do the opposite
        in summer: they compete with the vine for water.
    fr:
      question: "Comment les viticulteurs californiens compensent-ils d’habitude l’absence de pluie pendant la maturation ?"
      choices:
        - { text: "Par brumisation du feuillage par le haut", correct: false }
        - { text: "Par irrigation au goutte-à-goutte", correct: true }
        - { text: "Par des couverts végétaux qui retiennent l’eau du sol", correct: false }
        - { text: "En vendangeant tôt, avant que la sécheresse s’installe", correct: false }
      explanation: |
        Le goutte-à-goutte apporte une eau dosée au pied de la vigne : on
        maintient la plante en vie tout en maîtrisant sa vigueur. En été,
        les couverts végétaux font l’inverse : ils concurrencent la vigne
        pour l’eau.

  - id: calif-hang-time-001
    type: mcq
    deck: USA::California
    tags: [usa, california, viticulture]
    status: reviewed
    source_id: c33-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What has a dry autumn allowed California growers to do?"
      choices:
        - { text: "Pick earlier, ahead of autumn storms", correct: false }
        - { text: "Leave grapes on the vine late into the season", correct: true }
        - { text: "Count on noble rot for sweet wines", correct: false }
        - { text: "Make ice wine from grapes left into winter", correct: false }
      explanation: |
        With little autumn rain, rot risk stays low, so growers can wait for
        the ripeness they want instead of racing the weather. Dry weather is
        also why noble rot is rare there.
    fr:
      question: "Qu’est-ce qu’un automne sec a permis aux viticulteurs californiens de faire ?"
      choices:
        - { text: "Vendanger plus tôt, avant les orages d’automne", correct: false }
        - { text: "Laisser le raisin sur souche tard dans la saison", correct: true }
        - { text: "Compter sur la pourriture noble pour des vins liquoreux", correct: false }
        - { text: "Faire du vin de glace avec des raisins laissés jusqu’en hiver", correct: false }
      explanation: |
        Avec peu de pluie à l’automne, le risque de pourriture reste faible :
        on peut attendre la maturité voulue sans courir contre la météo. Ce
        temps sec explique aussi la rareté de la pourriture noble.

  - id: calif-high-sugar-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does a long hang time on the vine typically do to California grapes?"
      choices:
        - { text: "It keeps acidity high and sugar at a moderate level", correct: false }
        - { text: "It concentrates flavour and sends sugar very high", correct: true }
        - { text: "It brings noble rot and honeyed flavours", correct: false }
        - { text: "It leaves green, herbaceous flavours in the fruit", correct: false }
      explanation: |
        High sugar becomes high alcohol: 15% abv is common in ripe Napa
        Cabernet Sauvignon and Zinfandel. Acidity falls as the berries hang,
        so many wines are acidified in the cellar.
    fr:
      question: "Quel effet une longue maturation sur souche a-t-elle en général sur le raisin californien ?"
      choices:
        - { text: "Elle maintient une acidité élevée et un taux de sucre modéré", correct: false }
        - { text: "Elle concentre les arômes et fait fortement grimper le sucre", correct: true }
        - { text: "Elle amène la pourriture noble et des notes de miel", correct: false }
        - { text: "Elle laisse au raisin des arômes verts et herbacés", correct: false }
      explanation: |
        Beaucoup de sucre donne beaucoup d’alcool : 15 % vol. est courant pour
        un Cabernet Sauvignon de Napa ou un Zinfandel bien mûrs. L’acidité
        baisse à mesure que le raisin attend, et de nombreux vins sont
        acidifiés au chai.

  - id: calif-earlier-pick-001
    type: mcq
    deck: USA::California
    tags: [usa, california]
    status: reviewed
    source_id: c33-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What harvest change have many California growers made in recent years?"
      choices:
        - { text: "Picking later, for riper, richer flavours", correct: false }
        - { text: "Picking a little earlier, for freshness", correct: true }
        - { text: "Raising yields, for softer, lighter wines", correct: false }
        - { text: "Picking in the afternoon heat, not at night", correct: false }
      explanation: |
        A taste for balance replaced the race for ripeness. The In Pursuit of
        Balance tastings (2011–2016), led by Rajat Parr and Jasmine Hirsch,
        championed lower-alcohol Pinot Noir and Chardonnay.
    fr:
      question: "Quel changement à la vendange de nombreux viticulteurs californiens ont-ils adopté ces dernières années ?"
      choices:
        - { text: "Vendanger plus tard, pour des arômes plus mûrs et riches", correct: false }
        - { text: "Vendanger un peu plus tôt, pour la fraîcheur", correct: true }
        - { text: "Augmenter les rendements, pour des vins plus souples et légers", correct: false }
        - { text: "Vendanger dans la chaleur de l’après-midi plutôt que de nuit", correct: false }
      explanation: |
        Le goût de l’équilibre a remplacé la course à la maturité. Les
        dégustations In Pursuit of Balance (2011–2016), menées par Rajat Parr
        et Jasmine Hirsch, ont défendu des Pinot Noir et des Chardonnay moins
        alcoolisés.

  - id: calif-cab-black-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape is the most planted in California?"
      choices:
        - { text: "Zinfandel", correct: false }
        - { text: "Cabernet Sauvignon", correct: true }
        - { text: "Pinot Noir", correct: false }
        - { text: "Merlot", correct: false }
      explanation: |
        With Chardonnay among the whites, it dominates the state's vineyard.
        Pinot Noir, Zinfandel and Merlot follow, well behind.
    fr:
      question: "Quel cépage noir est le plus planté en Californie ?"
      choices:
        - { text: "Le Zinfandel", correct: false }
        - { text: "Le Cabernet Sauvignon", correct: true }
        - { text: "Le Pinot Noir", correct: false }
        - { text: "Le Merlot", correct: false }
      explanation: |
        Avec le Chardonnay côté blancs, il domine le vignoble de l’État. Le
        Pinot Noir, le Zinfandel et le Merlot suivent, loin derrière.

  - id: calif-cab-prime-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "From California's best sites, what level can Cabernet Sauvignon reach?"
      choices:
        - { text: "Good but simple, with little ageing potential", correct: false }
        - { text: "Expressive wines that rival the world's best", correct: true }
        - { text: "Fine, but a clear step below top Bordeaux", correct: false }
        - { text: "Good in blends, but plain as a varietal", correct: false }
      explanation: |
        At the 1976 Judgment of Paris, Stag's Leap Wine Cellars' 1973
        Cabernet Sauvignon from Napa topped the red flight, ahead of
        Mouton Rothschild and Haut-Brion.
    fr:
      question: "Sur les meilleurs sites de Californie, quel niveau le Cabernet Sauvignon peut-il atteindre ?"
      choices:
        - { text: "Bon mais simple, avec peu de potentiel de garde", correct: false }
        - { text: "Des vins expressifs, au niveau des meilleurs du monde", correct: true }
        - { text: "Fin, mais nettement en dessous des grands bordeaux", correct: false }
        - { text: "Bon en assemblage, mais quelconque seul", correct: false }
      explanation: |
        Lors du Jugement de Paris en 1976, le Cabernet Sauvignon 1973 de
        Stag’s Leap Wine Cellars, à Napa, est arrivé en tête des rouges,
        devant Mouton Rothschild et Haut-Brion.

  - id: calif-cab-profile-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What profile do California's best Cabernet Sauvignons usually show?"
      choices:
        - { text: "Medium body, red cherry and earthy notes", correct: false }
        - { text: "Full body, ripe cassis and new-oak spice", correct: true }
        - { text: "Light body, green pepper and high acidity", correct: false }
        - { text: "Full body, black pepper and smoked meat", correct: false }
      explanation: |
        That is the rich, prestige Napa pole. Some producers pick earlier or
        farm cooler sites and make leaner wines with fresher blackcurrant.
        Black pepper and smoked meat point to Syrah instead.
    fr:
      question: "Quel profil montrent d’habitude les meilleurs Cabernet Sauvignon de Californie ?"
      choices:
        - { text: "Corps moyen, cerise rouge et notes terreuses", correct: false }
        - { text: "Corps ample, cassis mûr et épices du fût neuf", correct: true }
        - { text: "Corps léger, poivron vert et acidité élevée", correct: false }
        - { text: "Corps ample, poivre noir et viande fumée", correct: false }
      explanation: |
        C’est le pôle riche et prestigieux de Napa. Certains producteurs
        vendangent plus tôt ou choisissent des sites plus frais, pour des vins
        plus tendus au cassis plus frais. Le poivre noir et la viande fumée
        évoquent plutôt la Syrah.

  - id: calif-zin-heritage-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape do Californians treat as the state's own signature variety?"
      choices:
        - { text: "Grenache", correct: false }
        - { text: "Zinfandel", correct: true }
        - { text: "Carignan", correct: false }
        - { text: "Mourvèdre", correct: false }
      explanation: |
        It is not native. In the 1990s, DNA work linked it to Italy's
        Primitivo, and in 2001 Carole Meredith's team traced both to Croatia's
        Crljenak Kaštelanski. But California made it famous.
    fr:
      question: "Quel cépage noir les Californiens considèrent-ils comme le cépage emblématique de leur État ?"
      choices:
        - { text: "Le Grenache", correct: false }
        - { text: "Le Zinfandel", correct: true }
        - { text: "Le Carignan", correct: false }
        - { text: "Le Mourvèdre", correct: false }
      explanation: |
        Il n’est pas indigène. Dans les années 1990, l’ADN l’a rapproché du
        Primitivo italien ; en 2001, l’équipe de Carole Meredith a fait
        remonter les deux au Crljenak Kaštelanski croate. Mais c’est la
        Californie qui l’a rendu célèbre.

  - id: calif-zin-range-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which range of styles is California Zinfandel made into?"
      choices:
        - { text: "Mostly dry, full-bodied reds for ageing", correct: false }
        - { text: "From pale, sweetish rosé to powerful red", correct: true }
        - { text: "Mostly fortified, port-style wines", correct: false }
        - { text: "Mostly light, juicy reds for early drinking", correct: false }
      explanation: |
        Pale, medium-sweet rosé sells in huge volumes, juicy everyday reds
        fill the middle, and old vines in Lodi, Sonoma and Amador give dense,
        high-alcohol wines. A few late-harvest and port-style bottles exist
        too.
    fr:
      question: "Quelle palette de styles le Zinfandel donne-t-il en Californie ?"
      choices:
        - { text: "Pour l’essentiel des rouges secs et corsés, de garde", correct: false }
        - { text: "Du rosé pâle et doux au rouge puissant", correct: true }
        - { text: "Surtout des vins mutés de type porto", correct: false }
        - { text: "Surtout des rouges légers et fruités à boire jeunes", correct: false }
      explanation: |
        Le rosé pâle et demi-doux se vend en énormes volumes, les rouges
        fruités de tous les jours occupent le milieu, et les vieilles vignes
        de Lodi, de Sonoma et d’Amador donnent des vins denses et très
        alcoolisés. Il existe aussi quelques vendanges tardives et vins de
        type porto.

  - id: calif-zin-uneven-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes, viticulture]
    status: reviewed
    source_id: c33-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which growing trait makes Zinfandel hard to pick at the right moment?"
      choices:
        - { text: "It ripens too late for most coastal sites", correct: false }
        - { text: "It ripens unevenly within the bunch", correct: true }
        - { text: "Its skins stay pale even when fully ripe", correct: false }
        - { text: "Its buds are easily killed by winter freeze", correct: false }
      explanation: |
        A single bunch can hold raisined and green berries at once, so the
        pick mixes both. The raisins push alcohol up; the laggards can add a
        faint herbal note.
    fr:
      question: "Quelle particularité du Zinfandel rend difficile le choix de la date de vendange ?"
      choices:
        - { text: "Il mûrit trop tard pour la plupart des sites côtiers", correct: false }
        - { text: "Sa maturation est hétérogène au sein de la grappe", correct: true }
        - { text: "Sa pellicule reste pâle même à pleine maturité", correct: false }
        - { text: "Ses bourgeons gèlent facilement en hiver", correct: false }
      explanation: |
        Une même grappe peut porter à la fois des baies passerillées et des
        baies vertes : la vendange mélange les deux. Les baies passerillées
        font monter l’alcool, les retardataires peuvent apporter une légère
        note herbacée.

  - id: calif-zin-raisin-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What style of wine does Zinfandel with many raisined berries usually give?"
      choices:
        - { text: "Medium-bodied and crisp, with fresh red fruit", correct: false }
        - { text: "Full-bodied, high in alcohol, sometimes off-dry", correct: true }
        - { text: "Medium-bodied, soft and dry, with jammy fruit", correct: false }
        - { text: "Light, dry and tart, with green notes", correct: false }
      explanation: |
        Expect red and black fruit, dried berries and liquorice, often above
        15% abv. A subtle green note can come from the under-ripe berries
        picked alongside.
    fr:
      question: "Quel style de vin donne d’habitude un Zinfandel riche en baies passerillées ?"
      choices:
        - { text: "Corps moyen et vif, avec des fruits rouges frais", correct: false }
        - { text: "Corps ample, alcool élevé, parfois un peu de sucre", correct: true }
        - { text: "Corps moyen, souple et sec, aux fruits confiturés", correct: false }
        - { text: "Léger, sec et acidulé, avec des notes végétales", correct: false }
      explanation: |
        Fruits rouges et noirs, baies séchées et réglisse, souvent au-delà de
        15 % vol. Une discrète note verte peut venir des baies pas tout à fait
        mûres vendangées avec les autres.

  - id: calif-zin-rose-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Zinfandel picked before it is fully ripe often ends up in which kind of California wine?"
      choices:
        - { text: "Fortified, port-style red", correct: false }
        - { text: "Rosé, made in large volumes", correct: true }
        - { text: "Traditional-method sparkling", correct: false }
        - { text: "Late-harvest dessert wine", correct: false }
      explanation: |
        Early-picked fruit has less sugar and fresher acidity, which suits a
        light, fruity pink. Port-style and late-harvest Zinfandel need the
        ripest, even raisined, fruit.
    fr:
      question: "Dans quel type de vin californien finit souvent le Zinfandel vendangé avant pleine maturité ?"
      choices:
        - { text: "Un rouge muté de type porto", correct: false }
        - { text: "Du rosé, produit en grands volumes", correct: true }
        - { text: "Un effervescent de méthode traditionnelle", correct: false }
        - { text: "Un vin liquoreux de vendange tardive", correct: false }
      explanation: |
        Un raisin cueilli tôt a moins de sucre et une acidité plus fraîche,
        ce qui convient à un rosé léger et fruité. Les Zinfandel de type
        porto ou de vendange tardive exigent au contraire le raisin le plus
        mûr, voire passerillé.

  - id: calif-white-zin-name-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Under what name are California's mass-market Zinfandel rosés usually sold?"
      choices:
        - { text: "Zinfandel Blanc de Noirs", correct: false }
        - { text: "White Zinfandel", correct: true }
        - { text: "Zinfandel Clairet", correct: false }
        - { text: "Zinfandel Vin Gris", correct: false }
      explanation: |
        The wine is pink and made from a black grape. Sutter Home's 1975
        batch had a stuck fermentation that left sugar behind, and the
        pale, sweetish style took off from there.
    fr:
      question: "Sous quel nom les rosés de Zinfandel de grande diffusion sont-ils d’habitude vendus en Californie ?"
      choices:
        - { text: "Zinfandel Blanc de Noirs", correct: false }
        - { text: "White Zinfandel", correct: true }
        - { text: "Zinfandel Clairet", correct: false }
        - { text: "Zinfandel Vin Gris", correct: false }
      explanation: |
        Le vin est rosé et issu d’un cépage noir. En 1975, une cuvée de
        Sutter Home a connu un arrêt de fermentation qui a laissé du sucre :
        le style pâle et légèrement sucré est parti de là.

  - id: calif-white-zin-style-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What style is a typical White Zinfandel?"
      choices:
        - { text: "Pale, bone dry and crisp, in a Provence mould", correct: false }
        - { text: "Pale, fruity, medium-sweet and low in alcohol", correct: true }
        - { text: "Deep pink, dry and full-bodied", correct: false }
        - { text: "Pale, sweet and fortified to 18%", correct: false }
      explanation: |
        It is made like a rosé, with brief skin contact, and the fermentation
        is stopped early, which keeps alcohol low and leaves sugar. It is meant
        for drinking young and cold.
    fr:
      question: "Quel est le style d’un White Zinfandel typique ?"
      choices:
        - { text: "Pâle, très sec et vif, comme un rosé de Provence", correct: false }
        - { text: "Pâle, fruité, demi-doux et peu alcoolisé", correct: true }
        - { text: "Rose soutenu, sec et corsé", correct: false }
        - { text: "Pâle, doux et muté à 18 % vol.", correct: false }
      explanation: |
        Il est vinifié comme un rosé, avec une courte macération, et la
        fermentation est arrêtée tôt : l’alcool reste bas et il reste du
        sucre. Il se boit jeune et bien frais.

  - id: calif-merlot-scale-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides Cabernet Sauvignon, which Bordeaux black grape is planted on a large scale in California?"
      choices:
        - { text: "Cabernet Franc", correct: false }
        - { text: "Merlot", correct: true }
        - { text: "Petit Verdot", correct: false }
        - { text: "Malbec", correct: false }
      explanation: |
        Merlot is still a major black grape, though Pinot Noir and Zinfandel
        now cover more ground. Cabernet Franc, Petit Verdot and Malbec are
        mostly small blending partners in Bordeaux-style reds.
    fr:
      question: "Outre le Cabernet Sauvignon, quel cépage noir bordelais est planté à grande échelle en Californie ?"
      choices:
        - { text: "Le Cabernet Franc", correct: false }
        - { text: "Le Merlot", correct: true }
        - { text: "Le Petit Verdot", correct: false }
        - { text: "Le Malbec", correct: false }
      explanation: |
        Le Merlot reste un grand cépage noir, même si le Pinot Noir et le
        Zinfandel occupent désormais plus de surface. Cabernet Franc, Petit
        Verdot et Malbec sont surtout de petits cépages d’appoint dans les
        assemblages de style bordelais.

  - id: calif-merlot-easy-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the usual profile of California Merlot?"
      choices:
        - { text: "Firm and tannic, needing years in bottle", correct: false }
        - { text: "Approachable, with soft tannins and ripe black fruit", correct: true }
        - { text: "Light, with tart red fruit and high acidity", correct: false }
        - { text: "Herbaceous, with green pepper and firm acidity", correct: false }
      explanation: |
        Warm sun ripens the grape fully, so the tannins are supple and the
        wine drinks well young. That easy style made it a by-the-glass
        favourite in the 1990s.
    fr:
      question: "Quel est le profil habituel du Merlot californien ?"
      choices:
        - { text: "Ferme et tannique, il demande des années en bouteille", correct: false }
        - { text: "Accessible, aux tanins souples et aux fruits noirs mûrs", correct: true }
        - { text: "Léger, aux fruits rouges acidulés et à l’acidité élevée", correct: false }
        - { text: "Herbacé, au poivron vert et à l’acidité ferme", correct: false }
      explanation: |
        Le soleil mûrit pleinement le raisin : les tanins sont souples et le
        vin se boit bien jeune. Ce style facile en a fait un favori du vin au
        verre dans les années 1990.

  - id: calif-merlot-joaquin-001
    type: mcq
    deck: USA::California
    tags: [usa, california, grapes]
    status: reviewed
    source_id: c33-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which California area holds the largest share of the state's Merlot vines?"
      choices:
        - { text: "Napa Valley", correct: false }
        - { text: "The San Joaquin Valley", correct: true }
        - { text: "Sonoma County", correct: false }
        - { text: "Monterey County", correct: false }
      explanation: |
        It is the southern part of the Central Valley, a long, hot, flat and
        irrigated basin that also takes in San Joaquin County around Lodi.
    fr:
      question: "Quelle zone de Californie concentre la plus grande part des surfaces de Merlot ?"
      choices:
