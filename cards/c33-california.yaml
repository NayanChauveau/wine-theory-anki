  - id: calif-cv-yield-water-001
    type: mcq
    deck: USA::California
    tags: [usa, california, viticulture]
    status: reviewed
    source_id: c33-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Beyond keeping vines alive in the dry season, what is irrigation in California's Central Valley mainly used for?"
      choices:
        - { text: "Protecting buds by spraying against spring frost", correct: false }
        - { text: "Raising yields", correct: true }
        - { text: "Stressing vines to concentrate flavour", correct: false }
        - { text: "Lowering mildew pressure in the canopy", correct: false }
      explanation: |
        Generous water on fertile soil in a hot climate gives large crops
        at a low cost per tonne. Deficit irrigation to concentrate flavour
        belongs to quality sites, and wetter canopies raise mildew risk.
    fr:
      question: "Au-delà de la survie des vignes en saison sèche, à quoi sert surtout l’irrigation dans la Central Valley, en Californie ?"
      choices:
        - { text: "À protéger les bourgeons du gel de printemps par aspersion", correct: false }
        - { text: "À augmenter les rendements", correct: true }
        - { text: "À stresser la vigne pour concentrer les arômes", correct: false }
        - { text: "À réduire la pression de l’oïdium dans le feuillage", correct: false }
      explanation: |
        Beaucoup d’eau sur un sol fertile, sous un climat chaud : de gros
        rendements à faible coût par tonne. L’irrigation déficitaire, qui
        concentre les arômes, relève des sites de qualité, et un feuillage
        plus humide augmente le risque de maladies cryptogamiques.

