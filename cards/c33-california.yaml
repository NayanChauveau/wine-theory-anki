        - { text: "La Templeton Gap et les collines de Paso Robles", correct: false }
      explanation: |
        L’air qui franchit le Golden Gate traverse la baie de San Pablo vers
        Carneros et Napa ; la Petaluma Gap et le couloir de la Russian River
