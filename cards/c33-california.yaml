        - { text: "Medium body, firm grippy tannin and tart redcurrant", correct: false }
        - { text: "Medium body, high acidity, leafy and herbaceous notes", correct: false }
      explanation: |
        Long sunny seasons ripen the tannin fully, so the wine feels
        plush rather than astringent, and high alcohol comes with that
        ripeness. Cooler sites such as Monterey and the North Coast keep
