        Les longues saisons ensoleillées mûrissent pleinement les tanins :
        le vin paraît soyeux plutôt qu’astringent, avec l’alcool élevé qui
        accompagne cette maturité. Les sites plus frais, comme Monterey et la
        North Coast, gardent assez de fraîcheur pour que le fruit noir reste net.

  - id: calif-pinot-sites-001
    type: mcq
