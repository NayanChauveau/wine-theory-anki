    fr:
      question: "Qu’est-ce qui façonne surtout le climat des vignobles de la North Coast, en Californie ?"
      choices:
        - { text: "Des vents chauds et secs venus de la Central Valley", correct: false }
        - { text: "Le brouillard et les brises fraîches du Pacifique", correct: true }
        - { text: "L’air froid qui descend de la Sierra Nevada", correct: false }
        - { text: "L’altitude, la plupart des vignes dépassant 1 000 m", correct: false }
      explanation: |
        Le courant froid de Californie refroidit l’air au-dessus de la mer ;
        brouillard et vent s’engouffrent ensuite par les brèches des chaînes
        côtières et remontent les vallées, rafraîchissant les sites qu’ils
        atteignent.

