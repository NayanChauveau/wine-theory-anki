      sources: [known-fact]
    en:
      question: What legal bars sit on Sélection de Grains Nobles versus VT?
      choices:
        - { text: "Any grape, and a lower sugar floor than VT", correct: false }
        - { text: "Still a noble variety, with a higher grape-specific sugar minimum than VT", correct: true }
        - { text: "Pinot Blanc only", correct: false }
        - { text: "SGN has no sugar rule", correct: false }
      explanation: |
        **Same noble-grape club, higher must-weight than VT.** That is why
        SGN is always a sweet wine and not every vintage.

  - id: alsace-sgn-botrytis-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0080
    review:
