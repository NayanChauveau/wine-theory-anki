        - { text: "Only Crémant, with no still wine", correct: false }
        - { text: "Vin de France", correct: false }
      explanation: |
        The regional **Alsace** AOC is the volume still wine. Grand cru is
        a sliver. Crémant is a large sparkling stream, not this still pile.

  - id: alsace-varietal-100-001
