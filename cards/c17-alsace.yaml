        - { text: "Malolactic conversion", correct: true }
        - { text: "Tartrate stabilisation", correct: false }
        - { text: "Clarification before bottling", correct: false }
      explanation: |
        Producers generally block **malolactic conversion** to retain acidity and the
        precise varietal aromas of wines such as Riesling and Muscat. It is a common
