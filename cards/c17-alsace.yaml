    en:
      question: If an Alsace bottle names one grape, how much of the wine must be that grape?
      choices:
        - { text: "At least 85%", correct: false }
        - { text: "100%", correct: true }
        - { text: "At least 50%", correct: false }
        - { text: "At least 75%", correct: false }
      explanation: |
        A varietal indication in Alsace requires **100% of the named grape**, stricter than
        the usual EU 85% threshold. Separate rules apply to authorised named blends such
        as Gentil and certain grands crus.
    fr:
      question: Lorsqu’une bouteille d’Alsace porte le nom d’un seul cépage, quelle proportion du vin doit provenir de ce cépage ?
      choices:
        - { text: "Au moins 85 %", correct: false }
        - { text: "100 %", correct: true }
        - { text: "Au moins 50 %", correct: false }
        - { text: "Au moins 75 %", correct: false }
      explanation: |
        En Alsace, l’indication d’un cépage exige **100 % du cépage nommé**, soit une règle
        plus stricte que le seuil européen habituel de 85 %. Des règles distinctes
        s’appliquent aux assemblages nommés autorisés comme Gentil et certains grands crus.

  - id: alsace-village-name-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Under what condition may a commune name supplement the regional Alsace AOC?
      choices:
        - { text: "Any commune may be named if most grapes come from it", correct: false }
        - { text: "Only an authorised communal denomination meeting its specific rules may be used", correct: true }
        - { text: "A commune may be named only when the wine also qualifies as grand cru", correct: false }
        - { text: "Every regional Alsace wine must state its commune of production", correct: false }
      explanation: |
        Since 2011, the regional AOC can be supplemented by specified **communal
        denominations** or lieux-dits when their production rules are met. This is not a
        complete Burgundy-style ladder of village AOCs.
    fr:
      question: À quelle condition le nom d’une commune peut-il compléter l’AOC régionale Alsace ?
      choices:
        - { text: "Toute commune peut être nommée si elle fournit la majorité des raisins", correct: false }
        - { text: "Seule une dénomination communale autorisée respectant ses règles propres peut être employée", correct: true }
        - { text: "Une commune ne peut être nommée que si le vin est également grand cru", correct: false }
        - { text: "Tout vin régional d’Alsace doit indiquer sa commune de production", correct: false }
      explanation: |
        Depuis 2011, l’AOC régionale peut être complétée par certaines **dénominations
        communales** ou certains lieux-dits lorsque leurs règles de production sont
        respectées. Il ne s’agit pas d’une hiérarchie complète d’AOC communales comparable
        à celle de la Bourgogne.

