        - { text: "Le Pinot Gris vieillit généralement plus longtemps que les meilleurs Rieslings", correct: false }
        - { text: "Le potentiel de garde dépend principalement de l’emploi de bois neuf", correct: false }
      explanation: |
        Une acidité élevée et une bonne concentration donnent à de nombreux grands
        Rieslings et grands crus une réelle capacité de vieillissement. Le Pinot Blanc
        simple se boit généralement plus tôt, tandis que les VT et SGN doux peuvent aussi
        connaître une très longue garde.

