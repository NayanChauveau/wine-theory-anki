      choices:
        - { text: "One, covering every colour and bubble", correct: false }
        - { text: "Three — Alsace, Alsace Grand Cru, and Crémant d’Alsace", correct: true }
        - { text: "Exactly two, with no sparkling AOC", correct: false }
        - { text: "Twelve, like the Beaujolais crus", correct: false }
      explanation: |
        **Three AOCs.** The old “two appellations” line forgets **Crémant
        d’Alsace**. Still wine is **Alsace** or **Alsace Grand Cru**.

  - id: alsace-still-aocs-001
    type: mcq
