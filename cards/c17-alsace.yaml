    deck: France::Alsace
    tags: [france, alsace, grapes]
    status: reviewed
    source_id: c17-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which profile traditionally characterises most regional Alsace Pinot Noir?
      choices:
        - { text: "Full-bodied, deeply coloured and high in firm tannin", correct: false }
        - { text: "Light-bodied and fruity, made as red or rosé", correct: true }
        - { text: "Medium-sweet, pale and strongly affected by noble rot", correct: false }
        - { text: "Full-bodied, fortified and matured oxidatively", correct: false }
      explanation: |
        The traditional regional style is **light, fresh and fruit-driven**. Warmer
        seasons, lower yields and greater use of oak have also encouraged more
        concentrated reds, including the recently recognised red grand crus.
    fr:
      question: Quel profil caractérise traditionnellement la majorité des Pinot Noirs régionaux d’Alsace ?
      choices:
        - { text: "Corsés, très colorés et riches en tannins fermes", correct: false }
        - { text: "Légers et fruités, élaborés en rouge ou en rosé", correct: true }
        - { text: "Demi-doux, pâles et fortement marqués par la pourriture noble", correct: false }
        - { text: "Corsés, mutés et élevés sous un régime oxydatif", correct: false }
      explanation: |
        Le style régional traditionnel est **léger, frais et dominé par le fruit**. Des
        saisons plus chaudes, des rendements plus faibles et un emploi accru du bois ont
        aussi favorisé des rouges plus concentrés, dont les grands crus rouges récemment
        reconnus.

  - id: alsace-pn-oak-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, grapes]
    status: reviewed
    source_id: c17-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which maturation choice can add toast, spice and structure to an ambitious Alsace Pinot Noir?
      choices:
        - { text: "Ageing in old neutral foudres", correct: false }
        - { text: "Maturation in new oak barrels", correct: true }
        - { text: "Early bottling in an inert container", correct: false }
        - { text: "Maturation in stainless steel without oxygen", correct: false }
      explanation: |
        **New oak barrels** can contribute toast, vanilla, spice and additional tannin.
        The best concentrated examples also depend on ripe fruit, low yields and suitable
        sites; oak alone cannot create concentration.
    fr:
      question: Quel choix d’élevage peut apporter des notes grillées, des épices et davantage de structure à un Pinot Noir d’Alsace ambitieux ?
      choices:
        - { text: "Un élevage en vieux foudres neutres", correct: false }
        - { text: "Un élevage en fûts de chêne neufs", correct: true }
        - { text: "Une mise en bouteille précoce dans un contenant inerte", correct: false }
        - { text: "Un élevage en cuve inox sans apport d’oxygène", correct: false }
      explanation: |
        Les **fûts neufs** peuvent apporter des notes grillées, de la vanille, des épices
        et des tannins supplémentaires. Les meilleurs vins concentrés reposent aussi sur
        des raisins mûrs, de faibles rendements et de bons terroirs ; le bois ne crée pas
        à lui seul la concentration.

  - id: alsace-aoc-count-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How many separate AOCs make up the current Alsace appellation framework?
      choices:
        - { text: "Three", correct: false }
        - { text: "Fifty-three", correct: true }
        - { text: "Fifty-one", correct: false }
        - { text: "Fifty-two", correct: false }
      explanation: |
        There is one regional **Alsace** AOC, one **Crémant d’Alsace** AOC and **51
        separate Alsace Grand Cru AOCs**. Older summaries often group the grands crus
        into one category and therefore speak loosely of three appellations.
    fr:
      question: Combien d’AOC distinctes composent actuellement le système d’appellations alsacien ?
      choices:
        - { text: "Trois", correct: false }
        - { text: "Cinquante-trois", correct: true }
        - { text: "Cinquante et une", correct: false }
        - { text: "Cinquante-deux", correct: false }
      explanation: |
        Le système comprend une AOC régionale **Alsace**, une AOC **Crémant d’Alsace** et
        **51 AOC Alsace Grand Cru distinctes**. Les synthèses anciennes regroupent souvent
        les grands crus en une seule catégorie et parlent donc, de manière simplifiée, de
        trois appellations.

  - id: alsace-still-aocs-001
