        - { text: "Muscat Ottonel", correct: false }
        - { text: "Pinot Noir", correct: false }
      explanation: |
        **Auxerrois.** It is often fermented with Pinot Blanc and sold under
        the Pinot Blanc name — read the small print.

  - id: alsace-pb-auxerrois-blend-001
    type: mcq
