        - { text: "A fortified solera", correct: false }
        - { text: "A German Prädikat imported by law", correct: false }
      explanation: |
        **Late harvest.** It is a ripeness mention, not a guaranteed dessert
        sweetness.

  - id: alsace-vt-how-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do the best Alsace VT wines usually get their extra sugar in the vineyard?
      choices:
        - { text: "Chaptalisation after a green pick", correct: false }
        - { text: "Passerillage, sometimes with a little noble rot", correct: true }
        - { text: "Icewine only, every year", correct: false }
        - { text: "Fortification in the cellar", correct: false }
      explanation: |
        **Passerillage** (grapes drying on the vine), plus **some botrytis**
        in the better years. SGN leans harder on noble rot.

  - id: alsace-sgn-rules-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0079
    review:
