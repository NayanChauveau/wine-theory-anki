    en:
      question: What vineyard headaches come with Muscat Blanc à Petits Grains in Alsace?
      choices:
        - { text: "Excessively high yields and very compact growth", correct: false }
        - { text: "Poor fruit set and susceptibility to rot", correct: true }
        - { text: "Very late budding combined with consistently uneven ripening", correct: false }
        - { text: "Low vigour and an inability to accumulate sugar", correct: false }
      explanation: |
        Muscat Blanc à Petits Grains is prone to **coulure**, which reduces fruit set, and
        its bunches can be vulnerable to rot. Muscat Ottonel offers growers a more reliable,
        though less aromatic, alternative.
    fr:
      question: Quelles difficultés viticoles présente le Muscat Blanc à Petits Grains en Alsace ?
      choices:
        - { text: "Des rendements excessivement élevés et une végétation très compacte", correct: false }
        - { text: "Une mauvaise nouaison et une sensibilité à la pourriture", correct: true }
        - { text: "Un débourrement très tardif associé à une maturité toujours irrégulière", correct: false }
        - { text: "Une faible vigueur et une incapacité à accumuler du sucre", correct: false }
      explanation: |
        Le Muscat Blanc à Petits Grains est sensible à la **coulure**, qui réduit la
        nouaison, ainsi qu’à la pourriture. Le Muscat Ottonel offre une solution plus
        régulière, quoique moins aromatique.

