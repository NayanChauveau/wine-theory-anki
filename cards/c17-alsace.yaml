      question: If you want a still red Alsace, which grape is the only legal option?
      choices:
        - { text: "Gamay", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Syrah", correct: false }
        - { text: "Cabernet Franc", correct: false }
      explanation: |
        **Pinot Noir** — the only red cépage in the still AOC. No Gamay
        corridor, no Syrah experiment on the label.

  - id: alsace-pinot-noir-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, grapes]
    status: reviewed
    source_id: c17-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What style are most Alsace Pinot Noirs in the glass?
      choices:
        - { text: "Heavier and more tannic than Pommard", correct: false }
        - { text: "A light, fruity red or rosé, without Côte d’Or weight", correct: true }
        - { text: "They are all grand-cru reds by law", correct: false }
        - { text: "Pinot Noir is illegal in Alsace", correct: false }
      explanation: |
        **A light, fruity red or rosé**, without Côte d’Or weight. A few
        newer, oakier or grand-cru reds are the exception, not the
        supermarket stack.

  - id: alsace-pn-oak-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, grapes]
    status: reviewed
    source_id: c17-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do some Alsace cellars add extra weight to Pinot Noir?
      choices:
        - { text: "By chaptalising to 20%", correct: false }
        - { text: "With new-oak flavour", correct: true }
        - { text: "By blending in Syrah", correct: false }
        - { text: "Oak is banned on red Alsace", correct: false }
      explanation: |
        **New oak** is one shortcut to more apparent concentration. Lower
        yields and better sites do the quieter job. Not every Alsace Pinot
        sees a new barrique.

  - id: alsace-aoc-count-001
    type: mcq
