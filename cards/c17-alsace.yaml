        - { text: "Always a 20-year dry Riesling shape", correct: false }
        - { text: "Deeply tannic red", correct: false }
      explanation: |
        **Delicate perfume, some richness (less than Gewurz), drink young.**
        Zotzenberg can be more serious; the volume wine is not.

