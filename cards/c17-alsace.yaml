    en:
      question: Where is Alsace Pinot Blanc usually planted?
      choices:
        - { text: "Only on Rangen’s volcanic grand-cru slope", correct: false }
        - { text: "On the more fertile Rhine-plain soils", correct: true }
        - { text: "Only above the Vosges treeline", correct: false }
        - { text: "It is banned from the plain", correct: false }
      explanation: |
        **Fertile plain soils.** The hillside is saved for Riesling and the
        other nobles. That is why so much Pinot Blanc ends up as crémant.

  - id: alsace-pinot-blanc-use-001
    type: mcq
