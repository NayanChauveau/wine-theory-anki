    source_id: c17-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How sweet is Sélection de Grains Nobles in the glass?
      choices:
        - { text: "Usually dry, because the high sugar must ferment completely", correct: false }
        - { text: "Sweet, although the intensity of botrytis character can vary", correct: true }
        - { text: "Usually off-dry and lighter than a regional Alsace wine", correct: false }
        - { text: "Sweet only when the wine is made from Gewurztraminer", correct: false }
      explanation: |
        SGN is a concentrated **sweet wine** made from exceptionally ripe grapes, usually
        affected by noble rot. The proportion and sensory impact of botrytis may differ,
        but the style is richer and sweeter than VT.
    fr:
      question: Quel niveau de sucrosité présente une Sélection de Grains Nobles d’Alsace ?
      choices:
        - { text: "Elle est généralement sèche, car tout le sucre doit fermenter", correct: false }
        - { text: "Elle est douce, même si l’intensité du caractère botrytisé peut varier", correct: true }
        - { text: "Elle est généralement demi-sèche et plus légère qu’un Alsace régional", correct: false }
        - { text: "Elle n’est douce que lorsqu’elle provient du Gewurztraminer", correct: false }
      explanation: |
        Une SGN est un **vin doux concentré** issu de raisins exceptionnellement mûrs,
        généralement atteints de pourriture noble. La proportion et l’expression du
        botrytis peuvent varier, mais le style est plus riche et plus doux qu’une VT.

