        - { text: "L’indication de sucrosité n’est obligatoire que pour les grands crus", correct: false }
      explanation: |
        L’étiquette doit porter une catégorie telle que **sec, demi-sec, moelleux ou
        doux**. Le consommateur peut ainsi distinguer des vins qui paraissaient autrefois
        semblables malgré des teneurs en sucre résiduel différentes.

  - id: alsace-vt-sweetness-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Alsace Vendanges Tardives mention primarily certify?
      choices:
        - { text: "A fixed residual-sugar level identical for every grape", correct: false }
        - { text: "Late-picked grapes meeting a high, variety-specific sugar minimum", correct: true }
        - { text: "Botrytised berries selected individually in every vintage", correct: false }
        - { text: "A fortified wine whose fermentation was stopped with spirit", correct: false }
      explanation: |
        VT is defined first by **late harvest and high natural grape ripeness**, with
        different thresholds for the permitted varieties and no enrichment. The wines
        are generally sweet or medium-sweet, but they are less concentrated than SGN and
        do not all finish at one identical residual-sugar level.
    fr:
      question: Que certifie principalement la mention alsacienne Vendanges Tardives ?
      choices:
        - { text: "Une teneur fixe en sucre résiduel identique pour chaque cépage", correct: false }
        - { text: "Des raisins récoltés tardivement atteignant un minimum élevé de sucre propre au cépage", correct: true }
        - { text: "Des baies botrytisées sélectionnées une à une à chaque millésime", correct: false }
        - { text: "Un vin muté dont la fermentation a été arrêtée par ajout d’alcool", correct: false }
      explanation: |
        La VT repose d’abord sur une **récolte tardive et une forte maturité naturelle**,
        avec des seuils différents selon les cépages admis et sans enrichissement. Ces
        vins sont généralement moelleux, mais moins concentrés que les SGN et ne
        présentent pas tous exactement la même teneur en sucre résiduel.

  - id: alsace-sgn-sweetness-001
