        - { text: "Syrah", correct: false }
        - { text: "Blending is illegal", correct: false }
      explanation: |
        **Auxerrois.** The label can still say Pinot Blanc. That mix is
        everyday Alsace, not a scandal.

  - id: alsace-sylvaner-decline-001
    type: mcq
