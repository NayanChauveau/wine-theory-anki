        - { text: "Both Alsace and Alsace Grand Cru", correct: true }
        - { text: "Only IGP wines", correct: false }
        - { text: "Neither — those words are German only", correct: false }
      explanation: |
        **Both still AOCs.** Crémant is a different AOC and does not wear
        VT/SGN.

  - id: alsace-cuvee-terms-001
    type: mcq
