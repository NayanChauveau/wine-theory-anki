    en:
      question: What legal number decides whether a wine may wear VT or SGN?
      choices:
        - { text: "Barrel age in months", correct: false }
        - { text: "Minimum sugar ripeness, set by grape", correct: true }
        - { text: "A tasting score from INAO each April", correct: false }
        - { text: "Alcohol after fortification", correct: false }
      explanation: |
        **Minimum must-weight / sugar ripeness**, and the bar is higher for
        SGN than for VT, and higher for some grapes than others.

  - id: alsace-vt-sgn-which-aoc-001
    type: mcq
