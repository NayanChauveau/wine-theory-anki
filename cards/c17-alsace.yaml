        - { text: "100%", correct: true }
        - { text: "51%, like Gentil", correct: false }
        - { text: "Any percentage, if the word appears", correct: false }
      explanation: |
        **100%.** Alsace is stricter than the usual EU varietal rule. If it
        says Riesling, it is Riesling.

