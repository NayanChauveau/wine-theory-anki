        - { text: "A thick deposit of tartrate crystals", correct: true }
        - { text: "A layer of lees deliberately left from every fermentation", correct: false }
        - { text: "A coating of grape-seed oil used as a sealant", correct: false }
      explanation: |
        **Tartrate deposits** accumulate over years of use. They are a natural
        precipitation from wine and help separate the liquid from direct contact with
        the wood.
    fr:
      question: Qu’est-ce qui tapisse l’intérieur des vieux foudres alsaciens ?
      choices:
        - { text: "Une nouvelle couche de bois chauffé à chaque millésime", correct: false }
        - { text: "Un épais dépôt de cristaux de tartre", correct: true }
        - { text: "Une couche de lies volontairement conservée après chaque fermentation", correct: false }
        - { text: "Un enduit d’huile de pépins de raisin servant de joint", correct: false }
      explanation: |
        Des **dépôts tartriques** s’accumulent au fil des années d’utilisation. Cette
        précipitation naturelle du vin contribue à isoler le liquide du contact direct
        avec le bois.

  - id: alsace-tartrate-effect-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a thick tartrate lining do to wine in an Alsace foudre?
      choices:
        - { text: "It increases extraction of toast and vanilla from the wood", correct: false }
        - { text: "It limits wood contact and keeps oak flavour very low", correct: true }
        - { text: "It promotes rapid oxygen uptake during fermentation", correct: false }
        - { text: "It triggers malolactic conversion in every white wine", correct: false }
      explanation: |
        The crust reduces direct contact between wine and wood. Combined with the large
        volume and age of the vessel, this makes the foudre a nearly neutral container
        rather than a source of obvious oak flavour.
    fr:
      question: Quel effet un épais dépôt de tartre produit-il dans un foudre alsacien ?
      choices:
        - { text: "Il augmente l’extraction des arômes grillés et vanillés du bois", correct: false }
        - { text: "Il limite le contact avec le bois et réduit fortement le goût de chêne", correct: true }
        - { text: "Il accélère l’absorption d’oxygène pendant la fermentation", correct: false }
        - { text: "Il déclenche la fermentation malolactique de tous les vins blancs", correct: false }
      explanation: |
        Le dépôt réduit le contact direct entre le vin et le bois. Avec le grand volume
        et l’âge du récipient, il fait du foudre un contenant presque neutre plutôt qu’une
        source d’arômes boisés marqués.

