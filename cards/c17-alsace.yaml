      sources: [known-fact]
    en:
      question: How is the extra sugar for Alsace SGN usually grown?
      choices:
        - { text: "Only by chaptalisation", correct: false }
        - { text: "Usually by noble rot", correct: true }
        - { text: "Only by freezing on the vine every October", correct: false }
        - { text: "By watering the must in tank", correct: false }
      explanation: |
        **Usually noble rot.** Passerillage can help; SGN without botrytis
        is the exception. **Hugel SGN** is the botrytis-shaped example.

