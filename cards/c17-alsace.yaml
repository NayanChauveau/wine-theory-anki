        - { text: "Blanquette de Limoux", correct: false }
        - { text: "Sekt b.A.", correct: false }
      explanation: |
        **Crémant d’Alsace.** Still Pinot Blanc exists; the bulk of the
        plain crop is for bubbles.

  - id: alsace-pinot-blanc-still-001
    type: mcq
