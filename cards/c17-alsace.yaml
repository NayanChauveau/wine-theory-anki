      question: Which information accompanies the appellation name on an Alsace Grand Cru label?
      choices:
        - { text: "The producer’s quality rank and a mandatory barrel-age statement", correct: false }
        - { text: "The vintage and, for a varietal wine, the grape", correct: true }
        - { text: "The sweetness category and a mandatory village classification", correct: false }
        - { text: "The exact yield and harvest date for the parcel", correct: false }
      explanation: |
        The full grand cru appellation identifies the named site, and the **vintage is
        compulsory**. A varietal wine also states its grape; authorised blends need not
        present a single variety.
    fr:
      question: Quelles informations accompagnent le nom de l’appellation sur une étiquette d’Alsace Grand Cru ?
      choices:
        - { text: "Le classement propre au producteur et une durée obligatoire d’élevage sous bois", correct: false }
        - { text: "Le millésime et, pour un vin monocépage, le cépage", correct: true }
        - { text: "La catégorie de sucrosité et un classement communal obligatoire", correct: false }
        - { text: "Le rendement exact et la date de vendange de la parcelle", correct: false }
      explanation: |
        Le nom complet de l’appellation grand cru identifie le site, et le **millésime est
        obligatoire**. Un vin monocépage indique aussi son cépage ; un assemblage autorisé
        n’a pas à présenter un cépage unique.

  - id: alsace-gc-size-row-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0075
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why have some top Alsace domaines refused the Grand Cru mention?
      choices:
        - { text: "They object to the compulsory use of new oak for grand cru wines", correct: false }
        - { text: "They consider some boundaries too broad and uneven in quality", correct: true }
        - { text: "They prefer higher yields than the regional Alsace AOC permits", correct: false }
        - { text: "They are not allowed to state the producer name on a grand cru label", correct: false }
      explanation: |
        Critics argue that certain delimited sites are large enough to contain land of
        differing potential. Trimbach’s Clos Sainte-Hune, within Rosacker, is the classic
        example of a prestigious wine historically sold without the grand cru wording.
    fr:
      question: Pourquoi certains grands domaines alsaciens ont-ils refusé d’employer la mention Grand Cru ?
      choices:
        - { text: "Ils contestent l’emploi obligatoire de bois neuf pour les grands crus", correct: false }
        - { text: "Ils jugent certaines délimitations trop vastes et inégales en qualité", correct: true }
        - { text: "Ils recherchent des rendements supérieurs à ceux de l’AOC régionale Alsace", correct: false }
        - { text: "Ils ne peuvent pas indiquer le nom du producteur sur une étiquette de grand cru", correct: false }
      explanation: |
        Les critiques estiment que certains sites délimités sont assez vastes pour inclure
        des parcelles de potentiel inégal. Le Clos Sainte-Hune de Trimbach, situé dans
        Rosacker, est l’exemple classique d’un vin prestigieux historiquement vendu sans
        la mention grand cru.

  - id: alsace-vt-means-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0076
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the Alsace term Vendanges Tardives literally mean?
      choices:
        - { text: "Selected noble berries", correct: false }
        - { text: "Late harvest", correct: true }
        - { text: "Dry selection", correct: false }
        - { text: "First pressing", correct: false }
      explanation: |
        The words mean **late harvest**. The regulated mention also requires eligible
        varieties, hand harvesting, high natural grape sugar and no enrichment; it is
        more than a casual statement of picking date.
    fr:
      question: Que signifie littéralement la mention alsacienne Vendanges Tardives ?
      choices:
        - { text: "Sélection de baies nobles", correct: false }
        - { text: "Récolte tardive", correct: true }
        - { text: "Sélection sèche", correct: false }
        - { text: "Premier pressurage", correct: false }
      explanation: |
        La mention signifie **récolte tardive**. Sa réglementation impose aussi des
        cépages admissibles, une vendange manuelle, une forte richesse naturelle en sucre
        et l’absence d’enrichissement : elle ne se réduit donc pas à une simple date de
        récolte.

  - id: alsace-vt-how-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are sugars commonly concentrated in grapes destined for Alsace VT?
      choices:
        - { text: "Freezing late-picked grapes naturally on the vine", correct: false }
        - { text: "Passerillage on the vine, sometimes assisted by noble rot", correct: true }
        - { text: "Adding concentrated must after fermentation", correct: false }
        - { text: "Drying harvested grapes indoors before pressing", correct: false }
      explanation: |
        A long, dry autumn can cause **passerillage on the vine**, concentrating sugars as
        berries lose water. Noble rot may also contribute. Enrichment is prohibited for
        wines carrying the VT mention.
    fr:
      question: Comment les sucres se concentrent-ils généralement dans les raisins destinés à une VT d’Alsace ?
      choices:
        - { text: "Par congélation naturelle des raisins tardifs sur pied", correct: false }
        - { text: "Par passerillage sur souche, parfois complété par la pourriture noble", correct: true }
        - { text: "Par ajout de moût concentré après la fermentation", correct: false }
        - { text: "Par séchage des raisins récoltés à l’intérieur avant pressurage", correct: false }
      explanation: |
        Un automne long et sec peut provoquer un **passerillage sur souche** : les baies
        perdent de l’eau et leurs sucres se concentrent. La pourriture noble peut également
        intervenir. Tout enrichissement est interdit pour les vins portant la mention VT.

  - id: alsace-sgn-rules-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which requirements are stricter for Sélection de Grains Nobles than for VT?
      choices:
        - { text: "More permitted varieties and a lower sugar minimum than VT", correct: false }
        - { text: "The same noble varieties but a higher grape-specific sugar minimum", correct: true }
        - { text: "Pinot Gris and Gewurztraminer with the same minimum as VT", correct: false }
        - { text: "The same sugar minimum as VT but compulsory new-oak ageing", correct: false }
      explanation: |
        SGN uses the same eligible noble varieties as VT but requires a **higher natural
        sugar concentration at harvest**. Neither category may be enriched, and both are
        subject to extended maturation before release.
    fr:
      question: Quelles exigences distinguent une Sélection de Grains Nobles d’une VT ?
      choices:
        - { text: "Davantage de cépages admis et une richesse minimale en sucre plus faible", correct: false }
        - { text: "Les mêmes cépages nobles mais une richesse minimale en sucre plus élevée selon le cépage", correct: true }
        - { text: "Pinot Gris et Gewurztraminer avec le même minimum de sucre qu’une VT", correct: false }
        - { text: "Le même minimum de sucre qu’une VT mais un élevage obligatoire en bois neuf", correct: false }
      explanation: |
        Une SGN emploie les mêmes cépages nobles admissibles qu’une VT, mais exige une
        **richesse naturelle en sucre plus élevée à la récolte**. Aucune des deux
        catégories ne peut être enrichie et toutes deux doivent connaître un élevage
        prolongé avant leur commercialisation.

  - id: alsace-sgn-botrytis-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What usually concentrates the sugars in grapes used for Alsace SGN?
      choices:
        - { text: "Mainly by adding concentrated must before fermentation", correct: false }
        - { text: "Usually through noble rot concentrating selected berries", correct: true }
        - { text: "Mainly by freezing intact bunches on the vine", correct: false }
        - { text: "Usually by drying whole bunches indoors after harvest", correct: false }
      explanation: |
        **Botrytis cinerea** perforates berry skins and promotes water loss, concentrating
        sugar, acidity and flavour. Passerillage may contribute, but noble rot is the
        defining route for the classic SGN style.
    fr:
      question: Comment les raisins destinés à une SGN d’Alsace atteignent-ils généralement leur très forte concentration en sucre ?
      choices:
        - { text: "Principalement par ajout de moût concentré avant la fermentation", correct: false }
        - { text: "Généralement par la pourriture noble qui concentre les baies sélectionnées", correct: true }
        - { text: "Principalement par congélation des grappes entières sur pied", correct: false }
        - { text: "Généralement par séchage des grappes entières à l’intérieur après la récolte", correct: false }
      explanation: |
        **Botrytis cinerea** perfore la peau des baies et favorise la perte d’eau, ce qui
        concentre le sucre, l’acidité et les arômes. Le passerillage peut contribuer, mais
        la pourriture noble est la voie caractéristique du style SGN classique.

  - id: alsace-sgn-rare-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How frequently can Alsace producers make SGN successfully?
      choices:
        - { text: "In most years because the dry autumn reliably produces noble rot", correct: false }
        - { text: "Only in suitable years; conditions do not allow it every vintage", correct: true }
        - { text: "Mainly in cooler, wetter years with widespread botrytis", correct: false }
        - { text: "Whenever the regional crop does not reach normal ripeness", correct: false }
      explanation: |
        Producers need exceptional ripeness, suitably timed noble rot and sound fruit.
        Those conditions do not coincide every year, so SGN is **vintage-dependent**.
    fr:
      question: À quelle fréquence les producteurs alsaciens peuvent-ils réussir une SGN ?
      choices:
        - { text: "La plupart des années, car l’automne sec produit régulièrement de la pourriture noble", correct: false }
        - { text: "Seulement lors des années favorables, car les conditions ne conviennent pas à chaque millésime", correct: true }
        - { text: "Surtout lors des années plus fraîches et humides où le botrytis est très répandu", correct: false }
        - { text: "Chaque fois que la récolte régionale n’atteint pas sa maturité normale", correct: false }
      explanation: |
        Il faut une maturité exceptionnelle, une pourriture noble se développant au bon
        moment et des raisins restant sains. Ces conditions ne coïncident pas chaque année :
        la production de SGN est donc **très dépendante du millésime**.

  - id: alsace-sgn-volume-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What production volume is typical for Alsace SGN?
      choices:
        - { text: "Volumes comparable with the regional Alsace AOC", correct: false }
        - { text: "Very small quantities obtained through selective picking", correct: true }
        - { text: "Volumes comparable with the estate’s grand cru production", correct: false }
        - { text: "Volumes generally larger than the estate’s VT production", correct: false }
      explanation: |
        Selective picking, berry dehydration and the rarity of suitable conditions keep
        SGN production **extremely small**. Even in a favourable year, it represents only
        a tiny fraction of an estate’s crop.
    fr:
      question: Quel volume de production est typique d’une SGN d’Alsace ?
      choices:
        - { text: "Des volumes comparables à ceux de l’AOC régionale Alsace", correct: false }
        - { text: "De très petites quantités obtenues par des tries sélectives", correct: true }
        - { text: "Des volumes comparables à la production de grands crus du domaine", correct: false }
        - { text: "Des volumes généralement supérieurs à la production de VT du domaine", correct: false }
      explanation: |
        Les tries sélectives, la déshydratation des baies et la rareté des conditions
        favorables limitent la production de SGN à des volumes **extrêmement faibles**.
        Même lors d’une bonne année, elle ne représente qu’une infime partie de la récolte.
