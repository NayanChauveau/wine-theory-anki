      choices:
        - { text: "Cru Bourgeois and Premier Cru", correct: false }
        - { text: "Vendange Tardive and Sélection de Grains Nobles", correct: true }
        - { text: "Kabinett and Spätlese only, as German law", correct: false }
        - { text: "Vin jaune and Macvin", correct: false }
      explanation: |
        **VT** and **SGN** are ripeness mentions, not extra AOCs. They can
        sit on Alsace or Alsace Grand Cru.

  - id: alsace-vt-sgn-ripeness-001
    type: mcq
    deck: France::Alsace
