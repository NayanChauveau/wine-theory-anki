        - { text: "Alsace and Alsace Grand Cru", correct: true }
        - { text: "Côte de Nuits and Côte de Beaune", correct: false }
        - { text: "AOC and IGP only, with no grand cru", correct: false }
      explanation: |
        **Alsace** and **Alsace Grand Cru**. Crémant is the sparkling AOC,
        not a third still tier.

  - id: alsace-vt-sgn-mentions-001
    type: mcq
