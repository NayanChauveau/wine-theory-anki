        - { text: "Tannic and built like a Médoc", correct: false }
        - { text: "Always dessert-sweet", correct: false }
      explanation: |
        **Light, simple, refreshing, non-aromatic.** A lunch wine, not a
        Schlossberg Riesling.

  - id: alsace-auxerrois-001
    type: mcq
