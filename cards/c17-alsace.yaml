      choices:
        - { text: "Sylvaner", correct: false }
        - { text: "Pinot Blanc", correct: true }
        - { text: "Chasselas", correct: false }
        - { text: "Gewurztraminer is a non-noble grape and the largest", correct: false }
      explanation: |
        **Pinot Blanc** (often with **Auxerrois** in the same tank) is the
        workhorse non-noble. Riesling is larger among the nobles; Gewurz is
        noble.

  - id: alsace-pinot-blanc-plain-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, grapes]
    status: reviewed
    source_id: c17-0052
    review:
      fact_check: pass
