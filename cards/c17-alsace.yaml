    en:
      question: How is the current AOC structure for still Alsace wine organised?
      choices:
        - { text: "One regional AOC with no recognised grand cru appellations", correct: false }
        - { text: "One regional Alsace AOC plus 51 individual Alsace Grand Cru AOCs", correct: true }
        - { text: "Fifty-one village AOCs plus one regional sparkling AOC", correct: false }
        - { text: "Two regional AOCs divided solely by grape colour", correct: false }
      explanation: |
        Still wine can use the regional **Alsace** AOC or one of **51 individual Alsace
        Grand Cru AOCs**. Crémant d’Alsace is a separate sparkling-wine appellation.
    fr:
      question: Comment le système actuel des AOC de vins tranquilles d’Alsace est-il organisé ?
      choices:
        - { text: "Une AOC régionale sans aucune appellation grand cru reconnue", correct: false }
        - { text: "Une AOC régionale Alsace et 51 AOC Alsace Grand Cru individuelles", correct: true }
        - { text: "Cinquante et une AOC communales et une AOC régionale effervescente", correct: false }
        - { text: "Deux AOC régionales distinguées uniquement par la couleur du vin", correct: false }
      explanation: |
        Un vin tranquille peut relever de l’AOC régionale **Alsace** ou de l’une des **51
        AOC Alsace Grand Cru individuelles**. Crémant d’Alsace constitue une appellation
        séparée pour les vins effervescents.

  - id: alsace-vt-sgn-mentions-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides the AOCs, which two late-harvest mentions can appear on Alsace bottles?
      choices:
        - { text: "Réserve Personnelle and Cuvée Spéciale", correct: false }
        - { text: "Vendanges Tardives and Sélection de Grains Nobles", correct: true }
        - { text: "Edelzwicker d’Alsace and Gentil d’Alsace", correct: false }
        - { text: "Communal denomination and named lieu-dit", correct: false }
      explanation: |
        **Vendanges Tardives (VT)** and **Sélection de Grains Nobles (SGN)** are regulated
        late-harvest mentions rather than additional AOCs. Eligible wines may use them
        with Alsace or an Alsace Grand Cru appellation.
    fr:
      question: En plus de l’AOC, quelles sont les deux mentions réglementées de vendange tardive pouvant figurer sur une bouteille d’Alsace ?
      choices:
        - { text: "Réserve personnelle et Cuvée spéciale", correct: false }
        - { text: "Vendanges Tardives et Sélection de Grains Nobles", correct: true }
        - { text: "Edelzwicker d’Alsace et Gentil d’Alsace", correct: false }
        - { text: "Dénomination communale et indication de lieu-dit", correct: false }
      explanation: |
        **Vendanges Tardives (VT)** et **Sélection de Grains Nobles (SGN)** sont des
        mentions réglementées et non des AOC supplémentaires. Les vins admissibles
        peuvent les associer à Alsace ou à une AOC Alsace Grand Cru.

  - id: alsace-vt-sgn-ripeness-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which measurable requirement is central to eligibility for the VT or SGN mention?
      choices:
        - { text: "A minimum number of months in oak", correct: false }
        - { text: "A minimum grape-sugar level specific to the variety", correct: true }
        - { text: "A minimum percentage of new oak during maturation", correct: false }
        - { text: "A minimum finished-alcohol level achieved by fortification", correct: false }
      explanation: |
        The grapes must reach a specified **natural sugar concentration**. Thresholds
        vary by variety and are higher for SGN than for VT; enrichment is prohibited.
    fr:
      question: Quelle exigence mesurable est essentielle pour pouvoir employer la mention VT ou SGN ?
      choices:
        - { text: "Un nombre minimal de mois d’élevage sous bois", correct: false }
        - { text: "Une richesse minimale en sucre des raisins propre au cépage", correct: true }
        - { text: "Une proportion minimale de bois neuf pendant l’élevage", correct: false }
        - { text: "Un degré alcoolique final minimal obtenu par mutage", correct: false }
      explanation: |
        Les raisins doivent atteindre une **richesse naturelle en sucre** déterminée. Les
        seuils varient selon le cépage et sont plus élevés pour les SGN que pour les VT ;
        tout enrichissement est interdit.

