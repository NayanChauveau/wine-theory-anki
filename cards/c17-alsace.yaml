    fr:
      question: Quelle transformation en cave est généralement bloquée pour les vins blancs d’Alsace ?
      choices:
        - { text: "La fermentation alcoolique", correct: false }
        - { text: "La fermentation malolactique", correct: true }
        - { text: "La stabilisation tartrique", correct: false }
        - { text: "La clarification avant la mise en bouteille", correct: false }
      explanation: |
        Les producteurs bloquent généralement la **fermentation malolactique** afin de
        préserver l’acidité et la précision aromatique de cépages comme le Riesling et le
        Muscat. Il s’agit d’une pratique courante, non d’une règle absolue pour chaque vin.

  - id: alsace-spring-bottle-001
    type: mcq
