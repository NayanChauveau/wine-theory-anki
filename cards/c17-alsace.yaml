cards:
  - id: alsace-climate-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, climate]
    status: reviewed
    source_id: c17-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which climate description best fits Alsace?
      choices:
        - { text: "Cool maritime, with frequent rain through the growing season", correct: false }
        - { text: "Cool-to-moderate continental, with a strong rain-shadow effect", correct: true }
        - { text: "Warm maritime, with mild winters and a narrow annual range", correct: false }
        - { text: "High-altitude continental, with a very short growing season", correct: false }
      explanation: |
        The **Vosges** intercept much of the rain carried by Atlantic weather systems.
        Alsace is therefore unusually dry and sunny for its latitude, while its inland
        position gives it a continental pattern with cold winters and warm summers.
    fr:
      question: Quelle description climatique correspond le mieux au vignoble alsacien ?
      choices:
        - { text: "Frais et maritime, avec des pluies fréquentes pendant la saison végétative", correct: false }
        - { text: "Continental frais à modéré, avec un fort effet d’abri pluviométrique", correct: true }
        - { text: "Maritime chaud, avec des hivers doux et une faible amplitude annuelle", correct: false }
        - { text: "Continental d’altitude, avec une saison végétative très courte", correct: false }
      explanation: |
        Les **Vosges** arrêtent une grande partie des pluies apportées par les perturbations
        atlantiques. L’Alsace est donc particulièrement sèche et ensoleillée pour sa latitude,
        tandis que sa situation intérieure lui confère des hivers froids et des étés chauds.

  - id: alsace-westerlies-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, climate]
    status: reviewed
    source_id: c17-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which source of rain is largely blocked from the Alsace vineyards by the Vosges?
      choices:
        - { text: "Dry continental winds arriving from the east", correct: false }
        - { text: "Rain-bearing westerlies arriving from the Atlantic", correct: true }
        - { text: "Warm southerly winds arriving from the Mediterranean", correct: false }
        - { text: "Cold northerly winds crossing the Rhine plain", correct: false }
      explanation: |
        Moist **Atlantic westerlies** release much of their rain on the western side of
        the Vosges. The vineyards to the east lie in the resulting rain shadow.
    fr:
      question: Quelle source de pluie est en grande partie arrêtée par les Vosges avant d’atteindre le vignoble alsacien ?
      choices:
        - { text: "Les vents continentaux secs venant de l’est", correct: false }
        - { text: "Les vents d’ouest chargés de pluie venant de l’Atlantique", correct: true }
        - { text: "Les vents chauds du sud venant de la Méditerranée", correct: false }
        - { text: "Les vents froids du nord traversant la plaine du Rhin", correct: false }
      explanation: |
        Les vents d’ouest humides venus de l’**Atlantique** déversent une grande partie de
        leurs pluies sur le versant occidental des Vosges. Le vignoble, situé à l’est du
        massif, bénéficie ainsi d’un abri pluviométrique.

  - id: alsace-vosges-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, climate]
    status: reviewed
    source_id: c17-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What mountain range keeps Atlantic westerlies from dumping their rain on Alsace?
      choices:
        - { text: "The Massif Central", correct: false }
        - { text: "The Vosges mountains", correct: true }
        - { text: "The Jura mountains", correct: false }
        - { text: "The Black Forest", correct: false }
      explanation: |
        The **Vosges** create the rain shadow that makes Alsace notably dry. The Black
        Forest lies on the opposite side of the Rhine, while the Jura and Massif Central
        do not shield the region from Atlantic weather.
    fr:
      question: Quel massif protège l’Alsace viticole des pluies apportées par les vents d’ouest atlantiques ?
      choices:
        - { text: "Le Massif central", correct: false }
        - { text: "Les Vosges", correct: true }
        - { text: "Le Jura", correct: false }
        - { text: "La Forêt-Noire", correct: false }
      explanation: |
        Les **Vosges** créent l’abri pluviométrique à l’origine de la sécheresse relative
        de l’Alsace. La Forêt-Noire se trouve de l’autre côté du Rhin ; le Jura et le Massif
        central ne protègent pas la région des perturbations atlantiques.

  - id: alsace-dry-seasons-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, climate]
    status: reviewed
    source_id: c17-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why are Alsace summers and autumns usually warm, dry, and short on cloud?
      choices:
        - { text: "The Rhine funnels moist Atlantic air toward the vineyards", correct: false }
        - { text: "The Vosges intercept moist westerly weather first", correct: true }
        - { text: "The Black Forest redirects moist Rhine air toward the foothills", correct: false }
        - { text: "Mediterranean sea breezes clear the cloud each afternoon", correct: false }
      explanation: |
        By forcing moist Atlantic air to rise, the **Vosges** receive much of its rain
        before it reaches Alsace. The dry, bright autumn helps grapes ripen slowly and
        makes late harvesting possible in favourable years.
    fr:
      question: Pourquoi les étés et les automnes alsaciens sont-ils généralement chauds, secs et peu nuageux ?
      choices:
        - { text: "Le Rhin dirige l’air atlantique humide vers le vignoble", correct: false }
        - { text: "Les Vosges interceptent d’abord les perturbations humides venant de l’ouest", correct: true }
        - { text: "La Forêt-Noire bloque toutes les masses d’air chaud venant de l’est", correct: false }
        - { text: "Les brises marines méditerranéennes dissipent les nuages chaque après-midi", correct: false }
      explanation: |
        En forçant l’air atlantique humide à s’élever, les **Vosges** reçoivent une grande
        partie de ses pluies avant qu’il n’atteigne l’Alsace. L’automne sec et lumineux
        favorise une maturation lente et, les bonnes années, les vendanges tardives.

  - id: alsace-ripeness-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, climate]
    status: reviewed
    source_id: c17-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Alsace’s dry, sunny pattern do to the grapes?
      choices:
        - { text: "It usually limits sugar accumulation while preserving very high acidity", correct: false }
        - { text: "It allows high sugar ripeness to develop during a long autumn", correct: true }
        - { text: "It causes acidity to collapse before flavour ripeness is reached", correct: false }
        - { text: "It forces growers to harvest before the grapes are fully ripe", correct: false }
      explanation: |
        Sunshine and a long, relatively dry autumn favour **high sugar and flavour
        ripeness**. Cool nights can preserve acidity, although drought may slow
        photosynthesis in exceptionally dry seasons.
    fr:
      question: Quel effet le temps sec et ensoleillé de l’Alsace a-t-il généralement sur les raisins ?
      choices:
        - { text: "Il limite généralement l’accumulation de sucre tout en conservant une acidité très élevée", correct: false }
        - { text: "Il permet d’atteindre une forte maturité en sucre au cours d’un long automne", correct: true }
        - { text: "Il fait chuter l’acidité avant que la maturité aromatique ne soit atteinte", correct: false }
        - { text: "Il oblige à vendanger avant la pleine maturité des raisins", correct: false }
      explanation: |
        L’ensoleillement et l’automne relativement long et sec favorisent une **forte
        maturité en sucre et en arômes**. Les nuits fraîches peuvent préserver l’acidité,
        même si une sécheresse marquée risque de ralentir la photosynthèse.

  - id: alsace-drought-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, climate]
    status: reviewed
    source_id: c17-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which water-related vineyard risk can occur around Colmar despite its northerly latitude?
      choices:
        - { text: "Prolonged waterlogging during most summers", correct: false }
        - { text: "Drought and water stress in dry years", correct: true }
        - { text: "Regular salt damage from coastal spray", correct: false }
        - { text: "Excessive vigour caused by constant summer rain", correct: false }
      explanation: |
        Colmar is among the driest wine-growing areas in France. In a hot year, limited
        rainfall can lead to **water stress**, especially on shallow or free-draining soils.
    fr:
      question: Quel risque hydrique peut toucher le vignoble autour de Colmar malgré sa latitude septentrionale ?
      choices:
        - { text: "Un engorgement prolongé des sols pendant la plupart des étés", correct: false }
        - { text: "La sécheresse et le stress hydrique lors des années sèches", correct: true }
        - { text: "Des dégâts salins réguliers dus aux embruns côtiers", correct: false }
        - { text: "Une vigueur excessive provoquée par des pluies estivales constantes", correct: false }
      explanation: |
        Colmar se situe dans l’une des zones viticoles les plus sèches de France. Lors
        d’une année chaude, le manque de pluie peut entraîner un **stress hydrique**,
        surtout sur les sols peu profonds ou très drainants.

  - id: alsace-best-sites-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which sites usually produce Alsace’s top still wines?
      choices:
        - { text: "Deep alluvial soils on the flat Rhine plain", correct: false }
        - { text: "Well-exposed slopes on the Vosges foothills", correct: true }
        - { text: "Cool west-facing slopes behind the Vosges crest", correct: false }
        - { text: "Low-lying sites where cold air collects", correct: false }
      explanation: |
        The leading sites lie on the **Vosges foothills**, often with east to south-east
        exposure. Their slopes offer good sunlight and drainage; Schlossberg and Rangen
        are prominent examples.
    fr:
      question: Quels sites donnent généralement les meilleurs vins tranquilles d’Alsace ?
      choices:
        - { text: "Les sols alluviaux profonds de la plaine du Rhin", correct: false }
        - { text: "Les coteaux bien exposés du piémont vosgien", correct: true }
        - { text: "Les versants frais orientés à l’ouest derrière la crête des Vosges", correct: false }
        - { text: "Les sites bas où s’accumule l’air froid", correct: false }
      explanation: |
        Les meilleurs sites se trouvent sur le **piémont vosgien**, souvent exposés à
        l’est ou au sud-est. La pente assure un bon ensoleillement et un bon drainage ;
        Schlossberg et Rangen en sont deux exemples réputés.

  - id: alsace-north-cooler-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, climate]
    status: reviewed
    source_id: c17-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does the northern stretch of the Alsace vineyard differ from the south?
      choices:
        - { text: "It is warmer and drier because the Vosges are higher", correct: false }
        - { text: "It is cooler and less sheltered because the Vosges are lower", correct: true }
        - { text: "It has the same temperatures and rainfall as the southern sector", correct: false }
        - { text: "It is cooler but more strongly protected from Atlantic rain", correct: false }
      explanation: |
        The Vosges become lower toward the north, weakening the rain shadow. The
        Bas-Rhin is therefore generally **cooler and less dry** than the Haut-Rhin,
        where many famous grands crus are concentrated.
    fr:
      question: En quoi la partie nord du vignoble alsacien diffère-t-elle de la partie sud ?
      choices:
        - { text: "Elle est plus chaude et plus sèche parce que les Vosges y sont plus élevées", correct: false }
        - { text: "Elle est plus fraîche et moins abritée parce que les Vosges y sont moins élevées", correct: true }
        - { text: "Elle reçoit les mêmes températures et les mêmes pluies que le secteur sud", correct: false }
        - { text: "Elle est plus fraîche mais davantage protégée des pluies atlantiques", correct: false }
      explanation: |
        Les Vosges s’abaissent vers le nord, ce qui réduit leur effet d’abri. Le Bas-Rhin
        est donc généralement **plus frais et moins sec** que le Haut-Rhin, où se
        concentrent de nombreux grands crus réputés.

  - id: alsace-plain-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where are many of Alsace’s higher-yielding vineyards for less concentrated wines located?
      choices:
        - { text: "On the highest terraces of the Vosges foothills", correct: false }
        - { text: "On the flat plain between the foothills and the Rhine", correct: true }
        - { text: "On west-facing slopes beyond the Vosges crest", correct: false }
        - { text: "In the narrowest upper sections of the side valleys", correct: false }
      explanation: |
        The **Rhine plain** is generally flatter, more fertile and more exposed to frost
        than the foothills. It commonly supplies fruit for simpler still wines and
        Crémant d’Alsace.
    fr:
      question: Où se situent de nombreuses vignes alsaciennes à rendement plus élevé destinées à des vins moins concentrés ?
      choices:
        - { text: "Sur les terrasses les plus élevées du piémont vosgien", correct: false }
        - { text: "Dans la plaine située entre le piémont et le Rhin", correct: true }
        - { text: "Sur les versants occidentaux au-delà de la crête des Vosges", correct: false }
        - { text: "Dans les parties supérieures les plus étroites des vallées latérales", correct: false }
      explanation: |
        La **plaine du Rhin** est généralement plus plate, plus fertile et davantage
        exposée au gel que le piémont. Elle fournit souvent les raisins de vins tranquilles
        simples et du Crémant d’Alsace.

  - id: alsace-cremant-fruit-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, sparkling]
    status: reviewed
    source_id: c17-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which AOC is a major outlet for grapes grown on the Alsace plain?
      choices:
        - { text: "Alsace Grand Cru", correct: false }
        - { text: "Crémant d’Alsace", correct: true }
        - { text: "Alsace Vendanges Tardives", correct: false }
        - { text: "Alsace Sélection de Grains Nobles", correct: false }
      explanation: |
        The plain supplies substantial volumes of Pinot Blanc, Auxerrois and other fruit
        for **Crémant d’Alsace**. Grand cru, VT and SGN depend on more restricted sites
        or exceptional ripeness rather than being the main destination for plain fruit.
    fr:
      question: Quelle AOC constitue un débouché important pour les raisins cultivés dans la plaine d’Alsace ?
      choices:
        - { text: "Alsace Grand Cru", correct: false }
        - { text: "Crémant d’Alsace", correct: true }
        - { text: "Alsace Vendanges Tardives", correct: false }
        - { text: "Alsace Sélection de Grains Nobles", correct: false }
      explanation: |
        La plaine fournit d’importants volumes de Pinot Blanc, d’Auxerrois et d’autres
        raisins destinés au **Crémant d’Alsace**. Les grands crus, VT et SGN dépendent
        de sites plus restreints ou d’une maturité exceptionnelle.

  - id: alsace-foothill-soils-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, soil]
    status: reviewed
    source_id: c17-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How uniform are soils on the Alsace foothill slopes?
      choices:
        - { text: "Mostly uniform gravel over the full length of the region", correct: false }
        - { text: "Highly varied, sometimes over very short distances", correct: true }
        - { text: "Predominantly chalk with little variation between sites", correct: false }
        - { text: "Predominantly deep alluvium across most foothill sites", correct: false }
      explanation: |
        Faulting along the Rhine rift exposed a **mosaic** of granite, limestone,
        sandstone, clay and volcanic material. Rangen is volcanic, while Schlossberg
        is noted for granite.
    fr:
      question: Dans quelle mesure les sols du piémont alsacien sont-ils homogènes ?
      choices:
        - { text: "Ils sont surtout constitués des mêmes graves sur toute la longueur du vignoble", correct: false }
        - { text: "Ils varient fortement, parfois sur de très courtes distances", correct: true }
        - { text: "Ils sont principalement crayeux et varient peu d’un site à l’autre", correct: false }
        - { text: "Ils sont partout dominés par de profondes alluvions", correct: false }
      explanation: |
        Les failles du fossé rhénan ont fait affleurer une **mosaïque** de granite,
        calcaire, grès, argile et roches volcaniques. Rangen est volcanique, tandis que
        Schlossberg est notamment associé au granite.

  - id: alsace-geology-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, soil]
    status: reviewed
    source_id: c17-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is the Alsace foothill soil mosaic so extreme?
      choices:
        - { text: "Glacial deposits formed one continuous moraine along the foothills", correct: false }
        - { text: "Faulting linked to the Rhine rift exposed many rock types", correct: true }
        - { text: "Historic Rhine flooding covered the foothills with similar alluvium", correct: false }
        - { text: "Weathering of a single sandstone bed created the full range of soils", correct: false }
      explanation: |
        The collapse of the **Rhine graben** and subsequent faulting brought many rock
        formations close together. Neighbouring vineyards can therefore sit on very
        different parent material.
    fr:
      question: Pourquoi le piémont alsacien présente-t-il une mosaïque de sols aussi complexe ?
      choices:
        - { text: "Les dépôts glaciaires ont formé une moraine continue le long du piémont", correct: false }
        - { text: "Les failles liées au fossé rhénan ont mis au jour de nombreuses roches", correct: true }
        - { text: "Les crues régulières du Rhin ont recouvert tous les coteaux des mêmes alluvions", correct: false }
        - { text: "L’altération d’une seule couche de grès a créé toute la diversité des sols", correct: false }
      explanation: |
        L’effondrement du **fossé rhénan** et les failles qui en ont résulté ont rapproché
        de nombreuses formations rocheuses. Deux parcelles voisines peuvent donc reposer
        sur des roches mères très différentes.

  - id: alsace-style-geology-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, soil]
    status: reviewed
    source_id: c17-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which vineyard factor contributes strongly to the diversity of styles among Alsace’s top sites?
      choices:
        - { text: "Uniform soils combined with one standard exposure", correct: false }
        - { text: "The geological patchwork of the Vosges foothills", correct: true }
        - { text: "A single grape variety planted throughout the region", correct: false }
        - { text: "Regional differences in permitted yields and harvest timing", correct: false }
      explanation: |
        The varied geology interacts with exposure, altitude and grape variety. A
        Riesling grown on volcanic Rangen will not have the same site expression as one
        grown on a granite grand cru.
    fr:
      question: Quel facteur viticole contribue fortement à la diversité des styles parmi les grands terroirs alsaciens ?
      choices:
        - { text: "Des sols uniformes associés à une exposition unique", correct: false }
        - { text: "La mosaïque géologique du piémont vosgien", correct: true }
        - { text: "La plantation d’un seul cépage dans toute la région", correct: false }
        - { text: "Des rendements et des dates de vendange identiques sur chaque site", correct: false }
      explanation: |
        La diversité géologique interagit avec l’exposition, l’altitude et le cépage. Un
        Riesling cultivé sur le terroir volcanique de Rangen n’exprimera pas son site de
        la même manière qu’un Riesling issu d’un grand cru granitique.

  - id: alsace-practice-split-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Alsace vineyard practice changes mainly with which contrast?
      choices:
        - { text: "The northern sector versus the southern sector", correct: false }
        - { text: "Steep foothill sites versus the flat Rhine plain", correct: true }
        - { text: "Organic estates versus conventional estates", correct: false }
        - { text: "Noble varieties versus the other authorised varieties", correct: false }
      explanation: |
        Slope and plain differ in frost risk, heat capture and ease of mechanisation.
        These differences influence training height and harvest method more directly
        than a simple north–south division.
    fr:
      question: Quel contraste explique une grande partie des différences de conduite du vignoble en Alsace ?
      choices:
        - { text: "Le secteur nord par rapport au secteur sud", correct: false }
        - { text: "Les coteaux escarpés par rapport à la plaine du Rhin", correct: true }
        - { text: "Les domaines biologiques par rapport aux domaines conventionnels", correct: false }
        - { text: "Les cépages nobles par rapport aux autres cépages autorisés", correct: false }
      explanation: |
        Le coteau et la plaine diffèrent par le risque de gel, la chaleur reçue et la
        facilité de mécanisation. Ces écarts influencent directement la hauteur de
        conduite et le mode de vendange.

  - id: alsace-slope-train-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why are vines usually trained low on Alsace’s steep slopes?
      choices:
        - { text: "To keep the buds above cold air that pools on the slope", correct: false }
        - { text: "To benefit from heat radiated by the ground", correct: true }
        - { text: "To increase exposure to strong winds at canopy height", correct: false }
        - { text: "To make mechanical harvesting easier on terraces", correct: false }
      explanation: |
        Low-trained vines benefit from **heat stored and radiated by the soil**, which
        aids ripening in a cool climate. Cold air tends to drain off mid-slope sites;
        lifting buds above pooled frost is more relevant on the plain.
    fr:
      question: Pourquoi les vignes sont-elles généralement conduites assez bas sur les coteaux escarpés d’Alsace ?
      choices:
        - { text: "Pour maintenir les bourgeons au-dessus de l’air froid qui s’accumule sur la pente", correct: false }
        - { text: "Pour profiter de la chaleur restituée par le sol", correct: true }
        - { text: "Pour exposer davantage la vigne aux vents forts à hauteur de feuillage", correct: false }
        - { text: "Pour faciliter la vendange mécanique sur les terrasses", correct: false }
      explanation: |
        Une conduite basse permet de profiter de la **chaleur emmagasinée puis restituée
        par le sol**, ce qui favorise la maturation dans un climat frais. L’air froid
        s’écoule généralement le long des coteaux ; son accumulation concerne davantage
        la plaine.

  - id: alsace-slope-hand-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why are grapes on Alsace’s steepest slopes usually harvested by hand?
      choices:
        - { text: "Machine harvesting would raise the sugar level too quickly", correct: false }
        - { text: "Terraces and gradients make machine access difficult", correct: true }
        - { text: "Grand cru rules require hand picking on both slopes and plains", correct: false }
        - { text: "Mechanical harvesting is reserved for noble varieties", correct: false }
      explanation: |
        Standard harvesters cannot work safely or effectively on many steep, terraced
        sites such as Rangen. The flatter plain is much easier to mechanise.
    fr:
      question: Pourquoi les raisins des coteaux alsaciens les plus escarpés sont-ils généralement vendangés à la main ?
      choices:
        - { text: "La vendange mécanique ferait monter trop rapidement la teneur en sucre", correct: false }
        - { text: "Les terrasses et les fortes pentes rendent l’accès des machines difficile", correct: true }
        - { text: "Les règles des grands crus imposent la vendange manuelle sur coteaux comme en plaine", correct: false }
        - { text: "La vendange mécanique est réservée aux cépages nobles", correct: false }
      explanation: |
        Les machines à vendanger classiques ne peuvent pas travailler efficacement et
        en sécurité sur de nombreux sites pentus ou en terrasses, comme Rangen. La plaine
        se prête beaucoup mieux à la mécanisation.

  - id: alsace-plain-train-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why are vines on the Alsace plain often trained high?
      choices:
        - { text: "To maximise heat radiated directly from the soil", correct: false }
        - { text: "To lift the buds above the coldest frost-prone air", correct: true }
        - { text: "To reduce airflow and retain humidity around the bunches", correct: false }
        - { text: "To prevent ripening on the more fertile soils", correct: false }
      explanation: |
        Cold air can pool on the flat land toward the Rhine. Higher training keeps buds
        and fruit above the coldest layer, reducing **spring-frost risk**.
    fr:
      question: Pourquoi les vignes de la plaine d’Alsace sont-elles souvent conduites assez haut ?
      choices:
        - { text: "Pour maximiser la chaleur rayonnée directement par le sol", correct: false }
        - { text: "Pour placer les bourgeons au-dessus de la couche d’air la plus froide", correct: true }
        - { text: "Pour réduire l’aération et retenir l’humidité autour des grappes", correct: false }
        - { text: "Pour empêcher la maturation sur les sols les plus fertiles", correct: false }
      explanation: |
        L’air froid peut s’accumuler sur les terrains plats proches du Rhin. Une conduite
        plus haute maintient les bourgeons et les raisins au-dessus de la couche la plus
        froide et réduit ainsi le **risque de gel printanier**.

  - id: alsace-organic-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which farming styles are unusually widespread in Alsace?
      choices:
        - { text: "High-input conventional farming with bare soil throughout", correct: false }
        - { text: "Organic and biodynamic viticulture", correct: true }
        - { text: "Irrigated high-yield farming under permanent cover", correct: false }
        - { text: "Integrated viticulture based on targeted conventional treatments", correct: false }
      explanation: |
        Alsace has a notable concentration of **organic and biodynamic** estates,
        including Zind-Humbrecht and Bott-Geyl. The dry climate helps reduce fungal
        disease pressure, although these systems still require careful protection.
    fr:
      question: Quels modes de culture sont particulièrement répandus dans le vignoble alsacien ?
      choices:
        - { text: "Une viticulture conventionnelle intensive maintenant les sols nus", correct: false }
        - { text: "La viticulture biologique et biodynamique", correct: true }
        - { text: "Une viticulture irriguée à haut rendement sous abri permanent", correct: false }
        - { text: "Une viticulture intégrée fondée sur des traitements conventionnels ciblés", correct: false }
      explanation: |
        L’Alsace compte une proportion notable de domaines **biologiques et
        biodynamiques**, dont Zind-Humbrecht et Bott-Geyl. Le climat sec limite la
        pression des maladies cryptogamiques, sans toutefois supprimer la nécessité de
        protéger la vigne.

  - id: alsace-organic-why-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is organic and biodynamic farming more practical in Alsace than in a wet maritime region?
      choices:
        - { text: "Deep soils remove the need for any vineyard treatments", correct: false }
        - { text: "Dry, sunny weather usually lowers fungal disease pressure", correct: true }
        - { text: "Cold winters reduce disease pressure more than low rainfall does", correct: false }
        - { text: "The rain shadow prevents any rain during the growing season", correct: false }
      explanation: |
        Fewer wet periods generally mean less downy mildew and rot pressure. Organic
        growers still monitor disease and may use permitted products such as copper and
        sulphur; the region is dry, not disease-free.
    fr:
      question: Pourquoi la viticulture biologique et biodynamique est-elle plus facile à pratiquer en Alsace que dans une région maritime humide ?
      choices:
        - { text: "Les sols profonds rendent tout traitement de la vigne inutile", correct: false }
        - { text: "Le temps sec et ensoleillé réduit généralement la pression des maladies cryptogamiques", correct: true }
        - { text: "Les hivers froids réduisent davantage les maladies que la faible pluviométrie", correct: false }
        - { text: "L’abri vosgien empêche toute pluie pendant la saison végétative", correct: false }
      explanation: |
        La rareté des périodes humides réduit généralement la pression du mildiou et de
        la pourriture. Les viticulteurs biologiques doivent néanmoins surveiller les
        maladies et peuvent employer des produits autorisés comme le cuivre et le soufre.

  - id: alsace-staggered-harvest-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What makes an Alsace vintage a logistical headache for a typical grower?
      choices:
        - { text: "Most estates farm one variety in a single large block", correct: false }
        - { text: "Numerous small parcels and varieties ripen at different times", correct: true }
        - { text: "Separate official dates force each variety to be picked at once", correct: false }
        - { text: "Large distances between vineyards and the region’s central wineries", correct: false }
      explanation: |
        A domaine may manage many scattered parcels planted to several varieties.
        Muscat, Riesling, Gewurztraminer and late-harvest lots do not all reach their
        target ripeness together, so picking can extend over many weeks.
    fr:
      question: Pourquoi les vendanges sont-elles souvent difficiles à organiser pour un domaine alsacien ?
      choices:
        - { text: "La plupart des domaines cultivent un seul cépage dans une grande parcelle", correct: false }
        - { text: "De nombreuses petites parcelles et plusieurs cépages mûrissent à des dates différentes", correct: true }
        - { text: "Des dates officielles distinctes imposent de récolter chaque cépage en une seule fois", correct: false }
        - { text: "De grandes distances séparent les vignes des caves centrales de la région", correct: false }
      explanation: |
        Un domaine peut exploiter de nombreuses parcelles dispersées et plantées de
        plusieurs cépages. Le Muscat, le Riesling, le Gewurztraminer et les lots de
        vendanges tardives n’atteignent pas leur maturité recherchée au même moment ; la
        récolte peut donc s’étaler sur plusieurs semaines.

  - id: alsace-harvest-months-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How long can an Alsace pick last from the first still fruit to the last sweet pass?
      choices:
        - { text: "From early August to the beginning of September", correct: false }
        - { text: "From September into November, occasionally later for sweet wines", correct: true }
        - { text: "From mid-September to a fixed cut-off at the end of October", correct: false }
        - { text: "From October into January for the main still-wine categories", correct: false }
      explanation: |
        Grapes for Crémant are generally picked first, followed by fruit for still Alsace
        and the grands crus. VT and SGN can extend the harvest well into autumn when
        conditions permit.
    fr:
      question: Sur quelle période les vendanges alsaciennes peuvent-elles s’étaler, des premiers raisins aux dernières sélections de vins doux ?
      choices:
        - { text: "Du début du mois d’août au début du mois de septembre", correct: false }
        - { text: "De septembre à novembre, parfois plus tard pour les vins doux", correct: true }
        - { text: "De la mi-septembre à une date limite fixe à la fin du mois d’octobre", correct: false }
        - { text: "D’octobre à janvier pour les principales catégories de vins tranquilles", correct: false }
      explanation: |
        Les raisins destinés au Crémant sont généralement récoltés en premier, puis
        viennent ceux des vins tranquilles d’Alsace et des grands crus. Lorsque les
        conditions le permettent, les VT et SGN prolongent les vendanges jusque tard en
        automne.

  - id: alsace-nobles-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, grapes]
    status: reviewed
    source_id: c17-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which four grapes are Alsace’s “noble” set?
      choices:
        - { text: "Riesling, Gewurztraminer, Pinot Gris, Pinot Blanc", correct: false }
        - { text: "Riesling, Gewurztraminer, Pinot Gris, Muscat", correct: true }
        - { text: "Riesling, Gewurztraminer, Sylvaner, Auxerrois", correct: false }
        - { text: "Pinot Gris, Pinot Blanc, Sylvaner, Chasselas", correct: false }
      explanation: |
        **Riesling, Gewurztraminer, Pinot Gris and Muscat** are traditionally called
        Alsace’s noble varieties. They form the core of grand cru production and are the
        only varieties eligible for VT and SGN; individual grands crus have exceptions.
    fr:
      question: Quels sont les quatre cépages traditionnellement qualifiés de « nobles » en Alsace ?
      choices:
        - { text: "Riesling, Gewurztraminer, Pinot Gris et Pinot Blanc", correct: false }
        - { text: "Riesling, Gewurztraminer, Pinot Gris et Muscat", correct: true }
        - { text: "Riesling, Gewurztraminer, Sylvaner et Auxerrois", correct: false }
        - { text: "Pinot Gris, Pinot Blanc, Sylvaner et Chasselas", correct: false }
      explanation: |
        Le **Riesling, le Gewurztraminer, le Pinot Gris et le Muscat** constituent les
        quatre cépages nobles traditionnels. Ils sont au cœur de la production des grands
        crus et sont les seuls admis pour les VT et SGN ; certains grands crus prévoient
        toutefois des exceptions particulières.

  - id: alsace-vt-sgn-grapes-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, grapes]
    status: reviewed
    source_id: c17-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grapes may be bottled as Alsace Vendanges Tardives or SGN?
      choices:
        - { text: "All authorised Alsace varieties", correct: false }
        - { text: "Riesling, Gewurztraminer, Pinot Gris and the Muscats", correct: true }
        - { text: "Pinot Blanc, Auxerrois, Sylvaner and Chasselas", correct: false }
        - { text: "Riesling, Pinot Blanc, Sylvaner and Pinot Noir", correct: false }
      explanation: |
        VT and SGN are limited to the **four noble families**. Muscat includes Muscat à
        Petits Grains and Muscat Ottonel. The wine must come from one eligible variety
        and meet a grape-specific minimum sugar level at harvest.
    fr:
      question: Quels cépages peuvent porter les mentions alsaciennes Vendanges Tardives ou Sélection de Grains Nobles ?
      choices:
        - { text: "Tous les cépages autorisés en Alsace", correct: false }
        - { text: "Riesling, Gewurztraminer, Pinot Gris et les Muscats", correct: true }
        - { text: "Pinot Blanc, Auxerrois, Sylvaner et Chasselas", correct: false }
        - { text: "Riesling, Pinot Blanc, Sylvaner et Pinot Noir", correct: false }
      explanation: |
        Les VT et SGN sont réservées aux **quatre familles nobles**. Le Muscat comprend
        les Muscats à Petits Grains et le Muscat Ottonel. Le vin doit provenir d’un seul
        cépage admis et atteindre à la récolte une richesse minimale en sucre propre à ce
        cépage.

  - id: alsace-gc-grapes-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace, grapes]
    status: reviewed
    source_id: c17-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which statement best summarises the grape rules for the 51 Alsace Grand Cru AOCs?
      choices:
        - { text: "Each grand cru may freely select from all regional grapes", correct: false }
        - { text: "The four nobles dominate, with site-specific exceptions", correct: true }
        - { text: "Riesling and Gewurztraminer are the sole permitted varieties", correct: false }
        - { text: "A blend of the four noble varieties is normally compulsory", correct: false }
      explanation: |
        Most grand cru wines are based on Riesling, Gewurztraminer, Pinot Gris or Muscat.
        **Zotzenberg** also permits Sylvaner; Altenberg de Bergheim and Kaefferkopf allow
        specified blends. Since 2022, **Hengst and Kirchberg de Barr** may also produce
        red grand cru from Pinot Noir.
    fr:
      question: Quelle affirmation résume le mieux les règles d’encépagement des 51 AOC Alsace Grand Cru ?
      choices:
        - { text: "Chaque grand cru choisit librement parmi tous les cépages régionaux", correct: false }
        - { text: "Les quatre cépages nobles dominent, avec des exceptions propres à certains sites", correct: true }
        - { text: "Le Riesling et le Gewurztraminer sont les seuls cépages admis", correct: false }
        - { text: "Un assemblage des quatre cépages nobles est normalement obligatoire", correct: false }
      explanation: |
        La plupart des grands crus reposent sur le Riesling, le Gewurztraminer, le Pinot
        Gris ou le Muscat. **Zotzenberg** admet aussi le Sylvaner ; Altenberg de Bergheim
        et Kaefferkopf autorisent des assemblages définis. Depuis 2022, **Hengst et
        Kirchberg de Barr** peuvent également produire un grand cru rouge de Pinot Noir.

  - id: alsace-varietal-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are the great majority of Alsace still wines bottled?
      choices:
        - { text: "As blends identified only by a proprietary cuvée name", correct: false }
        - { text: "As single-variety wines, with the grape on the label", correct: true }
        - { text: "As blends labelled with the dominant village rather than a grape", correct: false }
        - { text: "As wines identified only by sweetness level", correct: false }
      explanation: |
        Alsace is unusual in France for routinely placing the **grape variety** prominently
        on the label. Blends such as Edelzwicker and Gentil exist, but single-variety
        bottlings dominate.
    fr:
      question: Comment la grande majorité des vins tranquilles d’Alsace sont-ils commercialisés ?
      choices:
        - { text: "Comme des assemblages identifiés uniquement par un nom de cuvée", correct: false }
        - { text: "Comme des vins monocépages portant le nom du cépage", correct: true }
        - { text: "Comme des assemblages indiquant le village dominant plutôt que le cépage", correct: false }
        - { text: "Comme des vins identifiés uniquement par leur niveau de sucrosité", correct: false }
      explanation: |
        L’Alsace se distingue en France par l’emploi très fréquent du **nom du cépage**
        sur l’étiquette. Les assemblages comme Edelzwicker et Gentil existent, mais les
        cuvées monocépages dominent.

  - id: alsace-blend-juice-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does the juice for a typical everyday Alsace blend come from?
      choices:
        - { text: "Parcels selected exclusively for the domaine’s grand cru wines", correct: false }
        - { text: "Lots not selected for separate varietal bottlings", correct: true }
        - { text: "Base wines originally reserved for Crémant d’Alsace", correct: false }
        - { text: "Lots declassified because their acidity is too high", correct: false }
      explanation: |
        A simple Edelzwicker-style blend may combine lots that a producer does not bottle
        separately by variety. This should not be confused with the deliberately composed,
        site-driven field blends made by a small number of leading estates.
    fr:
      question: D’où proviennent généralement les vins entrant dans un assemblage alsacien courant ?
      choices:
        - { text: "De parcelles réservées aux grands crus du domaine", correct: false }
        - { text: "De lots non retenus pour une mise en bouteille séparée par cépage", correct: true }
        - { text: "De vins de base initialement réservés au Crémant d’Alsace", correct: false }
        - { text: "De lots déclassés parce que leur acidité est trop élevée", correct: false }
      explanation: |
        Un assemblage simple de type Edelzwicker peut réunir des lots que le producteur
        ne souhaite pas commercialiser séparément par cépage. Il ne faut pas le confondre
        avec les assemblages parcellaires délibérés de quelques domaines de premier plan.

  - id: alsace-edelzwicker-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Edelzwicker on an Alsace label tell you?
      choices:
        - { text: "A blend containing at least 50% noble varieties", correct: false }
        - { text: "A blend with no required majority of noble varieties", correct: true }
        - { text: "A single-variety wine from one named grand cru", correct: false }
        - { text: "A late-harvest wine meeting the VT sugar minimum", correct: false }
      explanation: |
        **Edelzwicker** identifies an Alsace blend but imposes no requirement that noble
        varieties form the majority. **Gentil**, by contrast, must contain at least 50%
        of the noble varieties.
    fr:
      question: Que signifie la mention Edelzwicker sur une étiquette alsacienne ?
      choices:
        - { text: "Un assemblage comprenant au moins 50 % de cépages nobles", correct: false }
        - { text: "Un assemblage sans proportion majoritaire obligatoire de cépages nobles", correct: true }
        - { text: "Un vin monocépage issu d’un seul grand cru nommé", correct: false }
        - { text: "Un vin de vendange tardive atteignant le minimum de sucre des VT", correct: false }
      explanation: |
        **Edelzwicker** désigne un assemblage alsacien sans imposer que les cépages nobles
        soient majoritaires. À l’inverse, un **Gentil** doit contenir au moins 50 % de
        cépages nobles.

  - id: alsace-gentil-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Gentil differ from a generic Alsace blend?
      choices:
        - { text: "It must contain at least 50% Pinot Noir", correct: false }
        - { text: "At least half the blend must be noble varieties", correct: true }
        - { text: "It must contain at least 85% Riesling", correct: false }
        - { text: "It must come entirely from one grand cru", correct: false }
      explanation: |
        **Gentil** must contain at least **50% Riesling, Gewurztraminer, Pinot Gris and/or
        Muscat**. Other authorised Alsace varieties may make up the balance. Edelzwicker
        has no equivalent noble-variety minimum.
    fr:
      question: En quoi un Gentil se distingue-t-il d’un assemblage alsacien générique ?
      choices:
        - { text: "Il doit contenir au moins 50 % de Pinot Noir", correct: false }
        - { text: "Au moins la moitié de l’assemblage doit provenir de cépages nobles", correct: true }
        - { text: "Il doit contenir au moins 85 % de Riesling", correct: false }
        - { text: "Il doit provenir entièrement d’un seul grand cru", correct: false }
      explanation: |
        Un **Gentil** doit contenir au moins **50 % de Riesling, Gewurztraminer, Pinot
        Gris et/ou Muscat**. D’autres cépages alsaciens autorisés peuvent compléter
        l’assemblage. Edelzwicker ne prévoit pas de proportion minimale équivalente.

  - id: alsace-blend-quality-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which statement describes the small but important premium-blend tradition in Alsace?
      choices:
        - { text: "Premium blends may use the regional Alsace AOC but never a grand cru", correct: false }
        - { text: "A few producers make serious site-based or grand-cru blends", correct: true }
        - { text: "Premium blends must follow the same recipe as Gentil", correct: false }
        - { text: "Named-site blends are restricted to the Edelzwicker category", correct: false }
      explanation: |
        Producers such as **Marcel Deiss** have championed premium field blends. The
        rules for Altenberg de Bergheim and Kaefferkopf explicitly allow specified
        grand-cru blends, although single-variety wines remain the regional norm.
    fr:
      question: Quelle affirmation décrit la tradition minoritaire mais importante des assemblages haut de gamme en Alsace ?
      choices:
        - { text: "Les grands assemblages peuvent relever de l’AOC Alsace mais jamais d’un grand cru", correct: false }
        - { text: "Quelques producteurs élaborent de grands assemblages parcellaires ou de grand cru", correct: true }
        - { text: "Les grands assemblages doivent suivre la même composition qu’un Gentil", correct: false }
        - { text: "Les assemblages de lieu-dit sont réservés à la catégorie Edelzwicker", correct: false }
      explanation: |
        Des producteurs comme **Marcel Deiss** ont défendu les grands assemblages de
        terroir. Les cahiers des charges d’Altenberg de Bergheim et de Kaefferkopf
        autorisent explicitement certains assemblages de grand cru, même si les vins
        monocépages restent la norme régionale.

  - id: alsace-aroma-focus-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do Alsace winemakers usually favour techniques that preserve primary fruit and floral aromas?
      choices:
        - { text: "Most wines are intended to show strong new-oak character", correct: false }
        - { text: "Many of the region’s principal varieties are aromatic", correct: true }
        - { text: "The principal varieties benefit from full malolactic conversion", correct: false }
        - { text: "Long oxidative ageing is compulsory for white wines", correct: false }
      explanation: |
        Riesling, Gewurztraminer and Muscat are valued for distinctive primary aromas;
        Pinot Gris also gives a recognisable rich profile. Cool fermentation, neutral
        vessels and blocked malolactic conversion can help retain that identity.
    fr:
      question: Pourquoi les vinificateurs alsaciens privilégient-ils généralement les techniques qui préservent les arômes primaires de fruit et de fleurs ?
      choices:
        - { text: "La plupart des vins doivent exprimer un boisé neuf marqué", correct: false }
        - { text: "Beaucoup des principaux cépages régionaux sont aromatiques", correct: true }
        - { text: "Les principaux cépages gagnent à effectuer une fermentation malolactique complète", correct: false }
        - { text: "Un long élevage oxydatif est obligatoire pour les vins blancs", correct: false }
      explanation: |
        Le Riesling, le Gewurztraminer et le Muscat sont recherchés pour leurs arômes
        primaires distinctifs ; le Pinot Gris possède lui aussi un profil riche bien
        reconnaissable. Une fermentation fraîche, des contenants neutres et le blocage de
        la fermentation malolactique contribuent à préserver cette identité.

  - id: alsace-foudre-001
    type: mcq
    deck: France::Alsace
    tags: [france, alsace]
    status: reviewed
    source_id: c17-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which fermentation vessel is characteristic of a traditional Alsace cellar?
      choices:
        - { text: "Small new oak barriques with a heavy toast", correct: false }
        - { text: "Large old oak foudres with little flavour impact", correct: true }
        - { text: "Open concrete vats designed for red-wine extraction", correct: false }
        - { text: "Pressure tanks designed for the tank method", correct: false }
      explanation: |
        Large, old **foudres** are traditional in the region. Their size, age and tartrate
        lining make them relatively neutral, so they provide a fermentation vessel without
        giving the obvious toast or vanilla of a new barrique.
    fr:
      question: Quel récipient de fermentation est caractéristique d’une cave alsacienne traditionnelle ?
      choices:
        - { text: "De petites barriques neuves fortement chauffées", correct: false }
        - { text: "De grands foudres anciens ayant peu d’impact aromatique", correct: true }
        - { text: "Des cuves ouvertes en béton destinées à l’extraction des vins rouges", correct: false }
        - { text: "Des cuves sous pression destinées à la méthode en cuve close", correct: false }
      explanation: |
        Les grands **foudres** anciens sont traditionnels dans la région. Leur volume,
        leur âge et leur revêtement de tartre les rendent relativement neutres : ils
        servent de contenant sans apporter les notes grillées ou vanillées d’une barrique
        neuve.

  - id: alsace-tartrate-001
