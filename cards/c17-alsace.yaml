    en:
      question: When are most regional Alsace still wines bottled?
      choices:
        - { text: "Before the end of alcoholic fermentation", correct: false }
        - { text: "The spring after harvest, while the wine is still young and fresh", correct: true }
        - { text: "After at least two full years of barrel ageing", correct: false }
        - { text: "Only after the following vintage has been harvested", correct: false }
      explanation: |
        Many regional wines are bottled in the **spring following the harvest** to retain
        their fresh fruit. Grands crus and wines carrying VT or SGN have longer maturation
        requirements and are not represented by this early timetable.
    fr:
      question: Quand la plupart des vins tranquilles de l’AOC régionale Alsace sont-ils mis en bouteille ?
      choices:
        - { text: "Avant la fin de la fermentation alcoolique", correct: false }
        - { text: "Au printemps suivant la récolte, lorsque le vin est encore jeune et frais", correct: true }
        - { text: "Après au moins deux années complètes d’élevage en fût", correct: false }
        - { text: "Seulement après la récolte du millésime suivant", correct: false }
      explanation: |
        De nombreux vins régionaux sont mis en bouteille au **printemps suivant la
        récolte** afin de préserver leur fruit frais. Les grands crus et les vins portant
        les mentions VT ou SGN sont soumis à des durées d’élevage plus longues.

  - id: alsace-bottle-age-001
