        - { text: "Not every year", correct: true }
        - { text: "SGN is the majority of the harvest", correct: false }
        - { text: "SGN is bottled only in Germany", correct: false }
      explanation: |
        **Not every year.** Botrytis and the sugar bar have to line up.

