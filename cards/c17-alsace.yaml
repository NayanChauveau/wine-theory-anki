        - { text: "Alsace et les AOC Alsace Grand Cru admissibles", correct: true }
        - { text: "Uniquement les 51 AOC Alsace Grand Cru", correct: false }
        - { text: "Uniquement l’AOC régionale Alsace", correct: false }
      explanation: |
        Ces mentions peuvent compléter l’AOC régionale **Alsace** ou une AOC **Alsace
        Grand Cru** admissible. Elles ne s’appliquent pas au Crémant d’Alsace.

  - id: alsace-cuvee-terms-001
    type: mcq
