        - { text: "None — they are domaine marketing, not a legal tier", correct: true }
        - { text: "They replace VT and SGN", correct: false }
        - { text: "They prove 100% new oak", correct: false }
      explanation: |
        **No legal status.** A **Réserve personnelle** is the domaine’s own
        ladder, not a rank INAO will enforce.

  - id: alsace-aoc-volume-001
