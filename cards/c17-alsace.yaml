      sources: [known-fact]
    en:
      question: What legal weight do words like Réserve personnelle or Cuvée spéciale have in Alsace?
      choices:
        - { text: "They define an official tier immediately below grand cru", correct: false }
        - { text: "They are producer terms rather than a regulated quality tier", correct: true }
        - { text: "They certify the same minimum ripeness as VT", correct: false }
        - { text: "They require grapes from a recognised communale", correct: false }
      explanation: |
        Such wording belongs to a producer’s own range and does not create an official
        appellation rank. Its meaning and quality significance must therefore be judged
        domaine by domaine.
    fr:
      question: Quelle valeur réglementaire des mentions comme Réserve personnelle ou Cuvée spéciale ont-elles en Alsace ?
      choices:
        - { text: "Elles définissent un niveau officiel immédiatement inférieur au grand cru", correct: false }
        - { text: "Ce sont des mentions de producteur et non un niveau de qualité réglementé", correct: true }
        - { text: "Elles certifient la même maturité minimale qu’une VT", correct: false }
        - { text: "Elles imposent des raisins provenant d’une communale reconnue", correct: false }
      explanation: |
        Ces termes appartiennent à la gamme propre du producteur et ne créent aucun rang
        officiel dans l’appellation. Leur signification et leur portée qualitative doivent
        donc être évaluées domaine par domaine.

