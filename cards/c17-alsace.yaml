        - { text: "It promotes uniform oxygen exposure during fermentation", correct: false }
      explanation: |
        Jacketed stainless-steel tanks make **temperature control** straightforward,
        helping retain fresh primary aromas during white-wine fermentation. They coexist
        with traditional old foudres.
    fr:
      question: Pourquoi de nombreuses caves alsaciennes modernes utilisent-elles des cuves en acier inoxydable pour la fermentation ?
      choices:
        - { text: "Elles favorisent une oxydation maîtrisée pendant la fermentation", correct: false }
        - { text: "Elles permettent un contrôle précis de la température de fermentation", correct: true }
        - { text: "Elles apportent des notes grillées et épicées sans employer de bois neuf", correct: false }
        - { text: "Elles favorisent une exposition uniforme à l’oxygène pendant la fermentation", correct: false }
      explanation: |
        Les cuves inox thermorégulées facilitent le **contrôle de la température**, ce qui
        aide à préserver les arômes primaires frais pendant la fermentation des vins
        blancs. Elles coexistent avec les foudres traditionnels.

  - id: alsace-mlf-001
