    tags: [canada, british-columbia, okanagan, ripening]
    status: reviewed
    source_id: c35-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At the Okanagan Valley's latitude of about 49–50°N, how do long summer days help grapes ripen?"
      choices:
        - { text: "Hotter nights speed sugar build-up", correct: false }
        - { text: "Midday sunlight is more intense", correct: false }
        - { text: "Photosynthesis runs for more hours", correct: true }
        - { text: "Budburst comes earlier in spring", correct: false }
      explanation: |
        In late June the sun is up for around 16 hours, longer than in
        Napa. The sun sits lower in the sky, so the gain comes from duration,
        not intensity.
    fr:
      question: "À la latitude de la vallée de l’Okanagan, environ 49–50° N, en quoi les longues journées d’été aident-elles le raisin à mûrir ?"
      choices:
        - { text: "Des nuits chaudes hâtent l’accumulation des sucres", correct: false }
        - { text: "Le soleil de midi est plus intense", correct: false }
        - { text: "La photosynthèse dure plus d’heures", correct: true }
        - { text: "Le débourrement survient plus tôt au printemps", correct: false }
      explanation: |
        Fin juin, le soleil reste levé environ 16 heures, plus longtemps que dans la
        Napa Valley. Il est plus bas sur l’horizon : le gain vient donc de la durée,
        pas de l’intensité.

  - id: canada-okanagan-lakes-001
    type: mcq
