cards:
  - id: canada-climate-continental-001
    type: mcq
    deck: Canada
    tags: [canada, climate]
    status: reviewed
    source_id: c35-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate label fits Canada's leading wine regions, the Niagara Peninsula and the Okanagan Valley?"
      choices:
        - { text: "Maritime", correct: false }
        - { text: "Continental", correct: true }
        - { text: "Mediterranean", correct: false }
        - { text: "High-altitude", correct: false }
      explanation: |
        Both lie far from the moderating effect of an ocean, so the gap
        between the warmest and coldest months is wide. Vancouver Island, on the
        Pacific, is the main exception, with a milder, wetter maritime climate.
    fr:
      question: "Quel type de climat correspond aux principales régions viticoles du Canada, la péninsule du Niagara et la vallée de l’Okanagan ?"
      choices:
        - { text: "Maritime", correct: false }
        - { text: "Continental", correct: true }
        - { text: "Méditerranéen", correct: false }
        - { text: "D’altitude", correct: false }
      explanation: |
        Toutes deux sont éloignées de l’influence modératrice d’un océan : l’écart
        entre les mois les plus chauds et les plus froids y est donc important. L’île
        de Vancouver, sur le Pacifique, est la principale exception, avec un climat
        maritime plus doux et plus humide.

  - id: canada-annual-temperature-001
    type: mcq
    deck: Canada
    tags: [canada, climate]
    status: reviewed
    source_id: c35-0002
    review:
      fact_check: pass
      sources: [known-fact, omafa-wind-machines]
    en:
      question: "How does the average annual temperature of Canada's wine regions compare with that of Bordeaux or Burgundy?"
      choices:
        - { text: "Higher, thanks to long summer daylight", correct: false }
        - { text: "About the same, as water bodies even it out", correct: false }
        - { text: "Lower, pulled down by long, severe winters", correct: true }
        - { text: "Higher, because the growing season is hot", correct: false }
      explanation: |
        An annual mean hides the shape of the year. Viticulture is possible
        because the vine only needs warmth from budburst to harvest; the
        months of deep cold fall while it is dormant. Even then, Niagara
        growers run wind machines on still winter nights to protect the buds.
    fr:
      question: "Comment la température moyenne annuelle des régions viticoles canadiennes se compare-t-elle à celle de Bordeaux ou de la Bourgogne ?"
      choices:
        - { text: "Plus élevée, grâce aux longues journées d’été", correct: false }
        - { text: "Équivalente, car les plans d’eau la lissent", correct: false }
        - { text: "Plus basse, à cause d’hivers longs et rigoureux", correct: true }
        - { text: "Plus élevée, car la saison végétative est chaude", correct: false }
      explanation: |
        Une moyenne annuelle masque le profil de l’année. La viticulture reste
        possible car la vigne n’a besoin de chaleur que du débourrement aux
        vendanges ; les mois de grand froid tombent pendant sa dormance. Même
        ainsi, les viticulteurs du Niagara font tourner des tours antigel par les
        nuits d’hiver sans vent pour protéger les bourgeons.

  - id: canada-summer-heat-001
    type: mcq
    deck: Canada
    tags: [canada, climate]
    status: reviewed
    source_id: c35-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What are daytime temperatures in July and August usually like in Canada's main wine regions?"
      choices:
        - { text: "Cool, close to those of Champagne", correct: false }
        - { text: "Mild, seldom reaching 20 °C", correct: false }
        - { text: "Mild and overcast, as in Muscadet", correct: false }
        - { text: "Hot, at times above 30 °C", correct: true }
      explanation: |
        Inland continental sites heat up quickly once summer arrives. In the
        southern Okanagan, around Osoyoos, midsummer afternoons regularly pass
        30 °C, enough to ripen Merlot and even Syrah.
    fr:
      question: "Quelles sont en général les températures diurnes en juillet et en août dans les principales régions viticoles canadiennes ?"
      choices:
        - { text: "Fraîches, proches de celles de la Champagne", correct: false }
        - { text: "Douces, dépassant rarement 20 °C", correct: false }
        - { text: "Douces et nuageuses, comme dans le Muscadet", correct: false }
        - { text: "Chaudes, parfois au-delà de 30 °C", correct: true }
      explanation: |
        Les sites continentaux de l’intérieur se réchauffent vite dès l’arrivée de
        l’été. Dans le sud de l’Okanagan, autour d’Osoyoos, les après-midi du cœur de
        l’été dépassent régulièrement 30 °C, assez pour mûrir le Merlot et même la
        Syrah.

  - id: canada-ontario-appellation-count-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, vqa]
    status: reviewed
    source_id: c35-0007
    review:
      fact_check: pass
      sources: [vqa-ontario, ontario-reg-406-00]
    en:
      question: "How many Designated Viticultural Areas (DVAs) does Ontario recognise?"
      choices:
        - { text: "Two", correct: false }
        - { text: "Four", correct: false }
        - { text: "Three", correct: true }
        - { text: "Five", correct: false }
      explanation: |
        They are Niagara Peninsula, Lake Erie North Shore and Prince Edward
        County, which gained its status in 2007. Pelee Island, once listed on
        its own, now falls within the South Islands sub-appellation of Lake
        Erie North Shore.
    fr:
      question: "Combien de DVA (Designated Viticultural Areas, aires viticoles désignées) l’Ontario reconnaît-il ?"
      choices:
        - { text: "Deux", correct: false }
        - { text: "Quatre", correct: false }
        - { text: "Trois", correct: true }
        - { text: "Cinq", correct: false }
      explanation: |
        Il s’agit de la péninsule du Niagara, de Lake Erie North Shore et de Prince
        Edward County, qui a obtenu ce statut en 2007. Pelee Island, autrefois
        distincte, fait désormais partie de la sous-appellation South Islands, au sein
        de Lake Erie North Shore.

  - id: canada-ontario-niagara-lead-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara]
    status: reviewed
    source_id: c35-0008
    review:
      fact_check: pass
      sources: [vqa-ontario]
    en:
      question: "Which Ontario wine region is the province's largest and most important?"
      choices:
        - { text: "Prince Edward County", correct: false }
        - { text: "Lake Erie North Shore", correct: false }
        - { text: "Pelee Island", correct: false }
        - { text: "Niagara Peninsula", correct: true }
      explanation: |
        It holds the great majority of Ontario's vineyards and is split into
        many smaller appellations, from the flat lakeshore around
        Niagara-on-the-Lake to the benches along the Niagara Escarpment.
    fr:
      question: "Quelle région viticole de l’Ontario est la plus vaste et la plus importante de la province ?"
      choices:
        - { text: "Prince Edward County", correct: false }
        - { text: "Lake Erie North Shore", correct: false }
        - { text: "Pelee Island", correct: false }
        - { text: "Péninsule du Niagara", correct: true }
      explanation: |
        Elle concentre la grande majorité du vignoble ontarien et se divise en de
        nombreuses appellations plus petites, des terres plates du bord du lac autour
        de Niagara-on-the-Lake jusqu’aux terrasses (benches) qui longent l’escarpement
        du Niagara.

  - id: canada-niagara-location-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara]
    status: reviewed
    source_id: c35-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where in Ontario do the Niagara Peninsula vineyards lie?"
      choices:
        - { text: "Along the southern shore of Lake Ontario, near its western end", correct: true }
        - { text: "Along the northern shore of Lake Erie, close to Windsor", correct: false }
        - { text: "On a limestone peninsula jutting into eastern Lake Ontario", correct: false }
        - { text: "Along the southern shore of Georgian Bay, on Lake Huron", correct: false }
      explanation: |
        The vines sit on a strip of land between the lake and the Niagara
        Escarpment, a ridge that runs east to the Niagara River and the US
        border at the falls.
    fr:
      question: "Où se situent les vignobles de la péninsule du Niagara, en Ontario ?"
      choices:
        - { text: "Sur la rive sud du lac Ontario, près de son extrémité ouest", correct: true }
        - { text: "Sur la rive nord du lac Érié, à proximité de Windsor", correct: false }
        - { text: "Sur une péninsule calcaire avançant dans l’est du lac Ontario", correct: false }
        - { text: "Sur la rive sud de la baie Georgienne, sur le lac Huron", correct: false }
      explanation: |
        Les vignes occupent une bande de terre entre le lac et l’escarpement du
        Niagara, une crête qui court vers l’est jusqu’à la rivière Niagara et à la
        frontière américaine, au niveau des chutes.

  - id: canada-niagara-lake-effect-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara, climate]
    status: reviewed
    source_id: c35-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does the water of Lake Ontario affect air temperatures over the Niagara Peninsula vineyards?"
      choices:
        - { text: "It warms up faster than the land in spring", correct: false }
        - { text: "It traps cold air on the slopes in autumn", correct: false }
        - { text: "It warms and cools more slowly than land", correct: true }
        - { text: "It cools faster than the land in autumn", correct: false }
      explanation: |
        Water stores far more heat than soil. In spring the cold lake keeps
        the shore cool, and in autumn the warm lake keeps it mild, so the
        whole vine cycle is shifted later in the year.
    fr:
      question: "Comment les eaux du lac Ontario influencent-elles la température de l’air au-dessus des vignobles de la péninsule du Niagara ?"
      choices:
        - { text: "Elles se réchauffent plus vite que la terre au printemps", correct: false }
        - { text: "Elles piègent l’air froid sur les pentes en automne", correct: false }
        - { text: "Elles chauffent et refroidissent moins vite que la terre", correct: true }
        - { text: "Elles se refroidissent plus vite que la terre en automne", correct: false }
      explanation: |
        L’eau stocke bien plus de chaleur que le sol. Au printemps, le lac encore
        froid garde la rive fraîche ; en automne, le lac encore tiède la garde douce.
        Tout le cycle de la vigne s’en trouve décalé plus tard dans l’année.

  - id: canada-niagara-late-budburst-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara, frost]
    status: reviewed
    source_id: c35-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is a late budburst useful to Niagara Peninsula growers?"
      choices:
        - { text: "It cuts the risk of spring frost damage", correct: true }
        - { text: "It lowers the risk of winter bud kill", correct: false }
        - { text: "It shortens the time to harvest", correct: false }
        - { text: "It improves fruit set at flowering", correct: false }
      explanation: |
        Green shoots are far more vulnerable to frost than dormant buds. The
        later they emerge, the more likely the last cold nights of spring
        have already passed.
    fr:
      question: "Pourquoi un débourrement tardif est-il utile aux viticulteurs de la péninsule du Niagara ?"
      choices:
        - { text: "Il limite les dégâts du gel de printemps", correct: true }
        - { text: "Il réduit le risque de gel des bourgeons en hiver", correct: false }
        - { text: "Il raccourcit le délai jusqu’aux vendanges", correct: false }
        - { text: "Il améliore la nouaison à la floraison", correct: false }
      explanation: |
        Les jeunes pousses craignent bien plus le gel que les bourgeons dormants. Plus
        elles sortent tard, plus il est probable que les dernières nuits froides du
        printemps soient passées.

  - id: canada-niagara-long-autumn-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara, ripening]
    status: reviewed
    source_id: c35-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does a mild, drawn-out autumn mainly allow Niagara Peninsula growers to achieve?"
      choices:
        - { text: "Higher yields per vine", correct: false }
        - { text: "Regular noble rot each year", correct: false }
        - { text: "Full ripeness in the grapes", correct: true }
        - { text: "An earlier harvest date", correct: false }
      explanation: |
        Extra weeks on the vine let sugar build, acidity soften and flavours
        develop. Late-ripening Cabernet Sauvignon depends most on this margin
        and struggles in a cool year.
    fr:
      question: "Que permet surtout un automne doux et prolongé aux viticulteurs de la péninsule du Niagara ?"
      choices:
        - { text: "Des rendements plus élevés par cep", correct: false }
        - { text: "Une pourriture noble chaque année", correct: false }
        - { text: "Une pleine maturité des raisins", correct: true }
        - { text: "Des vendanges plus précoces", correct: false }
      explanation: |
        Ces semaines supplémentaires sur souche laissent les sucres s’accumuler,
        l’acidité s’assouplir et les arômes se développer. Le Cabernet Sauvignon,
        cépage tardif, dépend le plus de cette marge et peine les années fraîches.

  - id: canada-niagara-airflow-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara, disease]
    status: reviewed
    source_id: c35-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Apart from moderating temperature, what vineyard benefit does Lake Ontario bring to the Niagara Peninsula?"
      choices:
        - { text: "Morning mist that favours noble rot", correct: false }
        - { text: "Steady breezes that limit fungal disease", correct: true }
        - { text: "Reflected light that speeds ripening", correct: false }
        - { text: "Sandy lake-bed soils that deter phylloxera", correct: false }
      explanation: |
        Lake air moving inland is deflected by the Niagara Escarpment and
        circulates back over the vines, drying leaves and bunches after rain.
    fr:
      question: "Outre la modération des températures, quel avantage le lac Ontario apporte-t-il au vignoble de la péninsule du Niagara ?"
      choices:
        - { text: "Des brumes matinales favorables à la pourriture noble", correct: false }
        - { text: "Des brises régulières qui freinent les maladies fongiques", correct: true }
        - { text: "Une lumière réfléchie qui accélère la maturation", correct: false }
        - { text: "Des sols sableux d’ancien lit lacustre hostiles au phylloxéra", correct: false }
      explanation: |
        L’air du lac qui avance vers l’intérieur est dévié par l’escarpement du
        Niagara et revient circuler au-dessus des vignes, séchant feuilles et grappes
        après la pluie.

  - id: canada-niagara-riesling-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara, riesling]
    status: reviewed
    source_id: c35-0013
    review:
      fact_check: pass
      sources: [known-fact, producer-site]
    en:
      question: "Which white grape is generally rated the most successful in Ontario's Niagara Peninsula?"
      choices:
        - { text: "Pinot Gris", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Gewurztraminer", correct: false }
        - { text: "Riesling", correct: true }
      explanation: |
        It ripens reliably in Niagara's cool conditions and resists winter cold
        well. Cave Spring built its name on Riesling from its escarpment estate.
    fr:
      question: "Quel cépage blanc est généralement considéré comme le plus réussi dans la péninsule du Niagara, en Ontario ?"
      choices:
        - { text: "Pinot Gris", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Gewurztraminer", correct: false }
        - { text: "Riesling", correct: true }
      explanation: |
        Il mûrit de façon fiable dans les conditions fraîches du Niagara et résiste
        bien au froid hivernal. Cave Spring a bâti sa réputation sur le Riesling de
        son domaine de l’escarpement.

  - id: canada-niagara-riesling-styles-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara, riesling]
    status: reviewed
    source_id: c35-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What style are most Niagara Peninsula Riesling table wines?"
      choices:
        - { text: "Rich and full-bodied, aged in new oak", correct: false }
        - { text: "Dry to off-dry, crisp and unoaked", correct: true }
        - { text: "Lusciously sweet, from botrytised grapes", correct: false }
        - { text: "Medium-dry, with soft acidity and oak", correct: false }
      explanation: |
        Cool nights keep the fruit fresh and citrusy. The best grapes also go
        into Icewine, where that acidity stops the sweetness tasting cloying.
    fr:
      question: "Quel est le style de la plupart des vins tranquilles de Riesling de la péninsule du Niagara ?"
      choices:
        - { text: "Riches et corsés, élevés en fût neuf", correct: false }
        - { text: "Secs à demi-secs, vifs et non boisés", correct: true }
        - { text: "Liquoreux, issus de raisins botrytisés", correct: false }
        - { text: "Demi-secs, à l’acidité souple, boisés", correct: false }
      explanation: |
        Les nuits fraîches gardent au fruit sa fraîcheur et ses notes d’agrumes. Les
        meilleurs raisins servent aussi à l’Icewine (vin de glace), où cette acidité
        empêche la douceur de devenir écœurante.

  - id: canada-vidal-hybrid-001
    type: mcq
    deck: Canada
    tags: [canada, vidal, grape]
    status: reviewed
    source_id: c35-0016
    review:
      fact_check: pass
      sources: [vivc]
    en:
      question: "What kind of vine is Vidal, widely planted in Ontario?"
      choices:
        - { text: "A *Vitis vinifera* crossing", correct: false }
        - { text: "A winter-hardy hybrid", correct: true }
        - { text: "A native *Vitis labrusca* grape", correct: false }
        - { text: "A cold-hardy clone of Riesling", correct: false }
      explanation: |
        It comes from Ugni Blanc crossed with a French-American hybrid. As a
        dry wine it is rather neutral, so its value lies in sweet styles.
    fr:
      question: "Quel type de vigne est le Vidal, très planté en Ontario ?"
      choices:
        - { text: "Un croisement de *Vitis vinifera*", correct: false }
        - { text: "Un hybride résistant à l’hiver", correct: true }
        - { text: "Un cépage indigène de *Vitis labrusca*", correct: false }
        - { text: "Un clone de Riesling résistant au froid", correct: false }
      explanation: |
        Il est issu d’un croisement entre l’Ugni Blanc et un hybride franco-américain.
        En vin sec, il est plutôt neutre : son intérêt réside dans les styles doux.

  - id: canada-vidal-icewine-style-001
    type: mcq
    deck: Canada
    tags: [canada, icewine, vidal]
    status: reviewed
    source_id: c35-0016
    review:
      fact_check: pass
      sources: [known-fact, inniskillin-history]
    en:
      question: "How does Vidal Icewine usually compare with Riesling Icewine?"
      choices:
        - { text: "Higher acidity, but less sweetness", correct: false }
        - { text: "More tannin, from longer skin contact", correct: false }
        - { text: "Higher alcohol, but less concentration", correct: false }
        - { text: "Less acidity and aromatic complexity", correct: true }
      explanation: |
        Vidal gives broad tropical and honeyed fruit, and its thick skins help
        it hang safely into winter. Inniskillin's 1989 Vidal Icewine put Canada
        on the map by winning the Grand Prix d'Honneur at Vinexpo in 1991.
    fr:
      question: "Comment l’Icewine de Vidal se compare-t-il en général à celui de Riesling ?"
      choices:
        - { text: "Plus d’acidité, mais moins de sucre", correct: false }
        - { text: "Plus de tanins, grâce à une macération plus longue", correct: false }
        - { text: "Plus d’alcool, mais moins de concentration", correct: false }
        - { text: "Moins d’acidité et de complexité aromatique", correct: true }
      explanation: |
        Le Vidal donne un fruit ample, tropical et miellé, et sa peau épaisse l’aide à
        rester sain sur souche jusqu’en hiver. L’Icewine (vin de glace) de Vidal 1989
        d’Inniskillin a fait connaître le Canada en remportant le Grand Prix d’Honneur
        à Vinexpo en 1991.

  - id: canada-niagara-chardonnay-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara, chardonnay]
    status: reviewed
    source_id: c35-0018
    review:
      fact_check: pass
      sources: [known-fact, wine-country-ontario-i4c]
    en:
      question: "What style do the better Chardonnays of Ontario's Niagara Peninsula usually show?"
      choices:
        - { text: "Rich and buttery, with heavy new oak", correct: false }
        - { text: "Off-dry, aromatic and unoaked", correct: false }
        - { text: "Dry, with pure fruit and restrained oak", correct: true }
        - { text: "Full-bodied, with ripe tropical fruit", correct: false }
      explanation: |
        Cool nights keep acidity bright, and many producers favour older
        barrels. Niagara hosts i4C, an annual celebration of cool-climate
        Chardonnay held each July.
    fr:
      question: "Quel style présentent en général les meilleurs Chardonnays de la péninsule du Niagara, en Ontario ?"
      choices:
        - { text: "Riches et beurrés, très marqués par le fût neuf", correct: false }
        - { text: "Demi-secs, aromatiques et non boisés", correct: false }
        - { text: "Secs, au fruit pur et au boisé discret", correct: true }
        - { text: "Corsés, aux fruits tropicaux bien mûrs", correct: false }
      explanation: |
        Les nuits fraîches préservent une acidité vive, et de nombreux producteurs
        privilégient des fûts usagés. Le Niagara accueille chaque juillet i4C, une
        célébration annuelle du Chardonnay de climat frais.

  - id: canada-niagara-black-grapes-001
    type: mcq
    deck: Canada
    tags: [canada, ontario, niagara, black-grapes]
    status: reviewed
    source_id: c35-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which group lists black grapes widely grown in the Niagara Peninsula?"
      choices:
        - { text: "Syrah, Grenache, Mourvèdre, Carignan", correct: false }
        - { text: "Malbec, Tempranillo, Zinfandel, Touriga Nacional", correct: false }
        - { text: "Pinot Noir, Cabernet Franc, Merlot, Cabernet Sauvignon", correct: true }
        - { text: "Nebbiolo, Montepulciano, Aglianico, Nero d'Avola", correct: false }
      explanation: |
        Early-ripening Pinot Noir suits the cooler sites, while Cabernet Franc
        ripens more reliably than Cabernet Sauvignon and is also used for red
        Icewine.
    fr:
      question: "Quel groupe réunit des cépages noirs très cultivés dans la péninsule du Niagara ?"
      choices:
        - { text: "Syrah, Grenache, Mourvèdre, Carignan", correct: false }
        - { text: "Malbec, Tempranillo, Zinfandel, Touriga Nacional", correct: false }
        - { text: "Pinot Noir, Cabernet Franc, Merlot, Cabernet Sauvignon", correct: true }
        - { text: "Nebbiolo, Montepulciano, Aglianico, Nero d’Avola", correct: false }
      explanation: |
        Le Pinot Noir, précoce, convient aux sites les plus frais, tandis que le
        Cabernet Franc mûrit plus sûrement que le Cabernet Sauvignon et sert aussi à
        l’Icewine rouge.

  - id: canada-bc-location-001
    type: mcq
    deck: Canada
    tags: [canada, british-columbia]
    status: reviewed
    source_id: c35-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where in Canada is British Columbia, the country's second major wine province?"
      choices:
        - { text: "On the Atlantic coast", correct: false }
        - { text: "In the central Prairies", correct: false }
        - { text: "On the Pacific coast", correct: true }
