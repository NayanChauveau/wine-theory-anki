  - id: canada-okanagan-rain-shadow-001
    type: mcq
    deck: Canada
    tags: [canada, british-columbia, okanagan, climate]
    status: reviewed
    source_id: c35-0023
    review:
      fact_check: pass
      sources: [canadian-encyclopedia]
    en:
      question: "Why does the Okanagan Valley receive so little rain?"
      choices:
        - { text: "Cold Pacific currents stop clouds forming", correct: false }
        - { text: "Mountain ranges to the west block it", correct: true }
        - { text: "Dry Prairie winds blow in from the east", correct: false }
        - { text: "Its deep lakes chill the air above them", correct: false }
      explanation: |
        Moist Pacific air drops most of its rain on the Coast and Cascade
        ranges. Vineyards in the valley therefore depend on irrigation.
    fr:
      question: "Pourquoi la vallée de l’Okanagan reçoit-elle si peu de pluie ?"
      choices:
        - { text: "Les courants froids du Pacifique empêchent les nuages de se former", correct: false }
        - { text: "Les chaînes de montagnes à l’ouest l’arrêtent", correct: true }
        - { text: "Des vents secs des Prairies soufflent de l’est", correct: false }
        - { text: "Ses lacs profonds refroidissent l’air au-dessus", correct: false }
      explanation: |
        L’air humide du Pacifique déverse l’essentiel de sa pluie sur la chaîne
        Côtière et la chaîne des Cascades. Les vignobles de la vallée dépendent donc
        de l’irrigation.

