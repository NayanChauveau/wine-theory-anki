      choices:
        - { text: "Create fog that shades vines in summer", correct: false }
        - { text: "Raise humidity, favouring noble rot", correct: false }
        - { text: "Moderate temperatures and lengthen the season", correct: true }
        - { text: "Leave fresh silt on the vineyards each spring", correct: false }
      explanation: |
        Okanagan Lake is over 100 km long. Slopes close to the water escape
        the worst autumn frosts and winter lows.
    fr:
      question: "Quel est le principal effet des profonds lacs glaciaires de la vallée de l’Okanagan sur les vignobles voisins ?"
      choices:
        - { text: "Ils créent des brouillards qui ombragent les vignes l’été", correct: false }
        - { text: "Ils accroissent l’humidité, favorisant la pourriture noble", correct: false }
        - { text: "Ils modèrent les températures et allongent la saison", correct: true }
        - { text: "Ils déposent du limon frais sur les vignes chaque printemps", correct: false }
      explanation: |
        Le lac Okanagan mesure plus de 100 km de long. Les coteaux proches de l’eau
        échappent aux pires gelées d’automne et aux froids les plus intenses de
        l’hiver.

