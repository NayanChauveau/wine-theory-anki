cards:
  - id: climate-latitude-band-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, latitude]
    status: reviewed
    source_id: c01-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Within which latitude bands are most established wine regions found?"
      choices:
        - { text: "Roughly 30–50° north and south of the equator", correct: true }
        - { text: "Roughly 20–40° north and south of the equator", correct: false }
        - { text: "Roughly 40–60° north and south of the equator", correct: false }
        - { text: "Roughly 10–30° north and south of the equator", correct: false }
      explanation: |
        Between about 30° and 50°, the growing season is usually warm and long enough to ripen
        grapes while winter permits dormancy. Altitude, ocean currents and modern techniques allow
        important exceptions outside these bands.
    fr:
      question: "Dans quelles bandes de latitude se trouvent la plupart des régions viticoles établies ?"
      choices:
        - { text: "Environ 30–50° au nord et au sud de l’équateur", correct: true }
        - { text: "Environ 20–40° au nord et au sud de l’équateur", correct: false }
        - { text: "Environ 40–60° au nord et au sud de l’équateur", correct: false }
        - { text: "Environ 10–30° au nord et au sud de l’équateur", correct: false }
      explanation: |
        Entre environ 30° et 50°, la saison de croissance est généralement assez chaude et longue
        pour mûrir les raisins, tandis que l’hiver permet la dormance. L’altitude, les courants
        océaniques et les techniques modernes autorisent d’importantes exceptions hors de ces
        bandes.
  - id: climate-definition-001
    type: mcq
    deck: The Growing Environment
    tags: [climate]
    status: reviewed
    source_id: c04-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does climate describe in a vineyard context?"
      choices:
        - { text: "The long-term pattern of temperature, sunlight and rainfall", correct: true }
        - { text: "The atmospheric conditions throughout one particular vintage", correct: false }
        - { text: "The typical weather experienced only during the ripening period", correct: false }
        - { text: "The unusual weather events recorded during the past decade", correct: false }
      explanation: |
        Climate describes typical conditions over a long period. A frost, heatwave or wet harvest in
        one year is weather and can make a vintage depart sharply from the climatic average.
    fr:
      question: "Que décrit le climat dans le contexte d’un vignoble ?"
      choices:
        - { text: "Le régime à long terme des températures, de l’ensoleillement et des précipitations", correct: true }
        - { text: "Les conditions atmosphériques pendant un millésime particulier", correct: false }
        - { text: "La météo habituelle pendant la seule période de maturation", correct: false }
        - { text: "Les événements météorologiques inhabituels de la dernière décennie", correct: false }
      explanation: |
        Le climat décrit les conditions habituelles sur une longue période. Un gel, une canicule ou
        des vendanges pluvieuses au cours d’une année relèvent de la météo et peuvent fortement
        éloigner un millésime de la moyenne climatique.
  - id: weather-definition-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, weather]
    status: reviewed
    source_id: c04-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does weather describe in a vineyard context?"
      choices:
        - { text: "Atmospheric conditions at a particular place and time", correct: true }
        - { text: "Average atmospheric conditions measured over several decades", correct: false }
        - { text: "The usual seasonal contrast between summer and winter", correct: false }
        - { text: "The normal temperature and rainfall range of a wine region", correct: false }
      explanation: |
        Weather is the rain, frost, heat, wind and other conditions actually experienced at a given
        time, including during a particular vintage. Climate is the longer-term pattern around which
        those conditions vary.
    fr:
      question: "Que décrit la météo dans le contexte d’un vignoble ?"
      choices:
        - { text: "Les conditions atmosphériques en un lieu et à un moment donnés", correct: true }
        - { text: "La moyenne des conditions atmosphériques sur plusieurs décennies", correct: false }
        - { text: "Le contraste saisonnier habituel entre l’été et l’hiver", correct: false }
        - { text: "La plage normale de températures et de pluies d’une région viticole", correct: false }
      explanation: |
        La météo correspond à la pluie, au gel, à la chaleur, au vent et aux autres conditions
        réellement observées à un moment donné, notamment pendant un millésime. Le climat est le
        régime à plus long terme autour duquel elles varient.
  - id: temperature-factors-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, temperature]
    status: reviewed
    source_id: c04-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which set consists entirely of major natural controls on vineyard temperature?"
      choices:
        - { text: "Latitude, altitude, ocean influence and aspect", correct: true }
        - { text: "Latitude, rainfall, soil fertility and rootstock", correct: false }
        - { text: "Altitude, soil drainage, planting density and grape variety", correct: false }
        - { text: "Aspect, humidity, pruning system and crop level", correct: false }
      explanation: |
        Latitude governs solar energy, altitude generally lowers temperature, oceans moderate nearby
        land and aspect changes exposure to sunlight. Soil and wind can further modify a site’s
        temperature.
    fr:
      question: "Quel groupe se compose uniquement de grandes influences naturelles sur la température d’un vignoble ?"
      choices:
        - { text: "Latitude, altitude, influence océanique et exposition", correct: true }
        - { text: "Latitude, précipitations, fertilité du sol et porte-greffe", correct: false }
        - { text: "Altitude, drainage du sol, densité de plantation et cépage", correct: false }
        - { text: "Exposition, humidité, mode de taille et charge en raisins", correct: false }
      explanation: |
        La latitude gouverne l’énergie solaire, l’altitude abaisse généralement la température, les
        océans modèrent les terres voisines et l’exposition modifie la quantité de soleil reçue. Le
        sol et le vent peuvent encore nuancer la température du site.
  - id: altitude-lapse-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, altitude]
    status: reviewed
    source_id: c04-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What average temperature change is commonly associated with gaining 100 metres of altitude?"
      choices:
        - { text: "A fall of about 0.6 °C", correct: true }
        - { text: "A rise of about 0.6 °C", correct: false }
        - { text: "A fall of about 3 °C", correct: false }
        - { text: "No measurable change", correct: false }
      explanation: |
        Air temperature falls by roughly 0.6 °C per 100 metres under average conditions. Local
        inversions, wind and topography can temporarily produce different results, so this is a
        useful rule of thumb rather than a fixed law.
    fr:
      question: "Quelle variation moyenne de température associe-t-on couramment à un gain d’altitude de 100 mètres ?"
      choices:
        - { text: "Une baisse d’environ 0,6 °C", correct: true }
        - { text: "Une hausse d’environ 0,6 °C", correct: false }
        - { text: "Une baisse d’environ 3 °C", correct: false }
        - { text: "Aucune variation mesurable", correct: false }
      explanation: |
        Dans des conditions moyennes, la température de l’air baisse d’environ 0,6 °C tous les 100
        mètres. Les inversions, le vent et la topographie peuvent temporairement produire un
        résultat différent : il s’agit donc d’un ordre de grandeur, non d’une loi absolue.

  - id: ocean-currents-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, ocean]
    status: reviewed
    source_id: c04-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can a cold ocean current cool vineyards near the coast?"
      choices:
        - { text: "It cools marine air that fog and onshore breezes can carry inland", correct: true }
        - { text: "It warms marine air slowly and releases that heat during summer days", correct: false }
        - { text: "It reduces ocean salinity, causing the sea to absorb less solar energy", correct: false }
        - { text: "It blocks onshore winds and traps cooler continental air at the coast", correct: false }
      explanation: |
        A cold current chills the air above it; fog or sea breezes can then move that cool air over
        coastal vineyards. The Humboldt and California Currents are important examples.
    fr:
      question: "Pourquoi un courant océanique froid peut-il rafraîchir les vignobles proches du littoral ?"
      choices:
        - { text: "Il refroidit l’air marin que le brouillard et les brises peuvent pousser vers les terres", correct: true }
        - { text: "Il réchauffe lentement l’air marin et restitue cette chaleur pendant les journées d’été", correct: false }
        - { text: "Il réduit la salinité de l’océan, qui absorbe alors moins d’énergie solaire", correct: false }
        - { text: "Il bloque les vents marins et retient l’air continental frais sur le littoral", correct: false }
      explanation: |
        Un courant froid refroidit l’air qui le surplombe ; le brouillard ou les brises marines
        peuvent ensuite transporter cet air frais vers les vignobles côtiers. Les courants de
        Humboldt et de Californie en sont deux exemples importants.
  - id: fog-cooling-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, fog]
    status: reviewed
    source_id: c04-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the usual effect of regular coastal fog on grape ripening?"
      choices:
        - { text: "It reduces sunlight and temperature, slowing ripening", correct: true }
        - { text: "It raises daytime temperature and accelerates acid loss", correct: false }
        - { text: "It increases solar radiation while lowering humidity", correct: false }
        - { text: "It shortens the growing season by advancing budburst", correct: false }
      explanation: |
        Fog blocks part of the sunlight and brings cool marine air, extending the ripening period
        and helping grapes retain acidity. Persistent moisture can also increase fungal-disease
        pressure.
    fr:
      question: "Quel est l’effet habituel d’un brouillard côtier régulier sur la maturation des raisins ?"
      choices:
        - { text: "Il réduit l’ensoleillement et la température, ce qui ralentit la maturation", correct: true }
        - { text: "Il élève la température diurne et accélère la perte d’acidité", correct: false }
        - { text: "Il augmente le rayonnement solaire tout en réduisant l’humidité", correct: false }
        - { text: "Il raccourcit la saison de croissance en avançant le débourrement", correct: false }
      explanation: |
        Le brouillard bloque une partie du soleil et apporte de l’air marin frais, prolongeant la
        maturation et aidant les raisins à conserver leur acidité. Une humidité persistante peut
        aussi accroître la pression des maladies fongiques.

  - id: fog-examples-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, fog]
    status: reviewed
    source_id: c04-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of wine regions is notably cooled by Pacific fog or cool marine air?"
      choices:
        - { text: "Coastal California and Chile’s Casablanca Valley", correct: true }
        - { text: "Bordeaux’s Médoc and the Loire’s Muscadet area", correct: false }
        - { text: "Germany’s Mosel and Austria’s Wachau", correct: false }
        - { text: "Barossa Valley and South Australia’s Riverland", correct: false }
      explanation: |
        Cold Pacific currents help create fog and cool air along parts of California and coastal
        Chile. The other pairs may have maritime, river or inland influences, but are not both
        cooled by the Pacific.
    fr:
      question: "Quelle paire de régions viticoles est notamment rafraîchie par le brouillard ou l’air marin frais du Pacifique ?"
      choices:
        - { text: "Le littoral californien et la vallée chilienne de Casablanca", correct: true }
        - { text: "Le Médoc bordelais et la région du Muscadet dans la Loire", correct: false }
        - { text: "La Moselle allemande et la Wachau autrichienne", correct: false }
        - { text: "La Barossa Valley et la Riverland en Australie-Méridionale", correct: false }
      explanation: |
        Les courants froids du Pacifique contribuent à créer du brouillard et de l’air frais dans
        certaines parties de la Californie et du Chili côtier. Les autres paires peuvent subir des
        influences maritimes, fluviales ou continentales, mais ne sont pas toutes deux rafraîchies
        par le Pacifique.
  - id: aspect-equator-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, aspect]
    status: reviewed
    source_id: c04-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which slope orientation generally receives the most direct sunlight during the growing season?"
      choices:
        - { text: "A slope facing towards the equator", correct: true }
        - { text: "A slope facing towards the nearest pole", correct: false }
        - { text: "An east-facing slope because it receives morning sun", correct: false }
        - { text: "A west-facing slope because it receives afternoon sun", correct: false }
      explanation: |
        Equator-facing slopes receive sunlight at a more favourable angle: south-facing in the
        northern hemisphere and north-facing in the southern hemisphere. The benefit is greatest in
        cooler regions.
    fr:
      question: "Quelle orientation de pente reçoit généralement le plus de soleil direct pendant la saison de croissance ?"
      choices:
        - { text: "Une pente tournée vers l’équateur", correct: true }
        - { text: "Une pente tournée vers le pôle le plus proche", correct: false }
        - { text: "Une pente tournée vers l’est, car elle reçoit le soleil du matin", correct: false }
        - { text: "Une pente tournée vers l’ouest, car elle reçoit le soleil de l’après-midi", correct: false }
      explanation: |
        Les pentes tournées vers l’équateur reçoivent le soleil sous un angle plus favorable : vers
        le sud dans l’hémisphère Nord et vers le nord dans l’hémisphère Sud. Cet avantage est
        particulièrement important dans les régions fraîches.
  - id: aspect-mosel-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, aspect]
    status: reviewed
    source_id: c04-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main ripening benefit of the Mosel’s steep, south-facing slopes?"
      choices:
        - { text: "They maximise the solar energy received by the vines", correct: true }
        - { text: "They drain cold air away from vines on the upper slope", correct: false }
        - { text: "They shed water quickly and restrict excessive vine vigour", correct: false }
        - { text: "They expose vines to wind and preserve acidity during summer", correct: false }
      explanation: |
        The favourable aspect and steep angle improve interception of sunlight in this cool,
        northerly region. River reflection and heat-retaining slate can provide further help in
        ripening Riesling.
    fr:
      question: "Quel est le principal avantage des pentes raides orientées au sud pour la maturation en Moselle ?"
      choices:
        - { text: "Elles maximisent l’énergie solaire reçue par les vignes", correct: true }
        - { text: "Elles évacuent l’air froid loin des vignes situées en haut de pente", correct: false }
        - { text: "Elles drainent vite l’eau et limitent la vigueur excessive de la vigne", correct: false }
        - { text: "Elles exposent les vignes au vent et préservent l’acidité en été", correct: false }
      explanation: |
        L’exposition favorable et la forte pente améliorent l’interception du soleil dans cette
        région fraîche et septentrionale. La réflexion de la rivière et la capacité de l’ardoise à
        retenir la chaleur peuvent encore favoriser la maturation du Riesling.
  - id: continentality-define-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, continentality]
    status: reviewed
    source_id: c04-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does continentality measure in climate studies?"
      choices:
        - { text: "The difference between average winter and summer temperatures", correct: true }
        - { text: "The difference between daytime and night-time temperatures", correct: false }
        - { text: "The total rainfall during the growing season", correct: false }
        - { text: "The distance between a vineyard and the equator", correct: false }
      explanation: |
        Continentality concerns the annual temperature range. Inland regions generally heat and cool
        more rapidly than coastal regions, creating hotter summers and colder winters.
    fr:
      question: "Que mesure la continentalité en climatologie ?"
      choices:
        - { text: "L’écart entre les températures moyennes de l’hiver et de l’été", correct: true }
        - { text: "L’écart entre les températures diurnes et nocturnes", correct: false }
        - { text: "Le total des précipitations pendant la saison de croissance", correct: false }
        - { text: "La distance entre un vignoble et l’équateur", correct: false }
      explanation: |
        La continentalité concerne l’amplitude thermique annuelle. Les régions intérieures se
        réchauffent et se refroidissent généralement plus vite que les régions côtières, ce qui
        donne des étés plus chauds et des hivers plus froids.

  - id: continentality-water-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, continentality]
    status: reviewed
    source_id: c04-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do large bodies of water reduce a nearby region’s continentality?"
      choices:
        - { text: "Water heats and cools slowly, moderating seasonal extremes", correct: true }
        - { text: "Reflected sunlight raises winter and summer temperatures equally", correct: false }
        - { text: "Sea breezes widen the temperature range between day and night", correct: false }
        - { text: "Evaporation increases summer heat and intensifies winter cold", correct: false }
      explanation: |
        Seas and large lakes store and release heat slowly. Nearby vineyards therefore tend to
        experience cooler summers, milder winters and a smaller annual temperature range than inland
        sites.
    fr:
      question: "Pourquoi les grandes étendues d’eau réduisent-elles la continentalité d’une région voisine ?"
      choices:
        - { text: "L’eau se réchauffe et se refroidit lentement, ce qui modère les extrêmes saisonniers", correct: true }
        - { text: "La lumière réfléchie élève autant les températures hivernales qu’estivales", correct: false }
        - { text: "Les brises marines accentuent l’écart de température entre le jour et la nuit", correct: false }
        - { text: "L’évaporation renforce la chaleur estivale et intensifie le froid hivernal", correct: false }
      explanation: |
        Les mers et les grands lacs emmagasinent et libèrent lentement la chaleur. Les vignobles
        voisins connaissent donc généralement des étés plus frais, des hivers plus doux et une
        amplitude thermique annuelle plus faible que les sites intérieurs.
  - id: sunlight-factors-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, sunlight]
    status: reviewed
    source_id: c04-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which set consists entirely of major controls on the sunlight received by a vineyard?"
      choices:
        - { text: "Latitude, cloud cover and aspect", correct: true }
        - { text: "Latitude, annual rainfall and soil fertility", correct: false }
        - { text: "Altitude, wind speed and soil drainage", correct: false }
        - { text: "Humidity, diurnal range and soil pH", correct: false }
      explanation: |
        Latitude affects day length and solar angle, clouds block radiation, and aspect determines
        how directly a slope faces the sun. Row orientation and canopy management can modify
        exposure at vine level.
    fr:
      question: "Quel groupe se compose uniquement de grandes influences sur l’ensoleillement reçu par un vignoble ?"
      choices:
        - { text: "Latitude, couverture nuageuse et exposition", correct: true }
        - { text: "Latitude, précipitations annuelles et fertilité du sol", correct: false }
        - { text: "Altitude, vitesse du vent et drainage du sol", correct: false }
        - { text: "Humidité, amplitude thermique diurne et pH du sol", correct: false }
      explanation: |
        La latitude influence la durée du jour et l’angle du soleil, les nuages bloquent le
        rayonnement et l’exposition détermine à quel point une pente fait face au soleil.
        L’orientation des rangs et la gestion de la canopée peuvent modifier l’exposition au niveau
        de la vigne.
  - id: latitude-daylength-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, latitude]
    status: reviewed
    source_id: c04-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does increasing latitude affect seasonal day length?"
      choices:
        - { text: "Summer days lengthen and winter days shorten", correct: true }
        - { text: "Both summer and winter days become shorter", correct: false }
        - { text: "Day length stays closer to twelve hours all year", correct: false }
        - { text: "Seasonal variation disappears in the southern hemisphere", correct: false }
      explanation: |
        Farther from the equator, the contrast between summer and winter day length increases. Long
        summer days can partly compensate for the lower angle of the sun in high-latitude vineyards.
    fr:
      question: "Comment une latitude plus élevée influence-t-elle la durée saisonnière des jours ?"
      choices:
        - { text: "Les jours d’été s’allongent et les jours d’hiver raccourcissent", correct: true }
        - { text: "Les jours d’été comme les jours d’hiver deviennent plus courts", correct: false }
        - { text: "La durée du jour reste plus proche de douze heures toute l’année", correct: false }
        - { text: "Les variations saisonnières disparaissent dans l’hémisphère Sud", correct: false }
      explanation: |
        Plus on s’éloigne de l’équateur, plus le contraste entre la durée des jours d’été et d’hiver
        augmente. Les longues journées estivales peuvent compenser en partie l’angle solaire plus
        faible des vignobles de haute latitude.
  - id: latitude-daylength-examples-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, latitude]
    status: reviewed
    source_id: c04-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair benefits from long summer days at relatively high latitude?"
      choices:
        - { text: "German vineyards and Washington State", correct: true }
        - { text: "Northern Chile and South Australia", correct: false }
        - { text: "Sicily and the Western Cape", correct: false }
        - { text: "Mendoza and Central Valley, Chile", correct: false }
      explanation: |
        Germany and Washington lie relatively far from the equator. Their long summer days provide
        extended photosynthetic time even where temperatures are cool or the growing season is
        comparatively short.
    fr:
      question: "Quelle paire bénéficie de longues journées d’été à une latitude relativement élevée ?"
      choices:
        - { text: "Les vignobles allemands et l’État de Washington", correct: true }
        - { text: "Le nord du Chili et l’Australie-Méridionale", correct: false }
        - { text: "La Sicile et le Cap-Occidental", correct: false }
        - { text: "Mendoza et la Vallée Centrale chilienne", correct: false }
      explanation: |
        L’Allemagne et l’État de Washington se trouvent relativement loin de l’équateur. Leurs
        longues journées d’été prolongent la photosynthèse, même lorsque les températures sont
        fraîches ou la saison de croissance assez courte.

  - id: aspect-steep-equator-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, aspect]
    status: reviewed
    source_id: c04-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which site combination most strongly promotes ripening in a cool region?"
      choices:
        - { text: "A steep slope facing the equator", correct: true }
        - { text: "A gentle slope facing the nearest pole", correct: false }
        - { text: "A flat site shaded during the afternoon", correct: false }
        - { text: "A valley floor receiving frequent cold-air drainage", correct: false }
      explanation: |
        An equator-facing aspect receives more direct radiation, and a steep angle can improve
        interception when the sun is low. Cold valley floors and pole-facing slopes tend to ripen
        more slowly.
    fr:
      question: "Quelle combinaison de site favorise le plus fortement la maturation dans une région fraîche ?"
      choices:
        - { text: "Une pente raide tournée vers l’équateur", correct: true }
        - { text: "Une pente douce tournée vers le pôle le plus proche", correct: false }
        - { text: "Un site plat ombragé pendant l’après-midi", correct: false }
        - { text: "Un fond de vallée qui reçoit fréquemment de l’air froid", correct: false }
      explanation: |
        Une exposition vers l’équateur reçoit un rayonnement plus direct, et une forte pente peut
        mieux l’intercepter lorsque le soleil est bas. Les fonds de vallée froids et les pentes
        tournées vers le pôle mûrissent généralement plus lentement.

  - id: fungal-damp-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, disease]
    status: reviewed
    source_id: c04-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination creates the greatest fungal-disease pressure in a vine canopy?"
      choices:
        - { text: "Long periods of wetness, warm conditions and little airflow", correct: true }
        - { text: "Brief periods of wetness, warm conditions and strong airflow", correct: false }
        - { text: "Long periods of wetness, cool conditions and strong airflow", correct: false }
        - { text: "A dry canopy, warm conditions and little airflow", correct: false }
      explanation: |
        Wet plant tissue and humid, still air favour diseases such as downy mildew and botrytis.
        Open canopies and drying winds shorten the time for which leaves and bunches remain wet.
    fr:
      question: "Quelle combinaison crée la plus forte pression des maladies fongiques dans la canopée ?"
      choices:
        - { text: "De longues périodes humides, de la chaleur et peu de circulation d’air", correct: true }
        - { text: "De brèves périodes humides, de la chaleur et une forte circulation d’air", correct: false }
        - { text: "De longues périodes humides, du froid et une forte circulation d’air", correct: false }
        - { text: "Une canopée sèche, de la chaleur et peu de circulation d’air", correct: false }
      explanation: |
        Les tissus végétaux mouillés et un air humide et immobile favorisent des maladies comme le
        mildiou et le botrytis. Les canopées ouvertes et les vents asséchants réduisent la durée
        pendant laquelle feuilles et grappes restent humides.
  - id: irrigation-when-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, water]
    status: reviewed
    source_id: c04-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard is most likely to require regular irrigation?"
      choices:
        - { text: "A warm, dry site with free-draining soil and small water reserves", correct: true }
        - { text: "A warm site with reliable summer rain and water-retentive soil", correct: false }
        - { text: "A cool maritime site with regular rain and deep clay soil", correct: false }
        - { text: "A cool site with ample winter rain and water-retentive subsoil", correct: false }
      explanation: |
        Irrigation is most useful where rainfall and stored soil water cannot meet the vine’s needs.
        Actual use also depends on water rights and appellation rules, and excessive irrigation can
        encourage vigour or dilute fruit.
    fr:
      question: "Quel vignoble est le plus susceptible de nécessiter une irrigation régulière ?"
      choices:
        - { text: "Un site chaud et sec, au sol drainant et aux faibles réserves en eau", correct: true }
        - { text: "Un site chaud, régulièrement arrosé en été et au sol qui retient l’eau", correct: false }
        - { text: "Un site maritime frais, régulièrement arrosé et doté d’un sol argileux profond", correct: false }
        - { text: "Un site frais, bien arrosé en hiver et doté d’un sous-sol qui retient l’eau", correct: false }
      explanation: |
        L’irrigation est surtout utile lorsque les précipitations et les réserves hydriques du sol
        ne couvrent pas les besoins de la vigne. Son emploi dépend aussi des droits sur l’eau et des
        règles de l’appellation ; un excès d’eau peut favoriser la vigueur ou diluer les fruits.
  - id: sprinkler-tradeoff-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, irrigation]
    status: reviewed
    source_id: c04-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is a major disadvantage of overhead sprinklers compared with drip irrigation?"
      choices:
        - { text: "Greater evaporative loss and wetter vine canopies", correct: true }
        - { text: "Greater risk of blocked emitters near individual vines", correct: false }
        - { text: "A narrow wetted zone that can concentrate vine roots", correct: false }
        - { text: "Inability to cover a whole vineyard during a frost", correct: false }
      explanation: |
        Sprinklers distribute water broadly, so evaporation and runoff can be high and wet foliage
        can favour disease. Drip systems target the root zone more precisely, although sprinklers
        can also be useful for frost protection.
    fr:
      question: "Quel est un inconvénient majeur de l’aspersion par rapport à l’irrigation goutte à goutte ?"
      choices:
        - { text: "Une plus forte évaporation et une canopée davantage mouillée", correct: true }
        - { text: "Un risque supérieur d’obstruction des goutteurs près de chaque vigne", correct: false }
        - { text: "Une zone humide étroite qui peut concentrer les racines de la vigne", correct: false }
        - { text: "L’impossibilité de couvrir tout un vignoble pendant un épisode de gel", correct: false }
      explanation: |
        L’aspersion répartit largement l’eau : l’évaporation et le ruissellement peuvent être
        importants, et le feuillage mouillé peut favoriser les maladies. Le goutte-à-goutte cible
        plus précisément la zone racinaire, même si l’aspersion peut aussi servir contre le gel.
  - id: continental-autumn-drop-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, continental]
    status: reviewed
    source_id: c04-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can autumn be hazardous for late-ripening grapes in a continental climate?"
      choices:
        - { text: "Temperatures may fall rapidly and frost can end ripening", correct: true }
        - { text: "Nearby oceans keep nights warm and extend the season", correct: false }
        - { text: "Summer heat normally continues unchanged into winter", correct: false }
        - { text: "Autumn rainfall always raises sugar concentration", correct: false }
      explanation: |
        Without a large body of water to release stored heat, inland temperatures can decline
        quickly after summer. Late varieties may fail to ripen fully before frost or severe cold.
    fr:
      question: "Pourquoi l’automne peut-il menacer les raisins tardifs dans un climat continental ?"
      choices:
        - { text: "Les températures peuvent chuter rapidement et le gel interrompre la maturation", correct: true }
        - { text: "Les océans voisins maintiennent les nuits chaudes et prolongent la saison", correct: false }
        - { text: "La chaleur estivale se poursuit normalement sans changement jusqu’en hiver", correct: false }
        - { text: "Les pluies automnales augmentent toujours la concentration en sucre", correct: false }
      explanation: |
        Sans grande étendue d’eau pour restituer la chaleur emmagasinée, les températures
        intérieures peuvent baisser rapidement après l’été. Les cépages tardifs risquent de ne pas
        atteindre leur pleine maturité avant le gel ou le grand froid.

  - id: continental-cool-varieties-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, continental]
    status: reviewed
    source_id: c04-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which growth-cycle traits reduce risk in a cool continental vineyard?"
      choices:
        - { text: "Late budding and early ripening", correct: true }
        - { text: "Early budding and late ripening", correct: false }
        - { text: "Early budding and a very long ripening season", correct: false }
        - { text: "Late budding and very late ripening", correct: false }
      explanation: |
        Late budburst reduces exposure to spring frost, while early ripening helps grapes mature
        before temperatures collapse in autumn. Few varieties combine both traits perfectly, so site
        choice remains important.
    fr:
      question: "Quels traits du cycle végétatif réduisent les risques dans un vignoble continental frais ?"
      choices:
        - { text: "Un débourrement tardif et une maturation précoce", correct: true }
        - { text: "Un débourrement précoce et une maturation tardive", correct: false }
        - { text: "Un débourrement précoce et une très longue maturation", correct: false }
        - { text: "Un débourrement tardif et une maturation très tardive", correct: false }
      explanation: |
        Un débourrement tardif réduit l’exposition au gel printanier, tandis qu’une maturation
        précoce aide les raisins à mûrir avant la chute des températures automnales. Peu de cépages
        réunissent parfaitement ces deux qualités ; le choix du site reste donc important.

  - id: continental-dry-summer-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, continental]
    status: reviewed
    source_id: c04-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which statement correctly distinguishes continentality from a Mediterranean rainfall pattern?"
      choices:
        - { text: "Continentality concerns annual temperature range; Mediterranean climates typically have dry summers", correct: true }
        - { text: "Continentality means dry summers; Mediterranean describes a large day–night temperature range", correct: false }
        - { text: "Continentality concerns total rainfall; Mediterranean describes winter temperature alone", correct: false }
        - { text: "The two terms are interchangeable descriptions of hot, dry vineyards", correct: false }
      explanation: |
        A continental climate is defined by strong seasonal temperature contrast, not by one
        universal rainfall pattern. Mediterranean climates are specifically associated with warm to
        hot, dry summers and wetter winters.
    fr:
      question: "Quelle affirmation distingue correctement la continentalité d’un régime de précipitations méditerranéen ?"
      choices:
        - { text: "La continentalité concerne l’amplitude thermique annuelle ; le climat méditerranéen possède généralement des étés secs", correct: true }
        - { text: "La continentalité signifie des étés secs ; le climat méditerranéen désigne une forte amplitude thermique diurne", correct: false }
        - { text: "La continentalité concerne les précipitations totales ; le climat méditerranéen décrit uniquement la température hivernale", correct: false }
        - { text: "Les deux termes sont interchangeables pour décrire des vignobles chauds et secs", correct: false }
      explanation: |
        Un climat continental se définit par de forts contrastes saisonniers de température, et non
        par un régime universel de précipitations. Le climat méditerranéen est spécifiquement
        associé à des étés chauds et secs et à des hivers plus humides.

  - id: maritime-rain-year-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, maritime]
    status: reviewed
    source_id: c04-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is rainfall commonly distributed in a maritime climate?"
      choices:
        - { text: "Across the year, including during the growing season", correct: true }
        - { text: "Almost entirely during a short summer wet season", correct: false }
        - { text: "Only during winter, followed by a rainless growing season", correct: false }
        - { text: "Mainly as snow after the harvest", correct: false }
      explanation: |
        Maritime regions often receive rain in every season. Growing-season rainfall reduces drought
        risk but can disrupt flowering or harvest and raise fungal-disease pressure.
    fr:
      question: "Comment les précipitations sont-elles couramment réparties dans un climat maritime ?"
      choices:
        - { text: "Tout au long de l’année, y compris pendant la saison de croissance", correct: true }
        - { text: "Presque entièrement pendant une courte saison humide estivale", correct: false }
        - { text: "Uniquement en hiver, puis aucune pluie pendant la saison de croissance", correct: false }
        - { text: "Principalement sous forme de neige après les vendanges", correct: false }
      explanation: |
        Les régions maritimes reçoivent souvent des pluies en toute saison. Les précipitations
        pendant la croissance réduisent le risque de sécheresse, mais peuvent perturber la floraison
        ou les vendanges et accroître la pression des maladies fongiques.

  - id: maritime-moderate-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, maritime]
    status: reviewed
    source_id: c04-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a nearby ocean generally affect a maritime region’s temperatures?"
      choices:
        - { text: "It moderates summer heat and winter cold", correct: true }
        - { text: "It increases both summer heat and winter cold", correct: false }
        - { text: "It raises daytime temperatures but lowers night-time temperatures", correct: false }
        - { text: "It affects rainfall but not temperature", correct: false }
      explanation: |
        Ocean water changes temperature slowly, so it absorbs heat in summer and releases it in
        winter. Coastal regions therefore tend to have a smaller annual temperature range than
        inland regions.
    fr:
      question: "Comment un océan voisin influence-t-il généralement les températures d’une région maritime ?"
      choices:
        - { text: "Il modère la chaleur estivale et le froid hivernal", correct: true }
        - { text: "Il accentue à la fois la chaleur estivale et le froid hivernal", correct: false }
        - { text: "Il élève les températures diurnes, mais abaisse les températures nocturnes", correct: false }
        - { text: "Il influence les précipitations, mais pas la température", correct: false }
      explanation: |
        L’eau océanique change lentement de température : elle absorbe de la chaleur en été et en
        restitue en hiver. Les régions côtières possèdent donc généralement une amplitude thermique
        annuelle plus faible que les régions intérieures.

  - id: maritime-season-length-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, maritime]
    status: reviewed
    source_id: c04-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can a maritime climate support a relatively long growing season?"
      choices:
        - { text: "Milder spring and autumn conditions reduce the risk of seasonal cold", correct: true }
        - { text: "Hotter summer conditions make every grape variety ripen early", correct: false }
        - { text: "A large annual temperature range delays both budburst and harvest", correct: false }
        - { text: "Low winter rainfall keeps vines growing without a dormant period", correct: false }
      explanation: |
        The ocean reduces severe spring and autumn cold, extending the period in which vines can
        grow and grapes can ripen. Rain and humidity can nevertheless make that long season risky.
    fr:
      question: "Pourquoi un climat maritime peut-il permettre une saison de croissance relativement longue ?"
      choices:
        - { text: "La douceur du printemps et de l’automne réduit le risque de froid saisonnier", correct: true }
        - { text: "La chaleur estivale fait mûrir précocement tous les cépages", correct: false }
        - { text: "Une forte amplitude thermique annuelle retarde le débourrement et les vendanges", correct: false }
        - { text: "La faible pluviométrie hivernale maintient la vigne en croissance sans dormance", correct: false }
      explanation: |
        L’océan atténue les grands froids du printemps et de l’automne, ce qui prolonge la période
        pendant laquelle les vignes peuvent pousser et les raisins mûrir. La pluie et l’humidité
        peuvent néanmoins rendre cette longue saison risquée.
  - id: site-factors-producer-001
    type: mcq
    deck: The Growing Environment
    tags: [climate]
    status: reviewed
    source_id: c04-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which set of environmental factors is most useful when assessing a site before planting?"
      choices:
        - { text: "Temperature, sunlight, water availability, fertility and drainage", correct: true }
        - { text: "Temperature, vineyard size, labour supply, yield and drainage", correct: false }
        - { text: "Sunlight, water rights, grape price, fertility and market access", correct: false }
        - { text: "Rainfall, planting cost, winery capacity, slope and bottle price", correct: false }
      explanation: |
        The site’s heat, light, water and soil determine whether a variety can ripen balanced fruit
        and how vigorously the vines will grow. Commercial and logistical factors matter to a
        business, but do not describe the growing environment itself.
    fr:
      question: "Quel groupe de facteurs environnementaux est le plus utile pour évaluer un site avant sa plantation ?"
      choices:
        - { text: "Température, ensoleillement, disponibilité en eau, fertilité et drainage", correct: true }
        - { text: "Température, superficie, main-d’œuvre, rendement et drainage", correct: false }
        - { text: "Ensoleillement, droits sur l’eau, prix du raisin, fertilité et accès au marché", correct: false }
        - { text: "Précipitations, coût de plantation, capacité de la cave, pente et prix de la bouteille", correct: false }
      explanation: |
        La chaleur, la lumière, l’eau et le sol du site déterminent si un cépage peut mûrir des
        raisins équilibrés et avec quelle vigueur la vigne poussera. Les facteurs commerciaux et
        logistiques comptent pour l’entreprise, mais ne décrivent pas le milieu de culture lui-même.
  - id: vigour-rain-fertile-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, vigour]
    status: reviewed
    source_id: c04-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main viticultural risk of combining abundant water with highly fertile soil?"
      choices:
        - { text: "Excessive vigour, shading and increased disease pressure", correct: true }
        - { text: "Insufficient shoot growth and premature leaf fall", correct: false }
        - { text: "Very low yields caused by weak nutrient uptake", correct: false }
        - { text: "Rapid water stress during the early growing season", correct: false }
      explanation: |
        Water and nutrients stimulate canopy growth. Dense shade can delay fruit ripening and retain
        humidity, so growers may use cover crops, less vigorous rootstocks and active canopy
        management.
    fr:
      question: "Quel est le principal risque viticole lorsque l’eau est abondante et le sol très fertile ?"
      choices:
        - { text: "Une vigueur excessive, de l’ombrage et une pression accrue des maladies", correct: true }
        - { text: "Une croissance insuffisante des rameaux et une chute précoce des feuilles", correct: false }
        - { text: "De très faibles rendements dus à une mauvaise absorption des nutriments", correct: false }
        - { text: "Un stress hydrique rapide au début de la saison de croissance", correct: false }
      explanation: |
        L’eau et les nutriments stimulent la croissance de la canopée. Une ombre dense peut retarder
        la maturation et retenir l’humidité ; le viticulteur peut donc recourir aux couverts
        végétaux, à des porte-greffes moins vigoureux et à une gestion active de la canopée.

  - id: coulure-millerandage-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, flowering]
    status: reviewed
    source_id: c04-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which conditions during flowering create the greatest risk of coulure and millerandage?"
      choices:
        - { text: "Cool, cloudy and rainy weather", correct: true }
        - { text: "Warm, dry and settled weather", correct: false }
        - { text: "Warm, humid weather with good airflow", correct: false }
        - { text: "Cool but clear, dry weather with light winds", correct: false }
      explanation: |
        Cold, cloud and rain can disrupt pollination and fruit set. Coulure leaves flowers or young
        berries unfertilised, while millerandage creates bunches with berries of uneven size and
        maturity.
    fr:
      question: "Quelles conditions pendant la floraison créent le plus grand risque de coulure et de millerandage ?"
      choices:
        - { text: "Un temps frais, nuageux et pluvieux", correct: true }
        - { text: "Un temps chaud, sec et stable", correct: false }
        - { text: "Un temps chaud et humide avec une bonne circulation d’air", correct: false }
        - { text: "Un temps frais, mais clair et sec, accompagné de vents légers", correct: false }
      explanation: |
        Le froid, les nuages et la pluie peuvent perturber la pollinisation et la nouaison. La
        coulure laisse des fleurs ou de jeunes baies non fécondées, tandis que le millerandage
        produit des grappes aux baies de taille et de maturité inégales.
  - id: harvest-dry-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, harvest]
    status: reviewed
    source_id: c04-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is dry weather usually preferred as grapes approach harvest?"
      choices:
        - { text: "It limits berry swelling, dilution and fungal rot", correct: true }
        - { text: "It increases water uptake and lowers sugar concentration", correct: false }
        - { text: "It stops phenolic ripening while preserving green flavours", correct: false }
        - { text: "It guarantees that acidity will rise before picking", correct: false }
      explanation: |
        Heavy rain can swell ripe berries, dilute flavours and split skins, while humidity
        encourages rot. A dry period allows growers to wait for maturity with less pressure to pick
        immediately.
    fr:
      question: "Pourquoi préfère-t-on généralement un temps sec à l’approche des vendanges ?"
      choices:
        - { text: "Il limite le gonflement des baies, la dilution et la pourriture fongique", correct: true }
        - { text: "Il augmente l’absorption d’eau et réduit la concentration en sucre", correct: false }
        - { text: "Il arrête la maturité phénolique tout en préservant les arômes végétaux", correct: false }
        - { text: "Il garantit une hausse de l’acidité avant la récolte", correct: false }
      explanation: |
        De fortes pluies peuvent gonfler les baies mûres, diluer les arômes et fendre les
        pellicules, tandis que l’humidité favorise la pourriture. Une période sèche permet
        d’attendre la maturité avec moins de pression pour récolter immédiatement.

  - id: harvest-early-weather-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, harvest]
    status: reviewed
    source_id: c04-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which forecast most strongly justifies picking sound grapes slightly before ideal maturity?"
      choices:
        - { text: "Prolonged rain, hail or frost that threatens the crop", correct: true }
        - { text: "Several dry, settled days with progressively cooler nights", correct: false }
        - { text: "Mild, dry weather followed by another stable week", correct: false }
        - { text: "Brief cloud cover followed by warm and breezy conditions", correct: false }
      explanation: |
        Harvest timing balances additional ripening against the risk of crop damage. Slightly less
        mature but healthy grapes may be preferable to fruit diluted, split or destroyed by incoming
        weather.
    fr:
      question: "Quelles prévisions justifient le mieux de vendanger des raisins sains un peu avant leur maturité idéale ?"
      choices:
        - { text: "Des pluies durables, de la grêle ou du gel menaçant la récolte", correct: true }
        - { text: "Plusieurs jours secs et stables accompagnés de nuits de plus en plus fraîches", correct: false }
        - { text: "Un temps doux et sec suivi d’une autre semaine stable", correct: false }
        - { text: "Un bref passage nuageux suivi d’un temps chaud et venteux", correct: false }
      explanation: |
        La date de récolte met en balance une maturation supplémentaire et le risque de perdre la
        récolte. Des raisins un peu moins mûrs, mais sains, peuvent être préférables à des fruits
        dilués, fendus ou détruits par une météo imminente.
  - id: harvest-method-factors-001
    type: mcq
    deck: The Growing Environment
    tags: [climate, harvest]
    status: reviewed
    source_id: c04-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard is most likely to require hand harvesting rather than machine harvesting?"
      choices:
        - { text: "Steep terraces where several selective passes are needed", correct: true }
        - { text: "Wide, level rows with even ripening and scarce labour", correct: false }
        - { text: "A large, accessible block scheduled for picking at night", correct: false }
        - { text: "A level, high-yielding block that must be picked quickly", correct: false }
      explanation: |
        Machines need accessible, suitably spaced rows and are efficient when fruit can be collected
        in one rapid pass. Steep terraces may be inaccessible, while selective picking requires
        people to choose individual bunches.
    fr:
      question: "Quel vignoble est le plus susceptible d’exiger des vendanges manuelles plutôt que mécaniques ?"
      choices:
        - { text: "Des terrasses raides nécessitant plusieurs passages sélectifs", correct: true }
        - { text: "De larges rangs sur terrain plat, avec une maturité homogène et peu de main-d’œuvre", correct: false }
        - { text: "Une grande parcelle accessible dont la récolte est prévue de nuit", correct: false }
        - { text: "Une parcelle plane à haut rendement qui doit être récoltée rapidement", correct: false }
      explanation: |
        Les machines exigent des rangs accessibles et convenablement espacés ; elles sont efficaces
        lorsque les raisins peuvent être ramassés en un seul passage rapide. Les terrasses raides
        peuvent être inaccessibles, tandis qu’une récolte sélective exige de choisir les grappes à
        la main.