        - { text: "It ripens late and needs a long season to mature its tannins", correct: true }
        - { text: "It loses all acidity when exposed to sunlight", correct: false }
        - { text: "It can grow only in fertile valley-floor soils", correct: false }
      explanation: |
        Nebbiolo buds early and ripens late, leaving it exposed to spring frost and autumn weather. Good
        exposure is essential for flavour and tannin maturity.
    fr:
      question: "Pourquoi le Nebbiolo est-il réservé aux coteaux les plus chauds et les mieux exposés du Piémont ?"
      choices:
        - { text: "Il débourre et mûrit très tôt", correct: false }
        - { text: "Il mûrit tard et exige une longue saison pour assouplir ses tanins", correct: true }
        - { text: "Il perd toute son acidité lorsqu’il reçoit du soleil", correct: false }
        - { text: "Il ne peut pousser que dans les sols fertiles de fond de vallée", correct: false }
      explanation: |
        Le Nebbiolo débourre tôt et mûrit tard, ce qui l’expose aux gels printaniers et au temps
        automnal. Une bonne exposition est essentielle à la maturité des arômes et des tanins.

