        - { text: "On the shores of Lake Garda", correct: false }
        - { text: "In the Alpine valley north of Bolzano", correct: false }
      explanation: |
        The zone surrounds Gavi in the province of Alessandria. Its position brings cooling from hills
        and maritime air from nearby Liguria.
    fr:
      question: "Où se situe la zone de production de Gavi DOCG ?"
      choices:
        - { text: "Dans les Langhe à l’ouest d’Alba", correct: false }
        - { text: "Dans le sud-est du Piémont, près de la Ligurie", correct: true }
        - { text: "Sur les rives du lac de Garde", correct: false }
        - { text: "Dans la vallée alpine au nord de Bolzano", correct: false }
      explanation: |
        La zone entoure Gavi dans la province d’Alexandrie. Sa position lui apporte la fraîcheur des
        collines et l’air maritime de la Ligurie voisine.

  - id: nitaly-gavi-hills-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, piedmont]
    status: reviewed
    source_id: c27-0129
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which factors help Gavi retain acidity while developing ripe flavours?"
      choices:
        - { text: "Low altitude and warm nights on a fertile plain", correct: false }
        - { text: "Hill elevation and cooling maritime air from Liguria", correct: true }
        - { text: "Permanent fog and north-facing valley floors", correct: false }
        - { text: "Sun-drying followed by oxidative maturation", correct: false }
      explanation: |
        Cooling slows Cortese’s ripening and preserves its naturally high acidity. Warmer or
        higher-yielding sites tend to give simpler wines.
    fr:
      question: "Quels facteurs aident Gavi à conserver son acidité tout en développant des arômes mûrs ?"
      choices:
        - { text: "Faible altitude et nuits chaudes dans une plaine fertile", correct: false }
        - { text: "Altitude des collines et air maritime rafraîchissant venu de Ligurie", correct: true }
        - { text: "Brouillard permanent et fonds de vallée exposés au nord", correct: false }
        - { text: "Séchage au soleil suivi d’un élevage oxydatif", correct: false }
      explanation: |
        La fraîcheur ralentit la maturation du Cortese et préserve son acidité naturellement élevée. Les
        sites plus chauds ou à plus forts rendements tendent à donner des vins plus simples.

