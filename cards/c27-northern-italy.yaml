# source: C27 (import/inbox/c27-northern-italy.yaml)
# deck: Italy::Northern Italy

cards:
  - id: nitaly-geo-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy]
    status: reviewed
    source_id: c27-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which landscape contains most of Northern Italy’s vineyards?"
      choices:
        - { text: "The central Apennine plateau and Tyrrhenian coast", correct: false }
        - { text: "The Alpine foothills, river valleys and the Po plain", correct: true }
        - { text: "The volcanic slopes of Sicily and Campania", correct: false }
        - { text: "The limestone uplands of Puglia and Basilicata", correct: false }
      explanation: |
        Quality sites are concentrated on hills and foothills, while flatter, more fertile land across
        the Po basin supports much of the region’s high-volume production.
    fr:
      question: "Dans quel ensemble de paysages se trouve la majorité des vignobles d’Italie du Nord ?"
      choices:
        - { text: "Le plateau des Apennins centraux et la côte tyrrhénienne", correct: false }
        - { text: "Les contreforts alpins, les vallées fluviales et la plaine du Pô", correct: true }
        - { text: "Les pentes volcaniques de Sicile et de Campanie", correct: false }
        - { text: "Les hauts plateaux calcaires des Pouilles et de Basilicate", correct: false }
      explanation: |
        Les meilleurs sites se concentrent sur les collines et les contreforts, tandis que les terrains
        plus plats et fertiles du bassin du Pô accueillent une grande partie de la production de volume.

  - id: nitaly-climate-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, climate]
    status: reviewed
    source_id: c27-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which broad climate description best fits Northern Italy’s main wine regions?"
      choices:
        - { text: "Cool maritime, with mild winters and rain evenly spread", correct: false }
        - { text: "Moderate continental, with warm summers and important local effects from altitude and water", correct: true }
        - { text: "Hot Mediterranean, with very dry summers throughout", correct: false }
        - { text: "Cold continental, with summers too short for black grapes", correct: false }
      explanation: |
        The Alps, elevation, large lakes and distance from the sea create substantial variation. Rain
        during the growing season means fungal disease and hail can still be significant hazards.
    fr:
      question: "Quelle description climatique générale correspond le mieux aux principales régions viticoles d’Italie du Nord ?"
      choices:
        - { text: "Climat maritime frais, avec hivers doux et pluies régulières", correct: false }
        - { text: "Climat continental modéré, avec étés chauds et forts effets locaux de l’altitude et des masses d’eau", correct: true }
        - { text: "Climat méditerranéen chaud, avec étés très secs partout", correct: false }
        - { text: "Climat continental froid, avec des étés trop courts pour les cépages noirs", correct: false }
      explanation: |
        Les Alpes, l’altitude, les grands lacs et l’éloignement de la mer créent d’importantes
        variations. Les pluies pendant la saison végétative maintiennent des risques de maladies
        fongiques et de grêle.

  - id: nitaly-alps-rain-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, climate]
    status: reviewed
    source_id: c27-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do the Alps most importantly influence many Northern Italian vineyards?"
      choices:
        - { text: "They expose the vineyards to cold polar winds", correct: false }
        - { text: "They shelter sites from northerly weather while altitude supplies cooling", correct: true }
        - { text: "They eliminate growing-season rain across the whole region", correct: false }
        - { text: "They create a uniformly maritime climate south of the range", correct: false }
      explanation: |
        The mountain barrier limits cold air from the north, while foothill and valley vineyards benefit
        from elevation and cool air drainage. Rainfall still varies greatly by location.
    fr:
      question: "Quelle est l’influence la plus importante des Alpes sur de nombreux vignobles d’Italie du Nord ?"
      choices:
        - { text: "Elles exposent les vignobles aux vents polaires froids", correct: false }
        - { text: "Elles protègent des influences septentrionales tandis que l’altitude apporte de la fraîcheur", correct: true }
        - { text: "Elles suppriment les pluies de la saison végétative dans toute la région", correct: false }
        - { text: "Elles créent un climat uniformément maritime au sud du massif", correct: false }
      explanation: |
        La barrière montagneuse limite l’arrivée d’air froid du nord, tandis que les vignobles des
        contreforts et des vallées profitent de l’altitude et du drainage d’air frais. Les
        précipitations restent très variables selon les sites.

  - id: nitaly-water-mod-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, climate]
    status: reviewed
    source_id: c27-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What climatic effect do Northern Italy’s large glacial lakes have on nearby vineyards?"
      choices:
        - { text: "They increase the annual temperature range", correct: false }
        - { text: "They moderate temperature extremes and can extend the growing season", correct: true }
        - { text: "They prevent all frost and fungal disease", correct: false }
        - { text: "They create a strong rain shadow across the Po plain", correct: false }
      explanation: |
        Water heats and cools more slowly than land. Around lakes such as Garda, this reduces
        temperature extremes and permits vines to grow successfully at relatively northerly latitudes.
    fr:
      question: "Quel effet climatique les grands lacs glaciaires d’Italie du Nord exercent-ils sur les vignobles voisins ?"
      choices:
        - { text: "Ils augmentent l’amplitude thermique annuelle", correct: false }
        - { text: "Ils modèrent les températures extrêmes et peuvent prolonger la saison végétative", correct: true }
        - { text: "Ils empêchent tout gel et toute maladie fongique", correct: false }
        - { text: "Ils créent une forte ombre pluviométrique sur la plaine du Pô", correct: false }
      explanation: |
        L’eau se réchauffe et se refroidit plus lentement que la terre. Autour de lacs comme le lac de
        Garde, elle réduit les températures extrêmes et permet à la vigne de prospérer à une latitude
        relativement septentrionale.

  - id: nitaly-sea-fungus-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, climate]
    status: reviewed
    source_id: c27-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What vineyard hazard generally increases toward Northern Italy’s Adriatic coast?"
      choices:
        - { text: "Severe winter freeze caused by high altitude", correct: false }
        - { text: "Humidity and rainfall that raise fungal-disease pressure", correct: true }
        - { text: "Chronic drought caused by a strong rain shadow", correct: false }
        - { text: "Poor fruit set caused by persistent desert winds", correct: false }
      explanation: |
        Maritime influence and moist air make disease management particularly important on flatter
        coastal land in Veneto and Friuli-Venezia Giulia.
    fr:
      question: "Quel risque viticole augmente généralement en direction de la côte adriatique de l’Italie du Nord ?"
      choices:
        - { text: "Les forts gels hivernaux causés par l’altitude", correct: false }
        - { text: "L’humidité et les pluies qui accroissent la pression des maladies fongiques", correct: true }
        - { text: "La sécheresse chronique due à une forte ombre pluviométrique", correct: false }
        - { text: "La mauvaise nouaison causée par des vents désertiques persistants", correct: false }
      explanation: |
        L’influence maritime et l’air humide rendent la lutte contre les maladies particulièrement
        importante sur les terrains côtiers plus plats de Vénétie et du Frioul-Vénétie Julienne.

  - id: nitaly-old-plant-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy]
    status: reviewed
    source_id: c27-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination characterised many traditional high-volume vineyards in Northern Italy?"
      choices:
        - { text: "Dense planting, low-trained vines and severe yield restriction", correct: false }
        - { text: "Low planting density, high yields and pergola training", correct: true }
        - { text: "Dense bush vines, dry farming and hand harvesting", correct: false }
        - { text: "Wide VSP rows, low yields and extensive green harvesting", correct: false }
      explanation: |
        Pergola systems could carry large crops and were suited to mixed farming. Many quality-focused
        vineyards have since moved toward denser VSP plantings and tighter yield control.
    fr:
      question: "Quelle combinaison caractérisait de nombreux vignobles traditionnels à fort rendement d’Italie du Nord ?"
      choices:
        - { text: "Plantation dense, vignes basses et limitation sévère des rendements", correct: false }
        - { text: "Faible densité de plantation, rendements élevés et conduite en pergola", correct: true }
        - { text: "Gobelets denses, culture sans irrigation et vendanges manuelles", correct: false }
        - { text: "Rangs larges en VSP, faibles rendements et vendanges en vert importantes", correct: false }
      explanation: |
        Les pergolas pouvaient porter de grosses récoltes et convenaient à la polyculture. De nombreux
        vignobles axés sur la qualité ont depuis adopté des plantations VSP plus denses et une maîtrise
        plus stricte des rendements.

  - id: nitaly-pergola-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy]
    status: reviewed
    source_id: c27-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is the canopy arranged in a traditional Italian pergola system?"
      choices:
        - { text: "Shoots are tied vertically between low pairs of wires", correct: false }
        - { text: "Shoots form an overhead canopy with bunches hanging beneath", correct: true }
        - { text: "Vines are kept as free-standing bushes close to the ground", correct: false }
        - { text: "Canes are woven into low baskets around the trunk", correct: false }
      explanation: |
        The elevated horizontal canopy shades the fruit and leaves working space below. Several regional
        variants exist, including Pergola Trentina and Pergola Veronese.
    fr:
      question: "Comment le feuillage est-il disposé dans une pergola italienne traditionnelle ?"
      choices:
        - { text: "Les rameaux sont palissés verticalement entre des fils bas", correct: false }
        - { text: "Les rameaux forment un toit végétal, les grappes pendant en dessous", correct: true }
        - { text: "Les vignes restent en gobelets autonomes près du sol", correct: false }
        - { text: "Les sarments sont tressés en corbeilles basses autour du tronc", correct: false }
      explanation: |
        Le couvert végétal horizontal et surélevé ombrage les raisins et laisse un espace de travail en
        dessous. Il existe plusieurs variantes régionales, dont la Pergola Trentina et la Pergola
        Veronese.

  - id: nitaly-pergola-sun-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy]
    status: reviewed
    source_id: c27-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can pergola training protect grapes in warm, sunny Northern Italian sites?"
      choices:
        - { text: "It exposes every bunch directly to afternoon sun", correct: false }
        - { text: "Its overhead canopy shades the bunches and reduces sunburn", correct: true }
        - { text: "It delays budburst by keeping the trunk below ground", correct: false }
        - { text: "It prevents berries from accumulating any sugar", correct: false }
      explanation: |
        Shade is useful where strong sunlight could scorch exposed fruit. The trade-off is that
        excessive shade may slow ripening or encourage disease if the canopy is not well managed.
    fr:
      question: "Pourquoi la conduite en pergola peut-elle protéger les raisins sur les sites chauds et ensoleillés d’Italie du Nord ?"
      choices:
        - { text: "Elle expose chaque grappe directement au soleil de l’après-midi", correct: false }
        - { text: "Son toit végétal ombrage les grappes et réduit les brûlures", correct: true }
        - { text: "Elle retarde le débourrement en maintenant le tronc sous terre", correct: false }
        - { text: "Elle empêche les baies d’accumuler le moindre sucre", correct: false }
      explanation: |
        L’ombre est utile lorsque le fort ensoleillement risque de brûler les raisins exposés. En
        contrepartie, un ombrage excessif peut ralentir la maturation ou favoriser les maladies si le
        feuillage est mal géré.

  - id: nitaly-pergola-air-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy]
    status: reviewed
    source_id: c27-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a well-managed pergola help limit bunch rot?"
      choices:
        - { text: "By enclosing the fruit inside a dense wall of leaves", correct: false }
        - { text: "By suspending bunches below the canopy where air can circulate", correct: true }
        - { text: "By keeping bunches in contact with moist soil", correct: false }
        - { text: "By preventing growers from removing any leaves", correct: false }
      explanation: |
        Separating the fruit zone from the overhead foliage can improve ventilation. This advantage
        disappears if vigorous growth creates a dense, humid canopy.
    fr:
      question: "Comment une pergola bien maîtrisée peut-elle limiter la pourriture des grappes ?"
      choices:
        - { text: "En enfermant les raisins dans une paroi dense de feuilles", correct: false }
        - { text: "En suspendant les grappes sous le feuillage, là où l’air peut circuler", correct: true }
        - { text: "En maintenant les grappes au contact du sol humide", correct: false }
        - { text: "En empêchant tout effeuillage par le viticulteur", correct: false }
      explanation: |
        Séparer la zone fructifère du feuillage situé au-dessus peut améliorer la ventilation. Cet
        avantage disparaît si une vigueur excessive crée un couvert dense et humide.

  - id: nitaly-pergola-sparkling-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy]
    status: reviewed
    source_id: c27-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can pergola training suit grapes intended for sparkling-wine base wines?"
      choices:
        - { text: "Heavy exposure rapidly raises sugar and lowers acidity", correct: false }
        - { text: "Canopy shade can help retain acidity and limit sugar accumulation", correct: true }
        - { text: "The system naturally causes noble rot in every vintage", correct: false }
        - { text: "Its low yields produce highly tannic base wines", correct: false }
      explanation: |
        Sparkling bases are normally picked with modest potential alcohol and refreshing acidity. A
        shaded, productive canopy can help deliver that composition in relatively warm conditions.
    fr:
      question: "Pourquoi la conduite en pergola peut-elle convenir aux raisins destinés aux vins de base effervescents ?"
      choices:
        - { text: "La forte exposition augmente rapidement le sucre et diminue l’acidité", correct: false }
        - { text: "L’ombre du feuillage peut préserver l’acidité et limiter l’accumulation de sucre", correct: true }
        - { text: "Le système provoque naturellement la pourriture noble chaque année", correct: false }
        - { text: "Ses faibles rendements donnent des vins de base très tanniques", correct: false }
      explanation: |
        Les vins de base effervescents sont normalement vendangés avec un degré alcoolique potentiel
        modeste et une acidité rafraîchissante. Un feuillage ombragé et productif peut favoriser cette
        composition dans des conditions assez chaudes.

  - id: nitaly-pergola-appassimento-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy]
    status: reviewed
    source_id: c27-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can pergola training be useful for grapes destined for appassimento?"
      choices:
        - { text: "It deliberately damages the skins before harvest", correct: false }
        - { text: "It can shade and separate bunches, helping deliver sound fruit for drying", correct: true }
        - { text: "It raises berry water content immediately before picking", correct: false }
        - { text: "It makes selection of healthy bunches unnecessary", correct: false }
      explanation: |
        Drying concentrates every component of the grape, including faults. Intact, disease-free bunches
        are therefore essential for Amarone, Recioto and other appassimento wines.
    fr:
      question: "Pourquoi la conduite en pergola peut-elle être utile pour les raisins destinés à l’appassimento ?"
      choices:
        - { text: "Elle endommage volontairement les pellicules avant la vendange", correct: false }
        - { text: "Elle peut ombrager et séparer les grappes, fournissant des raisins sains à sécher", correct: true }
        - { text: "Elle augmente la teneur en eau des baies juste avant la récolte", correct: false }
        - { text: "Elle rend inutile le tri des grappes saines", correct: false }
      explanation: |
        Le séchage concentre tous les composants du raisin, y compris les défauts. Des grappes intactes
        et exemptes de maladie sont donc essentielles pour l’Amarone, le Recioto et les autres vins
        d’appassimento.

  - id: nitaly-vsp-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy]
    status: reviewed
    source_id: c27-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which training approach is common in modern quality-focused Northern Italian vineyards?"
      choices:
        - { text: "Very low-density pergolas carrying maximum yields", correct: false }
        - { text: "Higher-density planting with vertical shoot positioning", correct: true }
        - { text: "Untrained vines allowed to climb nearby trees", correct: false }
        - { text: "Low basket vines with shoots woven in a circle", correct: false }
      explanation: |
        VSP facilitates canopy management, spraying and, where terrain permits, mechanisation. It is
        often paired with lower yields than traditional high-production pergolas.
    fr:
      question: "Quel mode de conduite est courant dans les vignobles modernes d’Italie du Nord axés sur la qualité ?"
      choices:
        - { text: "Des pergolas à très faible densité portant des rendements maximaux", correct: false }
        - { text: "Des plantations plus denses avec palissage vertical des rameaux", correct: true }
        - { text: "Des vignes non palissées grimpant aux arbres voisins", correct: false }
        - { text: "Des vignes basses en corbeille aux sarments tressés en cercle", correct: false }
      explanation: |
        Le VSP facilite la gestion du feuillage, les traitements et, lorsque le terrain le permet, la
        mécanisation. Il est souvent associé à des rendements plus faibles que les pergolas
        traditionnelles de forte production.

  - id: nitaly-aa-where-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, alto-adige]
    status: reviewed
    source_id: c27-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Italian wine region surrounds Bolzano immediately south of the Austrian border?"
      choices:
        - { text: "Trentino", correct: false }
        - { text: "Alto Adige", correct: true }
        - { text: "Friuli-Venezia Giulia", correct: false }
        - { text: "Valle d’Aosta", correct: false }
      explanation: |
        Alto Adige, also called Südtirol, is Italy’s most northerly major wine region. Trentino
        continues down the Adige valley to its south.
    fr:
      question: "Quelle région viticole italienne entoure Bolzano, immédiatement au sud de la frontière autrichienne ?"
      choices:
        - { text: "Le Trentin", correct: false }
        - { text: "Le Haut-Adige", correct: true }
        - { text: "Le Frioul-Vénétie Julienne", correct: false }
        - { text: "La Vallée d’Aoste", correct: false }
      explanation: |
        Le Haut-Adige, également appelé Südtirol, est la grande région viticole la plus septentrionale
        d’Italie. Le Trentin prolonge la vallée de l’Adige vers le sud.

  - id: nitaly-aa-terraces-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, alto-adige]
    status: reviewed
    source_id: c27-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are many Alto Adige vineyards planted on terraced valley slopes?"
      choices:
        - { text: "To maximise fertile, mechanisable land on the valley floor", correct: false }
        - { text: "To use steep, well-exposed sites with good sunlight and drainage", correct: true }
        - { text: "To protect vines from every form of spring frost", correct: false }
        - { text: "To create deep alluvial soils around the roots", correct: false }
      explanation: |
        Terracing makes steep slopes cultivable. Favourable aspects intercept sunlight, while elevation
        and cold-air drainage help preserve freshness.
    fr:
      question: "Pourquoi de nombreux vignobles du Haut-Adige sont-ils plantés sur des versants aménagés en terrasses ?"
      choices:
        - { text: "Pour maximiser les terrains fertiles et mécanisables du fond de vallée", correct: false }
        - { text: "Pour exploiter des sites escarpés, bien exposés, ensoleillés et drainants", correct: true }
        - { text: "Pour protéger les vignes de toute forme de gel printanier", correct: false }
        - { text: "Pour créer des sols alluviaux profonds autour des racines", correct: false }
      explanation: |
        Les terrasses rendent cultivables les pentes raides. Les bonnes expositions captent le soleil,
        tandis que l’altitude et le drainage de l’air froid contribuent à préserver la fraîcheur.

  - id: nitaly-aa-climate-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, alto-adige, climate]
    status: reviewed
    source_id: c27-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination best explains Alto Adige’s ability to ripen grapes while retaining acidity?"
      choices:
        - { text: "Persistent cloud, high rainfall and low summer temperatures", correct: false }
        - { text: "Sunny, relatively dry summers combined with altitude and cool nights", correct: true }
        - { text: "Hot maritime weather with little diurnal variation", correct: false }
        - { text: "Warm nights, fertile soils and very high yields", correct: false }
      explanation: |
        The Alps shelter the region and the growing season receives abundant sunshine. Elevation creates
        a large diurnal range, allowing flavour development without rapid acid loss.
    fr:
      question: "Quelle combinaison explique le mieux la capacité du Haut-Adige à mûrir les raisins tout en conservant leur acidité ?"
      choices:
        - { text: "Nébulosité persistante, fortes pluies et basses températures estivales", correct: false }
        - { text: "Étés ensoleillés et assez secs, associés à l’altitude et à des nuits fraîches", correct: true }
        - { text: "Temps maritime chaud avec faible amplitude thermique quotidienne", correct: false }
        - { text: "Nuits chaudes, sols fertiles et rendements très élevés", correct: false }
      explanation: |
        Les Alpes abritent la région et la saison végétative bénéficie d’un fort ensoleillement.
        L’altitude crée une grande amplitude thermique quotidienne, permettant le développement des
        arômes sans perte rapide d’acidité.

  - id: nitaly-aa-altitude-style-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, alto-adige]
    status: reviewed
    source_id: c27-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which wine styles are especially favoured by Alto Adige’s high-altitude sites and cool nights?"
      choices:
        - { text: "Powerful fortified reds and low-acid whites", correct: false }
        - { text: "Aromatic whites and elegant, fresh reds", correct: true }
        - { text: "Sweet botrytised wines and deeply coloured rosés", correct: false }
        - { text: "High-alcohol reds with soft acidity and jammy fruit", correct: false }
      explanation: |
        Altitude and diurnal range preserve acidity and aroma. Site variation still matters: warmer
        valley sites can ripen fuller reds, while higher slopes favour fragrant whites and Pinot Noir.
    fr:
      question: "Quels styles de vins sont particulièrement favorisés par les sites d’altitude et les nuits fraîches du Haut-Adige ?"
      choices:
        - { text: "Rouges fortifiés puissants et blancs peu acides", correct: false }
        - { text: "Blancs aromatiques et rouges élégants et frais", correct: true }
        - { text: "Vins liquoreux botrytisés et rosés très colorés", correct: false }
        - { text: "Rouges riches en alcool, à l’acidité souple et au fruit confituré", correct: false }
      explanation: |
        L’altitude et l’amplitude thermique préservent l’acidité et les arômes. Les sites restent
