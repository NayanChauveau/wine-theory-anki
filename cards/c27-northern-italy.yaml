        - { text: "The law requires chestnut casks from a single commune", correct: false }
      explanation: |
        Large neutral botti are associated with traditional styles, while smaller barrels may give
        faster oxygen exposure and more oak flavour. The denomination specifies time in wood, not one
        vessel size.
    fr:
      question: "Quelle affirmation concernant les contenants employés pour l’élevage sous bois du Barolo est correcte ?"
      choices:
        - { text: "La loi exige uniquement des barriques françaises neuves de 225 litres", correct: false }
        - { text: "Les producteurs peuvent employer de grands foudres ou de plus petits fûts selon le style", correct: true }
        - { text: "Le cahier des charges interdit le bois et n’autorise que l’inox", correct: false }
        - { text: "La loi impose des fûts de châtaignier provenant d’une seule commune", correct: false }
      explanation: |
        Les grands botti neutres sont associés aux styles traditionnels, tandis que les petits fûts
        peuvent accélérer les échanges d’oxygène et marquer davantage le vin. La dénomination fixe une
