      question: "How does the usual drinking window of Barbera and Dolcetto compare with Barolo?"
      choices:
        - { text: "Both invariably need longer ageing than Barolo", correct: false }
        - { text: "Many are enjoyable young, although the best can age for several years", correct: true }
        - { text: "Neither can legally be released before ten years", correct: false }
        - { text: "Both must complete a second fermentation in bottle", correct: false }
      explanation: |
        Fruit-driven examples are made for early drinking. Concentrated, carefully matured Barbera and
        some top Dolcetto can develop in bottle, but they do not share Barolo’s default long-ageing
        profile.
    fr:
      question: "Comment la fenêtre de consommation habituelle de la Barbera et du Dolcetto se compare-t-elle à celle du Barolo ?"
      choices:
        - { text: "Tous deux exigent systématiquement une garde plus longue que le Barolo", correct: false }
        - { text: "Beaucoup sont agréables jeunes, même si les meilleurs peuvent vieillir plusieurs années", correct: true }
        - { text: "Aucun ne peut légalement sortir avant dix ans", correct: false }
        - { text: "Tous deux doivent effectuer une seconde fermentation en bouteille", correct: false }
      explanation: |
        Les exemples fruités sont destinés à être bus jeunes. Une Barbera concentrée et soigneusement
        élevée ainsi que certains grands Dolcetto peuvent évoluer en bouteille, mais ils n’ont pas le
        profil de longue garde habituel du Barolo.

