        - { text: "They determine sunlight and heat available to late-ripening varieties", correct: true }
        - { text: "They remove all differences between vintages", correct: false }
        - { text: "They allow vineyards to avoid every hailstorm", correct: false }
      explanation: |
        Nebbiolo needs warm, well-exposed slopes to ripen reliably. Earlier-ripening Dolcetto can occupy
        cooler sites, while Barbera sits between them.
    fr:
      question: "Pourquoi la pente et l’exposition sont-elles particulièrement importantes dans le Piémont ?"
      choices:
        - { text: "Tous les cépages profitent de la même façon des sites frais exposés au nord", correct: false }
        - { text: "Elles déterminent l’ensoleillement et la chaleur disponibles pour les cépages tardifs", correct: true }
        - { text: "Elles suppriment toutes les différences entre les millésimes", correct: false }
        - { text: "Elles permettent d’éviter chaque épisode de grêle", correct: false }
      explanation: |
        Le Nebbiolo exige des coteaux chauds et bien exposés pour mûrir régulièrement. Le Dolcetto, plus
        précoce, peut occuper des sites plus frais, tandis que la Barbera se situe entre les deux.

