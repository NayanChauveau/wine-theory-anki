    en:
      question: "Which profile is typical of youthful still Gavi?"
      choices:
        - { text: "Full body, low acidity, tropical fruit and strong new oak", correct: false }
        - { text: "Pale colour, light body, high acidity, citrus, green apple and pear", correct: true }
        - { text: "Deep colour, high tannin, black fruit and dried herbs", correct: false }
        - { text: "Sweetness, low alcohol and intensely grapey aromas", correct: false }
      explanation: |
        Protective handling commonly preserves delicate fruit and freshness. Better examples may have
        more body and texture while retaining the variety’s acidity.
    fr:
      question: "Quel profil est typique d’un Gavi tranquille jeune ?"
      choices:
        - { text: "Corps puissant, faible acidité, fruits tropicaux et bois neuf marqué", correct: false }
        - { text: "Couleur pâle, corps léger, acidité élevée, agrumes, pomme verte et poire", correct: true }
        - { text: "Couleur profonde, tanins élevés, fruits noirs et herbes séchées", correct: false }
        - { text: "Douceur, faible alcool et arômes muscatés intenses", correct: false }
      explanation: |
        Une vinification protectrice préserve généralement le fruit délicat et la fraîcheur. Les
        meilleurs exemples peuvent posséder davantage de corps et de texture tout en conservant
        l’acidité du cépage.

  - id: nitaly-gavi-steel-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, piedmont]
    status: reviewed
    source_id: c27-0133
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fermentation approach is most common for fresh, youthful Gavi?"
      choices:
        - { text: "Warm oxidative fermentation in new barriques", correct: false }
        - { text: "Cool protective fermentation in stainless steel", correct: true }
        - { text: "Extended skin fermentation in open vats", correct: false }
        - { text: "Bottle fermentation followed by lees ageing", correct: false }
      explanation: |
        Low temperature and protection from oxygen preserve Cortese’s citrus and orchard-fruit aromas.
        Stainless steel avoids adding oak flavour.
    fr:
      question: "Quelle approche de fermentation est la plus courante pour un Gavi jeune et frais ?"
      choices:
        - { text: "Fermentation chaude et oxydative en barriques neuves", correct: false }
        - { text: "Fermentation fraîche et protectrice en cuves inox", correct: true }
        - { text: "Longue fermentation pelliculaire en cuves ouvertes", correct: false }
        - { text: "Fermentation en bouteille suivie d’un élevage sur lies", correct: false }
      explanation: |
        La basse température et la protection contre l’oxygène préservent les arômes d’agrumes et de
        fruits du verger du Cortese. L’inox évite d’ajouter un goût boisé.

  - id: nitaly-gavi-complex-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, piedmont]
    status: reviewed
    source_id: c27-0134
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cellar choices can add texture and complexity to premium Gavi without strong new-oak flavour?"
      choices:
        - { text: "Fortification and deliberate oxidation", correct: false }
        - { text: "Fermentation in older oak and lees stirring", correct: true }
        - { text: "Carbonic maceration and early bottling", correct: false }
        - { text: "Stopping fermentation to retain high sugar", correct: false }
      explanation: |
        Older vessels allow gentle oxygen exposure without dominant oak aromas, while lees stirring adds
        body and savoury texture.
    fr:
      question: "Quels choix de cave peuvent apporter texture et complexité à un Gavi haut de gamme sans fort goût de bois neuf ?"
      choices:
        - { text: "Mutage et oxydation volontaire", correct: false }
        - { text: "Fermentation en bois ancien et bâtonnage des lies", correct: true }
        - { text: "Macération carbonique et mise précoce", correct: false }
        - { text: "Arrêt de la fermentation pour conserver beaucoup de sucre", correct: false }
      explanation: |
        Les contenants anciens permettent de légers échanges d’oxygène sans arômes boisés dominants,
        tandis que le bâtonnage des lies apporte du corps et une texture savoureuse.

  - id: nitaly-gavi-age-001
    type: mcq
    deck: Italy::Northern Italy
    tags: [italy, northern-italy, piedmont]
    status: reviewed
    source_id: c27-0135
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When are most youthful, stainless-steel Gavi wines intended to be consumed?"
      choices:
        - { text: "Only after at least ten years in bottle", correct: false }
        - { text: "On release or within the first few years", correct: true }
        - { text: "Before alcoholic fermentation has finished", correct: false }
        - { text: "After compulsory oxidative ageing", correct: false }
      explanation: |
        The dominant style emphasises fresh primary fruit. Concentrated, lees- or oak-matured examples
        can develop honeyed and nutty complexity over longer periods.
    fr:
      question: "Quand la plupart des Gavi jeunes vinifiés en inox sont-ils destinés à être consommés ?"
      choices:
        - { text: "Uniquement après au moins dix ans en bouteille", correct: false }
        - { text: "Dès leur sortie ou dans les premières années", correct: true }
        - { text: "Avant la fin de la fermentation alcoolique", correct: false }
        - { text: "Après un élevage oxydatif obligatoire", correct: false }
      explanation: |
        Le style dominant met en avant le fruit primaire frais. Les exemples concentrés, élevés sur lies
        ou sous bois, peuvent développer une complexité miellée et de fruits à coque sur une période
        plus longue.
