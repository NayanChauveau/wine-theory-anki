      question: "Quel paysage viticole caractérise le mieux les principales zones vinicoles du Piémont ?"
      choices:
        - { text: "Vignobles côtiers plats au niveau de la mer", correct: false }
        - { text: "Contreforts vallonnés et coteaux situés approximativement entre 150 et 600 mètres", correct: true }
        - { text: "Hauts plateaux plantés au-dessus de 1 200 mètres", correct: false }
        - { text: "Une unique plaine fertile sans variation d’exposition", correct: false }
