        - { text: "Nebbiolo now develops naturally low tannins", correct: false }
        - { text: "Producers routinely sweeten the wine before bottling", correct: false }
      explanation: |
        Improved vineyard work and less aggressive extraction can produce finer tannins from the outset.
        Every Barolo must still complete the legal minimum of 18 months in wood.
    fr:
      question: "Pourquoi un Barolo moderne peut-il atteindre des tanins équilibrés sans élevage sous bois extrêmement prolongé ?"
      choices:
        - { text: "Les règles actuelles permettent de supprimer la durée légale sous bois", correct: false }
        - { text: "Des raisins plus mûrs, une extraction douce et un élevage précis réduisent l’austérité", correct: true }
        - { text: "Le Nebbiolo produit désormais naturellement peu de tanins", correct: false }
        - { text: "Les producteurs édulcorent couramment le vin avant la mise", correct: false }
      explanation: |
        Une meilleure viticulture et une extraction moins agressive peuvent donner des tanins plus fins
        dès le départ. Tout Barolo doit néanmoins accomplir le minimum légal de 18 mois sous bois.

  - id: nitaly-barolo-oak-size-001
