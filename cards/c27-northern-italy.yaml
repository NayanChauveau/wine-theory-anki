        - { text: "Harvested grapes are dried indoors so sugars and flavours concentrate, then fermented later (often in winter)", correct: true }
        - { text: "Must is boiled", correct: false }
        - { text: "Only carbonic maceration is used", correct: false }
      explanation: |
