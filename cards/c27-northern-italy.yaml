        - { text: "Deep purple colour, moderate acidity, noticeable tannin and plum or cherry fruit", correct: true }
        - { text: "Deep colour, low tannin, high acidity and strong new oak", correct: false }
        - { text: "Light body, residual sweetness and grapey perfume", correct: false }
      explanation: |
        Compared with Barbera, Dolcetto usually has less acidity and more tannin. Dried herbs and a
        characteristic bitter-almond finish may add complexity.
    fr:
      question: "Quel profil est typique d’un Dolcetto d’Alba ?"
      choices:
        - { text: "Couleur pâle, acidité élevée, faibles tanins et arômes floraux", correct: false }
        - { text: "Couleur pourpre profonde, acidité modérée, tanins présents et fruits de prune ou de cerise", correct: true }
        - { text: "Couleur profonde, faibles tanins, acidité élevée et bois neuf marqué", correct: false }
        - { text: "Corps léger, sucre résiduel et parfum muscaté", correct: false }
      explanation: |
        Par rapport à la Barbera, le Dolcetto présente généralement moins d’acidité et davantage de
        tanins. Des herbes séchées et une finale caractéristique d’amande amère peuvent ajouter de la
        complexité.

  - id: nitaly-barbera-dolcetto-age-001
