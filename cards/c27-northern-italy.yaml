        - { text: "Il devient plus froid parce que l’altitude augmente", correct: false }
        - { text: "Il devient aride parce que la mer bloque les pluies", correct: false }
      explanation: |
        L’air montagnard rafraîchit les collines du nord, tandis que les terres côtières plus basses
        subissent davantage l’influence adriatique. Les fortes pluies rendent le drainage et la lutte
        contre les maladies importants dans une grande partie de la région.

