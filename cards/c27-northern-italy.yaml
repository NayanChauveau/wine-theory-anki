    en:
      question: "What does the wording Gavi del Comune di Gavi or Gavi di Gavi indicate?"
      choices:
        - { text: "The wine was merely bottled in the town of Gavi", correct: false }
        - { text: "The grapes came from vineyards within the commune of Gavi", correct: true }
        - { text: "The wine contains a minimum share of Moscato", correct: false }
        - { text: "The wine was aged in oak inside the commune", correct: false }
      explanation: |
        The communal indication narrows grape origin within the broader DOCG. It does not prescribe a
        particular fermentation vessel or sweetness level.
    fr:
      question: "Que signifie la mention Gavi del Comune di Gavi ou Gavi di Gavi ?"
      choices:
        - { text: "Le vin a simplement été mis en bouteille dans la ville de Gavi", correct: false }
        - { text: "Les raisins proviennent de vignobles situés dans la commune de Gavi", correct: true }
        - { text: "Le vin contient une proportion minimale de Moscato", correct: false }
        - { text: "Le vin a été élevé sous bois dans la commune", correct: false }
      explanation: |
        L’indication communale précise l’origine des raisins au sein de la vaste DOCG. Elle n’impose ni
        contenant de fermentation ni niveau de douceur particulier.

  - id: nitaly-gavi-style-001
    type: mcq
