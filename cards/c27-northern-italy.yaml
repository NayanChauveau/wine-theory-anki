    en:
      question: "What is the principal effect of appassimento on grapes for Valpolicella wines?"
      choices:
        - { text: "It dilutes sugar, acid and flavour before fermentation", correct: false }
        - { text: "It removes water and concentrates sugar, acid, flavour and phenolics", correct: true }
        - { text: "It converts all grape sugar into alcohol before crushing", correct: false }
        - { text: "It creates carbon dioxide through a second bottle fermentation", correct: false }
      explanation: |
        Water loss raises potential alcohol and flavour intensity. Because acidity and phenolics are
        concentrated too, the resulting wine can remain balanced despite its richness.
    fr:
      question: "Quel est l’effet principal de l’appassimento sur les raisins destinés aux vins de Valpolicella ?"
      choices:
        - { text: "Il dilue le sucre, l’acidité et les arômes avant la fermentation", correct: false }
        - { text: "Il élimine de l’eau et concentre le sucre, l’acidité, les arômes et les composés phénoliques", correct: true }
        - { text: "Il transforme tout le sucre du raisin en alcool avant le foulage", correct: false }
        - { text: "Il crée du gaz carbonique par une seconde fermentation en bouteille", correct: false }
      explanation: |
        La perte d’eau augmente l’alcool potentiel et l’intensité aromatique. Comme l’acidité et les
        composés phénoliques sont également concentrés, le vin obtenu peut rester équilibré malgré sa
        richesse.

  - id: nitaly-passito-how-001
