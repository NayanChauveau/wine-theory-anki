        This deliberate interruption distinguishes sweet Recioto from Amarone, whose fermentation
        continues much further toward dryness. Both begin with dried grapes.
    fr:
      question: "Pourquoi le Recioto della Valpolicella conserve-t-il une douceur importante ?"
      choices:
        - { text: "Les raisins contiennent trop peu de sucre pour achever la fermentation", correct: false }
        - { text: "Le producteur arrête la fermentation avant que tout le sucre concentré soit consommé", correct: true }
        - { text: "De l’alcool vinique est ajouté avant le début de la fermentation", correct: false }
        - { text: "Le vin est édulcoré après la mise avec du moût concentré", correct: false }
      explanation: |
        Cette interruption volontaire distingue le Recioto doux de l’Amarone, dont la fermentation se
        poursuit beaucoup plus loin vers la sécheresse. Tous deux proviennent de raisins séchés.

