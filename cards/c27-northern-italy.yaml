    en:
      question: "What minimum maturation is required for Barolo DOCG under the current production code?"
      choices:
        - { text: "26 months, including 9 months in wood", correct: false }
        - { text: "38 months, including 18 months in wood", correct: true }
        - { text: "50 months, including 24 months in wood", correct: false }
        - { text: "62 months, all in new barrels", correct: false }
      explanation: |
        The period runs from 1 November of the harvest year, and release is permitted from 1 January of
        the fourth following year. Barolo Riserva requires 62 months, still with at least 18 months in
        wood.
    fr:
      question: "Quelle maturation minimale le cahier des charges actuel exige-t-il pour Barolo DOCG ?"
      choices:
        - { text: "26 mois, dont 9 mois sous bois", correct: false }
        - { text: "38 mois, dont 18 mois sous bois", correct: true }
        - { text: "50 mois, dont 24 mois sous bois", correct: false }
        - { text: "62 mois, entièrement en barriques neuves", correct: false }
      explanation: |
        La période court à partir du 1er novembre de l’année de récolte et la commercialisation est
        autorisée dès le 1er janvier de la quatrième année suivante. Barolo Riserva exige 62 mois, dont
        toujours au moins 18 sous bois.

  - id: nitaly-barolo-oak-shift-001
