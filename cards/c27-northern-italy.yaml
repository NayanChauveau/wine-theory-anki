    en:
      question: "How are grapes prepared for Amarone and Recioto before fermentation?"
      choices:
        - { text: "They remain on the vine until they freeze", correct: false }
        - { text: "They are dried after harvest in ventilated drying rooms", correct: true }
        - { text: "They are submerged in wine to begin carbonic maceration", correct: false }
        - { text: "They are affected by noble rot in humid cellars", correct: false }
      explanation: |
        Selected healthy bunches lose water in a fruttaio, traditionally for several months. Modern
        ventilation and humidity control reduce the risk of unwanted rot.
    fr:
      question: "Comment les raisins sont-ils préparés pour l’Amarone et le Recioto avant la fermentation ?"
      choices:
        - { text: "Ils restent sur pied jusqu’à ce qu’ils gèlent", correct: false }
        - { text: "Ils sèchent après la vendange dans des locaux ventilés", correct: true }
        - { text: "Ils sont immergés dans du vin pour commencer une macération carbonique", correct: false }
        - { text: "Ils sont atteints de pourriture noble dans des chais humides", correct: false }
      explanation: |
        Des grappes saines et sélectionnées perdent leur eau dans un fruttaio, traditionnellement
        pendant plusieurs mois. La ventilation et le contrôle moderne de l’humidité réduisent le risque
        de pourriture indésirable.

