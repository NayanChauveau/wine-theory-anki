      question: Which aroma group is typical of wine that has spent time in toasted oak?
      choices:
        - { text: "Toast, vanilla, smoke and cloves", correct: true }
        - { text: "Only crushed fresh grape and nothing roasted", correct: false }
        - { text: "Only vinegar and nail-polish remover", correct: false }
        - { text: "Only salty seawater and iodine", correct: false }
      explanation: |
        Typical oak notes include **toast, vanilla, smoke and cloves**.
        Fresh grape is from the fruit; vinegar and solvent notes are
        faults, not oak spice.

  - id: wine-oak-hygiene-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: reviewed
    source_id: c07-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is oak harder to keep microbiologically clean than stainless steel?
      choices:
        - { text: "Oak cannot hold liquid at all", correct: false }
        - { text: "Porous staves hide yeasts, bacteria and moulds", correct: true }
        - { text: "Oak sterilises itself and never needs cleaning", correct: false }
        - { text: "Only stainless steel can ever grow microbes", correct: false }
      explanation: |
        **Porous staves hide yeasts, bacteria and moulds.** Steel
        does not trap residues in the same way. That is the
        standing worry with oak, not a claim that wood cannot
        hold wine.
