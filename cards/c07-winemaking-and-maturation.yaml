# yaml-language-server: $schema=../schema/cards.schema.json
# source: C07 (import/inbox/c07-winemaking-and-maturation.yaml)
# deck: Winemaking and Maturation

cards:
  - id: wine-after-harvest-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, process]
    status: reviewed
    source_id: c07-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Once the grapes are picked, which cellar stage comes before alcoholic fermentation?
      choices:
        - { text: "Maturing the wine in oak or steel", correct: false }
        - { text: "Preparing the fruit for fermentation", correct: true }
        - { text: "Malolactic conversion of the juice", correct: false }
        - { text: "Fining and filtering for clarity", correct: false }
      explanation: |
        The fruit is received, often sorted, then destemmed, crushed or pressed
        depending on the style. Maturation, malolactic conversion and fining all
        work on wine, so they come after the yeast have done their job.
    fr:
      question: Une fois le raisin vendangé, quelle étape de chai précède la fermentation alcoolique ?
      choices:
        - { text: "L’élevage en fût ou en cuve inox", correct: false }
        - { text: "La préparation de la vendange", correct: true }
        - { text: "La fermentation malolactique du moût", correct: false }
        - { text: "Le collage et la filtration", correct: false }
      explanation: |
        La vendange est réceptionnée, souvent triée, puis éraflée, foulée ou
        pressée selon le style recherché. L’élevage, la malolactique et le
        collage portent sur du vin : ils viennent après le travail des levures.

  - id: ferment-alcohol-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation]
    status: reviewed
    source_id: c07-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In alcoholic fermentation, what does yeast turn grape sugar into?
      choices:
        - { text: "Lactic acid and carbon dioxide", correct: false }
        - { text: "Alcohol and oxygen", correct: false }
        - { text: "Alcohol and carbon dioxide", correct: true }
        - { text: "Acetic acid and water", correct: false }
      explanation: |
        Ethanol and CO₂ are the defining pair; heat, glycerol and many aroma
        compounds appear as by-products. Lactic acid comes from bacteria during
        malolactic conversion, and acetic acid is the work of spoilage bacteria.
    fr:
      question: Lors de la fermentation alcoolique, en quoi les levures transforment-elles le sucre du raisin ?
      choices:
        - { text: "En acide lactique et gaz carbonique", correct: false }
        - { text: "En alcool et oxygène", correct: false }
        - { text: "En alcool et gaz carbonique", correct: true }
        - { text: "En acide acétique et eau", correct: false }
      explanation: |
        L’éthanol et le CO₂ sont les deux produits principaux ; la fermentation
        dégage aussi de la chaleur, du glycérol et de nombreux arômes. L’acide
        lactique vient des bactéries de la malolactique, l’acide acétique de
        bactéries d’altération.

  - id: wine-after-ferment-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, process]
    status: reviewed
    source_id: c07-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Once alcoholic fermentation has finished, what is the general next stage for the wine?
      choices:
        - { text: "Storage in vessel before packaging", correct: true }
        - { text: "Sorting and destemming", correct: false }
        - { text: "A second alcoholic fermentation", correct: false }
        - { text: "A cold soak on the skins", correct: false }
      explanation: |
        The storage stretch can last a few weeks in steel for a fresh white or
        several years in oak for a structured red. Sorting, destemming and cold
        soaking happen before fermentation; a second fermentation belongs to
        sparkling-wine methods.
    fr:
      question: Une fois la fermentation alcoolique terminée, quelle est l’étape suivante pour le vin ?
      choices:
        - { text: "L’élevage en cuve ou en fût", correct: true }
        - { text: "Le tri et l’éraflage", correct: false }
        - { text: "Une seconde fermentation alcoolique", correct: false }
        - { text: "Une macération préfermentaire à froid", correct: false }
      explanation: |
        Cet élevage peut durer quelques semaines en inox pour un blanc frais ou
        plusieurs années en fût pour un rouge de garde. Le tri, l’éraflage et la
        macération à froid précèdent la fermentation ; une seconde fermentation
        relève des méthodes de vins effervescents.

  - id: wine-natural-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking]
    status: draft
    source_id: c07-0005
    review:
      fact_check: unsure
      sources: [known-fact]
    en:
      question: In loose cellar talk, what does “natural wine” usually point to?
      choices:
        - { text: "Any wine that spent two years in new barriques", correct: false }
        - { text: "Wine made with as little handling and addition as the maker will accept", correct: true }
        - { text: "A legal grade above grand cru in every country", correct: false }
        - { text: "Wine that must be sterile-filtered and heavily sulphited", correct: false }
      explanation: |
        People use **natural wine** for bottles made with **as little handling
        and addition as the maker will accept**. There is no single legal
        definition, so the label is informal — not a guaranteed recipe, and
        not the opposite of “all oak” or “all sulphur.”

  - id: wine-seeds-stems-tannin-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides the skins, which two parts of a grape bunch hold extractable tannin?
      choices:
        - { text: "Pulp and seeds", correct: false }
        - { text: "Seeds and stems", correct: true }
        - { text: "Stems and pulp", correct: false }
        - { text: "Bloom and pulp", correct: false }
      explanation: |
        Pulp is mostly water, sugar and acid, and the bloom is a thin wax. Stem
        tannin is why whole-bunch fermentation, common in parts of Burgundy, can
        add grip and a fresh, herbal edge.
    fr:
      question: Outre la pellicule, quelles parties de la grappe contiennent des tanins extractibles ?
      choices:
        - { text: "La pulpe et les pépins", correct: false }
        - { text: "Les pépins et la rafle", correct: true }
        - { text: "La rafle et la pulpe", correct: false }
        - { text: "La pruine et la pulpe", correct: false }
      explanation: |
        La pulpe est surtout faite d’eau, de sucre et d’acides, et la pruine
        n’est qu’une fine couche de cire. Les tanins de la rafle expliquent
        pourquoi la vendange entière, courante dans une partie de la Bourgogne,
        peut donner plus de structure et une touche fraîche, herbacée.

  - id: wine-seeds-bitter-oils-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why must crushing and pressing avoid breaking the grape seeds?
      choices:
        - { text: "Broken seeds release excess malic acid", correct: false }
        - { text: "Broken seeds release bitter oils", correct: true }
        - { text: "Broken seeds strip colour from the skins", correct: false }
        - { text: "Broken seeds cloud the juice with pectin", correct: false }
      explanation: |
        Crushed pips also give harsh, green tannin. Crusher rollers are spaced
        to split skins without smashing pips, and gentle pneumatic presses help
        for the same reason.
    fr:
      question: Pourquoi le foulage et le pressurage doivent-ils éviter d’écraser les pépins ?
      choices:
        - { text: "Les pépins brisés libèrent trop d’acide malique", correct: false }
        - { text: "Les pépins brisés libèrent des huiles amères", correct: true }
        - { text: "Les pépins brisés décolorent les pellicules", correct: false }
        - { text: "Les pépins brisés troublent le jus avec des pectines", correct: false }
      explanation: |
        Des pépins écrasés donnent aussi des tanins durs et verts. Les rouleaux
        du fouloir sont réglés pour éclater la baie sans broyer les pépins, et
        les pressoirs pneumatiques, plus doux, servent le même but.

  - id: wine-stems-hand-harvest-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does a cellar usually receive grapes with the stems still attached?
      choices:
        - { text: "By hand-picking whole bunches", correct: true }
        - { text: "By machine harvesting with on-board sorting", correct: false }
        - { text: "By machine harvesting with gentle shaker rods", correct: false }
        - { text: "By machine harvesting at night, with the fruit chilled", correct: false }
      explanation: |
        However gentle its shaking or sorting, a machine harvester knocks the
        berries off and leaves the stalks on the vine. Intact bunches are needed for whole-bunch
        fermentation of reds and for whole-bunch pressing, as in Champagne.
    fr:
      question: Comment le chai reçoit-il en général des raisins encore attachés à leur rafle ?
      choices:
        - { text: "Par une vendange manuelle en grappes entières", correct: true }
        - { text: "Par une vendange mécanique avec tri embarqué", correct: false }
        - { text: "Par une machine à secoueurs à battage doux", correct: false }
        - { text: "Par une vendange mécanique de nuit, raisin refroidi", correct: false }
      explanation: |
        Si doux que soient son battage ou son tri, une machine à vendanger
        détache les baies et laisse les rafles sur le cep. Les grappes entières servent à la
        vinification en vendange entière des rouges et au pressurage en grappes
        entières, comme en Champagne.

  - id: wine-skin-flavour-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where in the berry are many of the grape’s own flavour compounds concentrated?
      choices:
        - { text: "In the seeds", correct: false }
        - { text: "In the skin", correct: true }
        - { text: "Evenly through the pulp", correct: false }
        - { text: "In the stems", correct: false }
      explanation: |
        They sit in the skin and the thin layer just beneath it. This is why some white makers give the crushed grapes a few hours of
        skin contact before pressing: it draws out more aroma. Pulp is mostly
        water, sugar and acid.
    fr:
      question: Où se concentrent une grande partie des composés aromatiques propres au raisin ?
      choices:
        - { text: "Dans les pépins", correct: false }
        - { text: "Dans la pellicule", correct: true }
        - { text: "Répartis dans toute la pulpe", correct: false }
        - { text: "Dans la rafle", correct: false }
      explanation: |
        Ils se logent dans la pellicule et la fine couche juste en dessous.
        C’est pourquoi certains vinificateurs de blancs pratiquent quelques
        heures de macération pelliculaire avant le pressurage : elle extrait
        davantage d’arômes. La pulpe contient surtout de l’eau, du sucre et des
        acides.

  - id: wine-skin-tannin-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides flavour compounds and colour, which structural component does grape skin supply?
      choices:
        - { text: "Tannin", correct: true }
        - { text: "Tartaric acid", correct: false }
        - { text: "Sugar", correct: false }
        - { text: "Glycerol", correct: false }
      explanation: |
        Skin tannin gives a red its grip, which is why the length of maceration
        shapes structure. Acid and sugar sit mainly in the pulp, and glycerol
        is made by yeast during fermentation.
    fr:
      question: Outre les arômes et la couleur, quel élément de structure la pellicule du raisin apporte-t-elle ?
      choices:
        - { text: "Les tanins", correct: true }
        - { text: "L’acide tartrique", correct: false }
        - { text: "Le sucre", correct: false }
        - { text: "Le glycérol", correct: false }
      explanation: |
        Les tanins de la pellicule donnent son grain à un rouge : la durée de
        macération façonne donc sa structure. Acides et sucre se trouvent
        surtout dans la pulpe, et le glycérol est produit par les levures
        pendant la fermentation.

  - id: wine-skin-colour-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where do the colour compounds of a black grape mainly sit?
      choices:
        - { text: "In the pulp", correct: false }
        - { text: "In the skin", correct: true }
        - { text: "In the seeds", correct: false }
        - { text: "In the stems", correct: false }
      explanation: |
        Anthocyanins sit in the skin, so black grapes pressed quickly give
        almost colourless juice, the basis of Blanc de Noirs Champagne.
        Red-fleshed teinturier grapes such as Alicante Bouschet are the
        exception.
    fr:
      question: Où se trouvent principalement les composés colorants d’un raisin noir ?
      choices:
        - { text: "Dans la pulpe", correct: false }
        - { text: "Dans la pellicule", correct: true }
        - { text: "Dans les pépins", correct: false }
        - { text: "Dans la rafle", correct: false }
      explanation: |
        Les anthocyanes sont logées dans la pellicule : des raisins noirs
        pressés rapidement donnent un jus presque incolore, à la base des
        champagnes blanc de noirs. Les cépages teinturiers à pulpe rouge, comme
        l’Alicante Bouschet, font exception.

  - id: wine-tannin-class-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which term names a large family of astringent phenolic compounds found in grape skins, seeds, stems and oak?
      choices:
        - { text: "Anthocyanins", correct: false }
        - { text: "Tannins", correct: true }
        - { text: "Esters", correct: false }
        - { text: "Pyrazines", correct: false }
      explanation: |
        Tannins bind to saliva proteins, which is the drying grip felt on the
        gums. Anthocyanins are phenolics too, but they give colour; esters give
        fruity aromas and pyrazines green-pepper notes.
    fr:
      question: Quel terme désigne une grande famille de composés phénoliques astringents présents dans la pellicule, les pépins, la rafle et le chêne ?
      choices:
        - { text: "Les anthocyanes", correct: false }
        - { text: "Les tanins", correct: true }
        - { text: "Les esters", correct: false }
        - { text: "Les pyrazines", correct: false }
      explanation: |
        Les tanins se lient aux protéines de la salive, d’où la sensation
        d’assèchement sur les gencives. Les anthocyanes sont aussi des
        phénols, mais elles donnent la couleur ; les esters apportent des
        arômes fruités, les pyrazines des notes de poivron vert.

  - id: wine-tannin-veraison-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do grape tannins usually taste at véraison, when the berries have only just started to change colour?
      choices:
        - { text: "Soft and silky", correct: false }
        - { text: "Very bitter and astringent", correct: true }
        - { text: "Mild, with almost no grip", correct: false }
        - { text: "Ripe and mouth-coating", correct: false }
      explanation: |
        The weeks of ripening after véraison are what tame the harshness. Pick
        too early and the wine keeps that green, drying tannin, a classic fault
        of unripe vintages.
    fr:
      question: Quel goût ont en général les tanins du raisin à la véraison, quand les baies commencent tout juste à changer de couleur ?
      choices:
        - { text: "Souples et soyeux", correct: false }
        - { text: "Très amers et astringents", correct: true }
        - { text: "Discrets, presque sans grain", correct: false }
        - { text: "Mûrs et enrobants", correct: false }
      explanation: |
        Ce sont les semaines de maturation qui suivent la véraison qui
        adoucissent cette dureté. Vendangé trop tôt, le vin garde des tanins
        verts et asséchants, défaut classique des millésimes peu mûrs.

  - id: wine-tannin-ripen-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What happens to the bitterness and astringency of grape tannin as the berries ripen after véraison?
      choices:
        - { text: "Both rise until harvest", correct: false }
        - { text: "Both fall", correct: true }
        - { text: "Bitterness falls but astringency rises", correct: false }
        - { text: "Both stay the same until fermentation", correct: false }
      explanation: |
        Ripe tannin is still extracted in the cellar, but it feels finer and
        less harsh. Growers often chew seeds and skins to judge this tannin
        ripeness before setting a picking date.
    fr:
      question: Comment évoluent l’amertume et l’astringence des tanins du raisin pendant la maturation, après la véraison ?
      choices:
        - { text: "Elles augmentent jusqu’aux vendanges", correct: false }
        - { text: "Elles diminuent toutes les deux", correct: true }
        - { text: "L’amertume baisse mais l’astringence augmente", correct: false }
        - { text: "Elles restent stables jusqu’à la fermentation", correct: false }
      explanation: |
        Le chai extrait toujours des tanins, mais des tanins mûrs paraissent
        plus fins et moins durs. Beaucoup de vignerons goûtent pépins et
        pellicules pour juger cette maturité phénolique avant de fixer la date
        des vendanges.

  - id: wine-bloom-wax-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do winemakers call the waxy film on an intact grape berry?
      choices:
        - { text: "Flor", correct: false }
        - { text: "Bloom", correct: true }
        - { text: "Lees", correct: false }
        - { text: "Noble rot", correct: false }
      explanation: |
        Bloom is the dusty, whitish coating that rubs off on your fingers. Flor
        is a yeast film on sherry, lees are spent yeast sediment, and noble rot
        is the Botrytis fungus.
    fr:
      question: Comment appelle-t-on la fine couche cireuse qui recouvre une baie de raisin intacte ?
      choices:
        - { text: "Le voile de flor", correct: false }
        - { text: "La pruine", correct: true }
        - { text: "Les lies", correct: false }
        - { text: "La pourriture noble", correct: false }
      explanation: |
        La pruine est ce dépôt blanchâtre et poudreux qui reste sur les doigts.
        Le voile de flor est une couche de levures sur le xérès, les lies sont
        les levures mortes déposées, et la pourriture noble est due au
        champignon Botrytis.

  - id: wine-bloom-yeast-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape, fermentation]
    status: reviewed
    source_id: c07-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does the waxy bloom on grape skins matter to fermentation?
      choices:
        - { text: "It holds most of the grape’s tartaric acid", correct: false }
        - { text: "It carries yeasts that can start fermentation", correct: true }
        - { text: "It protects the juice from oxidation after crushing", correct: false }
        - { text: "It supplies the tannin extracted from the skins", correct: false }
      explanation: |
        These ambient yeasts allow a spontaneous ferment without a cultured
        strain. The bloom also carries other microbes, such as acetic bacteria,
        which is one reason many makers prefer to inoculate.
    fr:
      question: Pourquoi la pruine des pellicules compte-t-elle pour la fermentation ?
      choices:
        - { text: "Elle contient l’essentiel de l’acide tartrique", correct: false }
        - { text: "Elle porte des levures capables de lancer la fermentation", correct: true }
        - { text: "Elle protège le jus de l’oxydation après le foulage", correct: false }
        - { text: "Elle fournit les tanins extraits des pellicules", correct: false }
      explanation: |
        Ces levures indigènes permettent une fermentation spontanée, sans
        levurage. La pruine héberge aussi d’autres micro-organismes, comme les
        bactéries acétiques : c’est une des raisons pour lesquelles beaucoup de
        vinificateurs préfèrent levurer.

  - id: wine-pulp-trio-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which three components make up nearly all of grape pulp?
      choices:
        - { text: "Water, tannin and acid", correct: false }
        - { text: "Water, sugar and acid", correct: true }
        - { text: "Sugar, tannin and colour", correct: false }
        - { text: "Water, sugar and colour", correct: false }
      explanation: |
        Tannin and colour sit mainly in the skins and seeds, which is why white
        juice pressed off the skins carries little of either. The pulp’s sugar
        and acid set the wine’s future alcohol and freshness.
    fr:
      question: Quels trois constituants forment presque toute la pulpe du raisin ?
      choices:
        - { text: "Eau, tanins et acides", correct: false }
        - { text: "Eau, sucre et acides", correct: true }
        - { text: "Sucre, tanins et couleur", correct: false }
        - { text: "Eau, sucre et couleur", correct: false }
      explanation: |
        Tanins et couleur se trouvent surtout dans les pellicules et les pépins :
        un jus de blanc pressé hors pellicules en contient donc très peu. Le
        sucre et les acides de la pulpe fixent l’alcool et la fraîcheur du
        futur vin.

  - id: wine-pulp-water-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: By weight, what makes up most of the juicy flesh inside a grape berry?
      choices:
        - { text: "Sugar", correct: false }
        - { text: "Tartaric acid", correct: false }
        - { text: "Water", correct: true }
        - { text: "Tannin", correct: false }
      explanation: |
        Water usually makes up around 70–80% of the pulp. That is why heavy
        rain just before harvest can swell the berries and dilute their sugar
        and flavour. Sugar comes next; acids weigh far less.
    fr:
      question: En poids, quel constituant forme l’essentiel de la pulpe d’une baie de raisin ?
      choices:
        - { text: "Le sucre", correct: false }
        - { text: "L’acide tartrique", correct: false }
        - { text: "L’eau", correct: true }
        - { text: "Les tanins", correct: false }
      explanation: |
        L’eau représente en général 70 à 80 % de la pulpe. C’est pourquoi une
        forte pluie juste avant les vendanges peut gonfler les baies et diluer
        leur sucre et leurs arômes. Le sucre vient ensuite ; les acides pèsent
        bien moins.

  - id: wine-pulp-sugar-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After water, what is the next largest constituent of grape pulp?
      choices:
        - { text: "Sugar", correct: true }
        - { text: "Malic acid", correct: false }
        - { text: "Tartaric acid", correct: false }
        - { text: "Tannin", correct: false }
      explanation: |
        Glucose and fructose make up most of the rest of ripe pulp. Tartaric
        and malic acids matter for balance but weigh far less, and tannin sits
        mainly in skins and seeds.
    fr:
      question: Après l’eau, quel est le constituant le plus abondant de la pulpe du raisin ?
      choices:
        - { text: "Le sucre", correct: true }
        - { text: "L’acide malique", correct: false }
        - { text: "L’acide tartrique", correct: false }
        - { text: "Les tanins", correct: false }
      explanation: |
        Glucose et fructose constituent l’essentiel du reste d’une pulpe mûre.
        Les acides tartrique et malique comptent pour l’équilibre mais pèsent
        bien moins, et les tanins se logent surtout dans les pellicules et les
        pépins.

  - id: wine-pulp-tartaric-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which acid is usually the most abundant in grape pulp?
      choices:
        - { text: "Malic acid", correct: false }
        - { text: "Tartaric acid", correct: true }
        - { text: "Citric acid", correct: false }
        - { text: "Lactic acid", correct: false }
      explanation: |
        Tartaric acid is unusual among fruits: grapes are one of the few that
        hold it in quantity. Malic acid comes second and falls during ripening;
        citric is minor, and lactic acid only appears through bacteria.
    fr:
      question: Quel acide est en général le plus abondant dans la pulpe du raisin ?
      choices:
        - { text: "L’acide malique", correct: false }
        - { text: "L’acide tartrique", correct: true }
        - { text: "L’acide citrique", correct: false }
        - { text: "L’acide lactique", correct: false }
      explanation: |
        L’acide tartrique est rare dans les fruits : le raisin est l’un des
        seuls à en contenir autant. L’acide malique vient en second et baisse
        pendant la maturation ; le citrique est minoritaire, et le lactique
        n’apparaît que sous l’action de bactéries.

  - id: wine-pulp-malic-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape]
    status: reviewed
    source_id: c07-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After tartaric acid, which acid is usually the next most abundant in grape pulp?
      choices:
        - { text: "Citric acid", correct: false }
        - { text: "Malic acid", correct: true }
        - { text: "Lactic acid", correct: false }
        - { text: "Acetic acid", correct: false }
      explanation: |
        Malic acid is highest in unripe grapes and falls as they ripen, faster
        in warm climates. Bacteria can later turn it into softer lactic acid;
        acetic acid is a spoilage product, not a grape acid.
    fr:
      question: Après l’acide tartrique, quel acide est en général le plus abondant dans la pulpe du raisin ?
      choices:
        - { text: "L’acide citrique", correct: false }
        - { text: "L’acide malique", correct: true }
        - { text: "L’acide lactique", correct: false }
        - { text: "L’acide acétique", correct: false }
      explanation: |
        L’acide malique est à son maximum dans le raisin vert et baisse pendant
        la maturation, plus vite en climat chaud. Des bactéries peuvent ensuite
        le transformer en acide lactique, plus doux ; l’acide acétique est un
        produit d’altération, pas un acide du raisin.

  - id: wine-oxygen-react-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In juice and wine, what does oxygen mainly react with?
      choices:
        - { text: "Tartaric acid and minerals", correct: false }
        - { text: "Phenolics and aroma compounds", correct: true }
        - { text: "Water and glycerol", correct: false }
        - { text: "Proteins and tartrates", correct: false }
      explanation: |
        Oxidised phenolics are why freshly pressed juice can brown within
        minutes, like a cut apple, and fruity aromas fade as they react too.
        White wines, with little tannin to absorb oxygen, are often the more
        sensitive.
    fr:
      question: Dans le moût comme dans le vin, avec quoi l’oxygène réagit-il surtout ?
      choices:
        - { text: "L’acide tartrique et les minéraux", correct: false }
        - { text: "Les composés phénoliques et aromatiques", correct: true }
        - { text: "L’eau et le glycérol", correct: false }
        - { text: "Les protéines et les tartrates", correct: false }
      explanation: |
        L’oxydation des composés phénoliques explique qu’un jus fraîchement
        pressé brunisse en quelques minutes, comme une pomme coupée ; les arômes
        fruités s’estompent aussi en réagissant. Les blancs, peu riches en
        tanins capables de fixer l’oxygène, sont souvent les plus sensibles.

  - id: wine-oxidation-define-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which reaction is meant when a cellar talks about a wine oxidising?
      choices:
        - { text: "Yeast using oxygen to multiply early in fermentation", correct: false }
        - { text: "Oxygen reacting with juice or with parts of the wine", correct: true }
        - { text: "Dissolved oxygen escaping as the wine warms up", correct: false }
        - { text: "Inert gas pushing oxygen out of a tank", correct: false }
      explanation: |
        Its signs are browning and a loss of fresh fruit, then nutty or bruised
        apple notes. Yeast taking up oxygen is growth, not oxidation, and
        oxygen leaving the wine or being flushed out is a physical change.
    fr:
      question: De quelle réaction parle-t-on quand on dit qu’un vin s’oxyde ?
      choices:
        - { text: "Les levures consomment de l’oxygène pour se multiplier", correct: false }
        - { text: "L’oxygène réagit avec le moût ou avec des composants du vin", correct: true }
        - { text: "L’oxygène dissous s’échappe quand le vin se réchauffe", correct: false }
        - { text: "Un gaz inerte chasse l’oxygène d’une cuve", correct: false }
      explanation: |
        L’oxydation se voit au brunissement et à la perte du fruit frais, puis
        à des notes de noix ou de pomme blette. Des levures qui consomment de
        l’oxygène se multiplient sans oxyder le vin, et l’oxygène qui s’échappe
        ou qu’on chasse relève d’un phénomène physique.

  - id: wine-oxidation-fresh-fruit-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: If the aim is to keep a wine smelling of its own primary fruit, what must the cellar most carefully avoid?
      choices:
        - { text: "Tartrate crystals forming", correct: false }
        - { text: "Oxidation of the wine", correct: true }
        - { text: "A protein haze forming", correct: false }
        - { text: "Loss of dissolved CO₂", correct: false }
      explanation: |
        Oxygen breaks down volatile fruity esters and thiols, so aromas turn
        flat and the colour starts to brown. Tartrate crystals and protein haze
        are visual faults that leave the aroma intact, and losing a little CO₂
        dulls the sense of freshness without stripping the fruit.
    fr:
      question: Pour qu’un vin garde les arômes de fruit primaires de son cépage, que le chai doit-il éviter avant tout ?
      choices:
        - { text: "La formation de cristaux de tartre", correct: false }
        - { text: "L’oxydation du vin", correct: true }
        - { text: "L’apparition d’une casse protéique", correct: false }
        - { text: "La perte du CO₂ dissous", correct: false }
      explanation: |
        L’oxygène dégrade les esters et les thiols fruités, volatils : le nez
        s’aplatit et la couleur commence à brunir. Les cristaux de tartre et la
        casse protéique sont des défauts visuels qui épargnent les arômes, et
        perdre un peu de CO₂ atténue l’impression de fraîcheur sans effacer le
        fruit.

  - id: wine-oxidation-so2-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen, so2]
    status: reviewed
    source_id: c07-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which winery addition is most widely used as an antioxidant?
      choices:
        - { text: "Tartaric acid", correct: false }
        - { text: "Sulphur dioxide (SO₂)", correct: true }
        - { text: "Potassium sorbate", correct: false }
        - { text: "Bentonite", correct: false }
      explanation: |
        SO₂ is also antimicrobial, which is why it is used at almost every
        stage. Tartaric acid adjusts acidity, sorbate guards sweet wines against
        refermentation, and bentonite is a fining agent for proteins.
    fr:
      question: Quel intrant est le plus utilisé en cave comme antioxydant ?
      choices:
        - { text: "L’acide tartrique", correct: false }
        - { text: "Le dioxyde de soufre (SO₂)", correct: true }
        - { text: "Le sorbate de potassium", correct: false }
        - { text: "La bentonite", correct: false }
      explanation: |
        Le SO₂ est aussi antimicrobien, d’où son emploi à presque toutes les
        étapes. L’acide tartrique sert à acidifier, le sorbate protège les vins
        doux d’une refermentation, et la bentonite est une colle contre les
        protéines.

  - id: wine-oxidation-limit-air-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides adding an antioxidant, what is the main way makers reduce the risk of oxidation?
      choices:
        - { text: "Fermenting warmer and faster", correct: false }
        - { text: "Limiting contact with air", correct: true }
        - { text: "Racking the wine often", correct: false }
        - { text: "Maturing in small oak barrels", correct: false }
      explanation: |
        In practice: full vessels, quick transfers and a cover of inert gas.
        Frequent racking and small barrels both let in more air, and warmth
        speeds up oxidation rather than slowing it.
    fr:
      question: Outre l’ajout d’un antioxydant, comment les vinificateurs limitent-ils surtout le risque d’oxydation ?
      choices:
        - { text: "En fermentant plus chaud et plus vite", correct: false }
        - { text: "En limitant le contact avec l’air", correct: true }
        - { text: "En soutirant souvent le vin", correct: false }
        - { text: "En élevant le vin en petites barriques", correct: false }
      explanation: |
        Concrètement : contenants pleins, transferts rapides et protection sous
        gaz inerte. Les soutirages fréquents et les petits fûts apportent plus
        d’air, et la chaleur accélère l’oxydation au lieu de la freiner.

  - id: wine-night-pick-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why might a grower harvest grapes at night?
      choices:
        - { text: "The berries gain sugar overnight", correct: false }
        - { text: "Cooler fruit oxidises more slowly", correct: true }
        - { text: "Birds and wasps leave the vines alone at night", correct: false }
        - { text: "Dew rinses dust off the bunches", correct: false }
      explanation: |
        Night picking, often by machine, is common in hot regions such as
        inland Australia. Cool fruit also needs less refrigeration and is less
        likely to start fermenting before it reaches the winery.
    fr:
      question: Pourquoi un vigneron peut-il choisir de vendanger de nuit ?
      choices:
        - { text: "Les baies gagnent du sucre pendant la nuit", correct: false }
        - { text: "Un raisin plus froid s’oxyde plus lentement", correct: true }
        - { text: "Oiseaux et guêpes délaissent les vignes la nuit", correct: false }
        - { text: "La rosée débarrasse les grappes de la poussière", correct: false }
      explanation: |
        La vendange de nuit, souvent mécanique, est courante dans les régions
        chaudes comme l’intérieur de l’Australie. Un raisin cueilli au frais
        demande aussi moins de froid au chai et risque moins de commencer à
        fermenter avant d’y arriver.

  - id: wine-inert-gas-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can closed winery equipment be prepared so that incoming grapes and juice meet almost no air?
      choices:
        - { text: "Flush it with carbon dioxide or nitrogen", correct: true }
        - { text: "Rinse it with an SO₂ solution", correct: false }
        - { text: "Chill it well before use", correct: false }
        - { text: "Flush it with filtered, sterile air", correct: false }
      explanation: |
        The inert gas pushes the air out of presses, pipes and tanks; dry ice
        is a common source of CO₂. An SO₂ rinse sanitises and chilling slows
        reactions, but neither removes the air.
    fr:
      question: Comment préparer un matériel fermé pour que la vendange et le moût n’entrent presque pas en contact avec l’air ?
      choices:
        - { text: "Le purger au gaz carbonique ou à l’azote", correct: true }
        - { text: "Le rincer avec une solution de SO₂", correct: false }
        - { text: "Le refroidir avant usage", correct: false }
        - { text: "Le purger à l’air filtré et stérile", correct: false }
      explanation: |
        Le gaz inerte chasse l’air des pressoirs, tuyaux et cuves ; la neige
        carbonique est une source courante de CO₂. Un rinçage au SO₂ assainit
        et le froid ralentit les réactions, mais aucun des deux n’élimine l’air.

  - id: wine-protective-name-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What name is given to handling juice and wine so that air is excluded as far as possible?
      choices:
        - { text: "Oxidative winemaking", correct: false }
        - { text: "Protective winemaking", correct: true }
        - { text: "Hyperoxidation", correct: false }
        - { text: "Micro-oxygenation", correct: false }
      explanation: |
        Protective, or anaerobic, handling suits aromatic whites such as Sauvignon Blanc or Riesling. The other
        three let oxygen in on purpose: oxidative handling for style,
        hyperoxidation of juice, and controlled micro-doses of oxygen for reds.
    fr:
      question: Comment appelle-t-on le fait de travailler moût et vin à l’abri de l’air autant que possible ?
      choices:
        - { text: "La vinification oxydative", correct: false }
        - { text: "La vinification réductrice", correct: true }
        - { text: "L’hyperoxygénation des moûts", correct: false }
        - { text: "La micro-oxygénation", correct: false }
      explanation: |
        Ce travail à l’abri de l’air convient aux blancs aromatiques comme le Sauvignon Blanc ou le
        Riesling. Les trois autres font entrer l’oxygène volontairement : style
        oxydatif, hyperoxygénation du moût, ou petites doses contrôlées
        d’oxygène sur les rouges.

  - id: wine-protective-critique-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the usual criticism of keeping juice and wine almost entirely away from oxygen?
      choices:
        - { text: "The wines develop high volatile acidity", correct: false }
        - { text: "The wines can taste simple and lack complexity", correct: true }
        - { text: "The wines lose their primary fruit quickly", correct: false }
        - { text: "The wines need years before they are drinkable", correct: false }
      explanation: |
        Some makers deliberately let a little air in, for example during barrel
        fermentation and lees ageing of Chardonnay, to build texture and savoury
        complexity that a fully protected wine may lack.
    fr:
      question: Quel reproche fait-on souvent à une vinification qui tient moût et vin presque totalement à l’abri de l’oxygène ?
      choices:
        - { text: "Les vins développent une acidité volatile élevée", correct: false }
        - { text: "Les vins peuvent paraître simples et peu complexes", correct: true }
        - { text: "Les vins perdent vite leur fruit primaire", correct: false }
        - { text: "Les vins demandent des années avant d’être prêts", correct: false }
      explanation: |
        Certains vinificateurs laissent entrer un peu d’air à dessein, par
        exemple pendant la fermentation et l’élevage sur lies d’un Chardonnay en
        fût, pour gagner en texture et en complexité, ce qui manque parfois à un
        vin entièrement protégé.

  - id: wine-protective-mature-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How much does oxygen during maturation usually benefit a wine made protectively, with almost no air contact?
      choices:
        - { text: "A great deal, as for most reds", correct: false }
        - { text: "Rarely, if at all", correct: true }
        - { text: "Moderately, through a few months in old oak", correct: false }
        - { text: "Significantly, through micro-oxygenation", correct: false }
      explanation: |
        These wines are built around fresh primary fruit, so they usually stay
        in full inert tanks and are bottled young. A Marlborough Sauvignon
        Blanc, for instance, would lose its pungent aromas in leaky wood.
    fr:
      question: Dans quelle mesure l’oxygène apporté pendant l’élevage profite-t-il d’ordinaire à un vin vinifié à l’abri de l’air ?
      choices:
        - { text: "Beaucoup, comme pour la plupart des rouges", correct: false }
        - { text: "Rarement, voire jamais", correct: true }
        - { text: "Modérément, après quelques mois en fût ancien", correct: false }
        - { text: "Nettement, grâce à la micro-oxygénation", correct: false }
      explanation: |
        Ces vins misent sur le fruit primaire : ils restent en général en cuves
        inertes pleines et sont mis en bouteille jeunes. Un Sauvignon Blanc de
        Marlborough, par exemple, perdrait ses arômes intenses dans un bois qui
        laisse passer l’air.

  - id: wine-inert-kept-full-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, vessels, oxygen]
    status: reviewed
    source_id: c07-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are wines made protectively, with almost no air contact, usually stored afterwards?
      choices:
        - { text: "In old oak barrels, topped up regularly", correct: false }
        - { text: "In inert vessels kept completely full", correct: true }
        - { text: "In new oak barriques", correct: false }
        - { text: "In large old oak casks", correct: false }
      explanation: |
        A full, airtight vessel leaves no headspace, so the wine sees no air
        until bottling. Even topped-up barrels, old or new, let a little oxygen
        through the wood and the bung.
    fr:
      question: Comment conserve-t-on en général un vin vinifié à l’abri de l’air, une fois la fermentation finie ?
      choices:
        - { text: "En fûts anciens, ouillés régulièrement", correct: false }
        - { text: "En contenants inertes maintenus pleins", correct: true }
        - { text: "En barriques neuves", correct: false }
        - { text: "En grands foudres anciens", correct: false }
      explanation: |
        Un contenant étanche et plein ne laisse aucun creux : le vin ne voit pas
        l’air jusqu’à la mise en bouteille. Même ouillés, les fûts, anciens ou
        neufs, laissent passer un peu d’oxygène par le bois et la bonde.

  - id: wine-inert-materials-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, vessels]
    status: reviewed
    source_id: c07-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What are inert, airtight maturation vats usually made from?
      choices:
        - { text: "Large old oak", correct: false }
        - { text: "Stainless steel or lined concrete", correct: true }
        - { text: "Unlined clay", correct: false }
        - { text: "Small new oak", correct: false }
      explanation: |
        Concrete is usually lined with epoxy resin to make it inert and easy to
        clean. Oak of any size lets some oxygen through, and unlined clay
        amphorae are slightly porous too.
    fr:
      question: En quoi sont faites d’ordinaire les cuves d’élevage inertes et étanches à l’air ?
      choices:
        - { text: "En grands foudres anciens", correct: false }
        - { text: "En inox ou en béton revêtu", correct: true }
        - { text: "En terre cuite brute", correct: false }
        - { text: "En barriques neuves", correct: false }
      explanation: |
        Le béton reçoit en général un revêtement époxy qui le rend inerte et
        facile à nettoyer. Le chêne, quelle que soit la taille du contenant,
        laisse passer un peu d’oxygène, et les amphores en terre cuite non
        revêtue sont légèrement poreuses.

  - id: wine-oak-oxidative-store-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, oxygen]
    status: reviewed
    source_id: c07-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where are wines that are meant to see some air during maturation usually kept?
      choices:
        - { text: "In wooden vessels, usually oak", correct: true }
        - { text: "In epoxy-lined concrete vats", correct: false }
        - { text: "In stainless steel tanks", correct: false }
        - { text: "In glass demijohns", correct: false }
      explanation: |
        Wood lets a slow trickle of oxygen in through its staves and bung,
        which is part of why many reds and rich whites are aged in barrel. Steel,
        lined concrete and glass are chosen when the aim is to keep air out.
    fr:
      question: Où conserve-t-on en général les vins censés recevoir un peu d’air pendant l’élevage ?
      choices:
        - { text: "En fûts de chêne", correct: true }
        - { text: "En cuves béton revêtues d’époxy", correct: false }
        - { text: "En cuves inox", correct: false }
        - { text: "En dames-jeannes de verre", correct: false }
      explanation: |
        Le bois laisse entrer lentement un peu d’oxygène par les douelles et la
        bonde, d’où l’élevage en fût de nombreux rouges et blancs amples. Inox,
        béton revêtu et verre servent au contraire à tenir l’air à distance.

  - id: wine-oak-not-airtight-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, oxygen]
    status: reviewed
    source_id: c07-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which pair describes oak as a wine vessel?
      choices:
        - { text: "Airtight, but not watertight", correct: false }
        - { text: "Watertight, but not airtight", correct: true }
        - { text: "Both watertight and airtight", correct: false }
        - { text: "Neither watertight nor airtight", correct: false }
      explanation: |
        Well-made staves hold the wine in, yet a little oxygen still passes
        through the wood and around the bung. Evaporation through the wood is
        also why barrels need regular topping up.
    fr:
      question: Quel couple de propriétés décrit le chêne comme contenant à vin ?
      choices:
        - { text: "Étanche à l’air, mais pas au liquide", correct: false }
        - { text: "Étanche au liquide, mais pas à l’air", correct: true }
        - { text: "Étanche au liquide et à l’air", correct: false }
        - { text: "Ni étanche au liquide, ni étanche à l’air", correct: false }
      explanation: |
        Des douelles bien ajustées retiennent le vin, mais un peu d’oxygène
        traverse le bois et passe par la bonde. L’évaporation à travers le bois
        explique aussi qu’il faille ouiller régulièrement les fûts.

  - id: wine-oak-soften-tannin-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, oxygen]
    status: reviewed
    source_id: c07-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can the slow ingress of oxygen through oak help a red wine?
      choices:
        - { text: "It adds vanilla and toast aromas", correct: false }
        - { text: "It helps soften the tannins", correct: true }
        - { text: "It raises the wine’s acidity", correct: false }
        - { text: "It boosts fresh primary fruit", correct: false }
      explanation: |
        Small doses of oxygen help tannins link into larger, smoother-feeling
        molecules and also stabilise colour. Vanilla and toast come from the
        wood itself, not from the oxygen it lets through.
    fr:
      question: En quoi la lente entrée d’oxygène à travers le chêne peut-elle servir un vin rouge ?
      choices:
        - { text: "Elle apporte des arômes de vanille et de grillé", correct: false }
        - { text: "Elle aide à assouplir les tanins", correct: true }
        - { text: "Elle augmente l’acidité du vin", correct: false }
        - { text: "Elle renforce le fruit primaire", correct: false }
      explanation: |
        De petites doses d’oxygène aident les tanins à se lier en molécules
        plus grosses, perçues comme plus souples, et stabilisent la couleur.
        La vanille et le grillé viennent du bois lui-même, pas de l’oxygène
        qu’il laisse passer.

  - id: wine-oak-flavour-complexity-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, oxygen]
    status: reviewed
    source_id: c07-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides softening tannin, what can the slow entry of oxygen through an oak barrel do to a wine?"
      choices:
        - { text: "Add flavour complexity as the wine develops", correct: true }
        - { text: "Keep the primary fruit aromas fresh and unchanged", correct: false }
        - { text: "Raise the wine’s acidity", correct: false }
        - { text: "Make the wine taste noticeably sweeter", correct: false }
      explanation: |
        Small, steady doses of oxygen let tannin and colour compounds react
        and new developed aromas form, so the wine gains layers instead of
        staying a simple fruit wine. Primary fruit is better kept by
        excluding air, in steel.
    fr:
      question: "Outre l’assouplissement des tanins, qu’apporte au vin la lente entrée d’oxygène à travers un fût de chêne ?"
      choices:
        - { text: "Davantage de complexité aromatique au fil de l’élevage", correct: true }
        - { text: "Des arômes de fruit primaire gardés frais et intacts", correct: false }
        - { text: "Une acidité plus élevée", correct: false }
        - { text: "Une impression nettement plus sucrée", correct: false }
      explanation: |
        De petites doses régulières d’oxygène font réagir tanins et
        pigments et laissent naître des arômes d’évolution : le vin gagne
        en couches au lieu de rester un simple vin de fruit. Pour garder
        le fruit primaire, on protège plutôt le vin de l’air, en cuve inox.

  - id: wine-oxid-fruit-fade-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "During planned oxidative maturation, what happens to the wine’s fresh fruit aromas?"
      choices:
        - { text: "They become more intense over time", correct: false }
        - { text: "They gradually fade", correct: true }
        - { text: "They stay unchanged until bottling", correct: false }
        - { text: "They turn green and herbaceous", correct: false }
      explanation: |
        Oxygen slowly breaks down the compounds behind fresh fruit, and
        developed notes such as nuts, dried fruit or leather take their
        place. That is why an oloroso tastes far less of fresh grape than a
        protected, steel-fermented white.
    fr:
      question: "Pendant un élevage oxydatif voulu, que deviennent les arômes de fruit frais du vin ?"
      choices:
        - { text: "Ils gagnent en intensité avec le temps", correct: false }
        - { text: "Ils s’estompent peu à peu", correct: true }
        - { text: "Ils restent intacts jusqu’à la mise en bouteille", correct: false }
        - { text: "Ils virent au végétal et à l’herbacé", correct: false }
      explanation: |
        L’oxygène dégrade lentement les composés du fruit frais ; des notes
        d’évolution (fruits secs, noix, cuir) prennent le relais. C’est
        pourquoi un oloroso sent bien moins le raisin frais qu’un blanc
        vinifié en cuve inox, à l’abri de l’air.

  - id: wine-oxid-leather-earth-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "As fresh fruit fades in a wine matured with oxygen, which developed notes often appear?"
      choices:
        - { text: "Citrus zest and green apple", correct: false }
        - { text: "Leather and earth", correct: true }
        - { text: "Grass and green bell pepper", correct: false }
        - { text: "Banana and bubblegum", correct: false }
      explanation: |
        Leather and earth are tertiary notes that build slowly with age and
        air. Citrus, green apple, grass and pepper are primary aromas, and
        banana or bubblegum come from fermentation — all of them are what
        oxygen wears away, not what it creates.
    fr:
      question: "Quand le fruit frais s’estompe dans un vin élevé au contact de l’oxygène, quelles notes d’évolution apparaissent souvent ?"
      choices:
        - { text: "Zeste d’agrumes et pomme verte", correct: false }
        - { text: "Cuir et terre", correct: true }
        - { text: "Herbe coupée et poivron vert", correct: false }
        - { text: "Banane et bonbon anglais", correct: false }
      explanation: |
        Le cuir et la terre sont des arômes tertiaires qui se construisent
        lentement avec le temps et l’air. Agrumes, pomme verte, herbe et
        poivron sont des arômes primaires, banane et bonbon anglais viennent
        de la fermentation : l’oxygène les efface plutôt qu’il ne les crée.

  - id: wine-oxid-red-colour-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does oxidation typically change the colour of a red wine?"
      choices:
        - { text: "Paler, with a brown tinge", correct: true }
        - { text: "Deeper, with a purple tinge", correct: false }
        - { text: "Paler, with a purple tinge", correct: false }
        - { text: "Deeper, with an orange tinge", correct: false }
      explanation: |
        Red pigments lose intensity and drop out as they react, so the wine
        moves from purple or ruby towards garnet and tawny. Whites go the
        other way: they deepen towards gold and amber.
    fr:
      question: "Comment l’oxydation modifie-t-elle en général la couleur d’un vin rouge ?"
      choices:
        - { text: "Plus pâle, avec une nuance brune", correct: true }
        - { text: "Plus soutenue, avec une nuance violacée", correct: false }
        - { text: "Plus pâle, avec une nuance violacée", correct: false }
        - { text: "Plus soutenue, avec une nuance orangée", correct: false }
      explanation: |
        Les pigments rouges perdent de leur intensité et se déposent en
        réagissant : la robe passe du pourpre ou du rubis au grenat, puis au
        tuilé. Les blancs évoluent en sens inverse et foncent vers l’or et
        l’ambre.

  - id: wine-oxid-white-colour-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does oxidation typically change the colour of a white wine?"
      choices:
        - { text: "Paler, with a green tinge", correct: false }
        - { text: "Deeper, with an orange tinge", correct: true }
        - { text: "Paler, with a brown tinge", correct: false }
        - { text: "No visible change in colour", correct: false }
      explanation: |
        An oxidised white moves from lemon to gold and then amber, as its
        phenolic compounds brown. Reds move the opposite way, losing depth
        as they turn garnet and tawny.
    fr:
      question: "Comment l’oxydation modifie-t-elle en général la couleur d’un vin blanc ?"
      choices:
        - { text: "Plus pâle, avec des reflets verts", correct: false }
        - { text: "Plus soutenue, avec une nuance orangée", correct: true }
        - { text: "Plus pâle, avec une nuance brune", correct: false }
        - { text: "Aucun changement de couleur visible", correct: false }
      explanation: |
        Un blanc oxydé passe du citron à l’or, puis à l’ambre, à mesure que
        ses composés phénoliques brunissent. Les rouges évoluent à
        l’inverse : ils perdent de l’intensité en virant au grenat et au
        tuilé.

  - id: wine-oxid-two-factors-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen, oak]
    status: reviewed
    source_id: c07-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When a wine is meant to take up air in wood, which pair of factors most sets how much oxygen it receives?"
      choices:
        - { text: "Toast level and oak species", correct: false }
        - { text: "Vessel size and time in the vessel", correct: true }
        - { text: "Grape variety and vintage", correct: false }
        - { text: "Yeast strain and fermentation temperature", correct: false }
      explanation: |
        A smaller vessel puts more wood in contact with each litre, and a
        longer stay adds up the oxygen over time. Fill level is a third
        lever: a cask left with headspace lets in even more air.
    fr:
      question: "Pour un vin qu’on veut exposer à l’air pendant un élevage sous bois, quel couple de facteurs règle surtout la quantité d’oxygène reçue ?"
      choices:
        - { text: "Le niveau de chauffe et l’espèce de chêne", correct: false }
        - { text: "La taille du contenant et la durée passée dedans", correct: true }
        - { text: "Le cépage et le millésime", correct: false }
        - { text: "La souche de levure et la température de fermentation", correct: false }
      explanation: |
        Plus le contenant est petit, plus chaque litre est au contact du
        bois ; plus le séjour est long, plus l’oxygène s’accumule. Le niveau
        de remplissage est un troisième levier : un fût en vidange laisse
        entrer encore plus d’air.

  - id: wine-small-barrel-oxid-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, oxygen]
    status: reviewed
    source_id: c07-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with a large oak vat, how oxidising is a small barrel of the same wood?"
      choices:
        - { text: "Less oxidising", correct: false }
        - { text: "More oxidising", correct: true }
        - { text: "Equally oxidising, since the wood is the same", correct: false }
        - { text: "Less oxidising, unless the barrel is new", correct: false }
      explanation: |
        A 225 L barrique gives a far stronger dose of air (and oak flavour)
        than a foudre of several thousand litres. That is why producers who
        want little oak influence, such as traditional Barolo houses, mature
        in large old botti.
    fr:
      question: "Par rapport à un grand foudre de chêne, une petite barrique du même bois est-elle plus ou moins oxydante ?"
      choices:
        - { text: "Moins oxydante", correct: false }
        - { text: "Plus oxydante", correct: true }
        - { text: "Aussi oxydante, puisque le bois est le même", correct: false }
        - { text: "Moins oxydante, sauf si la barrique est neuve", correct: false }
      explanation: |
        Une barrique de 225 L apporte bien plus d’air (et de boisé) qu’un
        foudre de plusieurs milliers de litres. C’est pourquoi les
        producteurs qui veulent peu d’empreinte boisée, comme les maisons
        traditionnelles de Barolo, élèvent en grandes botti anciennes.

  - id: wine-small-barrel-surface-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, oxygen]
    status: reviewed
    source_id: c07-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a smaller barrel oxidise wine more than a larger one?"
      choices:
        - { text: "Its staves are usually toasted more heavily", correct: false }
        - { text: "It has more wood surface per litre of wine", correct: true }
        - { text: "It is usually made from a more porous oak species", correct: false }
        - { text: "It is usually topped up less often", correct: false }
      explanation: |
        Halving a vessel’s volume does not halve its surface, so each litre
        in a small barrel touches more wood. More oxygen reaches the wine,
        and more oak extract with it.
    fr:
      question: "Pourquoi un petit fût oxyde-t-il davantage le vin qu’un grand ?"
      choices:
        - { text: "Ses douelles sont en général plus chauffées", correct: false }
        - { text: "Il offre plus de surface de bois par litre de vin", correct: true }
        - { text: "Il est en général fait d’une espèce de chêne plus poreuse", correct: false }
        - { text: "Il est en général ouillé moins souvent", correct: false }
      explanation: |
        Diviser le volume d’un contenant par deux ne divise pas sa surface
        par deux : dans un petit fût, chaque litre touche davantage de bois.
        Le vin reçoit plus d’oxygène, et plus d’extraits de chêne avec lui.

  - id: wine-barrique-225-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: reviewed
    source_id: c07-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How many litres does a Bordeaux barrique hold?"
      choices:
        - { text: "205 L", correct: false }
        - { text: "225 L", correct: true }
        - { text: "228 L", correct: false }
        - { text: "300 L", correct: false }
      explanation: |
        The Bordeaux barrique is the 225 L reference barrel. Burgundy’s
        pièce holds 228 L, and a hogshead around 300 L — close enough to
        confuse, so learn the three together.
    fr:
      question: "Quelle est la contenance d’une barrique bordelaise ?"
      choices:
        - { text: "205 L", correct: false }
        - { text: "225 L", correct: true }
        - { text: "228 L", correct: false }
        - { text: "300 L", correct: false }
      explanation: |
        La barrique bordelaise est le fût de référence de 225 L. La pièce
        bourguignonne contient 228 L et le hogshead environ 300 L : des
        volumes proches, à retenir ensemble.

  - id: wine-barrique-two-years-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: draft
    source_id: c07-0033
    review:
      fact_check: unsure
      sources: [known-fact]
    en:
      question: Beyond which stretch are wines seldom left sitting in a barrique?
      choices:
        - { text: "Two days", correct: false }
        - { text: "Two years", correct: true }
        - { text: "A legal minimum of ten years in every region", correct: false }
        - { text: "One hour, or the wine is illegal", correct: false }
      explanation: |
        A 225 L barrique is a strong oak and air dose, so wines are
        seldom left in one beyond **two years**. That is a working
        rule of thumb for small new oak, not a statute — some
        oxidative styles stay longer in older wood, and many wines
        leave the barrique much sooner.

  - id: wine-ullage-oxid-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen, oak]
    status: reviewed
    source_id: c07-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides using a small cask, how can a cellar give a barrel-aged wine even more air?"
      choices:
        - { text: "By topping the barrel up more often", correct: false }
        - { text: "By leaving the barrel not completely full", correct: true }
        - { text: "By flushing the headspace with inert gas", correct: false }
        - { text: "By adding sulphur dioxide more often", correct: false }
      explanation: |
        The gap above the wine (ullage) leaves a wide surface of wine
        exposed to air. Topping up, inert gas and SO₂ all work the other
        way, protecting the wine from oxygen.
    fr:
      question: "Outre le choix d’un petit fût, comment une cave peut-elle donner encore plus d’air à un vin élevé en barrique ?"
      choices:
        - { text: "En ouillant le fût plus souvent", correct: false }
        - { text: "En ne remplissant pas complètement le fût", correct: true }
        - { text: "En remplissant l’espace vide de gaz inerte", correct: false }
        - { text: "En sulfitant plus souvent", correct: false }
      explanation: |
        Le creux laissé au-dessus du vin (vidange) expose une large surface
        de vin à l’air. L’ouillage, le gaz inerte et le SO₂ jouent tous en
        sens inverse : ils protègent le vin de l’oxygène.

  - id: wine-ullage-styles-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which three styles are often left with headspace in cask so air can work on them?"
      choices:
        - { text: "Muscadet, Albariño and steel-tank Riesling", correct: false }
        - { text: "Oloroso Sherry, Rutherglen Muscat and tawny Port", correct: true }
        - { text: "Beaujolais Nouveau, Moscato d’Asti and Prosecco", correct: false }
        - { text: "Champagne, Cava and crémant aged on lees in bottle", correct: false }
      explanation: |
        These are deliberately oxidative wines: oloroso ages without a
        protective flor, tawny Port spends years in small casks, and
        Rutherglen Muscat matures in old barrels, often in hot sheds. The
        other sets are prized for fresh fruit or for lees ageing sealed in
        bottle.
    fr:
      question: "Quels trois styles laisse-t-on souvent en vidange dans le fût pour que l’air agisse ?"
      choices:
        - { text: "Muscadet, Albariño et Riesling vinifié en cuve inox", correct: false }
        - { text: "Xérès oloroso, Rutherglen Muscat et Porto tawny", correct: true }
        - { text: "Beaujolais Nouveau, Moscato d’Asti et Prosecco", correct: false }
        - { text: "Champagne, Cava et crémant élevés sur lies en bouteille", correct: false }
      explanation: |
        Ce sont des vins oxydatifs par choix : l’oloroso vieillit sans
        voile de flor protecteur, le tawny passe des années en petits fûts
        et le Rutherglen Muscat s’élève en vieux fûts, souvent sous des
        hangars chauds. Les autres séries misent sur le fruit frais ou sur
        un élevage sur lies, en bouteille fermée.

  - id: wine-oxidative-nuts-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which flavour set do wines take on when they are aged on purpose with plenty of air?"
      choices:
        - { text: "Caramel, toffee and nuts", correct: true }
        - { text: "Toast, vanilla and clove", correct: false }
        - { text: "Brioche, biscuit and bread", correct: false }
        - { text: "Citrus, green apple and grass", correct: false }
      explanation: |
        Long, deliberate oxidation builds the caramel and walnut register of
        oloroso, tawny Port and Rutherglen Muscat. Vanilla and clove come
        from new oak, and brioche from contact with dead yeast, whatever the
        amount of air.
    fr:
      question: "Quelle palette aromatique un vin acquiert-il lorsqu’on le fait vieillir volontairement avec beaucoup d’air ?"
      choices:
        - { text: "Caramel, toffee et fruits à coque", correct: true }
        - { text: "Pain grillé, vanille et clou de girofle", correct: false }
        - { text: "Brioche, biscuit et mie de pain", correct: false }
        - { text: "Agrumes, pomme verte et herbe coupée", correct: false }
      explanation: |
        Une longue oxydation voulue construit le registre caramel et noix
        de l’oloroso, du Porto tawny et du Rutherglen Muscat. La vanille et
        le clou de girofle viennent du chêne neuf, la brioche du contact
        avec les lies, quelle que soit la quantité d’air.

  - id: wine-over-oxid-stale-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What can too much oxygen do to a wine that was not meant to be oxidative?"
      choices:
        - { text: "It gains tannin and colour intensity", correct: false }
        - { text: "It loses fruit and smells stale", correct: true }
        - { text: "It develops a struck-match smell", correct: false }
        - { text: "It gains extra fresh fruit", correct: false }
      explanation: |
        This is the oxidised fault: think of a bottle left open for days,
        flat and bruised-apple. A struck-match smell is the opposite
        problem, reduction, when a wine has had too little oxygen.
    fr:
      question: "Que peut provoquer un excès d’oxygène dans un vin qui n’était pas censé être oxydatif ?"
      choices:
        - { text: "Il gagne en tanins et en intensité de couleur", correct: false }
        - { text: "Il perd son fruit et sent l’éventé", correct: true }
        - { text: "Il prend une odeur d’allumette frottée", correct: false }
        - { text: "Il gagne en fruit frais", correct: false }
      explanation: |
        C’est le défaut d’oxydation : pensez à une bouteille restée ouverte
        plusieurs jours, plate, avec une note de pomme blette. L’odeur
        d’allumette frottée signale le problème inverse, la réduction, quand
        le vin a manqué d’oxygène.

  - id: wine-over-oxid-vinegar-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen]
    status: reviewed
    source_id: c07-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In extreme cases, how can leftover oxygen let microbes spoil a wine?"
      choices:
        - { text: "Lactic bacteria use it to turn malic acid into lactic acid", correct: false }
        - { text: "Bacteria use it to turn the wine into vinegar", correct: true }
        - { text: "Wild yeasts use it to referment the wine and make it fizzy", correct: false }
        - { text: "Yeasts use it to turn the alcohol back into sugar", correct: false }
      explanation: |
        Acetic acid bacteria (*Acetobacter*) need air to turn alcohol into
        acetic acid, raising volatile acidity. Barrels left in ullage or
        neglected part-full tanks are the classic risk; topping up and SO₂
        keep them in check. Malolactic conversion, by contrast, needs no
        oxygen.
    fr:
      question: "Dans les cas extrêmes, comment l’oxygène resté au contact du vin permet-il à des microbes de le gâter ?"
      choices:
        - { text: "Les bactéries lactiques s’en servent pour transformer l’acide malique en acide lactique", correct: false }
        - { text: "Des bactéries s’en servent pour transformer le vin en vinaigre", correct: true }
        - { text: "Des levures indigènes s’en servent pour refermenter le vin et le rendre perlant", correct: false }
        - { text: "Les levures s’en servent pour retransformer l’alcool en sucre", correct: false }
      explanation: |
        Les bactéries acétiques (*Acetobacter*) ont besoin d’air pour
        transformer l’alcool en acide acétique : l’acidité volatile monte.
        Les fûts en vidange et les cuves à moitié pleines oubliées sont le
        risque classique ; l’ouillage et le SO₂ les tiennent en respect. La
        fermentation malolactique, elle, n’a pas besoin d’oxygène.

  - id: wine-so2-antioxidant-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2]
    status: reviewed
    source_id: c07-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "One main winery use of sulphur dioxide is as an antioxidant. What is the other?"
      choices:
        - { text: "A fining agent that clears haze", correct: false }
        - { text: "An antiseptic against unwanted microbes", correct: true }
        - { text: "A nutrient that feeds the yeast", correct: false }
        - { text: "A source of tannin and structure", correct: false }
      explanation: |
        SO₂ holds back spoilage yeasts and bacteria, which is why it is
        often added at crushing and again before bottling. Haze is cleared
        with fining agents such as bentonite, and yeast is fed with
        nitrogen-based nutrients, not sulphur dioxide.
    fr:
      question: "Le dioxyde de soufre sert d’abord d’antioxydant en cave. Quel est son autre grand usage ?"
      choices:
        - { text: "Un agent de collage qui élimine les troubles", correct: false }
        - { text: "Un antiseptique contre les microbes indésirables", correct: true }
        - { text: "Un nutriment qui nourrit les levures", correct: false }
        - { text: "Une source de tanins et de structure", correct: false }
      explanation: |
        Le SO₂ freine les levures et bactéries d’altération ; c’est pourquoi
        on l’ajoute souvent au foulage, puis avant la mise en bouteille. Les
        troubles s’éliminent par collage (bentonite, par exemple) et les
        levures se nourrissent d’apports azotés, pas de dioxyde de soufre.

  - id: wine-so2-antiseptic-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2]
    status: reviewed
    source_id: c07-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When SO₂ is described as antiseptic in the winery, what is it doing?"
      choices:
        - { text: "Binding oxygen before it can harm the wine", correct: false }
        - { text: "Inhibiting spoilage yeasts and bacteria", correct: true }
        - { text: "Removing the proteins that cause haze", correct: false }
        - { text: "Softening harsh tannins in young reds", correct: false }
      explanation: |
        Binding oxygen is SO₂’s other job, as an antioxidant. As an
        antiseptic it suppresses wild yeasts and bacteria such as
        *Acetobacter* at crushing, and a winemaker can also use it to
        prevent an unwanted malolactic conversion.
    fr:
      question: "Quand on dit que le SO₂ agit comme antiseptique en cave, que fait-il ?"
      choices:
        - { text: "Il fixe l’oxygène avant qu’il n’abîme le vin", correct: false }
        - { text: "Il freine les levures et bactéries d’altération", correct: true }
        - { text: "Il élimine les protéines responsables des troubles", correct: false }
        - { text: "Il assouplit les tanins durs des rouges jeunes", correct: false }
      explanation: |
        Fixer l’oxygène, c’est l’autre rôle du SO₂, celui d’antioxydant.
        Comme antiseptique, il freine les levures indigènes et des bactéries
        comme *Acetobacter* dès le foulage ; il permet aussi d’empêcher une
        fermentation malolactique non souhaitée.

  - id: wine-so2-regulated-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2]
    status: reviewed
    source_id: c07-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are sulphur dioxide additions capped by law rather than left unlimited?"
      choices:
        - { text: "Caps keep production costs equal between producers", correct: false }
        - { text: "High levels can be toxic to consumers", correct: true }
        - { text: "Caps protect each appellation’s traditional style", correct: false }
        - { text: "High levels make wines oxidise faster", correct: false }
      explanation: |
        Limits are a health measure. In the EU, for example, the maximum
        total SO₂ is lower for dry reds than for dry whites, and higher
        again for many sweet wines; organic rules set lower caps still.
    fr:
      question: "Pourquoi la loi plafonne-t-elle les ajouts de dioxyde de soufre au lieu de les laisser libres ?"
      choices:
        - { text: "Pour que les coûts de production restent égaux entre producteurs", correct: false }
        - { text: "Parce qu’à forte dose il peut être toxique pour le consommateur", correct: true }
        - { text: "Pour protéger le style traditionnel de chaque appellation", correct: false }
        - { text: "Parce qu’à forte dose il accélère l’oxydation du vin", correct: false }
      explanation: |
        Ces limites relèvent de la santé publique. Dans l’UE, par exemple,
        le SO₂ total autorisé est plus bas pour les rouges secs que pour les
        blancs secs, et plus élevé encore pour beaucoup de vins doux ; le
        cahier des charges bio fixe des plafonds plus bas.

  - id: wine-so2-allergy-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2]
    status: reviewed
    source_id: c07-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which common winery addition can provoke a reaction in sensitive drinkers at modest doses?"
      choices:
        - { text: "Tartaric acid", correct: false }
        - { text: "Sulphur dioxide", correct: true }
        - { text: "Cultured yeast", correct: false }
        - { text: "Grape tannin powder", correct: false }
      explanation: |
        Sulphites can trigger reactions, notably in some asthmatics, even
        at modest doses. That is why EU labels must state “contains
        sulphites” above 10 mg/L.
    fr:
      question: "Quel ajout courant en cave peut provoquer une réaction chez les buveurs sensibles, même à faible dose ?"
      choices:
        - { text: "L’acide tartrique", correct: false }
        - { text: "Le dioxyde de soufre", correct: true }
        - { text: "Les levures sélectionnées", correct: false }
        - { text: "Le tanin de raisin en poudre", correct: false }
      explanation: |
        Les sulfites peuvent déclencher des réactions, notamment chez
        certains asthmatiques, même à faible dose. C’est pourquoi
        l’étiquette doit mentionner « contient des sulfites » dans l’UE
        au-delà de 10 mg/L.

  - id: wine-so2-harsh-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2]
    status: reviewed
    source_id: c07-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a careful winemaker keep SO₂ as low as the wine will safely allow?"
      choices:
        - { text: "Excess SO₂ can make the wine harsh and mute the fruit", correct: true }
        - { text: "Excess SO₂ can speed up oxidation in bottle", correct: false }
        - { text: "Excess SO₂ can trigger malolactic conversion", correct: false }
        - { text: "Excess SO₂ can leave a sugary taste", correct: false }
      explanation: |
        Too much free SO₂ gives a pungent, burnt-match edge and dulls the
        aromas. SO₂ actually slows oxidation and blocks malolactic
        bacteria, so the aim is enough to protect, no more.
    fr:
      question: "Pourquoi un vinificateur soigneux garde-t-il le SO₂ aussi bas que le vin le permet sans risque ?"
      choices:
        - { text: "Un excès de SO₂ peut durcir le vin et éteindre le fruit", correct: true }
        - { text: "Un excès de SO₂ peut accélérer l’oxydation en bouteille", correct: false }
        - { text: "Un excès de SO₂ peut déclencher la fermentation malolactique", correct: false }
        - { text: "Un excès de SO₂ peut laisser un goût sucré", correct: false }
      explanation: |
        Trop de SO₂ libre donne une note piquante d’allumette brûlée et
        éteint les arômes. Le SO₂ freine au contraire l’oxydation et bloque
        les bactéries malolactiques : on en met assez pour protéger, pas
        davantage.

  - id: wine-so2-bound-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2, oxygen]
    status: reviewed
    source_id: c07-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why must SO₂ used as an antioxidant be checked again during the wine’s life?"
      choices:
        - { text: "Free SO₂ becomes bound and stops protecting", correct: true }
        - { text: "Free SO₂ rises over time and must be diluted", correct: false }
        - { text: "Bound SO₂ turns back into free SO₂ and hardens the wine", correct: false }
        - { text: "The first dose stays fully active until bottling", correct: false }
      explanation: |
        As SO₂ reacts with oxygen and oxidation products such as
        acetaldehyde, the free share falls. Only free SO₂ still guards the
        wine, so cellars measure it and top it up, typically before racking
        and bottling.
    fr:
      question: "Pourquoi faut-il recontrôler le SO₂ antioxydant au cours de la vie du vin ?"
      choices:
        - { text: "Le SO₂ libre se combine et cesse de protéger", correct: true }
        - { text: "Le SO₂ libre augmente avec le temps et doit être dilué", correct: false }
        - { text: "Le SO₂ combiné redevient libre et durcit le vin", correct: false }
        - { text: "La première dose reste pleinement active jusqu’à la mise en bouteille", correct: false }
      explanation: |
        En réagissant avec l’oxygène et les produits d’oxydation comme
        l’éthanal, le SO₂ libre diminue. Seule cette part libre protège
        encore le vin : la cave la mesure et réajuste, en général avant les
        soutirages et la mise en bouteille.

  - id: wine-so2-antioxidant-how-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2, oxygen]
    status: reviewed
    source_id: c07-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When SO₂ is used as an antioxidant, how does it actually protect the wine?"
      choices:
        - { text: "By inhibiting the microbes that need oxygen", correct: false }
        - { text: "By reacting with oxygen and its by-products", correct: true }
        - { text: "By forming a gas layer that keeps air out", correct: false }
        - { text: "By raising acidity so that oxidation slows", correct: false }
      explanation: |
        SO₂ reacts with oxygen and with compounds that oxidation creates,
        such as acetaldehyde (the bruised-apple smell), so those reactions
        cannot run on. Holding back microbes is its separate antiseptic
        job; a blanket of inert gas is a different tool.
    fr:
      question: "Quand le SO₂ sert d’antioxydant, comment protège-t-il concrètement le vin ?"
      choices:
        - { text: "En freinant les microbes qui ont besoin d’oxygène", correct: false }
        - { text: "En réagissant avec l’oxygène et ses sous-produits", correct: true }
        - { text: "En formant une couche de gaz qui tient l’air à distance", correct: false }
        - { text: "En relevant l’acidité pour ralentir l’oxydation", correct: false }
      explanation: |
        Le SO₂ réagit avec l’oxygène et avec les composés nés de
        l’oxydation, comme l’éthanal (l’odeur de pomme blette), ce qui
        stoppe ces réactions. Freiner les microbes est son rôle
        antiseptique, distinct ; inerter au gaz est un autre outil.

  - id: wine-so2-yeast-tolerate-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2, fermentation]
    status: reviewed
    source_id: c07-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At the doses used in a normal ferment, how does the main wine yeast react to sulphur dioxide?"
      choices:
        - { text: "It is killed by even small doses", correct: false }
        - { text: "It tolerates it up to a certain level", correct: true }
        - { text: "It ferments faster the more SO₂ is added", correct: false }
        - { text: "It is more sensitive to it than wild yeasts are", correct: false }
      explanation: |
        *Saccharomyces cerevisiae* copes with moderate SO₂, so a dose at
        crushing can suppress wild yeasts and bacteria while the ferment
        still runs. Very high levels can stall it.
    fr:
      question: "Aux doses d’une fermentation normale, comment la principale levure du vin réagit-elle au dioxyde de soufre ?"
      choices:
        - { text: "Elle meurt même à faible dose", correct: false }
        - { text: "Elle le tolère jusqu’à un certain seuil", correct: true }
        - { text: "Elle fermente d’autant plus vite qu’on en ajoute", correct: false }
        - { text: "Elle y est plus sensible que les levures indigènes", correct: false }
      explanation: |
        *Saccharomyces cerevisiae* supporte un SO₂ modéré : un sulfitage
        au foulage freine les levures indigènes et les bactéries sans
        empêcher la fermentation. À très forte dose, il peut toutefois
        la bloquer.

  - id: wine-oak-majority-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: reviewed
    source_id: c07-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When a cellar chooses a wooden vessel, which timber is the usual choice?"
      choices:
        - { text: "Chestnut", correct: false }
        - { text: "Oak", correct: true }
        - { text: "Acacia", correct: false }
        - { text: "Cherry", correct: false }
      explanation: |
        Oak dominates: it is watertight, can be bent into barrels and gives
        flavours that suit wine. Chestnut was once common in parts of Italy,
        and acacia is used for some whites, but both remain niche.
    fr:
      question: "Quand une cave choisit un contenant en bois, quelle essence retient-elle d’ordinaire ?"
      choices:
        - { text: "Le châtaignier", correct: false }
        - { text: "Le chêne", correct: true }
        - { text: "L’acacia", correct: false }
        - { text: "Le merisier", correct: false }
      explanation: |
        Le chêne domine : il est étanche, se cintre en fût et apporte des
        arômes qui s’accordent au vin. Le châtaignier était autrefois
        courant dans certaines régions d’Italie et l’acacia sert pour
        quelques blancs, mais ils restent marginaux.

  - id: wine-oak-adds-tannin-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: reviewed
    source_id: c07-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides a slow leak of oxygen, what can oak ageing add to a wine’s structure?"
      choices:
        - { text: "Tannin from the wood", correct: true }
        - { text: "Extra acidity", correct: false }
        - { text: "Extra alcohol", correct: false }
        - { text: "Residual sugar", correct: false }
      explanation: |
        Oak releases its own tannins, most strongly from new barrels, on top
        of any grape tannin already there. That is why even a barrel-aged
        white can show some grip.
    fr:
      question: "Outre une lente entrée d’oxygène, qu’un élevage en chêne peut-il ajouter à la structure d’un vin ?"
      choices:
        - { text: "Des tanins issus du bois", correct: true }
        - { text: "Un surcroît d’acidité", correct: false }
        - { text: "Un surcroît d’alcool", correct: false }
        - { text: "Du sucre résiduel", correct: false }
      explanation: |
        Le chêne libère ses propres tanins, surtout quand le fût est neuf,
        en plus des tanins du raisin. C’est pourquoi même un blanc élevé en
        barrique peut montrer un peu d’accroche.

  - id: wine-oak-adds-flavour-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: reviewed
    source_id: c07-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides oxygen and tannin, what else can oak ageing give a wine?"
      choices:
        - { text: "Flavours from the wood", correct: true }
        - { text: "Dissolved carbon dioxide", correct: false }
        - { text: "Higher alcohol", correct: false }
        - { text: "Fresh primary fruit", correct: false }
      explanation: |
        Compounds such as vanillin and oak lactones pass into the wine,
        strongest from new barrels and fading with each refill. Primary
        fruit comes from the grape, and oak tends to soften it rather than
        add to it.
    fr:
      question: "Outre l’oxygène et les tanins, que peut encore apporter un élevage en chêne ?"
      choices:
        - { text: "Des arômes venus du bois", correct: true }
        - { text: "Du gaz carbonique dissous", correct: false }
        - { text: "Un degré d’alcool plus élevé", correct: false }
        - { text: "Du fruit primaire frais", correct: false }
      explanation: |
        Des composés comme la vanilline et les lactones du chêne passent
        dans le vin, surtout avec un fût neuf, puis de moins en moins à
        chaque vin. Le fruit primaire vient du raisin ; le chêne tend à
        l’adoucir plutôt qu’à le renforcer.

  - id: wine-oak-tannin-structure-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: reviewed
    source_id: c07-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When a wine takes up tannin from the barrel, what does that wood tannin mainly contribute?"
      choices:
        - { text: "Fresher acidity", correct: false }
        - { text: "Structure and textural complexity", correct: true }
        - { text: "More intense primary fruit", correct: false }
        - { text: "A softer, sweeter palate", correct: false }
      explanation: |
        Wood tannin adds grip and layers of texture, giving the palate a
        firmer frame. It does nothing for acidity, and too much of it can
        dry the finish rather than soften it.
    fr:
      question: "Quand un vin prend des tanins au fût, qu’apportent surtout ces tanins du bois ?"
      choices:
        - { text: "Une acidité plus fraîche", correct: false }
        - { text: "De la structure et de la complexité de texture", correct: true }
        - { text: "Un fruit primaire plus intense", correct: false }
        - { text: "Une bouche plus souple et plus sucrée", correct: false }
      explanation: |
        Les tanins du bois apportent de l’accroche et des couches de
        texture : la bouche gagne une charpente plus ferme. Ils ne
        touchent pas à l’acidité, et en excès ils assèchent la finale au
        lieu de l’assouplir.

  - id: wine-oak-flavour-set-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: reviewed
    source_id: c07-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aroma group is typical of wine that has spent time in toasted oak?"
      choices:
        - { text: "Toast, vanilla, smoke and cloves", correct: true }
        - { text: "Brioche, biscuit, bread and yeast", correct: false }
        - { text: "Banana, bubblegum, pear drop and kirsch", correct: false }
        - { text: "Leather, earth, mushroom and forest floor", correct: false }
      explanation: |
        Toasting the staves creates smoky, sweet-spice compounds, so the
        heavier the toast the more roasted notes. Brioche comes from lees,
        banana and pear drop from cool fermentation or carbonic maceration,
        and leather or mushroom from bottle age.
    fr:
      question: "Quelle famille d’arômes est typique d’un vin élevé en chêne chauffé ?"
      choices:
        - { text: "Pain grillé, vanille, fumée et clou de girofle", correct: true }
        - { text: "Brioche, biscuit, mie de pain et levure", correct: false }
        - { text: "Banane, bonbon anglais, poire et kirsch", correct: false }
        - { text: "Cuir, terre, champignon et sous-bois", correct: false }
      explanation: |
        La chauffe des douelles crée des composés fumés et épicés : plus
        elle est forte, plus les notes torréfiées ressortent. La brioche
        vient des lies, la banane et le bonbon anglais d’une fermentation
        fraîche ou d’une macération carbonique, le cuir et le champignon de
        la garde en bouteille.

  - id: wine-oak-hygiene-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak]
    status: reviewed
    source_id: c07-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is oak harder to keep microbiologically clean than stainless steel?"
      choices:
        - { text: "Its tannins feed spoilage bacteria", correct: false }
        - { text: "Its porous wood can harbour spoilage microbes", correct: true }
        - { text: "It cannot be cleaned with hot water or steam", correct: false }
        - { text: "Its toasted layer releases sugar for microbes", correct: false }
      explanation: |
        Yeasts such as *Brettanomyces* lodge in the pores of the staves, out
        of reach of cleaning. Barrels can be rinsed with hot water or steam,
        but smooth, non-porous steel simply leaves microbes nowhere to hide.
    fr:
      question: "Pourquoi le chêne est-il plus difficile à garder propre sur le plan microbien que l’inox ?"
      choices:
        - { text: "Ses tanins nourrissent les bactéries d’altération", correct: false }
        - { text: "Son bois poreux peut abriter des microbes d’altération", correct: true }
        - { text: "Il ne peut pas être nettoyé à l’eau chaude ni à la vapeur", correct: false }
        - { text: "Sa couche chauffée libère du sucre pour les microbes", correct: false }
      explanation: |
        Des levures comme *Brettanomyces* se logent dans les pores des
        douelles, hors de portée du nettoyage. Un fût se rince bien à l’eau
        chaude ou à la vapeur, mais l’inox, lisse et non poreux, ne laisse
        tout simplement aucune cachette aux microbes.

  - id: wine-vessel-lot-blending-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, maturation, blending]
    status: reviewed
    source_id: c07-0051
    review:
      fact_check: pass
      sources: [extension, industry]
    en:
      question: A winemaker has separate maturation lots from stainless steel, older oak and new oak. Which approach best uses that diversity?
      choices:
        - { text: "Use equal proportions so each vessel has the same influence on the finished wine", correct: false }
        - { text: "Test several proportions and choose the blend that best meets the intended balance and style", correct: true }
        - { text: "Maximise the new-oak lot, then rely on bottle age to remove any excess oak", correct: false }
        - { text: "Choose proportions from vessel capacity alone, without tasting the combined lots", correct: false }
      explanation: |
        The lots may contribute different fruit expression, texture, oak
        flavour and oxygen effects. Blend trials show whether those elements
        complement one another; using more vessel types does not guarantee
        greater complexity.
    fr:
      question: "Un vinificateur dispose de lots élevés séparément en cuve inox, en fûts anciens et en fûts neufs. Quelle démarche tire le meilleur parti de cette diversité ?"
      choices:
        - { text: "Assembler à parts égales pour que chaque contenant pèse autant dans le vin fini", correct: false }
        - { text: "Essayer plusieurs proportions et retenir l’assemblage le plus proche de l’équilibre et du style visés", correct: true }
        - { text: "Privilégier le lot en fût neuf, puis compter sur la garde en bouteille pour estomper l’excès de bois", correct: false }
        - { text: "Fixer les proportions d’après le seul volume des contenants, sans déguster les lots assemblés", correct: false }
      explanation: |
        Chaque lot peut apporter une expression du fruit, une texture, un
        boisé et une oxygénation différents. Les essais d’assemblage
        montrent s’ils se complètent ; multiplier les types de contenants ne
        garantit pas, à lui seul, plus de complexité.

  - id: wine-oak-programme-variables-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, maturation]
    status: reviewed
    source_id: c07-0052
    review:
      fact_check: pass
      sources: [industry, extension]
    en:
      question: A cellar wants to find out how barrel toast changes oak impact on one wine. Which paired trial gives the cleanest evidence?
      choices:
        - { text: "Compare matched groups of new 225 L barrels from one oak lot and cooper for 12 months, changing only toast", correct: true }
        - { text: "Compare matched groups of new 225 L and 500 L barrels from one oak lot and cooper for 12 months, changing toast", correct: false }
        - { text: "Compare matched groups of new and third-fill 225 L barrels from one oak lot and cooper for 12 months, changing toast", correct: false }
        - { text: "Compare matched groups of new 225 L barrels from one oak lot and cooper for six and 12 months, changing toast", correct: false }
      explanation: |
        A paired trial changes the target variable while holding direct
        confounders constant. Species, origin and grain matter, as do stave
        manufacture — including splitting or sawing and seasoning — vessel
        volume, previous fills and contact time. Matching those factors means
        a sensory difference can be linked more confidently to toast.
    fr:
      question: "Une cave veut savoir comment la chauffe du fût modifie l’empreinte boisée sur un même vin. Quel essai apparié donne la preuve la plus nette ?"
      choices:
        - { text: "Comparer des lots appariés de barriques neuves de 225 L, même lot de chêne et même tonnelier, sur 12 mois, en ne changeant que la chauffe", correct: true }
        - { text: "Comparer des lots appariés de fûts neufs de 225 L et de 500 L, même lot de chêne et même tonnelier, sur 12 mois, en changeant la chauffe", correct: false }
        - { text: "Comparer des lots appariés de barriques neuves et de deux vins de 225 L, même lot de chêne et même tonnelier, sur 12 mois, en changeant la chauffe", correct: false }
        - { text: "Comparer des lots appariés de barriques neuves de 225 L, même lot de chêne et même tonnelier, sur six et 12 mois, en changeant la chauffe", correct: false }
      explanation: |
        Un essai apparié ne fait varier que le facteur étudié et fige les
        autres. L’espèce de chêne, l’origine et le grain comptent, tout
        comme la fabrication des douelles (fendage ou sciage, séchage), le
        volume, les vins précédents et la durée de contact. En les
        égalisant, on peut attribuer plus sûrement à la chauffe un écart
        perçu à la dégustation.

  - id: wine-barrel-toast-profile-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, cooperage]
    status: reviewed
    source_id: c07-0058
    review:
      fact_check: pass
      sources: [industry, extension]
    en:
      question: A cooper applies different time-and-temperature toast profiles to otherwise identical oak barrels. What should the winemaker expect?
      choices:
        - { text: "More oak aroma and more tannin together as the toast becomes heavier", correct: false }
        - { text: "A different balance of oak-derived aromas and extractable tannins from each profile", correct: true }
        - { text: "Mainly a change in oxygen ingress, with similar wood extraction from each profile", correct: false }
        - { text: "Mainly a sanitation effect, with similar flavour extraction from each profile", correct: false }
      explanation: |
        Heat first makes staves pliable enough to bend. Controlled toasting
        then transforms wood compounds, including aroma precursors and
        tannins. Changing both temperature and duration changes the profile;
        heavier toast does not simply increase every oak character together.
    fr:
      question: "Un tonnelier applique différents profils de chauffe (durée et température) à des fûts de chêne par ailleurs identiques. À quoi le vinificateur doit-il s’attendre ?"
      choices:
        - { text: "Davantage d’arômes boisés et de tanins à la fois, à mesure que la chauffe s’intensifie", correct: false }
        - { text: "Un équilibre différent entre arômes issus du bois et tanins extractibles selon chaque profil", correct: true }
        - { text: "Surtout un changement de l’entrée d’oxygène, avec une extraction du bois semblable selon les profils", correct: false }
        - { text: "Surtout un effet d’assainissement, avec une extraction aromatique semblable selon les profils", correct: false }
      explanation: |
        La chaleur rend d’abord les douelles assez souples pour être
        cintrées. La chauffe contrôlée transforme ensuite les composés du
        bois, dont des précurseurs d’arômes et des tanins. Changer la
        température et la durée modifie le profil ; une chauffe plus forte
        n’accentue pas tous les caractères boisés à la fois.

  - id: wine-used-barrel-extraction-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, maturation]
    status: reviewed
    source_id: c07-0064
    review:
      fact_check: pass
      sources: [awri, industry]
    en:
      question: After a sound oak barrel has held wine through several fills, which change is most likely?
      choices:
        - { text: "Wood-derived aroma and tannin extraction decline, while slow oxygen exchange can continue", correct: true }
        - { text: "Oak aroma declines and oxygen exchange largely stops after the first fill", correct: false }
        - { text: "Oak aroma stays constant, while wood-tannin extraction declines over repeated fills", correct: false }
        - { text: "Oak extraction increases as the staves age, while oxygen exposure remains unchanged", correct: false }
      explanation: |
        Successive wines remove a finite pool of readily extractable aroma
        compounds and tannins, so oak flavour becomes less pronounced. A
        well-maintained older barrel still functions as a wooden vessel and
        can permit gradual oxygen exposure; reuse does not turn it into steel.
    fr:
      question: "Après plusieurs vins dans un fût de chêne sain, quel changement est le plus probable ?"
      choices:
        - { text: "L’extraction d’arômes et de tanins du bois diminue, tandis qu’un lent échange d’oxygène peut se poursuivre", correct: true }
        - { text: "Les arômes boisés diminuent et l’échange d’oxygène cesse presque après le premier vin", correct: false }
        - { text: "Les arômes boisés restent constants, tandis que l’extraction des tanins du bois diminue au fil des vins", correct: false }
        - { text: "L’extraction du bois augmente à mesure que les douelles vieillissent, sans changement de l’apport d’oxygène", correct: false }
      explanation: |
        Chaque vin puise dans un stock limité d’arômes et de tanins
        facilement extractibles : le boisé devient donc plus discret. Un
        vieux fût bien entretenu reste un contenant en bois et laisse passer
        un peu d’oxygène ; le réutiliser n’en fait pas une cuve inox.

  - id: wine-oak-pieces-limits-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oak, alternatives]
    status: reviewed
    source_id: c07-0066
    review:
      fact_check: pass
      sources: [oiv, awri, industry]
    en:
      question: A producer uses oak staves inside a stainless-steel tank instead of new barrels. Which comparison is accurate?
      choices:
        - { text: "They add extractable wood compounds economically, but any controlled oxygen input remains a separate decision", correct: true }
        - { text: "They add extractable wood compounds economically, and the tank then breathes at the same rate as a barrel", correct: false }
        - { text: "They add extractable wood compounds, but their greater exposed surface makes extraction slower than from a barrel", correct: false }
        - { text: "They add extractable wood compounds, so separate oxygen control is unnecessary when recreating barrel maturation in tank", correct: false }
      explanation: |
        Staves and chips expose wine to wood compounds without the cost of
        buying many new barrels. They do not recreate a barrel's geometry or
        oxygen transfer by themselves. A cellar may pair them with controlled
        oxygen, but the two tools perform different jobs.
    fr:
      question: "Un producteur plonge des douelles de chêne dans une cuve inox au lieu d’acheter des fûts neufs. Quelle comparaison est exacte ?"
      choices:
        - { text: "Elles apportent à moindre coût les composés extractibles du bois, mais tout apport d’oxygène maîtrisé reste une décision à part", correct: true }
        - { text: "Elles apportent à moindre coût les composés extractibles du bois, et la cuve respire alors au même rythme qu’un fût", correct: false }
        - { text: "Elles apportent les composés extractibles du bois, mais leur plus grande surface exposée rend l’extraction plus lente qu’en fût", correct: false }
        - { text: "Elles apportent les composés extractibles du bois, donc un contrôle séparé de l’oxygène est inutile pour imiter l’élevage en fût", correct: false }
      explanation: |
        Douelles et copeaux mettent le vin au contact des composés du bois
        sans le coût d’un parc de fûts neufs. Ils ne reproduisent à eux
        seuls ni la forme d’un fût ni ses échanges d’oxygène. On peut les
        associer à une micro-oxygénation, mais les deux outils ont des rôles
        distincts.

  - id: wine-micro-oxygenation-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, oxygen, maturation]
    status: reviewed
    source_id: c07-0067
    review:
      fact_check: pass
      sources: [oiv, awri, extension]
    en:
      question: Which statement most accurately describes micro-oxygenation of wine in tank?
      choices:
        - { text: "Oxygen is metered below the wine's consumption rate and adjusted as the wine responds during maturation", correct: true }
        - { text: "Oxygen is metered above the wine's consumption rate so a dissolved reserve remains throughout maturation", correct: false }
        - { text: "Oxygen is supplied only during yeast growth, then stopped once alcoholic fermentation is complete", correct: false }
        - { text: "Oxygen is delivered at one fixed rate throughout maturation, without tracking the wine's changing response", correct: false }
      explanation: |
        Micro-oxygenation keeps addition below the wine's oxygen-consumption
        rate. The dose is monitored and adapted because temperature,
        phenolics, free SO₂ and sensory development affect the response. It
        can influence colour and tannin development, but it supplies no wood
        compounds and does not reproduce every effect of barrel maturation.
    fr:
      question: "Quelle description de la micro-oxygénation d’un vin en cuve est la plus juste ?"
      choices:
        - { text: "L’oxygène est dosé sous la vitesse de consommation du vin et ajusté selon sa réaction pendant l’élevage", correct: true }
        - { text: "L’oxygène est dosé au-dessus de la vitesse de consommation du vin pour garder une réserve dissoute pendant tout l’élevage", correct: false }
        - { text: "L’oxygène n’est apporté que pendant la multiplication des levures, puis coupé à la fin de la fermentation alcoolique", correct: false }
        - { text: "L’oxygène est apporté à débit fixe pendant tout l’élevage, sans suivre l’évolution de la réaction du vin", correct: false }
      explanation: |
        La micro-oxygénation maintient l’apport sous la capacité du vin à
        consommer l’oxygène. La dose est suivie et ajustée, car la
        température, les composés phénoliques, le SO₂ libre et l’évolution à
        la dégustation modifient la réponse. Elle peut agir sur la couleur et
        les tanins, mais n’apporte aucun composé du bois et ne reproduit pas
        tous les effets de l’élevage en fût.

  - id: wine-inert-vessel-meaning-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, vessels, oxygen]
    status: reviewed
    source_id: c07-0068
    review:
      fact_check: pass
      sources: [extension, industry]
    en:
      question: Which statement best describes an inert winery vessel in practice?
      choices:
        - { text: "Adds no flavour of its own; keeping oxygen out still needs a sealed, full vessel", correct: true }
        - { text: "Adds no flavour of its own and, being airtight, keeps oxygen out even with headspace", correct: false }
        - { text: "Lets in slow, steady oxygen like oak, but without giving any oak flavour", correct: false }
        - { text: "Admits no oxygen, but releases a faint flavour that fades as the vessel ages", correct: false }
      explanation: |
        Stainless steel is flavour-neutral and can serve for fermentation or
        storage, but ullage, transfers and poor sealing can still admit air.
        Epoxy-lined concrete can also behave as an inert container; unlined
        concrete should not automatically be treated as airtight and inert.
        Slow oxygen ingress without flavour is the role of other vessels,
        such as old oak, not a property of an inert one.
    fr:
      question: "Que signifie concrètement une cuve « inerte » au chai ?"
      choices:
        - { text: "Elle n’apporte aucun goût ; écarter l’oxygène exige encore une cuve close et pleine", correct: true }
        - { text: "Elle n’apporte aucun goût et, étanche, protège de l’oxygène même si la cuve n’est pas pleine", correct: false }
        - { text: "Elle laisse passer un peu d’oxygène, comme le chêne, sans donner de goût boisé", correct: false }
        - { text: "Elle n’admet pas d’oxygène, mais cède un léger goût qui s’estompe avec l’âge", correct: false }
      explanation: |
        L’inox ne marque pas le vin et sert aussi bien à la fermentation qu’au
        stockage, mais une cuve en vidange (mal ouillée), les transferts ou une
        fermeture imparfaite laissent encore entrer de l’air. Le béton revêtu
        d’époxy se comporte aussi en cuve inerte ; le béton brut ne doit pas
        être considéré d’office comme étanche et neutre. Une légère oxygénation
        sans goût de bois est le rôle d’autres contenants, comme les vieux fûts,
        pas d’une cuve inerte.

  - id: wine-stainless-vessel-advantages-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, vessels, stainless-steel]
    status: reviewed
    source_id: c07-0072
    review:
      fact_check: pass
      sources: [extension, research]
    en:
      question: Which material profile best explains the widespread use of stainless-steel winery vessels?
      choices:
        - { text: "Smooth and non-porous, readily fabricated in many sizes, and easy to equip for temperature control", correct: true }
        - { text: "Smooth and non-porous, made in many sizes, and slightly oxygen-permeable for gentle ageing", correct: false }
        - { text: "Smooth and non-porous, made in many sizes, and insulating enough to need no cooling jacket", correct: false }
        - { text: "Smooth and easy to equip for temperature control, but hard to fabricate beyond small sizes", correct: false }
      explanation: |
        Stainless steel combines a cleanable, durable contact surface with
        flexible fabrication and straightforward installation of jackets,
        sensors and automated controls. It is not maintenance-free, but its
        sanitary design is easier to inspect than a porous vessel surface.
        Steel is impermeable to oxygen and conducts heat well, which is why a
        jacket or coil cools it efficiently.
    fr:
      question: "Quelles propriétés expliquent la généralisation des cuves en inox dans les chais ?"
      choices:
        - { text: "Lisse, non poreux, fabriqué en toutes tailles et facile à équiper d’une régulation thermique", correct: true }
        - { text: "Lisse, non poreux, fabriqué en toutes tailles et un peu perméable à l’oxygène pour un élevage doux", correct: false }
        - { text: "Lisse, non poreux, fabriqué en toutes tailles et assez isolant pour se passer de double paroi", correct: false }
        - { text: "Lisse et facile à équiper d’une régulation thermique, mais difficile à fabriquer en grand volume", correct: false }
      explanation: |
        L’inox associe une surface de contact durable et facile à nettoyer à une
        grande souplesse de fabrication : on y installe sans peine doubles
        parois, sondes et régulation automatique. Il demande de l’entretien,
        mais sa conception sanitaire se contrôle plus facilement qu’une surface
        poreuse. Imperméable à l’oxygène et bon conducteur de chaleur, il se
        refroidit efficacement par double paroi ou serpentin.

  - id: wine-tank-temperature-control-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, vessels, temperature]
    status: reviewed
    source_id: c07-0073
    review:
      fact_check: pass
      sources: [extension, awri]
    en:
      question: A winery wants built-in temperature control while the wine remains in the tank and coolant stays separate. Which specification best fits?
      choices:
        - { text: "A sealed external jacket or internal coil carrying a separate heat-transfer fluid", correct: true }
        - { text: "A sanitary loop that pumps wine through an external plate heat exchanger", correct: false }
        - { text: "Refrigerated cellar air circulated around insulated, unjacketed tanks", correct: false }
        - { text: "Chilled water sprayed over an unjacketed tank and collected below", correct: false }
      explanation: |
        Fluid circulating through a jacket or sealed coil exchanges heat
        across a tank surface and never enters the wine. An external heat
        exchanger instead moves the wine, while room cooling or an external
        water spray is less direct than an integrated jacket or coil.
    fr:
      question: "Un domaine veut réguler la température directement dans la cuve, sans que le fluide de refroidissement touche le vin. Quel équipement choisir ?"
      choices:
        - { text: "Une double paroi ou un serpentin étanche où circule un fluide caloporteur séparé", correct: true }
        - { text: "Une boucle sanitaire qui fait passer le vin dans un échangeur à plaques externe", correct: false }
        - { text: "De l’air réfrigéré qui circule dans le chai autour de cuves isolées sans double paroi", correct: false }
        - { text: "De l’eau froide qui ruisselle sur une cuve sans double paroi et se récupère en bas", correct: false }
      explanation: |
        Le fluide qui circule dans la double paroi ou le serpentin échange la
        chaleur à travers la paroi de la cuve sans jamais entrer dans le vin. Un
        échangeur externe oblige au contraire à faire circuler le vin, et la
        climatisation du chai ou le ruissellement d’eau agissent moins
        directement qu’une double paroi ou un serpentin intégrés.

  - id: wine-concrete-sanitation-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, vessels, concrete, hygiene]
    status: reviewed
    source_id: c07-0076
    review:
      fact_check: pass
      sources: [research, extension]
    en:
      question: A cellar is comparing unlined concrete with polished stainless steel. Which sanitation assessment is most accurate?
      choices:
        - { text: "Unlined concrete needs careful sanitation; a sound food-grade lining can make its contact surface less porous", correct: true }
        - { text: "Unlined concrete is easier to sanitise because its pores prevent wine residues from attaching", correct: false }
        - { text: "An epoxy lining removes the need for inspection because its surface cannot wear or crack", correct: false }
        - { text: "Stainless steel needs more maintenance because routine cleaning removes its protective passive layer", correct: false }
      explanation: |
        Pores and a rougher surface can retain tartrate and microorganisms,
        making unlined concrete harder to clean consistently than polished
        steel. A suitable lining creates a smoother barrier, but its condition
        must still be inspected and maintained.
    fr:
      question: "Un chai compare le béton brut et l’inox poli. Quelle appréciation de leur hygiène est la plus juste ?"
      choices:
        - { text: "Le béton brut demande un nettoyage soigneux ; un bon revêtement alimentaire rend sa surface moins poreuse", correct: true }
        - { text: "Le béton brut se nettoie plus facilement, car ses pores empêchent les résidus de vin d’adhérer", correct: false }
        - { text: "Un revêtement époxy dispense de tout contrôle, car sa surface ne peut ni s’user ni se fissurer", correct: false }
        - { text: "L’inox demande plus d’entretien, car le nettoyage courant détruit sa couche passive protectrice", correct: false }
      explanation: |
        Les pores et une surface plus rugueuse retiennent tartre et
        micro-organismes : le béton brut est donc plus difficile à nettoyer de
        façon homogène que l’inox poli. Un revêtement adapté crée une barrière
        plus lisse, mais son état doit être surveillé et entretenu.

  - id: wine-concrete-thermal-inertia-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, vessels, concrete, temperature]
    status: reviewed
    source_id: c07-0077
    review:
      fact_check: pass
      sources: [research]
    en:
      question: Which claim about the thermal inertia of a thick concrete wine tank is most accurate?
      choices:
        - { text: "It buffers rapid temperature swings, but precise targets may still require active heating or cooling", correct: true }
        - { text: "It buffers temperature swings enough that large fermentations rarely need active cooling", correct: false }
        - { text: "It speeds heat loss through the walls, helping a warming fermentation to cool itself", correct: false }
        - { text: "It mainly stabilises the cellar air, with little effect on the temperature of the wine inside", correct: false }
      explanation: |
        Concrete's mass and low thermal conductivity slow the rate at which
        the wine heats or cools. They do not create refrigeration or remove
        the heat generated by fermentation, so monitoring and active control
        can still be necessary, especially in large, vigorous ferments.
    fr:
      question: "Que peut-on attendre de l’inertie thermique d’une cuve en béton à parois épaisses ?"
      choices:
        - { text: "Elle amortit les variations brusques, mais tenir une consigne précise peut exiger de chauffer ou de refroidir", correct: true }
        - { text: "Elle amortit assez les variations pour que les grosses fermentations se passent le plus souvent de froid", correct: false }
        - { text: "Elle accélère la perte de chaleur par les parois et aide une fermentation qui chauffe à se refroidir", correct: false }
        - { text: "Elle stabilise surtout l’air du chai, avec peu d’effet sur la température du vin dans la cuve", correct: false }
      explanation: |
        La masse du béton et sa faible conductivité ralentissent le
        réchauffement comme le refroidissement du vin. Elles ne produisent pas
        de froid et n’évacuent pas la chaleur dégagée par la fermentation : un
        suivi et une régulation active peuvent rester nécessaires.

  - id: wine-so2-first-addition-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, so2, grape-reception]
    status: reviewed
    source_id: c07-0079
    review:
      fact_check: pass
      sources: [awri, extension]
    en:
      question: Which policy is most defensible for planning a wine's first SO₂ addition after harvest?
      choices:
        - { text: "Assess fruit condition, transport, pH and style, then choose the timing and dose for that lot", correct: true }
        - { text: "Dose by fruit health and transport time, at a fixed rate not adjusted for the must's pH", correct: false }
        - { text: "Dose by fruit health and pH, but wait until crushing to avoid over-sulphiting in the bins", correct: false }
        - { text: "Dose by pH and transport time, but skip it for every red lot to keep later MLF possible", correct: false }
      explanation: |
        SO₂ is often added in picking bins, during transport or at crushing
        to limit oxidation and unwanted microbes. Warm, damaged fruit or a
        processing delay can justify stronger early protection, but fruit
        condition, pH and the intended microbial and stylistic pathway all
        affect the decision. The active molecular form of SO₂ falls as pH
        rises, so the same dose protects a high-pH must less; reds usually
        still receive a moderate dose at crushing and complete MLF later.
    fr:
      question: "Quelle règle est la plus défendable pour décider du premier sulfitage après la vendange ?"
      choices:
        - { text: "Évaluer l’état des raisins, le transport, le pH et le style, puis fixer moment et dose pour chaque lot", correct: true }
        - { text: "Doser selon l’état sanitaire et le trajet, à un taux fixe que l’on n’ajuste pas au pH du moût", correct: false }
        - { text: "Doser selon l’état sanitaire et le pH, mais attendre le foulage pour ne pas trop sulfiter en caisse", correct: false }
        - { text: "Doser selon le pH et le trajet, mais s’abstenir pour tous les rouges afin de préserver la malolactique", correct: false }
      explanation: |
        Le SO₂ s’ajoute souvent dans les caisses de vendange, pendant le
        transport ou au foulage pour limiter l’oxydation et les micro-organismes
        indésirables. Des raisins chauds ou abîmés, ou un délai avant
        traitement, justifient une protection précoce plus forte, mais l’état
        sanitaire, le pH et la voie microbienne et stylistique visée pèsent
        aussi. La forme moléculaire active du SO₂ diminue quand le pH monte : à
        dose égale, un moût à pH élevé est moins protégé. Les rouges reçoivent
        en général une dose modérée au foulage et font quand même leur
        malolactique ensuite.

  - id: wine-reception-sorting-purpose-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape-reception, sorting]
    status: reviewed
    source_id: c07-0080
    review:
      fact_check: pass
      sources: [extension, awri]
    en:
      question: A load for a sound dry wine includes underripe grapes, rot-damaged berries and leaves. How should reception sorting be used?
      choices:
        - { text: "Remove unsuitable fruit and relevant foreign matter before the selected grapes are processed", correct: true }
        - { text: "Sort mainly by berry size, keeping the larger berries as the ripest and juiciest fruit", correct: false }
        - { text: "Remove leaves and petioles, then rely on must settling to clear the effects of poor fruit", correct: false }
        - { text: "Remove rot-affected berries, then rely on blending with riper lots to dilute the underripe fruit", correct: false }
      explanation: |
        Sorting applies the producer's acceptance criteria before unsuitable
        material is incorporated into the must. Removing insufficiently ripe or
        deteriorated fruit can reduce unwanted flavours and microbial risk;
        leaves, petioles and other material other than grapes may also be
        removed where relevant. Large berries are not necessarily the ripest,
        green flavours from underripe fruit persist even after blending, and
        settling removes solids rather than off-flavours already in the juice.
    fr:
      question: "Un lot destiné à un vin sec et sain contient des raisins pas assez mûrs, des baies pourries et des feuilles. À quoi doit servir le tri à la réception ?"
      choices:
        - { text: "Écarter les raisins inaptes et les corps étrangers avant de traiter les raisins retenus", correct: true }
        - { text: "Trier surtout par taille, en gardant les plus grosses baies comme les plus mûres et juteuses", correct: false }
        - { text: "Retirer feuilles et pétioles, puis compter sur le débourbage pour effacer les défauts des raisins", correct: false }
        - { text: "Écarter les baies pourries, puis compter sur l’assemblage avec des lots plus mûrs pour diluer les raisins verts", correct: false }
      explanation: |
        Le tri applique les critères d’acceptation du producteur avant que des
        éléments indésirables passent dans le moût. Écarter les raisins
        insuffisamment mûrs ou altérés limite les goûts indésirables et le
        risque microbien ; feuilles, pétioles et autres débris végétaux sont
        retirés au besoin. Les plus grosses baies ne sont pas forcément les plus
        mûres, les goûts herbacés des raisins verts subsistent même après
        assemblage, et le débourbage retire des bourbes, pas les défauts déjà
        passés dans le jus.

  - id: wine-crushing-operation-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape-processing, crushing]
    status: reviewed
    source_id: c07-0082
    review:
      fact_check: pass
      sources: [oiv]
    en:
      question: Which cellar operation is specifically crushing rather than destemming, draining or pressing?
      choices:
        - { text: "Gently breaking berry skins so must is released and skin-pulp contact increases", correct: true }
        - { text: "Separating berries from their stems before the fruit enters a fermentation vessel", correct: false }
        - { text: "Allowing liquid to flow from crushed fruit before external pressure is applied", correct: false }
        - { text: "Compressing grapes or marc to recover liquid that does not drain freely", correct: false }
      explanation: |
        Crusher rollers are normally adjusted to split skins without
        pulverising seeds or stems. Destemming removes stalks, draining
        collects liquid without pressing, and a press applies force to recover
        additional juice or wine from the solids.
    fr:
      question: "Quelle opération correspond précisément au foulage, et non à l’éraflage, à l’égouttage ou au pressurage ?"
      choices:
        - { text: "Faire éclater doucement la pellicule pour libérer le jus et mettre pulpe et peaux en contact", correct: true }
        - { text: "Séparer les baies de la rafle avant que les raisins entrent dans la cuve de fermentation", correct: false }
        - { text: "Laisser s’écouler le jus des raisins foulés avant d’appliquer une pression extérieure", correct: false }
        - { text: "Comprimer raisins ou marc pour récupérer le liquide qui ne s’écoule pas tout seul", correct: false }
      explanation: |
        Les rouleaux du fouloir sont réglés pour fendre les pellicules sans
        écraser pépins ni rafles. L’éraflage retire les rafles, l’égouttage
        recueille le jus sans pression, et le pressoir applique une force pour
        extraire le jus ou le vin restant dans les parties solides.

  - id: wine-free-run-definition-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape-processing, free-run]
    status: reviewed
    source_id: c07-0083
    review:
      fact_check: pass
      sources: [oiv, industry]
    en:
      question: Which portion is most accurately described as free-run juice during grape processing?
      choices:
        - { text: "Liquid collected as it drains from the grapes or must before pressing", correct: true }
        - { text: "Every drop released inside crushed must whether or not it has been drained", correct: false }
        - { text: "The first liquid expelled after the press begins applying mechanical pressure", correct: false }
        - { text: "The combined liquid from all pressure stages after the press cycle is complete", correct: false }
      explanation: |
        Crushing can release juice and make drainage easier, but the useful
        distinction is whether applied press pressure was needed to collect
        it. Liquid recovered under pressure is press juice and may be kept in
        separate fractions because its composition changes during the cycle.
    fr:
      question: "Que désigne exactement le jus de goutte lors du traitement des raisins ?"
      choices:
        - { text: "Le liquide recueilli par simple écoulement des raisins ou du moût, avant pressurage", correct: true }
        - { text: "Tout le jus libéré dans le moût foulé, qu’il ait été égoutté ou non", correct: false }
        - { text: "Le premier jus expulsé dès que le pressoir commence à exercer une pression", correct: false }
        - { text: "L’ensemble du jus des différentes presses, réuni à la fin du cycle de pressurage", correct: false }
      explanation: |
        Le foulage libère du jus et facilite l’égouttage, mais le critère utile
        est de savoir s’il a fallu une pression pour le recueillir. Le jus
        obtenu sous pression est du jus de presse, souvent séparé en fractions
        car sa composition évolue au fil du cycle.

  - id: wine-pressing-operation-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape-processing, pressing]
    status: reviewed
    source_id: c07-0085
    review:
      fact_check: pass
      sources: [oiv]
    en:
      question: Which operation defines pressing in a winery?
      choices:
        - { text: "Applying controlled force to grapes or marc to separate recoverable liquid from solids", correct: true }
        - { text: "Breaking berry skins so juice and skins can mix before maceration or fermentation", correct: false }
        - { text: "Removing stems from harvested grapes while keeping the berries available for processing", correct: false }
        - { text: "Letting liquid drain from crushed grapes before any compressive force is introduced", correct: false }
      explanation: |
        Before fermentation, pressing can recover must for fermentation away
        from the skins. After a red fermentation on skins, it separates press
        wine from the marc. The timing differs, but controlled compression and
        liquid-solid separation are common to both uses.
    fr:
      question: "Quelle opération définit le pressurage au chai ?"
      choices:
        - { text: "Exercer une force contrôlée sur raisins ou marc pour séparer le liquide des parties solides", correct: true }
        - { text: "Faire éclater les pellicules pour mêler jus et peaux avant macération ou fermentation", correct: false }
        - { text: "Retirer les rafles des raisins vendangés en gardant les baies pour la suite", correct: false }
        - { text: "Laisser s’écouler le jus des raisins foulés avant toute force de compression", correct: false }
      explanation: |
        Avant fermentation, le pressurage fournit un moût qui fermentera sans
        les peaux. Après une fermentation en rouge sur les peaux, il sépare le
        vin de presse du marc. Le moment change, mais la compression contrôlée
        et la séparation liquide-solide sont communes aux deux usages.

  - id: wine-press-fraction-quality-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, grape-processing, pressing, extraction]
    status: reviewed
    source_id: c07-0086
    review:
      fact_check: pass
      sources: [oiv, extension]
    en:
      question: As pressure rises during a press cycle, which practice gives the winemaker the best control over extraction quality?
      choices:
        - { text: "Keep later fractions separate and assess them before deciding whether to blend", correct: true }
        - { text: "Blend fractions continuously and adjust the completed lot only after the press cycle", correct: false }
        - { text: "Set the pressure curve from press capacity and repeat it unchanged for every load", correct: false }
        - { text: "Use recovered volume as the endpoint and assess phenolics after combining the fractions", correct: false }
      explanation: |
        Slow, progressive pressing lets the operator monitor a changing juice
        stream. Later or harder pressings can contain more suspended solids
        and extracted phenolics, including potentially bitter or astringent
        material; seeds are one possible source, not the only concern.
    fr:
      question: "Pendant un cycle de pressurage où la pression monte, quelle pratique permet le mieux de maîtriser la qualité de l’extraction ?"
      choices:
        - { text: "Séparer les dernières fractions et les évaluer avant de décider de les assembler", correct: true }
        - { text: "Assembler les fractions au fil de l’eau et corriger le lot une fois le cycle terminé", correct: false }
        - { text: "Fixer la courbe de pression selon la capacité du pressoir et la répéter pour chaque charge", correct: false }
        - { text: "Arrêter au volume recueilli et mesurer les composés phénoliques une fois les fractions réunies", correct: false }
      explanation: |
        Un pressurage lent et progressif permet de suivre un jus dont la
        composition change. Les dernières presses, plus fortes, peuvent contenir
        plus de bourbes et de composés phénoliques extraits, parfois amers ou
        astringents ; les pépins en sont une source possible, pas la seule.

  - id: wine-vertical-basket-press-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, equipment, pressing]
    status: reviewed
    source_id: c07-0088
    review:
      fact_check: pass
      sources: [industry, aoc-site]
    en:
      question: Which mechanism identifies a traditional vertical basket press?
      choices:
        - { text: "A descending plate compresses fruit in a fixed basket while juice escapes through openings", correct: true }
        - { text: "A lateral membrane inflates inside a closed cylinder and presses fruit against internal drains", correct: false }
        - { text: "Two plates travel along a horizontal screw while a rotating cage breaks up the press cake", correct: false }
        - { text: "A continuous auger drives marc toward an adjustable outlet while liquid drains through a screen", correct: false }
      explanation: |
        The basket supports the grapes while a screw-, lever- or
        hydraulically driven plate applies force from above. The open or
        slotted sides provide a path for the liquid. Traditional vertical
        presses remain in use, including a minority of the press fleet in
        Champagne, alongside modern horizontal designs.
    fr:
      question: "Quel mécanisme caractérise un pressoir vertical traditionnel ?"
      choices:
        - { text: "Un plateau descend et comprime les raisins dans une cage fixe ; le jus s’écoule par les ouvertures", correct: true }
        - { text: "Une membrane latérale se gonfle dans un cylindre fermé et plaque les raisins contre des drains", correct: false }
        - { text: "Deux plateaux avancent sur une vis horizontale pendant qu’une cage rotative émiette le marc", correct: false }
        - { text: "Une vis sans fin pousse le marc vers une sortie réglable, le jus s’égouttant à travers une grille", correct: false }
      explanation: |
        La cage retient les raisins tandis qu’un plateau, actionné par une vis,
        un levier ou un vérin hydraulique, presse par le dessus. Les flancs
        ajourés laissent passer le jus. Les pressoirs verticaux traditionnels
        restent en service, y compris pour une part minoritaire du parc
        champenois, à côté des modèles horizontaux modernes.

  - id: wine-pneumatic-membrane-press-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, equipment, pressing]
    status: reviewed
    source_id: c07-0090
    review:
      fact_check: pass
      sources: [industry, awri]
    en:
      question: A horizontal press uses compressed air and a programmable pressure cycle. Which component normally transmits force to the grapes?
      choices:
        - { text: "An inflatable membrane that pushes the load against drainage surfaces", correct: true }
        - { text: "A descending platen that compresses the load inside a fixed open basket", correct: false }
        - { text: "Opposing rigid plates that travel toward each other along a central screw", correct: false }
        - { text: "A continuous auger that forces the load against a restricted discharge cone", correct: false }
      explanation: |
        Air pressure expands the flexible membrane, compressing the load
        against perforated surfaces or internal drains so liquid can escape.
        Programmed steps allow gradual pressure increases; rotating the drum
        between cycles can loosen and redistribute the press cake.
    fr:
      question: "Un pressoir horizontal fonctionne à l’air comprimé avec un cycle de pression programmé. Quel organe transmet normalement la force aux raisins ?"
      choices:
        - { text: "Une membrane gonflable qui plaque la vendange contre des surfaces drainantes", correct: true }
        - { text: "Un plateau qui descend et comprime la vendange dans une cage fixe et ouverte", correct: false }
        - { text: "Deux plateaux rigides qui se rapprochent le long d’une vis centrale", correct: false }
        - { text: "Une vis sans fin qui force la vendange contre un cône de sortie resserré", correct: false }
      explanation: |
        L’air gonfle la membrane souple, qui comprime la vendange contre des
        parois perforées ou des drains internes pour laisser sortir le jus. Le
        programme fait monter la pression par paliers ; la rotation du tambour
        entre deux serres émiette et redistribue le marc.

  - id: wine-inert-pressing-oxygen-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, pressing, oxygen, protective-winemaking]
    status: reviewed
    source_id: c07-0092
    review:
      fact_check: pass
      sources: [awri, industry]
    en:
      question: A white-wine producer wants to minimise oxygen uptake throughout a pneumatic press cycle. Which setup addresses that aim most directly?
      choices:
        - { text: "Purge the closed press and admit or recycle inert gas as the membrane deflates", correct: true }
        - { text: "Close the press and dose SO₂ in the juice tray, with air entering at each deflation", correct: false }
        - { text: "Blanket the loaded fruit with dry ice, then run a standard air cycle in the closed press", correct: false }
        - { text: "Purge the press with CO₂ before loading, then run a standard cycle with air on deflation", correct: false }
      explanation: |
        A closed vessel makes its atmosphere controllable, but closure alone
        does not remove oxygen. An inert cycle prevents ambient air from being
        drawn in during membrane deflation and cake redistribution. SO₂ in
        the tray, dry ice on the load or a purge before loading all help, but
        each still lets air in at every deflation.
    fr:
      question: "Un producteur de blanc veut limiter l’apport d’oxygène pendant tout un cycle de pressoir pneumatique. Quelle installation répond le plus directement à cet objectif ?"
      choices:
        - { text: "Purger le pressoir fermé et faire entrer ou recycler un gaz inerte quand la membrane se dégonfle", correct: true }
        - { text: "Fermer le pressoir et sulfiter le jus dans le bac, l’air entrant à chaque dégonflage", correct: false }
        - { text: "Couvrir la vendange chargée de neige carbonique, puis lancer un cycle standard à l’air", correct: false }
        - { text: "Purger au CO₂ avant le chargement, puis lancer un cycle standard avec entrée d’air au dégonflage", correct: false }
      explanation: |
        Un pressoir fermé permet de maîtriser son atmosphère, mais la fermeture
        seule n’élimine pas l’oxygène. Un cycle sous gaz inerte empêche l’air
        ambiant d’être aspiré quand la membrane se dégonfle et que le marc est
        redistribué. SO₂ dans le bac, neige carbonique sur la vendange ou purge
        avant chargement aident, mais chacun laisse encore entrer l’air à chaque
        dégonflage.

  - id: wine-grape-must-definition-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, must, terminology]
    status: reviewed
    source_id: c07-0097
    review:
      fact_check: pass
      sources: [oiv]
    en:
      question: Which material is grape must in precise winemaking terminology?
      choices:
        - { text: "Liquid obtained from fresh grapes spontaneously or by crushing, draining or pressing", correct: true }
        - { text: "Young wine that has completed alcoholic fermentation but not malolactic conversion", correct: false }
        - { text: "The solid skins, seeds and stems left after juice or wine has been pressed off", correct: false }
        - { text: "Finished wine held before bottling after fermentation and maturation are complete", correct: false }
      explanation: |
        Must is the liquid product of fresh grapes before it becomes wine
        through alcoholic fermentation. It may be cloudy and contain suspended
        solids; clarity is not part of the definition. The solid residue from
        pressing is marc rather than must.
    fr:
      question: "Qu’appelle-t-on précisément moût de raisin en vinification ?"
      choices:
        - { text: "Le liquide tiré de raisins frais, par écoulement naturel, foulage, égouttage ou pressurage", correct: true }
        - { text: "Un vin jeune qui a fini sa fermentation alcoolique mais pas sa malolactique", correct: false }
        - { text: "Les peaux, pépins et rafles qui restent après le pressurage du jus ou du vin", correct: false }
        - { text: "Le vin fini conservé avant mise en bouteille, fermentation et élevage terminés", correct: false }
      explanation: |
        Le moût est le produit liquide du raisin frais, avant que la
        fermentation alcoolique n’en fasse du vin. Il peut être trouble et
        chargé de bourbes : la limpidité ne fait pas partie de la définition. Le
        résidu solide du pressurage est le marc, pas le moût.

  - id: wine-must-weight-meaning-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, must, sugar, analysis]
    status: reviewed
    source_id: c07-0098
    review:
      fact_check: pass
      sources: [extension, oiv]
    en:
      question: What does a must-weight measurement most directly indicate before fermentation?
      choices:
        - { text: "Dissolved solids, chiefly sugar, used to estimate potential alcohol", correct: true }
        - { text: "Phenolic ripeness of skins and seeds, used to time the harvest", correct: false }
        - { text: "Yeast-assimilable nitrogen in the juice, used to plan nutrient additions", correct: false }
        - { text: "Titratable acidity of the juice, used to plan any acid adjustment", correct: false }
      explanation: |
        Density or refractive-index scales such as Baumé, Oechsle and Brix
        provide related ways to assess must concentration. Because substances
        other than sugar also contribute to the reading and fermentation yield
        varies, potential alcohol is an estimate, not a guarantee of final
        alcohol or residual sugar. Phenolic ripeness, nitrogen and acidity
        each need their own analysis.
    fr:
      question: "Qu’indique le plus directement la mesure de la densité d’un moût avant fermentation ?"
      choices:
        - { text: "Les matières dissoutes, surtout le sucre, pour estimer le degré potentiel", correct: true }
        - { text: "La maturité phénolique des peaux et des pépins, pour fixer la date de vendange", correct: false }
        - { text: "L’azote assimilable du jus, pour prévoir les apports nutritifs des levures", correct: false }
        - { text: "L’acidité titrable du jus, pour prévoir une éventuelle correction d’acidité", correct: false }
      explanation: |
        Les échelles fondées sur la densité ou la réfractométrie, comme le
        Baumé, l’Oechsle ou le Brix, mesurent toutes la concentration du moût.
        Comme d’autres substances que le sucre pèsent sur la lecture et que le
        rendement de la fermentation varie, le degré potentiel reste une
        estimation, pas une garantie du degré final ni du sucre résiduel.
        Maturité phénolique, azote et acidité demandent chacun leur propre
        analyse.

  - id: wine-enrichment-purpose-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, must, enrichment]
    status: reviewed
    source_id: c07-0099
    review:
      fact_check: pass
      sources: [oiv, regulation]
    en:
      question: Where enrichment is permitted, why might a producer add an authorised sugar source such as rectified concentrated grape must before or during fermentation?
      choices:
        - { text: "To raise the must's fermentable sugar and therefore its potential alcohol", correct: true }
        - { text: "To guarantee residual sweetness while leaving potential alcohol unchanged", correct: false }
        - { text: "To reduce total acidity by diluting the must with a neutral syrup", correct: false }
        - { text: "To fortify the must by adding alcohol that has already been distilled", correct: false }
      explanation: |
        Yeast can convert the added fermentable sugar into alcohol, so
        enrichment is not the same operation as sweetening a finished wine.
        Permitted products, timing and maximum increases depend on the relevant
        jurisdiction and appellation; rectified concentrated grape must is one
        possible authorised material, not a universal requirement.
    fr:
      question: "Là où l’enrichissement est autorisé, pourquoi un producteur ajouterait-il au moût une source de sucre permise, comme le moût concentré rectifié, avant ou pendant la fermentation ?"
      choices:
        - { text: "Pour augmenter le sucre fermentescible du moût, donc son degré potentiel", correct: true }
        - { text: "Pour garantir une douceur résiduelle sans modifier le degré potentiel", correct: false }
        - { text: "Pour baisser l’acidité totale en diluant le moût avec un sirop neutre", correct: false }
        - { text: "Pour muter le moût en lui ajoutant de l’alcool déjà distillé", correct: false }
      explanation: |
        Les levures transforment le sucre ajouté en alcool : l’enrichissement
        n’est donc pas l’édulcoration d’un vin fini. Les produits permis, le
        moment et la hausse maximale dépendent de la réglementation et de
        l’appellation ; le moût concentré rectifié (MCR) est un produit
        possible, pas une obligation générale.

  - id: wine-rcgm-definition-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, must, enrichment, rcgm]
    status: reviewed
    source_id: c07-0100
    review:
      fact_check: pass
      sources: [oiv, regulation]
    en:
      question: Which description best identifies rectified concentrated grape must (RCGM)?
      choices:
        - { text: "Grape-must concentrate purified of much non-sugar material to supply grape-derived sugar", correct: true }
        - { text: "Ordinary concentrated must retaining its broader acid, mineral and flavour composition", correct: false }
        - { text: "Fresh unfermented must reserved for later sweetening without concentration or rectification", correct: false }
        - { text: "Neutral grape spirit distilled to high strength and intended for fortification", correct: false }
      explanation: |
        Rectification includes deacidification and removal of constituents
        other than sugar, producing a highly concentrated grape-derived sugar
        ingredient with limited non-sugar character. It may be used for
        enrichment where authorised. Formal specifications allow liquid and,
        in some regulations, crystallised forms, so colourless and odourless
        are not safe universal definitions.
    fr:
      question: "Quelle description correspond au moût concentré rectifié (MCR) ?"
      choices:
        - { text: "Un moût concentré débarrassé d’une grande partie de ses non-sucres, qui apporte un sucre de raisin", correct: true }
        - { text: "Un moût concentré ordinaire qui garde ses acides, ses minéraux et ses arômes", correct: false }
        - { text: "Un moût frais non fermenté, gardé pour édulcorer plus tard sans concentration ni rectification", correct: false }
        - { text: "Une eau-de-vie de raisin neutre, distillée à haut degré et destinée au mutage", correct: false }
      explanation: |
        La rectification comprend une désacidification et l’élimination des
        constituants autres que le sucre ; on obtient un sucre de raisin très
        concentré, au caractère propre limité, utilisable pour l’enrichissement
        là où c’est permis. Les définitions officielles admettent une forme
        liquide et, dans certaines réglementations, cristallisée : « incolore et
        inodore » n’est donc pas un critère universel sûr.

  - id: wine-over-enrichment-balance-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, must, enrichment, balance]
    status: reviewed
    source_id: c07-0103
    review:
      fact_check: pass
      sources: [regulation, extension]
    en:
      question: A modestly flavoured must is enriched aggressively with sucrose. If the extra sugar ferments, which imbalance is most plausible?
      choices:
        - { text: "Alcohol rises without a matching increase in fruit, acid or phenolic concentration", correct: true }
        - { text: "Alcohol rises, and fruit and phenolics concentrate slightly because sucrose adds extract", correct: false }
        - { text: "Alcohol rises, but extra glycerol and esters usually restore balance with the fruit", correct: false }
        - { text: "Alcohol rises, but acidity climbs with it as yeast make more acid from the added sugar", correct: false }
      explanation: |
        Added sucrose supplies fermentable sugar rather than concentrating the
        must's existing non-sugar constituents. If potential alcohol is raised
        beyond what the fruit can support, the finished wine may seem hot,
        dilute or structurally unbalanced. A little extra glycerol or
        fermentation acid does not offset the added heat, and fermented
        sucrose leaves no extract behind. This is a risk, not an inevitable
        outcome at every permitted enrichment level.
    fr:
      question: "Un moût peu concentré en arômes est fortement chaptalisé. Si ce sucre ajouté fermente, quel déséquilibre est le plus probable ?"
      choices:
        - { text: "L’alcool monte sans hausse correspondante du fruit, de l’acidité ou des composés phénoliques", correct: true }
        - { text: "L’alcool monte, et fruit et composés phénoliques se concentrent un peu, le saccharose apportant de l’extrait", correct: false }
        - { text: "L’alcool monte, mais le surplus de glycérol et d’esters rétablit en général l’équilibre avec le fruit", correct: false }
        - { text: "L’alcool monte, mais l’acidité suit, les levures tirant davantage d’acides du sucre ajouté", correct: false }
      explanation: |
        Le saccharose apporte du sucre fermentescible sans concentrer les autres
        constituants du moût. Si le degré potentiel dépasse ce que le raisin
        peut porter, le vin fini risque de paraître chaud, dilué ou
        déséquilibré. Un peu plus de glycérol ou d’acides de fermentation ne
        compense pas cette chaleur, et le saccharose fermenté ne laisse pas
        d’extrait. C’est un risque, pas une fatalité à chaque niveau
        d’enrichissement autorisé.

  - id: wine-chaptalisation-definition-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, must, enrichment, chaptalisation]
    status: reviewed
    source_id: c07-0104
    review:
      fact_check: pass
      sources: [regulation, government]
    en:
      question: Which operation is specifically chaptalisation where the practice is authorised?
      choices:
        - { text: "Adding sucrose before or during fermentation to raise potential alcohol", correct: true }
        - { text: "Adding rectified concentrated grape must to raise potential alcohol", correct: false }
        - { text: "Removing water from must by reverse osmosis to concentrate its sugars", correct: false }
        - { text: "Adding grape spirit to arrest fermentation and retain residual sugar", correct: false }
      explanation: |
        Chaptalisation is enrichment by added sucrose, normally intended to be
        fermented rather than retained as sweetness. RCGM addition and must
        concentration can also enrich a must, but they are distinct methods;
        adding spirit is fortification. Permission and limits vary by place
        and wine category.
    fr:
      question: "Là où elle est autorisée, quelle opération est précisément la chaptalisation ?"
      choices:
        - { text: "Ajouter du saccharose avant ou pendant la fermentation pour augmenter le degré potentiel", correct: true }
        - { text: "Ajouter du moût concentré rectifié pour augmenter le degré potentiel", correct: false }
        - { text: "Retirer de l’eau du moût par osmose inverse pour en concentrer les sucres", correct: false }
        - { text: "Ajouter de l’eau-de-vie de raisin pour arrêter la fermentation et garder du sucre", correct: false }
      explanation: |
        La chaptalisation est un enrichissement par ajout de saccharose, destiné
        à fermenter et non à rester sous forme de douceur. L’ajout de MCR et la
        concentration du moût enrichissent aussi, mais ce sont des méthodes
        distinctes ; l’ajout d’alcool relève du mutage. L’autorisation et les
        limites varient selon le lieu et la catégorie de vin.

  - id: wine-must-water-removal-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, must, enrichment, concentration]
    status: reviewed
    source_id: c07-0105
    review:
      fact_check: pass
      sources: [oiv, regulation]
    en:
      question: Which outcome should a producer expect when must is enriched by partial water removal?
      choices:
        - { text: "Lower volume and greater concentration of sugar and other retained constituents", correct: true }
        - { text: "Lower volume and selective sugar concentration, with acids and phenolics unchanged", correct: false }
        - { text: "Lower volume and selective acid concentration, with fermentable sugar unchanged", correct: false }
        - { text: "Lower volume and an immediate rise in actual alcohol before fermentation begins", correct: false }
      explanation: |
        Techniques such as reverse osmosis can remove part of the water and
        thereby raise sugar concentration and potential alcohol. They also
        reduce saleable volume and concentrate other retained components,
        desirable or otherwise. This is itself an enrichment method where
        authorised, not an alternative outside the concept of enrichment.
    fr:
      question: "Que doit attendre un producteur qui enrichit un moût en lui retirant une partie de son eau ?"
      choices:
        - { text: "Moins de volume et une concentration accrue du sucre et des autres constituants restants", correct: true }
        - { text: "Moins de volume et une concentration du seul sucre, acides et composés phénoliques inchangés", correct: false }
        - { text: "Moins de volume et une concentration des seuls acides, sucre fermentescible inchangé", correct: false }
        - { text: "Moins de volume et une hausse immédiate de l’alcool acquis avant toute fermentation", correct: false }
      explanation: |
        Des techniques comme l’osmose inverse retirent une partie de l’eau et
        augmentent ainsi la teneur en sucre et le degré potentiel. Elles
        réduisent aussi le volume vendable et concentrent les autres composants
        retenus, souhaitables ou non. Là où elle est autorisée, c’est bien une
        méthode d’enrichissement, pas une alternative extérieure à celui-ci.

  - id: wine-dealcoholisation-techniques-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, alcohol, dealcoholisation]
    status: reviewed
    source_id: c07-0108
    review:
      fact_check: pass
      sources: [oiv, regulation]
    en:
      question: Which family of treatments can directly reduce ethanol in a finished wine?
      choices:
        - { text: "Membrane separation, partial vacuum evaporation or distillation", correct: true }
        - { text: "Cold stabilisation, centrifugation or sterile filtration", correct: false }
        - { text: "Tartaric acid addition, ion exchange or malolactic conversion", correct: false }
        - { text: "Protein fining, lees racking or tartrate crystallisation", correct: false }
      explanation: |
        Dealcoholisation separates ethanol from wine; depending on the process,
        a treated portion may be recombined with untreated wine to reach the
        target. Technique approval, permitted reduction and the product name
        depend on the applicable rules, and skilled operation is needed to
        limit loss of aroma or other sensory changes.
    fr:
      question: "Quelle famille de traitements peut réduire directement l’éthanol d’un vin fini ?"
      choices:
        - { text: "Séparation membranaire, évaporation sous vide partiel ou distillation", correct: true }
        - { text: "Stabilisation tartrique par le froid, centrifugation ou filtration stérile", correct: false }
        - { text: "Ajout d’acide tartrique, échange d’ions ou fermentation malolactique", correct: false }
        - { text: "Collage des protéines, soutirage des lies ou précipitation du tartre", correct: false }
      explanation: |
        La désalcoolisation sépare l’éthanol du vin ; selon le procédé, une
        fraction traitée peut être réassemblée avec du vin non traité pour
        atteindre la cible. Les techniques admises, la baisse permise et la
        dénomination du produit dépendent des règles applicables, et un vrai
        savoir-faire est nécessaire pour limiter la perte d’arômes ou d’autres
        modifications sensorielles.

  - id: wine-chemical-acidification-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, acid, adjustment]
    status: reviewed
    source_id: c07-0109
    review:
      fact_check: pass
      sources: [oiv, regulation]
    en:
      question: A must has insufficient acidity for the intended wine. Which chemical-acidification plan is most defensible?
      choices:
        - { text: "Trial an authorised organic acid, often tartaric, while monitoring pH, acidity and taste", correct: true }
        - { text: "Add last vintage's tartaric dose to the tank, then check acidity after fermentation", correct: false }
        - { text: "Bench-trial citric acid as the main must acidulant, monitoring pH and taste", correct: false }
        - { text: "Induce malolactic conversion first, since it raises titratable acidity in low-acid musts", correct: false }
      explanation: |
        Chemical acidification raises titratable acidity and normally lowers
        pH. Tartaric acid is common, but OIV practice also recognises specified
        organic acids for particular products; local law and appellation rules
        may be narrower. Bench trials matter because identical additions can
        produce different pH and sensory responses in different musts. Citric
        acid is mainly a tightly limited stabilising additive, and lactic
        bacteria can turn it into acetic acid and diacetyl; MLF lowers acidity.
    fr:
      question: "Un moût manque d’acidité pour le vin visé. Quel plan d’acidification est le plus défendable ?"
      choices:
        - { text: "Faire des essais avec un acide organique autorisé, souvent tartrique, en suivant pH, acidité et goût", correct: true }
        - { text: "Reprendre la dose de tartrique du millésime précédent, puis contrôler l’acidité après fermentation", correct: false }
        - { text: "Essayer l’acide citrique comme acidifiant principal du moût, en suivant pH et goût", correct: false }
        - { text: "Lancer d’abord la malolactique, qui relève l’acidité titrable des moûts peu acides", correct: false }
      explanation: |
        L’acidification augmente l’acidité titrable et fait normalement baisser
        le pH. L’acide tartrique est le plus courant, mais l’OIV admet d’autres
        acides organiques précis pour certains produits ; la loi locale et
        l’appellation peuvent être plus restrictives. Les essais en laboratoire
        comptent, car un même ajout peut donner un pH et un goût différents d’un
        moût à l’autre. L’acide citrique sert surtout d’additif de
        stabilisation, en faible dose, et les bactéries lactiques peuvent le
        transformer en acide acétique et en diacétyle ; la malolactique, elle,
        baisse l’acidité.

  - id: wine-chemical-deacidification-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, acid, adjustment, deacidification]
    status: reviewed
    source_id: c07-0111
    review:
      fact_check: pass
      sources: [oiv]
    en:
      question: A wine is too acidic, and local rules allow chemical deacidification. Which trial plan best controls the adjustment?
      choices:
        - { text: "Bench-trial an authorised carbonate or bicarbonate salt, then recheck TA, pH and stability", correct: true }
        - { text: "Dose calcium carbonate from pH alone, then bottle before delayed precipitation is assessed", correct: false }
        - { text: "Bench-trial a salt to reach the target TA, then also run MLF on the treated wine", correct: false }
        - { text: "Bench-trial a salt, then treat the whole lot at double the dose to allow for precipitation", correct: false }
      explanation: |
        OIV practice recognises specified materials such as potassium hydrogen
        carbonate, neutral potassium tartrate and calcium carbonate; the
        permitted choices and limits may be narrower locally. These treatments
        lower titratable acidity and raise pH, often through salt precipitation.
        Bench trials and follow-up checks help avoid overcorrection and account
        for the wine's buffering, delayed precipitation and any later
        malolactic conversion.
    fr:
      question: "Un vin est trop acide et la réglementation locale autorise la désacidification chimique. Quel plan d’essai encadre le mieux la correction ?"
      choices:
        - { text: "Essayer en laboratoire un carbonate ou bicarbonate autorisé, puis recontrôler acidité, pH et stabilité", correct: true }
        - { text: "Doser le carbonate de calcium d’après le seul pH, puis mettre en bouteille avant toute précipitation tardive", correct: false }
        - { text: "Essayer un sel jusqu’à l’acidité titrable visée, puis faire aussi la malolactique sur le vin traité", correct: false }
        - { text: "Essayer un sel en laboratoire, puis traiter tout le lot à double dose pour compenser les précipitations", correct: false }
      explanation: |
        L’OIV reconnaît des produits précis comme le bicarbonate de potassium,
        le tartrate neutre de potassium et le carbonate de calcium ; les choix
        permis et les limites peuvent être plus étroits localement. Ces
        traitements baissent l’acidité titrable et font monter le pH, souvent
        par précipitation de sels. Essais et contrôles de suivi évitent de trop
        corriger et tiennent compte du pouvoir tampon du vin, des précipitations
        tardives et d’une éventuelle malolactique, qui baisserait encore
        l’acidité.

  - id: wine-saccharomyces-completes-fermentation-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation, yeast]
    status: reviewed
    source_id: c07-0114
    review:
      fact_check: pass
      sources: [extension, awri]
    en:
      question: A grape must begins fermenting with several yeast species, but one commonly completes alcoholic fermentation as ethanol rises. Which is it?
      choices:
        - { text: "Hanseniaspora uvarum", correct: false }
        - { text: "Saccharomyces cerevisiae", correct: true }
        - { text: "Metschnikowia pulcherrima", correct: false }
        - { text: "Pichia membranifaciens", correct: false }
      explanation: |
        Several non-*Saccharomyces* yeasts can be numerous early in a spontaneous
        fermentation, but many decline as ethanol accumulates. *S. cerevisiae*
        commonly completes the sugar conversion because wine strains combine
        strong fermentative ability with relative tolerance of ethanol and
        normal cellar SO₂ levels. Some non-*Saccharomyces* strains persist, so
        this is a common succession rather than an absolute monopoly.
    fr:
      question: "Un moût commence à fermenter avec plusieurs espèces de levures, mais l’une d’elles achève le plus souvent la fermentation alcoolique à mesure que l’alcool monte. Laquelle ?"
      choices:
        - { text: "Hanseniaspora uvarum", correct: false }
        - { text: "Saccharomyces cerevisiae", correct: true }
        - { text: "Metschnikowia pulcherrima", correct: false }
        - { text: "Pichia membranifaciens", correct: false }
      explanation: |
        Plusieurs levures non-*Saccharomyces* peuvent être nombreuses au début
        d’une fermentation spontanée, mais beaucoup déclinent quand l’éthanol
        s’accumule. *S. cerevisiae* termine le plus souvent la transformation
        des sucres, car les souches œnologiques allient un fort pouvoir
        fermentaire à une bonne tolérance à l’éthanol et aux doses habituelles
        de SO₂. Certaines non-*Saccharomyces* persistent : c’est une succession
        fréquente, pas un monopole absolu.

  - id: wine-dry-fermentation-completion-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation, monitoring]
    status: reviewed
    source_id: c07-0116
    review:
      fact_check: pass
      sources: [awri, extension]
    en:
      question: Fermentation activity has become quiet. Which evidence best supports normal dry completion rather than a stuck ferment?
      choices:
        - { text: "Glucose and fructose are at the intended dry endpoint, with the fermentation curve complete", correct: true }
        - { text: "Density has been stable for two days, though glucose and fructose have not been analysed", correct: false }
        - { text: "The hydrometer reads about 0.995, a typical dry value, though sugar has not been measured", correct: false }
        - { text: "The estimated potential alcohol was reached, although residual sugar was not measured", correct: false }
      explanation: |
        A ferment is dry when fermentable sugar has fallen to the producer's
        verified dry endpoint, not merely when activity stops. A stable density
        can also mean a stuck ferment, and a reading near 0.995 depends on
        alcohol and extract as well as sugar, so neither proves the sugar is
        gone; nor does an alcohol estimate. Only a glucose and fructose analysis
        separates a dry wine from a sluggish or stuck one, which risks a later
        restart.
    fr:
      question: "La fermentation est devenue silencieuse. Quel indice montre le mieux qu’elle s’est achevée normalement à sec, et non qu’elle est bloquée ?"
      choices:
        - { text: "Glucose et fructose sont au seuil visé pour un vin sec, et la courbe de fermentation est complète", correct: true }
        - { text: "La densité ne bouge plus depuis deux jours, mais glucose et fructose n’ont pas été dosés", correct: false }
        - { text: "Le densimètre indique environ 0,995, valeur typique d’un vin sec, sans dosage des sucres", correct: false }
        - { text: "Le degré potentiel estimé est atteint, mais le sucre résiduel n’a pas été mesuré", correct: false }
      explanation: |
        Une fermentation est sèche quand le sucre fermentescible est descendu au
        seuil vérifié par le producteur, pas simplement quand l’activité cesse.
        Une densité stable peut aussi signaler une fermentation bloquée, et une
        lecture vers 0,995 dépend de l’alcool et de l’extrait autant que du
        sucre : ni l’une ni l’autre ne prouve que le sucre a disparu, pas plus
        qu’une estimation du degré. Seul un dosage du glucose et du fructose
        distingue un vin sec d’une fermentation languissante ou bloquée, qui
        risque de repartir plus tard.

  - id: wine-stuck-fermentation-risk-cluster-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation, yeast, troubleshooting]
    status: reviewed
    source_id: c07-0117
    review:
      fact_check: pass
      sources: [extension, awri]
    en:
      question: A high-sugar must with marginal YAN stops late after repeated temperature swings, with substantial sugar remaining. Which response is most defensible?
      choices:
        - { text: "Review sugar, ethanol, temperature history, nutrients and yeast viability before an acclimatised restart", correct: true }
        - { text: "Check sugar, ethanol and yeast viability, then add a large DAP dose to the stuck wine and warm it", correct: false }
        - { text: "Review sugar, nutrients and viability, then chill the tank hard to rest the yeast before restarting", correct: false }
        - { text: "Pitch an ethanol-tolerant yeast directly into the wine, then correct nutrients if the restart slows", correct: false }
      explanation: |
        Very concentrated must can impose osmotic stress at the start, while
        inadequate yeast-assimilable nitrogen and unstable temperature can
        weaken the population. By late fermentation, rising ethanol makes sugar
        uptake and nutrient assimilation harder. A restart therefore begins
        with diagnosis and a healthy yeast population acclimatised gradually to
        the stuck wine, rather than a single-factor correction or direct pitching.
        Late DAP is poorly used in a high-ethanol wine, and hard chilling
        weakens a stressed population further. Temperature limits depend on
        strain and conditions, not one universal cutoff.
    fr:
      question: "Un moût très sucré, limite en azote assimilable, s’arrête en fin de fermentation après plusieurs écarts de température, avec encore beaucoup de sucre. Quelle réponse est la plus défendable ?"
      choices:
        - { text: "Revoir sucre et alcool, historique des températures, apports d’azote et viabilité des levures avant une relance acclimatée", correct: true }
        - { text: "Contrôler sucre, alcool et viabilité des levures, puis ajouter une forte dose de DAP au vin bloqué et le réchauffer", correct: false }
        - { text: "Revoir sucre, azote et viabilité, puis refroidir fortement la cuve pour faire reposer les levures avant la relance", correct: false }
        - { text: "Ensemencer directement le vin avec une levure tolérante à l’alcool, puis corriger l’azote si la reprise ralentit", correct: false }
      explanation: |
        Un moût très concentré impose un stress osmotique au départ, tandis
        qu’un manque d’azote assimilable et des températures instables
        affaiblissent la population. En fin de fermentation, l’alcool qui monte
        gêne l’absorption des sucres et de l’azote. Une relance commence donc
        par un diagnostic, puis par un pied de cuve sain acclimaté peu à peu au
        vin bloqué, plutôt que par la correction d’un seul facteur ou un
        levurage direct. Un DAP tardif est mal utilisé dans un vin riche en
        alcool, et un froid brutal affaiblit encore une population stressée. Les
        limites de température dépendent de la souche et des conditions, pas
        d’un seuil universel.

  - id: wine-arrest-fermentation-stability-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation, residual-sugar, stability]
    status: reviewed
    source_id: c07-0119
    review:
      fact_check: pass
      sources: [awri, oiv]
    en:
      question: A producer wants residual sugar in an unfortified wine and needs to minimise the risk of fermentation restarting. Which sequence is most robust?
      choices:
        - { text: "Chill promptly, sterile-filter out the yeast, then manage SO₂ and microbial stability", correct: true }
        - { text: "Chill and add SO₂, then pass the wine through a coarse filter before bottling", correct: false }
        - { text: "Rack once from gross lees at fermentation temperature, then rely on natural settling", correct: false }
        - { text: "Chill, rack off the lees and add potassium sorbate alone before bottling", correct: false }
      explanation: |
        Chilling suppresses yeast activity so the wine can be clarified and
        filtered; it does not by itself guarantee that the cells are dead.
        Removing viable yeast and verifying microbiological stability are
        crucial when fermentable sugar remains, with SO₂ used as supporting
        protection rather than a reliable stand-alone kill step. A coarse
        filter does not retain yeast cells, and sorbate inhibits but does not
        remove a live population. Fortification
        can instead arrest a ferment by raising alcohol, but that produces a
        fortified style and is subject to its own rules.
    fr:
      question: "Un producteur veut du sucre résiduel dans un vin non muté et doit limiter le risque de refermentation. Quelle séquence est la plus sûre ?"
      choices:
        - { text: "Refroidir vite, éliminer les levures par filtration stérile, puis gérer SO₂ et stabilité microbienne", correct: true }
        - { text: "Refroidir et sulfiter, puis passer le vin sur un filtre grossier avant la mise", correct: false }
        - { text: "Soutirer une fois des grosses lies à température de fermentation, puis compter sur la décantation naturelle", correct: false }
        - { text: "Refroidir, soutirer les lies et ajouter du sorbate de potassium seul avant la mise", correct: false }
      explanation: |
        Le froid freine les levures pour qu’on puisse clarifier et filtrer le
        vin, mais il ne garantit pas leur mort. Éliminer les levures viables et
        vérifier la stabilité microbiologique est essentiel quand il reste du
        sucre fermentescible ; le SO₂ sert de protection d’appoint, pas d’étape
        de destruction fiable à lui seul. Un filtre grossier ne retient pas les
        levures, et le sorbate freine une population vivante sans l’éliminer. Le
        mutage arrête aussi la fermentation en augmentant l’alcool, mais il
        donne un vin muté, soumis à ses propres règles.

  - id: wine-yeast-strategy-tradeoff-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation, yeast, inoculation]
    status: reviewed
    source_id: c07-0123
    review:
      fact_check: pass
      sources: [awri, extension]
    en:
      question: Which statement best compares an uninoculated alcoholic fermentation with one started by a selected yeast culture?
      choices:
        - { text: "Uninoculated ferments have a less predictable succession; selected starters improve control but can still shape aroma", correct: true }
        - { text: "Uninoculated ferments start with more species, so they finish as dependably as inoculated ones", correct: false }
        - { text: "Selected starters improve completion by removing resident yeasts before the inoculated strain begins fermenting", correct: false }
        - { text: "Selected starters standardise the inoculum, so strain choice has little effect on flavour or fermentation behaviour", correct: false }
      explanation: |
        An uninoculated must can begin with several resident non-*Saccharomyces*
        and *Saccharomyces* strains, then change population as fermentation
        progresses. This may produce a distinctive result, but complexity is not
        guaranteed and the unknown succession can increase variation or the risk
        of volatile acidity, ethyl acetate and sluggish completion. A selected
        starter gives a known initial population and more control, while strain
        choice can still influence kinetics and sensory profile.
    fr:
      question: "Comment comparer une fermentation alcoolique spontanée et une fermentation lancée avec une levure sélectionnée ?"
      choices:
        - { text: "La spontanée suit une succession moins prévisible ; la levure sélectionnée donne plus de maîtrise mais marque encore les arômes", correct: true }
        - { text: "La fermentation spontanée démarre avec plus d’espèces, si bien qu’elle s’achève aussi sûrement qu’une fermentation levurée", correct: false }
        - { text: "La levure sélectionnée assure l’achèvement en éliminant les levures indigènes avant de commencer à fermenter", correct: false }
        - { text: "La levure sélectionnée standardise l’inoculum, si bien que le choix de souche influe peu sur le goût ou la cinétique", correct: false }
      explanation: |
        Un moût non levuré peut démarrer avec plusieurs souches indigènes,
        *Saccharomyces* ou non, dont la population change au fil de la
        fermentation. Le résultat peut être singulier, mais la complexité n’est
        pas garantie, et une succession inconnue augmente la variabilité ou le
        risque d’acidité volatile, d’acétate d’éthyle et de fin de fermentation
        languissante. Un levurage sélectionné donne une population de départ
        connue et plus de maîtrise, mais le choix de la souche influence encore
        la cinétique et le profil aromatique.

  - id: wine-selected-mixed-yeast-strategy-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation, yeast, inoculation]
    status: reviewed
    source_id: c07-0126
    review:
      fact_check: pass
      sources: [extension, awri]
    en:
      question: A producer wants a controlled inoculation and a planned contribution from non-Saccharomyces yeast. Which approach is technically coherent?
      choices:
        - { text: "Use compatible selected non-Saccharomyces and S. cerevisiae cultures together or sequentially, then monitor completion", correct: true }
        - { text: "Inoculate selected non-Saccharomyces alone, then wait for a spontaneous S. cerevisiae population if it slows", correct: false }
        - { text: "Establish S. cerevisiae dominance first, then add selected non-Saccharomyces near dryness for its main contribution", correct: false }
        - { text: "Co-inoculate both cultures, then add SO₂ to favour the non-Saccharomyces as ethanol rises", correct: false }
      explanation: |
        Commercial wine cultures are not limited to a single
        *S. cerevisiae* strain. Selected non-*Saccharomyces* yeasts may be
        co-inoculated with *S. cerevisiae* or added first in a planned sequence,
        allowing a producer to seek a sensory contribution while retaining a
        route to reliable completion. Compatibility, nutrient use and timing
        matter because strains can inhibit or outcompete one another; SO₂
        generally restrains non-*Saccharomyces* yeasts more than *S. cerevisiae*.
    fr:
      question: "Un producteur veut un levurage maîtrisé et un apport voulu de levures non-*Saccharomyces*. Quelle démarche est techniquement cohérente ?"
      choices:
        - { text: "Associer des cultures sélectionnées non-Saccharomyces et S. cerevisiae compatibles, ensemble ou à la suite, puis suivre l’achèvement", correct: true }
        - { text: "Ensemencer seulement des non-Saccharomyces sélectionnées, puis attendre une population spontanée de S. cerevisiae en cas de ralentissement", correct: false }
        - { text: "Installer d’abord S. cerevisiae, puis ajouter des non-Saccharomyces sélectionnées près de la fin pour leur apport principal", correct: false }
        - { text: "Co-ensemencer les deux cultures, puis sulfiter pour favoriser les non-Saccharomyces quand l’alcool monte", correct: false }
      explanation: |
        Les cultures œnologiques du commerce ne se limitent pas à une souche de
        *S. cerevisiae*. Des non-*Saccharomyces* sélectionnées peuvent être
        co-ensemencées avec *S. cerevisiae* ou ajoutées en premier selon une
        séquence prévue : le producteur cherche un apport aromatique tout en
        gardant une voie fiable vers la fin de fermentation. Compatibilité,
        consommation de nutriments et calendrier comptent, car les souches
        peuvent s’inhiber ou se supplanter ; le SO₂ freine en général davantage
        les non-*Saccharomyces* que *S. cerevisiae*.

  - id: wine-cool-fermentation-aroma-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation, temperature, aroma]
    status: reviewed
    source_id: c07-0129
    review:
      fact_check: pass
      sources: [university, awri]
    en:
      question: A producer wants to retain volatile fruit and floral aromas in an aromatic white without creating a sluggish ferment. Which temperature plan best fits?
      choices:
        - { text: "Ferment cool within the yeast's working range, adjusting if activity slows", correct: true }
        - { text: "Ferment below the yeast's working range to protect aromas, then warm at the end", correct: false }
        - { text: "Ferment at a moderate temperature typical of reds, to finish quickly and cleanly", correct: false }
        - { text: "Let the temperature rise with fermentation, then cool once the sugar is used up", correct: false }
      explanation: |
        Cooler fermentation slows yeast metabolism and reduces the loss of some
        volatile compounds, which can help preserve an aromatic white's fresh
        fruit and floral character. The target must still suit the yeast strain
        and the must: excessive cooling can delay the start or produce a sluggish
        ferment. Temperature is therefore monitored as both a style lever and a
        control on fermentation health and rate.
    fr:
      question: "Un producteur veut garder les arômes fruités et floraux volatils d’un blanc aromatique sans provoquer de fermentation languissante. Quel plan de température choisir ?"
      choices:
        - { text: "Fermenter au frais dans la plage de travail de la levure, en corrigeant si l’activité ralentit", correct: true }
        - { text: "Fermenter sous la plage de travail de la levure pour protéger les arômes, puis réchauffer à la fin", correct: false }
        - { text: "Fermenter à une température modérée, typique des rouges, pour finir vite et proprement", correct: false }
        - { text: "Laisser la température monter avec la fermentation, puis refroidir une fois le sucre épuisé", correct: false }
      explanation: |
        Une fermentation fraîche ralentit le métabolisme des levures et limite
        la perte de certains composés volatils, ce qui aide à préserver le fruit
        frais et les notes florales. La consigne doit pourtant convenir à la
        souche et au moût : trop de froid peut retarder le départ ou rendre la
        fermentation languissante. La température se suit donc à la fois comme
        levier de style et comme garde-fou de la santé et du rythme de la
        fermentation.

  - id: wine-warm-red-fermentation-extraction-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, fermentation, temperature, extraction, red-wine]
    status: reviewed
    source_id: c07-0130
    review:
      fact_check: pass
      sources: [awri, university]
    en:
      question: Two red musts have the same fruit and skin-contact time. Within safe yeast limits, what is the most defensible expectation from the warmer ferment?
      choices:
        - { text: "Quicker extraction of some colour and tannin, with greater risk of rapid fermentation and volatile loss", correct: true }
        - { text: "Higher final concentration of all skin phenolics, allowing lighter cap management without changing extraction", correct: false }
        - { text: "Earlier colour extraction with lower volatile loss, because the shorter ferment protects aroma compounds", correct: false }
        - { text: "Faster skin-tannin extraction but lower seed tannin, because temperature chiefly affects skin compounds", correct: false }
      explanation: |
        Warmer conditions can accelerate extraction and bring the colour maximum
        forward, while also increasing fermentation rate. The response differs
        among phenolics: faster extraction does not guarantee a higher final
        concentration of every skin compound, and seed-derived phenolics may
        increase. Cap management, contact time and fruit condition still matter;
        excessive warmth also increases volatile loss and can impair yeast health.
    fr:
      question: "Deux moûts rouges ont le même raisin et la même durée de cuvaison. Dans les limites supportées par la levure, que peut-on raisonnablement attendre de la fermentation la plus chaude ?"
      choices:
        - { text: "Une extraction plus rapide d’une partie de la couleur et des tanins, avec un risque accru d’emballement et de perte d’arômes", correct: true }
        - { text: "Une teneur finale plus élevée en tous les composés phénoliques des peaux, permettant de moins travailler le chapeau", correct: false }
        - { text: "Une couleur extraite plus tôt avec moins de perte d’arômes, la fermentation plus courte les protégeant", correct: false }
        - { text: "Une extraction plus rapide des tanins des peaux mais moins de tanins des pépins, la chaleur agissant surtout sur les peaux", correct: false }
      explanation: |
        La chaleur peut accélérer l’extraction et avancer le pic de couleur,
        tout en accélérant la fermentation. Les composés phénoliques ne
        réagissent pas tous de la même façon : une extraction plus rapide ne
        garantit pas une teneur finale plus élevée pour chaque composé des
        peaux, et ceux des pépins peuvent augmenter. Travail du chapeau, durée
        de cuvaison et état du raisin comptent toujours ; trop de chaleur
        augmente aussi la perte d’arômes et peut nuire aux levures.

  - id: wine-mlf-timing-options-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, malolactic-fermentation, timing]
    status: reviewed
    source_id: c07-0134
    review:
      fact_check: pass
      sources: [awri, extension]
    en:
      question: A producer wants to shorten the vulnerable interval between alcoholic fermentation and MLF in a suitable wine. Which timing plan best fits?
      choices:
        - { text: "Co-inoculate compatible lactic acid bacteria during alcoholic fermentation and monitor both fermentations", correct: true }
        - { text: "Wait for spontaneous MLF after alcoholic fermentation while holding the wine cool and without protective SO₂", correct: false }
        - { text: "Add the bacterial starter after alcoholic fermentation together with the wine's full protective SO₂ dose", correct: false }
        - { text: "Inoculate bacteria only after the new wine has been racked and left to settle for several weeks", correct: false }
      explanation: |
        Sequential MLF after alcoholic fermentation remains common, but it is
        not the only valid schedule. In a suitable wine, co-inoculating a
        compatible bacterial culture during alcoholic fermentation can shorten
        the unsulphited interval and improve the chance of timely completion.
        Yeast–bacteria compatibility, wine composition and monitoring still
        determine whether co-inoculation or a sequential approach is preferable.
    fr:
      question: "Un producteur veut raccourcir la période à risque entre fermentation alcoolique et malolactique dans un vin qui s’y prête. Quel calendrier choisir ?"
      choices:
        - { text: "Co-inoculer des bactéries lactiques compatibles pendant la fermentation alcoolique et suivre les deux fermentations", correct: true }
        - { text: "Attendre une malolactique spontanée après la fermentation alcoolique, vin gardé au frais et sans SO₂", correct: false }
        - { text: "Ajouter les bactéries après la fermentation alcoolique, en même temps que le sulfitage de protection complet", correct: false }
        - { text: "N’ensemencer les bactéries qu’après avoir soutiré le vin nouveau et l’avoir laissé reposer plusieurs semaines", correct: false }
      explanation: |
        La malolactique séquentielle, après la fermentation alcoolique, reste
        courante, mais ce n’est pas le seul calendrier valable. Dans un vin qui
        s’y prête, co-inoculer une culture bactérienne compatible pendant la
        fermentation alcoolique raccourcit la période sans sulfitage et augmente
        les chances de finir à temps. La compatibilité levures-bactéries, la
        composition du vin et le suivi décident encore entre co-inoculation et
        approche séquentielle.

  - id: wine-mlf-organism-reaction-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, malolactic-fermentation, bacteria, acid]
    status: reviewed
    source_id: c07-0135
    review:
      fact_check: pass
      sources: [extension]
    en:
      question: Which organism and reaction specifically identify malolactic fermentation?
      choices:
        - { text: "Lactic acid bacteria convert malic acid into lactic acid and CO₂", correct: true }
        - { text: "Wine yeast convert grape sugar into ethanol and CO₂", correct: false }
        - { text: "Acetic acid bacteria oxidise ethanol into acetic acid in the presence of air", correct: false }
        - { text: "Wine yeast convert malic acid into ethanol and CO₂", correct: false }
      explanation: |
        MLF is a bacterial conversion of malic acid to lactic acid, releasing
        CO₂. *Oenococcus oeni* is the most commonly used species, although other
        lactic acid bacteria can perform the reaction. Sugar-to-ethanol is
        alcoholic fermentation, while ethanol-to-acetic acid is spoilage by
        acetic acid bacteria. A few yeasts, such as *Schizosaccharomyces*, can
        break down malic acid into ethanol, but that is a yeast pathway, not MLF.
    fr:
      question: "Quel organisme et quelle réaction caractérisent la fermentation malolactique ?"
      choices:
        - { text: "Des bactéries lactiques transforment l’acide malique en acide lactique et CO₂", correct: true }
        - { text: "Des levures transforment le sucre du raisin en éthanol et CO₂", correct: false }
        - { text: "Des bactéries acétiques oxydent l’éthanol en acide acétique en présence d’air", correct: false }
        - { text: "Des levures transforment l’acide malique en éthanol et CO₂", correct: false }
      explanation: |
        La malolactique est une transformation bactérienne de l’acide malique en
        acide lactique, avec dégagement de CO₂. *Oenococcus oeni* est l’espèce
        la plus employée, mais d’autres bactéries lactiques en sont capables. Le
        passage du sucre à l’éthanol est la fermentation alcoolique, celui de
        l’éthanol à l’acide acétique une altération due aux bactéries acétiques.
        Quelques levures, comme *Schizosaccharomyces*, dégradent l’acide malique
        en éthanol, mais c’est une voie levurienne, pas la malolactique.

  - id: wine-mlf-acidity-diacetyl-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, malolactic-fermentation, acid, diacetyl]
    status: reviewed
    source_id: c07-0137
    review:
      fact_check: pass
      sources: [extension, awri]
    en:
      question: A Chardonnay completes malolactic fermentation. Which sensory and chemical outcome is most accurate?
      choices:
        - { text: "Malic acid falls and acidity softens; buttery diacetyl may develop but is not guaranteed", correct: true }
        - { text: "Malic acid falls and acidity softens; buttery notes come chiefly from yeast diacetyl", correct: false }
        - { text: "Malic acid falls and pH falls slightly; buttery diacetyl may develop from citric acid", correct: false }
        - { text: "Tartaric acid falls and acidity softens; buttery notes usually come from toasted oak", correct: false }
      explanation: |
        Replacing sharper malic acid with softer lactic acid generally lowers
        titratable acidity and raises pH slightly. Lactic acid bacteria can also
        form diacetyl from citric acid, giving buttery notes, but the amount
        retained depends on factors including bacterial strain, inoculation
        timing, temperature and subsequent lees or SO₂ management. Butter is a
        possible style effect, not proof that every MLF tastes the same.
        Tartaric acid is not the acid consumed, and yeast diacetyl is usually
        minor beside the bacterial contribution.
    fr:
      question: "Un Chardonnay termine sa fermentation malolactique. Quel effet chimique et sensoriel est le plus juste ?"
      choices:
        - { text: "L’acide malique baisse et l’acidité s’assouplit ; un diacétyle beurré peut apparaître, sans garantie", correct: true }
        - { text: "L’acide malique baisse et l’acidité s’assouplit ; le beurré vient surtout du diacétyle des levures", correct: false }
        - { text: "L’acide malique baisse et le pH baisse un peu ; un diacétyle beurré peut naître de l’acide citrique", correct: false }
        - { text: "L’acide tartrique baisse et l’acidité s’assouplit ; le beurré vient surtout du bois toasté", correct: false }
      explanation: |
        Remplacer l’acide malique, plus mordant, par l’acide lactique, plus
        doux, baisse en général l’acidité titrable et relève légèrement le pH.
        Les bactéries lactiques peuvent aussi produire du diacétyle à partir de
        l’acide citrique, d’où des notes beurrées, mais la quantité qui reste
        dépend notamment de la souche, du moment de l’inoculation, de la
        température, puis de l’élevage sur lies et du sulfitage. Le beurré est
        un effet de style possible, pas la signature de toute malolactique.
        L’acide tartrique n’est pas consommé, et le diacétyle des levures pèse
        peu à côté de celui des bactéries.

  - id: wine-mlf-encouragement-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, malolactic-fermentation, bacteria, control]
    status: reviewed
    source_id: c07-0138
    review:
      fact_check: pass
      sources: [extension, awri, oiv]
    en:
      question: A sound dry wine is suitable for MLF, and the producer wants timely completion. Which management plan is most defensible?
      choices:
        - { text: "Use a compatible bacterial starter, suitable temperature and nutrients, avoid inhibitory SO₂, and monitor malic acid", correct: true }
        - { text: "Rely on spontaneous bacteria in a cool cellar, add protective SO₂, and monitor aroma and free SO₂", correct: false }
        - { text: "Inoculate bacteria, keep the wine at its cool white-fermentation temperature, and track pH and SO₂", correct: false }
        - { text: "Warm the wine, add general yeast nutrient, and judge completion by CO₂ release and tasting", correct: false }
      explanation: |
        Successful MLF depends on the bacterial strain and on the wine's pH,
        temperature, ethanol, nutrient status and SO₂. A compatible acclimatised
        starter improves control, while excessive SO₂ or unsuitable temperature
        can inhibit the bacteria. The aim is not simply “no SO₂”: the producer
        manages a vulnerable wine and confirms completion by measuring malic
        acid rather than relying on bubbles or aroma.
    fr:
      question: "Un vin sec sain se prête à la fermentation malolactique, et le producteur veut qu’elle s’achève dans les temps. Quelle conduite est la plus défendable ?"
      choices:
        - { text: "Levain bactérien adapté, température et nutriments appropriés, pas de SO₂ inhibiteur, suivi de l’acide malique", correct: true }
        - { text: "Bactéries indigènes en cave fraîche, ajout de SO₂ protecteur, suivi du nez et du SO₂ libre", correct: false }
        - { text: "Inoculer les bactéries, garder le vin à sa température fraîche de fermentation en blanc, suivre pH et SO₂", correct: false }
        - { text: "Réchauffer le vin, ajouter un nutriment levurien standard, juger la fin au dégagement de CO₂ et à la dégustation", correct: false }
      explanation: |
        La réussite de la FML dépend de la souche bactérienne et du vin : pH,
        température, alcool, nutriments et SO₂. Un levain compatible et acclimaté
        donne plus de maîtrise ; trop de SO₂ ou une cave trop froide bloquent les
        bactéries. Il ne suffit pas de viser « zéro SO₂ » : le vin reste
        vulnérable pendant l’opération, et la fin se confirme en dosant l’acide
        malique, pas aux bulles ni au nez.

  - id: wine-mlf-prevention-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, malolactic-fermentation, bacteria, stability]
    status: reviewed
    source_id: c07-0139
    review:
      fact_check: pass
      sources: [awri, extension]
    en:
      question: A producer wants a crisp white wine to avoid MLF through bottling. Which control plan is most robust?
      choices:
        - { text: "Cool promptly, manage free SO₂ for pH, maintain hygiene, and membrane-filter viable bacteria when needed", correct: true }
        - { text: "Rack off the gross lees promptly, then keep the wine cool in clean tanks until bottling", correct: false }
        - { text: "Add a standard total-SO₂ dose to each lot at racking, then keep the wine cool until bottling", correct: false }
        - { text: "Polish the wine through a tight depth sheet just before bottling, after cool storage in clean tanks", correct: false }
      explanation: |
        Low temperature slows lactic acid bacteria, while effective molecular
        SO₂ depends strongly on pH and the achieved free SO₂ rather than one
        universal addition. Sound hygiene limits recontamination. Where analysis
        finds viable bacteria or the packaged wine is otherwise at risk, an
        appropriate membrane filtration and hygienic bottling provide physical
        control. Racking does not reliably remove bacteria, and a depth sheet carries
        only a nominal rating, so it is not a validated bacterial barrier.
    fr:
      question: "Un producteur veut qu’un blanc vif ne fasse pas sa fermentation malolactique, jusqu’à la mise en bouteille comprise. Quel plan de maîtrise est le plus solide ?"
      choices:
        - { text: "Refroidir vite, ajuster le SO₂ libre au pH, soigner l’hygiène et filtrer sur membrane si des bactéries vivantes subsistent", correct: true }
        - { text: "Soutirer vite les lies grossières, puis garder le vin au frais en cuves propres jusqu’à la mise", correct: false }
        - { text: "Ajouter une dose standard de SO₂ total à chaque lot au soutirage, puis garder le vin au frais jusqu’à la mise", correct: false }
        - { text: "Filtrer sur plaque serrée juste avant la mise, après un stockage au frais en cuves propres", correct: false }
      explanation: |
        Le froid ralentit les bactéries lactiques. L’efficacité du SO₂ tient à sa
        forme moléculaire, donc au pH et au SO₂ libre réellement atteint, pas à
        une dose unique. L’hygiène limite les recontaminations. Si l’analyse
        trouve des bactéries viables, une filtration sur membrane adaptée et une
        mise hygiénique assurent un contrôle physique. Le soutirage n’élimine
        pas toutes les bactéries, et une plaque filtrante n’a qu’un seuil nominal :
        ce n’est pas une barrière bactérienne validée.

  - id: wine-post-fermentation-settling-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, clarification, lees, racking]
    status: reviewed
    source_id: c07-0140
    review:
      fact_check: pass
      sources: [awri]
    en:
      question: A newly fermented wine is turbid with yeast cells and grape solids. Which response best reflects normal cellar practice?
      choices:
        - { text: "Let it settle, rack off the heavy gross lees, then judge whether more clarification is needed", correct: true }
        - { text: "Rack at once, before the gross lees have had time to settle, then clarify the cloudy wine", correct: false }
        - { text: "Leave it on all its lees for months, stirring regularly to build texture before racking", correct: false }
        - { text: "Sterile-filter straight away to remove the yeast cells and grape solids in a single step", correct: false }
      explanation: |
        Fermentation lees can contain yeast cells, bacteria, tartrate salts,
        phenolic material and remnant grape solids. Heavier material settles
        into gross lees and is removed by racking, while smaller particles settle
        more slowly and may remain as fine lees or require further clarification.
        The time needed depends on particle size, temperature, vessel and wine.
        A tight filter would clog quickly on such a heavy load, and long contact
        with unmanaged gross lees risks reductive off-odours.
    fr:
      question: "Un vin qui vient de finir sa fermentation est trouble, chargé de levures et de débris de raisin. Quelle réponse correspond à la pratique courante en cave ?"
      choices:
        - { text: "Laisser déposer, soutirer les lies grossières, puis voir si une clarification de plus est utile", correct: true }
        - { text: "Soutirer tout de suite, avant que les lies grossières aient pu se déposer, puis clarifier le vin trouble", correct: false }
        - { text: "Laisser le vin sur toutes ses lies pendant des mois, avec des bâtonnages réguliers pour le gras", correct: false }
        - { text: "Filtrer stérilement d’emblée pour retirer levures et débris de raisin en une seule étape", correct: false }
      explanation: |
        Les lies de fermentation contiennent levures, bactéries, sels de tartre,
        composés phénoliques et restes de raisin. Les particules lourdes tombent
        vite en lies grossières, qu’un soutirage élimine ; les plus fines se
        déposent lentement et restent en lies fines ou demandent une autre
        clarification. Le temps nécessaire dépend des particules, de la
        température, de la cuve et du vin. Un filtre serré colmaterait vite sous
        une telle charge, et un long contact avec des lies grossières non
        surveillées expose à des odeurs de réduction.

  - id: wine-gross-fine-lees-distinction-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, lees, clarification]
    status: reviewed
    source_id: c07-0141
    review:
      fact_check: pass
      sources: [extension, awri]
    en:
      question: A newly fermented wine throws a compact deposit quickly, while a lighter suspension settles only later. Which identification is most accurate?
      choices:
        - { text: "The early heavy deposit is gross lees; the slower smaller particles are fine lees", correct: true }
        - { text: "The early heavy deposit is fine lees; the slower smaller particles are gross lees", correct: false }
        - { text: "Both are fine lees; gross lees means the solids settled out of juice before fermentation", correct: false }
        - { text: "The early deposit is gross lees; the later suspension is a tartrate haze, not lees", correct: false }
      explanation: |
        Gross and fine lees overlap in composition: both can include yeast,
        bacteria, tartrate and phenolic material. The practical distinction is
        mainly particle size and settling behaviour. Heavy material, including
        more grape solids, settles first as gross lees; smaller particles settle
        more slowly as fine lees. Solids that settle out of juice are a separate
        deposit, removed by juice settling before fermentation starts.
    fr:
      question: "Un vin qui vient de fermenter forme vite un dépôt compact, puis une suspension plus légère ne se dépose que plus tard. Quelle identification est la plus juste ?"
      choices:
        - { text: "Le dépôt lourd et précoce, ce sont les lies grossières ; les petites particules plus lentes, les lies fines", correct: true }
        - { text: "Le dépôt lourd et précoce, ce sont les lies fines ; les petites particules plus lentes, les lies grossières", correct: false }
        - { text: "Les deux sont des lies fines ; on réserve « lies grossières » aux bourbes du moût avant fermentation", correct: false }
        - { text: "Le dépôt précoce, ce sont les lies grossières ; la suspension tardive est un trouble tartrique, pas des lies", correct: false }
      explanation: |
        Lies grossières et lies fines ont une composition proche : levures,
        bactéries, tartre, composés phénoliques. Ce qui les distingue en pratique,
        c’est la taille des particules et la vitesse de dépôt : le matériau lourd,
        plus riche en débris de raisin, tombe d’abord ; les petites particules
        suivent lentement. Les bourbes du moût forment un autre dépôt, éliminé au
        débourbage, avant la fermentation.

  - id: wine-gross-lees-management-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, lees, racking, faults]
    status: reviewed
    source_id: c07-0142
    review:
      fact_check: pass
      sources: [oiv, awri, extension]
    en:
      question: A wine remains for an extended period on a thick, unmanaged layer of gross lees after fermentation. Which outcome is the most specific concern?
      choices:
        - { text: "Reductive sulfur aromas and increased risk from spoilage microorganisms", correct: true }
        - { text: "Gradual mannoprotein release and a broader mid-palate texture", correct: false }
        - { text: "Scavenging of small oxygen inputs by sound yeast lees", correct: false }
        - { text: "Closer integration of fruit and oak during controlled maturation", correct: false }
      explanation: |
        Heavy gross lees contain grape solids, yeast and bacteria. If a thick
        deposit is left unmanaged, it can favour unwanted volatile sulfur
        compounds, bind protective SO₂ and provide conditions in which spoilage
        organisms persist; faults are a risk, not an inevitable result.
        Mannoprotein release, oxygen scavenging and smoother oak integration are
        benefits of deliberately managed contact with sound fine lees.
    fr:
      question: "Après la fermentation, un vin reste longtemps sur une épaisse couche de lies grossières que personne ne surveille. Quel risque est le plus spécifique ?"
      choices:
        - { text: "Des odeurs soufrées de réduction et un risque accru de germes d’altération", correct: true }
        - { text: "Une libération progressive de mannoprotéines et un milieu de bouche plus ample", correct: false }
        - { text: "Le piégeage de petites entrées d’oxygène par des lies de levures saines", correct: false }
        - { text: "Une meilleure fusion du fruit et du bois pendant un élevage maîtrisé", correct: false }
      explanation: |
        Les lies grossières renferment débris de raisin, levures et bactéries.
        Laissées en couche épaisse sans suivi, elles peuvent favoriser des
        composés soufrés volatils indésirables, fixer le SO₂ protecteur et
        entretenir des germes d’altération ; c’est un risque, pas une fatalité.
        Mannoprotéines, protection contre l’oxygène et fusion avec le bois sont
        les bénéfices d’un élevage voulu sur des lies fines saines.

  - id: wine-fine-lees-ageing-trial-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, lees, maturation, batonnage]
    status: reviewed
    source_id: c07-0145
    review:
      fact_check: pass
      sources: [awri, extension]
    en:
      question: A cellar wants to measure how bâtonnage changes the texture of one sound white wine during fine-lees ageing. Which trial gives the cleanest comparison?
      choices:
        - { text: "Use identical full barrels at one temperature for one period; stir one lot on schedule and leave the other unstirred", correct: true }
        - { text: "Use one new barrel and one neutral barrel at one temperature for one period; stir only the new-barrel lot", correct: false }
        - { text: "Use identical full barrels at one temperature; stir one lot for twice as long as the unstirred lot", correct: false }
        - { text: "Use identical full barrels for one period; keep the stirred lot warmer than the unstirred lot", correct: false }
      explanation: |
        A matched trial changes stirring while holding vessel, time, temperature
        and wine constant. Otherwise oak extraction, contact duration or thermal
        effects could be mistaken for a bâtonnage effect. During fine-lees ageing,
        yeast-cell components such as mannoproteins and other polysaccharides can
        influence texture; stirring changes lees suspension and oxygen exposure,
        so the result must be assessed rather than assumed.
    fr:
      question: "Une cave veut mesurer l’effet du bâtonnage sur la texture d’un même vin blanc sain élevé sur lies fines. Quel essai donne la comparaison la plus nette ?"
      choices:
        - { text: "Barriques identiques et pleines, même température, même durée ; un lot bâtonné à intervalles fixes, l’autre non", correct: true }
        - { text: "Une barrique neuve et une usagée, même température, même durée ; seul le lot en bois neuf est bâtonné", correct: false }
        - { text: "Barriques identiques et pleines, même température ; le lot bâtonné reste deux fois plus longtemps que l’autre", correct: false }
        - { text: "Barriques identiques et pleines, même durée ; le lot bâtonné est gardé plus au chaud que l’autre", correct: false }
      explanation: |
        Un essai apparié ne fait varier que le bâtonnage : contenant, durée,
        température et vin restent les mêmes. Sinon, l’extraction du bois, la
        durée de contact ou la chaleur passeraient pour un effet du bâtonnage.
        Sur lies fines, des constituants des levures (mannoprotéines, autres
        polysaccharides) peuvent jouer sur la texture ; remuer les lies change
        leur mise en suspension et l’apport d’oxygène, d’où la nécessité de
        mesurer plutôt que de supposer.

  - id: wine-short-inert-maturation-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, maturation, inert-vessel, primary-fruit]
    status: reviewed
    source_id: c07-0146
    review:
      fact_check: pass
      sources: [wine-australia, extension]
    en:
      question: A producer wants a young aromatic white to reach bottle with its primary fruit prominent. Which maturation protocol best matches that aim?
      choices:
        - { text: "Three months in a full closed stainless tank with protected transfers, followed by normal stability checks", correct: true }
        - { text: "Twelve months in a full closed stainless tank with protected transfers, followed by normal stability checks", correct: false }
        - { text: "Three months in a stainless tank with headspace exposed to air and protected transfers, followed by normal stability checks", correct: false }
        - { text: "Three months in a topped neutral barrel with protected transfers, followed by normal stability checks", correct: false }
      explanation: |
        The matched alternatives isolate duration, air in the headspace or
        vessel choice. Short maturation in a full, closed stainless tank limits
        both oxygen exposure and the time available for primary aromas to fade
        or be masked. Wine Australia notes that most Australian Rieslings are
        bottled early to capture vibrant fruit, although longer lees or neutral-
        oak maturation can be valid choices for a different style.
    fr:
      question: "Un producteur veut qu’un blanc aromatique jeune arrive en bouteille avec un fruit primaire bien présent. Quel élevage correspond le mieux à cet objectif ?"
      choices:
        - { text: "Trois mois en cuve inox pleine et fermée, transferts protégés, puis contrôles de stabilité habituels", correct: true }
        - { text: "Douze mois en cuve inox pleine et fermée, transferts protégés, puis contrôles de stabilité habituels", correct: false }
        - { text: "Trois mois en cuve inox avec un ciel de cuve laissé à l’air, transferts protégés, puis contrôles de stabilité habituels", correct: false }
        - { text: "Trois mois en barrique usagée ouillée, transferts protégés, puis contrôles de stabilité habituels", correct: false }
      explanation: |
        Les choix appariés isolent la durée, l’air au-dessus du vin ou le
        contenant. Un élevage court en inox plein et fermé limite à la fois
        l’oxygène et le temps pendant lequel les arômes primaires s’estompent ou
        se font masquer. Wine Australia rappelle que la plupart des Rieslings
        australiens sont mis en bouteille tôt pour garder un fruit éclatant ; un
        élevage plus long sur lies ou en bois neutre reste valable pour un autre
        style.

  - id: wine-ageing-potential-assessment-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, maturation, bottle-ageing, balance]
    status: reviewed
    source_id: c07-0148
    review:
      fact_check: pass
      sources: [research-review, extension]
    en:
      question: A buyer is deciding whether a young wine is a sound candidate for medium- to long-term cellaring. Which assessment is most defensible?
      choices:
        - { text: "Assess concentration and structural balance for the style, then check soundness and likely evolution", correct: true }
        - { text: "Prioritise high acidity and low pH, then assume lighter fruit will strengthen during cellaring", correct: false }
        - { text: "Prioritise firm tannin and new oak, then assume current imbalance will resolve during cellaring", correct: false }
        - { text: "Prioritise high alcohol and deep colour, then assume microbial stability will follow during cellaring", correct: false }
      explanation: |
        No single measurement guarantees graceful development. Sufficient fruit
        concentration and style-appropriate acidity, tannin, alcohol or sugar
        must work as a balanced whole, while faults and instability undermine
        resilience. Ageing chemistry is complex, so this assessment indicates
        potential rather than promising that every sound, structured wine will
        improve.
    fr:
      question: "Un acheteur se demande si un vin jeune mérite d’être gardé en cave à moyen ou long terme. Quelle évaluation est la plus défendable ?"
      choices:
        - { text: "Juger la concentration et l’équilibre de la structure pour le style, puis l’absence de défauts et l’évolution probable", correct: true }
        - { text: "Privilégier une acidité élevée et un pH bas, en supposant qu’un fruit léger se renforcera en cave", correct: false }
        - { text: "Privilégier des tanins fermes et du bois neuf, en supposant que le déséquilibre actuel se résorbera en cave", correct: false }
        - { text: "Privilégier un degré élevé et une couleur profonde, en supposant que la stabilité microbienne suivra en cave", correct: false }
      explanation: |
        Aucune mesure isolée ne garantit un bon vieillissement. Il faut assez de
        concentration en fruit et une acidité, des tanins, de l’alcool ou du
        sucre adaptés au style, le tout en équilibre ; défauts et instabilités
        fragilisent le vin. La chimie du vieillissement est complexe : cette
        évaluation indique un potentiel, elle ne promet pas que tout vin sain et
        structuré s’améliorera.

  - id: wine-blending-timing-flexibility-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, blending, fermentation, maturation]
    status: reviewed
    source_id: c07-0150
    review:
      fact_check: pass
      sources: [extension, research]
    en:
      question: A winery can coferment two parcels or ferment them separately before blending. Which comparison is most accurate?
      choices:
        - { text: "Cofermentation fixes the relationship early; separate vinification preserves later blending options", correct: true }
        - { text: "Cofermentation preserves later blending options; separate vinification fixes the relationship at harvest", correct: false }
        - { text: "Both routes fix the relationship at harvest, since extraction is settled during fermentation", correct: false }
        - { text: "Separate vinification prevents blending during maturation; cofermentation permits adjustment after MLF", correct: false }
      explanation: |
        Blending can occur before fermentation, after separate fermentations,
        during maturation or near bottling. An early cofermentation commits the
        proportions and may help integration, as with the Syrah cofermented with
        a little Viognier in Côte-Rôtie; keeping components separate retains
        more options. Bench trials and repeated tasting let the timing serve the
        intended balance and style rather than a fixed calendar rule.
    fr:
      question: "Une cave peut cofermenter deux parcelles ou les vinifier séparément avant assemblage. Quelle comparaison est la plus juste ?"
      choices:
        - { text: "La cofermentation fige le rapport tôt ; la vinification séparée garde des options d’assemblage pour plus tard", correct: true }
        - { text: "La cofermentation garde des options pour plus tard ; la vinification séparée fige le rapport dès la vendange", correct: false }
        - { text: "Les deux voies figent le rapport dès la vendange, puisque l’extraction se joue pendant la fermentation", correct: false }
        - { text: "La vinification séparée interdit l’assemblage pendant l’élevage ; la cofermentation permet d’ajuster après la FML", correct: false }
      explanation: |
        On peut assembler avant fermentation, après des fermentations séparées,
        pendant l’élevage ou juste avant la mise. Cofermenter engage les
        proportions dès le départ et peut aider à l’intégration : c’est le cas de
        la Syrah cofermentée avec un peu de Viognier en Côte-Rôtie. Garder les
        lots séparés laisse plus de choix ; essais d’assemblage et dégustations
        répétées calent ensuite le moment sur l’équilibre et le style visés.

  - id: wine-blending-compliance-check-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, blending, regulation, labelling]
    status: reviewed
    source_id: c07-0153
    review:
      fact_check: pass
      sources: [oiv, official-regulation]
    en:
      question: A proposed blend tastes sound and balanced, but the producer wants to retain a named origin, grape variety and vintage on the label. What should be confirmed before the blend is finalised?
      choices:
        - { text: "The finished proportions satisfy the applicable product specification and labelling rules for each claim", correct: true }
        - { text: "Each component was legal on its own, so the combined wine automatically retains every claim", correct: false }
        - { text: "The vintage named on the label matches the majority of the blend", correct: false }
        - { text: "The named variety is the largest single component of the blend", correct: false }
      explanation: |
        Blending is an accepted operation, but the finished wine must still meet
        the rules governing its identity and claims. Depending on the jurisdiction
        or protected-wine specification, component origin, authorised varieties,
        vintage proportions and production conditions can change what may appear
        on the label; in the EU, for example, a single named variety or vintage
        generally requires at least 85% of the wine. Compliance is checked
        against the exact rules for the intended market, not inferred from taste.
    fr:
      question: "Un projet d’assemblage est sain et équilibré, mais le producteur veut garder sur l’étiquette une origine, un cépage et un millésime. Que faut-il vérifier avant de valider l’assemblage ?"
      choices:
        - { text: "Que les proportions finales respectent le cahier des charges et les règles d’étiquetage de chaque mention", correct: true }
        - { text: "Que chaque composant était conforme seul, le vin assemblé gardant alors toutes ses mentions", correct: false }
        - { text: "Que le millésime indiqué correspond à la majorité de l’assemblage", correct: false }
        - { text: "Que le cépage indiqué est le composant le plus important de l’assemblage", correct: false }
      explanation: |
        L’assemblage est une pratique admise, mais le vin fini doit encore
        respecter les règles liées à son identité et à ses mentions. Selon le
        pays ou le cahier des charges de l’appellation, l’origine des lots, les
        cépages autorisés, la part de chaque millésime et les conditions de
        production décident de ce que l’étiquette peut annoncer ; dans l’UE, un
        cépage ou un millésime indiqué seul exige en général au moins 85 % du
        vin. La conformité se vérifie règle par règle pour le marché visé, pas
        au goût.

  - id: wine-house-style-component-strategy-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, blending, house-style, consistency]
    status: reviewed
    source_id: c07-0156
    review:
      fact_check: pass
      sources: [extension, industry]
    en:
      question: A producer wants a recognisable house style across variable harvest lots while preserving useful blending flexibility. Which production plan is most defensible?
      choices:
        - { text: "Keep distinct lots separate, record their treatment, then build the blend by bench trials", correct: true }
        - { text: "Split each batch into as many lots as possible, then blend them in fixed proportions", correct: false }
        - { text: "Coferment all the fruit in the same ratios each year so the style is set at harvest", correct: false }
        - { text: "Combine all lots in equal volumes after fermentation to even out differences between harvests", correct: false }
      explanation: |
        Useful options can come from varieties, parcels, press fractions,
        fermentation or maturation vessels, different MLF decisions and, where
        permitted, vintages: a Champagne house keeps its non-vintage brut
        consistent largely through its reserve wines. Keeping meaningful
        components separate preserves choices for later trials. Creating every
        conceivable split adds cost and complexity, however, and does not by
        itself improve balance or consistency.
    fr:
      question: "Un producteur veut un style maison reconnaissable malgré des lots de vendange variables, tout en gardant de la souplesse pour l’assemblage. Quel plan de production est le plus défendable ?"
      choices:
        - { text: "Garder séparés les lots vraiment distincts, noter leur traitement, puis bâtir l’assemblage par essais", correct: true }
        - { text: "Diviser chaque cuvée en autant de lots que possible, puis les assembler en proportions fixes", correct: false }
        - { text: "Cofermenter tout le raisin dans les mêmes proportions chaque année pour fixer le style dès la vendange", correct: false }
        - { text: "Réunir tous les lots à volumes égaux après fermentation pour lisser les écarts d’une vendange à l’autre", correct: false }
      explanation: |
        Les options utiles viennent des cépages, des parcelles, des fractions de
        presse, des contenants de fermentation ou d’élevage, des choix de FML et,
        quand c’est permis, des millésimes : une maison de Champagne tient son
        brut sans année en grande partie grâce à ses vins de réserve. Garder
        séparés les lots qui diffèrent vraiment préserve des choix pour les
        essais. Multiplier les lots sans raison ajoute coût et complexité sans
        améliorer l’équilibre ni la régularité.

  - id: wine-clarification-routes-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, clarification, sedimentation, fining, filtration]
    status: reviewed
    source_id: c07-0158
    review:
      fact_check: pass
      sources: [oiv, awri]
    en:
      question: Which comparison correctly distinguishes three common wine-clarification routes?
      choices:
        - { text: "Sedimentation lets particles settle; fining adds a reactive agent; filtration retains particles in a filter medium", correct: true }
        - { text: "Sedimentation adds a reactive agent; fining passes wine through a membrane; filtration relies on gravity alone", correct: false }
        - { text: "Sedimentation removes microorganisms selectively; fining relies on gravity alone; filtration adds an adsorptive agent", correct: false }
        - { text: "Sedimentation passes wine through a filter bed; fining removes only tartrates; filtration stirs deposits into suspension", correct: false }
      explanation: |
        Natural or assisted settling concentrates suspended material into a
        deposit that can be left behind during racking. Fining adds a substance
        such as bentonite, egg white or PVPP that adsorbs, reacts with or helps
        precipitate selected components. Filtration physically passes wine
        through a medium that retains particles; sufficiently tight, validated
        filtration can also remove microorganisms.
    fr:
      question: "Quelle comparaison distingue correctement trois voies courantes de clarification du vin ?"
      choices:
        - { text: "Sédimentation : les particules se déposent ; collage : on ajoute un agent réactif ; filtration : un média retient les particules", correct: true }
        - { text: "Sédimentation : on ajoute un agent réactif ; collage : le vin traverse une membrane ; filtration : seule la gravité agit", correct: false }
        - { text: "Sédimentation : elle retient sélectivement les microbes ; collage : seule la gravité agit ; filtration : on ajoute un adsorbant", correct: false }
        - { text: "Sédimentation : le vin traverse un lit filtrant ; collage : il ne retire que le tartre ; filtration : elle remet les dépôts en suspension", correct: false }
      explanation: |
        Le dépôt, naturel ou assisté, rassemble les matières en suspension au
        fond de la cuve, et le soutirage les laisse derrière. Le collage ajoute
        une substance (bentonite, blanc d’œuf, PVPP…) qui adsorbe certains
        composants ou les fait précipiter. La filtration fait passer le vin à
        travers un média qui retient les particules ; une filtration assez
        serrée et validée retient aussi les micro-organismes.

  - id: wine-clarification-proportional-treatment-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, clarification, stability, fining, filtration]
    status: reviewed
    source_id: c07-0159
    review:
      fact_check: pass
      sources: [awri, oiv, extension]
    en:
      question: A sound wine is slightly hazy before bottling, and the producer wants stability without unnecessary loss of texture or aroma. Which plan is most defensible?
      choices:
        - { text: "Identify the instability, run controlled treatment trials, and use the least intervention that meets the packaging risk", correct: true }
        - { text: "Apply sedimentation, fining and tight filtration in sequence, then assess whether the intended style remains", correct: false }
        - { text: "Skip fining and filtration to protect the aroma, and rely on SO₂ to keep the wine stable in bottle", correct: false }
        - { text: "Choose treatment from visual brightness alone, then assume a clear wine is chemically and microbiologically stable", correct: false }
      explanation: |
        Visual haze can come from particles, colloids, crystals or microbes, and
        those causes do not require the same treatment: a protein haze calls for
        bentonite, not a tighter filter. Fining can remove positive flavour or
        structural material if poorly chosen or overdosed, while modern
        commercial filtration does not show a uniform sensory penalty in every
        wine. Trials and stability tests allow a targeted treatment; neither a
        compulsory full sequence nor an ideological refusal manages every risk.
    fr:
      question: "Un vin sain est légèrement voilé avant la mise, et le producteur veut le stabiliser sans perdre inutilement de texture ni d’arômes. Quel plan est le plus défendable ?"
      choices:
        - { text: "Identifier l’instabilité, faire des essais de traitement et retenir l’intervention la plus légère adaptée au risque", correct: true }
        - { text: "Enchaîner sédimentation, collage et filtration serrée, puis vérifier si le style voulu est préservé", correct: false }
        - { text: "Renoncer au collage et à la filtration pour protéger l’arôme, en comptant sur le SO₂ pour stabiliser le vin en bouteille", correct: false }
        - { text: "Choisir le traitement d’après la seule brillance, en supposant qu’un vin limpide est stable chimiquement et microbiologiquement", correct: false }
      explanation: |
        Un voile peut venir de particules, de colloïdes, de cristaux ou de
        microbes, et ces causes ne se traitent pas de la même façon : une casse
        protéique appelle de la bentonite, pas un filtre plus serré. Un collage
        mal choisi ou surdosé peut retirer des composés utiles au goût ou à la
        structure, alors qu’une filtration moderne bien conduite ne dégrade pas
        forcément chaque vin. Essais et tests de stabilité ciblent le
        traitement ; ni une séquence complète imposée ni un refus de principe ne
        couvrent tous les risques.

  - id: wine-racking-definition-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, racking, clarification, lees]
    status: reviewed
    source_id: c07-0160
    review:
      fact_check: pass
      sources: [oiv, awri]
    en:
      question: Which cellar operation is specifically racking?
      choices:
        - { text: "Transfer wine to another vessel after solids settle, leaving the deposit behind", correct: true }
        - { text: "Pass wine through a membrane that retains suspended particles or microorganisms", correct: false }
        - { text: "Add a fining agent that binds or precipitates unwanted wine components", correct: false }
        - { text: "Resuspend fine lees by stirring them through the wine during maturation", correct: false }
      explanation: |
        Racking separates liquid from settled lees or another deposit by moving
        the wine into a clean vessel. The transfer may be protected from air or
        deliberately aerative when a specific objective, such as removing
        hydrogen sulfide, justifies it. Racking improves clarity but does not by
        itself prove microbial, protein or tartrate stability.
    fr:
      question: "Quelle opération de cave est, à proprement parler, un soutirage ?"
      choices:
        - { text: "Transvaser le vin dans un autre contenant une fois les dépôts tombés, en les laissant derrière", correct: true }
        - { text: "Faire passer le vin sur une membrane qui retient particules ou micro-organismes", correct: false }
        - { text: "Ajouter une colle qui fixe ou précipite des composants indésirables du vin", correct: false }
        - { text: "Remettre les lies fines en suspension en les brassant pendant l’élevage", correct: false }
      explanation: |
        Le soutirage sépare le vin des lies ou d’un autre dépôt en le
        transférant dans un contenant propre. Le transfert peut être protégé de
        l’air, ou volontairement aérant quand un objectif précis le justifie,
        par exemple chasser de l’hydrogène sulfuré. Il améliore la limpidité
        mais ne prouve pas à lui seul la stabilité microbienne, protéique ou
        tartrique.

  - id: wine-static-settling-centrifuge-tradeoff-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, clarification, settling, centrifugation]
    status: reviewed
    source_id: c07-0164
    review:
      fact_check: pass
      sources: [extension, oiv, awri]
    en:
      question: A winery is choosing between static settling and centrifugation for a large volume of turbid juice during a compressed harvest. Which comparison is most accurate?
      choices:
        - { text: "Centrifugation is faster and can be continuous but needs costly equipment; static settling uses more tank time and depends on gravity", correct: true }
        - { text: "Centrifugation is faster and can be continuous with lower capital cost; static settling uses more tank time and depends on gravity", correct: false }
        - { text: "Centrifugation is faster and can be continuous but requires complete static pre-settling; static settling uses more tank time and depends on gravity", correct: false }
        - { text: "Centrifugation is faster and can be continuous but cannot be protected from oxygen; static settling uses more tank time and depends on gravity", correct: false }
      explanation: |
        Centrifugal force separates denser suspended solids far faster than
        gravity and modern units can process a continuous stream, which is useful
        when time and tank capacity are tight. The tradeoff is specialised capital
        and operating cost. Oxygen pickup depends on equipment and handling: a
        hermetic or inerted system can limit it, while static settling is not
        automatically protected from air. Settling speed also varies with solids,
        temperature and wine or juice condition rather than one fixed duration.
    fr:
      question: "En pleine vendange serrée, une cave doit clarifier un gros volume de moût trouble, par débourbage statique ou par centrifugation. Quelle comparaison est la plus juste ?"
      choices:
        - { text: "La centrifugeuse va plus vite et peut tourner en continu, mais coûte cher ; le débourbage statique immobilise des cuves et dépend de la gravité", correct: true }
        - { text: "La centrifugeuse va plus vite et peut tourner en continu, pour un investissement moindre ; le débourbage statique immobilise des cuves et dépend de la gravité", correct: false }
        - { text: "La centrifugeuse va plus vite et peut tourner en continu, mais exige un débourbage statique complet au préalable ; le débourbage statique immobilise des cuves et dépend de la gravité", correct: false }
        - { text: "La centrifugeuse va plus vite et peut tourner en continu, mais ne peut pas être protégée de l’oxygène ; le débourbage statique immobilise des cuves et dépend de la gravité", correct: false }
      explanation: |
        La force centrifuge sépare les solides denses bien plus vite que la
        gravité, et les appareils modernes traitent un flux continu, utile quand
        le temps et les cuves manquent. La contrepartie est le coût d’achat et
        de fonctionnement. La prise d’oxygène dépend du matériel et de la
        conduite : un système hermétique ou inerté la limite, et le débourbage
        statique n’est pas protégé de l’air par nature. Sa durée varie aussi
        avec la charge en bourbes, la température et l’état du moût.

  - id: wine-depth-surface-filtration-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, clarification, filtration, depth-filter, membrane]
    status: reviewed
    source_id: c07-0170
    review:
      fact_check: pass
      sources: [awri, oiv]
    en:
      question: Which comparison most accurately distinguishes depth filtration from membrane filtration in wine?
      choices:
        - { text: "Depth media retain particles within a thick matrix and handle higher solids; rated membranes retain at the surface and suit final microbial control", correct: true }
        - { text: "Membranes retain particles within a thick matrix and handle higher solids; depth media retain at the surface and suit final microbial control", correct: false }
        - { text: "Both work mainly by absolute pore exclusion; depth media simply use a larger defined pore size than membranes", correct: false }
        - { text: "Depth media provide the validated final microbial barrier; membranes are used upstream because their pore ratings are nominal", correct: false }
      explanation: |
        Depth media trap material throughout a matrix by mechanical retention,
        adsorption and charge; they tolerate a larger solids load but usually have
        nominal rather than absolute ratings. A rated membrane retains particles
        at its surface and can provide validated microorganism removal. Because a
        heavily turbid wine can block that surface quickly, settling, centrifuging
        or a coarser filtration stage commonly precedes a final membrane.
    fr:
      question: "Quelle comparaison distingue le mieux la filtration en profondeur de la filtration sur membrane ?"
      choices:
        - { text: "Le filtre en profondeur retient dans une matrice épaisse et supporte plus de matières ; la membrane retient en surface et sert au contrôle microbien final", correct: true }
        - { text: "La membrane retient dans une matrice épaisse et supporte plus de matières ; le filtre en profondeur retient en surface et sert au contrôle microbien final", correct: false }
        - { text: "Les deux agissent surtout par exclusion stricte selon la taille des pores ; le filtre en profondeur a simplement des pores plus larges", correct: false }
        - { text: "Le filtre en profondeur assure la barrière microbienne finale validée ; la membrane sert en amont, car son seuil n’est que nominal", correct: false }
      explanation: |
        Un filtre en profondeur (plaques, terre de diatomées) piège les matières
        dans toute son épaisseur, par rétention mécanique, adsorption et charge
        électrique ; il tolère une forte charge, avec un seuil le plus souvent
        nominal plutôt qu’absolu. Une membrane calibrée retient en surface et
        peut assurer une élimination validée des micro-organismes. Comme un vin
        très trouble la colmate vite, on passe d’abord par un débourbage, une
        centrifugation ou une filtration plus grossière.

  - id: wine-final-membrane-filtration-control-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, filtration, microbiological-stability, bottling]
    status: reviewed
    source_id: c07-0178
    review:
      fact_check: pass
      sources: [awri, oiv, extension]
    en:
      question: An off-dry wine needs membrane filtration to reduce viable yeast and bacteria immediately before bottling. Which protocol gives the strongest process control?
      choices:
        - { text: "Use a suitably rated membrane, confirm its integrity, then bottle immediately through hygienic downstream equipment", correct: true }
        - { text: "Use a suitably rated membrane, confirm its integrity, then hold the filtered wine in tank for a week before bottling", correct: false }
        - { text: "Use a nominally rated depth sheet, confirm stable filter pressure, then bottle through hygienic downstream equipment", correct: false }
        - { text: "Use a suitably rated membrane, confirm its integrity, then add the final sweetening reserve in the filler bowl", correct: false }
      explanation: |
        “Sterile filtration” is practical shorthand for validated removal of
        target microorganisms, not a claim that every possible organism has
        vanished. Membrane rating, operating conditions and an integrity test
        establish whether the filter performed as intended. Hygienic equipment
        downstream and prompt packaging then limit recontamination. A week in
        tank gives survivors or new contaminants time to grow, a nominal depth
        sheet is not a validated microbial barrier, and anything added after the
        membrane bypasses it.
    fr:
      question: "Un vin demi-sec doit être filtré sur membrane juste avant la mise pour réduire levures et bactéries viables. Quel protocole donne la meilleure maîtrise du procédé ?"
      choices:
        - { text: "Membrane au seuil adapté, test d’intégrité, puis mise immédiate par un circuit aval hygiénique", correct: true }
        - { text: "Membrane au seuil adapté, test d’intégrité, puis une semaine en cuve avant la mise", correct: false }
        - { text: "Plaque filtrante à seuil nominal, pression stable, puis mise par un circuit aval hygiénique", correct: false }
        - { text: "Membrane au seuil adapté, test d’intégrité, puis ajout de la réserve d’édulcoration dans la cuve de la tireuse", correct: false }
      explanation: |
        « Filtration stérile » est un raccourci pour l’élimination validée des
        micro-organismes visés, pas la disparition de tout organisme. Le seuil
        de la membrane, les conditions d’emploi et le test d’intégrité montrent
        si le filtre a fait son travail. Un circuit aval propre et une mise
        rapide limitent ensuite la recontamination. Une semaine en cuve laisse
        aux germes restants ou nouveaux le temps de se multiplier, une plaque à
        seuil nominal n’est pas une barrière microbienne validée, et tout ajout
        fait après la membrane échappe à la filtration.

  - id: wine-stability-shelf-life-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, stability, shelf-life, quality-control]
    status: reviewed
    source_id: c07-0181
    review:
      fact_check: pass
      sources: [awri, oiv]
    en:
      question: A winery is setting release criteria for a young dry white and a sweet wine intended for longer ageing. Which approach defines stability most defensibly?
      choices:
        - { text: "Style-specific physical, chemical and microbial limits held for each wine's intended shelf life", correct: true }
        - { text: "Apply one analytical panel and one shelf-life period to both the dry white and the sweet wine", correct: false }
        - { text: "Define stability as both wines passing protein and tartrate stability tests at the time of bottling", correct: false }
        - { text: "Define stability as no measurable chemical or sensory change in either wine across its intended shelf life", correct: false }
      explanation: |
        Stability is fitness for the intended product life, not complete absence
        of change. A producer sets acceptable outcomes for the wine's style,
        packaging, expected storage and shelf life. Relevant risks can include
        physical deposits or hazes, chemical change such as oxidation, and
        microbial refermentation or spoilage. Fining is only one targeted tool;
        it does not provide a universal guarantee against all three categories.
    fr:
      question: "Une cave fixe ses critères de mise en marché pour un blanc sec jeune et pour un vin liquoreux destiné à vieillir. Quelle définition de la stabilité est la plus défendable ?"
      choices:
        - { text: "Des limites physiques, chimiques et microbiennes propres à chaque style, tenues sur la durée de vie prévue", correct: true }
        - { text: "Appliquer les mêmes analyses et la même durée de vie au blanc sec et au liquoreux", correct: false }
        - { text: "Définir la stabilité comme la réussite des tests de stabilité protéique et tartrique à la mise", correct: false }
        - { text: "Définir la stabilité comme l’absence de tout changement chimique ou sensoriel mesurable pendant la durée de vie", correct: false }
      explanation: |
        Être stable, c’est rester conforme pendant la vie prévue du produit, pas
        ne jamais changer. Le producteur fixe ce qui est acceptable selon le
        style, l’emballage, le stockage attendu et la durée de vie. Les risques
        peuvent être physiques (dépôt, trouble), chimiques (oxydation) ou
        microbiens (refermentation, altération). Le collage ne vise qu’un risque
        précis ; il ne couvre pas ces trois catégories.

  - id: wine-tartrate-crystal-significance-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, stability, tartrate, bottle-deposit]
    status: reviewed
    source_id: c07-0186
    review:
      fact_check: pass
      sources: [awri]
    en:
      question: A sound dry white was clear at bottling but develops hard, glass-like crystals after refrigeration. What is the most defensible initial interpretation?
      choices:
        - { text: "Suspect a tartrate deposit: harmless to quality, but a cosmetic concern for consumers", correct: true }
        - { text: "Suspect yeast refermentation: the crystals formed as viable yeast consumed residual sugar", correct: false }
        - { text: "Suspect protein instability: chilled proteins have dropped out of the wine as crystals", correct: false }
        - { text: "Suspect copper or iron casse: metal pick-up has precipitated in the cold", correct: false }
      explanation: |
        Potassium hydrogen tartrate is the most common crystalline deposit in
        bottled wine; calcium tartrate can also occur. These salts do not harm
        flavour or make the wine unsafe, but consumers may mistake the crystals
        for glass. Protein instability and metal casse show as hazes or
        amorphous deposits, and refermentation brings gas or cloudiness rather
        than hard crystals. In red wine, pigments can stain the crystals.
    fr:
      question: "Un blanc sec sain, limpide à la mise, forme des cristaux durs, comme des éclats de verre, après un passage au réfrigérateur. Quelle première interprétation est la plus défendable ?"
      choices:
        - { text: "Un dépôt de tartre : sans effet sur la qualité, mais gênant à l’œil pour le consommateur", correct: true }
        - { text: "Une refermentation : les cristaux viennent de levures vivantes qui ont consommé le sucre résiduel", correct: false }
        - { text: "Une casse protéique : les protéines refroidies se sont déposées sous forme de cristaux", correct: false }
        - { text: "Une casse cuivrique ou ferrique : des métaux captés ont précipité au froid", correct: false }
      explanation: |
        Le bitartrate de potassium est le dépôt cristallin le plus courant en
        bouteille ; le tartrate de calcium existe aussi. Ces sels n’altèrent ni
        le goût ni la sécurité du vin, mais le consommateur peut les prendre
        pour du verre. Une casse protéique ou métallique donne plutôt un trouble
        ou un dépôt amorphe, et une refermentation du gaz ou un voile, pas des
        cristaux durs. Dans un rouge, les pigments peuvent teinter les cristaux.

  - id: wine-kht-cat-cold-test-limits-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, stability, tartrate, cold-stability]
    status: reviewed
    source_id: c07-0184
    review:
      fact_check: pass
      sources: [awri]
    en:
      question: A cellar proposes using one low-temperature test to assess the risk of both potassium bitartrate and calcium tartrate deposits. Which advice is most accurate?
      choices:
        - { text: "Use it mainly for potassium bitartrate; cooling strongly promotes KHT precipitation, while calcium tartrate is less temperature-dependent", correct: true }
        - { text: "Use it mainly for calcium tartrate; cooling strongly promotes CaT precipitation, while potassium bitartrate is less temperature-dependent", correct: false }
        - { text: "Use it equally for both salts; potassium and calcium tartrates have the same response to temperature and wine composition", correct: false }
        - { text: "Use a prolonged cold test for both salts; calcium tartrate will eventually precipitate if the chilled sample is held long enough", correct: false }
      explanation: |
        Potassium and tartaric acid occur naturally in grapes. Potassium hydrogen
        tartrate is less soluble in the hydroalcoholic wine than in juice, and
        its solubility falls further as temperature drops. Calcium tartrate can
        precipitate more slowly and is much less governed by temperature, so a
        KHT cold-stability result does not establish calcium stability. Wine pH,
        ion concentrations and crystallisation inhibitors also affect the risk.
    fr:
      question: "Une cave propose un seul test au froid pour évaluer le risque de dépôt de bitartrate de potassium et de tartrate de calcium. Quel conseil est le plus juste ?"
      choices:
        - { text: "Le réserver surtout au bitartrate de potassium : le froid favorise nettement sa précipitation, le tartrate de calcium y étant moins sensible", correct: true }
        - { text: "Le réserver surtout au tartrate de calcium : le froid favorise nettement sa précipitation, le bitartrate étant moins sensible à la température", correct: false }
        - { text: "L’employer pour les deux sels à égalité : les deux tartrates réagissent de la même façon à la température et à la composition du vin", correct: false }
        - { text: "Prolonger le test au froid pour les deux sels : le tartrate de calcium finit par précipiter si l’échantillon reste assez longtemps au froid", correct: false }
      explanation: |
        Le potassium et l’acide tartrique viennent naturellement du raisin. Le
        bitartrate de potassium est moins soluble dans le vin, alcoolisé, que
        dans le moût, et sa solubilité baisse encore avec la température. Le
        tartrate de calcium précipite plus lentement et dépend bien moins du
        froid : un vin stable vis-à-vis du KHT ne l’est donc pas forcément
        vis-à-vis du calcium. Le pH, la teneur en ions et les inhibiteurs de
        cristallisation jouent aussi.

  - id: wine-kht-cold-stabilisation-workflow-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, stability, tartrate, cold-stabilisation]
    status: reviewed
    source_id: c07-0188
    review:
      fact_check: pass
      sources: [awri, oiv]
    en:
      question: A finished blend fails its potassium bitartrate stability test. Which cellar plan best reduces the risk of visible crystals after bottling?
      choices:
        - { text: "Chill or contact-seed under a validated regime, rack or filter while cold, then retest the final wine", correct: true }
        - { text: "Chill or contact-seed under a validated regime, warm the wine before racking, then retest the final wine", correct: false }
        - { text: "Chill or contact-seed under a validated regime, rack while cold, then make final acid adjustments without retesting", correct: false }
        - { text: "Chill or contact-seed under a validated regime, rack while cold, then treat the KHT result as proof of calcium stability", correct: false }
      explanation: |
        Cooling promotes KHT crystallisation; adding KHT seed crystals can make
        the process faster. The appropriate temperature and contact time depend
        on the wine and the validated process rather than one universal below-
        zero recipe. Precipitated crystals are physically separated while the
        wine is still cold, because warming can redissolve some KHT. Blending or
        later additions can change stability, so the final wine is checked again.
    fr:
      question: "Un assemblage fini échoue au test de stabilité vis-à-vis du bitartrate de potassium. Quel plan de cave réduit le mieux le risque de cristaux visibles après la mise ?"
      choices:
        - { text: "Froid ou stabilisation par contact selon un protocole validé, soutirage ou filtration à froid, puis nouveau test du vin final", correct: true }
        - { text: "Froid ou stabilisation par contact selon un protocole validé, réchauffage avant soutirage, puis nouveau test du vin final", correct: false }
        - { text: "Froid ou stabilisation par contact selon un protocole validé, soutirage à froid, puis ajustement final de l’acidité sans nouveau test", correct: false }
        - { text: "Froid ou stabilisation par contact selon un protocole validé, soutirage à froid, puis résultat KHT pris comme preuve de stabilité calcique", correct: false }
      explanation: |
        Le froid fait cristalliser le KHT ; ensemencer avec des cristaux de KHT
        accélère le processus. Température et durée de contact dépendent du vin
        et du protocole validé, pas d’une recette unique sous zéro. On sépare
        les cristaux tant que le vin est froid, car en se réchauffant il en
        redissout une partie. Un assemblage ou un ajout ultérieur peut modifier
        la stabilité : on reteste donc le vin final.

  - id: wine-useful-microbes-packaging-risk-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, microbiology, fermentation, packaging]
    status: reviewed
    source_id: c07-0190
    review:
      fact_check: pass
      sources: [awri]
    en:
      question: Which statement best distinguishes useful winery microorganisms from microbiological instability in packaged wine?
      choices:
        - { text: "Selected yeast or bacteria can perform desired fermentations; unwanted viable populations after packaging can cause refermentation or spoilage", correct: true }
        - { text: "Selected yeast can perform alcoholic fermentation, whereas lactic acid bacteria should be removed even when a controlled MLF is planned", correct: false }
        - { text: "Selected yeast or bacteria can perform desired fermentations; completing those fermentations is sufficient microbial control for subsequent packaging", correct: false }
        - { text: "Selected yeast or bacteria can perform desired fermentations; visual clarity at packaging is sufficient evidence against later refermentation or spoilage", correct: false }
      explanation: |
        Microbial value depends on organism, timing, wine composition and the
        intended process. Selected yeasts conduct alcoholic fermentation and
        selected lactic acid bacteria can conduct MLF. The same broad groups can
        become unwanted later: viable yeast may referment residual sugar, while
        yeast or bacteria can create haze, gas, deposits or off-flavours in
        packaged wine. Clarity alone neither detects nor identifies viable cells.
    fr:
      question: "Quelle affirmation distingue le mieux les micro-organismes utiles en cave de l’instabilité microbienne d’un vin conditionné ?"
      choices:
        - { text: "Levures ou bactéries sélectionnées mènent les fermentations voulues ; des populations viables indésirables après la mise peuvent refermenter ou altérer le vin", correct: true }
        - { text: "Les levures sélectionnées mènent la fermentation alcoolique, mais les bactéries lactiques doivent être éliminées même si une FML maîtrisée est prévue", correct: false }
        - { text: "Levures ou bactéries sélectionnées mènent les fermentations voulues ; une fois ces fermentations achevées, le vin est sûr pour le conditionnement", correct: false }
        - { text: "Levures ou bactéries sélectionnées mènent les fermentations voulues ; un vin limpide à la mise ne risque plus ni refermentation ni altération", correct: false }
      explanation: |
        L’intérêt d’un micro-organisme dépend de l’espèce, du moment, de la
        composition du vin et du procédé visé. Des levures sélectionnées
        conduisent la fermentation alcoolique, des bactéries lactiques
        sélectionnées la FML. Les mêmes grands groupes deviennent indésirables
        plus tard : des levures viables peuvent refermenter le sucre résiduel,
        et levures ou bactéries peuvent causer trouble, gaz, dépôt ou faux goûts
        en bouteille. La limpidité ne révèle pas les cellules vivantes.

  - id: wine-equipment-clean-sanitise-sequence-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, hygiene, cleaning, sanitation, microbiology]
    status: reviewed
    source_id: c07-0191
    review:
      fact_check: pass
      sources: [awri]
    en:
      question: Wine spoilage organisms are recovered from a transfer line that contains dried wine residue. Which preparation is most robust before the line returns to service?
      choices:
        - { text: "Clean off the residue, rinse, then sanitise at the validated concentration and contact time", correct: true }
        - { text: "Apply sanitiser directly to the soiled line, rinse it, then store it without a separate cleaning step", correct: false }
        - { text: "Clean the line until visually bright, rinse it, then return it to service without a sanitation step", correct: false }
        - { text: "Clean and sanitise the accessible hose ends, then leave the valves and filler seals assembled and untreated", correct: false }
      explanation: |
        Cleaning removes organic soil, tartrate and biofilm that can shelter or
        feed microorganisms and prevent a sanitiser reaching the surface.
        Sanitation then reduces the viable population; concentration, contact
        time, temperature and surface compatibility matter. Complete
        sterilisation is a stricter outcome and is not the name for every routine
        winery hygiene operation. Hard-to-clean valves, seals and dead legs must
        be included because they can recontaminate otherwise sound wine.
    fr:
      question: "Des germes d’altération sont retrouvés dans une conduite de transfert encrassée de vin séché. Quelle préparation est la plus sûre avant de la remettre en service ?"
      choices:
        - { text: "Nettoyer les résidus, rincer, puis désinfecter à la concentration et au temps de contact validés", correct: true }
        - { text: "Appliquer le désinfectant directement sur la conduite sale, rincer, puis la ranger sans nettoyage séparé", correct: false }
        - { text: "Nettoyer jusqu’à ce que la conduite paraisse propre, rincer, puis la remettre en service sans désinfection", correct: false }
        - { text: "Nettoyer et désinfecter les embouts accessibles, en laissant vannes et joints de tireuse montés et non traités", correct: false }
      explanation: |
        Le nettoyage retire la matière organique, le tartre et le biofilm qui
        abritent ou nourrissent les micro-organismes et empêchent le
        désinfectant d’atteindre la surface. La désinfection réduit ensuite la
        population vivante ; concentration, temps de contact, température et
        compatibilité avec le matériau comptent. La stérilisation est un
        résultat plus strict, qui ne désigne pas toute opération d’hygiène
        courante. Vannes, joints et bras morts doivent être traités, car ils
        peuvent recontaminer un vin sain.

  - id: wine-microbial-risk-profile-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, microbiology, stability, packaging]
    status: reviewed
    source_id: c07-0194
    review:
      fact_check: pass
      sources: [awri]
    en:
      question: Four sound wines will be packaged with otherwise comparable controls. Which profile calls for the most conservative microbiological plan?
      choices:
        - { text: "Low alcohol, high pH, residual fermentable sugar and measurable malic acid", correct: true }
        - { text: "Low alcohol, low pH, analytically dry and with MLF completed", correct: false }
        - { text: "High alcohol, high pH, analytically dry and with MLF completed", correct: false }
        - { text: "High alcohol, low pH, residual fermentable sugar and measurable malic acid", correct: false }
      explanation: |
        The key risk factors can reinforce one another. Residual glucose and
        fructose can support yeast refermentation, while malic acid can support
        unwanted bacterial activity. Higher pH favours several spoilage microbes
        and reduces the antimicrobial effectiveness of a given free-SO₂ level;
        lower alcohol removes another hurdle. High alcohol suppresses many
        organisms but does not make every fortified wine sterile, so the actual
        wine and intended shelf life still need assessment and control.
    fr:
      question: "Quatre vins sains vont être conditionnés avec des contrôles par ailleurs comparables. Quel profil demande le plan microbiologique le plus prudent ?"
      choices:
        - { text: "Alcool bas, pH élevé, sucre fermentescible résiduel et acide malique mesurable", correct: true }
        - { text: "Alcool bas, pH bas, vin sec à l’analyse et FML achevée", correct: false }
        - { text: "Alcool élevé, pH élevé, vin sec à l’analyse et FML achevée", correct: false }
        - { text: "Alcool élevé, pH bas, sucre fermentescible résiduel et acide malique mesurable", correct: false }
      explanation: |
        Les facteurs de risque s’additionnent. Glucose et fructose résiduels
        peuvent nourrir une refermentation ; l’acide malique, une activité
        bactérienne indésirable. Un pH élevé favorise plusieurs germes
        d’altération et réduit l’efficacité d’une même dose de SO₂ libre ; un
        alcool bas lève un obstacle de plus. Un degré élevé freine beaucoup
        d’organismes sans rendre stérile tout vin muté : il faut toujours juger
        le vin réel et sa durée de vie prévue.

  - id: wine-bottling-headspace-oxygen-control-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, bottling, oxygen, inert-gas, packaging]
    status: reviewed
    source_id: c07-0197
    review:
      fact_check: pass
      sources: [awri, oiv]
    en:
      question: A bottling tank has low dissolved oxygen, but packaged samples show high total package oxygen driven mainly by bottle headspace. Which adjustment targets that result most directly?
      choices:
        - { text: "Optimise inert-gas purging and headspace dosing around filling and closure, then measure headspace oxygen during the run", correct: true }
        - { text: "Sparge the finished wine more aggressively in tank, leave the bottle gas settings unchanged, then remeasure total package oxygen", correct: false }
        - { text: "Select a lower-transmission closure, leave the bottle gas settings unchanged, then remeasure total package oxygen immediately after filling", correct: false }
        - { text: "Raise the pre-bottling free SO₂, leave the bottle gas settings unchanged, then infer total package oxygen from later SO₂ loss", correct: false }
      explanation: |
        Total package oxygen combines oxygen dissolved in the wine with oxygen
        in the bottle headspace. Purging empty bottles and displacing headspace
        air with nitrogen, argon or suitably managed carbon dioxide can reduce
        the latter; it does not literally eliminate every oxygen molecule.
        Closure oxygen transmission matters during storage, while SO₂ mitigates
        oxidation rather than removing the initial headspace oxygen measured at
        packaging. Direct measurements confirm whether the line setup worked.
    fr:
      question: "La cuve de tirage contient peu d’oxygène dissous, mais les bouteilles montrent un oxygène total élevé, dû surtout à l’espace de tête. Quel réglage vise ce résultat le plus directement ?"
      choices:
        - { text: "Optimiser l’inertage et le dosage de gaz dans l’espace de tête au remplissage et au bouchage, puis mesurer l’oxygène de tête en cours de tirage", correct: true }
        - { text: "Barboter plus fort le vin fini en cuve, sans toucher aux réglages de gaz en bouteille, puis remesurer l’oxygène total", correct: false }
        - { text: "Choisir un bouchon moins perméable, sans toucher aux réglages de gaz en bouteille, puis remesurer l’oxygène total juste après remplissage", correct: false }
        - { text: "Augmenter le SO₂ libre avant la mise, sans toucher aux réglages de gaz en bouteille, puis déduire l’oxygène total de la baisse ultérieure du SO₂", correct: false }
      explanation: |
        L’oxygène total du conditionnement additionne l’oxygène dissous dans le
        vin et celui de l’espace de tête. Purger les bouteilles vides et chasser
        l’air de tête à l’azote, à l’argon ou au CO₂ bien dosé réduit ce second
        poste, sans supprimer chaque molécule d’oxygène. La perméabilité du
        bouchon joue pendant le stockage, et le SO₂ freine l’oxydation sans
        retirer l’oxygène de tête présent à la mise. Seule une mesure directe
        confirme que la ligne est bien réglée.

  - id: wine-glass-package-barrier-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, packaging, glass, oxygen]
    status: reviewed
    source_id: c07-0198
    review:
      fact_check: pass
      sources: [extension, research]
    en:
      question: Which statement best describes the role of glass itself in a sealed wine package?
      choices:
        - { text: "Glass is flavour-neutral and effectively impermeable to oxygen; the closure and seal provide a separate gas-transfer pathway", correct: true }
        - { text: "Glass is flavour-neutral but slowly permeable to oxygen; the closure mainly determines whether liquid can leak", correct: false }
        - { text: "Glass blocks oxygen and is flavour-neutral, so closure choice has no further effect on the package's oxygen exposure", correct: false }
        - { text: "Clear glass transmits oxygen while coloured glass blocks it; bottle colour therefore sets the package's gas barrier", correct: false }
      explanation: |
        Glass is chemically inert in normal wine use and forms an excellent gas
        barrier. The complete package still includes a closure, seal and initial
        headspace, each of which can affect oxygen exposure. Bottle colour mainly
        changes protection from light (hence light-strike in clear-glass whites
        and sparkling wines), not oxygen permeability. Glass is strong and
        familiar but also rigid and relatively heavy, creating logistical costs.
    fr:
      question: "Quel rôle joue le verre lui-même dans une bouteille de vin fermée ?"
      choices:
        - { text: "Le verre est neutre en goût et quasi imperméable à l’oxygène ; le bouchon et son étanchéité forment une autre voie d’échange gazeux", correct: true }
        - { text: "Le verre est neutre en goût mais laisse lentement passer l’oxygène ; le bouchon décide surtout si le liquide peut fuir", correct: false }
        - { text: "Le verre bloque l’oxygène et reste neutre en goût, si bien que le choix du bouchon ne change plus l’exposition à l’oxygène", correct: false }
        - { text: "Le verre clair laisse passer l’oxygène, le verre teinté le bloque ; la couleur de la bouteille fixe donc la barrière aux gaz", correct: false }
      explanation: |
        Le verre est chimiquement inerte au contact du vin et forme une
        excellente barrière aux gaz. La bouteille complète comprend pourtant un
        bouchon, une étanchéité et un espace de tête, qui jouent chacun sur
        l’oxygène. La couleur du verre protège surtout de la lumière (d’où le
        goût de lumière des blancs et effervescents en verre clair), pas de
        l’oxygène. Solide et familier, le verre est aussi rigide et lourd, ce
        qui pèse sur la logistique.

  - id: wine-pet-package-shelf-life-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, packaging, pet, oxygen, shelf-life]
    status: reviewed
    source_id: c07-0202
    review:
      fact_check: pass
      sources: [extension, research]
    en:
      question: A producer is considering PET bottles for a young, fruit-forward wine. Which approach to setting shelf life is most defensible?
      choices:
        - { text: "Validate the whole PET package with this wine and storage; PET usually lets in more oxygen than glass", correct: true }
        - { text: "Reuse the shelf life proven for the same wine in glass, as PET walls block oxygen just as well", correct: false }
        - { text: "Set shelf life from closure transmission alone, as the PET wall is not a meaningful oxygen route", correct: false }
        - { text: "Set shelf life from a cellar-temperature trial and apply it unchanged to warm distribution chains", correct: false }
      explanation: |
        PET is light and can suit wines intended for relatively early drinking,
        but the bottle wall normally provides a weaker oxygen barrier than glass.
        PET construction, barrier or scavenger technology, closure, package size,
        storage temperature and the wine's sensitivity all affect performance.
        A producer therefore validates the complete filled package rather than
        treating “a few months” as a universal limit for every PET bottle.
    fr:
      question: "Un producteur envisage la bouteille PET pour un vin jeune et fruité. Quelle façon de fixer sa durée de vie est la plus défendable ?"
      choices:
        - { text: "Valider l’emballage PET complet avec ce vin et ce stockage ; le PET laisse en général entrer plus d’oxygène que le verre", correct: true }
        - { text: "Reprendre la durée de vie établie pour le même vin en verre, la paroi PET bloquant l’oxygène tout aussi bien", correct: false }
        - { text: "Fixer la durée de vie d’après la seule perméabilité du bouchon, la paroi PET n’étant pas une voie d’oxygène notable", correct: false }
        - { text: "Fixer la durée de vie par un essai à température de cave, puis l’appliquer telle quelle à une distribution au chaud", correct: false }
      explanation: |
        Le PET est léger et peut convenir à des vins à boire assez vite, mais
        sa paroi freine en général moins bien l’oxygène que le verre. Le type de
        PET, les couches barrières ou absorbeurs d’oxygène, le bouchon, le
        format, la température de stockage et la sensibilité du vin jouent tous.
        On valide donc l’emballage rempli plutôt que de poser « quelques mois »
        comme limite valable pour toute bouteille PET.

  - id: wine-bag-in-box-oxygen-tradeoff-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, packaging, bag-in-box, oxygen, shelf-life]
    status: reviewed
    source_id: c07-0203
    review:
      fact_check: pass
      sources: [industry-guideline, extension, research]
    en:
      question: A venue wants a wine package that remains sound through repeated pours over several weeks. Which claim about bag-in-box is most defensible?
      choices:
        - { text: "The bag collapses so little air enters on pouring, but film and tap still let oxygen in", correct: true }
        - { text: "The collapsing bag makes the package hermetic, so tap hygiene alone limits shelf life", correct: false }
        - { text: "An opened bag takes in air with each pour, much like a partly emptied bottle", correct: false }
        - { text: "The multilayer film is a better oxygen barrier than glass, so the box suits long ageing", correct: false }
      explanation: |
        A rigid partly emptied bottle replaces poured wine with an air-filled
        headspace. A bag-in-box instead collapses as wine is dispensed, limiting
        that route of oxygen entry. It is not hermetic: oxygen can still enter
        through the multilayer film, welds, fitment and tap, and initial package
        oxygen and temperature also matter. Opened and unopened shelf lives are
        therefore product-specific claims to validate, not one universal period.
    fr:
      question: "Un établissement veut un emballage qui reste sain pendant plusieurs semaines de service au verre. Quelle affirmation sur le bag-in-box est la plus défendable ?"
      choices:
        - { text: "La poche se rétracte et prend peu d’air au service, mais film et robinet laissent encore passer l’oxygène", correct: true }
        - { text: "La poche qui se rétracte rend l’emballage hermétique : seule l’hygiène du robinet limite sa durée de vie", correct: false }
        - { text: "Une poche entamée prend de l’air à chaque verre servi, comme une bouteille à moitié vide", correct: false }
        - { text: "Le film multicouche arrête mieux l’oxygène que le verre, ce qui convient à une longue garde", correct: false }
      explanation: |
        Une bouteille rigide entamée remplace le vin servi par de l’air. La
        poche d’un bag-in-box, elle, se rétracte à mesure qu’on la vide et ferme
        cette voie d’entrée. Elle n’est pas hermétique pour autant : l’oxygène
        traverse le film, les soudures, le raccord et le robinet, et l’oxygène
        initial comme la température comptent aussi. Les durées de vie avant et
        après ouverture se valident donc produit par produit.

  - id: wine-closure-selection-trial-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, packaging, closure, oxygen, shelf-life]
    status: reviewed
    source_id: c07-0205
    review:
      fact_check: pass
      sources: [awri, oiv]
    en:
      question: A producer is selecting a closure for an aromatic wine intended to spend three years in bottle. Which selection process is most defensible?
      choices:
        - { text: "Trial closures against the wine's shelf-life target, then check bottle, line, legal and market fit", correct: true }
        - { text: "Pick the lowest-oxygen closure on offer, since an aromatic white needs maximum protection from air", correct: false }
        - { text: "Pick the closure traditional for the region, then confirm it runs on the bottling line", correct: false }
        - { text: "Run a three-month closure trial, then project the three-year result from early tasting", correct: false }
      explanation: |
        Closure selection is a package-design decision. Initial package oxygen,
        oxygen transmission rate and its variability influence SO₂ retention,
        fruit preservation, oxidation and sometimes reductive development. The
        target depends on the wine and intended shelf life, so comparative trials
        are stronger than assuming the lowest or highest oxygen exposure is
        universally best. Bottle finish, line capability, legal requirements,
        ease of use, cost and market acceptance remain practical constraints.
    fr:
      question: "Un producteur choisit le bouchage d’un vin aromatique censé passer trois ans en bouteille. Quelle démarche est la plus défendable ?"
      choices:
        - { text: "Tester les bouchages face à la durée de vie visée, puis vérifier bouteille, ligne, règles et marché", correct: true }
        - { text: "Prendre le bouchage le moins perméable disponible, un blanc aromatique devant être protégé au maximum de l’air", correct: false }
        - { text: "Prendre le bouchage traditionnel de la région, puis vérifier qu’il passe sur la ligne d’embouteillage", correct: false }
        - { text: "Faire un essai de trois mois, puis extrapoler le résultat à trois ans d’après les premières dégustations", correct: false }
      explanation: |
        Le bouchage fait partie de la conception de l’emballage. L’oxygène
        initial, le taux de transfert d’oxygène et sa variabilité jouent sur la
        tenue du SO₂, la préservation du fruit, l’oxydation et parfois une
        évolution réductrice. La bonne cible dépend du vin et de sa durée de
        vie : un essai comparatif vaut mieux que de croire le bouchage le moins
        (ou le plus) perméable meilleur par principe. Bague de la bouteille,
        ligne, réglementation, praticité, coût et attentes du marché restent des
        contraintes.

  - id: wine-natural-cork-oxygen-variability-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, packaging, closure, cork, oxygen]
    status: reviewed
    source_id: c07-0210
    review:
      fact_check: pass
      sources: [awri, research]
    en:
      question: A trial bottles the same wine under several closures with equal initial package oxygen. Which conclusion about natural cork is most defensible?
      choices:
        - { text: "Its oxygen ingress varies; more may speed development but also raises oxidation risk", correct: true }
        - { text: "Its oxygen ingress is more uniform from bottle to bottle than that of synthetic closures", correct: false }
        - { text: "It usually admits less oxygen than a screwcap with a tin-lined liner", correct: false }
        - { text: "Its oxygen ingress rises steadily with bottle age, so later years admit the most", correct: false }
      explanation: |
        Natural corks can differ in oxygen transmission and consistency. Some
        oxygen measured early in bottle can be released from gas held within the
        compressed closure, while later transfer can involve the cork and the
        cork–glass interface. Oxygen can change the pace of colour, aroma and
        tannin development, but more ingress is not automatically beneficial and
        can consume SO₂ and accelerate oxidation. Positive tertiary development
        is therefore not a guaranteed consequence or unique benefit of cork.
    fr:
      question: "Un essai met le même vin en bouteille sous plusieurs bouchages, avec le même oxygène initial. Quelle conclusion sur le bouchon de liège naturel est la plus défendable ?"
      choices:
        - { text: "Son apport d’oxygène varie ; davantage peut accélérer l’évolution mais accroît aussi le risque d’oxydation", correct: true }
        - { text: "Son apport d’oxygène est plus régulier d’une bouteille à l’autre que celui des bouchons synthétiques", correct: false }
        - { text: "Il laisse en général entrer moins d’oxygène qu’une capsule à vis à joint étain", correct: false }
        - { text: "Son apport d’oxygène augmente avec l’âge de la bouteille, si bien que les dernières années en apportent le plus", correct: false }
      explanation: |
        Les bouchons de liège naturel diffèrent par leur perméabilité et leur
        régularité. Une partie de l’oxygène mesuré tôt en bouteille provient du
        gaz contenu dans le liège comprimé ; ensuite, les échanges passent par
        le bouchon et l’interface liège–verre. L’oxygène règle le rythme
        d’évolution de la couleur, des arômes et des tanins, mais davantage
        d’oxygène n’est pas forcément un bien : il consomme le SO₂ et peut
        accélérer l’oxydation. Une belle évolution tertiaire n’est donc ni
        garantie ni réservée au liège.

  - id: wine-musty-haloanisole-investigation-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, wine-fault, tca, haloanisole, cork-taint]
    status: reviewed
    source_id: c07-0212
    review:
      fact_check: pass
      sources: [awri]
    en:
      question: Several bottles from different closure formats show muted fruit and a musty, damp-cardboard aroma. Which investigation is most defensible?
      choices:
        - { text: "Test the wine, closures, water and cellar or packaging materials for TCA and related haloanisoles", correct: true }
        - { text: "Test the wine and natural-cork stock for TCA and related haloanisoles", correct: false }
        - { text: "Test the wine for TCA, then treat a negative result as excluding other compounds that can produce musty aromas", correct: false }
        - { text: "Measure closure oxygen transmission and oxidation markers, since oxidised wine can also lose fruit and smell stale", correct: false }
      explanation: |
        TCA is the principal compound associated with “cork taint” and can
        suppress fruit as well as produce a musty or mouldy aroma at very low
        concentration. It is not confined to natural cork: contaminated oak,
        water, winery structures or packaging materials can transfer TCA, while
        related haloanisoles such as TBA and several non-haloanisole compounds can
        also smell musty. Source control, avoidance of problematic chlorinated
        materials, supplier quality assurance and environmental investigation are
        therefore more useful than assuming the closure alone identifies the cause.
    fr:
      question: "Plusieurs bouteilles, sous différents types de bouchage, montrent un fruit éteint et une odeur de moisi, de carton humide. Quelle enquête est la plus défendable ?"
      choices:
        - { text: "Rechercher le TCA et les haloanisoles apparentés dans le vin, les bouchons, l’eau, la cave et les emballages", correct: true }
        - { text: "Rechercher le TCA et les haloanisoles apparentés dans le vin et le stock de bouchons en liège naturel", correct: false }
        - { text: "Rechercher le TCA dans le vin, puis considérer qu’un résultat négatif écarte tout autre composé à odeur de moisi", correct: false }
        - { text: "Mesurer la perméabilité des bouchons et les marqueurs d’oxydation, un vin oxydé pouvant aussi perdre son fruit et sentir l’éventé", correct: false }
      explanation: |
        Le TCA est le principal responsable du « goût de bouchon » : à très
        faible dose, il éteint le fruit et donne une odeur de moisi. Il ne vient
        pas que du liège : bois, eau, charpentes de chai ou matériaux
        d’emballage contaminés peuvent le transmettre, et d’autres haloanisoles
        comme le TBA, voire des composés d’une autre famille, sentent aussi le
        moisi. Maîtriser les sources, éviter les produits chlorés à risque,
        contrôler les fournisseurs et enquêter sur l’environnement du chai sont
        plus utiles que d’accuser d’emblée le bouchon.

  - id: wine-screwcap-liner-comparison-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, packaging, closure, screwcap, oxygen]
    status: reviewed
    source_id: c07-0220
    review:
      fact_check: pass
      sources: [awri]
    en:
      question: A producer wants to compare two screwcap liners for an aromatic white with a three-year shelf-life target. Which trial gives the cleanest evidence?
      choices:
        - { text: "Bottle one wine with matched glass, application and initial package oxygen; vary only the liner, then follow both through three years", correct: true }
        - { text: "Bottle one wine with matched glass and application; give each liner different initial package oxygen, then follow both through three years", correct: false }
        - { text: "Bottle one wine with matched glass, application and initial package oxygen; vary the liner, then extrapolate three years from three months", correct: false }
        - { text: "Bottle one wine with matched initial package oxygen; use different bottle finishes and application settings, then compare the liners after three years", correct: false }
      explanation: |
        The liner forms the seal against the bottle rim and different liner
        constructions provide different oxygen transmission rates; screwcaps are
        therefore not one perfectly impermeable category. A matched trial isolates
        that variable while controlling the wine, bottle finish, application and
        oxygen present at packaging. Lower ingress can help retain SO₂ and fruit,
        but the wine must also be followed for unwanted reductive or oxidative
        development across its intended life rather than judged from a brief trial.
    fr:
      question: "Un producteur veut comparer deux joints de capsule à vis pour un blanc aromatique qui doit tenir trois ans. Quel essai donne la preuve la plus nette ?"
      choices:
        - { text: "Un même vin, verre, sertissage et oxygène initial identiques ; seul le joint change, puis suivi sur trois ans", correct: true }
        - { text: "Un même vin, verre et sertissage identiques ; un oxygène initial différent pour chaque joint, puis suivi sur trois ans", correct: false }
        - { text: "Un même vin, verre, sertissage et oxygène initial identiques ; le joint change, puis extrapolation à trois ans depuis trois mois", correct: false }
        - { text: "Un même vin, oxygène initial identique ; bagues de bouteille et réglages de sertissage différents, puis comparaison des joints après trois ans", correct: false }
      explanation: |
        Le joint assure l’étanchéité contre le buvant de la bouteille, et les
        différents types de joints laissent passer plus ou moins d’oxygène : la
        capsule à vis n’est pas une catégorie uniformément étanche. Un essai
        apparié isole ce facteur en fixant le vin, la bague, le sertissage et
        l’oxygène présent à la mise. Moins d’oxygène aide à garder le SO₂ et le
        fruit, mais il faut suivre le vin sur toute sa durée de vie pour repérer
        une évolution réductrice ou oxydative, pas le juger sur un essai court.

  - id: wine-drink-young-majority-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, maturation, bottle-ageing, drinking-window]
    status: reviewed
    source_id: c07-0221
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Across all wine produced worldwide, what drinking window suits the large majority of bottles?
      choices:
        - { text: "Within roughly a year of release", correct: true }
        - { text: "Between three and five years after release", correct: false }
        - { text: "Between five and ten years after release", correct: false }
        - { text: "After at least a decade in bottle", correct: false }
      explanation: |
        Most wine is made in a fruit-forward style for early consumption, and
        little of it gains anything from cellaring. Long bottle development is
        the exception, confined to a small share of wines with the concentration
        and structure to evolve; for everyday bottles, freshness is the asset.
    fr:
      question: "Sur l’ensemble du vin produit dans le monde, quelle fenêtre de consommation convient à la grande majorité des bouteilles ?"
      choices:
        - { text: "Dans l’année environ qui suit la mise en marché", correct: true }
        - { text: "Entre trois et cinq ans après la mise en marché", correct: false }
        - { text: "Entre cinq et dix ans après la mise en marché", correct: false }
        - { text: "Après au moins dix ans en bouteille", correct: false }
      explanation: |
        L’essentiel du vin est fait dans un style fruité, à boire vite, et ne
        gagne rien à séjourner en cave. Une longue évolution en bouteille reste
        l’exception, réservée à une petite part de vins assez concentrés et
        structurés pour évoluer ; pour un vin courant, la fraîcheur est l’atout.

  - id: wine-drink-young-kept-too-long-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, maturation, bottle-ageing, primary-fruit]
    status: reviewed
    source_id: c07-0222
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: An inexpensive, fruit-led rosé made for early drinking is opened three years after bottling. What change is most likely?
      choices:
        - { text: "Its fresh primary fruit has faded", correct: true }
        - { text: "It has softened into a rounder, better-integrated wine", correct: false }
        - { text: "Its flavours have knitted together and become more expressive", correct: false }
        - { text: "It has gained complex tertiary notes that improve it", correct: false }
      explanation: |
        Wines built for youth rely on vibrant primary aromas, which fade with
        time in bottle. Without the concentration and structure that support
        positive development, the wine tends to taste dull or tired rather than
        rounder or more complex.
    fr:
      question: "Un rosé bon marché, axé sur le fruit et fait pour être bu jeune, est ouvert trois ans après sa mise en bouteille. Quel changement est le plus probable ?"
      choices:
        - { text: "Son fruit primaire frais s’est estompé", correct: true }
        - { text: "Il s’est assoupli en un vin plus rond et mieux fondu", correct: false }
        - { text: "Ses arômes se sont liés et sont devenus plus expressifs", correct: false }
        - { text: "Il a pris des notes tertiaires complexes qui l’améliorent", correct: false }
      explanation: |
        Un vin fait pour sa jeunesse repose sur des arômes primaires éclatants,
        qui s’effacent avec le temps en bouteille. Faute de la concentration et
        de la structure qui permettent une évolution favorable, il paraît plutôt
        terne ou fatigué que plus rond ou plus complexe.

  - id: wine-bottle-ageing-styles-001
    type: mcq
    deck: Winemaking and Maturation
    tags: [winemaking, maturation, bottle-ageing, drinking-window]
    status: reviewed
    source_id: c07-0223
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which group contains only wine styles that typically need several years in bottle before showing their best?
      choices:
        - { text: "Vintage Port, top German Riesling, Bordeaux classed growths", correct: true }
        - { text: "Vintage Port, top German Riesling, generic Bordeaux AOC red", correct: false }
        - { text: "Filtered LBV Port, top German Riesling, Bordeaux classed growths", correct: false }
        - { text: "Vintage Port, Marlborough Sauvignon Blanc, Bordeaux classed growths", correct: false }
      explanation: |
        Vintage Port spends only a short time in wood and does most of its
        maturing in bottle, while high-acid top Rieslings and tannic classed
        growths also develop over years. Filtered LBV Port, generic Bordeaux
        reds and most Marlborough Sauvignon Blanc are made ready to drink on
        release and are usually best enjoyed in their youth.
    fr:
      question: "Quel groupe ne contient que des styles de vin qui demandent en général plusieurs années de bouteille pour donner leur meilleur ?"
      choices:
        - { text: "Porto Vintage, grands Rieslings allemands, crus classés de Bordeaux", correct: true }
        - { text: "Porto Vintage, grands Rieslings allemands, bordeaux rouge AOC générique", correct: false }
        - { text: "Porto LBV filtré, grands Rieslings allemands, crus classés de Bordeaux", correct: false }
        - { text: "Porto Vintage, Sauvignon Blanc de Marlborough, crus classés de Bordeaux", correct: false }
      explanation: |
        Le Porto Vintage ne passe que peu de temps en bois et fait l’essentiel de
        son évolution en bouteille ; les grands Rieslings, portés par leur
        acidité, et les crus classés tanniques se bonifient eux aussi sur
        plusieurs années. Le Porto LBV filtré, le bordeaux rouge générique et la
        plupart des Sauvignons Blancs de Marlborough sont faits pour être prêts
        à la mise en marché et se boivent de préférence jeunes.
