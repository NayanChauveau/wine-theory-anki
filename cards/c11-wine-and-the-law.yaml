# yaml-language-server: $schema=../schema/cards.schema.json
# source: C11 (import/inbox/c11-wine-and-the-law.yaml)
# deck: Wine and the Law

cards:
  - id: law-safety-aim-001
    type: mcq
    deck: Wine and the Law
    tags: [law, safety]
    status: reviewed
    source_id: c11-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the first job of food-and-drink law?
      choices:
        - { text: "To pick the winning grape variety for each village", correct: false }
        - { text: "To keep what is sold safe and fit to drink", correct: true }
        - { text: "To ban all labels", correct: false }
        - { text: "To set a single world wine price", correct: false }
      explanation: |
        Before terroir stories come **safety**: the bottle must not poison
        anyone. Style rules sit on top of that floor.

  - id: law-so2-example-001
    type: mcq
    deck: Wine and the Law
    tags: [law, safety]
    status: reviewed
    source_id: c11-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which wine-safety topic do regulators watch especially closely?
      choices:
        - { text: "The colour of the capsule foil", correct: false }
        - { text: "Sulphur dioxide (SO₂)", correct: true }
        - { text: "The punt depth of the bottle", correct: false }
        - { text: "The winemaker’s hat size", correct: false }
      explanation: |
        **SO₂** is both a useful antiseptic and a toxin in excess — and a
        trigger for some asthmatics. That is why it is capped and labelled.

  - id: law-so2-toxic-001
    type: mcq
    deck: Wine and the Law
    tags: [law, safety]
    status: reviewed
    source_id: c11-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why must SO₂ levels be watched?
      choices:
        - { text: "SO₂ has no effect on people at any dose", correct: false }
        - { text: "High levels can be toxic", correct: true }
        - { text: "The law requires unlimited SO₂ in every wine", correct: false }
        - { text: "SO₂ is only a colour, never a chemical", correct: false }
      explanation: |
        Over a threshold, sulphites **hurt**. Legal maxima exist for that
        reason, not as a flavour fashion.

  - id: law-contains-sulphites-001
    type: mcq
    deck: Wine and the Law
    tags: [law, labelling]
    status: reviewed
    source_id: c11-0004
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: What labelling step do most countries take on SO₂?
      choices:
        - { text: "A ban on mentioning sulphur at all", correct: false }
        - { text: "The words “contains sulphites” (or similar) on the label", correct: true }
        - { text: "A requirement to print the full chemical formula only in Latin", correct: false }
        - { text: "SO₂ must be hidden from the buyer", correct: false }
      explanation: |
        Above a low threshold (in the EU, **10 mg/L**) the label must warn
        **contains sulphites**. It is an allergen notice, not a quality score.

  - id: law-yeast-so2-001
    type: mcq
    deck: Wine and the Law
    tags: [law, labelling]
    status: reviewed
    source_id: c11-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do almost all wines still need that sulphite line?
      choices:
        - { text: "Fermentation itself makes some SO₂, even if you add none", correct: true }
        - { text: "Yeast never produces any sulphur compound", correct: false }
        - { text: "The words are optional decoration", correct: false }
        - { text: "Only sparkling wine ferments", correct: false }
      explanation: |
        Yeasts **generate sulphites** as they work. A “no added sulphur” wine
        can still sit over the labelling trigger. True zero is rare.

  - id: law-label-truth-001
    type: mcq
    deck: Wine and the Law
    tags: [law, labelling]
    status: reviewed
    source_id: c11-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What must the person who puts a wine on sale guarantee about the pack?
      choices:
        - { text: "That every claim on it is a joke", correct: false }
        - { text: "That descriptions and claims are accurate", correct: true }
        - { text: "That the region named is always fictional", correct: false }
        - { text: "That vintage is optional and may be invented", correct: false }
      explanation: |
        The **bottler / brand owner** owns the truth of the label: vintage,
        variety, place. Fraud starts when that contract breaks.

  - id: law-label-checkable-001
    type: mcq
    deck: Wine and the Law
    tags: [law, labelling]
    status: reviewed
    source_id: c11-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does that accuracy duty force onto the wording of a label?
      choices:
        - { text: "It can be vague poetry that nobody can test", correct: false }
        - { text: "The information must be clear and checkable", correct: true }
        - { text: "Only a painting, never words", correct: false }
        - { text: "A different vintage on every bottle in the case", correct: false }
      explanation: |
        Inspectors need a **testable claim**: 85% from X, vintage Y. A mood
        board is not a GI.

  - id: law-gi-and-style-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two label ideas matter most for integrity?
      choices:
        - { text: "Font and foil colour only", correct: false }
        - { text: "Geographical indications, and legally defined quality or style words", correct: true }
        - { text: "The winemaker’s favourite song", correct: false }
        - { text: "A ban on any place name", correct: false }
      explanation: |
        **Chablis** and **Gran Reserva** are protected strings. They are why
        GI and style terms sit at the centre of wine law.

  - id: law-why-gi-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do place names show up so often on wine labels?
      choices:
        - { text: "Where the grapes grew can shape style and quality", correct: true }
        - { text: "Place has no effect on wine at all", correct: false }
        - { text: "GIs are only a tax on empty bottles", correct: false }
        - { text: "The WTO bans all geography on labels", correct: false }
      explanation: |
        **Origin** is a shortcut for climate, grape and method. That is worth
        protecting — and worth faking, which is why the law exists.

  - id: law-gi-define-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In plain language, what is a GI?
      choices:
        - { text: "A yeast strain patented in one cellar", correct: false }
        - { text: "A named vineyard area inside a country", correct: true }
        - { text: "A tax code for corks", correct: false }
        - { text: "A tasting note category", correct: false }
      explanation: |
        A **geographical indication** is a **map with a name**: Bordeaux, Napa
        Valley, La Romanée. Not a recipe and not a brand.

  - id: law-gi-size-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How large can a GI be?
      choices:
        - { text: "Always exactly 100 hectares", correct: false }
        - { text: "From a whole region such as Bordeaux to a single vineyard such as La Romanée", correct: true }
        - { text: "Always an entire continent", correct: false }
        - { text: "GIs may not name a place smaller than a country", correct: false }
      explanation: |
        **Bordeaux AOC** is a sea of vines; **La Romanée** is a closet. Both
        are GIs. Size is not the definition.

  - id: law-fraud-premium-001
    type: mcq
    deck: Wine and the Law
    tags: [law, fraud]
    status: reviewed
    source_id: c11-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What extra risk sits on wines that sell for a fortune?
      choices:
        - { text: "They cannot legally be faked", correct: false }
        - { text: "Fraud — the name is worth stealing", correct: true }
        - { text: "They are exempt from all labelling law", correct: false }
        - { text: "Counterfeits only target water", correct: false }
      explanation: |
        **Rudy Kurniawan** and fake DRC bottles are the grim anecdote: the
        more the name is worth, the more someone will print it on the wrong
        wine.

  - id: law-gi-multi-jurisdiction-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does GI law get messy so fast?
      choices:
        - { text: "Only one country ever makes or sells wine", correct: false }
        - { text: "Grapes, bottling and sale can sit under more than one country’s rules", correct: true }
        - { text: "GIs are unwritten and never enforced", correct: false }
        - { text: "The WTO banned all place names", correct: false }
      explanation: |
        Bulk Chilean wine bottled in the UK, or a US brand using a French
        word, crosses **two legal systems**. That is why a single local AOC
        text is not enough.

  - id: law-wto-gi-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0014
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: What shared GI frame do the big producing countries work under?
      choices:
        - { text: "A private tasting club with no legal force", correct: false }
        - { text: "The WTO’s GI system (TRIPS), which they have signed up to", correct: true }
        - { text: "Only municipal parking rules", correct: false }
        - { text: "A ban on any international agreement", correct: false }
      explanation: |
        **TRIPS** at the **WTO** is the treaty that makes “Champagne” more
        than a French hobby-horse. Members agree to respect each other’s GIs.

  - id: law-australia-chablis-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which labelling change is the usual example of those WTO GI deals?
      choices:
        - { text: "Australia may still call any white wine Chablis", correct: false }
        - { text: "Australians dropped EU names such as Chablis from their wines", correct: true }
        - { text: "The EU must now call all white wine Hunter Chardonnay", correct: false }
        - { text: "GIs were abolished worldwide in 1995", correct: false }
      explanation: |
        The **1994 EU–Australia** wine deal (and later WTO pressure) retired
        **Chablis, Burgundy, Champagne** as Australian generic words. Hunter
        and Adelaide Hills took their place.

  - id: law-gi-85-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: If a label states a GI, how much of the wine usually has to come from there?
      choices:
        - { text: "Always 1%, worldwide", correct: false }
        - { text: "Often about 85% — but that figure is not a single world standard", correct: true }
        - { text: "Always 100% for every PGI and AVA alike", correct: false }
        - { text: "GIs never require any local grapes", correct: false }
      explanation: |
        **85%** is the usual WTO / New World floor. The EU **PDO** is tighter
        (all the grapes). Treat 85% as a habit, not a universal law.

  - id: law-pdo-100-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0017
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: How does an EU PDO treat the origin of the grapes?
      choices:
        - { text: "Half the fruit may come from another continent", correct: false }
        - { text: "All of the grapes must come from the named area", correct: true }
        - { text: "No grapes are required at all", correct: false }
        - { text: "PDO is only a tax, never a map", correct: false }
      explanation: |
        **PDO = 100% from the place**. That is the fraud-prevention bite the
        inbox was aiming at, and it is stricter than a typical AVA or PGI.

  - id: law-eu-two-tiers-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0018
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: How many GI quality rungs does the EU use, and what are they?
      choices:
        - { text: "One — Vin de France only", correct: false }
        - { text: "Two — PDO and PGI", correct: true }
        - { text: "Five Prädikat steps only", correct: false }
        - { text: "None — the EU banned GIs", correct: false }
      explanation: |
        **PDO** and **PGI** are the two boxes. Vin de France sits **outside**
        the GI pair.

  - id: law-pdo-vs-pgi-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Broadly, how does a PDO differ from a PGI?
      choices:
        - { text: "PDOs are always larger and have no rules", correct: false }
        - { text: "PDOs are smaller maps with tighter production rules", correct: true }
        - { text: "PGIs require 100% local grapes and PDOs require 50%", correct: false }
        - { text: "They are identical words", correct: false }
      explanation: |
        **Chablis** (PDO) is a tight script; **Pays d’Oc** (PGI) is a wide
        canvas. Size and rulebook both shrink as you climb toward PDO.

  - id: law-france-ac-001
    type: mcq
    deck: Wine and the Law
    tags: [law, france]
    status: reviewed
    source_id: c11-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which letters still stand in for PDO on most French bottles?
      choices:
        - { text: "IGT", correct: false }
        - { text: "AC / AOC — appellation d'origine contrôlée", correct: true }
        - { text: "AVA", correct: false }
        - { text: "QbA", correct: false }
      explanation: |
        **AOC** (sometimes AC) is the everyday French PDO word. AOP is the EU
        synonym; it has not won the label.

  - id: law-france-aop-001
    type: mcq
    deck: Wine and the Law
    tags: [law, france]
    status: reviewed
    source_id: c11-0021
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: What is the official French EU term for PDO?
      choices:
        - { text: "Vin de France", correct: false }
        - { text: "Appellation d'origine protégée (AOP)", correct: true }
        - { text: "DOCG", correct: false }
        - { text: "Ward", correct: false }
      explanation: |
        **AOP** is PDO in French. You still see **AOC** more often on the
        neck. Same legal box, two spellings.

  - id: law-france-igp-vdp-001
    type: mcq
    deck: Wine and the Law
    tags: [law, france]
    status: reviewed
    source_id: c11-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is replacing Vin de Pays on French PGI labels?
      choices:
        - { text: "Grand Cru Classé", correct: false }
        - { text: "IGP (indication géographique protégée)", correct: true }
        - { text: "DOCG", correct: false }
        - { text: "A ban on any geography", correct: false }
      explanation: |
        **IGP** is the EU PGI name. **Vin de Pays** still appears beside it
        (Pays d’Oc) but IGP is the modern line.

  - id: law-eu-gi-methods-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What extra do European GIs usually police, beyond a map?
      choices:
        - { text: "Only the colour of the truck that hauls the grapes", correct: false }
        - { text: "Which grapes may be grown and how they may be grown and made", correct: true }
        - { text: "A ban on naming any grape", correct: false }
        - { text: "Nothing — EU GIs are place names with no rulebook", correct: false }
      explanation: |
        An EU PDO/PGI is a **recipe plus a map**: varieties, yields, sometimes
        ageing. A US AVA is mostly the map.

  - id: law-eu-identity-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is that European rulebook trying to protect in theory?
      choices:
        - { text: "A right to plant any grape, anywhere, at any yield", correct: false }
        - { text: "The local identity of wines that made the region’s name", correct: true }
        - { text: "A single global flavour for all PDO wine", correct: false }
        - { text: "The abolition of place names", correct: false }
      explanation: |
        Lock the grapes and methods that **built the reputation**, so Chablis
        still tastes like Chablis. That is the theory; critics say it also
        freezes change.

  - id: law-eu-gi-aims-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What two jobs is the European GI system meant to do?
      choices:
        - { text: "Only to raise alcohol in every wine", correct: false }
        - { text: "Support quality and make fraud harder", correct: true }
        - { text: "Ban all place names", correct: false }
        - { text: "Set a single EU retail price", correct: false }
      explanation: |
        A named map plus a rulebook is supposed to **keep quality honest** and
        stop someone selling Languedoc as Chablis.

  - id: law-pdo-100-fraud-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0026
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: How does PDO law tighten that anti-fraud idea?
      choices:
        - { text: "Half the fruit may be imported in bond", correct: false }
        - { text: "Every grape must come from the stated GI", correct: true }
        - { text: "PDOs may list any continent", correct: false }
        - { text: "PDO wines need no grapes at all", correct: false }
      explanation: |
        **100% local fruit** is the hard PDO line — no topping-up with a
        cheaper neighbour. PGI and many New World GIs allow a slice from
        outside.

  - id: law-pgi-why-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do many producers choose PGI instead of PDO?
      choices:
        - { text: "PGI forbids any named grape and any blend", correct: false }
        - { text: "They can use non-traditional varieties and a looser production rulebook", correct: true }
        - { text: "PGI always pays a higher tax than PDO", correct: false }
        - { text: "PDO is illegal in France", correct: false }
      explanation: |
        **Syrah in the Loire IGP**, **Cabernet in Pays d’Oc**, Super-Tuscan
        **IGT** — the point is freedom the PDO would refuse.

  - id: law-pgi-range-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What quality range do PGI wines actually cover?
      choices:
        - { text: "Only the cheapest bulk, never a serious bottle", correct: false }
        - { text: "From fine wines that sit outside a PDO box to high-volume inexpensive wine", correct: true }
        - { text: "Only icewine", correct: false }
        - { text: "Only fortified flor wines", correct: false }
      explanation: |
        **Sassicaia** started as vino da tavola / IGT; **Pays d’Oc** also
        fills supermarket shelves. PGI is a legal box, not a quality score.

  - id: law-pgi-variety-label-001
    type: mcq
    deck: Wine and the Law
    tags: [law, labelling]
    status: reviewed
    source_id: c11-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do you usually see on a PGI label that a PDO often skips?
      choices:
        - { text: "A ban on naming the grape", correct: false }
        - { text: "The grape variety written out", correct: true }
        - { text: "A mandatory first-growth ranking", correct: false }
        - { text: "The word Premier Cru on every bottle", correct: false }
      explanation: |
        **Merlot Pays d’Oc** sells on the grape. A village Burgundy PDO often
        sells on **place** and leaves Pinot off the front.

  - id: law-no-gi-flex-001
    type: mcq
    deck: Wine and the Law
    tags: [law]
    status: reviewed
    source_id: c11-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which EU category gives the winemaker the freest rulebook?
      choices:
        - { text: "PDO grand cru", correct: false }
        - { text: "Wine with no GI (Vin de France and cousins)", correct: true }
        - { text: "AOP only", correct: false }
        - { text: "A ban on blending across a river", correct: false }
      explanation: |
        **Vin de France** (or vino / Wein without GI) can blend regions and
        grapes the PDO would never allow. You lose the place name.

  - id: law-no-gi-blends-001
    type: mcq
    deck: Wine and the Law
    tags: [law]
    status: reviewed
    source_id: c11-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What can a brand do once it drops the GI?
      choices:
        - { text: "Only bottle a single vineyard PDO", correct: false }
        - { text: "Blend fruit from several regions — even across countries, if the law allows", correct: true }
        - { text: "It must still print Chablis on the label", correct: false }
        - { text: "It may not name a vintage or a grape", correct: false }
      explanation: |
        A **multi-regional** or even **multi-country** blend is a brand
        product, not a village wine. Vin de France still lets you print
        variety and vintage.

  - id: law-non-eu-gi-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where do most non-EU wines sit legally?
      choices:
        - { text: "Almost all as wine with no geography at all", correct: false }
        - { text: "Almost all as wines with a GI", correct: true }
        - { text: "Only as EU PDO", correct: false }
        - { text: "They cannot use any place name", correct: false }
      explanation: |
        **Napa Valley, Barossa, Marlborough** are GIs. Wine without a place
        name exists, but it is not the New World default.

  - id: law-non-eu-no-recipe-001
    type: mcq
    deck: Wine and the Law
    tags: [law, gi]
    status: reviewed
    source_id: c11-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the big legal gap between an EU GI and a typical New World GI?
      choices:
        - { text: "New World GIs always list the only three legal grapes", correct: false }
        - { text: "Non-EU GIs usually do not lock which varieties you may plant", correct: true }
        - { text: "EU GIs never name a place", correct: false }
        - { text: "AVAs require 100% of a single grape by federal law", correct: false }
      explanation: |
        An **AVA** is a map. Plant Pinot or Cabernet — the TTB does not mind.
        **Chablis** tells you Chardonnay. That is the EU extra.

  - id: law-non-eu-rare-terms-001
    type: mcq
    deck: Wine and the Law
    tags: [law, labelling]
    status: reviewed
    source_id: c11-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which legal category words rarely appear on a non-EU front label?
      choices:
        - { text: "The place name itself (Napa, Barossa)", correct: false }
        - { text: "The formal terms Ward, AVA or Zone", correct: true }
        - { text: "The grape variety", correct: false }
        - { text: "The vintage", correct: false }
      explanation: |
        You read **Napa Valley**, not “Napa Valley AVA” as the hero line.
        South Africa’s **ward** and Australia’s **zone** stay in the small
        print. The place name does the selling.

