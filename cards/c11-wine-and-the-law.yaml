        Les restrictions peuvent limiter les lieux, les horaires, la fréquence et le contenu du
        marketing. Elles cherchent notamment à protéger les enfants et les adolescents de
        l’exposition et à empêcher les messages qui normalisent les usages nocifs ou avancent des
