        - { text: "Sur l’étroite bande atlantique immédiatement au nord de Porto", correct: false }
      explanation: |
        L’Alentejo couvre une grande partie, surtout intérieure, du sud du Portugal. Ses vastes
        plaines, son climat chaud et l’étendue de ses vignobles permettent aussi bien des
        assemblages régionaux qu’une production en grand volume.

