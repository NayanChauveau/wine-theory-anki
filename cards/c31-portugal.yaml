        - { text: "Une extraction prolongée à partir de pellicules et de pépins insuffisamment mûrs", correct: false }
      explanation: |
        Éviter un foulage brutal et une extraction excessive limite les tanins amers. Des raisins
        pleinement mûrs, une macération maîtrisée et l’assemblage avec des cépages plus souples
        peuvent donner un vin équilibré sans effacer l’identité du Baga.

