cards:
  - id: portugal-climate-range-001
    type: mcq
    deck: Portugal
    tags: [portugal, climate]
    status: reviewed
    source_id: c31-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which broad climatic pattern best describes mainland Portugal’s wine regions?"
      choices:
        - { text: "Atlantic influence is strongest near the coast, while inland regions are hotter and more continental", correct: true }
        - { text: "Mediterranean influence produces uniformly hot and dry conditions from north to south", correct: false }
        - { text: "Mountain barriers make the coast continental and the eastern valleys maritime", correct: false }
        - { text: "Atlantic influence remains dominant in the eastern valleys because Portugal is relatively narrow", correct: false }
      explanation: |
        The Atlantic moderates temperatures and brings more rain to western and northern vineyards.
        Farther inland, mountain shelter and distance from the ocean produce hotter, drier summers
        and greater temperature extremes.
    fr:
      question: "Quel grand schéma climatique décrit le mieux les régions viticoles du Portugal continental ?"
      choices:
        - { text: "L’influence atlantique domine près du littoral, tandis que l’intérieur est plus chaud et continental", correct: true }
        - { text: "L’influence méditerranéenne crée partout des conditions uniformément chaudes et sèches", correct: false }
        - { text: "Les montagnes rendent le littoral continental et les vallées orientales maritimes", correct: false }
        - { text: "L’influence atlantique reste dominante dans les vallées orientales, car le Portugal est relativement étroit", correct: false }
      explanation: |
        L’Atlantique modère les températures et apporte davantage de pluie aux vignobles de l’ouest
        et du nord. Plus loin dans les terres, l’abri des montagnes et l’éloignement de l’océan
        entraînent des étés plus chauds et plus secs ainsi que de plus forts écarts de température.

  - id: portugal-heat-moderate-001
    type: mcq
    deck: Portugal
    tags: [portugal, climate]
    status: reviewed
    source_id: c31-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two influences most often preserve freshness in otherwise warm Portuguese vineyards?"
      choices:
        - { text: "Fertile soils and high yields", correct: false }
        - { text: "Atlantic air and vineyard altitude", correct: true }
        - { text: "South-facing slopes and low rainfall", correct: false }
        - { text: "Mountain shelter and late pruning", correct: false }
      explanation: |
        Cool Atlantic air moderates many coastal regions, while elevation lowers temperatures and
        widens the day–night range inland. Both can slow ripening and help grapes retain acidity.
    fr:
      question: "Quelles sont les deux influences qui préservent le plus souvent la fraîcheur dans les vignobles portugais par ailleurs chauds ?"
      choices:
        - { text: "Des sols fertiles et des rendements élevés", correct: false }
        - { text: "L’air atlantique et l’altitude", correct: true }
        - { text: "Des pentes exposées au sud et de faibles précipitations", correct: false }
        - { text: "L’abri des montagnes et une taille tardive", correct: false }
      explanation: |
        L’air frais de l’Atlantique modère de nombreuses régions côtières, tandis que l’altitude
        abaisse les températures et accroît l’amplitude thermique diurne à l’intérieur. Ces deux
        influences peuvent ralentir la maturation et aider les raisins à conserver leur acidité.

  - id: portugal-style-diversity-001
    type: mcq
    deck: Portugal
    tags: [portugal, climate]
    status: reviewed
    source_id: c31-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Portugal’s climatic range contribute to its diversity of still wines?"
      choices:
        - { text: "Cooler, wetter regions favour fresher styles, while hot inland regions can produce fuller-bodied wines", correct: true }
        - { text: "Cooler regions favour fortified reds, while inland regions are limited to sparkling whites", correct: false }
        - { text: "Coastal humidity requires sweet wines, while inland drought requires rosé", correct: false }
        - { text: "Cool coastal regions favour fuller reds, while inland heat favours lighter high-acid whites", correct: false }
      explanation: |
        The cool, rainy north-west can give light, high-acid wines, whereas warm inland areas such
        as the Douro and Alentejo can ripen grapes for concentrated reds. Altitude and local
        exposure create further variation.
    fr:
      question: "Comment la diversité climatique du Portugal contribue-t-elle à celle de ses vins tranquilles ?"
      choices:
        - { text: "Les régions plus fraîches et humides favorisent des styles frais, tandis que l’intérieur chaud peut donner des vins plus puissants", correct: true }
        - { text: "Les régions fraîches favorisent les rouges fortifiés, tandis que l’intérieur se limite aux blancs effervescents", correct: false }
        - { text: "L’humidité côtière impose des vins doux, tandis que la sécheresse intérieure impose des rosés", correct: false }
        - { text: "Les régions côtières fraîches favorisent les rouges puissants, tandis que la chaleur intérieure favorise les blancs légers et acides", correct: false }
      explanation: |
        Le nord-ouest frais et pluvieux peut donner des vins légers et acides, tandis que des zones
        intérieures chaudes comme le Douro et l’Alentejo peuvent mûrir des raisins destinés à des
        rouges concentrés. L’altitude et l’exposition locale ajoutent encore de la diversité.

  - id: portugal-vinho-verde-where-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where is the Vinho Verde DOP located?"
      choices:
        - { text: "In north-west Portugal, between the Spanish border and the Atlantic coast", correct: true }
        - { text: "In the upper Douro Valley beside the Spanish border", correct: false }
        - { text: "On the southern plains surrounding Évora", correct: false }
        - { text: "Along the Atlantic coast immediately south of Lisbon", correct: false }
      explanation: |
        Vinho Verde occupies the Minho and neighbouring river valleys of north-west Portugal. It is
        a geographical denomination, not a general term for young or underripe wine.
    fr:
      question: "Où se situe la DOP Vinho Verde ?"
      choices:
        - { text: "Dans le nord-ouest du Portugal, entre la frontière espagnole et le littoral atlantique", correct: true }
        - { text: "Dans le haut Douro, près de la frontière espagnole", correct: false }
        - { text: "Sur les plaines méridionales qui entourent Évora", correct: false }
        - { text: "Le long du littoral atlantique immédiatement au sud de Lisbonne", correct: false }
      explanation: |
        Vinho Verde occupe le Minho et les vallées fluviales voisines du nord-ouest du Portugal. Il
        s’agit d’une appellation géographique, et non d’un terme général désignant un vin jeune ou
        issu de raisins peu mûrs.

  - id: portugal-vv-maritime-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde, climate]
    status: reviewed
    source_id: c31-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate best describes most of the Vinho Verde region?"
      choices:
        - { text: "Warm Mediterranean with mild, dry winters", correct: false }
        - { text: "Moderate maritime with high rainfall", correct: true }
        - { text: "Hot continental with a large annual temperature range", correct: false }
        - { text: "Cool continental with dry summers and severe winters", correct: false }
      explanation: |
        The nearby Atlantic moderates temperatures and supplies abundant rainfall. Conditions vary
        within the large region, and Monção e Melgaço is warmer and drier because mountains reduce
        the ocean’s influence.
    fr:
      question: "Quel climat décrit le mieux la majeure partie de la région de Vinho Verde ?"
      choices:
        - { text: "Méditerranéen chaud avec des hivers doux et secs", correct: false }
        - { text: "Maritime modéré avec de fortes précipitations", correct: true }
        - { text: "Continental chaud avec une forte amplitude thermique annuelle", correct: false }
        - { text: "Continental frais avec des étés secs et des hivers rigoureux", correct: false }
      explanation: |
        La proximité de l’Atlantique modère les températures et apporte des pluies abondantes. Les
        conditions varient dans cette vaste région : Monção e Melgaço est plus chaud et plus sec,
        car les montagnes réduisent l’influence océanique.

  - id: portugal-vv-atlantic-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde, climate]
    status: reviewed
    source_id: c31-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does the Atlantic strongly influence most Vinho Verde vineyards?"
      choices:
        - { text: "The region lies on exposed valleys and lowlands in Portugal’s north-west", correct: true }
        - { text: "The Serra do Marão funnels hot continental air toward the coast", correct: false }
        - { text: "The vineyards occupy a high plateau exposed to prevailing westerly winds", correct: false }
        - { text: "The region occupies a narrow basin east of Portugal’s main ranges", correct: false }
      explanation: |
        Much of Vinho Verde is open to moist air arriving from the nearby Atlantic. That exposure
        keeps temperatures moderate but also creates high rainfall and humidity.
    fr:
      question: "Pourquoi l’Atlantique influence-t-il fortement la plupart des vignobles de Vinho Verde ?"
      choices:
        - { text: "La région occupe des vallées et des terres basses exposées du nord-ouest du Portugal", correct: true }
        - { text: "La Serra do Marão canalise l’air continental chaud vers le littoral", correct: false }
        - { text: "Les vignobles occupent un haut plateau exposé aux vents dominants d’ouest", correct: false }
        - { text: "La région se trouve dans un bassin étroit à l’est des principales chaînes portugaises", correct: false }
      explanation: |
        Une grande partie de Vinho Verde est ouverte à l’air humide venu de l’Atlantique voisin.
        Cette exposition maintient des températures modérées, mais entraîne également de fortes
        précipitations et une humidité élevée.

  - id: portugal-vv-rainfall-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde, climate]
    status: reviewed
    source_id: c31-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does rainfall in Vinho Verde generally compare with Portugal’s inland wine regions?"
      choices:
        - { text: "It is lower and concentrated entirely in summer", correct: false }
        - { text: "It is higher, with substantial rain during the growing season", correct: true }
        - { text: "It is similar in total but falls mainly as winter snow", correct: false }
        - { text: "It is lower, but coastal fog supplies most vine water", correct: false }
      explanation: |
        Vinho Verde is one of Portugal’s wettest wine regions. Rain and humidity support vigorous
        growth but increase fungal-disease pressure, especially if the canopy is dense.
    fr:
      question: "Comment les précipitations de Vinho Verde se comparent-elles généralement à celles des régions viticoles de l’intérieur du Portugal ?"
      choices:
        - { text: "Elles sont plus faibles et entièrement concentrées en été", correct: false }
        - { text: "Elles sont plus abondantes, y compris pendant la saison de croissance", correct: true }
        - { text: "Le total est similaire, mais elles tombent surtout sous forme de neige hivernale", correct: false }
        - { text: "Elles sont plus faibles, mais le brouillard côtier fournit l’essentiel de l’eau aux vignes", correct: false }
      explanation: |
        Vinho Verde est l’une des régions viticoles les plus humides du Portugal. La pluie et
        l’humidité favorisent une forte vigueur, mais augmentent la pression des maladies fongiques,
        surtout lorsque la canopée est dense.

  - id: portugal-vv-rain-risks-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two vineyard problems are most directly encouraged by Vinho Verde’s high rainfall?"
      choices:
        - { text: "Low vigour and slow canopy growth", correct: false }
        - { text: "Sunburn and rapid acid loss", correct: false }
        - { text: "Excessive vegetative growth and fungal disease", correct: true }
        - { text: "Winter drought and poor budburst", correct: false }
      explanation: |
        Water availability drives vigorous shoot and leaf growth, while humidity favours downy
        mildew, powdery mildew and bunch rot. Growers therefore need good canopy aeration and timely
        disease control.
    fr:
      question: "Quels sont les deux problèmes viticoles les plus directement favorisés par les fortes précipitations de Vinho Verde ?"
      choices:
        - { text: "Une faible vigueur et une croissance lente de la canopée", correct: false }
        - { text: "Les brûlures du soleil et la perte rapide d’acidité", correct: false }
        - { text: "Une croissance végétative excessive et les maladies fongiques", correct: true }
        - { text: "La sécheresse hivernale et un mauvais débourrement", correct: false }
      explanation: |
        L’eau disponible stimule la croissance des rameaux et des feuilles, tandis que l’humidité
        favorise le mildiou, l’oïdium et la pourriture des grappes. Une bonne aération de la canopée
        et une protection phytosanitaire au bon moment sont donc nécessaires.

  - id: portugal-vv-canopy-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard practice is most useful for limiting fungal pressure in humid Vinho Verde?"
      choices:
        - { text: "Retaining a large, dense canopy to slow sugar accumulation", correct: false }
        - { text: "Opening the canopy to improve airflow and spray penetration", correct: true }
        - { text: "Increasing irrigation immediately before harvest", correct: false }
        - { text: "Reducing row spacing to trap warm, moist air", correct: false }
      explanation: |
        Shoot positioning, trimming and selective leaf removal help air move through the canopy and
        allow treatments to reach the fruit zone. Faster drying after rain reduces the conditions in
        which fungi thrive.
    fr:
      question: "Quelle pratique viticole est la plus utile pour limiter la pression des maladies fongiques dans la région humide de Vinho Verde ?"
      choices:
        - { text: "Conserver une canopée vaste et dense pour ralentir l’accumulation de sucre", correct: false }
        - { text: "Ouvrir la canopée afin d’améliorer l’aération et la pénétration des traitements", correct: true }
        - { text: "Augmenter l’irrigation juste avant les vendanges", correct: false }
        - { text: "Réduire l’écartement des rangs pour retenir un air chaud et humide", correct: false }
      explanation: |
        Le positionnement des rameaux, le rognage et un effeuillage sélectif favorisent la
        circulation de l’air et permettent aux traitements d’atteindre la zone fructifère. Un
        séchage plus rapide après la pluie réduit les conditions favorables aux champignons.

  - id: portugal-vv-pergola-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What was a key advantage and disadvantage of Vinho Verde’s traditional high ramada or pergola systems?"
      choices:
        - { text: "They improved aeration but made vineyard work and mechanisation difficult", correct: true }
        - { text: "They increased bunch shading but made machine harvesting straightforward", correct: false }
        - { text: "They reduced vine vigour but exposed fruit to wet soils", correct: false }
        - { text: "They accelerated ripening but prevented air movement around bunches", correct: false }
      explanation: |
        High training lifted bunches away from damp ground and allowed air beneath the canopy.
        However, the height and irregular layout made pruning, spraying and harvesting labour-
        intensive, encouraging a shift toward modern trellises.
    fr:
      question: "Quels étaient le principal avantage et le principal inconvénient des conduites hautes traditionnelles en ramada ou en pergola à Vinho Verde ?"
      choices:
        - { text: "Elles amélioraient l’aération, mais compliquaient le travail et la mécanisation", correct: true }
        - { text: "Elles augmentaient l’ombrage des grappes, mais facilitaient les vendanges mécaniques", correct: false }
        - { text: "Elles réduisaient la vigueur, mais exposaient les fruits aux sols humides", correct: false }
        - { text: "Elles accéléraient la maturation, mais empêchaient l’air de circuler autour des grappes", correct: false }
      explanation: |
        La conduite haute éloignait les grappes du sol humide et permettait à l’air de circuler sous
        la canopée. Mais la hauteur et la disposition irrégulière rendaient la taille, les
        traitements et les vendanges très exigeants en main-d’œuvre, ce qui a favorisé l’adoption de
        palissages modernes.

  - id: portugal-vv-vsp-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which training system is common in modern, mechanisable Vinho Verde vineyards?"
      choices:
        - { text: "Low-density bush vines without wires", correct: false }
        - { text: "Spur-pruned vertical shoot positioning", correct: true }
        - { text: "Single stakes with shoots trailing on the ground", correct: false }
        - { text: "High ramadas supported by trees", correct: false }
      explanation: |
        Vertical shoot positioning creates regular rows and an open, manageable canopy. It is easier
        to prune, spray and harvest mechanically than traditional high or irregular training
        systems.
    fr:
      question: "Quel mode de conduite est courant dans les vignobles modernes et mécanisables de Vinho Verde ?"
      choices:
        - { text: "Des vignes en gobelet peu denses et sans fils", correct: false }
        - { text: "Une taille en cordon avec palissage vertical des rameaux", correct: true }
        - { text: "Des échalas individuels avec des rameaux traînant au sol", correct: false }
        - { text: "De hautes ramadas soutenues par des arbres", correct: false }
      explanation: |
        Le palissage vertical des rameaux crée des rangs réguliers et une canopée ouverte, facile à
        gérer. Il se prête mieux à la taille, aux traitements et aux vendanges mécaniques que les
        conduites hautes ou irrégulières traditionnelles.

  - id: portugal-vv-vsp-why-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is vertical shoot positioning particularly useful in Vinho Verde?"
      choices:
        - { text: "It shades the fruit zone to delay ripening and retain acidity", correct: false }
        - { text: "It keeps shoots organised for aeration and mechanised work", correct: true }
        - { text: "It forces vines to retain more water after rain", correct: false }
        - { text: "It delays drying so botrytis can develop uniformly", correct: false }
      explanation: |
        Keeping shoots upright produces a narrow leaf wall that can be trimmed and opened around the
        fruit. The system improves access, airflow and spray coverage while allowing machinery
        between rows.
    fr:
      question: "Pourquoi le palissage vertical des rameaux est-il particulièrement utile à Vinho Verde ?"
      choices:
        - { text: "Il ombrage la zone fructifère pour retarder la maturation et préserver l’acidité", correct: false }
        - { text: "Il organise les rameaux pour améliorer l’aération et faciliter la mécanisation", correct: true }
        - { text: "Il force les vignes à retenir davantage d’eau après la pluie", correct: false }
        - { text: "Il ralentit le séchage afin que le botrytis se développe uniformément", correct: false }
      explanation: |
        Le maintien des rameaux à la verticale forme une paroi foliaire étroite que l’on peut rogner
        et ouvrir autour des fruits. Le système améliore l’accès, l’aération et la couverture des
        traitements tout en permettant le passage des machines.

  - id: portugal-vv-classic-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best fits a classic inexpensive white Vinho Verde?"
      choices:
        - { text: "Pale colour, high acidity, low alcohol and often a slight spritz", correct: true }
        - { text: "Deep gold, low acidity, high alcohol and pronounced new oak", correct: false }
        - { text: "Medium colour, moderate acidity, full body and oxidative nuttiness", correct: false }
        - { text: "Amber colour, firm tannin, dried fruit and extended skin contact", correct: false }
      explanation: |
        Early-drinking examples emphasise citrus or green fruit, refreshing acidity and modest
        alcohol. A small amount of carbon dioxide can heighten the impression of freshness.
    fr:
      question: "Quel profil correspond le mieux à un Vinho Verde blanc classique et peu coûteux ?"
      choices:
        - { text: "Robe pâle, acidité élevée, faible alcool et souvent un léger perlant", correct: true }
        - { text: "Robe dorée soutenue, faible acidité, alcool élevé et bois neuf marqué", correct: false }
        - { text: "Robe moyenne, acidité modérée, corps puissant et notes oxydatives de fruits à coque", correct: false }
        - { text: "Robe ambrée, tanins fermes, fruits séchés et longue macération pelliculaire", correct: false }
      explanation: |
        Les cuvées à boire jeunes privilégient les agrumes ou les fruits verts, une acidité
        rafraîchissante et un degré d’alcool modeste. Une petite quantité de dioxyde de carbone peut
        accentuer la sensation de fraîcheur.

  - id: portugal-vv-offdry-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why may a light, high-acid Vinho Verde retain a small amount of residual sugar?"
      choices:
        - { text: "To balance sharp acidity while keeping the wine refreshing", correct: true }
        - { text: "To provide enough sugar for fortification in bottle", correct: false }
        - { text: "To replace acidity lost during prolonged barrel ageing", correct: false }
        - { text: "To encourage biological ageing under flor", correct: false }
      explanation: |
        A little residual sugar can soften the perception of high acidity without making the wine
        taste overtly sweet. The combination is common in accessible, low-alcohol styles intended
        for early drinking.
    fr:
      question: "Pourquoi un Vinho Verde léger et acide peut-il conserver un peu de sucre résiduel ?"
      choices:
        - { text: "Pour équilibrer une acidité vive tout en gardant un caractère rafraîchissant", correct: true }
        - { text: "Pour fournir assez de sucre en vue d’un mutage en bouteille", correct: false }
        - { text: "Pour remplacer l’acidité perdue pendant un long élevage en fût", correct: false }
        - { text: "Pour favoriser un élevage biologique sous voile", correct: false }
      explanation: |
        Un peu de sucre résiduel peut adoucir la perception d’une forte acidité sans rendre le vin
        franchement doux. Cette combinaison est fréquente dans les styles accessibles, peu
        alcoolisés et destinés à être bus jeunes.

  - id: portugal-vv-label-cue-001
    type: mcq
    deck: Portugal
    tags: [portugal, vinho-verde]
    status: reviewed
    source_id: c31-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does the name Vinho Verde identify on a wine label?"
      choices:
        - { text: "A protected geographical origin in north-west Portugal", correct: true }
        - { text: "Any Portuguese wine bottled in the year after harvest", correct: false }
        - { text: "A national sweetness category for low-alcohol whites", correct: false }
        - { text: "A production method that requires retained carbon dioxide", correct: false }
      explanation: |
        Vinho Verde is a DOP with defined boundaries, authorised grapes and production rules. Its
        name does not mean that every wine must be green, youthful, lightly sparkling or white.
    fr:
      question: "Que désigne le nom Vinho Verde sur une étiquette ?"
      choices:
        - { text: "Une origine géographique protégée du nord-ouest du Portugal", correct: true }
        - { text: "Tout vin portugais mis en bouteille l’année suivant la récolte", correct: false }
        - { text: "Une catégorie nationale de douceur pour les blancs peu alcoolisés", correct: false }
        - { text: "Une méthode de production imposant de conserver du dioxyde de carbone", correct: false }
      explanation: |
        Vinho Verde est une DOP aux limites, aux cépages autorisés et aux règles de production
        définis. Son nom ne signifie pas que tous les vins doivent être verts, jeunes, légèrement
        effervescents ou blancs.

  - id: portugal-vv-label-abv-001
    type: mcq
    deck: Portugal
