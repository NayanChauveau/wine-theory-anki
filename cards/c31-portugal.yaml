        - { text: "Le Porto est produit dans la sous-région occidentale ; la DOP Douro dans les sous-régions orientales", correct: false }
        - { text: "Le Porto exige un long élevage en fût ; la DOP Douro doit être commercialisée sans bois", correct: false }
      explanation: |
        Les deux catégories peuvent provenir des mêmes vignobles escarpés et des mêmes cépages
        indigènes. La fermentation du Porto est interrompue par l’ajout d’eau-de-vie, ce qui
        conserve du sucre et élève le degré d’alcool, tandis que les Douro secs fermentent
        généralement jusqu’à épuisement des sucres.

