        fermentation is stopped with grape spirit, retaining sugar and raising alcohol, whereas dry
        Douro wines generally ferment to dryness.
    fr:
      question: "En quoi le Porto et le vin non fortifié de DOP Douro diffèrent-ils malgré leur région commune ?"
      choices:
