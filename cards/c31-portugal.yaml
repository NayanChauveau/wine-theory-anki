        - { text: "Port and Douro DOP rely on separate authorised grape lists", correct: false }
        - { text: "Port is produced in the western subregion; Douro DOP in the eastern subregions", correct: false }
        - { text: "Port requires long cask ageing; Douro DOP must be released without wood", correct: false }
      explanation: |
