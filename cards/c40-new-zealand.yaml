# yaml-language-server: $schema=../schema/cards.schema.json
# source: C40 (import/inbox/c40-new-zealand.yaml)
# deck: New Zealand

cards:
  - id: nz-tasman-distance-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, geography]
    status: reviewed
    source_id: c40-0001
    review:
      fact_check: pass
      sources: [known-fact, teara]
    en:
      question: "Roughly how far across the Tasman Sea does New Zealand lie from its nearest large land mass, Australia?"
      choices:
        - { text: "About 200 km", correct: false }
        - { text: "About 700 km", correct: false }
        - { text: "About 2,000 km", correct: true }
        - { text: "About 6,000 km", correct: false }
      explanation: |
        A Sydney–Auckland flight covers a little over 2,000 km; the closest coasts are
        somewhat nearer. That isolation leaves the country with no neighbouring land
        mass to buffer the ocean's influence.
    fr:
      question: "À quelle distance environ la Nouvelle-Zélande se trouve-t-elle de la grande terre la plus proche, l’Australie, de l’autre côté de la mer de Tasman ?"
      choices:
        - { text: "Environ 200 km", correct: false }
        - { text: "Environ 700 km", correct: false }
        - { text: "Environ 2 000 km", correct: true }
        - { text: "Environ 6 000 km", correct: false }
      explanation: |
        Un vol Sydney–Auckland parcourt un peu plus de 2 000 km ; les côtes les
        plus proches sont un peu moins éloignées. Cet isolement prive le pays de
        toute masse continentale voisine qui atténuerait l’influence de l’océan.

  - id: nz-climate-overall-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, climate]
    status: reviewed
    source_id: c40-0002
    review:
      fact_check: pass
      sources: [known-fact, teara]
    en:
      question: "Which climate label best fits New Zealand's wine country as a whole?"
      choices:
        - { text: "Mediterranean", correct: false }
        - { text: "Maritime", correct: true }
        - { text: "Continental", correct: false }
        - { text: "Warm semi-arid", correct: false }
      explanation: |
        The country is long and narrow: no point lies more than about 130 km from the
        sea, so ocean air moderates temperatures almost everywhere.
    fr:
      question: "Quel type de climat décrit le mieux l’ensemble du vignoble néo-zélandais ?"
      choices:
        - { text: "Méditerranéen", correct: false }
        - { text: "Maritime", correct: true }
        - { text: "Continental", correct: false }
        - { text: "Semi-aride chaud", correct: false }
      explanation: |
        Le pays est long et étroit : aucun point ne se trouve à plus de 130 km
        environ de la mer, si bien que l’air océanique modère les températures
        presque partout.

  - id: nz-island-warmth-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, climate, north-island, south-island]
    status: reviewed
    source_id: c40-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do New Zealand's two main islands generally compare for growing-season warmth?"
      choices:
        - { text: "The South Island is warmer", correct: false }
        - { text: "They are broadly similar", correct: false }
        - { text: "The North Island is warmer", correct: true }
        - { text: "The central strait area is warmest", correct: false }
      explanation: |
        Warmth falls with latitude. The vineyard belt runs from about 36°S near
        Auckland to about 45°S in Central Otago, a spread similar to that from
        southern Spain to Bordeaux in the northern hemisphere.
    fr:
      question: "Comment les deux îles principales de la Nouvelle-Zélande se comparent-elles, en général, pour la chaleur de la saison de végétation ?"
      choices:
        - { text: "L’île du Sud est plus chaude", correct: false }
        - { text: "Elles sont à peu près équivalentes", correct: false }
        - { text: "L’île du Nord est plus chaude", correct: true }
        - { text: "La zone du détroit est la plus chaude", correct: false }
      explanation: |
        La chaleur diminue avec la latitude. Le vignoble s’étend d’environ 36° S
        près d’Auckland à environ 45° S à Central Otago, un écart comparable
        à celui qui sépare le sud de l’Espagne de Bordeaux dans l’hémisphère
        Nord.

  - id: nz-ripening-balance-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, climate, ripening, acidity]
    status: reviewed
    source_id: c40-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Long sunshine hours, sea-cooled nights and a long growing season let New Zealand grapes reach which balance?"
      choices:
        - { text: "High sugar and flavour, with acidity retained", correct: true }
        - { text: "High sugar and flavour, with acidity very low", correct: false }
        - { text: "Moderate sugar, with green, unripe flavours", correct: false }
        - { text: "Low sugar, with soft acidity and muted aroma", correct: false }
      explanation: |
        Sunlight drives sugar and flavour build-up, while cool nights slow the loss of
        acid through respiration. The long season also gives aromatic compounds time to
        develop, which is why the country suits aromatic varieties.
    fr:
      question: "Un fort ensoleillement, des nuits rafraîchies par la mer et une longue saison de végétation permettent aux raisins néo-zélandais d’atteindre quel équilibre ?"
      choices:
        - { text: "Sucres et arômes élevés, acidité préservée", correct: true }
        - { text: "Sucres et arômes élevés, acidité très basse", correct: false }
        - { text: "Sucres modérés, arômes verts et peu mûrs", correct: false }
        - { text: "Sucres faibles, acidité molle, arômes discrets", correct: false }
      explanation: |
        Le soleil favorise l’accumulation des sucres et des arômes, tandis que
        les nuits fraîches ralentissent la perte d’acidité par respiration. La
        longue saison laisse aussi aux composés aromatiques le temps de se
        développer, d’où l’aptitude du pays pour les cépages aromatiques.

  - id: nz-south-island-rain-shadow-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, south-island, climate, rain-shadow]
    status: reviewed
    source_id: c40-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are most South Island vineyards planted on the eastern side of the island?"
      choices:
        - { text: "The east has richer volcanic soils", correct: false }
        - { text: "Mountains block rain-bearing westerly winds", correct: true }
        - { text: "Warm currents wash the eastern coast", correct: false }
        - { text: "Eastern sites escape cold southerly winds", correct: false }
      explanation: |
        The Southern Alps run along the island. The West Coast, facing the prevailing
        westerlies, can receive several metres of rain a year, while Marlborough,
        Canterbury and Central Otago sit in the drier lee.
    fr:
      question: "Pourquoi la plupart des vignobles de l’île du Sud sont-ils plantés sur le versant est de l’île ?"
      choices:
        - { text: "L’est a des sols volcaniques plus fertiles", correct: false }
        - { text: "Le relief arrête les vents d’ouest pluvieux", correct: true }
        - { text: "Des courants chauds longent la côte est", correct: false }
        - { text: "L’est échappe aux vents froids venus du sud", correct: false }
      explanation: |
        Les Alpes du Sud courent le long de l’île. La West Coast, exposée aux
        vents d’ouest dominants, peut recevoir plusieurs mètres de pluie par an,
        tandis que Marlborough, Canterbury et Central Otago se trouvent dans
        leur ombre pluviométrique, plus sèche.

  - id: nz-free-draining-soils-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, soils, rainfall]
    status: reviewed
    source_id: c40-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which soil property helps many New Zealand vineyards cope with spells of heavy rain?"
      choices:
        - { text: "A high clay content", correct: false }
        - { text: "A high water table", correct: false }
        - { text: "Rich organic matter", correct: false }
        - { text: "Free drainage", correct: true }
      explanation: |
        Many vineyards sit on stony alluvial soils laid down by rivers. Water passes
        through quickly, so roots are not left standing in waterlogged ground.
    fr:
      question: "Quelle propriété du sol aide de nombreux vignobles néo-zélandais à supporter les épisodes de fortes pluies ?"
      choices:
        - { text: "Une forte teneur en argile", correct: false }
        - { text: "Une nappe phréatique haute", correct: false }
        - { text: "Une matière organique abondante", correct: false }
        - { text: "Un sol très drainant", correct: true }
      explanation: |
        Beaucoup de vignobles reposent sur des sols alluviaux caillouteux
        déposés par les rivières. L’eau s’y infiltre vite, et les racines ne
        restent pas dans un sol gorgé d’eau.

  - id: nz-flat-fertile-vigour-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, south-island, vigour, soils]
    status: reviewed
    source_id: c40-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On the flat, fertile valley-floor sites of New Zealand's South Island, what is the main risk to vine balance?"
      choices:
        - { text: "Weak vines and very low yields", correct: false }
        - { text: "Excessive shoot and leaf growth", correct: true }
        - { text: "Severe drought stress at veraison", correct: false }
        - { text: "Poor rooting in compacted rock", correct: false }
      explanation: |
        Easy water and nutrients push energy into foliage. A dense canopy shades the
        fruit, which can delay ripening and leave the wine more herbaceous.
    fr:
      question: "Sur les fonds de vallée plats et fertiles de l’île du Sud néo-zélandaise, quel est le principal risque pour l’équilibre de la vigne ?"
      choices:
        - { text: "Des vignes faibles et des rendements très bas", correct: false }
        - { text: "Une pousse excessive de rameaux et de feuilles", correct: true }
        - { text: "Un fort stress hydrique à la véraison", correct: false }
        - { text: "Un enracinement difficile dans la roche compacte", correct: false }
      explanation: |
        L’eau et les nutriments, faciles d’accès, orientent l’énergie de la
        vigne vers le feuillage. Un couvert dense ombrage les raisins, ce qui
        peut retarder la maturité et rendre le vin plus herbacé.

  - id: nz-canopy-expertise-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, viticulture, canopy-management]
    status: reviewed
    source_id: c40-0010
    review:
      fact_check: pass
      sources: [nzwine, jancisrobinson]
    en:
      question: "Which area of viticultural expertise are New Zealand growers especially known for?"
      choices:
        - { text: "Dry-farming old bush vines", correct: false }
        - { text: "Building steep stone terraces", correct: false }
        - { text: "Trellising and canopy management", correct: true }
        - { text: "Selecting botrytised berries", correct: false }
      explanation: |
        The Australian viticulturist Richard Smart, based at the Ruakura research
        station in the early 1980s, spread ideas on letting sunlight into the canopy,
        later set out in the 1991 handbook Sunlight into Wine.
    fr:
      question: "Dans quel domaine de la viticulture les vignerons néo-zélandais sont-ils particulièrement réputés ?"
      choices:
        - { text: "La culture en sec de vieilles vignes en gobelet", correct: false }
        - { text: "La construction de terrasses en pierre escarpées", correct: false }
        - { text: "Le palissage et la gestion du couvert végétal", correct: true }
        - { text: "Le tri des baies atteintes de botrytis", correct: false }
      explanation: |
        Le viticulteur australien Richard Smart, en poste à la station de
        recherche de Ruakura au début des années 1980, y a diffusé l’idée de
        faire entrer la lumière dans le couvert, exposée plus tard dans le
        manuel de 1991 Sunlight into Wine.

  - id: nz-swnz-scheme-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, sustainability]
    status: reviewed
    source_id: c40-0011
    review:
      fact_check: pass
      sources: [nzwine, nzwine-swnz]
    en:
      question: "What is Sustainable Winegrowing New Zealand (SWNZ)?"
      choices:
        - { text: "A government register of geographical indications", correct: false }
        - { text: "An organic-only certification for vineyards", correct: false }
        - { text: "An export levy that funds overseas marketing", correct: false }
        - { text: "An industry scheme certifying vineyards and wineries", correct: true }
      explanation: |
        Launched in 1995, it was among the first such programmes in the wine world.
        Nearly all of the country's vineyard area is now certified under it; organic
        certification is a separate, much smaller category.
    fr:
      question: "Qu’est-ce que Sustainable Winegrowing New Zealand (SWNZ) ?"
      choices:
        - { text: "Un registre public des indications géographiques", correct: false }
        - { text: "Une certification exclusivement bio des vignobles", correct: false }
        - { text: "Une taxe à l’export finançant la promotion à l’étranger", correct: false }
        - { text: "Un programme de filière certifiant vignobles et caves", correct: true }
      explanation: |
        Lancé en 1995, c’est l’un des premiers programmes de ce type dans le
        monde du vin. La quasi-totalité du vignoble national est aujourd’hui
        certifiée ; la certification biologique est une catégorie distincte,
        bien plus restreinte.

  - id: nz-sauvignon-share-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, sauvignon-blanc, plantings]
    status: reviewed
    source_id: c40-0013
    review:
      fact_check: pass
      sources: [nzwine, nzwine-vineyard-report-2024]
    en:
      question: "Roughly what share of New Zealand's producing vineyard area is Sauvignon Blanc?"
      choices:
        - { text: "About a quarter", correct: false }
        - { text: "About two-fifths", correct: false }
        - { text: "About two-thirds", correct: true }
        - { text: "Over nine-tenths", correct: false }
      explanation: |
        In 2024 it covered about 28,100 of roughly 42,500 producing hectares. Few wine
        nations rely so heavily on a single variety.
    fr:
      question: "Quelle part environ de la surface de vignes en production de la Nouvelle-Zélande le Sauvignon Blanc occupe-t-il ?"
      choices:
        - { text: "Environ un quart", correct: false }
        - { text: "Environ deux cinquièmes", correct: false }
        - { text: "Environ deux tiers", correct: true }
        - { text: "Plus des neuf dixièmes", correct: false }
      explanation: |
        En 2024, il couvrait environ 28 100 ha sur quelque 42 500 ha en
        production. Rares sont les pays viticoles aussi dépendants d’un seul
        cépage.

  - id: nz-sauvignon-north-south-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, sauvignon-blanc, style, north-island, south-island]
    status: reviewed
    source_id: c40-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with South Island examples, how do New Zealand Sauvignon Blancs from the North Island tend to taste?"
      choices:
        - { text: "Greener, with more green pepper", correct: false }
        - { text: "Riper, with more tropical fruit", correct: true }
        - { text: "Leaner, with higher acidity", correct: false }
        - { text: "More restrained and flinty", correct: false }
      explanation: |
        Extra warmth pushes flavours from gooseberry and capsicum towards passion fruit
        and melon. Cooler southern sites hold more acidity and herbaceous character.
    fr:
      question: "Quel profil présente en général le Sauvignon Blanc néo-zélandais de l’île du Nord, par rapport à celui de l’île du Sud ?"
      choices:
        - { text: "Plus végétal, marqué par le poivron vert", correct: false }
        - { text: "Plus mûr, avec plus de fruits tropicaux", correct: true }
        - { text: "Plus tendu, avec une acidité plus élevée", correct: false }
        - { text: "Plus retenu, aux notes de pierre à fusil", correct: false }
      explanation: |
        Le surcroît de chaleur fait glisser les arômes de la groseille à
        maquereau et du poivron vers le fruit de la passion et le melon. Les
        sites plus frais du sud gardent davantage d’acidité et de caractère
        herbacé.

  - id: nz-sauvignon-ferment-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, sauvignon-blanc, winemaking, fermentation]
    status: reviewed
    source_id: c40-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is most New Zealand Sauvignon Blanc fermented?"
      choices:
        - { text: "In new oak barrels at warm temperatures", correct: false }
        - { text: "In old oak barrels with full malolactic", correct: false }
        - { text: "In inert tanks at cool temperatures", correct: true }
        - { text: "In concrete eggs after long skin contact", correct: false }
      explanation: |
        Low temperatures keep volatile fruity esters and thiols in the wine. Most
        bottlings are released within months of harvest, while the fruit is at its most
        vivid.
    fr:
      question: "Comment le Sauvignon Blanc néo-zélandais est-il le plus souvent fermenté ?"
      choices:
        - { text: "En fûts neufs, à température élevée", correct: false }
        - { text: "En fûts anciens, avec malolactique complète", correct: false }
        - { text: "En cuves inertes, à basse température", correct: true }
        - { text: "En œufs béton après une longue macération", correct: false }
      explanation: |
        Les basses températures préservent les esters fruités et les thiols
        volatils. La plupart des cuvées sont commercialisées quelques mois après
        les vendanges, quand le fruit est à son plus éclatant.

  - id: nz-sauvignon-oak-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, sauvignon-blanc, winemaking, oak]
    status: reviewed
    source_id: c40-0017
    review:
      fact_check: pass
      sources: [producer-site]
    en:
      question: "How is oak typically used in New Zealand Sauvignon Blanc?"
      choices:
        - { text: "By some producers, for a fuller, more complex style", correct: true }
        - { text: "In nearly all export wines, to soften the acidity", correct: false }
        - { text: "For Reserve labels, which by law need barrel ageing", correct: false }
        - { text: "Rarely, since GI rules restrict it for this grape", correct: false }
      explanation: |
        Cloudy Bay's Te Koko is a well-known example: fermented with wild yeasts in
        French oak and kept on its lees for many months, it is far less pungent than the
        estate's unoaked Sauvignon.
    fr:
      question: "Quel usage fait-on généralement du bois pour le Sauvignon Blanc néo-zélandais ?"
      choices:
        - { text: "Chez certains, pour un style plus ample et plus complexe", correct: true }
        - { text: "Dans presque tous les vins d’export, pour assouplir l’acidité", correct: false }
        - { text: "Pour les cuvées Reserve, que la loi oblige à passer en fût", correct: false }
        - { text: "Rarement, car les règles des IG le limitent pour ce cépage", correct: false }
      explanation: |
        Le Te Koko de Cloudy Bay en est un exemple connu : fermenté avec des
        levures indigènes en fût de chêne français et gardé sur lies pendant de
        longs mois, il est bien moins exubérant que le Sauvignon non boisé du
        domaine.

  - id: nz-chardonnay-white-rank-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, chardonnay, plantings]
    status: reviewed
    source_id: c40-0018
    review:
      fact_check: pass
      sources: [nzwine, nzwine-vineyard-report-2024]
    en:
      question: "Which white grape ranks second to Sauvignon Blanc by vineyard area in New Zealand?"
      choices:
        - { text: "Pinot Gris", correct: false }
        - { text: "Riesling", correct: false }
        - { text: "Gewürztraminer", correct: false }
        - { text: "Chardonnay", correct: true }
      explanation: |
        The margin is narrow: in 2024 it had about 3,100 ha against roughly 2,800 ha of
        Pinot Gris. Riesling and Gewürztraminer are each well under 1,000 ha.
    fr:
      question: "Quel cépage blanc se classe deuxième derrière le Sauvignon Blanc en surface plantée en Nouvelle-Zélande ?"
      choices:
        - { text: "Pinot Gris", correct: false }
        - { text: "Riesling", correct: false }
        - { text: "Gewürztraminer", correct: false }
        - { text: "Chardonnay", correct: true }
      explanation: |
        L’écart est mince : en 2024, il couvrait environ 3 100 ha contre quelque
        2 800 ha de Pinot Gris. Le Riesling et le Gewürztraminer restent chacun
        bien en dessous de 1 000 ha.

  - id: nz-chardonnay-style-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, chardonnay, style, oak]
    status: reviewed
    source_id: c40-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best describes a typical premium New Zealand Chardonnay?"
      choices:
        - { text: "Buttery, heavily oaked and low in acidity", correct: false }
        - { text: "Nutty, honeyed and deliberately oxidative", correct: false }
        - { text: "Citrus and tropical fruit, with subtle toast", correct: true }
        - { text: "Lean green apple, steely and unoaked", correct: false }
      explanation: |
        Styles vary because winemakers choose how much barrel fermentation, lees
        contact and malolactic to use. Where oak is used, it is mostly French, and new
        barrels are kept to a supporting role.
    fr:
      question: "Quel profil décrit le mieux un Chardonnay néo-zélandais haut de gamme typique ?"
      choices:
        - { text: "Beurré, très boisé, avec une acidité basse", correct: false }
        - { text: "Noix, miel, style volontairement oxydatif", correct: false }
        - { text: "Agrumes, fruits tropicaux, toasté discret", correct: true }
        - { text: "Pomme verte, tendu, minéral et sans bois", correct: false }
      explanation: |
        Les styles varient selon la part de fermentation en fût, de travail sur
        lies et de malolactique que choisit le vinificateur. Quand il y a du
        bois, il est surtout français, et le fût neuf reste en appui.

  - id: nz-aromatic-varieties-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, riesling, gewurztraminer, pinot-gris, aromatic]
    status: reviewed
    source_id: c40-0020
    review:
      fact_check: pass
      sources: [nzwine, nzwine-vineyard-report-2024]
    en:
      question: "Besides Sauvignon Blanc, which group of aromatic or semi-aromatic whites have New Zealand growers increasingly explored?"
      choices:
        - { text: "Viognier, Marsanne and Roussanne", correct: false }
        - { text: "Riesling, Gewürztraminer and Pinot Gris", correct: true }
        - { text: "Chenin Blanc, Sémillon and Colombard", correct: false }
        - { text: "Albariño, Verdejo and Godello", correct: false }
      explanation: |
        Pinot Gris has grown furthest, to about 2,800 ha by 2024. Riesling (under
        600 ha) and Gewürztraminer (under 200 ha) remain small niche plantings.
    fr:
      question: "Outre le Sauvignon Blanc, quel groupe de blancs aromatiques ou semi-aromatiques les vignerons néo-zélandais explorent-ils de plus en plus ?"
      choices:
        - { text: "Viognier, Marsanne et Roussanne", correct: false }
        - { text: "Riesling, Gewürztraminer et Pinot Gris", correct: true }
        - { text: "Chenin Blanc, Sémillon et Colombard", correct: false }
        - { text: "Albariño, Verdejo et Godello", correct: false }
      explanation: |
        C’est le Pinot Gris qui a le plus progressé, jusqu’à environ 2 800 ha en
        2024. Le Riesling (moins de 600 ha) et le Gewürztraminer (moins de
        200 ha) restent des plantations de niche.

  - id: nz-pinot-noir-rank-001
    type: mcq
    deck: New Zealand
    tags: [new-zealand, pinot-noir, plantings]
    status: reviewed
    source_id: c40-0023
    review:
      fact_check: pass
      sources: [nzwine, nzwine-vineyard-report-2024]
    en:
