        - { text: "Parcelles d’altitude, au-dessus de 500 mètres", correct: false }
      explanation: |
        Le raisin dégrade son acide malique d’autant plus vite qu’il fait
        chaud : des nuits froides freinent cette perte, tandis que les journées
        chaudes accumulent sucres et arômes. Les chaînes de montagnes à l’ouest
        gardent aussi la zone assez sèche, ce qui limite la pourriture.

