cards:
  - id: nrhone-valley-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0001
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which description best fits the Northern Rhône’s vineyard landscape?"
      choices:
        - { text: "A broad alluvial plain with isolated hills", correct: false }
        - { text: "A narrow river corridor bordered by steep slopes", correct: true }
        - { text: "A gently rolling limestone basin", correct: false }
        - { text: "A high plateau separated from the river", correct: false }
      explanation: |
        The Rhône cuts a confined corridor between the Massif Central and the Alps. Many leading sites occupy
        steep slopes immediately above the river.
    fr:
      question: "Quelle description correspond le mieux au paysage viticole du Rhône septentrional ?"
      choices:
        - { text: "Une vaste plaine alluviale ponctuée de collines", correct: false }
        - { text: "Un étroit couloir fluvial bordé de coteaux escarpés", correct: true }
        - { text: "Un bassin calcaire aux faibles ondulations", correct: false }
        - { text: "Un haut plateau séparé du fleuve", correct: false }
      explanation: |
        Le Rhône traverse un couloir resserré entre le Massif central et les Alpes. De nombreux grands terroirs
        occupent les coteaux escarpés qui dominent directement le fleuve.
  - id: nrhone-best-aspect-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0002
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which exposure most often favours full ripening on the Northern Rhône’s steep slopes?"
      choices:
        - { text: "Flat sites on the valley floor", correct: false }
        - { text: "Warm slopes facing south or south-east", correct: true }
        - { text: "High slopes facing due north", correct: false }
        - { text: "Low sites shaded through the afternoon", correct: false }
      explanation: |
        At this northerly latitude, a warm exposure increases sunlight and heat accumulation. Côte-Rôtie and
        Hermitage both illustrate the value of well-exposed slopes.
    fr:
      question: "Quelle exposition favorise le plus souvent une maturité complète sur les coteaux escarpés du Rhône septentrional ?"
      choices:
        - { text: "Les terrains plats du fond de vallée", correct: false }
        - { text: "Les coteaux chauds exposés au sud ou au sud-est", correct: true }
        - { text: "Les hauts de coteau orientés plein nord", correct: false }
        - { text: "Les bas de pente ombragés l’après-midi", correct: false }
      explanation: |
        À cette latitude septentrionale, une exposition chaude augmente l’ensoleillement et l’accumulation de
        chaleur. Côte-Rôtie et Hermitage illustrent tous deux l’intérêt de coteaux bien exposés.
  - id: nrhone-lateral-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0003
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Where are many of the Northern Rhône’s leading vineyard sites found?"
      choices:
        - { text: "On fertile flats beside the river", correct: false }
        - { text: "On steep slopes above the Rhône and its side valleys", correct: true }
        - { text: "On broad plateaux far from the valley", correct: false }
        - { text: "On low coastal terraces near the Mediterranean", correct: false }
      explanation: |
        The best-known vineyards use steep, well-exposed ground overlooking the Rhône or short tributary
        valleys. The slope improves exposure and drainage but makes cultivation difficult.
    fr:
      question: "Où se trouvent de nombreux grands terroirs du Rhône septentrional ?"
      choices:
        - { text: "Sur les terres fertiles et planes au bord du fleuve", correct: false }
        - { text: "Sur les coteaux escarpés dominant le Rhône et ses vallées latérales", correct: true }
        - { text: "Sur de vastes plateaux éloignés de la vallée", correct: false }
        - { text: "Sur de basses terrasses littorales proches de la Méditerranée", correct: false }
      explanation: |
        Les vignobles les plus réputés occupent des pentes raides et bien exposées dominant le Rhône ou de
        courtes vallées affluentes. La pente améliore l’exposition et le drainage, mais complique le travail.
  - id: nrhone-wind-shelter-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0004
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "How can a side valley benefit a Northern Rhône vineyard exposed to northerly winds?"
      choices:
        - { text: "By funnelling the strongest gusts towards the vines", correct: false }
        - { text: "By sheltering a site from the full force of the wind", correct: true }
        - { text: "By increasing maritime humidity throughout summer", correct: false }
        - { text: "By preventing cold air from draining downslope", correct: false }
      explanation: |
        Local folds in the relief can reduce exposure to the mistral. This protection is valuable because
        violent gusts can damage shoots even though the dry wind also limits disease.
    fr:
      question: "Comment une vallée latérale peut-elle avantager un vignoble du Rhône septentrional exposé aux vents du nord ?"
      choices:
        - { text: "En canalisant les rafales les plus fortes vers les vignes", correct: false }
        - { text: "En protégeant le site de toute la force du vent", correct: true }
        - { text: "En augmentant l’humidité maritime pendant tout l’été", correct: false }
        - { text: "En empêchant l’air froid de s’écouler le long des pentes", correct: false }
      explanation: |
        Les replis du relief peuvent réduire l’exposition au mistral. Cette protection est utile car les
        violentes rafales peuvent endommager les rameaux, même si ce vent sec limite aussi les maladies.
  - id: nrhone-mistral-name-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone","climate"]
    status: reviewed
    source_id: c19-0005
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "What is the cold, dry northerly wind that funnels down the Rhône Valley?"
      choices:
        - { text: "The tramontane", correct: false }
        - { text: "The mistral", correct: true }
        - { text: "The autan", correct: false }
        - { text: "The foehn", correct: false }
      explanation: |
        The mistral accelerates through the Rhône corridor. It can dry vineyards rapidly after rain but can also
        damage foliage and shoots.
    fr:
      question: "Comment s’appelle le vent froid et sec du nord qui s’engouffre dans la vallée du Rhône ?"
      choices:
        - { text: "La tramontane", correct: false }
        - { text: "Le mistral", correct: true }
        - { text: "L’autan", correct: false }
        - { text: "Le foehn", correct: false }
      explanation: |
        Le mistral accélère dans le couloir rhodanien. Il peut sécher rapidement le vignoble après la pluie,
        mais aussi endommager le feuillage et les rameaux.
  - id: nrhone-mistral-threat-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone","climate"]
    status: reviewed
    source_id: c19-0006
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "What is the principal direct danger of a violent mistral in a Northern Rhône vineyard?"
      choices:
        - { text: "It traps humid air and increases downy mildew", correct: false }
        - { text: "It can break shoots and damage foliage", correct: true }
        - { text: "It brings warm rain during flowering", correct: false }
        - { text: "It prevents grapes from developing colour", correct: false }
      explanation: |
        Young growth is vulnerable to strong gusts, particularly on exposed slopes. Stakes and careful training
        help keep the canopy secure.
    fr:
      question: "Quel est le principal danger direct d’un mistral violent dans un vignoble du Rhône septentrional ?"
      choices:
        - { text: "Il emprisonne l’air humide et favorise le mildiou", correct: false }
        - { text: "Il peut casser les rameaux et abîmer le feuillage", correct: true }
        - { text: "Il apporte des pluies chaudes pendant la floraison", correct: false }
        - { text: "Il empêche les raisins de développer leur couleur", correct: false }
      explanation: |
        Les jeunes pousses sont vulnérables aux fortes rafales, surtout sur les coteaux exposés. Les échalas et
        une conduite attentive permettent de maintenir la végétation.
  - id: nrhone-stakes-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0007
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which support system is traditional on the Northern Rhône’s steep, windy slopes?"
      choices:
        - { text: "High pergolas spanning several rows", correct: false }
        - { text: "Individual stakes or groups of stakes forming a tepee", correct: true }
        - { text: "Untrained gobelet vines without support", correct: false }
        - { text: "Wide horizontal trellises on tall posts", correct: false }
      explanation: |
        Échalas support each vine securely and suit narrow terraces where tractors and broad trellises are
        impractical. Several stakes may be tied together at the top.
    fr:
      question: "Quel système de soutien est traditionnel sur les coteaux escarpés et venteux du Rhône septentrional ?"
      choices:
        - { text: "De hautes pergolas couvrant plusieurs rangs", correct: false }
        - { text: "Des échalas individuels ou réunis en forme de tipi", correct: true }
        - { text: "Des vignes en gobelet sans aucun support", correct: false }
        - { text: "De larges palissages horizontaux sur des piquets élevés", correct: false }
      explanation: |
        Les échalas maintiennent solidement chaque cep et conviennent aux terrasses étroites où les tracteurs et
        les larges palissages sont peu pratiques. Plusieurs piquets peuvent être liés à leur sommet.
  - id: nrhone-climate-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone","climate"]
    status: reviewed
    source_id: c19-0008
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "How is the climate of the Northern Rhône best described?"
      choices:
        - { text: "Cool maritime with mild, wet summers", correct: false }
        - { text: "Moderate continental with Mediterranean influences", correct: true }
        - { text: "Fully Mediterranean with very mild winters", correct: false }
        - { text: "Alpine with a very short growing season", correct: false }
      explanation: |
        The north has greater seasonal variation and more regular rainfall than the southern valley, while
        warmer, drier Mediterranean influences become more evident towards Valence.
    fr:
      question: "Comment décrire au mieux le climat du Rhône septentrional ?"
      choices:
        - { text: "Océanique frais avec des étés doux et humides", correct: false }
        - { text: "Continental modéré avec des influences méditerranéennes", correct: true }
        - { text: "Entièrement méditerranéen avec des hivers très doux", correct: false }
        - { text: "Alpin avec une saison végétative très courte", correct: false }
      explanation: |
        Le nord connaît des variations saisonnières plus marquées et des pluies plus régulières que le sud de la
        vallée, tandis que les influences méditerranéennes plus chaudes et sèches augmentent vers Valence.
  - id: nrhone-syrah-only-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone","grapes"]
    status: reviewed
    source_id: c19-0010
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which black grape variety underpins all red crus of the Northern Rhône?"
      choices:
        - { text: "Grenache", correct: false }
        - { text: "Syrah", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Gamay", correct: false }
      explanation: |
        Syrah is the sole black variety of the northern crus. Some appellations permit limited white grapes in a
        red blend, but no second black variety.
    fr:
      question: "Quel cépage noir constitue la base de tous les crus rouges du Rhône septentrional ?"
      choices:
        - { text: "Le Grenache", correct: false }
        - { text: "La Syrah", correct: true }
        - { text: "Le Mourvèdre", correct: false }
        - { text: "Le Gamay", correct: false }
      explanation: |
        La Syrah est l’unique cépage noir des crus septentrionaux. Certaines appellations autorisent une faible
        proportion de cépages blancs dans le rouge, mais aucun autre cépage noir.
  - id: nrhone-syrah-limit-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone","grapes"]
    status: reviewed
    source_id: c19-0011
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which Rhône variety approaches its reliable northern ripening limit in Côte-Rôtie?"
      choices:
        - { text: "Grenache", correct: false }
        - { text: "Syrah", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Cinsault", correct: false }
      explanation: |
        Syrah needs the warmth of Côte-Rôtie’s steep, sunny slopes to ripen consistently this far north. Cooler
        or poorly exposed sites risk herbaceous, austere fruit.
    fr:
      question: "Quel cépage rhodanien approche sa limite septentrionale de maturation fiable en Côte-Rôtie ?"
      choices:
        - { text: "Le Grenache", correct: false }
        - { text: "La Syrah", correct: true }
        - { text: "Le Mourvèdre", correct: false }
        - { text: "Le Cinsault", correct: false }
      explanation: |
        La Syrah a besoin de la chaleur des coteaux escarpés et ensoleillés de Côte-Rôtie pour mûrir
        régulièrement aussi loin au nord. Les sites plus frais ou mal exposés risquent de donner des raisins
        végétaux et austères.
  - id: nrhone-syrah-profile-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone","grapes"]
    status: reviewed
    source_id: c19-0012
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which profile is most typical of a high-quality Northern Rhône Syrah?"
      choices:
        - { text: "Pale colour, low tannin and sweet red fruit", correct: false }
        - { text: "Deep colour, firm tannin, black fruit and peppery or floral notes", correct: true }
        - { text: "Medium colour, soft tannin and baked red fruit", correct: false }
        - { text: "Deep colour, low acidity and pronounced coconut aromas", correct: false }
      explanation: |
        The combination of black fruit, pepper or violet and firm structure is a northern Syrah signature.
        Bottle age can add leather, savoury spice and game.
    fr:
      question: "Quel profil correspond le mieux à une Syrah de qualité du Rhône septentrional ?"
      choices:
        - { text: "Robe pâle, peu de tanins et fruits rouges doux", correct: false }
        - { text: "Robe profonde, tanins fermes, fruits noirs et notes poivrées ou florales", correct: true }
        - { text: "Robe moyenne, tanins souples et fruits rouges cuits", correct: false }
        - { text: "Robe profonde, faible acidité et arômes marqués de noix de coco", correct: false }
      explanation: |
        L’association de fruits noirs, de poivre ou de violette et d’une structure ferme caractérise la Syrah
        septentrionale. La garde peut apporter du cuir, des épices savoureuses et des notes de gibier.
  - id: nrhone-syrah-oak-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0013
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "What chiefly determines the amount of new oak used for a Northern Rhône Syrah?"
      choices:
        - { text: "A fixed requirement applying to every northern cru", correct: false }
        - { text: "The producer’s intended style and the wine’s concentration", correct: true }
        - { text: "A regional rule based only on alcohol level", correct: false }
        - { text: "The proportion of white grapes in the blend", correct: false }
      explanation: |
        Appellation rules do not impose one oak regime. Producers may choose older foudres, smaller barrels or
        new oak according to fruit concentration and house style.
    fr:
      question: "Qu’est-ce qui détermine principalement la proportion de bois neuf utilisée pour une Syrah du Rhône septentrional ?"
      choices:
        - { text: "Une obligation fixe commune à tous les crus septentrionaux", correct: false }
        - { text: "Le style recherché par le producteur et la concentration du vin", correct: true }
        - { text: "Une règle régionale fondée uniquement sur le degré alcoolique", correct: false }
        - { text: "La proportion de cépages blancs dans l’assemblage", correct: false }
      explanation: |
        Les cahiers des charges n’imposent pas un régime d’élevage unique. Selon la concentration du fruit et le
        style de la maison, le producteur peut choisir des foudres anciens, de petites barriques ou du bois
        neuf.
  - id: nrhone-coferment-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0014
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "In which Northern Rhône cru is Syrah especially associated with co-fermented Viognier?"
      choices:
        - { text: "Hermitage", correct: false }
        - { text: "Côte-Rôtie", correct: true }
        - { text: "Cornas", correct: false }
        - { text: "Crozes-Hermitage", correct: false }
      explanation: |
        Côte-Rôtie uniquely permits Viognier alongside Syrah, up to a legal ceiling of 20%. In practice many
        wines use much less or none.
    fr:
      question: "Dans quel cru du Rhône septentrional la Syrah est-elle particulièrement associée à la cofermentation avec le Viognier ?"
      choices:
        - { text: "Hermitage", correct: false }
        - { text: "Côte-Rôtie", correct: true }
        - { text: "Cornas", correct: false }
        - { text: "Crozes-Hermitage", correct: false }
      explanation: |
        Côte-Rôtie est le seul cru rouge septentrional à autoriser le Viognier aux côtés de la Syrah, jusqu’à un
        plafond légal de 20 %. En pratique, de nombreux vins en utilisent bien moins, voire pas du tout.
  - id: nrhone-white-in-red-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0015
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "What can a small proportion of Viognier contribute to Côte-Rôtie?"
      choices:
        - { text: "More tannin and darker colour", correct: false }
        - { text: "Floral aroma and a finer impression of texture", correct: true }
        - { text: "Higher acidity and lower potential alcohol", correct: false }
        - { text: "More extraction during extended maceration", correct: false }
      explanation: |
        When planted and vinified with Syrah, Viognier can heighten aromatic finesse and floral lift. It is an
        option rather than a compulsory component.
    fr:
      question: "Que peut apporter une faible proportion de Viognier à un Côte-Rôtie ?"
      choices:
        - { text: "Davantage de tanins et une couleur plus sombre", correct: false }
        - { text: "Des arômes floraux et une impression de texture plus fine", correct: true }
        - { text: "Une acidité plus élevée et un degré alcoolique potentiel plus faible", correct: false }
        - { text: "Une extraction accrue pendant une longue macération", correct: false }
      explanation: |
        Lorsqu’il est complanté et vinifié avec la Syrah, le Viognier peut renforcer la finesse aromatique et
        les notes florales. Il s’agit d’une possibilité, non d’un élément obligatoire.
  - id: nrhone-viognier-profile-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone","grapes"]
    status: reviewed
    source_id: c19-0016
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which profile is most typical of ripe Northern Rhône Viognier?"
      choices:
        - { text: "Light body, high acidity and green-apple aromas", correct: false }
        - { text: "Full body, moderate to low acidity and apricot or floral aromas", correct: true }
        - { text: "Medium body, high acidity and citrus-mineral aromas", correct: false }
        - { text: "Full body, high tannin and black-fruit aromas", correct: false }
      explanation: |
        Viognier develops its distinctive stone-fruit and blossom aromas at high ripeness. Condrieu can
        therefore combine generous body and alcohol with relatively modest acidity.
    fr:
      question: "Quel profil correspond le mieux à un Viognier mûr du Rhône septentrional ?"
      choices:
        - { text: "Corps léger, acidité élevée et arômes de pomme verte", correct: false }
        - { text: "Corps ample, acidité modérée à faible et arômes d’abricot ou de fleurs", correct: true }
        - { text: "Corps moyen, acidité élevée et arômes d’agrumes et de pierre", correct: false }
        - { text: "Corps ample, tanins élevés et arômes de fruits noirs", correct: false }
      explanation: |
        Le Viognier développe ses arômes caractéristiques de fruits à noyau et de fleurs à forte maturité.
        Condrieu peut ainsi associer ampleur, alcool généreux et acidité relativement modeste.
  - id: nrhone-viognier-ripe-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone","grapes"]
    status: reviewed
    source_id: c19-0017
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Why is achieving full flavour ripeness important for Viognier in the Northern Rhône?"
      choices:
        - { text: "Its tannins remain aggressively astringent until very late", correct: false }
        - { text: "Its characteristic stone-fruit aromas develop at relatively high sugar levels", correct: true }
        - { text: "Its colour remains red until the final days before harvest", correct: false }
        - { text: "Its acidity rises sharply during the last stage of ripening", correct: false }
      explanation: |
        Picking too early can give neutral fruit, while waiting for aromatic ripeness can mean high potential
        alcohol and falling acidity. Harvest timing is therefore a key balance.
    fr:
      question: "Pourquoi est-il important d’atteindre une pleine maturité aromatique avec le Viognier dans le Rhône septentrional ?"
      choices:
        - { text: "Ses tanins restent très astringents jusqu’à une date tardive", correct: false }
        - { text: "Ses arômes caractéristiques de fruits à noyau se développent à des teneurs en sucre assez élevées", correct: true }
        - { text: "Sa couleur reste rouge jusqu’aux derniers jours avant la vendange", correct: false }
        - { text: "Son acidité augmente fortement pendant la dernière phase de maturation", correct: false }
      explanation: |
        Une récolte trop précoce peut donner un fruit neutre, tandis qu’attendre la maturité aromatique entraîne
        souvent un degré alcoolique potentiel élevé et une baisse d’acidité. La date de vendange est donc un
        équilibre essentiel.
  - id: nrhone-viognier-handle-001
    type: mcq
    deck: "France::Northern Rhône"
    tags: ["france","northern-rhone"]
    status: reviewed
    source_id: c19-0018
    review:
      fact_check: pass
      sources: ["known-fact"]
    en:
      question: "Which cellar risk requires careful handling of Viognier must in the Northern Rhône?"
      choices:
        - { text: "Excessive tannin extraction from thick skins", correct: false }
        - { text: "Oxidation and loss of delicate aromatic freshness", correct: true }
        - { text: "A compulsory second alcoholic fermentation", correct: false }
        - { text: "Failure to develop red colour during maceration", correct: false }
      explanation: |
        Viognier must is sensitive to oxidation and can lose aromatic definition. Protective pressing and
        controlled handling help preserve its fruit and floral character.
    fr:
      question: "Quel risque de cave impose une manipulation attentive du moût de Viognier dans le Rhône septentrional ?"
      choices:
        - { text: "Une extraction excessive des tanins de pellicules épaisses", correct: false }
        - { text: "L’oxydation et la perte de fraîcheur aromatique", correct: true }
