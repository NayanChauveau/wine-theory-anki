# yaml-language-server: $schema=../schema/cards.schema.json
# source: C19 (import/inbox/c19-northern-rhone.yaml)
# deck: France::Northern Rhône

cards:
  - id: nrhone-valley-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is the Northern Rhône valley shaped?
      choices:
        - { text: "A wide, flat alluvial plain far from any river", correct: false }
        - { text: "Narrow and steep", correct: true }
        - { text: "A high alpine plateau above the treeline", correct: false }
        - { text: "A Mediterranean lagoon, like the Camargue", correct: false }
      explanation: |
        **Narrow, steep, vines by the river.** Côte-Rôtie and Hermitage
        hang off the bank; this is not the broad southern plain.

  - id: nrhone-best-aspect-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which sites usually make the best Northern Rhône wine?
      choices:
        - { text: "North-facing valley floors", correct: false }
        - { text: "Steep slopes that face south", correct: true }
        - { text: "Only west-facing Vosges summits", correct: false }
        - { text: "Indoor greenhouses", correct: false }
      explanation: |
        **Steep, south-facing slopes** — **Hermitage** behind Tain, the
        **Côte Brune / Blonde** at Ampuis. Syrah needs that sun.

  - id: nrhone-lateral-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where, relative to the main river, do many top Northern Rhône vineyards sit?
      choices:
        - { text: "Only on the Mediterranean coast", correct: false }
        - { text: "In the side valleys that feed the Rhône", correct: true }
        - { text: "Only inside Lyon’s walls", correct: false }
        - { text: "On the west face of the Vosges", correct: false }
      explanation: |
        **Lateral valleys** off the main trench. Those folds hide vines
        from the worst of the north wind.

  - id: nrhone-wind-shelter-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do the side valleys do for Northern Rhône vines?
      choices:
        - { text: "They funnel more frost onto every row", correct: false }
        - { text: "They shelter the vines from the cold north wind", correct: true }
        - { text: "They make irrigation illegal", correct: false }
        - { text: "They force a legal white-only AOC", correct: false }
      explanation: |
        **Shelter from the cold northerly wind.** The mistral still
        blows; the side valley just takes the edge off.

  - id: nrhone-mistral-name-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, climate]
    status: reviewed
    source_id: c19-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the cold north wind that funnels down the Rhône called?
      choices:
        - { text: "The foehn", correct: false }
        - { text: "The mistral", correct: true }
        - { text: "The zonda", correct: false }
        - { text: "The sirocco", correct: false }
      explanation: |
        **The mistral** — cold, dry, violent. It dries rot and can snap
        shoots.

  - id: nrhone-mistral-threat-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, climate]
    status: reviewed
    source_id: c19-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do growers still treat the mistral as a vineyard threat?
      choices:
        - { text: "It only brings warm rain", correct: false }
        - { text: "It can break canes and damage the vines", correct: true }
        - { text: "It is banned by INAO", correct: false }
        - { text: "It never reaches Ampuis", correct: false }
      explanation: |
        **It can damage the vines** — snapped shoots, shredded leaves.
        The same wind also dries the fruit after rain.

  - id: nrhone-stakes-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are Northern Rhône vines usually held up against the mistral?
      choices:
        - { text: "Ungrafted bush vines with no support, by law", correct: false }
        - { text: "On individual stakes, or a tepee of stakes", correct: true }
        - { text: "Only high Pergola systems", correct: false }
        - { text: "They are never trained", correct: false }
      explanation: |
        **Single stakes or a tepee (échalas).** Classic Côte-Rôtie /
        Hermitage kit. A wire trellis would catch more wind.

  - id: nrhone-climate-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, climate]
    status: reviewed
    source_id: c19-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which climate description fits the Northern Rhône?
      choices:
        - { text: "Cool maritime, like Muscadet", correct: false }
        - { text: "Moderate continental", correct: true }
        - { text: "Hot desert, like the Atacama", correct: false }
        - { text: "High alpine only", correct: false }
      explanation: |
        **Moderate continental**, kin to Beaujolais. **Châteauneuf**
        country farther south is a warmer, more Mediterranean story.

  - id: nrhone-syrah-only-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, grapes]
    status: reviewed
    source_id: c19-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which is the only black grape the Northern Rhône crus allow?
      choices:
        - { text: "Grenache", correct: false }
        - { text: "Syrah", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Pinot Noir", correct: false }
      explanation: |
        **Syrah only.** Whites can join some reds (Viognier at
        Côte-Rôtie); no Grenache corridor.

  - id: nrhone-syrah-limit-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, grapes]
    status: reviewed
    source_id: c19-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Rhône grape is hanging on at the northern edge of where it still ripens?
      choices:
        - { text: "Grenache", correct: false }
        - { text: "Syrah", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Muscat of Alexandria", correct: false }
      explanation: |
        **Syrah.** Côte-Rôtie is about as far north as it reliably
        finishes. That is why aspect and the roasted slope matter.

  - id: nrhone-syrah-profile-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, grapes]
    status: reviewed
    source_id: c19-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What shape do Northern Rhône Syrahs usually have?
      choices:
        - { text: "Pale, low tannin, and always sweet", correct: false }
        - { text: "Deep colour, medium to high tannin, black fruit, sometimes black pepper or flowers", correct: true }
        - { text: "Oily, low acid, lychee", correct: false }
        - { text: "Light Gamay, for chilling", correct: false }
      explanation: |
        **Deep, medium–high tannin, black fruit, pepper or floral.**
        **Guigal** and **Jaboulet** sit in that family. Not southern GSM
        warmth.

  - id: nrhone-syrah-oak-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Who decides how much new oak a Northern Rhône Syrah sees?
      choices:
        - { text: "INAO — 100% new barrique is mandatory", correct: false }
        - { text: "The winemaker", correct: true }
        - { text: "Oak is banned", correct: false }
        - { text: "Only white wines may see oak", correct: false }
      explanation: |
        **The winemaker.** **Guigal La-Las** see plenty of new oak;
        others stay in older foudres. Not a single house style.

  - id: nrhone-coferment-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In which Northern Rhône cru is Syrah still often fermented with Viognier?
      choices:
        - { text: "Nowhere — it is banned in every cru", correct: false }
        - { text: "Côte-Rôtie", correct: true }
        - { text: "Only in Champagne", correct: false }
        - { text: "Only on Muscadet", correct: false }
      explanation: |
        **Côte-Rôtie.** Hermitage and Saint-Joseph do it far less.

  - id: nrhone-white-in-red-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the main reason Côte-Rôtie growers ferment Viognier with Syrah?
      choices:
        - { text: "To turn the wine rosé by law", correct: false }
        - { text: "Aromatic lift", correct: true }
        - { text: "To strip all tannin", correct: false }
        - { text: "White grapes are illegal in every red", correct: false }
      explanation: |
        **Aromatic lift.** Colour-stability talk is extra. **Guigal**
        Côte-Rôtie is the named floral example.

  - id: nrhone-viognier-profile-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, grapes]
    status: reviewed
    source_id: c19-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Northern Rhône Viognier usually taste like?
      choices:
        - { text: "Light, high acid, 11%, green apple", correct: false }
        - { text: "Full, low acid, high alcohol, blossom and apricot / stone fruit", correct: true }
        - { text: "Tannic red, like Hermitage", correct: false }
        - { text: "Steely and smoky, like Savennières", correct: false }
      explanation: |
        **Full, low acid, high alcohol, blossom and apricot.** That is
        **Condrieu**. Not a Chablis frame.

  - id: nrhone-viognier-ripe-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, grapes]
    status: reviewed
    source_id: c19-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do growers hang Viognier so late that alcohol climbs and acid drops?
      choices:
        - { text: "It is picked green every year, by law", correct: false }
        - { text: "The signature aromas only arrive late, when sugars are already high", correct: true }
        - { text: "INAO forces chaptalisation to 16%", correct: false }
        - { text: "It is a red grape", correct: false }
      explanation: |
        **Aromas come late**, so growers hang fruit into high sugar —
        alcohol up, acid down. Pick earlier and you lose the apricot.

  - id: nrhone-viognier-handle-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What cellar fault appears if Viognier is worked too hard?
      choices:
        - { text: "It never oxidises and can be beaten", correct: false }
        - { text: "An oily weight that buries the fruit", correct: true }
        - { text: "It must be boiled", correct: false }
        - { text: "It is illegal to press", correct: false }
      explanation: |
        **Oily weight can smother the blossom.** Gentle press, careful
        lees — **Vernay** Condrieu is the quiet handling story.

  - id: nrhone-viognier-oak-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is new oak used on Northern Rhône Viognier now?
      choices:
        - { text: "It is banned", correct: false }
        - { text: "More domaines use it, but a heavy toast easily buries the fruit", correct: true }
        - { text: "100% new oak is mandatory", correct: false }
        - { text: "Only reds may see oak", correct: false }
      explanation: |
        **Increasing, and easy to overdo.** The fruit is already loud;
        more toast is not always more Condrieu.

  - id: nrhone-viognier-offdry-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides dry Condrieu, what other Viognier style appears?
      choices:
        - { text: "Sparkling red only", correct: false }
        - { text: "Some off-dry wine from late-picked fruit", correct: true }
        - { text: "Fortified, like Port", correct: false }
        - { text: "Icewine every January", correct: false }
      explanation: |
        **Off-dry, late-harvest** lots exist. They are the minority next
        to dry Condrieu.

  - id: nrhone-other-whites-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, grapes]
    status: reviewed
    source_id: c19-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides Viognier, which two whites grow in the Northern Rhône?
      choices:
        - { text: "Riesling and Gewurztraminer", correct: false }
        - { text: "Marsanne and Roussanne", correct: true }
        - { text: "Melon and Chenin", correct: false }
        - { text: "Chardonnay only", correct: false }
      explanation: |
        **Marsanne and Roussanne** (two s, two n). Hermitage and
        Saint-Joseph whites are that pair, not Condrieu’s Viognier.

  - id: nrhone-mr-blend-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, grapes]
    status: reviewed
    source_id: c19-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are Marsanne and Roussanne usually bottled in the Northern Rhône?
      choices:
        - { text: "Only as 100% Viognier", correct: false }
        - { text: "Blended with each other", correct: true }
        - { text: "Only as sparkling red", correct: false }
        - { text: "They are illegal to blend", correct: false }
      explanation: |
        **Usually blended.** Single-variety bottles exist; the house
        default is the pair.

  - id: nrhone-mr-roles-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone, grapes]
    status: reviewed
    source_id: c19-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does each of Marsanne and Roussanne bring to a Northern Rhône white blend?
      choices:
        - { text: "Marsanne: acid and perfume; Roussanne: only colour", correct: false }
        - { text: "Marsanne: richness and weight; Roussanne: acidity and perfumed fruit", correct: true }
        - { text: "Both are neutral, like Ugni Blanc", correct: false }
        - { text: "Neither may be used in white wine", correct: false }
      explanation: |
        **Marsanne = weight; Roussanne = acid and perfume.** That is why
        the blend is more complete than either grape alone.

  - id: nrhone-mr-age-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do Marsanne–Roussanne whites usually compare with Viognier for perfume?
      choices:
        - { text: "Louder perfume than Condrieu", correct: false }
        - { text: "Less aromatic than Viognier", correct: true }
        - { text: "They have no perfume at all, by law", correct: false }
        - { text: "They are red wines", correct: false }
      explanation: |
        **Less perfume than Viognier; better long-term, toward
        hazelnut.** Old **Hermitage blanc** (Jaboulet, Chapoutier) is
        the checkable bottle.

  - id: nrhone-cdr-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which southern-sounding AOC can also be bottled from Northern Rhône fruit?
      choices:
        - { text: "Côtes de Provence", correct: false }
        - { text: "Côtes du Rhône", correct: true }
        - { text: "Cahors", correct: false }
        - { text: "Muscadet", correct: false }
      explanation: |
        **Côtes du Rhône** is valley-wide. Northern fruit can wear it
        when it misses a cru.

  - id: nrhone-cru-system-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where do most Northern Rhône bottles actually come from?
      choices:
        - { text: "Only IGP, with no crus", correct: false }
        - { text: "One of the cru appellations", correct: true }
        - { text: "Only Bordeaux châteaux", correct: false }
        - { text: "Vin de France is the only name", correct: false }
      explanation: |
        **The crus** — Côte-Rôtie, Hermitage, Crozes, Saint-Joseph, and
        the rest. Generic Côtes du Rhône is the leftover, not the
        default.

  - id: nrhone-crus-tiny-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How big are most Northern Rhône crus?
      choices:
        - { text: "The size of the Médoc", correct: false }
        - { text: "Often tiny", correct: true }
        - { text: "They cover half of France", correct: false }
        - { text: "There are no crus", correct: false }
      explanation: |
        **Tiny** — **Château-Grillet**, **Cornas**, **Côte-Rôtie** are
        postage stamps next to Crozes.

  - id: nrhone-big-crus-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two Northern Rhône crus actually cover serious hectare counts?
      choices:
        - { text: "Château-Grillet and Cornas", correct: false }
        - { text: "Saint-Joseph and Crozes-Hermitage", correct: true }
        - { text: "Côte-Rôtie and Hermitage only", correct: false }
        - { text: "Condrieu and Château-Grillet", correct: false }
      explanation: |
        **Saint-Joseph** and **Crozes-Hermitage** are the big maps.
        Hermitage itself is a small hill.

  - id: nrhone-ampuis-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which town sits under Côte-Rôtie?
      choices:
        - { text: "Tain-l’Hermitage", correct: false }
        - { text: "Ampuis", correct: true }
        - { text: "Nantes", correct: false }
        - { text: "Beaune", correct: false }
      explanation: |
        **Ampuis.** **Guigal**’s cellar is the postcard. Tain is
        Hermitage.

  - id: nrhone-cr-north-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which is the northernmost Northern Rhône cru?
      choices:
        - { text: "Cornas", correct: false }
        - { text: "Côte-Rôtie", correct: true }
        - { text: "Gigondas", correct: false }
        - { text: "Muscadet", correct: false }
      explanation: |
        **Côte-Rôtie** — first cru as you leave Lyon. Cornas is the
        southern end of the north.

  - id: nrhone-cr-name-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Côte-Rôtie literally mean?
      choices:
        - { text: "Frozen slope", correct: false }
        - { text: "Roasted slope", correct: true }
        - { text: "White castle", correct: false }
        - { text: "Little hermitage", correct: false }
      explanation: |
        **Roasted slope** — the south/south-east face cooks in the sun.
        That is the name, not a toast level.

  - id: nrhone-cr-colour-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What colours may Côte-Rôtie bottle?
      choices:
        - { text: "White and sparkling only", correct: false }
        - { text: "Red only", correct: true }
        - { text: "Rosé only", correct: false }
        - { text: "Any colour, including orange", correct: false }
      explanation: |
        **Red only.** Viognier goes into the red ferment; there is no
        Côte-Rôtie blanc.

  - id: nrhone-cr-grapes-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grapes may go into Côte-Rôtie?
      choices:
        - { text: "Grenache and Mourvèdre only", correct: false }
        - { text: "Syrah, and Viognier in small amounts", correct: true }
        - { text: "Pinot Noir only", correct: false }
        - { text: "Marsanne only", correct: false }
      explanation: |
        **Syrah + optional Viognier.** The white is not a separate
        bottling.

  - id: nrhone-cr-viognier-how-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Viognier enter a Côte-Rôtie?
      choices:
        - { text: "As a late dose of sweet reserve, after malo", correct: false }
        - { text: "In small amounts, fermented with the Syrah", correct: true }
        - { text: "As a 100% white AOC", correct: false }
        - { text: "It is banned", correct: false }
      explanation: |
        **Small amount, co-fermented.** You do not splash it in after
        the red is dry.

  - id: nrhone-cr-viognier-pct-001
    type: mcq
    deck: France::Northern Rhône
    tags: [france, northern-rhone]
    status: reviewed
    source_id: c19-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the legal Viognier ceiling in Côte-Rôtie?
      choices:
        - { text: "0% — white grapes are banned", correct: false }
