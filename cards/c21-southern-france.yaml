# source: C21 (import/inbox/c21-southern-france.yaml)
# deck: France::Southern France

cards:
  - id: sfrance-climate-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, climate]
    status: reviewed
    source_id: c21-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate pattern best describes most of Southern France’s Mediterranean vineyards?"
      choices:
        - { text: "Warm, dry summers; mild winters; most rain outside summer", correct: true }
        - { text: "Cool summers; severe winters; evenly distributed rain", correct: false }
        - { text: "Hot, humid summers; dry, freezing winters", correct: false }
        - { text: "Mild summers; very wet winters; little sunshine", correct: false }
      explanation: |
        A Mediterranean climate brings abundant sunshine, warm to hot dry summers and generally mild
        winters. Low summer rainfall makes drought a more persistent concern than failure to ripen.
    fr:
      question: "Quel régime climatique décrit le mieux la plupart des vignobles méditerranéens du sud de la France ?"
      choices:
        - { text: "Étés chauds et secs, hivers doux, pluies surtout hors de l’été", correct: true }
        - { text: "Étés frais, hivers rigoureux, pluies réparties toute l’année", correct: false }
        - { text: "Étés chauds et humides, hivers secs et glacials", correct: false }
        - { text: "Étés doux, hivers très pluvieux, faible ensoleillement", correct: false }
      explanation: |
        Le climat méditerranéen apporte un fort ensoleillement, des étés chauds à très chauds et secs, ainsi
        que des hivers généralement doux. La faible pluviométrie estivale rend la sécheresse plus
        préoccupante qu’un défaut de maturité.
  - id: sfrance-terrain-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france]
    status: reviewed
    source_id: c21-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which broad contrast best describes the vineyard landscape of Languedoc-Roussillon?"
      choices:
        - { text: "Fertile coastal plains and poorer, often cooler foothills", correct: true }
        - { text: "Granite river terraces and volcanic mountain summits", correct: false }
        - { text: "Chalk plains and a single limestone escarpment", correct: false }
        - { text: "Atlantic dunes and permanently flooded marshes", correct: false }
      explanation: |
        Large coastal plains historically supported high-volume production. Inland foothills tend to be less
        fertile and better drained, with altitude or exposure moderating the heat and favouring more
        concentrated wines.
    fr:
      question: "Quel contraste général décrit le mieux le paysage viticole du Languedoc-Roussillon ?"
      choices:
        - { text: "Plaines littorales fertiles et piémonts plus pauvres, souvent plus frais", correct: true }
        - { text: "Terrasses fluviales granitiques et sommets volcaniques", correct: false }
        - { text: "Plaines crayeuses et unique escarpement calcaire", correct: false }
        - { text: "Dunes atlantiques et marais inondés en permanence", correct: false }
      explanation: |
        Les vastes plaines littorales ont historiquement favorisé une production de volume. Les piémonts
        intérieurs sont souvent moins fertiles et mieux drainés ; l’altitude ou l’exposition y modère la
        chaleur et favorise des vins plus concentrés.
  - id: sfrance-foothills-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france]
    status: reviewed
    source_id: c21-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do foothill sites often produce more concentrated wines than the coastal plain in Southern France?"
      choices:
        - { text: "They are generally cooler, less fertile and better drained", correct: true }
        - { text: "They are warmer, more fertile and receive more summer rain", correct: false }
        - { text: "They remain humid because water tables lie near the surface", correct: false }
        - { text: "They ripen grapes faster because their soils are deeper and richer", correct: false }
      explanation: |
        Poorer, well-drained soils restrict vigour, while elevation and exposure can provide cooler
        conditions and a longer ripening period. These factors often favour lower yields and greater
        concentration.
    fr:
      question: "Pourquoi les sites de piémont donnent-ils souvent des vins plus concentrés que la plaine littorale dans le sud de la France ?"
      choices:
        - { text: "Ils sont généralement plus frais, moins fertiles et mieux drainés", correct: true }
        - { text: "Ils sont plus chauds, plus fertiles et reçoivent davantage de pluie en été", correct: false }
        - { text: "Ils restent humides grâce à une nappe phréatique proche de la surface", correct: false }
        - { text: "Ils accélèrent la maturation grâce à des sols plus profonds et plus riches", correct: false }
      explanation: |
        Les sols pauvres et bien drainés limitent la vigueur, tandis que l’altitude et l’exposition peuvent
        apporter de la fraîcheur et prolonger la maturation. Ces facteurs favorisent souvent des rendements
        plus faibles et une meilleure concentration.
  - id: sfrance-wind-hazard-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, climate]
    status: reviewed
    source_id: c21-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climatic feature can both reduce fungal pressure and physically damage vines in Southern France?"
      choices:
        - { text: "Strong, dry winds", correct: true }
        - { text: "High summer humidity", correct: false }
        - { text: "Persistent morning fog", correct: false }
        - { text: "Frequent summer hailstorms", correct: false }
      explanation: |
        The mistral and tramontane help dry grapes and can limit fungal disease. When particularly strong,
        however, they may damage shoots, interrupt flowering or increase water stress.
    fr:
      question: "Quel facteur climatique peut à la fois réduire la pression des maladies fongiques et endommager physiquement la vigne dans le sud de la France ?"
      choices:
        - { text: "Des vents forts et secs", correct: true }
        - { text: "Une forte humidité estivale", correct: false }
        - { text: "Des brouillards matinaux persistants", correct: false }
        - { text: "De fréquents orages de grêle estivaux", correct: false }
      explanation: |
        Le mistral et la tramontane assèchent les raisins et peuvent limiter les maladies fongiques.
        Lorsqu’ils sont très violents, ils risquent toutefois d’abîmer les rameaux, de perturber la
        floraison ou d’accentuer le stress hydrique.
  - id: sfrance-mistral-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, climate]
    status: reviewed
    source_id: c21-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cool, dry northerly wind is especially associated with the Rhône valley and Provence?"
      choices:
        - { text: "Mistral", correct: true }
        - { text: "Tramontane", correct: false }
        - { text: "Autan", correct: false }
        - { text: "Marin", correct: false }
      explanation: |
        The mistral accelerates down the Rhône corridor into Provence. It can cool and dry vineyards,
        reducing disease pressure, but strong gusts can damage vines.
    fr:
      question: "Quel vent du nord, frais et sec, est particulièrement associé à la vallée du Rhône et à la Provence ?"
      choices:
        - { text: "Le mistral", correct: true }
        - { text: "La tramontane", correct: false }
        - { text: "L’autan", correct: false }
        - { text: "Le marin", correct: false }
      explanation: |
        Le mistral s’accélère dans le couloir rhodanien et souffle jusqu’en Provence. Il peut rafraîchir et
        assécher les vignobles, réduisant la pression des maladies, mais ses rafales peuvent endommager la
        vigne.
  - id: sfrance-tramontane-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, climate]
    status: reviewed
    source_id: c21-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cool, dry north-westerly wind strongly affects Roussillon and parts of western Languedoc?"
      choices:
        - { text: "Tramontane", correct: true }
        - { text: "Mistral", correct: false }
        - { text: "Sirocco", correct: false }
        - { text: "Marin", correct: false }
      explanation: |
        The tramontane is channelled between the Pyrenees and the Massif Central. It brings dry air to areas
        including Roussillon, Fitou and Corbières.
    fr:
      question: "Quel vent de nord-ouest, frais et sec, affecte fortement le Roussillon et une partie du Languedoc occidental ?"
      choices:
        - { text: "La tramontane", correct: true }
        - { text: "Le mistral", correct: false }
        - { text: "Le sirocco", correct: false }
        - { text: "Le marin", correct: false }
      explanation: |
        La tramontane est canalisée entre les Pyrénées et le Massif central. Elle apporte un air sec
        notamment au Roussillon, à Fitou et dans les Corbières.
  - id: sfrance-drought-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, climate]
    status: reviewed
    source_id: c21-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the principal water-related challenge during the growing season in Southern France?"
      choices:
        - { text: "Drought and water stress", correct: true }
        - { text: "Waterlogged soils after persistent summer rain", correct: false }
        - { text: "Snowmelt flooding throughout ripening", correct: false }
        - { text: "High humidity preventing evaporation", correct: false }
      explanation: |
        Hot, dry summers, low rainfall and drying winds can create severe water stress. Irrigation is
        regulated and water availability is an increasingly important site consideration.
    fr:
      question: "Quel est le principal défi lié à l’eau pendant la saison de croissance dans le sud de la France ?"
      choices:
        - { text: "La sécheresse et le stress hydrique", correct: true }
        - { text: "L’engorgement des sols après des pluies estivales persistantes", correct: false }
        - { text: "Les crues de fonte des neiges pendant toute la maturation", correct: false }
        - { text: "Une humidité élevée empêchant l’évaporation", correct: false }
      explanation: |
        Les étés chauds et secs, la faible pluviométrie et les vents desséchants peuvent provoquer un stress
        hydrique sévère. L’irrigation est réglementée et la disponibilité de l’eau devient un critère de
        site de plus en plus important.
  - id: sfrance-floods-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, climate]
    status: reviewed
    source_id: c21-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Despite its dry summers, which rainfall hazard can affect Mediterranean vineyards in Southern France?"
      choices:
        - { text: "Flash flooding after intense storms, especially in autumn", correct: true }
        - { text: "Regular flooding from summer snowmelt", correct: false }
        - { text: "Continuous drizzle throughout the growing season", correct: false }
        - { text: "Daily tropical downpours during ripening", correct: false }
      explanation: |
        Mediterranean rain can fall in short, violent episodes, particularly in autumn. Parched or compacted
        ground absorbs water poorly, so runoff and flash floods may be severe.
    fr:
      question: "Malgré ses étés secs, quel risque lié aux précipitations peut toucher les vignobles méditerranéens du sud de la France ?"
      choices:
        - { text: "Des crues soudaines après de violents orages, surtout en automne", correct: true }
        - { text: "Des inondations régulières dues à la fonte estivale des neiges", correct: false }
        - { text: "Une bruine continue pendant toute la saison de croissance", correct: false }
        - { text: "Des pluies tropicales quotidiennes pendant la maturation", correct: false }
      explanation: |
        Les pluies méditerranéennes peuvent tomber lors d’épisodes brefs et violents, surtout en automne.
        Les sols desséchés ou compactés absorbent mal l’eau, ce qui peut provoquer un ruissellement intense
        et des crues soudaines.
  - id: sfrance-black-majority-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape colour occupies the majority of vineyard area in Southern France?"
      choices:
        - { text: "Black grapes", correct: true }
        - { text: "White grapes", correct: false }
        - { text: "Grey-skinned grapes", correct: false }
        - { text: "The areas are approximately equal", correct: false }
      explanation: |
        Black grapes dominate plantings because the region produces large volumes of red and rosé wine.
        White varieties remain important for both regional IGP wines and distinctive appellations.
    fr:
      question: "Quelle couleur de raisin occupe la majorité de la surface viticole dans le sud de la France ?"
      choices:
        - { text: "Les raisins noirs", correct: true }
        - { text: "Les raisins blancs", correct: false }
        - { text: "Les raisins gris", correct: false }
        - { text: "Les surfaces sont à peu près équivalentes", correct: false }
      explanation: |
        Les cépages noirs dominent l’encépagement, car la région produit de grands volumes de vins rouges et
        rosés. Les cépages blancs restent néanmoins importants pour les IGP régionales et certaines
        appellations distinctives.
  - id: sfrance-local-intl-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which planting pattern is characteristic of Southern France?"
      choices:
        - { text: "Mediterranean and international varieties are both widely planted", correct: true }
        - { text: "Only traditional Mediterranean varieties may be planted", correct: false }
        - { text: "International varieties dominate every AOC blend", correct: false }
        - { text: "White varieties greatly outnumber black varieties", correct: false }
      explanation: |
        Traditional grapes such as Grenache, Carignan and Cinsault coexist with varieties such as Merlot,
        Cabernet Sauvignon, Chardonnay and Sauvignon Blanc. The international grapes are particularly
        visible in IGP wines.
    fr:
      question: "Quel profil d’encépagement caractérise le sud de la France ?"
      choices:
        - { text: "Les cépages méditerranéens et internationaux y sont tous deux largement plantés", correct: true }
        - { text: "Seuls les cépages méditerranéens traditionnels peuvent y être plantés", correct: false }
        - { text: "Les cépages internationaux dominent tous les assemblages d’AOC", correct: false }
        - { text: "Les cépages blancs sont beaucoup plus nombreux que les cépages noirs", correct: false }
      explanation: |
        Des cépages traditionnels comme le Grenache, le Carignan et le Cinsault coexistent avec le Merlot,
        le Cabernet Sauvignon, le Chardonnay ou le Sauvignon Blanc. Les cépages internationaux sont
        particulièrement visibles dans les vins d’IGP.
  - id: sfrance-local-pair-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair is central to many quality red blends in Languedoc?"
      choices:
        - { text: "Grenache and Syrah", correct: true }
        - { text: "Cabernet Franc and Gamay", correct: false }
        - { text: "Pinot Noir and Trousseau", correct: false }
        - { text: "Malbec and Tannat", correct: false }
      explanation: |
        Grenache contributes ripe fruit, body and alcohol, while Syrah can bring colour, tannin and peppery
        or dark-fruit character. Carignan and Mourvèdre are also important blending partners.
    fr:
      question: "Quel duo est au cœur de nombreux assemblages rouges de qualité en Languedoc ?"
      choices:
        - { text: "Grenache et Syrah", correct: true }
        - { text: "Cabernet Franc et Gamay", correct: false }
        - { text: "Pinot Noir et Trousseau", correct: false }
        - { text: "Malbec et Tannat", correct: false }
      explanation: |
        Le Grenache apporte fruit mûr, corps et alcool, tandis que la Syrah peut fournir couleur, tanins et
        notes poivrées ou de fruits noirs. Le Carignan et le Mourvèdre sont également des partenaires
        d’assemblage importants.
  - id: sfrance-syrah-sites-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sites generally help Syrah retain freshness and aromatic definition in Southern France?"
      choices:
        - { text: "Cooler sites at altitude or with favourable exposure", correct: true }
        - { text: "The hottest, most fertile parts of the coastal plain", correct: false }
        - { text: "Low-lying sites sheltered from every cooling influence", correct: false }
        - { text: "Sites selected principally for the highest possible yields", correct: false }
      explanation: |
        Compared with Grenache and Mourvèdre, Syrah benefits from relatively cool sites. Altitude, aspect or
        local climatic influence can slow ripening and preserve acidity and peppery aromatics.
    fr:
      question: "Quels sites aident généralement la Syrah à conserver fraîcheur et précision aromatique dans le sud de la France ?"
      choices:
        - { text: "Des sites plus frais, en altitude ou bien exposés", correct: true }
        - { text: "Les secteurs les plus chauds et fertiles de la plaine littorale", correct: false }
        - { text: "Des bas-fonds protégés de toute influence rafraîchissante", correct: false }
        - { text: "Des sites choisis surtout pour obtenir les rendements les plus élevés", correct: false }
      explanation: |
        Par rapport au Grenache et au Mourvèdre, la Syrah profite de sites relativement frais. L’altitude,
        l’exposition ou une influence climatique locale peuvent ralentir la maturation et préserver
        l’acidité ainsi que les arômes poivrés.
  - id: sfrance-grenache-sites-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which conditions are best suited to ripening Grenache in Southern France?"
      choices:
        - { text: "Warm, dry sites with a long growing season", correct: true }
        - { text: "Cool, wet sites with a short growing season", correct: false }
        - { text: "Humid, fertile sites with frequent summer rain", correct: false }
        - { text: "High-altitude sites with a high risk of incomplete ripening", correct: false }
      explanation: |
        Grenache buds early but ripens late and performs well in warm, dry Mediterranean conditions. It is
        drought tolerant, although it can lose acidity and accumulate high sugar in excessive heat.
    fr:
      question: "Quelles conditions conviennent le mieux à la maturation du Grenache dans le sud de la France ?"
      choices:
        - { text: "Des sites chauds et secs avec une longue saison de croissance", correct: true }
        - { text: "Des sites frais et humides avec une courte saison de croissance", correct: false }
        - { text: "Des sites humides et fertiles avec de fréquentes pluies estivales", correct: false }
        - { text: "Des sites de haute altitude exposés à un fort risque de sous-maturité", correct: false }
      explanation: |
        Le Grenache débourre tôt mais mûrit tard et réussit bien dans les conditions méditerranéennes
        chaudes et sèches. Il tolère la sécheresse, même s’il peut perdre de l’acidité et accumuler beaucoup
        de sucre sous une chaleur excessive.
  - id: sfrance-carignan-rank-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape was historically planted on a vast scale for high-volume wine and remains important in old-vine Languedoc-Roussillon reds?"
      choices:
        - { text: "Carignan", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Pinot Noir", correct: false }
      explanation: |
        Carignan once covered a very large area because it could crop heavily in warm conditions. Its
        plantings have fallen, but old vines on poor soils can give concentrated fruit for appellations such
        as Fitou and Corbières.
    fr:
      question: "Quel cépage noir, autrefois planté à très grande échelle pour les vins de volume, reste important dans les rouges issus de vieilles vignes du Languedoc-Roussillon ?"
      choices:
        - { text: "Carignan", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Cabernet Franc", correct: false }
        - { text: "Pinot Noir", correct: false }
      explanation: |
        Le Carignan couvrait autrefois une immense surface, car il pouvait produire de forts rendements sous
        un climat chaud. Son vignoble a reculé, mais de vieilles vignes sur sols pauvres donnent des raisins
        concentrés dans des appellations comme Fitou et Corbières.
  - id: sfrance-carignan-profile-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What profile is most likely from high-yielding Carignan grown on fertile land?"
      choices:
        - { text: "High acidity and tannin, deep colour, but limited fruit concentration", correct: true }
        - { text: "Low acidity and tannin, pale colour, and intense floral aromas", correct: false }
        - { text: "High sugar, low colour, and pronounced botrytis character", correct: false }
        - { text: "Moderate acidity, soft tannin, and strong new-oak aromas", correct: false }
      explanation: |
        At high yields, Carignan can retain substantial acidity, tannin and colour without enough fruit
        concentration to balance them. Lower yields and old vines can give much higher-quality results.
    fr:
      question: "Quel profil est le plus probable pour un Carignan à haut rendement cultivé sur un sol fertile ?"
      choices:
        - { text: "Acidité et tanins élevés, couleur soutenue, mais concentration fruitée limitée", correct: true }
        - { text: "Faible acidité et peu de tanins, couleur pâle et arômes floraux intenses", correct: false }
        - { text: "Forte teneur en sucre, faible couleur et caractère botrytisé prononcé", correct: false }
        - { text: "Acidité moyenne, tanins souples et arômes marqués de bois neuf", correct: false }
      explanation: |
        À haut rendement, le Carignan peut conserver beaucoup d’acidité, de tanins et de couleur sans
        posséder assez de concentration fruitée pour les équilibrer. Des rendements plus faibles et de
        vieilles vignes peuvent donner des résultats nettement supérieurs.
  - id: sfrance-carignan-old-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination is most favourable for producing high-quality Carignan?"
      choices:
        - { text: "Old vines, low yields and poor, well-drained soils", correct: true }
        - { text: "Young vines, high yields and deep fertile soils", correct: false }
        - { text: "Early harvest, heavy irrigation and vigorous canopies", correct: false }
        - { text: "Shaded sites, high humidity and frequent summer rain", correct: false }
      explanation: |
        Old vines on poor soils naturally limit yield and can produce small, concentrated berries. Careful
        extraction is still important because Carignan has naturally high acidity and tannin.
    fr:
      question: "Quelle combinaison est la plus favorable à la production d’un Carignan de qualité ?"
      choices:
        - { text: "Vieilles vignes, faibles rendements et sols pauvres bien drainés", correct: true }
        - { text: "Jeunes vignes, hauts rendements et sols profonds fertiles", correct: false }
        - { text: "Vendange précoce, irrigation abondante et forte vigueur", correct: false }
        - { text: "Sites ombragés, humidité élevée et pluies estivales fréquentes", correct: false }
      explanation: |
        Les vieilles vignes sur sols pauvres limitent naturellement le rendement et peuvent produire de
        petites baies concentrées. Une extraction soignée reste importante, car le Carignan possède
        naturellement beaucoup d’acidité et de tanins.
  - id: sfrance-carignan-yield-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france, grapes]
    status: reviewed
    source_id: c21-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why did Carignan become so widely planted in Southern France during the era of inexpensive bulk wine?"
      choices:
