  - id: sfrance-semicarbonic-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france]
    status: reviewed
    source_id: c21-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fermentation technique is sometimes used to make Carignan-based wines fruitier and less astringent?"
      choices:
        - { text: "Semi-carbonic maceration", correct: true }
        - { text: "Extended post-fermentation maceration", correct: false }
        - { text: "Whole-bunch pressing before fermentation", correct: false }
        - { text: "Deliberate oxidative maturation under flor", correct: false }
      explanation: |
        In semi-carbonic maceration, intracellular fermentation begins in intact berries before normal yeast
        fermentation completes the process. The technique can emphasise fresh fruit and limit harsh
        extraction.
    fr:
      question: "Quelle technique de fermentation est parfois utilisée pour rendre les vins à base de Carignan plus fruités et moins astringents ?"
      choices:
        - { text: "La macération semi-carbonique", correct: true }
        - { text: "Une longue macération post-fermentaire", correct: false }
        - { text: "Le pressurage des grappes entières avant fermentation", correct: false }
        - { text: "Un élevage oxydatif volontaire sous voile", correct: false }
      explanation: |
        Lors d’une macération semi-carbonique, une fermentation intracellulaire commence dans les baies
        intactes avant que la fermentation alcoolique classique n’achève le processus. Cette technique peut
        accentuer le fruit frais et limiter une extraction trop dure.
  - id: sfrance-semicarbonic-why-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france]
    status: reviewed
    source_id: c21-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can semi-carbonic maceration be useful for Carignan?"
      choices:
        - { text: "It emphasises fruit while limiting extraction of its firm tannins", correct: true }
        - { text: "It increases extraction to make the wine more astringent", correct: false }
        - { text: "It preserves residual sugar by stopping fermentation early", correct: false }
        - { text: "It raises acidity by encouraging malolactic fermentation", correct: false }
      explanation: |
        Carignan can be high in tannin and acidity. Semi-carbonic maceration extracts less harsh phenolic
        material than an intensive crushed-fruit fermentation and can give a softer, more immediately fruity
        style.
    fr:
      question: "Pourquoi la macération semi-carbonique peut-elle être utile pour le Carignan ?"
      choices:
        - { text: "Elle accentue le fruit tout en limitant l’extraction de ses tanins fermes", correct: true }
        - { text: "Elle augmente l’extraction afin de rendre le vin plus astringent", correct: false }
        - { text: "Elle préserve du sucre résiduel en arrêtant tôt la fermentation", correct: false }
        - { text: "Elle augmente l’acidité en favorisant la fermentation malolactique", correct: false }
      explanation: |
        Le Carignan peut posséder beaucoup de tanins et d’acidité. La macération semi-carbonique extrait
        moins de composés phénoliques durs qu’une fermentation intensive de raisins foulés et peut donner un
        style plus souple et immédiatement fruité.
