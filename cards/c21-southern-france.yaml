      choices:
        - { text: "Corsé et concentré, avec fruits rouges ou noirs mûrs, épices et tanins fermes", correct: true }
        - { text: "Léger et pâle, avec peu d’alcool et un fruit rouge délicat", correct: false }
        - { text: "Doux et fortifié, avec fruits passerillés et peu de tanins", correct: false }
        - { text: "Très acide et peu alcoolisé, avec pomme verte et agrumes", correct: false }
      explanation: |
        De faibles rendements sur des sols pauvres de coteau peuvent donner des assemblages méditerranéens
        concentrés, au fruit mûr, épicés, corsés et tanniques. Le bois peut apporter de la complexité, mais
        il n’est pas indispensable au style.
  - id: sfrance-rose-soft-001
