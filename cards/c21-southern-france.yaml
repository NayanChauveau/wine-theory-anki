        - { text: "Light-bodied and pale, with low alcohol and delicate red fruit", correct: false }
        - { text: "Sweet and fortified, with raisined fruit and low tannin", correct: false }
        - { text: "High in acidity and low in alcohol, with green apple and citrus", correct: false }
