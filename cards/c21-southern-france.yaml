        - { text: "Pinot Noir, Gamay, Trousseau et Poulsard", correct: false }
        - { text: "Nebbiolo, Barbera, Sangiovese et Montepulciano", correct: false }
      explanation: |
        Grenache, Syrah, Carignan et Mourvèdre constituent la base de nombreux rouges languedociens, souvent
        complétée par le Cinsault. Leurs proportions varient selon le site et les règles de l’appellation.
  - id: sfrance-languedoc-hard-001
