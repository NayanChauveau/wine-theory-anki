        - { text: "Every producer must use a different grape variety", correct: false }
        - { text: "The wines range from still to fortified within every appellation", correct: false }
        - { text: "There are no legally defined production areas", correct: false }
      explanation: |
        The regional Languedoc AOC alone extends roughly 200 km, and the wider region includes coastal
        plains, limestone and schist hills, and cooler uplands. Site, blend and winemaking therefore produce
        markedly different styles.
    fr:
      question: "Pourquoi est-il trompeur de décrire un style unique pour tous les vins d’AOC du Languedoc ?"
      choices:
        - { text: "La vaste région réunit de nombreux climats, sols, cépages et couleurs autorisées", correct: true }
        - { text: "Chaque producteur doit utiliser un cépage différent", correct: false }
        - { text: "Toutes les appellations produisent à la fois des vins tranquilles et fortifiés", correct: false }
        - { text: "Il n’existe aucune aire de production légalement définie", correct: false }
      explanation: |
        La seule AOC régionale Languedoc s’étend sur environ 200 km, et la grande région comprend des
        plaines littorales, des collines calcaires ou schisteuses et des hauteurs plus fraîches. Le site,
        l’assemblage et la vinification donnent donc des styles très différents.
  - id: sfrance-cool-syrah-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france]
    status: reviewed
    source_id: c21-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape is generally favoured on relatively cool Languedoc sites because it can retain peppery aromas and freshness?"
      choices:
        - { text: "Syrah", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Grenache", correct: false }
        - { text: "Carignan", correct: false }
      explanation: |
        Syrah performs well where altitude, aspect or local climatic influences moderate the Mediterranean
        heat. In very warm sites it can lose aromatic definition and become overripe.
    fr:
      question: "Quel cépage noir est généralement favorisé sur les sites relativement frais du Languedoc, où il peut conserver ses arômes poivrés et sa fraîcheur ?"
      choices:
        - { text: "Syrah", correct: true }
        - { text: "Mourvèdre", correct: false }
        - { text: "Grenache", correct: false }
        - { text: "Carignan", correct: false }
      explanation: |
        La Syrah réussit bien là où l’altitude, l’exposition ou des influences climatiques locales modèrent
        la chaleur méditerranéenne. Sur des sites très chauds, elle peut perdre sa précision aromatique et
        devenir surmûrie.
  - id: sfrance-warm-mourvedre-001
    type: mcq
    deck: France::Southern France
    tags: [france, southern-france]
    status: reviewed
    source_id: c21-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape needs the warmest Languedoc sites to ripen fully and can add tannin and savoury complexity?"
      choices:
        - { text: "Mourvèdre", correct: true }
        - { text: "Syrah", correct: false }
        - { text: "Cinsault", correct: false }
        - { text: "Merlot", correct: false }
      explanation: |
        Mourvèdre is late budding and late ripening. Warm, sheltered sites allow it to develop ripe dark
        fruit, firm tannin and herbal, meaty or gamey notes without green flavours.
    fr:
      question: "Quel cépage noir exige les sites les plus chauds du Languedoc pour mûrir pleinement et peut apporter tanins et complexité savoureuse ?"
      choices:
        - { text: "Mourvèdre", correct: true }
        - { text: "Syrah", correct: false }
        - { text: "Cinsault", correct: false }
        - { text: "Merlot", correct: false }
      explanation: |
        Le Mourvèdre débourre et mûrit tard. Des sites chauds et abrités lui permettent de développer des
        fruits noirs mûrs, des tanins fermes et des notes d’herbes, de viande ou de gibier sans saveurs
        végétales.
  - id: sfrance-large-aoc-best-001
