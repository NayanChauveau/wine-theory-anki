    en:
      question: Which profile best fits high-volume California sparkling wine from warm, high-yielding regions?
      choices:
        - { text: "Fruit-driven, sometimes sweet, and made by tank method or carbonation", correct: true }
        - { text: "Dry, autolytic and made by traditional method from cool coastal fruit", correct: false }
        - { text: "Aromatic, off-dry and made by transfer method from cool-region grapes", correct: false }
        - { text: "Rich, red-fruited and made by traditional method from inland Shiraz", correct: false }
      explanation: |
        California spans both premium coastal and high-volume inland segments.
        Warm-region fruit and efficient sparkling methods can produce accessible
        wines across a range of varieties and sweetness levels.

