        - { text: "Around Haro in the upper Ebro Valley", correct: false }
        - { text: "Around Requena on the Mediterranean plateau", correct: false }
      explanation: |
        Most Cava comes from the Penedès heartland, now within the Valls
        d’Anoia-Foix sub-zone of Comtats de Barcelona. Other authorised zones
        account for a much smaller share.

    fr:
      question: Où se situe le principal centre de production du Cava ?
      choices:
        - { text: "Autour de Sant Sadurní d’Anoia, en Catalogne", correct: true }
        - { text: "Autour de Jerez de la Frontera, en Andalousie", correct: false }
        - { text: "Autour de Haro, dans la haute vallée de l’Èbre", correct: false }
        - { text: "Autour de Requena, sur le plateau méditerranéen", correct: false }
      explanation: |
        La majorité du Cava provient du cœur du Penedès, aujourd’hui inclus
        dans la sous-zone Valls d’Anoia-Foix de Comtats de Barcelona. Les autres
        zones autorisées représentent une part bien plus faible.

