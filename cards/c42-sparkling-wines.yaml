    fr:
      question: Quelle liste donne les quatre zones actuelles de la DO Cava ?
      choices:
        - { text: "Comtats de Barcelona, Ebro Valley, Viñedos de Almendralejo et Levante Zone", correct: true }
        - { text: "Comtats de Barcelona, Duero Valley, Viñedos de Almendralejo et Levante Zone", correct: false }
        - { text: "Comtats de Barcelona, Ebro Valley, Viñedos de La Mancha et Levante Zone", correct: false }
        - { text: "Comtats de Barcelona, Ebro Valley, Viñedos de Almendralejo et Galicia Zone", correct: false }
      explanation: |
        Le nouveau zonage est plus précis que l’ancienne habitude de citer des
        provinces dispersées. Comtats de Barcelona compte cinq sous-zones ;
        Ebro Valley en compte deux, Alto Ebro et Valle del Cierzo.

  - id: cava-guarda-ageing-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, spain, cava, ageing]
    status: reviewed
    source_id: c42-0075
    review:
