        - { text: "Reserva → Guarda → Paraje Calificado → Gran Reserva", correct: false }
        - { text: "Guarda → Gran Reserva → Reserva → Paraje Calificado", correct: false }
        - { text: "Paraje Calificado → Reserva → Gran Reserva → Guarda", correct: false }
      explanation: |
        The minimums are respectively **9, 18, 30 and 36 months**. Reserva and
        above sit within Guarda Superior, which also carries stricter rules on
        origin, yields, vine age, vintage and organic grapes.

    fr:
      question: Quelle séquence classe correctement les catégories de Cava par durée minimale d’élevage croissante ?
      choices:
        - { text: "Guarda → Reserva → Gran Reserva → Paraje Calificado", correct: true }
        - { text: "Reserva → Guarda → Paraje Calificado → Gran Reserva", correct: false }
        - { text: "Guarda → Gran Reserva → Reserva → Paraje Calificado", correct: false }
        - { text: "Paraje Calificado → Reserva → Gran Reserva → Guarda", correct: false }
      explanation: |
        Les minima sont respectivement de **9, 18, 30 et 36 mois**. Reserva et
        les catégories supérieures relèvent de Guarda Superior, qui impose aussi
        des règles plus strictes sur l’origine, les rendements, l’âge des vignes,
        le millésime et les raisins biologiques.

