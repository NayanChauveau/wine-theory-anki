    en:
      question: Which aroma profile most clearly identifies Asti Spumante?
      choices:
        - { text: "Pronounced grape, peach, citrus-flower and herbal aromas", correct: true }
        - { text: "Neutral fruit dominated by long lees ageing and toast", correct: false }
        - { text: "Black fruit, firm tannin and pronounced new-oak spice", correct: false }
        - { text: "Oxidative nuts, bruised apple and deliberate flor character", correct: false }
      explanation: |
        Moscato Bianco supplies intense primary fruit and floral aromas. Asti
        was historically associated with sweet, low-alcohol wine, but current
        Asti Spumante may range from Brut Nature to sweet.

    fr:
      question: Quel profil aromatique permet le mieux d’identifier l’Asti Spumante ?
      choices:
        - { text: "Arômes prononcés de raisin, de pêche, de fleurs d’agrumes et d’herbes aromatiques", correct: true }
        - { text: "Fruit neutre dominé par un long élevage sur lies et des notes grillées", correct: false }
        - { text: "Fruits noirs, tanins fermes et épices prononcées de bois neuf", correct: false }
        - { text: "Fruits à coque oxydatifs, pomme meurtrie et caractère de voile volontaire", correct: false }
      explanation: |
        Le Moscato Bianco apporte des arômes primaires intenses, fruités et
