    fr:
      question: Quel trio constitue la base blanche traditionnelle du Cava ?
      choices:
        - { text: "Macabeo, Xarel·lo et Parellada", correct: true }
        - { text: "Albariño, Verdejo et Godello", correct: false }
        - { text: "Viura, Tempranillo Blanco et Airén", correct: false }
        - { text: "Garnacha Blanca, Malvasía et Palomino", correct: false }
      explanation: |
        Macabeo est aussi appelé Viura. Garnacha, Monastrell, Pinot Noir et
        Trepat figurent parmi les cépages noirs autorisés ; le Trepat est
        réservé au Cava rosé.

  - id: cava-style-001
    type: mcq
