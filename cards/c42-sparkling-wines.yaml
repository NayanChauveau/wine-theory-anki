      fact_check: pass
      sources: [aoc-site]
    en:
      question: What distinguishes the Conegliano Valdobbiadene Prosecco Superiore DOCG zone?
      choices:
        - { text: "Steep hills across 15 communes between Conegliano and Valdobbiadene", correct: true }
        - { text: "Alluvial plains across the nine provinces of the broader Prosecco DOC", correct: false }
        - { text: "Steep hills limited to Valdobbiadene and the single Cartizze vineyard", correct: false }
        - { text: "The hills of Asolo and Montello to the west of the Piave river", correct: false }
      explanation: |
        The DOCG lies about 50 km north of Venice. Steep slopes encourage hand
        work and create substantial mesoclimatic variation within the zone.

    fr:
      question: Qu’est-ce qui distingue la zone de Conegliano Valdobbiadene Prosecco Superiore DOCG ?
      choices:
        - { text: "Des coteaux escarpés répartis dans 15 communes entre Conegliano et Valdobbiadene", correct: true }
        - { text: "Des plaines alluviales couvrant les neuf provinces de la vaste Prosecco DOC", correct: false }
        - { text: "Des coteaux escarpés limités à Valdobbiadene et au seul vignoble de Cartizze", correct: false }
        - { text: "Les collines d’Asolo et de Montello, à l’ouest du Piave, dans la DOCG voisine", correct: false }
      explanation: |
        La DOCG se trouve à environ 50 kilomètres au nord de Venise. Les fortes
        pentes favorisent le travail manuel et créent d’importantes variations
        mésoclimatiques au sein de la zone.

  - id: prosecco-rive-cartizze-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, italy, prosecco, hierarchy]
    status: reviewed
    source_id: c42-0091
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What do Rive and Cartizze indicate on Conegliano Valdobbiadene Prosecco Superiore?
      choices:
        - { text: "More specific hillside origins within the DOCG", correct: true }
        - { text: "Two tank-fermentation methods available throughout Prosecco DOC", correct: false }
        - { text: "The two sweetest dosage categories in every Prosecco denomination", correct: false }
        - { text: "Two alternative names for the Glera grape variety", correct: false }
      explanation: |
        A **Rive** wine comes from one named commune or part of a commune, with
        lower yields, hand harvest and a stated vintage. **Cartizze** is a
        particularly prized 107-hectare sub-zone near Valdobbiadene.

    fr:
      question: Que désignent Rive et Cartizze sur un Conegliano Valdobbiadene Prosecco Superiore ?
      choices:
        - { text: "Des origines de coteaux plus précises au sein de la DOCG", correct: true }
        - { text: "Deux méthodes de fermentation en cuve autorisées dans toute la Prosecco DOC", correct: false }
        - { text: "Les deux catégories de dosage les plus douces de toutes les appellations de Prosecco", correct: false }
        - { text: "Deux noms alternatifs du cépage Glera", correct: false }
      explanation: |
        Un vin **Rive** provient d’une seule commune nommée ou d’une partie de
        commune, avec rendements réduits, vendange manuelle et millésime indiqué.
        **Cartizze** est une sous-zone particulièrement réputée de 107 hectares
        près de Valdobbiadene.

  - id: prosecco-glera-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, italy, prosecco, grapes]
    status: reviewed
    source_id: c42-0092
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which statement correctly links Prosecco and Glera?
      choices:
        - { text: "Glera is the principal grape; Prosecco is the protected geographical name", correct: true }
        - { text: "Prosecco is the principal grape; Glera is the tank-fermentation method", correct: false }
        - { text: "Glera is the DOCG subzone; Prosecco is the principal grape", correct: false }
        - { text: "Glera and Prosecco are separate grapes required in equal proportions", correct: false }
      explanation: |
        The variety was widely called Prosecco in the past. Using **Glera** for
        the grape helps reserve **Prosecco** for wines from the delimited Italian
        denominations; Prosecco DOC must contain at least 85% Glera.

    fr:
      question: Quelle affirmation relie correctement Prosecco et Glera ?
      choices:
        - { text: "Glera est le cépage principal ; Prosecco est le nom géographique protégé", correct: true }
        - { text: "Prosecco est le cépage principal ; Glera désigne la méthode de fermentation en cuve", correct: false }
        - { text: "Glera est la sous-zone de DOCG ; Prosecco est le cépage principal", correct: false }
        - { text: "Glera et Prosecco sont deux cépages distincts imposés à parts égales", correct: false }
      explanation: |
        Le cépage était autrefois couramment appelé Prosecco. Employer le nom
        **Glera** permet de réserver **Prosecco** aux vins issus des appellations
        italiennes délimitées ; la Prosecco DOC doit contenir au moins 85 % de Glera.

  - id: prosecco-tank-method-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, italy, prosecco, production]
    status: reviewed
    source_id: c42-0094
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Why does the Martinotti tank method suit most Prosecco?
      choices:
        - { text: "It retains fresh floral and fruit aromas during efficient secondary fermentation", correct: true }
        - { text: "It maximises lees contact to make biscuit aromas dominate over fresh fruit", correct: false }
        - { text: "It combines fermentation and skin contact to give Glera greater structure", correct: false }
        - { text: "It encourages controlled oxidation to add nutty complexity before bottling", correct: false }
      explanation: |
        Secondary fermentation occurs in a sealed pressure tank before sterile
        filtration and bottling. This protects the youthful style and is well
        suited to relatively large production volumes.

    fr:
      question: Pourquoi la méthode Martinotti en cuve convient-elle à la plupart des Proseccos ?
      choices:
        - { text: "Elle préserve les arômes frais de fleurs et de fruits pendant une seconde fermentation efficace", correct: true }
        - { text: "Elle maximise le contact avec les lies afin que les arômes de biscuit dominent le fruit frais", correct: false }
        - { text: "Elle associe fermentation et macération pelliculaire pour donner davantage de structure au Glera", correct: false }
        - { text: "Elle favorise une oxydation contrôlée afin d’ajouter de la complexité de fruits à coque avant la mise", correct: false }
      explanation: |
        La seconde fermentation se déroule dans une cuve close sous pression,
        avant filtration stérile et mise en bouteille. Cette méthode protège le
        style jeune du vin et convient bien à des volumes relativement importants.

  - id: prosecco-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, italy, prosecco, style]
    status: reviewed
    source_id: c42-0095
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which profile is most typical of white Prosecco DOC Spumante?
      choices:
        - { text: "Fresh apple, pear, citrus and white flowers with moderate acidity", correct: true }
        - { text: "Pronounced toast, nuts and biscuit with very high acidity", correct: false }
        - { text: "Black fruit, firm tannin and full body with new-oak spice", correct: false }
        - { text: "Dried fruit, oxidation and high alcohol with no primary aromas", correct: false }
      explanation: |
        Semi-aromatic Glera gives a light, fresh profile. The tank method limits
        autolytic character, placing fruit, flowers and an easy balance between
        acidity and sweetness at the centre.

    fr:
      question: Quel profil est le plus typique d’un Prosecco DOC Spumante blanc ?
      choices:
        - { text: "Pomme fraîche, poire, agrumes et fleurs blanches, avec une acidité modérée", correct: true }
        - { text: "Notes prononcées de pain grillé, fruits à coque et biscuit, avec une acidité très élevée", correct: false }
        - { text: "Fruits noirs, tanins fermes et corps ample, avec des épices de bois neuf", correct: false }
        - { text: "Fruits secs, oxydation et alcool élevé, sans arômes primaires", correct: false }
      explanation: |
        Le Glera, semi-aromatique, donne un profil léger et frais. La méthode en
        cuve limite le caractère autolytique et met au premier plan le fruit,
        les fleurs et l’équilibre facile entre acidité et douceur.

  - id: prosecco-sweetness-range-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, italy, prosecco, dosage]
    status: reviewed
    source_id: c42-0096
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which statement reflects the current sweetness range of Prosecco DOC Spumante?
      choices:
        - { text: "It can range from Brut Nature through Brut and Extra Dry to Demi-Sec", correct: true }
        - { text: "Only Brut, Extra Dry and Dry are legally permitted", correct: false }
        - { text: "All white Prosecco must be Extra Dry, while rosé must be Brut", correct: false }
        - { text: "Every category must contain more than 32 g/L residual sugar", correct: false }
      explanation: |
        The once-common shorthand of Brut, Extra Dry and Dry is incomplete.
        The familiar EU thresholds apply: Brut is below 12 g/L, Extra Dry is
        12–17 g/L and Dry is 17–32 g/L.

    fr:
      question: Quelle affirmation reflète la gamme actuelle de douceur du Prosecco DOC Spumante ?
      choices:
        - { text: "Elle peut aller de Brut Nature à Demi-Sec, en passant par Brut et Extra Dry", correct: true }
        - { text: "Seuls Brut, Extra Dry et Dry sont légalement autorisés", correct: false }
        - { text: "Tout Prosecco blanc doit être Extra Dry et tout rosé doit être Brut", correct: false }
        - { text: "Chaque catégorie doit contenir plus de 32 g/L de sucre résiduel", correct: false }
      explanation: |
        Le raccourci autrefois courant Brut, Extra Dry et Dry est incomplet.
        Les seuils européens habituels s’appliquent : Brut se situe sous 12 g/L,
        Extra Dry entre 12 et 17 g/L et Dry entre 17 et 32 g/L.

  - id: prosecco-fermentation-balance-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, italy, prosecco, production]
    status: reviewed
    source_id: c42-0098
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: How can a producer retain sweetness while preserving fresh fruit in tank-method Prosecco?
      choices:
        - { text: "Chill the tank at the target balance, then filter out the yeast", correct: true }
        - { text: "Rack the wine under pressure while leaving active yeast in suspension", correct: false }
        - { text: "Raise the tank temperature at the target balance, then bottle immediately", correct: false }
        - { text: "Lower the pressure while allowing fermentation to continue to dryness", correct: false }
      explanation: |
        Cooling and filtration can arrest the pressure-tank fermentation at the
        desired sugar, alcohol and pressure. Dosage may also be part of the
        final adjustment depending on the producer and style.

    fr:
      question: Comment un producteur peut-il conserver de la douceur tout en préservant le fruit frais d’un Prosecco élaboré en cuve close ?
      choices:
        - { text: "Refroidir la cuve à l’équilibre recherché, puis éliminer les levures par filtration", correct: true }
        - { text: "Soutirer le vin sous pression tout en laissant les levures actives en suspension", correct: false }
        - { text: "Augmenter la température de la cuve à l’équilibre recherché, puis mettre immédiatement en bouteille", correct: false }
        - { text: "Réduire la pression tout en laissant la fermentation se poursuivre jusqu’à sec", correct: false }
      explanation: |
        Le refroidissement et la filtration permettent d’arrêter la fermentation
        en cuve sous pression au niveau voulu de sucre, d’alcool et de pression.
        Selon le producteur et le style, le dosage peut également servir à
        l’ajustement final.

  - id: prosecco-youthful-drinking-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, italy, prosecco, ageing]
    status: reviewed
    source_id: c42-0099
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Why is most Prosecco intended for early consumption?
      choices:
        - { text: "Its appeal depends on fresh primary fruit and floral aromas", correct: true }
        - { text: "It needs prolonged ageing to build its defining bread and biscuit aromas", correct: false }
        - { text: "It needs prolonged ageing to soften its defining grape tannins", correct: false }
        - { text: "It needs prolonged ageing to integrate its defining new-oak character", correct: false }
      explanation: |
        Most Prosecco is released after only a brief period in bottle and is not
        designed for extended ageing. Freshness is a feature, not evidence of
        unfinished wine.

    fr:
      question: Pourquoi la plupart des Proseccos sont-ils destinés à être bus jeunes ?
      choices:
        - { text: "Leur attrait repose sur des arômes primaires frais de fruits et de fleurs", correct: true }
        - { text: "Ils nécessitent une longue garde pour développer leurs arômes caractéristiques de pain et de biscuit", correct: false }
        - { text: "Ils nécessitent une longue garde pour assouplir leurs tanins caractéristiques", correct: false }
        - { text: "Ils nécessitent une longue garde pour intégrer leur caractère caractéristique de bois neuf", correct: false }
      explanation: |
        La plupart des Proseccos sont commercialisés après un bref séjour en
        bouteille et ne sont pas conçus pour une longue garde. Leur fraîcheur
        est une qualité recherchée, non le signe d’un vin inachevé.

  - id: sekt-entry-level-production-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, germany, sekt, production]
    status: reviewed
    source_id: c42-0101
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which production pattern is common for inexpensive German Sekt?
      choices:
        - { text: "Imported base wine made sparkling in Germany by the tank method", correct: true }
        - { text: "German estate fruit fermented in bottle and aged for several years", correct: false }
        - { text: "German regional base wine made sparkling by the transfer method", correct: false }
        - { text: "Imported base wine bottle-fermented and given extended lees ageing", correct: false }
      explanation: |
        The unqualified term **Sekt** does not guarantee German-grown grapes.
        Large producers may source base wine elsewhere in the EU, then carry
        out the second fermentation and bottling in Germany.

    fr:
      question: Quel schéma de production est courant pour un Sekt allemand bon marché ?
      choices:
        - { text: "Vin de base importé, rendu effervescent en Allemagne par méthode en cuve close", correct: true }
        - { text: "Raisins allemands du domaine, fermentés en bouteille et élevés plusieurs années", correct: false }
        - { text: "Vin de base d’une région allemande, rendu effervescent par méthode par transfert", correct: false }
        - { text: "Vin de base importé, fermenté en bouteille et longuement élevé sur lies", correct: false }
      explanation: |
        La seule mention **Sekt** ne garantit pas l’origine allemande des
        raisins. Les grandes maisons peuvent acheter du vin de base ailleurs
        dans l’Union européenne, puis réaliser la seconde fermentation et la
        mise en bouteille en Allemagne.

  - id: deutscher-sekt-origin-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, germany, sekt, law]
    status: reviewed
    source_id: c42-0105
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What does Deutscher Sekt guarantee about grape origin?
      choices:
        - { text: "All of the wine comes from grapes grown in Germany", correct: true }
        - { text: "At least 85% of the wine comes from one German region", correct: false }
        - { text: "All of the wine comes from one named German vineyard", correct: false }
        - { text: "The wine may come from anywhere in the European Union", correct: false }
      explanation: |
        **Deutscher Sekt** raises the origin requirement from generic Sekt, but
        it does not by itself identify one of Germany’s 13 quality regions or
        require traditional bottle fermentation.

    fr:
      question: Que garantit la mention Deutscher Sekt quant à l’origine des raisins ?
      choices:
        - { text: "La totalité du vin provient de raisins cultivés en Allemagne", correct: true }
        - { text: "Au moins 85 % du vin provient d’une seule région allemande", correct: false }
        - { text: "La totalité du vin provient d’un seul vignoble allemand nommé", correct: false }
        - { text: "Le vin peut provenir de n’importe quel pays de l’Union européenne", correct: false }
      explanation: |
        **Deutscher Sekt** impose une origine plus précise que Sekt générique,
        mais n’identifie pas à lui seul l’une des 13 régions viticoles de qualité
        d’Allemagne et n’impose pas la méthode traditionnelle.

  - id: sekt-ba-origin-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, germany, sekt, law]
    status: reviewed
    source_id: c42-0107
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What additional origin does Deutscher Sekt b.A. guarantee?
      choices:
        - { text: "The grapes come from one of Germany’s 13 specified quality regions", correct: true }
        - { text: "The grapes come from one vineyard registered as a Grosse Lage", correct: false }
        - { text: "The grapes come from at least two neighbouring German regions", correct: false }
        - { text: "The grapes come from any EU region with a protected designation", correct: false }
      explanation: |
        “b.A.” means *bestimmter Anbaugebiete*. The relevant Anbaugebiet and
        official quality-control number appear on the label; the category does
        not by itself require one variety or the traditional method.

    fr:
      question: Quelle origine supplémentaire la mention Deutscher Sekt b.A. garantit-elle ?
      choices:
        - { text: "Les raisins proviennent de l’une des 13 régions viticoles de qualité d’Allemagne", correct: true }
        - { text: "Les raisins proviennent d’un vignoble classé Grosse Lage", correct: false }
        - { text: "Les raisins proviennent d’au moins deux régions allemandes voisines", correct: false }
        - { text: "Les raisins proviennent de toute région européenne bénéficiant d’une indication protégée", correct: false }
      explanation: |
        « b.A. » signifie *bestimmter Anbaugebiete*. L’Anbaugebiet concerné et
        le numéro officiel de contrôle figurent sur l’étiquette ; cette catégorie
        n’impose à elle seule ni un cépage ni la méthode traditionnelle.

  - id: premium-riesling-sekt-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, germany, sekt, grapes]
    status: reviewed
    source_id: c42-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can Riesling produce distinctive premium German Sekt?
      choices:
        - { text: "High acidity with citrus, apple and floral aromas", correct: true }
        - { text: "High acidity with red fruit, body and vinous structure", correct: false }
        - { text: "Moderate acidity with neutral fruit and a broad palate", correct: false }
        - { text: "Moderate acidity with tropical fruit and high potential alcohol", correct: false }
      explanation: |
        Riesling can produce a recognisably German expression of sparkling wine,
        especially in cooler regions. Pinot varieties are also important in
        high-quality Sekt.

    fr:
      question: Pourquoi le Riesling peut-il donner un Sekt allemand haut de gamme distinctif ?
      choices:
        - { text: "Acidité élevée et arômes d’agrumes, de pomme et de fleurs", correct: true }
        - { text: "Acidité élevée, fruits rouges, corps et structure vineuse", correct: false }
        - { text: "Acidité modérée, fruit neutre et bouche ample", correct: false }
        - { text: "Acidité modérée, fruits tropicaux et degré alcoolique potentiel élevé", correct: false }
      explanation: |
        Le Riesling peut donner une expression typiquement allemande du vin
        effervescent, surtout dans les régions fraîches. Les cépages de la
        famille des Pinots jouent eux aussi un rôle important dans les Sekts de qualité.

  - id: winzersekt-rules-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, germany, sekt, production, law]
    status: reviewed
    source_id: c42-0108
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which production pattern is required for German Winzersekt?
      choices:
        - { text: "Estate-grown fruit, traditional bottle fermentation and at least nine months on lees", correct: true }
        - { text: "Regional fruit, tank fermentation and at least nine months before bottling", correct: false }
        - { text: "EU-grown fruit, transfer-method fermentation and at least twelve months on lees", correct: false }
        - { text: "Single-vineyard fruit, carbonation and at least eighteen months before release", correct: false }
      explanation: |
        Winzersekt is a producer-grown Sekt b.A. The label also states the
        producer, grape variety and vintage. A named single vineyard may appear,
        but it is not a universal legal requirement.

    fr:
      question: Quel schéma de production est obligatoire pour le Winzersekt allemand ?
      choices:
        - { text: "Raisins du domaine, méthode traditionnelle et au moins neuf mois sur lies", correct: true }
        - { text: "Raisins régionaux, méthode en cuve close et au moins neuf mois avant la mise", correct: false }
        - { text: "Raisins européens, méthode par transfert et au moins douze mois sur lies", correct: false }
        - { text: "Raisins d’un seul vignoble, gazéification et au moins dix-huit mois avant la vente", correct: false }
      explanation: |
        Le Winzersekt est un Sekt b.A. issu des raisins du producteur. L’étiquette
        indique aussi le domaine, le cépage et le millésime. Un vignoble nommé
        peut apparaître, mais ce n’est pas une obligation légale universelle.

  - id: australia-premium-sparkling-regions-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, australia, geography, climate]
    status: reviewed
    source_id: c42-0109
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which Australian regions are strongly associated with premium cool-climate sparkling wine?
      choices:
        - { text: "Tasmania, Adelaide Hills and Yarra Valley", correct: true }
        - { text: "Barossa Valley, Riverland and Riverina", correct: false }
        - { text: "Hunter Valley, Rutherglen and McLaren Vale", correct: false }
        - { text: "Swan Valley, Murray Darling and Barossa Valley", correct: false }
      explanation: |
        Cooler sites allow Chardonnay and Pinot Noir to ripen while retaining
        acidity. Traditional-method wines from these regions can support long
        lees ageing and styles from non-vintage to prestige cuvées.

    fr:
      question: Quelles régions australiennes sont fortement associées aux vins effervescents haut de gamme de climat frais ?
      choices:
        - { text: "Tasmanie, Adelaide Hills et Yarra Valley", correct: true }
        - { text: "Barossa Valley, Riverland et Riverina", correct: false }
        - { text: "Hunter Valley, Rutherglen et McLaren Vale", correct: false }
        - { text: "Swan Valley, Murray Darling et Barossa Valley", correct: false }
      explanation: |
        Les terroirs frais permettent au Chardonnay et au Pinot Noir de mûrir
        tout en conservant leur acidité. Les vins de méthode traditionnelle de
        ces régions supportent un long élevage sur lies et vont du non-millésimé
        à la cuvée de prestige.

  - id: australia-warm-region-sparkling-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, australia, production, climate]
    status: reviewed
    source_id: c42-0110
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which profile best fits high-volume sparkling wine from warm Australian regions such as Riverina?
      choices:
        - { text: "Fruity, often inexpensive wine made by tank method or carbonation", correct: true }
        - { text: "Lean, high-acid wine made only by extended traditional method", correct: false }
        - { text: "Bone-dry, single-vineyard wine made only from Pinot Noir", correct: false }
        - { text: "Oxidative, barrel-aged wine made by the ancestral method", correct: false }
      explanation: |
        High yields, reliable ripening and efficient production support large
        volumes and a range of sweetness levels. This is a different segment
        from cool-region traditional-method sparkling wine.

    fr:
      question: Quel profil correspond le mieux aux effervescents de gros volume issus de régions australiennes chaudes comme Riverina ?
      choices:
        - { text: "Fruités, souvent bon marché, et élaborés en cuve close ou par gazéification", correct: true }
        - { text: "Vifs, très acides, et exclusivement élaborés par une longue méthode traditionnelle", correct: false }
        - { text: "Très secs, parcellaires, et exclusivement élaborés en Pinot Noir", correct: false }
        - { text: "Oxydatifs, élevés sous bois, et élaborés par méthode ancestrale", correct: false }
      explanation: |
        Rendements élevés, maturité régulière et production efficace permettent
