    status: reviewed
    source_id: c42-0077
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which profile best describes a typical youthful Cava de Guarda?
      choices:
        - { text: "Dry, fresh orchard fruit with moderate acidity and light autolysis", correct: true }
        - { text: "Dry, citrus-led fruit with high acidity and pronounced bread notes", correct: false }
        - { text: "Sweet, grapey fruit with low alcohol and almost no lees character", correct: false }
        - { text: "Off-dry, pear and floral fruit with moderate acidity and no autolysis", correct: false }
      explanation: |
        The exact fruit and autolytic profile differs from Champagne because of
        grape varieties, climate and ageing. Cava often feels less acid-driven,
        making youthful examples approachable on release.

    fr:
      question: Quel profil décrit le mieux un Cava de Guarda jeune typique ?
      choices:
        - { text: "Sec, fruits frais du verger, acidité modérée et légère autolyse", correct: true }
        - { text: "Sec, agrumes, acidité élevée et notes de pain prononcées", correct: false }
        - { text: "Doux, fruit très marqué par le raisin, faible alcool et presque aucun caractère de lies", correct: false }
        - { text: "Demi-sec, poire et fleurs, acidité modérée et aucune autolyse", correct: false }
      explanation: |
        Son fruit et son profil autolytique diffèrent de ceux du Champagne en
        raison des cépages, du climat et de l’élevage. Le Cava paraît souvent
        moins porté par l’acidité, ce qui rend les exemples jeunes accessibles
        dès leur commercialisation.

  - id: cava-international-grapes-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, spain, cava, grapes]
    status: reviewed
    source_id: c42-0078
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Why is the use of Chardonnay and Pinot Noir in Cava sometimes debated?
      choices:
        - { text: "They can add fruit and acidity but may blur Cava’s local identity", correct: true }
        - { text: "They are compulsory in every blend but cannot ripen in Catalonia", correct: false }
        - { text: "They are permitted only for sweet Cava and always raise residual sugar", correct: false }
        - { text: "They replace bottle fermentation with the tank method", correct: false }
      explanation: |
        Both varieties are authorised. Some producers value their blending
        contribution, while others emphasise native varieties such as Xarel·lo
        to distinguish Cava from other traditional-method wines.

    fr:
      question: Pourquoi l’emploi du Chardonnay et du Pinot Noir dans le Cava fait-il parfois débat ?
      choices:
        - { text: "Ils peuvent apporter fruit et acidité, mais atténuer l’identité locale du Cava", correct: true }
        - { text: "Ils sont obligatoires dans tous les assemblages mais ne peuvent mûrir en Catalogne", correct: false }
        - { text: "Ils ne sont autorisés que pour les Cavas doux et augmentent toujours le sucre résiduel", correct: false }
        - { text: "Ils remplacent la fermentation en bouteille par la méthode en cuve close", correct: false }
      explanation: |
        Les deux cépages sont autorisés. Certains producteurs apprécient leur
        contribution à l’assemblage ; d’autres privilégient des cépages locaux
        comme le Xarel·lo pour distinguer le Cava des autres effervescents de
        méthode traditionnelle.

  - id: cava-release-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, spain, cava, style]
    status: reviewed
    source_id: c42-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is most entry-level Cava intended to be consumed?
      choices:
        - { text: "Non-vintage and ready to drink on release", correct: true }
        - { text: "Vintage-dated and requiring a decade of bottle ageing", correct: false }
        - { text: "Unfiltered and intended to finish fermentation after purchase", correct: false }
        - { text: "Still when released and carbonated immediately before service", correct: false }
      explanation: |
        Cava de Guarda prioritises youthful fruit and freshness. Longer-aged
        Guarda Superior categories offer more developed autolytic complexity
        and tighter viticultural requirements.

    fr:
      question: Comment la plupart des Cavas d’entrée de gamme sont-ils commercialisés ?
      choices:
        - { text: "Non millésimés et prêts à boire dès leur commercialisation", correct: true }
        - { text: "Millésimés et nécessitant dix ans de garde en bouteille", correct: false }
        - { text: "Non filtrés et destinés à achever leur fermentation après l’achat", correct: false }
        - { text: "Tranquilles à la sortie du chai puis gazéifiés juste avant le service", correct: false }
      explanation: |
        Cava de Guarda privilégie la jeunesse du fruit et la fraîcheur. Les
        catégories Guarda Superior, élevées plus longtemps, offrent davantage
        de complexité autolytique et des exigences viticoles plus strictes.

