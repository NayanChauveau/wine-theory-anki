        - { text: "By second fermentation in tank, followed by immediate sterile bottling", correct: false }
        - { text: "By carbonation, followed by nine months in large oak vats", correct: false }
        - { text: "By one interrupted fermentation, completed only after disgorgement", correct: false }
      explanation: |
        Both appellations use bottle fermentation and require a minimum ageing
        period of nine months from tirage before sale. Longer lees ageing can
        create more complex examples.

    fr:
      question: Comment sont élaborés les principaux vins effervescents de Saumur et de Vouvray ?
      choices:
        - { text: "Seconde fermentation en bouteille, suivie d’au moins neuf mois d’élevage", correct: true }
        - { text: "Seconde fermentation en cuve, suivie d’une mise en bouteille stérile immédiate", correct: false }
        - { text: "Gazéification, suivie de neuf mois d’élevage en grands foudres", correct: false }
        - { text: "Une seule fermentation interrompue, achevée seulement après le dégorgement", correct: false }
      explanation: |
        Les deux appellations utilisent la fermentation en bouteille et
        imposent au moins neuf mois d’élevage à compter du tirage avant la vente.
        Un élevage plus long sur lies peut donner des exemples plus complexes.

  - id: cava-geography-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, spain, cava, geography]
    status: reviewed
    source_id: c42-0072
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What is unusual about the geography of the Cava DO?
      choices:
        - { text: "Its delimited areas are non-contiguous and spread across several parts of Spain", correct: true }
        - { text: "Its delimited area is one continuous wine-growing zone within Catalonia", correct: false }
        - { text: "Its core Catalan area has satellite vineyards only in adjacent provinces", correct: false }
        - { text: "Its area covers any Spanish vineyard supplying a traditional-method winery", correct: false }
      explanation: |
        Cava is an origin-based DO, not simply a production method. Its modern
        zoning groups the authorised territory into four zones, some of which
        are far apart.

    fr:
      question: Quelle particularité géographique distingue la DO Cava ?
      choices:
        - { text: "Ses aires délimitées sont discontinues et réparties dans plusieurs parties de l’Espagne", correct: true }
        - { text: "Son aire délimitée forme une zone viticole continue à l’intérieur de la Catalogne", correct: false }
        - { text: "Son noyau catalan possède seulement des vignobles satellites dans les provinces voisines", correct: false }
        - { text: "Son aire englobe tout vignoble espagnol qui approvisionne un producteur de méthode traditionnelle", correct: false }
      explanation: |
        Cava est une DO d’origine, pas simplement une méthode de production.
        Son zonage actuel regroupe le territoire autorisé en quatre zones, dont
        certaines sont très éloignées les unes des autres.

  - id: cava-production-centre-001
