    en:
      question: Why is most Asti Spumante best consumed young?
      choices:
        - { text: "Ageing diminishes the fresh primary aromas that define Moscato", correct: true }
        - { text: "Ageing is needed to build the biscuit aromas that define Moscato", correct: false }
        - { text: "Ageing is needed to soften the firm grape tannins of Moscato", correct: false }
        - { text: "Ageing is needed to integrate the new oak used for Moscato", correct: false }
      explanation: |
        The classic style is built around vivid grape, peach and floral aromas,
        not long autolytic development. It generally gains little from extended
        bottle ageing after release.

    fr:
      question: Pourquoi l’Asti Spumante gagne-t-il généralement à être bu jeune ?
      choices:
        - { text: "Le vieillissement atténue les arômes primaires frais qui définissent le Moscato", correct: true }
        - { text: "Le vieillissement est nécessaire pour créer les arômes de biscuit qui définissent le Moscato", correct: false }
        - { text: "Le vieillissement est nécessaire pour assouplir les tanins fermes du Moscato", correct: false }
        - { text: "Le vieillissement est nécessaire pour intégrer le bois neuf utilisé avec le Moscato", correct: false }
      explanation: |
        Le style classique repose sur des arômes éclatants de raisin, de pêche
        et de fleurs, non sur une longue évolution autolytique. Après sa mise en
        marché, il gagne généralement peu à vieillir longuement en bouteille.

