        - { text: "Macabeo, Xarel·lo and Parellada", correct: true }
        - { text: "Albariño, Verdejo and Godello", correct: false }
        - { text: "Viura, Tempranillo Blanco and Airén", correct: false }
        - { text: "Garnacha Blanca, Malvasía and Palomino", correct: false }
      explanation: |
        Macabeo is also known as Viura. Garnacha, Monastrell, Pinot Noir and
        Trepat are among the authorised black grapes; Trepat is restricted to
