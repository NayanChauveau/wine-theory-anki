        - { text: "Sheltered inland valley floors with the highest daytime temperatures", correct: false }
        - { text: "Warm north-facing slopes protected from cooling ocean influence", correct: false }
        - { text: "Low-elevation sites chosen mainly for rapid sugar accumulation", correct: false }
