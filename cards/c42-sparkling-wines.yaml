        Le brouillard et les vents de la baie de San Pablo tempèrent Los
        Carneros, tandis qu’Anderson Valley bénéficie de la proximité de la
        côte de Mendocino. Les deux régions préservent l’acidité du Chardonnay
        et du Pinot Noir.

