    en:
      question: Which statement accurately describes current Asti Spumante production?
      choices:
        - { text: "Tank fermentation is classic, but traditional-method versions are permitted", correct: true }
        - { text: "Bottle fermentation is compulsory, while tank production is prohibited", correct: false }
        - { text: "Tank fermentation is compulsory, while bottle production is prohibited", correct: false }
        - { text: "The ancestral method is compulsory, while carbonation is also permitted", correct: false }
      explanation: |
        The classic Martinotti approach preserves Moscato’s primary aromas by
        fermenting chilled must under pressure and stopping fermentation at the
        desired balance. The DOCG also permits metodo classico.

    fr:
      question: Quelle affirmation décrit correctement l’élaboration actuelle de l’Asti Spumante ?
      choices:
        - { text: "La fermentation en cuve est classique, mais la méthode traditionnelle est aussi autorisée", correct: true }
        - { text: "La fermentation en bouteille est obligatoire et la méthode en cuve interdite", correct: false }
        - { text: "La fermentation en cuve est obligatoire et la méthode en bouteille interdite", correct: false }
        - { text: "La méthode ancestrale est obligatoire et la gazéification également autorisée", correct: false }
      explanation: |
        La méthode Martinotti classique préserve les arômes primaires du
        Moscato : le moût refroidi fermente sous pression, puis la fermentation
        est arrêtée à l’équilibre recherché. La DOCG autorise aussi le metodo classico.

  - id: asti-style-001
