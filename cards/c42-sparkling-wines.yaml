cards:
  - id: champagne-aoc-scope-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, law]
    status: reviewed
    source_id: c42-0001
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which statement best describes the appellation used for sparkling Champagne?
      choices:
        - { text: "One Champagne AOC covers the delimited sparkling-wine production zone", correct: true }
        - { text: "Each major growing region has its own separate Champagne AOC", correct: false }
        - { text: "Each grand cru village forms an independent sparkling-wine AOC", correct: false }
        - { text: "Champagne is a regional IGP divided into village-level AOCs", correct: false }
      explanation: |
        The sparkling wine uses the single **Champagne AOC** across its
        delimited production area. The wider wine region also contains AOCs
        for still wines, notably Coteaux Champenois and Rosé des Riceys.

    fr:
      question: Quelle affirmation décrit correctement l’appellation utilisée pour le Champagne effervescent ?
      choices:
        - { text: "Une seule AOC Champagne couvre toute l’aire délimitée des vins effervescents", correct: true }
        - { text: "Chaque grande région viticole possède sa propre AOC Champagne", correct: false }
        - { text: "Chaque village grand cru constitue une AOC distincte pour les vins effervescents", correct: false }
        - { text: "Champagne est une IGP régionale dont les effervescents relèvent d’AOC communales", correct: false }
      explanation: |
        Le vin effervescent relève d’une seule **AOC Champagne** dans toute
        l’aire de production délimitée. La région viticole compte aussi des AOC
        de vins tranquilles, notamment Coteaux Champenois et Rosé des Riceys.

  - id: champagne-cru-counts-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, hierarchy]
    status: reviewed
    source_id: c42-0003
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: How many Champagne villages retain the historic Grand Cru and Premier Cru designations?
      choices:
        - { text: "17 Grand Cru and 44 Premier Cru", correct: true }
        - { text: "44 Grand Cru and 17 Premier Cru", correct: false }
        - { text: "17 Grand Cru and 319 Premier Cru", correct: false }
        - { text: "34 Grand Cru and 44 Premier Cru", correct: false }
      explanation: |
        The old **échelle des crus** was abolished in 2010, but villages that
        had earned Grand Cru or Premier Cru status may retain those terms.

    fr:
      question: Combien de villages champenois conservent les mentions historiques Grand Cru et Premier Cru ?
      choices:
        - { text: "17 Grand Cru et 44 Premier Cru", correct: true }
        - { text: "44 Grand Cru et 17 Premier Cru", correct: false }
        - { text: "17 Grand Cru et 319 Premier Cru", correct: false }
        - { text: "34 Grand Cru et 44 Premier Cru", correct: false }
      explanation: |
        L’ancienne **échelle des crus** a été supprimée en 2010, mais les
        villages qui avaient obtenu le statut de Grand Cru ou de Premier Cru
        peuvent conserver ces mentions.

  - id: champagne-cru-commune-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, hierarchy]
    status: reviewed
    source_id: c42-0005
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What geographic unit does a cru traditionally identify in Champagne?
      choices:
        - { text: "An entire wine-growing commune", correct: true }
        - { text: "One precisely delimited vineyard", correct: false }
        - { text: "One producer’s complete holding", correct: false }
        - { text: "One authorised pressing centre", correct: false }
      explanation: |
        A village designation cannot make every plot identical. Aspect, soil
        and grower decisions still vary within the commune, and Grand Cru or
        Premier Cru does not impose a separate winemaking method.

    fr:
      question: Quelle unité géographique un cru désigne-t-il traditionnellement en Champagne ?
      choices:
        - { text: "Une commune viticole entière", correct: true }
        - { text: "Une parcelle précisément délimitée", correct: false }
        - { text: "L’ensemble des vignes d’un producteur", correct: false }
        - { text: "Un centre de pressurage agréé", correct: false }
      explanation: |
        Une mention communale ne rend pas toutes les parcelles identiques :
        exposition, sol et choix du vigneron varient au sein d’un même village.
        Grand Cru ou Premier Cru n’impose pas non plus une vinification distincte.

  - id: champagne-four-regions-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, geography]
    status: reviewed
    source_id: c42-0008
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which list gives Champagne’s four main wine-growing regions?
      choices:
        - { text: "Montagne de Reims, Marne Valley, Côte des Blancs and Côte des Bar", correct: true }
        - { text: "Montagne de Reims, Marne Valley, Côte des Blancs and Côte de Sézanne", correct: false }
        - { text: "Montagne de Reims, Massif de Saint-Thierry, Côte de Sézanne and Côte des Bar", correct: false }
        - { text: "Marne Valley, Côte des Blancs, Vitryat and Côte des Bar", correct: false }
      explanation: |
        These four broad regions sit within a more detailed patchwork of
        sub-regions. **Côte de Sézanne** lies south of Côte des Blancs but is
        not one of the four headline regions in the current official grouping.

    fr:
      question: Quelle liste réunit les quatre grandes régions viticoles de Champagne ?
      choices:
        - { text: "Montagne de Reims, Vallée de la Marne, Côte des Blancs et Côte des Bar", correct: true }
        - { text: "Montagne de Reims, Vallée de la Marne, Côte des Blancs et Côte de Sézanne", correct: false }
        - { text: "Montagne de Reims, Massif de Saint-Thierry, Côte de Sézanne et Côte des Bar", correct: false }
        - { text: "Vallée de la Marne, Côte des Blancs, Vitryat et Côte des Bar", correct: false }
      explanation: |
        Ces quatre grands ensembles recouvrent une mosaïque de sous-régions.
        La **Côte de Sézanne**, au sud de la Côte des Blancs, ne figure pas
        parmi les quatre régions principales de la présentation officielle actuelle.

  - id: champagne-sezanne-bar-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, geography]
    status: reviewed
    source_id: c42-0010
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which statement correctly locates Côte de Sézanne and Côte des Bar?
      choices:
        - { text: "Sézanne lies south of Épernay; Côte des Bar is far to the south-east", correct: true }
        - { text: "Sézanne lies east of Reims; Côte des Bar is directly south of the Marne Valley", correct: false }
        - { text: "Sézanne lies north-west of Épernay; Côte des Bar is close to the Belgian border", correct: false }
        - { text: "Sézanne lies south-east of Côte des Bar; both are within the Marne Valley", correct: false }
      explanation: |
        Côte de Sézanne begins roughly 30 km south-west of Épernay. Côte des
        Bar is an outlying southern vineyard in the Aube, more than 100 km
        from Épernay.

    fr:
      question: Quelle affirmation situe correctement la Côte de Sézanne et la Côte des Bar ?
      choices:
        - { text: "Sézanne se trouve au sud d’Épernay ; la Côte des Bar est loin au sud-est", correct: true }
        - { text: "Sézanne se trouve à l’est de Reims ; la Côte des Bar est juste au sud de la Vallée de la Marne", correct: false }
        - { text: "Sézanne se trouve au nord-ouest d’Épernay ; la Côte des Bar est proche de la frontière belge", correct: false }
        - { text: "Sézanne se trouve au sud-est de la Côte des Bar ; toutes deux appartiennent à la Vallée de la Marne", correct: false }
      explanation: |
        La Côte de Sézanne commence à une trentaine de kilomètres au sud-ouest
        d’Épernay. La Côte des Bar forme un vignoble méridional excentré, dans
        l’Aube, à plus de 100 kilomètres d’Épernay.

  - id: champagne-boundary-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, law, geography]
    status: reviewed
    source_id: c42-0012
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What determines whether a vineyard may produce Champagne AOC?
      choices:
        - { text: "Its plot must fall within the legally delimited production area", correct: true }
        - { text: "Its owner must hold land in one of the 17 Grand Cru villages", correct: false }
        - { text: "Its commune must lie wholly inside the modern administrative region", correct: false }
        - { text: "Its grapes must be pressed within the same individual vineyard", correct: false }
      explanation: |
        The production zone was delimited in law in **1927**. It covers about
        34,000 hectares across 319 wine-growing communes in five départements;
        it is not the same as the administrative region called Grand Est.

    fr:
      question: Qu’est-ce qui détermine si une vigne peut produire un vin de l’AOC Champagne ?
      choices:
        - { text: "La parcelle doit se trouver dans l’aire de production légalement délimitée", correct: true }
        - { text: "Son propriétaire doit posséder des vignes dans l’un des 17 villages Grand Cru", correct: false }
        - { text: "La commune doit être entièrement située dans la région administrative actuelle", correct: false }
        - { text: "Les raisins doivent être pressés dans la parcelle où ils ont été vendangés", correct: false }
      explanation: |
        L’aire de production a été délimitée par la loi en **1927**. Elle couvre
        environ 34 000 hectares répartis entre 319 communes viticoles et cinq
        départements ; elle ne se confond pas avec la région administrative Grand Est.

  - id: champagne-climate-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, climate]
    status: reviewed
    source_id: c42-0014
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which climatic description best fits the Champagne vineyards?
      choices:
        - { text: "A cool climate with both oceanic and continental influences", correct: true }
        - { text: "A warm continental climate with little seasonal rainfall", correct: false }
        - { text: "A Mediterranean climate moderated mainly by altitude", correct: false }
        - { text: "A cool maritime climate with almost no frost risk", correct: false }
      explanation: |
        Oceanic influence moderates temperature and distributes rainfall;
        continental influence brings winter freezes, spring frost and summer
        heat or storms. The vineyards sit near the northern limit for ripening.

    fr:
      question: Quelle description climatique correspond le mieux au vignoble champenois ?
      choices:
        - { text: "Un climat frais soumis à des influences océaniques et continentales", correct: true }
        - { text: "Un climat continental chaud avec peu de précipitations saisonnières", correct: false }
        - { text: "Un climat méditerranéen principalement modéré par l’altitude", correct: false }
        - { text: "Un climat maritime frais presque dépourvu de risque de gel", correct: false }
      explanation: |
        L’influence océanique modère les températures et répartit les pluies ;
        l’influence continentale apporte gel hivernal, gelées de printemps,
        chaleur estivale et orages. Le vignoble se situe près de la limite
        septentrionale de maturation du raisin.

  - id: champagne-weather-risks-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, climate]
    status: reviewed
    source_id: c42-0015
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which group contains important weather hazards for Champagne growers?
      choices:
        - { text: "Winter freeze, spring frost and wet or stormy growing-season weather", correct: true }
        - { text: "Low winter rainfall, wildfire smoke and salt-laden coastal winds", correct: false }
        - { text: "Insufficient winter chill, severe sunburn and hot desiccating winds", correct: false }
        - { text: "Monsoon flooding, tropical cyclones and uninterrupted summer humidity", correct: false }
      explanation: |
        Rain and cloud can disrupt flowering, ripening and harvest while
        increasing disease pressure. Climate change also makes extremes such
        as heatwaves, storms and severe frost more erratic.

    fr:
      question: Quel groupe réunit des aléas météorologiques importants pour les viticulteurs champenois ?
      choices:
        - { text: "Gel hivernal, gelées de printemps et temps humide ou orageux pendant la végétation", correct: true }
        - { text: "Faibles pluies hivernales, fumée d’incendie et vents côtiers chargés de sel", correct: false }
        - { text: "Manque de froid hivernal, brûlure solaire sévère et vents chauds desséchants", correct: false }
        - { text: "Inondations de mousson, cyclones tropicaux et humidité estivale continue", correct: false }
      explanation: |
        Pluie et nébulosité peuvent perturber floraison, maturation et vendange,
        tout en renforçant la pression des maladies. Le changement climatique
        rend aussi plus irréguliers les épisodes de canicule, d’orage ou de gel sévère.

  - id: champagne-sparkling-balance-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, climate]
    status: reviewed
    source_id: c42-0016
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Why can Champagne’s climate suit grapes for sparkling wine?
      choices:
        - { text: "Ripe grapes can retain high acidity with moderate potential alcohol", correct: true }
        - { text: "Ripe grapes combine low acidity with high potential alcohol", correct: false }
        - { text: "Underripe grapes provide low acidity with moderate potential alcohol", correct: false }
        - { text: "Overripe grapes retain high acidity with very high potential alcohol", correct: false }
      explanation: |
        The target is balance, not simply the lowest possible sugar. Natural
        acidity supplies freshness while sufficient ripeness avoids green,
        thin base wines.

    fr:
      question: Pourquoi le climat champenois peut-il convenir aux raisins destinés aux vins effervescents ?
      choices:
        - { text: "Des raisins mûrs peuvent conserver une forte acidité et un degré alcoolique potentiel modéré", correct: true }
        - { text: "Des raisins mûrs associent une faible acidité à un degré alcoolique potentiel élevé", correct: false }
        - { text: "Des raisins insuffisamment mûrs présentent une faible acidité et un degré potentiel modéré", correct: false }
        - { text: "Des raisins surmûris conservent une forte acidité et un degré potentiel très élevé", correct: false }
      explanation: |
        L’objectif est l’équilibre, pas simplement la plus faible teneur
        possible en sucre. L’acidité naturelle apporte la fraîcheur, tandis
        qu’une maturité suffisante évite des vins de base verts et maigres.

  - id: champagne-slope-frost-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, viticulture]
    status: reviewed
    source_id: c42-0017
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: How do Champagne’s slopes help vines in a cool climate?
      choices:
        - { text: "They improve sunlight, water drainage and cold-air drainage", correct: true }
        - { text: "They improve sunlight but retain water and cold air around the vines", correct: false }
        - { text: "They reduce sunlight while improving water and cold-air drainage", correct: false }
        - { text: "They improve water drainage but reduce sunlight and trap cold air", correct: false }
      explanation: |
        Cold air can flow downslope rather than pooling around the vines, which
        reduces but does not eliminate frost risk. Aspect also helps capture
        sunlight at this northerly latitude.

    fr:
      question: Comment les coteaux champenois aident-ils la vigne dans ce climat frais ?
      choices:
        - { text: "Ils améliorent l’ensoleillement ainsi que l’écoulement de l’eau et de l’air froid", correct: true }
        - { text: "Ils améliorent l’ensoleillement mais retiennent l’eau et l’air froid autour des vignes", correct: false }
        - { text: "Ils réduisent l’ensoleillement tout en améliorant l’écoulement de l’eau et de l’air froid", correct: false }
        - { text: "Ils améliorent le drainage de l’eau mais réduisent l’ensoleillement et retiennent l’air froid", correct: false }
      explanation: |
        L’air froid peut descendre le long de la pente au lieu de s’accumuler
        autour des ceps : le risque de gel diminue sans disparaître. L’exposition
        aide aussi à capter davantage de lumière à cette latitude septentrionale.

  - id: champagne-chalk-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, soil]
    status: reviewed
    source_id: c42-0018
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which water-management property makes chalk valuable in Champagne?
      choices:
        - { text: "It drains freely yet stores water in its porous structure", correct: true }
        - { text: "It drains very rapidly and stores almost no plant-available water", correct: false }
        - { text: "It retains abundant water but provides very slow internal drainage", correct: false }
        - { text: "It forms an impermeable layer that restricts both drainage and rooting", correct: false }
      explanation: |
        Champagne’s outcrops are predominantly limestone, including chalk,
        marl and harder limestone. Porous chalk acts as both a reservoir and a
        temperature regulator while allowing excess water to drain.

    fr:
      question: Quelle propriété hydrique rend la craie précieuse en Champagne ?
      choices:
        - { text: "Elle draine librement tout en stockant de l’eau dans sa structure poreuse", correct: true }
        - { text: "Elle draine très rapidement et ne stocke presque aucune eau disponible pour la vigne", correct: false }
        - { text: "Elle retient beaucoup d’eau mais assure un drainage interne très lent", correct: false }
        - { text: "Elle forme une couche imperméable qui limite à la fois le drainage et l’enracinement", correct: false }
      explanation: |
        Les affleurements champenois sont surtout calcaires : craie, marnes et
        calcaires plus durs. La craie poreuse sert de réserve d’eau et de
        régulateur thermique, tout en évacuant les excès d’eau.

  - id: champagne-sustainability-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, sustainability]
    status: reviewed
    source_id: c42-0020
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which direction characterises Champagne’s current sustainability programme?
      choices:
        - { text: "Lower inputs, wider environmental certification and recycling of winery by-products", correct: true }
        - { text: "Cellar-only certification, unchanged vineyard inputs and disposal of grape marc", correct: false }
        - { text: "More routine mineral fertiliser, deeper cultivation and fewer cover crops", correct: false }
        - { text: "More irrigation, broader herbicide use and selection for maximum vineyard yields", correct: false }
      explanation: |
        The sector reports lower use of plant-protection products and nitrogen
        fertiliser, broader environmental certification and comprehensive
        treatment or reuse of winery waste and by-products.

    fr:
      question: Quelle orientation caractérise le programme actuel de développement durable en Champagne ?
      choices:
        - { text: "Réduction des intrants, essor des certifications environnementales et valorisation des sous-produits", correct: true }
        - { text: "Certification limitée aux chais, intrants viticoles inchangés et élimination du marc", correct: false }
        - { text: "Recours accru aux engrais minéraux, travail du sol plus profond et recul des couverts végétaux", correct: false }
        - { text: "Développement de l’irrigation, usage accru des herbicides et recherche des rendements maximaux", correct: false }
      explanation: |
        La filière fait état d’une baisse des produits phytosanitaires et des
        engrais azotés, d’un élargissement des certifications environnementales
        et d’une prise en charge ou valorisation généralisée des déchets et
        sous-produits de cave.

  - id: champagne-main-grapes-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, grapes]
    status: reviewed
    source_id: c42-0021
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which trio accounts for almost all vineyard plantings in Champagne?
      choices:
        - { text: "Chardonnay, Pinot Noir and Meunier", correct: true }
        - { text: "Chardonnay, Pinot Noir and Pinot Blanc", correct: false }
        - { text: "Chardonnay, Meunier and Pinot Gris", correct: false }
        - { text: "Pinot Noir, Meunier and Arbane", correct: false }
      explanation: |
        Five other varieties are authorised but tiny in area: Arbane, Petit
        Meslier, Pinot Blanc, Pinot Gris and **Chardonnay Rose**, restored to
        the specification in 2025.

    fr:
      question: Quel trio représente la quasi-totalité des plantations en Champagne ?
      choices:
        - { text: "Chardonnay, Pinot Noir et Meunier", correct: true }
        - { text: "Chardonnay, Pinot Noir et Pinot Blanc", correct: false }
        - { text: "Chardonnay, Meunier et Pinot Gris", correct: false }
        - { text: "Pinot Noir, Meunier et Arbane", correct: false }
      explanation: |
        Cinq autres cépages sont autorisés mais occupent une superficie infime :
        Arbane, Petit Meslier, Pinot Blanc, Pinot Gris et **Chardonnay Rose**,
        réintégré au cahier des charges en 2025.

  - id: champagne-chardonnay-sites-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, grapes]
    status: reviewed
    source_id: c42-0022
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which Champagne area is most strongly associated with Chardonnay?
      choices:
        - { text: "Côte des Blancs", correct: true }
        - { text: "Marne Valley", correct: false }
        - { text: "Côte des Bar", correct: false }
        - { text: "Montagne de Reims", correct: false }
      explanation: |
        Chardonnay thrives on the chalk outcrops of Côte des Blancs and is
        also important in Côte de Sézanne. It represents roughly a third of
        Champagne’s planted area.

    fr:
      question: Quelle région champenoise est la plus fortement associée au Chardonnay ?
      choices:
        - { text: "Côte des Blancs", correct: true }
        - { text: "Vallée de la Marne", correct: false }
        - { text: "Côte des Bar", correct: false }
        - { text: "Montagne de Reims", correct: false }
      explanation: |
        Le Chardonnay s’épanouit sur les affleurements crayeux de la Côte des
        Blancs et joue aussi un rôle important dans la Côte de Sézanne. Il
        représente environ un tiers de la superficie plantée en Champagne.

  - id: champagne-chardonnay-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, grapes]
    status: reviewed
    source_id: c42-0023
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What does Chardonnay typically contribute to a Champagne blend?
      choices:
        - { text: "Freshness, floral and citrus aromas, and ageing potential", correct: true }
        - { text: "Deep colour, firm tannin and black-fruit concentration", correct: false }
        - { text: "Low acidity, high alcohol and dried-fruit sweetness", correct: false }
        - { text: "Early softness, yellow fruit and rapid development", correct: false }
      explanation: |
        Chardonnay often gives the blend lift and finesse. Site and ageing can
        add breadth, so it should not be reduced to a single light-bodied style.

    fr:
      question: Qu’apporte généralement le Chardonnay à un assemblage de Champagne ?
      choices:
        - { text: "Fraîcheur, arômes floraux et d’agrumes, et potentiel de garde", correct: true }
        - { text: "Couleur profonde, tanins fermes et concentration de fruits noirs", correct: false }
        - { text: "Faible acidité, alcool élevé et douceur de fruits secs", correct: false }
        - { text: "Souplesse précoce, fruits jaunes et évolution rapide", correct: false }
      explanation: |
        Le Chardonnay apporte souvent de l’élan et de la finesse à l’assemblage.
        Le terroir et l’élevage peuvent lui donner davantage d’ampleur : il ne
        faut donc pas le réduire à un unique style léger.

  - id: champagne-pinot-sites-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, grapes]
    status: reviewed
    source_id: c42-0024
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: In which two major Champagne regions is Pinot Noir especially important?
      choices:
        - { text: "Montagne de Reims and Côte des Bar", correct: true }
        - { text: "Côte des Blancs and Marne Valley", correct: false }
        - { text: "Côte de Sézanne and Côte des Blancs", correct: false }
        - { text: "Marne Valley and Côte de Sézanne", correct: false }
      explanation: |
        Pinot Noir is Champagne’s most planted variety, at just under 40% of
        vineyard area. The Aube’s Côte des Bar is a particularly important
        southern source.

    fr:
      question: Dans quelles deux grandes régions champenoises le Pinot Noir est-il particulièrement important ?
      choices:
        - { text: "Montagne de Reims et Côte des Bar", correct: true }
        - { text: "Côte des Blancs et Vallée de la Marne", correct: false }
        - { text: "Côte de Sézanne et Côte des Blancs", correct: false }
        - { text: "Vallée de la Marne et Côte de Sézanne", correct: false }
      explanation: |
        Le Pinot Noir est le cépage le plus planté en Champagne, avec un peu
        moins de 40 % du vignoble. La Côte des Bar, dans l’Aube, constitue une
        source méridionale particulièrement importante.

  - id: champagne-pinot-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, grapes]
    status: reviewed
    source_id: c42-0025
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What does Pinot Noir typically add to a Champagne blend?
      choices:
        - { text: "Body, structure and red-fruit or floral character", correct: true }
        - { text: "Low alcohol, neutral flavour and reduced ageing potential", correct: false }
        - { text: "Herbal bitterness, deep colour and firm grape tannin", correct: false }
        - { text: "Citrus delicacy, low acidity and a very light palate", correct: false }
      explanation: |
        Careful pressing allows this black grape to make white wine. Its role
        is structural and aromatic rather than to colour the blend.

    fr:
      question: Qu’apporte généralement le Pinot Noir à un assemblage de Champagne ?
      choices:
        - { text: "Corps, structure et caractère de fruits rouges ou floral", correct: true }
        - { text: "Faible degré alcoolique, arômes neutres et potentiel de garde réduit", correct: false }
        - { text: "Amertume végétale, couleur profonde et tanins fermes du raisin", correct: false }
        - { text: "Délicatesse d’agrumes, faible acidité et bouche très légère", correct: false }
      explanation: |
        Un pressurage soigneux permet d’obtenir un vin blanc à partir de ce
        raisin noir. Son rôle est structurel et aromatique ; il n’est pas
        destiné à colorer l’assemblage.

  - id: champagne-meunier-sites-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, grapes]
    status: reviewed
    source_id: c42-0026
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Why is Meunier well suited to the Marne Valley?
      choices:
        - { text: "Its later budbreak reduces exposure to spring frost", correct: true }
        - { text: "Its early budbreak ensures flowering before winter ends", correct: false }
        - { text: "Its thick skins require the valley’s strongest sunlight", correct: false }
        - { text: "Its late ripening needs the valley’s warmest autumn sites", correct: false }
      explanation: |
        Meunier is hardy and well matched to the valley’s more clay-rich soils
        and frost-prone conditions. It accounts for roughly a third of the
        vineyard.

    fr:
      question: Pourquoi le Meunier convient-il bien à la Vallée de la Marne ?
      choices:
        - { text: "Son débourrement plus tardif réduit son exposition aux gelées de printemps", correct: true }
        - { text: "Son débourrement précoce assure la floraison avant la fin de l’hiver", correct: false }
        - { text: "Sa peau épaisse exige l’ensoleillement le plus intense de la vallée", correct: false }
        - { text: "Sa maturation tardive nécessite les sites automnaux les plus chauds de la vallée", correct: false }
      explanation: |
        Le Meunier est rustique et bien adapté aux sols plus argileux et aux
        conditions gélives de la vallée. Il représente environ un tiers du vignoble.

  - id: champagne-meunier-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, grapes]
    status: reviewed
    source_id: c42-0027
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What does Meunier typically contribute to Champagne?
      choices:
        - { text: "Roundness, supple fruit and early accessibility", correct: true }
        - { text: "Firm tannin, deep colour and slow primary fermentation", correct: false }
        - { text: "Citrus austerity, very light body and delayed development", correct: false }
        - { text: "Oxidative nuttiness, high alcohol and low natural acidity", correct: false }
      explanation: |
        Meunier commonly shows yellow-fruit aromas and tends to develop sooner
        than Chardonnay or Pinot Noir, making it useful in youthful blends.

    fr:
      question: Qu’apporte généralement le Meunier au Champagne ?
      choices:
        - { text: "Rondeur, fruit souple et accessibilité précoce", correct: true }
        - { text: "Tanins fermes, couleur profonde et fermentation alcoolique lente", correct: false }
        - { text: "Austérité citronnée, corps très léger et évolution tardive", correct: false }
        - { text: "Notes oxydatives de fruits à coque, alcool élevé et faible acidité naturelle", correct: false }
      explanation: |
        Le Meunier présente souvent des arômes de fruits jaunes et évolue plus
        rapidement que le Chardonnay ou le Pinot Noir, ce qui le rend utile
        dans les assemblages destinés à être bus jeunes.

  - id: champagne-hand-harvest-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, harvest]
    status: reviewed
    source_id: c42-0029
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Why is Champagne harvested by hand into small containers?
      choices:
        - { text: "To deliver intact, selected bunches for prompt whole-cluster pressing", correct: true }
        - { text: "To increase skin extraction before the black grapes reach the press", correct: false }
        - { text: "To encourage oxidation and soften acidity during transport to the press", correct: false }
        - { text: "To permit heavier press loads and a higher yield of juice per kilogram", correct: false }
      explanation: |
        The appellation requires manual harvest. Limiting berry damage is
        essential when black grapes are being pressed for white juice.

    fr:
      question: Pourquoi les raisins de Champagne sont-ils vendangés à la main et transportés en petits contenants ?
      choices:
        - { text: "Pour livrer rapidement au pressoir des grappes entières, intactes et sélectionnées", correct: true }
        - { text: "Pour accroître l’extraction pelliculaire avant l’arrivée des raisins noirs au pressoir", correct: false }
        - { text: "Pour favoriser l’oxydation et assouplir l’acidité pendant le transport", correct: false }
        - { text: "Pour permettre des charges de pressoir plus importantes et un rendement en jus supérieur", correct: false }
      explanation: |
        L’appellation impose la vendange manuelle. Il est essentiel de limiter
        l’éclatement des baies lorsque des raisins noirs sont pressés pour
        produire un jus blanc.

  - id: champagne-press-fractions-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, pressing]
    status: reviewed
    source_id: c42-0031
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: How are the two principal Champagne press fractions named?
      choices:
        - { text: "First juice: cuvée; following juice: taille", correct: true }
        - { text: "First juice: taille; following juice: cuvée", correct: false }
        - { text: "First juice: réserve; following juice: rebêche", correct: false }
        - { text: "First juice: moût; following juice: vin clair", correct: false }
      explanation: |
        From a traditional 4,000 kg press load, the first 20.5 hL is the
        **cuvée** and the next 5 hL the **taille**. The fractions are kept
        separate because their composition differs.

    fr:
      question: Comment nomme-t-on les deux principales fractions de pressurage en Champagne ?
      choices:
        - { text: "Premier jus : cuvée ; jus suivant : taille", correct: true }
        - { text: "Premier jus : taille ; jus suivant : cuvée", correct: false }
        - { text: "Premier jus : réserve ; jus suivant : rebêche", correct: false }
        - { text: "Premier jus : moût ; jus suivant : vin clair", correct: false }
      explanation: |
        Pour une charge traditionnelle de 4 000 kg, les 20,5 premiers
        hectolitres constituent la **cuvée**, puis les 5 hectolitres suivants
        la **taille**. Les fractions restent séparées car leur composition diffère.

  - id: champagne-cuvee-quality-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, pressing]
    status: reviewed
    source_id: c42-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is the cuvée press fraction generally preferred for the finest Champagne?
      choices:
        - { text: "It combines higher acidity with lower phenolic extraction", correct: true }
        - { text: "It contains the highest skin tannin and deepest colour", correct: false }
        - { text: "It is the sweetest fraction and needs no second fermentation", correct: false }
        - { text: "It comes from the hardest pressing at the end of the cycle", correct: false }
      explanation: |
        The later taille contains more potassium and phenolics and generally
        has lower acidity. Producers may still use it according to house style,
        but prestige cuvées often favour the first fraction.

    fr:
      question: Pourquoi la fraction de pressurage appelée cuvée est-elle généralement privilégiée pour les meilleurs Champagnes ?
      choices:
        - { text: "Elle associe une acidité plus élevée à une extraction phénolique plus faible", correct: true }
        - { text: "Elle contient le plus de tanins pelliculaires et la couleur la plus profonde", correct: false }
        - { text: "Elle constitue la fraction la plus sucrée et ne nécessite aucune seconde fermentation", correct: false }
        - { text: "Elle provient du pressurage le plus poussé à la fin du cycle", correct: false }
      explanation: |
        La taille contient davantage de potassium et de composés phénoliques,
        et présente généralement une acidité plus faible. Les producteurs
        peuvent l’utiliser selon leur style, mais les cuvées de prestige
        privilégient souvent la première fraction.

  - id: champagne-primary-ferment-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, winemaking]
    status: reviewed
    source_id: c42-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which statement best describes vessels for primary fermentation in Champagne?
      choices:
        - { text: "Stainless steel is common, but oak vessels may also be chosen", correct: true }
        - { text: "Neutral oak is required for vintage wines, while steel is required for non-vintage", correct: false }
        - { text: "Sealed pressure tanks are required so the first fermentation retains carbon dioxide", correct: false }
        - { text: "Open wooden vats are required whenever black grapes form part of the blend", correct: false }
      explanation: |
        Stainless steel protects freshness and precision; oak can add texture
        and flavour. The choice is part of a producer’s style rather than one
        compulsory recipe.

    fr:
      question: Quelle affirmation décrit correctement les contenants de fermentation alcoolique des vins de base champenois ?
      choices:
        - { text: "L’acier inoxydable est courant, mais des contenants en bois peuvent aussi être choisis", correct: true }
        - { text: "Le bois neutre est imposé aux millésimés et l’acier inoxydable aux non-millésimés", correct: false }
        - { text: "Des cuves sous pression sont imposées afin de retenir le gaz de la première fermentation", correct: false }
        - { text: "Des cuves ouvertes en bois sont imposées dès que l’assemblage contient des raisins noirs", correct: false }
      explanation: |
        L’acier inoxydable protège la fraîcheur et la précision ; le bois peut
        apporter texture et arômes. Ce choix relève du style du producteur et
        non d’une recette obligatoire.

  - id: champagne-mlf-oak-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, winemaking]
    status: reviewed
    source_id: c42-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are malolactic conversion and oak maturation used in Champagne base wines?
      choices:
        - { text: "Either may be used or avoided according to house style", correct: true }
        - { text: "Both are compulsory for every non-vintage blend", correct: false }
        - { text: "Both are forbidden before the secondary fermentation", correct: false }
        - { text: "Oak is compulsory only when malolactic conversion is blocked", correct: false }
      explanation: |
        Blocking malolactic conversion preserves sharper acidity; allowing it
        softens the wine. Oak can add breadth or oxidative nuance, while steel
        can preserve a cleaner fruit profile.

    fr:
      question: Comment utilise-t-on la fermentation malolactique et l’élevage sous bois pour les vins de base champenois ?
      choices:
        - { text: "Chacun peut être employé ou évité selon le style de la maison", correct: true }
        - { text: "Tous deux sont obligatoires pour chaque assemblage non millésimé", correct: false }
        - { text: "Tous deux sont interdits avant la seconde fermentation", correct: false }
        - { text: "Le bois n’est obligatoire que si la fermentation malolactique est bloquée", correct: false }
      explanation: |
        Bloquer la fermentation malolactique préserve une acidité plus vive ;
        la réaliser assouplit le vin. Le bois peut apporter ampleur ou nuances
        oxydatives, tandis que l’acier conserve un fruit plus pur.

  - id: champagne-blending-purpose-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, blending]
    status: reviewed
    source_id: c42-0036
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Why is blending central to most Champagne production?
      choices:
        - { text: "It balances variable harvests while building a recognisable house style", correct: true }
        - { text: "It removes the need to press black and white grapes separately", correct: false }
        - { text: "It guarantees that every bottle comes from one village and one year", correct: false }
        - { text: "It replaces lees ageing as the source of autolytic flavour", correct: false }
      explanation: |
        Producers can combine varieties, sites, press fractions, winemaking
        choices and reserve wines. Vintage Champagne also uses blending, but
        all of its harvest wine comes from the stated year.

    fr:
      question: Pourquoi l’assemblage est-il au cœur de la plupart des Champagnes ?
      choices:
        - { text: "Il compense les variations des récoltes et construit un style de maison constant", correct: true }
        - { text: "Il évite de devoir presser séparément raisins noirs et raisins blancs", correct: false }
        - { text: "Il garantit que chaque bouteille provient d’un seul village et d’une seule année", correct: false }
        - { text: "Il remplace l’élevage sur lies comme source d’arômes autolytiques", correct: false }
      explanation: |
        Le producteur peut associer cépages, terroirs, fractions de pressurage,
        choix de vinification et vins de réserve. Un Champagne millésimé est lui
        aussi assemblé, mais tous ses vins de récolte proviennent de l’année indiquée.

  - id: champagne-blending-palette-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, blending]
    status: reviewed
    source_id: c42-0037
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: How does a large Champagne house create a broad blending palette?
      choices:
        - { text: "It vinifies parcels separately and retains reserve wines from earlier years", correct: true }
        - { text: "It combines all grapes before pressing and avoids reserve wines", correct: false }
        - { text: "It bottles each parcel before deciding whether to blend it", correct: false }
        - { text: "It relies on one base wine and varies only the final cork", correct: false }
      explanation: |
        A final non-vintage blend may contain dozens or even many more
        components. Separate vinification preserves the options needed for
        balance, complexity and consistency.

    fr:
      question: Comment une grande maison de Champagne se constitue-t-elle une vaste palette d’assemblage ?
      choices:
        - { text: "Elle vinifie séparément les parcelles et conserve des vins de réserve des années précédentes", correct: true }
        - { text: "Elle réunit tous les raisins avant pressurage et renonce aux vins de réserve", correct: false }
        - { text: "Elle met chaque parcelle en bouteille avant de décider d’un éventuel assemblage", correct: false }
        - { text: "Elle s’appuie sur un seul vin de base et ne fait varier que le bouchon final", correct: false }
      explanation: |
        Un assemblage non millésimé peut compter des dizaines, voire bien
        davantage, de composants. La vinification séparée préserve les options
        nécessaires à l’équilibre, à la complexité et à la régularité.

  - id: champagne-nv-ageing-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, ageing, law]
    status: reviewed
    source_id: c42-0040
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What is the minimum cellar-ageing period for non-vintage Champagne after bottling?
      choices:
        - { text: "15 months", correct: true }
        - { text: "Nine months", correct: false }
        - { text: "24 months", correct: false }
        - { text: "Three years", correct: false }
      explanation: |
        At least **12 months** of that period is spent on lees before
        disgorgement. In practice, many houses age non-vintage Champagne for
        roughly two to three years.

    fr:
      question: Quelle est la durée minimale d’élevage en cave d’un Champagne non millésimé après la mise en bouteille ?
      choices:
        - { text: "15 mois", correct: true }
        - { text: "Neuf mois", correct: false }
        - { text: "24 mois", correct: false }
        - { text: "Trois ans", correct: false }
      explanation: |
        Au moins **12 mois** de cette période se déroulent sur lies avant le
        dégorgement. En pratique, de nombreuses maisons élèvent leurs
        Champagnes non millésimés pendant environ deux à trois ans.

  - id: champagne-vintage-ageing-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, ageing, law]
    status: reviewed
    source_id: c42-0041
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What is the minimum cellar-ageing period for vintage Champagne after bottling?
      choices:
        - { text: "Three years", correct: true }
        - { text: "15 months", correct: false }
        - { text: "Two years", correct: false }
        - { text: "Five years", correct: false }
      explanation: |
        Producers commonly exceed the legal minimum; four to ten years before
        release is not unusual for vintage cuvées. Longer lees ageing builds
        autolytic and mature complexity.

    fr:
      question: Quelle est la durée minimale d’élevage en cave d’un Champagne millésimé après la mise en bouteille ?
      choices:
        - { text: "Trois ans", correct: true }
        - { text: "15 mois", correct: false }
        - { text: "Deux ans", correct: false }
        - { text: "Cinq ans", correct: false }
      explanation: |
        Les producteurs dépassent couramment le minimum légal : quatre à dix
        ans avant commercialisation ne sont pas rares pour une cuvée millésimée.
        Un élevage prolongé sur lies développe la complexité autolytique et les
        arômes d’évolution.

  - id: champagne-core-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, style]
    status: reviewed
    source_id: c42-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which combination is most characteristic across Champagne styles?
      choices:
        - { text: "High acidity with some lees-derived character", correct: true }
        - { text: "Moderate acidity with dominant primary fruit and no lees influence", correct: false }
        - { text: "High acidity with pronounced grape tannin and deep colour", correct: false }
        - { text: "Moderate acidity with high alcohol and dominant new-oak flavour", correct: false }
      explanation: |
        The intensity of toast, bread or biscuit varies with time on lees and
        producer style. Fruit, body, sweetness and maturity can differ widely,
        but freshness and bottle-fermentation influence remain central.

    fr:
      question: Quelle association de caractères se retrouve le plus souvent dans les différents styles de Champagne ?
      choices:
        - { text: "Acidité élevée et présence d’arômes issus de l’élevage sur lies", correct: true }
        - { text: "Acidité modérée, fruit primaire dominant et aucune influence des lies", correct: false }
        - { text: "Acidité élevée, tanins marqués du raisin et couleur profonde", correct: false }
        - { text: "Acidité modérée, alcool élevé et arômes dominants de bois neuf", correct: false }
      explanation: |
        L’intensité des notes de pain grillé, de pain ou de biscuit dépend de
        la durée sur lies et du style du producteur. Fruit, corps, douceur et
        maturité varient beaucoup, mais fraîcheur et fermentation en bouteille
        restent centrales.

  - id: champagne-nv-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, style]
    status: reviewed
    source_id: c42-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does a house’s non-vintage Champagne usually compare with its vintage Champagne?
      choices:
        - { text: "It is generally fresher and lighter, built for a consistent house style", correct: true }
        - { text: "It is generally richer and longer-aged, designed to highlight one harvest", correct: false }
        - { text: "It is generally sweeter and more oxidative, built without reserve wines", correct: false }
        - { text: "It is generally fuller and more variable, designed to highlight one village", correct: false }
      explanation: |
        Reserve wines add complexity and smooth vintage differences, so fine
        non-vintage Champagne need not be simple. It is commonly the producer’s
        signature and largest-volume cuvée.

    fr:
      question: Comment le Champagne non millésimé d’une maison se compare-t-il généralement à son Champagne millésimé ?
      choices:
        - { text: "Il est généralement plus frais et léger, et vise la régularité du style de la maison", correct: true }
        - { text: "Il est généralement plus riche et élevé plus longtemps, afin d’exprimer une seule récolte", correct: false }
        - { text: "Il est généralement plus doux et oxydatif, sans aucun vin de réserve", correct: false }
        - { text: "Il est généralement plus ample et variable, afin d’exprimer un seul village", correct: false }
      explanation: |
        Les vins de réserve apportent complexité et régularité entre les
        millésimes : un bon non-millésimé n’est donc pas nécessairement simple.
        Il constitue souvent la cuvée signature et le plus gros volume de la maison.

  - id: champagne-vintage-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, style]
    status: reviewed
    source_id: c42-0046
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What is the main stylistic aim of vintage Champagne?
      choices:
        - { text: "Express one selected harvest with greater concentration and ageing potential", correct: true }
        - { text: "Maintain the same profile every year through a broad reserve-wine blend", correct: false }
        - { text: "Express the most recent harvest through shorter lees ageing and early release", correct: false }
        - { text: "Create a sweeter style by reserving the highest dosage for declared years", correct: false }
      explanation: |
        Producers decide which harvests merit a vintage bottling. Longer ageing
        often brings more pronounced toast and biscuit alongside the fruit and
        structure of that year.

    fr:
      question: Quel est l’objectif stylistique principal d’un Champagne millésimé ?
      choices:
        - { text: "Exprimer une récolte sélectionnée avec davantage de concentration et de potentiel de garde", correct: true }
        - { text: "Maintenir le même profil chaque année grâce à un large assemblage de vins de réserve", correct: false }
        - { text: "Exprimer la récolte la plus récente par un élevage sur lies plus court et une sortie précoce", correct: false }
        - { text: "Créer un style plus doux en réservant le dosage le plus élevé aux années déclarées", correct: false }
      explanation: |
        Le producteur décide quelles récoltes méritent une cuvée millésimée.
        Un élevage plus long apporte souvent des notes de pain grillé et de
        biscuit plus marquées, aux côtés du fruit et de la structure de l’année.

  - id: champagne-rose-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, rose, style]
    status: reviewed
    source_id: c42-0048
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which description best fits high-quality rosé Champagne?
      choices:
        - { text: "Red-berry fruit balanced by acidity and lees-derived complexity", correct: true }
        - { text: "Red-berry fruit with low acidity and pronounced grape tannin", correct: false }
        - { text: "Citrus fruit with high acidity but no lees-derived character", correct: false }
        - { text: "Black-fruit concentration with dominant new-oak aromas and low acidity", correct: false }
      explanation: |
        Rosé Champagne can be vintage or non-vintage. Colour comes from
        maceration or from blending still red Champagne into white base wines
        before the second fermentation.

    fr:
      question: Quelle description correspond le mieux à un Champagne rosé de grande qualité ?
      choices:
        - { text: "Fruits rouges équilibrés par l’acidité et la complexité issue des lies", correct: true }
        - { text: "Fruits rouges, faible acidité et tanins marqués du raisin", correct: false }
        - { text: "Agrumes, acidité élevée mais aucun caractère issu des lies", correct: false }
        - { text: "Fruits noirs concentrés, arômes dominants de bois neuf et faible acidité", correct: false }
      explanation: |
        Le Champagne rosé peut être millésimé ou non. La couleur provient soit
        d’une macération, soit de l’ajout de vin rouge tranquille champenois à
        des vins de base blancs avant la seconde fermentation.

  - id: champagne-blanc-de-blancs-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, style]
    status: reviewed
    source_id: c42-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which profile is most typical of youthful Blanc de Blancs Champagne?
      choices:
        - { text: "High acidity with citrus, floral and delicate mineral notes", correct: true }
        - { text: "High acidity with red berries and a broad Pinot-led structure", correct: false }
        - { text: "Moderate acidity with yellow fruit and a soft Meunier-led palate", correct: false }
        - { text: "Moderate acidity with black fruit and firm grape tannin", correct: false }
      explanation: |
        Blanc de Blancs is made from white varieties, overwhelmingly
        Chardonnay in practice. It may begin light to medium bodied but top
        examples can gain breadth and complexity with age.

    fr:
      question: Quel profil est le plus typique d’un Champagne Blanc de Blancs jeune ?
      choices:
        - { text: "Acidité élevée, agrumes, fleurs et délicates notes minérales", correct: true }
        - { text: "Acidité élevée, fruits rouges et large structure dominée par le Pinot", correct: false }
        - { text: "Acidité modérée, fruits jaunes et bouche souple dominée par le Meunier", correct: false }
        - { text: "Acidité modérée, fruits noirs et tanins fermes du raisin", correct: false }
      explanation: |
        Le Blanc de Blancs est issu de cépages blancs, presque toujours du
        Chardonnay en pratique. Léger à moyennement corsé dans sa jeunesse, un
        grand exemple peut gagner en ampleur et en complexité avec l’âge.

  - id: champagne-blanc-de-noirs-style-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, style]
    status: reviewed
    source_id: c42-0051
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which profile is most typical of Blanc de Noirs Champagne?
      choices:
        - { text: "Relatively full body, vinous structure and ripe fruit", correct: true }
        - { text: "Light body, citrus and floral aromas, and a mineral edge", correct: false }
        - { text: "Supple body, yellow fruit and particularly early accessibility", correct: false }
        - { text: "Moderate body, oxidative nuttiness and dominant oak spice", correct: false }
      explanation: |
        Blanc de Noirs is made solely from black grapes, Pinot Noir and/or
        Meunier, but is pressed as a white wine. It is commonly broader and
        more powerful than Blanc de Blancs and can show red, yellow or dark fruit.

    fr:
      question: Quel profil est le plus typique d’un Champagne Blanc de Noirs ?
      choices:
        - { text: "Corps relativement ample, structure vineuse et fruit mûr", correct: true }
        - { text: "Corps léger, arômes d’agrumes et de fleurs, et touche minérale", correct: false }
        - { text: "Corps souple, fruits jaunes et accessibilité particulièrement précoce", correct: false }
        - { text: "Corps moyen, notes oxydatives de fruits à coque et épices boisées dominantes", correct: false }
      explanation: |
        Le Blanc de Noirs est exclusivement issu de raisins noirs, Pinot Noir
        et/ou Meunier, mais pressés pour obtenir un vin blanc. Il est souvent
        plus ample et puissant qu’un Blanc de Blancs, avec des fruits rouges,
        jaunes ou noirs.

  - id: champagne-prestige-cuvee-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, style, quality]
    status: reviewed
    source_id: c42-0052
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a Champagne producer usually signal by calling a wine its prestige cuvée?
      choices:
        - { text: "Its flagship wine, made from highly selected material", correct: true }
        - { text: "Its driest wine, made without any dosage after disgorgement", correct: false }
        - { text: "Its single-village wine, irrespective of selection or ageing", correct: false }
        - { text: "Its earliest-release wine, aged only to the legal minimum", correct: false }
      explanation: |
        “Prestige cuvée” is a market term rather than a separate legal
        Champagne category. Such wines are usually expensive, highly selected
        and long-aged; they may be vintage or non-vintage.

    fr:
      question: Que signale généralement un producteur de Champagne en qualifiant un vin de cuvée de prestige ?
      choices:
        - { text: "Son vin emblématique, élaboré à partir d’une sélection rigoureuse", correct: true }
        - { text: "Son vin le plus sec, sans aucun dosage après dégorgement", correct: false }
        - { text: "Son vin d’un seul village, indépendamment de la sélection ou de l’élevage", correct: false }
        - { text: "Son vin commercialisé le plus tôt, élevé au seul minimum légal", correct: false }
      explanation: |
        « Cuvée de prestige » est une expression commerciale et non une
        catégorie juridique distincte en Champagne. Ces vins sont généralement
        chers, très sélectionnés et longuement élevés ; ils peuvent être
        millésimés ou non.

  - id: champagne-prestige-cellaring-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, style, ageing]
    status: reviewed
    source_id: c42-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why can a newly released prestige cuvée benefit from further bottle ageing?
      choices:
        - { text: "Its concentration, acidity and structure may need time to integrate", correct: true }
        - { text: "Its second fermentation normally begins only after retail release", correct: false }
        - { text: "Its mousse develops only when the bottle is stored without a cork", correct: false }
        - { text: "Its dosage remains unfermented until the bottle reaches the consumer", correct: false }
      explanation: |
        A prestige cuvée can appear restrained or austere when young despite
        substantial pre-release ageing. Further cellaring can bring greater
        aromatic breadth and integration; it is not required for every bottle.

    fr:
      question: Pourquoi une cuvée de prestige récemment commercialisée peut-elle bénéficier d’un vieillissement supplémentaire en bouteille ?
      choices:
        - { text: "Sa concentration, son acidité et sa structure peuvent demander du temps pour s’harmoniser", correct: true }
        - { text: "Sa seconde fermentation ne commence normalement qu’après sa commercialisation", correct: false }
        - { text: "Sa mousse ne se développe que si la bouteille est conservée sans bouchon", correct: false }
        - { text: "Son dosage reste non fermenté jusqu’à l’arrivée de la bouteille chez le consommateur", correct: false }
      explanation: |
        Malgré un long élevage avant la mise en marché, une cuvée de prestige
        peut paraître fermée ou austère dans sa jeunesse. La garde peut lui
        apporter davantage d’ampleur aromatique et d’harmonie, sans être
        indispensable pour chaque bouteille.

  - id: champagne-brut-dominance-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, dosage]
    status: reviewed
    source_id: c42-0054
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which dosage category accounts for more than 90% of Champagne?
      choices:
        - { text: "Brut", correct: true }
        - { text: "Brut Nature", correct: false }
        - { text: "Demi-Sec", correct: false }
        - { text: "Doux", correct: false }
      explanation: |
        **Brut** contains less than 12 g/L residual sugar and is the dominant
        commercial style. Lower-dosage categories have become more visible but
        still represent a much smaller share.

    fr:
      question: Quelle catégorie de dosage représente plus de 90 % des Champagnes ?
      choices:
        - { text: "Brut", correct: true }
        - { text: "Brut Nature", correct: false }
        - { text: "Demi-Sec", correct: false }
        - { text: "Doux", correct: false }
      explanation: |
        Le **Brut** contient moins de 12 g/L de sucre résiduel et domine le
        marché. Les catégories moins dosées sont devenues plus visibles, mais
        représentent encore une part bien moindre.

  - id: champagne-brut-nature-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, champagne, dosage]
    status: reviewed
    source_id: c42-0055
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What distinguishes Champagne labelled Brut Nature, Pas Dosé or Dosage Zéro?
      choices:
        - { text: "Less than 3 g/L sugar and no sugar added at dosage", correct: true }
        - { text: "Up to 6 g/L sugar with a compulsory sweet dosage", correct: false }
        - { text: "Less than 12 g/L sugar with no reserve wine in the blend", correct: false }
        - { text: "Between 12 and 17 g/L sugar and no malolactic conversion", correct: false }
      explanation: |
        Brut Nature is the driest labelled category and remains a niche beside
        Brut. “No dosage” refers to the absence of added sugar at disgorgement,
        not to a wine that necessarily contains absolutely zero residual sugar.

    fr:
      question: Qu’est-ce qui distingue un Champagne portant la mention Brut Nature, Pas Dosé ou Dosage Zéro ?
      choices:
        - { text: "Moins de 3 g/L de sucre et aucune adjonction de sucre au dosage", correct: true }
        - { text: "Jusqu’à 6 g/L de sucre avec un dosage sucré obligatoire", correct: false }
        - { text: "Moins de 12 g/L de sucre et aucun vin de réserve dans l’assemblage", correct: false }
        - { text: "Entre 12 et 17 g/L de sucre et aucune fermentation malolactique", correct: false }
      explanation: |
        Brut Nature est la catégorie indiquée la plus sèche et reste marginale
        face au Brut. L’absence de dosage désigne l’absence de sucre ajouté au
        dégorgement, non un vin nécessairement dépourvu de tout sucre résiduel.

  - id: cremant-term-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, cremant, law]
    status: reviewed
    source_id: c42-0057
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What does the term Crémant identify on a French wine label?
      choices:
        - { text: "Traditional-method sparkling wine from one of several named AOCs", correct: true }
        - { text: "Any French sparkling wine made outside Champagne", correct: false }
        - { text: "A low-pressure category available within every French wine AOC", correct: false }
        - { text: "A protected grape variety used only for bottle-fermented wine", correct: false }
      explanation: |
        Crémant is not one national appellation and not a generic synonym for
        French sparkling wine. Each Crémant AOC has its own delimited area,
        authorised grapes and detailed production rules.

    fr:
      question: Que désigne le terme Crémant sur une étiquette de vin français ?
      choices:
        - { text: "Un effervescent de méthode traditionnelle relevant d’une AOC Crémant", correct: true }
        - { text: "Tout vin effervescent français élaboré hors de l’AOC Champagne", correct: false }
        - { text: "Une catégorie à faible pression autorisée dans chaque AOC viticole française", correct: false }
        - { text: "Un cépage protégé réservé aux vins ayant fermenté en bouteille", correct: false }
      explanation: |
        Crémant n’est ni une appellation nationale unique ni un synonyme
        générique de vin effervescent français. Chaque AOC Crémant possède sa
        propre aire délimitée, ses cépages autorisés et ses règles de production.

  - id: cremant-major-aocs-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, cremant, geography]
    status: reviewed
    source_id: c42-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which list consists entirely of major French Crémant appellations?
      choices:
        - { text: "Crémant d’Alsace, Crémant de Bourgogne and Crémant de Loire", correct: true }
        - { text: "Blanquette de Limoux, Crémant de Bourgogne and Crémant de Loire", correct: false }
        - { text: "Crémant du Jura, Clairette de Die and Crémant de Loire", correct: false }
        - { text: "Crémant de Bordeaux, Saumur and Crémant d’Alsace", correct: false }
      explanation: |
        Other protected Crémant appellations exist, including Bordeaux, Jura,
        Limoux, Die and Savoie. Vouvray and Saumur make sparkling wines under
        their own appellation names rather than as “Crémant de Vouvray/Saumur”.

    fr:
      question: Quelle liste se compose uniquement de grandes appellations françaises de Crémant ?
      choices:
        - { text: "Crémant d’Alsace, Crémant de Bourgogne et Crémant de Loire", correct: true }
        - { text: "Blanquette de Limoux, Crémant de Bourgogne et Crémant de Loire", correct: false }
        - { text: "Crémant du Jura, Clairette de Die et Crémant de Loire", correct: false }
        - { text: "Crémant de Bordeaux, Saumur et Crémant d’Alsace", correct: false }
      explanation: |
        D’autres AOC Crémant existent, notamment à Bordeaux, dans le Jura, à
        Limoux, à Die et en Savoie. Vouvray et Saumur produisent des effervescents
        sous leur propre nom d’appellation, et non sous « Crémant de Vouvray/Saumur ».

  - id: cremant-method-ageing-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, cremant, production]
    status: reviewed
    source_id: c42-0059
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which production rule is shared by the leading French Crémant AOCs?
      choices:
        - { text: "Second fermentation in bottle with at least nine months on lees", correct: true }
        - { text: "Second fermentation in tank with at least six months on lees", correct: false }
        - { text: "Single fermentation in bottle with at least three months on lees", correct: false }
        - { text: "Carbonation followed by at least twelve months in neutral oak", correct: false }
      explanation: |
        Crémant uses the traditional method. The minimum time before release is
        longer than the nine-month lees period because tirage, disgorgement and
        post-disgorgement requirements also have to be met.

    fr:
      question: Quelle règle de production est commune aux principales AOC françaises de Crémant ?
      choices:
        - { text: "Seconde fermentation en bouteille et au moins neuf mois sur lies", correct: true }
        - { text: "Seconde fermentation en cuve et au moins six mois sur lies", correct: false }
        - { text: "Une seule fermentation en bouteille et au moins trois mois sur lies", correct: false }
        - { text: "Gazéification suivie d’au moins douze mois en bois neutre", correct: false }
      explanation: |
        Le Crémant est élaboré par méthode traditionnelle. Le délai minimal
        avant commercialisation dépasse les neuf mois sur lies, car il faut
        aussi respecter les exigences liées au tirage, au dégorgement et à la
        période qui suit celui-ci.

  - id: cremant-alsace-grapes-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, alsace, grapes]
    status: reviewed
    source_id: c42-0061
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which grape set is authorised for white Crémant d’Alsace?
      choices:
        - { text: "Pinot Blanc, Riesling, Pinot Gris, Chardonnay and Pinot Noir", correct: true }
        - { text: "Gewurztraminer, Muscat, Riesling, Chardonnay and Pinot Noir", correct: false }
        - { text: "Pinot Blanc, Gewurztraminer, Muscat, Sylvaner and Chardonnay", correct: false }
        - { text: "Riesling, Muscat, Pinot Gris, Gewurztraminer and Pinot Noir", correct: false }
      explanation: |
        Highly aromatic Muscat and Gewurztraminer are not authorised here.
        Chardonnay is permitted for Crémant d’Alsace even though it is not an
        authorised variety for ordinary still AOC Alsace wine.

    fr:
      question: Quel ensemble de cépages est autorisé pour le Crémant d’Alsace blanc ?
      choices:
        - { text: "Pinot Blanc, Riesling, Pinot Gris, Chardonnay et Pinot Noir", correct: true }
        - { text: "Gewurztraminer, Muscat, Riesling, Chardonnay et Pinot Noir", correct: false }
        - { text: "Pinot Blanc, Gewurztraminer, Muscat, Sylvaner et Chardonnay", correct: false }
        - { text: "Riesling, Muscat, Pinot Gris, Gewurztraminer et Pinot Noir", correct: false }
      explanation: |
        Le Muscat et le Gewurztraminer, très aromatiques, ne sont pas autorisés
        ici. Le Chardonnay est permis en Crémant d’Alsace, bien qu’il ne soit
        pas autorisé pour les vins tranquilles ordinaires de l’AOC Alsace.

  - id: loire-sparkling-aocs-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, loire, law]
    status: reviewed
    source_id: c42-0063
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which three Loire appellations are especially important for sparkling wine?
      choices:
        - { text: "Crémant de Loire, Saumur and Vouvray", correct: true }
        - { text: "Muscadet, Sancerre and Chinon", correct: false }
        - { text: "Saumur, Pouilly-Fumé and Quarts de Chaume", correct: false }
        - { text: "Vouvray, Savennières and Coteaux du Layon", correct: false }
      explanation: |
        The Loire is a major French centre for bottle-fermented sparkling wine.
        These three names overlap geographically in places but represent
        distinct appellations with different grape rules.

    fr:
      question: Quelles trois appellations de Loire sont particulièrement importantes pour les vins effervescents ?
      choices:
        - { text: "Crémant de Loire, Saumur et Vouvray", correct: true }
        - { text: "Muscadet, Sancerre et Chinon", correct: false }
        - { text: "Saumur, Pouilly-Fumé et Quarts de Chaume", correct: false }
        - { text: "Vouvray, Savennières et Coteaux du Layon", correct: false }
      explanation: |
        La Loire est un grand centre français d’effervescents fermentés en
        bouteille. Ces trois noms se chevauchent parfois géographiquement, mais
        correspondent à des appellations distinctes aux règles d’encépagement différentes.

  - id: saumur-sparkling-grapes-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, loire, grapes]
    status: reviewed
    source_id: c42-0064
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which statement best describes the grape rules for sparkling Saumur?
      choices:
        - { text: "White cuvées are Chenin-led; rosé cuvées are Cabernet Franc-led", correct: true }
        - { text: "White cuvées are Sauvignon-led; rosé cuvées are Pinot Noir-led", correct: false }
        - { text: "White cuvées are Chardonnay-only; rosé cuvées are Gamay-only", correct: false }
        - { text: "Both colours must be made solely from Chenin Blanc", correct: false }
      explanation: |
        At least 60% Chenin Blanc is required in the white sparkling cuvée and
        at least 60% Cabernet Franc in the rosé. Other authorised local and
        international varieties can form the balance.

    fr:
      question: Quelle affirmation décrit correctement les règles d’encépagement du Saumur effervescent ?
      choices:
        - { text: "Les cuvées blanches sont dominées par le Chenin ; les rosées par le Cabernet Franc", correct: true }
        - { text: "Les cuvées blanches sont dominées par le Sauvignon ; les rosées par le Pinot Noir", correct: false }
        - { text: "Les cuvées blanches sont exclusivement en Chardonnay ; les rosées exclusivement en Gamay", correct: false }
        - { text: "Les deux couleurs doivent être exclusivement élaborées en Chenin Blanc", correct: false }
      explanation: |
        La cuvée effervescente blanche doit contenir au moins 60 % de Chenin
        Blanc, et la rosée au moins 60 % de Cabernet Franc. D’autres cépages
        locaux et internationaux autorisés peuvent compléter l’assemblage.

  - id: saumur-sparkling-colours-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, loire, law]
    status: reviewed
    source_id: c42-0066
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: In which colours may sparkling Saumur AOC be produced?
      choices:
        - { text: "White and rosé", correct: true }
        - { text: "White and red", correct: false }
        - { text: "Rosé and red", correct: false }
        - { text: "White, rosé and red", correct: false }
      explanation: |
        The appellation permits sparkling **white and rosé**, not sparkling red.
        Cabernet Franc is central to the rosé cuvée; Saumur’s red AOC wines are
        still wines.

    fr:
      question: Dans quelles couleurs le Saumur AOC effervescent peut-il être produit ?
      choices:
        - { text: "Blanc et rosé", correct: true }
        - { text: "Blanc et rouge", correct: false }
        - { text: "Rosé et rouge", correct: false }
        - { text: "Blanc, rosé et rouge", correct: false }
      explanation: |
        L’appellation autorise les effervescents **blancs et rosés**, mais pas
        rouges. Le Cabernet Franc joue un rôle central dans la cuvée rosée ;
        les vins rouges de Saumur sont des vins tranquilles.

  - id: vouvray-sparkling-grape-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, loire, grapes]
    status: reviewed
    source_id: c42-0068
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which grape defines both still and sparkling Vouvray?
      choices:
        - { text: "Chenin Blanc", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Melon Blanc", correct: false }
      explanation: |
        Vouvray is a Chenin Blanc appellation. A small proportion of Orbois may
        be authorised in the vineyard, but Chenin supplies the defining high
        acidity and orchard-fruit character.

    fr:
      question: Quel cépage définit à la fois les vins tranquilles et les effervescents de Vouvray ?
      choices:
        - { text: "Chenin Blanc", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Melon Blanc", correct: false }
      explanation: |
        Vouvray est une appellation de Chenin Blanc. Une faible proportion
        d’Orbois peut être autorisée dans le vignoble, mais le Chenin apporte
        l’acidité élevée et les arômes de fruits du verger qui définissent le style.

  - id: loire-chenin-autolysis-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, loire, style]
    status: reviewed
    source_id: c42-0069
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can traditional-method Loire Chenin differ from a Chardonnay-led sparkling wine?
      choices:
        - { text: "High acidity, orchard fruit and smoky or toasty lees notes", correct: true }
        - { text: "High acidity, citrus fruit and strongly bready lees notes", correct: false }
        - { text: "Moderate acidity, floral fruit and very little lees character", correct: false }
        - { text: "Low acidity, tropical fruit and pronounced biscuit character", correct: false }
      explanation: |
        Chenin retains naturally high acidity and can keep a distinctive fruit
        and mineral profile through bottle fermentation. Lees ageing still adds
        complexity, but the expression need not copy Champagne.

    fr:
      question: En quoi un Chenin effervescent de méthode traditionnelle en Loire peut-il différer d’un vin dominé par le Chardonnay ?
      choices:
        - { text: "Acidité élevée, fruits du verger et notes de lies fumées ou grillées", correct: true }
        - { text: "Acidité élevée, agrumes et notes de lies fortement boulangères", correct: false }
        - { text: "Acidité modérée, fruit floral et très peu de caractère de lies", correct: false }
        - { text: "Faible acidité, fruits tropicaux et notes prononcées de biscuit", correct: false }
      explanation: |
        Le Chenin conserve naturellement une acidité élevée et peut garder un
        profil fruité et minéral distinctif après la fermentation en bouteille.
        L’élevage sur lies apporte bien de la complexité, sans devoir reproduire
        le profil du Champagne.

  - id: loire-sparkling-method-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, france, loire, production]
    status: reviewed
    source_id: c42-0070
    review:
