        Plusieurs producteurs haut de gamme gardent leurs vins de méthode
        traditionnelle en cave pendant des années ; cinq ans sont possibles,
        mais ne constituent pas une norme légale. Le temps sur lies apporte
        pain grillé, brioche et onctuosité sans effacer le fruit mûr californien.

