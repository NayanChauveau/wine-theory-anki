    en:
      question: What is the minimum bottle-ageing period for Cava de Guarda?
      choices:
        - { text: "Nine months", correct: true }
        - { text: "Six months", correct: false }
        - { text: "Eighteen months", correct: false }
        - { text: "Thirty months", correct: false }
      explanation: |
        All Cava uses the traditional method. **Guarda** starts at nine months;
        **Guarda Superior Reserva** at 18, **Gran Reserva** at 30 and **Cava de
        Paraje Calificado** at 36 months.

    fr:
      question: Quelle est la durée minimale d’élevage en bouteille d’un Cava de Guarda ?
      choices:
        - { text: "Neuf mois", correct: true }
        - { text: "Six mois", correct: false }
        - { text: "18 mois", correct: false }
        - { text: "30 mois", correct: false }
      explanation: |
        Tout Cava est élaboré par méthode traditionnelle. **Guarda** commence à
        neuf mois, **Guarda Superior Reserva** à 18 mois, **Gran Reserva** à
        30 mois et **Cava de Paraje Calificado** à 36 mois.

  - id: cava-traditional-grapes-001
    type: mcq
    deck: Sparkling Wines
    tags: [sparkling, spain, cava, grapes]
    status: reviewed
    source_id: c42-0076
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which trio forms the classic white-grape foundation of Cava?
