        - { text: "Davantage de tanins du raisin et une couleur plus profonde, avec une pression plus faible", correct: false }
        - { text: "Plus d’arômes floraux primaires et moins de texture, avec un fruit plus doux", correct: false }
        - { text: "Une oxydation et une volatilité accrues, avec des bulles volontairement grossières", correct: false }
