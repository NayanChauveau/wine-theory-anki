    en:
      question: What does extended lees ageing add to premium California sparkling wine?
      choices:
        - { text: "Autolytic complexity and texture alongside concentrated fruit and acidity", correct: true }
        - { text: "Higher grape tannin and deeper colour alongside lower bottle pressure", correct: false }
        - { text: "More primary floral aroma and less texture alongside sweeter fruit", correct: false }
        - { text: "Greater oxidation and volatility alongside deliberately coarse bubbles", correct: false }
      explanation: |
        Several premium producers cellar traditional-method wines for years;
        five years is possible but not a legal norm. Time on lees can add toast,
        brioche and creaminess without erasing ripe Californian fruit.

    fr:
      question: Qu’apporte un élevage prolongé sur lies à un effervescent californien haut de gamme ?
      choices:
