    fr:
      question: Quels sites sud-africains aident le mieux les raisins à conserver leur acidité pour des effervescents haut de gamme ?
      choices:
        - { text: "Les sites côtiers et les pentes plus fraîches exposées au sud ou au sud-est", correct: true }
        - { text: "Les fonds de vallée intérieurs abrités qui connaissent les températures diurnes les plus élevées", correct: false }
        - { text: "Les pentes chaudes exposées au nord et protégées de l’influence rafraîchissante de l’océan", correct: false }
        - { text: "Les sites de basse altitude choisis surtout pour l’accumulation rapide du sucre", correct: false }
      explanation: |
