      question: "Which of these white grapes is usually classed as aromatic?"
      choices:
        - { text: "Torrontés", correct: true }
        - { text: "Melon", correct: false }
        - { text: "Trebbiano", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        Torrontés Riojano is a natural crossing of Muscat of Alexandria and Criolla Chica,
        which explains its grapey, floral perfume. It is Argentina's signature white.
    fr:
      question: "Lequel de ces cépages blancs est d’ordinaire classé parmi les aromatiques ?"
      choices:
        - { text: "Torrontés", correct: true }
        - { text: "Melon", correct: false }
        - { text: "Trebbiano", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        Le Torrontés Riojano est un croisement naturel entre le Muscat d’Alexandrie et la
        Criolla Chica, d’où son parfum floral et muscaté. C’est le blanc emblématique de
        l’Argentine.

  - id: white-sb-ripening-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, ripening]
    status: reviewed
    source_id: c08-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with most wine grapes, when does Sauvignon Blanc ripen?"
      choices:
        - { text: "Early", correct: true }
        - { text: "Mid-season", correct: false }
        - { text: "Late", correct: false }
        - { text: "Very late", correct: false }
      explanation: |
        Early ripening lets it mature in cool northern France before
        autumn turns cold. In hot sites it can race past its peak, so picking dates
        matter.
    fr:
      question: "Par rapport à la plupart des cépages, quand le Sauvignon Blanc mûrit-il ?"
      choices:
        - { text: "Tôt", correct: true }
        - { text: "En milieu de saison", correct: false }
        - { text: "Tard", correct: false }
        - { text: "Très tard", correct: false }
      explanation: |
        Sa précocité lui permet de mûrir dans le nord de la France, au climat frais, avant
        que l’automne ne devienne froid. En site chaud, il peut vite dépasser son optimum :
        la date de vendange compte beaucoup.

  - id: white-sb-cool-climate-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, climate]
    status: reviewed
    source_id: c08-0059
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are cool climates usually the best fit for Sauvignon Blanc?"
      choices:
        - { text: "They push its sugar high for a fuller body", correct: false }
        - { text: "They deepen its tropical fruit character", correct: false }
        - { text: "They encourage noble rot in most years", correct: false }
        - { text: "They preserve its acidity and fresh aromas", correct: true }
      explanation: |
        Heat burns off malic acid and the methoxypyrazines behind its grassy,
        green-pepper notes. In warm sites the fruit drifts towards a broader, tropical style.
    fr:
      question: "Pourquoi les climats frais conviennent-ils d’ordinaire le mieux au Sauvignon Blanc ?"
      choices:
        - { text: "Ils font monter ses sucres pour plus de corps", correct: false }
        - { text: "Ils renforcent ses notes de fruits tropicaux", correct: false }
        - { text: "Ils favorisent la pourriture noble presque chaque année", correct: false }
        - { text: "Ils préservent son acidité et ses arômes frais", correct: true }
      explanation: |
        La chaleur fait chuter l’acide malique et les méthoxypyrazines responsables des
        notes d’herbe coupée et de poivron vert. En site chaud, le fruit glisse vers un
        style plus ample et tropical.

  - id: white-sb-european-benchmark-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, regions, loire]
    status: reviewed
    source_id: c08-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which French region is the classic European benchmark for varietal Sauvignon Blanc?"
      choices:
        - { text: "Alsace", correct: false }
        - { text: "The Loire Valley", correct: true }
        - { text: "Burgundy", correct: false }
        - { text: "The Rhône Valley", correct: false }
      explanation: |
        Sancerre and Pouilly-Fumé set the model. Marlborough became its New World
        counterpart after Cloudy Bay's first vintage in 1985 drew world attention.
    fr:
      question: "Quelle région française sert de référence européenne pour le Sauvignon Blanc monocépage ?"
      choices:
        - { text: "L’Alsace", correct: false }
        - { text: "La Loire", correct: true }
        - { text: "La Bourgogne", correct: false }
        - { text: "La vallée du Rhône", correct: false }
      explanation: |
        Sancerre et Pouilly-Fumé ont fixé le modèle. Marlborough est devenu son pendant du
        Nouveau Monde après le premier millésime de Cloudy Bay, en 1985, qui a attiré
        l’attention du monde entier.

  - id: white-sb-sancerre-vs-marlborough-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, loire, style]
    status: reviewed
    source_id: c08-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with a Marlborough Sauvignon Blanc, how does a Sancerre or Pouilly-Fumé usually show?"
      choices:
        - { text: "Riper, with passion fruit and more alcohol", correct: false }
        - { text: "Sweeter, with honeyed noble-rot notes", correct: false }
        - { text: "More restrained, with green apple and wet stone", correct: true }
        - { text: "Fuller, with toasty new-oak spice", correct: false }
      explanation: |
        Sancerre's climate is cooler and less sunny than Marlborough's, and its limestone and
        flint soils are often credited with the stony note. The pungent tropical side is
        far more muted.
    fr:
      question: "Comparé à un Sauvignon Blanc de Marlborough, comment se présente d’ordinaire un Sancerre ou un Pouilly-Fumé ?"
      choices:
        - { text: "Plus mûr, fruit de la passion et plus d’alcool", correct: false }
        - { text: "Plus doux, notes miellées de pourriture noble", correct: false }
        - { text: "Plus retenu, pomme verte et pierre mouillée", correct: true }
        - { text: "Plus ample, épices toastées de fût neuf", correct: false }
      explanation: |
        Le climat de Sancerre est plus frais et moins ensoleillé que celui de Marlborough,
        et l’on attribue souvent la note minérale à ses sols calcaires et à silex. Le côté
        tropical exubérant y est bien plus discret.

  - id: white-sb-marlborough-sunlight-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, new-zealand, climate]
    status: reviewed
    source_id: c08-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which feature of Marlborough's climate most explains the intensity of its Sauvignon Blanc fruit?"
      choices:
        - { text: "Very high levels of sunlight", correct: true }
        - { text: "Warm, humid summer nights", correct: false }
        - { text: "Heavy rainfall through autumn", correct: false }
        - { text: "Frequent summer sea fog", correct: false }
      explanation: |
        Cool nights in the Wairau and Awatere valleys keep acidity high, so the bright
        fruit comes without the wine turning flabby.
    fr:
      question: "Quel trait du climat de Marlborough explique le mieux l’intensité du fruit de son Sauvignon Blanc ?"
      choices:
        - { text: "Un très fort ensoleillement", correct: true }
        - { text: "Des nuits d’été chaudes et humides", correct: false }
        - { text: "De fortes pluies tout l’automne", correct: false }
        - { text: "Des brouillards marins fréquents en été", correct: false }
      explanation: |
        Les nuits fraîches des vallées de la Wairau et de l’Awatere maintiennent une acidité
        élevée : le fruit éclatant ne rend pas le vin mou pour autant.

  - id: white-sb-marlborough-aromas-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, new-zealand, aroma]
    status: reviewed
    source_id: c08-0063
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aroma set is typical of a young Marlborough Sauvignon Blanc?"
      choices:
        - { text: "Green apple, lemon and wet stone", correct: false }
        - { text: "Passion fruit, toast and vanilla", correct: false }
        - { text: "Lychee, rose petal and ginger", correct: false }
        - { text: "Gooseberry, passion fruit and grapefruit", correct: true }
      explanation: |
        The tropical and citrus notes come largely from thiols; some wines also show
        herbaceous, green-pepper notes from methoxypyrazines. Elderflower is another
        common descriptor.
    fr:
      question: "Quels arômes sont typiques d’un jeune Sauvignon Blanc de Marlborough ?"
      choices:
        - { text: "Pomme verte, citron et notes de pierre mouillée", correct: false }
        - { text: "Fruit de la passion, pain grillé et gousse de vanille", correct: false }
        - { text: "Litchi, pétale de rose et pointe de gingembre", correct: false }
        - { text: "Groseille à maquereau, fruit de la passion, pamplemousse", correct: true }
      explanation: |
        Les notes tropicales et d’agrumes viennent surtout des thiols ; certains vins
        montrent aussi des notes végétales de poivron vert dues aux méthoxypyrazines. La
        fleur de sureau est un autre descripteur courant.

  - id: white-sb-chile-south-africa-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, regions]
    status: reviewed
    source_id: c08-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides New Zealand, which two countries are best known for fresh, fruity varietal Sauvignon Blanc?"
      choices:
        - { text: "Germany and Portugal", correct: false }
        - { text: "Chile and South Africa", correct: true }
        - { text: "Argentina and Spain", correct: false }
        - { text: "Greece and Hungary", correct: false }
      explanation: |
        Both rely on ocean cooling: the Humboldt Current off Casablanca and Leyda in Chile,
        and Atlantic breezes in Constantia, Durbanville and Elgin in South Africa.
    fr:
      question: "Outre la Nouvelle-Zélande, quels deux pays sont les plus connus pour leurs Sauvignon Blanc monocépages frais et fruités ?"
      choices:
        - { text: "L’Allemagne et le Portugal", correct: false }
        - { text: "Le Chili et l’Afrique du Sud", correct: true }
        - { text: "L’Argentine et l’Espagne", correct: false }
        - { text: "La Grèce et la Hongrie", correct: false }
      explanation: |
        Les deux comptent sur la fraîcheur océanique : le courant de Humboldt au large de
        Casablanca et de Leyda au Chili, les brises de l’Atlantique à Constantia,
        Durbanville et Elgin en Afrique du Sud.

  - id: white-sb-margaret-river-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, semillon, australia, blending]
    status: reviewed
    source_id: c08-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a Margaret River blend of Sauvignon Blanc and Sémillon usually differ from a varietal Marlborough Sauvignon?"
      choices:
        - { text: "Paler, lighter and more pungently grassy", correct: false }
        - { text: "Sweeter, with a note of noble rot", correct: false }
        - { text: "Less aromatic and fuller-bodied", correct: true }
        - { text: "Lower in alcohol, with a light spritz", correct: false }
      explanation: |
        Breezes off the Indian Ocean moderate the region. The blend is often labelled
        SBS or SSB, depending on which grape leads, and follows the dry white Bordeaux model.
    fr:
      question: "En quoi un assemblage Sauvignon Blanc–Sémillon de Margaret River diffère-t-il d’ordinaire d’un Sauvignon monocépage de Marlborough ?"
      choices:
        - { text: "Plus pâle, plus léger et plus herbacé", correct: false }
        - { text: "Plus doux, avec une note de pourriture noble", correct: false }
        - { text: "Moins aromatique et plus ample", correct: true }
        - { text: "Moins alcoolisé, avec un léger perlant", correct: false }
      explanation: |
        Les brises de l’océan Indien tempèrent la région. L’assemblage, souvent étiqueté SBS
        ou SSB selon le cépage majoritaire, suit le modèle du Bordeaux blanc sec.

  - id: white-sb-drink-young-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, ageing]
    status: reviewed
    source_id: c08-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When is a typical unoaked Sauvignon Blanc at its best?"
      choices:
        - { text: "Within a couple of years of the vintage", correct: true }
        - { text: "After three to five years in bottle", correct: false }
        - { text: "Once tertiary notes start to emerge", correct: false }
        - { text: "After a decade of cellaring", correct: false }
      explanation: |
        Its intense, fresh fruit is the point of the style, and those volatile notes fade
        with time. Oaked Sauvignon–Sémillon blends from Pessac-Léognan are the classic
        exception that can age.
    fr:
      question: "Quand un Sauvignon Blanc classique non boisé est-il à son meilleur ?"
      choices:
        - { text: "Dans les deux ans suivant le millésime", correct: true }
        - { text: "Après trois à cinq ans en bouteille", correct: false }
        - { text: "Quand les notes tertiaires apparaissent", correct: false }
        - { text: "Après une dizaine d’années de cave", correct: false }
      explanation: |
        Son fruit intense et frais fait tout l’intérêt du style, et ces arômes volatils
        s’estompent avec le temps. Les assemblages Sauvignon–Sémillon boisés de
        Pessac-Léognan sont l’exception classique qui vieillit bien.

  - id: white-pessac-semillon-role-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, semillon, pessac-leognan, blending]
    status: reviewed
    source_id: c08-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a white Pessac-Léognan blend, what does Sémillon mainly add to Sauvignon Blanc?"
      choices:
        - { text: "Crisp acidity and grassy aromas", correct: false }
        - { text: "A grapey, floral perfume", correct: false }
        - { text: "Body and richness", correct: true }
        - { text: "Colour and light tannin", correct: false }
      explanation: |
        Sémillon is moderate in acidity and waxy in texture, and it can develop toast and
        honey with age. Muscadelle, when used, is the grape that adds floral perfume.
    fr:
      question: "Dans un assemblage blanc de Pessac-Léognan, qu’apporte surtout le Sémillon au Sauvignon Blanc ?"
      choices:
        - { text: "Une acidité vive et des arômes herbacés", correct: false }
        - { text: "Un parfum floral et muscaté", correct: false }
        - { text: "Du corps et de la richesse", correct: true }
        - { text: "De la couleur et un peu de tanin", correct: false }
      explanation: |
        Le Sémillon, d’acidité moyenne et de texture cireuse, peut prendre des notes de pain
        grillé et de miel en vieillissant. Quand elle est utilisée, c’est la Muscadelle qui
        apporte le parfum floral.

  - id: white-riesling-cold-traits-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, viticulture]
    status: reviewed
    source_id: c08-0069
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of vine traits helps Riesling cope with cold northern vineyards?"
      choices:
        - { text: "Late budding and hard winter wood", correct: true }
        - { text: "Early budding and early ripening", correct: false }
        - { text: "Thin skins and high vigour", correct: false }
        - { text: "Large berries and loose bunches", correct: false }
      explanation: |
        Late budburst dodges much spring frost, and hard wood survives winter freezes that
        damage tender vines. It ripens mid to late, so it needs a long autumn, which is
        why steep south-facing Mosel slopes matter.
    fr:
      question: "Quelle paire de caractères aide le Riesling à supporter les vignobles froids du nord ?"
      choices:
        - { text: "Débourrement tardif et bois très dur", correct: true }
        - { text: "Débourrement précoce et maturité précoce", correct: false }
        - { text: "Peau fine et forte vigueur", correct: false }
        - { text: "Grosses baies et grappes lâches", correct: false }
      explanation: |
        Le débourrement tardif évite une bonne part des gelées de printemps, et le bois dur
        résiste aux froids d’hiver qui abîment des vignes plus fragiles. Il mûrit en milieu
        ou fin de saison : il lui faut un long automne, d’où l’importance des coteaux
        escarpés exposés au sud en Moselle.

  - id: white-riesling-warm-shift-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, climate, aroma]
    status: reviewed
    source_id: c08-0071
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "As Riesling is grown in warmer sites, how does its fruit character usually shift?"
      choices:
        - { text: "Towards green apple and white flowers", correct: false }
        - { text: "Towards red berries and spice", correct: false }
        - { text: "Towards gooseberry and cut grass", correct: false }
        - { text: "Towards citrus and stone fruit", correct: true }
      explanation: |
        Riper fruit gives fuller, richer wines, such as the peach-scented Rieslings of
        many Pfalz sites, at some cost to delicacy.
    fr:
      question: "Quand le Riesling est cultivé en site plus chaud, comment son fruit évolue-t-il d’ordinaire ?"
      choices:
        - { text: "Vers la pomme verte et les fleurs blanches", correct: false }
        - { text: "Vers les fruits rouges et les épices", correct: false }
        - { text: "Vers la groseille à maquereau et l’herbe coupée", correct: false }
        - { text: "Vers les agrumes et les fruits à noyau", correct: true }
      explanation: |
        Un raisin plus mûr donne des vins plus amples et plus riches, comme les Riesling aux
        notes de pêche de nombreux sites du Palatinat (Pfalz), au prix d’un peu de finesse.

  - id: white-riesling-sweet-suitability-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, sweet-wine]
    status: reviewed
    source_id: c08-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which trait makes Riesling especially well suited to sweet wines?"
      choices:
        - { text: "Its low acidity lets the sugar show", correct: false }
        - { text: "Its thick skins resist noble rot", correct: false }
        - { text: "It gains sugar while keeping high acidity", correct: true }
        - { text: "It ripens early, before the autumn rains", correct: false }
      explanation: |
        On steep Mosel slate slopes, bunches can hang well into autumn for Spätlese and
        Auslese picking, so producers can wait for ripeness without the wine turning flat.
    fr:
      question: "Quel trait rend le Riesling particulièrement apte aux vins doux ?"
      choices:
        - { text: "Son acidité faible laisse ressortir le sucre", correct: false }
        - { text: "Sa peau épaisse résiste à la pourriture noble", correct: false }
        - { text: "Il gagne du sucre sans perdre son acidité", correct: true }
        - { text: "Il mûrit tôt, avant les pluies d’automne", correct: false }
      explanation: |
        Sur les coteaux de schiste de la Moselle, les grappes peuvent rester sur souche tard
        dans l’automne pour les récoltes de Spätlese et d’Auslese : le producteur attend la
        maturité sans que le vin devienne plat.

  - id: white-riesling-longevity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, ageing]
    status: reviewed
    source_id: c08-0074
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aromatic white grape is best known for wines that stay fresh for decades in bottle?"
      choices:
        - { text: "Gewurztraminer", correct: false }
        - { text: "Riesling", correct: true }
        - { text: "Viognier", correct: false }
        - { text: "Muscat Blanc à Petits Grains", correct: false }
      explanation: |
        High acidity, often helped by residual sugar, keeps it lively while it develops.
        The other three are lower in acidity or prized for fresh perfume, so most of their
        wines are best drunk within a few years.
    fr:
      question: "Quel cépage blanc aromatique est réputé pour des vins qui restent frais pendant des décennies en bouteille ?"
      choices:
        - { text: "Gewurztraminer", correct: false }
        - { text: "Riesling", correct: true }
        - { text: "Viognier", correct: false }
        - { text: "Muscat Blanc à Petits Grains", correct: false }
      explanation: |
        Son acidité élevée, souvent épaulée par du sucre résiduel, le garde vif pendant son
        évolution. Les trois autres, moins acides ou appréciés pour leur parfum de jeunesse,
        donnent surtout des vins à boire dans leurs premières années.

  - id: white-riesling-aged-notes-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, ageing, aroma]
    status: reviewed
    source_id: c08-0075
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which developed notes are typical of a Riesling with long bottle age?"
      choices:
        - { text: "Leather, earth and forest floor", correct: false }
        - { text: "Walnut, caramel and dried fig", correct: false }
        - { text: "Vanilla, coconut and clove", correct: false }
        - { text: "Honey, toast and petrol", correct: true }
      explanation: |
        The petrol note comes from a compound called TDN, which tends to be stronger in
        sunnier, warmer sites. The acidity stays high as the fruit fades.
    fr:
      question: "Quelles notes d’évolution sont typiques d’un Riesling longuement vieilli en bouteille ?"
      choices:
        - { text: "Cuir, terre et sous-bois", correct: false }
        - { text: "Noix, caramel et figue sèche", correct: false }
        - { text: "Vanille, noix de coco et clou de girofle", correct: false }
        - { text: "Miel, pain grillé et hydrocarbures", correct: true }
      explanation: |
        La note d’hydrocarbures vient d’un composé appelé TDN, souvent plus marqué dans les
        sites chauds et ensoleillés. L’acidité reste élevée tandis que le fruit s’estompe.

  - id: white-sweet-acid-balance-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sweet-wine, balance]
    status: reviewed
    source_id: c08-0077
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a premium sweet wine, what mainly keeps the sweetness from tasting cloying?"
      choices:
        - { text: "Firm tannin", correct: false }
        - { text: "High acidity", correct: true }
        - { text: "Toasty oak flavour", correct: false }
        - { text: "Very low alcohol", correct: false }
      explanation: |
        The aim is a wine as refreshing as it is concentrated. A sweet wine low in acidity
        tastes flabby and heavy, however good the fruit.
    fr:
      question: "Dans un vin doux haut de gamme, qu’est-ce qui empêche surtout la douceur d’être écœurante ?"
      choices:
        - { text: "Un tanin ferme", correct: false }
        - { text: "Une acidité élevée", correct: true }
        - { text: "Un goût de bois toasté", correct: false }
        - { text: "Un degré d’alcool très bas", correct: false }
      explanation: |
        Le but est un vin aussi rafraîchissant que concentré. Un vin doux qui manque
        d’acidité paraît mou et lourd, quelle que soit la qualité du fruit.

  - id: white-riesling-europe-regions-001
