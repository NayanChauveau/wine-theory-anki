        - { text: "Alsace and the Loire", correct: false }
        - { text: "Austria and Hungary", correct: false }
        - { text: "The Loire and Hungary", correct: false }
      explanation: |
        Alsace has grand cru sites such as Schlossberg, the first to be recognised in 1975;
        in Austria, the Danube terraces of the Wachau, Kamptal and Kremstal lead.
    fr:
      question: "Outre l’Allemagne, quelles deux zones européennes sont les plus réputées pour leurs grands Riesling ?"
      choices:
        - { text: "L’Alsace et l’Autriche", correct: true }
        - { text: "L’Alsace et la Loire", correct: false }
        - { text: "L’Autriche et la Hongrie", correct: false }
        - { text: "La Loire et la Hongrie", correct: false }
      explanation: |
        L’Alsace compte des grands crus comme le Schlossberg, le premier reconnu, en 1975 ;
        en Autriche, les terrasses du Danube de la Wachau, du Kamptal et du Kremstal sont en
        tête.

  - id: white-riesling-australia-regions-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, australia, regions]
    status: reviewed
    source_id: c08-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of South Australian regions is most famous for Riesling?"
      choices:
        - { text: "Clare and Barossa", correct: false }
        - { text: "Eden Valley and McLaren Vale", correct: false }
        - { text: "Clare and Eden Valley", correct: true }
        - { text: "Barossa and McLaren Vale", correct: false }
      explanation: |
        Cool nights and, in Eden Valley, elevation keep acidity high. Clare Valley
        producers famously moved to screwcaps together with the 2000 vintage to protect
        that freshness.
    fr:
      question: "Quelle paire de régions d’Australie-Méridionale est la plus célèbre pour le Riesling ?"
      choices:
        - { text: "Clare et Barossa", correct: false }
        - { text: "Eden Valley et McLaren Vale", correct: false }
        - { text: "Clare et Eden Valley", correct: true }
        - { text: "Barossa et McLaren Vale", correct: false }
      explanation: |
        Les nuits fraîches et, à Eden Valley, l’altitude maintiennent l’acidité. Les
        producteurs de Clare Valley sont passés ensemble à la capsule à vis avec le
        millésime 2000 pour préserver cette fraîcheur.

  - id: white-riesling-clare-eden-lime-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, australia, aroma]
    status: reviewed
    source_id: c08-0082
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fruit note is the hallmark of a young, dry South Australian Riesling?"
      choices:
        - { text: "Lime", correct: true }
        - { text: "Peach", correct: false }
        - { text: "Honey", correct: false }
        - { text: "Pineapple", correct: false }
      explanation: |
        Most of these wines are fermented cool in stainless steel and bottled early under
        screwcap, with no oak, so the citrus fruit stays sharp and bright. Honey
        comes later with bottle age; peach suggests a warmer, riper style.
    fr:
      question: "Quelle note de fruit signe un Riesling sec et jeune d’Australie-Méridionale ?"
      choices:
        - { text: "Citron vert", correct: true }
        - { text: "Pêche blanche", correct: false }
        - { text: "Miel", correct: false }
        - { text: "Ananas", correct: false }
      explanation: |
        La plupart sont fermentés à basse température en cuve inox et mis en bouteille tôt
        sous capsule à vis, sans bois : l’agrume reste net et vif. Le miel vient plus tard
        avec l’âge ; la pêche évoque un style plus chaud et plus mûr.

  - id: white-riesling-new-world-regions-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, regions]
    status: reviewed
    source_id: c08-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Outside Australia, which pair of New World areas is well known for Riesling?"
      choices:
        - { text: "Napa Valley and Mendoza", correct: false }
        - { text: "Washington State and the Finger Lakes", correct: true }
        - { text: "Paso Robles and the Maipo Valley", correct: false }
        - { text: "Swartland and Colchagua", correct: false }
      explanation: |
        In the Finger Lakes, Konstantin Frank showed from the 1950s that vinifera vines
        could survive the cold. New Zealand is another notable source.
    fr:
      question: "Hors Australie, quelle paire de zones du Nouveau Monde est connue pour le Riesling ?"
      choices:
        - { text: "La Napa Valley et la province de Mendoza", correct: false }
        - { text: "L’État de Washington et les Finger Lakes", correct: true }
        - { text: "Paso Robles et la vallée chilienne du Maipo", correct: false }
        - { text: "Le Swartland et la vallée de Colchagua", correct: false }
      explanation: |
        Dans les Finger Lakes, Konstantin Frank a montré dès les années 1950 que la vigne
        vinifera pouvait résister au froid. La Nouvelle-Zélande est une autre source
        notable.

  - id: white-riesling-off-dry-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, style, new-zealand]
    status: reviewed
    source_id: c08-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style is common for much New Zealand Riesling?"
      choices:
        - { text: "Bone dry and austere", correct: false }
        - { text: "Oaked and full-bodied", correct: false }
        - { text: "Lusciously sweet from noble rot", correct: false }
        - { text: "Fruity and off-dry", correct: true }
      explanation: |
        A touch of residual sugar balances high natural acidity. Waipara and Nelson are
        noted sources, and drier and sweeter versions exist too.
    fr:
      question: "Quel style est courant pour une bonne part du Riesling néo-zélandais ?"
      choices:
        - { text: "Très sec et austère", correct: false }
        - { text: "Boisé et corsé", correct: false }
        - { text: "Liquoreux, issu de pourriture noble", correct: false }
        - { text: "Fruité et demi-sec", correct: true }
      explanation: |
        Une pointe de sucre résiduel équilibre une acidité naturelle élevée. Waipara et
        Nelson sont des sources réputées, et il existe aussi des versions plus sèches ou
        plus douces.

  - id: white-sweet-concentrate-method-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sweet-wine, methods]
    status: reviewed
    source_id: c08-0085
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sweetening method concentrates sugar inside the grape before it is pressed?"
      choices:
        - { text: "Adding unfermented juice to a dry wine", correct: false }
        - { text: "Chilling the ferment to stop the yeast", correct: false }
        - { text: "Letting the grapes freeze on the vine", correct: true }
        - { text: "Fortifying the ferment with grape spirit", correct: false }
      explanation: |
        Freezing, noble rot and drying on or off the vine all remove water from the berry.
        Stopping fermentation and adding a sweet component work on the juice or wine instead.
    fr:
      question: "Quelle méthode d’obtention de la douceur concentre le sucre dans la baie avant le pressurage ?"
      choices:
        - { text: "Ajouter du moût non fermenté à un vin sec", correct: false }
        - { text: "Refroidir la cuve pour arrêter les levures", correct: false }
        - { text: "Laisser geler le raisin sur souche", correct: true }
        - { text: "Muter la fermentation à l’eau-de-vie", correct: false }
      explanation: |
        Le gel, la pourriture noble et le passerillage, sur souche ou après récolte,
        retirent tous de l’eau à la baie. L’arrêt de fermentation et l’ajout d’un élément
        sucré agissent sur le moût ou sur le vin.

  - id: white-fortification-yeast-kill-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sweet-wine, fortification]
    status: reviewed
    source_id: c08-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When grape spirit is added to a fermenting must, why does sugar remain in the wine?"
      choices:
        - { text: "The spirit cools the must below yeast activity", correct: false }
        - { text: "The higher alcohol kills the yeast", correct: true }
        - { text: "The spirit binds the sugar so yeast cannot use it", correct: false }
        - { text: "The spirit strips the nitrogen the yeast need", correct: false }
      explanation: |
        Most wine yeast cannot survive once alcohol reaches roughly the mid-teens. This is
        how Port and vins doux naturels such as Muscat de Beaumes-de-Venise keep their
        sweetness.
    fr:
      question: "Quand on ajoute de l’eau-de-vie à un moût en fermentation, pourquoi du sucre reste-t-il dans le vin ?"
      choices:
        - { text: "L’eau-de-vie refroidit le moût au point de bloquer les levures", correct: false }
        - { text: "Le degré d’alcool plus élevé tue les levures", correct: true }
        - { text: "L’eau-de-vie fixe le sucre, inaccessible aux levures", correct: false }
        - { text: "L’eau-de-vie prive les levures de leur azote", correct: false }
      explanation: |
        La plupart des levures œnologiques ne survivent pas au-delà d’environ 15 % vol.
        C’est ainsi que le Porto et les vins doux naturels comme le Muscat de
        Beaumes-de-Venise gardent leur sucre.

  - id: white-fortification-balance-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sweet-wine, fortification]
    status: reviewed
    source_id: c08-0087
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "For a sweet white, what is the main drawback of stopping fermentation by fortification?"
      choices:
        - { text: "It removes much of the acidity", correct: false }
        - { text: "It leaves the wine prone to refermenting", correct: false }
        - { text: "It turns the wine brown within weeks", correct: false }
        - { text: "It sharply raises alcohol and shifts balance", correct: true }
      explanation: |
        The added spirit changes body and heat, so the wine no longer tastes like a light
        sweet white. Makers who want low-alcohol sweetness chill and filter instead.
    fr:
      question: "Pour un blanc doux, quel est le principal inconvénient d’un arrêt de fermentation par mutage ?"
      choices:
        - { text: "Il fait perdre une grande part de l’acidité", correct: false }
        - { text: "Il expose le vin à une refermentation", correct: false }
        - { text: "Il fait brunir le vin en quelques semaines", correct: false }
        - { text: "Il élève l’alcool et change l’équilibre", correct: true }
      explanation: |
        L’eau-de-vie ajoutée modifie le corps et la sensation de chaleur : le vin n’a plus
        rien d’un blanc doux léger. Pour une douceur à faible degré, on refroidit et on
        filtre plutôt.

  - id: white-arrested-ferment-asti-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sweet-wine, arrested-fermentation]
    status: reviewed
    source_id: c08-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sweet wine is made from normally ripe grapes whose fermentation is halted early?"
      choices:
        - { text: "Sauternes", correct: false }
        - { text: "Canadian Icewine", correct: false }
        - { text: "Asti", correct: true }
        - { text: "Vin Santo", correct: false }
      explanation: |
        Asti ferments in pressurised tanks and is chilled and filtered at around 7% alcohol.
        Many German Kabinett and Spätlese wines keep their sweetness in a similar way.
    fr:
      question: "Quel vin doux provient de raisins à maturité normale dont la fermentation est arrêtée tôt ?"
      choices:
        - { text: "Sauternes", correct: false }
        - { text: "Icewine canadien", correct: false }
        - { text: "Asti", correct: true }
        - { text: "Vin Santo", correct: false }
      explanation: |
        L’Asti fermente en cuve close sous pression, puis il est refroidi et filtré vers 7 %
        vol. Beaucoup de Kabinett et de Spätlese allemands gardent leur sucre de façon
        comparable.

  - id: white-sussreserve-preserve-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sweetening, juice]
    status: reviewed
    source_id: c08-0094
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can grape juice be kept unfermented so that it can later sweeten a wine?"
      choices:
        - { text: "By fining it with bentonite", correct: false }
        - { text: "By removing yeast or adding SO₂", correct: true }
        - { text: "By acidifying it with tartaric acid", correct: false }
        - { text: "By settling it and racking off the solids", correct: false }
      explanation: |
        Sterile filtration takes the yeast out, while a high SO₂ dose stops them working.
        The juice is often held cold as well.
    fr:
      question: "Comment garder un jus de raisin non fermenté pour adoucir un vin plus tard ?"
      choices:
        - { text: "En le collant à la bentonite", correct: false }
        - { text: "En ôtant les levures ou en le sulfitant", correct: true }
        - { text: "En l’acidifiant avec de l’acide tartrique", correct: false }
        - { text: "En le débourbant puis en le soutirant", correct: false }
      explanation: |
        La filtration stérile retire les levures ; une forte dose de SO₂ les empêche d’agir.
        Ce jus, appelé Süssreserve en allemand, est souvent conservé au froid.

  - id: white-noble-rot-tokaji-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sweet-wine, botrytis]
    status: reviewed
    source_id: c08-0099
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which of these sweet wines depends on noble rot?"
      choices:
        - { text: "Eiswein", correct: false }
        - { text: "Tokaji Aszú", correct: true }
        - { text: "Vin Santo", correct: false }
        - { text: "Recioto della Valpolicella", correct: false }
      explanation: |
        Sauternes, Beerenauslese and Trockenbeerenauslese belong to the same family.
        Eiswein needs healthy berries frozen on the vine, and the other two use grapes
        dried indoors after picking.
    fr:
      question: "Lequel de ces vins doux dépend de la pourriture noble ?"
      choices:
        - { text: "Eiswein", correct: false }
        - { text: "Tokaji Aszú", correct: true }
        - { text: "Vin Santo", correct: false }
        - { text: "Recioto della Valpolicella", correct: false }
      explanation: |
        Le Sauternes, le Beerenauslese et le Trockenbeerenauslese sont de la même famille.
        L’Eiswein exige des baies saines gelées sur souche ; les deux autres utilisent des
        raisins passerillés à l’abri après la vendange.
