        - { text: "Apricot and honey", correct: false }
        - { text: "White peach and melon", correct: true }
      explanation: |
        Fuller ripeness moves the fruit into stone fruit and melon, with
        acidity still fresh. Many Mâconnais whites sit in this middle ground.
    fr:
      question: "Quels arômes de fruits sont typiques d’un Chardonnay de climat modéré ?"
      choices:
        - { text: "Pomme verte et citron", correct: false }
        - { text: "Banane et ananas", correct: false }
        - { text: "Abricot et miel", correct: false }
        - { text: "Pêche blanche et melon", correct: true }
      explanation: |
        Une maturité plus poussée fait glisser le fruit vers les fruits à noyau et le
        melon, avec une acidité encore fraîche. Beaucoup de blancs du Mâconnais se
        situent dans cet entre-deux.

  - id: white-chardonnay-hot-climate-fruit-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate, flavour]
    status: reviewed
    source_id: c08-0146
