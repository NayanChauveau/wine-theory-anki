# deck: White and Sweet Winemaking

cards:
  - id: white-chardonnay-australia-regions-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, chardonnay, australia]
    status: reviewed
    source_id: c08-0151
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of Australian regions has built a strong name for cool-climate Chardonnay?"
      choices:
        - { text: "Barossa Valley and McLaren Vale", correct: false }
        - { text: "Clare Valley and Coonawarra", correct: false }
        - { text: "Adelaide Hills and Mornington Peninsula", correct: true }
        - { text: "Rutherglen and Heathcote", correct: false }
      explanation: |
        Altitude in the Adelaide Hills and sea breezes off Port Phillip and Western Port
        Bays on the Mornington Peninsula keep Chardonnay fresh and taut. Geelong, also near
        Port Phillip Bay, has a similar reputation. Barossa and McLaren Vale are Shiraz
        country, Clare is best known for Riesling, Coonawarra for Cabernet, and Rutherglen
        for fortified Muscat.

  - id: white-chardonnay-chile-region-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, chardonnay, chile]
    status: reviewed
    source_id: c08-0151
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Chilean valley has the strongest reputation for fresh Chardonnay?"
      choices:
        - { text: "Casablanca Valley", correct: true }
        - { text: "Maipo Valley", correct: false }
        - { text: "Colchagua Valley", correct: false }
        - { text: "Cachapoal Valley", correct: false }
      explanation: |
        Casablanca sits between Santiago and the coast, where cold Humboldt Current air and
        morning fog slow ripening. Maipo, Colchagua and Cachapoal are warmer inland valleys
        better known for Cabernet Sauvignon, Carmenère and other reds.

  - id: white-chardonnay-nz-regions-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, chardonnay, new-zealand]
    status: reviewed
    source_id: c08-0151
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which New Zealand region built its early name on Chardonnay?"
      choices:
        - { text: "Central Otago", correct: false }
        - { text: "Gisborne", correct: true }
        - { text: "Martinborough", correct: false }
        - { text: "Waipara", correct: false }
      explanation: |
        Sunny Gisborne, on the east coast of the North Island, built its name on ripe,
        generous Chardonnay. Marlborough is dominated by Sauvignon Blanc but also grows
        plenty of Chardonnay, for still and sparkling wines. Central Otago and
        Martinborough are best known for Pinot Noir, Waipara for Pinot Noir and Riesling.

  - id: white-pinot-gris-cycle-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, viticulture]
    status: reviewed
    source_id: c08-0152
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Pinot Gris behave over the growing season?"
      choices:
        - { text: "Late budburst and late ripening", correct: false }
        - { text: "Early budburst but late ripening", correct: false }
        - { text: "Late budburst but early ripening", correct: false }
        - { text: "Early budburst and early ripening", correct: true }
      explanation: |
        Like Pinot Noir, of which it is a colour mutation, Pinot Gris starts and finishes early. Early budburst
        exposes the young shoots to spring frost, while early ripening lets it reach full
        maturity in cool places such as Alsace, Oregon and Tasmania.

  - id: white-pinot-gris-ripeness-balance-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, viticulture]
    status: reviewed
    source_id: c08-0152
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do sugar and acidity change in Pinot Gris as it ripens?"
      choices:
        - { text: "Sugar rises slowly; acidity holds well", correct: false }
        - { text: "Sugar rises quickly; acidity falls fast", correct: true }
        - { text: "Sugar rises quickly; acidity holds well", correct: false }
        - { text: "Sugar rises slowly; acidity falls fast", correct: false }
      explanation: |
        Pinot Gris can reach high sugar levels, but it loses much of its acidity on the way.
        That is why late-picked examples can be high in alcohol and feel heavy.
        Riesling, by contrast, keeps high acidity even at high sugar levels.

  - id: white-pinot-gris-colour-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris]
    status: reviewed
    source_id: c08-0153
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can wines from Pinot Gris show a deeper, more golden colour than most dry whites?"
      choices:
        - { text: "It is usually aged in new oak", correct: false }
        - { text: "Most bunches are botrytis-affected", correct: false }
        - { text: "It is picked later than other whites", correct: false }
        - { text: "Its pink-grey skins hold some pigment", correct: true }
      explanation: |
        Pinot Gris is a colour mutation of Pinot Noir. Even a short skin contact before or during pressing can deepen the colour; with longer
        skin contact the wine can turn coppery, as in Friuli's ramato style.

  - id: white-pinot-gris-alsace-aromas-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, alsace]
    status: reviewed
    source_id: c08-0153
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Alongside ripe tropical fruit, which accent often marks a rich Alsace Pinot Gris?"
      choices:
        - { text: "Petrol and lime zest", correct: false }
        - { text: "Gooseberry and cut grass", correct: false }
        - { text: "Ginger and honey", correct: true }
        - { text: "Green apple and lemon pith", correct: false }
      explanation: |
        Ripe Alsace Pinot Gris tends to be dry or off-dry, with an oily texture and medium
        acidity. Spice and honey come with that ripeness. Petrol and lime point to aged
        Riesling, gooseberry and grass to Sauvignon Blanc.

  - id: white-pinot-gris-nz-label-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, new-zealand]
    status: reviewed
    source_id: c08-0154
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which name do New Zealand producers usually put on the label for the grey-skinned mutation of Pinot Noir?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Grauburgunder", correct: false }
        - { text: "Pinot Gris", correct: true }
        - { text: "Malvoisie", correct: false }
      explanation: |
        Pinot Gris is one of New Zealand's most planted white grapes after Sauvignon Blanc
        and Chardonnay, and the French name is the norm there. Italy uses Pinot Grigio,
        Germany mainly Grauburgunder (or Ruländer for sweeter styles), and Hungary's
        traditional name is Szürkebarát.

  - id: white-pinot-gris-nz-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, new-zealand]
    status: reviewed
    source_id: c08-0155
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with a typical Alsace example, how does New Zealand Pinot Gris tend to differ?"
      choices:
        - { text: "More oak and lees character", correct: false }
        - { text: "Purer fruit, less honeyed richness", correct: true }
        - { text: "Leaner, bone-dry and more austere", correct: false }
        - { text: "Deeper colour and firmer phenolic grip", correct: false }
      explanation: |
        New Zealand examples usually put clean pear and stone-fruit flavours first. A
        little residual sugar is common, though both countries make wines from dry to
        off-dry.

  - id: white-pinot-gris-tasmania-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, australia]
    status: reviewed
    source_id: c08-0156
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Australian region makes textured Pinot Gris closest to the Alsace style?"
      choices:
        - { text: "Hunter Valley", correct: false }
        - { text: "Barossa Valley", correct: false }
        - { text: "Margaret River", correct: false }
        - { text: "Tasmania", correct: true }
      explanation: |
        Tasmania is Australia's coolest wine state, so early-ripening Pinot Gris keeps
        enough freshness to carry a rich, textured style. Oregon's Willamette Valley is a
        similar case in the USA. Hunter is best known for Semillon, Barossa for Shiraz and
        Margaret River for Cabernet and Chardonnay.

  - id: white-pinot-grigio-alpine-clone-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, italy, clones]
    status: reviewed
    source_id: c08-0160
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do the Pinot Grigio clones of Alto Adige and Trentino differ from those of the Veneto plains?"
      choices:
        - { text: "Larger berries, higher yields", correct: false }
        - { text: "Paler skins, more neutral juice", correct: false }
        - { text: "Smaller berries, more concentrated flavour", correct: true }
        - { text: "Later ripening, lower alcohol", correct: false }
      explanation: |
        Growers in Alto Adige and Trentino largely use the same clones as France and
        Germany. Small berries mean more skin relative to juice, which gives more
        concentrated flavour. Clone choice is a style lever in its own right, separate from
        site and vineyard work.

  - id: white-pinot-grigio-plains-clone-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, italy, clones]
    status: reviewed
    source_id: c08-0161
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which clone traits lie behind the cheap, neutral Pinot Grigio of the Veneto plains?"
      choices:
        - { text: "Pale skins and small, thick-skinned berries", correct: false }
        - { text: "Deep pink skins and large, fleshy berries", correct: false }
        - { text: "Pale skins and large, fleshy berries", correct: true }
        - { text: "Deep pink skins and small berries", correct: false }
      explanation: |
        Lots of pulp and little skin flavour suit volume production. High yields and early
        picking on the fertile plains strip out what character remains, which is why these
        wines are light and neutral.

  - id: white-chardonnay-whole-bunch-press-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, chardonnay, pressing]
    status: reviewed
    source_id: c08-0162
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are quality Chardonnay grapes most commonly handled on arrival at the winery?"
      choices:
        - { text: "Destemmed, crushed and fermented on skins", correct: false }
        - { text: "Destemmed and left on skins for several days", correct: false }
        - { text: "Crushed and macerated cold for a week", correct: false }
        - { text: "Loaded whole into the press", correct: true }
      explanation: |
        Whole-bunch pressing is gentle: the stems form drainage channels, so clear juice
        runs off with little extraction of bitter phenolics from skins and seeds. The same
        approach is standard for base wines in Champagne.

  - id: white-short-skin-contact-oxidation-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white]
    status: reviewed
    source_id: c08-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is white juice usually separated from its skins soon after the grapes reach the winery?"
      choices:
        - { text: "To speed up the press cycle", correct: false }
        - { text: "To stop fermentation starting on the skins", correct: false }
        - { text: "To limit oxidation of the juice", correct: true }
        - { text: "To keep yeast nutrients in the juice", correct: false }
      explanation: |
        Broken skins expose juice to air and to browning enzymes, so long
        contact speeds oxidation of the delicate fruit aromas. Quick separation
        also keeps out bitter phenolics that whites, unlike reds, do not want.

  - id: white-reception-sequence-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white]
    status: reviewed
    source_id: c08-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "After sorting and crushing, what is done with white grapes before they go to the press?"
      choices:
        - { text: "They soak on their skins for several days", correct: false }
        - { text: "The free-run juice is drained off", correct: true }
        - { text: "They are inoculated with yeast on the skins", correct: false }
        - { text: "The whole mass is cold-settled overnight", correct: false }
      explanation: |
        Free-run juice flows out by gravity once the skins are split. It is the
        gentlest, lowest-phenolic fraction, so many cellars keep it apart from the
        press juice recovered afterwards.

  - id: white-whole-bunch-press-aim-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, pressing]
    status: reviewed
    source_id: c08-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A white winemaker skips the crusher and sends intact bunches straight to the press. What is the main aim?"
      choices:
        - { text: "To extract colour and tannin from the stems", correct: false }
        - { text: "To keep skin–juice contact to a minimum", correct: true }
        - { text: "To raise the juice yield per tonne of fruit", correct: false }
        - { text: "To start fermentation inside the whole berries", correct: false }
      explanation: |
        With no crushing, juice only leaves the berries as pressure builds, so
        it spends less time against broken skins and picks up less oxygen and
        phenolics. The stalks also open channels that help the juice drain.
        Juice yield is usually lower, not higher.

  - id: white-whole-bunch-press-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, pressing]
    status: reviewed
    source_id: c08-0005
    review:
      fact_check: pass
      sources: [known-fact, spec]
    en:
      question: "Which style outcome is whole-bunch pressing of white grapes usually chosen for?"
      choices:
        - { text: "A deeper-coloured, more textured wine", correct: false }
        - { text: "A rounder wine with nutty, developed notes", correct: false }
        - { text: "A purer, more delicate wine", correct: true }
        - { text: "A wine with riper, more tropical fruit", correct: false }
      explanation: |
        Gentle pressing of intact bunches gives clean juice low in phenolics.
        Champagne's rules require whole-bunch pressing for this reason, since
        the base wines must stay fine and pale, even from black grapes.

  - id: white-skin-contact-aroma-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, skin-contact]
    status: reviewed
    source_id: c08-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a winemaker leave crushed white grapes on their skins for a few hours before pressing?"
      choices:
        - { text: "To raise the juice's sugar level", correct: false }
        - { text: "To extract tannin for ageing", correct: false }
        - { text: "To protect the juice from oxidation", correct: false }
        - { text: "To boost flavour intensity and texture", correct: true }
      explanation: |
        Many aroma compounds and their precursors sit in or just under the
        skin, so a short soak draws more of them into the juice. It is mostly
        used for aromatic varieties, and kept brief to avoid bitter phenolics.

  - id: white-skin-contact-cold-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, skin-contact]
    status: reviewed
    source_id: c08-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is white must kept cold during a short pre-fermentation soak on the skins?"
      choices:
        - { text: "To stop fermentation from starting", correct: true }
        - { text: "To drop tartrate crystals out of the juice", correct: false }
        - { text: "To build up yeast numbers before inoculation", correct: false }
        - { text: "To speed up colour extraction", correct: false }
      explanation: |
        Once yeast get going, alcohol would start pulling bitter phenolics
        from the skins and the soak would turn into a fermentation on skins.
        Chilling holds the yeast back while the contact lasts a matter of
        hours.

  - id: white-juice-clarify-reason-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, clarification]
    status: reviewed
    source_id: c08-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is freshly pressed white juice usually clarified before it is fermented?"
      choices:
        - { text: "Grape solids lower the final alcohol", correct: false }
        - { text: "Grape solids block malolactic conversion", correct: false }
        - { text: "Grape solids can cause off-aromas", correct: true }
        - { text: "Grape solids raise the juice's acidity", correct: false }
      explanation: |
        Heavy solids can encourage reductive, sulfur-like smells such as
        hydrogen sulfide and coarse, vegetal notes. Removing most of them
        keeps a fruit-led white clean, though a little turbidity is often left
        to feed the yeast.

  - id: white-juice-solids-complexity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, clarification]
    status: reviewed
    source_id: c08-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a winemaker deliberately ferment a white with some cloudy juice solids left in?"
      choices:
        - { text: "For a paler colour and lighter body", correct: false }
        - { text: "For more complexity and a richer texture", correct: true }
        - { text: "To keep more fresh varietal fruit", correct: false }
        - { text: "To make the wine stable without fining", correct: false }
      explanation: |
        Some Burgundy Chardonnay producers favour cloudier juice for this
        reason. Many also believe the finished wine resists oxidation better,
        though that effect is debated. The solids also feed the yeast and
        can add body.

  - id: white-juice-solids-pure-varietal-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, clarification]
    status: reviewed
    source_id: c08-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white is most likely to be fermented from well-settled, clear juice?"
      choices:
        - { text: "Barrel-fermented Meursault", correct: false }
        - { text: "Lees-stirred Margaret River Chardonnay", correct: false }
        - { text: "Oak-aged white Pessac-Léognan", correct: false }
        - { text: "Marlborough Sauvignon Blanc", correct: true }
      explanation: |
        Marlborough wineries usually cold-settle or float the juice, then
        ferment it cool in stainless steel to keep the passion-fruit and
        gooseberry character sharp.

  - id: white-ferment-temp-range-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation]
    status: reviewed
    source_id: c08-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Within which temperature band are most white wines fermented?"
      choices:
        - { text: "About 6–10 °C", correct: false }
        - { text: "About 12–22 °C", correct: true }
        - { text: "About 24–30 °C", correct: false }
        - { text: "About 30–35 °C", correct: false }
      explanation: |
        Reds are usually fermented warmer, roughly 20–32 °C, to extract colour
        and tannin. Whites need no extraction, so cooler temperatures are used
        to protect fresh aromas.

  - id: white-ferment-too-cold-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation]
    status: reviewed
    source_id: c08-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What can a very cold fermentation do to the aroma of a white wine?"
      choices:
        - { text: "Give jammy, cooked-fruit aromas", correct: false }
        - { text: "Give buttery, creamy notes", correct: false }
        - { text: "Give toasty, nutty notes", correct: false }
        - { text: "Give strong pear-drop aromas", correct: true }
      explanation: |
        Fermenting near the bottom of the yeast's range favours fruity esters
        such as isoamyl acetate, the pear-drop and banana smell. Pushed too
        far, these esters swamp the grape's own character, so different
        varieties start to smell alike.

  - id: white-ferment-warm-complexity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation]
    status: reviewed
    source_id: c08-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a winemaker let a Chardonnay ferment toward the warm end of the usual white range?"
      choices:
        - { text: "To build more complex, non-fruit aromas", correct: true }
        - { text: "To keep more fresh primary fruit", correct: false }
        - { text: "To retain more natural acidity", correct: false }
        - { text: "To leave a little residual sugar", correct: false }
      explanation: |
        Warmer fermentation shifts yeast metabolism away from delicate fruity
        esters toward higher alcohols and other compounds that read as savoury
        depth rather than fresh fruit.

  - id: white-ferment-too-warm-risk-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation]
    status: reviewed
    source_id: c08-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main stylistic risk of fermenting an aromatic white such as Riesling too warm?"
      choices:
        - { text: "Building buttery, creamy notes", correct: false }
        - { text: "Retaining too much malic acid", correct: false }
        - { text: "Losing its varietal fruit aromas", correct: true }
        - { text: "Picking up excess grape tannin", correct: false }
      explanation: |
        Volatile aroma compounds escape with the faster flow of CO₂ and react
        away more quickly at higher temperatures, so the wine can taste flat and
        generic.

  - id: white-barrel-ferment-heat-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation, oak]
    status: reviewed
    source_id: c08-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a white still ferment fairly cool in barrel without any cooling jacket?"
      choices:
        - { text: "The oak staves absorb the yeast's heat", correct: false }
        - { text: "The lees insulate the wine from warming", correct: false }
        - { text: "Air seeping through the wood cools it", correct: false }
        - { text: "Small volumes shed heat in a cool cellar", correct: true }
      explanation: |
        A 225-litre barrel has a large surface for its volume, so the heat
        released by yeast escapes quickly, unlike in a big tank where it
        builds up. Underground cellars in Burgundy help by staying cool.

  - id: white-barrel-ferment-temp-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation, oak]
    status: reviewed
    source_id: c08-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At about which temperature does a barrel-fermented white usually ferment?"
      choices:
        - { text: "About 10–13 °C", correct: false }
        - { text: "About 13–16 °C", correct: false }
        - { text: "About 16–19 °C", correct: false }
        - { text: "About 19–22 °C", correct: true }
      explanation: |
        This sits at the top of the usual white range. If a barrel ferment
        runs hotter than wanted, cellars can move the barrels to a cooler
        room or trickle chilled water over the staves.

  - id: white-blend-fruit-led-consistency-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, blending]
    status: reviewed
    source_id: c08-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "For a producer of fruit-led, inexpensive whites, what is blending mainly for?"
      choices:
        - { text: "Building oak-derived complexity", correct: false }
        - { text: "Raising the alcohol level", correct: false }
        - { text: "A consistent style from year to year", correct: true }
        - { text: "Extending the wine's ageing potential", correct: false }
      explanation: |
        Drinkers of a big brand expect the same taste in every bottle. Blending
        lots from different vineyards, regions or tanks evens out vintage and
        site variation.

  - id: white-blend-neutral-complexity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, blending]
    status: reviewed
    source_id: c08-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a Meursault producer keep lots with different lees, MLF and new-oak treatment apart until blending?"
      choices:
        - { text: "To meet a varietal labelling minimum", correct: false }
        - { text: "To build complexity in the final blend", correct: true }
        - { text: "To keep one brand taste every year", correct: false }
        - { text: "To lift the wine's primary fruit", correct: false }
      explanation: |
        A neutral grape such as Chardonnay gives the winemaker room to shape
        the wine. Each lot brings its own layer, and tasting them separately
        lets the cellar choose the proportions.

  - id: white-clarity-pale-wine-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, clarification]
    status: reviewed
    source_id: c08-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do whites usually get stricter haze treatment before bottling than reds?"
      choices:
        - { text: "Whites have more pigment that drops out", correct: false }
        - { text: "Haze and deposits show more in a pale wine", correct: true }
        - { text: "Whites spend longer on their gross lees", correct: false }
        - { text: "Whites are usually aged longer in barrel", correct: false }
      explanation: |
        A slight haze is hard to see in an opaque red but obvious in a glass
        of pale white. That is why whites are usually tested for protein and
        tartrate stability before bottling.

  - id: white-bulk-varietal-label-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, labelling]
    status: reviewed
    source_id: c08-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do many cheap single-variety whites name the grape on the front label?"
      choices:
        - { text: "Law requires it for every single-variety wine", correct: false }
        - { text: "It proves the wine contains no other grape", correct: false }
        - { text: "The grape name itself sells the wine", correct: true }
        - { text: "It replaces the region on the label", correct: false }
      explanation: |
        Names such as Chardonnay or Pinot Grigio are familiar to shoppers. In
        the EU and many New World countries, a named variety need only make up
        a legal minimum of the wine, often 85%.

  - id: white-bulk-blend-volume-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, blending]
    status: reviewed
    source_id: c08-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are many high-volume, inexpensive whites made as multi-variety blends?"
      choices:
        - { text: "Cheap wines may not name a grape variety", correct: false }
        - { text: "Blending makes large volumes easier to assemble", correct: true }
        - { text: "Blending removes the need for acidification", correct: false }
        - { text: "Blends need far less SO₂ at bottling", correct: false }
      explanation: |
        A free hand with grapes lets a producer buy whatever fruit is
        available and affordable each year and still hit the target volume
        and taste.

  - id: white-bulk-blend-label-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, labelling]
    status: reviewed
    source_id: c08-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is an inexpensive multi-variety white blend often named on its label?"
      choices:
        - { text: "With every grape listed by share", correct: false }
        - { text: "With a single-vineyard name", correct: false }
        - { text: "With a style term", correct: true }
        - { text: "With a sub-regional appellation", correct: false }
      explanation: |
        Terms such as 'Dry White' or 'Fruity White' tell the shopper what to
        expect without listing grapes that may change from one bottling to the
        next.

  - id: white-bulk-grape-pair-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, grapes]
    status: reviewed
    source_id: c08-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of grapes is most widely used for high-volume, inexpensive white wines?"
      choices:
        - { text: "Riesling and Gewurztraminer", correct: false }
        - { text: "Viognier and Muscat", correct: false }
        - { text: "Albariño and Grüner Veltliner", correct: false }
        - { text: "Chardonnay and Pinot Grigio", correct: true }
      explanation: |
        Both are planted widely in warm, high-yielding regions such as
        California's Central Valley, the Riverland in Australia and the
        plains of north-east Italy. Their fairly neutral flavours suit a
        broad market.

  - id: white-bulk-neutral-appeal-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, grapes]
    status: reviewed
    source_id: c08-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a restrained, fairly neutral flavour profile suit a grape used for high-volume whites?"
      choices:
        - { text: "It removes the need for acid additions", correct: false }
        - { text: "It appeals to a wide range of drinkers", correct: true }
        - { text: "It makes oak treatment unnecessary", correct: false }
        - { text: "It lets the vine carry higher yields", correct: false }
      explanation: |
        Strongly aromatic grapes such as Gewurztraminer divide opinion, while
        a gentle, fruity white offends almost no one. Broad appeal is what a
        large-volume brand needs.

  - id: white-bulk-easy-ripening-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, grapes]
    status: reviewed
    source_id: c08-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vine trait makes Chardonnay practical in warm, high-yield bulk vineyards?"
      choices:
        - { text: "It buds late and so avoids spring frost", correct: false }
        - { text: "It keeps high acidity in hot weather", correct: false }
        - { text: "It ripens easily", correct: true }
        - { text: "It resists drought without irrigation", correct: false }
      explanation: |
        Reliable ripening lets growers in warm regions crop heavily and still
        reach sugar targets. Chardonnay is in fact an early-budding, frost-prone
        variety.

  - id: white-bulk-hot-low-acid-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk]
    status: reviewed
    source_id: c08-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape-composition problem most often affects inexpensive whites from hot regions?"
      choices:
        - { text: "Sunburnt, bitter skins", correct: false }
        - { text: "Too much malic acid", correct: false }
        - { text: "Excess tannin from heat stress", correct: false }
        - { text: "Too little acidity", correct: true }
      explanation: |
        Heat speeds the breakdown of malic acid in the berries, so the juice
        can taste flat. Where local rules allow, the winemaker corrects this
        by adding acid, usually tartaric.

  - id: white-bulk-chardonnay-melon-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, chardonnay]
    status: reviewed
    source_id: c08-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fruit profile is typical of an unoaked, inexpensive warm-climate Chardonnay?"
      choices:
        - { text: "Melon and peach", correct: true }
        - { text: "Gooseberry and grass", correct: false }
        - { text: "Lychee and rose", correct: false }
        - { text: "Lime and petrol", correct: false }
      explanation: |
        Warmth pushes Chardonnay from citrus and green apple toward riper
        stone and tropical fruit. Oaked versions at the same price add vanilla
        and toast, usually from chips or staves.

  - id: white-bulk-chardonnay-sweetness-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, chardonnay]
    status: reviewed
    source_id: c08-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Whether oaked or not, what does an inexpensive Chardonnay often contain?"
      choices:
        - { text: "Noticeable grape tannin", correct: false }
        - { text: "A little residual sugar", correct: true }
        - { text: "A share of Muscat for perfume", correct: false }
        - { text: "A high level of malic acid", correct: false }
      explanation: |
        A few grams of sugar soften the palate and lift the sense of ripe
        fruit, which many drinkers like even in a wine sold as dry.

  - id: white-bulk-pinot-grigio-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, pinot-grigio]
    status: reviewed
    source_id: c08-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits a high-volume, inexpensive Pinot Grigio?"
      choices:
        - { text: "Full body, low acidity, honey and spice", correct: false }
        - { text: "Medium body, high acidity, gooseberry and grass", correct: false }
        - { text: "Light body, medium acidity, light pear drop", correct: true }
        - { text: "Medium body, low acidity, lychee and rose", correct: false }
      explanation: |
        Much of it comes from high-yielding vineyards on the plains of
        north-east Italy. The richer, spicier Pinot Gris of Alsace comes from
        riper, lower-yielding grapes.

  - id: white-bulk-sauvignon-price-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, sauvignon-blanc]
    status: reviewed
    source_id: c08-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape is used for inexpensive varietal whites but is seldom seen at the very lowest price points?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Chardonnay", correct: false }
        - { text: "Trebbiano", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
      explanation: |
        Demand driven by Marlborough's success lets Sauvignon Blanc command a
        small premium over the cheapest Chardonnay and Pinot Grigio.

  - id: white-bulk-sauvignon-vigour-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, sauvignon-blanc]
    status: reviewed
    source_id: c08-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides consumer demand, which vine trait makes Sauvignon Blanc practical for high-volume whites?"
      choices:
        - { text: "Thick skins that resist rot", correct: false }
        - { text: "Vigour that supports high yields", correct: true }
        - { text: "Natural resistance to powdery mildew", correct: false }
        - { text: "Low acidity that needs no adjustment", correct: false }
      explanation: |
        Sauvignon Blanc grows vigorously and crops generously, especially on
        fertile soils. Its thin-skinned, tight bunches are actually prone to
        botrytis, and it is susceptible to powdery mildew.

  - id: white-bulk-sauvignon-underripe-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, sauvignon-blanc]
    status: reviewed
    source_id: c08-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "If Sauvignon Blanc for an inexpensive white is picked underripe, which character tends to dominate?"
      choices:
        - { text: "Passion fruit and guava", correct: false }
        - { text: "Honeyed, waxy notes", correct: false }
        - { text: "Smoky, flinty notes", correct: false }
        - { text: "Herbaceous, grassy notes", correct: true }
      explanation: |
        Methoxypyrazines, the compounds behind green pepper and cut grass, are
        highest in unripe berries and break down with sunlight and ripeness.
        A little adds freshness; too much tastes raw.

  - id: white-bulk-whole-bunch-rare-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, pressing]
    status: reviewed
    source_id: c08-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are grapes for high-volume, inexpensive whites usually destemmed and crushed rather than whole-bunch pressed?"
      choices:
        - { text: "Bulk presses cannot load whole bunches", correct: false }
        - { text: "It is slower and needs hand-picked bunches", correct: true }
        - { text: "Whole-bunch juice needs much longer settling", correct: false }
        - { text: "Whole bunches add bitter stem tannin to juice", correct: false }
      explanation: |
        Machine harvesters shake loose berries off the stalks, so intact
        bunches only come from hand picking. Crushing also speeds up the press
        cycle and raises the juice yield, both vital at large volumes.

  - id: white-bulk-chardonnay-acidify-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, acidity]
    status: reviewed
    source_id: c08-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In hot bulk-wine regions, which white grape is most often in need of added acid?"
      choices:
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Colombard", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Grown hot, Chardonnay loses acidity fast and can taste flat and
        flabby. Colombard and Riesling hold their acidity well in heat, which
        is why Colombard is valued in warm regions such as South Africa and
        Gascony.

  - id: white-bulk-commercial-yeast-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, fermentation]
    status: reviewed
    source_id: c08-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do producers of high-volume, inexpensive whites usually inoculate with selected commercial yeast?"
      choices:
        - { text: "To add complexity from many yeast strains", correct: false }
        - { text: "To leave residual sugar without chilling", correct: false }
        - { text: "To trigger malolactic conversion early", correct: false }
        - { text: "For a quick, predictable fermentation", correct: true }
      explanation: |
        A strong, known strain starts fast and finishes dry in cool stainless
        steel, which frees tanks quickly and avoids the off-flavours of a
        stuck ferment. Some strains are also chosen to boost fruity esters.

  - id: white-bulk-chardonnay-mlf-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, mlf]
    status: reviewed
    source_id: c08-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Among high-volume, inexpensive whites, which variety is the likeliest to go through malolactic conversion?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Malolactic conversion softens acidity and can add buttery diacetyl,
        a profile that many drinkers expect from Chardonnay. The other three
        rely on crisp acidity and fresh primary fruit, so MLF is usually
        blocked.

  - id: white-bulk-sweetness-reserve-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, sweetness]
    status: reviewed
    source_id: c08-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do large-volume producers usually set the exact sweetness of an off-dry white?"
      choices:
        - { text: "Add fortifying spirit to stop the yeast", correct: false }
        - { text: "Blend in some botrytised sweet wine", correct: false }
        - { text: "Add grape juice or RCGM after fermentation", correct: true }
        - { text: "Pick part of the crop later for more sugar", correct: false }
      explanation: |
        Fermenting dry first and then sweetening lets the cellar hit a target
        to the gram per litre. In Germany, unfermented juice kept for this is
        called Süssreserve. The sweetened wine is then usually sterile-filtered
        so no yeast can restart.

  - id: sweet-botrytis-grey-rot-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, disease]
    status: reviewed
    source_id: c08-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Botrytis cinerea can give noble rot on ripe grapes. Which damaging disease can the same fungus cause instead?"
      choices:
        - { text: "Downy mildew", correct: false }
        - { text: "Black rot", correct: false }
        - { text: "Grey rot", correct: true }
        - { text: "Powdery mildew", correct: false }
      explanation: |
        Grey rot breaks berries down instead of concentrating them, bringing
        mouldy, earthy taints, and its laccase enzyme browns the juice. Black rot
        and the two mildews come from other fungi or fungus-like organisms.

  - id: sweet-noble-rot-afternoon-drying-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, noble-rot, climate]
    status: reviewed
    source_id: c08-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Once noble rot has pierced the grape skins, how do dry, sunny afternoons help?"
      choices:
        - { text: "They kill the fungus so the skins can heal", correct: false }
        - { text: "They slow the fungus and let water escape", correct: true }
        - { text: "They push extra sugar from the leaves", correct: false }
        - { text: "They plump up the berries before picking", correct: false }
      explanation: |
        The fungus's fine filaments leave tiny holes in the skin. Warm, dry air
        keeps the infection in check and lets water evaporate through those holes,
        so the berries shrivel and concentrate instead of splitting into grey rot.

  - id: sweet-noble-rot-acid-concentration-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, noble-rot, acidity]
    status: reviewed
    source_id: c08-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can a wine from nobly rotten grapes keep high acidity despite intense sweetness?"
      choices:
        - { text: "Malolactic conversion adds extra acidity", correct: false }
        - { text: "Water loss concentrates acid along with sugar", correct: true }
        - { text: "Cool morning mists stop acid loss in ripening", correct: false }
        - { text: "Late picking raises malic acid in the berries", correct: false }
      explanation: |
        Shrivelling removes water, so sugar, acids and flavour compounds all rise
        in the juice that remains. The fungus does consume some acid, but the net
        result is still a concentrated, well-structured must, as a racy Mosel
        Trockenbeerenauslese shows.

  - id: sweet-noble-rot-own-flavours-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, noble-rot, flavour]
    status: reviewed
    source_id: c08-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides concentrating the juice, what does noble rot add to a sweet wine?"
      choices:
        - { text: "Tannin extracted from broken skins", correct: false }
        - { text: "Extra alcohol before fermentation starts", correct: false }
        - { text: "Distinctive flavours of its own", correct: true }
        - { text: "A natural yeast culture for the ferment", correct: false }
      explanation: |
        Botrytis changes the grape's chemistry, producing glycerol, gluconic acid
        and aromas often likened to honey, marmalade or saffron. That is why a
        Trockenbeerenauslese tastes different from an equally sweet Eiswein made
        from healthy fruit.

  - id: sweet-botrytis-aroma-profile-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, flavour]
    status: reviewed
    source_id: c08-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aroma group is typical of a sweet wine from nobly rotten grapes?"
      choices:
        - { text: "Honey, apricot and citrus zest", correct: true }
        - { text: "Lychee, rose petal and ginger", correct: false }
        - { text: "Butter, toast and vanilla", correct: false }
        - { text: "Gooseberry, grass and green pepper", correct: false }
      explanation: |
        Dried fruit and marmalade often join these notes. Sauternes, Tokaji Aszú
        and German Trockenbeerenauslese share this botrytis signature even though
        they are made from different grapes.

  - id: sweet-noble-rot-several-passes-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, harvest]
    status: reviewed
    source_id: c08-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is a noble-rot vineyard often picked by hand in several passes?"
      choices:
        - { text: "Appellation rules set a minimum number of passes", correct: false }
        - { text: "The fungus spreads unevenly through the bunches", correct: true }
        - { text: "Each pass waits for a fresh overnight frost", correct: false }
        - { text: "Pickers make one pass for each grape variety", correct: false }
      explanation: |
        Berries reach the ideal shrivelled stage at different times, even within
        one bunch, so pickers return to take only the ready fruit. At Château
        d'Yquem the successive passes can stretch over several weeks.

  - id: sweet-noble-rot-harvest-cost-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, harvest, cost]
    status: reviewed
    source_id: c08-0108
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides repeated hand-picking, what else makes nobly rotten sweet wine costly to produce?"
      choices:
        - { text: "Heavy fungicide spraying in autumn", correct: false }
        - { text: "Very low yield per vine", correct: true }
        - { text: "Compulsory new oak barrels", correct: false }
        - { text: "Long bottle ageing before release", correct: false }
      explanation: |
        Shrivelled berries hold very little juice, so each vine gives a small
        fraction of a normal crop. Château d'Yquem is often said to make about one
        glass of wine per vine.

  - id: sweet-sauternes-vintage-variation-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, sauternes, vintage]
    status: reviewed
    source_id: c08-0109
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does the output of top sweet Sauternes vary so much from one vintage to the next?"
      choices:
        - { text: "Noble rot does not arrive every autumn", correct: true }
        - { text: "Spring frost often destroys the crop", correct: false }
        - { text: "Summer hail is frequent in the Sauternais", correct: false }
        - { text: "Autumn heat burns off the acidity", correct: false }
      explanation: |
        Without the right mix of misty mornings and dry afternoons, the rot may
        not spread, or it may turn grey. Leading estates sometimes skip a vintage:
        Château d'Yquem released no grand vin in 1992 or 2012.

  - id: sweet-noble-rot-too-wet-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, grey-rot, climate]
    status: reviewed
    source_id: c08-0110
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a noble-rot vineyard, what usually happens if the autumn stays wet instead of drying out?"
      choices:
        - { text: "Noble rot spreads faster and more evenly", correct: false }
        - { text: "The berries shrivel faster on the vine", correct: false }
        - { text: "Grey rot takes over and splits the berries", correct: true }
        - { text: "The fungus stops and the berries stay healthy", correct: false }
      explanation: |
        Without drying spells, Botrytis keeps growing, berries swell and burst,
        and the wounds let in acetic bacteria and other rots. The grower then
        faces heavy sorting losses rather than concentration.

  - id: sweet-passerillage-term-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, passerillage, terminology]
    status: reviewed
    source_id: c08-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which term describes ripe grapes left to dry and shrivel on the vine?"
      choices:
        - { text: "Appassimento", correct: false }
        - { text: "Passerillage", correct: true }
        - { text: "Pourriture noble", correct: false }
        - { text: "Mutage", correct: false }
      explanation: |
        Unlike appassimento, the bunches are not picked first: the berries lose
        water while still hanging. Sweet Jurançon from Petit Manseng is a classic
        example.

  - id: sweet-passerillage-weather-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, passerillage, climate]
    status: reviewed
    source_id: c08-0113
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which autumn weather lets grapes shrivel on the vine without rotting?"
      choices:
        - { text: "Warm and dry", correct: true }
        - { text: "Misty mornings, sunny afternoons", correct: false }
        - { text: "Cold enough to freeze the berries", correct: false }
        - { text: "Mild, with steady drizzle", correct: false }
      explanation: |
        Dry air draws water from the berries while denying fungi the moisture
        they need. If rain or humidity sets in, the shrivelling fruit is exposed
        to grey rot.

  - id: sweet-passerillage-wine-profile-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, passerillage, style]
    status: reviewed
    source_id: c08-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile is typical of a sweet white made from grapes shrivelled on the vine?"
      choices:
        - { text: "Honey, marmalade and saffron notes", correct: false }
        - { text: "Pure varietal fruit with piercing acidity", correct: false }
        - { text: "Rich texture with dried and tropical fruit", correct: true }
        - { text: "Nutty notes from long oxidative ageing", correct: false }
      explanation: |
        Overripe fruit gives notes such as dried apricot, pineapple or mango, and
        the concentrated juice feels thick in the mouth. Without botrytis, these
        wines lack the honey and marmalade layer of a Sauternes.

  - id: sweet-late-harvest-label-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, passerillage, labelling]
    status: reviewed
    source_id: c08-0115
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which English label term often marks a sweet wine from grapes left to shrivel on the vine?"
      choices:
        - { text: "Icewine", correct: false }
        - { text: "Late Harvest", correct: true }
        - { text: "Straw Wine", correct: false }
        - { text: "Cream", correct: false }
      explanation: |
        Late harvest wines vary widely, and some include botrytised berries too.
        Alsace uses Vendanges Tardives for a similar idea; German Spätlese means
        "late picked" but is a must-weight category that can also be dry.

  - id: sweet-dried-grapes-rot-removal-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, rot]
    status: reviewed
    source_id: c08-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "While picked grapes are drying for sweet wine, why are rotting bunches removed?"
      choices:
        - { text: "They would dry too fast and scorch", correct: false }
        - { text: "Their juice would dilute the final must", correct: false }
        - { text: "They would add bitter tannin at pressing", correct: false }
        - { text: "Rot would spread to neighbouring bunches", correct: true }
      explanation: |
        Bunches sit close together for weeks or months in drying rooms, so one
        mouldy cluster can contaminate many. Many Valpolicella producers add fans
        and humidity control to their drying lofts for the same reason.

  - id: sweet-dried-grapes-storage-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, climate]
    status: reviewed
    source_id: c08-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which conditions best suit grapes being dried indoors after the harvest?"
      choices:
        - { text: "Dry, airy and fairly warm", correct: true }
        - { text: "Cool and humid, to slow the drying", correct: false }
        - { text: "Cold and still, in a closed cellar", correct: false }
        - { text: "Sealed and dark, under inert gas", correct: false }
      explanation: |
        Air movement carries away the moisture leaving the berries, and dryness
        keeps fungi at bay. Bunches traditionally lay on straw mats or cane racks,
        or hung from rafters, in lofts open to the breeze.

  - id: sweet-passito-term-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, italy, terminology]
    status: reviewed
    source_id: c08-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Italian term names a sweet wine made from grapes dried after picking?"
      choices:
        - { text: "Vendemmia tardiva", correct: false }
        - { text: "Ripasso", correct: false }
        - { text: "Passito", correct: true }
        - { text: "Amabile", correct: false }
      explanation: |
        The drying stage itself is called appassimento. Passito wines are made
        across Italy, from Malvasia delle Lipari to Passito di Pantelleria from
        Zibibbo (Muscat of Alexandria).

  - id: sweet-recioto-dried-grapes-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, italy]
    status: reviewed
    source_id: c08-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which of these sweet wines is made from grapes dried after the harvest?"
      choices:
        - { text: "Sauternes", correct: false }
        - { text: "Recioto della Valpolicella", correct: true }
        - { text: "Mosel Eiswein", correct: false }
        - { text: "Trockenbeerenauslese", correct: false }
      explanation: |
        Corvina-led bunches dry for months before a slow ferment that stops with
        sugar left. Sauternes and Trockenbeerenauslese rely on noble rot, and
        Eiswein on grapes frozen on the vine.

  - id: sweet-passito-raisined-character-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, style]
    status: reviewed
    source_id: c08-0119
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aroma set is typical of a sweet passito wine?"
      choices:
        - { text: "Honey, marmalade and saffron notes", correct: false }
        - { text: "Pure varietal fruit with piercing acidity", correct: false }
        - { text: "Tropical fruit with a rich texture", correct: false }
        - { text: "Raisin, fig and prune notes", correct: true }
      explanation: |
        Months of shrivelling off the vine give cooked, raisined fruit. In a
        Tuscan Vin Santo this shows as raisin, dried apricot and nuts over a
        sweet, full palate.

  - id: sweet-icewine-harvest-timing-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, icewine, harvest]
    status: reviewed
    source_id: c08-0120
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When are grapes for traditional icewine usually picked?"
      choices:
        - { text: "Just after the first light autumn frost", correct: false }
        - { text: "In autumn, once noble rot has spread", correct: false }
        - { text: "Once a hard freeze sets in, often in winter", correct: true }
        - { text: "At normal harvest, then frozen in a cold room", correct: false }
      explanation: |
        Healthy bunches hang for weeks or months until the water in the berries
        freezes solid. Canadian rules require picking at about −8 °C or colder,
        so crews often work at night or at dawn.

  - id: sweet-icewine-pressing-concentration-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, icewine, pressing]
    status: reviewed
    source_id: c08-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is the juice so sweet when frozen grapes are pressed for icewine?"
      choices:
        - { text: "Much of the water stays behind as ice", correct: true }
        - { text: "Cold weather turns the grapes' acids into sugar", correct: false }
        - { text: "Frost sends extra sugar from the vine to the berries", correct: false }
        - { text: "Noble rot has already shrivelled the berries", correct: false }
      explanation: |
        Only the concentrated, unfrozen part of the juice flows from the press,
        so yields are tiny. In Canada, thick-skinned Vidal is widely used
        because it hangs well into the winter.

  - id: sweet-icewine-country-term-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, icewine, labelling]
    status: reviewed
    source_id: c08-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pairing of country and label term fits wine from grapes frozen on the vine?"
      choices:
        - { text: "Hungary — Aszú", correct: false }
        - { text: "Canada — Icewine", correct: true }
        - { text: "Italy — Passito", correct: false }
        - { text: "Austria — Ausbruch", correct: false }
      explanation: |
        Germany and Austria use Eiswein. Ontario's Niagara Peninsula is Canada's
        best-known source, often from Vidal or Riesling. Aszú and Ausbruch refer
        to botrytised berries, Passito to grapes dried after picking.

  - id: sweet-cryoextraction-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, icewine, cryoextraction]
    status: reviewed
    source_id: c08-0124
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a producer make an icewine-style wine without waiting for a winter freeze?"
      choices:
        - { text: "Pick at the first light autumn frost", correct: false }
        - { text: "Add ice to the press to chill the must", correct: false }
        - { text: "Spray the vines with water before a frost", correct: false }
        - { text: "Freeze picked grapes before pressing", correct: true }
      explanation: |
        Artificial freezing, sometimes called cryoextraction, concentrates the
        juice in the same way, but the wine may not use the protected terms
        Icewine or Eiswein. Bonny Doon's Vin de Glacière, from Muscat frozen after
        picking, was a well-known Californian example.

  - id: sweet-high-sugar-ferment-stops-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, fermentation, sweet]
    status: reviewed
    source_id: c08-0125
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do ferments of very concentrated sweet-wine musts often stop with plenty of sugar left?"
      choices:
        - { text: "Concentrated acidity poisons the yeast", correct: false }
        - { text: "Very high sugar puts the yeast under stress", correct: true }
        - { text: "The dense juice holds too little oxygen", correct: false }
        - { text: "Grape tannin builds up and halts the yeast", correct: false }
      explanation: |
        Sugar draws water out of yeast cells, and noble rot can also strip
        nutrients from the must, so fermentation may crawl for weeks and stall
        early. Producers often accept that natural stop, then stabilise the wine.

  - id: white-aromatic-careful-handling-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, aromatic, handling]
    status: reviewed
    source_id: c08-0126
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is fruit for a fresh aromatic white such as Muscat handled gently and kept cool?"
      choices:
        - { text: "To keep its fresh fruit and floral aromas", correct: true }
        - { text: "To extract more tannin from the skins", correct: false }
        - { text: "To encourage early browning for texture", correct: false }
        - { text: "To prepare the juice for malolactic conversion", correct: false }
      explanation: |
        Volatile aroma compounds are lost to heat, oxygen and rough handling.
        Night picking, chilled transport and handling under inert gas help a
        Muscat or Riesling keep the smell of fresh grapes.

  - id: white-aromatic-gentle-settling-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, aromatic, clarification]
    status: reviewed
    source_id: c08-0131
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which clarification is typical for aromatic white juice before fermentation?"
      choices:
        - { text: "Gentle settling, then racking off", correct: true }
        - { text: "Fining with egg whites", correct: false }
        - { text: "Sterile membrane filtration", correct: false }
        - { text: "Long contact with the gross lees", correct: false }
      explanation: |
        The juice is chilled so solids sink over a day or so, then the clear
        juice is drawn off. Egg-white fining is a red-wine tannin treatment, and
        a sterile membrane would clog on cloudy juice.

  - id: white-aromatic-steel-fermentation-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, aromatic, vessels]
    status: reviewed
    source_id: c08-0132
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do most producers ferment fresh aromatic whites in stainless steel rather than new oak?"
      choices:
        - { text: "It allows a warm ferment for richness", correct: false }
        - { text: "It keeps the wine on its gross lees", correct: false }
        - { text: "It adds little flavour of its own", correct: true }
        - { text: "It speeds malolactic conversion", correct: false }
      explanation: |
        Steel lets the grape's own aromas lead and makes temperature control
        easy. In a dry Clare Valley Riesling or an Alsace Muscat, oak spice would
        only compete with the fruit.

  - id: white-alsace-riesling-foudre-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, alsace, vessels]
    status: reviewed
    source_id: c08-0133
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do some Alsace Riesling producers ferment in large, old oak foudres?"
      choices:
        - { text: "To keep the wine sealed from air", correct: false }
        - { text: "To speed malolactic conversion", correct: false }
        - { text: "To cool the ferment faster", correct: false }
        - { text: "To let in a touch of oxygen", correct: true }
      explanation: |
        Decades of use and a thick tartrate lining leave the wood almost
        flavour-neutral, yet slight oxygen exchange still rounds the texture.
        Hugel still uses a cask dating from 1715.

  - id: sweet-riesling-botrytis-ferment-end-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, botrytis, fermentation]
    status: reviewed
    source_id: c08-0136
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Roughly what alcohol does a German Trockenbeerenauslese usually reach?"
      choices:
        - { text: "About 6–8% abv", correct: true }
        - { text: "About 10–11% abv", correct: false }
        - { text: "About 12–13% abv", correct: false }
        - { text: "About 14–15% abv", correct: false }
      explanation: |
        The law asks for as little as 5.5% abv, and much of the sugar stays
        unfermented, which keeps these wines light in alcohol yet intensely sweet.
        A Sauternes, by contrast, usually ferments on to around 13–14%.

  - id: white-riesling-sauvignon-no-mlf-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, malolactic, riesling, sauvignon-blanc]
    status: reviewed
    source_id: c08-0137
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do most Riesling and Sauvignon Blanc producers avoid malolactic conversion?"
      choices:
        - { text: "It would add tannin and deepen the colour", correct: false }
        - { text: "It would soften acidity and add buttery notes", correct: true }
        - { text: "It would raise alcohol and add sweetness", correct: false }
        - { text: "It would strip out the wine's protective SO₂", correct: false }
      explanation: |
        Both grapes are prized for crisp acidity and vivid varietal fruit.
        Diacetyl, the buttery by-product, would blur the lime of a Riesling or the
        passion fruit of a Marlborough Sauvignon.

  - id: white-riesling-lees-contact-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, lees]
    status: reviewed
    source_id: c08-0138
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "After fermentation, which option can add texture and flavour to a Riesling?"
      choices:
        - { text: "Skin maceration after fermentation", correct: false }
        - { text: "Micro-oxygenation in tank", correct: false }
        - { text: "Time on the fine lees", correct: true }
        - { text: "Chips of heavily toasted oak", correct: false }
      explanation: |
        Yeast cells break down slowly, releasing compounds that round the palate
        and add a subtle savoury note. Some producers stir the lees; others leave
        the wine undisturbed on them through the winter.

  - id: white-riesling-oak-duration-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, oak, maturation]
    status: reviewed
    source_id: c08-0139
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Alsace and Germany, how long is Riesling commonly kept in large old oak before bottling?"
      choices:
        - { text: "About three years", correct: false }
        - { text: "About four to five years", correct: false }
        - { text: "About 18 months to two years", correct: false }
        - { text: "Up to about a year", correct: true }
      explanation: |
        Mosel Fuder hold about 1,000 litres and Alsace foudres often far more,
        so oxygen and oak influence stay low. Many such wines are bottled in the
        spring or summer after harvest to keep their fruit fresh.

  - id: white-sauvignon-barrel-style-profile-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, oak, style]
    status: reviewed
    source_id: c08-0140
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a Fumé Blanc or white Graves style of Sauvignon Blanc usually differ from crisp Marlborough?"
      choices:
        - { text: "It is creamier and spicier", correct: true }
        - { text: "It is leaner and more herbaceous", correct: false }
        - { text: "It is sweeter and more floral", correct: false }
        - { text: "It is lighter and more pungent", correct: false }
      explanation: |
        Oak adds sweet spice and toast, lees give a rounder palate, and the green,
        pungent notes recede. White Pessac-Léognan and Robert Mondavi's Fumé Blanc
        are well-known examples.

  - id: white-sauvignon-barrel-style-techniques-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, oak, lees]
    status: reviewed
    source_id: c08-0140
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cellar programme builds a rich, complex style of Sauvignon Blanc?"
      choices:
        - { text: "Cool steel ferment and early bottling", correct: false }
        - { text: "Carbonic maceration in sealed tanks", correct: false }
        - { text: "Barrel ferment, lees ageing, some new oak", correct: true }
        - { text: "Sweet reserve and sterile filtration", correct: false }
      explanation: |
        Some producers also use ambient yeasts for complexity, and a few allow
        partial malolactic conversion. The share of new oak is usually kept modest
        so the wood does not bury the fruit.

  - id: white-chardonnay-cellar-scope-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, style]
    status: reviewed
    source_id: c08-0141
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape gives the winemaker the most room to shape the wine's flavour in the cellar?"
      choices:
        - { text: "Muscat", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Gewurztraminer", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
      explanation: |
        Its fairly neutral varietal aroma leaves space for oak, lees and
        malolactic notes to build the style. The same grape gives steely, unoaked
        Chablis and rich, barrel-aged Meursault.

  - id: white-neutral-grape-pure-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, style, vessels]
    status: reviewed
    source_id: c08-0143
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A producer wants a Chardonnay that tastes mainly of grape and site. Which cellar approach fits best?"
      choices:
        - { text: "Minimal intervention in inert vessels", correct: true }
        - { text: "Barrel fermentation with lees stirring", correct: false }
        - { text: "Long ageing in new small oak", correct: false }
        - { text: "Extended skin contact before pressing", correct: false }
      explanation: |
        With little added, the wine shows the grape's citrus or orchard fruit and
        the site's acidity. The other route layers barrel fermentation, lees work
        and malolactic conversion on the same fruit.

  - id: white-chardonnay-spring-frost-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, frost, viticulture]
    status: reviewed
    source_id: c08-0144
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is Chardonnay especially exposed to spring frost?"
      choices:
        - { text: "It flowers very late", correct: false }
        - { text: "It ripens late in autumn", correct: false }
        - { text: "It buds early", correct: true }
        - { text: "Its skins are thin", correct: false }
      explanation: |
        Tender new shoots appear while frost risk is still high. Chablis growers
        protect them with heaters and with sprinklers that coat the buds in a
        protective layer of ice.

  - id: white-chardonnay-climate-range-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate]
    status: reviewed
    source_id: c08-0145
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape ripens successfully across the widest range of climates, from cool to hot?"
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Gewurztraminer", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay", correct: true }
      explanation: |
        It ripens from Chablis and Champagne to warm parts of California and
        Australia, one reason it is so widely planted. Its style shifts with the
        climate rather than failing outright.

  - id: white-chardonnay-cool-climate-fruit-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate, flavour]
    status: reviewed
    source_id: c08-0146
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fruit flavours are typical of an unoaked Chardonnay from a cool climate?"
      choices:
        - { text: "White peach and melon", correct: false }
        - { text: "Green apple and lemon", correct: true }
        - { text: "Banana and pineapple", correct: false }
        - { text: "Apricot and honey", correct: false }
      explanation: |
        Slow ripening keeps acidity high and the fruit at the apple, pear and
        citrus end. Chablis is the classic case.

  - id: white-chardonnay-moderate-climate-fruit-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate, flavour]
    status: reviewed
    source_id: c08-0146
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fruit flavours are typical of Chardonnay from a moderate climate?"
      choices:
        - { text: "Green apple and lemon", correct: false }
        - { text: "Banana and pineapple", correct: false }
        - { text: "Apricot and honey", correct: false }
        - { text: "White peach and melon", correct: true }
      explanation: |
        Fuller ripeness moves the fruit into stone fruit and melon, with
        acidity still fresh. Many Mâconnais whites sit in this middle ground.

  - id: white-chardonnay-hot-climate-fruit-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate, flavour]
    status: reviewed
    source_id: c08-0146
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fruit flavours are typical of Chardonnay from a hot climate?"
      choices:
        - { text: "Banana and pineapple", correct: true }
        - { text: "Green apple and lemon", correct: false }
        - { text: "White peach and melon", correct: false }
        - { text: "Apricot and honey", correct: false }
      explanation: |
        High sugar and fast ripening push the fruit into tropical notes, often
        with lower acidity and higher alcohol, as in many Chardonnays from warm
        valley floors in California or inland Australia.

  - id: white-chardonnay-hot-harvest-acidity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate, harvest]
    status: reviewed
    source_id: c08-0147
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a hot region, why must the Chardonnay harvest be timed closely?"
      choices:
        - { text: "Its berries split and rot within days", correct: false }
        - { text: "Its aromas turn green and grassy", correct: false }
        - { text: "Its acidity can fall quickly", correct: true }
        - { text: "Its sugar drops soon after ripeness", correct: false }
      explanation: |
        In heat, the vine burns off malic acid quickly in the final weeks, so a
        few days' delay can leave the wine flat. Producers may pick early, pick at
        night, or acidify where the rules allow.

