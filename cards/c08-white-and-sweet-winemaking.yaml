        - { text: "Green apple and lemon", correct: true }
        - { text: "Banana and pineapple", correct: false }
        - { text: "Apricot and honey", correct: false }
      explanation: |
        Slow ripening keeps acidity high and the fruit at the apple, pear and
        citrus end. Chablis is the classic case.
    fr:
      question: "Quels arômes de fruits sont typiques d’un Chardonnay sans bois de climat frais ?"
      choices:
        - { text: "Pêche blanche et melon", correct: false }
        - { text: "Pomme verte et citron", correct: true }
        - { text: "Banane et ananas", correct: false }
        - { text: "Abricot et miel", correct: false }
      explanation: |
        Une maturation lente garde une acidité élevée et un fruit du côté pomme, poire
        et agrumes. Chablis en est l’exemple classique.

  - id: white-chardonnay-moderate-climate-fruit-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate, flavour]
