cards:
  - id: white-chardonnay-australia-regions-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, chardonnay, australia]
    status: reviewed
    source_id: c08-0151
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of Australian regions has built a strong name for cool-climate Chardonnay?"
      choices:
        - { text: "Barossa Valley and McLaren Vale", correct: false }
        - { text: "Clare Valley and Coonawarra", correct: false }
        - { text: "Adelaide Hills and Mornington Peninsula", correct: true }
        - { text: "Rutherglen and Heathcote", correct: false }
      explanation: |
        Altitude in the Adelaide Hills and sea breezes off Port Phillip and Western Port
        Bays on the Mornington Peninsula keep Chardonnay fresh and taut. Geelong, also near
        Port Phillip Bay, has a similar reputation. Barossa and McLaren Vale are Shiraz
        country, Clare is best known for Riesling, Coonawarra for Cabernet, and Rutherglen
        for fortified Muscat.
    fr:
      question: "Quel duo de régions australiennes s’est fait un nom pour ses Chardonnay de climat frais ?"
      choices:
        - { text: "Barossa Valley et McLaren Vale", correct: false }
        - { text: "Clare Valley et Coonawarra", correct: false }
        - { text: "Adelaide Hills et Mornington Peninsula", correct: true }
        - { text: "Rutherglen et Heathcote", correct: false }
      explanation: |
        L’altitude des Adelaide Hills et, sur la Mornington Peninsula, les brises venues des
        baies de Port Phillip et de Western Port gardent au Chardonnay fraîcheur et tension.
        Geelong, elle aussi au bord de Port Phillip Bay, a une réputation voisine. Barossa et
        McLaren Vale sont des terres de Shiraz, Clare est surtout connue pour le Riesling,
        Coonawarra pour le Cabernet et Rutherglen pour ses Muscats mutés.

  - id: white-chardonnay-chile-region-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, chardonnay, chile]
    status: reviewed
    source_id: c08-0151
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Chilean valley has the strongest reputation for fresh Chardonnay?"
      choices:
        - { text: "Casablanca Valley", correct: true }
        - { text: "Maipo Valley", correct: false }
        - { text: "Colchagua Valley", correct: false }
        - { text: "Cachapoal Valley", correct: false }
      explanation: |
        Casablanca sits between Santiago and the coast, where cold Humboldt Current air and
        morning fog slow ripening. Maipo, Colchagua and Cachapoal are warmer inland valleys
        better known for Cabernet Sauvignon, Carmenère and other reds.
    fr:
      question: "Quelle vallée chilienne a la meilleure réputation pour des Chardonnay frais ?"
      choices:
        - { text: "Vallée de Casablanca", correct: true }
        - { text: "Vallée du Maipo", correct: false }
        - { text: "Vallée de Colchagua", correct: false }
        - { text: "Vallée du Cachapoal", correct: false }
      explanation: |
        Casablanca se trouve entre Santiago et la côte : l’air froid du courant de Humboldt
        et les brouillards du matin y ralentissent la maturation. Maipo, Colchagua et
        Cachapoal sont des vallées intérieures plus chaudes, surtout connues pour le Cabernet
        Sauvignon, le Carmenère et d’autres rouges.

  - id: white-chardonnay-nz-regions-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, chardonnay, new-zealand]
    status: reviewed
    source_id: c08-0151
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which New Zealand region built its early name on Chardonnay?"
      choices:
        - { text: "Central Otago", correct: false }
        - { text: "Gisborne", correct: true }
        - { text: "Martinborough", correct: false }
        - { text: "Waipara", correct: false }
      explanation: |
        Sunny Gisborne, on the east coast of the North Island, built its name on ripe,
        generous Chardonnay. Marlborough is dominated by Sauvignon Blanc but also grows
        plenty of Chardonnay, for still and sparkling wines. Central Otago and
        Martinborough are best known for Pinot Noir, Waipara for Pinot Noir and Riesling.
    fr:
      question: "Quelle région néo-zélandaise s’est d’abord fait un nom avec le Chardonnay ?"
      choices:
        - { text: "Central Otago", correct: false }
        - { text: "Gisborne", correct: true }
        - { text: "Martinborough", correct: false }
        - { text: "Waipara", correct: false }
      explanation: |
        Ensoleillée, sur la côte est de l’île du Nord, Gisborne a bâti sa réputation sur des
        Chardonnay mûrs et généreux. Marlborough est dominée par le Sauvignon Blanc mais plante
        aussi beaucoup de Chardonnay, pour les vins tranquilles comme pour les effervescents.
        Central Otago et Martinborough sont surtout connues pour le Pinot Noir, Waipara pour le
        Pinot Noir et le Riesling.

  - id: white-pinot-gris-cycle-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, viticulture]
    status: reviewed
    source_id: c08-0152
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Pinot Gris behave over the growing season?"
      choices:
        - { text: "Late budburst and late ripening", correct: false }
        - { text: "Early budburst but late ripening", correct: false }
        - { text: "Late budburst but early ripening", correct: false }
        - { text: "Early budburst and early ripening", correct: true }
      explanation: |
        Like Pinot Noir, of which it is a colour mutation, Pinot Gris starts and finishes early. Early budburst
        exposes the young shoots to spring frost, while early ripening lets it reach full
        maturity in cool places such as Alsace, Oregon and Tasmania.
    fr:
      question: "Comment le Pinot Gris se comporte-t-il au fil du cycle végétatif ?"
      choices:
        - { text: "Débourrement tardif et maturité tardive", correct: false }
        - { text: "Débourrement précoce mais maturité tardive", correct: false }
        - { text: "Débourrement tardif mais maturité précoce", correct: false }
        - { text: "Débourrement précoce et maturité précoce", correct: true }
      explanation: |
        Comme le Pinot Noir, dont il est une mutation de couleur, le Pinot Gris démarre et
        finit tôt. Le débourrement précoce expose les jeunes pousses aux gelées de printemps ;
        la maturité précoce lui permet de mûrir pleinement dans des régions fraîches comme
        l’Alsace, l’Oregon ou la Tasmanie.

  - id: white-pinot-gris-ripeness-balance-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, viticulture]
    status: reviewed
    source_id: c08-0152
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do sugar and acidity change in Pinot Gris as it ripens?"
      choices:
        - { text: "Sugar rises slowly; acidity holds well", correct: false }
        - { text: "Sugar rises quickly; acidity falls fast", correct: true }
        - { text: "Sugar rises quickly; acidity holds well", correct: false }
        - { text: "Sugar rises slowly; acidity falls fast", correct: false }
      explanation: |
        Pinot Gris can reach high sugar levels, but it loses much of its acidity on the way.
        That is why late-picked examples can be high in alcohol and feel heavy.
        Riesling, by contrast, keeps high acidity even at high sugar levels.
    fr:
      question: "Comment évoluent le sucre et l’acidité du Pinot Gris au cours de la maturation ?"
      choices:
        - { text: "Sucre qui monte lentement ; acidité qui se maintient", correct: false }
        - { text: "Sucre qui monte vite ; acidité qui chute vite", correct: true }
        - { text: "Sucre qui monte vite ; acidité qui se maintient", correct: false }
        - { text: "Sucre qui monte lentement ; acidité qui chute vite", correct: false }
      explanation: |
        Le Pinot Gris peut atteindre des teneurs en sucre élevées, mais il perd une bonne
        part de son acidité en chemin. C’est pourquoi les cuvées récoltées tard peuvent être
        très alcooleuses et paraître lourdes. Le Riesling, lui, garde une acidité élevée même
        à forte maturité.

  - id: white-pinot-gris-colour-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris]
    status: reviewed
    source_id: c08-0153
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can wines from Pinot Gris show a deeper, more golden colour than most dry whites?"
      choices:
        - { text: "It is usually aged in new oak", correct: false }
        - { text: "Most bunches are botrytis-affected", correct: false }
        - { text: "It is picked later than other whites", correct: false }
        - { text: "Its pink-grey skins hold some pigment", correct: true }
      explanation: |
        Pinot Gris is a colour mutation of Pinot Noir. Even a short skin contact before or during pressing can deepen the colour; with longer
        skin contact the wine can turn coppery, as in Friuli's ramato style.
    fr:
      question: "Pourquoi les vins de Pinot Gris peuvent-ils avoir une couleur plus soutenue et plus dorée que la plupart des blancs secs ?"
      choices:
        - { text: "Il est en général élevé en fût neuf", correct: false }
        - { text: "La plupart des grappes sont botrytisées", correct: false }
        - { text: "Il est vendangé plus tard que les autres blancs", correct: false }
        - { text: "Sa peau gris rosé contient des pigments", correct: true }
      explanation: |
        Le Pinot Gris est une mutation de couleur du Pinot Noir. Même une courte macération
        pelliculaire avant ou pendant le pressurage peut foncer la couleur ; plus longue, elle
        donne au vin une teinte cuivrée, comme dans le style ramato du Frioul.

  - id: white-pinot-gris-alsace-aromas-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, alsace]
    status: reviewed
    source_id: c08-0153
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Alongside ripe tropical fruit, which accent often marks a rich Alsace Pinot Gris?"
      choices:
        - { text: "Petrol and lime zest", correct: false }
        - { text: "Gooseberry and cut grass", correct: false }
        - { text: "Ginger and honey", correct: true }
        - { text: "Green apple and lemon pith", correct: false }
      explanation: |
        Ripe Alsace Pinot Gris tends to be dry or off-dry, with an oily texture and medium
        acidity. Spice and honey come with that ripeness. Petrol and lime point to aged
        Riesling, gooseberry and grass to Sauvignon Blanc.
    fr:
      question: "Outre des fruits tropicaux mûrs, quelle note marque souvent un Pinot Gris d’Alsace riche ?"
      choices:
        - { text: "Pétrole et zeste de citron vert", correct: false }
        - { text: "Groseille à maquereau et herbe coupée", correct: false }
        - { text: "Gingembre et miel", correct: true }
        - { text: "Pomme verte et écorce de citron", correct: false }
      explanation: |
        Un Pinot Gris d’Alsace mûr est le plus souvent sec ou demi-sec, avec une texture
        onctueuse et une acidité moyenne. Les notes épicées et miellées viennent avec cette
        maturité. Pétrole et citron vert renvoient au Riesling évolué, groseille à maquereau
        et herbe au Sauvignon Blanc.

  - id: white-pinot-gris-nz-label-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, new-zealand]
    status: reviewed
    source_id: c08-0154
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which name do New Zealand producers usually put on the label for the grey-skinned mutation of Pinot Noir?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Grauburgunder", correct: false }
        - { text: "Pinot Gris", correct: true }
        - { text: "Malvoisie", correct: false }
      explanation: |
        Pinot Gris is one of New Zealand's most planted white grapes after Sauvignon Blanc
        and Chardonnay, and the French name is the norm there. Italy uses Pinot Grigio,
        Germany mainly Grauburgunder (or Ruländer for sweeter styles), and Hungary's
        traditional name is Szürkebarát.
    fr:
      question: "Sous quel nom les producteurs néo-zélandais étiquettent-ils en général la mutation à peau grise du Pinot Noir ?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Grauburgunder", correct: false }
        - { text: "Pinot Gris", correct: true }
        - { text: "Malvoisie", correct: false }
      explanation: |
        Le Pinot Gris est l’un des blancs les plus plantés de Nouvelle-Zélande après le
        Sauvignon Blanc et le Chardonnay, et le nom français y est la norme. L’Italie dit
        Pinot Grigio, l’Allemagne surtout Grauburgunder (ou Ruländer pour les styles plus
        doux), et le nom traditionnel hongrois est Szürkebarát.

  - id: white-pinot-gris-nz-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, new-zealand]
    status: reviewed
    source_id: c08-0155
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with a typical Alsace example, how does New Zealand Pinot Gris tend to differ?"
      choices:
        - { text: "More oak and lees character", correct: false }
        - { text: "Purer fruit, less honeyed richness", correct: true }
        - { text: "Leaner, bone-dry and more austere", correct: false }
        - { text: "Deeper colour and firmer phenolic grip", correct: false }
      explanation: |
        New Zealand examples usually put clean pear and stone-fruit flavours first. A
        little residual sugar is common, though both countries make wines from dry to
        off-dry.
    fr:
      question: "Par rapport à un Pinot Gris d’Alsace typique, en quoi celui de Nouvelle-Zélande diffère-t-il le plus souvent ?"
      choices:
        - { text: "Plus de bois et de caractère de lies", correct: false }
        - { text: "Fruit plus net, moins miellé", correct: true }
        - { text: "Plus tendu, bien sec et plus austère", correct: false }
        - { text: "Couleur plus foncée, amertume plus ferme", correct: false }
      explanation: |
        Les vins néo-zélandais mettent en général en avant des arômes nets de poire et de
        fruits à noyau. Un peu de sucre résiduel est fréquent, même si les deux pays produisent
        des vins allant du sec au demi-sec.

  - id: white-pinot-gris-tasmania-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, australia]
    status: reviewed
    source_id: c08-0156
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Australian region makes textured Pinot Gris closest to the Alsace style?"
      choices:
        - { text: "Hunter Valley", correct: false }
        - { text: "Barossa Valley", correct: false }
        - { text: "Margaret River", correct: false }
        - { text: "Tasmania", correct: true }
      explanation: |
        Tasmania is Australia's coolest wine state, so early-ripening Pinot Gris keeps
        enough freshness to carry a rich, textured style. Oregon's Willamette Valley is a
        similar case in the USA. Hunter is best known for Semillon, Barossa for Shiraz and
        Margaret River for Cabernet and Chardonnay.
    fr:
      question: "Quelle région australienne produit les Pinot Gris texturés les plus proches du style alsacien ?"
      choices:
        - { text: "Hunter Valley", correct: false }
        - { text: "Barossa Valley", correct: false }
        - { text: "Margaret River", correct: false }
        - { text: "Tasmanie", correct: true }
      explanation: |
        La Tasmanie est l’État viticole le plus frais d’Australie : le Pinot Gris, précoce,
        y garde assez de fraîcheur pour porter un style riche et texturé. La Willamette Valley,
        dans l’Oregon, offre un cas comparable aux États-Unis. Hunter est surtout connue pour
        le Sémillon, Barossa pour le Shiraz et Margaret River pour le Cabernet et le
        Chardonnay.

  - id: white-pinot-grigio-alpine-clone-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, italy, clones]
    status: reviewed
    source_id: c08-0160
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do the Pinot Grigio clones of Alto Adige and Trentino differ from those of the Veneto plains?"
      choices:
        - { text: "Larger berries, higher yields", correct: false }
        - { text: "Paler skins, more neutral juice", correct: false }
        - { text: "Smaller berries, more concentrated flavour", correct: true }
        - { text: "Later ripening, lower alcohol", correct: false }
      explanation: |
        Growers in Alto Adige and Trentino largely use the same clones as France and
        Germany. Small berries mean more skin relative to juice, which gives more
        concentrated flavour. Clone choice is a style lever in its own right, separate from
        site and vineyard work.
    fr:
      question: "En quoi les clones de Pinot Grigio du Haut-Adige et du Trentin diffèrent-ils de ceux des plaines de Vénétie ?"
      choices:
        - { text: "Baies plus grosses, rendements plus élevés", correct: false }
        - { text: "Peaux plus pâles, jus plus neutre", correct: false }
        - { text: "Baies plus petites, goût plus concentré", correct: true }
        - { text: "Maturité plus tardive, alcool plus bas", correct: false }
      explanation: |
        Dans le Haut-Adige et le Trentin, on plante surtout les mêmes clones qu’en France et
        en Allemagne. De petites baies offrent plus de peau par rapport au jus, d’où des
        saveurs plus concentrées. Le choix du clone est un levier de style à part entière,
        distinct du site et du travail à la vigne.

  - id: white-pinot-grigio-plains-clone-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [white, grapes, pinot-gris, italy, clones]
    status: reviewed
    source_id: c08-0161
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which clone traits lie behind the cheap, neutral Pinot Grigio of the Veneto plains?"
      choices:
        - { text: "Pale skins and small, thick-skinned berries", correct: false }
        - { text: "Deep pink skins and large, fleshy berries", correct: false }
        - { text: "Pale skins and large, fleshy berries", correct: true }
        - { text: "Deep pink skins and small berries", correct: false }
      explanation: |
        Lots of pulp and little skin flavour suit volume production. High yields and early
        picking on the fertile plains strip out what character remains, which is why these
        wines are light and neutral.
    fr:
      question: "Quels caractères de clone sont à l’origine du Pinot Grigio bon marché et neutre des plaines de Vénétie ?"
      choices:
        - { text: "Peaux pâles et petites baies à peau épaisse", correct: false }
        - { text: "Peaux rose foncé et grosses baies charnues", correct: false }
        - { text: "Peaux pâles et grosses baies charnues", correct: true }
        - { text: "Peaux rose foncé et petites baies", correct: false }
      explanation: |
        Beaucoup de pulpe et peu de saveur venue de la peau conviennent aux gros volumes.
        Les rendements élevés et les vendanges précoces sur ces plaines fertiles effacent le
        peu de caractère qui reste : d’où des vins légers et neutres.

  - id: white-chardonnay-whole-bunch-press-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, chardonnay, pressing]
    status: reviewed
    source_id: c08-0162
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are quality Chardonnay grapes most commonly handled on arrival at the winery?"
      choices:
        - { text: "Destemmed, crushed and fermented on skins", correct: false }
        - { text: "Destemmed and left on skins for several days", correct: false }
        - { text: "Crushed and macerated cold for a week", correct: false }
        - { text: "Loaded whole into the press", correct: true }
      explanation: |
        Whole-bunch pressing is gentle: the stems form drainage channels, so clear juice
        runs off with little extraction of bitter phenolics from skins and seeds. The same
        approach is standard for base wines in Champagne.
    fr:
      question: "Comment traite-t-on le plus souvent le Chardonnay de qualité à son arrivée au chai ?"
      choices:
        - { text: "Éraflé, foulé et fermenté sur peaux", correct: false }
        - { text: "Éraflé et laissé sur peaux plusieurs jours", correct: false }
        - { text: "Foulé puis macéré à froid une semaine", correct: false }
        - { text: "Pressé en grappes entières", correct: true }
      explanation: |
        Le pressurage en grappes entières est doux : les rafles forment des drains, si bien
        qu’un jus clair s’écoule en extrayant peu de composés phénoliques amers des peaux et
        des pépins. C’est aussi la règle pour les vins de base en Champagne.

  - id: white-short-skin-contact-oxidation-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white]
    status: reviewed
    source_id: c08-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is white juice usually separated from its skins soon after the grapes reach the winery?"
      choices:
        - { text: "To speed up the press cycle", correct: false }
        - { text: "To stop fermentation starting on the skins", correct: false }
        - { text: "To limit oxidation of the juice", correct: true }
        - { text: "To keep yeast nutrients in the juice", correct: false }
      explanation: |
        Broken skins expose juice to air and to browning enzymes, so long
        contact speeds oxidation of the delicate fruit aromas. Quick separation
        also keeps out bitter phenolics that whites, unlike reds, do not want.
    fr:
      question: "Pourquoi sépare-t-on en général le jus blanc de ses peaux peu après l’arrivée du raisin au chai ?"
      choices:
        - { text: "Pour accélérer le cycle de pressurage", correct: false }
        - { text: "Pour que la fermentation ne démarre pas sur peaux", correct: false }
        - { text: "Pour limiter l’oxydation du jus", correct: true }
        - { text: "Pour garder dans le jus les nutriments des levures", correct: false }
      explanation: |
        Les peaux éclatées exposent le jus à l’air et aux enzymes de brunissement : un
        contact prolongé accélère l’oxydation des arômes fruités délicats. Une séparation
        rapide écarte aussi les composés phénoliques amers, dont les blancs, contrairement aux
        rouges, ne veulent pas.

  - id: white-reception-sequence-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white]
    status: reviewed
    source_id: c08-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "After sorting and crushing, what is done with white grapes before they go to the press?"
      choices:
        - { text: "They soak on their skins for several days", correct: false }
        - { text: "The free-run juice is drained off", correct: true }
        - { text: "They are inoculated with yeast on the skins", correct: false }
        - { text: "The whole mass is cold-settled overnight", correct: false }
      explanation: |
        Free-run juice flows out by gravity once the skins are split. It is the
        gentlest, lowest-phenolic fraction, so many cellars keep it apart from the
        press juice recovered afterwards.
    fr:
      question: "Après le tri et le foulage, que fait-on des raisins blancs avant de les envoyer au pressoir ?"
      choices:
        - { text: "On les laisse macérer plusieurs jours", correct: false }
        - { text: "On écoule le jus de goutte", correct: true }
        - { text: "On les ensemence en levures sur peaux", correct: false }
        - { text: "On laisse reposer la vendange foulée une nuit au froid", correct: false }
      explanation: |
        Le jus de goutte s’écoule par gravité dès que les peaux sont fendues. C’est la
        fraction la plus délicate et la plus pauvre en composés phénoliques ; beaucoup de chais
        la gardent à part du jus de presse obtenu ensuite.

  - id: white-whole-bunch-press-aim-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, pressing]
    status: reviewed
    source_id: c08-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A white winemaker skips the crusher and sends intact bunches straight to the press. What is the main aim?"
      choices:
        - { text: "To extract colour and tannin from the stems", correct: false }
        - { text: "To keep skin–juice contact to a minimum", correct: true }
        - { text: "To raise the juice yield per tonne of fruit", correct: false }
        - { text: "To start fermentation inside the whole berries", correct: false }
      explanation: |
        With no crushing, juice only leaves the berries as pressure builds, so
        it spends less time against broken skins and picks up less oxygen and
        phenolics. The stalks also open channels that help the juice drain.
        Juice yield is usually lower, not higher.
    fr:
      question: "Un vinificateur de blanc saute l’étape du fouloir et envoie les grappes intactes directement au pressoir. Quel est le but principal ?"
      choices:
        - { text: "Extraire couleur et tanins des rafles", correct: false }
        - { text: "Réduire au minimum le contact jus–peaux", correct: true }
        - { text: "Augmenter le rendement en jus par tonne", correct: false }
        - { text: "Lancer la fermentation dans les baies entières", correct: false }
      explanation: |
        Sans foulage, le jus ne sort des baies qu’à mesure que la pression monte : il reste
        moins longtemps au contact des peaux éclatées et capte moins d’oxygène et de composés
        phénoliques. Les rafles ouvrent aussi des canaux qui facilitent l’écoulement. Le
        rendement en jus est en général plus faible, pas plus élevé.

  - id: white-whole-bunch-press-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, pressing]
    status: reviewed
    source_id: c08-0005
    review:
      fact_check: pass
      sources: [known-fact, spec]
    en:
      question: "Which style outcome is whole-bunch pressing of white grapes usually chosen for?"
      choices:
        - { text: "A deeper-coloured, more textured wine", correct: false }
        - { text: "A rounder wine with nutty, developed notes", correct: false }
        - { text: "A purer, more delicate wine", correct: true }
        - { text: "A wine with riper, more tropical fruit", correct: false }
      explanation: |
        Gentle pressing of intact bunches gives clean juice low in phenolics.
        Champagne's rules require whole-bunch pressing for this reason, since
        the base wines must stay fine and pale, even from black grapes.
    fr:
      question: "Pour quel style de vin choisit-on en général de presser des raisins blancs en grappes entières ?"
      choices:
        - { text: "Un vin plus coloré et plus texturé", correct: false }
        - { text: "Un vin plus rond, aux notes évoluées de fruits secs", correct: false }
        - { text: "Un vin plus pur et plus délicat", correct: true }
        - { text: "Un vin aux fruits plus mûrs, plus tropicaux", correct: false }
      explanation: |
        Le pressurage doux de grappes intactes donne un jus net, pauvre en composés
        phénoliques. Le cahier des charges de la Champagne l’impose pour cette raison : les
        vins de base doivent rester fins et pâles, même issus de raisins noirs.

  - id: white-skin-contact-aroma-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, skin-contact]
    status: reviewed
    source_id: c08-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a winemaker leave crushed white grapes on their skins for a few hours before pressing?"
      choices:
        - { text: "To raise the juice's sugar level", correct: false }
        - { text: "To extract tannin for ageing", correct: false }
        - { text: "To protect the juice from oxidation", correct: false }
        - { text: "To boost flavour intensity and texture", correct: true }
      explanation: |
        Many aroma compounds and their precursors sit in or just under the
        skin, so a short soak draws more of them into the juice. It is mostly
        used for aromatic varieties, and kept brief to avoid bitter phenolics.
    fr:
      question: "Pourquoi un vinificateur laisserait-il des raisins blancs foulés sur leurs peaux quelques heures avant le pressurage ?"
      choices:
        - { text: "Pour augmenter la teneur en sucre du jus", correct: false }
        - { text: "Pour extraire des tanins utiles à la garde", correct: false }
        - { text: "Pour protéger le jus de l’oxydation", correct: false }
        - { text: "Pour plus d’arômes et de texture", correct: true }
      explanation: |
        De nombreux composés aromatiques et leurs précurseurs se trouvent dans la peau ou
        juste en dessous ; une courte macération pelliculaire en fait passer davantage dans le
        jus. On la réserve surtout aux cépages aromatiques et on la garde brève pour éviter
        les composés phénoliques amers.

  - id: white-skin-contact-cold-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, skin-contact]
    status: reviewed
    source_id: c08-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is white must kept cold during a short pre-fermentation soak on the skins?"
      choices:
        - { text: "To stop fermentation from starting", correct: true }
        - { text: "To drop tartrate crystals out of the juice", correct: false }
        - { text: "To build up yeast numbers before inoculation", correct: false }
        - { text: "To speed up colour extraction", correct: false }
      explanation: |
        Once yeast get going, alcohol would start pulling bitter phenolics
        from the skins and the soak would turn into a fermentation on skins.
        Chilling holds the yeast back while the contact lasts a matter of
        hours.
    fr:
      question: "Pourquoi garde-t-on le moût blanc au froid pendant une courte macération pelliculaire avant fermentation ?"
      choices:
        - { text: "Pour empêcher la fermentation de démarrer", correct: true }
        - { text: "Pour faire précipiter les cristaux de tartre", correct: false }
        - { text: "Pour multiplier les levures avant l’ensemencement", correct: false }
        - { text: "Pour accélérer l’extraction de la couleur", correct: false }
      explanation: |
        Si les levures démarraient, l’alcool commencerait à extraire des peaux des composés
        phénoliques amers, et la macération tournerait à la fermentation sur peaux. Le froid
        retient les levures pendant les quelques heures de contact.

  - id: white-juice-clarify-reason-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, clarification]
    status: reviewed
    source_id: c08-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is freshly pressed white juice usually clarified before it is fermented?"
      choices:
        - { text: "Grape solids lower the final alcohol", correct: false }
        - { text: "Grape solids block malolactic conversion", correct: false }
        - { text: "Grape solids can cause off-aromas", correct: true }
        - { text: "Grape solids raise the juice's acidity", correct: false }
      explanation: |
        Heavy solids can encourage reductive, sulfur-like smells such as
        hydrogen sulfide and coarse, vegetal notes. Removing most of them
        keeps a fruit-led white clean, though a little turbidity is often left
        to feed the yeast.
    fr:
      question: "Pourquoi débourbe-t-on en général le jus blanc fraîchement pressé avant de le mettre à fermenter ?"
      choices:
        - { text: "Les bourbes abaissent le degré final", correct: false }
        - { text: "Les bourbes bloquent la malolactique", correct: false }
        - { text: "Les bourbes favorisent des faux goûts", correct: true }
        - { text: "Les bourbes augmentent l’acidité du jus", correct: false }
      explanation: |
        Des bourbes abondantes favorisent des odeurs de réduction soufrées, comme
        l’hydrogène sulfuré, et des notes végétales grossières. En retirer l’essentiel garde
        net un blanc axé sur le fruit, même si l’on laisse souvent un peu de turbidité pour
        nourrir les levures.

  - id: white-juice-solids-complexity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, clarification]
    status: reviewed
    source_id: c08-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a winemaker deliberately ferment a white with some cloudy juice solids left in?"
      choices:
        - { text: "For a paler colour and lighter body", correct: false }
        - { text: "For more complexity and a richer texture", correct: true }
        - { text: "To keep more fresh varietal fruit", correct: false }
        - { text: "To make the wine stable without fining", correct: false }
      explanation: |
        Some Burgundy Chardonnay producers favour cloudier juice for this
        reason. Many also believe the finished wine resists oxidation better,
        though that effect is debated. The solids also feed the yeast and
        can add body.
    fr:
      question: "Pourquoi un vinificateur ferait-il délibérément fermenter un blanc en gardant une partie des bourbes ?"
      choices:
        - { text: "Pour une couleur plus pâle et un corps plus léger", correct: false }
        - { text: "Pour plus de complexité et une texture plus riche", correct: true }
        - { text: "Pour garder davantage de fruit variétal frais", correct: false }
        - { text: "Pour stabiliser le vin sans collage", correct: false }
      explanation: |
        Certains producteurs de Chardonnay en Bourgogne préfèrent un jus plus trouble pour
        cette raison. Beaucoup estiment aussi que le vin fini résiste mieux à l’oxydation,
        effet qui reste discuté. Les bourbes nourrissent en outre les levures et peuvent
        donner du corps.

  - id: white-juice-solids-pure-varietal-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, clarification]
    status: reviewed
    source_id: c08-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white is most likely to be fermented from well-settled, clear juice?"
      choices:
        - { text: "Barrel-fermented Meursault", correct: false }
        - { text: "Lees-stirred Margaret River Chardonnay", correct: false }
        - { text: "Oak-aged white Pessac-Léognan", correct: false }
        - { text: "Marlborough Sauvignon Blanc", correct: true }
      explanation: |
        Marlborough wineries usually cold-settle or float the juice, then
        ferment it cool in stainless steel to keep the passion-fruit and
        gooseberry character sharp.
    fr:
      question: "Quel blanc a le plus de chances d’être fermenté à partir d’un jus bien débourbé et limpide ?"
      choices:
        - { text: "Meursault fermenté en fût", correct: false }
        - { text: "Chardonnay de Margaret River bâtonné", correct: false }
        - { text: "Pessac-Léognan blanc élevé en fût", correct: false }
        - { text: "Sauvignon Blanc de Marlborough", correct: true }
      explanation: |
        À Marlborough, on débourbe en général le jus à froid ou par flottation, puis on le
        fait fermenter au frais en cuve inox pour garder nets les arômes de fruit de la passion
        et de groseille à maquereau.

  - id: white-ferment-temp-range-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation]
    status: reviewed
    source_id: c08-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Within which temperature band are most white wines fermented?"
      choices:
        - { text: "About 6–10 °C", correct: false }
        - { text: "About 12–22 °C", correct: true }
        - { text: "About 24–30 °C", correct: false }
        - { text: "About 30–35 °C", correct: false }
      explanation: |
        Reds are usually fermented warmer, roughly 20–32 °C, to extract colour
        and tannin. Whites need no extraction, so cooler temperatures are used
        to protect fresh aromas.
    fr:
      question: "Dans quelle plage de températures fait-on fermenter la plupart des vins blancs ?"
      choices:
        - { text: "Environ 6–10 °C", correct: false }
        - { text: "Environ 12–22 °C", correct: true }
        - { text: "Environ 24–30 °C", correct: false }
        - { text: "Environ 30–35 °C", correct: false }
      explanation: |
        Les rouges fermentent en général plus chaud, vers 20–32 °C, pour extraire couleur et
        tanins. Les blancs n’ont rien à extraire : on travaille plus frais pour préserver les
        arômes.

  - id: white-ferment-too-cold-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation]
    status: reviewed
    source_id: c08-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What can a very cold fermentation do to the aroma of a white wine?"
      choices:
        - { text: "Give jammy, cooked-fruit aromas", correct: false }
        - { text: "Give buttery, creamy notes", correct: false }
        - { text: "Give toasty, nutty notes", correct: false }
        - { text: "Give strong pear-drop aromas", correct: true }
      explanation: |
        Fermenting near the bottom of the yeast's range favours fruity esters
        such as isoamyl acetate, the pear-drop and banana smell. Pushed too
        far, these esters swamp the grape's own character, so different
        varieties start to smell alike.
    fr:
      question: "Quel effet une fermentation très froide peut-elle avoir sur le nez d’un vin blanc ?"
      choices:
        - { text: "Des arômes de confiture, de fruits cuits", correct: false }
        - { text: "Des notes beurrées, crémeuses", correct: false }
        - { text: "Des notes grillées, de fruits secs", correct: false }
        - { text: "De forts arômes de bonbon anglais", correct: true }
      explanation: |
        Fermenter près du bas de la plage tolérée par les levures favorise des esters
        fruités comme l’acétate d’isoamyle, à l’odeur de bonbon anglais et de banane. Poussés
        trop loin, ces esters masquent le caractère du cépage, et des vins de cépages
        différents finissent par se ressembler.

  - id: white-ferment-warm-complexity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation]
    status: reviewed
    source_id: c08-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a winemaker let a Chardonnay ferment toward the warm end of the usual white range?"
      choices:
        - { text: "To build more complex, non-fruit aromas", correct: true }
        - { text: "To keep more fresh primary fruit", correct: false }
        - { text: "To retain more natural acidity", correct: false }
        - { text: "To leave a little residual sugar", correct: false }
      explanation: |
        Warmer fermentation shifts yeast metabolism away from delicate fruity
        esters toward higher alcohols and other compounds that read as savoury
        depth rather than fresh fruit.
    fr:
      question: "Pourquoi un vinificateur laisserait-il un Chardonnay fermenter vers le haut de la plage habituelle des blancs ?"
      choices:
        - { text: "Pour des arômes plus complexes, moins fruités", correct: true }
        - { text: "Pour garder davantage de fruit primaire frais", correct: false }
        - { text: "Pour conserver davantage d’acidité naturelle", correct: false }
        - { text: "Pour laisser un peu de sucre résiduel", correct: false }
      explanation: |
        Plus chaude, la fermentation oriente le métabolisme des levures loin des esters
        fruités délicats, vers des alcools supérieurs et d’autres composés qui donnent de la
        profondeur et des notes non fruitées plutôt que du fruit frais.

  - id: white-ferment-too-warm-risk-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation]
    status: reviewed
    source_id: c08-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main stylistic risk of fermenting an aromatic white such as Riesling too warm?"
      choices:
        - { text: "Building buttery, creamy notes", correct: false }
        - { text: "Retaining too much malic acid", correct: false }
        - { text: "Losing its varietal fruit aromas", correct: true }
        - { text: "Picking up excess grape tannin", correct: false }
      explanation: |
        Volatile aroma compounds escape with the faster flow of CO₂ and react
        away more quickly at higher temperatures, so the wine can taste flat and
        generic.
    fr:
      question: "Quel est le principal risque, côté style, d’une fermentation trop chaude pour un blanc aromatique comme le Riesling ?"
      choices:
        - { text: "Développer des notes beurrées, crémeuses", correct: false }
        - { text: "Garder trop d’acide malique", correct: false }
        - { text: "Perdre ses arômes fruités variétaux", correct: true }
        - { text: "Prendre trop de tanins du raisin", correct: false }
      explanation: |
        Les composés aromatiques volatils s’échappent avec le flux de CO₂, plus rapide, et
        se dégradent plus vite à haute température : le vin peut paraître plat et banal.

  - id: white-barrel-ferment-heat-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation, oak]
    status: reviewed
    source_id: c08-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a white still ferment fairly cool in barrel without any cooling jacket?"
      choices:
        - { text: "The oak staves absorb the yeast's heat", correct: false }
        - { text: "The lees insulate the wine from warming", correct: false }
        - { text: "Air seeping through the wood cools it", correct: false }
        - { text: "Small volumes shed heat in a cool cellar", correct: true }
      explanation: |
        A 225-litre barrel has a large surface for its volume, so the heat
        released by yeast escapes quickly, unlike in a big tank where it
        builds up. Underground cellars in Burgundy help by staying cool.
    fr:
      question: "Comment un blanc peut-il fermenter assez frais en fût sans aucun système de refroidissement ?"
      choices:
        - { text: "Les douelles absorbent la chaleur des levures", correct: false }
        - { text: "Les lies isolent le vin du réchauffement", correct: false }
        - { text: "L’air qui traverse le bois le refroidit", correct: false }
        - { text: "En cave fraîche, un petit volume se refroidit", correct: true }
      explanation: |
        Une barrique de 225 litres a une grande surface pour son volume : la chaleur dégagée
        par les levures s’échappe vite, alors qu’elle s’accumule dans une grande cuve. En
        Bourgogne, les caves souterraines, qui restent fraîches, y contribuent.

  - id: white-barrel-ferment-temp-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, fermentation, oak]
    status: reviewed
    source_id: c08-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At about which temperature does a barrel-fermented white usually ferment?"
      choices:
        - { text: "About 10–13 °C", correct: false }
        - { text: "About 13–16 °C", correct: false }
        - { text: "About 16–19 °C", correct: false }
        - { text: "About 19–22 °C", correct: true }
      explanation: |
        This sits at the top of the usual white range. If a barrel ferment
        runs hotter than wanted, cellars can move the barrels to a cooler
        room or trickle chilled water over the staves.
    fr:
      question: "À quelle température fermente en général un blanc vinifié en fût ?"
      choices:
        - { text: "Environ 10–13 °C", correct: false }
        - { text: "Environ 13–16 °C", correct: false }
        - { text: "Environ 16–19 °C", correct: false }
        - { text: "Environ 19–22 °C", correct: true }
      explanation: |
        C’est le haut de la plage habituelle des blancs. Si une fermentation en fût chauffe
        plus que voulu, on peut déplacer les barriques dans une salle plus fraîche ou faire
        ruisseler de l’eau froide sur les douelles.

  - id: white-blend-fruit-led-consistency-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, blending]
    status: reviewed
    source_id: c08-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "For a producer of fruit-led, inexpensive whites, what is blending mainly for?"
      choices:
        - { text: "Building oak-derived complexity", correct: false }
        - { text: "Raising the alcohol level", correct: false }
        - { text: "A consistent style from year to year", correct: true }
        - { text: "Extending the wine's ageing potential", correct: false }
      explanation: |
        Drinkers of a big brand expect the same taste in every bottle. Blending
        lots from different vineyards, regions or tanks evens out vintage and
        site variation.
    fr:
      question: "Pour un producteur de blancs fruités et bon marché, à quoi sert surtout l’assemblage ?"
      choices:
        - { text: "Une complexité apportée par le bois", correct: false }
        - { text: "Un degré alcoolique plus élevé", correct: false }
        - { text: "Un style constant d’année en année", correct: true }
        - { text: "Un potentiel de garde plus long", correct: false }
      explanation: |
        Les amateurs d’une grande marque attendent le même goût dans chaque bouteille.
        Assembler des lots de vignobles, de régions ou de cuves différents gomme les écarts de
        millésime et de site.

  - id: white-blend-neutral-complexity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, blending]
    status: reviewed
    source_id: c08-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a Meursault producer keep lots with different lees, MLF and new-oak treatment apart until blending?"
      choices:
        - { text: "To meet a varietal labelling minimum", correct: false }
        - { text: "To build complexity in the final blend", correct: true }
        - { text: "To keep one brand taste every year", correct: false }
        - { text: "To lift the wine's primary fruit", correct: false }
      explanation: |
        A neutral grape such as Chardonnay gives the winemaker room to shape
        the wine. Each lot brings its own layer, and tasting them separately
        lets the cellar choose the proportions.
    fr:
      question: "Pourquoi un producteur de Meursault garde-t-il à part jusqu’à l’assemblage des lots élevés différemment (lies, malolactique, part de fût neuf) ?"
      choices:
        - { text: "Pour atteindre un seuil d’étiquetage du cépage", correct: false }
        - { text: "Pour gagner en complexité dans l’assemblage", correct: true }
        - { text: "Pour garder le même goût de marque chaque année", correct: false }
        - { text: "Pour relever le fruit primaire du vin", correct: false }
      explanation: |
        Un cépage neutre comme le Chardonnay laisse au vinificateur de la marge pour façonner
        le vin. Chaque lot apporte sa propre strate, et les déguster séparément permet au chai
        de choisir les proportions.

  - id: white-clarity-pale-wine-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, clarification]
    status: reviewed
    source_id: c08-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do whites usually get stricter haze treatment before bottling than reds?"
      choices:
        - { text: "Whites have more pigment that drops out", correct: false }
        - { text: "Haze and deposits show more in a pale wine", correct: true }
        - { text: "Whites spend longer on their gross lees", correct: false }
        - { text: "Whites are usually aged longer in barrel", correct: false }
      explanation: |
        A slight haze is hard to see in an opaque red but obvious in a glass
        of pale white. That is why whites are usually tested for protein and
        tartrate stability before bottling.
    fr:
      question: "Pourquoi les blancs sont-ils en général traités plus strictement que les rouges contre les troubles avant la mise en bouteille ?"
      choices:
        - { text: "Les blancs ont plus de pigments qui précipitent", correct: false }
        - { text: "Un trouble ou un dépôt se voit plus dans un vin pâle", correct: true }
        - { text: "Les blancs restent plus longtemps sur lies grossières", correct: false }
        - { text: "Les blancs sont en général élevés plus longtemps en fût", correct: false }
      explanation: |
        Un léger trouble passe inaperçu dans un rouge opaque mais saute aux yeux dans un
        verre de blanc pâle. C’est pourquoi on contrôle en général la stabilité protéique et
        tartrique des blancs avant la mise.

  - id: white-bulk-varietal-label-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, labelling]
    status: reviewed
    source_id: c08-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do many cheap single-variety whites name the grape on the front label?"
      choices:
        - { text: "Law requires it for every single-variety wine", correct: false }
        - { text: "It proves the wine contains no other grape", correct: false }
        - { text: "The grape name itself sells the wine", correct: true }
        - { text: "It replaces the region on the label", correct: false }
      explanation: |
        Names such as Chardonnay or Pinot Grigio are familiar to shoppers. In
        the EU and many New World countries, a named variety need only make up
        a legal minimum of the wine, often 85%.
    fr:
      question: "Pourquoi beaucoup de blancs monocépages bon marché affichent-ils le cépage sur l’étiquette principale ?"
      choices:
        - { text: "La loi l’impose pour tout vin monocépage", correct: false }
        - { text: "Il prouve que le vin ne contient aucun autre cépage", correct: false }
        - { text: "Le nom du cépage fait vendre le vin", correct: true }
        - { text: "Il remplace la région sur l’étiquette", correct: false }
      explanation: |
        Chardonnay ou Pinot Grigio sont des noms que les acheteurs connaissent. Dans
        l’UE et dans de nombreux pays du Nouveau Monde, le cépage nommé ne doit
        représenter qu’un minimum légal du vin, souvent 85 %.

  - id: white-bulk-blend-volume-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, blending]
    status: reviewed
    source_id: c08-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are many high-volume, inexpensive whites made as multi-variety blends?"
      choices:
        - { text: "Cheap wines may not name a grape variety", correct: false }
        - { text: "Blending makes large volumes easier to assemble", correct: true }
        - { text: "Blending removes the need for acidification", correct: false }
        - { text: "Blends need far less SO₂ at bottling", correct: false }
      explanation: |
        A free hand with grapes lets a producer buy whatever fruit is
        available and affordable each year and still hit the target volume
        and taste.
    fr:
      question: "Pourquoi beaucoup de blancs bon marché produits en grand volume sont-ils des assemblages de plusieurs cépages ?"
      choices:
        - { text: "Un vin bon marché ne peut pas nommer de cépage", correct: false }
        - { text: "L’assemblage aide à constituer de gros volumes", correct: true }
        - { text: "L’assemblage dispense d’acidifier le moût", correct: false }
        - { text: "Un assemblage demande bien moins de SO₂ à la mise", correct: false }
      explanation: |
        Libre de son choix de cépages, le producteur achète chaque année les raisins
        disponibles et abordables, tout en atteignant le volume et le goût visés.

  - id: white-bulk-blend-label-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, labelling]
    status: reviewed
    source_id: c08-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is an inexpensive multi-variety white blend often named on its label?"
      choices:
        - { text: "With every grape listed by share", correct: false }
        - { text: "With a single-vineyard name", correct: false }
        - { text: "With a style term", correct: true }
        - { text: "With a sub-regional appellation", correct: false }
      explanation: |
        Terms such as 'Dry White' or 'Fruity White' tell the shopper what to
        expect without listing grapes that may change from one bottling to the
        next.
    fr:
      question: "Comment un assemblage blanc bon marché de plusieurs cépages est-il souvent désigné sur l’étiquette ?"
      choices:
        - { text: "Par la liste des cépages et leur part", correct: false }
        - { text: "Par le nom d’une parcelle unique", correct: false }
        - { text: "Par une mention de style", correct: true }
        - { text: "Par une appellation sous-régionale", correct: false }
      explanation: |
        Des mentions comme « Dry White » ou « blanc fruité » annoncent le goût sans
        citer des cépages qui peuvent changer d’une mise en bouteille à l’autre.

  - id: white-bulk-grape-pair-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, grapes]
    status: reviewed
    source_id: c08-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of grapes is most widely used for high-volume, inexpensive white wines?"
      choices:
        - { text: "Riesling and Gewurztraminer", correct: false }
        - { text: "Viognier and Muscat", correct: false }
        - { text: "Albariño and Grüner Veltliner", correct: false }
        - { text: "Chardonnay and Pinot Grigio", correct: true }
      explanation: |
        Both are planted widely in warm, high-yielding regions such as
        California's Central Valley, the Riverland in Australia and the
        plains of north-east Italy. Their fairly neutral flavours suit a
        broad market.
    fr:
      question: "Quel couple de cépages est le plus utilisé pour les blancs bon marché produits en grand volume ?"
      choices:
        - { text: "Riesling et Gewurztraminer", correct: false }
        - { text: "Viognier et Muscat", correct: false }
        - { text: "Albariño et Grüner Veltliner", correct: false }
        - { text: "Chardonnay et Pinot Grigio", correct: true }
      explanation: |
        Tous deux sont très plantés dans des régions chaudes et productives : la
        Central Valley californienne, le Riverland en Australie, les plaines du
        nord-est de l’Italie. Leur profil assez neutre plaît à un large marché.

  - id: white-bulk-neutral-appeal-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, grapes]
    status: reviewed
    source_id: c08-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a restrained, fairly neutral flavour profile suit a grape used for high-volume whites?"
      choices:
        - { text: "It removes the need for acid additions", correct: false }
        - { text: "It appeals to a wide range of drinkers", correct: true }
        - { text: "It makes oak treatment unnecessary", correct: false }
        - { text: "It lets the vine carry higher yields", correct: false }
      explanation: |
        Strongly aromatic grapes such as Gewurztraminer divide opinion, while
        a gentle, fruity white offends almost no one. Broad appeal is what a
        large-volume brand needs.
    fr:
      question: "Pourquoi un profil aromatique discret, assez neutre, convient-il à un cépage destiné aux blancs de grand volume ?"
      choices:
        - { text: "Il dispense d’acidifier le moût", correct: false }
        - { text: "Il plaît à un très large public", correct: true }
        - { text: "Il rend l’élevage sous bois inutile", correct: false }
        - { text: "Il permet des rendements plus élevés", correct: false }
      explanation: |
        Un cépage très aromatique comme le Gewurztraminer divise, alors qu’un blanc
        souple et fruité ne déplaît presque à personne. C’est cet attrait large
        qu’il faut à une marque de grand volume.

  - id: white-bulk-easy-ripening-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, grapes]
    status: reviewed
    source_id: c08-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vine trait makes Chardonnay practical in warm, high-yield bulk vineyards?"
      choices:
        - { text: "It buds late and so avoids spring frost", correct: false }
        - { text: "It keeps high acidity in hot weather", correct: false }
        - { text: "It ripens easily", correct: true }
        - { text: "It resists drought without irrigation", correct: false }
      explanation: |
        Reliable ripening lets growers in warm regions crop heavily and still
        reach sugar targets. Chardonnay is in fact an early-budding, frost-prone
        variety.
    fr:
      question: "Quel trait de la vigne rend le Chardonnay commode dans les vignobles chauds à hauts rendements des vins d’entrée de gamme ?"
      choices:
        - { text: "Il débourre tard et échappe aux gelées de printemps", correct: false }
        - { text: "Il garde une acidité élevée par temps chaud", correct: false }
        - { text: "Il mûrit facilement", correct: true }
        - { text: "Il résiste à la sécheresse sans irrigation", correct: false }
      explanation: |
        Une maturation régulière permet aux viticulteurs des régions chaudes de
        charger les vignes tout en atteignant les sucres visés. En réalité, le
        Chardonnay débourre tôt et craint les gelées de printemps.

  - id: white-bulk-hot-low-acid-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk]
    status: reviewed
    source_id: c08-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape-composition problem most often affects inexpensive whites from hot regions?"
      choices:
        - { text: "Sunburnt, bitter skins", correct: false }
        - { text: "Too much malic acid", correct: false }
        - { text: "Excess tannin from heat stress", correct: false }
        - { text: "Too little acidity", correct: true }
      explanation: |
        Heat speeds the breakdown of malic acid in the berries, so the juice
        can taste flat. Where local rules allow, the winemaker corrects this
        by adding acid, usually tartaric.
    fr:
      question: "Quel défaut de composition du raisin touche le plus souvent les blancs bon marché des régions chaudes ?"
      choices:
        - { text: "Des pellicules brûlées par le soleil, amères", correct: false }
        - { text: "Trop d’acide malique", correct: false }
        - { text: "Trop de tanins sous l’effet du stress thermique", correct: false }
        - { text: "Une acidité trop faible", correct: true }
      explanation: |
        La chaleur accélère la dégradation de l’acide malique dans les baies, et
        le jus peut paraître plat. Là où la réglementation le permet, le vinificateur
        acidifie, en général avec de l’acide tartrique.

  - id: white-bulk-chardonnay-melon-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, chardonnay]
    status: reviewed
    source_id: c08-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fruit profile is typical of an unoaked, inexpensive Chardonnay from a moderate or warm climate?"
      choices:
        - { text: "Melon and peach", correct: true }
        - { text: "Gooseberry and grass", correct: false }
        - { text: "Lychee and rose", correct: false }
        - { text: "Lime and petrol", correct: false }
      explanation: |
        Warmth moves Chardonnay from citrus and green apple toward peach and
        melon; in hot climates it goes on to banana and pineapple. Oaked
        versions at the same price add vanilla and toast, usually from chips
        or staves.
    fr:
      question: "Quel profil fruité est typique d’un Chardonnay bon marché, sans bois, de climat modéré ou chaud ?"
      choices:
        - { text: "Melon et pêche", correct: true }
        - { text: "Groseille à maquereau et herbe", correct: false }
        - { text: "Litchi et rose", correct: false }
        - { text: "Citron vert et hydrocarbures", correct: false }
      explanation: |
        Avec la chaleur, le Chardonnay quitte les agrumes et la pomme verte pour la
        pêche et le melon ; en climat très chaud, il va jusqu’à la banane et
        l’ananas. Les versions boisées au même prix ajoutent vanille et grillé,
        souvent par copeaux ou douelles.

  - id: white-bulk-chardonnay-sweetness-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, chardonnay]
    status: reviewed
    source_id: c08-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Whether oaked or not, what does an inexpensive Chardonnay often contain?"
      choices:
        - { text: "Noticeable grape tannin", correct: false }
        - { text: "A little residual sugar", correct: true }
        - { text: "A share of Muscat for perfume", correct: false }
        - { text: "A high level of malic acid", correct: false }
      explanation: |
        A few grams of sugar soften the palate and lift the sense of ripe
        fruit, which many drinkers like even in a wine sold as dry.
    fr:
      question: "Boisé ou non, que contient souvent un Chardonnay bon marché ?"
      choices:
        - { text: "Des tanins de raisin perceptibles", correct: false }
        - { text: "Un peu de sucre résiduel", correct: true }
        - { text: "Une part de Muscat pour le parfum", correct: false }
        - { text: "Beaucoup d’acide malique", correct: false }
      explanation: |
        Quelques grammes de sucre arrondissent la bouche et renforcent l’impression
        de fruit mûr, ce que beaucoup de buveurs apprécient, même dans un vin vendu
        comme sec.

  - id: white-bulk-pinot-grigio-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, pinot-grigio]
    status: reviewed
    source_id: c08-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits a high-volume, inexpensive Pinot Grigio?"
      choices:
        - { text: "Full body, low acidity, honey and spice", correct: false }
        - { text: "Medium body, high acidity, gooseberry and grass", correct: false }
        - { text: "Light body, medium acidity, light pear drop", correct: true }
        - { text: "Medium body, low acidity, lychee and rose", correct: false }
      explanation: |
        Much of it comes from high-yielding vineyards on the plains of
        north-east Italy. The richer, spicier Pinot Gris of Alsace comes from
        riper, lower-yielding grapes.
    fr:
      question: "Quel profil correspond à un Pinot Grigio bon marché produit en grand volume ?"
      choices:
        - { text: "Corps ample, acidité faible, miel et épices", correct: false }
        - { text: "Corps moyen, acidité élevée, groseille à maquereau et herbe", correct: false }
        - { text: "Corps léger, acidité moyenne, léger bonbon anglais", correct: true }
        - { text: "Corps moyen, acidité faible, litchi et rose", correct: false }
      explanation: |
        Il provient en grande partie de vignobles très productifs des plaines du
        nord-est de l’Italie. Le Pinot Gris d’Alsace, plus riche et épicé, naît de
        raisins plus mûrs et de rendements plus faibles.

  - id: white-bulk-sauvignon-price-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, sauvignon-blanc]
    status: reviewed
    source_id: c08-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape is used for inexpensive varietal whites but is seldom seen at the very lowest price points?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Chardonnay", correct: false }
        - { text: "Trebbiano", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
      explanation: |
        Demand driven by Marlborough's success lets Sauvignon Blanc command a
        small premium over the cheapest Chardonnay and Pinot Grigio.
    fr:
      question: "Quel cépage sert aux blancs de cépage bon marché, mais se voit rarement aux tout premiers prix ?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Chardonnay", correct: false }
        - { text: "Trebbiano", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
      explanation: |
        Portée par le succès de Marlborough, la demande permet au Sauvignon Blanc de
        se vendre un peu plus cher que les Chardonnay et Pinot Grigio les moins chers.

  - id: white-bulk-sauvignon-vigour-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, sauvignon-blanc]
    status: reviewed
    source_id: c08-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides consumer demand, which vine trait makes Sauvignon Blanc practical for high-volume whites?"
      choices:
        - { text: "Thick skins that resist rot", correct: false }
        - { text: "Vigour that supports high yields", correct: true }
        - { text: "Natural resistance to powdery mildew", correct: false }
        - { text: "Low acidity that needs no adjustment", correct: false }
      explanation: |
        Sauvignon Blanc grows vigorously and crops generously, especially on
        fertile soils. Its thin-skinned, tight bunches are actually prone to
        botrytis, and it is susceptible to powdery mildew.
    fr:
      question: "Outre la demande des consommateurs, quel trait de la vigne rend le Sauvignon Blanc commode pour les blancs de grand volume ?"
      choices:
        - { text: "Des pellicules épaisses qui résistent à la pourriture", correct: false }
        - { text: "Une vigueur qui permet de hauts rendements", correct: true }
        - { text: "Une résistance naturelle à l’oïdium", correct: false }
        - { text: "Une acidité faible qui n’exige aucune correction", correct: false }
      explanation: |
        Le Sauvignon Blanc est vigoureux et produit généreusement, surtout sur sols
        fertiles. Ses grappes serrées à pellicule fine sont en fait sensibles au
        botrytis, et il craint l’oïdium.

  - id: white-bulk-sauvignon-underripe-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, sauvignon-blanc]
    status: reviewed
    source_id: c08-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "If Sauvignon Blanc for an inexpensive white is picked underripe, which character tends to dominate?"
      choices:
        - { text: "Passion fruit and guava", correct: false }
        - { text: "Honeyed, waxy notes", correct: false }
        - { text: "Smoky, flinty notes", correct: false }
        - { text: "Herbaceous, grassy notes", correct: true }
      explanation: |
        Methoxypyrazines, the compounds behind green pepper and cut grass, are
        highest in unripe berries and break down with sunlight and ripeness.
        A little adds freshness; too much tastes raw.
    fr:
      question: "Si le Sauvignon Blanc d’un blanc bon marché est vendangé avant maturité, quel caractère tend à dominer ?"
      choices:
        - { text: "Fruit de la passion et goyave", correct: false }
        - { text: "Notes miellées et cireuses", correct: false }
        - { text: "Notes fumées, de pierre à fusil", correct: false }
        - { text: "Notes herbacées, d’herbe coupée", correct: true }
      explanation: |
        Les méthoxypyrazines, à l’origine des notes de poivron vert et d’herbe
        coupée, culminent dans les baies vertes et se dégradent avec le soleil et
        la maturité. Un peu apporte de la fraîcheur ; trop donne un vin vert.

  - id: white-bulk-whole-bunch-rare-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, pressing]
    status: reviewed
    source_id: c08-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are grapes for high-volume, inexpensive whites usually destemmed and crushed rather than whole-bunch pressed?"
      choices:
        - { text: "Bulk presses cannot load whole bunches", correct: false }
        - { text: "It is slower and needs hand-picked bunches", correct: true }
        - { text: "Whole-bunch juice needs much longer settling", correct: false }
        - { text: "Whole bunches add bitter stem tannin to juice", correct: false }
      explanation: |
        Machine harvesters shake loose berries off the stalks, so intact
        bunches only come from hand picking. Crushing also speeds up the press
        cycle and raises the juice yield, both vital at large volumes.
    fr:
      question: "Pourquoi les raisins des blancs bon marché de grand volume sont-ils en général éraflés et foulés plutôt que pressés en grappes entières ?"
      choices:
        - { text: "Les pressoirs industriels n’acceptent pas les grappes entières", correct: false }
        - { text: "C’est plus lent et exige une vendange manuelle", correct: true }
        - { text: "Le jus de grappes entières exige un débourbage plus long", correct: false }
        - { text: "Les rafles donnent au jus des tanins amers", correct: false }
      explanation: |
        La machine à vendanger détache les baies des rafles en secouant la vigne :
        seule la vendange manuelle livre des grappes intactes. Le foulage raccourcit
        aussi le cycle de pressurage et augmente le rendement en jus, deux atouts
        décisifs en grand volume.

  - id: white-bulk-chardonnay-acidify-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, acidity]
    status: reviewed
    source_id: c08-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In hot bulk-wine regions, which white grape is most often in need of added acid?"
      choices:
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Colombard", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Grown hot, Chardonnay loses acidity fast and can taste flat and
        flabby. Colombard and Riesling hold their acidity well in heat, which
        is why Colombard is valued in warm regions such as South Africa and
        Gascony.
    fr:
      question: "Dans les régions chaudes de vins d’entrée de gamme, quel cépage blanc faut-il le plus souvent acidifier ?"
      choices:
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Colombard", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Cultivé au chaud, le Chardonnay perd vite son acidité et peut paraître plat
        et mou. Le Colombard et le Riesling gardent bien leur acidité à la chaleur,
        d’où l’intérêt du Colombard dans des régions chaudes comme l’Afrique du Sud
        ou la Gascogne.

  - id: white-bulk-commercial-yeast-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, fermentation]
    status: reviewed
    source_id: c08-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do producers of high-volume, inexpensive whites usually inoculate with selected commercial yeast?"
      choices:
        - { text: "To add complexity from many yeast strains", correct: false }
        - { text: "To leave residual sugar without chilling", correct: false }
        - { text: "To trigger malolactic conversion early", correct: false }
        - { text: "For a quick, predictable fermentation", correct: true }
      explanation: |
        A strong, known strain starts fast and finishes dry in cool stainless
        steel, which frees tanks quickly and avoids the off-flavours of a
        stuck ferment. Some strains are also chosen to boost fruity esters.
    fr:
      question: "Pourquoi les producteurs de blancs bon marché de grand volume ensemencent-ils en général avec des levures sélectionnées du commerce ?"
      choices:
        - { text: "Pour la complexité de nombreuses souches", correct: false }
        - { text: "Pour garder du sucre résiduel sans refroidir", correct: false }
        - { text: "Pour déclencher tôt la malolactique", correct: false }
        - { text: "Pour une fermentation rapide et prévisible", correct: true }
      explanation: |
        Une souche vigoureuse et connue démarre vite et finit sèche en cuve inox
        fraîche : les cuves se libèrent vite et l’on évite les déviations d’une
        fermentation arrêtée. Certaines souches sont aussi choisies pour renforcer
        les esters fruités.

  - id: white-bulk-chardonnay-mlf-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, mlf]
    status: reviewed
    source_id: c08-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Among high-volume, inexpensive whites, which variety is the likeliest to go through malolactic conversion?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Malolactic conversion softens acidity and can add buttery diacetyl,
        a profile that many drinkers expect from Chardonnay. The other three
        rely on crisp acidity and fresh primary fruit, so MLF is usually
        blocked.
    fr:
      question: "Parmi les blancs bon marché de grand volume, quel cépage est le plus susceptible de faire sa fermentation malolactique ?"
      choices:
        - { text: "Pinot Grigio", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        La malolactique assouplit l’acidité et peut apporter le diacétyle beurré,
        un profil que beaucoup de buveurs attendent d’un Chardonnay. Les trois autres
        misent sur une acidité vive et un fruit primaire frais : on bloque donc en
        général la malo.

  - id: white-bulk-sweetness-reserve-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, white, bulk, sweetness]
    status: reviewed
    source_id: c08-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do large-volume producers usually set the exact sweetness of an off-dry white?"
      choices:
        - { text: "Add fortifying spirit to stop the yeast", correct: false }
        - { text: "Blend in some botrytised sweet wine", correct: false }
        - { text: "Add grape juice or RCGM after fermentation", correct: true }
        - { text: "Pick part of the crop later for more sugar", correct: false }
      explanation: |
        Fermenting dry first and then sweetening lets the cellar hit a target
        to the gram per litre. In Germany, unfermented juice kept for this is
        called Süssreserve. The sweetened wine is then usually sterile-filtered
        so no yeast can restart.
    fr:
      question: "Comment les producteurs de grand volume règlent-ils en général la sucrosité exacte d’un blanc demi-sec ?"
      choices:
        - { text: "En ajoutant de l’alcool pour arrêter les levures", correct: false }
        - { text: "En assemblant un peu de liquoreux botrytisé", correct: false }
        - { text: "En ajoutant du moût ou du MCR après fermentation", correct: true }
        - { text: "En vendangeant une partie plus tard", correct: false }
      explanation: |
        Fermenter à sec puis sucrer permet d’atteindre la cible au gramme par litre
        près, avec du moût de raisin ou du moût concentré rectifié (MCR). En
        Allemagne, le moût non fermenté gardé à cet effet s’appelle Süssreserve
        (« réserve de moût »). Le vin passe ensuite en général en filtration
        stérile pour qu’aucune levure ne redémarre.

  - id: sweet-botrytis-grey-rot-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, disease]
    status: reviewed
    source_id: c08-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Botrytis cinerea can give noble rot on ripe grapes. Which damaging disease can the same fungus cause instead?"
      choices:
        - { text: "Downy mildew", correct: false }
        - { text: "Black rot", correct: false }
        - { text: "Grey rot", correct: true }
        - { text: "Powdery mildew", correct: false }
      explanation: |
        Grey rot breaks berries down instead of concentrating them, bringing
        mouldy, earthy taints, and its laccase enzyme browns the juice. Black rot
        and the two mildews come from other fungi or fungus-like organisms.
    fr:
      question: "Botrytis cinerea peut donner la pourriture noble sur des raisins mûrs. Quelle maladie dommageable le même champignon peut-il causer à la place ?"
      choices:
        - { text: "Le mildiou", correct: false }
        - { text: "Le black-rot", correct: false }
        - { text: "La pourriture grise", correct: true }
        - { text: "L’oïdium", correct: false }
      explanation: |
        La pourriture grise décompose les baies au lieu de les concentrer, apporte
        des goûts de moisi et de terre, et sa laccase brunit le jus. Le black-rot,
        le mildiou et l’oïdium sont dus à d’autres champignons ou à des organismes
        proches des champignons.

  - id: sweet-noble-rot-afternoon-drying-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, noble-rot, climate]
    status: reviewed
    source_id: c08-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Once noble rot has pierced the grape skins, how do dry, sunny afternoons help?"
      choices:
        - { text: "They kill the fungus so the skins can heal", correct: false }
        - { text: "They slow the fungus and let water escape", correct: true }
        - { text: "They push extra sugar from the leaves", correct: false }
        - { text: "They plump up the berries before picking", correct: false }
      explanation: |
        The fungus's fine filaments leave tiny holes in the skin. Warm, dry air
        keeps the infection in check and lets water evaporate through those holes,
        so the berries shrivel and concentrate instead of splitting into grey rot.
    fr:
      question: "Une fois que la pourriture noble a percé la pellicule des raisins, en quoi les après-midi secs et ensoleillés aident-ils ?"
      choices:
        - { text: "Ils tuent le champignon et la pellicule cicatrise", correct: false }
        - { text: "Ils freinent le champignon, l’eau s’évapore", correct: true }
        - { text: "Ils font affluer du sucre depuis les feuilles", correct: false }
        - { text: "Ils regonflent les baies avant la cueillette", correct: false }
      explanation: |
        Les fins filaments du champignon laissent de minuscules trous dans la
        pellicule. L’air chaud et sec contient l’infection et laisse l’eau
        s’échapper par ces trous : les baies se flétrissent et se concentrent au
        lieu d’éclater en pourriture grise.

  - id: sweet-noble-rot-acid-concentration-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, noble-rot, acidity]
    status: reviewed
    source_id: c08-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can a wine from nobly rotten grapes keep high acidity despite intense sweetness?"
      choices:
        - { text: "Malolactic conversion adds extra acidity", correct: false }
        - { text: "Water loss concentrates acid along with sugar", correct: true }
        - { text: "Cool morning mists stop acid loss in ripening", correct: false }
        - { text: "Late picking raises malic acid in the berries", correct: false }
      explanation: |
        Shrivelling removes water, so sugar, acids and flavour compounds all rise
        in the juice that remains. The fungus does consume some acid, but the net
        result is still a concentrated, well-structured must, as a racy Mosel
        Trockenbeerenauslese shows.
    fr:
      question: "Pourquoi un vin de raisins atteints de pourriture noble peut-il garder une acidité élevée malgré une forte douceur ?"
      choices:
        - { text: "La fermentation malolactique ajoute de l’acidité", correct: false }
        - { text: "La perte d’eau concentre l’acide avec le sucre", correct: true }
        - { text: "Les brumes matinales freinent la perte d’acidité", correct: false }
        - { text: "La vendange tardive augmente l’acide malique", correct: false }
      explanation: |
        Le flétrissement retire de l’eau : sucres, acides et composés aromatiques
        augmentent dans le jus restant. Le champignon consomme bien un peu d’acide,
        mais le moût reste concentré et structuré, comme le montre la tension d’un
        Trockenbeerenauslese de Moselle.

  - id: sweet-noble-rot-own-flavours-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, noble-rot, flavour]
    status: reviewed
    source_id: c08-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides concentrating the juice, what does noble rot add to a sweet wine?"
      choices:
        - { text: "Tannin extracted from broken skins", correct: false }
        - { text: "Extra alcohol before fermentation starts", correct: false }
        - { text: "Distinctive flavours of its own", correct: true }
        - { text: "A natural yeast culture for the ferment", correct: false }
      explanation: |
        Botrytis changes the grape's chemistry, producing glycerol, gluconic acid
        and aromas often likened to honey, marmalade or saffron. That is why a
        Trockenbeerenauslese tastes different from an equally sweet Eiswein made
        from healthy fruit.
    fr:
      question: "Outre la concentration du jus, qu’apporte la pourriture noble à un vin liquoreux ?"
      choices:
        - { text: "Des tanins extraits des pellicules abîmées", correct: false }
        - { text: "De l’alcool avant même la fermentation", correct: false }
        - { text: "Des arômes qui lui sont propres", correct: true }
        - { text: "Des levures naturelles pour la fermentation", correct: false }
      explanation: |
        Le botrytis modifie la chimie du raisin : glycérol, acide gluconique et
        arômes souvent comparés au miel, à la marmelade ou au safran. C’est pourquoi
        un Trockenbeerenauslese n’a pas le goût d’un Eiswein tout aussi doux, issu
        de raisins sains.

  - id: sweet-botrytis-aroma-profile-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, flavour]
    status: reviewed
    source_id: c08-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aroma group is typical of a sweet wine from nobly rotten grapes?"
      choices:
        - { text: "Honey, apricot and citrus zest", correct: true }
        - { text: "Lychee, rose petal and ginger", correct: false }
        - { text: "Butter, toast and vanilla", correct: false }
        - { text: "Gooseberry, grass and green pepper", correct: false }
      explanation: |
        Dried fruit and marmalade often join these notes. Sauternes and German
        Trockenbeerenauslese share this botrytis signature even though they are
        made from different grapes.
    fr:
      question: "Quel groupe d’arômes est typique d’un vin liquoreux issu de raisins atteints de pourriture noble ?"
      choices:
        - { text: "Miel, abricot et zeste d’agrume", correct: true }
        - { text: "Litchi, pétale de rose et gingembre", correct: false }
        - { text: "Beurre, pain grillé et vanille", correct: false }
        - { text: "Groseille à maquereau, herbe et poivron vert", correct: false }
      explanation: |
        Fruits secs et marmelade s’y ajoutent souvent. Le Sauternes et le
        Trockenbeerenauslese allemand partagent cette signature du botrytis, bien
        qu’ils soient issus de cépages différents.

  - id: sweet-noble-rot-several-passes-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, harvest]
    status: reviewed
    source_id: c08-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is a noble-rot vineyard often picked by hand in several passes?"
      choices:
        - { text: "Appellation rules set a minimum number of passes", correct: false }
        - { text: "The fungus spreads unevenly through the bunches", correct: true }
        - { text: "Each pass waits for a fresh overnight frost", correct: false }
        - { text: "Pickers make one pass for each grape variety", correct: false }
      explanation: |
        Berries reach the ideal shrivelled stage at different times, even within
        one bunch, so pickers return to take only the ready fruit. At Château
        d'Yquem the successive passes can stretch over several weeks.
    fr:
      question: "Pourquoi vendange-t-on souvent à la main, en plusieurs tries, une vigne touchée par la pourriture noble ?"
      choices:
        - { text: "Le cahier des charges impose un nombre minimal de tries", correct: false }
        - { text: "Le champignon progresse inégalement dans les grappes", correct: true }
        - { text: "Chaque trie attend une nouvelle gelée nocturne", correct: false }
        - { text: "Les vendangeurs font une trie par cépage", correct: false }
      explanation: |
        Les baies atteignent le flétrissement idéal à des moments différents, même
        au sein d’une grappe : les vendangeurs repassent pour ne cueillir que les
        baies prêtes. À Château d’Yquem, les tries successives peuvent s’étaler sur
        plusieurs semaines.

  - id: sweet-noble-rot-harvest-cost-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, harvest, cost]
    status: reviewed
    source_id: c08-0108
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides repeated hand-picking, what else makes nobly rotten sweet wine costly to produce?"
      choices:
        - { text: "Heavy fungicide spraying in autumn", correct: false }
        - { text: "Very low yield per vine", correct: true }
        - { text: "Compulsory new oak barrels", correct: false }
        - { text: "Long bottle ageing before release", correct: false }
      explanation: |
        Shrivelled berries hold very little juice, so each vine gives a small
        fraction of a normal crop. Château d'Yquem is often said to make about one
        glass of wine per vine.
    fr:
      question: "Outre les passages répétés des vendangeurs, qu’est-ce qui rend coûteux un liquoreux de pourriture noble ?"
      choices:
        - { text: "Des traitements fongicides intensifs à l’automne", correct: false }
        - { text: "Un rendement très faible par pied", correct: true }
        - { text: "Des barriques neuves obligatoires", correct: false }
        - { text: "Un long vieillissement en bouteille avant la sortie", correct: false }
      explanation: |
        Les baies flétries contiennent très peu de jus : chaque pied ne donne
        qu’une petite fraction d’une récolte normale. On dit souvent qu’à Château
        d’Yquem, un pied de vigne donne à peu près un verre de vin.

  - id: sweet-sauternes-vintage-variation-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, sauternes, vintage]
    status: reviewed
    source_id: c08-0109
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does the output of top sweet Sauternes vary so much from one vintage to the next?"
      choices:
        - { text: "Noble rot does not arrive every autumn", correct: true }
        - { text: "Spring frost often destroys the crop", correct: false }
        - { text: "Summer hail is frequent in the Sauternais", correct: false }
        - { text: "Autumn heat burns off the acidity", correct: false }
      explanation: |
        Without the right mix of misty mornings and dry afternoons, the rot may
        not spread, or it may turn grey. Leading estates sometimes skip a vintage:
        Château d'Yquem released no grand vin in 1992 or 2012.
    fr:
      question: "Pourquoi la production des grands Sauternes varie-t-elle autant d’un millésime à l’autre ?"
      choices:
        - { text: "La pourriture noble ne s’installe pas chaque automne", correct: true }
        - { text: "Les gelées de printemps détruisent souvent la récolte", correct: false }
        - { text: "La grêle d’été est fréquente dans le Sauternais", correct: false }
        - { text: "La chaleur d’automne fait chuter l’acidité", correct: false }
      explanation: |
        Sans l’alternance de matinées brumeuses et d’après-midi secs, la
        pourriture ne se propage pas, ou tourne au gris. Les grands domaines sautent
        parfois un millésime : Château d’Yquem n’a pas produit de grand vin en 1992
        ni en 2012.

  - id: sweet-noble-rot-too-wet-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, botrytis, grey-rot, climate]
    status: reviewed
    source_id: c08-0110
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a noble-rot vineyard, what usually happens if the autumn stays wet instead of drying out?"
      choices:
        - { text: "Noble rot spreads faster and more evenly", correct: false }
        - { text: "The berries shrivel faster on the vine", correct: false }
        - { text: "Grey rot takes over and splits the berries", correct: true }
        - { text: "The fungus stops and the berries stay healthy", correct: false }
      explanation: |
        Without drying spells, Botrytis keeps growing, berries swell and burst,
        and the wounds let in acetic bacteria and other rots. The grower then
        faces heavy sorting losses rather than concentration.
    fr:
      question: "Dans une vigne à pourriture noble, que se passe-t-il en général si l’automne reste humide au lieu de s’assécher ?"
      choices:
        - { text: "La pourriture noble progresse plus vite et plus régulièrement", correct: false }
        - { text: "Les baies se flétrissent plus vite sur la vigne", correct: false }
        - { text: "La pourriture grise s’installe et fait éclater les baies", correct: true }
        - { text: "Le champignon s’arrête et les baies restent saines", correct: false }
      explanation: |
        Sans périodes sèches, le botrytis continue de se développer, les baies
        gonflent et éclatent, et les plaies laissent entrer bactéries acétiques et
        autres pourritures. Le viticulteur subit alors de lourdes pertes au tri au
        lieu d’une concentration.

  - id: sweet-passerillage-term-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, passerillage, terminology]
    status: reviewed
    source_id: c08-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which term describes ripe grapes left to dry and shrivel on the vine?"
      choices:
        - { text: "Appassimento", correct: false }
        - { text: "Passerillage", correct: true }
        - { text: "Pourriture noble", correct: false }
        - { text: "Mutage", correct: false }
      explanation: |
        Unlike appassimento, the bunches are not picked first: the berries lose
        water while still hanging. Sweet Jurançon from Petit Manseng is a classic
        example.
    fr:
      question: "Quel terme désigne des raisins mûrs laissés à sécher et à se flétrir sur la vigne ?"
      choices:
        - { text: "Appassimento", correct: false }
        - { text: "Passerillage", correct: true }
        - { text: "Pourriture noble", correct: false }
        - { text: "Mutage", correct: false }
      explanation: |
        Les baies perdent leur eau sans être cueillies ; on précise parfois
        « passerillage sur souche ». L’appassimento, lui, fait sécher des grappes
        déjà vendangées. Le Jurançon moelleux, issu du Petit Manseng, en est un
        exemple classique.

  - id: sweet-passerillage-weather-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, passerillage, climate]
    status: reviewed
    source_id: c08-0113
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which autumn weather lets grapes shrivel on the vine without rotting?"
      choices:
        - { text: "Warm and dry", correct: true }
        - { text: "Misty mornings, sunny afternoons", correct: false }
        - { text: "Cold enough to freeze the berries", correct: false }
        - { text: "Mild, with steady drizzle", correct: false }
      explanation: |
        Dry air draws water from the berries while denying fungi the moisture
        they need. If rain or humidity sets in, the shrivelling fruit is exposed
        to grey rot.
    fr:
      question: "Quel temps d’automne permet aux raisins de se flétrir sur la vigne sans pourrir ?"
      choices:
        - { text: "Chaud et sec", correct: true }
        - { text: "Matins brumeux, après-midi ensoleillés", correct: false }
        - { text: "Assez froid pour geler les baies", correct: false }
        - { text: "Doux, avec une bruine persistante", correct: false }
      explanation: |
        L’air sec tire l’eau des baies tout en privant les champignons de
        l’humidité dont ils ont besoin. Si la pluie ou l’humidité s’installe, les
        raisins en cours de flétrissement deviennent vulnérables à la pourriture
        grise.

  - id: sweet-passerillage-wine-profile-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, passerillage, style]
    status: reviewed
    source_id: c08-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile is typical of a sweet white made from grapes shrivelled on the vine?"
      choices:
        - { text: "Honey, marmalade and saffron notes", correct: false }
        - { text: "Pure varietal fruit with piercing acidity", correct: false }
        - { text: "Rich texture with dried and tropical fruit", correct: true }
        - { text: "Nutty notes from long oxidative ageing", correct: false }
      explanation: |
        Overripe fruit gives notes such as dried apricot, pineapple or mango, and
        the concentrated juice feels thick in the mouth. Without botrytis, these
        wines lack the honey and marmalade layer of a Sauternes.
    fr:
      question: "Quel profil est typique d’un blanc liquoreux issu de raisins passerillés sur la vigne ?"
      choices:
        - { text: "Notes de miel, de marmelade et de safran", correct: false }
        - { text: "Fruit variétal pur et acidité tranchante", correct: false }
        - { text: "Texture riche, fruits secs et tropicaux", correct: true }
        - { text: "Notes de noix d’un long élevage oxydatif", correct: false }
      explanation: |
        Les raisins surmûris donnent des notes d’abricot sec, d’ananas ou de mangue,
        et le jus concentré paraît épais en bouche. Sans botrytis, ces vins n’ont pas
        la couche de miel et de marmelade d’un Sauternes.

  - id: sweet-late-harvest-label-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, passerillage, labelling]
    status: reviewed
    source_id: c08-0115
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which English label term often marks a sweet wine from grapes left to shrivel on the vine?"
      choices:
        - { text: "Icewine", correct: false }
        - { text: "Late Harvest", correct: true }
        - { text: "Straw Wine", correct: false }
        - { text: "Cream", correct: false }
      explanation: |
        Late harvest wines vary widely, and some include botrytised berries too.
        Alsace uses Vendanges Tardives for a similar idea; German Spätlese means
        "late picked" but is a must-weight category that can also be dry.
    fr:
      question: "Quelle mention anglaise désigne souvent, sur l’étiquette, un vin doux de raisins laissés à se flétrir sur la vigne ?"
      choices:
        - { text: "Icewine", correct: false }
        - { text: "Late Harvest", correct: true }
        - { text: "Straw Wine", correct: false }
        - { text: "Cream", correct: false }
      explanation: |
        Les Late Harvest sont très variés, et certains contiennent aussi des baies
        botrytisées. L’Alsace emploie Vendanges Tardives dans le même esprit ;
        l’allemand Spätlese signifie « vendangé tard », mais c’est une catégorie de
        richesse du moût qui peut aussi donner un vin sec.

  - id: sweet-dried-grapes-rot-removal-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, rot]
    status: reviewed
    source_id: c08-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "While picked grapes are drying for sweet wine, why are rotting bunches removed?"
      choices:
        - { text: "They would dry too fast and scorch", correct: false }
        - { text: "Their juice would dilute the final must", correct: false }
        - { text: "They would add bitter tannin at pressing", correct: false }
        - { text: "Rot would spread to neighbouring bunches", correct: true }
      explanation: |
        Bunches sit close together for weeks or months in drying rooms, so one
        mouldy cluster can contaminate many. Many Valpolicella producers add fans
        and humidity control to their drying lofts for the same reason.
    fr:
      question: "Pendant le séchage de raisins vendangés pour un vin doux, pourquoi retire-t-on les grappes qui pourrissent ?"
      choices:
        - { text: "Elles sécheraient trop vite et brûleraient", correct: false }
        - { text: "Leur jus diluerait le moût final", correct: false }
        - { text: "Elles apporteraient des tanins amers au pressurage", correct: false }
        - { text: "La pourriture gagnerait les grappes voisines", correct: true }
      explanation: |
        Les grappes restent serrées des semaines, voire des mois, dans les séchoirs :
        une seule grappe moisie peut en contaminer beaucoup. C’est pourquoi de nombreux
        producteurs de Valpolicella équipent leurs greniers de séchage de ventilateurs
        et d’une régulation de l’humidité.

  - id: sweet-dried-grapes-storage-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, climate]
    status: reviewed
    source_id: c08-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which conditions best suit grapes being dried indoors after the harvest?"
      choices:
        - { text: "Dry, airy and fairly warm", correct: true }
        - { text: "Cool and humid, to slow the drying", correct: false }
        - { text: "Cold and still, in a closed cellar", correct: false }
        - { text: "Sealed and dark, under inert gas", correct: false }
      explanation: |
        Air movement carries away the moisture leaving the berries, and dryness
        keeps fungi at bay. Bunches traditionally lay on straw mats or cane racks,
        or hung from rafters, in lofts open to the breeze.
    fr:
      question: "Quelles conditions conviennent le mieux à des raisins mis à sécher à l’abri après la vendange ?"
      choices:
        - { text: "Sec, aéré et assez chaud", correct: true }
        - { text: "Frais et humide, pour ralentir le séchage", correct: false }
        - { text: "Froid et sans courant d’air, dans une cave fermée", correct: false }
        - { text: "Clos et sombre, sous gaz inerte", correct: false }
      explanation: |
        L’air qui circule emporte l’eau qui s’échappe des baies, et la sécheresse tient
        les champignons à distance. Traditionnellement, les grappes reposaient sur des
        nattes de paille ou des claies de roseau, ou pendaient aux poutres, dans des
        greniers ouverts au vent.

  - id: sweet-passito-term-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, italy, terminology]
    status: reviewed
    source_id: c08-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Italian term names a sweet wine made from grapes dried after picking?"
      choices:
        - { text: "Vendemmia tardiva", correct: false }
        - { text: "Ripasso", correct: false }
        - { text: "Passito", correct: true }
        - { text: "Amabile", correct: false }
      explanation: |
        The drying stage itself is called appassimento. Passito wines are made
        across Italy, from Malvasia delle Lipari to Passito di Pantelleria from
        Zibibbo (Muscat of Alexandria).
    fr:
      question: "Quel terme italien désigne un vin doux issu de raisins séchés après la vendange ?"
      choices:
        - { text: "Vendemmia tardiva", correct: false }
        - { text: "Ripasso", correct: false }
        - { text: "Passito", correct: true }
        - { text: "Amabile", correct: false }
      explanation: |
        L’étape de séchage elle-même s’appelle l’appassimento. On produit des passiti
        dans toute l’Italie, du Malvasia delle Lipari au Passito di Pantelleria, issu
        du Zibibbo (Muscat d’Alexandrie).

  - id: sweet-recioto-dried-grapes-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, italy]
    status: reviewed
    source_id: c08-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which of these sweet wines is made from grapes dried after the harvest?"
      choices:
        - { text: "Sauternes", correct: false }
        - { text: "Recioto della Valpolicella", correct: true }
        - { text: "Mosel Eiswein", correct: false }
        - { text: "Trockenbeerenauslese", correct: false }
      explanation: |
        Corvina-led bunches dry for months before a slow ferment that stops with
        sugar left. Sauternes and Trockenbeerenauslese rely on noble rot, and
        Eiswein on grapes frozen on the vine.
    fr:
      question: "Lequel de ces vins doux est élaboré à partir de raisins séchés après la vendange ?"
      choices:
        - { text: "Sauternes", correct: false }
        - { text: "Recioto della Valpolicella", correct: true }
        - { text: "Eiswein de Moselle", correct: false }
        - { text: "Trockenbeerenauslese", correct: false }
      explanation: |
        Les grappes, à dominante de Corvina, sèchent pendant des mois avant une
        fermentation lente qui s’arrête en laissant du sucre. Le Sauternes et la
        Trockenbeerenauslese reposent sur la pourriture noble, l’Eiswein sur des
        raisins gelés sur pied.

  - id: sweet-passito-raisined-character-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, dried-grapes, style]
    status: reviewed
    source_id: c08-0119
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aroma set is typical of a sweet passito wine?"
      choices:
        - { text: "Honey, marmalade and saffron notes", correct: false }
        - { text: "Pure varietal fruit with piercing acidity", correct: false }
        - { text: "Tropical fruit with a rich texture", correct: false }
        - { text: "Raisin, fig and prune notes", correct: true }
      explanation: |
        Months of shrivelling off the vine give cooked, raisined fruit. In a
        Tuscan Vin Santo this shows as raisin, dried apricot and nuts over a
        sweet, full palate.
    fr:
      question: "Quels arômes sont typiques d’un passito doux ?"
      choices:
        - { text: "Miel, marmelade et safran", correct: false }
        - { text: "Fruit variétal pur et acidité tranchante", correct: false }
        - { text: "Fruits tropicaux et texture riche", correct: false }
        - { text: "Raisin sec, figue et pruneau", correct: true }
      explanation: |
        Des mois de flétrissement hors de la vigne donnent des notes de fruits cuits
        et confits. Dans un Vin Santo toscan, on retrouve raisin sec, abricot sec et
        fruits à coque sur une bouche douce et ample.

  - id: sweet-icewine-harvest-timing-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, icewine, harvest]
    status: reviewed
    source_id: c08-0120
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When are grapes for traditional icewine usually picked?"
      choices:
        - { text: "Just after the first light autumn frost", correct: false }
        - { text: "In autumn, once noble rot has spread", correct: false }
        - { text: "Once a hard freeze sets in, often in winter", correct: true }
        - { text: "At normal harvest, then frozen in a cold room", correct: false }
      explanation: |
        Healthy bunches hang for weeks or months until the water in the berries
        freezes solid. Canadian rules require picking at about −8 °C or colder,
        so crews often work at night or at dawn.
    fr:
      question: "Quand vendange-t-on d’habitude les raisins d’un vin de glace traditionnel ?"
      choices:
        - { text: "Juste après la première gelée blanche d’automne", correct: false }
        - { text: "En automne, une fois la pourriture noble installée", correct: false }
        - { text: "Dès qu’un fort gel s’installe, souvent en hiver", correct: true }
        - { text: "À la vendange normale, puis congelés en chambre froide", correct: false }
      explanation: |
        Les grappes saines restent sur pied des semaines ou des mois, jusqu’à ce que
        l’eau des baies gèle complètement. Au Canada, la règle impose de vendanger
        vers −8 °C ou moins, si bien que les équipes travaillent souvent la nuit ou
        à l’aube.

  - id: sweet-icewine-pressing-concentration-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, icewine, pressing]
    status: reviewed
    source_id: c08-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is the juice so sweet when frozen grapes are pressed for icewine?"
      choices:
        - { text: "Much of the water stays behind as ice", correct: true }
        - { text: "Cold weather turns the grapes' acids into sugar", correct: false }
        - { text: "Frost sends extra sugar from the vine to the berries", correct: false }
        - { text: "Noble rot has already shrivelled the berries", correct: false }
      explanation: |
        Only the concentrated, unfrozen part of the juice flows from the press,
        so yields are tiny. In Canada, thick-skinned Vidal is widely used
        because it hangs well into the winter.
    fr:
      question: "Pourquoi le jus est-il si sucré quand on presse des raisins gelés pour un vin de glace ?"
      choices:
        - { text: "Une bonne part de l’eau reste prise en glace", correct: true }
        - { text: "Le froid transforme les acides du raisin en sucre", correct: false }
        - { text: "Le gel fait monter du sucre de la souche vers les baies", correct: false }
        - { text: "La pourriture noble a déjà flétri les baies", correct: false }
      explanation: |
        Seule la fraction non gelée, très concentrée, s’écoule du pressoir : les
        rendements sont minuscules. Au Canada, le Vidal, à la peau épaisse, est très
        utilisé parce qu’il tient bien sur pied jusqu’en hiver.

  - id: sweet-icewine-country-term-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, icewine, labelling]
    status: reviewed
    source_id: c08-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pairing of country and label term fits wine from grapes frozen on the vine?"
      choices:
        - { text: "Hungary — Aszú", correct: false }
        - { text: "Canada — Icewine", correct: true }
        - { text: "Italy — Passito", correct: false }
        - { text: "Austria — Ausbruch", correct: false }
      explanation: |
        Germany and Austria use Eiswein. Ontario's Niagara Peninsula is Canada's
        best-known source, often from Vidal or Riesling. Aszú and Ausbruch refer
        to botrytised berries, Passito to grapes dried after picking.
    fr:
      question: "Quel couple pays–mention correspond à un vin de raisins gelés sur pied ?"
      choices:
        - { text: "Hongrie — Aszú", correct: false }
        - { text: "Canada — Icewine", correct: true }
        - { text: "Italie — Passito", correct: false }
        - { text: "Autriche — Ausbruch", correct: false }
      explanation: |
        L’Allemagne et l’Autriche emploient le terme Eiswein. La péninsule du Niagara,
        en Ontario, est la source canadienne la plus connue, souvent à partir de Vidal
        ou de Riesling. Aszú et Ausbruch désignent des baies botrytisées, Passito des
        raisins séchés après la vendange.

  - id: sweet-cryoextraction-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, icewine, cryoextraction]
    status: reviewed
    source_id: c08-0124
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a producer make an icewine-style wine without waiting for a winter freeze?"
      choices:
        - { text: "Pick at the first light autumn frost", correct: false }
        - { text: "Add ice to the press to chill the must", correct: false }
        - { text: "Spray the vines with water before a frost", correct: false }
        - { text: "Freeze picked grapes before pressing", correct: true }
      explanation: |
        Artificial freezing, sometimes called cryoextraction, concentrates the
        juice in the same way, but the wine may not use the protected terms
        Icewine or Eiswein. Bonny Doon's Vin de Glacière, from Muscat frozen after
        picking, was a well-known Californian example.
    fr:
      question: "Comment un producteur peut-il faire un vin dans le style d’un vin de glace sans attendre le gel d’hiver ?"
      choices:
        - { text: "Vendanger dès la première gelée blanche d’automne", correct: false }
        - { text: "Ajouter de la glace au pressoir pour refroidir le moût", correct: false }
        - { text: "Arroser les vignes juste avant une gelée", correct: false }
        - { text: "Congeler les raisins vendangés avant pressurage", correct: true }
      explanation: |
        Cette congélation artificielle, appelée cryoextraction, concentre le jus de la
        même façon, mais le vin ne peut pas porter les mentions protégées Icewine ou
        Eiswein. Le Vin de Glacière de Bonny Doon, issu de Muscat congelé après la
        vendange, en fut un exemple californien connu.

  - id: sweet-high-sugar-ferment-stops-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, fermentation, sweet]
    status: reviewed
    source_id: c08-0125
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do ferments of very concentrated sweet-wine musts often stop with plenty of sugar left?"
      choices:
        - { text: "Concentrated acidity poisons the yeast", correct: false }
        - { text: "Very high sugar puts the yeast under stress", correct: true }
        - { text: "The dense juice holds too little oxygen", correct: false }
        - { text: "Grape tannin builds up and halts the yeast", correct: false }
      explanation: |
        Sugar draws water out of yeast cells, and noble rot can also strip
        nutrients from the must, so fermentation may crawl for weeks and stall
        early. Producers often accept that natural stop, then stabilise the wine.
    fr:
      question: "Pourquoi la fermentation de moûts de vins doux très concentrés s’arrête-t-elle souvent en laissant beaucoup de sucre ?"
      choices:
        - { text: "L’acidité concentrée empoisonne les levures", correct: false }
        - { text: "L’excès de sucre met les levures en difficulté", correct: true }
        - { text: "Le jus trop dense contient trop peu d’oxygène", correct: false }
        - { text: "Les tanins du raisin s’accumulent et bloquent les levures", correct: false }
      explanation: |
        Le sucre attire l’eau hors des cellules de levure, et la pourriture noble peut
        en plus appauvrir le moût en nutriments : la fermentation se traîne pendant
        des semaines et s’arrête tôt. Les producteurs acceptent souvent cet arrêt
        naturel, puis stabilisent le vin.

  - id: white-aromatic-careful-handling-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, aromatic, handling]
    status: reviewed
    source_id: c08-0126
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is fruit for a fresh aromatic white such as Muscat handled gently and kept cool?"
      choices:
        - { text: "To keep its fresh fruit and floral aromas", correct: true }
        - { text: "To extract more tannin from the skins", correct: false }
        - { text: "To encourage early browning for texture", correct: false }
        - { text: "To prepare the juice for malolactic conversion", correct: false }
      explanation: |
        Volatile aroma compounds are lost to heat, oxygen and rough handling.
        Night picking, chilled transport and handling under inert gas help a
        Muscat or Riesling keep the smell of fresh grapes.
    fr:
      question: "Pourquoi traite-t-on avec douceur, et au frais, la vendange destinée à un blanc aromatique et frais comme le Muscat ?"
      choices:
        - { text: "Pour préserver ses arômes de fruit frais et de fleurs", correct: true }
        - { text: "Pour extraire davantage de tanins des pellicules", correct: false }
        - { text: "Pour favoriser un brunissement précoce qui donne de la texture", correct: false }
        - { text: "Pour préparer le moût à la fermentation malolactique", correct: false }
      explanation: |
        Les composés aromatiques volatils se perdent à la chaleur, à l’oxygène et aux
        manipulations brutales. Vendange de nuit, transport réfrigéré et travail sous
        gaz inerte aident un Muscat ou un Riesling à garder son parfum de raisin frais.

  - id: white-aromatic-gentle-settling-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, aromatic, clarification]
    status: reviewed
    source_id: c08-0131
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which clarification is typical for aromatic white juice before fermentation?"
      choices:
        - { text: "Gentle settling, then racking off", correct: true }
        - { text: "Fining with egg whites", correct: false }
        - { text: "Sterile membrane filtration", correct: false }
        - { text: "Long contact with the gross lees", correct: false }
      explanation: |
        The juice is chilled so solids sink over a day or so, then the clear
        juice is drawn off. Egg-white fining is a red-wine tannin treatment, and
        a sterile membrane would clog on cloudy juice.
    fr:
      question: "Quelle clarification est typique d’un moût de blanc aromatique avant fermentation ?"
      choices:
        - { text: "Un débourbage doux, puis un soutirage", correct: true }
        - { text: "Un collage au blanc d’œuf", correct: false }
        - { text: "Une filtration stérile sur membrane", correct: false }
        - { text: "Un long contact avec les grosses lies", correct: false }
      explanation: |
        Le moût est refroidi pour que les bourbes se déposent en un jour environ, puis
        le jus clair est soutiré. Le collage au blanc d’œuf sert à assouplir les tanins
        des rouges, et une membrane stérile se colmaterait sur un moût trouble.

  - id: white-aromatic-steel-fermentation-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, aromatic, vessels]
    status: reviewed
    source_id: c08-0132
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do most producers ferment fresh aromatic whites in stainless steel rather than new oak?"
      choices:
        - { text: "It allows a warm ferment for richness", correct: false }
        - { text: "It keeps the wine on its gross lees", correct: false }
        - { text: "It adds little flavour of its own", correct: true }
        - { text: "It speeds malolactic conversion", correct: false }
      explanation: |
        Steel lets the grape's own aromas lead and makes temperature control
        easy. In a dry Clare Valley Riesling or an Alsace Muscat, oak spice would
        only compete with the fruit.
    fr:
      question: "Pourquoi la plupart des producteurs font-ils fermenter les blancs aromatiques et frais en cuve inox plutôt qu’en fût neuf ?"
      choices:
        - { text: "L’inox permet une fermentation chaude, pour la richesse", correct: false }
        - { text: "L’inox garde le vin sur ses grosses lies", correct: false }
        - { text: "L’inox n’apporte presque aucun goût", correct: true }
        - { text: "L’inox accélère la fermentation malolactique", correct: false }
      explanation: |
        L’inox laisse s’exprimer les arômes du raisin et facilite la maîtrise des
        températures. Dans un Riesling sec de Clare Valley ou un Muscat d’Alsace, les
        épices du chêne ne feraient que concurrencer le fruit.

  - id: white-alsace-riesling-foudre-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, alsace, vessels]
    status: reviewed
    source_id: c08-0133
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do some Alsace Riesling producers ferment in large, old oak foudres?"
      choices:
        - { text: "To keep the wine sealed from air", correct: false }
        - { text: "To speed malolactic conversion", correct: false }
        - { text: "To cool the ferment faster", correct: false }
        - { text: "To let in a touch of oxygen", correct: true }
      explanation: |
        Decades of use and a thick tartrate lining leave the wood almost
        flavour-neutral, yet slight oxygen exchange still rounds the texture.
        Hugel still uses a cask dating from 1715.
    fr:
      question: "Pourquoi certains producteurs alsaciens font-ils fermenter leur Riesling en grands foudres de chêne anciens ?"
      choices:
        - { text: "Pour tenir le vin à l’abri de l’air", correct: false }
        - { text: "Pour accélérer la fermentation malolactique", correct: false }
        - { text: "Pour refroidir plus vite la fermentation", correct: false }
        - { text: "Pour laisser entrer un peu d’oxygène", correct: true }
      explanation: |
        Des décennies d’usage et une épaisse couche de tartre rendent le bois presque
        neutre en goût, mais un léger échange d’oxygène arrondit tout de même la
        texture. Hugel utilise encore un foudre datant de 1715.

  - id: sweet-riesling-botrytis-ferment-end-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, botrytis, fermentation]
    status: reviewed
    source_id: c08-0136
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Roughly what alcohol does a German Trockenbeerenauslese usually reach?"
      choices:
        - { text: "About 6–8% abv", correct: true }
        - { text: "About 10–11% abv", correct: false }
        - { text: "About 12–13% abv", correct: false }
        - { text: "About 14–15% abv", correct: false }
      explanation: |
        The law asks for as little as 5.5% abv, and much of the sugar stays
        unfermented, which keeps these wines light in alcohol yet intensely sweet.
        A Sauternes, by contrast, usually ferments on to around 13–14%.
    fr:
      question: "Quel degré d’alcool atteint en général une Trockenbeerenauslese allemande ?"
      choices:
        - { text: "Environ 6 à 8 % vol.", correct: true }
        - { text: "Environ 10 à 11 % vol.", correct: false }
        - { text: "Environ 12 à 13 % vol.", correct: false }
        - { text: "Environ 14 à 15 % vol.", correct: false }
      explanation: |
        La loi n’exige que 5,5 % vol. : une grande partie du sucre reste non fermentée,
        d’où des vins légers en alcool mais intensément doux. Un Sauternes, à
        l’inverse, fermente en général jusqu’à 13 à 14 % environ.

  - id: white-riesling-sauvignon-no-mlf-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, malolactic, riesling, sauvignon-blanc]
    status: reviewed
    source_id: c08-0137
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do most Riesling and Sauvignon Blanc producers avoid malolactic conversion?"
      choices:
        - { text: "It would add tannin and deepen the colour", correct: false }
        - { text: "It would soften acidity and add buttery notes", correct: true }
        - { text: "It would raise alcohol and add sweetness", correct: false }
        - { text: "It would strip out the wine's protective SO₂", correct: false }
      explanation: |
        Both grapes are prized for crisp acidity and vivid varietal fruit.
        Diacetyl, the buttery by-product, would blur that bright primary fruit.
    fr:
      question: "Pourquoi la plupart des producteurs de Riesling et de Sauvignon Blanc évitent-ils la fermentation malolactique ?"
      choices:
        - { text: "Elle ajouterait des tanins et foncerait la couleur", correct: false }
        - { text: "Elle adoucirait l’acidité, avec des notes beurrées", correct: true }
        - { text: "Elle augmenterait l’alcool et ajouterait du sucre", correct: false }
        - { text: "Elle éliminerait le SO₂ qui protège le vin", correct: false }
      explanation: |
        Les deux cépages sont appréciés pour leur acidité vive et leur fruit variétal
        éclatant. Le diacétyle, responsable des notes beurrées, brouillerait ce fruit
        primaire.

  - id: white-riesling-lees-contact-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, lees]
    status: reviewed
    source_id: c08-0138
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "After fermentation, which option can add texture and flavour to a Riesling?"
      choices:
        - { text: "Skin maceration after fermentation", correct: false }
        - { text: "Micro-oxygenation in tank", correct: false }
        - { text: "Time on the fine lees", correct: true }
        - { text: "Chips of heavily toasted oak", correct: false }
      explanation: |
        Yeast cells break down slowly, releasing compounds that round the palate
        and add a subtle savoury note. Some producers stir the lees; others leave
        the wine undisturbed on them through the winter.
    fr:
      question: "Après la fermentation, quelle option peut apporter texture et saveur à un Riesling ?"
      choices:
        - { text: "Une macération pelliculaire après fermentation", correct: false }
        - { text: "La micro-oxygénation en cuve", correct: false }
        - { text: "Un élevage sur lies fines", correct: true }
        - { text: "Des copeaux de chêne à forte chauffe", correct: false }
      explanation: |
        Les levures mortes se décomposent lentement et libèrent des composés qui
        arrondissent la bouche et ajoutent une discrète note de levure. Certains
        producteurs pratiquent le bâtonnage ; d’autres laissent le vin reposer sur ses
        lies tout l’hiver.

  - id: white-riesling-oak-duration-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, riesling, oak, maturation]
    status: reviewed
    source_id: c08-0139
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Alsace and Germany, how long is Riesling commonly kept in large old oak before bottling?"
      choices:
        - { text: "About three years", correct: false }
        - { text: "About four to five years", correct: false }
        - { text: "About 18 months to two years", correct: false }
        - { text: "Up to about a year", correct: true }
      explanation: |
        Mosel Fuder hold about 1,000 litres and Alsace foudres often far more,
        so oxygen and oak influence stay low. Many such wines are bottled in the
        spring or summer after harvest to keep their fruit fresh.
    fr:
      question: "En Alsace et en Allemagne, combien de temps le Riesling reste-t-il couramment en grands contenants de chêne anciens avant la mise en bouteille ?"
      choices:
        - { text: "Environ trois ans", correct: false }
        - { text: "Environ quatre à cinq ans", correct: false }
        - { text: "Environ 18 mois à deux ans", correct: false }
        - { text: "Jusqu’à un an environ", correct: true }
      explanation: |
        Un Fuder mosellan contient environ 1 000 litres et un foudre alsacien souvent
        bien plus : l’oxygène et le bois ont donc peu d’influence. Beaucoup de ces vins
        sont mis en bouteille au printemps ou à l’été suivant la vendange pour garder
        leur fruit frais.

  - id: white-sauvignon-barrel-style-profile-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, oak, style]
    status: reviewed
    source_id: c08-0140
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a Fumé Blanc or white Graves style of Sauvignon Blanc usually differ from crisp Marlborough?"
      choices:
        - { text: "It is creamier and spicier", correct: true }
        - { text: "It is leaner and more herbaceous", correct: false }
        - { text: "It is sweeter and more floral", correct: false }
        - { text: "It is lighter and more pungent", correct: false }
      explanation: |
        Oak adds sweet spice and toast, lees give a rounder palate, and the green,
        pungent notes recede. White Pessac-Léognan and Robert Mondavi's Fumé Blanc
        are well-known examples.
    fr:
      question: "En quoi un Sauvignon Blanc de style Fumé Blanc ou Graves blanc diffère-t-il d’habitude d’un Marlborough vif ?"
      choices:
        - { text: "Il est plus crémeux et plus épicé", correct: true }
        - { text: "Il est plus tendu et plus herbacé", correct: false }
        - { text: "Il est plus doux et plus floral", correct: false }
        - { text: "Il est plus léger et plus intense", correct: false }
      explanation: |
        Le chêne apporte des épices douces et du grillé, les lies arrondissent la
        bouche, et les notes vertes et intenses s’effacent. Le Pessac-Léognan blanc et
        le Fumé Blanc de Robert Mondavi en sont des exemples connus.

  - id: white-sauvignon-barrel-style-techniques-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, sauvignon-blanc, oak, lees]
    status: reviewed
    source_id: c08-0140
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cellar programme builds a rich, complex style of Sauvignon Blanc?"
      choices:
        - { text: "Cool steel ferment and early bottling", correct: false }
        - { text: "Carbonic maceration in sealed tanks", correct: false }
        - { text: "Barrel ferment, lees ageing, some new oak", correct: true }
        - { text: "Sweet reserve and sterile filtration", correct: false }
      explanation: |
        Some producers also use ambient yeasts for complexity, and a few allow
        partial malolactic conversion. The share of new oak is usually kept modest
        so the wood does not bury the fruit.
    fr:
      question: "Quel itinéraire de vinification donne un Sauvignon Blanc riche et complexe ?"
      choices:
        - { text: "Fermentation fraîche en inox, mise précoce", correct: false }
        - { text: "Macération carbonique en cuve close", correct: false }
        - { text: "Fût, élevage sur lies, un peu de bois neuf", correct: true }
        - { text: "Réserve de moût et filtration stérile", correct: false }
      explanation: |
        Certains misent sur les levures indigènes pour la complexité, et quelques-uns
        acceptent une malolactique partielle. La part de bois neuf reste d’ordinaire
        modérée pour que le chêne n’écrase pas le fruit.

  - id: white-chardonnay-cellar-scope-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, style]
    status: reviewed
    source_id: c08-0141
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape gives the winemaker the most room to shape the wine's flavour in the cellar?"
      choices:
        - { text: "Muscat", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Gewurztraminer", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
      explanation: |
        Its fairly neutral varietal aroma leaves space for oak, lees and
        malolactic notes to build the style. The same grape gives steely, unoaked
        Chablis and rich, barrel-aged Meursault.
    fr:
      question: "Quel cépage blanc laisse au vinificateur le plus de latitude pour façonner le goût du vin au chai ?"
      choices:
        - { text: "Muscat", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Gewurztraminer", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
      explanation: |
        Son arôme variétal assez neutre laisse de la place aux notes de bois, de lies
        et de malolactique. Le même cépage donne le Chablis tendu, sans bois, et le
        Meursault riche, élevé en fût.

  - id: white-neutral-grape-pure-style-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, style, vessels]
    status: reviewed
    source_id: c08-0143
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A producer wants a Chardonnay that tastes mainly of grape and site. Which cellar approach fits best?"
      choices:
        - { text: "Minimal intervention in inert vessels", correct: true }
        - { text: "Barrel fermentation with lees stirring", correct: false }
        - { text: "Long ageing in new small oak", correct: false }
        - { text: "Extended skin contact before pressing", correct: false }
      explanation: |
        With little added, the wine shows the grape's citrus or orchard fruit and
        the site's acidity. The other route layers barrel fermentation, lees work
        and malolactic conversion on the same fruit.
    fr:
      question: "Un producteur veut un Chardonnay qui exprime surtout le raisin et le lieu. Quelle approche de chai convient le mieux ?"
      choices:
        - { text: "Peu d’interventions, en contenants neutres", correct: true }
        - { text: "Fermentation en fût avec bâtonnage", correct: false }
        - { text: "Long élevage en barriques neuves", correct: false }
        - { text: "Longue macération pelliculaire avant pressurage", correct: false }
      explanation: |
        Avec peu d’ajouts, le vin montre les agrumes ou les fruits blancs du cépage
        et l’acidité du lieu. L’autre voie superpose fermentation en fût, travail des
        lies et malolactique sur le même fruit.

  - id: white-chardonnay-spring-frost-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, frost, viticulture]
    status: reviewed
    source_id: c08-0144
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is Chardonnay especially exposed to spring frost?"
      choices:
        - { text: "It flowers very late", correct: false }
        - { text: "It ripens late in autumn", correct: false }
        - { text: "It buds early", correct: true }
        - { text: "Its skins are thin", correct: false }
      explanation: |
        Tender new shoots appear while frost risk is still high. Chablis growers
        protect them with heaters and with sprinklers that coat the buds in a
        protective layer of ice.
    fr:
      question: "Pourquoi le Chardonnay est-il particulièrement exposé aux gelées de printemps ?"
      choices:
        - { text: "Il fleurit très tard", correct: false }
        - { text: "Il mûrit tard en automne", correct: false }
        - { text: "Il débourre tôt", correct: true }
        - { text: "Sa pellicule est fine", correct: false }
      explanation: |
        Les jeunes pousses sortent alors que le risque de gel reste élevé. À Chablis,
        on les protège avec des chaufferettes et par aspersion, qui enrobe les
        bourgeons d’une couche de glace protectrice.

  - id: white-chardonnay-climate-range-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate]
    status: reviewed
    source_id: c08-0145
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape ripens successfully across the widest range of climates, from cool to hot?"
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Gewurztraminer", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay", correct: true }
      explanation: |
        It ripens from Chablis and Champagne to warm parts of California and
        Australia, one reason it is so widely planted. Its style shifts with the
        climate rather than failing outright.
    fr:
      question: "Quel cépage blanc mûrit bien dans la plus large gamme de climats, du frais au chaud ?"
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Gewurztraminer", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Chardonnay", correct: true }
      explanation: |
        Il mûrit aussi bien à Chablis et en Champagne que dans les zones chaudes de
        Californie et d’Australie, l’une des raisons de sa large diffusion. Son style
        change avec le climat au lieu d’échouer.

  - id: white-chardonnay-cool-climate-fruit-001
    type: mcq
