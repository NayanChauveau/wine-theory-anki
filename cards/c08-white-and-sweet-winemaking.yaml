      question: "Which fruit flavours are typical of Chardonnay from a hot climate?"
      choices:
        - { text: "Banana and pineapple", correct: true }
        - { text: "Green apple and lemon", correct: false }
        - { text: "White peach and melon", correct: false }
        - { text: "Apricot and honey", correct: false }
      explanation: |
        High sugar and fast ripening push the fruit into tropical notes, often
        with lower acidity and higher alcohol, as in many Chardonnays from warm
        valley floors in California or inland Australia.
    fr:
      question: "Quels arômes de fruits sont typiques d’un Chardonnay de climat chaud ?"
      choices:
        - { text: "Banane et ananas", correct: true }
        - { text: "Pomme verte et citron", correct: false }
        - { text: "Pêche blanche et melon", correct: false }
        - { text: "Abricot et miel", correct: false }
      explanation: |
        Beaucoup de sucre et une maturation rapide poussent le fruit vers des notes
        tropicales, souvent avec moins d’acidité et plus d’alcool, comme dans bien des
        Chardonnays des fonds de vallée chauds de Californie ou de l’intérieur de
        l’Australie.

  - id: white-chardonnay-hot-harvest-acidity-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, climate, harvest]
    status: reviewed
    source_id: c08-0147
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a hot region, why must the Chardonnay harvest be timed closely?"
      choices:
        - { text: "Its berries split and rot within days", correct: false }
        - { text: "Its aromas turn green and grassy", correct: false }
        - { text: "Its acidity can fall quickly", correct: true }
        - { text: "Its sugar drops soon after ripeness", correct: false }
      explanation: |
        In heat, the vine burns off malic acid quickly in the final weeks, so a
        few days' delay can leave the wine flat. Producers may pick early, pick at
        night, or acidify where the rules allow.
    fr:
      question: "Dans une région chaude, pourquoi faut-il choisir la date de vendange du Chardonnay avec précision ?"
      choices:
        - { text: "Ses baies éclatent et pourrissent en quelques jours", correct: false }
        - { text: "Ses arômes deviennent verts et herbacés", correct: false }
        - { text: "Son acidité peut chuter rapidement", correct: true }
        - { text: "Son sucre baisse peu après la maturité", correct: false }
      explanation: |
        Sous la chaleur, la vigne consomme vite son acide malique dans les dernières
        semaines : quelques jours de retard peuvent donner un vin plat. Les producteurs
        peuvent vendanger tôt, de nuit, ou acidifier là où la réglementation le permet.

  - id: white-burgundy-chardonnay-aged-aromas-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, burgundy, flavour]
    status: reviewed
    source_id: c08-0149
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aromas can develop in the finest white Burgundies?"
      choices:
        - { text: "Petrol and lime", correct: false }
        - { text: "Hazelnut and mushroom", correct: true }
        - { text: "Lychee and rose petal", correct: false }
        - { text: "Asparagus and cut grass", correct: false }
      explanation: |
        These savoury notes build through lees work, barrel ageing and time in
        bottle. Meursault is especially known for its nutty character.
    fr:
      question: "Quels arômes peuvent se développer dans les plus grands bourgognes blancs ?"
      choices:
        - { text: "Pétrole et citron vert", correct: false }
        - { text: "Noisette et champignon", correct: true }
        - { text: "Litchi et pétale de rose", correct: false }
        - { text: "Asperge et herbe coupée", correct: false }
      explanation: |
        Ces notes de fruits secs et de sous-bois se construisent avec le travail des
        lies, l’élevage en fût et la garde en bouteille. Le Meursault est
        particulièrement réputé pour son caractère de noisette.

  - id: white-chardonnay-oak-trend-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, chardonnay, oak, style]
    status: reviewed
    source_id: c08-0150
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which shift has marked premium Chardonnay making in many regions in recent decades?"
      choices:
        - { text: "More new oak with a heavier toast", correct: false }
        - { text: "Later picking for riper tropical fruit", correct: false }
        - { text: "More residual sugar for a rounder feel", correct: false }
        - { text: "Lighter use of new oak", correct: true }
      explanation: |
        After the buttery, heavily oaked styles of the 1980s and 1990s, many
        producers turned to earlier picking, larger or older barrels and less new
        wood. Sonoma Coast and the Adelaide Hills illustrate the leaner style.
    fr:
      question: "Quelle évolution a marqué l’élaboration des Chardonnays haut de gamme dans de nombreuses régions ces dernières décennies ?"
      choices:
        - { text: "Plus de bois neuf, avec une chauffe plus forte", correct: false }
        - { text: "Des vendanges plus tardives pour un fruit tropical", correct: false }
        - { text: "Plus de sucre résiduel pour une bouche plus ronde", correct: false }
        - { text: "Un usage plus mesuré du bois neuf", correct: true }
      explanation: |
        Après les styles beurrés et très boisés des années 1980 et 1990, de nombreux
        producteurs ont vendangé plus tôt, choisi des fûts plus grands ou plus anciens
        et réduit le bois neuf. Sonoma Coast et les Adelaide Hills illustrent ce style
        plus tendu.

  - id: white-bulk-clarity-expectation-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, bulk, clarity]
    status: reviewed
    source_id: c08-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What do shoppers buying inexpensive, high-volume white wine expect to see in the glass?"
      choices:
        - { text: "A light haze showing minimal filtration", correct: false }
        - { text: "Bright, clear wine with no deposit", correct: true }
        - { text: "A few tartrate crystals in the bottle", correct: false }
        - { text: "A deep golden tint from barrel ageing", correct: false }
      explanation: |
        Most casual buyers read haze or crystals as a fault, even when they are harmless.
        For a large brand, a clear and stable look is part of the product, so it is
        engineered before bottling.
    fr:
      question: "Qu’attendent de voir dans le verre les acheteurs de vins blancs bon marché produits en grand volume ?"
      choices:
        - { text: "Un léger voile, signe d’une filtration minimale", correct: false }
        - { text: "Un vin limpide et brillant, sans dépôt", correct: true }
        - { text: "Quelques cristaux de tartre dans la bouteille", correct: false }
        - { text: "Une teinte dorée profonde due à l’élevage en fût", correct: false }
      explanation: |
        La plupart des acheteurs occasionnels voient un voile ou des cristaux comme un
        défaut, même s’ils sont inoffensifs. Pour une grande marque, un aspect limpide
        et stable fait partie du produit : il se prépare avant la mise en bouteille.

  - id: white-bulk-stabilise-filter-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, bulk, stabilisation, filtration]
    status: reviewed
    source_id: c08-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pre-bottling routine is typical for a high-volume white that must stay clear on the shelf?"
      choices:
        - { text: "Bottling unfiltered straight off the fine lees", correct: false }
        - { text: "Several months in old barrels then racking", correct: false }
        - { text: "Light settling, then bottling with no fining", correct: false }
        - { text: "Stabilisation, fining and sterile filtration", correct: true }
      explanation: |
        Cold stabilisation drops tartrates that would otherwise crystallise in a cold
        fridge, bentonite fining removes the proteins behind heat haze, and sterile
        filtration removes yeast and bacteria that could referment or spoil the wine.
    fr:
      question: "Quelle préparation avant la mise en bouteille est typique d’un blanc de grand volume qui doit rester limpide en rayon ?"
      choices:
        - { text: "Mise sans filtration, directement sur lies fines", correct: false }
        - { text: "Plusieurs mois en vieux fûts, puis soutirage", correct: false }
        - { text: "Simple décantation, puis mise sans collage", correct: false }
        - { text: "Stabilisation, collage et filtration stérile", correct: true }
      explanation: |
        La stabilisation tartrique par le froid fait précipiter les cristaux qui se
        formeraient sinon au réfrigérateur, le collage à la bentonite élimine les
        protéines responsables de la casse protéique, et la filtration stérile retire
        levures et bactéries qui pourraient refermenter ou altérer le vin.

  - id: white-premium-priority-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, premium, pressing]
    status: reviewed
    source_id: c08-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which press-house choice marks a premium white producer?"
      choices:
        - { text: "Adding back press wine for extra body", correct: false }
        - { text: "Keeping the heavy press fractions apart", correct: true }
        - { text: "Long skin contact before pressing", correct: false }
        - { text: "Pressing hard to raise the juice yield", correct: false }
      explanation: |
        Late, high-pressure fractions carry more phenolics and potassium and less acidity.
        Setting them aside shrinks the top wine; Champagne, for example, caps the first
        pressing at 2,050 litres per 4,000 kg of grapes.
    fr:
      question: "Quel choix au pressoir distingue un producteur de blancs haut de gamme ?"
      choices:
        - { text: "Réintégrer des vins de presse pour plus de corps", correct: false }
        - { text: "Isoler les jus de fin de pressurage", correct: true }
        - { text: "Une longue macération pelliculaire avant pressurage", correct: false }
        - { text: "Presser fort pour augmenter le rendement en jus", correct: false }
      explanation: |
        Les fractions de fin de pressurage, extraites à forte pression, sont plus riches en
        composés phénoliques et en potassium, et moins acides. Les écarter réduit le volume
        de la grande cuvée : en Champagne, la cuvée est plafonnée à 2 050 litres pour
        4 000 kg de raisin.

  - id: white-aromatic-definition-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, aromatic, grape-variety]
    status: reviewed
    source_id: c08-0055
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does most of an aromatic grape variety's character come from?"
      choices:
        - { text: "Toasted oak used in the cellar", correct: false }
        - { text: "Aroma compounds in the grape itself", correct: true }
        - { text: "Long ageing on the lees", correct: false }
        - { text: "Several years of bottle ageing", correct: false }
      explanation: |
        Families of aroma compounds such as terpenes and thiols are already present in the
        berry and carry through into the wine, so the cellar aims to protect them. Neutral
        grapes like Chardonnay lean more on winemaking for their flavour.
    fr:
      question: "D’où vient l’essentiel du caractère d’un cépage aromatique ?"
      choices:
        - { text: "Du bois toasté utilisé au chai", correct: false }
        - { text: "Des composés aromatiques du raisin lui-même", correct: true }
        - { text: "D’un long élevage sur lies", correct: false }
        - { text: "De plusieurs années de vieillissement en bouteille", correct: false }
      explanation: |
        Des familles de composés comme les terpènes et les thiols sont déjà présentes dans
        la baie et passent dans le vin ; le travail de chai cherche donc à les préserver.
        Les cépages neutres comme le Chardonnay doivent davantage à la vinification.

  - id: white-aromatic-group-001
    type: mcq
    deck: White and Sweet Winemaking
    tags: [winemaking, aromatic, grape-variety]
    status: reviewed
    source_id: c08-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which trio is made up of aromatic white grape varieties?"
      choices:
        - { text: "Muscat, Chardonnay and Melon de Bourgogne", correct: false }
        - { text: "Sauvignon Blanc, Trebbiano and Airén", correct: false }
        - { text: "Gewurztraminer, Pinot Blanc and Palomino", correct: false }
        - { text: "Sauvignon Blanc, Muscat and Gewurztraminer", correct: true }
      explanation: |
        Riesling belongs to the same family. Chardonnay, Melon, Trebbiano, Airén, Pinot
        Blanc and Palomino are neutral grapes whose wines get much of their character
        from oak, lees, ageing or blending.
    fr:
      question: "Quel trio est composé de cépages blancs aromatiques ?"
      choices:
        - { text: "Muscat, Chardonnay et Melon de Bourgogne", correct: false }
        - { text: "Sauvignon Blanc, Trebbiano et Airén", correct: false }
        - { text: "Gewurztraminer, Pinot Blanc et Palomino", correct: false }
        - { text: "Sauvignon Blanc, Muscat et Gewurztraminer", correct: true }
      explanation: |
        Le Riesling fait partie de la même famille. Chardonnay, Melon, Trebbiano, Airén,
        Pinot Blanc et Palomino sont des cépages neutres : leurs vins tirent une bonne part
        de leur caractère du bois, des lies, du vieillissement ou de l’assemblage.

  - id: white-aromatic-torrontes-001
