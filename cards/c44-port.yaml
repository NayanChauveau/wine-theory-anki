    en:
      question: "Within a multi-estate shipper's range, how is its Single Quinta Vintage Port usually ranked against its declared Vintage Port?"
      choices:
        - { text: "Above it, as the house's top bottling", correct: false }
        - { text: "Below the house's Late Bottled Vintage", correct: false }
        - { text: "A step below, yet still a premium wine", correct: true }
        - { text: "Level with it, at an identical price", correct: false }
