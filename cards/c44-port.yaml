        - { text: "A base wine for its tawnies", correct: false }
        - { text: "Its bulk export wine", correct: false }
      explanation: |
        It is made in small quantities and only in good years, but it is the
        wine critics score and collectors trade, so it carries the house's
        reputation.
    fr:
      question: "Quelle place le Porto Vintage occupe-t-il généralement dans la gamme d’une maison de Porto ?"
      choices:
        - { text: "Sa principale ligne en volume", correct: false }
        - { text: "Son vin phare", correct: true }
        - { text: "Un vin de base pour ses Tawny", correct: false }
        - { text: "Son vin d’export en vrac", correct: false }
      explanation: |
        Il est produit en petites quantités et seulement les bonnes années, mais c’est
        le vin que les critiques notent et que les collectionneurs s’échangent : il
        porte la réputation de la maison.

  - id: port-vintage-declaration-frequency-001
    type: mcq
    deck: Port
    tags: [port, vintage, declaration]
    status: reviewed
