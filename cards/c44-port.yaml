  - id: port-single-quinta-release-001
    type: mcq
    deck: Port
    tags: [port, single-quinta, maturation]
    status: reviewed
    source_id: c44-0106
    review:
      fact_check: pass
      sources: [world-of-fine-wine, taylor-site]
    en:
      question: "What release practice has traditionally been common for Single Quinta Vintage Ports?"
      choices:
        - { text: "Kept in cask about a decade before bottling", correct: false }
        - { text: "Held back in bottle until near drinking", correct: true }
        - { text: "Sold within months of the harvest", correct: false }
        - { text: "Refreshed with older reserve wine before sale", correct: false }
      explanation: |
        Like any Vintage Port they spend little time in wood and do their
        maturing in bottle. They tend to open up sooner than a classic
        Vintage, often from about ten years, so a shipper can cellar them and
        sell them nearly ready; some houses now release them soon after bottling.
    fr:
      question: "Quelle pratique de mise en marché a traditionnellement été courante pour les Single Quinta Vintage ?"
      choices:
        - { text: "Gardés en fût une dizaine d’années avant embouteillage", correct: false }
        - { text: "Conservés en bouteille jusqu’à leur maturité", correct: true }
        - { text: "Vendus quelques mois après la récolte", correct: false }
        - { text: "Rafraîchis avec du vieux vin de réserve avant la vente", correct: false }
      explanation: |
        Comme tout Porto Vintage, ils passent peu de temps sous bois et mûrissent en
        bouteille. Ils s’ouvrent plus tôt qu’un Vintage classique, souvent vers dix ans,
        si bien qu’un négociant peut les garder en cave et les vendre presque prêts à
        boire ; certaines maisons les commercialisent désormais peu après la mise en
        bouteille.
