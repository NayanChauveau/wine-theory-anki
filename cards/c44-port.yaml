      choices:
        - { text: "12, 15 and 18 Years Old", correct: false }
        - { text: "10, 20 and 30 Years Old", correct: true }
        - { text: "5, 8 and 12 Years Old", correct: false }
        - { text: "15, 25 and 35 Years Old", correct: false }
      explanation: |
        The ladder steps in decades and also includes 40 Years Old. Rules in
        force since 2022 add 50 Years Old and a Very Very Old mention for
        tawnies of more than 80 years.
    fr:
      question: "Quelle série d’indications d’âge peut légalement figurer sur l’étiquette d’un Porto Tawny ?"
      choices:
        - { text: "12, 15 et 18 ans d’âge", correct: false }
        - { text: "10, 20 et 30 ans d’âge", correct: true }
        - { text: "5, 8 et 12 ans d’âge", correct: false }
        - { text: "15, 25 et 35 ans d’âge", correct: false }
      explanation: |
        L’échelle progresse par décennies et comprend aussi 40 ans d’âge. Les règles en
        vigueur depuis 2022 y ajoutent 50 ans d’âge et une mention Very Very Old pour
        les Tawny de plus de 80 ans.

  - id: port-tawny-age-average-meaning-001
    type: mcq
    deck: Port
    tags: [port, tawny, age-indicated, labelling]
    status: reviewed
    source_id: c44-0088
    review:
      fact_check: pass
      sources: [ivdp, producer-site]
    en:
      question: "What does the figure on a '20 Years Old' tawny Port label indicate?"
      choices:
        - { text: "The age of the youngest wine in the blend", correct: false }
        - { text: "The age of the oldest wine in the blend", correct: false }
        - { text: "The approximate average age and style of the blend", correct: true }
        - { text: "The number of years since the wine was bottled", correct: false }
      explanation: |
        A blend of younger and much older lots is assembled to taste like a
        tawny of that age, and official tasters must agree that it does. No
        rule requires every component to be twenty years old.
    fr:
      question: "Que signifie le chiffre sur l’étiquette d’un Tawny « 20 ans d’âge » ?"
      choices:
        - { text: "L’âge du plus jeune vin de l’assemblage", correct: false }
        - { text: "L’âge du plus vieux vin de l’assemblage", correct: false }
        - { text: "L’âge moyen indicatif et le style du vin", correct: true }
        - { text: "Le nombre d’années depuis la mise en bouteille", correct: false }
      explanation: |
        Des lots plus jeunes et d’autres beaucoup plus vieux sont assemblés pour avoir
        le goût d’un Tawny de cet âge, et les dégustateurs officiels doivent le
        confirmer. Aucune règle n’impose que chaque composant ait vingt ans.

  - id: port-tawny-bottling-year-label-001
    type: mcq
    deck: Port
    tags: [port, tawny, age-indicated, labelling, regulation]
    status: reviewed
    source_id: c44-0089
    review:
      fact_check: pass
      sources: [ivdp, ivdp-regulation]
    en:
      question: "Besides its age statement, which date must appear on the label of a tawny Port with an indication of age?"
      choices:
        - { text: "The year the oldest wine was harvested", correct: false }
        - { text: "The year the house was founded", correct: false }
        - { text: "The year the blend was first approved", correct: false }
        - { text: "The year of bottling", correct: true }
      explanation: |
        The same rule applies to Colheita. Cask-aged tawnies slowly lose
        freshness once bottled, so a buyer can use the date to pick recent stock.
    fr:
      question: "Outre le nombre d’années, quelle date doit figurer sur l’étiquette d’un Porto Tawny avec indication d’âge ?"
      choices:
        - { text: "L’année de vendange du plus vieux vin", correct: false }
        - { text: "L’année de fondation de la maison", correct: false }
        - { text: "L’année du premier agrément de l’assemblage", correct: false }
        - { text: "L’année de mise en bouteille", correct: true }
      explanation: |
        La même règle s’applique au Colheita. Les Tawny élevés en fût perdent peu à
        peu leur fraîcheur une fois en bouteille : la date permet à l’acheteur de
        choisir un stock récent.

  - id: port-vintage-declaration-second-year-001
    type: mcq
    deck: Port
    tags: [port, vintage, regulation, declaration]
    status: reviewed
    source_id: c44-0091
    review:
      fact_check: pass
      sources: [ivdp, uk-gi-register, ivdp-regulation]
    en:
      question: "When does a Port house submit a young wine to the IVDP to be approved as Vintage Port?"
      choices:
        - { text: "During the harvest, before fortification", correct: false }
        - { text: "In the second year after the harvest", correct: true }
        - { text: "In the fifth year after the harvest", correct: false }
        - { text: "Ten years after the harvest, once mature", correct: false }
      explanation: |
        This gives the house a full winter and more to watch how the wine
        develops before committing. Announcing that decision is what the trade
        calls a vintage declaration, often made in the spring.
    fr:
      question: "À quel moment une maison de Porto soumet-elle un vin jeune à l’IVDP pour le faire agréer comme Porto Vintage ?"
      choices:
        - { text: "Pendant les vendanges, avant le mutage", correct: false }
        - { text: "La deuxième année après la récolte", correct: true }
        - { text: "La cinquième année après la récolte", correct: false }
        - { text: "Dix ans après la récolte, une fois mûr", correct: false }
      explanation: |
        La maison dispose ainsi d’un hiver complet, et même davantage, pour suivre
        l’évolution du vin avant de s’engager. L’annonce de cette décision est ce que le
        négoce appelle la déclaration de millésime, souvent faite au printemps.

  - id: port-vintage-bottling-deadline-001
    type: mcq
    deck: Port
    tags: [port, vintage, regulation, bottling]
    status: reviewed
    source_id: c44-0092
    review:
      fact_check: pass
      sources: [ivdp, uk-gi-register, ivdp-regulation]
    en:
      question: "By when must a Vintage Port be bottled?"
      choices:
        - { text: "By the end of the first year after harvest", correct: false }
        - { text: "By the end of the sixth year after harvest", correct: false }
        - { text: "By July of the third year after harvest", correct: true }
        - { text: "Before its tenth anniversary in cask", correct: false }
      explanation: |
        The exact cut-off is 30 July. Keeping its wood time short means almost
        all of a Vintage Port's development happens under cork.
    fr:
      question: "Quelle est la date limite de mise en bouteille d’un Porto Vintage ?"
      choices:
        - { text: "La fin de la première année après la récolte", correct: false }
        - { text: "La fin de la sixième année après la récolte", correct: false }
        - { text: "Juillet de la troisième année après la récolte", correct: true }
        - { text: "Son dixième anniversaire en fût", correct: false }
      explanation: |
        La limite exacte est le 30 juillet. Avec un passage sous bois aussi court,
        presque toute l’évolution d’un Vintage se fait sous bouchon.

  - id: port-vintage-unfined-unfiltered-001
    type: mcq
    deck: Port
    tags: [port, vintage, bottling]
    status: reviewed
    source_id: c44-0093
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is a Vintage Port treated as it goes into bottle?"
      choices:
        - { text: "Bottled without fining or filtration", correct: true }
        - { text: "Heavily fined to remove harsh tannin", correct: false }
        - { text: "Filtered and cold-stabilised for clarity", correct: false }
        - { text: "Pasteurised to stop any further change", correct: false }
      explanation: |
        Nothing is stripped out, so the wine goes into glass with nearly all
        its colour, tannin and solids still in place.
    fr:
      question: "Comment un Porto Vintage est-il traité au moment de la mise en bouteille ?"
      choices:
        - { text: "Mis en bouteille sans collage ni filtration", correct: true }
        - { text: "Fortement collé pour ôter les tanins durs", correct: false }
        - { text: "Filtré et stabilisé à froid pour la limpidité", correct: false }
        - { text: "Pasteurisé pour bloquer toute évolution", correct: false }
      explanation: |
        Rien n’est retiré : le vin entre en bouteille avec presque toute sa couleur, ses
        tanins et ses matières solides.

  - id: port-vintage-release-tannin-001
    type: mcq
    deck: Port
    tags: [port, vintage, style]
    status: reviewed
    source_id: c44-0094
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Port category is typically the most concentrated and tannic when first released?"
      choices:
        - { text: "Filtered LBV", correct: false }
        - { text: "Reserve Ruby", correct: false }
        - { text: "Vintage", correct: true }
        - { text: "Colheita", correct: false }
      explanation: |
        It is built from a house's finest lots in an outstanding year and is
        meant to be cellared rather than opened young.
    fr:
      question: "Quelle catégorie de Porto est généralement la plus concentrée et la plus tannique à sa sortie ?"
      choices:
        - { text: "LBV filtré", correct: false }
        - { text: "Reserve Ruby", correct: false }
        - { text: "Vintage", correct: true }
        - { text: "Colheita", correct: false }
      explanation: |
        Il est élaboré à partir des meilleurs lots d’une maison lors d’une année
        exceptionnelle, et il est destiné à la garde plutôt qu’à être ouvert jeune.

  - id: port-vintage-cellaring-decades-001
    type: mcq
    deck: Port
    tags: [port, vintage, bottle-ageing]
    status: reviewed
    source_id: c44-0095
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How long can a fine Vintage Port from a strong year keep developing in bottle?"
      choices:
        - { text: "About two to three years", correct: false }
        - { text: "About five years", correct: false }
        - { text: "About eight to ten years", correct: false }
        - { text: "Several decades", correct: true }
      explanation: |
        High tannin, deep colour, sweetness and alcohol all protect the wine,
        and a cork lets in only a trace of oxygen, so change is slow.
    fr:
      question: "Combien de temps un grand Porto Vintage d’une belle année peut-il continuer d’évoluer en bouteille ?"
      choices:
        - { text: "Environ deux à trois ans", correct: false }
        - { text: "Environ cinq ans", correct: false }
        - { text: "Environ huit à dix ans", correct: false }
        - { text: "Plusieurs décennies", correct: true }
      explanation: |
        Tanins élevés, couleur profonde, sucre et alcool protègent le vin, et le bouchon
        ne laisse entrer qu’une trace d’oxygène : l’évolution est donc lente.

  - id: port-vintage-flagship-role-001
    type: mcq
