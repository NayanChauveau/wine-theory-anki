  - id: port-single-quinta-label-001
    type: mcq
    deck: Port
    tags: [port, single-quinta, labelling]
    status: reviewed
    source_id: c44-0101
    review:
      fact_check: pass
      sources: [ivdp, taylor-site, world-of-fine-wine]
    en:
      question: "On a bottle of Taylor's Quinta de Vargellas Vintage Port, what does the name Quinta de Vargellas indicate?"
      choices:
        - { text: "The Gaia lodge where the wine was aged", correct: false }
        - { text: "The family that founded the shipping house", correct: false }
        - { text: "The Douro subregion the blend was drawn from", correct: false }
        - { text: "The single estate that grew the grapes", correct: true }
      explanation: |
        A quinta is a Douro farm or estate. A Single Quinta Vintage Port is made
        from one estate's grapes in one year, under the same production rules as
        a classic Vintage Port; Graham's Quinta dos Malvedos and Dow's Quinta do
        Bomfim are other well-known examples.
    fr:
      question: "Sur une bouteille de Taylor’s Quinta de Vargellas Vintage Port, qu’indique le nom Quinta de Vargellas ?"
      choices:
        - { text: "Le chai de Gaia où le vin a été élevé", correct: false }
        - { text: "La famille qui a fondé la maison de négoce", correct: false }
        - { text: "La sous-région du Douro d’où vient l’assemblage", correct: false }
        - { text: "Le domaine unique qui a produit les raisins", correct: true }
      explanation: |
        Une quinta est une exploitation ou un domaine du Douro. Un Single Quinta Vintage
        est élaboré avec les raisins d’un seul domaine et d’une seule année, selon les
        mêmes règles de production qu’un Porto Vintage classique ; Graham’s Quinta dos
        Malvedos et Dow’s Quinta do Bomfim en sont d’autres exemples connus.

