    fr:
      question: "En moyenne, à quelle fréquence les grandes maisons de Porto font-elles une déclaration générale de millésime ?"
      choices:
        - { text: "La plupart des années, sauf en cas de gel", correct: false }
        - { text: "Environ une fois tous les vingt ans", correct: false }
        - { text: "Environ trois fois par décennie", correct: true }
        - { text: "Environ une fois par décennie", correct: false }
      explanation: |
        Les déclarations suivent la météo. Taylor’s, par exemple, a déclaré 2016, 2017
        et 2018 d’affilée, une série rare, alors que certaines décennies en comptent
        moins.

  - id: port-vintage-best-lots-blend-001
    type: mcq
    deck: Port
    tags: [port, vintage, blending]
    status: reviewed
    source_id: c44-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What usually goes into a Port house's main Vintage Port?"
      choices:
        - { text: "Its best wines from several top quintas", correct: true }
        - { text: "Wines from the declared year and the year before", correct: false }
        - { text: "Lighter lots softened with some White Port", correct: false }
        - { text: "Its best wine aged first in small pipes", correct: false }
      explanation: |
        Only the finest lots of an outstanding year make the cut, which keeps
        volumes small. The rest of the harvest goes into the house's other
        ruby styles.
    fr:
      question: "Qu’entre-t-il généralement dans le Porto Vintage principal d’une maison de Porto ?"
      choices:
        - { text: "Ses meilleurs vins de plusieurs grandes quintas", correct: true }
        - { text: "Des vins de l’année déclarée et de la précédente", correct: false }
        - { text: "Des lots plus légers assouplis au Porto blanc", correct: false }
        - { text: "Son meilleur vin, élevé d’abord en petites pipes", correct: false }
      explanation: |
        Seuls les meilleurs lots d’une année exceptionnelle sont retenus, ce qui limite
        les volumes. Le reste de la récolte part dans les autres styles de la famille
        Ruby de la maison.

  - id: port-vintage-declaration-decision-001
    type: mcq
    deck: Port
    tags: [port, vintage, declaration]
    status: reviewed
    source_id: c44-0099
    review:
      fact_check: pass
      sources: [known-fact, ivdp]
    en:
      question: "Who decides whether a particular Port house declares a vintage?"
      choices:
        - { text: "The IVDP, for every house at once", correct: false }
        - { text: "The house itself, for its own wine", correct: true }
        - { text: "A vote of the shippers' association", correct: false }
        - { text: "The Portuguese agriculture ministry", correct: false }
      explanation: |
        The wine still has to pass the IVDP tasting panel, but the choice to
        offer it is commercial. That is why houses sometimes split, with some
        declaring a year that others pass over.
    fr:
      question: "Qui décide si une maison de Porto donnée déclare un millésime ?"
      choices:
        - { text: "L’IVDP, pour toutes les maisons à la fois", correct: false }
        - { text: "La maison elle-même, pour son propre vin", correct: true }
        - { text: "Un vote de l’association des négociants", correct: false }
        - { text: "Le ministère portugais de l’Agriculture", correct: false }
      explanation: |
        Le vin doit encore être agréé par la chambre de dégustation de l’IVDP, mais le
        choix de le proposer est commercial. C’est pourquoi les maisons divergent
        parfois, certaines déclarant une année que d’autres laissent passer.

  - id: port-vintage-declared-year-2011-001
    type: mcq
    deck: Port
    tags: [port, vintage, declaration]
    status: reviewed
    source_id: c44-0100
    review:
