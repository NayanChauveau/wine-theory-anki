    fr:
      question: "Dans la gamme d’un négociant à plusieurs domaines, comment son Single Quinta Vintage se situe-t-il généralement par rapport à son Porto Vintage déclaré ?"
      choices:
        - { text: "Au-dessus, comme meilleure cuvée de la maison", correct: false }
