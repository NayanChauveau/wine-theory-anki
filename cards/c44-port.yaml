    fr:
      question: "Laquelle de ces années a été largement déclarée comme grande année de Porto Vintage par les principales maisons ?"
      choices:
        - { text: "2002", correct: false }
        - { text: "2014", correct: false }
        - { text: "2019", correct: false }
        - { text: "2011", correct: true }
      explanation: |
        Autres années largement déclarées depuis 2000 : 2000 elle-même, 2003, 2007, 2016
        et 2017. La pluie ou l’excès de chaleur pendant les vendanges écarte de
