    source_id: c34-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do the deep Finger Lakes improve the prospects for vinifera on nearby slopes?"
      choices:
        - { text: "They moderate temperature, delay spring warming and reduce damaging frost risk near the water", correct: true }
        - { text: "They warm rapidly in spring, advancing budbreak before the last frosts", correct: false }
        - { text: "They trap cold air on lower slopes, shortening the growing season near the water", correct: false }
        - { text: "They make valley floors warmer than slopes by reflecting strong summer heat", correct: false }
      explanation: |
        The deep lakes warm and cool slowly. They temper autumn and winter cold, delay spring
        warming and encourage cold-air drainage down slopes, reducing frost risk and extending the
        effective season near the larger lakes.
    fr:
      question: "Comment les lacs profonds des Finger Lakes améliorent-ils les chances de réussite de vinifera sur les coteaux voisins ?"
      choices:
        - { text: "Ils modèrent les températures, retardent le réchauffement printanier et réduisent le risque de gel près de l’eau", correct: true }
        - { text: "Ils se réchauffent vite au printemps et avancent le débourrement avant les dernières gelées", correct: false }
        - { text: "Ils emprisonnent l’air froid sur le bas des coteaux et raccourcissent la saison près de l’eau", correct: false }
        - { text: "Ils rendent le fond des vallées plus chaud que les coteaux en réfléchissant la chaleur estivale", correct: false }
      explanation: |
        Les lacs profonds se réchauffent et se refroidissent lentement. Ils atténuent les froids
        d’automne et d’hiver, retardent le réchauffement printanier et favorisent l’écoulement de
        l’air froid sur les pentes, réduisant le gel et allongeant la saison près des grands lacs.

