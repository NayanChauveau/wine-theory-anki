cards:
  - id: oregon-regions-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon]
    status: reviewed
    source_id: c34-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pairing best summarises Oregon’s two principal wine zones west of the Cascade Range?"
      choices:
        - { text: "Willamette Valley in the north and Southern Oregon in the south", correct: true }
        - { text: "Columbia Valley in the north and Yakima Valley in the south", correct: false }
        - { text: "Walla Walla Valley in the north and Finger Lakes in the south", correct: false }
        - { text: "Rogue Valley in the north and Puget Sound in the south", correct: false }
      explanation: |
        Willamette Valley dominates western Oregon’s cooler north, while the Southern Oregon AVA
        encompasses warmer districts farther south. Oregon also shares drier, east-of-Cascades
        regions, but they form a different climatic setting.
    fr:
      question: "Quelle association résume le mieux les deux principales zones viticoles de l’Oregon situées à l’ouest de la chaîne des Cascades ?"
      choices:
        - { text: "La Willamette Valley au nord et le Southern Oregon au sud", correct: true }
        - { text: "La Columbia Valley au nord et la Yakima Valley au sud", correct: false }
        - { text: "La Walla Walla Valley au nord et les Finger Lakes au sud", correct: false }
        - { text: "La Rogue Valley au nord et Puget Sound au sud", correct: false }
      explanation: |
        La Willamette Valley domine le nord plus frais de l’Oregon occidental, tandis que l’AVA
        Southern Oregon englobe des secteurs plus chauds au sud. L’Oregon partage aussi des régions
        plus sèches à l’est des Cascades, dans un autre contexte climatique.

  - id: oregon-willamette-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, willamette]
    status: reviewed
    source_id: c34-0002
    review:
      fact_check: pass
      sources: [spec, aoc-site]
    en:
      question: "Which AVA forms the centre of Oregon’s cool-climate wine industry?"
      choices:
        - { text: "Rogue Valley AVA", correct: false }
        - { text: "Willamette Valley AVA", correct: true }
        - { text: "Columbia Gorge AVA", correct: false }
        - { text: "Snake River Valley AVA", correct: false }
      explanation: |
        Willamette Valley is Oregon’s principal wine region and contains most of the state’s
        vineyards and wineries. Its reputation rests especially on Pinot Noir, supported by Pinot
        Gris and Chardonnay.
    fr:
      question: "Quelle AVA constitue le cœur de la production de vins de climat frais en Oregon ?"
      choices:
        - { text: "Rogue Valley AVA", correct: false }
        - { text: "Willamette Valley AVA", correct: true }
        - { text: "Columbia Gorge AVA", correct: false }
        - { text: "Snake River Valley AVA", correct: false }
      explanation: |
        La Willamette Valley est la principale région viticole de l’Oregon et rassemble la majorité
        des vignobles et domaines de l’État. Sa réputation repose surtout sur le Pinot Noir,
        complété par le Pinot Gris et le Chardonnay.

  - id: oregon-willamette-location-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, willamette]
    status: reviewed
    source_id: c34-0003
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: "Which description correctly locates the Willamette Valley AVA?"
      choices:
        - { text: "East of the Cascades, between Yakima and the Canadian border", correct: false }
        - { text: "On the Pacific coast, entirely west of the Coast Range", correct: false }
        - { text: "Between the Coast Range and Cascades, running south from near Portland", correct: true }
        - { text: "In southern Oregon, entirely within the Rogue Valley AVA", correct: false }
      explanation: |
        The AVA follows the Willamette River valley from near the Columbia River and Portland south
        towards Eugene. The Coast Range lies to its west and the Cascade Range to its east.
    fr:
      question: "Quelle description situe correctement la Willamette Valley AVA ?"
      choices:
        - { text: "À l’est des Cascades, entre Yakima et la frontière canadienne", correct: false }
        - { text: "Sur la côte pacifique, entièrement à l’ouest de la chaîne côtière", correct: false }
        - { text: "Entre la chaîne côtière et les Cascades, vers le sud depuis Portland", correct: true }
        - { text: "Dans le sud de l’Oregon, entièrement au sein de la Rogue Valley AVA", correct: false }
      explanation: |
        L’AVA suit la vallée de la rivière Willamette depuis les environs du fleuve Columbia et de
        Portland vers Eugene au sud. La chaîne côtière se trouve à l’ouest et la chaîne des Cascades
        à l’est.

  - id: oregon-willamette-scale-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, willamette]
    status: reviewed
    source_id: c34-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which statement best describes the Willamette Valley’s importance within Oregon wine production?"
      choices:
        - { text: "It is a secondary region whose vineyard area is much smaller than Southern Oregon’s", correct: false }
        - { text: "It is Oregon’s main winery centre, but most of the state’s vineyards lie east of the Cascades", correct: false }
        - { text: "It is Oregon’s largest wine centre, holding most of the state’s vineyards and wineries", correct: true }
        - { text: "It holds most of Oregon’s vineyards, but relatively few wineries and a limited AVA hierarchy", correct: false }
      explanation: |
        Willamette Valley accounts for the clear majority of Oregon’s vineyards and wineries. It is
        also a large umbrella AVA containing numerous nested AVAs, whose soils, exposure and wind
        patterns create meaningful local variation.
    fr:
      question: "Quelle proposition décrit le mieux l’importance de la Willamette Valley dans la production viticole de l’Oregon ?"
      choices:
        - { text: "C’est une région secondaire dont la surface viticole est bien inférieure à celle du Southern Oregon", correct: false }
        - { text: "C’est le principal centre de vinification, mais la plupart des vignes de l’État sont à l’est des Cascades", correct: false }
        - { text: "C’est le principal centre viticole de l’Oregon, avec la majorité de ses vignobles et domaines", correct: true }
        - { text: "Elle réunit la plupart des vignes, mais relativement peu de domaines et une hiérarchie d’AVA limitée", correct: false }
      explanation: |
        La Willamette Valley rassemble une nette majorité des vignobles et domaines de l’Oregon.
        Cette vaste AVA mère contient aussi de nombreuses AVA imbriquées, dont les sols,
        l’exposition et les vents créent des différences locales significatives.

  - id: oregon-willamette-climate-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, willamette, climate]
    status: reviewed
    source_id: c34-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate pattern best characterises the Willamette Valley AVA?"
      choices:
        - { text: "Cool to moderate, with maritime influence and relatively dry summers", correct: true }
        - { text: "Hot and arid, with no meaningful ocean influence", correct: false }
        - { text: "Continental and humid, with summer rainfall at its annual maximum", correct: false }
        - { text: "Mediterranean-hot, with warm nights and severe summer drought", correct: false }
      explanation: |
        Willamette Valley has a cool-to-moderate climate influenced by the Pacific. Most rain falls
        outside summer; the growing season is comparatively dry, while cool nights and autumn
        weather risk shape ripening decisions.
    fr:
      question: "Quel régime climatique caractérise le mieux la Willamette Valley AVA ?"
      choices:
        - { text: "Frais à modéré, sous influence maritime et avec des étés relativement secs", correct: true }
        - { text: "Chaud et aride, sans influence océanique notable", correct: false }
        - { text: "Continental et humide, avec un maximum de pluie en été", correct: false }
        - { text: "Méditerranéen chaud, avec des nuits chaudes et une forte sécheresse estivale", correct: false }
      explanation: |
        La Willamette Valley possède un climat frais à modéré influencé par le Pacifique. La plupart
        des pluies tombent hors de l’été ; la saison végétative est relativement sèche, tandis que
        les nuits fraîches et le risque automnal influencent la maturation.

  - id: oregon-willamette-breeze-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, willamette, climate]
    status: reviewed
    source_id: c34-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Pacific influence reach vineyards in parts of the Willamette Valley?"
      choices:
        - { text: "Through gaps in the Coast Range that channel cooling marine air inland", correct: true }
        - { text: "Through hot downslope winds crossing the Cascade Range from the east", correct: false }
        - { text: "Through a summer monsoon travelling north from the Gulf of California", correct: false }
        - { text: "Through warm currents flowing directly along the Willamette River", correct: false }
      explanation: |
        The Coast Range shelters much of the valley, but openings such as the Van Duzer Corridor
        admit cool Pacific air. The strength of this influence varies by site and helps explain
        differences among nested AVAs.
    fr:
      question: "Comment l’influence du Pacifique atteint-elle certains vignobles de la Willamette Valley ?"
      choices:
        - { text: "Par des trouées dans la chaîne côtière qui canalisent l’air marin frais vers l’intérieur", correct: true }
        - { text: "Par des vents descendants chauds franchissant les Cascades depuis l’est", correct: false }
        - { text: "Par une mousson estivale remontant du golfe de Californie", correct: false }
        - { text: "Par des courants chauds circulant directement dans la rivière Willamette", correct: false }
      explanation: |
        La chaîne côtière abrite une grande partie de la vallée, mais des ouvertures comme le Van
        Duzer Corridor laissent entrer l’air frais du Pacifique. L’intensité de cette influence
        varie selon les sites et contribue aux différences entre AVA imbriquées.

  - id: oregon-willamette-season-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, willamette, climate]
    status: reviewed
    source_id: c34-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which growing-season combination supports quality Pinot Noir in the Willamette Valley?"
      choices:
        - { text: "Short summer days, warm nights and frequent harvest rain", correct: false }
        - { text: "Long daylight, relatively dry summers and cool nights", correct: true }
        - { text: "Extreme daytime heat, warm nights and very low summer rainfall", correct: false }
        - { text: "Abundant summer rain, low sunlight and reliably dry autumns", correct: false }
      explanation: |
        The northerly latitude gives long summer daylight, while relatively dry summers promote
        ripening and cool nights help retain acidity. Autumn rain remains a vintage risk, so a long
        season does not guarantee an easy harvest.
    fr:
      question: "Quelle combinaison pendant la saison végétative favorise un Pinot Noir de qualité dans la Willamette Valley ?"
      choices:
        - { text: "Des journées estivales courtes, des nuits chaudes et des pluies fréquentes aux vendanges", correct: false }
        - { text: "Un long ensoleillement, des étés relativement secs et des nuits fraîches", correct: true }
        - { text: "Une chaleur diurne extrême, des nuits chaudes et de très faibles pluies estivales", correct: false }
        - { text: "Des pluies estivales abondantes, peu de lumière et des automnes régulièrement secs", correct: false }
      explanation: |
        La latitude septentrionale procure de longues journées estivales ; les étés relativement
        secs favorisent la maturation et les nuits fraîches préservent l’acidité. Les pluies
        automnales restent un risque selon le millésime : une longue saison n’assure pas des
        vendanges faciles.

  - id: oregon-willamette-pinot-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, willamette, grapes]
    status: reviewed
    source_id: c34-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape variety is the defining planting of the Willamette Valley?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Syrah", correct: false }
        - { text: "Zinfandel", correct: false }
      explanation: |
        Pinot Noir is the Willamette Valley’s dominant variety and the basis of its international
        reputation. The region’s moderate temperatures and long season suit gradual flavour
        development while preserving acidity.
    fr:
      question: "Quel cépage constitue la plantation emblématique de la Willamette Valley ?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Syrah", correct: false }
        - { text: "Zinfandel", correct: false }
      explanation: |
        Le Pinot Noir est le cépage dominant de la Willamette Valley et fonde sa réputation
        internationale. Les températures modérées et la longue saison permettent un développement
        progressif des arômes tout en préservant l’acidité.

  - id: oregon-willamette-pinot-style-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, willamette, grapes]
    status: reviewed
    source_id: c34-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile is most typical of quality Willamette Valley Pinot Noir?"
      choices:
        - { text: "Low acidity, jammy black fruit and very high alcohol", correct: false }
        - { text: "High acidity, red fruit and earthy or spicy complexity", correct: true }
        - { text: "Deep colour, firm Cabernet-like tannins and cassis", correct: false }
        - { text: "High sweetness, oxidative nuttiness and fortified alcohol", correct: false }
      explanation: |
        Styles vary with site and vintage, but fresh acidity, cherry or other red-fruit flavours and
        earthy or spicy complexity are common reference points. Warmer sites and years can give
        riper fruit and greater body.
    fr:
      question: "Quel profil est le plus typique d’un Pinot Noir de qualité de la Willamette Valley ?"
      choices:
        - { text: "Une acidité faible, des fruits noirs confiturés et un alcool très élevé", correct: false }
        - { text: "Une acidité élevée, des fruits rouges et une complexité terreuse ou épicée", correct: true }
        - { text: "Une couleur profonde, des tanins fermes de type Cabernet et du cassis", correct: false }
        - { text: "Une forte sucrosité, des notes oxydatives de noix et un alcool fortifié", correct: false }
      explanation: |
        Le style varie selon le site et le millésime, mais une acidité fraîche, des arômes de cerise
        ou d’autres fruits rouges et une complexité terreuse ou épicée sont des repères fréquents.
        Les sites et années plus chauds donnent davantage de maturité et de corps.

  - id: oregon-pinot-gris-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, grapes]
    status: reviewed
    source_id: c34-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape is widely planted in the Willamette Valley alongside Pinot Noir and Chardonnay?"
      choices:
        - { text: "Pinot Gris", correct: true }
        - { text: "Chenin Blanc", correct: false }
        - { text: "Palomino", correct: false }
        - { text: "Furmint", correct: false }
      explanation: |
        Pinot Gris has long been one of Oregon’s leading white varieties and is especially
        associated with the Willamette Valley. Chardonnay is also important and has gained
        increasing attention for premium still and sparkling wines.
    fr:
      question: "Quel cépage blanc est largement planté dans la Willamette Valley aux côtés du Pinot Noir et du Chardonnay ?"
      choices:
        - { text: "Pinot Gris", correct: true }
        - { text: "Chenin Blanc", correct: false }
        - { text: "Palomino", correct: false }
        - { text: "Furmint", correct: false }
      explanation: |
        Le Pinot Gris figure depuis longtemps parmi les principaux cépages blancs de l’Oregon et est
        particulièrement associé à la Willamette Valley. Le Chardonnay est également important et
        attire une attention croissante pour les vins tranquilles et effervescents haut de gamme.

  - id: oregon-pinot-gris-style-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, grapes]
    status: reviewed
    source_id: c34-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style is commonly associated with Oregon Pinot Gris?"
      choices:
        - { text: "A dry, fresh white with ripe pear, apple or citrus fruit", correct: true }
        - { text: "A light, strongly herbaceous white dominated by green pepper", correct: false }
        - { text: "A low-acid, sweet white dominated by Muscat-like floral aromas", correct: false }
        - { text: "An oxidative fortified white with walnut and aldehydic notes", correct: false }
      explanation: |
        Oregon Pinot Gris is most often made as a dry, fruit-led still white, commonly showing pear,
        apple or citrus. Body and texture vary with site and winemaking, so the category should not
        be reduced to one exact formula.
    fr:
      question: "Quel style est couramment associé au Pinot Gris de l’Oregon ?"
      choices:
        - { text: "Un blanc sec et frais aux fruits mûrs de poire, de pomme ou d’agrumes", correct: true }
        - { text: "Un blanc léger et très végétal dominé par le poivron vert", correct: false }
        - { text: "Un blanc doux et peu acide dominé par des arômes floraux muscatés", correct: false }
        - { text: "Un blanc fortifié oxydatif aux notes de noix et d’aldéhydes", correct: false }
      explanation: |
        Le Pinot Gris de l’Oregon est le plus souvent un blanc tranquille sec dominé par le fruit,
        fréquemment la poire, la pomme ou les agrumes. Le corps et la texture varient selon le site
        et la vinification : il n’existe pas une formule unique.

  - id: oregon-southern-location-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon]
    status: reviewed
    source_id: c34-0009
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: "Where is the Southern Oregon AVA in relation to the Willamette Valley?"
      choices:
        - { text: "Farther south, extending through the Umpqua and Rogue valleys", correct: true }
        - { text: "Farther north, between Portland and the Canadian border", correct: false }
        - { text: "Entirely east of the Cascades within Washington State", correct: false }
        - { text: "On the Pacific coast as a narrow strip west of the Coast Range", correct: false }
      explanation: |
        Southern Oregon lies south of the Willamette Valley and is an umbrella AVA covering the
        Umpqua Valley, Rogue Valley and their nested appellations. It remains principally west of
        the Cascade Range.
    fr:
      question: "Où se situe la Southern Oregon AVA par rapport à la Willamette Valley ?"
      choices:
        - { text: "Plus au sud, à travers les vallées de l’Umpqua et de la Rogue", correct: true }
        - { text: "Plus au nord, entre Portland et la frontière canadienne", correct: false }
        - { text: "Entièrement à l’est des Cascades dans l’État de Washington", correct: false }
        - { text: "Sur la côte pacifique, en bande étroite à l’ouest de la chaîne côtière", correct: false }
      explanation: |
        Le Southern Oregon se trouve au sud de la Willamette Valley. Cette AVA mère couvre l’Umpqua
        Valley, la Rogue Valley et leurs appellations imbriquées, principalement à l’ouest de la
        chaîne des Cascades.

  - id: oregon-southern-avas-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon]
    status: reviewed
    source_id: c34-0010
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: "Which two major AVAs are contained within the Southern Oregon AVA?"
      choices:
        - { text: "Umpqua Valley and Rogue Valley", correct: true }
        - { text: "Dundee Hills and Eola-Amity Hills", correct: false }
        - { text: "Columbia Gorge and Walla Walla Valley", correct: false }
        - { text: "Yakima Valley and Horse Heaven Hills", correct: false }
      explanation: |
        Umpqua Valley and Rogue Valley are the two major components of the Southern Oregon umbrella
        AVA. Elkton Oregon and Red Hill Douglas County nest within Umpqua, while Applegate Valley
        nests within Rogue.
    fr:
      question: "Quelles sont les deux grandes AVA comprises dans la Southern Oregon AVA ?"
      choices:
        - { text: "Umpqua Valley et Rogue Valley", correct: true }
        - { text: "Dundee Hills et Eola-Amity Hills", correct: false }
        - { text: "Columbia Gorge et Walla Walla Valley", correct: false }
        - { text: "Yakima Valley et Horse Heaven Hills", correct: false }
      explanation: |
        L’Umpqua Valley et la Rogue Valley sont les deux grandes composantes de l’AVA mère Southern
        Oregon. Elkton Oregon et Red Hill Douglas County sont imbriquées dans l’Umpqua, tandis que
        l’Applegate Valley l’est dans la Rogue.

  - id: oregon-southern-warmest-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, climate]
    status: reviewed
    source_id: c34-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do Southern Oregon’s growing conditions generally compare with those of the Willamette Valley?"
      choices:
        - { text: "They are generally warmer, though topography creates substantial variation", correct: true }
        - { text: "They are generally cooler because their vineyards sit at substantially higher elevations", correct: false }
        - { text: "They are similarly cool because both regions receive the same degree of Pacific influence", correct: false }
        - { text: "They are generally wetter and cloudier in summer because they lie closer to the Pacific", correct: false }
      explanation: |
        Southern Oregon is generally warmer and supports a broader range of warm-climate grapes. Its
        complex valleys, elevations and differing ocean exposure nevertheless create cool pockets as
        well as warm, dry sites.
    fr:
      question: "Comment les conditions de maturation du Southern Oregon se comparent-elles généralement à celles de la Willamette Valley ?"
      choices:
        - { text: "Elles sont généralement plus chaudes, malgré d’importantes variations dues au relief", correct: true }
        - { text: "Elles sont généralement plus fraîches car les vignobles se trouvent à des altitudes nettement supérieures", correct: false }
        - { text: "Elles sont aussi fraîches car les deux régions reçoivent la même influence du Pacifique", correct: false }
        - { text: "Elles sont généralement plus humides et nuageuses en été en raison de leur proximité avec le Pacifique", correct: false }
      explanation: |
        Le Southern Oregon est généralement plus chaud et accueille davantage de cépages de climat
        chaud. La complexité de ses vallées, de ses altitudes et de l’exposition océanique crée
        néanmoins des poches fraîches autant que des sites chauds et secs.

  - id: oregon-southern-cool-sites-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, climate]
    status: reviewed
    source_id: c34-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can cool-climate varieties succeed within the generally warmer Southern Oregon AVA?"
      choices:
        - { text: "Higher elevations, northern valleys and marine-influenced sites provide cooler mesoclimates", correct: true }
        - { text: "Its more southerly latitude shortens the growing season and delays ripening", correct: false }
        - { text: "Irrigation lowers regional air temperatures enough to offset the warmer latitude", correct: false }
        - { text: "The Cascades funnel cold continental air across the valley floors during summer", correct: false }
      explanation: |
        Southern Oregon is climatically diverse. The northern Umpqua area around Elkton has stronger
        maritime influence, while elevation and aspect cool other sites; warmer, more arid
        conditions become more important farther south.
    fr:
      question: "Pourquoi des cépages de climat frais peuvent-ils réussir dans la Southern Oregon AVA, globalement plus chaude ?"
      choices:
        - { text: "L’altitude, les vallées du nord et les sites sous influence maritime créent des mésoclimats plus frais", correct: true }
        - { text: "Sa latitude plus méridionale raccourcit la saison végétative et retarde la maturation", correct: false }
        - { text: "L’irrigation abaisse assez la température régionale pour compenser la latitude plus chaude", correct: false }
        - { text: "Les Cascades canalisent de l’air continental froid sur le fond des vallées pendant l’été", correct: false }
      explanation: |
        Le Southern Oregon présente une forte diversité climatique. Le nord de l’Umpqua autour
        d’Elkton subit davantage l’influence maritime ; l’altitude et l’exposition rafraîchissent
        d’autres sites, tandis que le sud devient plus chaud et plus aride.

  - id: oregon-southern-warm-grapes-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, oregon, grapes]
    status: reviewed
    source_id: c34-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which group of black grapes is especially associated with warmer sites in Southern Oregon?"
      choices:
        - { text: "Cabernet Sauvignon, Merlot and Syrah", correct: true }
        - { text: "Pinot Noir, Gamay and Pinot Meunier", correct: false }
        - { text: "Concord, Catawba and Maréchal Foch", correct: false }
        - { text: "Nebbiolo, Schiava and Poulsard", correct: false }
      explanation: |
        Warm sites in the Rogue and southern Umpqua valleys can ripen Cabernet Sauvignon, Merlot and
        Syrah; Tempranillo is also important. The region’s climatic diversity means these coexist
        with cool-climate varieties elsewhere.
    fr:
      question: "Quel groupe de cépages noirs est particulièrement associé aux sites les plus chauds du Southern Oregon ?"
      choices:
        - { text: "Cabernet Sauvignon, Merlot et Syrah", correct: true }
        - { text: "Pinot Noir, Gamay et Pinot Meunier", correct: false }
        - { text: "Concord, Catawba et Maréchal Foch", correct: false }
        - { text: "Nebbiolo, Schiava et Poulsard", correct: false }
      explanation: |
        Les sites chauds de la Rogue Valley et du sud de l’Umpqua peuvent mûrir le Cabernet
        Sauvignon, le Merlot et la Syrah ; le Tempranillo est également important. La diversité
        climatique permet leur coexistence avec des cépages de climat frais ailleurs.

