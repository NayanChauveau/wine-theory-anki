    en:
      question: "Which river system gives the Columbia Valley AVA its name and much of its irrigation water?"
      choices:
        - { text: "The Columbia River and its tributaries", correct: true }
        - { text: "The Hudson River and Finger Lakes", correct: false }
        - { text: "The Mississippi River and its delta", correct: false }
        - { text: "The Willamette River alone", correct: false }
      explanation: |
        The Columbia River cuts through and defines the region; it and tributaries such as the
        Yakima and Snake supply water to an otherwise arid or semi-arid landscape. Aquifers also
        contribute to irrigation supply.
    fr:
      question: "Quel réseau fluvial donne son nom à la Columbia Valley AVA et fournit une grande partie de son eau d’irrigation ?"
      choices:
        - { text: "Le fleuve Columbia et ses affluents", correct: true }
        - { text: "L’Hudson et les Finger Lakes", correct: false }
        - { text: "Le Mississippi et son delta", correct: false }
        - { text: "La seule rivière Willamette", correct: false }
      explanation: |
        Le fleuve Columbia traverse et définit la région ; avec ses affluents, comme la Yakima et la
        Snake, il alimente en eau un paysage par ailleurs aride ou semi-aride. Les nappes
        souterraines contribuent aussi à l’irrigation.

  - id: washington-yakima-walla-walla-001
    type: mcq
    deck: USA::Pacific Northwest
