    fr:
      question: "Quel groupe convient le mieux aux vallées et coteaux les plus frais du Southern Oregon ?"
      choices:
        - { text: "Pinot Noir, Chardonnay et Pinot Gris", correct: true }
        - { text: "Cabernet Sauvignon, Mourvèdre et Touriga Nacional", correct: false }
        - { text: "Zinfandel, Petite Sirah et Alicante Bouschet", correct: false }
        - { text: "Grenache, Mataro et Tempranillo de site chaud", correct: false }
      explanation: |
        Le Pinot Noir et les cépages blancs de climat frais réussissent dans les sites
        septentrionaux, élevés ou sous influence maritime. L’adaptation du cépage au mésoclimat est
        essentielle pour comprendre la grande diversité du Southern Oregon.

