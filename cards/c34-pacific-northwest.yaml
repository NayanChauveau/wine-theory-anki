        - { text: "Willamette Valley and Southern Oregon", correct: false }
        - { text: "Finger Lakes and Long Island", correct: false }
        - { text: "Napa Valley and Sonoma Valley", correct: false }
      explanation: |
        Yakima Valley and Walla Walla Valley are major sub-appellations of Columbia Valley. Yakima
        is Washington’s oldest AVA, while Walla Walla spans southeastern Washington and northeastern
        Oregon.
    fr:
      question: "Quelle paire se compose d’AVA importantes imbriquées dans la Columbia Valley ?"
      choices:
        - { text: "Yakima Valley et Walla Walla Valley", correct: true }
        - { text: "Willamette Valley et Southern Oregon", correct: false }
        - { text: "Finger Lakes et Long Island", correct: false }
        - { text: "Napa Valley et Sonoma Valley", correct: false }
      explanation: |
        La Yakima Valley et la Walla Walla Valley sont deux grandes sous-appellations de la Columbia
        Valley. Yakima est la plus ancienne AVA de Washington ; Walla Walla s’étend du sud-est de
        Washington au nord-est de l’Oregon.

  - id: washington-nested-avas-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington]
