        - { text: "Walla Walla Valley AVA", correct: true }
        - { text: "Red Mountain AVA", correct: false }
        - { text: "Horse Heaven Hills AVA", correct: false }
      explanation: |
        Walla Walla Valley surrounds the town of Walla Walla in southeastern Washington and extends
        into northeastern Oregon. It remains entirely nested within the larger, also cross-border
        Columbia Valley AVA.
    fr:
      question: "Quelle sous-appellation de la Columbia Valley franchit la frontière entre Washington et l’Oregon ?"
      choices:
        - { text: "Yakima Valley AVA", correct: false }
        - { text: "Walla Walla Valley AVA", correct: true }
        - { text: "Red Mountain AVA", correct: false }
        - { text: "Horse Heaven Hills AVA", correct: false }
      explanation: |
        La Walla Walla Valley entoure la ville du même nom dans le sud-est de Washington et se
        prolonge dans le nord-est de l’Oregon. Elle reste entièrement imbriquée dans la vaste
        Columbia Valley AVA, elle-même transfrontalière.

  - id: washington-columbia-arid-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, climate]
    status: reviewed
    source_id: c34-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which rainfall pattern characterises most of the Columbia Valley AVA?"
      choices:
        - { text: "Low annual rainfall in an arid to semi-arid continental setting", correct: true }
        - { text: "Heavy summer rainfall caused by a regular monsoon", correct: false }
        - { text: "Year-round maritime rain comparable with Puget Sound", correct: false }
        - { text: "Frequent tropical storms during the harvest period", correct: false }
      explanation: |
        Much of Columbia Valley receives only about 6–8 inches of rain annually, although totals
        vary by location. This is a sharp contrast with western Washington and makes water supply a
        central viticultural consideration.
    fr:
      question: "Quel régime de précipitations caractérise la majeure partie de la Columbia Valley AVA ?"
      choices:
        - { text: "De faibles pluies annuelles dans un milieu continental aride à semi-aride", correct: true }
        - { text: "De fortes pluies estivales provoquées par une mousson régulière", correct: false }
        - { text: "Des pluies maritimes toute l’année comparables à celles de Puget Sound", correct: false }
        - { text: "De fréquentes tempêtes tropicales pendant les vendanges", correct: false }
      explanation: |
        Une grande partie de la Columbia Valley ne reçoit qu’environ 150 à 200 mm de pluie par an,
        malgré des variations locales. Le contraste avec l’ouest de Washington est marqué et
        l’approvisionnement en eau devient un enjeu viticole central.

  - id: washington-columbia-rain-shadow-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, climate]
    status: reviewed
    source_id: c34-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the principal cause of the Columbia Valley’s low rainfall?"
      choices:
        - { text: "The rain shadow created by the Cascade Range", correct: true }
        - { text: "A cold coastal current that suppresses moisture before it reaches inland Washington", correct: false }
        - { text: "The Columbia River valley steering Pacific weather systems south of the region", correct: false }
        - { text: "The lower Coast Range intercepting moisture east of the Cascades", correct: false }
      explanation: |
        Pacific weather systems lose much of their moisture on the western side of the Cascades.
        Columbia Valley lies to leeward, where descending air is drier, producing the region’s arid
        to semi-arid conditions.
    fr:
      question: "Quelle est la principale cause de la faiblesse des précipitations dans la Columbia Valley ?"
      choices:
        - { text: "L’ombre pluviométrique créée par la chaîne des Cascades", correct: true }
        - { text: "Un courant côtier froid qui réduit l’humidité avant son arrivée dans l’intérieur de Washington", correct: false }
        - { text: "La vallée du fleuve Columbia qui dirige les perturbations du Pacifique au sud de la région", correct: false }
        - { text: "La chaîne côtière, moins élevée, qui intercepte l’humidité à l’est des Cascades", correct: false }
      explanation: |
        Les perturbations du Pacifique perdent une grande partie de leur humidité sur le versant
        occidental des Cascades. La Columbia Valley se trouve sous le vent, où l’air descendant est
        plus sec, d’où ses conditions arides à semi-arides.

  - id: washington-columbia-irrigation-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, viticulture]
    status: reviewed
    source_id: c34-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do most Columbia Valley vineyards meet vine water needs?"
      choices:
        - { text: "Through controlled irrigation using rivers, reservoirs or aquifers", correct: true }
        - { text: "Through dry farming supported by winter rainfall stored in deep clay soils", correct: false }
        - { text: "Through regular summer rainfall carried eastward across the Cascade Range", correct: false }
        - { text: "Through seasonal flood irrigation supplied chiefly by Pacific coastal rivers", correct: false }
      explanation: |
        Irrigation is essential across most of this dry region. Water from the Columbia, Yakima and
        Snake river systems, together with reservoirs and aquifers, lets growers regulate supply; a
        few wetter sites are exceptions.
    fr:
      question: "Comment la plupart des vignobles de la Columbia Valley couvrent-ils les besoins en eau de la vigne ?"
      choices:
        - { text: "Par une irrigation contrôlée alimentée par les cours d’eau, les réservoirs ou les nappes", correct: true }
        - { text: "Par la culture en sec grâce aux pluies hivernales stockées dans des sols argileux profonds", correct: false }
        - { text: "Par des pluies estivales régulières qui franchissent la chaîne des Cascades vers l’est", correct: false }
        - { text: "Par une irrigation saisonnière par submersion alimentée surtout par les fleuves côtiers du Pacifique", correct: false }
      explanation: |
        L’irrigation est indispensable dans la majeure partie de cette région sèche. Le Columbia, la
        Yakima et la Snake, ainsi que les réservoirs et nappes, permettent de maîtriser les apports
        ; quelques sites plus humides font exception.

  - id: washington-columbia-summer-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, climate]
    status: reviewed
    source_id: c34-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which summer conditions help Columbia Valley grapes ripen reliably?"
      choices:
        - { text: "Long daylight hours with warm, dry and sunny weather", correct: true }
        - { text: "Short daylight hours with persistent cloud and rain", correct: false }
        - { text: "Very cool days combined with uniformly hot nights", correct: false }
        - { text: "Daily fog that prevents sunlight reaching the canopy", correct: false }
      explanation: |
        The northerly latitude provides long summer days, while the continental interior is warm,
        dry and sunny. Irrigation supplies water, allowing growers to exploit abundant light without
        relying on seasonal rainfall.
    fr:
      question: "Quelles conditions estivales favorisent une maturation régulière dans la Columbia Valley ?"
      choices:
        - { text: "De longues journées accompagnées d’un temps chaud, sec et ensoleillé", correct: true }
        - { text: "Des journées courtes accompagnées de nuages et de pluies persistantes", correct: false }
        - { text: "Des journées très fraîches associées à des nuits uniformément chaudes", correct: false }
        - { text: "Un brouillard quotidien empêchant le soleil d’atteindre le couvert végétal", correct: false }
      explanation: |
        La latitude septentrionale procure de longues journées estivales, tandis que l’intérieur
        continental est chaud, sec et ensoleillé. L’irrigation fournit l’eau et permet d’exploiter
        cette lumière abondante sans dépendre des pluies saisonnières.

  - id: washington-columbia-ripeness-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, climate]
    status: reviewed
    source_id: c34-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is a major consequence of Columbia Valley’s warm, sunny growing season?"
      choices:
        - { text: "Late-ripening black grapes can achieve full flavour and phenolic ripeness", correct: true }
        - { text: "Early white grapes ripen reliably, but Cabernet Sauvignon usually remains herbaceous", correct: false }
        - { text: "Cool daytime temperatures slow sugar and phenolic ripening throughout the season", correct: false }
        - { text: "Similar terrain causes early and late varieties to reach maturity at nearly the same time", correct: false }
      explanation: |
        Warm days, intense sunlight and a long season allow varieties such as Cabernet Sauvignon,
        Merlot and Syrah to ripen successfully. Site, crop load and vintage still affect timing, so
        ripeness is not automatic or uniform.
    fr:
      question: "Quelle est une conséquence majeure de la saison végétative chaude et ensoleillée de la Columbia Valley ?"
      choices:
        - { text: "Les cépages noirs tardifs peuvent atteindre une pleine maturité aromatique et phénolique", correct: true }
        - { text: "Les cépages blancs précoces mûrissent bien, mais le Cabernet Sauvignon reste généralement végétal", correct: false }
        - { text: "La fraîcheur diurne ralentit l’accumulation des sucres et la maturité phénolique pendant toute la saison", correct: false }
        - { text: "La similitude du relief fait mûrir les cépages précoces et tardifs presque au même moment", correct: false }
      explanation: |
        Les journées chaudes, la forte luminosité et la longue saison permettent au Cabernet
        Sauvignon, au Merlot et à la Syrah de mûrir. Le site, la charge et le millésime influencent
        encore la date : la maturité n’est ni automatique ni uniforme.

  - id: washington-columbia-nights-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, climate]
    status: reviewed
    source_id: c34-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are cool nights valuable after Columbia Valley’s warm, sunny days?"
      choices:
        - { text: "They slow acid loss and help ripe grapes retain freshness", correct: true }
        - { text: "They accelerate acid respiration and produce softer, lower-acid wines", correct: false }
        - { text: "They provide enough condensation to replace irrigation across the dry interior", correct: false }
        - { text: "They promote widespread noble rot by keeping berries wet until morning", correct: false }
      explanation: |
        A marked diurnal range allows strong daytime ripening while cooler nights slow respiration
        of acids. This helps Washington wines combine ripe fruit with freshness, though the effect
        varies among sites.
    fr:
      question: "Pourquoi les nuits fraîches sont-elles précieuses après les journées chaudes et ensoleillées de la Columbia Valley ?"
      choices:
        - { text: "Elles ralentissent la perte d’acidité et aident les raisins mûrs à conserver leur fraîcheur", correct: true }
        - { text: "Elles accélèrent la respiration des acides et donnent des vins plus souples et moins acides", correct: false }
        - { text: "Elles apportent assez de condensation pour remplacer l’irrigation dans l’intérieur aride", correct: false }
        - { text: "Elles favorisent largement la pourriture noble en gardant les baies humides jusqu’au matin", correct: false }
      explanation: |
        Une forte amplitude thermique favorise la maturation pendant la journée, tandis que les
        nuits plus fraîches ralentissent la respiration des acides. Les vins peuvent ainsi associer
        fruit mûr et fraîcheur, avec des différences selon les sites.

  - id: washington-columbia-freeze-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, climate]
    status: reviewed
    source_id: c34-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climatic hazard can seriously damage Columbia Valley vines during winter?"
      choices:
        - { text: "Severe continental freezes", correct: true }
        - { text: "Persistent waterlogging caused by heavy maritime winter rain", correct: false }
        - { text: "Salt-laden winter gales arriving directly from the Pacific coast", correct: false }
        - { text: "Warm downslope winds that cause sunburn on dormant canes", correct: false }
      explanation: |
        Cold continental air can produce severe winter freezes east of the Cascades. The damage
        depends on temperature, duration, vine hardiness, site and growth stage, and can affect
        buds, trunks or entire vines.
    fr:
      question: "Quel aléa climatique peut gravement endommager les vignes de la Columbia Valley en hiver ?"
      choices:
        - { text: "De fortes gelées continentales", correct: true }
        - { text: "Un engorgement durable dû à de fortes pluies hivernales maritimes", correct: false }
        - { text: "Des vents hivernaux salés arrivant directement de la côte Pacifique", correct: false }
        - { text: "Des vents descendants chauds provoquant l’échaudage des sarments dormants", correct: false }
      explanation: |
        À l’est des Cascades, l’air continental froid peut provoquer de fortes gelées hivernales.
        Les dégâts dépendent de la température, de la durée, de l’endurcissement de la vigne, du
        site et du stade végétatif, et peuvent toucher bourgeons, troncs ou ceps entiers.

  - id: washington-columbia-freeze-crop-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, climate]
    status: reviewed
    source_id: c34-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a severe winter freeze affect a Columbia Valley vineyard?"
      choices:
        - { text: "It can kill buds or vine tissue, reducing the next crop and sometimes requiring retraining or replanting", correct: true }
        - { text: "It usually delays budbreak without injuring buds, trunks or the following crop", correct: false }
        - { text: "It improves primary-bud fruitfulness enough to compensate for tissue damage", correct: false }
        - { text: "It damages roots but generally leaves dormant buds and trunks unaffected", correct: false }
      explanation: |
        Freeze injury may range from lost primary buds to damaged trunks or dead vines. Crop loss
        therefore varies greatly rather than following a fixed percentage; recovery can require
        retraining from surviving tissue or replanting.
    fr:
      question: "Comment une forte gelée hivernale peut-elle affecter un vignoble de la Columbia Valley ?"
      choices:
        - { text: "Elle peut tuer des bourgeons ou des tissus, réduire la récolte suivante et imposer un reformage ou une replantation", correct: true }
        - { text: "Elle retarde généralement le débourrement sans léser les bourgeons, les troncs ni la récolte suivante", correct: false }
        - { text: "Elle améliore assez la fertilité des bourgeons principaux pour compenser les dégâts aux tissus", correct: false }
        - { text: "Elle endommage les racines mais laisse généralement intacts les bourgeons dormants et les troncs", correct: false }
      explanation: |
        Les dégâts vont de la perte des bourgeons principaux à celle des troncs ou des ceps. La
        baisse de récolte ne suit donc pas un pourcentage fixe ; le rétablissement peut exiger un
        reformage à partir de tissus vivants ou une replantation.

  - id: washington-reds-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington, grapes]
    status: reviewed
    source_id: c34-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair represents the principal Bordeaux black varieties in Washington State?"
      choices:
        - { text: "Cabernet Sauvignon and Merlot", correct: true }
        - { text: "Pinot Noir and Gamay", correct: false }
        - { text: "Nebbiolo and Sangiovese", correct: false }
        - { text: "Concord and Catawba", correct: false }
      explanation: |
        Cabernet Sauvignon and Merlot are central to Washington red-wine production, both as
        varietal wines and in Bordeaux-style blends. Cabernet Sauvignon is especially important;
