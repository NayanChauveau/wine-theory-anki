        - { text: "Willamette Valley AVA", correct: false }
        - { text: "Columbia Gorge AVA", correct: false }
      explanation: |
        L’immense Columbia Valley AVA contient plus de 99 % de la surface en Vitis vinifera de
        Washington et la plupart des AVA imbriquées de l’État. Puget Sound, Columbia Gorge et Lewis-
        Clark Valley constituent des exceptions notables.

  - id: washington-columbia-east-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington]
    status: reviewed
    source_id: c34-0015
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: "Where does the Columbia Valley AVA lie in relation to the Cascade Range?"
      choices:
        - { text: "Wholly east of the Cascades, mostly in Washington with a small part in Oregon", correct: true }
        - { text: "Wholly west of the Cascades along the wet Puget Sound coast", correct: false }
        - { text: "Entirely south of the Oregon border in the Willamette Valley", correct: false }
        - { text: "Across the Coast Range with most vineyards directly beside the Pacific", correct: false }
      explanation: |
        Columbia Valley lies east of the Cascades and extends from central and eastern Washington
        into north-central Oregon. The mountains block much of the Pacific moisture, creating a dry
        continental environment.
    fr:
      question: "Où se situe la Columbia Valley AVA par rapport à la chaîne des Cascades ?"
      choices:
        - { text: "Entièrement à l’est des Cascades, surtout à Washington avec une petite partie en Oregon", correct: true }
        - { text: "Entièrement à l’ouest des Cascades, le long des côtes humides de Puget Sound", correct: false }
        - { text: "Entièrement au sud de l’Oregon, dans la Willamette Valley", correct: false }
        - { text: "À travers la chaîne côtière, avec la plupart des vignes directement près du Pacifique", correct: false }
      explanation: |
        La Columbia Valley se trouve à l’est des Cascades et s’étend du centre et de l’est de
        Washington jusqu’au nord-centre de l’Oregon. Les montagnes bloquent une grande partie de
        l’humidité du Pacifique et créent un milieu continental sec.

  - id: washington-columbia-rivers-001
    type: mcq
    deck: USA::Pacific Northwest
    tags: [usa, washington]
    status: reviewed
