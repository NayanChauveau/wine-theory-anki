      choices:
        - { text: "Light-bodied, fresh and aromatic, with citrus and tropical or green-fruit notes", correct: true }
        - { text: "Full-bodied and tannic, with dark fruit and long new-oak maturation", correct: false }
        - { text: "Sweet and botrytised, with honey, saffron and marmalade aromas", correct: false }
        - { text: "Oxidative and nutty, with biological ageing under flor", correct: false }
