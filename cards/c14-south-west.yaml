cards:
  - id: dordogne-east-of-e2m-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, dordogne]
    status: reviewed
    source_id: c14-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which South West wine district lies immediately east of Bordeaux’s Entre-Deux-Mers?"
      choices:
        - { text: "The Dordogne vineyards around Bergerac", correct: true }
        - { text: "The Lot vineyards around Cahors", correct: false }
        - { text: "The Pyrenean foothills around Jurançon", correct: false }
        - { text: "The Gascon vineyards around Armagnac", correct: false }
      explanation: |
        The Bergerac vineyards continue eastward along the Dordogne beyond Bordeaux. Cahors lies farther
        inland on the Lot, while Madiran and Jurançon are much farther south.
    fr:
      question: "Quel vignoble du Sud-Ouest se situe immédiatement à l’est de l’Entre-deux-Mers bordelais ?"
      choices:
        - { text: "Le vignoble de la Dordogne autour de Bergerac", correct: true }
        - { text: "Le vignoble du Lot autour de Cahors", correct: false }
        - { text: "Le piémont pyrénéen autour de Jurançon", correct: false }
        - { text: "Le vignoble gascon autour de l’Armagnac", correct: false }
      explanation: |
        Le vignoble de Bergerac prolonge vers l’est les vignobles bordelais le long de la Dordogne. Cahors
        se trouve plus loin dans les terres sur le Lot, tandis que Madiran et Jurançon sont beaucoup plus au
        sud.
  - id: dordogne-climate-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, dordogne, climate]
    status: reviewed
    source_id: c14-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does the climate of the Dordogne vineyards differ from that of Bordeaux?"
      choices:
        - { text: "It is similarly maritime-influenced but more continental because it lies farther inland", correct: true }
        - { text: "It is much cooler and more oceanic because it lies closer to the Atlantic", correct: false }
        - { text: "It is Mediterranean, with almost no rain during the growing season", correct: false }
        - { text: "It is alpine, with a much shorter growing season and frequent summer frost", correct: false }
      explanation: |
        The Dordogne still receives Atlantic influence, but distance from the ocean increases seasonal
        temperature variation. Summers can be warmer and winters colder than in Bordeaux, while autumn
        humidity can encourage noble rot in suitable sites.
    fr:
      question: "Comment le climat du vignoble de la Dordogne diffère-t-il de celui de Bordeaux ?"
      choices:
        - { text: "Il reste influencé par l’océan mais devient plus continental en raison de son éloignement", correct: true }
        - { text: "Il est beaucoup plus frais et océanique parce qu’il est plus proche de l’Atlantique", correct: false }
        - { text: "Il est méditerranéen, avec presque aucune pluie pendant la saison de croissance", correct: false }
        - { text: "Il est alpin, avec une saison de croissance beaucoup plus courte et de fréquents gels estivaux", correct: false }
      explanation: |
        La Dordogne reçoit encore l’influence atlantique, mais l’éloignement de l’océan accentue les
        variations saisonnières. Les étés peuvent être plus chauds et les hivers plus froids qu’à Bordeaux,
        tandis que l’humidité automnale peut favoriser la pourriture noble sur les sites adaptés.
  - id: bergerac-main-aoc-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, bergerac]
    status: reviewed
    source_id: c14-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which is the principal broad appellation of the Dordogne wine district?"
      choices:
        - { text: "Bergerac", correct: true }
        - { text: "Cahors", correct: false }
        - { text: "Madiran", correct: false }
        - { text: "Jurançon", correct: false }
      explanation: |
        Bergerac is the principal regional AOC of the Dordogne vineyards and produces red, rosé and white
        wines. More specific local appellations include Monbazillac and Pécharmant.
    fr:
      question: "Quelle est la principale appellation générale du vignoble de la Dordogne ?"
      choices:
        - { text: "Bergerac", correct: true }
        - { text: "Cahors", correct: false }
        - { text: "Madiran", correct: false }
        - { text: "Jurançon", correct: false }
      explanation: |
        Bergerac est la principale AOC régionale du vignoble de la Dordogne et produit des vins rouges,
        rosés et blancs. Des appellations locales plus précises comprennent Monbazillac et Pécharmant.
  - id: bergerac-varieties-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, bergerac]
    status: reviewed
    source_id: c14-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape-variety pattern characterises Bergerac?"
      choices:
        - { text: "Bordeaux varieties for both red and white wines", correct: true }
        - { text: "Tannat for red and Petit Manseng for white wines", correct: false }
        - { text: "Malbec for red and Chenin Blanc for white wines", correct: false }
        - { text: "Gamay for red and Chardonnay for white wines", correct: false }
      explanation: |
        Bergerac uses Merlot, Cabernet Sauvignon, Cabernet Franc and Malbec for reds, together with
        Sauvignon Blanc, Sémillon and Muscadelle for whites. This reflects its proximity to Bordeaux.
    fr:
      question: "Quel profil d’encépagement caractérise Bergerac ?"
      choices:
        - { text: "Les cépages bordelais pour les vins rouges comme pour les blancs", correct: true }
        - { text: "Le Tannat pour les rouges et le Petit Manseng pour les blancs", correct: false }
        - { text: "Le Malbec pour les rouges et le Chenin Blanc pour les blancs", correct: false }
        - { text: "Le Gamay pour les rouges et le Chardonnay pour les blancs", correct: false }
      explanation: |
        Bergerac utilise le Merlot, le Cabernet Sauvignon, le Cabernet Franc et le Malbec pour les rouges,
        ainsi que le Sauvignon Blanc, le Sémillon et la Muscadelle pour les blancs. Cela reflète sa
        proximité avec Bordeaux.
  - id: monbazillac-sweet-aoc-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, monbazillac]
    status: reviewed
    source_id: c14-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Dordogne AOC specialises in sweet white wine?"
      choices:
        - { text: "Monbazillac", correct: true }
        - { text: "Pécharmant", correct: false }
        - { text: "Bergerac Rosé", correct: false }
        - { text: "Côtes de Gascogne", correct: false }
      explanation: |
        Monbazillac is the best-known sweet-wine appellation in the Bergerac district. Pécharmant is a
        red-wine appellation, while Côtes de Gascogne is an IGP farther south.
    fr:
      question: "Quelle AOC de Dordogne est spécialisée dans les vins blancs doux ?"
      choices:
        - { text: "Monbazillac", correct: true }
        - { text: "Pécharmant", correct: false }
        - { text: "Bergerac Rosé", correct: false }
        - { text: "Côtes de Gascogne", correct: false }
      explanation: |
        Monbazillac est l’appellation de vin doux la plus connue du Bergeracois. Pécharmant est une
        appellation de rouge, tandis que Côtes de Gascogne est une IGP située plus au sud.
  - id: monbazillac-botrytis-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, monbazillac]
    status: reviewed
    source_id: c14-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination best describes Monbazillac?"
      choices:
        - { text: "Sweet white wine from Sémillon, Sauvignon and Muscadelle, commonly concentrated by noble rot", correct: true }
        - { text: "Dry white wine from Petit Manseng and Gros Manseng, protected from noble rot", correct: false }
        - { text: "Tannic red wine from Tannat, Cabernet Franc and Cabernet Sauvignon", correct: false }
        - { text: "Fresh aromatic white IGP wine based mainly on Colombard and Ugni Blanc", correct: false }
      explanation: |
        Autumn mist from the Dordogne can encourage Botrytis cinerea, followed by drier conditions that
        concentrate the grapes. Sémillon is central, supported by Sauvignon and Muscadelle; over-ripening
        may also contribute.
    fr:
      question: "Quelle combinaison décrit le mieux Monbazillac ?"
      choices:
        - { text: "Un blanc doux de Sémillon, Sauvignon et Muscadelle, souvent concentré par la pourriture noble", correct: true }
        - { text: "Un blanc sec de Petit Manseng et Gros Manseng, protégé de la pourriture noble", correct: false }
        - { text: "Un rouge tannique de Tannat, Cabernet Franc et Cabernet Sauvignon", correct: false }
        - { text: "Un blanc d’IGP frais et aromatique principalement fondé sur Colombard et Ugni Blanc", correct: false }
      explanation: |
        Les brumes automnales de la Dordogne peuvent favoriser Botrytis cinerea, puis des conditions plus
        sèches concentrent les raisins. Le Sémillon joue un rôle central, complété par le Sauvignon et la
        Muscadelle ; la surmaturation peut aussi contribuer.
  - id: southwest-core-names-001
    type: mcq
    deck: France::South West
    tags: [france, south-west]
    status: reviewed
    source_id: c14-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which group consists entirely of major South West French wine names outside the Dordogne district?"
      choices:
        - { text: "Cahors, Côtes de Gascogne, Madiran and Jurançon", correct: true }
        - { text: "Chinon, Sancerre, Vouvray and Muscadet", correct: false }
        - { text: "Bandol, Cassis, Palette and Bellet", correct: false }
        - { text: "Morgon, Fleurie, Brouilly and Juliénas", correct: false }
      explanation: |
        Cahors lies on the Lot, Côtes de Gascogne covers a broad Gascon IGP area, and Madiran and Jurançon
        lie toward the Pyrenees. They illustrate the geographical and stylistic diversity of the South West.
    fr:
      question: "Quel groupe réunit uniquement de grands noms viticoles du Sud-Ouest situés hors du vignoble de la Dordogne ?"
      choices:
        - { text: "Cahors, Côtes de Gascogne, Madiran et Jurançon", correct: true }
        - { text: "Chinon, Sancerre, Vouvray et Muscadet", correct: false }
        - { text: "Bandol, Cassis, Palette et Bellet", correct: false }
        - { text: "Morgon, Fleurie, Brouilly et Juliénas", correct: false }
      explanation: |
        Cahors se trouve sur le Lot, Côtes de Gascogne couvre une vaste zone d’IGP gasconne, et Madiran
        comme Jurançon se situent vers les Pyrénées. Ces noms illustrent la diversité géographique et
        stylistique du Sud-Ouest.
  - id: gascogne-is-igp-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, gascogne]
    status: reviewed
    source_id: c14-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which South West name is an IGP rather than an AOC?"
      choices:
        - { text: "Côtes de Gascogne", correct: true }
        - { text: "Côtes de Bergerac", correct: false }
        - { text: "Pacherenc du Vic-Bilh", correct: false }
        - { text: "Saint-Mont", correct: false }
      explanation: |
        Côtes de Gascogne is a protected geographical indication with broad rules and a large production
        area. Cahors, Madiran and Jurançon are protected designations of origin.
    fr:
      question: "Quel nom du Sud-Ouest est une IGP plutôt qu’une AOC ?"
      choices:
        - { text: "Côtes de Gascogne", correct: true }
        - { text: "Côtes de Bergerac", correct: false }
        - { text: "Pacherenc du Vic-Bilh", correct: false }
        - { text: "Saint-Mont", correct: false }
      explanation: |
        Côtes de Gascogne est une indication géographique protégée dotée de règles larges et d’une vaste
        aire de production. Cahors, Madiran et Jurançon sont des appellations d’origine protégées.
  - id: cahors-lot-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, cahors]
    status: reviewed
    source_id: c14-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where is the Cahors AOC located?"
      choices:
        - { text: "Along both banks of the River Lot, east of Bordeaux", correct: true }
        - { text: "Along the Dordogne immediately east of Saint-Émilion", correct: false }
        - { text: "In the Pyrenean foothills south of Pau", correct: false }
        - { text: "In Gascony between the Landes forest and the Atlantic", correct: false }
      explanation: |
        The Cahors vineyards follow the meanders and terraces of the Lot in the département of the same
        name. The region lies well inland to the east of Bordeaux.
    fr:
      question: "Où se situe l’AOC Cahors ?"
      choices:
        - { text: "Sur les deux rives du Lot, à l’est de Bordeaux", correct: true }
        - { text: "Le long de la Dordogne immédiatement à l’est de Saint-Émilion", correct: false }
        - { text: "Dans le piémont pyrénéen au sud de Pau", correct: false }
        - { text: "En Gascogne entre la forêt des Landes et l’Atlantique", correct: false }
      explanation: |
        Le vignoble de Cahors suit les méandres et les terrasses du Lot dans le département du même nom. La
        région se situe loin dans les terres, à l’est de Bordeaux.
  - id: cahors-black-wine-name-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, cahors]
    status: reviewed
    source_id: c14-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which historical nickname reflects the deep colour of Cahors wine?"
      choices:
        - { text: "Black wine", correct: true }
        - { text: "Yellow wine", correct: false }
        - { text: "Straw wine", correct: false }
        - { text: "Grey wine", correct: false }
      explanation: |
        Cahors was historically known in English trade as black wine because of its unusually deep colour
        and firm structure. Claret referred to lighter Bordeaux red, hock to German Rhine wine and sack to
        fortified Iberian wine.
    fr:
      question: "Quel surnom historique reflète la couleur profonde du vin de Cahors ?"
      choices:
        - { text: "Vin noir", correct: true }
        - { text: "Vin jaune", correct: false }
        - { text: "Vin de paille", correct: false }
        - { text: "Vin gris", correct: false }
      explanation: |
        Dans le commerce anglais, Cahors était historiquement connu comme le « vin noir » en raison de sa
        couleur exceptionnellement profonde et de sa structure ferme. Claret désignait le Bordeaux rouge
        plus pâle, hock un vin allemand du Rhin et sack un vin fortifié ibérique.
  - id: cahors-black-wine-style-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, cahors]
    status: reviewed
    source_id: c14-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which structural profile created Cahors’s historical black-wine reputation?"
      choices:
        - { text: "Deep colour, firm tannin and substantial ageing potential", correct: true }
        - { text: "Pale colour, low tannin and immediate drinkability", correct: false }
        - { text: "High sweetness, low acidity and pronounced botrytis character", correct: false }
        - { text: "Light body, low alcohol and carbonic fermentation aromas", correct: false }
      explanation: |
        Traditional Cahors was dark, tannic and capable of long ageing. Modern producers offer a broader
        range, but serious examples still combine dense Malbec fruit, firm structure and ageing capacity.
    fr:
      question: "Quel profil structurel a créé la réputation historique de « vin noir » de Cahors ?"
      choices:
        - { text: "Couleur profonde, tanins fermes et important potentiel de garde", correct: true }
        - { text: "Couleur pâle, peu de tanins et consommation immédiate", correct: false }
        - { text: "Forte douceur, faible acidité et caractère botrytisé prononcé", correct: false }
        - { text: "Corps léger, faible alcool et arômes de fermentation carbonique", correct: false }
      explanation: |
        Le Cahors traditionnel était sombre, tannique et apte à une longue garde. Les producteurs modernes
        proposent une gamme plus large, mais les cuvées sérieuses associent encore fruit dense du Malbec,
        structure ferme et capacité de vieillissement.
  - id: cahors-land-types-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, cahors]
    status: reviewed
    source_id: c14-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which landscape best explains the diversity of vineyard sites in Cahors?"
      choices:
        - { text: "River terraces at different heights, limestone slopes and the causse plateau", correct: true }
        - { text: "One flat, fertile floodplain with no changes in elevation", correct: false }
        - { text: "A single granite escarpment descending directly to the Atlantic", correct: false }
        - { text: "Volcanic cones surrounded by deep black basalt soils", correct: false }
      explanation: |
        The Lot has cut a winding valley with several levels of alluvial terraces, while limestone slopes
        and the higher causse add poorer, well-drained sites. Soil, elevation and exposure all influence
        wine style.
    fr:
      question: "Quel paysage explique le mieux la diversité des sites viticoles de Cahors ?"
      choices:
        - { text: "Des terrasses fluviales à différentes hauteurs, des versants calcaires et le plateau du causse", correct: true }
        - { text: "Une unique plaine alluviale plate et fertile sans variation d’altitude", correct: false }
        - { text: "Un seul escarpement granitique descendant directement vers l’Atlantique", correct: false }
        - { text: "Des cônes volcaniques entourés de profonds sols de basalte noir", correct: false }
      explanation: |
        Le Lot a creusé une vallée sinueuse comportant plusieurs niveaux de terrasses alluviales, tandis que
        les versants calcaires et le causse plus élevé offrent des sites plus pauvres et bien drainés. Le
        sol, l’altitude et l’exposition influencent tous le style du vin.
  - id: cahors-malbec-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, cahors, malbec]
    status: reviewed
    source_id: c14-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape must dominate a Cahors red?"
      choices:
        - { text: "Malbec, locally also called Côt or Auxerrois", correct: true }
        - { text: "Tannat, locally also called Harriague", correct: false }
        - { text: "Merlot, locally also called Bouchalès", correct: false }
        - { text: "Fer Servadou, locally also called Mansois", correct: false }
      explanation: |
        Cahors is based on Malbec, which must form at least 70% of the blend. Côt and Auxerrois are local
        synonyms; Merlot and Tannat may play supporting roles.
    fr:
      question: "Quel cépage doit dominer un Cahors rouge ?"
      choices:
        - { text: "Le Malbec, aussi appelé localement Côt ou Auxerrois", correct: true }
        - { text: "Le Tannat, aussi appelé localement Harriague", correct: false }
        - { text: "Le Merlot, aussi appelé localement Bouchalès", correct: false }
        - { text: "Le Fer Servadou, aussi appelé localement Mansois", correct: false }
      explanation: |
        Cahors repose sur le Malbec, qui doit constituer au moins 70 % de l’assemblage. Côt et Auxerrois
        sont des synonymes locaux ; le Merlot et le Tannat peuvent jouer des rôles complémentaires.
  - id: cahors-other-grapes-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, cahors]
    status: reviewed
    source_id: c14-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grapes may complement Malbec in a Cahors blend?"
      choices:
        - { text: "Merlot and Tannat", correct: true }
        - { text: "Cabernet Franc and Cabernet Sauvignon", correct: false }
        - { text: "Syrah and Grenache", correct: false }
        - { text: "Fer Servadou and Négrette", correct: false }
      explanation: |
        The permitted supporting grapes are Merlot and Tannat. Together they may account for no more than
        30% because Malbec must remain the defining majority.
    fr:
      question: "Quels cépages peuvent compléter le Malbec dans un assemblage de Cahors ?"
      choices:
        - { text: "Merlot et Tannat", correct: true }
        - { text: "Cabernet Franc et Cabernet Sauvignon", correct: false }
        - { text: "Syrah et Grenache", correct: false }
        - { text: "Fer Servadou et Négrette", correct: false }
      explanation: |
        Les cépages complémentaires autorisés sont le Merlot et le Tannat. Ensemble, ils ne peuvent dépasser
        30 %, puisque le Malbec doit rester nettement majoritaire.
  - id: cahors-malbec-profile-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, cahors, malbec]
    status: reviewed
    source_id: c14-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best describes a high-quality Cahors red?"
      choices:
        - { text: "Deep-coloured and tannic, with dark fruit, spice and capacity to develop earthy complexity", correct: true }
        - { text: "Pale and low in tannin, with strawberry fruit and no ageing potential", correct: false }
        - { text: "Sweet and botrytised, with apricot, honey and high residual sugar", correct: false }
        - { text: "Light and simple, with banana aromas from a very short carbonic maceration", correct: false }
      explanation: |
        High-quality Cahors combines concentrated red and black fruit with spice, violet and firm tannin.
        Oak may contribute flavour and structure, while bottle age can bring savoury, earthy complexity.
    fr:
      question: "Quel profil décrit le mieux un Cahors rouge de qualité ?"
      choices:
        - { text: "Très coloré et tannique, avec fruits noirs, épices et capacité à développer une complexité terreuse", correct: true }
        - { text: "Pâle et peu tannique, avec fruit de fraise et aucun potentiel de garde", correct: false }
        - { text: "Doux et botrytisé, avec abricot, miel et forte teneur en sucre résiduel", correct: false }
        - { text: "Léger et simple, avec des arômes de banane issus d’une très courte macération carbonique", correct: false }
      explanation: |
        Un Cahors de qualité associe des fruits rouges et noirs concentrés à des épices, de la violette et
        des tanins fermes. Le bois peut apporter saveur et structure, tandis que la garde en bouteille
        développe une complexité savoureuse et terreuse.
  - id: gascogne-igp-zone-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, gascogne]
    status: reviewed
    source_id: c14-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why is IGP an important category for wine production in Gascony?"
      choices:
        - { text: "It permits a broad range of grapes and styles across a large geographical area", correct: true }
        - { text: "It restricts every wine to one traditional grape and a small village area", correct: false }
        - { text: "It requires all white wines to be sweet and botrytised", correct: false }
        - { text: "It applies only to spirit production for Armagnac", correct: false }
      explanation: |
        Côtes de Gascogne IGP covers a broad area and permits many local and international varieties,
        supporting fresh commercial wines as well as some more distinctive styles. It exists alongside, not
        merely as a by-product of, Armagnac production.
    fr:
      question: "Pourquoi l’IGP est-elle une catégorie importante pour la production de vin en Gascogne ?"
      choices:
        - { text: "Elle autorise une large gamme de cépages et de styles sur une vaste aire géographique", correct: true }
        - { text: "Elle limite chaque vin à un seul cépage traditionnel et à une petite aire villageoise", correct: false }
        - { text: "Elle impose que tous les blancs soient doux et botrytisés", correct: false }
        - { text: "Elle s’applique uniquement à la production d’eau-de-vie d’Armagnac", correct: false }
      explanation: |
        L’IGP Côtes de Gascogne couvre une vaste zone et autorise de nombreux cépages locaux ou
        internationaux, permettant des vins commerciaux frais comme des styles plus distinctifs. Elle
        coexiste avec la production d’Armagnac sans en être un simple sous-produit.
  - id: gascogne-name-001
