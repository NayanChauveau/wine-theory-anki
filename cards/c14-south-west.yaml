      choices:
        - { text: "Côtes de Gascogne", correct: true }
        - { text: "Comté Tolosan", correct: false }
        - { text: "Atlantique", correct: false }
        - { text: "Landes", correct: false }
      explanation: |
        Côtes de Gascogne est le principal nom d’IGP à retenir. Son aire de production se situe surtout en
        Gascogne, entre la Garonne, la forêt des Landes et les Pyrénées.
  - id: gascogne-ugni-001
