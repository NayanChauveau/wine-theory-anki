    fr:
      question: "Quel profil est typique d’un Côtes de Gascogne blanc sec ?"
      choices:
        - { text: "Léger, frais et aromatique, avec agrumes et notes de fruits exotiques ou verts", correct: true }
        - { text: "Corsé et tannique, avec fruits noirs et long élevage en bois neuf", correct: false }
        - { text: "Doux et botrytisé, avec miel, safran et marmelade", correct: false }
        - { text: "Oxydatif et marqué par la noix, avec élevage biologique sous voile", correct: false }
      explanation: |
        Le Colombard, l’Ugni Blanc, le Sauvignon Blanc et le Gros Manseng figurent parmi les cépages
        importants. Une vinification à basse température préserve leur acidité fraîche et leurs arômes
        d’agrumes, de fruits exotiques ou de fruits verts.
  - id: madiran-location-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, madiran]
    status: reviewed
    source_id: c14-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where is the Madiran AOC located?"
      choices:
        - { text: "On hills north-east of Pau, as the land rises toward the Pyrenees", correct: true }
        - { text: "Along the Dordogne immediately east of Bordeaux", correct: false }
        - { text: "On the River Lot around the town of Cahors", correct: false }
        - { text: "On the Atlantic coast north of the Gironde estuary", correct: false }
      explanation: |
        Madiran spans hillside sites in the Vic-Bilh area across parts of three départements, mainly
        north-east of Pau. Its valleys and sediments reflect the nearby Pyrenees.
    fr:
      question: "Où se situe l’AOC Madiran ?"
      choices:
        - { text: "Sur des coteaux au nord-est de Pau, lorsque le relief s’élève vers les Pyrénées", correct: true }
        - { text: "Le long de la Dordogne immédiatement à l’est de Bordeaux", correct: false }
        - { text: "Sur le Lot autour de la ville de Cahors", correct: false }
        - { text: "Sur la côte atlantique au nord de l’estuaire de la Gironde", correct: false }
      explanation: |
        Madiran occupe des coteaux du Vic-Bilh dans trois départements, principalement au nord-est de Pau.
        Ses vallées et ses sédiments témoignent de la proximité des Pyrénées.
  - id: madiran-tannat-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, madiran, tannat]
    status: reviewed
    source_id: c14-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape and structural profile define Madiran?"
      choices:
        - { text: "Tannat, giving deep colour and firm tannin", correct: true }
        - { text: "Malbec, giving pale colour and low tannin", correct: false }
        - { text: "Petit Manseng, giving high acidity and sweetness", correct: false }
        - { text: "Colombard, giving light body and citrus aromas", correct: false }
      explanation: |
        Madiran is based principally on Tannat, which produces deeply coloured, powerful and tannic red
        wines. Cabernet Franc, Cabernet Sauvignon and Fer Servadou may support it in the blend.
    fr:
      question: "Quel cépage et quel profil structurel définissent Madiran ?"
      choices:
        - { text: "Le Tannat, qui apporte une couleur profonde et des tanins fermes", correct: true }
        - { text: "Le Malbec, qui apporte une couleur pâle et peu de tanins", correct: false }
        - { text: "Le Petit Manseng, qui apporte une forte acidité et de la douceur", correct: false }
        - { text: "Le Colombard, qui apporte un corps léger et des arômes d’agrumes", correct: false }
      explanation: |
        Madiran repose principalement sur le Tannat, qui produit des rouges profondément colorés, puissants
        et tanniques. Le Cabernet Franc, le Cabernet Sauvignon et le Fer Servadou peuvent le compléter dans
        l’assemblage.
  - id: madiran-bottle-age-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, madiran]
    status: reviewed
    source_id: c14-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why did traditional Madiran often require extended bottle ageing?"
      choices:
        - { text: "Time was needed to soften Tannat’s abundant, firm tannins", correct: true }
        - { text: "Time was needed to develop bubbles through a second fermentation", correct: false }
        - { text: "Time was needed for Botrytis cinerea to grow after bottling", correct: false }
        - { text: "Time was needed to convert a dry wine into a fortified wine", correct: false }
      explanation: |
        Traditional extraction produced highly tannic wines whose structure could seem severe when young.
        Bottle age gradually integrated the tannins and developed savoury complexity.
    fr:
      question: "Pourquoi le Madiran traditionnel exigeait-il souvent une longue garde en bouteille ?"
      choices:
        - { text: "Il fallait du temps pour assouplir les tanins abondants et fermes du Tannat", correct: true }
        - { text: "Il fallait du temps pour développer les bulles par une seconde fermentation", correct: false }
        - { text: "Il fallait du temps pour que Botrytis cinerea se développe après la mise en bouteille", correct: false }
        - { text: "Il fallait du temps pour transformer un vin sec en vin fortifié", correct: false }
      explanation: |
        L’extraction traditionnelle produisait des vins très tanniques dont la structure pouvait sembler
        sévère dans leur jeunesse. La garde en bouteille intégrait progressivement les tanins et développait
        une complexité savoureuse.
  - id: madiran-modern-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, madiran]
    status: reviewed
    source_id: c14-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which approach can make modern Madiran more approachable when young?"
      choices:
        - { text: "Riper grapes, gentler extraction and careful oxygen management", correct: true }
        - { text: "Earlier picking, stronger extraction and complete avoidance of oxygen", correct: false }
        - { text: "Replacing Tannat entirely with a low-tannin white grape", correct: false }
        - { text: "Stopping fermentation early to leave substantial residual sugar", correct: false }
      explanation: |
        Riper fruit gives less green tannin, while gentler extraction and techniques such as
        micro-oxygenation can help integrate structure. Madiran producer Patrick Ducournau was an important
        pioneer of micro-oxygenation in the 1990s.
    fr:
      question: "Quelle approche peut rendre un Madiran moderne plus accessible dans sa jeunesse ?"
      choices:
        - { text: "Des raisins plus mûrs, une extraction plus douce et une gestion attentive de l’oxygène", correct: true }
        - { text: "Une vendange plus précoce, une extraction plus forte et l’exclusion totale de l’oxygène", correct: false }
        - { text: "Le remplacement complet du Tannat par un cépage blanc peu tannique", correct: false }
        - { text: "L’arrêt précoce de la fermentation afin de conserver beaucoup de sucre résiduel", correct: false }
      explanation: |
        Un fruit plus mûr donne des tanins moins végétaux, tandis qu’une extraction douce et des techniques
        comme la micro-oxygénation peuvent aider à intégrer la structure. Le producteur de Madiran Patrick
        Ducournau fut un pionnier important de la micro-oxygénation dans les années 1990.
  - id: jurancon-location-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, jurancon]
    status: reviewed
    source_id: c14-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where is the Jurançon AOC located?"
      choices:
        - { text: "On steep hillsides in the Pyrenean foothills around Pau", correct: true }
        - { text: "On limestone terraces beside the River Lot around Cahors", correct: false }
        - { text: "On the Dordogne hills immediately east of Saint-Émilion", correct: false }
        - { text: "On the Gascon plains north of the Landes forest", correct: false }
      explanation: |
        Jurançon occupies scattered, often steep hillside vineyards in the Pyrenean foothills south and west
        of Pau. The oceanic climate is modified by warm, dry southerly winds in autumn.
    fr:
      question: "Où se situe l’AOC Jurançon ?"
      choices:
        - { text: "Sur des coteaux escarpés du piémont pyrénéen autour de Pau", correct: true }
        - { text: "Sur des terrasses calcaires au bord du Lot autour de Cahors", correct: false }
        - { text: "Sur les collines de la Dordogne immédiatement à l’est de Saint-Émilion", correct: false }
        - { text: "Dans les plaines gasconnes au nord de la forêt des Landes", correct: false }
      explanation: |
        Jurançon occupe des vignobles dispersés, souvent très pentus, dans le piémont pyrénéen au sud et à
        l’ouest de Pau. Le climat océanique est modifié par des vents chauds et secs venus du sud en
        automne.
  - id: jurancon-styles-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, jurancon]
    status: reviewed
    source_id: c14-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two principal styles are produced in Jurançon?"
      choices:
        - { text: "Dry white labelled Jurançon Sec and sweet white labelled Jurançon", correct: true }
        - { text: "Dry red labelled Jurançon and sweet red labelled Jurançon Doux", correct: false }
        - { text: "Sparkling white labelled Jurançon Mousseux and dry rosé", correct: false }
        - { text: "Fortified white labelled Jurançon and oxidative red labelled Jurançon Sec", correct: false }
      explanation: |
        Jurançon is a white-wine appellation. The word Sec identifies the dry style, while Jurançon without
        Sec denotes the sweet style; Vendanges Tardives may identify particularly concentrated late-harvest
        wine.
    fr:
      question: "Quels sont les deux principaux styles produits en Jurançon ?"
      choices:
        - { text: "Un blanc sec étiqueté Jurançon Sec et un blanc doux étiqueté Jurançon", correct: true }
        - { text: "Un rouge sec étiqueté Jurançon et un rouge doux étiqueté Jurançon Doux", correct: false }
        - { text: "Un blanc effervescent étiqueté Jurançon Mousseux et un rosé sec", correct: false }
        - { text: "Un blanc fortifié étiqueté Jurançon et un rouge oxydatif étiqueté Jurançon Sec", correct: false }
      explanation: |
        Jurançon est une appellation de vin blanc. La mention « Sec » désigne le style sec, tandis que
        Jurançon sans cette mention correspond au style doux ; « Vendanges Tardives » peut identifier un vin
        tardif particulièrement concentré.
  - id: jurancon-sweet-focus-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, jurancon]
    status: reviewed
    source_id: c14-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Jurançon style has historically carried the appellation’s strongest reputation?"
      choices:
        - { text: "Concentrated sweet white wine with balancing acidity", correct: true }
        - { text: "Light neutral dry wine intended only for distillation", correct: false }
        - { text: "Tannic red wine based on Tannat", correct: false }
        - { text: "Sparkling rosé made by the ancestral method", correct: false }
      explanation: |
        Jurançon Sec can be distinctive and age-worthy, but the appellation is historically most famous for
        concentrated sweet wines whose high acidity prevents them from seeming heavy.
    fr:
      question: "Quel style de Jurançon porte historiquement la réputation la plus forte de l’appellation ?"
      choices:
        - { text: "Un blanc doux concentré équilibré par une forte acidité", correct: true }
        - { text: "Un blanc sec léger et neutre destiné uniquement à la distillation", correct: false }
        - { text: "Un rouge tannique à base de Tannat", correct: false }
        - { text: "Un rosé effervescent élaboré par méthode ancestrale", correct: false }
      explanation: |
        Jurançon Sec peut être distinctif et apte à la garde, mais l’appellation est historiquement surtout
        célèbre pour ses vins doux concentrés, dont la forte acidité évite toute lourdeur.
  - id: jurancon-petit-manseng-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, jurancon]
    status: reviewed
    source_id: c14-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do Petit Manseng and Gros Manseng typically divide their roles in Jurançon?"
      choices:
        - { text: "Petit Manseng is central to concentrated sweet wines; Gros Manseng is important in dry wines", correct: true }
        - { text: "Petit Manseng is used only for red wine; Gros Manseng only for rosé", correct: false }
        - { text: "Petit Manseng is neutral and low in acidity; Gros Manseng is highly tannic", correct: false }
        - { text: "Petit Manseng is used only for distillation; Gros Manseng only for sparkling wine", correct: false }
      explanation: |
        Petit Manseng has small, thick-skinned berries that retain acidity as sugar concentrates, making it
        particularly valuable for sweet wine. Gros Manseng gives larger yields and is an important component
        of Jurançon Sec.
    fr:
      question: "Comment le Petit Manseng et le Gros Manseng se répartissent-ils généralement les rôles en Jurançon ?"
      choices:
        - { text: "Le Petit Manseng est central dans les doux concentrés ; le Gros Manseng est important dans les secs", correct: true }
        - { text: "Le Petit Manseng sert uniquement aux rouges ; le Gros Manseng uniquement aux rosés", correct: false }
        - { text: "Le Petit Manseng est neutre et peu acide ; le Gros Manseng est très tannique", correct: false }
        - { text: "Le Petit Manseng sert uniquement à la distillation ; le Gros Manseng aux effervescents", correct: false }
      explanation: |
        Le Petit Manseng possède de petites baies à pellicule épaisse qui conservent leur acidité pendant
        que le sucre se concentre, ce qui le rend particulièrement précieux pour les vins doux. Plus
        productif, le Gros Manseng joue un rôle important dans le Jurançon Sec.
  - id: jurancon-petit-manseng-acid-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, jurancon]
    status: reviewed
    source_id: c14-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which structural feature makes Petit Manseng especially suitable for sweet Jurançon?"
      choices:
        - { text: "It retains high acidity as sugar concentration increases", correct: true }
        - { text: "It develops high tannin while remaining very low in acidity", correct: false }
        - { text: "It loses nearly all acidity before late harvesting", correct: false }
        - { text: "It naturally stops fermentation at a very low alcohol level", correct: false }
      explanation: |
        Petit Manseng can reach very high sugar levels while retaining vivid acidity. This combination gives
        sweet Jurançon concentration and longevity without a cloying finish.
    fr:
      question: "Quelle caractéristique structurelle rend le Petit Manseng particulièrement adapté au Jurançon doux ?"
      choices:
        - { text: "Il conserve une forte acidité lorsque la concentration en sucre augmente", correct: true }
        - { text: "Il développe beaucoup de tanins tout en restant très peu acide", correct: false }
        - { text: "Il perd presque toute son acidité avant les vendanges tardives", correct: false }
        - { text: "Il arrête naturellement sa fermentation à un très faible degré alcoolique", correct: false }
      explanation: |
        Le Petit Manseng peut atteindre une très forte richesse en sucre tout en conservant une acidité
        vive. Cette combinaison apporte au Jurançon doux concentration et longévité sans finale écœurante.
  - id: jurancon-passerillage-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, jurancon]
    status: reviewed
    source_id: c14-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are grapes commonly concentrated for sweet Jurançon?"
      choices:
        - { text: "Late harvesting and passerillage on the vine, aided by warm, dry southerly winds", correct: true }
        - { text: "Systematic noble rot encouraged by persistent morning fog", correct: false }
        - { text: "Freezing the grapes on the vine before pressing", correct: false }
        - { text: "Fortifying the must with grape spirit during fermentation", correct: false }
      explanation: |
        Grapes are left to over-ripen and shrivel on the vine, often harvested in successive passes. Warm,
        dry autumn winds from the south assist concentration; noble rot is not the defining method.
    fr:
      question: "Comment les raisins sont-ils généralement concentrés pour produire le Jurançon doux ?"
      choices:
        - { text: "Par vendange tardive et passerillage sur souche, favorisés par des vents chauds et secs du sud", correct: true }
        - { text: "Par une pourriture noble systématique favorisée par des brouillards matinaux persistants", correct: false }
        - { text: "Par le gel des raisins sur souche avant leur pressurage", correct: false }
        - { text: "Par mutage du moût avec une eau-de-vie pendant la fermentation", correct: false }
      explanation: |
        Les raisins sont laissés à surmûrir et à se flétrir sur la vigne, souvent récoltés en plusieurs
        passages. Les vents automnaux chauds et secs venus du sud favorisent la concentration ; la
        pourriture noble n’est pas la méthode déterminante.
  - id: jurancon-flavours-001
    type: mcq
    deck: France::South West
    tags: [france, south-west, jurancon]
    status: reviewed
    source_id: c14-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile is typical of a high-quality sweet Jurançon?"
      choices:
        - { text: "Pronounced stone and tropical fruit, citrus freshness and possible spice or dried-fruit development", correct: true }
        - { text: "Neutral green fruit, low acidity and no capacity to develop in bottle", correct: false }
        - { text: "Deep colour, firm tannin and black-fruit flavours from extended skin maceration", correct: false }
        - { text: "Oxidative walnut, bruised apple and saline flavours from ageing under flor", correct: false }
      explanation: |
        Young sweet Jurançon can show apricot, pineapple, citrus and floral aromas with vivid acidity. With
        bottle or oak ageing, dried-fruit, honey and spice complexity may emerge.
    fr:
      question: "Quel profil est typique d’un Jurançon doux de qualité ?"
      choices:
        - { text: "Fruits à noyau et exotiques prononcés, fraîcheur d’agrumes et possible évolution vers les épices ou les fruits secs", correct: true }
        - { text: "Fruit vert neutre, faible acidité et aucune capacité d’évolution en bouteille", correct: false }
        - { text: "Couleur profonde, tanins fermes et fruits noirs issus d’une longue macération pelliculaire", correct: false }
        - { text: "Noix oxydative, pomme meurtrie et notes salines issues d’un élevage sous voile", correct: false }
      explanation: |
        Un Jurançon doux jeune peut présenter abricot, ananas, agrumes et fleurs avec une acidité vive. La
        garde en bouteille ou sous bois peut faire apparaître une complexité de fruits secs, de miel et
        d’épices.
