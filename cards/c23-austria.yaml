cards:
  - id: austria-east-001
    type: mcq
    deck: Austria
    tags: [austria]
    status: reviewed
    source_id: c23-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where are Austria’s principal wine-growing areas concentrated?"
      choices:
        - { text: "In the Alpine west", correct: false }
        - { text: "In the east", correct: true }
        - { text: "Along the central Alpine ridge", correct: false }
        - { text: "In the far south-west", correct: false }
      explanation: |
        Austria’s main vineyards lie in Niederösterreich, Burgenland, Steiermark and Wien; the mountainous west has very little vineyard area.
    fr:
      question: "Où se concentrent les principales régions viticoles autrichiennes ?"
      choices:
        - { text: "Dans l’ouest alpin", correct: false }
        - { text: "Dans l’est", correct: true }
        - { text: "Le long de la chaîne alpine centrale", correct: false }
        - { text: "À l’extrême sud-ouest", correct: false }
      explanation: |
        Les principaux vignobles se trouvent en Basse-Autriche, au Burgenland, en Styrie et à Vienne ; l’ouest montagneux compte très peu de vignes.

  - id: austria-climate-001
    type: mcq
    deck: Austria
    tags: [austria, climate]
    status: reviewed
    source_id: c23-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which broad climate type characterises Austria’s main eastern vineyards?"
      choices:
        - { text: "Cool maritime", correct: false }
        - { text: "Cool continental", correct: true }
        - { text: "Warm maritime", correct: false }
        - { text: "Mediterranean", correct: false }
      explanation: |
        The vineyards experience cold winters and warm, relatively dry summers, with marked seasonal temperature differences.
    fr:
      question: "Quel grand type de climat caractérise les principaux vignobles de l’est de l’Autriche ?"
      choices:
        - { text: "Maritime frais", correct: false }
        - { text: "Continental frais", correct: true }
        - { text: "Maritime chaud", correct: false }
        - { text: "Méditerranéen", correct: false }
      explanation: |
        Les hivers sont froids et les étés chauds et relativement secs, avec de forts écarts de température entre les saisons.

  - id: austria-winds-001
    type: mcq
    deck: Austria
    tags: [austria, climate]
    status: reviewed
    source_id: c23-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination of airflows helps explain climatic differences within eastern Austria?"
      choices:
        - { text: "Atlantic air from the west and föhn winds from the south", correct: false }
        - { text: "Cool northerly air and warm Pannonian air from the east", correct: true }
        - { text: "Mediterranean air from the south and Atlantic air from the north", correct: false }
        - { text: "Warm Alpine air from the west and cool Pannonian air from the east", correct: false }
      explanation: |
        Northern areas retain freshness, while the Pannonian influence raises temperatures toward Burgenland and the Hungarian border.
    fr:
      question: "Quelle combinaison de masses d’air contribue aux différences climatiques dans l’est de l’Autriche ?"
      choices:
        - { text: "L’air atlantique de l’ouest et le foehn du sud", correct: false }
        - { text: "L’air frais du nord et l’air pannonien chaud de l’est", correct: true }
        - { text: "L’air méditerranéen du sud et l’air atlantique du nord", correct: false }
        - { text: "L’air alpin chaud de l’ouest et l’air pannonien frais de l’est", correct: false }
      explanation: |
        Le nord conserve davantage de fraîcheur, tandis que l’influence pannonienne augmente les températures vers le Burgenland et la frontière hongroise.

  - id: austria-vintage-swing-001
    type: mcq
    deck: Austria
    tags: [austria, climate]
    status: reviewed
    source_id: c23-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of weather hazards can directly reduce an Austrian crop within a single growing season?"
      choices:
        - { text: "Winter rain and autumn fog", correct: false }
        - { text: "Spring frost and hail", correct: true }
        - { text: "Warm nights and a long autumn", correct: false }
        - { text: "Dry weather and cool nights", correct: false }
      explanation: |
        Frost can damage young shoots soon after budburst, while hail can destroy leaves and grapes later in the season.
    fr:
      question: "Quelle paire d’aléas météorologiques peut directement réduire une récolte autrichienne au cours d’un même cycle végétatif ?"
      choices:
        - { text: "Pluies hivernales et brouillard automnal", correct: false }
        - { text: "Gelées printanières et grêle", correct: true }
        - { text: "Nuits chaudes et long automne", correct: false }
        - { text: "Temps sec et nuits fraîches", correct: false }
      explanation: |
        Le gel peut endommager les jeunes pousses peu après le débourrement, tandis que la grêle peut détruire feuilles et raisins plus tard dans la saison.

