  - id: austria-gv-yield-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What style does Grüner Veltliner tend to produce when cropped at high yields?"
      choices:
        - { text: "Concentrated, spicy and full-bodied", correct: false }
        - { text: "Light, fresh and relatively neutral", correct: true }
        - { text: "Rich, sweet and botrytised", correct: false }
        - { text: "Deeply coloured and tannic", correct: false }
      explanation: |
        High yields dilute flavour concentration; controlled yields are needed for fuller body and Grüner’s characteristic spice.
    fr:
      question: "Quel style le Grüner Veltliner tend-il à produire lorsque les rendements sont élevés ?"
      choices:
        - { text: "Concentré, épicé et corsé", correct: false }
        - { text: "Léger, frais et relativement neutre", correct: true }
        - { text: "Riche, liquoreux et botrytisé", correct: false }
        - { text: "Très coloré et tannique", correct: false }
      explanation: |
        Les rendements élevés diluent la concentration aromatique ; des rendements maîtrisés sont nécessaires pour obtenir plus de corps et l’expression épicée typique du Grüner.

