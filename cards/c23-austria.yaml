        - { text: "Concrete only, because wood is prohibited", correct: false }
        - { text: "Small acacia barrels followed by amphora ageing", correct: false }
      explanation: |
        Neutral vessels preserve varietal fruit and spice; selected richer wines may gain texture and flavour from smaller oak.
    fr:
      question: "Quels contenants sont les plus courants pour le Grüner Veltliner autrichien ?"
      choices:
        - { text: "Des barriques neuves pour tous les niveaux de qualité", correct: false }
        - { text: "L’inox ou de grands fûts neutres, avec parfois la barrique pour les styles plus riches", correct: true }
        - { text: "Uniquement le béton, car le bois est interdit", correct: false }
        - { text: "De petits fûts d’acacia suivis d’un élevage en amphore", correct: false }
      explanation: |
        Les contenants neutres préservent le fruit et les épices du cépage ; certains vins plus opulents gagnent en texture et en arômes dans de petits fûts.

