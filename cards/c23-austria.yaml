# yaml-language-server: $schema=../schema/cards.schema.json
# source: C23 (import/inbox/c23-austria.yaml)
# deck: Austria

cards:
  - id: austria-east-001
    type: mcq
    deck: Austria
    tags: [austria]
    status: reviewed
    source_id: c23-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Austrian vines cluster toward which side of the country, not the high Alps?
      choices:
        - { text: "Only on the high western Alps", correct: false }
        - { text: "In the east", correct: true }
        - { text: "Evenly, including Vorarlberg", correct: false }
        - { text: "Only on the Italian border in the far south", correct: false }
      explanation: |
        **In the east.** Niederösterreich, Burgenland, Steiermark and Wien
        sit on that side; the west is mountain country.

  - id: austria-climate-001
    type: mcq
    deck: Austria
    tags: [austria, climate]
    status: reviewed
    source_id: c23-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which climate type describes the vineyards of eastern Austria?
      choices:
        - { text: "Cool maritime, like Muscadet", correct: false }
        - { text: "Cool continental", correct: true }
        - { text: "Hot Mediterranean, like the southern Rhône", correct: false }
        - { text: "Equatorial rainforest", correct: false }
      explanation: |
        **Cool continental.** Winters bite; summers are the ripening
        window. Burgenland then picks up extra Pannonian warmth.

  - id: austria-winds-001
    type: mcq
    deck: Austria
    tags: [austria, climate]
    status: reviewed
    source_id: c23-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which wind pattern shapes eastern Austria’s vineyards?
      choices:
        - { text: "Only a drying mistral from the Mediterranean", correct: false }
        - { text: "Cooling northerlies in the north, and warming easterlies near the Hungarian border", correct: true }
        - { text: "Atlantic westerlies that soak the whole country", correct: false }
        - { text: "No wind at all", correct: false }
      explanation: |
        **Cooling northerlies in the north, and warming easterlies near
        the Hungarian border.** Weinviertel feels the first; Burgenland
        the Pannonian second.

  - id: austria-vintage-swing-001
    type: mcq
    deck: Austria
    tags: [austria, climate]
    status: reviewed
    source_id: c23-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do year-to-year weather swings in Austria compare with more northerly European wine regions?
      choices:
        - { text: "Austria’s swings are far wilder than in Germany or Champagne", correct: false }
        - { text: "Austria’s year-to-year weather swings are smaller", correct: true }
        - { text: "Austria has no vintage variation at all", correct: false }
        - { text: "Only the west coast swings; the east never does", correct: false }
      explanation: |
        **Austria’s year-to-year weather swings are smaller.** Hail and
        frost still hit, but the inland east is steadier than cooler,
        more northerly neighbours.

  - id: austria-gv-lead-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape covers the most Austrian vineyard?
      choices:
        - { text: "Roter Veltliner", correct: false }
        - { text: "Grüner Veltliner", correct: true }
        - { text: "Welschriesling", correct: false }
        - { text: "Zweigelt", correct: false }
      explanation: |
        **Grüner Veltliner** — roughly a third of the national vineyard.
        **Roter Veltliner** is a different, much rarer white.

  - id: austria-gv-yield-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What are high-yield Austrian Grüner Veltliner wines typically like?
      choices:
        - { text: "Dense, tannic reds", correct: false }
        - { text: "Fresh but simple", correct: true }
        - { text: "Always botrytis-sweet", correct: false }
        - { text: "Heavy, oaky and low in acid", correct: false }
      explanation: |
        **Fresh but simple.** Pushed yields strip the pepper and
        concentration; the wine stays light and clean.

  - id: austria-gv-youth-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does careful, lower-yield Austrian Grüner Veltliner typically show in youth?
      choices:
        - { text: "Low acid, jammy red fruit, and no spice", correct: false }
        - { text: "Full body, concentration, high acidity, citrus or stone fruit, and a hint of white pepper", correct: true }
        - { text: "Only lychee and residual sugar", correct: false }
        - { text: "Deep colour and bramble, like Zweigelt", correct: false }
      explanation: |
        **Full body, concentration, high acidity, citrus or stone fruit,
        and a hint of white pepper.** That pepper is the Grüner tell,
        not Roter Veltliner.

  - id: austria-gv-age-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which extra notes can bottle-aged Austrian Grüner Veltliner take on?
      choices:
        - { text: "Tar and roses only", correct: false }
        - { text: "Honey and toast", correct: true }
        - { text: "Mature Grüner Veltliner never leaves primary lemon", correct: false }
        - { text: "Only new-oak coconut", correct: false }
      explanation: |
        **Honey and toast.** The best Danube bottles repay a cellar
        the way a serious Riesling does.

  - id: austria-gv-vessels-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In which vessels is Austrian Grüner Veltliner usually fermented and aged?
      choices:
        - { text: "Only new 100% barrique, by law", correct: false }
        - { text: "Mostly stainless steel, with old large oak casks common and some barrique ageing", correct: true }
        - { text: "Only chestnut amphorae", correct: false }
        - { text: "Oak is banned on Grüner Veltliner", correct: false }
      explanation: |
        **Mostly stainless steel, with old large oak casks common and
        some barrique ageing.** Steel keeps the pepper; old foudres
        are the Wachau/Kremstal habit; new barrique is the extra.

  - id: austria-welschriesling-rank-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After Grüner Veltliner, which white — not Riesling — covers the next-largest Austrian area?
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Welschriesling", correct: true }
        - { text: "Roter Veltliner", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        **Welschriesling** — not Riesling, and not related to it.
        Riesling is the quality third white, on far fewer hectares.

  - id: austria-welschriesling-dry-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is typical dry Austrian Welschriesling like?
      choices:
        - { text: "Oaky, tropical, and low in acid", correct: false }
        - { text: "Fresh and simple, with citrus, green apple and high acidity", correct: true }
        - { text: "Tannic and peppery, like Blaufränkisch", correct: false }
        - { text: "Always a TBA-level sweet wine", correct: false }
      explanation: |
        **Fresh and simple, with citrus, green apple and high acidity.**
        Dry bottles are the everyday white; the same grape also makes
        lake-side sweet wine.

  - id: austria-welschriesling-botrytis-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Around Neusiedlersee, Welschriesling is prized for which kind of dessert wine?
      choices:
        - { text: "Fortified red, like Port", correct: false }
        - { text: "Botrytised dessert wines", correct: true }
        - { text: "Only bone-dry Sekt", correct: false }
        - { text: "Orange wine from skins only", correct: false }
      explanation: |
        **Botrytised dessert wines.** Around Neusiedlersee the grape
        takes noble rot cleanly; dry Welschriesling stays the simple
        extra.

  - id: austria-riesling-rank-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: After Grüner and Welschriesling, which third white still matters on the Danube terraces?
      choices:
        - { text: "Grüner Veltliner", correct: false }
        - { text: "Riesling", correct: true }
        - { text: "Roter Veltliner", correct: false }
        - { text: "Zweigelt", correct: false }
      explanation: |
        **Riesling.** Third white by area, after Grüner Veltliner
        and Welschriesling. The Danube terraces are where it
        shines; it does not outrank Grüner on hectares or as
        Austria’s lead white.

  - id: austria-riesling-danube-001
    type: mcq
    deck: Austria
    tags: [austria, grapes, wachau]
    status: reviewed
    source_id: c23-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: From which Austrian regions do the finest Rieslings usually come?
      choices:
        - { text: "Weinviertel only", correct: false }
        - { text: "Wachau, Kamptal and Kremstal", correct: true }
        - { text: "Only the flats around Neusiedlersee", correct: false }
        - { text: "Weststeiermark only", correct: false }
      explanation: |
        **Wachau, Kamptal and Kremstal.** The dry Danube trio — not
        the sweet lake, and not Weinviertel’s Grüner-only DAC.

  - id: austria-riesling-style-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What style do Austrian Rieslings usually take?
      choices:
        - { text: "Off-dry and feather-light, like a Mosel Kabinett", correct: false }
        - { text: "Dry, medium to full-bodied, ripe peach fruit, and the best bottles can age", correct: true }
        - { text: "Always a botrytis dessert wine", correct: false }
        - { text: "Sparkling red only", correct: false }
      explanation: |
        **Dry, medium to full-bodied, ripe peach fruit, and the best
        bottles can age.** Austrian Riesling is a dry table wine, not
        a German residual-sugar bottle.

  - id: austria-other-whites-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides Grüner Veltliner, Welschriesling and Riesling, which three extra whites are commonly planted in Austria?
      choices:
        - { text: "Nebbiolo, Sangiovese and Corvina", correct: false }
        - { text: "Chardonnay, Müller-Thurgau and Sauvignon Blanc", correct: true }
        - { text: "Only Roter Veltliner, and nothing else", correct: false }
        - { text: "Zweigelt, Blaufränkisch and St Laurent", correct: false }
      explanation: |
        **Chardonnay, Müller-Thurgau and Sauvignon Blanc.** Pinot
        Blanc is another regular; the three named here are the usual
        extras on the list.

  - id: austria-sb-name-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Styria’s rising international white is which variety, not a Veltliner?
      choices:
        - { text: "Müller-Thurgau", correct: false }
        - { text: "Sauvignon Blanc", correct: true }
        - { text: "Roter Veltliner", correct: false }
        - { text: "Zweigelt", correct: false }
      explanation: |
        **Sauvignon Blanc.** The plantings that people talk about sit
        in the south, not on the Danube terraces.

  - id: austria-sb-styria-001
    type: mcq
    deck: Austria
    tags: [austria, steiermark]
    status: reviewed
    source_id: c23-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In which Austrian region has Sauvignon Blanc built its name?
      choices:
        - { text: "Wachau", correct: false }
        - { text: "Steiermark, in the south", correct: true }
        - { text: "Weinviertel only", correct: false }
        - { text: "The high western Alps", correct: false }
      explanation: |
        **Steiermark, in the south** — Südsteiermark in particular.
        Wachau’s story is Grüner Veltliner and Riesling.

  - id: austria-zweigelt-rank-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which black grape covers the most Austrian vineyard?
      choices:
        - { text: "Blaufränkisch", correct: false }
        - { text: "Zweigelt", correct: true }
        - { text: "St Laurent", correct: false }
        - { text: "Pinot Noir", correct: false }
      explanation: |
        **Zweigelt.** Most planted black, and second overall behind
        Grüner Veltliner. Blaufränkisch is the prestige red, not the
        hectare leader.

  - id: austria-zweigelt-parents-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Zweigelt is a crossing of which two Austrian black grapes?
      choices:
        - { text: "Grüner Veltliner and Riesling", correct: false }
        - { text: "Blaufränkisch and St Laurent", correct: true }
        - { text: "Pinot Noir and Gamay", correct: false }
        - { text: "Cabernet Sauvignon and Merlot", correct: false }
      explanation: |
        **Blaufränkisch and St Laurent.** Friedrich Zweigelt made the
        cross at Klosterneuburg in 1922.

  - id: austria-zweigelt-style-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Austrian black grape typically gives deep colour, soft tannins and bramble fruit?
      choices:
        - { text: "Blaufränkisch", correct: false }
        - { text: "Zweigelt", correct: true }
        - { text: "Grüner Veltliner", correct: false }
        - { text: "Welschriesling", correct: false }
      explanation: |
        **Zweigelt.** Deep, soft and brambly. Blaufränkisch is the
        other red — medium tannin, high acid, peppery sour cherry.

  - id: austria-bf-prestige-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Burgenland’s prestige red, more structured than Zweigelt, is which grape?
      choices:
        - { text: "Zweigelt", correct: false }
        - { text: "Blaufränkisch", correct: true }
        - { text: "Roter Veltliner", correct: false }
        - { text: "Welschriesling", correct: false }
      explanation: |
        **Blaufränkisch.** Zweigelt wins on hectares; Blaufränkisch
        wins on reputation, especially in Burgenland.

  - id: austria-bf-style-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is typical Austrian Blaufränkisch like in the glass?
      choices:
        - { text: "Deep colour, soft tannins and sweet bramble only", correct: false }
        - { text: "Medium tannin, high acidity, and a peppery sour-cherry flavour", correct: true }
        - { text: "A white grape with no tannin", correct: false }
        - { text: "Always a botrytis dessert wine", correct: false }
      explanation: |
        **Medium tannin, high acidity, and a peppery sour-cherry
        flavour.** Do not swap that line with Zweigelt’s softer
        bramble profile.

  - id: austria-st-laurent-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Austrian black grape is often likened to Pinot Noir, not to Zweigelt’s bramble?
      choices:
        - { text: "Zweigelt", correct: false }
        - { text: "St Laurent", correct: true }
        - { text: "Grüner Veltliner", correct: false }
        - { text: "Welschriesling", correct: false }
      explanation: |
        **St Laurent.** A local Pinot-shaped red — darker than many
        Burgundies, still in that cherry-and-savoury family.

  - id: austria-st-laurent-oak-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How common is oak on Austrian St Laurent?
      choices:
        - { text: "Oak is illegal on St Laurent", correct: false }
        - { text: "Oak is common", correct: true }
        - { text: "Only chestnut is allowed", correct: false }
        - { text: "The wine must stay in steel for ten years", correct: false }
      explanation: |
        **Oak is common.** Cellars treat St Laurent much as they
        treat Pinot Noir.

  - id: austria-red-blend-001
    type: mcq
    deck: Austria
    tags: [austria, grapes]
    status: reviewed
    source_id: c23-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which blending practice is now common among Austrian reds?
      choices:
        - { text: "Only Grüner Veltliner with Riesling", correct: false }
        - { text: "Local black grapes blended with Pinot Noir, Cabernet Sauvignon and Merlot", correct: true }
        - { text: "Blending any red is illegal", correct: false }
        - { text: "Only Welschriesling with Chardonnay", correct: false }
      explanation: |
        **Local black grapes blended with Pinot Noir, Cabernet
        Sauvignon and Merlot.** Zweigelt or Blaufränkisch stay in the
        mix; the internationals are the extra.

  - id: austria-pdo-states-001
    type: mcq
    deck: Austria
    tags: [austria]
    status: reviewed
    source_id: c23-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which four federal states produce Austria’s Qualitätswein and DAC wines?
      choices:
        - { text: "Tyrol, Salzburg, Vorarlberg and Carinthia", correct: false }
        - { text: "Niederösterreich, Burgenland, Steiermark and Wien", correct: true }
        - { text: "Only Wachau and the Mosel", correct: false }
        - { text: "Bavaria, Baden, Alsace and Tokaj", correct: false }
      explanation: |
        **Niederösterreich, Burgenland, Steiermark and Wien.** Those
        four Bundesländer are the protected-origin map. DAC is the
        modern PDO-style label inside that map.

  - id: austria-volume-states-001
    type: mcq
    deck: Austria
    tags: [austria]
    status: reviewed
    source_id: c23-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Austria’s volume comes mainly from which two eastern Bundesländer?
      choices:
        - { text: "Steiermark and Wien only", correct: false }
        - { text: "Niederösterreich and Burgenland", correct: true }
        - { text: "Tyrol and Vorarlberg", correct: false }
        - { text: "Only Wien", correct: false }
      explanation: |
        **Niederösterreich and Burgenland.** Steiermark and Wien
        matter for style; they are small on volume.

  - id: austria-noe-export-001
    type: mcq
    deck: Austria
    tags: [austria, niederosterreich]
    status: reviewed
    source_id: c23-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Austrian federal wine state leads production and exports?
      choices:
        - { text: "Wien", correct: false }
        - { text: "Niederösterreich", correct: true }
        - { text: "Steiermark", correct: false }
        - { text: "Tyrol", correct: false }
      explanation: |
        **Niederösterreich.** The large eastern state — Wachau,
        Kremstal, Kamptal and Weinviertel sit inside it. Weinviertel
        is the biggest single region; the state is bigger still.

  - id: austria-noe-sites-001
    type: mcq
    deck: Austria
    tags: [austria, niederosterreich]
    status: reviewed
    source_id: c23-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Niederösterreich fruit is mostly grown along which river, and north toward which neighbour?
      choices:
        - { text: "Only on alpine ice above Innsbruck", correct: false }
        - { text: "Along the Danube, and further north toward the Slovak border", correct: true }
        - { text: "Only around Neusiedlersee", correct: false }
        - { text: "Only in Südsteiermark", correct: false }
      explanation: |
        **Along the Danube, and further north toward the Slovak
        border.** Danube belt first; Weinviertel is the northern
        bulk.

  - id: austria-wachau-state-001
    type: mcq
    deck: Austria
    tags: [austria, wachau]
    status: reviewed
    source_id: c23-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In which Austrian federal state does Wachau sit?
      choices:
        - { text: "Burgenland", correct: false }
        - { text: "Niederösterreich", correct: true }
        - { text: "Steiermark", correct: false }
        - { text: "Wien", correct: false }
      explanation: |
        **Niederösterreich.** The gorge between Melk and Krems, on
        the Danube — not the Hungarian-border lake country.

  - id: austria-wachau-dry-001
    type: mcq
    deck: Austria
    tags: [austria, wachau]
    status: reviewed
    source_id: c23-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is Wachau best known for?
      choices:
        - { text: "Botrytis sweet wines, like Neusiedlersee", correct: false }
        - { text: "High-quality dry wines from Riesling or Grüner Veltliner", correct: true }
        - { text: "Only Blaufränkisch reds", correct: false }
        - { text: "Fortified Muscat", correct: false }
      explanation: |
        **High-quality dry wines from Riesling or Grüner Veltliner.**
        The Danube dry-white story; the sweet lake is Burgenland.

  - id: austria-noe-eight-001
    type: mcq
    deck: Austria
    tags: [austria, niederosterreich]
    status: reviewed
    source_id: c23-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Wachau, Kremstal, Kamptal and Weinviertel sit among how many Niederösterreich sub-regions?
      choices:
        - { text: "Two, like Bordeaux banks", correct: false }
        - { text: "Eight", correct: true }
        - { text: "One only", correct: false }
        - { text: "A hundred climats", correct: false }
      explanation: |
        **Eight** — Wachau, Kremstal, Kamptal, Traisental, Wagram,
