        - { text: "No place name is allowed", correct: false }
      explanation: |
        **A Bundesland or a Gebiet/DAC.** A bottle may wear
        Niederösterreich, Burgenland, Steiermark or Wien, or a
        smaller Gebiet that is now a DAC, such as Wachau or
        Weinviertel.

  - id: austria-pdo-two-001
    type: mcq
    deck: Austria
    tags: [austria, law, dac]
    status: reviewed
    source_id: c23-0059
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which pair of Austrian labels are both PDO?
      choices:
        - { text: "Landwein and Wein", correct: false }
        - { text: "Qualitätswein and DAC", correct: true }
        - { text: "Steinfeder and Smaragd", correct: false }
        - { text: "Grand Cru and Premier Cru", correct: false }
      explanation: |
        **Qualitätswein and DAC.** DAC is regionally typical
        Qualitätswein, not a separate EU category. Landwein is
        PGI; Wein carries no origin claim.

  - id: austria-qw-scope-001
    type: mcq
    deck: Austria
    tags: [austria, law]
    status: reviewed
    source_id: c23-0060
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: May Austrian Qualitätswein use a Bundesland name, or only a DAC Gebiet?
      choices:
        - { text: "Only a DAC Gebiet, never a Bundesland", correct: false }
        - { text: "A Bundesland name or a Gebiet name", correct: true }
        - { text: "Only the word Smaragd", correct: false }
        - { text: "Only a German Anbaugebiet", correct: false }
      explanation: |
        **A Bundesland name or a Gebiet name.** The wine may
        say Niederösterreich or Weinviertel. DAC marks typicity
        for a Gebiet; it does not ban a state label on
        Qualitätswein.

  - id: austria-qw-grape-list-001
    type: mcq
    deck: Austria
    tags: [austria, law, grapes]
    status: reviewed
    source_id: c23-0061
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: May Austrian Qualitätswein be made from any Vitis vinifera?
      choices:
        - { text: "Yes — any vinifera grown anywhere", correct: false }
        - { text: "No — only grapes on a closed official list", correct: true }
        - { text: "Only Grüner Veltliner is legal", correct: false }
        - { text: "Only hybrid grapes are allowed", correct: false }
      explanation: |
        **No — only grapes on a closed official list.** The
        roster is set in Austrian wine law. It is not “any
        vine that happens to be vinifera.”

  - id: austria-qw-any-style-001
    type: mcq
    deck: Austria
    tags: [austria, law]
    status: reviewed
    source_id: c23-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which constraint does Austrian Qualitätswein place on colour or sweetness?
      choices:
        - { text: "It must be dry white Grüner Veltliner", correct: false }
        - { text: "None — still or sparkling, dry or sweet, any colour", correct: true }
        - { text: "It must be a botrytis dessert wine", correct: false }
        - { text: "It must be red Zweigelt", correct: false }
      explanation: |
        **None — still or sparkling, dry or sweet, any colour.**
        Qualitätswein is a quality class, not a style recipe.
        DAC rules then lock grapes and style for a named region.

  - id: austria-qw-pradikat-001
    type: mcq
    deck: Austria
    tags: [austria, law]
    status: reviewed
    source_id: c23-0063
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: May Austrian Qualitätswein also carry a Prädikat mention?
      choices:
        - { text: "No — only the Vinea Wachau words Steinfeder and Smaragd", correct: false }
        - { text: "Yes — a Prädikat level", correct: true }
        - { text: "Only Grand Cru and Premier Cru", correct: false }
        - { text: "Only a mandatory Sekt dosage scale", correct: false }
      explanation: |
        **Yes — a Prädikat level.** Kabinett through TBA and
        Eiswein can appear on Austrian Qualitätswein. Steinfeder
        and Smaragd remain a Wachau style code, not that
        national scale.

  - id: austria-pradikat-extras-001
    type: mcq
    deck: Austria
    tags: [austria, law]
    status: reviewed
    source_id: c23-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides the German Prädikat rungs, Austria adds which two extra names?
      choices:
        - { text: "Steinfeder and Smaragd only", correct: false }
        - { text: "Ausbruch and Strohwein (Schilfwein)", correct: true }
        - { text: "Klassik and Reserve only", correct: false }
        - { text: "Grand Cru and Premier Cru", correct: false }
      explanation: |
        **Ausbruch and Strohwein (Schilfwein).** The shared rungs
        with Germany stay Kabinett, Spätlese, Auslese, Beerenauslese,
        Eiswein and Trockenbeerenauslese.

  - id: austria-ausbruch-001
    type: mcq
    deck: Austria
    tags: [austria, law]
    status: reviewed
    source_id: c23-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does Ausbruch sit on Austria’s Prädikat ladder?
      choices:
        - { text: "Below Kabinett", correct: false }
        - { text: "Between Beerenauslese and Trockenbeerenauslese", correct: true }
        - { text: "It replaces Eiswein", correct: false }
        - { text: "It is a Wachau alcohol band, like Smaragd", correct: false }
      explanation: |
        **Between Beerenauslese and Trockenbeerenauslese.** Rust on
        the west shore of Neusiedlersee is the named historic home
        (Ruster Ausbruch).

  - id: austria-strohwein-001
    type: mcq
    deck: Austria
    tags: [austria, law]
    status: reviewed
    source_id: c23-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are the grapes for Strohwein or Schilfwein concentrated?
      choices:
        - { text: "They are frozen on the vine, like Eiswein", correct: false }
        - { text: "Bunches are dried on straw or reed beds", correct: true }
        - { text: "They must be fortified like Port", correct: false }
        - { text: "They must stay on Wachau terraces under snow", correct: false }
      explanation: |
        **Bunches are dried on straw or reed beds.** Water leaves
        the berries; sugar concentrates. That is not noble rot and
        not a freeze.

  - id: austria-dac-now-001
    type: mcq
    deck: Austria
    tags: [austria, dac]
    status: reviewed
    source_id: c23-0066
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Do Austria’s named wine Gebiete still sit outside the DAC system?
      choices:
        - { text: "Yes — the Gebiete remain plain Qualitätswein only", correct: false }
        - { text: "No — the Gebiete are DACs now", correct: true }
        - { text: "DAC exists only in Germany", correct: false }
        - { text: "Only Wien is a DAC", correct: false }
      explanation: |
        **No — the Gebiete are DACs now.** The old leftover
        Qualitätswein-only Gebiete have joined. Wachau has been
        a DAC since the 2020 vintage. Kremstal is the next DAC
        on the Danube; Kamptal sits north of Kremstal.

  - id: austria-dac-agree-001
    type: mcq
    deck: Austria
    tags: [austria, dac]
    status: reviewed
    source_id: c23-0067
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A region becomes a DAC when its growers agree on what?
      choices:
        - { text: "Only a minimum bottle price", correct: false }
        - { text: "Grape varieties, a wine style, and accompanying rules", correct: true }
        - { text: "A ban on all white grapes", correct: false }
        - { text: "Copying German Anbaugebiet borders", correct: false }
      explanation: |
        **Grape varieties, a wine style, and accompanying rules.**
        That local agreement is then written into the DAC decree.
        Bottles that miss it drop the Gebiet name.

  - id: austria-non-dac-state-001
    type: mcq
    deck: Austria
    tags: [austria, dac, law]
    status: reviewed
    source_id: c23-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: If a Qualitätswein misses its region’s DAC rules, which origin name may it use?
      choices:
        - { text: "The DAC Gebiet name anyway", correct: false }
        - { text: "Only the relevant federal-state name", correct: true }
        - { text: "Only a German Anbaugebiet name", correct: false }
        - { text: "No origin word at all, by law", correct: false }
      explanation: |
        **Only the relevant federal-state name.** A Weinviertel
        Riesling cannot be Weinviertel DAC (Grüner only), so it is
        Niederösterreich. A non-DAC Burgenland red is Burgenland,
        not Mittelburgenland or Neusiedlersee.
