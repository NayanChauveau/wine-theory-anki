# yaml-language-server: $schema=../schema/cards.schema.json
# source: C24 (import/inbox/c24-tokaj.yaml)
# deck: Hungary::Tokaj

cards:
  - id: tokaj-location-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where do Tokaj’s vineyards sit in Hungary?
      choices:
        - { text: "On the Great Plain only, far from any border", correct: false }
        - { text: "In the Carpathian foothills of the far north-east, near Slovakia", correct: true }
        - { text: "On the Lake Balaton shore", correct: false }
        - { text: "In Villány, on the Croatian border", correct: false }
      explanation: |
        **In the Carpathian foothills of the far north-east, near
        Slovakia.** The town of Tokaj sits where the Bodrog meets
        the Tisza.

  - id: tokaj-climate-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, climate]
    status: reviewed
    source_id: c24-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which climate label fits Tokaj?
      choices:
        - { text: "Cool maritime, like England", correct: false }
        - { text: "Moderate continental", correct: true }
        - { text: "Hot Mediterranean", correct: false }
        - { text: "Equatorial rainforest", correct: false }
      explanation: |
        **Moderate continental.** Warm summers, cold winters; autumn
        mist from the rivers is the botrytis extra.

  - id: tokaj-best-sites-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which landform and aspect usually carry Tokaj’s finest parcels?
      choices:
        - { text: "On a flat, frost-pocket valley floor only", correct: false }
        - { text: "On hillside slopes with a southerly aspect", correct: true }
        - { text: "On north-facing alpine cliffs", correct: false }
        - { text: "In indoor glasshouses", correct: false }
      explanation: |
        **On hillside slopes with a southerly aspect.** Height and
        sun finish Furmint; the rivers supply the mist.

  - id: tokaj-botrytis-rivers-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, climate]
    status: reviewed
    source_id: c24-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What supplies the autumn humidity Tokaj needs for noble rot?
      choices:
        - { text: "The Atlantic Gulf Stream only", correct: false }
        - { text: "The Bodrog and the Tisza, with their tributaries", correct: true }
        - { text: "Irrigation sprinklers on a desert", correct: false }
        - { text: "A legal ban on dry weather", correct: false }
      explanation: |
        **The Bodrog and the Tisza, with their tributaries.** Autumn
        morning mist, then drier afternoons, lets Botrytis cinerea
        shrivel berries instead of wrecking them.

  - id: tokaj-three-grapes-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Tokaji’s legal core is which three white grapes?
      choices:
        - { text: "Cabernet Sauvignon, Merlot and Syrah", correct: false }
        - { text: "Furmint, Hárslevelű and Sárgamuskotály", correct: true }
        - { text: "Riesling, Silvaner and Müller-Thurgau", correct: false }
        - { text: "Kadarka only", correct: false }
      explanation: |
        **Furmint, Hárslevelű and Sárgamuskotály.** Furmint leads;
        the other two add perfume.

  - id: tokaj-furmint-planted-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which variety covers the most Tokaj hectares?
      choices:
        - { text: "Hárslevelű", correct: false }
        - { text: "Furmint", correct: true }
        - { text: "Sárgamuskotály", correct: false }
        - { text: "Kadarka", correct: false }
      explanation: |
        **Furmint.** It is the workhorse for both dry wine and Aszú.

  - id: tokaj-furmint-profile-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is typical Tokaji Furmint like from youth into age?
      choices:
        - { text: "Low acid, jammy and pale", correct: false }
        - { text: "Concentrated and high-acid, apple when young, nuts and honey with age", correct: true }
        - { text: "A black grape only", correct: false }
        - { text: "Always sparkling Muscat", correct: false }
      explanation: |
        **Concentrated and high-acid, apple when young, nuts and
        honey with age.** The acid is why sweet Aszú stays fresh.

  - id: tokaj-aszu-grape-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes, aszu]
    status: reviewed
    source_id: c24-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape usually leads a Tokaji Aszú?
      choices:
        - { text: "Pinot Gris", correct: false }
        - { text: "Furmint", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Kadarka", correct: false }
      explanation: |
        **Furmint.** Hárslevelű and Sárgamuskotály may join; Furmint
        is the Aszú core.

  - id: tokaj-furmint-botrytis-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes, aszu]
    status: reviewed
    source_id: c24-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What two ripening traits make Furmint the classic Aszú grape?
      choices:
        - { text: "Dry Furmint is illegal in Tokaj", correct: false }
        - { text: "It ripens late and is prone to botrytis", correct: true }
        - { text: "It never ripens at all", correct: false }
        - { text: "It has no acidity", correct: false }
      explanation: |
        **It ripens late and is prone to botrytis.** Dry Furmint
        still exists and has grown in importance; Aszú is the older
        fame.

  - id: tokaj-harslevelu-perfume-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In a Furmint-led blend, Hárslevelű is valued for which quality?
      choices:
        - { text: "Deep red colour", correct: false }
        - { text: "Perfume", correct: true }
        - { text: "Sparkling gas", correct: false }
        - { text: "Residual salt", correct: false }
      explanation: |
        **Perfume.** Linden-blossom is the usual Hárslevelű register.

  - id: tokaj-harslevelu-late-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does Hárslevelű sit on Tokaj’s ripening calendar?
      choices:
        - { text: "Early, like Chasselas", correct: false }
        - { text: "Late-ripening", correct: true }
        - { text: "It is picked in June only", correct: false }
        - { text: "It never ripens", correct: false }
      explanation: |
        **Late-ripening.** That hang-time is why it can take noble
        rot with Furmint.

  - id: tokaj-sargamuskotaly-synonym-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Sárgamuskotály is the Hungarian name for which grape?
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Muscat Blanc à Petits Grains", correct: true }
        - { text: "Riesling", correct: false }
        - { text: "Palomino", correct: false }
      explanation: |
        **Muscat Blanc à Petits Grains.** Same grape, local name.

  - id: tokaj-sargamuskotaly-blend-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do Tokaj blends keep a little Sárgamuskotály?
      choices:
        - { text: "For deep colour and tannin", correct: false }
        - { text: "For its aromatic lift", correct: true }
        - { text: "Law requires 80 percent of the blend", correct: false }
        - { text: "To make a red wine", correct: false }
      explanation: |
        **For its aromatic lift.** A Muscat supporting grape, not the lead
        grape.

  - id: tokaj-styles-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which two style families does Tokaji cover?
      choices:
        - { text: "Only sparkling red", correct: false }
        - { text: "Dry wines and sweet wines", correct: true }
        - { text: "Only fortified Muscat", correct: false }
        - { text: "Only ice wine", correct: false }
      explanation: |
        **Dry wines and sweet wines.** Dry Furmint is a real Tokaji
        style, not a side note to Aszú.

  - id: tokaj-bottle-size-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do finished Tokaji bottle sizes usually split by style?
      choices:
        - { text: "Every wine must be 18.7 cl", correct: false }
        - { text: "Sweet wines in 50 cl; dry wines in 75 cl", correct: true }
        - { text: "Sweet wines only in magnum", correct: false }
        - { text: "Dry wines only in 37.5 cl", correct: false }
      explanation: |
        **Sweet wines in 50 cl; dry wines in 75 cl.** Aszú and
        Eszencia are the classic 50 cl bottles.

  - id: tokaj-vintage-styles-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: In an ordinary Tokaj vintage, what does a producer often bottle?
      choices:
        - { text: "Only Eszencia", correct: false }
        - { text: "Several styles, depending on how much noble rot set", correct: true }
        - { text: "Only red wine", correct: false }
        - { text: "Nothing until a perfect year", correct: false }
      explanation: |
        **Several styles, depending on how much noble rot set.**
        Dry Furmint, Szamorodni and Aszú can come from one harvest.

  - id: tokaj-harvest-sort-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do Tokaj growers sort fruit so more than one style is possible?
      choices:
        - { text: "They pick everything in one pass into one tank", correct: false }
        - { text: "They split the harvest into three lots by how much noble rot is on the grapes", correct: true }
        - { text: "They buy only imported must", correct: false }
        - { text: "They freeze the entire crop", correct: false }
      explanation: |
        **They split the harvest into three lots by how much noble
        rot is on the grapes.** Healthy fruit, part-rotted bunches,
        and individual aszú berries.

  - id: tokaj-aszu-berries-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, aszu]
    status: reviewed
    source_id: c24-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does aszú name in Tokaj?
      choices:
        - { text: "A dry sparkling wine", correct: false }
        - { text: "Nobly rotten berries", correct: true }
        - { text: "A black grape", correct: false }
        - { text: "A river", correct: false }
      explanation: |
        **Nobly rotten berries.** Aszú the wine is built from those
        individually picked berries.

  - id: tokaj-aszu-picking-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, aszu]
    status: reviewed
    source_id: c24-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are aszú berries taken off the vine in Tokaj?
      choices:
        - { text: "Machine harvest at night only", correct: false }
        - { text: "Pickers walk the rows several times and cut berries one by one; the rest of the crop is picked separately", correct: true }
        - { text: "One pass of whole bunches, never sorted", correct: false }
        - { text: "The fruit is left until spring", correct: false }
      explanation: |
        **Pickers walk the rows several times and cut berries one by
        one; the rest of the crop is picked separately.** That
        remainder can become dry wine, a base wine, or Szamorodni.

  - id: tokaj-szamorodni-meaning-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, szamorodni]
    status: reviewed
    source_id: c24-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Szamorodni’s Polish-origin name is usually rendered in English as what?
      choices:
        - { text: "Twice fermented", correct: false }
        - { text: "As it comes", correct: true }
        - { text: "Free-run only", correct: false }
        - { text: "Fortified", correct: false }
      explanation: |
        **As it comes.** Whole bunches, not berry-by-berry aszú
        selection.

  - id: tokaj-szamorodni-fruit-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, szamorodni]
    status: reviewed
    source_id: c24-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What fruit goes into Tokaji Szamorodni?
      choices:
        - { text: "Only healthy, fully dry grapes", correct: false }
        - { text: "Whole bunches that are only partly touched by noble rot", correct: true }
        - { text: "Only hand-picked aszú berries", correct: false }
        - { text: "Only red grapes", correct: false }
      explanation: |
        **Whole bunches that are only partly touched by noble rot.**
        The wine may finish dry or sweet.

  - id: tokaj-dry-role-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why have dry Tokaji wines with no botrytis become more useful to producers?
      choices:
        - { text: "Aszú is now illegal", correct: false }
        - { text: "They give a wine to sell when noble rot is scarce", correct: true }
        - { text: "Dry wine is illegal in Tokaj", correct: false }
        - { text: "They replace Eszencia by law", correct: false }
      explanation: |
        **They give a wine to sell when noble rot is scarce.** Dry
        Furmint is also a style in its own right, not only a fallback.

  - id: tokaj-dry-range-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How wide is the dry Tokaji range?
      choices:
        - { text: "Only sparkling", correct: false }
        - { text: "From simple, unoaked, early bottles to richer, age-worthy wines often fermented and raised in new oak", correct: true }
        - { text: "Only sweet", correct: false }
        - { text: "Only fortified", correct: false }
      explanation: |
        **From simple, unoaked, early bottles to richer, age-worthy
        wines often fermented and raised in new oak.** Steel or
        barrique, depending on the house.

  - id: tokaj-dry-furmint-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A dry Tokaji labelled as a varietal white is usually which grape?
      choices:
        - { text: "Kadarka", correct: false }
        - { text: "Furmint", correct: true }
        - { text: "Pinot Noir", correct: false }
        - { text: "Trebbiano", correct: false }
      explanation: |
        **Furmint.** Dry Furmint is a standard Tokaji bottling, not
        a rumour.

  - id: tokaj-szaraz-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does száraz mean on a Tokaji label?
      choices:
        - { text: "Sweet", correct: false }
        - { text: "Dry", correct: true }
        - { text: "Sparkling", correct: false }
        - { text: "Fortified", correct: false }
      explanation: |
        **Dry.** Szamorodni száraz is the dry reading.

  - id: tokaj-edes-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does édes mean on a Tokaji label?
      choices:
        - { text: "Dry", correct: false }
        - { text: "Sweet", correct: true }
        - { text: "Rosé", correct: false }
        - { text: "Sparkling", correct: false }
      explanation: |
        **Sweet.** Szamorodni édes is the sweet reading.

  - id: tokaj-dry-szamorodni-rot-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, szamorodni]
    status: reviewed
    source_id: c24-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What extra character does a dry Szamorodni still show?
      choices:
        - { text: "Only green-apple fruit and no rot", correct: false }
        - { text: "Noble-rot notes", correct: true }
        - { text: "Red-wine tannin", correct: false }
        - { text: "Sparkling foam", correct: false }
      explanation: |
        **Noble-rot notes.** The bunches were partly aszú even if
        the wine ferments dry.

  - id: tokaj-szamorodni-ageing-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, szamorodni]
    status: reviewed
    source_id: c24-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the legal ageing bar for Tokaji Szamorodni?
      choices:
        - { text: "Six weeks in steel only", correct: false }
        - { text: "At least one year in cask, and two years old before release", correct: true }
        - { text: "Ten years in bottle, no cask", correct: false }
        - { text: "No wait at all", correct: false }
      explanation: |
        **At least one year in cask, and two years old before
        release.** Wood time, then a second year before it may leave.

  - id: tokaj-szamorodni-flor-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, szamorodni]
    status: reviewed
    source_id: c24-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why are dry Szamorodni casks often left not quite full?
      choices:
        - { text: "To speed boiling", correct: false }
        - { text: "So a flor film can grow on the wine", correct: true }
        - { text: "Ullage is illegal in Tokaj", correct: false }
        - { text: "To force malolactic overnight", correct: false }
      explanation: |
        **So a flor film can grow on the wine.** That film is the
        dry-Szamorodni signature; sweet Szamorodni is not the flor
        wine.

  - id: tokaj-szamorodni-fino-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, szamorodni]
    status: reviewed
    source_id: c24-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which famous wine is dry Szamorodni often likened to?
      choices:
        - { text: "Vintage Port", correct: false }
        - { text: "Fino Sherry", correct: true }
        - { text: "Red Burgundy", correct: false }
        - { text: "Champagne", correct: false }
      explanation: |
        **Fino Sherry.** Both sit under a flor film; Szamorodni is
        not fortified.

  - id: tokaj-flor-which-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, szamorodni]
    status: reviewed
    source_id: c24-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: A flor veil in Tokaj belongs to which style, not Aszú?
      choices:
        - { text: "Aszú", correct: false }
        - { text: "Dry Szamorodni", correct: true }
        - { text: "Eszencia", correct: false }
        - { text: "Late Harvest only", correct: false }
      explanation: |
        **Dry Szamorodni.** Sweet Szamorodni, Aszú and Eszencia are
        not flor wines.

  - id: tokaj-sweet-oxidative-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, aszu]
    status: reviewed
    source_id: c24-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: If a sweet Tokaji is raised without flor, what character can it pick up?
      choices:
        - { text: "Sparkling foam", correct: false }
        - { text: "An oxidative note", correct: true }
        - { text: "Red colour", correct: false }
        - { text: "Zero sugar", correct: false }
      explanation: |
        **An oxidative note.** No flor veil, plus ullage, lets air
        mark the wine.

  - id: tokaj-fill-casks-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, aszu]
    status: reviewed
    source_id: c24-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do many cellars now treat sweet Tokaji casks to keep oxidation down?
      choices:
        - { text: "They leave a large ullage on purpose", correct: false }
        - { text: "They fill the casks", correct: true }
        - { text: "They boil the wine", correct: false }
        - { text: "They ban oak", correct: false }
      explanation: |
        **They fill the casks.** A full barrel is the modern, fresher
        sweet-Tokaji habit.

  - id: tokaj-aszu-method-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, aszu]
    status: reviewed
    source_id: c24-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does Tokaji Aszú begin in the cellar?
      choices:
        - { text: "Only free-run aszú juice, never a base wine", correct: false }
        - { text: "A base wine from healthy grapes, then aszú berries macerated in that wine before, during or after the ferment", correct: true }
        - { text: "The grapes are boiled", correct: false }
        - { text: "Red grapes are carbonic-macerated", correct: false }
      explanation: |
        **A base wine from healthy grapes, then aszú berries
        macerated in that wine before, during or after the ferment.**
        The mix is pressed and then raised in oak. Eszencia is the
        free-run aszú juice, not this soak.

  - id: tokaj-aszu-maceration-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, aszu]
    status: reviewed
    source_id: c24-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How long do aszú berries usually soak in the Tokaji base wine?
      choices:
        - { text: "Twelve months", correct: false }
