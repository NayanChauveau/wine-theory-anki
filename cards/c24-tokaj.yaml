cards:
  - id: tokaj-location-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where is Hungary’s Tokaj wine region located?"
      choices:
        - { text: "In western Hungary beside Lake Balaton", correct: false }
        - { text: "In the north-east, on the southern foothills of the Zemplén Mountains", correct: true }
        - { text: "In southern Hungary around Villány", correct: false }
        - { text: "In central Hungary on the Great Plain", correct: false }
      explanation: |
        The region lies near Slovakia, where the Bodrog meets the Tisza. Its vineyards occupy protected slopes above the river plains.
    fr:
      question: "Où se situe la région viticole hongroise de Tokaj ?"
      choices:
        - { text: "Dans l’ouest de la Hongrie, près du lac Balaton", correct: false }
        - { text: "Dans le nord-est, sur les contreforts méridionaux des monts Zemplén", correct: true }
        - { text: "Dans le sud de la Hongrie, autour de Villány", correct: false }
        - { text: "Dans le centre de la Hongrie, sur la Grande Plaine", correct: false }
      explanation: |
        La région se trouve près de la Slovaquie, au confluent de la Bodrog et de la Tisza. Les vignes occupent des coteaux protégés au-dessus des plaines fluviales.

  - id: tokaj-climate-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, climate]
    status: reviewed
    source_id: c24-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climatic pattern characterises Tokaj?"
      choices:
        - { text: "Cool maritime, with mild winters and rain throughout the year", correct: false }
        - { text: "Continental, with hot dry summers, cold winters and humid autumn mornings", correct: true }
        - { text: "Mediterranean, with mild wet winters and hot dry summers", correct: false }
        - { text: "Continental, with cool wet summers and uniformly dry autumns", correct: false }
      explanation: |
        Summer warmth ripens the grapes, while cold winters reflect the inland location. Autumn humidity from the rivers can initiate noble rot.
    fr:
      question: "Quel régime climatique caractérise Tokaj ?"
      choices:
        - { text: "Maritime frais, avec des hivers doux et des pluies réparties sur l’année", correct: false }
        - { text: "Continental, avec des étés chauds et secs, des hivers froids et des matinées automnales humides", correct: true }
        - { text: "Méditerranéen, avec des hivers doux et humides et des étés chauds et secs", correct: false }
        - { text: "Continental, avec des étés frais et humides et des automnes uniformément secs", correct: false }
      explanation: |
        La chaleur estivale assure la maturité des raisins, tandis que les hivers froids traduisent la situation continentale. L’humidité automnale des rivières peut déclencher la pourriture noble.

  - id: tokaj-best-sites-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard setting is best suited to high-quality grapes in Tokaj?"
      choices:
        - { text: "Low-lying north-facing land beside the rivers", correct: false }
        - { text: "South-, south-east- or south-west-facing slopes in the Zemplén foothills", correct: true }
        - { text: "Flat west-facing land on the Great Plain", correct: false }
        - { text: "High north-facing slopes above 600 metres", correct: false }
      explanation: |
        Sunny aspects improve ripening, while elevation and air movement reduce frost and excessive humidity compared with the valley floor.
    fr:
      question: "Quelle implantation du vignoble convient le mieux à la production de raisins de qualité à Tokaj ?"
      choices:
        - { text: "Des terrains bas exposés au nord près des rivières", correct: false }
        - { text: "Des coteaux exposés au sud, au sud-est ou au sud-ouest sur les contreforts du Zemplén", correct: true }
        - { text: "Des terrains plats exposés à l’ouest sur la Grande Plaine", correct: false }
        - { text: "De hauts coteaux exposés au nord au-dessus de 600 mètres", correct: false }
      explanation: |
        Les expositions ensoleillées favorisent la maturité, tandis que l’altitude et la circulation de l’air réduisent le gel et l’excès d’humidité par rapport au fond de vallée.

  - id: tokaj-botrytis-rivers-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, climate]
    status: reviewed
    source_id: c24-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which waters are chiefly responsible for the autumn humidity that favours noble rot in Tokaj?"
      choices:
        - { text: "Lake Balaton and its northern springs", correct: false }
        - { text: "The Bodrog and Tisza rivers and their surrounding wetlands", correct: true }
        - { text: "The Danube and Lake Fertő", correct: false }
        - { text: "The Dráva and its Alpine tributaries", correct: false }
      explanation: |
        Mist and dew provide moisture for Botrytis infection. Subsequent sunshine dries the berries and encourages shrivelling rather than destructive grey rot.
    fr:
      question: "Quelles eaux sont principalement responsables de l’humidité automnale qui favorise la pourriture noble à Tokaj ?"
      choices:
        - { text: "Le lac Balaton et ses sources septentrionales", correct: false }
        - { text: "Les rivières Bodrog et Tisza ainsi que les zones humides environnantes", correct: true }
        - { text: "Le Danube et le lac de Neusiedl", correct: false }
        - { text: "La Dráva et ses affluents alpins", correct: false }
      explanation: |
        Les brumes et la rosée apportent l’humidité nécessaire à l’infection par le Botrytis. Le soleil qui suit sèche les baies et favorise leur passerillage plutôt qu’une pourriture grise destructrice.

  - id: tokaj-three-grapes-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which three varieties dominate Tokaj’s vineyards?"
      choices:
        - { text: "Olaszrizling, Juhfark and Kékfrankos", correct: false }
        - { text: "Furmint, Hárslevelű and Sárgamuskotály", correct: true }
        - { text: "Chardonnay, Riesling and Sauvignon Blanc", correct: false }
        - { text: "Kövérszőlő, Kabar and Zéta", correct: false }
      explanation: |
        These are the three principal grapes, led by Furmint. Kövérszőlő, Kabar and Zéta are also permitted but occupy much smaller areas.
    fr:
      question: "Quels trois cépages dominent le vignoble de Tokaj ?"
      choices:
        - { text: "Olaszrizling, Juhfark et Kékfrankos", correct: false }
        - { text: "Furmint, Hárslevelű et Sárgamuskotály", correct: true }
        - { text: "Chardonnay, Riesling et Sauvignon Blanc", correct: false }
        - { text: "Kövérszőlő, Kabar et Zéta", correct: false }
      explanation: |
        Ce sont les trois cépages principaux, avec le Furmint en tête. Kövérszőlő, Kabar et Zéta sont également autorisés, mais occupent des surfaces bien plus faibles.

  - id: tokaj-furmint-planted-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape has the largest planted area in Tokaj?"
      choices:
        - { text: "Hárslevelű", correct: false }
        - { text: "Furmint", correct: true }
        - { text: "Sárgamuskotály", correct: false }
        - { text: "Zéta", correct: false }
      explanation: |
        It accounts for about three-fifths of the region’s vines and is central to both dry wines and botrytised sweet styles.
    fr:
      question: "Quel cépage occupe la plus grande surface à Tokaj ?"
      choices:
        - { text: "Hárslevelű", correct: false }
        - { text: "Furmint", correct: true }
        - { text: "Sárgamuskotály", correct: false }
        - { text: "Zéta", correct: false }
      explanation: |
        Il représente environ trois cinquièmes du vignoble régional et joue un rôle central dans les vins secs comme dans les liquoreux botrytisés.

  - id: tokaj-furmint-profile-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best describes high-quality dry Furmint from Tokaj?"
      choices:
        - { text: "Low acidity, soft body and ripe tropical fruit", correct: false }
        - { text: "High acidity, apple or pear fruit and strong ageing potential", correct: true }
        - { text: "Moderate acidity, floral aromas and rapid oxidative development", correct: false }
        - { text: "High tannin, dark fruit and a peppery finish", correct: false }
      explanation: |
        Furmint is not highly aromatic, but its marked acidity and concentration support complex honeyed and nutty development in bottle.
    fr:
      question: "Quel profil décrit le mieux un Furmint sec de grande qualité de Tokaj ?"
      choices:
        - { text: "Acidité faible, corps souple et fruits tropicaux mûrs", correct: false }
        - { text: "Acidité élevée, pomme ou poire et fort potentiel de garde", correct: true }
        - { text: "Acidité moyenne, arômes floraux et évolution oxydative rapide", correct: false }
        - { text: "Tanins élevés, fruits noirs et finale poivrée", correct: false }
      explanation: |
        Le Furmint n’est pas très aromatique, mais son acidité marquée et sa concentration favorisent en bouteille une évolution complexe vers le miel et les fruits à coque.

  - id: tokaj-aszu-grape-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes, aszu]
    status: reviewed
    source_id: c24-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape most commonly forms the backbone of Tokaji Aszú?"
      choices:
        - { text: "Hárslevelű", correct: false }
        - { text: "Furmint", correct: true }
        - { text: "Sárgamuskotály", correct: false }
        - { text: "Kövérszőlő", correct: false }
      explanation: |
        Its high acidity, thick skins and strong capacity to form sound aszú berries make it especially valuable. Other permitted varieties may contribute to the blend.
    fr:
      question: "Quel cépage constitue le plus souvent l’ossature du Tokaji Aszú ?"
      choices:
        - { text: "Hárslevelű", correct: false }
        - { text: "Furmint", correct: true }
        - { text: "Sárgamuskotály", correct: false }
        - { text: "Kövérszőlő", correct: false }
      explanation: |
        Son acidité élevée, sa peau épaisse et sa capacité à former de belles baies aszú le rendent particulièrement précieux. D’autres cépages autorisés peuvent compléter l’assemblage.

  - id: tokaj-furmint-botrytis-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes, aszu]
    status: reviewed
    source_id: c24-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of traits makes Furmint well suited to Tokaji Aszú production?"
      choices:
        - { text: "Early ripening and resistance to Botrytis", correct: false }
        - { text: "Late ripening and susceptibility to Botrytis", correct: true }
        - { text: "Early ripening and naturally low acidity", correct: false }
        - { text: "Late ripening and very thick, rot-resistant bunches", correct: false }
      explanation: |
        Long autumn hang-time allows the berries to become infected and shrivel, while Furmint’s acidity preserves freshness in the finished sweet wine.
    fr:
      question: "Quelle paire de caractéristiques rend le Furmint bien adapté à la production de Tokaji Aszú ?"
      choices:
        - { text: "Maturité précoce et résistance au Botrytis", correct: false }
        - { text: "Maturité tardive et sensibilité au Botrytis", correct: true }
        - { text: "Maturité précoce et acidité naturellement faible", correct: false }
        - { text: "Maturité tardive et grappes très épaisses résistantes à la pourriture", correct: false }
      explanation: |
        La longue période passée sur pied en automne permet aux baies d’être infectées puis de se concentrer, tandis que l’acidité du Furmint préserve la fraîcheur du vin doux fini.

  - id: tokaj-harslevelu-perfume-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does Hárslevelű typically contribute to a Tokaj blend?"
      choices:
        - { text: "Firm tannins and black-fruit aromas", correct: false }
        - { text: "A softer texture and linden-like perfume", correct: true }
        - { text: "Neutral flavour and lower alcohol", correct: false }
        - { text: "Deep colour and peppery spice", correct: false }
      explanation: |
        Compared with Furmint, Hárslevelű is generally softer and more aromatic, often showing floral or linden-honey notes.
    fr:
      question: "Qu’apporte généralement le Hárslevelű à un assemblage de Tokaj ?"
      choices:
        - { text: "Des tanins fermes et des arômes de fruits noirs", correct: false }
        - { text: "Une texture plus souple et un parfum évoquant le tilleul", correct: true }
        - { text: "Des arômes neutres et moins d’alcool", correct: false }
        - { text: "Une couleur profonde et des épices poivrées", correct: false }
      explanation: |
        Par rapport au Furmint, le Hárslevelű est généralement plus souple et plus aromatique, avec souvent des notes florales ou de miel de tilleul.

  - id: tokaj-harslevelu-late-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Hárslevelű ripen in Tokaj?"
      choices:
        - { text: "Earlier than Sárgamuskotály", correct: false }
        - { text: "Late, broadly alongside Furmint", correct: true }
        - { text: "In midseason, well before Furmint", correct: false }
        - { text: "After Furmint, once autumn frost begins", correct: false }
      explanation: |
        Its late harvest window allows full flavour development and, in suitable autumn weather, the formation of noble rot.
    fr:
      question: "Comment mûrit le Hárslevelű à Tokaj ?"
      choices:
        - { text: "Plus tôt que le Sárgamuskotály", correct: false }
        - { text: "Tardivement, globalement en même temps que le Furmint", correct: true }
        - { text: "À mi-saison, bien avant le Furmint", correct: false }
        - { text: "Après le Furmint, au début des gelées automnales", correct: false }
      explanation: |
        Sa période de récolte tardive permet le plein développement des arômes et, lorsque l’automne s’y prête, la formation de pourriture noble.

  - id: tokaj-sargamuskotaly-synonym-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0011
    review:
      fact_check: pass
