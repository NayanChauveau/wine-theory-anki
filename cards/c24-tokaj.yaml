      question: "Sárgamuskotály is the Hungarian name for which variety?"
      choices:
        - { text: "Muscat of Alexandria", correct: false }
        - { text: "Muscat Blanc à Petits Grains", correct: true }
        - { text: "Muscat Ottonel", correct: false }
        - { text: "Morio-Muskat", correct: false }
      explanation: |
        This ancient, early-ripening Muscat is the most overtly aromatic of Tokaj’s principal grapes.
    fr:
      question: "Sárgamuskotály est le nom hongrois de quel cépage ?"
      choices:
        - { text: "Muscat d’Alexandrie", correct: false }
        - { text: "Muscat Blanc à Petits Grains", correct: true }
        - { text: "Muscat Ottonel", correct: false }
        - { text: "Morio-Muskat", correct: false }
      explanation: |
        Ce Muscat ancien et précoce est le plus ouvertement aromatique des principaux cépages de Tokaj.

  - id: tokaj-sargamuskotaly-blend-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, grapes]
    status: reviewed
    source_id: c24-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why may Sárgamuskotály be included in a Tokaj blend?"
      choices:
        - { text: "To increase tannin and deepen colour", correct: false }
        - { text: "To add pronounced floral and grapey aromas", correct: true }
        - { text: "To lower acidity and remove fruit character", correct: false }
        - { text: "To provide neutral base wine for distillation", correct: false }
      explanation: |
        Its Muscat character can lift the aroma of blends led by the more restrained Furmint and Hárslevelű.
    fr:
      question: "Pourquoi peut-on inclure du Sárgamuskotály dans un assemblage de Tokaj ?"
      choices:
        - { text: "Pour augmenter les tanins et approfondir la couleur", correct: false }
        - { text: "Pour apporter des arômes floraux et muscatés prononcés", correct: true }
        - { text: "Pour réduire l’acidité et effacer le fruit", correct: false }
        - { text: "Pour fournir un vin de base neutre destiné à la distillation", correct: false }
      explanation: |
        Son caractère muscaté peut rehausser le nez des assemblages dominés par les Furmint et Hárslevelű, plus discrets.

  - id: tokaj-styles-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which statement best describes the range of wine styles produced in Tokaj?"
      choices:
        - { text: "The PDO is restricted to botrytised sweet wine", correct: false }
        - { text: "The region produces dry, late-harvest and traditional botrytised sweet wines", correct: true }
        - { text: "The region principally produces red and rosé wines", correct: false }
        - { text: "The PDO is restricted to traditional-method sparkling wine", correct: false }
      explanation: |
        Although Aszú created Tokaj’s historic reputation, dry Furmint and other dry whites have become an important part of modern production.
    fr:
      question: "Quelle affirmation décrit le mieux l’éventail des styles produits à Tokaj ?"
      choices:
        - { text: "L’AOP est réservée aux vins doux botrytisés", correct: false }
        - { text: "La région produit des vins secs, des vendanges tardives et des liquoreux botrytisés traditionnels", correct: true }
        - { text: "La région produit principalement des rouges et des rosés", correct: false }
        - { text: "L’AOP est réservée aux effervescents de méthode traditionnelle", correct: false }
      explanation: |
        Si l’Aszú a fondé la réputation historique de Tokaj, le Furmint sec et les autres blancs secs occupent désormais une place importante dans la production moderne.

  - id: tokaj-bottle-size-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which bottle-size pairing is most typical for Tokaji wines?"
      choices:
        - { text: "Dry wine in 50 cl; Aszú in 75 cl", correct: false }
        - { text: "Dry wine in 75 cl; Aszú in 50 cl", correct: true }
        - { text: "Dry wine in 37.5 cl; Aszú in 1 litre", correct: false }
        - { text: "Dry wine in 1 litre; Aszú in 75 cl", correct: false }
      explanation: |
        The traditional sweet-wine bottle is commonly 50 cl, whereas dry Tokaji is widely sold in the standard 75 cl format. Other sizes are legally permitted.
    fr:
      question: "Quelle association de formats est la plus courante pour les vins de Tokaj ?"
      choices:
        - { text: "Vin sec en 50 cl ; Aszú en 75 cl", correct: false }
        - { text: "Vin sec en 75 cl ; Aszú en 50 cl", correct: true }
        - { text: "Vin sec en 37,5 cl ; Aszú en 1 litre", correct: false }
        - { text: "Vin sec en 1 litre ; Aszú en 75 cl", correct: false }
      explanation: |
        La bouteille traditionnelle des vins doux contient généralement 50 cl, tandis que les Tokaji secs sont largement vendus au format standard de 75 cl. D’autres contenances sont autorisées.

  - id: tokaj-vintage-styles-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can variation in noble-rot development affect a Tokaj producer’s range in one vintage?"
      choices:
        - { text: "Every parcel must be made into the same sweetness level", correct: false }
        - { text: "Fruit can be directed into dry wine, Szamorodni or Aszú according to its condition", correct: true }
        - { text: "Botrytised fruit must be discarded while healthy fruit becomes Aszú", correct: false }
        - { text: "All fruit must remain unpicked unless Eszencia can be made", correct: false }
      explanation: |
        Selective picking and sorting let producers use healthy grapes, partly botrytised bunches and individual aszú berries for different styles.
    fr:
      question: "Comment les différences de développement de la pourriture noble peuvent-elles influencer la gamme d’un producteur de Tokaj au cours d’un même millésime ?"
      choices:
        - { text: "Chaque parcelle doit donner le même niveau de douceur", correct: false }
        - { text: "Les raisins peuvent être orientés vers un vin sec, un Szamorodni ou un Aszú selon leur état", correct: true }
        - { text: "Les raisins botrytisés doivent être écartés tandis que les raisins sains deviennent de l’Aszú", correct: false }
        - { text: "Tous les raisins doivent rester sur pied si l’on ne peut pas produire d’Eszencia", correct: false }
      explanation: |
        Les tries successives permettent d’utiliser les raisins sains, les grappes partiellement botrytisées et les baies aszú individuelles pour des styles différents.

  - id: tokaj-harvest-sort-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj]
    status: reviewed
    source_id: c24-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sorting scheme allows Tokaj growers to produce several wine styles from one harvest?"
      choices:
        - { text: "Separate fruit by berry colour into white, pink and red lots", correct: false }
        - { text: "Separate healthy fruit, partly botrytised bunches and individual aszú berries", correct: true }
        - { text: "Separate fruit solely by vineyard altitude into three lots", correct: false }
        - { text: "Separate early-picked fruit from frozen and sun-dried fruit", correct: false }
      explanation: |
        Healthy grapes can supply dry or base wine, mixed bunches suit Szamorodni, and individually selected botrytised berries are reserved for Aszú.
    fr:
      question: "Quel tri permet aux viticulteurs de Tokaj de produire plusieurs styles à partir d’une même récolte ?"
      choices:
        - { text: "Séparer les raisins selon leur couleur en lots blancs, roses et rouges", correct: false }
        - { text: "Séparer les raisins sains, les grappes partiellement botrytisées et les baies aszú individuelles", correct: true }
        - { text: "Séparer les raisins uniquement selon l’altitude du vignoble en trois lots", correct: false }
        - { text: "Séparer les raisins précoces des raisins gelés et séchés au soleil", correct: false }
      explanation: |
        Les raisins sains peuvent fournir un vin sec ou un vin de base, les grappes mixtes conviennent au Szamorodni et les baies botrytisées sélectionnées individuellement sont réservées à l’Aszú.

  - id: tokaj-aszu-berries-001
    type: mcq
    deck: Hungary::Tokaj
    tags: [hungary, tokaj, aszu]
    status: reviewed
    source_id: c24-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Tokaj, what does the term aszú refer to before it names a finished wine?"
      choices:
        - { text: "Healthy grapes picked for dry base wine", correct: false }
        - { text: "Botrytised berries that have shrivelled on the vine", correct: true }
        - { text: "Whole bunches containing mixed healthy and rotten fruit", correct: false }
        - { text: "Grapes dried after harvest on straw mats", correct: false }
