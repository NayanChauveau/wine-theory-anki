        - { text: "20 et 30 ans", correct: true }
        - { text: "30 et 40 ans", correct: false }
      explanation: |
        Les sigles se lisent à la fois en latin et en anglais : Vinum Optimum
        Signatum / Very Old Sherry, et Vinum Optimum Rare Signatum / Very Old Rare
        Sherry.

  - id: sherry-age-solera-approval-001
    type: mcq
    deck: Sherry
    tags: [sherry, age-indicated, solera]
    status: reviewed
    source_id: c43-0135
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is approval for 12 Years Old or 15 Years Old Sherry granted?"
      choices:
        - { text: "Per vintage, from a harvest declaration", correct: false }
        - { text: "For a whole solera system at once", correct: true }
        - { text: "Batch by batch, after tasting and analysis", correct: false }
        - { text: "From the age of the oldest wine in the blend", correct: false }
      explanation: |
        That gives producers more flexibility. VOS and VORS are stricter:
        each batch is tasted and analysed before it can use the claim.
    fr:
      question: "Comment l’agrément d’un xérès 12 ans ou 15 ans est-il accordé ?"
      choices:
        - { text: "Par millésime, sur déclaration de récolte", correct: false }
        - { text: "Pour tout un système de solera à la fois", correct: true }
        - { text: "Lot par lot, après dégustation et analyse", correct: false }
        - { text: "D’après l’âge du vin le plus vieux de l’assemblage", correct: false }
      explanation: |
        Cela laisse plus de souplesse aux producteurs. VOS et VORS sont plus
        stricts : chaque lot est dégusté et analysé avant de pouvoir porter la
        mention.

  - id: sherry-age-eligible-styles-001
    type: mcq
