        - { text: "Environ 14 % vol.", correct: false }
        - { text: "Environ 20 % vol.", correct: false }
        - { text: "Environ 22 % vol.", correct: false }
      explanation: |
        À ce degré, le vin est protégé des altérations et vieillit au contact
        de l’air, en fonçant et en se concentrant lentement.

  - id: sherry-flor-alcohol-limit-001
    type: mcq
    deck: Sherry
    tags: [sherry, fortification, flor]
    status: reviewed
    source_id: c43-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does fortifying a young Sherry to a high strength stop biological ageing?"
      choices:
        - { text: "The spirit strips oxygen from the wine", correct: false }
        - { text: "The spirit raises the wine's acidity", correct: false }
        - { text: "The spirit removes nutrients the yeast need", correct: false }
        - { text: "The extra alcohol kills the flor yeast", correct: true }
      explanation: |
        The film is a living yeast colony with a limited tolerance for alcohol.
        Producers use this on purpose to send a wine down the oxidative path.
    fr:
      question: "Pourquoi un mutage à degré élevé met-il fin au vieillissement biologique d’un xérès jeune ?"
      choices:
        - { text: "L’eau-de-vie prive le vin de son oxygène", correct: false }
        - { text: "L’eau-de-vie augmente l’acidité du vin", correct: false }
        - { text: "L’eau-de-vie retire les nutriments des levures", correct: false }
        - { text: "Le surplus d’alcool tue les levures de flor", correct: true }
      explanation: |
        Le voile est une colonie de levures vivantes dont la tolérance à
        l’alcool est limitée. Les producteurs s’en servent délibérément pour
        envoyer un vin sur la voie oxydative.

  - id: sherry-sweet-drying-001
    type: mcq
    deck: Sherry
    tags: [sherry, sweet, pedro-ximenez]
    status: reviewed
    source_id: c43-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "For naturally sweet Sherry, how are the grapes usually concentrated?"
      choices:
        - { text: "Left to shrivel on the vine", correct: false }
        - { text: "Dried in the sun on mats after picking", correct: true }
        - { text: "Dried indoors on racks through the winter", correct: false }
        - { text: "Concentrated by noble rot in misty autumns", correct: false }
      explanation: |
        The drying, called soleo, takes a week or more on esparto mats. When the
        berries reach the target sugar they are pressed; the concentration gives the
        wine its raisin and fig character.
    fr:
      question: "Pour un xérès naturellement doux, comment concentre-t-on habituellement les raisins ?"
      choices:
        - { text: "On les laisse se flétrir sur souche", correct: false }
        - { text: "On les sèche au soleil sur des nattes", correct: true }
        - { text: "On les sèche à l’abri sur des claies tout l’hiver", correct: false }
        - { text: "On compte sur la pourriture noble des automnes brumeux", correct: false }
      explanation: |
        Ce séchage, le soleo, dure une semaine ou plus sur des nattes d’alfa.
        Les baies sont pressées dès qu’elles atteignent la richesse en sucre
        visée ; cette concentration donne au vin ses notes de raisin sec et de
        figue.

  - id: sherry-sweet-ferment-001
    type: mcq
    deck: Sherry
    tags: [sherry, sweet, fermentation]
    status: reviewed
    source_id: c43-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What usually happens when the very sugary must for naturally sweet Sherry starts to ferment?"
      choices:
        - { text: "It stalls after a few degrees", correct: true }
        - { text: "It ferments out to dryness", correct: false }
        - { text: "It reaches about 13% abv unaided", correct: false }
        - { text: "It ferments fast and overheats", correct: false }
      explanation: |
        So much sugar draws water out of the yeast cells by osmosis, slowing them
        almost to a stop.
    fr:
      question: "Que fait habituellement la fermentation du moût très sucré destiné à un xérès naturellement doux ?"
      choices:
        - { text: "Elle s’arrête après quelques degrés", correct: true }
        - { text: "Elle va jusqu’au bout et donne un vin sec", correct: false }
        - { text: "Elle atteint seule environ 13 % vol.", correct: false }
        - { text: "Elle part vite et s’emballe en chauffant", correct: false }
      explanation: |
        Une telle teneur en sucre attire l’eau hors des cellules des levures
        par osmose, ce qui les ralentit presque jusqu’à l’arrêt.

  - id: sherry-sweet-fortify-001
    type: mcq
    deck: Sherry
    tags: [sherry, sweet, fortification]
    status: reviewed
    source_id: c43-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is fermentation brought to an end in naturally sweet Sherry?"
      choices:
        - { text: "By chilling and filtering out the yeast", correct: false }
        - { text: "By adding a large dose of sulphur dioxide", correct: false }
        - { text: "By adding grape spirit", correct: true }
        - { text: "By pasteurising the fermenting must", correct: false }
      explanation: |
        The spirit lifts the strength beyond what the yeast can survive, so the
        sugar from the dried grapes stays in the wine.
    fr:
      question: "Comment arrête-t-on la fermentation d’un xérès naturellement doux ?"
      choices:
        - { text: "En refroidissant puis en filtrant les levures", correct: false }
        - { text: "Par une forte dose de dioxyde de soufre", correct: false }
        - { text: "Par un mutage à l’eau-de-vie de vin", correct: true }
        - { text: "En pasteurisant le moût en fermentation", correct: false }
      explanation: |
        L’eau-de-vie porte le degré au-delà de ce que les levures supportent :
        le sucre des raisins séchés reste donc dans le vin.

  - id: sherry-butt-size-001
    type: mcq
    deck: Sherry
    tags: [sherry, maturation, oak]
    status: reviewed
    source_id: c43-0045
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the typical capacity of a Sherry butt?"
      choices:
        - { text: "About 225 litres", correct: false }
        - { text: "About 300 litres", correct: false }
        - { text: "About 1,000 litres", correct: false }
        - { text: "About 600 litres", correct: true }
      explanation: |
        Most are made of American oak. Well-used butts are later sought by Scotch
        whisky distillers.
    fr:
      question: "Quelle est la contenance habituelle d’une bota de xérès ?"
      choices:
        - { text: "Environ 225 litres", correct: false }
        - { text: "Environ 300 litres", correct: false }
        - { text: "Environ 1 000 litres", correct: false }
        - { text: "Environ 600 litres", correct: true }
      explanation: |
        La plupart sont en chêne américain. Les botas bien usées sont ensuite
        recherchées par les distilleries de whisky écossais.

  - id: sherry-butt-seasoning-001
    type: mcq
    deck: Sherry
    tags: [sherry, maturation, oak]
    status: reviewed
    source_id: c43-0046
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do Sherry houses stop their butts from giving oak flavour to the wine?"
      choices:
        - { text: "They char the staves heavily", correct: false }
        - { text: "They use butts already seasoned with wine", correct: true }
        - { text: "They line the staves with paraffin wax", correct: false }
        - { text: "They make the butts from chestnut", correct: false }
      explanation: |
        New butts are first filled with unfortified wine, which draws out much of
        the oak's flavour and tannin. Once seasoned, a butt can stay in use for
        decades.
    fr:
      question: "Comment les maisons de xérès évitent-elles que leurs botas donnent un goût boisé au vin ?"
      choices:
        - { text: "Elles brûlent fortement l’intérieur des douelles", correct: false }
        - { text: "Elles utilisent des botas déjà avinées", correct: true }
        - { text: "Elles enduisent les douelles de paraffine", correct: false }
        - { text: "Elles font les botas en châtaignier", correct: false }
      explanation: |
        Les botas neuves sont d’abord remplies de vin non muté, qui extrait une
        bonne part des arômes et des tanins du chêne. Une fois avinée, une bota
        peut servir pendant des décennies.

  - id: sherry-butt-role-001
    type: mcq
    deck: Sherry
    tags: [sherry, maturation, oxygen]
    status: reviewed
    source_id: c43-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main thing a Sherry house wants from its oak butts?"
      choices:
        - { text: "Slow contact between the wine and oxygen", correct: true }
        - { text: "A steady cool temperature for the wine", correct: false }
        - { text: "Tannin to give the wine structure", correct: false }
        - { text: "Nutrients that feed the flor", correct: false }
      explanation: |
        Air passes slowly through the staves and joints, so the wood works as a
        slow oxygen valve. A sound butt can stay in service for decades, doing the
        same job year after year.
    fr:
      question: "Qu’attend surtout une maison de xérès de ses botas en chêne ?"
      choices:
        - { text: "Un contact lent entre le vin et l’oxygène", correct: true }
        - { text: "Une température fraîche et stable pour le vin", correct: false }
        - { text: "Des tanins qui structurent le vin", correct: false }
        - { text: "Des nutriments qui nourrissent le voile de flor", correct: false }
      explanation: |
        L’air passe lentement à travers les douelles et les joints : le bois
        agit comme une valve à oxygène très lente. Une bota saine reste en
        service des décennies et remplit le même rôle année après année.

  - id: sherry-butt-fill-001
    type: mcq
    deck: Sherry
    tags: [sherry, maturation, oxygen]
    status: reviewed
    source_id: c43-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How full are Sherry butts usually filled?"
      choices:
        - { text: "To the brim, topped up often", correct: false }
        - { text: "About half full", correct: false }
        - { text: "About five-sixths full", correct: true }
        - { text: "About two-thirds full", correct: false }
      explanation: |
        The gap is left in butts for both flor and oxidative ageing. Cellar workers
        often describe it as "two fists" (dos puños).
    fr:
      question: "Jusqu’où remplit-on habituellement les botas de xérès ?"
      choices:
        - { text: "À ras bord, avec des ouillages fréquents", correct: false }
        - { text: "À moitié environ", correct: false }
        - { text: "Aux cinq sixièmes environ", correct: true }
        - { text: "Aux deux tiers environ", correct: false }
      explanation: |
        On laisse ce vide dans les botas pour le vieillissement sous flor comme
        pour le vieillissement oxydatif. Au chai, on parle souvent de « deux
        poings » (dos puños).

  - id: sherry-bodega-design-001
    type: mcq
    deck: Sherry
    tags: [sherry, maturation, bodega]
    status: reviewed
    source_id: c43-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which building style is traditional for Sherry maturation bodegas?"
      choices:
        - { text: "Deep cellars cut into the chalk rock", correct: false }
        - { text: "Tall halls with thick whitewashed walls", correct: true }
        - { text: "Low sheds with tin roofs that heat up", correct: false }
        - { text: "Lofts under the roof that warm the casks", correct: false }
      explanation: |
        Keeping the butts cool is the main challenge in Jerez's heat. High ceilings
        let warm air rise away from the butts, and windows are placed to catch the
        sea breeze.
    fr:
      question: "Quel type de bâtiment est traditionnel pour les bodegas d’élevage du xérès ?"
      choices:
        - { text: "Des caves profondes creusées dans la craie", correct: false }
        - { text: "De hauts chais aux épais murs blanchis à la chaux", correct: true }
        - { text: "Des hangars bas au toit de tôle qui chauffe", correct: false }
        - { text: "Des greniers sous le toit qui réchauffent les fûts", correct: false }
      explanation: |
        Garder les botas au frais est le principal défi sous la chaleur de
        Jerez. Les hauts plafonds éloignent l’air chaud des fûts, et les
        fenêtres sont placées pour capter la brise marine.

  - id: sherry-oloroso-profile-001
    type: mcq
    deck: Sherry
    tags: [sherry, oloroso, tasting]
    status: reviewed
    source_id: c43-0103
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description fits a classic Oloroso Sherry?"
      choices:
        - { text: "Pale lemon and light, with almond and bread", correct: false }
        - { text: "Brown and full-bodied, with walnut and leather", correct: true }
        - { text: "Pale gold and light, with salty, tangy notes", correct: false }
        - { text: "Deep mahogany and syrupy, with fig and coffee", correct: false }
      explanation: |
        The name means roughly "fragrant" in Spanish. Its savoury, nutty
        weight makes it a classic match for slow-cooked meat such as oxtail
        stew.
    fr:
      question: "Quelle description correspond à un Oloroso classique ?"
      choices:
        - { text: "Citron pâle et léger, amande et pain", correct: false }
        - { text: "Brun et corsé, noix et cuir", correct: true }
        - { text: "Or pâle et léger, notes salines et vives", correct: false }
        - { text: "Acajou profond et sirupeux, figue et café", correct: false }
      explanation: |
        Le nom signifie à peu près « odorant » en espagnol. Sa bouche ample et
        sapide, marquée par la noix, en fait un accord classique avec les
        viandes mijotées, comme la queue de bœuf braisée.

  - id: sherry-oloroso-old-astringency-001
    type: mcq
    deck: Sherry
    tags: [sherry, oloroso, ageing]
    status: reviewed
    source_id: c43-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides great concentration, what trait do very old Oloroso wines tend to develop?"
      choices:
        - { text: "Fresh, bready yeast notes", correct: false }
        - { text: "A pale, faded colour", correct: false }
        - { text: "Noticeable residual sweetness", correct: false }
        - { text: "A drying astringency", correct: true }
      explanation: |
        Decades in oak leave tannin and acidity that come to dominate the
        finish, giving a dry, gripping sensation on the palate.
    fr:
      question: "Outre une grande concentration, quel trait les très vieux Olorosos tendent-ils à développer ?"
      choices:
        - { text: "Des notes fraîches de levure et de pain", correct: false }
        - { text: "Une couleur pâle et passée", correct: false }
        - { text: "Un sucre résiduel perceptible", correct: false }
        - { text: "Une astringence asséchante", correct: true }
      explanation: |
        Des décennies en fût laissent des tanins et une acidité qui finissent
        par dominer la finale et laissent en bouche une sensation sèche qui
        accroche.

  - id: sherry-amontillado-refortify-001
    type: mcq
    deck: Sherry
    tags: [sherry, amontillado, fortification]
    status: reviewed
    source_id: c43-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When a Fino-type wine is to become an Amontillado, what does the producer usually do to it?"
      choices:
        - { text: "Fortifies it again with grape spirit", correct: true }
        - { text: "Moves it to a cooler coastal bodega", correct: false }
        - { text: "Fills its butts right to the brim", correct: false }
        - { text: "Blends in a little Pedro Ximénez", correct: false }
      explanation: |
        The wine then enters a separate solera kept for Amontillado; it does
        not go back into the Fino solera it came from.
    fr:
      question: "Quand un vin de type Fino doit devenir Amontillado, que lui fait habituellement le producteur ?"
      choices:
        - { text: "Il le mute à nouveau à l’eau-de-vie de vin", correct: true }
        - { text: "Il l’installe dans une bodega côtière plus fraîche", correct: false }
        - { text: "Il remplit ses botas à ras bord", correct: false }
        - { text: "Il y assemble un peu de Pedro Ximénez", correct: false }
      explanation: |
        Le vin entre ensuite dans une solera distincte réservée à
        l’Amontillado ; il ne retourne pas dans la solera de Fino d’où il vient.

  - id: sherry-amontillado-colour-001
    type: mcq
    deck: Sherry
    tags: [sherry, amontillado, tasting]
    status: reviewed
    source_id: c43-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What colour does a classic Amontillado Sherry show?"
      choices:
        - { text: "Pale lemon", correct: false }
        - { text: "Pale gold with green tints", correct: false }
        - { text: "Amber", correct: true }
        - { text: "Opaque mahogany", correct: false }
      explanation: |
        The colour comes from its oxidative phase, and older examples drift
        towards brown. In body it usually stays lighter than an Oloroso.
    fr:
      question: "Quelle couleur montre un Amontillado classique ?"
      choices:
        - { text: "Citron pâle", correct: false }
        - { text: "Or pâle à reflets verts", correct: false }
        - { text: "Ambre", correct: true }
        - { text: "Acajou opaque", correct: false }
      explanation: |
        Cette couleur vient de sa phase oxydative, et les plus vieux tirent vers
        le brun. En bouche, il reste en général plus léger qu’un
        Oloroso.

  - id: sherry-amontillado-yeast-fade-001
    type: mcq
    deck: Sherry
    tags: [sherry, amontillado, ageing]
    status: reviewed
    source_id: c43-0108
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "As an Amontillado spends more years in oxidative ageing, what happens to its flor-derived aromas?"
      choices:
        - { text: "They vanish within a few months", correct: false }
        - { text: "They fade slowly but stay recognisable", correct: true }
        - { text: "They grow more intense year by year", correct: false }
        - { text: "They turn into raisin and fig notes", correct: false }
      explanation: |
        That lingering trace of its biological phase is what lets a taster
        tell an Amontillado from an Oloroso of similar age.
    fr:
      question: "À mesure qu’un Amontillado passe des années en vieillissement oxydatif, que deviennent ses arômes issus du voile de flor ?"
      choices:
        - { text: "Ils disparaissent en quelques mois", correct: false }
        - { text: "Ils s’estompent lentement sans disparaître", correct: true }
        - { text: "Ils gagnent en intensité d’année en année", correct: false }
        - { text: "Ils se changent en notes de raisin sec et de figue", correct: false }
      explanation: |
        Cette trace persistante de sa phase biologique permet au dégustateur
        de distinguer un Amontillado d’un Oloroso d’âge comparable.

  - id: sherry-amontillado-ageing-length-001
    type: mcq
    deck: Sherry
    tags: [sherry, amontillado, ageing]
    status: reviewed
    source_id: c43-0109
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with Oloroso, how long can Amontillado keep benefiting from oxidative ageing?"
      choices:
        - { text: "A few years at most, like Fino", correct: false }
        - { text: "Roughly half as long", correct: false }
        - { text: "Much longer, as flor still protects it", correct: false }
        - { text: "About as long", correct: true }
      explanation: |
        Once the flor has gone, the wine ages like any oxidative Sherry: long
        cask time concentrates it rather than spoiling it, so very old
        Amontillados can be intense and sharp.
    fr:
      question: "Par rapport à l’Oloroso, combien de temps l’Amontillado peut-il continuer à gagner au vieillissement oxydatif ?"
      choices:
        - { text: "Quelques années au plus, comme un Fino", correct: false }
        - { text: "À peu près deux fois moins longtemps", correct: false }
        - { text: "Bien plus longtemps, le voile le protégeant encore", correct: false }
        - { text: "À peu près aussi longtemps", correct: true }
      explanation: |
        Une fois le voile disparu, le vin vieillit comme tout xérès oxydatif :
        un long séjour en fût le concentre au lieu de l’abîmer, si bien que les
        très vieux Amontillados peuvent être intenses et incisifs.

  - id: sherry-palo-cortado-rarity-001
    type: mcq
    deck: Sherry
    tags: [sherry, palo-cortado]
    status: reviewed
    source_id: c43-0110
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Among the dry Sherry styles, which is made in the smallest quantities?"
      choices:
        - { text: "Palo Cortado", correct: true }
        - { text: "Amontillado", correct: false }
        - { text: "Manzanilla", correct: false }
        - { text: "Oloroso", correct: false }
      explanation: |
        The name is usually traced to cellar chalk marks: a single stroke
        (palo) on a butt was crossed through (cortado) when the wine changed
        course. There is no single route to Palo Cortado, and bottlings are
        small but generally of very high quality.
    fr:
      question: "Parmi les styles de xérès secs, lequel est produit en plus petite quantité ?"
      choices:
        - { text: "Palo Cortado", correct: true }
        - { text: "Amontillado", correct: false }
        - { text: "Manzanilla", correct: false }
        - { text: "Oloroso", correct: false }
      explanation: |
        Le nom viendrait des marques à la craie du chai : un trait (palo) tracé
        sur une bota était barré (cortado) quand le vin changeait de voie. Il
        n’existe pas de chemin unique vers le Palo Cortado ; les volumes sont
        faibles, mais la qualité est en général très haute.

  - id: sherry-palo-cortado-nose-001
    type: mcq
    deck: Sherry
    tags: [sherry, palo-cortado, tasting]
    status: reviewed
    source_id: c43-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On the nose, a Palo Cortado most resembles which other Sherry style?"
      choices:
        - { text: "Fino", correct: false }
        - { text: "Amontillado", correct: true }
        - { text: "Oloroso", correct: false }
        - { text: "Cream", correct: false }
      explanation: |
        Its aromas are fine and sharp rather than broad, which is one reason
        it is hard to identify blind.
    fr:
      question: "Au nez, un Palo Cortado ressemble surtout à quel autre style de xérès ?"
      choices:
        - { text: "Fino", correct: false }
        - { text: "Amontillado", correct: true }
        - { text: "Oloroso", correct: false }
        - { text: "Cream", correct: false }
      explanation: |
        Ses arômes sont fins et vifs plutôt qu’amples, l’une des raisons pour
        lesquelles il est difficile à reconnaître à l’aveugle.

  - id: sherry-palo-cortado-palate-001
    type: mcq
    deck: Sherry
    tags: [sherry, palo-cortado, tasting]
    status: reviewed
    source_id: c43-0112
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In body and richness, a Palo Cortado most resembles which other Sherry style?"
      choices:
        - { text: "Fino", correct: false }
        - { text: "Manzanilla", correct: false }
        - { text: "Amontillado", correct: false }
        - { text: "Oloroso", correct: true }
      explanation: |
        Expect a dry, broad palate with walnut, orange-peel and toffee notes
        and a long finish.
    fr:
      question: "En corps et en richesse, un Palo Cortado ressemble surtout à quel autre style de xérès ?"
      choices:
        - { text: "Fino", correct: false }
        - { text: "Manzanilla", correct: false }
        - { text: "Amontillado", correct: false }
        - { text: "Oloroso", correct: true }
      explanation: |
        Attendez-vous à une bouche sèche et ample, aux notes de noix, d’écorce
        d’orange et de caramel au beurre, avec une longue finale.

  - id: sherry-px-aromas-001
    type: mcq
    deck: Sherry
    tags: [sherry, pedro-ximenez, tasting]
    status: reviewed
    source_id: c43-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which aroma set is typical of a Pedro Ximénez Sherry?"
      choices:
        - { text: "Raisin, coffee and liquorice", correct: true }
        - { text: "Almond, bread dough and lemon", correct: false }
        - { text: "Apricot, marmalade and honey", correct: false }
        - { text: "Hazelnut, yeast and green apple", correct: false }
      explanation: |
        The wine is deep brown and syrupy; it is often poured over vanilla ice
        cream, where it works almost as a sauce.
    fr:
      question: "Quel trio d’arômes est typique d’un xérès Pedro Ximénez ?"
      choices:
        - { text: "Raisins secs, café et réglisse", correct: true }
        - { text: "Amande, pâte à pain et citron", correct: false }
        - { text: "Abricot, marmelade et miel", correct: false }
        - { text: "Noisette, levure et pomme verte", correct: false }
      explanation: |
        Ce vin brun foncé, presque sirupeux, se verse souvent sur une glace à la
        vanille, où il fait quasiment office de sauce.

  - id: sherry-px-sugar-001
    type: mcq
    deck: Sherry
    tags: [sherry, pedro-ximenez, sweetness]
    status: reviewed
    source_id: c43-0119
    review:
      fact_check: pass
      sources: [known-fact]
    en:
