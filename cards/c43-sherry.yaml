cards:
  - id: sherry-region-location-001
    type: mcq
    deck: Sherry
    tags: [sherry, geography]
    status: reviewed
    source_id: c43-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which Spanish autonomous community does the Sherry vineyard lie?"
      choices:
        - { text: "Castilla-La Mancha", correct: false }
        - { text: "Valencia", correct: false }
        - { text: "Andalucía", correct: true }
        - { text: "Catalunya", correct: false }
      explanation: |
        The vines ring the town of Jerez de la Frontera in the province of Cádiz.
        The English word Sherry is an old rendering of Jerez, called Xérès in French.
    fr:
      question: "Dans quelle communauté autonome d’Espagne se trouve le vignoble du xérès ?"
      choices:
        - { text: "Castille-La Manche", correct: false }
        - { text: "Communauté valencienne", correct: false }
        - { text: "Andalousie", correct: true }
        - { text: "Catalogne", correct: false }
      explanation: |
        Les vignes entourent la ville de Jerez de la Frontera, dans la province de
        Cadix. Le mot anglais Sherry est une ancienne transcription de Jerez, que le
        français appelle Xérès.

  - id: sherry-ageing-towns-001
    type: mcq
    deck: Sherry
    tags: [sherry, geography, maturation]
    status: reviewed
    source_id: c43-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides Jerez de la Frontera, which two towns traditionally complete the Sherry ageing triangle?"
      choices:
        - { text: "Montilla and Aguilar de la Frontera", correct: false }
        - { text: "Sanlúcar and El Puerto de Santa María", correct: true }
        - { text: "Huelva and Bollullos par del Condado", correct: false }
        - { text: "Málaga and Vélez-Málaga", correct: false }
      explanation: |
        Both are river-mouth towns: Sanlúcar de Barrameda sits where the Guadalquivir
        meets the sea, and El Puerto de Santa María on the Guadalete, across the bay
        from Cádiz. Since a rule change around 2021, ageing may also take place in
        other towns of the production zone, such as Chipiona, Rota, Trebujena,
        Chiclana, Lebrija and Puerto Real.
    fr:
      question: "Outre Jerez de la Frontera, quelles deux villes complètent le triangle historique de l’élevage du xérès ?"
      choices:
        - { text: "Montilla et Aguilar de la Frontera", correct: false }
        - { text: "Sanlúcar et El Puerto de Santa María", correct: true }
        - { text: "Huelva et Bollullos par del Condado", correct: false }
        - { text: "Málaga et Vélez-Málaga", correct: false }
      explanation: |
        Ce sont deux villes d’estuaire : Sanlúcar de Barrameda à l’embouchure du
        Guadalquivir, El Puerto de Santa María sur le Guadalete, face à Cadix de
        l’autre côté de la baie. Depuis une modification du règlement vers 2021,
        l’élevage est aussi permis dans d’autres communes de la zone de production,
        comme Chipiona, Rota, Trebujena, Chiclana, Lebrija et Puerto Real.

  - id: sherry-climate-001
    type: mcq
    deck: Sherry
    tags: [sherry, climate]
    status: reviewed
    source_id: c43-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description best fits the climate of the Sherry region?"
      choices:
        - { text: "Warm and humid, with frequent summer storms", correct: false }
        - { text: "Continental, with cold winters and spring frost", correct: false }
        - { text: "Cool maritime, with rain spread through the year", correct: false }
        - { text: "Hot and sunny, with a dry growing season", correct: true }
      explanation: |
        Atlantic fronts bring rain between autumn and spring, so the yearly total is
        higher than in much of inland Spain. Summer sits under settled high pressure.
    fr:
      question: "Quelle description correspond le mieux au climat de la région de Jerez ?"
      choices:
        - { text: "Chaud et humide, avec de fréquents orages d’été", correct: false }
        - { text: "Continental, avec des hivers froids et des gelées de printemps", correct: false }
        - { text: "Maritime frais, avec des pluies réparties sur l’année", correct: false }
        - { text: "Chaud et ensoleillé, avec une saison de végétation sèche", correct: true }
      explanation: |
        Les perturbations atlantiques apportent la pluie de l’automne au printemps,
        si bien que le cumul annuel dépasse celui d’une bonne partie de l’intérieur
        de l’Espagne. L’été, un anticyclone stable s’installe.

  - id: sherry-poniente-001
    type: mcq
    deck: Sherry
    tags: [sherry, climate, wind]
    status: reviewed
    source_id: c43-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which kind of wind is the poniente that reaches the Sherry vineyards?"
      choices:
        - { text: "A humid westerly wind off the Atlantic", correct: true }
        - { text: "A hot, dry easterly wind", correct: false }
        - { text: "A cold northerly wind from the sierras", correct: false }
        - { text: "A dusty southerly wind from North Africa", correct: false }
      explanation: |
        Coming off the ocean, it tempers summer heat most near the coast, so coastal
        vineyards run a little cooler on average than those inland.
    fr:
      question: "Quel type de vent est le poniente qui souffle sur le vignoble de Jerez ?"
      choices:
        - { text: "Un vent d’ouest humide venu de l’Atlantique", correct: true }
        - { text: "Un vent d’est chaud et sec", correct: false }
        - { text: "Un vent froid du nord, descendu des sierras", correct: false }
        - { text: "Un vent du sud poussiéreux, venu d’Afrique du Nord", correct: false }
      explanation: |
        Chargé de l’humidité de l’océan, il tempère surtout la chaleur estivale près
        de la côte : les vignes du littoral restent en moyenne un peu plus fraîches
        que celles de l’intérieur.

  - id: sherry-levante-001
    type: mcq
    deck: Sherry
    tags: [sherry, climate, wind]
    status: reviewed
    source_id: c43-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which wind brings the fiercest summer heatwaves to the Sherry vineyards?"
      choices:
        - { text: "Poniente", correct: false }
        - { text: "Tramontana", correct: false }
        - { text: "Levante", correct: true }
        - { text: "Cierzo", correct: false }
      explanation: |
        It blows from the east, funnelled through the Strait of Gibraltar, hot and
        drying. A spell of it near harvest can scorch leaves and shrivel grapes.
        The Cierzo is the north-westerly of the Ebro valley, and the Tramontana the
        northerly of Catalonia.
    fr:
      question: "Quel vent apporte les canicules estivales les plus violentes sur le vignoble de Jerez ?"
      choices:
        - { text: "Poniente", correct: false }
        - { text: "Tramontana", correct: false }
        - { text: "Levante", correct: true }
        - { text: "Cierzo", correct: false }
      explanation: |
        Il souffle de l’est, canalisé par le détroit de Gibraltar, chaud et
        desséchant. Un épisode de levante près des vendanges peut griller le
        feuillage et flétrir les raisins. Le cierzo est le vent de nord-ouest de la
        vallée de l’Èbre, la tramontana le vent du nord de la Catalogne.

  - id: sherry-albariza-001
    type: mcq
    deck: Sherry
    tags: [sherry, soil]
    status: reviewed
    source_id: c43-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white, chalk-rich soil is most prized in the Sherry vineyards?"
      choices:
        - { text: "Barros", correct: false }
        - { text: "Albariza", correct: true }
        - { text: "Arenas", correct: false }
        - { text: "Llicorella", correct: false }
      explanation: |
        Barros (darker clay) and arenas (sand) are the area's other main soils and
        generally give coarser base wine. Famous pagos such as Macharnudo and
        Carrascal lie on albariza.
    fr:
      question: "Quel sol blanc, riche en craie, est le plus recherché dans le vignoble de Jerez ?"
      choices:
        - { text: "Barros", correct: false }
        - { text: "Albariza", correct: true }
        - { text: "Arenas", correct: false }
        - { text: "Llicorella", correct: false }
      explanation: |
        Les barros (argiles plus sombres) et les arenas (sables) sont les autres
        grands sols de la zone ; ils donnent en général un vin de base plus
        grossier. Des pagos réputés comme Macharnudo et Carrascal sont sur albariza.

  - id: sherry-albariza-water-001
    type: mcq
    deck: Sherry
    tags: [sherry, soil, water]
    status: reviewed
    source_id: c43-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does albariza soil help Sherry vines through summers with almost no rain?"
      choices:
        - { text: "A shallow water table lies just under the roots", correct: false }
        - { text: "Its stony surface traps heavy summer dew", correct: false }
        - { text: "Its sandy texture lets summer showers soak in", correct: false }
        - { text: "It stores a deep reserve of winter rain", correct: true }
      explanation: |
        The soil is porous and very deep. Water from the wet season soaks in and is
        held in its fine pores, and the roots draw on it as summer goes on.
    fr:
      question: "Comment l’albariza aide-t-elle la vigne à traverser des étés presque sans pluie ?"
      choices:
        - { text: "Une nappe phréatique affleure juste sous les racines", correct: false }
        - { text: "Sa surface caillouteuse retient d’abondantes rosées", correct: false }
        - { text: "Sa texture sableuse laisse pénétrer les averses d’été", correct: false }
        - { text: "Elle garde en profondeur les pluies de l’hiver", correct: true }
      explanation: |
        Ce sol poreux est très profond. L’eau de la saison humide s’y infiltre et
        reste piégée dans ses pores fins ; les racines y puisent à mesure que l’été
        avance.

  - id: sherry-aserpia-purpose-001
    type: mcq
    deck: Sherry
    tags: [sherry, vineyard, water]
    status: reviewed
    source_id: c43-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do Sherry growers dig rectangular pits between their vine rows?"
      choices:
        - { text: "To drain surplus water away from the roots", correct: false }
        - { text: "To catch rainwater and limit run-off", correct: true }
        - { text: "To bury the pruned canes as compost", correct: false }
        - { text: "To let cool night air pool around the vines", correct: false }
      explanation: |
        The technique is called aserpia. On sloping albariza hills, heavy downpours
        would otherwise wash water and topsoil downhill before it could soak in.
    fr:
      question: "Pourquoi les vignerons de Jerez creusent-ils des cuvettes rectangulaires entre les rangs de vigne ?"
      choices:
        - { text: "Pour évacuer l’excès d’eau loin des racines", correct: false }
        - { text: "Pour retenir la pluie et limiter le ruissellement", correct: true }
        - { text: "Pour enfouir les sarments de taille comme compost", correct: false }
        - { text: "Pour que l’air frais de la nuit stagne autour des ceps", correct: false }
      explanation: |
        Cette technique s’appelle l’aserpia. Sur les coteaux d’albariza, les fortes
        averses entraîneraient sinon l’eau et la terre de surface vers le bas de la
        pente avant qu’elles aient pu s’infiltrer.

  - id: sherry-aserpia-timing-001
    type: mcq
    deck: Sherry
    tags: [sherry, vineyard, water]
    status: reviewed
    source_id: c43-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When do Sherry growers dig the aserpia pits between the vine rows?"
      choices:
        - { text: "Soon after the harvest", correct: true }
        - { text: "In late winter, before budburst", correct: false }
        - { text: "In spring, after budburst", correct: false }
        - { text: "In early summer, after flowering", correct: false }
      explanation: |
        The pits stay open through autumn and winter and are levelled again in
        spring.
    fr:
      question: "À quel moment les vignerons de Jerez creusent-ils les cuvettes d’aserpia entre les rangs ?"
      choices:
        - { text: "Peu après les vendanges", correct: true }
        - { text: "À la fin de l’hiver, avant le débourrement", correct: false }
        - { text: "Au printemps, après le débourrement", correct: false }
        - { text: "Au début de l’été, après la floraison", correct: false }
      explanation: |
        Les cuvettes doivent être prêtes pour les pluies : elles restent ouvertes
        tout l’automne et l’hiver, puis sont arasées au printemps.

  - id: sherry-albariza-crust-001
    type: mcq
    deck: Sherry
    tags: [sherry, soil, water]
    status: reviewed
    source_id: c43-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a Sherry vineyard, what happens to the surface of albariza in the dry summer that slows water loss?"
      choices:
        - { text: "It cracks open into deep fissures", correct: false }
        - { text: "It turns into a loose, powdery dust", correct: false }
        - { text: "It bakes into a hard crust", correct: true }
        - { text: "It swells and turns sticky", correct: false }
      explanation: |
        The crust works like a lid on the moist chalk below, so less water
        evaporates. Its white surface also reflects light back into the canopy.
    fr:
      question: "Dans le vignoble de Jerez, quel changement de la surface de l’albariza freine la perte d’eau pendant l’été sec ?"
      choices:
        - { text: "Elle s’ouvre en profondes fissures", correct: false }
        - { text: "Elle se réduit en poussière fine et meuble", correct: false }
        - { text: "Elle durcit en croûte", correct: true }
        - { text: "Elle gonfle et devient collante", correct: false }
      explanation: |
        Cette croûte fait office de couvercle sur la craie humide du dessous et
        limite l’évaporation. Sa surface blanche renvoie aussi la lumière vers le
        feuillage.

  - id: sherry-grapes-authorised-001
    type: mcq
    deck: Sherry
    tags: [sherry, grapes]
    status: reviewed
    source_id: c43-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which three grapes are the main authorised varieties for Sherry?"
      choices:
        - { text: "Palomino, Airén and Verdejo", correct: false }
        - { text: "Pedro Ximénez, Garnacha Blanca and Airén", correct: false }
        - { text: "Moscatel, Macabeo and Garnacha Blanca", correct: false }
        - { text: "Palomino, Pedro Ximénez and Moscatel", correct: true }
      explanation: |
        Moscatel here means Muscat of Alexandria. Around 2021 a few old local
        varieties, such as Perruno, Mantúo, Beba and Vigiriega, were readmitted in
        minor amounts. Airén is the workhorse of La Mancha's plains, and Verdejo the
        white of Rueda.
    fr:
      question: "Quels sont les trois principaux cépages autorisés pour le xérès ?"
      choices:
        - { text: "Palomino, Airén et Verdejo", correct: false }
        - { text: "Pedro Ximénez, Garnacha Blanca et Airén", correct: false }
        - { text: "Moscatel, Macabeo et Garnacha Blanca", correct: false }
        - { text: "Palomino, Pedro Ximénez et Moscatel", correct: true }
      explanation: |
        Moscatel désigne ici le muscat d’Alexandrie. Vers 2021, quelques vieux
        cépages locaux, comme le Perruno, le Mantúo, le Beba et le Vigiriega, ont
        été réadmis en faibles proportions. L’Airén est le cépage de masse des
        plaines de la Manche, le Verdejo le blanc de Rueda.

  - id: sherry-palomino-plantings-001
    type: mcq
    deck: Sherry
    tags: [sherry, grapes, palomino]
    status: reviewed
    source_id: c43-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape covers the great majority of the Sherry vineyard?"
      choices:
        - { text: "Pedro Ximénez", correct: false }
        - { text: "Palomino", correct: true }
        - { text: "Moscatel", correct: false }
        - { text: "Palomino and Pedro Ximénez equally", correct: false }
      explanation: |
        Its main form, Palomino Fino, supplies the base wine for every dry style,
        from fino and manzanilla to amontillado and oloroso.
    fr:
      question: "Quel cépage occupe la très grande majorité du vignoble de Jerez ?"
      choices:
        - { text: "Pedro Ximénez", correct: false }
        - { text: "Palomino", correct: true }
        - { text: "Moscatel", correct: false }
        - { text: "Palomino et Pedro Ximénez à parts égales", correct: false }
      explanation: |
        Sa forme principale, le Palomino Fino, fournit le vin de base de tous les
        styles secs, du Fino et de la Manzanilla à l’Amontillado et à l’Oloroso.

  - id: sherry-palomino-profile-001
    type: mcq
    deck: Sherry
    tags: [sherry, grapes, palomino]
    status: reviewed
    source_id: c43-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is a young, unaged wine made from Palomino usually like?"
      choices:
        - { text: "High in acid, with floral aromas", correct: false }
        - { text: "High in acid, with little aroma", correct: false }
        - { text: "Low in acid, with little aroma", correct: true }
        - { text: "Low in acid, with floral aromas", correct: false }
      explanation: |
        Palomino holds its yield and sugar well in the heat but loses acidity, so
        many producers add tartaric acid to the must.
    fr:
      question: "Comment se présente en général un vin jeune de Palomino, avant tout élevage ?"
      choices:
        - { text: "Acidité élevée, arômes floraux", correct: false }
        - { text: "Acidité élevée, peu d’arômes", correct: false }
        - { text: "Acidité faible, peu d’arômes", correct: true }
        - { text: "Acidité faible, arômes floraux", correct: false }
      explanation: |
        Dans la chaleur, le Palomino garde bien son rendement et son sucre mais perd
        de l’acidité : beaucoup de producteurs ajoutent donc de l’acide tartrique au
        moût.

  - id: sherry-neutral-grape-001
    type: mcq
    deck: Sherry
    tags: [sherry, grapes, maturation]
    status: reviewed
    source_id: c43-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a grape with little flavour of its own suit the making of dry Sherry?"
      choices:
        - { text: "Most flavour comes from ageing, under flor or in air", correct: true }
        - { text: "Its high acidity keeps the wine fresh in cask", correct: false }
        - { text: "Its thick skins add tannin that protects the wine", correct: false }
        - { text: "It ripens late, after the worst of the heat", correct: false }
      explanation: |
        A strong varietal perfume would only blur the yeasty, nutty and savoury
        notes built up over years in the butt.
    fr:
      question: "Pourquoi un cépage peu aromatique convient-il à l’élaboration du xérès sec ?"
      choices:
        - { text: "Le goût naît surtout de l’élevage, sous flor ou à l’air", correct: true }
        - { text: "Sa forte acidité garde le vin frais pendant l’élevage", correct: false }
        - { text: "Ses peaux épaisses donnent des tanins qui protègent le vin", correct: false }
        - { text: "Il mûrit tard, une fois passées les grosses chaleurs", correct: false }
      explanation: |
        Un parfum variétal marqué ne ferait que brouiller les notes de levure, de
        fruits secs et salines qui se construisent au fil des années en bota.

  - id: sherry-px-thin-skin-001
    type: mcq
    deck: Sherry
    tags: [sherry, grapes, pedro-ximenez, sweet]
    status: reviewed
    source_id: c43-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which trait of Pedro Ximénez makes it suitable for drying into raisin-like berries?"
      choices:
        - { text: "Its thick, tough skins", correct: false }
        - { text: "Its high natural acidity", correct: false }
        - { text: "Its tight, compact bunches", correct: false }
        - { text: "Its thin skins", correct: true }
      explanation: |
        Water escapes quickly through a thin skin, so the berries shrivel fast. The
        grape itself has little aroma; the wine's character comes mostly from
        concentration and ageing.
    fr:
      question: "Quelle caractéristique du Pedro Ximénez le rend apte au passerillage, jusqu’à des baies proches du raisin sec ?"
      choices:
        - { text: "Ses peaux épaisses et résistantes", correct: false }
        - { text: "Sa forte acidité naturelle", correct: false }
        - { text: "Ses grappes serrées et compactes", correct: false }
        - { text: "Ses peaux fines", correct: true }
      explanation: |
        L’eau s’échappe vite à travers une peau fine, si bien que les baies se
        flétrissent rapidement. Le cépage lui-même est peu aromatique : le caractère
        du vin vient surtout de la concentration et de l’élevage.

  - id: sherry-px-montilla-001
    type: mcq
    deck: Sherry
    tags: [sherry, grapes, pedro-ximenez]
    status: reviewed
    source_id: c43-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where is much of the Pedro Ximénez used for sweet Sherry grown?"
      choices:
        - { text: "Montilla-Moriles", correct: true }
        - { text: "Condado de Huelva", correct: false }
        - { text: "La Mancha", correct: false }
        - { text: "Jumilla", correct: false }
      explanation: |
        The hotter, drier inland area south of Córdoba suits the grape better than
        Jerez's coastal vineyards, and the rules let Sherry houses use PX from there.
    fr:
      question: "Où pousse une grande partie du Pedro Ximénez destiné au xérès doux ?"
      choices:
        - { text: "Montilla-Moriles", correct: true }
        - { text: "Condado de Huelva", correct: false }
        - { text: "La Manche", correct: false }
        - { text: "Jumilla", correct: false }
      explanation: |
        Plus chaude et plus sèche, cette zone de l’intérieur, au sud de Cordoue,
        convient mieux au cépage que le vignoble côtier de Jerez, et le règlement
        permet aux maisons de Jerez d’utiliser du PX qui en provient.

  - id: sherry-moscatel-role-001
    type: mcq
    deck: Sherry
    tags: [sherry, grapes, moscatel, sweet]
    status: reviewed
    source_id: c43-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the Sherry region, what is Muscat of Alexandria mainly grown for?"
      choices:
        - { text: "Dry, flor-aged wines", correct: false }
        - { text: "Brandy to fortify the young wines", correct: false }
        - { text: "Sweet wines", correct: true }
        - { text: "Adding body to dry oloroso", correct: false }
      explanation: |
        Plantings are small and grouped on the sandy coastal soils around Chipiona,
        whose sweet Moscatel is a local speciality.
    fr:
      question: "Dans la région de Jerez, à quoi sert surtout le muscat d’Alexandrie ?"
      choices:
        - { text: "Aux vins secs élevés sous flor", correct: false }
        - { text: "À l’eau-de-vie qui sert à muter les vins jeunes", correct: false }
        - { text: "Aux vins doux", correct: true }
        - { text: "À donner du corps à l’Oloroso sec", correct: false }
      explanation: |
        Les plantations sont modestes et regroupées sur les sols sableux du littoral
        autour de Chipiona, dont le Moscatel doux est une spécialité locale.

  - id: sherry-harvest-speed-001
    type: mcq
    deck: Sherry
    tags: [sherry, harvest, oxidation]
    status: reviewed
    source_id: c43-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the Sherry region, what is the main risk if picked Palomino waits too long before pressing?"
      choices:
        - { text: "Botrytis spreading through the crates", correct: false }
        - { text: "Oxidation of the juice in the heat", correct: true }
        - { text: "Tannin leaching from the stems", correct: false }
        - { text: "Sugar falling as the berries respire", correct: false }
      explanation: |
        Harvest falls in late August and September, often in strong heat, so some
        houses pick in the cool of the night or early morning and press close to the
        vineyard.
    fr:
      question: "Dans la région de Jerez, quel est le principal risque si le Palomino vendangé attend trop avant le pressurage ?"
      choices:
        - { text: "Le botrytis qui gagne les caisses", correct: false }
        - { text: "L’oxydation du jus sous la chaleur", correct: true }
        - { text: "Les tanins extraits des rafles", correct: false }
        - { text: "La baisse du sucre par respiration des baies", correct: false }
      explanation: |
        Les vendanges ont lieu fin août et en septembre, souvent par forte chaleur :
        certaines maisons récoltent donc la nuit ou au petit matin, à la fraîche, et
        pressent près des vignes.

  - id: sherry-base-wine-vessel-001
    type: mcq
