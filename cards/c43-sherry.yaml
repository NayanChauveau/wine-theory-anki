        The same method also matures Brandy de Jerez and Sherry vinegar (Vinagre de
        Jerez), both protected names from the same corner of Andalusia.
    fr:
      question: "Comment s’appelle le système d’assemblage fractionné qui sert à élever la plupart des xérès ?"
      choices:
        - { text: "Criadera", correct: false }
        - { text: "Añada", correct: false }
        - { text: "Solera", correct: true }
        - { text: "Sobretabla", correct: false }
      explanation: |
        La même méthode sert aussi à élever le Brandy de Jerez et le vinaigre de
        Xérès (Vinagre de Jerez), deux noms protégés du même coin d’Andalousie.

  - id: sherry-solera-direction-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, maturation]
    status: reviewed
    source_id: c43-0054
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a Sherry solera, how does wine move between the groups of butts over time?"
      choices:
        - { text: "From older butts into younger ones, to refresh them", correct: false }
        - { text: "From younger butts into older ones, step by step", correct: true }
        - { text: "It stays in one butt until it reaches its target age", correct: false }
        - { text: "Every butt is emptied and refilled each year", correct: false }
      explanation: |
        Each transfer blends a little younger wine into older wine, so no butt ever
        holds a single harvest. Traditionally the wine is poured in gently through a
        spout so the sediment is not stirred up.
    fr:
      question: "Dans une solera de xérès, comment le vin circule-t-il d’un groupe de botas à l’autre au fil du temps ?"
      choices:
        - { text: "Des botas plus vieilles vers les plus jeunes, pour les rafraîchir", correct: false }
        - { text: "Des botas plus jeunes vers les plus vieilles, étape par étape", correct: true }
        - { text: "Il reste dans une bota jusqu’à atteindre l’âge visé", correct: false }
        - { text: "Chaque bota est vidée puis remplie chaque année", correct: false }
      explanation: |
        Chaque transfert mêle un peu de vin plus jeune à du vin plus vieux, si bien
        qu’aucune bota ne contient une seule récolte. Traditionnellement, on verse le
        vin doucement par un bec verseur pour ne pas remuer les dépôts.

  - id: sherry-solera-oldest-level-001
    type: mcq
