    en:
      question: "Roughly what average age do wines drawn from biological Sherry soleras usually reach?"
      choices:
        - { text: "Around three to four years", correct: true }
        - { text: "Around ten to twelve years", correct: false }
        - { text: "Around twenty to twenty-five years", correct: false }
        - { text: "Around thirty to thirty-five years", correct: false }
      explanation: |
        Older examples exist, sometimes labelled Fino Antiguo, but they are the
        exception rather than the rule.

  - id: sherry-flor-failing-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, solera]
    status: reviewed
    source_id: c43-0078
    review:
