        Its sweetness can range widely, from barely off-dry to clearly sweet,
        so labels alone say little about how sweet a given Medium will taste.
    fr:
      question: "Quel style de xérès doux doit associer un caractère issu de la flor et un caractère oxydatif ?"
      choices:
        - { text: "Pale Cream", correct: false }
        - { text: "Medium", correct: true }
        - { text: "Cream", correct: false }
        - { text: "Pedro Ximénez", correct: false }
      explanation: |
        Sa sucrosité varie beaucoup, du presque sec au franchement doux :
        l’étiquette dit donc peu de chose du niveau de sucre d’un Medium donné.

  - id: sherry-cream-base-001
    type: mcq
    deck: Sherry
    tags: [sherry, cream, ageing]
    status: reviewed
    source_id: c43-0127
