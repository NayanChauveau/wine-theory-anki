        - { text: "Palo Cortado", correct: true }
        - { text: "Moscatel", correct: false }
      explanation: |
        Les autres styles naturellement secs sont le Fino, la Manzanilla,
        l’Amontillado et l’Oloroso. Adoucis par assemblage, ils sont vendus sous le nom de
        Medium ou Cream.

