      question: "On the nose, a Palo Cortado most resembles which other Sherry style?"
      choices:
        - { text: "Fino", correct: false }
        - { text: "Amontillado", correct: true }
        - { text: "Oloroso", correct: false }
        - { text: "Cream", correct: false }
      explanation: |
        Its aromas are fine and sharp rather than broad, which is one reason
        it is hard to identify blind.

  - id: sherry-palo-cortado-palate-001
    type: mcq
    deck: Sherry
