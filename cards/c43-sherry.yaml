        - { text: "Environ dix à douze ans", correct: false }
        - { text: "Environ vingt à vingt-cinq ans", correct: false }
        - { text: "Environ trente à trente-cinq ans", correct: false }
      explanation: |
        Il existe des vins plus âgés, parfois étiquetés Fino Antiguo, mais ils restent
