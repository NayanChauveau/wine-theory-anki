        - { text: "10 ans et 20 ans", correct: false }
        - { text: "5 ans et 10 ans", correct: false }
        - { text: "15 ans et 25 ans", correct: false }
      explanation: |
        Le Porto tawny suit une autre échelle (10, 20, 30 et 40 ans), qu’on
        confond facilement avec celle du xérès.

  - id: sherry-vos-vors-ages-001
