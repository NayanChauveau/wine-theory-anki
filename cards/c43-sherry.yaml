        - { text: "Oloroso and Amontillado", correct: false }
        - { text: "Oloroso and Pedro Ximénez", correct: true }
        - { text: "Manzanilla and Palo Cortado", correct: false }
      explanation: |
        Some Moscatel Sherries are made the same way. Over the years these wines darken
