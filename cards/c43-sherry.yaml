    en:
      question: "Which sweetener is typically used for a Pale Cream Sherry?"
      choices:
        - { text: "Rectified concentrated grape must", correct: true }
        - { text: "Pedro Ximénez wine", correct: false }
        - { text: "Moscatel wine", correct: false }
        - { text: "Cane sugar syrup", correct: false }
      explanation: |
        RCGM is essentially colourless, flavour-neutral grape sugar, so the
        wine stays as pale as the dry wine it was made from.
    fr:
      question: "Avec quoi adoucit-on le plus souvent un Pale Cream ?"
      choices:
        - { text: "Du moût concentré rectifié", correct: true }
        - { text: "Du vin de Pedro Ximénez", correct: false }
        - { text: "Du vin de Moscatel", correct: false }
        - { text: "Du sirop de sucre de canne", correct: false }
      explanation: |
        Le moût concentré rectifié (MCR) est un sucre de raisin presque incolore
        et neutre en goût : le vin reste aussi pâle que le vin sec de départ.

  - id: sherry-pale-cream-flavour-001
    type: mcq
    deck: Sherry
    tags: [sherry, pale-cream, tasting]
    status: reviewed
    source_id: c43-0124
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Leaving sweetness aside, how does a Pale Cream usually differ in flavour from a Fino?"
      choices:
        - { text: "It shows marked raisin and coffee notes", correct: false }
        - { text: "It has pronounced walnut and toffee notes", correct: false }
        - { text: "It rarely shows marked flor character", correct: true }
        - { text: "It has noticeably sharper acidity", correct: false }
      explanation: |
        Producers usually pick a young, simple base wine, and the added sugar
        further hides any bready, tangy notes that remain.
    fr:
      question: "Sucrosité mise à part, en quoi le goût d’un Pale Cream diffère-t-il d’ordinaire de celui d’un Fino ?"
      choices:
        - { text: "Il montre de nettes notes de raisins secs et de café", correct: false }
        - { text: "Il a de fortes notes de noix et de caramel", correct: false }
        - { text: "Le caractère de flor y est rarement marqué", correct: true }
        - { text: "Son acidité est nettement plus vive", correct: false }
      explanation: |
        Les producteurs choisissent en général un vin de base jeune et simple, et
        le sucre ajouté masque encore les notes de pain et le piquant qui
        subsistent.

  - id: sherry-medium-ageing-001
    type: mcq
