        texture is close to syrup.
    fr:
      question: "Quelle teneur en sucres résiduels atteignent à peu près les Pedro Ximénez les plus doux ?"
      choices:
        - { text: "Environ 100 g/L", correct: false }
        - { text: "Environ 250 g/L", correct: false }
        - { text: "Environ 500 g/L", correct: true }
        - { text: "Environ 50 g/L", correct: false }
      explanation: |
        C’est plusieurs fois le sucre d’un Sauternes classique, pour une texture
        proche du sirop.

