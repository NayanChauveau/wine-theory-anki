    en:
      question: "Which pair of Sherries is aged oxidatively from the start, with no time under flor?"
      choices:
        - { text: "Fino and Pedro Ximénez", correct: false }
        - { text: "Oloroso and Amontillado", correct: false }
        - { text: "Oloroso and Pedro Ximénez", correct: true }
        - { text: "Manzanilla and Palo Cortado", correct: false }
      explanation: |
        Some Moscatel Sherries are made the same way. Over the years these wines darken
        from gold towards deep brown.

  - id: sherry-amontillado-ageing-001
    type: mcq
    deck: Sherry
    tags: [sherry, amontillado, ageing]
    status: reviewed
    source_id: c43-0080
    review:
