      question: "Before it is sweetened, what ageing must the wine for a Pale Cream Sherry have undergone?"
      choices:
        - { text: "Oxidative ageing without flor", correct: false }
        - { text: "Oxidative ageing, then a spell under flor", correct: false }
        - { text: "Long ageing in new oak casks", correct: false }
        - { text: "Biological ageing under flor", correct: true }
      explanation: |
        Sweetening comes at the very end, once the wine has left its solera
        and just before it is bottled.
    fr:
      question: "Avant d’être adouci, quel vieillissement le vin de base d’un Pale Cream doit-il avoir suivi ?"
      choices:
        - { text: "Un vieillissement oxydatif, sans flor", correct: false }
        - { text: "Un vieillissement oxydatif, puis sous flor", correct: false }
        - { text: "Un long élevage en fûts de chêne neufs", correct: false }
        - { text: "Un vieillissement biologique sous flor", correct: true }
      explanation: |
        L’édulcoration n’intervient qu’à la toute fin, une fois le vin sorti de
        sa solera, juste avant la mise en bouteille.

  - id: sherry-pale-cream-sweetener-001
    type: mcq
    deck: Sherry
    tags: [sherry, pale-cream, sweetening]
    status: reviewed
    source_id: c43-0122
    review:
