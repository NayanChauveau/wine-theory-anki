    en:
      question: "What allows a Fino-style Sherry to be sold as Manzanilla?"
      choices:
        - { text: "Maturing it in Sanlúcar de Barrameda", correct: true }
        - { text: "Maturing it in El Puerto de Santa María", correct: false }
        - { text: "Making it from a grape called Manzanilla", correct: false }
        - { text: "Growing the grapes in coastal vineyards", correct: false }
      explanation: |
        Manzanilla has its own designation, Manzanilla-Sanlúcar de Barrameda, separate
        from Jerez-Xérès-Sherry, even though the grapes can come from across the wider
        zone.
    fr:
      question: "Qu’est-ce qui permet de vendre un xérès de type Fino sous le nom de Manzanilla ?"
      choices:
        - { text: "Son élevage à Sanlúcar de Barrameda", correct: true }
        - { text: "Son élevage à El Puerto de Santa María", correct: false }
        - { text: "Un cépage appelé Manzanilla", correct: false }
        - { text: "Des raisins issus de vignes côtières", correct: false }
      explanation: |
        La Manzanilla a sa propre appellation,
        Manzanilla-Sanlúcar de Barrameda, distincte de Jerez-Xérès-Sherry, même si
        les raisins peuvent provenir de toute la zone.

  - id: sherry-manzanilla-flor-001
    type: mcq
    deck: Sherry
    tags: [sherry, manzanilla, flor]
    status: reviewed
    source_id: c43-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does the damp sea air of Sanlúcar do to the flor on Manzanilla?"
      choices:
        - { text: "Kills it off each summer", correct: false }
        - { text: "Keeps it thick all year", correct: true }
        - { text: "Turns it dark and patchy", correct: false }
        - { text: "Has no effect compared with Jerez", correct: false }
      explanation: |
        Grapes, pressing and fermentation are the same as for Fino. Sanlúcar sits at the
        mouth of the Guadalquivir, where the estuary and the Atlantic keep the air mild
        and moist.
    fr:
      question: "Quel effet l’air marin humide de Sanlúcar a-t-il sur la flor de la Manzanilla ?"
      choices:
        - { text: "Il la tue chaque été", correct: false }
        - { text: "Il la garde épaisse toute l’année", correct: true }
        - { text: "Il la rend sombre et irrégulière", correct: false }
        - { text: "Il n’a pas plus d’effet qu’à Jerez", correct: false }
      explanation: |
        Raisins, pressurage et fermentation sont les mêmes que pour le Fino. Sanlúcar
        se trouve à l’embouchure du Guadalquivir, où l’estuaire et l’Atlantique
        gardent l’air doux et humide.

  - id: sherry-manzanilla-tang-001
    type: mcq
    deck: Sherry
    tags: [sherry, manzanilla, tasting]
    status: reviewed
    source_id: c43-0099
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with Fino, how does Manzanilla typically differ in the glass?"
      choices:
        - { text: "Darker colour and nuttier notes", correct: false }
        - { text: "A sharper, more pronounced salty tang", correct: true }
        - { text: "Fuller body and a hint of sweetness", correct: false }
        - { text: "Higher alcohol and more oak flavour", correct: false }
      explanation: |
        Tasters often call both styles tangy or even salty, though the impression comes
        largely from flor-derived compounds rather than from salt in the wine.
    fr:
      question: "Par rapport au Fino, en quoi la Manzanilla diffère-t-elle en général dans le verre ?"
      choices:
        - { text: "Robe plus foncée, notes de noix plus nettes", correct: false }
        - { text: "Une note saline plus vive et plus marquée", correct: true }
        - { text: "Plus de corps et une pointe de sucre", correct: false }
        - { text: "Plus d’alcool et un goût plus boisé", correct: false }
      explanation: |
        On qualifie souvent les deux styles de vins iodés, voire salins, mais cette
        impression vient surtout de composés issus de la flor plutôt que du sel
        contenu dans le vin.

