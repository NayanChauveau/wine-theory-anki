    fr:
      question: "Quels styles de xérès peuvent prétendre à une mention d’âge comme VOS ou 12 ans ?"
      choices:
        - { text: "Fino, Manzanilla, Amontillado et Oloroso", correct: false }
        - { text: "Fino, Palo Cortado, Amontillado et Pale Cream", correct: false }
        - { text: "Oloroso, Manzanilla, Moscatel et PX", correct: false }
        - { text: "Amontillado, Palo Cortado, Oloroso et PX", correct: true }
      explanation: |
        Ces mentions récompensent un long vieillissement oxydatif, hors de portée
        des styles protégés par la flor. L’Amontillado del Duque de González Byass,
        par exemple, est vendu en VORS.

  - id: sherry-bodega-humidity-001
    type: mcq
    deck: Sherry
    tags: [sherry, bodega, maturation]
    status: reviewed
    source_id: c43-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is the humidity raised each day in a traditional Jerez bodega?"
      choices:
        - { text: "By sealing the windows against sea breezes", correct: false }
        - { text: "By sprinkling water on the earth floors", correct: true }
        - { text: "By setting open tubs of water between the rows", correct: false }
        - { text: "By hanging wet esparto mats over the windows", correct: false }
      explanation: |
        The floors are beaten earth or compacted sand (albero), so the water soaks in
        and rises back into the air as it evaporates over the following hours.
    fr:
      question: "Chaque jour, comment augmente-t-on l’humidité dans une bodega traditionnelle de Jerez ?"
      choices:
        - { text: "En fermant les fenêtres aux brises marines", correct: false }
        - { text: "En arrosant le sol de terre battue", correct: true }
        - { text: "En plaçant des bacs d’eau entre les rangées", correct: false }
        - { text: "En pendant des nattes d’alfa mouillées aux fenêtres", correct: false }
      explanation: |
        Le sol est en terre battue ou en sable tassé (albero) : l’eau s’y infiltre,
        puis remonte dans l’air en s’évaporant au fil des heures.

  - id: sherry-bodega-cooling-001
    type: mcq
    deck: Sherry
    tags: [sherry, bodega, maturation]
    status: reviewed
    source_id: c43-0052
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides traditional building design, what do many modern Jerez bodegas rely on to keep the wine cool?"
      choices:
        - { text: "Cooling jackets around each butt", correct: false }
        - { text: "Cellars dug deep below ground", correct: false }
        - { text: "Chilled water piped under the floors", correct: false }
        - { text: "Air conditioning", correct: true }
      explanation: |
        Steady, moderate temperatures slow losses from the butts, and hotter summers
        have made mechanical cooling a common addition in Andalusia.
    fr:
      question: "Outre l’architecture traditionnelle, sur quoi de nombreuses bodegas modernes de Jerez comptent-elles pour garder le vin au frais ?"
      choices:
        - { text: "Des ceintures de refroidissement autour des botas", correct: false }
        - { text: "Des chais creusés profondément sous terre", correct: false }
        - { text: "De l’eau glacée circulant sous le sol", correct: false }
        - { text: "La climatisation", correct: true }
      explanation: |
        Des températures stables et modérées limitent les pertes par évaporation
        des botas, et des étés plus chauds ont fait du refroidissement mécanique un
        ajout courant en Andalousie.

  - id: sherry-solera-name-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, maturation]
    status: reviewed
