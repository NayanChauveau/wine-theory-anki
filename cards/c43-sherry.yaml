      choices:
        - { text: "Bready, yeasty flor notes", correct: false }
        - { text: "Dried citrus peel", correct: true }
        - { text: "Toasty vanilla from new oak", correct: false }
        - { text: "Salty, tangy sea-air notes", correct: false }
      explanation: |
        Muscat of Alexandria is aromatic enough that some of its varietal,
        orange-peel character survives drying and long oxidative ageing.

  - id: sherry-pale-cream-ageing-001
    type: mcq
    deck: Sherry
    tags: [sherry, pale-cream, ageing]
    status: reviewed
    source_id: c43-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Before it is sweetened, what ageing must the wine for a Pale Cream Sherry have undergone?"
      choices:
        - { text: "Oxidative ageing without flor", correct: false }
        - { text: "Oxidative ageing, then a spell under flor", correct: false }
        - { text: "Long ageing in new oak casks", correct: false }
        - { text: "Biological ageing under flor", correct: true }
      explanation: |
        Sweetening comes at the very end, once the wine has left its solera
        and just before it is bottled.

  - id: sherry-pale-cream-sweetener-001
    type: mcq
    deck: Sherry
    tags: [sherry, pale-cream, sweetening]
    status: reviewed
    source_id: c43-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sweetener is typically used for a Pale Cream Sherry?"
      choices:
        - { text: "Rectified concentrated grape must", correct: true }
        - { text: "Pedro Ximénez wine", correct: false }
        - { text: "Moscatel wine", correct: false }
        - { text: "Cane sugar syrup", correct: false }
      explanation: |
        RCGM is essentially colourless, flavour-neutral grape sugar, so the
        wine stays as pale as the dry wine it was made from.

  - id: sherry-pale-cream-flavour-001
    type: mcq
    deck: Sherry
    tags: [sherry, pale-cream, tasting]
    status: reviewed
    source_id: c43-0124
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Leaving sweetness aside, how does a Pale Cream usually differ in flavour from a Fino?"
      choices:
        - { text: "It shows marked raisin and coffee notes", correct: false }
        - { text: "It has pronounced walnut and toffee notes", correct: false }
        - { text: "It rarely shows marked flor character", correct: true }
        - { text: "It has noticeably sharper acidity", correct: false }
      explanation: |
        Producers usually pick a young, simple base wine, and the added sugar
        further hides any bready, tangy notes that remain.

  - id: sherry-medium-ageing-001
    type: mcq
    deck: Sherry
    tags: [sherry, medium, ageing]
    status: reviewed
    source_id: c43-0126
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sweet Sherry style is expected to combine flor-derived and oxidative character?"
      choices:
        - { text: "Pale Cream", correct: false }
        - { text: "Medium", correct: true }
        - { text: "Cream", correct: false }
        - { text: "Pedro Ximénez", correct: false }
      explanation: |
        Its sweetness can range widely, from barely off-dry to clearly sweet,
        so labels alone say little about how sweet a given Medium will taste.

  - id: sherry-cream-base-001
    type: mcq
    deck: Sherry
    tags: [sherry, cream, ageing]
    status: reviewed
    source_id: c43-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In ageing terms, what kind of dry wine forms the base of a Cream Sherry?"
      choices:
        - { text: "Wine aged under flor throughout", correct: false }
        - { text: "Wine aged under flor, then oxidatively", correct: false }
        - { text: "Young wine with no cask ageing", correct: false }
        - { text: "Wine aged oxidatively, without flor", correct: true }
      explanation: |
        Harveys Bristol Cream, launched in the late 19th century, made the
        style famous in the British market. Under current rules a sweetened
        Oloroso blend can no longer use the Oloroso name; it is sold as a Cream.

  - id: sherry-cream-sweetening-001
    type: mcq
    deck: Sherry
    tags: [sherry, cream, sweetening]
    status: reviewed
    source_id: c43-0128
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is a Cream Sherry usually sweetened?"
      choices:
        - { text: "By blending in Pedro Ximénez wine", correct: true }
        - { text: "By stopping fermentation early with spirit", correct: false }
        - { text: "By adding cane sugar before bottling", correct: false }
        - { text: "By sun-drying the Palomino grapes", correct: false }
      explanation: |
        The sweet wine is often added after ageing, when components are
        blended to the house style, so the sweetness level can be set
        precisely for each brand.

  - id: sherry-cream-best-balance-001
    type: mcq
    deck: Sherry
    tags: [sherry, cream, medium, tasting]
    status: reviewed
    source_id: c43-0129
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What marks the finest Medium and Cream Sherries in the glass?"
      choices:
        - { text: "Fresh citrus fruit lifted by tangy flor notes", correct: false }
        - { text: "Fresh grapey fruit with a floral lift", correct: false }
        - { text: "Nutty oxidative notes woven into dried fruit", correct: true }
        - { text: "Sweetness strong enough to mask the dry wine", correct: false }
      explanation: |
        The category spans everything from inexpensive supermarket blends to
        super-premium bottlings built on very old wines.

  - id: sherry-cream-cheap-fault-001
    type: mcq
    deck: Sherry
    tags: [sherry, cream, quality]
    status: reviewed
    source_id: c43-0130
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the usual weakness of inexpensive Cream Sherries?"
      choices:
        - { text: "Sharp, vinegary volatile acidity", correct: false }
        - { text: "Cloying sweetness and little complexity", correct: true }
        - { text: "Bitter tannins from new oak", correct: false }
        - { text: "An overpowering bready flor character", correct: false }
      explanation: |
        A young, simple base gives the sugar little flavour to push against,
        so sweetness dominates the finish.

  - id: sherry-age-12-15-001
    type: mcq
    deck: Sherry
    tags: [sherry, age-indicated, labelling]
    status: reviewed
    source_id: c43-0133
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides VOS and VORS, which two age statements can a Sherry carry?"
      choices:
        - { text: "12 Years Old and 15 Years Old", correct: true }
        - { text: "10 Years Old and 20 Years Old", correct: false }
        - { text: "5 Years Old and 10 Years Old", correct: false }
        - { text: "15 Years Old and 25 Years Old", correct: false }
      explanation: |
        Tawny Port uses a different ladder (10, 20, 30 and 40 Years Old),
        which is easy to mix up with Sherry's.

  - id: sherry-vos-vors-ages-001
    type: mcq
    deck: Sherry
    tags: [sherry, age-indicated, labelling]
    status: reviewed
    source_id: c43-0134
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What minimum average ages do VOS and VORS Sherries require, respectively?"
      choices:
        - { text: "15 and 25 years", correct: false }
        - { text: "12 and 20 years", correct: false }
        - { text: "20 and 30 years", correct: true }
        - { text: "30 and 40 years", correct: false }
      explanation: |
        The initials come from Latin and English at once: Vinum Optimum
        Signatum / Very Old Sherry, and Vinum Optimum Rare Signatum / Very Old
        Rare Sherry.

  - id: sherry-age-solera-approval-001
    type: mcq
    deck: Sherry
    tags: [sherry, age-indicated, solera]
    status: reviewed
    source_id: c43-0135
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is approval for 12 Years Old or 15 Years Old Sherry granted?"
      choices:
        - { text: "Per vintage, from a harvest declaration", correct: false }
        - { text: "For a whole solera system at once", correct: true }
        - { text: "Batch by batch, after tasting and analysis", correct: false }
        - { text: "From the age of the oldest wine in the blend", correct: false }
      explanation: |
        That gives producers more flexibility. VOS and VORS are stricter:
        each batch is tasted and analysed before it can use the claim.

  - id: sherry-age-eligible-styles-001
    type: mcq
    deck: Sherry
    tags: [sherry, age-indicated, styles]
    status: reviewed
    source_id: c43-0136
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which set of Sherry styles can qualify for an age indication such as VOS or 12 Years Old?"
      choices:
        - { text: "Fino, Manzanilla, Amontillado and Oloroso", correct: false }
        - { text: "Fino, Palo Cortado, Amontillado and Pale Cream", correct: false }
        - { text: "Oloroso, Manzanilla, Moscatel and PX", correct: false }
        - { text: "Amontillado, Palo Cortado, Oloroso and PX", correct: true }
      explanation: |
        The age claims reward long oxidative ageing, which flor-protected styles
        cannot reach. González Byass's Amontillado del Duque, for instance, is
        sold as VORS.

  - id: sherry-bodega-humidity-001
    type: mcq
    deck: Sherry
    tags: [sherry, bodega, maturation]
    status: reviewed
    source_id: c43-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What daily cellar task raises the humidity in a traditional Jerez bodega?"
      choices:
        - { text: "By sealing the windows against sea breezes", correct: false }
        - { text: "By sprinkling water on the earth floors", correct: true }
        - { text: "By setting open tubs of water between the rows", correct: false }
        - { text: "By hanging wet esparto mats over the windows", correct: false }
      explanation: |
        The floors are beaten earth or compacted sand (albero), so the water soaks in
        and rises back into the air as it evaporates over the following hours.

  - id: sherry-bodega-cooling-001
    type: mcq
    deck: Sherry
    tags: [sherry, bodega, maturation]
    status: reviewed
    source_id: c43-0052
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides traditional building design, what do many modern Jerez bodegas rely on to keep the wine cool?"
      choices:
        - { text: "Cooling jackets around each butt", correct: false }
        - { text: "Cellars dug deep below ground", correct: false }
        - { text: "Chilled water piped under the floors", correct: false }
        - { text: "Air conditioning", correct: true }
      explanation: |
        Steady, moderate temperatures slow losses from the butts, and hotter summers
        have made mechanical cooling a common addition in Andalusia.

  - id: sherry-solera-name-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, maturation]
    status: reviewed
    source_id: c43-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the name of the fractional blending system used to mature most Sherry?"
      choices:
        - { text: "Criadera", correct: false }
        - { text: "Añada", correct: false }
        - { text: "Solera", correct: true }
        - { text: "Sobretabla", correct: false }
      explanation: |
        The same method also matures Brandy de Jerez and Sherry vinegar (Vinagre de
        Jerez), both protected names from the same corner of Andalusia.

  - id: sherry-solera-direction-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, maturation]
    status: reviewed
    source_id: c43-0054
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a Sherry solera, how does wine move between the groups of butts over time?"
      choices:
        - { text: "From older butts into younger ones, to refresh them", correct: false }
        - { text: "From younger butts into older ones, step by step", correct: true }
        - { text: "It stays in one butt until it reaches its target age", correct: false }
        - { text: "Every butt is emptied and refilled each year", correct: false }
      explanation: |
        Each transfer blends a little younger wine into older wine, so no butt ever
        holds a single harvest. Traditionally the wine is poured in gently through a
        spout so the sediment is not stirred up.

  - id: sherry-solera-oldest-level-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, criadera]
    status: reviewed
    source_id: c43-0055
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In traditional Sherry cellar terms, which level of butts is called the solera itself?"
      choices:
        - { text: "The level with the youngest average age", correct: false }
        - { text: "The middle level of the stack", correct: false }
        - { text: "The level with the oldest average age", correct: true }
        - { text: "The level with the strongest flor", correct: false }
      explanation: |
        The word is usually traced to suelo, Spanish for floor, because the oldest butts
        traditionally sat on the bottom row. Every level above it is a criadera.

  - id: sherry-saca-equal-share-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, saca]
    status: reviewed
    source_id: c43-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When wine is drawn from the oldest level of a Sherry solera for bottling, how is it taken?"
      choices:
        - { text: "A full butt at a time, which is then refilled", correct: false }
        - { text: "An equal part from each butt in that level", correct: true }
        - { text: "Only from the butts that taste best that year", correct: false }
        - { text: "Most of every butt, leaving just the lees", correct: false }
      explanation: |
        The withdrawal is called the saca. Taking the same share from every butt keeps
        the blend even, and no butt in the level is ever fully emptied.

  - id: sherry-criadera-count-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, criadera]
    status: reviewed
    source_id: c43-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How many criaderas does a Sherry solera have?"
      choices:
        - { text: "Always three, fixed by the DO rules", correct: false }
        - { text: "It varies, from one or two to over a dozen", correct: true }
        - { text: "One for each year of average age", correct: false }
        - { text: "At least twenty in every solera", correct: false }
      explanation: |
        Manzanilla soleras tend to have the most levels, while some Oloroso and Pedro
        Ximénez soleras have only a few.

  - id: sherry-average-age-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, age]
    status: reviewed
    source_id: c43-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can most Sherry state only an average age rather than a single harvest year?"
      choices:
        - { text: "Spanish rules ban harvest years on fortified wines", correct: false }
        - { text: "Each bottling blends wines of many ages", correct: true }
        - { text: "Flor makes a wine's true age impossible to measure", correct: false }
        - { text: "Fortification masks the character of each harvest", correct: false }
      explanation: |
        Rare vintage-dated Sherries (añadas) do exist. They are kept out of the solera
        and aged statically in their own butts.

  - id: sherry-solera-consistency-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, consistency]
    status: reviewed
    source_id: c43-0059
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main commercial benefit of maturing Sherry in a solera?"
      choices:
        - { text: "A house can bottle the same style year after year", correct: true }
        - { text: "Each bottling shows the character of its harvest", correct: false }
        - { text: "The wine reaches market within months of harvest", correct: false }
        - { text: "It removes the need to fortify the wine", correct: false }
      explanation: |
        A bottle sold today tastes much like one sold a decade ago. Big brands such as
        Harveys Bristol Cream depend on that continuity.

  - id: sherry-solera-disruption-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, consistency]
    status: reviewed
    source_id: c43-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which practice is most likely to disrupt the consistency of a Sherry solera?"
      choices:
        - { text: "Using old, well-seasoned oak butts", correct: false }
        - { text: "Storing the butts in above-ground bodegas", correct: false }
        - { text: "Feeding it with new wine of lower quality", correct: true }
        - { text: "Moving wine between levels by hand", correct: false }
      explanation: |
        Drawing off too large a share each year does similar harm: the younger wine then
        dominates and the house style drifts.

  - id: sherry-criadera-buildings-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, bodega]
    status: reviewed
    source_id: c43-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do Sherry houses often keep the levels of one solera in separate buildings?"
      choices:
        - { text: "To limit the damage from a single disaster", correct: true }
        - { text: "To keep young and old wine at different temperatures", correct: false }
        - { text: "To stop flor spreading from one level to another", correct: false }
        - { text: "To meet a rule that each level be stored apart", correct: false }
      explanation: |
        A solera can take decades to build, so losing every level at once could not be
        undone. Spreading the levels confines a fire, roof collapse or flood to part of
        the system.

  - id: sherry-biological-flor-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, biological-ageing]
    status: reviewed
    source_id: c43-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Sherry, what does the ageing known as 'biological' depend on?"
      choices:
        - { text: "Lactic bacteria converting the acids", correct: false }
        - { text: "Long contact with the grape skins", correct: false }
        - { text: "Noble rot on the harvested grapes", correct: false }
        - { text: "A film of yeast growing on the wine", correct: true }
      explanation: |
        This film, called flor, is not a single organism but a mix of several
        Saccharomyces yeast strains, some of them close relatives of ordinary
        fermentation yeasts.

  - id: sherry-flor-position-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, biological-ageing]
    status: reviewed
    source_id: c43-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does flor grow in a butt of maturing Fino?"
      choices:
        - { text: "As a sediment at the bottom of the butt", correct: false }
        - { text: "Within the pores of the oak staves", correct: false }
        - { text: "As a layer on the surface of the wine", correct: true }
        - { text: "Suspended evenly through the wine", correct: false }
      explanation: |
        It looks like a pale, creamy, wrinkled crust. When it thins, patches of bare
        wine show through.

  - id: sherry-flor-acetaldehyde-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, biological-ageing, acetaldehyde]
    status: reviewed
    source_id: c43-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which flor by-product is chiefly behind the distinctive aroma of biologically aged Sherry?"
      choices:
        - { text: "Ethyl acetate", correct: false }
        - { text: "Diacetyl", correct: false }
        - { text: "Acetic acid", correct: false }
        - { text: "Acetaldehyde", correct: true }
      explanation: |
        Flor also gives off carbon dioxide and uses up much of the wine's glycerol,
        which helps explain why a Fino feels so light and dry.

  - id: sherry-butt-position-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, bodega]
    status: reviewed
    source_id: c43-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can two butts of the same biological Sherry in one bodega develop differently?"
      choices:
        - { text: "Each butt is made from a different oak species", correct: false }
        - { text: "Some butts are newer and give more oak flavour", correct: false }
        - { text: "Their spot in the cellar changes the conditions", correct: true }
        - { text: "Each butt carries its own added yeast culture", correct: false }
      explanation: |
        Butts near the floor, doors or windows sit in slightly different temperature and
        humidity, so the flor grows thicker in some than others. Cellar masters taste
        butt by butt for this reason.

  - id: sherry-flor-conditions-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, bodega]
    status: reviewed
    source_id: c43-0070
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cellar conditions suit flor best?"
      choices:
        - { text: "Mild temperatures and humid air", correct: true }
        - { text: "Warm temperatures and dry air", correct: false }
        - { text: "Cold temperatures and dry air", correct: false }
        - { text: "Hot temperatures and humid air", correct: false }
      explanation: |
        Flor yeasts need air and are sensitive: heat stresses them, and dry air speeds
        evaporation from the butt, upsetting the balance the film depends on.

  - id: sherry-flor-season-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, seasons]
    status: reviewed
    source_id: c43-0071
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Jerez bodegas, at which times of year is the flor film at its thickest?"
      choices:
        - { text: "Summer and winter", correct: false }
        - { text: "Summer and autumn", correct: false }
        - { text: "Winter and spring", correct: false }
        - { text: "Spring and autumn", correct: true }
      explanation: |
        In the other two seasons the film thins and may partly die back before
        recovering, so its thickness rises and falls through the year.

  - id: sherry-flor-protection-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, oxidation]
    status: reviewed
    source_id: c43-0074
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a Fino stay pale after years in cask?"
      choices:
        - { text: "Its flor film shields it from oxygen", correct: true }
        - { text: "Its butts are rinsed out every year", correct: false }
        - { text: "Its high alcohol bleaches the colour", correct: false }
        - { text: "Its spirit is added only after ageing", correct: false }
      explanation: |
        The yeast takes up oxygen before it reaches the wine, so the browning that marks
        oxidative styles never gets under way while the film stays intact.

  - id: sherry-flor-refresh-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, solera]
    status: reviewed
    source_id: c43-0075
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why must a biological Sherry solera be refreshed with younger wine at regular intervals?"
      choices:
        - { text: "To replace sweetness the flor has removed", correct: false }
        - { text: "To top the butts right up to the bung", correct: false }
        - { text: "To feed the flor, which uses up its nutrients", correct: true }
        - { text: "To restore colour lost during ageing", correct: false }
      explanation: |
        In some Manzanilla soleras small transfers are made several times a year to keep
        the film going.

  - id: sherry-fino-drink-young-001
    type: mcq
    deck: Sherry
    tags: [sherry, fino, serving]
    status: reviewed
    source_id: c43-0076
    review:
