      sources: [known-fact]
    en:
      question: "Which aroma set is typical of a Pedro Ximénez Sherry?"
      choices:
        - { text: "Raisin, coffee and liquorice", correct: true }
        - { text: "Almond, bread dough and lemon", correct: false }
        - { text: "Apricot, marmalade and honey", correct: false }
        - { text: "Hazelnut, yeast and green apple", correct: false }
      explanation: |
        The wine is deep brown and syrupy; it is often poured over vanilla ice
        cream, where it works almost as a sauce.

  - id: sherry-px-sugar-001
    type: mcq
