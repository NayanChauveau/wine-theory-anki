        - { text: "About 11–12% abv", correct: true }
        - { text: "About 13.5–14% abv", correct: false }
        - { text: "About 16–17% abv", correct: false }
      explanation: |
        The wine is fermented fully dry; added spirit later lifts it to the strength
        chosen for its ageing path.
    fr:
      question: "Avant le mutage, quel degré atteint à peu près le vin de base d’un xérès sec ?"
      choices:
        - { text: "Environ 8–9 % vol.", correct: false }
        - { text: "Environ 11–12 % vol.", correct: true }
        - { text: "Environ 13,5–14 % vol.", correct: false }
        - { text: "Environ 16–17 % vol.", correct: false }
      explanation: |
        Le vin fermente jusqu’à sec ; l’eau-de-vie de vin ajoutée ensuite le porte
        au degré choisi pour son mode d’élevage.

  - id: sherry-first-classification-001
    type: mcq
    deck: Sherry
    tags: [sherry, classification]
    status: reviewed
    source_id: c43-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the autumn after harvest, what is the first classification of new Sherry wines for?"
      choices:
        - { text: "Deciding which go to biological or oxidative ageing", correct: true }
        - { text: "Deciding which will be sweetened or kept dry", correct: false }
        - { text: "Deciding which will be vintage-dated or go to a solera", correct: false }
        - { text: "Deciding which town's bodegas will age them", correct: false }
      explanation: |
        Tasters judge each tank or butt and chalk their verdict on it, so the cellar
        team knows where each wine goes next.
    fr:
      question: "À l’automne qui suit les vendanges, à quoi sert la première classification des vins nouveaux de Jerez ?"
      choices:
        - { text: "À choisir entre vieillissement biologique et oxydatif", correct: true }
        - { text: "À choisir lesquels seront adoucis et lesquels resteront secs", correct: false }
        - { text: "À choisir entre vin millésimé et passage en solera", correct: false }
        - { text: "À choisir la ville dont les bodegas les élèveront", correct: false }
      explanation: |
        Les dégustateurs jugent chaque cuve ou chaque bota et y notent leur verdict
        à la craie : l’équipe du chai sait ainsi où envoyer chaque vin.

  - id: sherry-flor-selection-001
    type: mcq
    deck: Sherry
    tags: [sherry, classification, flor]
    status: reviewed
    source_id: c43-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At the first classification, which new Sherry wines are usually chosen for ageing under flor?"
      choices:
        - { text: "The darkest, fullest-bodied wines", correct: false }
        - { text: "Wines from the harder final pressings", correct: false }
        - { text: "The wines with the most natural alcohol", correct: false }
        - { text: "The palest, most delicate wines", correct: true }
      explanation: |
        Free-run and lightly pressed juice tends to give this finer wine; heavier
        wine from firmer pressing is steered towards oxidative ageing.
    fr:
      question: "Lors de la première classification, quels vins nouveaux réserve-t-on en général au vieillissement sous voile de flor ?"
      choices:
        - { text: "Les plus foncés et les plus corsés", correct: false }
        - { text: "Ceux des dernières presses, les plus poussées", correct: false }
        - { text: "Ceux qui ont le plus d’alcool naturel", correct: false }
        - { text: "Les plus pâles et les plus délicats", correct: true }
      explanation: |
        Le jus de goutte et les jus peu pressés donnent en général ces vins plus
        fins ; les vins plus lourds, issus de pressurages plus poussés, partent vers
        le vieillissement oxydatif.

  - id: sherry-flor-onset-001
    type: mcq
    deck: Sherry
    tags: [sherry, classification, flor]
    status: reviewed
    source_id: c43-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When does flor usually first appear on young Sherry wines?"
      choices:
        - { text: "Once the wine is fortified", correct: false }
        - { text: "Soon after fermentation ends", correct: true }
        - { text: "Once the wine enters a solera", correct: false }
        - { text: "In spring, after the sobretabla rest", correct: false }
      explanation: |
        Flor yeasts live in the bodegas and on cellar equipment, so a film often
        forms on the young, still unfortified wine within weeks. Tasters can already
        judge it when they classify.
    fr:
      question: "Quand la flor apparaît-elle en général pour la première fois sur les jeunes vins de Jerez ?"
      choices:
        - { text: "Une fois le vin muté", correct: false }
        - { text: "Peu après la fin de la fermentation", correct: true }
        - { text: "Une fois le vin entré en solera", correct: false }
        - { text: "Au printemps, après le repos en sobretabla", correct: false }
      explanation: |
        Les levures de flor vivent dans les bodegas et sur le matériel du chai : un
        voile se forme souvent en quelques semaines sur le vin jeune, pas encore
        muté. Les dégustateurs peuvent déjà en juger lors de la classification.

  - id: sherry-house-style-criteria-001
    type: mcq
    deck: Sherry
    tags: [sherry, classification]
    status: reviewed
    source_id: c43-0029
    review:
      fact_check: pass
