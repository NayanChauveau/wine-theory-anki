      question: "Que se passe-t-il en général pour un xérès biologique dont l’âge moyen ne cesse d’augmenter ?"
      choices:
        - { text: "La flor s’épaissit et le vin pâlit", correct: false }
        - { text: "Le vin refermente et gagne en alcool", correct: false }
        - { text: "Les levures, en se décomposant, apportent du sucre", correct: false }
        - { text: "La flor faiblit et des notes oxydatives naissent", correct: true }
      explanation: |
        Le voile se morcelle et laisse voir des plaques de vin à nu, tandis que la
        couleur fonce peu à peu, du jaune citron pâle vers l’or.

  - id: sherry-oxidative-styles-001
    type: mcq
    deck: Sherry
