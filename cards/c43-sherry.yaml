        - { text: "Young wine with no cask ageing", correct: false }
        - { text: "Wine aged oxidatively, without flor", correct: true }
      explanation: |
        Harveys Bristol Cream, launched in the late 19th century, made the
        style famous in the British market. Under current rules a sweetened
        Oloroso blend can no longer use the Oloroso name; it is sold as a Cream.
    fr:
      question: "Sur le plan du vieillissement, quel vin sec sert de base à un xérès Cream ?"
      choices:
        - { text: "Un vin élevé sous flor de bout en bout", correct: false }
        - { text: "Un vin élevé sous flor, puis oxydatif", correct: false }
        - { text: "Un vin jeune, sans passage en fût", correct: false }
        - { text: "Un vin oxydatif, élevé sans flor", correct: true }
      explanation: |
        Le Harveys Bristol Cream, lancé à la fin du XIXe siècle, a rendu le style
        célèbre sur le marché britannique. Selon les règles actuelles, un
        assemblage d’Oloroso adouci ne peut plus porter le nom Oloroso : il est
        vendu comme Cream.

  - id: sherry-cream-sweetening-001
    type: mcq
