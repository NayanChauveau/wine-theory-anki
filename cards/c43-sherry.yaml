        - { text: "By adding cane sugar before bottling", correct: false }
        - { text: "By sun-drying the Palomino grapes", correct: false }
      explanation: |
        The sweet wine is often added after ageing, when components are
        blended to the house style, so the sweetness level can be set
        precisely for each brand.
    fr:
      question: "Comment adoucit-on en général un xérès Cream ?"
      choices:
        - { text: "En y assemblant du Pedro Ximénez", correct: true }
        - { text: "En mutant tôt pour arrêter la fermentation", correct: false }
        - { text: "En ajoutant du sucre de canne avant la mise", correct: false }
        - { text: "En passerillant le Palomino au soleil", correct: false }
      explanation: |
        Le vin doux est souvent ajouté après le vieillissement, au moment de
        l’assemblage selon le style de la maison : le niveau de sucre peut ainsi
        être réglé avec précision pour chaque marque.

