      question: "What tends to happen to a biological Sherry as its average age keeps rising?"
      choices:
        - { text: "The flor thickens and the wine grows paler", correct: false }
        - { text: "The wine starts to referment and gains alcohol", correct: false }
        - { text: "The yeast adds sweetness as it breaks down", correct: false }
        - { text: "The flor weakens and oxidative notes appear", correct: true }
      explanation: |
        Patches of bare wine appear as the film breaks up, and the colour slowly
        deepens from pale lemon towards gold.
