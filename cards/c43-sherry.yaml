      choices:
        - { text: "About 17% abv", correct: true }
        - { text: "About 14% abv", correct: false }
        - { text: "About 20% abv", correct: false }
        - { text: "About 22% abv", correct: false }
      explanation: |
        At this level the wine is protected from spoilage and ages in contact with
        air, slowly darkening and concentrating.

  - id: sherry-flor-alcohol-limit-001
    type: mcq
    deck: Sherry
    tags: [sherry, fortification, flor]
    status: reviewed
    source_id: c43-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does fortifying a young Sherry to a high strength stop biological ageing?"
      choices:
        - { text: "The spirit strips oxygen from the wine", correct: false }
        - { text: "The spirit raises the wine's acidity", correct: false }
        - { text: "The spirit removes nutrients the yeast need", correct: false }
        - { text: "The extra alcohol kills the flor yeast", correct: true }
      explanation: |
        The film is a living yeast colony with a limited tolerance for alcohol.
        Producers use this on purpose to send a wine down the oxidative path.

  - id: sherry-sweet-drying-001
