      choices:
        - { text: "About 100 g/L", correct: false }
        - { text: "About 250 g/L", correct: false }
        - { text: "About 500 g/L", correct: true }
        - { text: "About 50 g/L", correct: false }
      explanation: |
        That is several times the sugar of a typical Sauternes, and the
        texture is close to syrup.

  - id: sherry-moscatel-citrus-001
    type: mcq
