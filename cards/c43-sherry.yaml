    en:
      question: "For naturally sweet Sherry, how are the grapes usually concentrated?"
      choices:
        - { text: "Left to shrivel on the vine", correct: false }
        - { text: "Dried in the sun on mats after picking", correct: true }
        - { text: "Dried indoors on racks through the winter", correct: false }
        - { text: "Concentrated by noble rot in misty autumns", correct: false }
      explanation: |
        The drying, called soleo, takes a week or more on esparto mats. When the
        berries reach the target sugar they are pressed; the concentration gives the
        wine its raisin and fig character.

  - id: sherry-sweet-ferment-001
    type: mcq
    deck: Sherry
    tags: [sherry, sweet, fermentation]
    status: reviewed
    source_id: c43-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What usually happens when the very sugary must for naturally sweet Sherry starts to ferment?"
      choices:
        - { text: "It stalls after a few degrees", correct: true }
        - { text: "It ferments out to dryness", correct: false }
        - { text: "It reaches about 13% abv unaided", correct: false }
        - { text: "It ferments fast and overheats", correct: false }
      explanation: |
        So much sugar draws water out of the yeast cells by osmosis, slowing them
        almost to a stop.

