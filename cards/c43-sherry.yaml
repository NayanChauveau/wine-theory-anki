    fr:
      question: "Quelle paire de xérès est élevée de façon oxydative dès le départ, sans passage sous flor ?"
      choices:
        - { text: "Fino et Pedro Ximénez", correct: false }
        - { text: "Oloroso et Amontillado", correct: false }
        - { text: "Oloroso et Pedro Ximénez", correct: true }
        - { text: "Manzanilla et Palo Cortado", correct: false }
      explanation: |
        Certains xérès Moscatel sont élaborés de la même façon. Avec les années, ces
        vins passent de l’or à un brun profond.

  - id: sherry-amontillado-ageing-001
    type: mcq
