    en:
      question: "In traditional Sherry cellar terms, which level of butts is called the solera itself?"
      choices:
        - { text: "The level with the youngest average age", correct: false }
        - { text: "The middle level of the stack", correct: false }
        - { text: "The level with the oldest average age", correct: true }
        - { text: "The level with the strongest flor", correct: false }
      explanation: |
        The word is usually traced to suelo, Spanish for floor, because the oldest butts
        traditionally sat on the bottom row. Every level above it is a criadera.
    fr:
      question: "Dans le vocabulaire traditionnel des chais de Jerez, quel niveau de botas porte le nom de solera proprement dite ?"
      choices:
        - { text: "Le niveau dont l’âge moyen est le plus jeune", correct: false }
        - { text: "Le niveau du milieu de la pile", correct: false }
        - { text: "Le niveau dont l’âge moyen est le plus vieux", correct: true }
        - { text: "Le niveau où la flor est la plus épaisse", correct: false }
      explanation: |
        On rattache souvent le mot à suelo, « sol » en espagnol, car les botas les
        plus vieilles reposaient autrefois au rang du bas. Chaque niveau au-dessus
        est une criadera.

  - id: sherry-saca-equal-share-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, saca]
    status: reviewed
    source_id: c43-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When wine is drawn from the oldest level of a Sherry solera for bottling, how is it taken?"
      choices:
        - { text: "A full butt at a time, which is then refilled", correct: false }
        - { text: "An equal part from each butt in that level", correct: true }
        - { text: "Only from the butts that taste best that year", correct: false }
        - { text: "Most of every butt, leaving just the lees", correct: false }
      explanation: |
        The withdrawal is called the saca. Taking the same share from every butt keeps
        the blend even, and no butt in the level is ever fully emptied.
    fr:
      question: "Quand on tire du vin du niveau le plus vieux d’une solera pour la mise en bouteille, comment le prélève-t-on ?"
      choices:
        - { text: "Une bota entière à la fois, remplie ensuite", correct: false }
        - { text: "Une part égale dans chaque bota du niveau", correct: true }
        - { text: "Dans les botas qui goûtent le mieux cette année-là", correct: false }
        - { text: "L’essentiel de chaque bota, en laissant les lies", correct: false }
      explanation: |
        Ce prélèvement s’appelle la saca. Prendre la même part dans chaque bota
        garde l’assemblage homogène, et aucune bota du niveau n’est jamais vidée
        entièrement.

  - id: sherry-criadera-count-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, criadera]
    status: reviewed
    source_id: c43-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How many criaderas does a Sherry solera have?"
      choices:
        - { text: "Always three, fixed by the DO rules", correct: false }
        - { text: "From one or two to over a dozen", correct: true }
        - { text: "One for each year of average age", correct: false }
        - { text: "At least twenty in every solera", correct: false }
      explanation: |
        Manzanilla soleras tend to have the most levels, while some Oloroso and Pedro
        Ximénez soleras have only a few.
    fr:
      question: "Combien de criaderas compte une solera de xérès ?"
      choices:
        - { text: "Toujours trois, comme le fixe la DO", correct: false }
        - { text: "D’une ou deux à plus d’une douzaine", correct: true }
        - { text: "Une par année d’âge moyen", correct: false }
        - { text: "Au moins vingt dans chaque solera", correct: false }
      explanation: |
        Les soleras de Manzanilla ont souvent le plus de niveaux, alors que
        certaines soleras d’Oloroso ou de Pedro Ximénez n’en comptent que
        quelques-uns.

  - id: sherry-average-age-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, age]
    status: reviewed
    source_id: c43-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can most Sherry state only an average age rather than a single harvest year?"
      choices:
        - { text: "Spanish rules ban harvest years on fortified wines", correct: false }
        - { text: "Each bottling blends wines of many ages", correct: true }
        - { text: "Flor makes a wine's true age impossible to measure", correct: false }
        - { text: "Fortification masks the character of each harvest", correct: false }
      explanation: |
        Rare vintage-dated Sherries (añadas) do exist. They are kept out of the solera
        and aged statically in their own butts.
    fr:
      question: "Pourquoi la plupart des xérès ne peuvent-ils indiquer qu’un âge moyen et non une année de récolte ?"
      choices:
        - { text: "La loi espagnole interdit le millésime sur les vins fortifiés", correct: false }
        - { text: "Chaque mise en bouteille assemble des vins d’âges multiples", correct: true }
        - { text: "La flor rend l’âge réel du vin impossible à mesurer", correct: false }
        - { text: "Le mutage masque le caractère de chaque récolte", correct: false }
      explanation: |
        De rares xérès millésimés (añadas) existent bel et bien. Ils sont tenus
        hors de la solera et vieillissent en statique dans leurs propres botas.

  - id: sherry-solera-consistency-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, consistency]
    status: reviewed
    source_id: c43-0059
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main commercial benefit of maturing Sherry in a solera?"
      choices:
        - { text: "A house can bottle the same style year after year", correct: true }
        - { text: "Each bottling shows the character of its harvest", correct: false }
        - { text: "The wine reaches market within months of harvest", correct: false }
        - { text: "It removes the need to fortify the wine", correct: false }
      explanation: |
        A bottle sold today tastes much like one sold a decade ago. Big brands such as
        Harveys Bristol Cream depend on that continuity.
    fr:
      question: "Quel est le principal intérêt commercial d’élever le xérès en solera ?"
      choices:
        - { text: "Une maison peut embouteiller le même style année après année", correct: true }
        - { text: "Chaque mise en bouteille reflète le caractère de son millésime", correct: false }
        - { text: "Le vin arrive sur le marché quelques mois après la vendange", correct: false }
        - { text: "Le système dispense de muter le vin", correct: false }
      explanation: |
        Une bouteille vendue aujourd’hui ressemble beaucoup à celle d’il y a dix
        ans. De grandes marques comme le Harveys Bristol Cream reposent sur cette
        continuité.

  - id: sherry-solera-disruption-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, consistency]
    status: reviewed
    source_id: c43-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which practice is most likely to disrupt the consistency of a Sherry solera?"
      choices:
        - { text: "Using old, well-seasoned oak butts", correct: false }
        - { text: "Storing the butts in above-ground bodegas", correct: false }
        - { text: "Feeding it with new wine of lower quality", correct: true }
        - { text: "Moving wine between levels by hand", correct: false }
      explanation: |
        Drawing off too large a share each year does similar harm: the younger wine then
        dominates and the house style drifts.
    fr:
      question: "Quelle pratique risque le plus de rompre la régularité d’une solera de xérès ?"
      choices:
        - { text: "Utiliser de vieilles botas de chêne bien affranchies", correct: false }
        - { text: "Stocker les botas dans des bodegas de plain-pied, non enterrées", correct: false }
        - { text: "L’alimenter avec du vin jeune de moindre qualité", correct: true }
        - { text: "Transférer le vin d’un niveau à l’autre à la main", correct: false }
      explanation: |
        Tirer chaque année une part trop grande fait un tort comparable : le vin
        jeune domine alors et le style de la maison dérive.

  - id: sherry-criadera-buildings-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, bodega]
    status: reviewed
    source_id: c43-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do Sherry houses often keep the levels of one solera in separate buildings?"
      choices:
        - { text: "To limit the damage from a single disaster", correct: true }
        - { text: "To keep young and old wine at different temperatures", correct: false }
        - { text: "To stop flor spreading from one level to another", correct: false }
        - { text: "To meet a rule that each level be stored apart", correct: false }
      explanation: |
        A solera can take decades to build, so losing every level at once could not be
        undone. Spreading the levels confines a fire, roof collapse or flood to part of
        the system.
    fr:
      question: "Pourquoi les maisons de Jerez gardent-elles souvent les niveaux d’une même solera dans des bâtiments séparés ?"
      choices:
        - { text: "Pour limiter les dégâts d’une seule catastrophe", correct: true }
        - { text: "Pour garder vins jeunes et vieux à des températures différentes", correct: false }
        - { text: "Pour empêcher la flor de passer d’un niveau à l’autre", correct: false }
        - { text: "Pour respecter une règle imposant de séparer les niveaux", correct: false }
      explanation: |
        Une solera peut demander des décennies pour se constituer : perdre tous
        les niveaux d’un coup serait irréparable. Disperser les niveaux cantonne un
        incendie, un effondrement de toit ou une inondation à une partie du système.

  - id: sherry-biological-flor-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, biological-ageing]
    status: reviewed
    source_id: c43-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Sherry, what does the ageing known as 'biological' depend on?"
      choices:
        - { text: "Lactic bacteria converting the acids", correct: false }
        - { text: "Long contact with the grape skins", correct: false }
        - { text: "Noble rot on the harvested grapes", correct: false }
        - { text: "A film of yeast growing on the wine", correct: true }
      explanation: |
        This film, called flor, is not a single organism but a mix of several
        Saccharomyces yeast strains, some of them close relatives of ordinary
        fermentation yeasts.
    fr:
      question: "Pour le xérès, de quoi dépend le vieillissement dit « biologique » ?"
      choices:
        - { text: "Des bactéries lactiques qui transforment les acides", correct: false }
        - { text: "D’une longue macération sur les peaux", correct: false }
        - { text: "De la pourriture noble sur les raisins", correct: false }
        - { text: "D’un voile de levures à la surface du vin", correct: true }
      explanation: |
        Ce voile, appelé flor, ne provient pas d’un seul organisme : il réunit
        plusieurs souches de levures Saccharomyces, dont certaines sont proches des
        levures de fermentation ordinaires.

  - id: sherry-flor-position-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, biological-ageing]
    status: reviewed
    source_id: c43-0064
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does flor grow in a butt of maturing Fino?"
      choices:
        - { text: "As a sediment at the bottom of the butt", correct: false }
        - { text: "Within the pores of the oak staves", correct: false }
        - { text: "As a layer on the surface of the wine", correct: true }
        - { text: "Suspended evenly through the wine", correct: false }
      explanation: |
        It looks like a pale, creamy, wrinkled crust. When it thins, patches of bare
        wine show through.
    fr:
      question: "Où se développe la flor dans une bota de Fino en cours d’élevage ?"
      choices:
        - { text: "En dépôt au fond de la bota", correct: false }
        - { text: "Dans les pores des douelles de chêne", correct: false }
        - { text: "En couche à la surface du vin", correct: true }
        - { text: "En suspension dans toute la masse du vin", correct: false }
      explanation: |
        Elle ressemble à une croûte pâle, crémeuse et plissée. Quand elle s’amincit,
        des plaques de vin à nu apparaissent.

  - id: sherry-flor-acetaldehyde-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, biological-ageing, acetaldehyde]
    status: reviewed
    source_id: c43-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which flor by-product is chiefly behind the distinctive aroma of biologically aged Sherry?"
      choices:
        - { text: "Ethyl acetate", correct: false }
        - { text: "Diacetyl", correct: false }
        - { text: "Acetic acid", correct: false }
        - { text: "Acetaldehyde", correct: true }
      explanation: |
        Flor also gives off carbon dioxide and uses up much of the wine's glycerol,
        which helps explain why a Fino feels so light and dry.
    fr:
      question: "Quel sous-produit de la flor explique surtout l’arôme si particulier des xérès de vieillissement biologique ?"
      choices:
        - { text: "Acétate d’éthyle", correct: false }
        - { text: "Diacétyle", correct: false }
        - { text: "Acide acétique", correct: false }
        - { text: "Acétaldéhyde", correct: true }
      explanation: |
        La flor dégage aussi du gaz carbonique et consomme une grande partie du
        glycérol du vin, ce qui explique en partie la légèreté et la sécheresse d’un
        Fino.

  - id: sherry-butt-position-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, bodega]
    status: reviewed
    source_id: c43-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can two butts of the same biological Sherry in one bodega develop differently?"
      choices:
        - { text: "Each butt is made from a different oak species", correct: false }
        - { text: "Some butts are newer and give more oak flavour", correct: false }
        - { text: "Their spot in the cellar changes the conditions", correct: true }
        - { text: "Each butt carries its own added yeast culture", correct: false }
      explanation: |
        Butts near the floor, doors or windows sit in slightly different temperature and
        humidity, so the flor grows thicker in some than others. Cellar masters taste
        butt by butt for this reason.
    fr:
      question: "Pourquoi deux botas d’un même xérès biologique, dans une même bodega, peuvent-elles évoluer différemment ?"
      choices:
        - { text: "Chaque bota est faite d’une espèce de chêne différente", correct: false }
        - { text: "Les botas plus récentes donnent plus de goût boisé", correct: false }
        - { text: "Leur place dans le chai modifie les conditions", correct: true }
        - { text: "Chaque bota reçoit sa propre levure sélectionnée", correct: false }
      explanation: |
        Près du sol, des portes ou des fenêtres, la température et l’humidité varient
        légèrement, si bien que la flor s’épaissit davantage dans certaines botas que
        dans d’autres. C’est pourquoi les maîtres de chai goûtent bota par bota.

  - id: sherry-flor-conditions-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, bodega]
    status: reviewed
    source_id: c43-0070
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which cellar conditions suit flor best?"
      choices:
        - { text: "Mild temperatures and humid air", correct: true }
        - { text: "Warm temperatures and dry air", correct: false }
        - { text: "Cold temperatures and dry air", correct: false }
        - { text: "Hot temperatures and humid air", correct: false }
      explanation: |
        Flor yeasts need air and are sensitive: heat stresses them, and dry air speeds
        evaporation from the butt, upsetting the balance the film depends on.
    fr:
      question: "Quelles conditions de chai conviennent le mieux à la flor ?"
      choices:
        - { text: "Températures douces et air humide", correct: true }
        - { text: "Températures élevées et air sec", correct: false }
        - { text: "Températures froides et air sec", correct: false }
        - { text: "Températures très élevées et air humide", correct: false }
      explanation: |
        Les levures de la flor ont besoin d’air et sont fragiles : la chaleur les met
        en difficulté, et un air sec accélère l’évaporation dans la bota, ce qui rompt
        l’équilibre dont dépend le voile.

  - id: sherry-flor-season-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, seasons]
    status: reviewed
    source_id: c43-0071
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Jerez bodegas, at which times of year is the flor film at its thickest?"
      choices:
        - { text: "Summer and winter", correct: false }
        - { text: "Summer and autumn", correct: false }
        - { text: "Winter and spring", correct: false }
        - { text: "Spring and autumn", correct: true }
      explanation: |
        In the other two seasons the film thins and may partly die back before
        recovering, so its thickness rises and falls through the year.
    fr:
      question: "Dans les bodegas de Jerez, à quelles saisons le voile de flor est-il le plus épais ?"
      choices:
        - { text: "L’été et l’hiver", correct: false }
        - { text: "L’été et l’automne", correct: false }
        - { text: "L’hiver et le printemps", correct: false }
        - { text: "Le printemps et l’automne", correct: true }
      explanation: |
        Pendant les deux autres saisons, le voile s’amincit et peut en partie dépérir
        avant de repartir : son épaisseur varie donc au fil de l’année.

  - id: sherry-flor-protection-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, oxidation]
    status: reviewed
    source_id: c43-0074
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a Fino stay pale after years in cask?"
      choices:
        - { text: "Its flor film shields it from oxygen", correct: true }
        - { text: "Its butts are rinsed out every year", correct: false }
        - { text: "Its high alcohol bleaches the colour", correct: false }
        - { text: "Its spirit is added only after ageing", correct: false }
      explanation: |
        The yeast takes up oxygen before it reaches the wine, so the browning that marks
        oxidative styles never gets under way while the film stays intact.
    fr:
      question: "Pourquoi un Fino reste-t-il pâle après des années en fût ?"
      choices:
        - { text: "Son voile de flor le protège de l’oxygène", correct: true }
        - { text: "Ses botas sont rincées à fond chaque année", correct: false }
        - { text: "Son degré élevé finit par décolorer le vin", correct: false }
        - { text: "Son eau-de-vie n’est ajoutée qu’après l’élevage", correct: false }
      explanation: |
        Les levures captent l’oxygène avant qu’il n’atteigne le vin : le brunissement
        propre aux styles oxydatifs ne s’amorce pas tant que le voile reste intact.

  - id: sherry-flor-refresh-001
    type: mcq
    deck: Sherry
    tags: [sherry, flor, solera]
    status: reviewed
    source_id: c43-0075
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why must a biological Sherry solera be refreshed with younger wine at regular intervals?"
      choices:
        - { text: "To replace sweetness the flor has removed", correct: false }
        - { text: "To top the butts right up to the bung", correct: false }
        - { text: "To feed the flor, which uses up its nutrients", correct: true }
        - { text: "To restore colour lost during ageing", correct: false }
      explanation: |
        In some Manzanilla soleras small transfers are made several times a year to keep
        the film going.
    fr:
      question: "Pourquoi faut-il rafraîchir régulièrement une solera de xérès biologique avec du vin plus jeune ?"
      choices:
        - { text: "Pour remplacer le sucre consommé par la flor", correct: false }
        - { text: "Pour remplir les botas jusqu’à la bonde", correct: false }
        - { text: "Pour nourrir la flor, à court de nutriments", correct: true }
        - { text: "Pour rendre la couleur perdue à l’élevage", correct: false }
      explanation: |
        Dans certaines soleras de Manzanilla, on procède à de petits transvasements
        plusieurs fois par an pour entretenir le voile.

  - id: sherry-fino-drink-young-001
    type: mcq
    deck: Sherry
    tags: [sherry, fino, serving]
