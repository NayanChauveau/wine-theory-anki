      sources: [known-fact]
    en:
      question: "How should a bottle of Fino be treated once it has been released?"
      choices:
        - { text: "Cellared for several years to gain complexity", correct: false }
        - { text: "Laid down for a decade, like vintage Port", correct: false }
        - { text: "Drunk soon, while it is still fresh", correct: true }
        - { text: "Kept until it turns amber and nutty", correct: false }
      explanation: |
        Many producers print a bottling date so buyers can choose the freshest bottle.
        Once opened, it is best finished within a few days, like a white wine.

  - id: sherry-biological-average-age-001
    type: mcq
    deck: Sherry
    tags: [sherry, solera, age, biological-ageing]
    status: reviewed
