    en:
      question: "In what vessels is dry Sherry base wine now usually fermented?"
      choices:
        - { text: "New French oak barriques", correct: false }
        - { text: "Large clay tinajas", correct: false }
        - { text: "Open stone lagares by the vineyard", correct: false }
        - { text: "Large stainless steel tanks", correct: true }
      explanation: |
        Fermenting in butts was the norm until the second half of the 20th century.
        Temperature-controlled steel lets houses hold a steady 20–25 °C.
    fr:
      question: "Dans quels contenants fait-on aujourd’hui le plus souvent fermenter le vin de base des xérès secs ?"
      choices:
        - { text: "Des barriques neuves de chêne français", correct: false }
        - { text: "De grandes tinajas en terre cuite", correct: false }
        - { text: "Des lagares de pierre ouverts, près des vignes", correct: false }
        - { text: "De grandes cuves en inox", correct: true }
      explanation: |
        La fermentation en bota est restée la norme jusqu’à la seconde moitié du
        XXe siècle. L’inox thermorégulé permet de tenir une température stable de
        20 à 25 °C.

  - id: sherry-warm-ferment-001
    type: mcq
    deck: Sherry
    tags: [sherry, winemaking, fermentation]
    status: reviewed
    source_id: c43-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can dry Sherry base wine be fermented warmer than most white wines?"
      choices:
        - { text: "Warm ferments keep more fresh fruit", correct: false }
        - { text: "Heat helps flor form in the tank", correct: false }
        - { text: "Producers want a neutral base wine", correct: true }
        - { text: "Warmth lifts the low acidity of Palomino", correct: false }
      explanation: |
        Cool ferments exist to keep delicate fruity esters, which are not the goal
        here. Around 20–25 °C is typical, warm for a white.
    fr:
      question: "Pourquoi peut-on faire fermenter le vin de base des xérès secs plus chaud que la plupart des vins blancs ?"
      choices:
        - { text: "Une fermentation chaude garde plus de fruit frais", correct: false }
        - { text: "La chaleur aide la flor à se former en cuve", correct: false }
        - { text: "On recherche un vin de base neutre", correct: true }
        - { text: "La chaleur corrige la faible acidité du Palomino", correct: false }
      explanation: |
        Les fermentations fraîches servent à préserver les esters fruités délicats,
        que l’on ne recherche pas ici. On travaille couramment vers 20–25 °C, une
        température élevée pour un blanc.

  - id: sherry-base-wine-strength-001
