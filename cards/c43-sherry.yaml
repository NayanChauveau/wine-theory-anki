    en:
      question: "In body and richness, a Palo Cortado most resembles which other Sherry style?"
      choices:
        - { text: "Fino", correct: false }
        - { text: "Manzanilla", correct: false }
        - { text: "Amontillado", correct: false }
        - { text: "Oloroso", correct: true }
      explanation: |
        Expect a dry, broad palate with walnut, orange-peel and toffee notes
        and a long finish.

  - id: sherry-px-aromas-001
    type: mcq
    deck: Sherry
    tags: [sherry, pedro-ximenez, tasting]
