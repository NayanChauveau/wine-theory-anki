    tags: [sherry, amontillado, ageing]
    status: reviewed
    source_id: c43-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which sequence of ageing produces an Amontillado?"
      choices:
        - { text: "Oxidative first, then under flor", correct: false }
        - { text: "Under flor throughout", correct: false }
        - { text: "Under flor first, then oxidative", correct: true }
        - { text: "Oxidative throughout", correct: false }
      explanation: |
        The name refers to Montilla, the inland area near Córdoba whose wines were the
        original model for the style.
    fr:
      question: "Quelle succession d’élevages donne un Amontillado ?"
      choices:
        - { text: "D’abord oxydatif, puis sous flor", correct: false }
        - { text: "Sous flor du début à la fin", correct: false }
        - { text: "D’abord sous flor, puis oxydatif", correct: true }
        - { text: "Oxydatif du début à la fin", correct: false }
      explanation: |
        Son nom renvoie à Montilla, zone de l’intérieur des terres près de Cordoue,
        dont les vins ont servi de modèle d’origine à ce style.

  - id: sherry-oxidative-length-001
    type: mcq
    deck: Sherry
    tags: [sherry, oxidative-ageing, age]
    status: reviewed
    source_id: c43-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does long solera ageing affect an oxidative Sherry, compared with a Fino?"
      choices:
        - { text: "It fades within a few years, like Fino", correct: false }
        - { text: "It can keep improving for decades", correct: true }
        - { text: "It must be bottled within ten years by law", correct: false }
        - { text: "It loses alcohol and turns thin", correct: false }
      explanation: |
        With no yeast film to sustain, there is no point at which the ageing has to
        stop; very few wines are kept that long, and such bottlings are rare and
        expensive.
    fr:
      question: "Comment un long élevage en solera agit-il sur un xérès oxydatif, par rapport à un Fino ?"
      choices:
        - { text: "Il s’éteint en quelques années, comme un Fino", correct: false }
        - { text: "Il peut s’améliorer pendant des décennies", correct: true }
        - { text: "La loi impose sa mise en bouteille avant dix ans", correct: false }
        - { text: "Il perd de l’alcool et s’amaigrit", correct: false }
      explanation: |
        Sans voile de levures à entretenir, rien n’oblige à arrêter l’élevage ; très
        peu de vins sont toutefois gardés aussi longtemps, et ces cuvées sont rares et
        chères.

  - id: sherry-oloroso-alcohol-rise-001
    type: mcq
    deck: Sherry
    tags: [sherry, oloroso, alcohol, oxidative-ageing]
    status: reviewed
    source_id: c43-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What happens to the strength of an Oloroso during decades of oxidative ageing?"
      choices:
        - { text: "It falls as flor consumes alcohol", correct: false }
        - { text: "It falls as alcohol evaporates faster than water", correct: false }
        - { text: "It stays at the level set by fortification", correct: false }
        - { text: "It rises as water evaporates through the oak", correct: true }
      explanation: |
        Very old Olorosos can approach about 22% abv. Flavours concentrate at the same
        time, since less water leaves more of everything else in each glass.
    fr:
      question: "Qu’advient-il du degré d’un Oloroso au fil de décennies d’élevage oxydatif ?"
      choices:
        - { text: "Il baisse, car la flor consomme l’alcool", correct: false }
        - { text: "Il baisse, car l’alcool s’évapore plus vite que l’eau", correct: false }
        - { text: "Il reste au niveau fixé lors du mutage", correct: false }
        - { text: "Il monte, car l’eau s’évapore à travers le bois", correct: true }
      explanation: |
        Les très vieux Olorosos peuvent approcher 22 % vol. Les saveurs se
        concentrent en même temps : avec moins d’eau, chaque verre contient davantage
        de tout le reste.

  - id: sherry-multi-solera-blend-001
    type: mcq
    deck: Sherry
    tags: [sherry, blending, solera]
    status: reviewed
    source_id: c43-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are most commercial Sherries, including many of the finest, put together?"
      choices:
        - { text: "From one solera, bottled unblended", correct: false }
        - { text: "From one harvest, aged in its own butts", correct: false }
        - { text: "By blending wines from several soleras", correct: true }
        - { text: "From grapes of a single named vineyard", correct: false }
      explanation: |
        Large houses run many soleras of different ages and styles, so each brand can be
        built from several components.
    fr:
      question: "Comment la plupart des xérès du commerce, y compris bon nombre des meilleurs, sont-ils élaborés ?"
      choices:
        - { text: "À partir d’une seule solera, sans assemblage", correct: false }
        - { text: "D’une seule récolte, élevée dans ses botas", correct: false }
        - { text: "En assemblant les vins de plusieurs soleras", correct: true }
        - { text: "Avec les raisins d’un seul vignoble nommé", correct: false }
      explanation: |
        Les grandes maisons font vivre de nombreuses soleras d’âges et de styles
        différents, si bien que chaque marque peut être construite à partir de
        plusieurs composantes.

  - id: sherry-oloroso-old-blend-001
    type: mcq
    deck: Sherry
    tags: [sherry, oloroso, blending]
    status: reviewed
    source_id: c43-0087
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are very old Oloroso wines often blended with younger Oloroso before bottling?"
      choices:
        - { text: "Alone, they are too intense to be balanced", correct: true }
        - { text: "Alone, they fall below the legal alcohol minimum", correct: false }
        - { text: "Alone, they have lost nearly all their colour", correct: false }
        - { text: "Alone, they start to regrow flor in bottle", correct: false }
      explanation: |
        A small share of very old wine adds depth while the younger part brings
        freshness. Houses often keep a few butts of ancient wine purely as a blending
        ingredient.
    fr:
      question: "Pourquoi assemble-t-on souvent les très vieux Olorosos avec un Oloroso plus jeune avant la mise en bouteille ?"
      choices:
        - { text: "Seuls, ils sont trop intenses et déséquilibrés", correct: true }
        - { text: "Seuls, ils passent sous le degré minimal légal", correct: false }
        - { text: "Seuls, ils ont perdu presque toute leur couleur", correct: false }
        - { text: "Seuls, ils refont un voile de flor en bouteille", correct: false }
      explanation: |
        Une petite part de très vieux vin apporte de la profondeur, la part plus jeune
        de la fraîcheur. Les maisons gardent souvent quelques botas de vin très ancien
        uniquement pour les assemblages.

  - id: sherry-pre-bottling-001
    type: mcq
    deck: Sherry
    tags: [sherry, bottling]
    status: reviewed
    source_id: c43-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which treatments do most Sherries receive just before bottling?"
      choices:
        - { text: "Fining and filtration", correct: true }
        - { text: "Malolactic conversion", correct: false }
        - { text: "A second fortification", correct: false }
        - { text: "A spell in new oak", correct: false }
      explanation: |
        These steps remove haze and fine deposits so the wine stays bright on the shelf.
        Cold stabilisation is often used as well to drop out tartrate crystals.
    fr:
      question: "Quels traitements la plupart des xérès reçoivent-ils juste avant la mise en bouteille ?"
      choices:
        - { text: "Collage et filtration", correct: true }
        - { text: "Fermentation malolactique", correct: false }
        - { text: "Un second mutage", correct: false }
        - { text: "Un passage en fût neuf", correct: false }
      explanation: |
        Ces étapes éliminent le trouble et les dépôts fins pour que le vin reste
        limpide en rayon. On pratique souvent aussi une stabilisation par le froid
        pour faire précipiter les cristaux de tartre.

  - id: sherry-en-rama-001
    type: mcq
    deck: Sherry
    tags: [sherry, bottling, fino, manzanilla]
    status: reviewed
    source_id: c43-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do some producers now keep heavy pre-bottling treatment of Fino and Manzanilla to a minimum?"
      choices:
        - { text: "Unfiltered wine keeps longer in bottle", correct: false }
        - { text: "Filtration is not allowed for these styles", correct: false }
        - { text: "Fining would raise their alcohol level", correct: false }
        - { text: "Heavy treatment can dull their vivid flavours", correct: true }
      explanation: |
        The trade-off is stability: such bottlings can show a light haze and fade
        faster, so they tend to be released in small seasonal batches meant for prompt
        drinking.
    fr:
      question: "Pourquoi certains producteurs réduisent-ils aujourd’hui au minimum les traitements du Fino et de la Manzanilla avant la mise en bouteille ?"
      choices:
        - { text: "Un vin non filtré se garde plus longtemps", correct: false }
        - { text: "La filtration est interdite pour ces styles", correct: false }
        - { text: "Le collage augmenterait leur degré d’alcool", correct: false }
        - { text: "Trop traiter éteint leurs arômes vifs", correct: true }
      explanation: |
        La contrepartie, c’est la stabilité : ces cuvées peuvent présenter un léger
        trouble et se faner plus vite. Elles sortent donc en petits lots saisonniers,
        à boire sans attendre.

