        - { text: "Drunk soon, while it is still fresh", correct: true }
        - { text: "Kept until it turns amber and nutty", correct: false }
      explanation: |
        Many producers print a bottling date so buyers can choose the freshest bottle.
        Once opened, it is best finished within a few days, like a white wine.
    fr:
      question: "Comment traiter une bouteille de Fino une fois mise sur le marché ?"
      choices:
        - { text: "La garder plusieurs années pour gagner en complexité", correct: false }
        - { text: "La laisser vieillir dix ans, comme un Porto Vintage", correct: false }
        - { text: "La boire rapidement, tant qu’elle est fraîche", correct: true }
        - { text: "Attendre que le vin devienne ambré et noisetté", correct: false }
      explanation: |
        Beaucoup de producteurs impriment une date de mise en bouteille pour que l’on
        puisse choisir la plus fraîche. Une fois ouverte, mieux vaut la finir en
        quelques jours, comme un vin blanc.

