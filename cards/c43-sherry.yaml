    en:
      question: "How is fermentation brought to an end in naturally sweet Sherry?"
      choices:
        - { text: "By chilling and filtering out the yeast", correct: false }
        - { text: "By adding a large dose of sulphur dioxide", correct: false }
        - { text: "By adding grape spirit", correct: true }
        - { text: "By pasteurising the fermenting must", correct: false }
      explanation: |
        The spirit lifts the strength beyond what the yeast can survive, so the
        sugar from the dried grapes stays in the wine.

