        - { text: "Legal limits are reset with each vintage", correct: false }
        - { text: "Each house sorts to suit its own style", correct: true }
        - { text: "Each bodega buys spirit of a different strength", correct: false }
      explanation: |
        A house famed for delicate flor wines and one built on rich, dark styles
        prize different traits in a young wine, so their tasters draw the line
        between the two paths in different places.
    fr:
      question: "Deux bodegas de Jerez dégustent le même vin nouveau et l’orientent vers des élevages différents. Qu’est-ce qui l’explique le mieux ?"
      choices:
        - { text: "Chaque ville d’élevage a ses propres règles de tri", correct: false }
        - { text: "Les limites légales sont revues à chaque millésime", correct: false }
        - { text: "Chaque maison trie selon son propre style", correct: true }
        - { text: "Chaque bodega achète une eau-de-vie d’un autre degré", correct: false }
      explanation: |
        Une maison réputée pour ses vins délicats sous flor et une autre bâtie sur
        des styles riches et sombres ne cherchent pas les mêmes qualités chez un vin
        jeune : leurs dégustateurs ne placent pas la limite entre les deux voies au
        même endroit.

  - id: sherry-volume-needs-001
