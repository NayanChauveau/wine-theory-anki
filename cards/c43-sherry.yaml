      sources: [known-fact]
    en:
      question: "How do Sherry houses stop their butts from giving oak flavour to the wine?"
      choices:
        - { text: "They char the staves heavily", correct: false }
        - { text: "They use butts already seasoned with wine", correct: true }
        - { text: "They line the staves with paraffin wax", correct: false }
        - { text: "They make the butts from chestnut", correct: false }
      explanation: |
        New butts are first filled with unfortified wine, which draws out much of
        the oak's flavour and tannin. Once seasoned, a butt can stay in use for
        decades.

  - id: sherry-butt-role-001
    type: mcq
    deck: Sherry
    tags: [sherry, maturation, oxygen]
    status: reviewed
    source_id: c43-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main thing a Sherry house wants from its oak butts?"
      choices:
        - { text: "Slow contact between the wine and oxygen", correct: true }
        - { text: "A steady cool temperature for the wine", correct: false }
        - { text: "Tannin to give the wine structure", correct: false }
        - { text: "Nutrients that feed the flor", correct: false }
      explanation: |
        Air passes slowly through the staves and joints, so the wood works as a
        slow oxygen valve. A sound butt can stay in service for decades, doing the
        same job year after year.

