      question: "Apart from a wine's character, what commercial factor can sway which style a Sherry house sends a new wine to?"
      choices:
        - { text: "Sales demand for each style", correct: true }
        - { text: "A yearly quota set for each style", correct: false }
        - { text: "That year's price of grape spirit", correct: false }
        - { text: "Export duties charged on each style", correct: false }
      explanation: |
        If sales of one style grow, more new wine must be set aside to replenish
        that style's stocks for the years ahead.
    fr:
      question: "Au-delà du caractère du vin, quel facteur commercial peut influer sur le style auquel une maison de Jerez destine un vin nouveau ?"
      choices:
        - { text: "La demande pour chaque style", correct: true }
        - { text: "Un quota annuel fixé pour chaque style", correct: false }
        - { text: "Le prix de l’eau-de-vie de vin cette année-là", correct: false }
        - { text: "Les droits d’exportation propres à chaque style", correct: false }
      explanation: |
        Si les ventes d’un style progressent, il faut mettre de côté davantage de
        vin nouveau pour renouveler ses stocks dans les années à venir.

  - id: sherry-coastal-biological-001
    type: mcq
    deck: Sherry
    tags: [sherry, classification, flor]
    status: reviewed
    source_id: c43-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which new Sherry wines are more likely to be chosen for biological ageing?"
      choices:
        - { text: "Wines from warmer inland vineyards", correct: false }
        - { text: "Wines from cooler coastal vineyards", correct: true }
        - { text: "Wines from the ripest, latest-picked grapes", correct: false }
        - { text: "Wines from grapes sun-dried before pressing", correct: false }
      explanation: |
        Fermenting at the cooler end of the range also favours a lighter, finer
        wine; warmer sites and warmer ferments push wines towards oxidative ageing.
    fr:
      question: "Quels vins jeunes de xérès ont le plus de chances d’être orientés vers le vieillissement biologique ?"
      choices:
        - { text: "Ceux des vignobles plus chauds de l’intérieur", correct: false }
        - { text: "Ceux des vignobles plus frais du littoral", correct: true }
        - { text: "Ceux des raisins les plus mûrs, cueillis tard", correct: false }
        - { text: "Ceux de raisins séchés au soleil avant pressurage", correct: false }
      explanation: |
        Une fermentation menée au bas de la fourchette de température donne
        aussi un vin plus léger et plus fin. Les sites plus chauds et les
        fermentations plus chaudes orientent plutôt vers le vieillissement
        oxydatif.

  - id: sherry-fortifying-spirit-001
    type: mcq
    deck: Sherry
    tags: [sherry, fortification]
    status: reviewed
    source_id: c43-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What spirit is typically used to fortify Sherry?"
      choices:
        - { text: "Grape brandy at about 40% abv", correct: false }
        - { text: "Grape spirit at about 77% abv", correct: false }
        - { text: "Grape spirit at about 96% abv", correct: true }
        - { text: "Grape spirit at about 60% abv", correct: false }
      explanation: |
        Spirit this strong is usually pre-mixed with wine before it goes in, so the
        young wine is not shocked by neat alcohol. The blend is often called mitad
        y mitad, "half and half".
    fr:
      question: "Avec quel alcool mute-t-on habituellement le xérès ?"
      choices:
        - { text: "Un brandy à environ 40 % vol.", correct: false }
        - { text: "Une eau-de-vie de vin à environ 77 % vol.", correct: false }
        - { text: "Une eau-de-vie de vin à environ 96 % vol.", correct: true }
        - { text: "Une eau-de-vie de vin à environ 60 % vol.", correct: false }
      explanation: |
        Un alcool aussi fort est en général d’abord coupé de vin avant l’ajout,
        pour ne pas brusquer le vin jeune avec de l’alcool pur. Ce mélange
        s’appelle souvent mitad y mitad, « moitié-moitié ».

  - id: sherry-sobretabla-001
    type: mcq
    deck: Sherry
    tags: [sherry, fortification]
    status: reviewed
    source_id: c43-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is newly fortified Sherry called while it rests a few months before joining a solera?"
      choices:
        - { text: "Sobretabla", correct: true }
        - { text: "Mosto", correct: false }
        - { text: "Añada", correct: false }
        - { text: "Criadera", correct: false }
      explanation: |
        The sequence runs fermentation, then fortification, then this rest, and
        only then entry into a solera of matching style.
    fr:
      question: "Comment appelle-t-on un xérès tout juste muté qui repose quelques mois avant d’entrer dans une solera ?"
      choices:
        - { text: "Sobretabla", correct: true }
        - { text: "Mosto", correct: false }
        - { text: "Añada", correct: false }
        - { text: "Criadera", correct: false }
      explanation: |
        L’ordre est le suivant : fermentation, mutage, ce repos, puis seulement
        l’entrée dans une solera du style correspondant.

  - id: sherry-flor-fortification-strength-001
    type: mcq
    deck: Sherry
    tags: [sherry, fortification, flor]
    status: reviewed
    source_id: c43-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "To roughly what strength are new Sherries destined for flor ageing fortified?"
      choices:
        - { text: "About 13–13.5% abv", correct: false }
        - { text: "About 15–15.5% abv", correct: true }
        - { text: "About 18–18.5% abv", correct: false }
        - { text: "About 20–20.5% abv", correct: false }
      explanation: |
        Flor yeasts tolerate this level well, while acetic bacteria, which would
        turn the wine towards vinegar, are held back.
    fr:
      question: "À quel degré environ mute-t-on les vins jeunes de xérès destinés à vieillir sous voile de flor ?"
      choices:
        - { text: "Environ 13–13,5 % vol.", correct: false }
        - { text: "Environ 15–15,5 % vol.", correct: true }
        - { text: "Environ 18–18,5 % vol.", correct: false }
        - { text: "Environ 20–20,5 % vol.", correct: false }
      explanation: |
        Les levures de flor supportent bien ce degré, alors que les bactéries
        acétiques, qui feraient tourner le vin au vinaigre, sont tenues en
        respect.

  - id: sherry-sobretabla-flor-check-001
    type: mcq
    deck: Sherry
    tags: [sherry, fortification, flor]
    status: reviewed
    source_id: c43-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "During the few months' rest after fortification, what are cellar staff mainly watching for in wine meant to become Fino?"
      choices:
        - { text: "Whether malolactic conversion finishes", correct: false }
        - { text: "Whether the wine takes colour from the butt", correct: false }
        - { text: "Whether the last sugar ferments out", correct: false }
        - { text: "Whether flor takes hold", correct: true }
      explanation: |
        A thin or patchy film warns that the wine may not age well under flor. Wines
        meant for oxidative ageing have no flor to watch, so the rest matters less
        for them.
    fr:
      question: "Pendant les quelques mois de repos qui suivent le mutage, que surveille-t-on surtout au chai dans un vin destiné à devenir Fino ?"
      choices:
        - { text: "Si la fermentation malolactique s’achève", correct: false }
        - { text: "Si le vin prend de la couleur au contact du fût", correct: false }
        - { text: "Si les derniers sucres finissent de fermenter", correct: false }
        - { text: "Si le voile de flor prend bien", correct: true }
      explanation: |
        Un voile mince ou irrégulier signale que le vin risque de mal vieillir
        sous flor. Les vins destinés au vieillissement oxydatif n’ont pas de
        voile à surveiller : ce repos compte moins pour eux.

  - id: sherry-second-classification-001
    type: mcq
    deck: Sherry
    tags: [sherry, classification]
    status: reviewed
    source_id: c43-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is checked at the second classification of young Sherry, after the sobretabla?"
      choices:
        - { text: "Whether it may carry a vintage date", correct: false }
        - { text: "Whether it suits its intended solera", correct: true }
        - { text: "How much sweetening it needs for sale", correct: false }
        - { text: "Which grape variety it was made from", correct: false }
      explanation: |
        A wine that seemed promising in autumn can drift from the style its solera
        needs once it has rested at its new strength.
    fr:
      question: "Que vérifie-t-on lors du second classement d’un xérès jeune, après la sobretabla ?"
      choices:
        - { text: "S’il peut porter un millésime", correct: false }
        - { text: "S’il convient à la solera prévue", correct: true }
        - { text: "Combien il faudra l’adoucir avant la vente", correct: false }
        - { text: "De quel cépage il est issu", correct: false }
      explanation: |
        Un vin prometteur à l’automne peut s’écarter du style que demande sa
        solera une fois qu’il a reposé à son nouveau degré.

  - id: sherry-failed-classification-001
    type: mcq
    deck: Sherry
    tags: [sherry, classification]
    status: reviewed
    source_id: c43-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What normally happens to a young Sherry that fails its second classification?"
      choices:
        - { text: "It goes straight into the oldest solera tier", correct: false }
        - { text: "It is sweetened and bottled at once", correct: false }
        - { text: "It is refortified or rejected", correct: true }
        - { text: "It is returned to tank to referment", correct: false }
      explanation: |
        Refortifying moves the wine to a stronger, oxidative path. Rejected wine can
        end up distilled or made into Sherry vinegar.
    fr:
      question: "Que devient normalement un xérès jeune qui échoue à son second classement ?"
      choices:
        - { text: "Il entre directement dans la plus vieille solera", correct: false }
        - { text: "Il est adouci et mis en bouteille aussitôt", correct: false }
        - { text: "Il est muté à nouveau ou écarté", correct: true }
        - { text: "Il retourne en cuve pour refermenter", correct: false }
      explanation: |
        Un nouveau mutage fait passer le vin à un degré plus élevé, sur la voie
        oxydative. Le vin écarté peut finir distillé ou transformé en vinaigre
        de Xérès.

  - id: sherry-oxidative-fortification-strength-001
    type: mcq
    deck: Sherry
    tags: [sherry, fortification, oxidative]
    status: reviewed
    source_id: c43-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "To roughly what strength are new Sherries destined for oxidative ageing fortified?"
      choices:
        - { text: "About 17% abv", correct: true }
        - { text: "About 14% abv", correct: false }
        - { text: "About 20% abv", correct: false }
        - { text: "About 22% abv", correct: false }
      explanation: |
        At this level the wine is protected from spoilage and ages in contact with
