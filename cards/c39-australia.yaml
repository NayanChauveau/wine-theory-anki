        hold easily, the same reason it dominates in Sauternes.
    fr:
      question: "Quel cépage donne les liquoreux à pourriture noble qui font la spécialité de la Riverina, en Australie ?"
      choices:
        - { text: "Chenin Blanc", correct: false }
        - { text: "Sémillon", correct: true }
        - { text: "Colombard", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        La référence est le Noble One de De Bortoli, produit pour la première
        fois avec le millésime 1982 près de Griffith. La peau fine du Sémillon
        laisse le champignon s’installer facilement : c’est aussi pourquoi il
        domine à Sauternes.

  - id: aus-riverina-autumn-mist-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, riverina, sweet, climate]
    status: reviewed
    source_id: c39-0052
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which autumn weather lets noble rot develop in the hot, dry Riverina?"
      choices:
        - { text: "Persistent warm autumn rain", correct: false }
        - { text: "Frequent light overnight frosts", correct: false }
        - { text: "Cool afternoon sea breezes", correct: false }
        - { text: "Morning mists and fog", correct: true }
      explanation: |
        Damp mornings let the spores germinate on ripe berries; the dry,
        sunny afternoons that follow check the fungus so it stays noble
        rather than turning to grey rot, which steady rain would bring.
    fr:
      question: "Quel temps d’automne permet à la pourriture noble de se développer dans la Riverina, chaude et sèche ?"
      choices:
        - { text: "Pluies d’automne chaudes et persistantes", correct: false }
        - { text: "Petites gelées nocturnes fréquentes", correct: false }
        - { text: "Brises marines fraîches l’après-midi", correct: false }
        - { text: "Brumes et brouillards matinaux", correct: true }
      explanation: |
        Les matinées humides permettent aux spores de germer sur les baies mûres
        ; les après-midi secs et ensoleillés freinent ensuite le champignon, qui
        reste noble au lieu de tourner à la pourriture grise qu’apporterait une
        pluie continue.

