        - { text: "Riesling and Sauvignon Blanc", correct: true }
      explanation: |
        Cool nights slow the loss of acidity and keep the citrus, floral and
        herbaceous aromas these grapes rely on. In a hot site they lose that
        lift and turn broad.
    fr:
      question: "Outre le Pinot Noir et le Chardonnay, quels deux cépages blancs aromatiques conviennent aux sites hauts et frais de l’intérieur du Victoria ?"
      choices:
        - { text: "Viognier et Roussanne", correct: false }
        - { text: "Sémillon et Verdelho", correct: false }
        - { text: "Muscat et Muscadelle", correct: false }
        - { text: "Riesling et Sauvignon Blanc", correct: true }
      explanation: |
        Les nuits fraîches ralentissent la perte d’acidité et préservent les
        arômes d’agrumes, de fleurs et d’herbe qui font le Riesling et le
        Sauvignon Blanc. Sur un site chaud, ils perdent cette vivacité et
        s’alourdissent.

