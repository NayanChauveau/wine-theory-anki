        - { text: "Rutherglen", correct: false }
        - { text: "Goulburn Valley", correct: true }
      explanation: |
        Its best-known estates cluster near the town of Nagambie, about 130 km
        north of Melbourne; Mitchelton is one of them.

  - id: aus-goulburn-water-cooling-001
    type: mcq
