        - { text: "Cold currents off the south coast", correct: false }
        - { text: "Cloud cover off the Tasman Sea", correct: false }
        - { text: "Altitude on the inland ranges", correct: true }
      explanation: |
        Heathcote lies in the centre of the state, well over 100 km from
        Melbourne and far from the coast. Its vines grow along the Mount Camel
        Range, many on ancient red Cambrian soils.

  - id: aus-heathcote-climate-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, heathcote, climate]
