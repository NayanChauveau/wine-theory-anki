        - { text: "Mataro", correct: false }
        - { text: "Pinot Noir", correct: true }
      explanation: |
        Much of it goes into still red wine, but a good share is picked
        early as a sparkling base, blended with Chardonnay.

  - id: aus-mclaren-vale-location-001
