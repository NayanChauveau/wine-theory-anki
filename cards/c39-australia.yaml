        - { text: "Pinot Noir", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Petit Verdot", correct: false }
      explanation: |
        Its style shifts with the site: subregion, soil and elevation all
        change how ripe and how firm the wine turns out, so Clare Cabernet
        has no single house style.

  - id: aus-adelaide-hills-location-001
