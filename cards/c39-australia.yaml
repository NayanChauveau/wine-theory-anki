        - { text: "Afternoon sea breezes", correct: true }
        - { text: "Morning fog off the Murray", correct: false }
        - { text: "Summer cloud from a cold current", correct: false }
      explanation: |
        Air off Gulf St Vincent moves inland most afternoons and lowers
        temperatures just as the day's heat peaks.

  - id: aus-mclaren-vale-red-share-001
    type: mcq
