        - { text: "New South Wales", correct: true }
        - { text: "Queensland", correct: false }
        - { text: "South Australia", correct: false }
      explanation: |
        Its vineyards cluster around Pokolbin, near the town of Cessnock, a
        couple of hours' drive north of Sydney.

  - id: aus-hunter-climate-001
    type: mcq
