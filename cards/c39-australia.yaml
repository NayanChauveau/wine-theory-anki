  - id: aus-coonawarra-zone-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, coonawarra, labelling]
    status: reviewed
    source_id: c39-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which South Australian zone contains Coonawarra?"
      choices:
        - { text: "Fleurieu", correct: false }
        - { text: "Mount Lofty Ranges", correct: false }
        - { text: "Barossa", correct: false }
        - { text: "Limestone Coast", correct: true }
      explanation: |
        The zone takes its name from the limestone that underlies much of
        the south-east of the state. Padthaway, Wrattonbully and Mount
        Benson are other regions within it.
    fr:
      question: "Dans quelle zone d’Australie-Méridionale se trouve Coonawarra ?"
      choices:
        - { text: "Fleurieu", correct: false }
        - { text: "Mount Lofty Ranges", correct: false }
        - { text: "Barossa", correct: false }
        - { text: "Limestone Coast", correct: true }
      explanation: |
        La zone doit son nom au calcaire qui forme le sous-sol d’une grande
        partie du sud-est de l’État. Padthaway, Wrattonbully et Mount Benson
        sont d’autres régions qu’elle regroupe.

  - id: aus-coonawarra-shape-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, coonawarra, geography]
    status: reviewed
    source_id: c39-0092
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which shape best describes Coonawarra's core vineyard area?"
      choices:
        - { text: "A broad basin around a lake", correct: false }
        - { text: "A long, narrow strip", correct: true }
        - { text: "A wide river terrace", correct: false }
        - { text: "Scattered hilltop patches", correct: false }
      explanation: |
        The prized strip is only about one to two kilometres wide but many
        kilometres long, often likened to a cigar. Moving off it, even a
        short distance, changes the soil.
    fr:
      question: "Quelle forme décrit le mieux le cœur du vignoble de Coonawarra ?"
      choices:
        - { text: "Un large bassin autour d’un lac", correct: false }
        - { text: "Une bande longue et étroite", correct: true }
        - { text: "Une vaste terrasse fluviale", correct: false }
        - { text: "Des parcelles éparses sur les sommets", correct: false }
      explanation: |
        La bande la plus recherchée ne fait qu’un à deux kilomètres de large
        mais s’étire sur de nombreux kilomètres ; on la compare souvent à un
        cigare. Il suffit de s’en écarter un peu pour que le sol change.

