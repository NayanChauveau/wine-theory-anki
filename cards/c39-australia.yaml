        - { text: "On the coastal plain south of Sydney", correct: false }
      explanation: |
        The town of Orange is roughly 250 km west of Sydney by road, across the
        Blue Mountains.
    fr:
      question: "Où se situe la région viticole d’Orange ?"
      choices:
        - { text: "Sur la plaine côtière au nord de Sydney", correct: false }
        - { text: "À l’intérieur, sur le versant ouest des reliefs", correct: true }
        - { text: "Sur les plaines de la Murrumbidgee, loin à l’intérieur", correct: false }
        - { text: "Sur la plaine côtière au sud de Sydney", correct: false }
      explanation: |
        La ville d’Orange est à environ 250 km à l’ouest de Sydney par la route,
        de l’autre côté des Montagnes Bleues.

  - id: aus-nsw-altitude-grapes-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, grapes]
    status: reviewed
    source_id: c39-0145
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape pair makes concentrated, structured wines in New South Wales' higher-altitude regions?"
      choices:
        - { text: "Viognier and Petit Verdot", correct: false }
        - { text: "Chardonnay and Cabernet", correct: true }
        - { text: "Grenache and Mourvèdre", correct: false }
        - { text: "Verdelho and Durif", correct: false }
      explanation: |
        Cool nights at height hold acidity while long, sunny days build flavour,
        so the wines join concentration with freshness.
    fr:
      question: "Quelle paire de cépages donne des vins concentrés et structurés dans les régions d’altitude de Nouvelle-Galles du Sud ?"
      choices:
        - { text: "Viognier et Petit Verdot", correct: false }
        - { text: "Chardonnay et Cabernet", correct: true }
        - { text: "Grenache et Mourvèdre", correct: false }
        - { text: "Verdelho et Durif", correct: false }
      explanation: |
        En altitude, les nuits fraîches préservent l’acidité tandis que de
        longues journées ensoleillées développent les arômes : les vins allient
        concentration et fraîcheur.

  - id: aus-land-size-001
    type: mcq
    deck: Australia
    tags: [australia, geography]
    status: reviewed
    source_id: c39-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Australia's land area compare with that of the mainland United States?"
      choices:
        - { text: "About half as large", correct: false }
        - { text: "Roughly the same size", correct: true }
        - { text: "About twice as large", correct: false }
        - { text: "About a quarter as large", correct: false }
      explanation: |
        The continent covers close to 7.7 million km², yet its vineyards hug the
        south-east and south-west corners. Margaret River and the Hunter Valley
        lie over 3,000 km apart, further than London is from Moscow, so
        "Australian wine" spans very different places.
    fr:
      question: "Comment la superficie de l’Australie se compare-t-elle à celle des 48 États contigus des États-Unis (hors Alaska et Hawaï) ?"
      choices:
        - { text: "Environ moitié moins grande", correct: false }
        - { text: "À peu près la même taille", correct: true }
        - { text: "Environ deux fois plus grande", correct: false }
        - { text: "Environ quatre fois plus petite", correct: false }
      explanation: |
        Le continent couvre près de 7,7 millions de km², mais ses vignes se
        concentrent dans les coins sud-est et sud-ouest. Margaret River et la
        Hunter Valley sont à plus de 3 000 km l’une de l’autre, plus que Londres
        de Moscou : le « vin australien » recouvre des lieux très différents.

  - id: aus-heat-latitude-001
    type: mcq
    deck: Australia
    tags: [australia, climate]
    status: reviewed
    source_id: c39-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which factor does most to make the bulk of Australia's vineyard land warm or hot?"
      choices:
        - { text: "Stony soils that store heat", correct: false }
        - { text: "Long summer days at high latitude", correct: false }
        - { text: "High average vineyard altitude", correct: false }
        - { text: "Fairly low latitude", correct: true }
      explanation: |
        Most Australian regions sit between roughly 30° and 38°S, about as close
        to the equator as southern Spain or North Africa are in the north. The
        sun stands high in the sky and the growing season is long.
    fr:
      question: "Quel facteur rend chaude, voire très chaude, la majeure partie du vignoble australien ?"
      choices:
        - { text: "Des sols caillouteux qui stockent la chaleur", correct: false }
        - { text: "De longues journées d’été à haute latitude", correct: false }
        - { text: "Une altitude moyenne élevée des vignes", correct: false }
        - { text: "Une latitude assez basse", correct: true }
      explanation: |
        La plupart des régions australiennes se situent entre 30° et 38° S
        environ, aussi près de l’équateur que le sud de l’Espagne ou l’Afrique
        du Nord dans l’autre hémisphère. Le soleil monte haut et la saison de
        végétation est longue.

  - id: aus-ocean-cooling-001
    type: mcq
    deck: Australia
    tags: [australia, climate]
    status: reviewed
    source_id: c39-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Apart from altitude, which influence does most to cool Australia's southern coastal vineyards?"
      choices:
        - { text: "Breezes off the Southern and Indian Oceans", correct: true }
        - { text: "Frequent summer rain", correct: false }
        - { text: "Cold air draining from the Great Dividing Range", correct: false }
        - { text: "Winds blowing in from the dry interior", correct: false }
      explanation: |
        Air over the cold southern seas is drawn inland as the land heats up,
        trimming the hottest hours of the day. The effect fades quickly a few
        tens of kilometres from the coast. Winds from the interior do the
        opposite: they bring the heatwaves.
    fr:
      question: "Altitude mise à part, quelle influence rafraîchit le plus les vignobles côtiers du sud de l’Australie ?"
      choices:
        - { text: "Les brises des océans Austral et Indien", correct: true }
        - { text: "Des pluies d’été fréquentes", correct: false }
        - { text: "L’air froid qui descend de la Grande Cordillère australienne", correct: false }
        - { text: "Les vents venus de l’intérieur aride", correct: false }
      explanation: |
        Quand la terre chauffe, l’air des mers froides du sud est aspiré vers
        l’intérieur et écrête les heures les plus chaudes de la journée. L’effet
        s’estompe vite, à quelques dizaines de kilomètres de la côte. Les vents
        de l’intérieur font l’inverse : ce sont eux qui apportent les canicules.

  - id: aus-altitude-regions-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, climate]
    status: reviewed
    source_id: c39-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of South Australian regions owes its cooler conditions mainly to altitude?"
      choices:
        - { text: "Coonawarra and Padthaway", correct: false }
        - { text: "McLaren Vale and Langhorne Creek", correct: false }
        - { text: "Adelaide Hills and Eden Valley", correct: true }
        - { text: "Riverland and Barossa Valley", correct: false }
      explanation: |
        Both sit in the Mount Lofty Ranges east of Adelaide. Air cools by
        roughly 0.6 °C for every 100 m of height, so upland sites ripen later
        than the plains below.
    fr:
      question: "Quelle paire de régions d’Australie-Méridionale doit sa relative fraîcheur surtout à l’altitude ?"
      choices:
        - { text: "Coonawarra et Padthaway", correct: false }
        - { text: "McLaren Vale et Langhorne Creek", correct: false }
        - { text: "Adelaide Hills et Eden Valley", correct: true }
        - { text: "Riverland et Barossa Valley", correct: false }
      explanation: |
        Toutes deux se trouvent dans la chaîne du mont Lofty, à l’est
        d’Adélaïde. L’air perd environ 0,6 °C tous les 100 m de dénivelé : les
        sites en hauteur mûrissent plus tard que les plaines en contrebas.

  - id: aus-irrigation-reason-001
    type: mcq
    deck: Australia
    tags: [australia, viticulture, water]
    status: reviewed
    source_id: c39-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main reason irrigation is standard in many Australian vineyards?"
      choices:
        - { text: "Spring frost must be fought with sprinklers", correct: false }
        - { text: "Strong winds strip moisture from the canopy", correct: false }
        - { text: "Heavy winter rain leaches the topsoil", correct: false }
        - { text: "Too little rain falls in the growing season", correct: true }
      explanation: |
        Without added water, many vines would shut down in summer and crops
        would fall sharply. Drip lines let growers dose water vine by vine, and
        some use deficit irrigation on purpose to keep berries small.
    fr:
      question: "Pourquoi l’irrigation est-elle la norme dans de nombreux vignobles australiens ?"
      choices:
        - { text: "Il faut combattre le gel de printemps par aspersion", correct: false }
        - { text: "Des vents forts dessèchent le feuillage", correct: false }
        - { text: "De fortes pluies d’hiver lessivent la couche arable", correct: false }
        - { text: "Il pleut trop peu pendant la saison de végétation", correct: true }
      explanation: |
        Sans apport d’eau, beaucoup de vignes se bloqueraient en été et les
        rendements chuteraient. Le goutte-à-goutte permet de doser l’eau pied
        par pied, et certains pratiquent volontairement une irrigation
        déficitaire pour garder des baies petites.

  - id: aus-murray-irrigation-001
    type: mcq
    deck: Australia
    tags: [australia, viticulture, water]
    status: reviewed
    source_id: c39-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which river supplies the irrigation water that Australia's largest inland vineyards depend on?"
      choices:
        - { text: "The Hunter", correct: false }
        - { text: "The Murray", correct: true }
        - { text: "The Swan", correct: false }
        - { text: "The Derwent", correct: false }
      explanation: |
        In severe droughts its flow drops and water allocations are cut. During
        the Millennium Drought of the 2000s, some inland growers bought water at
        high prices or left blocks unwatered.
    fr:
      question: "Quel cours d’eau fournit l’eau d’irrigation dont dépendent les plus grands vignobles de l’intérieur australien ?"
      choices:
        - { text: "Hunter", correct: false }
        - { text: "Murray", correct: true }
        - { text: "Swan", correct: false }
        - { text: "Derwent", correct: false }
      explanation: |
        Lors des grandes sécheresses, son débit baisse et les allocations d’eau
        sont réduites. Pendant la « sécheresse du millénaire » des années 2000,
        certains viticulteurs de l’intérieur ont acheté de l’eau au prix fort ou
        laissé des parcelles sans irrigation.

  - id: aus-bushfire-risk-001
    type: mcq
    deck: Australia
    tags: [australia, climate, hazards]
    status: reviewed
    source_id: c39-0008
    review:
      fact_check: pass
      sources: [wine-australia]
    en:
      question: "Which summer hazard, beyond drought itself, most regularly threatens Australian wine regions?"
      choices:
        - { text: "Hailstorms", correct: false }
        - { text: "Tropical cyclones", correct: false }
        - { text: "Bush fires", correct: true }
        - { text: "Summer flooding", correct: false }
      explanation: |
        Dry grass, eucalyptus oil and hot northerly winds let fires spread fast.
        In the 2019–20 "Black Summer" season, a single December blaze damaged a
        large share of the vineyards in the Adelaide Hills.
    fr:
      question: "Quel danger estival, en plus de la sécheresse elle-même, menace le plus régulièrement les régions viticoles australiennes ?"
      choices:
        - { text: "Les orages de grêle", correct: false }
        - { text: "Les cyclones tropicaux", correct: false }
        - { text: "Les feux de brousse", correct: true }
        - { text: "Les inondations d’été", correct: false }
      explanation: |
        Herbe sèche, huile d’eucalyptus et vents chauds du nord propagent vite
        les incendies. Lors de l’« été noir » de 2019–2020, un seul incendie de
        décembre a endommagé une grande partie des vignes des Adelaide Hills.

  - id: aus-smoke-taint-001
    type: mcq
    deck: Australia
    tags: [australia, hazards, faults]
    status: reviewed
    source_id: c39-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a bush fire spoil a vintage even when the flames never reach the vines?"
      choices:
        - { text: "Smoke compounds taint the grapes", correct: true }
        - { text: "Ash on the leaves halts ripening", correct: false }
        - { text: "Hot winds from the fire split the berries", correct: false }
        - { text: "Fire retardant stops fermentation", correct: false }
      explanation: |
        Volatile phenols such as guaiacol pass through the skins and bind to
        sugars. They can stay hidden in the juice, then reappear after
        fermentation or in the mouth as ashy, medicinal flavours.
    fr:
      question: "Comment un feu de brousse peut-il gâcher un millésime même quand les flammes n’atteignent jamais les vignes ?"
      choices:
        - { text: "Des composés de la fumée contaminent les raisins", correct: true }
        - { text: "La cendre sur les feuilles bloque la maturation", correct: false }
        - { text: "Les vents chauds de l’incendie font éclater les baies", correct: false }
        - { text: "Le produit retardant arrête la fermentation", correct: false }
      explanation: |
        Des phénols volatils comme le gaïacol traversent la pellicule et se
        lient aux sucres. Ils peuvent rester masqués dans le moût, puis
        réapparaître après la fermentation ou en bouche, sous forme de goûts
        cendrés et médicinaux.

  - id: aus-tasmania-cool-plantings-001
    type: mcq
    deck: Australia
    tags: [australia, tasmania, climate]
    status: reviewed
    source_id: c39-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Australian state has seen the fastest proportional vineyard growth in recent decades?"
      choices:
        - { text: "Victoria", correct: false }
        - { text: "Western Australia", correct: false }
        - { text: "South Australia", correct: false }
        - { text: "Tasmania", correct: true }
      explanation: |
        At roughly 41° to 43°S it is the most southerly wine state, and growers
        seeking cooler sites have planted there steadily. It started from a
        small base, so it still makes only a small share of Australia's wine.
    fr:
      question: "Quel État australien a connu la plus forte croissance relative de son vignoble ces dernières décennies ?"
      choices:
        - { text: "Victoria", correct: false }
        - { text: "Australie-Occidentale", correct: false }
        - { text: "Australie-Méridionale", correct: false }
        - { text: "Tasmanie", correct: true }
      explanation: |
        Entre 41° et 43° S environ, c’est l’État viticole le plus austral, et
        les producteurs en quête de sites frais y plantent régulièrement. Parti
        de très bas, il ne produit encore qu’une petite part du vin australien.

  - id: aus-shiraz-leading-001
    type: mcq
    deck: Australia
    tags: [australia, shiraz, grapes]
    status: reviewed
    source_id: c39-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape covers the largest vineyard area in Australia, of either colour?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Shiraz", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Grenache", correct: false }
      explanation: |
        It grows in almost every region, from hot irrigated areas to cool hills.
        Some of the oldest producing vines in the world are Barossa Shiraz
        planted in the mid-1800s, which survived because phylloxera never
        reached South Australia.
    fr:
      question: "Quel cépage, toutes couleurs confondues, couvre la plus grande surface de vignes en Australie ?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Shiraz", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Grenache", correct: false }
      explanation: |
        On le trouve dans presque toutes les régions, des zones chaudes
        irriguées aux collines fraîches. Parmi les plus vieilles vignes en
        production du monde figurent des ceps de Shiraz de la Barossa plantés au
        milieu du XIXe siècle, épargnés parce que le phylloxéra n’a jamais
        atteint l’Australie-Méridionale.

  - id: aus-shiraz-warm-style-001
    type: mcq
    deck: Australia
    tags: [australia, shiraz, style]
    status: reviewed
    source_id: c39-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best fits a classic Shiraz from a hot or warm Australian region?"
      choices:
        - { text: "Full body, red fruit, high acidity", correct: false }
        - { text: "Medium body, black pepper, firm acidity", correct: false }
        - { text: "Full body, green pepper, grippy tannin", correct: false }
        - { text: "Full body, ripe black fruit, earthy spice", correct: true }
      explanation: |
        Long sunny seasons build sugar, colour and soft, ripe tannin, and
        acidity falls as the grapes ripen. Old, low-yielding vines in some warm
        regions add further concentration.
    fr:
      question: "Quel profil correspond le mieux à un Shiraz classique d’une région chaude ou très chaude d’Australie ?"
      choices:
        - { text: "Corsé, fruits rouges frais, acidité élevée", correct: false }
        - { text: "Corps moyen, poivre noir, acidité ferme", correct: false }
        - { text: "Corsé, poivron vert, tanins accrocheurs", correct: false }
        - { text: "Corsé, fruits noirs mûrs, épices terreuses", correct: true }
      explanation: |
        Les longues saisons ensoleillées accumulent sucre, couleur et tanins
        mûrs et souples, tandis que l’acidité baisse au fil de la maturation.
        Dans certaines régions chaudes, de vieilles vignes à faible rendement
        ajoutent encore de la concentration.

  - id: aus-shiraz-restrained-001
    type: mcq
    deck: Australia
    tags: [australia, shiraz, winemaking]
    status: reviewed
    source_id: c39-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the cellar, how are some producers in warm Australian regions making a more restrained Shiraz?"
      choices:
        - { text: "By blending in a little Grenache", correct: false }
        - { text: "By extracting less during fermentation", correct: true }
        - { text: "By fermenting with selected cultured yeast", correct: false }
        - { text: "By filtering more tightly before bottling", correct: false }
      explanation: |
        Gentler pump-overs, fewer punch-downs and shorter time on skins draw out
        less tannin and colour. Many pair this with older or larger barrels so
        that oak does not add weight back.
    fr:
      question: "En cave, comment certains producteurs des régions chaudes d’Australie obtiennent-ils un Shiraz plus mesuré ?"
      choices:
        - { text: "En ajoutant un peu de Grenache à l’assemblage", correct: false }
        - { text: "En extrayant moins pendant la fermentation", correct: true }
        - { text: "En fermentant avec des levures sélectionnées", correct: false }
        - { text: "En filtrant plus serré avant la mise en bouteille", correct: false }
      explanation: |
        Des remontages plus doux, moins de pigeages et une macération plus
        courte extraient moins de tanins et de couleur. Beaucoup y associent des
        fûts plus vieux ou plus grands, pour que le bois ne rajoute pas de
        poids.

  - id: aus-shiraz-cool-pepper-001
    type: mcq
    deck: Australia
    tags: [australia, shiraz, style]
    status: reviewed
    source_id: c39-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of regions is associated with a leaner, more peppery Australian Shiraz?"
      choices:
        - { text: "Barossa Valley and McLaren Vale", correct: false }
        - { text: "Riverland and Riverina", correct: false }
        - { text: "Geelong and Canberra District", correct: true }
        - { text: "Hunter Valley and Rutherglen", correct: false }
      explanation: |
        The peppery note comes from rotundone, which builds up in cooler
        seasons. Clonakilla in the Canberra District made its name by
        co-fermenting Shiraz with a little Viognier, in the manner of Côte-Rôtie.
    fr:
      question: "Quel duo de régions est associé à un Shiraz australien plus svelte et plus poivré ?"
      choices:
        - { text: "Barossa Valley et McLaren Vale", correct: false }
        - { text: "Riverland et Riverina", correct: false }
        - { text: "Geelong et Canberra District", correct: true }
        - { text: "Hunter Valley et Rutherglen", correct: false }
      explanation: |
        La note poivrée vient de la rotundone, qui s’accumule lors des saisons
        plus fraîches. Dans le Canberra District, Clonakilla s’est fait un nom
        en cofermentant le Shiraz avec un peu de Viognier, à la manière de la
        Côte-Rôtie.

  - id: aus-cabernet-vs-shiraz-001
    type: mcq
    deck: Australia
    tags: [australia, cabernet-sauvignon, style]
    status: reviewed
    source_id: c39-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with Australian Shiraz, how does Australian Cabernet Sauvignon usually differ in structure?"
      choices:
        - { text: "Softer tannin and fleshier fruit", correct: false }
        - { text: "Lower acidity and higher alcohol", correct: false }
        - { text: "Paler colour and lighter body", correct: false }
        - { text: "Firmer tannin and higher acidity", correct: true }
      explanation: |
        Cabernet's small, thick-skinned berries give a tighter frame, with
        blackcurrant and black cherry fruit. It buds and ripens later than
        Shiraz, and toasty oak is usual at the premium level.
    fr:
      question: "Par rapport au Shiraz australien, en quoi la structure du Cabernet Sauvignon australien diffère-t-elle le plus souvent ?"
      choices:
        - { text: "Tanins plus souples, fruit plus charnu", correct: false }
        - { text: "Acidité plus basse, alcool plus élevé", correct: false }
        - { text: "Robe plus pâle, corps plus léger", correct: false }
        - { text: "Tanins plus fermes, acidité plus élevée", correct: true }
      explanation: |
        Les petites baies à peau épaisse du Cabernet donnent une charpente plus
        serrée, avec des arômes de cassis et de cerise noire. Il débourre et
        mûrit plus tard que le Shiraz, et un boisé grillé est courant dans le
        haut de gamme.

  - id: aus-pinot-premium-style-001
    type: mcq
    deck: Australia
    tags: [australia, pinot-noir, style]
    status: reviewed
    source_id: c39-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits Pinot Noir from Australia's best cool sites?"
      choices:
        - { text: "Medium body, fresh acidity, cherry and strawberry", correct: true }
        - { text: "Full body, low acidity, jammy plum and prune", correct: false }
        - { text: "Light body, sharp acidity, cranberry and green leaf", correct: false }
        - { text: "Deep colour, firm tannin, cassis and cedar", correct: false }
      explanation: |
        Alcohol usually stays moderate because sugar builds slowly in these
        sites. Many producers now add some whole bunches to the ferment for
        extra perfume and a firmer, finer tannin.
    fr:
      question: "Quel profil correspond au Pinot Noir des meilleurs sites frais d’Australie ?"
      choices:
        - { text: "Corps moyen, acidité fraîche, cerise et fraise", correct: true }
        - { text: "Corps ample, acidité basse, prune confite et pruneau", correct: false }
        - { text: "Corps léger, acidité mordante, canneberge et feuille verte", correct: false }
        - { text: "Robe profonde, tanins fermes, cassis et cèdre", correct: false }
      explanation: |
