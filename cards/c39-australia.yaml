        - { text: "Light, neutral and early-picked", correct: false }
        - { text: "Soft, simple and tropical", correct: false }
        - { text: "Concentrated and full-bodied", correct: true }
      explanation: |
        Low-vigour soils keep yields small, which concentrates flavour and adds
        complexity. By Farr is one of the region's most admired producers.

  - id: aus-geelong-pinot-earthy-001
    type: mcq
