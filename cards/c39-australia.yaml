    tags: [australia, south-australia, clare-valley, climate]
    status: reviewed
    source_id: c39-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which conditions help the warm Clare Valley keep freshness in its grapes?"
      choices:
        - { text: "Summer cloud off a cold current", correct: false }
        - { text: "Morning fog rising off the Murray River", correct: false }
        - { text: "Cool afternoon breezes and cold nights", correct: true }
        - { text: "High humidity that slows ripening", correct: false }
      explanation: |
        A wide gap between day and night temperatures slows the loss of
        acid during ripening. That is why a region with hot days can still
        make taut, dry whites.
    fr:
      question: "Quelles conditions aident la Clare Valley, région chaude, à préserver la fraîcheur de ses raisins ?"
      choices:
        - { text: "Des nuages estivaux liés à un courant froid", correct: false }
        - { text: "Le brouillard matinal du fleuve Murray", correct: false }
        - { text: "Des brises fraîches l’après-midi et des nuits froides", correct: true }
        - { text: "Une forte humidité qui ralentit la maturation", correct: false }
      explanation: |
        Un grand écart de température entre le jour et la nuit ralentit la
        perte d’acidité pendant la maturation. C’est pourquoi une région aux
        journées chaudes peut tout de même produire des blancs secs et
        tendus.

