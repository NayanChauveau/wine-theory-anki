        - { text: "Victoria", correct: false }
        - { text: "New South Wales", correct: true }
        - { text: "Western Australia", correct: false }
      explanation: |
        Vine cuttings arrived with the First Fleet at Sydney Cove in 1788, decades
        before the first plantings in Victoria or South Australia.

