    en:
      question: "How is the climate of South Australia's Eden Valley best described?"
      choices:
        - { text: "Warm and dry, with little site variation", correct: false }
        - { text: "Cool, owing to cold ocean currents", correct: false }
        - { text: "Cool to moderate, varying with altitude", correct: true }
        - { text: "Hot, tempered by river fog", correct: false }
      explanation: |
        The highest ground, in the High Eden subregion, is noticeably
        cooler than slopes nearer the Barossa floor, so picking dates can
        differ by weeks within one region.

  - id: aus-eden-riesling-ageing-001
    type: mcq
