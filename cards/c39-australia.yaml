        - { text: "Aged several months in new French oak", correct: false }
        - { text: "Given skin contact and full malolactic", correct: false }
        - { text: "Kept in inert vessels with little oxygen", correct: true }
      explanation: |
        Stainless steel and protective handling keep the wine pale and fresh,
        so it can evolve slowly in bottle. Most top examples are now sealed
        under screwcap for the same reason.
    fr:
      question: "Au chai, comment le Sémillon sec australien classique de longue garde est-il d’habitude vinifié ?"
      choices:
        - { text: "Fermenté en barrique, avec bâtonnage régulier", correct: false }
        - { text: "Élevé plusieurs mois en chêne français neuf", correct: false }
        - { text: "Macération pelliculaire et malolactique complète", correct: false }
        - { text: "Gardé en cuves inertes, avec peu d’oxygène", correct: true }
      explanation: |
        L’inox et une vinification à l’abri de l’air gardent le vin pâle et
        frais, pour qu’il évolue lentement en bouteille. Pour la même raison, la
        plupart des grands vins sont aujourd’hui bouchés à vis.

