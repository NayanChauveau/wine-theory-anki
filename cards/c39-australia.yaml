  - id: aus-mornington-vintage-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, mornington-peninsula, vintage]
    status: reviewed
    source_id: c39-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What makes Mornington Peninsula quality swing so much from one vintage to the next?"
      choices:
        - { text: "Spring frost in low-lying blocks", correct: false }
        - { text: "Hail from inland thunderstorms", correct: false }
        - { text: "Cool, wet, windy spells at flowering", correct: true }
        - { text: "Summer drought limiting irrigation", correct: false }
      explanation: |
        Wind and rain at flowering cause poor fruit set (coulure and
        millerandage), which cuts yields. Similar weather can return at harvest
        and bring rot.
    fr:
      question: "Pourquoi la qualité de la Mornington Peninsula varie-t-elle autant d’un millésime à l’autre ?"
      choices:
        - { text: "Le gel de printemps dans les parcelles basses", correct: false }
        - { text: "La grêle des orages venus de l’intérieur", correct: false }
        - { text: "Un temps frais, humide et venteux à la floraison", correct: true }
        - { text: "La sécheresse d’été qui limite l’irrigation", correct: false }
      explanation: |
        Le vent et la pluie à la floraison perturbent la nouaison (coulure et
        millerandage), ce qui réduit les rendements. Un temps semblable peut
        revenir aux vendanges et apporter la pourriture.

  - id: aus-mornington-good-year-001
