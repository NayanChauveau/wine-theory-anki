        - { text: "Soft and oily, with honeysuckle and apricot", correct: false }
        - { text: "Elegant and high in acid, with citrus and peach", correct: true }
        - { text: "Full and buttery, with fig and melon", correct: false }
      explanation: |
        Brian Croser's Tiers vineyard in the Piccadilly Valley, planted in
        1979, helped prove that the hills could give restrained, long-lived
        Chardonnay.

  - id: aus-adelaide-hills-pinot-001
    type: mcq
