        - { text: "Fully ripe, to build maximum body", correct: false }
        - { text: "Early, at low sugar and high acid", correct: true }
        - { text: "Late, for riper citrus flavour", correct: false }
      explanation: |
        Picking before the grapes lose acid keeps the wine lean and sharp at
        first. Alcohol often ends up at only about
        10 to 11.5%.
    fr:
      question: "À quelle maturité vendange-t-on d’habitude le Sémillon sec australien classique de longue garde ?"
      choices:
        - { text: "En milieu de saison, sucre modéré", correct: false }
        - { text: "À pleine maturité, pour un maximum de corps", correct: false }
        - { text: "Tôt, sucre bas et acidité haute", correct: true }
        - { text: "Tard, pour des agrumes plus mûrs", correct: false }
      explanation: |
        Vendanger avant que les raisins ne perdent leur acidité donne un vin
        d’abord svelte et tranchant. L’alcool ne dépasse souvent guère 10 à 11,5
        %.

  - id: aus-semillon-classic-cellar-001
    type: mcq
