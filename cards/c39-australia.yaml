    fr:
      question: "Où se situe l’État de Victoria sur le continent australien ?"
      choices:
        - { text: "Dans le coin sud-ouest", correct: false }
        - { text: "Dans le coin sud-est", correct: true }
        - { text: "Au centre de la côte sud", correct: false }
        - { text: "Sur la côte nord-est", correct: false }
      explanation: |
        Le détroit de Bass le sépare de la Tasmanie. Melbourne, sa capitale,
        est la porte d’entrée de la plupart des régions viticoles de l’État.

