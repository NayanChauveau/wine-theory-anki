        - { text: "Chêne hongrois", correct: false }
        - { text: "Chêne français", correct: false }
      explanation: |
        Ses notes de noix de coco et de vanille sucrée conviennent à un fruit
        très mûr. Penfolds Grange, bâti en grande partie sur le Shiraz de la
        Barossa, est élevé depuis longtemps en fûts neufs de 300 litres en chêne
        américain ; le chêne français n’a gagné du terrain que plus récemment.

  - id: aus-barossa-shiraz-ageing-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa, shiraz]
    status: reviewed
    source_id: c39-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which notes does a classic Barossa Valley Shiraz develop with bottle age?"
      choices:
        - { text: "Cut grass and green pepper", correct: false }
        - { text: "Pepper and violets", correct: false }
        - { text: "Leather and spice", correct: true }
        - { text: "Coconut and vanilla", correct: false }
      explanation: |
        Slow oxidation in bottle turns young blackberry and plum towards
        dried fruit and savoury tertiary notes. Coconut and vanilla come
        from oak, and are present from the start rather than with age.
    fr:
      question: "Quels arômes un Shiraz classique de la Barossa Valley développe-t-il avec le vieillissement en bouteille ?"
      choices:
        - { text: "Herbe coupée et poivron vert", correct: false }
        - { text: "Poivre et violette", correct: false }
        - { text: "Cuir et épices", correct: true }
        - { text: "Noix de coco et vanille", correct: false }
      explanation: |
        L’oxydation lente en bouteille fait évoluer la mûre et la prune de
        la jeunesse vers les fruits séchés et des notes tertiaires
        évoluées. La noix de coco et la vanille viennent du chêne : elles
        sont présentes dès le départ, pas avec l’âge.

