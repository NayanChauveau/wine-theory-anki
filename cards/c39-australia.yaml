      sources: [wine-australia]
    en:
      question: "Which Australian GI lets a brand blend fruit from vineyards in several states?"
      choices:
        - { text: "Big Rivers", correct: false }
        - { text: "Lower Murray", correct: false }
        - { text: "South Eastern Australia", correct: true }
        - { text: "Limestone Coast", correct: false }
      explanation: |
        It is a multi-state GI, often called a "super zone". It covers all of
        New South Wales, Victoria, Tasmania and the ACT, plus the south-east of
        Queensland and South Australia, which takes in all their wine regions.
        Western Australia lies wholly outside it. The other three are single
        zones within one state.
    fr:
      question: "Quelle indication géographique (IG) australienne permet à une marque d’assembler des raisins de vignobles situés dans plusieurs États ?"
      choices:
        - { text: "Big Rivers", correct: false }
        - { text: "Lower Murray", correct: false }
        - { text: "South Eastern Australia", correct: true }
        - { text: "Limestone Coast", correct: false }
      explanation: |
        C’est une IG qui s’étend sur plusieurs États, souvent appelée
        « super-zone ». Elle couvre toute la Nouvelle-Galles du Sud, le
        Victoria, la Tasmanie et l’ACT, plus le sud-est du Queensland et de
        l’Australie-Méridionale, où se trouvent toutes leurs régions
        viticoles. L’Australie-Occidentale en est entièrement exclue. Les trois autres sont de simples zones
        situées dans un seul État.

