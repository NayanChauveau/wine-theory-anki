        - { text: "Adelaide Hills", correct: false }
        - { text: "Eden Valley", correct: true }
        - { text: "Langhorne Creek", correct: false }
      explanation: |
        A zone is a broad GI that groups neighbouring regions. The Barossa
        zone holds just these two, so a blend of both is labelled
        "Barossa" rather than with either region's name.

  - id: aus-eden-valley-location-001
    type: mcq
