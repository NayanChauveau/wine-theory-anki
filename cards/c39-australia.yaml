    en:
      question: "Apart from Cabernet Sauvignon, which grapes take most of the rest of Coonawarra's vineyard area?"
      choices:
        - { text: "Shiraz, Grenache and Semillon", correct: false }
        - { text: "Merlot, Pinot Noir and Viognier", correct: false }
        - { text: "Chardonnay, Grenache and Pinot Noir", correct: false }
        - { text: "Shiraz, Merlot and Chardonnay", correct: true }
      explanation: |
        Grenache needs more heat than this moderate climate gives. Shiraz
        here is often more peppery and medium-bodied than Barossa examples.
    fr:
      question: "Hormis le Cabernet Sauvignon, quels cépages occupent l’essentiel du reste du vignoble de Coonawarra ?"
      choices:
        - { text: "Shiraz, Grenache et Sémillon", correct: false }
        - { text: "Merlot, Pinot Noir et Viognier", correct: false }
        - { text: "Chardonnay, Grenache et Pinot Noir", correct: false }
        - { text: "Shiraz, Merlot et Chardonnay", correct: true }
      explanation: |
        Le Grenache demande plus de chaleur que ce climat modéré n’en offre.
        Le Shiraz y est souvent plus poivré et moins corsé que celui de la
        Barossa.

