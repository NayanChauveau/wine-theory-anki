# yaml-language-server: $schema=../schema/cards.schema.json
# source: C39 (import/inbox/c39-australia.yaml)
# deck: Australia

cards:
  - id: aus-hunter-chardonnay-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, chardonnay]
    status: reviewed
    source_id: c39-0151
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides its signature white, which white grape is widely planted in the Hunter Valley and made both oaked and unoaked?"
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Marsanne", correct: false }
      explanation: |
        Tyrrell's Vat 47, first released in the early 1970s, is often credited as one
        of Australia's first commercial varietal Chardonnays.

  - id: aus-hunter-black-grape-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, shiraz]
    status: reviewed
    source_id: c39-0153
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape accounts for the largest share of red wine made in the Hunter Valley?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Pinot Noir", correct: false }
        - { text: "Shiraz", correct: true }
      explanation: |
        It has been grown in the Hunter since the 19th century. Older bottlings were
        often sold under borrowed names such as "Hermitage" or "Burgundy", a practice
        Australia has since dropped.

  - id: aus-hunter-shiraz-style-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, shiraz, style]
    status: reviewed
    source_id: c39-0154
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best describes a typical Hunter Valley Shiraz?"
      choices:
        - { text: "Full body, ripe tannins, chocolate and jam", correct: false }
        - { text: "Light body, high acidity, red cherry", correct: false }
        - { text: "Medium body, soft tannins, earthy notes", correct: true }
        - { text: "Full body, firm tannins, intense black pepper", correct: false }
      explanation: |
        Summer cloud and humidity slow sugar build-up, so alcohol and extraction stay
        moderate. The fruit leans to blackberry and cherry, and the earthy, leathery
        side grows with bottle age.

  - id: aus-wa-state-blend-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, labelling, gi]
    status: reviewed
    source_id: c39-0156
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A wine is blended from roughly equal parts Swan Valley and Great Southern grapes. What is the most specific single GI name it can carry?"
      choices:
        - { text: "Great Southern", correct: false }
        - { text: "South Eastern Australia", correct: false }
        - { text: "Western Australia", correct: true }
        - { text: "Greater Perth", correct: false }
      explanation: |
        Swan Valley sits in the Greater Perth zone and Great Southern in the South West
        Australia zone, so only the state GI spans both. A named GI needs at least 85% of
        the grapes from that area. Nearly all the state's vineyards lie in its
        south-west corner.

  - id: aus-cross-state-blend-001
    type: mcq
    deck: Australia
    tags: [australia, labelling, gi, western-australia, south-australia]
    status: reviewed
    source_id: c39-0157
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A wine blends Barossa Valley Shiraz and Margaret River Cabernet Sauvignon in roughly equal parts. What is the most specific single GI name it can carry?"
      choices:
        - { text: "South Australia", correct: false }
        - { text: "Western Australia", correct: false }
        - { text: "South Eastern Australia", correct: false }
        - { text: "Australia", correct: true }
      explanation: |
        Western Australia lies outside South Eastern Australia, so no multi-state GI
        joins the two, and the blend falls back on the national name. The vineyards
        involved are more than 2,000 km apart.

  - id: aus-margaret-river-location-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, margaret-river, geography]
    status: reviewed
    source_id: c39-0158
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Relative to Perth, where does the Margaret River region lie?"
      choices:
        - { text: "In the Swan Valley, on Perth's north-eastern edge", correct: false }
        - { text: "On the Indian Ocean coast, well south of Perth", correct: true }
        - { text: "In the Perth Hills, just east of the city", correct: false }
        - { text: "On the Southern Ocean coast near Albany", correct: false }
      explanation: |
        The region is a strip of land between Cape Naturaliste in the north and Cape
        Leeuwin in the south, roughly 100 km long and a few hours' drive from Perth.

  - id: aus-margaret-river-climate-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, margaret-river, climate]
    status: reviewed
    source_id: c39-0159
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate description best fits Margaret River?"
      choices:
        - { text: "Cool maritime, with rain spread through the year", correct: false }
        - { text: "Warm continental, with summer storms", correct: false }
        - { text: "Warm maritime, with rain mostly in winter", correct: true }
        - { text: "Hot and dry, with irrigation from rivers", correct: false }
      explanation: |
        Annual rainfall is high, but dry, breezy summers keep disease pressure down. In
        the mid-1960s agronomist John Gladstones flagged the area's promise, and Vasse
        Felix planted the first commercial vineyard in 1967.

  - id: aus-margaret-river-cabernet-partner-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, margaret-river, cabernet-sauvignon, blending]
    status: reviewed
    source_id: c39-0161
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Margaret River, which grape most often joins Cabernet Sauvignon in red blends?"
      choices:
        - { text: "Merlot", correct: true }
        - { text: "Shiraz", correct: false }
        - { text: "Grenache", correct: false }
        - { text: "Mataro", correct: false }
      explanation: |
        The region follows the Bordeaux model, so Merlot softens Cabernet's tannin. Styles
        range from restrained and elegant to riper and more powerful; Cullen's Diana
        Madeline is a well-known Cabernet-led example.

  - id: aus-margaret-river-chardonnay-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, margaret-river, chardonnay, style]
    status: reviewed
    source_id: c39-0163
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best fits a top Margaret River Chardonnay?"
      choices:
        - { text: "Delicate green apple, light body, lean finish", correct: false }
        - { text: "Tropical fruit, soft acidity, sweet oak", correct: false }
        - { text: "Honeyed nuttiness, low acidity, oxidative notes", correct: false }
        - { text: "Concentrated stone fruit, high natural acidity", correct: true }
      explanation: |
        Many vineyards use the Gingin clone, whose uneven "hen and chicken" bunches add
        concentration. Producers choose freely how much malolactic conversion and barrel
        ageing to use; Leeuwin Estate's Art Series is the best-known benchmark.

  - id: aus-great-southern-location-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, great-southern, geography]
    status: reviewed
    source_id: c39-0166
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Western Australian region lies south-east of Margaret River, along the state's south coast?"
      choices:
        - { text: "Geographe", correct: false }
        - { text: "Peel", correct: false }
        - { text: "Swan Valley", correct: false }
        - { text: "Great Southern", correct: true }
      explanation: |
        It is a separate region, not part of Margaret River. Being further south and
        exposed to the Southern Ocean, it is generally cooler, and it is among the largest
        wine regions in Australia by area.

  - id: aus-great-southern-subregions-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, great-southern, regions]
    status: reviewed
    source_id: c39-0167
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which two Great Southern sub-regions have the strongest name for deeply coloured Cabernet Sauvignon?"
      choices:
        - { text: "Denmark and Albany", correct: false }
        - { text: "Mount Barker and Frankland River", correct: true }
        - { text: "Pemberton and Manjimup", correct: false }
        - { text: "Geographe and Peel", correct: false }
      explanation: |
        Both sit inland, away from the moderating coast, with warm days and cool nights.
        Plantagenet's Mount Barker vineyard, planted in the late 1960s, was one of the
        area's pioneers.

  - id: aus-great-southern-shiraz-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, great-southern, shiraz, style]
    status: reviewed
    source_id: c39-0167
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style of Shiraz is associated with Western Australia's Great Southern region?"
      choices:
        - { text: "Dense, jammy and chocolate-rich", correct: false }
        - { text: "Soft, low in acid and sweetly oaked", correct: false }
        - { text: "Elegant, medium-bodied and peppery", correct: true }
        - { text: "Ripe, plummy and high in alcohol", correct: false }
      explanation: |
        Slow ripening keeps rotundone, the aroma compound behind black pepper, in the
        grapes. The same note marks cool-climate Syrah from the northern Rhône.

  - id: aus-tasmania-cooling-001
    type: mcq
    deck: Australia
    tags: [australia, tasmania, climate]
    status: reviewed
    source_id: c39-0168
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main cooling influence on Tasmania's vineyards?"
      choices:
        - { text: "Westerly winds off the Southern Ocean", correct: true }
        - { text: "High altitude at most vineyard sites", correct: false }
        - { text: "A cold current flowing up the east coast", correct: false }
        - { text: "Afternoon fog drawn in from Bass Strait", correct: false }
      explanation: |
        The island sits at roughly 41–43°S. Most vineyards are low-lying, in sheltered
        valleys such as the Tamar in the north and the Derwent near Hobart. The sea also
        spares it the heat spikes common on the mainland.

  - id: aus-tasmania-sparkling-origin-001
    type: mcq
    deck: Australia
    tags: [australia, tasmania, sparkling, history]
    status: reviewed
    source_id: c39-0169
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What first made Tasmanian grapes sought after by mainland Australian wineries?"
      choices:
        - { text: "Raisined fruit for fortified Muscat", correct: false }
        - { text: "Cheap bulk Shiraz for blending", correct: false }
        - { text: "Botrytised Semillon for sweet wine", correct: false }
        - { text: "Base wine for sparkling blends", correct: true }
      explanation: |
        Jansz began in the mid-1980s as a venture with the Champagne house Louis
        Roederer. House of Arras now makes long lees-aged traditional-method wines
        entirely from Tasmanian fruit.

  - id: aus-tasmania-leading-grape-001
    type: mcq
    deck: Australia
    tags: [australia, tasmania, grapes, pinot-noir]
    status: reviewed
    source_id: c39-0170
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape covers the largest share of Tasmania's vineyards?"
      choices:
        - { text: "Chardonnay", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Chardonnay follows, with Sauvignon Blanc and Pinot Gris well behind. A little
        Cabernet Sauvignon ripens in the warmest, driest pockets, such as the Coal River
        Valley north-east of Hobart, home of Domaine A.

  - id: aus-gi-zone-example-001
    type: mcq
    deck: Australia
    tags: [australia, labelling, gi, victoria]
    status: reviewed
    source_id: c39-0172
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Victorian name is a GI zone rather than a region?"
      choices:
        - { text: "Yarra Valley", correct: false }
        - { text: "Port Phillip", correct: true }
        - { text: "Mornington Peninsula", correct: false }
        - { text: "Geelong", correct: false }
      explanation: |
        It groups the regions around Melbourne: the Yarra Valley, Mornington Peninsula,
        Geelong, Macedon Ranges and Sunbury. Zones are broad areas drawn without any
        need for a shared wine character.

  - id: aus-gi-region-test-001
    type: mcq
    deck: Australia
    tags: [australia, labelling, gi]
    status: reviewed
    source_id: c39-0175
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which test must an area meet to be registered as a GI region in Australia?"
      choices:
        - { text: "Follow a single river valley or watershed", correct: false }
        - { text: "Grow one dominant grape variety", correct: false }
        - { text: "Hold vineyards at least 30 years old", correct: false }
        - { text: "Have a consistent, distinct character", correct: true }
      explanation: |
        There is also a size floor: at least five independently owned vineyards of 5 ha
        or more, together harvesting at least 500 tonnes a year. Regions vary widely in
        area but are smaller than the zones above them.

  - id: aus-gi-subregion-001
    type: mcq
    deck: Australia
    tags: [australia, labelling, gi]
    status: reviewed
    source_id: c39-0177
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does an Australian GI sub-region relate to the regions around it?"
      choices:
        - { text: "It may straddle two neighbouring regions", correct: false }
        - { text: "It lies wholly within one region", correct: true }
        - { text: "It sits under a zone, outside any region", correct: false }
        - { text: "It replaces the region tier in small zones", correct: false }
      explanation: |
        Lenswood and Piccadilly Valley, for example, are both sub-regions of the Adelaide
        Hills. Many regions have no sub-regions at all.

  - id: aus-vic-great-dividing-range-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, climate]
    status: reviewed
    source_id: c39-0102
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which landform rises inland from Melbourne and gives Victoria many of its higher, cooler vineyard sites?"
      choices:
        - { text: "The Grampians", correct: false }
        - { text: "The Strzelecki Ranges", correct: false }
        - { text: "The Great Dividing Range", correct: true }
        - { text: "The Otway Ranges", correct: false }
      explanation: |
        Air cools by roughly 0.6 °C for every 100 m of climb, and slopes facing
        different ways catch different amounts of sun. Across its foothills and
        heights, growers can match each grape to a site that suits it.

  - id: aus-vic-altitude-regions-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, climate]
    status: reviewed
    source_id: c39-0103
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of Victorian regions owes its cool climate mainly to altitude?"
      choices:
        - { text: "Macedon Ranges and Upper Goulburn", correct: true }
        - { text: "Mornington Peninsula and Gippsland", correct: false }
        - { text: "Pyrenees and Bendigo", correct: false }
        - { text: "Rutherglen and Glenrowan", correct: false }
      explanation: |
        The Macedon Ranges are among the coolest regions on the Australian
        mainland, cold enough that ripening can be a struggle in poor years.
        Bindi and Curly Flat are well-known producers there.

  - id: aus-vic-high-sites-whites-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, grapes]
    status: reviewed
    source_id: c39-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides Pinot Noir and Chardonnay, which pair of aromatic whites suits Victoria's high, cool inland sites?"
      choices:
        - { text: "Viognier and Roussanne", correct: false }
        - { text: "Semillon and Verdelho", correct: false }
        - { text: "Muscat and Muscadelle", correct: false }
        - { text: "Riesling and Sauvignon Blanc", correct: true }
      explanation: |
        Cool nights slow the loss of acidity and keep the citrus, floral and
        herbaceous aromas these grapes rely on. In a hot site they lose that
        lift and turn broad.

  - id: aus-vic-lower-slopes-reds-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, grapes]
    status: reviewed
    source_id: c39-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of grapes leads on the lower, warmer slopes of central Victoria's inland ranges?"
      choices:
        - { text: "Shiraz and Cabernet Sauvignon", correct: true }
        - { text: "Pinot Noir and Chardonnay", correct: false }
        - { text: "Grenache and Mourvèdre", correct: false }
        - { text: "Semillon and Chardonnay", correct: false }
      explanation: |
        Both are late-ripening black grapes. Lower down they get the extra warmth
        they need; higher up the season can end before they are fully ripe.

  - id: aus-yarra-location-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, yarra-valley]
    status: reviewed
    source_id: c39-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does the Yarra Valley lie in relation to Melbourne?"
      choices:
        - { text: "North-west of the city", correct: false }
        - { text: "South-east of the city", correct: false }
        - { text: "North-east of the city", correct: true }
        - { text: "West of the city", correct: false }
      explanation: |
        Its vineyards begin about an hour's drive from the city centre, around
        towns such as Healesville, Coldstream and Yarra Glen.

  - id: aus-yarra-climate-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, yarra-valley, climate]
    status: reviewed
    source_id: c39-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate label best fits the Yarra Valley?"
      choices:
        - { text: "Warm to hot Mediterranean", correct: false }
        - { text: "Cool to moderate continental", correct: false }
        - { text: "Moderate to warm continental", correct: false }
        - { text: "Cool to moderate maritime", correct: true }
      explanation: |
        Mild conditions close to Melbourne drew Victoria's first vines: the Ryrie
        brothers planted at Yering Station in 1838.

  - id: aus-yarra-site-diversity-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, yarra-valley, terroir]
    status: reviewed
    source_id: c39-0108
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can the Yarra Valley ripen grapes as different as Chardonnay and Cabernet Sauvignon?"
      choices:
        - { text: "River irrigation stretches the growing season", correct: false }
        - { text: "Its sites vary widely in altitude and aspect", correct: true }
        - { text: "A hot northerly wind finishes the late grapes", correct: false }
        - { text: "Deep, uniform loams store the summer rain", correct: false }
      explanation: |
        Warm, low, north-facing slopes suit late ripeners, while high sites in the
        Upper Yarra suit early ones. Yarra Yering, on warm lower slopes, is known
        for its Cabernet-based and Shiraz-based blends.

  - id: aus-yarra-pinot-style-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, yarra-valley, pinot-noir]
    status: reviewed
    source_id: c39-0111
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best fits a top Yarra Valley Pinot Noir?"
      choices:
        - { text: "Ripe red and dark fruit, soft tannins", correct: true }
        - { text: "Pale, tart cranberry fruit, green tannins", correct: false }
        - { text: "Jammy black fruit, heavy extraction", correct: false }
        - { text: "Blackcurrant, eucalyptus, firm tannins", correct: false }
      explanation: |
        Careful oak handling adds savoury complexity, and the best wines can age
        for a decade or more. Coldstream Hills, founded in 1985 by the critic
        James Halliday, was built around the grape.

  - id: aus-yarra-reds-weight-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, yarra-valley, shiraz, cabernet-sauvignon]
    status: reviewed
    source_id: c39-0112
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do Yarra Valley Shiraz and Cabernet Sauvignon usually compare with those of warmer Australian regions?"
      choices:
        - { text: "Riper and more alcoholic", correct: false }
        - { text: "Deeper in colour", correct: false }
        - { text: "Lighter in body", correct: true }
        - { text: "Lower in acidity", correct: false }
      explanation: |
        Cooler sites ripen these late grapes slowly, so sugar and extraction stay
        lower. Some Yarra Shiraz is co-fermented with a little Viognier, as at
        Yering Station.

  - id: aus-mornington-location-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, mornington-peninsula]
    status: reviewed
    source_id: c39-0114
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does the Mornington Peninsula lie in relation to Melbourne?"
      choices:
        - { text: "West of the city", correct: false }
        - { text: "North of the city", correct: false }
        - { text: "East of the city", correct: false }
        - { text: "South of the city", correct: true }
      explanation: |
        It runs down from the outer suburbs between Port Phillip Bay and Western
        Port, about an hour's drive from the centre.

  - id: aus-mornington-boutique-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, mornington-peninsula]
    status: reviewed
    source_id: c39-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which kind of winery dominates on the Mornington Peninsula?"
      choices:
        - { text: "Small family-run estates", correct: true }
        - { text: "Large co-operative cellars", correct: false }
        - { text: "Big multi-regional brands", correct: false }
        - { text: "Bulk plants buying in fruit", correct: false }
      explanation: |
        Land close to Melbourne is costly and yields are modest, so the region
        suits low-volume wine sold at a high price, much of it at the cellar
        door. Stonier and Paringa Estate are well-known names.

  - id: aus-mornington-vintage-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, mornington-peninsula, vintage]
    status: reviewed
    source_id: c39-0117
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What makes Mornington Peninsula quality swing so much from one vintage to the next?"
      choices:
        - { text: "Spring frost in low-lying blocks", correct: false }
        - { text: "Hail from inland thunderstorms", correct: false }
        - { text: "Cool, wet, windy spells at flowering", correct: true }
        - { text: "Summer drought limiting irrigation", correct: false }
      explanation: |
        Wind and rain at flowering cause poor fruit set (coulure and
        millerandage), which cuts yields. Similar weather can return at harvest
        and bring rot.

  - id: aus-mornington-good-year-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, mornington-peninsula, vintage]
    status: reviewed
    source_id: c39-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a favourable year on the Mornington Peninsula, what gives the wines their fragrance and finesse?"
      choices:
        - { text: "A long, slow ripening season", correct: true }
        - { text: "A short, hot summer", correct: false }
        - { text: "Very low yields from drought", correct: false }
        - { text: "A warm autumn that speeds ripening", correct: false }
      explanation: |
        Slow ripening lets aroma and flavour build before sugar climbs too high,
        so the wines reach full flavour at moderate alcohol.

  - id: aus-mornington-pinot-purity-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, mornington-peninsula, pinot-noir]
    status: reviewed
    source_id: c39-0119
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Mornington Peninsula Pinot Noir ranges from delicate to quite structured. Which trait tends to run through all of it?"
      choices:
        - { text: "Earthy, gamey notes", correct: false }
        - { text: "Heavy new-oak spice", correct: false }
        - { text: "Firm, drying tannins", correct: false }
        - { text: "Very pure fruit", correct: true }
      explanation: |
        Producers such as Kooyong and Ten Minutes by Tractor bottle several
        single-vineyard Pinots to show how small changes in site alter the wine.

  - id: aus-mornington-chardonnay-mlf-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, mornington-peninsula, chardonnay]
    status: reviewed
    source_id: c39-0120
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is the high acidity of Mornington Peninsula Chardonnay usually softened?"
      choices:
        - { text: "By leaving some residual sugar", correct: false }
        - { text: "By deacidifying with chalk", correct: false }
        - { text: "By malolactic conversion", correct: true }
        - { text: "By blending in Semillon", correct: false }
      explanation: |
        Lactic bacteria turn sharp malic acid into softer lactic acid. The fruit
        stays in the citrus, pear and apple range.

  - id: aus-geelong-location-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, geelong]
    status: reviewed
    source_id: c39-0121
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does the Geelong wine region lie in relation to Melbourne?"
      choices:
        - { text: "West of the city", correct: true }
        - { text: "North of the city", correct: false }
        - { text: "East of the city", correct: false }
        - { text: "South of the city", correct: false }
      explanation: |
        Its vineyards spread around the port city of Geelong, onto the Bellarine
        Peninsula and into the Moorabool Valley. Bannockburn is one of its
        best-known estates.

  - id: aus-geelong-climate-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, geelong, climate]
    status: reviewed
    source_id: c39-0122
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Geelong's climate is most similar to that of which other Victorian region?"
      choices:
        - { text: "Mornington Peninsula", correct: true }
        - { text: "Heathcote", correct: false }
        - { text: "Goulburn Valley", correct: false }
        - { text: "Murray Darling", correct: false }
      explanation: |
        Both sit on Port Phillip Bay with cool to moderate maritime conditions,
        though Geelong is drier and often windier.

  - id: aus-geelong-chardonnay-style-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, geelong, chardonnay]
    status: reviewed
    source_id: c39-0124
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description best fits the acclaimed Chardonnay of Geelong?"
      choices:
        - { text: "Lean, delicate and steely", correct: false }
        - { text: "Light, neutral and early-picked", correct: false }
        - { text: "Soft, simple and tropical", correct: false }
        - { text: "Concentrated and full-bodied", correct: true }
      explanation: |
        Low-vigour soils keep yields small, which concentrates flavour and adds
        complexity. By Farr is one of the region's most admired producers.

  - id: aus-geelong-pinot-earthy-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, geelong, pinot-noir]
    status: reviewed
    source_id: c39-0126
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which character can set Geelong Pinot Noir apart?"
      choices:
        - { text: "Candied, jammy fruit", correct: false }
        - { text: "Earthy, savoury aromas", correct: true }
        - { text: "Smoky, toasty oak", correct: false }
        - { text: "Green, stalky notes", correct: false }
      explanation: |
        Forest-floor notes usually build as Pinot Noir ages. In Geelong they can
        show early, set against red-cherry fruit.

  - id: aus-heathcote-cooling-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, heathcote, climate]
    status: reviewed
    source_id: c39-0130
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What supplies most of Heathcote's cooling influence?"
      choices:
        - { text: "Sea breezes off Port Phillip Bay", correct: false }
        - { text: "Cold currents off the south coast", correct: false }
        - { text: "Cloud cover off the Tasman Sea", correct: false }
        - { text: "Altitude on the inland ranges", correct: true }
      explanation: |
        Heathcote lies in the centre of the state, well over 100 km from
        Melbourne and far from the coast. Its vines grow along the Mount Camel
        Range, many on ancient red Cambrian soils.

  - id: aus-heathcote-climate-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, heathcote, climate]
    status: reviewed
    source_id: c39-0131
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate label best fits Heathcote?"
      choices:
        - { text: "Cool", correct: false }
        - { text: "Moderate", correct: true }
        - { text: "Hot and dry", correct: false }
        - { text: "Hot and humid", correct: false }
      explanation: |
        Days are warm enough to ripen late black grapes fully, but nights cool
        quickly, so the wines keep their freshness.

  - id: aus-heathcote-shiraz-style-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, heathcote, shiraz]
    status: reviewed
    source_id: c39-0132
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Heathcote Shiraz usually differ from Shiraz grown in Australia's hottest regions?"
      choices:
        - { text: "Riper, jammier fruit and softer tannin", correct: false }
        - { text: "Fresher fruit and firmer structure", correct: true }
        - { text: "More dried-fruit and chocolate notes", correct: false }
        - { text: "Softer acidity and more alcohol", correct: false }
      explanation: |
        Jasper Hill, whose Georgia's Paddock and Emily's Paddock vineyards are
        dry-grown, made the region's name for Shiraz.

  - id: aus-goulburn-location-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, goulburn-valley]
    status: reviewed
    source_id: c39-0134
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which region lies immediately east of Heathcote in central Victoria?"
      choices:
        - { text: "Grampians", correct: false }
        - { text: "Macedon Ranges", correct: false }
        - { text: "Rutherglen", correct: false }
        - { text: "Goulburn Valley", correct: true }
      explanation: |
        Its best-known estates cluster near the town of Nagambie, about 130 km
        north of Melbourne; Mitchelton is one of them.

  - id: aus-goulburn-water-cooling-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, goulburn-valley, climate]
    status: reviewed
    source_id: c39-0136
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What tempers the heat around the vineyards of the warm Goulburn Valley?"
      choices:
        - { text: "Cold air draining off the Alps", correct: false }
        - { text: "Lakes and creeks fed by the river", correct: true }
        - { text: "Breezes off Port Phillip Bay", correct: false }
        - { text: "Fog rolling in from the Southern Ocean", correct: false }
      explanation: |
        Water warms and cools slowly and raises local humidity, which softens
        summer extremes. The Nagambie Lakes sub-region takes its name from them.

  - id: aus-goulburn-shiraz-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, goulburn-valley, shiraz]
    status: reviewed
    source_id: c39-0137
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape covers the most vineyard area in the Goulburn Valley?"
      choices:
        - { text: "Shiraz", correct: true }
        - { text: "Marsanne", correct: false }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Tahbilk still bottles Shiraz from vines planted in 1860, among the oldest
        producing vines in the country.

  - id: aus-goulburn-marsanne-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, goulburn-valley, marsanne]
    status: reviewed
    source_id: c39-0138
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape is the Goulburn Valley's best-known speciality?"
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Viognier", correct: false }
        - { text: "Semillon", correct: false }
        - { text: "Marsanne", correct: true }
      explanation: |
        Tahbilk's Marsanne vines were planted in 1927 and are among the oldest of
        the variety anywhere. The grape came from the northern Rhône.

  - id: aus-marsanne-ageing-001
    type: mcq
    deck: Australia
    tags: [australia, victoria, marsanne, ageing]
    status: reviewed
    source_id: c39-0139
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a dry, unoaked Australian Marsanne usually develop in bottle?"
      choices:
        - { text: "Peachy when young, petrol later", correct: false }
        - { text: "Citrus when young, honeyed later", correct: true }
        - { text: "Floral when young, fading fast", correct: false }
        - { text: "Grassy when young, asparagus later", correct: false }
      explanation: |
        Its acidity is only moderate, so it ages on weight and texture rather
        than sharp acid. Good examples often need five to ten years to show it.

  - id: aus-nsw-history-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, history]
    status: reviewed
    source_id: c39-0140
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Australian state has the longest history of wine production?"
      choices:
        - { text: "South Australia", correct: false }
        - { text: "Victoria", correct: false }
        - { text: "New South Wales", correct: true }
        - { text: "Western Australia", correct: false }
      explanation: |
        Vine cuttings arrived with the First Fleet at Sydney Cove in 1788, decades
        before the first plantings in Victoria or South Australia.

  - id: aus-hunter-state-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley]
    status: reviewed
    source_id: c39-0141
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which Australian state is the Hunter Valley?"
      choices:
        - { text: "Victoria", correct: false }
        - { text: "New South Wales", correct: true }
        - { text: "Queensland", correct: false }
        - { text: "South Australia", correct: false }
      explanation: |
        Its vineyards cluster around Pokolbin, near the town of Cessnock, a
        couple of hours' drive north of Sydney.

  - id: aus-hunter-climate-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, climate]
    status: reviewed
    source_id: c39-0142
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate description fits the Hunter Valley?"
      choices:
        - { text: "Hot and humid", correct: true }
        - { text: "Hot and dry", correct: false }
        - { text: "Cool and maritime", correct: false }
        - { text: "Warm and continental", correct: false }
      explanation: |
        At about 32°S it lies closer to the equator than South Australia's
        classic regions, such as the Barossa at about 34.5°S.

  - id: aus-hunter-heat-moderation-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, climate]
    status: reviewed
    source_id: c39-0146
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What tempers the Hunter Valley's summer heat?"
      choices:
        - { text: "A cold upwelling ocean current", correct: false }
        - { text: "Altitude on the inland ranges", correct: false }
        - { text: "Cloud cover and sea breezes", correct: true }
        - { text: "Lakes and creeks along the river", correct: false }
      explanation: |
        Afternoon cloud cuts direct sun on the canopy, and the Pacific coast is
        less than 100 km away, close enough for its breezes to reach the vines.

  - id: aus-hunter-harvest-rain-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, vintage]
    status: reviewed
    source_id: c39-0147
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which weather risk most often troubles the Hunter Valley vintage?"
      choices:
        - { text: "Spring frost at budburst", correct: false }
        - { text: "Hail during flowering", correct: false }
        - { text: "Strong winds at flowering", correct: false }
        - { text: "Rain at harvest time", correct: true }
      explanation: |
        Picking falls in late summer, among the wettest months of the year, when
        storms and ex-tropical lows can drift down the coast.

  - id: aus-hunter-canopy-rot-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, viticulture]
    status: reviewed
    source_id: c39-0148
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard measure does most to limit rot in the Hunter Valley?"
      choices:
        - { text: "Low bush-trained vines", correct: false }
        - { text: "Careful canopy management", correct: true }
        - { text: "Picking later so skins thicken", correct: false }
        - { text: "Dense canopies to shade bunches", correct: false }
      explanation: |
        An open canopy lets wind dry the bunches after rain and lets sprays reach
        the fruit.

  - id: aus-nsw-cooler-regions-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, climate]
    status: reviewed
    source_id: c39-0143
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of New South Wales regions is noticeably cooler than the Hunter Valley?"
      choices:
        - { text: "Riverina and Perricoota", correct: false }
        - { text: "Northern Rivers and Hastings River", correct: false }
        - { text: "Orange and Mudgee", correct: true }
        - { text: "Murray Darling and Swan Hill", correct: false }
      explanation: |
        Height is the key. The Orange name is reserved for vineyards above 600 m,
        many on the flanks of Mount Canobolas, an extinct volcano. Cowra is a
        third, somewhat cooler inland area.

  - id: aus-nsw-orange-location-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales]
    status: reviewed
    source_id: c39-0144
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where does the Orange wine region lie?"
      choices:
        - { text: "On the coastal plain north of Sydney", correct: false }
        - { text: "Inland, on the western slopes of the ranges", correct: true }
        - { text: "On the Murrumbidgee plains far inland", correct: false }
        - { text: "On the coastal plain south of Sydney", correct: false }
      explanation: |
        The town of Orange is roughly 250 km west of Sydney by road, across the
        Blue Mountains.

  - id: aus-nsw-altitude-grapes-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, grapes]
    status: reviewed
    source_id: c39-0145
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape pair makes concentrated, structured wines in New South Wales' higher-altitude regions?"
      choices:
        - { text: "Viognier and Petit Verdot", correct: false }
        - { text: "Chardonnay and Cabernet", correct: true }
        - { text: "Grenache and Mourvèdre", correct: false }
        - { text: "Verdelho and Durif", correct: false }
      explanation: |
        Cool nights at height hold acidity while long, sunny days build flavour,
        so the wines join concentration with freshness.

  - id: aus-land-size-001
    type: mcq
    deck: Australia
    tags: [australia, geography]
    status: reviewed
    source_id: c39-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Australia's land area compare with that of the mainland United States?"
      choices:
        - { text: "About half as large", correct: false }
        - { text: "Roughly the same size", correct: true }
        - { text: "About twice as large", correct: false }
        - { text: "About a quarter as large", correct: false }
      explanation: |
        The continent covers close to 7.7 million km², yet its vineyards hug the
        south-east and south-west corners. Margaret River and the Hunter Valley
        lie over 3,000 km apart, further than London is from Moscow, so
        "Australian wine" spans very different places.

  - id: aus-heat-latitude-001
    type: mcq
    deck: Australia
    tags: [australia, climate]
    status: reviewed
    source_id: c39-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which factor does most to make the bulk of Australia's vineyard land warm or hot?"
      choices:
        - { text: "Stony soils that store heat", correct: false }
        - { text: "Long summer days at high latitude", correct: false }
        - { text: "High average vineyard altitude", correct: false }
        - { text: "Fairly low latitude", correct: true }
      explanation: |
        Most Australian regions sit between roughly 30° and 38°S, about as close
        to the equator as southern Spain or North Africa are in the north. The
        sun stands high in the sky and the growing season is long.

  - id: aus-ocean-cooling-001
    type: mcq
    deck: Australia
    tags: [australia, climate]
    status: reviewed
    source_id: c39-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Apart from altitude, which influence does most to cool Australia's southern coastal vineyards?"
      choices:
        - { text: "Breezes off the Southern and Indian Oceans", correct: true }
        - { text: "Frequent summer rain", correct: false }
        - { text: "Cold air draining from the Great Dividing Range", correct: false }
        - { text: "Winds blowing in from the dry interior", correct: false }
      explanation: |
        Air over the cold southern seas is drawn inland as the land heats up,
        trimming the hottest hours of the day. The effect fades quickly a few
        tens of kilometres from the coast. Winds from the interior do the
        opposite: they bring the heatwaves.

  - id: aus-altitude-regions-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, climate]
    status: reviewed
    source_id: c39-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of South Australian regions owes its cooler conditions mainly to altitude?"
      choices:
        - { text: "Coonawarra and Padthaway", correct: false }
        - { text: "McLaren Vale and Langhorne Creek", correct: false }
        - { text: "Adelaide Hills and Eden Valley", correct: true }
        - { text: "Riverland and Barossa Valley", correct: false }
      explanation: |
        Both sit in the Mount Lofty Ranges east of Adelaide. Air cools by
        roughly 0.6 °C for every 100 m of height, so upland sites ripen later
        than the plains below.

  - id: aus-irrigation-reason-001
    type: mcq
    deck: Australia
    tags: [australia, viticulture, water]
    status: reviewed
    source_id: c39-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main reason irrigation is standard in many Australian vineyards?"
      choices:
        - { text: "Spring frost must be fought with sprinklers", correct: false }
        - { text: "Strong winds strip moisture from the canopy", correct: false }
        - { text: "Heavy winter rain leaches the topsoil", correct: false }
        - { text: "Too little rain falls in the growing season", correct: true }
      explanation: |
        Without added water, many vines would shut down in summer and crops
        would fall sharply. Drip lines let growers dose water vine by vine, and
        some use deficit irrigation on purpose to keep berries small.

  - id: aus-murray-irrigation-001
    type: mcq
    deck: Australia
    tags: [australia, viticulture, water]
    status: reviewed
    source_id: c39-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which river supplies the irrigation water that Australia's largest inland vineyards depend on?"
      choices:
        - { text: "The Hunter", correct: false }
        - { text: "The Murray", correct: true }
        - { text: "The Swan", correct: false }
        - { text: "The Derwent", correct: false }
      explanation: |
        In severe droughts its flow drops and water allocations are cut. During
        the Millennium Drought of the 2000s, some inland growers bought water at
        high prices or left blocks unwatered.

  - id: aus-bushfire-risk-001
    type: mcq
    deck: Australia
    tags: [australia, climate, hazards]
    status: reviewed
    source_id: c39-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which summer hazard, beyond drought itself, most regularly threatens Australian wine regions?"
      choices:
        - { text: "Hailstorms", correct: false }
        - { text: "Tropical cyclones", correct: false }
        - { text: "Bush fires", correct: true }
        - { text: "Summer flooding", correct: false }
      explanation: |
        Dry grass, eucalyptus oil and hot northerly winds let fires spread fast.
        In the 2019–20 "Black Summer" season, a single December blaze damaged a
        large share of the vineyards in the Adelaide Hills.

  - id: aus-smoke-taint-001
    type: mcq
    deck: Australia
    tags: [australia, hazards, faults]
    status: reviewed
    source_id: c39-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a bush fire spoil a vintage even when the flames never reach the vines?"
      choices:
        - { text: "Smoke compounds taint the grapes", correct: true }
        - { text: "Ash on the leaves halts ripening", correct: false }
        - { text: "Hot winds from the fire split the berries", correct: false }
        - { text: "Fire retardant stops fermentation", correct: false }
      explanation: |
        Volatile phenols such as guaiacol pass through the skins and bind to
        sugars. They can stay hidden in the juice, then reappear after
        fermentation or in the mouth as ashy, medicinal flavours.

  - id: aus-tasmania-cool-plantings-001
    type: mcq
    deck: Australia
    tags: [australia, tasmania, climate]
    status: reviewed
    source_id: c39-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Australian state has seen the fastest proportional vineyard growth in recent decades?"
      choices:
        - { text: "Victoria", correct: false }
        - { text: "Western Australia", correct: false }
        - { text: "South Australia", correct: false }
        - { text: "Tasmania", correct: true }
      explanation: |
        At roughly 41° to 43°S it is the most southerly wine state, and growers
        seeking cooler sites have planted there steadily. It started from a
        small base, so it still makes only a small share of Australia's wine.

  - id: aus-shiraz-leading-001
    type: mcq
    deck: Australia
    tags: [australia, shiraz, grapes]
    status: reviewed
    source_id: c39-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape covers the largest vineyard area in Australia, of either colour?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Shiraz", correct: true }
        - { text: "Chardonnay", correct: false }
        - { text: "Grenache", correct: false }
      explanation: |
        It grows in almost every region, from hot irrigated areas to cool hills.
        Some of the oldest producing vines in the world are Barossa Shiraz
        planted in the mid-1800s, which survived because phylloxera never
        reached South Australia.

  - id: aus-shiraz-warm-style-001
    type: mcq
    deck: Australia
    tags: [australia, shiraz, style]
    status: reviewed
    source_id: c39-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best fits a classic Shiraz from a hot or warm Australian region?"
      choices:
        - { text: "Full body, red fruit, high acidity", correct: false }
        - { text: "Medium body, black pepper, firm acidity", correct: false }
        - { text: "Full body, green pepper, grippy tannin", correct: false }
        - { text: "Full body, ripe black fruit, earthy spice", correct: true }
      explanation: |
        Long sunny seasons build sugar, colour and soft, ripe tannin, and
        acidity falls as the grapes ripen. Old, low-yielding vines in some warm
        regions add further concentration.

  - id: aus-shiraz-restrained-001
    type: mcq
    deck: Australia
    tags: [australia, shiraz, winemaking]
    status: reviewed
    source_id: c39-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the cellar, how are some producers in warm Australian regions making a more restrained Shiraz?"
      choices:
        - { text: "By blending in a little Grenache", correct: false }
        - { text: "By extracting less during fermentation", correct: true }
        - { text: "By fermenting with selected cultured yeast", correct: false }
        - { text: "By filtering more tightly before bottling", correct: false }
      explanation: |
        Gentler pump-overs, fewer punch-downs and shorter time on skins draw out
        less tannin and colour. Many pair this with older or larger barrels so
        that oak does not add weight back.

  - id: aus-shiraz-cool-pepper-001
    type: mcq
    deck: Australia
    tags: [australia, shiraz, style]
    status: reviewed
    source_id: c39-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of regions is associated with a leaner, more peppery Australian Shiraz?"
      choices:
        - { text: "Barossa Valley and McLaren Vale", correct: false }
        - { text: "Riverland and Riverina", correct: false }
        - { text: "Geelong and Canberra District", correct: true }
        - { text: "Hunter Valley and Rutherglen", correct: false }
      explanation: |
        The peppery note comes from rotundone, which builds up in cooler
        seasons. Clonakilla in the Canberra District made its name by
        co-fermenting Shiraz with a little Viognier, in the manner of Côte-Rôtie.

  - id: aus-cabernet-vs-shiraz-001
    type: mcq
    deck: Australia
    tags: [australia, cabernet-sauvignon, style]
    status: reviewed
    source_id: c39-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with Australian Shiraz, how does Australian Cabernet Sauvignon usually differ in structure?"
      choices:
        - { text: "Softer tannin and fleshier fruit", correct: false }
        - { text: "Lower acidity and higher alcohol", correct: false }
        - { text: "Paler colour and lighter body", correct: false }
        - { text: "Firmer tannin and higher acidity", correct: true }
      explanation: |
        Cabernet's small, thick-skinned berries give a tighter frame, with
        blackcurrant and black cherry fruit. It buds and ripens later than
        Shiraz, and toasty oak is usual at the premium level.

  - id: aus-pinot-premium-style-001
    type: mcq
    deck: Australia
    tags: [australia, pinot-noir, style]
    status: reviewed
    source_id: c39-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits Pinot Noir from Australia's best cool sites?"
      choices:
        - { text: "Medium body, fresh acidity, cherry and strawberry", correct: true }
        - { text: "Full body, low acidity, jammy plum and prune", correct: false }
        - { text: "Light body, sharp acidity, cranberry and green leaf", correct: false }
        - { text: "Deep colour, firm tannin, cassis and cedar", correct: false }
      explanation: |
        Alcohol usually stays moderate because sugar builds slowly in these
        sites. Many producers now add some whole bunches to the ferment for
        extra perfume and a firmer, finer tannin.

  - id: aus-mataro-name-001
    type: mcq
    deck: Australia
    tags: [australia, grapes, synonyms]
    status: reviewed
    source_id: c39-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape, known in France as Mourvèdre, is valued in Australia's hot regions?"
      choices:
        - { text: "Durif", correct: false }
        - { text: "Grenache", correct: false }
        - { text: "Mataro", correct: true }
        - { text: "Touriga", correct: false }
      explanation: |
        It needs a long, hot season to ripen fully. Alongside Grenache and Petit
        Verdot, it copes well with heat; Barossa and McLaren Vale use it with
        Grenache and Shiraz in "GSM" blends.

  - id: aus-mediterranean-grapes-heat-001
    type: mcq
    deck: Australia
    tags: [australia, grapes, climate]
    status: reviewed
    source_id: c39-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why have Sangiovese and Tempranillo gained ground in Australia's hot regions?"
      choices:
        - { text: "They need little sun to reach ripeness", correct: false }
        - { text: "They cope with heat and limited water", correct: true }
        - { text: "Their thick skins resist summer rot", correct: false }
        - { text: "They thrive on cool inland nights", correct: false }
      explanation: |
        Both come from warm, dry, Mediterranean-influenced climates in Italy
        and Spain. As water for
        irrigation becomes scarcer and dearer, growers look for vines that
        keep fresh flavours under heat stress, such as Fiano or Nero d'Avola.

  - id: aus-chardonnay-leading-white-001
    type: mcq
    deck: Australia
    tags: [australia, chardonnay, grapes]
    status: reviewed
    source_id: c39-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape covers the largest vineyard area in Australia?"
      choices:
        - { text: "Semillon", correct: false }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Riesling", correct: false }
        - { text: "Chardonnay", correct: true }
      explanation: |
        It ripens reliably from cool hills to hot irrigated plains. In the 1980s
        and 1990s, ripe, oaky Australian Chardonnay sold under brands such as
        Lindemans Bin 65 helped open the British market.

  - id: aus-chardonnay-oak-alternatives-001
    type: mcq
    deck: Australia
    tags: [australia, chardonnay, winemaking]
    status: reviewed
    source_id: c39-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do many inexpensive Australian Chardonnays get toast and vanilla notes without barrel ageing?"
      choices:
        - { text: "Extended lees stirring", correct: false }
        - { text: "Oak chips or staves in tank", correct: true }
        - { text: "Full malolactic conversion", correct: false }
        - { text: "Ageing in large old casks", correct: false }
      explanation: |
        Chips or staves give oak flavour quickly and at a fraction of the cost
        of barrels. Unoaked versions of the same wine show more peach and melon
        fruit instead.

  - id: aus-chardonnay-warm-region-001
    type: mcq
    deck: Australia
    tags: [australia, chardonnay, regions]
    status: reviewed
    source_id: c39-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which warm-climate region is a leading source of premium Australian Chardonnay?"
      choices:
        - { text: "Margaret River", correct: true }
        - { text: "Riverland", correct: false }
        - { text: "Barossa Valley", correct: false }
        - { text: "Rutherglen", correct: false }
      explanation: |
        Leeuwin Estate's Art Series Chardonnay, first made in 1980, set the
        region's reputation. Each vintage's label carries a work commissioned
        from an Australian artist.

  - id: aus-chardonnay-top-style-001
    type: mcq
    deck: Australia
    tags: [australia, chardonnay, style]
    status: reviewed
    source_id: c39-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits a top modern Australian Chardonnay?"
      choices:
        - { text: "Heavy toast, butter and very ripe tropical fruit", correct: false }
        - { text: "Lean, neutral and unoaked, for early drinking", correct: false }
        - { text: "Vibrant fruit with subtle lees and oak", correct: true }
        - { text: "Off-dry, with lime and a honeyed edge", correct: false }
      explanation: |
        From the 2000s many leading producers picked earlier, cut new oak and
        limited malolactic conversion. Lees ageing and barrel work are still
        used, but as support for the fruit rather than the main flavour.

  - id: aus-sauvignon-adelaide-hills-001
    type: mcq
    deck: Australia
    tags: [australia, sauvignon-blanc, regions]
    status: reviewed
    source_id: c39-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Australian region has the strongest reputation for Sauvignon Blanc?"
      choices:
        - { text: "Clare Valley", correct: false }
        - { text: "Barossa Valley", correct: false }
        - { text: "Adelaide Hills", correct: true }
        - { text: "McLaren Vale", correct: false }
      explanation: |
        Plantings of the grape grew fast across Australia from the 2000s, partly
        to meet demand created by New Zealand. Shaw + Smith, founded in 1989,
        built its name on a varietal Sauvignon from this region.

  - id: aus-sauvignon-benchmark-style-001
    type: mcq
    deck: Australia
    tags: [australia, sauvignon-blanc, style]
    status: reviewed
    source_id: c39-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile fits a typical Sauvignon Blanc from Australia's leading region for the grape?"
      choices:
        - { text: "Toasty, oaky and full-bodied", correct: false }
        - { text: "Soft, peachy and low in acidity", correct: false }
        - { text: "Lean, neutral and lightly herbal", correct: false }
        - { text: "Passion fruit with crisp acidity", correct: true }
      explanation: |
        Cool nights hold acidity while sunny days build ripe tropical
        aromas. Most examples are cool-fermented in stainless steel and
        bottled young to keep that fruit.

  - id: aus-semillon-hunter-001
    type: mcq
    deck: Australia
    tags: [australia, semillon, regions]
    status: reviewed
    source_id: c39-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which region is the classic home of Australia's long-lived dry Semillon?"
      choices:
        - { text: "Barossa Valley", correct: false }
        - { text: "Hunter Valley", correct: true }
        - { text: "Adelaide Hills", correct: false }
        - { text: "Coonawarra", correct: false }
      explanation: |
        This style has no close equivalent elsewhere, so it is often called
        uniquely Australian. Tyrrell's Vat 1 and McWilliam's Lovedale are
        benchmark examples, released with some bottle age.

  - id: aus-semillon-classic-picking-001
    type: mcq
    deck: Australia
    tags: [australia, semillon, winemaking]
    status: reviewed
    source_id: c39-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At what ripeness is Australia's classic long-lived dry Semillon usually picked?"
      choices:
        - { text: "Mid-season, at moderate sugar", correct: false }
        - { text: "Fully ripe, to build maximum body", correct: false }
        - { text: "Early, at low sugar and high acid", correct: true }
        - { text: "Late, for riper citrus flavour", correct: false }
      explanation: |
        Picking before the grapes lose acid keeps the wine lean and sharp at
        first. Alcohol often ends up at only about
        10 to 11.5%.

  - id: aus-semillon-classic-cellar-001
    type: mcq
    deck: Australia
    tags: [australia, semillon, winemaking]
    status: reviewed
    source_id: c39-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the cellar, how is Australia's classic long-lived dry Semillon usually handled?"
      choices:
        - { text: "Barrel-fermented with regular lees stirring", correct: false }
        - { text: "Aged several months in new French oak", correct: false }
        - { text: "Given skin contact and full malolactic", correct: false }
        - { text: "Kept in inert vessels with little oxygen", correct: true }
      explanation: |
        Stainless steel and protective handling keep the wine pale and fresh,
        so it can evolve slowly in bottle. Most top examples are now sealed
        under screwcap for the same reason.

  - id: aus-semillon-classic-ageing-001
    type: mcq
    deck: Australia
    tags: [australia, semillon, ageing]
    status: reviewed
    source_id: c39-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Australia's classic long-lived dry Semillon change over a decade or more in bottle?"
      choices:
        - { text: "Neutral when young, then honey and toast", correct: true }
        - { text: "Tropical when young, then flat and dull", correct: false }
        - { text: "Floral when young, then petrol and honey", correct: false }
        - { text: "Oaky when young, then nutty and oxidised", correct: false }
      explanation: |
        The best can keep developing for twenty years or more, while the colour
        deepens from almost water-pale to gold. Producers often hold bottles
        back for several years before release.

  - id: aus-semillon-wa-style-001
    type: mcq
    deck: Australia
    tags: [australia, semillon, western-australia, style]
    status: reviewed
    source_id: c39-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style of Semillon is typical of Western Australia?"
      choices:
        - { text: "Sweet and botrytised", correct: false }
        - { text: "Grassy, like Sauvignon Blanc", correct: true }
        - { text: "Rich, buttery and barrel-aged", correct: false }
        - { text: "Soft and low in acidity, with melon", correct: false }
      explanation: |
        Pyrazines survive in a maritime climate where ocean breezes temper the
        heat, so the grape can smell green and grassy. That is one reason it blends so naturally with
        Sauvignon Blanc there.

  - id: aus-semillon-barossa-style-001
    type: mcq
    deck: Australia
    tags: [australia, semillon, barossa, style]
    status: reviewed
    source_id: c39-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Barossa Valley Semillon usually compare with examples from cooler regions?"
      choices:
        - { text: "Leaner and more acidic", correct: false }
        - { text: "Lighter and more herbaceous", correct: false }
        - { text: "Fuller-bodied and softer", correct: true }
        - { text: "Lower in alcohol and more neutral", correct: false }
      explanation: |
        Warm days ripen the grape further, building body and lowering
        acidity. Semillon has been grown on the valley floor since the 19th
        century, so plenty of old, low-yielding vines remain.

  - id: aus-riesling-frankland-001
    type: mcq
    deck: Australia
    tags: [australia, riesling, western-australia]
    status: reviewed
    source_id: c39-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Western Australian area is building a name for high-quality Riesling?"
      choices:
        - { text: "Swan Valley", correct: false }
        - { text: "Geographe", correct: false }
        - { text: "Peel", correct: false }
        - { text: "Frankland River", correct: true }
      explanation: |
        It lies in the far south of the state, well inland from the coast.
        Tasmania is the other Australian area whose Riesling has been
        gaining attention.

  - id: aus-riesling-wa-vs-sa-001
    type: mcq
    deck: Australia
    tags: [australia, riesling, style]
    status: reviewed
    source_id: c39-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do Western Australian Rieslings typically differ from those of South Australia's classic regions?"
      choices:
        - { text: "More floral, less citrus", correct: true }
        - { text: "Sweeter and lower in acidity", correct: false }
        - { text: "Fuller-bodied and often oaked", correct: false }
        - { text: "More petrol when young", correct: false }
      explanation: |
        Both are usually dry and unoaked with high acidity. Most are sealed
        under screwcap; a group of Clare Valley producers led that switch with
        the 2000 vintage.

  - id: aus-south-eastern-australia-gi-001
    type: mcq
    deck: Australia
    tags: [australia, law, labelling]
    status: reviewed
    source_id: c39-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Australian GI lets a brand blend fruit from vineyards in several states?"
      choices:
        - { text: "Big Rivers", correct: false }
        - { text: "Lower Murray", correct: false }
        - { text: "South Eastern Australia", correct: true }
        - { text: "Limestone Coast", correct: false }
      explanation: |
        It is a "super-zone", the largest in the country. It covers all of New
        South Wales, Victoria and Tasmania plus the wine areas of South
        Australia and southern Queensland: everything except Western
        Australia. The other three are single zones within one state.

  - id: aus-inland-bulk-regions-001
    type: mcq
    deck: Australia
    tags: [australia, regions, bulk]
    status: reviewed
    source_id: c39-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which trio of irrigated inland regions supplies much of Australia's high-volume branded wine?"
      choices:
        - { text: "Barossa, Clare and McLaren Vale", correct: false }
        - { text: "Coonawarra, Padthaway and Wrattonbully", correct: false }
        - { text: "Hunter, Mudgee and Orange", correct: false }
        - { text: "Riverland, Murray–Darling and Riverina", correct: true }
      explanation: |
        Flat land, cheap water and mechanised vineyards keep costs low. Brands
        such as Yellow Tail, made by Casella near Griffith in the Riverina, show
        how big these operations have become.

  - id: aus-inland-fruit-tradeoff-001
    type: mcq
    deck: Australia
    tags: [australia, viticulture, bulk]
    status: reviewed
    source_id: c39-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which trade-off is typical of grapes from Australia's large irrigated inland regions?"
      choices:
        - { text: "Concentrated fruit but low yields", correct: false }
        - { text: "Big healthy crops but less concentration", correct: true }
        - { text: "Good concentration but frequent rot", correct: false }
        - { text: "Healthy fruit but too little sugar", correct: false }
      explanation: |
        Heat, sunshine and generous water let each vine carry a heavy crop,
        while dry air keeps disease low. The flavour is spread across more and
        bigger berries.

  - id: aus-multiregional-blending-001
    type: mcq
    deck: Australia
    tags: [australia, blending, winemaking]
    status: reviewed
    source_id: c39-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How do large Australian brands usually give more depth to their cheapest branded wines?"
      choices:
        - { text: "Age it for longer in large old vats", correct: false }
        - { text: "Hold it longer on its fine lees", correct: false }
        - { text: "Blend in fruit from premium regions", correct: true }
        - { text: "Bottle it unfined and unfiltered", correct: false }
      explanation: |
        Small parcels from places such as Barossa, Adelaide Hills or McLaren Vale
        add flavour and structure. Which region is chosen depends on the grape,
        the style and how much the wine has to sell for.

  - id: aus-riverina-botrytis-grape-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, riverina, sweet]
    status: reviewed
    source_id: c39-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grape is used for the nobly rotten sweet wines that are a speciality of Australia's Riverina?"
      choices:
        - { text: "Chenin Blanc", correct: false }
        - { text: "Semillon", correct: true }
        - { text: "Colombard", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        The benchmark is De Bortoli Noble One, first made from the 1982
        vintage near Griffith. Semillon's thin skins let the fungus take
        hold easily, the same reason it dominates in Sauternes.

  - id: aus-riverina-autumn-mist-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, riverina, sweet, climate]
    status: reviewed
    source_id: c39-0052
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which autumn weather lets noble rot develop in the hot, dry Riverina?"
      choices:
        - { text: "Persistent warm autumn rain", correct: false }
        - { text: "Frequent light overnight frosts", correct: false }
        - { text: "Cool afternoon sea breezes", correct: false }
        - { text: "Morning mists and fog", correct: true }
      explanation: |
        Damp mornings let the spores germinate on ripe berries; the dry,
        sunny afternoons that follow check the fungus so it stays noble
        rather than turning to grey rot, which steady rain would bring.

  - id: aus-south-australia-share-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia]
    status: reviewed
    source_id: c39-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which Australian state produces the largest share of the country's wine?"
      choices:
        - { text: "New South Wales", correct: false }
        - { text: "Victoria", correct: false }
        - { text: "South Australia", correct: true }
        - { text: "Western Australia", correct: false }
      explanation: |
        It typically accounts for roughly half of the national crush. Large
        irrigated vineyards along the Murray supply volume, while smaller
        premium regions add value.

  - id: aus-south-australia-southeast-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, geography]
    status: reviewed
    source_id: c39-0054
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which part of South Australia are most of the state's vineyards concentrated?"
      choices:
        - { text: "The south-east", correct: true }
        - { text: "The north-east", correct: false }
        - { text: "The south-west", correct: false }
        - { text: "The north-west", correct: false }
      explanation: |
        Most of the state's interior is arid outback. Vines cluster where
        the Southern Ocean and the gulfs temper the heat, or where the
        Murray River supplies irrigation water.

  - id: aus-south-australia-gi-blend-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, labelling]
    status: reviewed
    source_id: c39-0055
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do some prestigious Australian wines carry the broad South Australia GI rather than a single region?"
      choices:
        - { text: "It lets them add fruit from Victoria and New South Wales", correct: false }
        - { text: "It lets them blend fruit from several premium regions", correct: true }
        - { text: "It permits higher yields than a regional GI allows", correct: false }
        - { text: "It exempts them from the 85% grape variety rule", correct: false }
      explanation: |
        Penfolds Grange is the classic case: its Shiraz can come from
        several South Australian regions, so the label names the state.
        Each source adds a different character to the final blend.

  - id: aus-barossa-location-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa, geography]
    status: reviewed
    source_id: c39-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which South Australian wine region lies north-east of Adelaide, roughly an hour's drive from the city?"
      choices:
        - { text: "McLaren Vale", correct: false }
        - { text: "Coonawarra", correct: false }
        - { text: "Langhorne Creek", correct: false }
        - { text: "Barossa Valley", correct: true }
      explanation: |
        The valley was settled in the 1840s by Lutheran migrants from
        Silesia. Their villages, such as Bethany, and their sausage and
        baking traditions still mark the region.

  - id: aus-barossa-heartland-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa]
    status: reviewed
    source_id: c39-0057
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which South Australian region holds the densest cluster of historic fine-wine estates in the country?"
      choices:
