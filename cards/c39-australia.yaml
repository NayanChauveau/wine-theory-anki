cards:
  - id: aus-hunter-chardonnay-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, chardonnay]
    status: reviewed
    source_id: c39-0151
    review:
      fact_check: pass
      sources: [producer-site]
    en:
      question: "Besides its signature white, which white grape is widely planted in the Hunter Valley and made both oaked and unoaked?"
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Marsanne", correct: false }
      explanation: |
        Tyrrell's Vat 47, first released in the early 1970s, is often credited as one
        of Australia's first commercial varietal Chardonnays.
    fr:
      question: "Outre son blanc emblématique, quel cépage blanc est largement planté dans la Hunter Valley et vinifié aussi bien avec que sans bois ?"
      choices:
        - { text: "Riesling", correct: false }
        - { text: "Chardonnay", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Marsanne", correct: false }
      explanation: |
        Le Vat 47 de Tyrrell's, sorti au début des années 1970, passe souvent
        pour l’un des premiers Chardonnays australiens commercialisés sous le
        nom du cépage.

  - id: aus-hunter-black-grape-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, shiraz]
    status: reviewed
    source_id: c39-0153
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which black grape accounts for the largest share of red wine made in the Hunter Valley?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Pinot Noir", correct: false }
        - { text: "Shiraz", correct: true }
      explanation: |
        It has been grown in the Hunter since the 19th century. Older bottlings were
        often sold under borrowed names such as "Hermitage" or "Burgundy", a practice
        Australia has since dropped.
    fr:
      question: "Quel cépage noir fournit la plus grande part des vins rouges de la Hunter Valley ?"
      choices:
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Merlot", correct: false }
        - { text: "Pinot Noir", correct: false }
        - { text: "Shiraz", correct: true }
      explanation: |
        Le Shiraz est cultivé dans la Hunter depuis le XIXe siècle. Les
        anciennes cuvées étaient souvent vendues sous des noms d’emprunt comme
        « Hermitage » ou « Burgundy », une pratique que l’Australie a
        abandonnée depuis.

  - id: aus-hunter-shiraz-style-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, shiraz, style]
    status: reviewed
    source_id: c39-0154
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best describes a typical Hunter Valley Shiraz?"
      choices:
        - { text: "Full body, ripe tannins, chocolate and jam", correct: false }
        - { text: "Light body, high acidity, red cherry", correct: false }
        - { text: "Medium body, soft tannins, earthy notes", correct: true }
        - { text: "Full body, firm tannins, intense black pepper", correct: false }
      explanation: |
        Summer cloud and humidity slow sugar build-up, so alcohol and extraction stay
        moderate. The fruit leans to blackberry and cherry, and the earthy, leathery
        side grows with bottle age.
    fr:
      question: "Quel profil décrit le mieux un Shiraz typique de la Hunter Valley ?"
      choices:
        - { text: "Corps ample, tanins mûrs, chocolat et confiture", correct: false }
        - { text: "Corps léger, acidité élevée, cerise rouge", correct: false }
        - { text: "Corps moyen, tanins souples, notes terreuses", correct: true }
        - { text: "Corps ample, tanins fermes, poivre noir intense", correct: false }
      explanation: |
        Les nuages et l’humidité de l’été freinent l’accumulation des sucres :
        l’alcool et l’extraction restent modérés. Le fruit tire vers la mûre et
        la cerise, et le côté terreux et cuir s’affirme avec la garde en
        bouteille.

  - id: aus-wa-state-blend-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, labelling, gi]
    status: reviewed
    source_id: c39-0156
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A wine is blended from roughly equal parts Swan Valley and Great Southern grapes. What is the most specific single GI name it can carry?"
      choices:
        - { text: "Great Southern", correct: false }
        - { text: "South Eastern Australia", correct: false }
        - { text: "Western Australia", correct: true }
        - { text: "Greater Perth", correct: false }
      explanation: |
        Swan Valley sits in the Greater Perth zone and Great Southern in the South West
        Australia zone, so only the state GI spans both. A named GI needs at least 85% of
        the grapes from that area. Nearly all the state's vineyards lie in its
        south-west corner.
    fr:
      question: "Un vin assemble à parts à peu près égales des raisins de la Swan Valley et de Great Southern. Quelle est l’IG unique la plus précise qu’il puisse porter ?"
      choices:
        - { text: "Great Southern", correct: false }
        - { text: "South Eastern Australia", correct: false }
        - { text: "Western Australia", correct: true }
        - { text: "Greater Perth", correct: false }
      explanation: |
        La Swan Valley appartient à la zone Greater Perth, Great Southern à la
        zone South West Australia : seule l’IG de l’État, Western Australia,
        couvre les deux. Une IG nommée exige au moins 85 % de raisins issus de
        l’aire concernée. La quasi-totalité du vignoble de l’Australie-Occidentale
        se trouve dans son angle sud-ouest.

  - id: aus-cross-state-blend-001
    type: mcq
    deck: Australia
    tags: [australia, labelling, gi, western-australia, south-australia]
    status: reviewed
    source_id: c39-0157
    review:
      fact_check: pass
      sources: [wine-australia]
    en:
      question: "A wine blends Barossa Valley Shiraz and Margaret River Cabernet Sauvignon in roughly equal parts. What is the most specific single GI name it can carry?"
      choices:
        - { text: "South Australia", correct: false }
        - { text: "Western Australia", correct: false }
        - { text: "South Eastern Australia", correct: false }
        - { text: "Australia", correct: true }
      explanation: |
        Western Australia lies outside South Eastern Australia, so no multi-state GI
        joins the two, and the blend falls back on the national name. The vineyards
        involved are more than 2,000 km apart.
    fr:
      question: "Un vin assemble à parts à peu près égales du Shiraz de la Barossa Valley et du Cabernet Sauvignon de Margaret River. Quelle est l’IG unique la plus précise qu’il puisse porter ?"
      choices:
        - { text: "South Australia", correct: false }
        - { text: "Western Australia", correct: false }
        - { text: "South Eastern Australia", correct: false }
        - { text: "Australia", correct: true }
      explanation: |
        L’Australie-Occidentale est exclue de South Eastern Australia : aucune
        IG couvrant plusieurs États ne réunit les deux, et l’assemblage se
        rabat sur le nom national. Les vignobles concernés sont distants de
        plus de 2 000 km.

  - id: aus-margaret-river-location-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, margaret-river, geography]
    status: reviewed
    source_id: c39-0158
    review:
      fact_check: pass
      sources: [margaret-river-wine-association]
    en:
      question: "Relative to Perth, where does the Margaret River region lie?"
      choices:
        - { text: "In the Swan Valley, on Perth's north-eastern edge", correct: false }
        - { text: "On the Indian Ocean coast, well south of Perth", correct: true }
        - { text: "In the Perth Hills, just east of the city", correct: false }
        - { text: "On the Southern Ocean coast near Albany", correct: false }
      explanation: |
        The region is a strip of land between Cape Naturaliste in the north and Cape
        Leeuwin in the south, roughly 100 km long and a few hours' drive from Perth.
    fr:
      question: "Par rapport à Perth, où se situe la région de Margaret River ?"
      choices:
        - { text: "Dans la Swan Valley, en lisière nord-est de Perth", correct: false }
        - { text: "Sur la côte de l’océan Indien, bien au sud de Perth", correct: true }
        - { text: "Dans les Perth Hills, juste à l’est de la ville", correct: false }
        - { text: "Sur la côte de l’océan Austral, près d’Albany", correct: false }
      explanation: |
        La région forme une bande de terre d’une centaine de kilomètres entre
        le cap Naturaliste au nord et le cap Leeuwin au sud, à quelques heures
        de route de Perth.

  - id: aus-margaret-river-climate-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, margaret-river, climate]
    status: reviewed
    source_id: c39-0159
    review:
      fact_check: pass
      sources: [producer-site, margaret-river-wine-association]
    en:
      question: "Which climate description best fits Margaret River?"
      choices:
        - { text: "Cool maritime, with rain spread through the year", correct: false }
        - { text: "Warm continental, with summer storms", correct: false }
        - { text: "Warm maritime, with rain mostly in winter", correct: true }
        - { text: "Hot and dry, with irrigation from rivers", correct: false }
      explanation: |
        Annual rainfall is high, but dry, breezy summers keep disease pressure down. In
        the mid-1960s agronomist John Gladstones flagged the area's promise, and Vasse
        Felix planted the first commercial vineyard in 1967.
    fr:
      question: "Quel climat décrit le mieux Margaret River ?"
      choices:
        - { text: "Maritime frais, pluies réparties sur l’année", correct: false }
        - { text: "Continental chaud, orages en été", correct: false }
        - { text: "Maritime chaud, pluies surtout en hiver", correct: true }
        - { text: "Chaud et sec, irrigation par les rivières", correct: false }
      explanation: |
        Les précipitations annuelles sont élevées, mais des étés secs et venteux
        limitent la pression des maladies. Au milieu des années 1960,
        l’agronome John Gladstones a signalé le potentiel du secteur, et Vasse
        Felix y a planté le premier vignoble commercial en 1967.

  - id: aus-margaret-river-cabernet-partner-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, margaret-river, cabernet-sauvignon, blending]
    status: reviewed
    source_id: c39-0161
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Margaret River, which grape most often joins Cabernet Sauvignon in red blends?"
      choices:
        - { text: "Merlot", correct: true }
        - { text: "Shiraz", correct: false }
        - { text: "Grenache", correct: false }
        - { text: "Mataro", correct: false }
      explanation: |
        The region follows the Bordeaux model, so Merlot softens Cabernet's tannin. Styles
        range from restrained and elegant to riper and more powerful; Cullen's Diana
        Madeline is a well-known Cabernet-led example.
    fr:
      question: "À Margaret River, quel cépage accompagne le plus souvent le Cabernet Sauvignon dans les assemblages rouges ?"
      choices:
        - { text: "Merlot", correct: true }
        - { text: "Shiraz", correct: false }
        - { text: "Grenache", correct: false }
        - { text: "Mourvèdre", correct: false }
      explanation: |
        La région suit le modèle bordelais : le Merlot assouplit les tanins du
        Cabernet. Les styles vont du retenu et élégant au plus mûr et puissant ;
        Diana Madeline, la cuvée à dominante de Cabernet de Cullen, en est un
        exemple réputé.

  - id: aus-margaret-river-chardonnay-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, margaret-river, chardonnay, style]
    status: reviewed
    source_id: c39-0163
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best fits a top Margaret River Chardonnay?"
      choices:
        - { text: "Delicate green apple, light body, lean finish", correct: false }
        - { text: "Tropical fruit, soft acidity, sweet oak", correct: false }
        - { text: "Honeyed nuttiness, low acidity, oxidative notes", correct: false }
        - { text: "Concentrated stone fruit, high natural acidity", correct: true }
      explanation: |
        Many vineyards use the Gingin clone, whose uneven "hen and chicken" bunches add
        concentration. Producers choose freely how much malolactic conversion and barrel
        ageing to use; Leeuwin Estate's Art Series is the best-known benchmark.
    fr:
      question: "Quel profil correspond le mieux à un grand Chardonnay de Margaret River ?"
      choices:
        - { text: "Pomme verte délicate, corps léger, finale maigre", correct: false }
        - { text: "Fruits tropicaux, acidité souple, boisé sucré", correct: false }
        - { text: "Miel et fruits secs, acidité faible, touche oxydative", correct: false }
        - { text: "Fruits à noyau concentrés, acidité naturelle élevée", correct: true }
      explanation: |
        Beaucoup de vignobles utilisent le clone Gingin, dont les grappes
        millerandées, aux baies de tailles très inégales, apportent de la
        concentration. Chaque producteur dose librement la fermentation
        malolactique et l’élevage en barrique ; l’Art Series de Leeuwin Estate
        est la référence la plus connue.

  - id: aus-great-southern-location-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, great-southern, geography]
    status: reviewed
    source_id: c39-0166
    review:
      fact_check: pass
      sources: [wine-western-australia]
    en:
      question: "Which Western Australian region lies south-east of Margaret River, along the state's south coast?"
      choices:
        - { text: "Geographe", correct: false }
        - { text: "Peel", correct: false }
        - { text: "Swan Valley", correct: false }
        - { text: "Great Southern", correct: true }
      explanation: |
        It is a separate region, not part of Margaret River. Being further south and
        exposed to the Southern Ocean, it is generally cooler, and it is among the largest
        wine regions in Australia by area.
    fr:
      question: "Quelle région d’Australie-Occidentale s’étend au sud-est de Margaret River, le long de la côte sud de l’État ?"
      choices:
        - { text: "Geographe", correct: false }
        - { text: "Peel", correct: false }
        - { text: "Swan Valley", correct: false }
        - { text: "Great Southern", correct: true }
      explanation: |
        C’est une région distincte, qui ne fait pas partie de Margaret River.
        Plus au sud et exposée à l’océan Austral, elle est en général plus
        fraîche, et compte parmi les plus vastes régions viticoles d’Australie.

  - id: aus-great-southern-subregions-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, great-southern, regions]
    status: reviewed
    source_id: c39-0167
    review:
      fact_check: pass
      sources: [producer-site, wine-western-australia]
    en:
      question: "Which two Great Southern sub-regions have the strongest name for deeply coloured Cabernet Sauvignon?"
      choices:
        - { text: "Denmark and Albany", correct: false }
        - { text: "Mount Barker and Frankland River", correct: true }
        - { text: "Pemberton and Manjimup", correct: false }
        - { text: "Geographe and Peel", correct: false }
      explanation: |
        Both sit inland, away from the moderating coast, with warm days and cool nights.
        Plantagenet's Mount Barker vineyard, planted in the late 1960s, was one of the
        area's pioneers.
    fr:
      question: "Quelles deux sous-régions de Great Southern sont les plus réputées pour leur Cabernet Sauvignon à la couleur profonde ?"
      choices:
        - { text: "Denmark et Albany", correct: false }
        - { text: "Mount Barker et Frankland River", correct: true }
        - { text: "Pemberton et Manjimup", correct: false }
        - { text: "Geographe et Peel", correct: false }
      explanation: |
        Toutes deux se trouvent à l’intérieur des terres, loin de l’influence
        modératrice de la côte, avec des journées chaudes et des nuits fraîches.
        Le vignoble de Plantagenet à Mount Barker, planté à la fin des années
        1960, compte parmi les pionniers du secteur.

  - id: aus-great-southern-shiraz-001
    type: mcq
    deck: Australia
    tags: [australia, western-australia, great-southern, shiraz, style]
    status: reviewed
    source_id: c39-0167
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style of Shiraz is associated with Western Australia's Great Southern region?"
      choices:
        - { text: "Dense, jammy and chocolate-rich", correct: false }
        - { text: "Soft, low in acid and sweetly oaked", correct: false }
        - { text: "Elegant, medium-bodied and peppery", correct: true }
        - { text: "Ripe, plummy and high in alcohol", correct: false }
      explanation: |
        Slow ripening keeps rotundone, the aroma compound behind black pepper, in the
        grapes. The same note marks cool-climate Syrah from the northern Rhône.
    fr:
      question: "Quel style de Shiraz associe-t-on à la région de Great Southern, en Australie-Occidentale ?"
      choices:
        - { text: "Dense, confituré et chocolaté", correct: false }
        - { text: "Souple, peu acide, au boisé sucré", correct: false }
        - { text: "Élégant, de corps moyen et poivré", correct: true }
        - { text: "Mûr, sur la prune et riche en alcool", correct: false }
      explanation: |
        Une maturation lente préserve dans les raisins la rotundone, le composé
        aromatique responsable du poivre noir. On retrouve la même note dans
        les Syrahs de climat frais du nord de la vallée du Rhône.

  - id: aus-tasmania-cooling-001
    type: mcq
    deck: Australia
    tags: [australia, tasmania, climate]
    status: reviewed
    source_id: c39-0168
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main cooling influence on Tasmania's vineyards?"
      choices:
        - { text: "Westerly winds off the Southern Ocean", correct: true }
        - { text: "High altitude at most vineyard sites", correct: false }
        - { text: "A cold current flowing up the east coast", correct: false }
        - { text: "Afternoon fog drawn in from Bass Strait", correct: false }
      explanation: |
        The island sits at roughly 41–43°S. Most vineyards are low-lying, in sheltered
        valleys such as the Tamar in the north and the Derwent near Hobart. The sea also
        spares it the heat spikes common on the mainland.
    fr:
      question: "Quelle est la principale influence rafraîchissante sur le vignoble de Tasmanie ?"
      choices:
        - { text: "Les vents d’ouest venus de l’océan Austral", correct: true }
        - { text: "L’altitude élevée de la plupart des parcelles", correct: false }
        - { text: "Un courant froid remontant la côte est", correct: false }
        - { text: "Le brouillard d’après-midi venu du détroit de Bass", correct: false }
      explanation: |
        L’île se situe vers 41–43° S. La plupart des vignes sont plantées à
        basse altitude, dans des vallées abritées comme celles de la Tamar au
        nord et de la Derwent près de Hobart. La mer lui épargne aussi les pics
        de chaleur fréquents sur le continent.

  - id: aus-tasmania-sparkling-origin-001
    type: mcq
    deck: Australia
    tags: [australia, tasmania, sparkling, history]
    status: reviewed
    source_id: c39-0169
    review:
      fact_check: pass
      sources: [halliday-wine-companion]
    en:
      question: "What first made Tasmanian grapes sought after by mainland Australian wineries?"
      choices:
        - { text: "Raisined fruit for fortified Muscat", correct: false }
        - { text: "Cheap bulk Shiraz for blending", correct: false }
        - { text: "Botrytised Semillon for sweet wine", correct: false }
        - { text: "Base wine for sparkling blends", correct: true }
      explanation: |
        Jansz began in the mid-1980s as a venture with the Champagne house Louis
        Roederer. House of Arras now makes long lees-aged traditional-method wines
        entirely from Tasmanian fruit.
    fr:
      question: "Qu’est-ce qui a d’abord rendu les raisins de Tasmanie recherchés par les caves du continent australien ?"
      choices:
        - { text: "Des raisins passerillés pour le Muscat fortifié", correct: false }
        - { text: "Du Shiraz en vrac bon marché pour l’assemblage", correct: false }
        - { text: "Du Sémillon botrytisé pour les vins doux", correct: false }
        - { text: "Des vins de base pour les assemblages effervescents", correct: true }
      explanation: |
        Jansz est né au milieu des années 1980 d’un partenariat avec la maison
        de Champagne Louis Roederer. House of Arras élabore aujourd’hui des vins
        de méthode traditionnelle longuement élevés sur lies, exclusivement à
        partir de raisins tasmaniens.

  - id: aus-tasmania-leading-grape-001
    type: mcq
    deck: Australia
    tags: [australia, tasmania, grapes, pinot-noir]
    status: reviewed
    source_id: c39-0170
    review:
      fact_check: pass
      sources: [wine-australia, wine-tasmania]
    en:
      question: "Which grape covers the largest share of Tasmania's vineyards?"
      choices:
        - { text: "Chardonnay", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Chardonnay follows, with Sauvignon Blanc and Pinot Gris well behind. A little
        Cabernet Sauvignon ripens in the warmest, driest pockets, such as the Coal River
        Valley north-east of Hobart, home of Domaine A.
    fr:
      question: "Quel cépage occupe la plus grande part du vignoble tasmanien ?"
      choices:
        - { text: "Chardonnay", correct: false }
        - { text: "Pinot Noir", correct: true }
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Riesling", correct: false }
      explanation: |
        Le Chardonnay vient ensuite ; le Sauvignon Blanc et le Pinot Gris sont
        loin derrière. Un peu de Cabernet Sauvignon mûrit dans les poches les
        plus chaudes et sèches, comme la Coal River Valley, au nord-est de
        Hobart, berceau de Domaine A.

  - id: aus-gi-zone-example-001
    type: mcq
    deck: Australia
    tags: [australia, labelling, gi, victoria]
    status: reviewed
    source_id: c39-0172
    review:
      fact_check: pass
      sources: [wine-australia]
    en:
      question: "Which Victorian name is a GI zone rather than a region?"
      choices:
        - { text: "Yarra Valley", correct: false }
        - { text: "Port Phillip", correct: true }
        - { text: "Mornington Peninsula", correct: false }
        - { text: "Geelong", correct: false }
      explanation: |
        It groups the regions around Melbourne: the Yarra Valley, Mornington Peninsula,
        Geelong, Macedon Ranges and Sunbury. Zones are broad areas drawn without any
        need for a shared wine character.
    fr:
      question: "Parmi ces noms de l’État de Victoria, lequel désigne une zone d’IG plutôt qu’une région ?"
      choices:
        - { text: "Yarra Valley", correct: false }
        - { text: "Port Phillip", correct: true }
        - { text: "Mornington Peninsula", correct: false }
        - { text: "Geelong", correct: false }
      explanation: |
        Port Phillip regroupe les régions autour de Melbourne : Yarra Valley,
        Mornington Peninsula, Geelong, Macedon Ranges et Sunbury. Les zones sont
        de vastes aires délimitées sans exiger de caractère viticole commun.

  - id: aus-gi-region-test-001
    type: mcq
    deck: Australia
    tags: [australia, labelling, gi]
    status: reviewed
    source_id: c39-0175
    review:
      fact_check: pass
      sources: [wine-australia, wine-australia-regulations]
    en:
      question: "Which test must an area meet to be registered as a GI region in Australia?"
      choices:
        - { text: "Follow a single river valley or watershed", correct: false }
        - { text: "Grow one dominant grape variety", correct: false }
        - { text: "Hold vineyards at least 30 years old", correct: false }
