        - { text: "North of the city", correct: false }
        - { text: "East of the city", correct: false }
        - { text: "South of the city", correct: false }
      explanation: |
        Its vineyards spread around the port city of Geelong, onto the Bellarine
        Peninsula and into the Moorabool Valley. Bannockburn is one of its
        best-known estates.

  - id: aus-geelong-climate-001
    type: mcq
