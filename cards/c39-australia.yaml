        - { text: "Sparkling wine", correct: false }
        - { text: "Red wine", correct: true }
      explanation: |
        Shiraz leads plantings by a wide margin, with Cabernet Sauvignon the
        next black grape and Merlot also grown. White grapes are a small
        share.

  - id: aus-mclaren-vale-red-style-001
    type: mcq
