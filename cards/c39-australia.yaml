        - { text: "La Grande Cordillère australienne", correct: true }
        - { text: "La chaîne des monts Otway", correct: false }
      explanation: |
        L’air perd environ 0,6 °C tous les 100 m de dénivelé, et des versants
        d’orientations différentes reçoivent plus ou moins de soleil. Entre ses
        contreforts et ses hauteurs, les vignerons peuvent attribuer à chaque
        cépage le site qui lui convient.

