    en:
      question: "Relative to the Barossa Valley floor, where do Eden Valley vineyards sit?"
      choices:
        - { text: "In the hills to the north", correct: false }
        - { text: "In the hills to the east", correct: true }
        - { text: "In the ranges to the south", correct: false }
        - { text: "In the ranges to the west", correct: false }
      explanation: |
        The Barossa Ranges rise along the valley's eastern edge, and the
        Eden Valley sits on that higher ground. Townships such as Keyneton
        and Springton lie within it.

  - id: aus-eden-valley-climate-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, eden-valley, climate]
    status: reviewed
    source_id: c39-0066
    review:
