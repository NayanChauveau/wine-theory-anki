        - { text: "Élevage en grands foudres anciens", correct: false }
      explanation: |
        Copeaux et douelles donnent vite le goût du chêne, pour une fraction du
        coût des barriques. Les versions non boisées du même vin montrent plutôt
        des fruits comme la pêche et le melon.

