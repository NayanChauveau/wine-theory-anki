      sources: [known-fact]
    en:
      question: "How is the high acidity of Mornington Peninsula Chardonnay usually softened?"
      choices:
        - { text: "By leaving some residual sugar", correct: false }
        - { text: "By deacidifying with chalk", correct: false }
        - { text: "By malolactic conversion", correct: true }
        - { text: "By blending in Semillon", correct: false }
      explanation: |
        Lactic bacteria turn sharp malic acid into softer lactic acid. The fruit
        stays in the citrus, pear and apple range.

  - id: aus-geelong-location-001
    type: mcq
