        - { text: "Chaud, avec très peu de pluie", correct: false }
      explanation: |
        Des pluies concentrées en hiver : c’est le régime méditerranéen
        d’une grande partie du sud de l’Australie. Les étés secs limitent la
        pression des maladies cryptogamiques.

