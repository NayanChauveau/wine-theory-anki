    en:
      question: "Which shape best describes Coonawarra's core vineyard area?"
      choices:
        - { text: "A broad basin around a lake", correct: false }
        - { text: "A long, narrow strip", correct: true }
        - { text: "A wide river terrace", correct: false }
        - { text: "Scattered hilltop patches", correct: false }
      explanation: |
        The prized strip is only about one to two kilometres wide but many
        kilometres long, often likened to a cigar. Moving off it, even a
        short distance, changes the soil.

  - id: aus-coonawarra-location-001
    type: mcq
