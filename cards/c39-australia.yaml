        - { text: "Fragrant, powerful and structured", correct: true }
        - { text: "Rich, sweet-fruited and oaky", correct: false }
      explanation: |
        Wendouree, one of the valley's most revered estates, is known for
        tannic Shiraz and Shiraz blends that need many years in bottle
        before they open up.

  - id: aus-clare-cabernet-001
