        - { text: "About 400 km south-east", correct: true }
        - { text: "About 600 km north-west", correct: false }
      explanation: |
        Penola is the nearest town, and the Victorian border is only a short
        drive to the east.
    fr:
      question: "À quelle distance et dans quelle direction, environ, Coonawarra se trouve-t-elle par rapport à Adélaïde ?"
      choices:
        - { text: "À environ 100 km au nord", correct: false }
        - { text: "À environ 200 km à l’est", correct: false }
        - { text: "À environ 400 km au sud-est", correct: true }
        - { text: "À environ 600 km au nord-ouest", correct: false }
      explanation: |
        Penola est la ville la plus proche, et la frontière du Victoria
        n’est qu’à quelques minutes de route vers l’est.

  - id: aus-coonawarra-terra-rossa-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, coonawarra, soil]
    status: reviewed
    source_id: c39-0094
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which soil profile is Coonawarra famous for?"
      choices:
        - { text: "Black volcanic soil over basalt", correct: false }
        - { text: "Grey alluvial gravel over clay", correct: false }
        - { text: "Sandy loam over ironstone", correct: false }
        - { text: "Red terra rossa over limestone", correct: true }
      explanation: |
        The thin red topsoil drains freely, while the limestone below holds
        moisture that roots can reach. Nearby black clay soils are generally
        less prized for top reds.
    fr:
      question: "Pour quel profil de sol Coonawarra est-elle célèbre ?"
      choices:
        - { text: "Sol volcanique noir sur basalte", correct: false }
        - { text: "Graviers alluviaux gris sur argile", correct: false }
        - { text: "Limon sableux sur roche ferrugineuse", correct: false }
        - { text: "Terra rossa rouge sur calcaire", correct: true }
      explanation: |
        La fine couche rouge de surface draine bien, tandis que le calcaire
        en dessous retient une humidité que les racines peuvent atteindre.
        Les sols d’argile noire voisins sont en général moins recherchés pour
        les grands rouges.

  - id: aus-coonawarra-climate-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, coonawarra, climate]
    status: reviewed
    source_id: c39-0095
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which influences keep Coonawarra's climate moderate?"
      choices:
        - { text: "Cold ocean currents and summer cloud", correct: true }
        - { text: "Vineyards above 500 metres", correct: false }
        - { text: "Morning fog from the Murray River", correct: false }
        - { text: "Cold air draining off nearby ranges", correct: false }
      explanation: |
        In summer the Bonney Upwelling brings cold, deep water to the
        surface off this coast. Coonawarra itself is flat, so altitude and
        cold-air drainage play no real part.
    fr:
      question: "Quelles influences rendent le climat de Coonawarra modéré ?"
      choices:
        - { text: "Courants marins froids et nuages d’été", correct: true }
        - { text: "Vignobles situés au-dessus de 500 mètres", correct: false }
        - { text: "Brouillard matinal venu du fleuve Murray", correct: false }
        - { text: "Air froid descendant des reliefs voisins", correct: false }
      explanation: |
        En été, l’upwelling de Bonney (Bonney Upwelling) fait remonter des
        eaux froides et profondes au large de cette côte.
        Coonawarra étant plate, l’altitude et les descentes d’air froid n’y
        jouent pas vraiment de rôle.

  - id: aus-coonawarra-cabernet-aroma-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, coonawarra, cabernet-sauvignon]
    status: reviewed
    source_id: c39-0097
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Alongside blackcurrant, which aroma is a hallmark of Coonawarra Cabernet Sauvignon?"
      choices:
        - { text: "Cracked black pepper", correct: false }
        - { text: "Eucalyptus or mint", correct: true }
        - { text: "Dried fig", correct: false }
        - { text: "Violets", correct: false }
      explanation: |
        Research has linked the eucalyptus note to 1,8-cineole, a compound
        that can drift from nearby gum trees onto the grapes. The best wines
        age well: Wynns has made its Black Label Cabernet since 1954.
    fr:
      question: "Outre le cassis, quel arôme est une signature du Cabernet Sauvignon de Coonawarra ?"
      choices:
        - { text: "Poivre noir concassé", correct: false }
        - { text: "Eucalyptus ou menthe", correct: true }
        - { text: "Figue séchée", correct: false }
        - { text: "Violette", correct: false }
      explanation: |
        Des recherches ont relié la note d’eucalyptus au 1,8-cinéole, un
        composé que les eucalyptus voisins peuvent déposer sur les raisins.
        Les meilleurs vins vieillissent bien : Wynns produit son Black Label
        Cabernet depuis 1954.

  - id: aus-coonawarra-other-grapes-001
    type: mcq
