        - { text: "Shiraz, Chardonnay and Cabernet Sauvignon", correct: true }
        - { text: "Chardonnay, Grenache and Merlot", correct: false }
        - { text: "Cabernet Sauvignon, Pinot Noir and Grenache", correct: false }
      explanation: |
        Henschke's Hill of Grace, one of Australia's most famous
        single-vineyard Shirazes, comes from Eden Valley vines first planted
        in the 1860s.

  - id: aus-clare-location-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, clare-valley, geography]
    status: reviewed
