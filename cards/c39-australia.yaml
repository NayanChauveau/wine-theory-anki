        - { text: "Adelaide Hills", correct: false }
        - { text: "Barossa Valley", correct: false }
      explanation: |
        It is about 40 km from the city centre, and many of its vineyards
        are within sight of the sea.

  - id: aus-mclaren-vale-climate-001
    type: mcq
