        - { text: "Barrel-fermented and lees-stirred", correct: false }
        - { text: "Botrytised and sweet", correct: false }
        - { text: "Skin-fermented and amber", correct: false }
      explanation: |
        Producers pick earlier and ferment cool in stainless steel to keep
        acidity and citrus fruit. Older Barossa styles were often richer
        and oak-aged.

  - id: aus-barossa-zone-eden-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa, eden-valley, labelling]
    status: reviewed
    source_id: c39-0064
