        - { text: "Intense dark fruit with soft, ripe tannins", correct: true }
        - { text: "Herbaceous fruit with high acidity", correct: false }
        - { text: "Dried fruit with drying, rustic tannins", correct: false }
      explanation: |
        Warm days ripen the skins fully, which softens tannins and deepens
        fruit, while the sea breeze keeps the wines from tasting baked.

