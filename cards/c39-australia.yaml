        - { text: "Moderate, with summer rain", correct: false }
        - { text: "Warm and dry", correct: true }
        - { text: "Hot and humid", correct: false }
      explanation: |
        Most rain falls in winter, so summers are sunny with little disease
        pressure. That heat ripens late varieties fully and gives the soft,
        rich reds the valley is known for.
    fr:
      question: "Comment décrire au mieux le climat du fond de la Barossa Valley pendant la saison de croissance ?"
      choices:
        - { text: "Frais et maritime", correct: false }
        - { text: "Modéré, avec des pluies d’été", correct: false }
        - { text: "Chaud et sec", correct: true }
        - { text: "Très chaud et humide", correct: false }
      explanation: |
        L’essentiel des pluies tombe en hiver : les étés sont ensoleillés et la
        pression des maladies est faible. Cette chaleur mène les cépages tardifs
        à pleine maturité et donne les rouges souples et riches qui font la
        réputation de la vallée.

