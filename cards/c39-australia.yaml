        - { text: "En les gardant plus longtemps sur lies fines", correct: false }
        - { text: "En y assemblant des raisins de régions haut de gamme", correct: true }
        - { text: "En les mettant en bouteille sans collage ni filtration", correct: false }
      explanation: |
        De petits lots venus de la Barossa, des Adelaide Hills ou de McLaren
        Vale apportent arômes et structure. Le choix de la région dépend du
