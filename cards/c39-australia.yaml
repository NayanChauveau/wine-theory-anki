        - { text: "Big healthy crops but less concentration", correct: true }
        - { text: "Good concentration but frequent rot", correct: false }
        - { text: "Healthy fruit but too little sugar", correct: false }
      explanation: |
        Heat, sunshine and generous water let each vine carry a heavy crop,
        while dry air keeps disease low. The flavour is spread across more and
        bigger berries.
    fr:
      question: "Quel compromis caractérise les raisins des grandes régions irriguées de l’intérieur australien ?"
      choices:
        - { text: "Fruit concentré, mais faibles rendements", correct: false }
        - { text: "Fortes récoltes saines, moins concentrées", correct: true }
        - { text: "Bonne concentration, mais pourriture fréquente", correct: false }
        - { text: "Fruit sain, mais trop peu de sucre", correct: false }
      explanation: |
        Chaleur, soleil et eau en abondance permettent à chaque pied de porter
        une lourde récolte, tandis que l’air sec limite les maladies. Les arômes
        se diluent dans des baies plus nombreuses et plus grosses.

