        - { text: "Mushroom and forest floor", correct: false }
        - { text: "Gooseberry and cut grass", correct: false }
        - { text: "Marmalade and toast", correct: true }
      explanation: |
        High acidity and screwcap closures let these unoaked wines age
        slowly. Pewsey Vale releases an Eden Valley Riesling, The Contours,
        only after several years in bottle to show this development.

  - id: aus-eden-valley-other-grapes-001
    type: mcq
