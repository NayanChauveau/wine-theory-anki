        - { text: "About 300–400 m", correct: true }
        - { text: "About 650–800 m", correct: false }
        - { text: "About 1,000–1,200 m", correct: false }
      explanation: |
        A few sites climb close to 570 m. Elevation, more than latitude,
        explains how a region this far from the coast keeps its wines fresh.

  - id: aus-clare-shiraz-style-001
    type: mcq
