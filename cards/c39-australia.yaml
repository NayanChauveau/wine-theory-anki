      sources: [known-fact]
    en:
      question: "Which weather risk most often troubles the Hunter Valley vintage?"
      choices:
        - { text: "Spring frost at budburst", correct: false }
        - { text: "Hail during flowering", correct: false }
        - { text: "Strong winds at flowering", correct: false }
        - { text: "Rain at harvest time", correct: true }
      explanation: |
        Picking falls in late summer, among the wettest months of the year, when
        storms and ex-tropical lows can drift down the coast.

  - id: aus-hunter-canopy-rot-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, hunter-valley, viticulture]
    status: reviewed
    source_id: c39-0148
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard measure does most to limit rot in the Hunter Valley?"
      choices:
        - { text: "Low bush-trained vines", correct: false }
        - { text: "Careful canopy management", correct: true }
        - { text: "Picking later so skins thicken", correct: false }
        - { text: "Dense canopies to shade bunches", correct: false }
      explanation: |
        An open canopy lets wind dry the bunches after rain and lets sprays reach
        the fruit.

  - id: aus-nsw-cooler-regions-001
    type: mcq
    deck: Australia
    tags: [australia, new-south-wales, climate]
    status: reviewed
    source_id: c39-0143
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of New South Wales regions is noticeably cooler than the Hunter Valley?"
      choices:
        - { text: "Riverina and Perricoota", correct: false }
        - { text: "Northern Rivers and Hastings River", correct: false }
        - { text: "Orange and Mudgee", correct: true }
        - { text: "Murray Darling and Swan Hill", correct: false }
      explanation: |
        Height is the key. The Orange name is reserved for vineyards above 600 m,
        many on the flanks of Mount Canobolas, an extinct volcano. Cowra is a
        third, somewhat cooler inland area.

  - id: aus-nsw-orange-location-001
