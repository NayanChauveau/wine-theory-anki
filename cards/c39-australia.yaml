        - { text: "Barossa Valley", correct: true }
        - { text: "Langhorne Creek", correct: false }
        - { text: "Clare Valley", correct: false }
      explanation: |
        Many of the country's best-known producers are based or were founded
        there. Yalumba, for example, was established at Angaston in 1849 and
        is still family-owned.

  - id: aus-barossa-climate-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa, climate]
    status: reviewed
    source_id: c39-0058
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is the growing climate of the Barossa Valley floor best described?"
      choices:
        - { text: "Cool and maritime", correct: false }
        - { text: "Moderate, with summer rain", correct: false }
        - { text: "Warm and dry", correct: true }
        - { text: "Hot and humid", correct: false }
      explanation: |
        Most rain falls in winter, so summers are sunny with little disease
        pressure. That heat ripens late varieties fully and gives the soft,
        rich reds the valley is known for.

  - id: aus-barossa-black-grapes-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa, grapes]
    status: reviewed
    source_id: c39-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which trio of black grapes does the Barossa Valley handle best?"
      choices:
        - { text: "Shiraz, Pinot Noir and Merlot", correct: false }
        - { text: "Grenache, Merlot and Tempranillo", correct: false }
        - { text: "Cabernet Sauvignon, Merlot and Pinot Noir", correct: false }
        - { text: "Shiraz, Cabernet Sauvignon and Grenache", correct: true }
      explanation: |
        Grenache was long grown mainly for fortified wine. Surviving old
        plantings now give some of the valley's most sought-after table
        reds, often blended with Shiraz and Mataro.

  - id: aus-barossa-shiraz-oak-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa, shiraz, oak]
    status: reviewed
    source_id: c39-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which oak has traditionally been used to mature classic Barossa Valley Shiraz?"
      choices:
        - { text: "American oak", correct: true }
        - { text: "Slavonian oak", correct: false }
        - { text: "Hungarian oak", correct: false }
        - { text: "French oak", correct: false }
      explanation: |
        Its coconut and sweet vanilla notes suit very ripe fruit. Penfolds
        Grange, built largely on Barossa Shiraz, has long been matured in new
        American oak hogsheads; French oak has gained ground only more recently.

  - id: aus-barossa-shiraz-ageing-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa, shiraz]
    status: reviewed
    source_id: c39-0061
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which notes does a classic Barossa Valley Shiraz develop with bottle age?"
      choices:
        - { text: "Cut grass and green pepper", correct: false }
        - { text: "Pepper and violets", correct: false }
        - { text: "Leather and spice", correct: true }
        - { text: "Coconut and vanilla", correct: false }
      explanation: |
        Slow oxidation in bottle turns young blackberry and plum towards
        dried fruit and savoury tertiary notes. Coconut and vanilla come
        from oak, and are present from the start rather than with age.

  - id: aus-barossa-white-semillon-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, barossa, grapes]
    status: reviewed
    source_id: c39-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which white grape has the longest-standing reputation in the Barossa Valley, with some vines over a century old?"
      choices:
        - { text: "Sauvignon Blanc", correct: false }
        - { text: "Pinot Gris", correct: false }
        - { text: "Marsanne", correct: false }
        - { text: "Semillon", correct: true }
      explanation: |
        It has been grown in the valley since the nineteenth century, and
        some very old vines survive. Warm, dry summers suit a grape that
        keeps its shape better than delicate aromatic varieties.

  - id: aus-barossa-semillon-fresh-001
    type: mcq
