        - { text: "To the east", correct: false }
        - { text: "To the north-west", correct: true }
        - { text: "To the south-west", correct: false }
      explanation: |
        It is the most northerly of South Australia's classic regions,
        about 120 km from Adelaide. Watervale and Polish Hill River are
        among its best-known subregions.

  - id: aus-clare-climate-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, clare-valley, climate]
    status: reviewed
    source_id: c39-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which conditions help the warm Clare Valley keep freshness in its grapes?"
      choices:
        - { text: "Summer cloud off a cold current", correct: false }
        - { text: "Morning fog rising off the Murray River", correct: false }
        - { text: "Cool afternoon breezes and cold nights", correct: true }
        - { text: "High humidity that slows ripening", correct: false }
      explanation: |
        A wide gap between day and night temperatures slows the loss of
        acid during ripening. That is why a region with hot days can still
        make taut, dry whites.

  - id: aus-clare-altitude-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, clare-valley, geography]
    status: reviewed
