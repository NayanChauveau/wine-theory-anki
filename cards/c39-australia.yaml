        - { text: "About 60 km east", correct: false }
        - { text: "About 25 km east", correct: true }
      explanation: |
        The region occupies the Mount Lofty Ranges rising directly behind the
        city, so some vineyards are only a short drive from the suburbs.

  - id: aus-adelaide-hills-climate-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, adelaide-hills, climate]
    status: reviewed
    source_id: c39-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is the Adelaide Hills climate best described?"
      choices:
        - { text: "Hot, with rain mainly in summer", correct: false }
        - { text: "Moderate, with rain mainly in winter", correct: true }
        - { text: "Cool, with rain spread through the year", correct: false }
        - { text: "Warm, with very little rain at all", correct: false }
      explanation: |
        Winter-dominant rain is the Mediterranean pattern shared by much of
        southern Australia. Dry summers keep fungal disease pressure low.

  - id: aus-adelaide-hills-altitude-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, adelaide-hills, geography]
    status: reviewed
    source_id: c39-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which altitude band holds most Adelaide Hills vineyards?"
      choices:
        - { text: "About 50–150 m", correct: false }
        - { text: "About 200–300 m", correct: false }
        - { text: "About 400–600 m", correct: true }
        - { text: "About 900–1,100 m", correct: false }
      explanation: |
        Height is what lets a region so close to a warm city grow cool-climate
        grapes: the vineyards run markedly cooler than Adelaide on the plain
        below.

  - id: aus-adelaide-hills-irrigation-001
    type: mcq
    deck: Australia
    tags: [australia, south-australia, adelaide-hills, vineyard]
    status: reviewed
    source_id: c39-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What often makes irrigation necessary in Adelaide Hills vineyards during the growing season?"
      choices:
        - { text: "Hot, dry north winds most afternoons", correct: false }
        - { text: "Clay subsoils that keep roots shallow", correct: false }
        - { text: "Very high planting densities on slopes", correct: false }
        - { text: "Soils that hold little water", correct: true }
      explanation: |
        Rain that falls in the cool months drains through and is not kept
        for summer. Drip lines let growers top up the vines in measured
        doses rather than flood them.

  - id: aus-adelaide-hills-chardonnay-style-001
    type: mcq
