        - { text: "Rouges et vins doux fortifiés issus de cépages noirs", correct: false }
      explanation: |
        L’AOP ne couvre ni les rouges ni les rosés. Ses blancs secs exigent au moins 85 % d’Assyrtiko ; ses vins doux de raisins séchés comprennent le Vinsanto.

