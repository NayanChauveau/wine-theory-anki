  - id: greece-natives-adapted-001
    type: mcq
    deck: Greece
    tags: [greece]
    status: reviewed
    source_id: c25-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are many indigenous Greek varieties valuable in the country’s warmest, driest vineyards?"
      choices:
        - { text: "They require high rainfall to complete ripening", correct: false }
        - { text: "They are adapted to heat, drought and dry, low-fertility soils", correct: true }
        - { text: "They ripen only where summers remain cool", correct: false }
        - { text: "They naturally produce low-acid wines in every site", correct: false }
      explanation: |
        Long local adaptation helps vines survive water stress while still producing balanced fruit. Assyrtiko’s ability to retain acidity in Santorini is a leading example.
    fr:
      question: "Pourquoi de nombreux cépages indigènes grecs sont-ils précieux dans les vignobles les plus chauds et les plus secs du pays ?"
      choices:
        - { text: "Ils exigent de fortes précipitations pour achever leur maturation", correct: false }
        - { text: "Ils sont adaptés à la chaleur, à la sécheresse et aux sols secs et peu fertiles", correct: true }
        - { text: "Ils ne mûrissent que lorsque les étés restent frais", correct: false }
        - { text: "Ils produisent naturellement des vins peu acides sur tous les sites", correct: false }
      explanation: |
        Une longue adaptation locale aide les vignes à supporter le stress hydrique tout en donnant des raisins équilibrés. La capacité de l’Assyrtiko à conserver son acidité à Santorin en est un exemple majeur.

  - id: greece-pdo-natives-001
    type: mcq
    deck: Greece
    tags: [greece, law]
    status: reviewed
    source_id: c25-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pattern is common among Greece’s best-known wine PDOs?"
      choices:
        - { text: "They are based principally on international varieties", correct: false }
        - { text: "They link a delimited origin to one or more indigenous varieties", correct: true }
        - { text: "They permit every Greek and international grape without restriction", correct: false }
        - { text: "They classify wines only by ageing time rather than origin", correct: false }
      explanation: |
        Naoussa centres on Xinomavro, Nemea on Agiorgitiko and Santorini on Assyrtiko with other local white grapes permitted in specified proportions.
    fr:
      question: "Quel schéma est courant parmi les AOP viticoles grecques les plus connues ?"
      choices:
        - { text: "Elles reposent principalement sur des cépages internationaux", correct: false }
        - { text: "Elles associent une origine délimitée à un ou plusieurs cépages indigènes", correct: true }
        - { text: "Elles autorisent sans restriction tous les cépages grecs et internationaux", correct: false }
        - { text: "Elles classent les vins uniquement selon leur durée d’élevage et non selon leur origine", correct: false }
      explanation: |
        Naoussa repose sur le Xinomavro, Nemea sur l’Agiorgitiko et Santorini sur l’Assyrtiko, avec d’autres cépages blancs locaux autorisés dans des proportions définies.

