        - { text: "Une plaine fluviale humide aux sols alluviaux profonds", correct: false }
      explanation: |
        Les très faibles précipitations, les vents forts, les sols volcaniques pauvres et les vieilles vignes limitent ensemble les rendements et concentrent les raisins.

