cards:
  - id: greece-export-trio-001
    type: mcq
    deck: Greece
    tags: [greece]
    status: reviewed
    source_id: c25-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which set correctly pairs three internationally prominent Greek grapes with their benchmark PDOs?"
      choices:
        - { text: "Xinomavro–Nemea, Agiorgitiko–Santorini, Assyrtiko–Naoussa", correct: false }
        - { text: "Xinomavro–Naoussa, Agiorgitiko–Nemea, Assyrtiko–Santorini", correct: true }
        - { text: "Xinomavro–Santorini, Agiorgitiko–Naoussa, Assyrtiko–Nemea", correct: false }
        - { text: "Xinomavro–Rapsani, Agiorgitiko–Naoussa, Assyrtiko–Amyndeon", correct: false }
      explanation: |
        These three grape–place associations provide a useful framework for Greece’s best-known exports: two contrasting reds and one distinctive white.
    fr:
      question: "Quel groupe associe correctement trois cépages grecs de renommée internationale à leurs AOP de référence ?"
      choices:
        - { text: "Xinomavro–Nemea, Agiorgitiko–Santorini, Assyrtiko–Naoussa", correct: false }
        - { text: "Xinomavro–Naoussa, Agiorgitiko–Nemea, Assyrtiko–Santorini", correct: true }
        - { text: "Xinomavro–Santorini, Agiorgitiko–Naoussa, Assyrtiko–Nemea", correct: false }
        - { text: "Xinomavro–Rapsani, Agiorgitiko–Naoussa, Assyrtiko–Amyndeon", correct: false }
      explanation: |
        Ces trois associations entre cépage et origine offrent un bon cadre pour retenir les exportations grecques les plus célèbres : deux rouges très différents et un blanc singulier.

  - id: greece-climate-001
    type: mcq
    deck: Greece
    tags: [greece, climate]
    status: reviewed
    source_id: c25-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which broad climatic pattern characterises most Greek wine regions?"
      choices:
        - { text: "Cool maritime conditions moderated chiefly by Atlantic rain", correct: false }
        - { text: "Hot Mediterranean conditions moderated locally by altitude, seas and winds", correct: true }
        - { text: "Warm continental conditions with abundant summer rainfall", correct: false }
        - { text: "Cool continental conditions with short, wet growing seasons", correct: false }
      explanation: |
        Summers are generally hot and dry. Elevation, maritime influence and winds can slow ripening and preserve acidity in favourable sites.
    fr:
      question: "Quel grand régime climatique caractérise la plupart des régions viticoles grecques ?"
      choices:
        - { text: "Des conditions maritimes fraîches surtout modérées par les pluies atlantiques", correct: false }
        - { text: "Des conditions méditerranéennes chaudes, localement modérées par l’altitude, les mers et les vents", correct: true }
        - { text: "Des conditions continentales chaudes avec d’abondantes pluies estivales", correct: false }
        - { text: "Des conditions continentales fraîches avec des saisons courtes et humides", correct: false }
      explanation: |
        Les étés sont généralement chauds et secs. L’altitude, l’influence maritime et les vents peuvent ralentir la maturation et préserver l’acidité sur les sites favorables.

  - id: greece-east-drought-001
    type: mcq
    deck: Greece
    tags: [greece, climate]
    status: reviewed
    source_id: c25-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are many vineyards in eastern Greece particularly exposed to drought?"
      choices:
        - { text: "Warm Aegean currents prevent winter rainfall", correct: false }
        - { text: "The Pindus Mountains create a rain shadow from moist westerly winds", correct: true }
        - { text: "Northern mountains channel all rainfall toward the east", correct: false }
        - { text: "Volcanic soils prevent any water from reaching vine roots", correct: false }
      explanation: |
        Moist air loses much of its rain on Greece’s western side as it crosses the Pindus range, leaving eastern areas drier and with limited irrigation water.
    fr:
      question: "Pourquoi de nombreux vignobles de l’est de la Grèce sont-ils particulièrement exposés à la sécheresse ?"
      choices:
        - { text: "Les courants chauds de la mer Égée empêchent les pluies hivernales", correct: false }
        - { text: "Le massif du Pinde crée une ombre pluviométrique face aux vents humides d’ouest", correct: true }
        - { text: "Les montagnes du nord dirigent toutes les précipitations vers l’est", correct: false }
        - { text: "Les sols volcaniques empêchent toute eau d’atteindre les racines", correct: false }
      explanation: |
        L’air humide perd une grande partie de ses précipitations sur le versant occidental de la Grèce en franchissant le Pinde, laissant l’est plus sec et disposant de peu d’eau d’irrigation.

