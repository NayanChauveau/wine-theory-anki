        - { text: "Davantage de cépages internationaux et moins de Xinomavro", correct: false }
      explanation: |
        Une récolte plus mûre, une extraction adaptée et les choix d’élevage peuvent rendre le Xinomavro plus accessible dès sa sortie tout en maintenant son acidité et son potentiel de garde.

