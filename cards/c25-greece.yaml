      choices:
        - { text: "Flat coastal land from sea level to 100 metres", correct: false }
        - { text: "Hilly south-eastern slopes of Mount Vermio at roughly 150–400 metres", correct: true }
        - { text: "High plateaux above 900 metres in the Pindus", correct: false }
        - { text: "Low volcanic terraces around an Aegean caldera", correct: false }
      explanation: |
        Altitude, aspect and varied soils create distinct mesoclimates, helping late-ripening Xinomavro retain acidity in a generally warm country.
    fr:
      question: "Quelle description correspond le mieux aux vignobles de l’AOP Naoussa ?"
      choices:
        - { text: "Terrains côtiers plats du niveau de la mer à 100 mètres", correct: false }
        - { text: "Versants vallonnés sud-est du mont Vermio, à environ 150–400 mètres", correct: true }
        - { text: "Hauts plateaux du Pinde au-dessus de 900 mètres", correct: false }
        - { text: "Basses terrasses volcaniques autour d’une caldeira égéenne", correct: false }
      explanation: |
        L’altitude, l’exposition et la diversité des sols créent des mésoclimats distincts, qui aident le Xinomavro tardif à conserver son acidité dans un pays globalement chaud.

