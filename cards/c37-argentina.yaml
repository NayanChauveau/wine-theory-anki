        - { text: "Around 1,600 m", correct: false }
        - { text: "Around 2,200 m", correct: false }
      explanation: |
        The department sits in the Andean foothills close to Mendoza City, with most
        vineyards between about 800 and 1,100 m. Districts such as Agrelo,
        Perdriel and Vistalba lie within it.

  - id: argentina-lujan-old-vines-001
    type: mcq
    deck: Argentina
    tags: [argentina, mendoza, lujan-de-cuyo, malbec, old-vines]
