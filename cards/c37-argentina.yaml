        - { text: "Cabernet Sauvignon and Syrah", correct: true }
        - { text: "Riesling and Pinot Gris", correct: false }
      explanation: |
        Both need plenty of warmth to ripen fully. On Maipú's warm, sunny sites they
        reach ripe tannins without the green edge they can show in cooler spots.

