  - id: argentina-uco-cool-nights-001
    type: mcq
    deck: Argentina
    tags: [argentina, mendoza, uco-valley, climate, style]
    status: reviewed
    source_id: c37-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What do cool nights in Mendoza's Uco Valley mainly contribute to the grapes?"
      choices:
        - { text: "Higher sugar and lower acidity", correct: false }
        - { text: "Fresh fruit and retained acidity", correct: true }
        - { text: "Softer tannins and riper, jammy fruit", correct: false }
        - { text: "Thinner skins and lighter colour", correct: false }
      explanation: |
        Respiration of malic acid slows when temperatures drop at night, so the grapes
        keep their acidity while sugars still build by day. The wines can also show a
        floral, violet-like lift.

