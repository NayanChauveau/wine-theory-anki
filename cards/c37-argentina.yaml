  - id: argentina-neuquen-young-region-001
    type: mcq
    deck: Argentina
    tags: [argentina, patagonia, neuquen]
    status: reviewed
    source_id: c37-0105
    review:
      fact_check: pass
      sources: [wines-of-argentina, trade-press]
    en:
      question: "Which description best fits the wine industry of Neuquén province?"
      choices:
        - { text: "A young zone whose best styles are still being defined", correct: true }
        - { text: "An old zone dominated by bulk-wine co-operatives", correct: false }
        - { text: "A historic centre known mainly for fortified wines", correct: false }
        - { text: "A high-altitude zone famous above all for Torrontés", correct: false }
      explanation: |
        Most plantings are at San Patricio del Chañar, irrigated desert steppe turned
        into vineyards from 1999, with the first wineries in the early 2000s.
        Malbec leads, while Pinot Noir and the whites are still being explored.
    fr:
      question: "Quelle description correspond le mieux à la filière viticole de la province de Neuquén ?"
      choices:
        - { text: "Une zone jeune aux meilleurs styles encore à définir", correct: true }
        - { text: "Une zone ancienne dominée par des coopératives de vrac", correct: false }
        - { text: "Un centre historique surtout connu pour ses vins mutés", correct: false }
        - { text: "Une zone d’altitude célèbre avant tout pour le Torrontés", correct: false }
      explanation: |
        L’essentiel des plantations se trouve à San Patricio del Chañar, une steppe
        désertique irriguée transformée en vignoble à partir de 1999, et les premières
        caves datent du début des années 2000. Le Malbec domine, tandis que le Pinot
        Noir et les blancs sont encore à l’étude.
