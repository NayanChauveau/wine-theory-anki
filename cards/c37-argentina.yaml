        - { text: "Des terrasses d’argile qui retiennent la pluie d’hiver", correct: false }
      explanation: |
        Les pluies sont bien trop faibles pour une culture sans irrigation : l’eau de
        fonte, dérivée vers de larges terres planes, permet des rendements élevés. Ces
        mêmes fonds de vallée chauds et ensoleillés favorisent davantage le volume que
        la finesse.

