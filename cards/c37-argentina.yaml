      choices:
        - { text: "Río Negro and Chubut", correct: false }
        - { text: "Río Negro and Neuquén", correct: true }
        - { text: "Neuquén and La Pampa", correct: false }
        - { text: "Chubut and La Pampa", correct: false }
      explanation: |
