        - { text: "Some sites are cool enough", correct: true }
        - { text: "Pacific fog reaches the valley", correct: false }
        - { text: "Summer rain keeps the vines lush", correct: false }
      explanation: |
        The early-ripening grape loses its delicate aromas in heat. The coolest,
        highest plots give it the slow, even ripening it needs.

