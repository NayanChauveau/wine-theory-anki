        - { text: "Summer hailstorms", correct: false }
        - { text: "Heavy rain at harvest", correct: false }
        - { text: "Fog from a cold ocean current", correct: false }
        - { text: "Strong, persistent winds", correct: true }
      explanation: |
        Growers plant rows of poplars as windbreaks to protect young shoots and
        flowering. The constant airflow also encourages thicker grape skins, which adds
        colour and structure to the reds.
    fr:
      question: "Quel aléa naturel pèse le plus sur le travail de la vigne dans les provinces viticoles les plus australes d’Argentine ?"
      choices:
        - { text: "Les orages de grêle en été", correct: false }
        - { text: "De fortes pluies aux vendanges", correct: false }
        - { text: "Le brouillard d’un courant océanique froid", correct: false }
        - { text: "Des vents forts et persistants", correct: true }
      explanation: |
        Les viticulteurs plantent des brise-vent de peupliers pour protéger les jeunes
        pousses et la floraison. Ce flux d’air constant favorise aussi des peaux plus
        épaisses, qui apportent couleur et structure aux rouges.

  - id: argentina-patagonia-disease-001
    type: mcq
    deck: Argentina
    tags: [argentina, patagonia, viticulture]
    status: reviewed
    source_id: c37-0102
    review:
      fact_check: pass
      sources: [wines-of-argentina, trade-press]
    en:
      question: "Why is fungal disease pressure generally low in Patagonia's vineyards?"
      choices:
        - { text: "High altitude slows the spread of spores", correct: false }
        - { text: "The climate is very dry, with little rain", correct: true }
        - { text: "Free-draining sandy soils keep vines dry", correct: false }
        - { text: "Hard winter frosts kill spores each year", correct: false }
      explanation: |
        Annual rainfall is often below 200 mm, so vines depend on irrigation from
        Andean rivers such as the Neuquén and Negro. With so little moisture on the
        leaves, rot and mildew struggle to take hold, and the wind dries the canopy
        further.
    fr:
      question: "Pourquoi la pression des maladies cryptogamiques est-elle généralement faible dans les vignobles de Patagonie ?"
      choices:
        - { text: "L’altitude élevée freine la diffusion des spores", correct: false }
        - { text: "Le climat est très sec, avec peu de pluie", correct: true }
        - { text: "Des sols sableux drainants gardent la vigne au sec", correct: false }
        - { text: "De fortes gelées d’hiver tuent les spores chaque année", correct: false }
      explanation: |
        Il tombe souvent moins de 200 mm de pluie par an, si bien que la vigne dépend de
        l’irrigation par des rivières andines comme le Neuquén et le Negro. Avec si peu
        d’humidité sur les feuilles, pourriture et mildiou s’installent difficilement,
        et le vent assèche encore le feuillage.

  - id: argentina-patagonia-fruit-style-001
    type: mcq
    deck: Argentina
    tags: [argentina, patagonia, wine-style]
    status: reviewed
    source_id: c37-0103
    review:
      fact_check: pass
      sources: [wines-of-argentina]
    en:
      question: "Long summer days followed by cool nights typify Argentina's far-southern vineyards. Which fruit and acidity profile does this usually give?"
      choices:
        - { text: "Jammy, baked fruit and low to medium acidity", correct: false }
        - { text: "Lean, unripe fruit and very high, tart acidity", correct: false }
        - { text: "Concentrated, fresh fruit and medium to high acidity", correct: true }
        - { text: "Dilute, delicate fruit and medium to low acidity", correct: false }
      explanation: |
        At around 38–39° S the summer days are long, so grapes ripen fully and build
        flavour. Cold nights slow the loss of acid in the berries, keeping the fruit
        fresh rather than cooked.
    fr:
      question: "De longues journées d’été suivies de nuits fraîches caractérisent les vignobles de l’extrême sud argentin. Quel profil de fruit et d’acidité en résulte généralement ?"
      choices:
        - { text: "Fruit confituré et cuit, acidité faible à moyenne", correct: false }
        - { text: "Fruit maigre, pas mûr, acidité très élevée et mordante", correct: false }
        - { text: "Fruit concentré et frais, acidité moyenne à élevée", correct: true }
        - { text: "Fruit dilué et délicat, acidité moyenne à faible", correct: false }
      explanation: |
        Vers 38–39° S, les journées d’été sont longues : les raisins mûrissent
        pleinement et développent leurs arômes. Les nuits froides ralentissent la perte
        d’acidité dans les baies et gardent un fruit frais plutôt que cuit.

