        - { text: "Sharp acidity and green, herbaceous notes", correct: false }
        - { text: "A lean, mineral frame and light body", correct: false }
        - { text: "A soft, rounded texture and sweet spice", correct: true }
      explanation: |
        Blenders often build the mid-palate on Luján fruit, then add fresher fruit from
        higher, cooler sites to lift aroma and acidity.

