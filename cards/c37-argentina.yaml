      sources: [known-fact]
    en:
      question: "Besides altitude, what helps explain the quality of Malbec from Luján de Cuyo?"
      choices:
        - { text: "Cool Pacific breezes crossing the Andes", correct: false }
        - { text: "Deep clay soils that hold winter rain", correct: false }
        - { text: "A high share of very old vines", correct: true }
        - { text: "Summer cloud cover that slows ripening", correct: false }
      explanation: |
        Old, often ungrafted vines give small crops of small berries with naturally
        concentrated flavour. The Andes block Pacific air, and almost no rain falls
        in winter.

  - id: argentina-lujan-blend-texture-001
