        - { text: "They are mostly dry-farmed", correct: false }
        - { text: "They receive more summer rain", correct: false }
      explanation: |
        The land slopes down eastward, away from the Andes, so Maipú is generally a
        little warmer than its neighbour.

  - id: argentina-maipu-grapes-001
    type: mcq
