        - { text: "Les pourritures et le mildiou", correct: true }
      explanation: |
        Les spores du mildiou et de la pourriture grise ont besoin d’humidité sur les
        feuilles et les fruits pour infecter. Avec une hygrométrie basse et peu de
        pluie, les traitements sont bien moins fréquents que dans une région maritime
        comme Bordeaux.

