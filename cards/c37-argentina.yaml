      question: "Qu’est-ce qui permet une viticulture de volume dans la province argentine de La Rioja ?"
      choices:
        - { text: "Des vignes irriguées sur les fonds de vallée plats", correct: true }
        - { text: "Des pluies d’été régulières sur les hauts versants", correct: false }
