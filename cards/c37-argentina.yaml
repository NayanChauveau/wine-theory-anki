        - { text: "Tempranillo, Barbera and Sangiovese", correct: false }
        - { text: "Pinot Noir, Merlot and Carmenère", correct: false }
        - { text: "Cabernet Sauvignon, Bonarda and Syrah", correct: true }
      explanation: |
        All three are robust, heat-tolerant reds suited to the hot, irrigated valley
        floors. Each covers several hundred hectares there, while Malbec now leads the
