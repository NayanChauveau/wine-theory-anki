# deck: Argentina

cards:
  - id: argentina-oasis-vineyards-001
    type: mcq
    deck: Argentina
    tags: [argentina, geography]
    status: reviewed
    source_id: c37-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description best fits the setting of most of Argentina's vineyards?"
      choices:
        - { text: "Rain-fed plains around Buenos Aires", correct: false }
        - { text: "Irrigated oases in desert near the Andes", correct: true }
        - { text: "Humid lowlands along the Paraná River", correct: false }
        - { text: "Cool coastal valleys open to the Atlantic", correct: false }
      explanation: |
        Each oasis exists only where river water can be led onto the land. Mendoza
        city grew up around one, and the cultivated area is a small share of the
        province; the rest is dry scrub.
    fr:
      question: "Quelle description correspond le mieux au cadre de la plupart des vignobles argentins ?"
      choices:
        - { text: "Des plaines sans irrigation autour de Buenos Aires", correct: false }
        - { text: "Des oasis irriguées en plein désert, au pied des Andes", correct: true }
        - { text: "Des basses terres humides le long du Paraná", correct: false }
        - { text: "Des vallées côtières fraîches ouvertes sur l’Atlantique", correct: false }
      explanation: |
        Chaque oasis n’existe que là où l’on peut amener l’eau des rivières sur les
        terres. La ville de Mendoza s’est développée autour de l’une d’elles, et la
        surface cultivée ne représente qu’une faible part de la province ; le reste est
        une steppe aride.

  - id: argentina-vineyard-span-001
    type: mcq
    deck: Argentina
    tags: [argentina, geography]
    status: reviewed
    source_id: c37-0002
    review:
      fact_check: pass
      sources: [known-fact, trade-press]
    en:
      question: "From the far north of the country to northern Patagonia, roughly how far do Argentina's main vineyard areas stretch?"
      choices:
        - { text: "About 300 km", correct: false }
        - { text: "About 700 km", correct: false }
        - { text: "About 4,000 km", correct: false }
        - { text: "About 1,500 km", correct: true }
      explanation: |
        That covers roughly 25° S to 39° S. Newer outposts push the range further,
        from Jujuy in the north to Chubut in the south.
    fr:
      question: "De l’extrême nord du pays au nord de la Patagonie, sur quelle distance environ s’étendent les principales zones viticoles argentines ?"
      choices:
        - { text: "Environ 300 km", correct: false }
        - { text: "Environ 700 km", correct: false }
        - { text: "Environ 4 000 km", correct: false }
        - { text: "Environ 1 500 km", correct: true }
      explanation: |
        Cela couvre à peu près de 25° S à 39° S. Des plantations plus récentes
        repoussent encore ces limites, de Jujuy au nord jusqu’au Chubut au sud.

  - id: argentina-northern-limit-001
    type: mcq
    deck: Argentina
    tags: [argentina, geography, salta]
    status: reviewed
    source_id: c37-0003
    review:
      fact_check: pass
      sources: [known-fact, wines-of-argentina]
    en:
      question: "Which province marks the northern end of Argentina's main chain of wine regions?"
      choices:
        - { text: "La Rioja", correct: false }
        - { text: "Catamarca", correct: false }
        - { text: "Salta", correct: true }
        - { text: "San Juan", correct: false }
      explanation: |
        Its wine town of Cafayate lies at about 26° S, close to the Tropic of
        Capricorn. Neighbouring Jujuy, further north still, has only a handful of
        small, recent plantings.
    fr:
      question: "Quelle province marque l’extrémité nord de la grande chaîne de régions viticoles argentines ?"
      choices:
        - { text: "La Rioja", correct: false }
        - { text: "Catamarca", correct: false }
        - { text: "Salta", correct: true }
        - { text: "San Juan", correct: false }
      explanation: |
        Sa ville viticole, Cafayate, se trouve vers 26° S, près du tropique du
        Capricorne. La province voisine de Jujuy, plus au nord encore, ne compte que
        quelques petites plantations récentes.

  - id: argentina-altitude-range-001
    type: mcq
    deck: Argentina
    tags: [argentina, geography, altitude]
    status: reviewed
    source_id: c37-0004
    review:
      fact_check: pass
      sources: [known-fact, trade-press]
    en:
      question: "At what altitude do most of Argentina's vineyards lie?"
      choices:
        - { text: "Roughly 600 to 1,500 m", correct: true }
        - { text: "Below about 200 m", correct: false }
        - { text: "Roughly 200 to 500 m", correct: false }
        - { text: "Above about 2,000 m", correct: false }
      explanation: |
        Even Mendoza city, on the plain below the foothills, stands at about 750 m.
        Air cools as it rises, so these heights take the edge off the heat.
    fr:
      question: "À quelle altitude se trouvent la plupart des vignobles argentins ?"
      choices:
        - { text: "Entre 600 et 1 500 m environ", correct: true }
        - { text: "Au-dessous de 200 m environ", correct: false }
        - { text: "Entre 200 et 500 m environ", correct: false }
        - { text: "Au-dessus de 2 000 m environ", correct: false }
      explanation: |
        Même la ville de Mendoza, dans la plaine au pied des contreforts, se situe vers
        750 m. L’air se refroidit en s’élevant : ces altitudes tempèrent donc la
        chaleur.

  - id: argentina-low-altitude-provinces-001
    type: mcq
    deck: Argentina
    tags: [argentina, geography, altitude, patagonia]
    status: reviewed
    source_id: c37-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of Argentine provinces has vineyards well below the altitude typical of the rest of the country?"
      choices:
        - { text: "Salta and Catamarca", correct: false }
        - { text: "San Juan and La Rioja", correct: false }
        - { text: "Río Negro and Neuquén", correct: true }
        - { text: "Mendoza and Salta", correct: false }
      explanation: |
        Their vineyards sit on terraces along the Negro and Neuquén rivers, which
        supply the irrigation water. The Alto Valle around General Roca is the
        historic centre.
    fr:
      question: "Quelle paire de provinces argentines possède des vignobles bien plus bas que l’altitude habituelle dans le reste du pays ?"
      choices:
        - { text: "Salta et Catamarca", correct: false }
        - { text: "San Juan et La Rioja", correct: false }
        - { text: "Río Negro et Neuquén", correct: true }
        - { text: "Mendoza et Salta", correct: false }
      explanation: |
        Leurs vignes occupent des terrasses le long du Negro et du Neuquén, qui
        fournissent l’eau d’irrigation. L’Alto Valle, autour de General Roca, en est le
        berceau historique.

  - id: argentina-highest-vineyards-001
    type: mcq
    deck: Argentina
    tags: [argentina, salta, altitude]
    status: reviewed
    source_id: c37-0006
    review:
      fact_check: pass
      sources: [producer-site, trade-press]
    en:
      question: "Which Argentine province is best known for vineyards that regularly reach 2,000 m or more?"
      choices:
        - { text: "Mendoza", correct: false }
        - { text: "San Juan", correct: false }
        - { text: "La Rioja", correct: false }
        - { text: "Salta", correct: true }
      explanation: |
        Most of these plantings line the Calchaquí Valleys, a chain of dry valleys
        in the west of the province.
    fr:
      question: "Quelle province argentine est la plus connue pour ses vignobles qui atteignent régulièrement 2 000 m ou plus ?"
      choices:
        - { text: "Mendoza", correct: false }
        - { text: "San Juan", correct: false }
        - { text: "La Rioja", correct: false }
        - { text: "Salta", correct: true }
      explanation: |
        La plupart de ces plantations jalonnent les vallées Calchaquíes, une suite de
        vallées sèches dans l’ouest de la province.

  - id: argentina-altitude-latitude-001
    type: mcq
    deck: Argentina
    tags: [argentina, altitude, climate]
    status: reviewed
    source_id: c37-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What do Argentina's very high vineyards make possible?"
      choices:
        - { text: "Enough rainfall to farm without irrigation", correct: false }
        - { text: "Springs largely free of frost risk", correct: false }
        - { text: "Cool enough sites at low latitude", correct: true }
        - { text: "Warmer nights for fuller ripening", correct: false }
      explanation: |
        Air cools by roughly 0.6 °C for every 100 m of height, so a site at 1,700 m
        averages about 10 °C cooler than sea level at the same latitude. Few
        countries can find temperate sites so near the tropics.
    fr:
      question: "Que permettent les vignobles argentins de très haute altitude ?"
      choices:
        - { text: "Assez de pluie pour cultiver sans irrigation", correct: false }
        - { text: "Des printemps presque à l’abri du gel", correct: false }
        - { text: "Des sites assez frais à basse latitude", correct: true }
        - { text: "Des nuits plus chaudes pour mûrir pleinement", correct: false }
      explanation: |
        L’air perd environ 0,6 °C tous les 100 m : un site à 1 700 m est en moyenne plus
        frais d’environ 10 °C qu’un site au niveau de la mer à la même latitude. Rares
        sont les pays qui trouvent des sites tempérés si près des tropiques.

  - id: argentina-parral-name-001
    type: mcq
    deck: Argentina
    tags: [argentina, viticulture, training]
    status: reviewed
    source_id: c37-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the overhead pergola training long used in Argentina called locally?"
      choices:
        - { text: "Espaldero", correct: false }
        - { text: "Parral", correct: true }
        - { text: "Cabeza", correct: false }
        - { text: "Lira", correct: false }
      explanation: |
        The word means a vine arbour in Spanish. Espaldero is the local term for a
        vertical trellis, cabeza a head-trained bush vine and lira a lyre.
    fr:
      question: "Comment appelle-t-on localement la conduite en pergola haute longtemps utilisée en Argentine ?"
      choices:
        - { text: "Espaldero", correct: false }
        - { text: "Parral", correct: true }
        - { text: "Cabeza", correct: false }
        - { text: "Lira", correct: false }
      explanation: |
        Le mot désigne une treille en espagnol. L’espaldero est le terme local pour un
        palissage vertical, la cabeza une vigne en gobelet et la lira une conduite en
        lyre.

  - id: argentina-parral-shade-001
    type: mcq
    deck: Argentina
    tags: [argentina, viticulture, training, climate]
    status: reviewed
    source_id: c37-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why did overhead pergolas suit Argentina's hot traditional vineyards?"
      choices:
        - { text: "They exposed the bunches to more sun", correct: false }
        - { text: "They allowed harvesting by machine", correct: false }
        - { text: "They cut yields to concentrate flavour", correct: false }
        - { text: "They held bunches high and in shade", correct: true }
      explanation: |
        Bunches hang under a leafy roof, away from heat reflected off the ground.
        The large canopy also carries the big crops of fertile, irrigated soils,
        which suited the bulk-wine era.
    fr:
      question: "Pourquoi les pergolas hautes convenaient-elles aux vignobles traditionnels et chauds d’Argentine ?"
      choices:
        - { text: "Elles exposaient davantage les grappes au soleil", correct: false }
        - { text: "Elles permettaient la récolte mécanique", correct: false }
        - { text: "Elles limitaient les rendements pour concentrer les arômes", correct: false }
        - { text: "Elles tenaient les grappes en hauteur et à l’ombre", correct: true }
      explanation: |
        Les grappes pendent sous un toit de feuillage, loin de la chaleur réverbérée par
        le sol. La grande surface foliaire porte aussi les fortes récoltes des sols
        fertiles et irrigués, ce qui convenait à l’époque du vin en vrac.

  - id: argentina-parral-torrontes-001
    type: mcq
    deck: Argentina
    tags: [argentina, viticulture, training, torrontes]
    status: reviewed
    source_id: c37-0011
    review:
      fact_check: pass
      sources: [trade-press, producer-site]
    en:
      question: "For which grape is overhead parral training still widely used in Argentina?"
      choices:
        - { text: "Torrontés", correct: true }
        - { text: "Pinot Noir", correct: false }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        The leafy roof shields the bunches from fierce sun, which helps protect the
        delicate aromas and keeps bitterness in check. High-yielding pink Criolla
        grapes for everyday wine are also often grown this way.
    fr:
      question: "Pour quel cépage la conduite en parral (pergola haute) reste-t-elle très répandue en Argentine ?"
      choices:
        - { text: "Torrontés", correct: true }
        - { text: "Pinot Noir", correct: false }
        - { text: "Cabernet Sauvignon", correct: false }
        - { text: "Chardonnay", correct: false }
      explanation: |
        Le toit de feuillage protège les grappes d’un soleil brûlant, ce qui aide à
        préserver des arômes délicats et à limiter l’amertume. Les raisins roses de
        Criolla, très productifs et destinés au vin courant, sont aussi souvent conduits
        ainsi.

  - id: argentina-vsp-black-grapes-001
    type: mcq
    deck: Argentina
    tags: [argentina, viticulture, training]
    status: reviewed
    source_id: c37-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are many of Argentina's black grapes now trained?"
      choices:
        - { text: "As untrained free-standing bush vines", correct: false }
        - { text: "On vertical shoot-positioned trellises", correct: true }
        - { text: "On a Geneva double curtain", correct: false }
        - { text: "Under high overhead parral roofs", correct: false }
      explanation: |
        Vertical trellises make yield control and mechanisation easier. Growers still
        leave enough leaves above the bunches to shade them from strong sun.
    fr:
      question: "Comment conduit-on aujourd’hui une grande partie des cépages noirs argentins ?"
      choices:
        - { text: "En gobelet libre, sans aucun palissage", correct: false }
        - { text: "En palissage vertical des rameaux", correct: true }
        - { text: "En double rideau de type Geneva", correct: false }
        - { text: "Sous un parral (pergola haute)", correct: false }
      explanation: |
        Le palissage vertical facilite la maîtrise des rendements et la mécanisation.
        Les vignerons laissent toutefois assez de feuilles au-dessus des grappes pour
        les protéger du soleil intense.

  - id: argentina-rain-shadow-001
    type: mcq
    deck: Argentina
    tags: [argentina, climate, rainfall]
    status: reviewed
    source_id: c37-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the main reason rainfall is so low in most of Argentina's wine regions?"
      choices:
        - { text: "A cold ocean current along the nearby coast", correct: false }
        - { text: "Steady high pressure over the Atlantic", correct: false }
        - { text: "Dry winds blowing south from the Chaco", correct: false }
        - { text: "The rain shadow cast by the Andes", correct: true }
      explanation: |
        Moist Pacific air drops its rain and snow on the Chilean side. By the time it
        crosses the peaks it is dry, and Mendoza city sees only about 200 mm a year.
    fr:
      question: "Quelle est la principale raison de la faiblesse des pluies dans la plupart des régions viticoles argentines ?"
      choices:
        - { text: "Un courant océanique froid longeant la côte voisine", correct: false }
        - { text: "Des hautes pressions persistantes sur l’Atlantique", correct: false }
        - { text: "Des vents secs soufflant du Chaco vers le sud", correct: false }
        - { text: "L’ombre pluviométrique créée par les Andes", correct: true }
      explanation: |
        L’air humide venu du Pacifique décharge sa pluie et sa neige côté chilien. Une
        fois les sommets franchis, il est sec : la ville de Mendoza ne reçoit qu’environ
        200 mm par an.

  - id: argentina-flood-irrigation-001
    type: mcq
    deck: Argentina
    tags: [argentina, viticulture, irrigation]
    status: reviewed
    source_id: c37-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which irrigation method was traditionally widespread in Argentina's vineyards?"
      choices:
        - { text: "Drip lines fed by wells", correct: false }
        - { text: "Flooding rows from canals", correct: true }
        - { text: "Overhead sprinklers", correct: false }
        - { text: "Rainwater stored in tanks", correct: false }
      explanation: |
        Mendoza's canal network has roots in channels dug by the Huarpe people before
        the Spanish arrived. Flooding also makes life hard for phylloxera, one reason
        many old vines are ungrafted.
    fr:
      question: "Quelle méthode d’irrigation était traditionnellement répandue dans les vignobles argentins ?"
      choices:
        - { text: "Le goutte-à-goutte alimenté par des puits", correct: false }
        - { text: "La submersion des rangs depuis des canaux", correct: true }
        - { text: "L’aspersion par le haut", correct: false }
        - { text: "L’eau de pluie stockée en citernes", correct: false }
      explanation: |
        Le réseau de canaux de Mendoza remonte à des rigoles creusées par le peuple
        huarpe avant l’arrivée des Espagnols. La submersion gêne aussi le phylloxéra,
        l’une des raisons pour lesquelles beaucoup de vieilles vignes sont franches de
        pied.

  - id: argentina-aquifer-water-001
    type: mcq
    deck: Argentina
    tags: [argentina, viticulture, irrigation]
    status: reviewed
    source_id: c37-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides rivers running off the mountains, where does Argentina's vineyard irrigation water come from?"
      choices:
        - { text: "Rainwater held in farm ponds", correct: false }
        - { text: "Water piped from Patagonian lakes", correct: false }
        - { text: "Canals drawing on the Paraná River", correct: false }
        - { text: "Wells tapping underground aquifers", correct: true }
      explanation: |
        Pumping lets growers farm land beyond the canal network and top up supply in
        dry years. Over-pumping can raise the salt content of the groundwater.
    fr:
      question: "Outre les rivières descendant des montagnes, d’où vient l’eau d’irrigation des vignobles argentins ?"
      choices:
        - { text: "De l’eau de pluie retenue dans des bassins", correct: false }
        - { text: "De l’eau acheminée depuis des lacs de Patagonie", correct: false }
        - { text: "De canaux puisant dans le Paraná", correct: false }
        - { text: "De puits captant la nappe phréatique", correct: true }
      explanation: |
        Le pompage permet de cultiver des terres hors du réseau de canaux et de
        compléter l’apport les années sèches. Un pompage excessif peut accroître la
        salinité des eaux souterraines.

  - id: argentina-drip-irrigation-001
    type: mcq
    deck: Argentina
    tags: [argentina, viticulture, irrigation]
    status: reviewed
    source_id: c37-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do newer Argentine vineyards tend to use drip irrigation rather than flooding?"
      choices:
        - { text: "It uses scarce water more efficiently", correct: true }
        - { text: "It holds phylloxera back more effectively", correct: false }
        - { text: "It washes more salt out of the soil", correct: false }
        - { text: "It cools the canopy during heatwaves", correct: false }
      explanation: |
        Water goes only to the root zone and in measured doses. Drip lines can also
        carry nutrients, and they reach sloping or stony sites that flood channels
        cannot.
    fr:
      question: "Pourquoi les vignobles argentins récents privilégient-ils le goutte-à-goutte plutôt que la submersion ?"
      choices:
        - { text: "Il utilise mieux une eau rare", correct: true }
        - { text: "Il freine mieux le phylloxéra", correct: false }
        - { text: "Il lessive davantage le sel du sol", correct: false }
        - { text: "Il rafraîchit le feuillage en pleine canicule", correct: false }
      explanation: |
        L’eau ne va qu’à la zone racinaire, en doses mesurées. Les goutteurs peuvent
        aussi apporter des nutriments, et ils desservent des parcelles en pente ou
        caillouteuses que les rigoles de submersion ne peuvent atteindre.

  - id: argentina-spring-frost-001
    type: mcq
    deck: Argentina
    tags: [argentina, climate, hazards]
    status: reviewed
    source_id: c37-0017
    review:
      fact_check: pass
      sources: [known-fact, inv-anuario-cosecha-2023, decanter-argentina-harvest-2023]
    en:
      question: "Besides drought and summer hail, which seasonal hazard threatens Argentina's vineyards?"
      choices:
        - { text: "Waterlogged soils in winter", correct: false }
        - { text: "Spring frost", correct: true }
        - { text: "Midwinter freezes that kill vines", correct: false }
        - { text: "Long cloudy spells in summer", correct: false }
      explanation: |
        Clear, still nights let cold air pool on low ground just after budburst.
        Frosts in late 2022 were a major reason the 2023 harvest was one of the
        smallest on record.
    fr:
      question: "Outre la sécheresse et la grêle estivale, quel aléa saisonnier menace les vignobles argentins ?"
      choices:
        - { text: "Des sols gorgés d’eau en hiver", correct: false }
        - { text: "Les gelées de printemps", correct: true }
        - { text: "Des froids d’hiver qui tuent les ceps", correct: false }
        - { text: "De longues périodes nuageuses en été", correct: false }
      explanation: |
        Par nuits claires et sans vent, l’air froid s’accumule dans les bas-fonds juste
        après le débourrement. Les gelées de fin 2022 expliquent en grande partie
        pourquoi la vendange 2023 a été l’une des plus faibles jamais enregistrées.

  - id: argentina-mendoza-hail-001
    type: mcq
    deck: Argentina
    tags: [argentina, mendoza, climate, hazards]
    status: reviewed
    source_id: c37-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which Argentine province is summer hail an especially serious risk for vineyards?"
      choices:
        - { text: "Salta", correct: false }
        - { text: "Río Negro", correct: false }
        - { text: "Mendoza", correct: true }
        - { text: "La Rioja", correct: false }
      explanation: |
        Many growers there rank it as their worst seasonal hazard. Violent storms build
        over the foothills, and one cell can strip leaves and split berries on one
        estate while sparing the next.
    fr:
      question: "Dans quelle province argentine la grêle estivale est-elle un risque particulièrement grave pour les vignobles ?"
      choices:
        - { text: "Salta", correct: false }
        - { text: "Río Negro", correct: false }
        - { text: "Mendoza", correct: true }
        - { text: "La Rioja", correct: false }
      explanation: |
        Beaucoup de vignerons y voient le pire aléa de la saison. De violents orages se
        forment au-dessus des contreforts, et une seule cellule peut arracher les
        feuilles et fendre les baies d’un domaine tout en épargnant le voisin.

  - id: argentina-hail-netting-001
    type: mcq
    deck: Argentina
    tags: [argentina, viticulture, hazards]
    status: reviewed
    source_id: c37-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which protection do many Argentine growers install against summer hail?"
      choices:
        - { text: "Wind machines", correct: false }
        - { text: "Overhead sprinklers", correct: false }
        - { text: "Smudge pots between rows", correct: false }
        - { text: "Netting over the rows", correct: true }
      explanation: |
        The drawback is cost: the nets and their posts are expensive to buy, fit and
        maintain, so they are most common on premium sites.
