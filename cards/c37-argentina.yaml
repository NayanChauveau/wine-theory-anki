      choices:
        - { text: "Its high vineyard altitude", correct: false }
        - { text: "Its southerly latitude", correct: true }
        - { text: "Cold Atlantic currents offshore", correct: false }
        - { text: "Heavy cloud cover in summer", correct: false }
      explanation: |
        Its vineyards lie roughly 38–40° S, far south of Mendoza's 33° S. That
        latitude does the cooling work that altitude does further north.

