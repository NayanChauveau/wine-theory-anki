      sources: [known-fact]
    en:
      question: "What makes large-volume grape growing possible in Argentina's La Rioja province?"
      choices:
        - { text: "Irrigated vineyards on the flat valley floors", correct: true }
        - { text: "Reliable summer rainfall on the upper slopes", correct: false }
        - { text: "Cool Pacific air entering through mountain gaps", correct: false }
        - { text: "Deep clay terraces that store winter rain", correct: false }
      explanation: |
        Rainfall is far too low for dry farming, so meltwater channelled onto broad,
        level land supports high yields. The same hot, sunny floors favour volume
