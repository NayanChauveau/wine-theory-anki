cards:
  - id: vm-cordon-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c01-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the usual trade-off of cordon training?"
      choices:
        - { text: "It establishes in one season but hinders tractor work", correct: false }
        - { text: "The permanent arm aids machines but takes longer to form", correct: true }
        - { text: "It suits machines but cannot be spur-pruned", correct: false }
        - { text: "The fruiting arm is renewed each winter, adding pruning work", correct: false }
      explanation: |
        A cordon is a horizontal arm of old wood, usually carrying short spurs, so
        the bunches sit at one height along the row: easy ground for pre-pruners and
        harvesters. Building that arm takes a few extra seasons compared with head
        training. Renewing the fruiting wood every winter is the cane-pruning (Guyot)
        logic, not the cordon one.
    fr:
      question: "Quel est le compromis habituel de la conduite en cordon ?"
      choices:
        - { text: "Elle s’installe en une saison, mais gêne le passage du tracteur", correct: false }
        - { text: "Le bras permanent facilite la mécanisation, mais il est long à former", correct: true }
        - { text: "Elle se prête aux machines, mais exclut la taille en coursons", correct: false }
        - { text: "Le bras fructifère est renouvelé chaque hiver, ce qui alourdit la taille", correct: false }
      explanation: |
        Le cordon est un bras horizontal de vieux bois, en général taillé en
        coursons : les grappes se trouvent toutes à la même hauteur, ce qui facilite
        le travail des prétailleuses et des machines à vendanger. Former ce bras
        demande quelques saisons de plus qu’une formation en tête. Renouveler le bois
        fructifère chaque hiver relève de la taille longue (Guyot), pas du cordon.

  - id: vm-summer-pruning-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, canopy]
    status: reviewed
    source_id: c01-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In the vineyard, what is summer pruning mainly for?"
      choices:
        - { text: "Thickening the leaf wall so the vine makes more sugar", correct: false }
        - { text: "Trimming shoots and leaves so energy goes to the fruit", correct: true }
        - { text: "Shortening canes to set next year's bud count", correct: false }
        - { text: "Encouraging more bunches per shoot to raise yield", correct: false }
      explanation: |
        Hedging tops overlong shoots, and leaf removal opens the fruit zone to light
        and air. Both curb leafy growth that would otherwise compete with the bunches
        for the vine's sugars. The bud count is set in winter, on dormant wood.
    fr:
      question: "À quoi sert principalement la taille en vert dans le vignoble ?"
      choices:
        - { text: "Épaissir le feuillage pour que la vigne produise plus de sucre", correct: false }
        - { text: "Rogner et effeuiller pour orienter l’énergie vers les grappes", correct: true }
        - { text: "Raccourcir les bois pour fixer la charge de l’an prochain", correct: false }
        - { text: "Multiplier les grappes par rameau pour augmenter le rendement", correct: false }
      explanation: |
        Le rognage écime les rameaux trop longs, l’effeuillage ouvre la zone des
        grappes à la lumière et à l’air. Les deux freinent une végétation qui
        détournerait les sucres de la vigne au détriment des raisins. La charge en
        bourgeons se fixe l’hiver, à la taille, sur la vigne en repos.

  - id: vm-canopy-reasons-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, canopy]
    status: reviewed
    source_id: c01-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do growers manage the canopy of a vine?"
      choices:
        - { text: "To maximise leaf area so each vine carries a bigger crop", correct: false }
        - { text: "To manage sun on the fruit, airflow and machine access", correct: true }
        - { text: "To bring budburst forward by exposing the trunk to sun", correct: false }
        - { text: "To stop the roots competing with the cover crop", correct: false }
      explanation: |
        An open, well-placed leaf wall ripens the fruit, dries quickly after rain
        (less rot) and leaves a clear path for tractors and harvesters. More leaves
        do not mean more crop: a dense canopy shades the bunches and favours disease.
        Budburst depends on air and soil temperature, not on canopy work.
    fr:
      question: "Pourquoi le vigneron gère-t-il le feuillage de la vigne ?"
      choices:
        - { text: "Pour maximiser la surface foliaire afin que chaque cep porte plus", correct: false }
        - { text: "Pour ensoleiller les grappes, aérer et laisser passer les engins", correct: true }
        - { text: "Pour avancer le débourrement en exposant le tronc au soleil", correct: false }
        - { text: "Pour éviter que les racines concurrencent l’enherbement", correct: false }
      explanation: |
        Une haie foliaire ouverte et bien placée fait mûrir les raisins, sèche vite
        après la pluie (moins de pourriture) et laisse passer tracteurs et machines à
        vendanger. Plus de feuilles ne veut pas dire plus de récolte : un feuillage
        dense ombrage les grappes et favorise les maladies. La date de débourrement
        dépend de la température de l’air et du sol, pas du travail sur le
        feuillage.

  - id: vm-trellis-mechanisation-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, trellis]
    status: reviewed
    source_id: c01-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a trellis make machine work along a vine row easier?"
      choices:
        - { text: "It lets shoots sprawl freely, so rows can be planted closer", correct: false }
        - { text: "It holds foliage and fruit in predictable zones along the row", correct: true }
        - { text: "It removes the need for summer trimming, so machines pass less", correct: false }
        - { text: "It lifts the canopy into an overhead roof for harvesters to pass under", correct: false }
      explanation: |
        Wires keep the leaves in one plane and the bunches at a set height, so a
        trimmer, sprayer or harvester meets the same layout vine after vine. A
        trellised canopy still grows and still needs trimming. Overhead pergolas suit
        hand picking, not straddle harvesters.
    fr:
      question: "En quoi un palissage facilite-t-il le travail des machines dans le rang ?"
      choices:
        - { text: "Il laisse les rameaux retomber librement, d’où des rangs plus serrés", correct: false }
        - { text: "Il maintient feuilles et grappes dans des zones prévisibles du rang", correct: true }
        - { text: "Il dispense du rognage d’été, donc les machines passent moins souvent", correct: false }
        - { text: "Il forme un toit de feuillage sous lequel roulent les machines", correct: false }
      explanation: |
        Les fils tiennent les feuilles dans un même plan et les grappes à une
        hauteur fixe : rogneuse, pulvérisateur ou machine à vendanger retrouvent la
        même disposition d’un cep à l’autre. Une vigne palissée continue de pousser
        et doit être rognée. Les pergolas en hauteur conviennent à la vendange
        manuelle, pas aux machines enjambeuses.

  - id: vm-vsp-vs-bush-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c01-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a grower choose vertical shoot positioning (VSP) over bush vines?"
      choices:
        - { text: "VSP shades the fruit more than a bush in hot, sunny sites", correct: false }
        - { text: "VSP forms an upright wall machines can trim, spray, even pick", correct: true }
        - { text: "VSP needs no posts or wires, so it is cheaper to set up", correct: false }
        - { text: "VSP keeps the bunches closer to the heat of stony ground", correct: false }
      explanation: |
        VSP ties the shoots upward between wires into a narrow wall that a tractor
        can follow. Bush vines (gobelet in southern France and Beaujolais, old vines
        in Barossa) need no wires and shade their own fruit, but they are awkward for
        machines. They also carry their bunches lower, nearer the ground.
    fr:
      question: "Pourquoi un vigneron peut-il préférer un palissage vertical à une conduite en gobelet ?"
      choices:
        - { text: "Le palissage vertical ombrage mieux les grappes qu’un gobelet en site chaud et ensoleillé", correct: false }
        - { text: "Le palissage vertical forme une haie que les machines rognent, traitent, voire vendangent", correct: true }
        - { text: "Le palissage vertical se passe de piquets et de fils, il coûte moins cher", correct: false }
        - { text: "Le palissage vertical rapproche les grappes de la chaleur que renvoie un sol caillouteux", correct: false }
      explanation: |
        Le palissage vertical relève les rameaux entre des fils et forme une haie
        étroite que le tracteur peut suivre. Le gobelet (sud de la France, Beaujolais,
        vieilles vignes de la Barossa) se passe de fils et ombrage ses propres
        grappes, mais il se mécanise mal. Ses grappes sont d’ailleurs plus près du
        sol.

  - id: vm-green-harvest-timing-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, yield]
    status: reviewed
    source_id: c01-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why must a green harvest be timed with care?"
      choices:
        - { text: "Done too late, it lets the remaining berries swell and dilute", correct: false }
        - { text: "Done too early, it lets the remaining berries swell and dilute", correct: true }
        - { text: "Done at véraison, it sets off coulure in the remaining bunches", correct: false }
        - { text: "Done too late, it pushes the vine to set a second crop", correct: false }
      explanation: |
        Drop bunches soon after fruit set and the vine compensates: the remaining
        berries grow bigger, yield partly bounces back and flavour is diluted. Around
        véraison, berry size is largely settled, so thinning then really concentrates
        the crop. Coulure happens at flowering, well before any green harvest.
    fr:
      question: "Pourquoi le moment d’une vendange en vert doit-il être bien choisi ?"
      choices:
        - { text: "Faite trop tard, elle laisse grossir les baies restantes et dilue le vin", correct: false }
        - { text: "Faite trop tôt, elle laisse grossir les baies restantes et dilue le vin", correct: true }
        - { text: "Faite à la véraison, elle provoque la coulure des grappes restantes", correct: false }
        - { text: "Faite trop tard, elle pousse la vigne à donner une seconde récolte", correct: false }
      explanation: |
        Si l’on fait tomber des grappes peu après la nouaison, la vigne compense :
        les baies restantes grossissent, le rendement remonte en partie et le vin
        perd en concentration. Vers la véraison, la taille des baies est en grande
        partie fixée et l’éclaircissage concentre vraiment la récolte. La coulure
        survient à la floraison, bien avant toute vendange en vert.

  - id: vm-trellis-parts-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, trellis]
    status: reviewed
    source_id: c04-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does a simple vineyard trellis consist of?"
      choices:
        - { text: "A single wooden stake driven beside each vine", correct: false }
        - { text: "Posts linked by horizontal wires", correct: true }
        - { text: "An overhead pergola of wooden beams", correct: false }
        - { text: "Netting stretched over the vines from budburst", correct: false }
      explanation: |
        Canes and shoots are tied to the wires so the canopy can be positioned,
        trimmed and worked by machine. A single stake per vine, as on steep Mosel
        slopes or in Côte-Rôtie, supports the plant without forming a wire wall.
        A pergola is a high, roof-like structure rather than a simple post-and-wire
        row. Netting is put up against birds as harvest nears.
    fr:
      question: "En quoi consiste un palissage simple dans une vigne ?"
      choices:
        - { text: "Un seul échalas planté à côté de chaque cep", correct: false }
        - { text: "Des piquets reliés par des fils horizontaux", correct: true }
        - { text: "Une pergola de poutres en hauteur", correct: false }
        - { text: "Un filet tendu sur les vignes dès le débourrement", correct: false }
      explanation: |
        On attache bois et rameaux aux fils pour positionner le feuillage, le
        rogner et le travailler à la machine. L’échalas individuel, comme sur les
        pentes de la Moselle ou à Côte-Rôtie, soutient le cep sans former de haie
        palissée. La pergola forme un toit haut, bien loin d’un simple rang de
        piquets et de fils. Les filets se posent contre les oiseaux à l’approche
        des vendanges.

  - id: vm-site-env-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When choosing a vineyard site, which group of factors decides whether vines can grow and ripen there?"
      choices:
        - { text: "Business considerations", correct: false }
        - { text: "Environmental conditions", correct: true }
        - { text: "Planting regulations", correct: false }
        - { text: "Access and infrastructure", correct: false }
      explanation: |
        Climate and soil set the biological limits: without enough warmth, sun,
        water and a workable soil, no business plan can rescue the site. The
        commercial case and the choice of grape are weighed separately.
    fr:
      question: "Lors du choix d’un site viticole, quel ensemble de facteurs détermine si la vigne peut y pousser et mûrir ?"
      choices:
        - { text: "Les considérations économiques", correct: false }
        - { text: "Les conditions environnementales", correct: true }
        - { text: "La réglementation des plantations", correct: false }
        - { text: "L’accès et les infrastructures", correct: false }
      explanation: |
        Le climat et le sol fixent les limites biologiques : sans assez de
        chaleur, de soleil, d’eau et un sol favorable, aucun plan d’affaires ne
        sauvera le site. L’aspect commercial et le choix du cépage se jugent à
        part.

  - id: vm-site-business-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When choosing a vineyard site, which group of factors covers labour, access and the cost of land?"
      choices:
        - { text: "Environmental conditions", correct: false }
        - { text: "Business considerations", correct: true }
        - { text: "Grape-variety suitability", correct: false }
        - { text: "Planting regulations", correct: false }
      explanation: |
        These are the commercial checks. A site may grow fine grapes yet fail if
        nobody can work it, machines cannot reach it, there is no water or power, or
        the land price can never be repaid, as in parts of Napa Valley.
    fr:
      question: "Lors du choix d’un site viticole, quel ensemble de facteurs couvre la main-d’œuvre, l’accès et le prix du foncier ?"
      choices:
        - { text: "Les conditions environnementales", correct: false }
        - { text: "Les considérations économiques", correct: true }
        - { text: "L’adaptation du cépage", correct: false }
        - { text: "La réglementation des plantations", correct: false }
      explanation: |
        Ce sont les critères commerciaux. Un site peut donner de beaux raisins et
        échouer quand même si personne ne peut y travailler, si les machines n’y
        accèdent pas, s’il manque l’eau ou l’électricité, ou si le prix de la terre
        ne pourra jamais être remboursé, comme dans certaines parties de la Napa
        Valley.

  - id: vm-site-variety-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When choosing a vineyard site, which group of factors covers ripening fit, market demand and planting rules?"
      choices:
        - { text: "Environmental conditions", correct: false }
        - { text: "Grape variety", correct: true }
        - { text: "Business considerations", correct: false }
        - { text: "Soil and drainage", correct: false }
      explanation: |
        All three checks concern the grape itself: will it ripen in that climate,
        will anyone buy its wine, and may it legally be planted there? A grape that
        ripens perfectly can still fail on demand or on appellation rules.
    fr:
      question: "Lors du choix d’un site viticole, quel ensemble de facteurs regroupe l’aptitude à mûrir, la demande et les règles de plantation ?"
      choices:
        - { text: "Les conditions environnementales", correct: false }
        - { text: "Le choix du cépage", correct: true }
        - { text: "Les considérations économiques", correct: false }
        - { text: "Le sol et le drainage", correct: false }
      explanation: |
        Ces trois critères portent sur le cépage lui-même : mûrira-t-il sous ce
        climat, son vin trouvera-t-il preneur, a-t-on le droit de le planter là ? Un
        cépage qui mûrit parfaitement peut encore échouer faute de demande ou à cause
        des règles d’appellation.

  - id: vm-site-env-climate-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When assessing a new vineyard site, which trio of long-run climate averages do growers check?"
      choices:
        - { text: "Altitude, slope gradient and aspect", correct: false }
        - { text: "Temperature, rainfall and sunlight", correct: true }
        - { text: "Soil depth, stone cover and soil pH", correct: false }
        - { text: "Vine age, row direction and row spacing", correct: false }
      explanation: |
        Warmth, water and light decide how the vine grows and whether the fruit
        ripens; growers look at averages over many years, not one vintage.
        Altitude and aspect change how much heat and light a slope receives, but
        they are site features, not the climate measurements themselves.
    fr:
      question: "Pour évaluer un nouveau site viticole, quel trio de moyennes climatiques sur longue période examine-t-on ?"
      choices:
        - { text: "Altitude, degré de pente et exposition", correct: false }
        - { text: "Températures, précipitations et ensoleillement", correct: true }
        - { text: "Profondeur du sol, pierrosité et pH du sol", correct: false }
        - { text: "Âge des vignes, orientation et écartement des rangs", correct: false }
      explanation: |
        La chaleur, l’eau et la lumière décident de la croissance de la vigne et
        de la maturité du raisin ; on regarde des moyennes sur de nombreuses
        années, pas un seul millésime. L’altitude et l’exposition modifient la
        chaleur et la lumière reçues par un coteau, mais ce sont des traits du
        site, pas les mesures climatiques elles-mêmes.

  - id: vm-site-env-soil-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Alongside temperature, rainfall and sunlight, which two soil properties does a grower assess first on a new site?"
      choices:
        - { text: "Heat retention and reflectivity", correct: false }
        - { text: "Fertility and drainage", correct: true }
        - { text: "Parent rock and geological age", correct: false }
        - { text: "Surface colour and fossil content", correct: false }
      explanation: |
        Soil completes the picture: a very fertile one pushes excess vigour, a
        poor one may starve the vine, and a waterlogged one chokes the roots.
        Heat retention, colour or rock type can shape style at the margin, and
        fossils say little on their own; the first screen is how much water
        (drainage) and nutrients (fertility) the vine will get.
    fr:
      question: "En plus des températures, des précipitations et de l’ensoleillement, quelles deux propriétés du sol évalue-t-on d’abord sur une nouvelle parcelle ?"
      choices:
        - { text: "Rétention de chaleur et réflexion de la lumière", correct: false }
        - { text: "Fertilité et drainage", correct: true }
        - { text: "Roche-mère et âge géologique", correct: false }
        - { text: "Couleur en surface et teneur en fossiles", correct: false }
      explanation: |
        Le sol complète le tableau : trop fertile, il pousse à une vigueur
        excessive ; trop pauvre, il affame la vigne ; gorgé d’eau, il asphyxie les
        racines. Chaleur restituée, couleur ou roche-mère peuvent nuancer le
        style, et les fossiles en disent peu à eux seuls : le premier tri porte
        sur l’eau (drainage) et les éléments nutritifs (fertilité) dont la
        vigne disposera.

  - id: vm-site-utilities-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides labour and land cost, what else does the business checklist ask about a new vineyard site?"
      choices:
        - { text: "Soil fertility and drainage", correct: false }
        - { text: "Power, water and machine access", correct: true }
        - { text: "Mean summer temperature and hours of sun", correct: false }
        - { text: "Buyer demand and permitted varieties", correct: false }
      explanation: |
        A remote slope with no track, no electricity and no water supply is costly
        to farm, even with an ideal climate. Fertility, drainage, heat and sun are
        environmental factors; demand and permitted varieties belong to the
        grape-variety question.
    fr:
      question: "Outre la main-d’œuvre et le prix du foncier, que vérifie-t-on encore côté économique pour un nouveau site viticole ?"
      choices:
        - { text: "La fertilité et le drainage du sol", correct: false }
        - { text: "L’électricité, l’eau et l’accès des machines", correct: true }
        - { text: "La température estivale moyenne et l’ensoleillement", correct: false }
        - { text: "La demande et les cépages autorisés", correct: false }
      explanation: |
        Un coteau isolé, sans chemin, sans électricité ni arrivée d’eau, coûte
        cher à exploiter, même sous un climat idéal. Fertilité, drainage, chaleur et
        soleil sont des facteurs environnementaux ; demande et cépages autorisés
        relèvent du choix du cépage.

  - id: vm-site-land-labour-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides power, water and machine access, which business checks decide whether a new vineyard site is viable?"
      choices:
        - { text: "Soil drainage and fertility", correct: false }
        - { text: "Available labour and the cost of land", correct: true }
        - { text: "Whether the grape is permitted locally", correct: false }
        - { text: "Rainfall and hours of sunshine", correct: false }
      explanation: |
        A site needs people to prune and pick, and land that can be paid for.
        Prices in Napa Valley or the Côte d'Or make a purchase hard to repay; a
        remote area with no pickers raises running costs. Drainage and rainfall are
        environmental; permitted grapes are a variety question.
    fr:
      question: "Outre l’électricité, l’eau et l’accès des machines, quels critères économiques décident de la viabilité d’un nouveau site viticole ?"
      choices:
        - { text: "Le drainage et la fertilité du sol", correct: false }
        - { text: "La main-d’œuvre et le prix du foncier", correct: true }
        - { text: "L’autorisation du cépage sur place", correct: false }
        - { text: "Les précipitations et l’ensoleillement", correct: false }
      explanation: |
        Il faut des bras pour tailler et vendanger, et une terre que l’on peut
        payer. Les prix de la Napa Valley ou de la Côte-d’Or rendent un achat
        difficile à rentabiliser ; une zone isolée sans vendangeurs alourdit les
        coûts. Drainage et pluie sont environnementaux ; les cépages autorisés
        relèvent du choix du cépage.

  - id: vm-variety-climate-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Before a grape variety is planted on a new site, what must be true of it in relation to the local climate?"
      choices:
        - { text: "It must be native to that region", correct: false }
        - { text: "It must be able to ripen there", correct: true }
        - { text: "It must be the earliest ripener available", correct: false }
        - { text: "It must already grow on neighbouring estates", correct: false }
      explanation: |
        Riesling ripens on cool Mosel slopes where a late variety such as Cabernet
        Sauvignon usually would not. Native origin is not required: Chardonnay and
        Cabernet thrive far from France. Demand and planting rules are separate
        checks.
    fr:
      question: "Avant de planter un cépage sur un nouveau site, quelle condition doit-il remplir face au climat local ?"
      choices:
        - { text: "Être originaire de la région", correct: false }
        - { text: "Pouvoir y arriver à maturité", correct: true }
        - { text: "Être le plus précoce disponible", correct: false }
        - { text: "Être déjà cultivé chez les voisins", correct: false }
      explanation: |
        Le Riesling mûrit sur les coteaux frais de la Moselle, là où un cépage
        tardif comme le Cabernet Sauvignon ne parviendrait généralement pas à mûrir. Être
        autochtone n’est pas exigé : Chardonnay et Cabernet réussissent loin de la
        France. La demande et les règles de plantation sont des questions à part.

  - id: vm-variety-demand-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides climate fit and planting rules, what else must hold before a grape variety is planted on a new site?"
      choices:
        - { text: "It must yield more than the regional average", correct: false }
        - { text: "There must be demand for its wine", correct: true }
        - { text: "It must resist phylloxera on its own roots", correct: false }
        - { text: "It must suit machine harvesting", correct: false }
      explanation: |
        A variety that ripens well but finds no buyers is a commercial failure;
        many vineyards have been replanted or grafted over when a grape went out of
        fashion. Phylloxera resistance comes from the rootstock, not from the fruiting
        variety.
    fr:
      question: "Outre l’adaptation au climat et les règles de plantation, quelle autre condition faut-il réunir avant de planter un cépage sur un nouveau site ?"
      choices:
        - { text: "Un rendement supérieur à la moyenne régionale", correct: false }
        - { text: "Une demande pour son vin", correct: true }
        - { text: "Une résistance au phylloxéra sans porte-greffe", correct: false }
        - { text: "Une aptitude à la vendange mécanique", correct: false }
      explanation: |
        Un cépage qui mûrit bien mais ne trouve pas d’acheteurs est un échec
        commercial ; bien des vignes ont été arrachées ou surgreffées quand un
        cépage passait de mode. La résistance au phylloxéra vient du porte-greffe,
        pas du cépage.

  - id: vm-variety-legal-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides climate and demand, which legal issue can stop a grape variety being planted on a site?"
      choices:
        - { text: "Limits on irrigating bearing vines", correct: false }
        - { text: "Rules on which varieties may be planted", correct: true }
        - { text: "Minimum oak-ageing rules for the wine", correct: false }
        - { text: "Labelling rules for vintage dates", correct: false }
      explanation: |
        Appellation rules list the permitted grapes. Cabernet Sauvignon planted in
        Burgundy, for example, could not be sold under a Bourgogne appellation.
        Irrigation and ageing rules shape how a wine is made, not which grape goes
        into it.
    fr:
      question: "Outre le climat et la demande, quelle contrainte légale peut empêcher de planter un cépage sur un site ?"
      choices:
        - { text: "Les limites d’irrigation des vignes en production", correct: false }
        - { text: "Les règles fixant les cépages autorisés", correct: true }
        - { text: "Les durées minimales d’élevage en fût", correct: false }
        - { text: "Les règles d’étiquetage du millésime", correct: false }
      explanation: |
        Les cahiers des charges d’appellation listent les cépages autorisés : un
        Cabernet Sauvignon planté en Bourgogne, par exemple, ne pourrait pas être
        vendu sous une appellation bourguignonne. Irrigation et élevage encadrent la
        façon de faire le vin, pas le cépage qui le compose.

  - id: vm-prep-clear-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting]
    status: reviewed
    source_id: c06-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When a new vineyard is prepared, what is the first job on the land?"
      choices:
        - { text: "Sowing a cover crop between the future rows", correct: false }
        - { text: "Clearing the existing vegetation", correct: true }
        - { text: "Putting up posts and wires", correct: false }
        - { text: "Planting the young vines", correct: false }
      explanation: |
        Scrub, trees and old roots compete with young vines and can harbour pests
        or root rots, so the ground is cleared first. Soil tests and any fertiliser
        follow, then planting, then posts and wires as the vines grow.
    fr:
      question: "Lors de la préparation d’une nouvelle vigne, quel est le premier travail sur le terrain ?"
      choices:
        - { text: "Semer un enherbement entre les futurs rangs", correct: false }
        - { text: "Défricher la végétation existante", correct: true }
        - { text: "Poser les piquets et les fils", correct: false }
        - { text: "Planter les jeunes plants", correct: false }
      explanation: |
        Broussailles, arbres et vieilles racines concurrencent les jeunes vignes
        et peuvent héberger ravageurs ou pourridiés : on défriche donc d’abord.
        Viennent ensuite l’analyse du sol et les éventuels amendements, la
        plantation, puis les piquets et les fils à mesure que la vigne pousse.

  - id: vm-prep-fertility-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting]
    status: reviewed
    source_id: c06-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Once the ground is cleared, what fertility work usually comes before planting a vineyard?"
      choices:
        - { text: "Stripping topsoil to lower future vigour", correct: false }
        - { text: "Soil testing, then fertiliser if needed", correct: true }
        - { text: "Fumigating the soil to add nitrogen", correct: false }
        - { text: "A heavy nitrogen dose to boost growth", correct: false }
      explanation: |
        Correcting a deficiency before planting is far easier than later, once the
        roots are in place. Fumigation, where it is used, targets nematodes and soil
        pests; it adds no nutrients. Too much nitrogen gives excess vigour and a
        shaded, rot-prone canopy.
    fr:
      question: "Une fois le terrain défriché, quel travail sur la fertilité précède en général la plantation ?"
      choices:
        - { text: "Décaper la terre végétale pour limiter la vigueur", correct: false }
        - { text: "Analyser le sol, puis amender si besoin", correct: true }
        - { text: "Fumiger le sol pour l’enrichir en azote", correct: false }
        - { text: "Un apport massif d’azote pour doper la pousse", correct: false }
      explanation: |
        Corriger une carence avant la plantation est bien plus simple qu’après,
        une fois les racines en place. La fumigation, là où elle se pratique, vise
        les nématodes et les ravageurs du sol ; elle n’apporte aucun élément
        nutritif. Trop d’azote donne une vigueur excessive et un feuillage dense,
        propice à la pourriture.

  - id: vm-prep-plant-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting]
    status: reviewed
    source_id: c06-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are young vines usually planted in a new vineyard?"
      choices:
        - { text: "By sowing grape seeds in the row", correct: false }
        - { text: "By hand or by machine", correct: true }
        - { text: "By layering canes from neighbouring vines", correct: false }
        - { text: "By transplanting mature vines from an old block", correct: false }
      explanation: |
        Nursery plants, usually grafted onto a rootstock, are set at the planned
        spacing; a GPS-guided planting machine covers large blocks quickly. A seed
        does not reproduce the variety true to type, and layering was mainly used to
        fill gaps in old, ungrafted vineyards.
    fr:
      question: "Comment plante-t-on en général les jeunes vignes d’une nouvelle parcelle ?"
      choices:
        - { text: "En semant des pépins dans le rang", correct: false }
        - { text: "À la main ou à la machine", correct: true }
        - { text: "Par provignage à partir des ceps voisins", correct: false }
        - { text: "En transplantant des ceps adultes d’une vieille parcelle", correct: false }
      explanation: |
        Des plants de pépinière, en général greffés sur porte-greffe, sont mis en
        place à l’écartement prévu ; une planteuse guidée par GPS couvre vite de
        grandes surfaces. Un pépin ne reproduit pas fidèlement le cépage, et le
        provignage servait surtout à remplacer les manquants dans les vieilles
        vignes franches de pied.

  - id: vm-prep-sleeves-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting]
    status: reviewed
    source_id: c06-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are newly planted vines commonly protected from animals such as rabbits?"
      choices:
        - { text: "By hilling soil over the stems all season", correct: false }
        - { text: "With plastic sleeves around the young stems", correct: true }
        - { text: "By spraying copper on the young shoots", correct: false }
        - { text: "With bird netting over the row until the first crop", correct: false }
      explanation: |
        Grow tubes stop browsers nibbling the tender shoot and act as a small
        greenhouse that speeds early growth. Hilling up soil shields the graft from
        winter cold, copper targets downy mildew, and netting keeps birds off ripe
        fruit.
    fr:
      question: "Comment protège-t-on couramment les jeunes plantations contre des animaux comme les lapins ?"
      choices:
        - { text: "En buttant les ceps tout au long de la saison", correct: false }
        - { text: "Avec des manchons en plastique autour des jeunes plants", correct: true }
        - { text: "En pulvérisant du cuivre sur les jeunes pousses", correct: false }
        - { text: "Avec des filets anti-oiseaux jusqu’à la première récolte", correct: false }
      explanation: |
        Les manchons de protection empêchent lapins et chevreuils de brouter la
        jeune pousse et font office de mini-serre qui accélère la croissance. Le
        buttage protège le point de greffe du froid hivernal, le cuivre cible le
        mildiou, et les filets éloignent les oiseaux des raisins mûrs.

  - id: vm-prep-irrigate-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting]
    status: reviewed
    source_id: c06-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where vineyard irrigation is restricted, why is it often still allowed for newly planted vines?"
      choices:
        - { text: "To bring the first crop forward to year one", correct: false }
        - { text: "To help the young roots establish", correct: true }
        - { text: "To keep the soil cool for an earlier budburst", correct: false }
        - { text: "To dilute excess nitrogen after soil preparation", correct: false }
      explanation: |
        A young root system is shallow and suffers quickly in drought. Many
        European appellations that limit watering of bearing vines allow it in the
        first seasons so the planting takes. Cooler soil would delay budburst, not
        advance it.
    fr:
      question: "Là où l’irrigation des vignes est limitée, pourquoi reste-t-elle souvent permise sur les jeunes plantations ?"
      choices:
        - { text: "Pour obtenir une récolte dès l’année de plantation", correct: false }
        - { text: "Pour aider les jeunes racines à s’installer", correct: true }
        - { text: "Pour rafraîchir le sol et avancer le débourrement", correct: false }
        - { text: "Pour diluer l’excès d’azote après la préparation du sol", correct: false }
      explanation: |
        Les racines d’une jeune vigne sont peu profondes et souffrent vite de la
        sécheresse. Bien des appellations européennes qui encadrent l’arrosage des
        vignes en production le tolèrent les premières années pour assurer la
        reprise. Un sol plus frais retarderait le débourrement au lieu de
        l’avancer.

  - id: vm-first-crop-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting]
    status: reviewed
    source_id: c06-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which year after planting does a vine usually give its first commercial crop?"
      choices:
        - { text: "The first year", correct: false }
        - { text: "The third year", correct: true }
        - { text: "The second year", correct: false }
        - { text: "The fifth year", correct: false }
      explanation: |
        The first two seasons build roots and a trunk; a small crop is sometimes
        taken in year two, but year three is the first harvest a grower budgets for.
        French appellation rules, for instance, do not accept fruit from vines before
        their third leaf.
    fr:
      question: "En quelle année après la plantation une vigne donne-t-elle en général sa première vraie récolte ?"
      choices:
        - { text: "La première année", correct: false }
        - { text: "La troisième année", correct: true }
        - { text: "La deuxième année", correct: false }
        - { text: "La cinquième année", correct: false }
      explanation: |
        Les deux premières saisons servent à installer les racines et le tronc ;
        on prélève parfois une petite récolte la deuxième année, mais la troisième
        est la première sur laquelle le vigneron compte. En France, les AOC
        n’acceptent d’ailleurs pas le raisin des vignes avant leur troisième
        feuille.

  - id: vm-replant-age-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting]
    status: reviewed
    source_id: c06-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At roughly what age are commercial vines usually pulled out and replanted?"
      choices:
        - { text: "5 to 10 years", correct: false }
        - { text: "30 to 50 years", correct: true }
        - { text: "70 to 90 years", correct: false }
        - { text: "100 to 120 years", correct: false }
      explanation: |
        By then yields have fallen and viruses or trunk diseases have often
        weakened the block. Celebrated old vines in Barossa or Priorat are kept far
        longer on purpose, for their concentrated fruit.
    fr:
      question: "Vers quel âge arrache-t-on et replante-t-on habituellement une vigne commerciale ?"
      choices:
        - { text: "Entre 5 et 10 ans", correct: false }
        - { text: "Entre 30 et 50 ans", correct: true }
        - { text: "Entre 70 et 90 ans", correct: false }
        - { text: "Entre 100 et 120 ans", correct: false }
      explanation: |
        À cet âge, les rendements ont baissé et les viroses ou maladies du bois
        ont souvent affaibli la parcelle. Les vieilles vignes célèbres de la Barossa
        ou du Priorat sont gardées bien plus longtemps, à dessein, pour la
        concentration de leurs raisins.

  - id: vm-old-vine-flavour-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, yield]
    status: reviewed
    source_id: c06-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do many growers value a block of old vines?"
      choices:
        - { text: "They give bigger crops than young vines", correct: false }
        - { text: "Their fruit is often more concentrated in flavour", correct: true }
        - { text: "They resist disease better than young vines", correct: false }
        - { text: "Their fruit ripens weeks earlier than young vines", correct: false }
      explanation: |
        Old vines carry small crops on a deep, settled root system, which tends to
        give more intense fruit. Hence "vieilles vignes" or "old vine" on labels,
        although the term is unregulated in most countries.
    fr:
      question: "Pourquoi de nombreux vignerons tiennent-ils à une parcelle de vieilles vignes ?"
      choices:
        - { text: "Elles produisent davantage que de jeunes vignes", correct: false }
        - { text: "Leurs raisins sont souvent plus concentrés en arômes", correct: true }
        - { text: "Elles résistent mieux aux maladies que de jeunes vignes", correct: false }
        - { text: "Leurs raisins mûrissent des semaines plus tôt", correct: false }
      explanation: |
        Les vieilles vignes portent de petites récoltes sur un système racinaire
        profond et bien installé, ce qui donne en général des raisins plus intenses.
        D’où la mention « vieilles vignes » sur les étiquettes, même si elle n’est
        pas réglementée dans la plupart des pays.

  - id: vm-old-vine-downside-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, yield]
    status: reviewed
    source_id: c06-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What are the usual drawbacks of keeping very old vines?"
      choices:
        - { text: "Thinner, less concentrated fruit", correct: false }
        - { text: "Smaller crops and greater disease risk", correct: true }
        - { text: "Excess vigour that shades the fruit", correct: false }
        - { text: "Bigger crops that are slow to ripen", correct: false }
      explanation: |
        Ageing wood accumulates viruses and trunk diseases, and yields drift down
        until the block barely pays. Estates weigh that against old-vine
        concentration when deciding to replant. Vigour falls with age; it does not
        rise.
    fr:
      question: "Quels sont les inconvénients habituels des très vieilles vignes ?"
      choices:
        - { text: "Des raisins plus dilués, moins concentrés", correct: false }
        - { text: "Des récoltes plus faibles et plus de maladies", correct: true }
        - { text: "Une vigueur excessive qui ombrage les grappes", correct: false }
        - { text: "De grosses récoltes qui mûrissent lentement", correct: false }
      explanation: |
        Le vieux bois accumule viroses et maladies du bois, et les rendements
        baissent jusqu’à rendre la parcelle peu rentable. Les domaines mettent cela
        en balance avec la concentration des vieilles vignes au moment de replanter.
        La vigueur diminue avec l’âge, elle n’augmente pas.

  - id: vm-fallow-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting]
    status: reviewed
    source_id: c06-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "After old vines are grubbed up, how long is the ground typically rested before replanting?"
      choices:
        - { text: "A few weeks", correct: false }
        - { text: "Three years or more", correct: true }
        - { text: "About six months", correct: false }
        - { text: "At least twenty years", correct: false }
      explanation: |
        The rest lets the soil recover and breaks the cycle of nematodes and
        diseases left in old roots, including viruses such as fanleaf that nematodes
        pass on to new vines.
    fr:
      question: "Après l’arrachage de vieilles vignes, combien de temps laisse-t-on généralement le sol au repos avant de replanter ?"
      choices:
        - { text: "Quelques semaines", correct: false }
        - { text: "Trois ans ou plus", correct: true }
        - { text: "Environ six mois", correct: false }
        - { text: "Au moins vingt ans", correct: false }
      explanation: |
        Ce repos permet au sol de se reconstituer et rompt le cycle des nématodes
        et des maladies restés dans les vieilles racines, dont des viroses comme le
        court-noué, que les nématodes transmettent aux jeunes plants.

  - id: vm-manage-four-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which four techniques set the shape, crop and spacing of vines in a vineyard?"
      choices:
        - { text: "Irrigation, fertilising, spraying and harvesting", correct: false }
        - { text: "Training, pruning, trellising and planting density", correct: true }
        - { text: "Clone, rootstock, variety and grafting", correct: false }
        - { text: "Mulching, cover crops, tillage and drainage", correct: false }
      explanation: |
        Training fixes the permanent wood, pruning sets the buds and so the crop,
        trellising positions the canopy, and density decides how much space each vine
        has. Irrigation and feeding influence vigour but do not shape the vine.
    fr:
      question: "Quelles quatre techniques fixent la forme, la charge et l’espacement des ceps dans une vigne ?"
      choices:
        - { text: "Irrigation, fertilisation, traitements et vendange", correct: false }
        - { text: "Formation, taille, palissage et densité de plantation", correct: true }
        - { text: "Clone, porte-greffe, cépage et greffage", correct: false }
        - { text: "Paillage, enherbement, travail du sol et drainage", correct: false }
      explanation: |
        La formation fixe le bois permanent, la taille détermine le nombre de
        bourgeons et donc la récolte, le palissage positionne le feuillage, et la
        densité règle l’espace dont dispose chaque cep. Irrigation et fertilisation
        jouent sur la vigueur mais ne donnent pas sa forme à la vigne.

  - id: vm-adapt-resources-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Growers adapt training, pruning, trellising and planting density to the supply of which resources?"
      choices:
        - { text: "Slope, aspect, altitude and wind", correct: false }
        - { text: "Temperature, sunlight, water and nutrients", correct: true }
        - { text: "Rootstock, clone, variety and vine age", correct: false }
        - { text: "Sugar, acid, tannin and colour", correct: false }
      explanation: |
        A hot, dry, poor site may suit low bush vines with few buds, while a
        fertile, well-watered one needs a larger trellis to spread vigorous growth.
        Slope, aspect and altitude change how much heat and light reach the vines,
        but they are features of the site, not resources the vine draws on.
    fr:
      question: "Le vigneron adapte le mode de conduite, la taille, le palissage et la densité de plantation à la disponibilité de quelles ressources ?"
      choices:
        - { text: "Pente, exposition, altitude et vent", correct: false }
        - { text: "Chaleur, lumière, eau et éléments nutritifs", correct: true }
        - { text: "Porte-greffe, clone, cépage et âge des vignes", correct: false }
        - { text: "Sucre, acidité, tanins et couleur", correct: false }
      explanation: |
        Un site chaud, sec et pauvre peut convenir à des gobelets bas portant peu
        de bourgeons, tandis qu’un sol fertile et bien arrosé exige un palissage plus
        ample pour étaler une végétation vigoureuse. Pente, exposition et altitude
        modulent la chaleur et la lumière reçues, mais ce sont des traits du site,
        pas des ressources dont la vigne se nourrit.

  - id: vm-machinery-plan-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, site]
    status: reviewed
    source_id: c06-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Besides heat, light, water and nutrients, which practical question often shapes how a new vineyard is laid out?"
      choices:
        - { text: "Which clone of the variety is planted", correct: false }
        - { text: "Whether machinery will be used", correct: true }
        - { text: "When the grapes are due to be picked", correct: false }
        - { text: "Whether grapes are hand-sorted at the winery", correct: false }
      explanation: |
        Tractors and harvesters need wide enough rows, a fruit zone at a workable
        height and usually a trellis. Steep, hand-worked slopes such as the Mosel or
        Côte-Rôtie can keep vines tightly packed. Clone, picking date and sorting
        matter for quality, but none of them fixes row width or trellis height.
    fr:
      question: "Outre la chaleur, la lumière, l’eau et les éléments nutritifs, quelle question pratique conditionne souvent l’implantation d’une nouvelle vigne ?"
      choices:
        - { text: "Le clone retenu pour le cépage", correct: false }
        - { text: "Le recours ou non à la mécanisation", correct: true }
        - { text: "La date de vendange prévue", correct: false }
        - { text: "Le tri manuel des raisins au chai", correct: false }
      explanation: |
        Tracteurs et machines à vendanger demandent des rangs assez larges, une
        zone des grappes à bonne hauteur et en général un palissage. Les coteaux
        pentus travaillés à la main, en Moselle ou à Côte-Rôtie, peuvent garder des
        ceps très serrés. Le clone, la date de vendange et le tri comptent pour la
        qualité, mais aucun ne fixe la largeur des rangs ni la hauteur du palissage.

  - id: vm-grower-goal-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard]
    status: reviewed
    source_id: c06-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is a grower's usual aim in the vineyard?"
      choices:
        - { text: "Higher yields each year to cut the cost per bottle", correct: false }
        - { text: "The most fruit at the target quality, at a viable cost", correct: true }
        - { text: "Low yields, as quality outweighs cost", correct: false }
        - { text: "Fruit picked as ripe as the weather allows", correct: false }
      explanation: |
        Yield, quality and cost are balanced rather than pushed one at a time.
        Chasing volume dilutes the fruit and misses the quality target; cutting
        yields hard or waiting for peak ripeness can cost more than the wine earns.
    fr:
      question: "Quel est l’objectif habituel du vigneron à la vigne ?"
      choices:
        - { text: "Des rendements en hausse pour réduire le coût par bouteille", correct: false }
        - { text: "Un maximum de raisin à la qualité visée, à coût viable", correct: true }
        - { text: "Des rendements bas, la qualité primant sur le coût", correct: false }
        - { text: "Des raisins cueillis aussi mûrs que la météo le permet", correct: false }
      explanation: |
        Rendement, qualité et coût s’équilibrent au lieu d’être poussés un par un.
        Courir après le volume dilue le raisin et manque l’objectif de qualité ;
        tailler très court ou attendre la maturité maximale peut coûter plus que le
        vin ne rapporte.

  - id: vm-training-define-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In vineyard management, what does training a vine determine?"
      choices:
        - { text: "The number of buds left each winter", correct: false }
        - { text: "The shape of the vine's permanent wood", correct: true }
        - { text: "The distance between neighbouring vines", correct: false }
        - { text: "The posts and wires that hold the canopy", correct: false }
      explanation: |
        Training builds the trunk and any cordon arms over the first years, then
        keeps that framework. Bud numbers come from pruning, spacing from planting
        density, and posts and wires from trellising.
    fr:
      question: "En viticulture, que détermine la formation du cep ?"
      choices:
        - { text: "Le nombre de bourgeons laissés chaque hiver", correct: false }
        - { text: "La forme de son bois permanent", correct: true }
        - { text: "La distance entre deux ceps voisins", correct: false }
        - { text: "Les piquets et fils qui tiennent le feuillage", correct: false }
      explanation: |
        La formation construit le tronc et les éventuels bras de cordon durant les
        premières années, puis maintient cette charpente. Le nombre de bourgeons
        dépend de la taille, l’écartement de la densité de plantation, et les
        piquets et fils du palissage.

  - id: vm-training-two-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What are the two basic ways to arrange a vine's permanent wood?"
      choices:
        - { text: "Spur pruning and cane pruning", correct: false }
        - { text: "Head training and cordon training", correct: true }
        - { text: "Vertical and sprawling shoot positioning", correct: false }
        - { text: "High-density and low-density planting", correct: false }
      explanation: |
        A head-trained vine has a trunk topped by a knot of old wood, sometimes
        with short arms; a cordon-trained vine has one or more horizontal arms of old
        wood. Head-trained vines can then be spur- or cane-pruned, while cordons are
        usually spur-pruned: pruning is a separate choice.
    fr:
      question: "Quelles sont les deux façons de base de former le bois permanent d’un cep ?"
      choices:
        - { text: "La taille courte et la taille longue", correct: false }
        - { text: "La formation en tête et la formation en cordon", correct: true }
        - { text: "Le palissage vertical et la végétation retombante", correct: false }
        - { text: "La haute densité et la basse densité", correct: false }
      explanation: |
        Un cep formé en tête a un tronc surmonté d’une tête de vieux bois, parfois
        avec de courts bras ; un cep en cordon porte un ou plusieurs bras horizontaux
        de vieux bois. La tête peut ensuite être taillée court ou long, le cordon le
        plus souvent en coursons : la taille est un choix distinct.

  - id: vm-training-low-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a grower train vines low to the ground?"
      choices:
        - { text: "To shelter the buds from spring frost", correct: false }
        - { text: "To use heat radiated from the soil", correct: true }
        - { text: "To make mechanical harvesting easier", correct: false }
        - { text: "To slow ripening in a cool climate", correct: false }
      explanation: |
        Stones and bare earth store daytime warmth and release it at night,
        helping ripening in cool sites such as Champagne, where vines are pruned low.
        The catch: cold air pools at ground level, so low buds face more frost, and
        low fruit is harder to pick by machine and closer to damp soil.
    fr:
      question: "Pourquoi un vigneron peut-il conduire ses vignes près du sol ?"
      choices:
        - { text: "Pour abriter les bourgeons des gelées de printemps", correct: false }
        - { text: "Pour profiter de la chaleur restituée par le sol", correct: true }
        - { text: "Pour faciliter la vendange mécanique", correct: false }
        - { text: "Pour ralentir la maturation en climat frais", correct: false }
      explanation: |
        Cailloux et terre nue emmagasinent la chaleur du jour et la restituent la
        nuit, ce qui aide la maturation en site frais, comme en Champagne où la vigne
        est taillée bas. Revers de la médaille : l’air froid stagne au ras du sol,
        donc les bourgeons bas gèlent plus facilement, et les grappes basses se
        vendangent mal à la machine et restent près d’un sol humide.

  - id: vm-training-high-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a grower train vines high off the ground?"
      choices:
        - { text: "To keep the bunches close to heat given back by the soil", correct: false }
        - { text: "To lift buds and young shoots above spring frost", correct: true }
        - { text: "To cut the number of buds the vine has to carry", correct: false }
        - { text: "To shelter the shoots from strong prevailing winds", correct: false }
      explanation: |
        On still, clear frost nights cold air is denser and settles near the
        ground, so a taller trunk keeps the buds above the coldest layer. Low
        training does the reverse: it uses heat stored in the soil and keeps
        the vine out of the wind.
    fr:
      question: "Pourquoi un vigneron peut-il conduire ses vignes haut au-dessus du sol ?"
      choices:
        - { text: "Pour garder les grappes près de la chaleur restituée par le sol", correct: false }
        - { text: "Pour sortir bourgeons et pousses des gelées de printemps", correct: true }
        - { text: "Pour réduire le nombre de bourgeons que porte la vigne", correct: false }
        - { text: "Pour abriter les rameaux des vents dominants", correct: false }
      explanation: |
        Par nuit claire et sans vent, l’air froid, plus dense, s’accumule au
        ras du sol ; un tronc plus haut sort les bourgeons de cette couche.
        Une conduite basse fait l’inverse : elle profite de la chaleur
        emmagasinée par le sol et protège la vigne du vent.

  - id: vm-head-wood-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How much permanent wood does a head-trained vine usually carry?"
      choices:
        - { text: "A trunk plus two long arms along the wire", correct: false }
        - { text: "A trunk with at most a few short arms", correct: true }
        - { text: "A trunk plus one long arm along the wire", correct: false }
        - { text: "A trunk plus several long arms on overhead wires", correct: false }
      explanation: |
        The crown at the top of the trunk is where spurs or canes are chosen
        each winter, so almost all the wood above it is renewed. Long arms
        kept year after year are cordons, and arms spread on overhead wires
        belong to a pergola.
    fr:
      question: "Combien de bois permanent porte en général une vigne conduite en tête ?"
      choices:
        - { text: "Un tronc et deux longs bras le long du fil", correct: false }
        - { text: "Un tronc avec, au plus, quelques bras courts", correct: true }
        - { text: "Un tronc et un seul long bras le long du fil", correct: false }
        - { text: "Un tronc et plusieurs longs bras sur une treille haute", correct: false }
      explanation: |
        La tête, au sommet du tronc, porte les coursons ou les baguettes
        choisis chaque hiver : presque tout le bois au-dessus est renouvelé.
        Des bras conservés d’année en année sont des cordons, et des bras
        étalés sur des fils en hauteur signalent une pergola.

  - id: vm-head-prune-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training, pruning]
    status: reviewed
    source_id: c06-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A grower spur-prunes a head-trained vine and wants to switch to replacement canes. What must happen to the permanent wood?"
      choices:
        - { text: "A cordon must first be laid along the wire", correct: false }
        - { text: "Nothing; a head can carry spurs or canes", correct: true }
        - { text: "The trunk must be cut back and a new head grown", correct: false }
        - { text: "A second trunk must be trained to carry the canes", correct: false }
      explanation: |
        The head is the permanent part; what is left on it each winter is a
        pruning choice. Gobelet keeps short spurs around the crown (Beaujolais,
        southern Rhône), while Guyot keeps one or two canes from the same kind
        of head (Bordeaux, Burgundy). The cane needs a wire to be tied to, but
        the old wood stays as it is.
    fr:
      question: "Un vigneron taille à coursons une vigne conduite en tête et veut passer à la taille à baguettes. Que doit devenir le bois permanent ?"
      choices:
        - { text: "Il faut d’abord établir un cordon le long du fil", correct: false }
        - { text: "Rien : une tête porte coursons ou baguettes", correct: true }
        - { text: "Il faut recéper le tronc et refaire une tête", correct: false }
        - { text: "Il faut former un second tronc pour les baguettes", correct: false }
      explanation: |
        La tête est la partie permanente ; ce qu’on y laisse chaque hiver
        relève de la taille. Le gobelet garde des coursons autour de la tête
        (Beaujolais, Rhône méridional), le Guyot y garde une ou deux baguettes
        (Bordeaux, Bourgogne). Il faudra un fil pour attacher la baguette,
        mais le vieux bois reste tel quel.

  - id: vm-cordon-shape-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does a cordon-trained vine look like?"
      choices:
        - { text: "A short trunk with free-standing shoots and no wire", correct: false }
        - { text: "A trunk with permanent horizontal arms bearing spurs", correct: true }
        - { text: "A trunk with no arms and spurs ringed around its top", correct: false }
        - { text: "A trunk with one long cane tied down, renewed each winter", correct: false }
      explanation: |
        The arms are the cordons, kept for many years; short spurs along them
        push out the new shoots. Cordon de Royat in Champagne works this way.
        Spurs ringed on the crown make a gobelet, and a cane renewed each
        winter is Guyot.
    fr:
      question: "À quoi ressemble une vigne conduite en cordon ?"
      choices:
        - { text: "Un tronc court, des rameaux libres et aucun fil", correct: false }
        - { text: "Un tronc prolongé de bras horizontaux à coursons", correct: true }
        - { text: "Un tronc sans bras, coursons en couronne au sommet", correct: false }
        - { text: "Un tronc et une baguette attachée, renouvelée chaque hiver", correct: false }
      explanation: |
        Les bras sont les cordons, conservés de nombreuses années ; les
        coursons répartis dessus donnent les nouveaux rameaux. Le cordon de
        Royat, en Champagne, en est un exemple. Des coursons en couronne sur
        la tête font un gobelet, et une baguette renouvelée chaque hiver, un
        Guyot.

  - id: vm-cordon-big-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What can cordon training do that head training cannot easily do?"
      choices:
        - { text: "Keep the vine's permanent wood to a minimum", correct: false }
        - { text: "Build a large vine on a wide permanent framework", correct: true }
        - { text: "Let the vine stand freely without a trellis", correct: false }
        - { text: "Renew all of the fruiting wood from canes each winter", correct: false }
      explanation: |
        Longer or extra arms let a vigorous vine fill more wire, which is how
        split canopies such as the Geneva double curtain are built. A head
        stays compact by design, and free-standing bushes and canes renewed
        each winter both belong to head training.
    fr:
      question: "Que permet la conduite en cordon, qu’une conduite en tête permet difficilement ?"
      choices:
        - { text: "Réduire au minimum le bois permanent de la vigne", correct: false }
        - { text: "Former une grande vigne sur une vaste charpente", correct: true }
        - { text: "Laisser la vigne en souche libre, sans palissage", correct: false }
        - { text: "Renouveler chaque hiver tout le bois fructifère par des baguettes", correct: false }
      explanation: |
        Des bras plus longs ou plus nombreux permettent à une vigne vigoureuse
        d’occuper davantage de fil : c’est ainsi qu’on bâtit des végétations
        dédoublées comme le rideau double de Genève. Une tête reste compacte
        par principe ; le gobelet libre et les baguettes renouvelées relèvent
        tous deux de la conduite en tête.

  - id: vm-pruning-define-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In vineyard work, what does pruning mean?"
      choices:
        - { text: "Tying the shoots onto the wires as they grow", correct: false }
        - { text: "Cutting away unwanted canes, leaves or old wood", correct: true }
        - { text: "Choosing how far apart the vines are planted", correct: false }
        - { text: "Grafting a new variety onto an established trunk", correct: false }
      explanation: |
        Pruning is the cut; training is the shape it maintains. Winter pruning
        removes dormant wood, while summer pruning deals with green growth such
        as surplus shoots and leaves. Tying shoots in is shoot positioning, and
        changing variety on an old trunk is top-grafting.
    fr:
      question: "En viticulture, que désigne la taille ?"
      choices:
        - { text: "Attacher les rameaux aux fils à mesure qu’ils poussent", correct: false }
        - { text: "Supprimer sarments, feuilles ou vieux bois indésirables", correct: true }
        - { text: "Choisir l’écartement des ceps à la plantation", correct: false }
        - { text: "Greffer un nouveau cépage sur un tronc en place", correct: false }
      explanation: |
        La taille, c’est la coupe ; la conduite, c’est la forme qu’elle
        entretient. La taille d’hiver retire du bois aoûté, les travaux en vert
        (ébourgeonnage, effeuillage) traitent la végétation de l’été. Attacher
        les rameaux relève du palissage, et changer de cépage sur un vieux
        tronc s’appelle le surgreffage.

  - id: vm-pruning-purpose-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Apart from setting the crop, what does regular pruning do to the vine's size and shape?"
      choices:
        - { text: "Lets it grow a little larger each year", correct: false }
        - { text: "Holds it to a chosen shape and limited size", correct: true }
        - { text: "Moves the fruiting zone a little higher each year", correct: false }
        - { text: "Thickens the trunk so it needs no support", correct: false }
      explanation: |
        Left alone, a vine climbs and spreads, pushing new growth and fruit
        further from the trunk every season. Pruning brings it back to the same
        frame each winter, so the fruit stays where the trellis, sprayer and
        pickers expect it.
    fr:
      question: "Au-delà du réglage de la charge, à quoi sert une taille régulière pour la forme de la vigne ?"
      choices:
        - { text: "À la laisser grandir un peu chaque année", correct: false }
        - { text: "À la maintenir dans une forme et un volume choisis", correct: true }
        - { text: "À remonter un peu la zone fructifère chaque année", correct: false }
        - { text: "À épaissir le tronc pour qu’il tienne sans tuteur", correct: false }
      explanation: |
        Livrée à elle-même, la vigne grimpe et s’étale : chaque saison, les
        pousses et les raisins s’éloignent un peu plus du tronc. La taille la
        ramène chaque hiver à la même charpente, et les grappes restent là où
        le palissage, le pulvérisateur et les vendangeurs les attendent.

  - id: vm-pruning-when-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a normal year, when does a grower prune the vine?"
      choices:
        - { text: "Once, while the vine is dormant in winter", correct: false }
        - { text: "Twice: in winter and again in summer", correct: true }
        - { text: "Once, in summer, while the shoots are growing", correct: false }
        - { text: "Once, just after harvest, before leaf fall", correct: false }
      explanation: |
        Winter work on dormant wood sets the bud count and the frame; summer
        work handles green growth through shoot thinning, trimming and leaf
        removal. A single pass would leave either an unmanaged canopy or an
        unshaped vine.
    fr:
      question: "Une année normale, quand le vigneron taille-t-il la vigne ?"
      choices:
        - { text: "Une fois, l’hiver, pendant le repos végétatif", correct: false }
        - { text: "Deux fois : l’hiver, puis de nouveau l’été", correct: true }
        - { text: "Une fois, l’été, pendant la pousse des rameaux", correct: false }
        - { text: "Une fois, juste après la vendange, avant la chute des feuilles", correct: false }
      explanation: |
        L’hiver, sur le bois en repos, on fixe le nombre d’yeux et la
        charpente ; l’été, l’ébourgeonnage, le rognage et l’effeuillage
        traitent la végétation. Un seul passage laisserait soit une végétation
        incontrôlée, soit une vigne sans forme.

  - id: vm-winter-buds-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does winter pruning mainly decide?"
      choices:
        - { text: "Which shoots are tucked into the catch wires", correct: false }
        - { text: "How many buds are kept, and where", correct: true }
        - { text: "How many bunches each shoot will carry", correct: false }
        - { text: "How much leaf is pulled from the fruit zone", correct: false }
      explanation: |
        Each bud left after pruning can become a shoot with one or two bunches,
        so the bud count is the grower's first lever on yield and vigour.
        Tucking shoots and pulling leaves come later, on the green canopy;
        bunches per shoot depend on bud fruitfulness, set the summer before.
    fr:
      question: "Que décide principalement la taille d’hiver ?"
      choices:
        - { text: "Quels rameaux glisser entre les fils releveurs", correct: false }
        - { text: "Combien d’yeux on garde, et où", correct: true }
        - { text: "Combien de grappes portera chaque rameau", correct: false }
        - { text: "Combien de feuilles on retire autour des grappes", correct: false }
      explanation: |
        Chaque œil conservé peut donner un rameau portant une ou deux grappes :
        le nombre d’yeux est le premier levier sur le rendement et la vigueur.
        Le relevage et l’effeuillage viennent plus tard, en vert ; le nombre de
        grappes par rameau dépend de la fertilité des bourgeons, fixée l’été
        précédent.

  - id: vm-bud-spacing-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning, canopy]
    status: reviewed
    source_id: c06-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a winter pruner keep the remaining buds spaced apart rather than crowded together?"
      choices:
        - { text: "So spring frost reaches fewer of the buds", correct: false }
        - { text: "So the new shoots form a manageable canopy", correct: true }
        - { text: "So each berry on the shoot grows larger", correct: false }
        - { text: "So the vine needs fewer canes the next winter", correct: false }
      explanation: |
        Crowded buds throw a dense tangle of shoots that shades the fruit and
        holds damp air. Spacing them along a cane or cordon gives each shoot
        its own room, which makes later tucking, trimming and leaf removal
        possible.
    fr:
      question: "Pourquoi, à la taille d’hiver, espace-t-on les yeux conservés au lieu de les laisser serrés ?"
      choices:
        - { text: "Pour que les gelées de printemps en touchent moins", correct: false }
        - { text: "Pour obtenir une végétation facile à gérer", correct: true }
        - { text: "Pour que chaque baie du rameau grossisse davantage", correct: false }
        - { text: "Pour avoir moins de baguettes à garder l’hiver suivant", correct: false }
      explanation: |
        Des yeux trop serrés donnent un fouillis de rameaux qui ombrage les
        grappes et retient l’humidité. Les espacer sur la baguette ou le cordon
        laisse de la place à chaque rameau, ce qui rend possibles le relevage,
        le rognage et l’effeuillage.

  - id: vm-winter-styles-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair names the two main methods of winter pruning?"
      choices:
        - { text: "Green harvesting and leaf removal", correct: false }
        - { text: "Spur pruning and cane pruning", correct: true }
        - { text: "Head training and cordon training", correct: false }
        - { text: "Shoot thinning and topping", correct: false }
      explanation: |
        Spurs are short stubs of a few buds; replacement canes are longer
        one-year rods tied along a wire, as in Guyot. Head and cordon describe
        the permanent wood the cuts are made on, and the other pairs are summer
        work on green growth.
    fr:
      question: "Quelles sont les deux grandes méthodes de taille d’hiver ?"
      choices:
        - { text: "La vendange en vert et l’effeuillage", correct: false }
        - { text: "La taille à coursons et la taille à baguettes", correct: true }
        - { text: "La conduite en tête et la conduite en cordon", correct: false }
        - { text: "L’ébourgeonnage et l’écimage", correct: false }
      explanation: |
        Le courson est un sarment taillé court, à deux ou trois yeux ; la
        baguette est un sarment d’un an, plus long, attaché le long d’un fil comme en Guyot. Tête et
        cordon désignent le bois permanent sur lequel on taille, et les autres
        paires sont des travaux en vert.

  - id: vm-spur-where-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On a spur-pruned vine, where are the spurs found?"
      choices:
        - { text: "Along a long cane tied flat to the wire", correct: false }
        - { text: "Along a cordon, or around the top of a head", correct: true }
        - { text: "Low on the trunk, just above the graft union", correct: false }
        - { text: "At the far ends of last year's canes", correct: false }
      explanation: |
        Cordon de Royat lines its spurs along permanent arms, while a gobelet
        carries them on the crown of a short trunk. A long cane tied to the
        wire is the other winter method, Guyot, and shoots from low on the
        trunk are usually removed as suckers.
    fr:
      question: "Sur une vigne taillée à coursons, où se trouvent les coursons ?"
      choices:
        - { text: "Sur une longue baguette attachée à plat sur le fil", correct: false }
        - { text: "Le long d’un cordon, ou en couronne sur une tête", correct: true }
        - { text: "Bas sur le tronc, juste au-dessus du point de greffe", correct: false }
        - { text: "À l’extrémité des sarments de l’année précédente", correct: false }
      explanation: |
        Le cordon de Royat aligne ses coursons sur des bras permanents, le
        gobelet les porte au sommet d’un tronc court. Une longue baguette
        attachée au fil relève de l’autre taille d’hiver, le Guyot ; les
        pousses nées bas sur le tronc sont des gourmands qu’on supprime.

  - id: vm-cane-how-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0030
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is replacement-cane pruning usually laid out?"
      choices:
        - { text: "Several short spurs set along a permanent arm", correct: false }
        - { text: "One or two canes kept and tied along a wire", correct: true }
        - { text: "One or two canes left free, with no wire", correct: false }
        - { text: "Long canes each kept for three or four seasons", correct: false }
      explanation: |
        The vine is usually head-trained: single Guyot keeps one cane, double
        Guyot two. Each winter the cane that fruited is cut away and a new one
        is chosen from shoots near the head, hence "replacement". Spurs on a
        permanent arm are the other winter method.
    fr:
      question: "Comment se présente en général une taille à baguettes renouvelées ?"
      choices:
        - { text: "Plusieurs coursons courts sur un bras permanent", correct: false }
        - { text: "Une ou deux baguettes attachées le long d’un fil", correct: true }
        - { text: "Une ou deux baguettes laissées libres, sans fil", correct: false }
        - { text: "De longues baguettes gardées trois ou quatre saisons", correct: false }
      explanation: |
        La vigne est le plus souvent conduite en tête : le Guyot simple garde
        une baguette, le Guyot double deux. Chaque hiver, la baguette qui a
        porté les raisins est supprimée et remplacée par un sarment né près de
        la tête. Les coursons sur un bras permanent relèvent de l’autre taille.

  - id: vm-cane-skill-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Compared with spur pruning, what is the main practical drawback of replacement-cane pruning?"
      choices:
        - { text: "It leaves too few buds for a commercial crop", correct: false }
        - { text: "It needs more skilled labour and more time", correct: true }
        - { text: "It cannot be used in a trellised vineyard", correct: false }
        - { text: "It exposes more cut wood to frost damage", correct: false }
      explanation: |
        Someone has to pick sound, well-placed canes, cut out the old one and
        tie the new one down, vine by vine. Spurs on a cordon are quicker to
        teach and easier to pre-prune by machine, yet Bordeaux and Burgundy
        still rely mainly on Guyot.
    fr:
      question: "Face à la taille à coursons, quel est le principal inconvénient pratique de la taille à baguettes ?"
      choices:
        - { text: "Elle laisse trop peu d’yeux pour une récolte rentable", correct: false }
        - { text: "Elle demande plus de main-d’œuvre qualifiée et de temps", correct: true }
        - { text: "Elle ne s’emploie pas sur une vigne palissée", correct: false }
        - { text: "Elle expose davantage de plaies de taille au gel", correct: false }
      explanation: |
        Il faut choisir, cep par cep, une baguette saine et bien placée,
        supprimer l’ancienne et attacher la nouvelle. Les coursons sur cordon
        s’apprennent plus vite et se prétaillent à la machine ; Bordeaux et la
        Bourgogne restent pourtant surtout fidèles au Guyot.

  - id: vm-guyot-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pruning]
    status: reviewed
    source_id: c06-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which named winter system keeps one or two long canes and ties them along a wire?"
      choices:
        - { text: "Gobelet", correct: false }
        - { text: "Guyot", correct: true }
        - { text: "Cordon de Royat", correct: false }
        - { text: "Lyre", correct: false }
      explanation: |
        Guyot is the classic replacement-cane system of Bordeaux and Burgundy,
        single or double. Cordon de Royat keeps spurs on a permanent arm,
        gobelet keeps spurs on a bush, and the lyre is a split trellis rather
        than a pruning method.
    fr:
      question: "Quel système de taille d’hiver garde une ou deux longues baguettes attachées le long d’un fil ?"
      choices:
        - { text: "Gobelet", correct: false }
        - { text: "Guyot", correct: true }
        - { text: "Cordon de Royat", correct: false }
        - { text: "Lyre", correct: false }
      explanation: |
        Le Guyot, simple ou double, est la taille à baguettes classique de
        Bordeaux et de la Bourgogne. Le cordon de Royat garde des coursons sur
        un bras permanent, le gobelet des coursons sur une souche libre, et la
        lyre est un palissage dédoublé, pas un mode de taille.

  - id: vm-canopy-define-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, canopy]
    status: reviewed
    source_id: c06-0034
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which parts of the vine make up its canopy?"
      choices:
        - { text: "Its leaves on their own", correct: false }
        - { text: "All of its green parts", correct: true }
        - { text: "The trellis posts and wires", correct: false }
        - { text: "The leaf wall above the fruiting wire", correct: false }
      explanation: |
        Shoots, leaves, tendrils and bunches all count, because canopy work is
        about how light and air reach them. The posts and wires are the
        trellis that may hold that growth, not part of it.
    fr:
      question: "Quelles parties de la vigne forment sa canopée ?"
      choices:
        - { text: "Ses feuilles, prises seules", correct: false }
        - { text: "Toutes ses parties vertes", correct: true }
        - { text: "Les piquets et les fils du palissage", correct: false }
        - { text: "La haie foliaire au-dessus du fil porteur", correct: false }
      explanation: |
        Rameaux, feuilles, vrilles et grappes en font partie, car la gestion
        de la canopée porte sur la lumière et l’air qui les atteignent. Les
        piquets et les fils forment le palissage qui peut soutenir cette
        végétation, sans en faire partie.

  - id: vm-canopy-trellis-choice-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, canopy, trellis]
    status: draft
    source_id: c06-0035
    review:
      fact_check: unsure
      sources: [known-fact]
    en:
      question: When planning canopy work, which decision is treated as the first big fork?
      choices:
        - { text: "Which capsule colour the bottle will wear", correct: false }
        - { text: "Whether to use a trellis", correct: true }
        - { text: "Whether to chaptalise the must", correct: false }
        - { text: "Which yeast the cellar prefers", correct: false }
      explanation: |
        **Whether to use a trellis** is taught as the first canopy
        fork: free bush versus a wired wall. That ranking is a
        teaching frame, not a proof that leaf-plucking never matters.
        Cellar choices are not canopy decisions.

  - id: vm-trellis-support-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, trellis]
    status: reviewed
    source_id: c06-0036
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On a trellised vine, what are the posts and wires mainly there to support?"
      choices:
        - { text: "Anti-hail nets spread over the rows", correct: false }
        - { text: "The fruiting wood and the season's shoots", correct: true }
        - { text: "The drip-irrigation line along the row", correct: false }
        - { text: "The bunches, each clipped to a wire", correct: false }
      explanation: |
        Canes or cordons are tied along the fruiting wire, and the new shoots
        are held by catch wires above it. Nets and drip lines may hang from
        the same posts as add-ons, while a bush vine carries its fruit with no
        frame at all.
    fr:
      question: "Sur une vigne palissée, que servent principalement à soutenir les piquets et les fils ?"
      choices:
        - { text: "Les filets paragrêle tendus au-dessus des rangs", correct: false }
        - { text: "Le bois fructifère et les rameaux de l’année", correct: true }
        - { text: "Le goutte-à-goutte qui court le long du rang", correct: false }
        - { text: "Les grappes, attachées une à une à un fil", correct: false }
      explanation: |
        Baguettes ou cordons sont attachés sur le fil porteur, et les rameaux
        de l’année sont tenus par les fils releveurs au-dessus. Filets et
        goutte-à-goutte peuvent s’accrocher aux mêmes piquets en accessoire,
        alors qu’un gobelet porte ses raisins sans aucune armature.

  - id: vm-bush-define-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0037
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which combination of training and pruning describes a bush vine?"
      choices:
        - { text: "Cordon-trained, spur-pruned, on a VSP wall", correct: false }
        - { text: "Head-trained, spur-pruned, with no trellis", correct: true }
        - { text: "Cordon-trained, spur-pruned, with no trellis", correct: false }
        - { text: "Head-trained, cane-pruned, on a single wire", correct: false }
      explanation: |
        That is the gobelet: a short trunk, spurs on the crown and shoots that
        fall where they like. A cane tied to a wire turns the same head into a
        Guyot vine, and permanent arms make a cordon.
    fr:
      question: "Quelle combinaison de conduite et de taille correspond à une vigne en gobelet ?"
      choices:
        - { text: "Cordon, taille à coursons, palissage vertical", correct: false }
        - { text: "Tête, taille à coursons, sans palissage", correct: true }
        - { text: "Cordon, taille à coursons, sans palissage", correct: false }
        - { text: "Tête, taille à baguette, sur un seul fil", correct: false }
      explanation: |
        Le gobelet, c’est un tronc court, des coursons en couronne et des
        rameaux qui retombent librement. Une baguette attachée à un fil fait de
        la même tête un Guyot, et des bras permanents, un cordon.

  - id: vm-bush-climate-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which climate does a hanging, untrellised bush canopy usually work best?"
      choices:
        - { text: "Cool, damp and often overcast", correct: false }
        - { text: "Warm to hot, dry and sunny", correct: true }
        - { text: "Warm, humid and rainy in summer", correct: false }
        - { text: "Mild and maritime, with cloudy summers", correct: false }
      explanation: |
        The drooping shoots shade the bunches from fierce sun, and dry air
        keeps that dense, still canopy free of rot. In cloudy or humid places
        the same shade slows ripening and holds moisture, so growers there
        prefer an open, wired wall.
    fr:
      question: "Sous quel climat une vigne en gobelet, au feuillage retombant et sans palissage, réussit-elle le mieux ?"
      choices:
        - { text: "Frais, humide et souvent couvert", correct: false }
        - { text: "Chaud à très chaud, sec et ensoleillé", correct: true }
        - { text: "Chaud, humide et pluvieux l’été", correct: false }
        - { text: "Doux et océanique, aux étés nuageux", correct: false }
      explanation: |
        Les rameaux retombants ombragent les grappes sous un soleil intense, et
        l’air sec préserve de la pourriture ce feuillage dense et peu ventilé.
        Sous un climat nuageux ou humide, la même ombre freine la maturité et
        retient l’humidité : on y préfère une haie palissée et aérée.

  - id: vm-bush-examples-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0038
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pair of regions is the usual example of bush-trained vineyards?"
      choices:
        - { text: "The Mosel Valley and Chablis", correct: false }
        - { text: "The southern Rhône and Barossa", correct: true }
        - { text: "Marlborough and Central Otago", correct: false }
        - { text: "Champagne and the Loire Valley", correct: false }
      explanation: |
        Grenache gobelets around Châteauneuf-du-Pape and old dry-grown Shiraz
        bushes in the Barossa both rely on a hot, dry summer. Cooler regions
        such as the Mosel, Chablis or Marlborough need light and air on the
        fruit, so they use stakes or wires.
    fr:
      question: "Quelle paire de régions sert d’exemple type de vignobles conduits en gobelet ?"
      choices:
        - { text: "La vallée de la Moselle et Chablis", correct: false }
        - { text: "Le Rhône méridional et la Barossa", correct: true }
        - { text: "Marlborough et Central Otago", correct: false }
        - { text: "La Champagne et le Val de Loire", correct: false }
      explanation: |
        Les gobelets de Grenache autour de Châteauneuf-du-Pape et les vieilles
        souches de Shiraz non irriguées de la Barossa comptent tous deux sur
        un été chaud et sec. Les régions plus fraîches, comme la Moselle,
        Chablis ou Marlborough, ont besoin de lumière et d’air sur les grappes
        et conduisent sur échalas ou sur fils.

  - id: vm-bush-shade-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training, canopy]
    status: reviewed
    source_id: c06-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a hot, sunny vineyard, how does a hanging bush canopy help the fruit?"
      choices:
        - { text: "It exposes the bunches to more direct sun", correct: false }
        - { text: "Its shade protects the grapes from sunburn", correct: true }
        - { text: "It speeds up sugar build-up in the berries", correct: false }
        - { text: "It lets the wind dry the bunches after rain", correct: false }
      explanation: |
        Bunches tucked under a drooping gobelet scorch less than fruit on the
        sunny face of a tight upright wall, and they hold on to more acidity.
        In a cool site that same shade would hold back ripening.
    fr:
      question: "Dans un vignoble chaud et ensoleillé, en quoi le feuillage retombant d’un gobelet aide-t-il les raisins ?"
      choices:
        - { text: "Il expose davantage les grappes au soleil direct", correct: false }
        - { text: "Son ombre protège les raisins de l’échaudage", correct: true }
        - { text: "Il accélère l’accumulation de sucre dans les baies", correct: false }
        - { text: "Il laisse le vent sécher les grappes après la pluie", correct: false }
      explanation: |
        Les grappes abritées sous un gobelet retombant brûlent moins que celles
        exposées sur la face ensoleillée d’une haie verticale serrée, et elles
        gardent plus d’acidité. En site frais, cette même ombre retarderait la
        maturité.

  - id: vm-bush-cool-wet-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training, canopy]
    status: reviewed
    source_id: c06-0040
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a hanging bush canopy struggle where summers stay cool or damp?"
      choices:
        - { text: "Its fruit sits too high to gain warmth from the soil", correct: false }
        - { text: "Shade slows ripening and damp air invites rot", correct: true }
        - { text: "Its open shape lets the bunches cool too quickly", correct: false }
        - { text: "Its spurs carry too few buds for a full crop", correct: false }
      explanation: |
        The mound of leaves keeps light off the bunches and holds humidity
        after rain, which suits grey rot and mildew. Bush vines actually sit
        low, close to the soil, and their problem is too much cover rather
        than too little.
    fr:
      question: "Pourquoi une vigne en gobelet, au feuillage retombant, peine-t-elle là où les étés restent frais ou humides ?"
      choices:
        - { text: "Ses grappes sont trop hautes pour profiter de la chaleur du sol", correct: false }
        - { text: "L’ombre freine la maturité et l’humidité favorise la pourriture", correct: true }
        - { text: "Sa forme ouverte refroidit trop vite les grappes", correct: false }
        - { text: "Ses coursons portent trop peu d’yeux pour une pleine récolte", correct: false }
      explanation: |
        La masse de feuilles prive les grappes de lumière et retient
        l’humidité après la pluie, ce qui fait le jeu de la pourriture grise et
        du mildiou. Le gobelet est en réalité bas, près du sol ; son défaut est
        un excès de couverture, pas un manque.

  - id: vm-beaujolais-tie-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In Beaujolais, how are the shoots of many gobelet vines handled during summer?"
      choices:
        - { text: "They are tucked between catch wires on a VSP wall", correct: false }
        - { text: "Their tips are tied together above the vine", correct: true }
        - { text: "They are left to hang freely toward the ground", correct: false }
        - { text: "They are tied up to a single wooden stake", correct: false }
      explanation: |
        Gathering the shoots into a bundle lifts the leaves off the bunches and
        opens the centre of the vine to air and light, while it stays a
        gobelet with no wires. A single stake per vine is the steep northern
        Rhône habit, and catch wires would mean a trellis.
    fr:
      question: "Dans le Beaujolais, que fait-on souvent l’été des rameaux d’une vigne en gobelet ?"
      choices:
        - { text: "On les glisse entre les fils releveurs d’un palissage", correct: false }
        - { text: "On lie leurs extrémités ensemble au-dessus du cep", correct: true }
        - { text: "On les laisse retomber librement vers le sol", correct: false }
        - { text: "On les attache à un échalas planté au pied", correct: false }
      explanation: |
        Rassembler les rameaux en faisceau relève le feuillage au-dessus des
        grappes et ouvre le cœur du cep à l’air et à la lumière, sans quitter
        le gobelet ni poser de fils. L’échalas, un piquet par cep, est l’usage
        des coteaux raides du Rhône septentrional.

  - id: vm-harvest-untrellised-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, trellis]
    status: reviewed
    source_id: c06-0042
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard layout usually rules out machine harvesting?"
      choices:
        - { text: "Spur-pruned cordons on a VSP wall", correct: false }
        - { text: "Free-standing bush vines", correct: true }
        - { text: "Guyot vines on a low fruiting wire", correct: false }
        - { text: "Cordon vines on a high single wire", correct: false }
      explanation: |
        A straddle harvester shakes a continuous fruiting wall as it drives
        down the row. Bush vines have no wire and their fruit is spread around
        each trunk, so they are picked by hand, as in many old Grenache and
        Carignan vineyards.
    fr:
      question: "Quel mode de conduite empêche en général la vendange à la machine ?"
      choices:
        - { text: "Des cordons taillés à coursons en palissage vertical", correct: false }
        - { text: "Des gobelets sans palissage", correct: true }
        - { text: "Des vignes en Guyot sur un fil porteur bas", correct: false }
        - { text: "Des cordons sur un fil unique placé haut", correct: false }
      explanation: |
        Une machine à vendanger enjambe le rang et secoue une haie fructifère
        continue. Le gobelet n’a pas de fil et ses grappes se répartissent
        autour de chaque tronc : on le vendange à la main, comme dans bien des
        vieilles vignes de Grenache et de Carignan.

  - id: vm-gobelet-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, training]
    status: reviewed
    source_id: c06-0043
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does the French training term gobelet describe?"
      choices:
        - { text: "A cane-pruned vine on a single wire", correct: false }
        - { text: "A bush vine", correct: true }
        - { text: "A spur-pruned cordon on wires", correct: false }
        - { text: "A vine trained over a high pergola", correct: false }
      explanation: |
        A gobelet is a short trunk with spurs on its crown and no trellis, the
        traditional shape in Beaujolais and the southern Rhône; the name evokes
        the cup its arms form. A single cane on a wire is Guyot, and a
        spur-pruned cordon is the Cordon de Royat type.
    fr:
      question: "En conduite de la vigne, que désigne le terme « gobelet » ?"
      choices:
        - { text: "Une vigne taillée à baguette sur un seul fil", correct: false }
        - { text: "Une souche libre, sans palissage", correct: true }
        - { text: "Un cordon taillé à coursons sur fils", correct: false }
        - { text: "Une vigne conduite sur une haute pergola", correct: false }
      explanation: |
        Le gobelet est un tronc court portant ses coursons en couronne, sans
        palissage : la forme traditionnelle du Beaujolais et du Rhône
        méridional, dont les bras dessinent une coupe. Une baguette sur un fil
        est un Guyot, et un cordon à coursons, un cordon de Royat.

  - id: vm-spray-cover-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, canopy, trellis]
    status: reviewed
    source_id: c06-0047
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does a trellis that keeps fruit and leaves in separate zones help with spraying?"
      choices:
        - { text: "Rain runs off the leaves, so sprays last longer", correct: false }
        - { text: "Sprays reach leaves and bunches more evenly", correct: true }
        - { text: "The leaves shield the bunches from spray residue", correct: false }
        - { text: "Sprays can be applied by hand instead of by tractor", correct: false }
      explanation: |
        When leaves and fruit are not packed into one tangle, fungicide and
        insecticide hit their targets instead of the outside of a hedge. It is
        a useful side effect; the main point of separating the zones is light
        and air on the fruit.
    fr:
      question: "En quoi un palissage qui sépare zone fructifère et feuillage facilite-t-il les traitements ?"
      choices:
        - { text: "La pluie glisse sur les feuilles et les produits tiennent plus", correct: false }
        - { text: "Les produits atteignent mieux feuilles et grappes", correct: true }
        - { text: "Les feuilles protègent les grappes des résidus", correct: false }
        - { text: "On peut traiter à la main plutôt qu’au tracteur", correct: false }
      explanation: |
        Quand feuilles et grappes ne forment pas un seul fouillis, fongicides
        et insecticides atteignent leur cible au lieu de s’arrêter à la
        surface de la haie. C’est un bénéfice secondaire : séparer les zones
        sert d’abord à donner lumière et air aux raisins.

  - id: vm-vsp-common-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, trellis]
    status: reviewed
    source_id: c06-0048
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which named trellis is the usual default in a modern wired vineyard?"
      choices:
        - { text: "Geneva double curtain", correct: false }
        - { text: "Vertical shoot positioning (VSP)", correct: true }
        - { text: "Lyre", correct: false }
        - { text: "Pergola", correct: false }
      explanation: |
        A narrow, upright leaf wall on catch wires is easy to mechanise and
        suits moderate vigour, so it dominates modern plantings. The lyre and
        Geneva double curtain split the canopy for vigorous vines, and the
        pergola lifts it overhead.
    fr:
      question: "Quel palissage est le choix par défaut d’un vignoble moderne sur fils ?"
      choices:
        - { text: "Le rideau double de Genève", correct: false }
        - { text: "Le palissage vertical (VSP)", correct: true }
        - { text: "La lyre", correct: false }
        - { text: "La pergola", correct: false }
      explanation: |
        Une haie foliaire étroite et dressée, tenue par des fils releveurs, se
        mécanise facilement et convient à une vigueur modérée : elle domine
        les plantations modernes. La lyre et le rideau double de Genève
        dédoublent la végétation des vignes vigoureuses, la pergola la porte
        en hauteur.

  - id: vm-vsp-prune-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, trellis, pruning]
    status: reviewed
    source_id: c06-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A grower switches a VSP block from replacement canes to spur-pruned cordons. What must happen to the VSP trellis?"
      choices:
        - { text: "It must be replaced by a split canopy such as a lyre", correct: false }
        - { text: "It can stay; VSP works with spurs or canes", correct: true }
        - { text: "It must come out, since spur-pruned vines stand free", correct: false }
        - { text: "It must be rebuilt as a high overhead pergola", correct: false }
      explanation: |
        VSP describes where the shoots go, not how the winter wood is cut:
        Guyot canes and cordon spurs both send shoots up between the catch
        wires. The grower has to lay down a cordon on the fruiting wire, but
        the posts and wires can stay.
    fr:
      question: "Un vigneron fait passer une parcelle en palissage vertical (VSP) de la taille à baguettes au cordon à coursons. Que doit devenir le palissage ?"
      choices:
        - { text: "Le remplacer par une végétation dédoublée, en lyre", correct: false }
        - { text: "Le garder : le VSP accepte coursons ou baguettes", correct: true }
        - { text: "Le retirer, car une vigne à coursons reste libre", correct: false }
        - { text: "Le reconstruire en pergola haute", correct: false }
      explanation: |
        Le VSP décrit la position des rameaux, pas la façon de tailler le bois
        en hiver : baguettes de Guyot et coursons de cordon envoient tous deux
        leurs rameaux entre les fils releveurs. Il faut établir un cordon sur
        le fil porteur, mais piquets et fils restent en place.

  - id: vm-vsp-define-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, trellis]
    status: reviewed
    source_id: c06-0050
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How are the shoots arranged in vertical shoot positioning?"
      choices:
        - { text: "Left to hang freely toward the ground", correct: false }
        - { text: "Trained upward and held between wires", correct: true }
        - { text: "Split into two curtains that hang downward", correct: false }
        - { text: "Spread over an overhead roof of wires", correct: false }
      explanation: |
        Pairs of catch wires are raised through spring to keep a thin, upright
        curtain of leaves above the fruiting wire. Twin hanging curtains are
        the Geneva double curtain, an overhead roof is a pergola, and freely
        hanging shoots belong to a bush vine.
    fr:
      question: "Comment les rameaux sont-ils disposés en palissage vertical (VSP) ?"
      choices:
        - { text: "Laissés retomber librement vers le sol", correct: false }
        - { text: "Dressés vers le haut entre des fils", correct: true }
        - { text: "Répartis en deux rideaux qui retombent", correct: false }
        - { text: "Étalés sur un plafond de fils en hauteur", correct: false }
      explanation: |
        Au printemps, on remonte au fur et à mesure des paires de fils
        releveurs pour garder une haie foliaire mince et dressée au-dessus du
        fil porteur. Deux rideaux retombants, c’est le rideau double de Genève ;
        un plafond de fils, une pergola ; des rameaux libres, un gobelet.

  - id: vm-vsp-hot-sprawl-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, trellis, canopy, heat]
    status: reviewed
    source_id: c06-0051
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a hot, dry vineyard, which change to a VSP canopy can cut direct sun on the fruit?"
      choices:
        - { text: "Leave the top shoots untucked to drape over the fruit", correct: true }
        - { text: "Tie the shoots upright and pull leaves around the bunches", correct: false }
        - { text: "Hedge the shoots short and thin leaves on both sides", correct: false }
        - { text: "Lower the fruiting wire and keep shoots tucked upright", correct: false }
      explanation: |
        Untucked upper growth flops over the fruit zone like a sunshade,
        lowering berry temperature and the risk of sunburn; many warm
        Australian vineyards are left to sprawl for this reason. In a cool or
        humid site the same shade would slow ripening and invite rot.
    fr:
      question: "Dans un vignoble chaud et sec, quelle adaptation d’un palissage vertical (VSP) limite le soleil direct sur les grappes ?"
      choices:
        - { text: "Laisser retomber les rameaux du haut sur les grappes", correct: true }
        - { text: "Relever les rameaux et effeuiller autour des grappes", correct: false }
        - { text: "Rogner court et éclaircir le feuillage des deux côtés", correct: false }
        - { text: "Abaisser le fil porteur et garder les rameaux relevés", correct: false }
      explanation: |
        Les rameaux du haut, non relevés, retombent sur la zone fructifère comme
        un parasol : les baies chauffent moins et l’échaudage recule. Bien des
        vignobles chauds d’Australie laissent ainsi la végétation s’étaler. En
        site frais ou humide, cette ombre freinerait la maturité et favoriserait
        la pourriture.

  - id: vm-density-definition-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting-density]
    status: reviewed
    source_id: c06-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which measurement expresses a vineyard's planting density?"
      choices:
        - { text: "Tonnes of grapes harvested per hectare", correct: false }
        - { text: "Vines planted per hectare", correct: true }
        - { text: "Shoots retained per metre of canopy", correct: false }
        - { text: "Metres of trellis wire installed per row", correct: false }
      explanation: |
        Planting density is the vine population per unit of land, usually stated as vines per
        hectare. Row width and spacing between vines determine that figure, while yield and shoot
        density describe different parts of vineyard performance.
    fr:
      question: "Quelle mesure exprime la densité de plantation d’un vignoble ?"
      choices:
        - { text: "Les tonnes de raisins récoltées par hectare", correct: false }
        - { text: "Le nombre de ceps plantés par hectare", correct: true }
        - { text: "Le nombre de rameaux gardés par mètre de rang", correct: false }
        - { text: "Les mètres de fil de palissage posés par rang", correct: false }
      explanation: |
        La densité de plantation, c’est le nombre de ceps par unité de
        surface, d’ordinaire exprimé en pieds par hectare. Elle découle de
        l’écartement entre les rangs et entre les ceps ; le rendement et la
        densité de rameaux décrivent d’autres aspects du vignoble.

  - id: vm-density-range-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting-density]
    status: reviewed
    source_id: c06-0055
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which approximate range spans many low- and high-density commercial wine vineyards?"
      choices:
        - { text: "400–4,000 vines per hectare", correct: false }
        - { text: "1,000–10,000 vines per hectare", correct: true }
        - { text: "3,000–20,000 vines per hectare", correct: false }
        - { text: "5,000–15,000 vines per hectare", correct: false }
      explanation: |
        Around 1,000 vines per hectare is plausible in widely spaced, water-limited vineyards,
        whereas traditional high-density regions such as Burgundy or the Médoc approach 10,000.
        The suitable figure depends on water, soil, vine vigour, training system, machinery and
        production goals. Above about 10,000, densities become exceptional rather than commercial norms.
    fr:
      question: "Quelle fourchette approximative couvre de nombreux vignobles commerciaux, des moins denses aux plus denses ?"
      choices:
        - { text: "400 à 4 000 pieds par hectare", correct: false }
        - { text: "1 000 à 10 000 pieds par hectare", correct: true }
        - { text: "3 000 à 20 000 pieds par hectare", correct: false }
        - { text: "5 000 à 15 000 pieds par hectare", correct: false }
      explanation: |
        Environ 1 000 pieds par hectare se voient dans des vignobles très
        espacés, limités en eau ; les régions traditionnelles à forte densité,
        comme la Bourgogne ou le Médoc, approchent 10 000. La densité adaptée
        dépend de l’eau, du sol, de la vigueur, du mode de conduite, des
        machines et des objectifs de production. Au-delà d’environ 10 000, les
        densités deviennent exceptionnelles.

  - id: vm-density-competition-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, planting-density, vigour]
    status: reviewed
    source_id: c06-0060
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "On which site is closer in-row spacing most likely to restrain shoot growth per vine?"
      choices:
        - { text: "Shallow, relatively infertile soil with limited available water", correct: true }
        - { text: "Deep, fertile soil supplied by reliable rainfall and irrigation", correct: false }
        - { text: "Moist alluvial soil paired with a high-vigour rootstock", correct: false }
        - { text: "Deep clay-loam receiving abundant nitrogen and no cover crop", correct: false }
      explanation: |
        On a shallow, resource-limited site, neighbouring root systems are more likely to share a
        scarce supply of water and nutrients, which can restrain growth per vine. This is not a
        universal cure for vigour: deep, fertile, well-watered soils may sustain strong growth despite
        close spacing, and total vegetative growth per hectare may remain high.
    fr:
      question: "Sur quel terrain un espacement plus serré entre les ceps du rang a-t-il le plus de chances de freiner la vigueur de chaque cep ?"
      choices:
        - { text: "Un sol peu profond, assez pauvre, où l’eau disponible est limitée", correct: true }
        - { text: "Un sol profond et fertile, bien alimenté par la pluie et l’irrigation", correct: false }
        - { text: "Un sol alluvial frais associé à un porte-greffe vigoureux", correct: false }
        - { text: "Un limon argileux profond, riche en azote et sans enherbement", correct: false }
      explanation: |
        Sur un sol superficiel et pauvre, les racines voisines se partagent une eau et des éléments
        nutritifs rares, ce qui modère la pousse de chaque cep. Ce n’est pas un remède universel :
        un sol profond, fertile et bien arrosé peut entretenir une forte vigueur malgré la densité,
        et la végétation totale par hectare reste parfois élevée.

  - id: vm-yield-definition-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, yield]
    status: reviewed
    source_id: c06-0065
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard measurement is crop yield?"
      choices:
        - { text: "Grapes or wine produced per unit of vineyard area", correct: true }
        - { text: "The number of vines planted per unit of vineyard area", correct: false }
        - { text: "The number of fruitful buds retained on each dormant vine", correct: false }
        - { text: "The weight of dormant pruning wood relative to the crop", correct: false }
      explanation: |
        Yield relates agricultural output to land area. It is distinct from planting density, bud
        load and crop-load ratios, although all three can influence how much fruit the vineyard
        ultimately produces.
    fr:
      question: "Quelle mesure du vignoble correspond au rendement ?"
      choices:
        - { text: "La quantité de raisin ou de vin produite par unité de surface", correct: true }
        - { text: "Le nombre de ceps plantés par unité de surface", correct: false }
        - { text: "Le nombre de bourgeons fertiles laissés sur chaque cep à la taille", correct: false }
        - { text: "Le poids du bois de taille rapporté à celui de la récolte", correct: false }
      explanation: |
        Le rendement rapporte une production agricole à une surface. Il se distingue de la densité
        de plantation, de la charge en bourgeons et des rapports entre récolte et bois de taille,
        même si ces trois facteurs influencent la quantité de raisin finalement produite.

  - id: vm-yield-units-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, yield]
    status: reviewed
    source_id: c06-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pairing correctly describes two common ways of reporting vineyard yield?"
      choices:
        - { text: "Tonnes per hectare for grape mass; hectolitres per hectare for must or wine volume", correct: true }
        - { text: "Kilograms per vine for crop per vine; vines per hectare for planting density", correct: false }
        - { text: "Kilograms per metre of cordon for crop per canopy length; tonnes per hour for press throughput", correct: false }
        - { text: "Tonnes per hectare for grape yield; litres per tonne for juice extraction", correct: false }
      explanation: |
        Growers often report harvested fruit as tonnes per hectare (or tons per acre), while some
        wine regulations state an allowed must or wine volume in hectolitres per hectare. Extraction
        rate links the two figures, so they are related but not interchangeable.
    fr:
      question: "Quelle paire décrit correctement deux façons courantes d’exprimer le rendement d’un vignoble ?"
      choices:
        - { text: "Tonnes par hectare pour le raisin ; hectolitres par hectare pour le moût ou le vin", correct: true }
        - { text: "Kilos par cep pour la charge ; ceps par hectare pour la densité de plantation", correct: false }
        - { text: "Kilos par mètre de cordon pour la charge ; tonnes par heure pour le débit du pressoir", correct: false }
        - { text: "Tonnes par hectare pour le raisin ; litres par tonne pour l’extraction au pressoir", correct: false }
      explanation: |
        Les viticulteurs comptent souvent la récolte en tonnes par hectare, tandis que de nombreux
        cahiers des charges, comme ceux des AOC françaises, fixent un rendement maximal en
        hectolitres par hectare. Le taux d’extraction relie les deux chiffres : ils sont liés, mais
        pas interchangeables.

  - id: vm-yield-estimate-purpose-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, yield, harvest]
    status: reviewed
    source_id: c06-0067
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why does a wine business need a credible yield estimate before harvest?"
      choices:
        - { text: "To check regulatory and contract quantities and reserve enough winery capacity", correct: true }
        - { text: "To choose picking date, assess acid balance and estimate potential alcohol", correct: false }
        - { text: "To sort diseased fruit, prioritise affected blocks and plan selective picking", correct: false }
        - { text: "To set maceration length, choose oak format and target final blend proportions", correct: false }
      explanation: |
        Expected crop size affects compliance with yield limits, grower–buyer commitments and harvest
        logistics. The winery also needs enough bins, press time and tank or barrel capacity; Penn
        State Extension explicitly recommends obtaining crop estimates when planning incoming fruit.
    fr:
      question: "Pourquoi une entreprise viticole a-t-elle besoin d’une estimation fiable du rendement avant les vendanges ?"
      choices:
        - { text: "Pour vérifier les volumes réglementaires et contractuels et réserver assez de place au chai", correct: true }
        - { text: "Pour fixer la date de vendange, juger l’équilibre acide et estimer le degré potentiel", correct: false }
        - { text: "Pour trier les raisins malades, cibler les parcelles touchées et organiser des tris", correct: false }
        - { text: "Pour régler la durée de cuvaison, choisir le format de fût et viser les proportions d’assemblage", correct: false }
      explanation: |
        La taille de la récolte attendue conditionne le respect des plafonds de rendement, les
        engagements entre vignerons et acheteurs et la logistique des vendanges. Le chai doit aussi
        prévoir assez de caisses, de créneaux de pressoir et de cuves ou de barriques ; le service de
        vulgarisation de Penn State recommande explicitement d’estimer la récolte pour planifier les
        apports.

  - id: vm-yield-quality-balance-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, yield, vine-balance]
    status: reviewed
    source_id: c06-0073
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Two comparable vines are cluster-thinned: one was overcropped, while the other was already balanced. Which result is most likely?"
      choices:
        - { text: "The overcropped vine may ripen better; the balanced vine may gain little", correct: true }
        - { text: "The overcropped vine may gain little; the balanced vine may improve most", correct: false }
        - { text: "Both vines may improve equally because the same number of bunches was removed", correct: false }
        - { text: "Both vines may ripen more slowly because thinning reduces their photosynthetic capacity", correct: false }
      explanation: |
        Removing fruit can help when crop load exceeds the vine's capacity to ripen it. A vine that
        was already in balance may show little quality response to further thinning. The outcome also
        depends on leaf area, cultivar, site, season, timing and the amount of crop removed.
    fr:
      question: "Deux ceps comparables sont éclaircis (vendange en vert) : l’un était surchargé, l’autre déjà équilibré. Quel résultat est le plus probable ?"
      choices:
        - { text: "Le cep surchargé peut mieux mûrir ; le cep équilibré n’y gagne guère", correct: true }
        - { text: "Le cep surchargé n’y gagne guère ; le cep équilibré progresse le plus", correct: false }
        - { text: "Les deux progressent autant, puisqu’on a retiré le même nombre de grappes", correct: false }
        - { text: "Les deux mûrissent plus lentement, car l’éclaircissage réduit leur photosynthèse", correct: false }
      explanation: |
        Retirer des grappes aide quand la charge dépasse ce que le cep peut mener à maturité. Un cep
        déjà en équilibre réagit souvent peu à un éclaircissage supplémentaire. Le résultat dépend
        aussi de la surface foliaire, du cépage, du site, du millésime, de la date et de la quantité
        retirée.

  - id: vm-nematode-definition-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pests, nematodes]
    status: reviewed
    source_id: c06-0076
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description identifies plant-parasitic nematodes found in vineyard soils?"
      choices:
        - { text: "Microscopic roundworms that feed on roots and impair water uptake", correct: true }
        - { text: "Soil fungi that invade xylem and cause progressive trunk decay", correct: false }
        - { text: "Bacteria that infect graft unions and produce crown galls", correct: false }
        - { text: "Mites that feed on leaves and scar developing green shoots", correct: false }
      explanation: |
        Plant-parasitic nematodes live in soil water films or root tissue and use a stylet to feed on
        root cells. Root damage can weaken growth and reduce yield; symptoms above ground may resemble
        drought or nutrient deficiency, so soil and root testing are important.
    fr:
      question: "Quelle description correspond aux nématodes phytoparasites des sols viticoles ?"
      choices:
        - { text: "Des vers ronds microscopiques qui se nourrissent des racines et gênent l’absorption d’eau", correct: true }
        - { text: "Des champignons du sol qui envahissent le xylème et dégradent peu à peu le tronc", correct: false }
        - { text: "Des bactéries qui infectent le point de greffe et forment des galles du collet", correct: false }
        - { text: "Des acariens qui piquent les feuilles et marquent les jeunes rameaux verts", correct: false }
      explanation: |
        Les nématodes phytoparasites vivent dans le film d’eau du sol ou dans les racines, dont ils
        piquent les cellules avec un stylet. Les dégâts racinaires affaiblissent la croissance et le
        rendement ; en surface, les symptômes ressemblent à une sécheresse ou à une carence, d’où
        l’importance des analyses de sol et de racines.

  - id: vm-vertebrate-fruit-damage-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pests, birds, mammals]
    status: reviewed
    source_id: c06-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "After birds or mammals have fed in a block of ripe grapes, which field observation best matches their characteristic damage?"
      choices:
        - { text: "Missing berries or bunches, with pecked or bitten fruit developing bunch rot", correct: true }
        - { text: "Uniform berry shrivelling across intact bunches, with no pecks or bite marks", correct: false }
        - { text: "Patchy véraison and delayed sugar accumulation, with berry skins remaining unbroken", correct: false }
        - { text: "Scorched berry skins on the exposed canopy side, with no fruit removed", correct: false }
      explanation: |
        Birds and mammals can remove whole berries or bunches, while pecked, bitten or crushed fruit
        leaks juice and provides entry points and nutrients for decay organisms. The result can be
        both lower yield and bunch rot spreading beyond the fruit that was directly eaten.
    fr:
      question: "Après le passage d’oiseaux ou de mammifères dans une parcelle de raisins mûrs, quelle observation correspond le mieux à leurs dégâts ?"
      choices:
        - { text: "Baies ou grappes disparues, raisins becquetés ou mordus qui se mettent à pourrir", correct: true }
        - { text: "Flétrissement uniforme des baies sur des grappes intactes, sans coups de bec ni morsures", correct: false }
        - { text: "Véraison hétérogène et accumulation des sucres retardée, pellicules restées intactes", correct: false }
        - { text: "Pellicules brûlées du côté exposé du feuillage, sans aucun fruit emporté", correct: false }
      explanation: |
        Oiseaux et mammifères emportent des baies ou des grappes entières, et les fruits becquetés,
        mordus ou écrasés laissent couler un jus qui ouvre la porte aux pourritures. On perd ainsi du
        rendement, et la pourriture peut gagner des raisins qui n’ont pas été mangés.

  - id: vm-vertebrate-exclusion-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pests, birds, mammals]
    status: reviewed
    source_id: c06-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A vineyard is losing ripe grapes to starlings and deer. Which pair of physical barriers most directly excludes them?"
      choices:
        - { text: "Bird netting over the fruiting rows and suitable perimeter fencing", correct: true }
        - { text: "Trunk guards around each vine and reflective tape below the canopy", correct: false }
        - { text: "Raptor perches between rows and shade cloth beneath each bunch", correct: false }
        - { text: "Low wires around the trunks and cultivation along the row middles", correct: false }
      explanation: |
        Correctly installed netting physically prevents birds reaching ripening fruit, while fencing
        is the corresponding exclusion tool for larger mammals. Visual or sound deterrents may help,
        but animals can become accustomed to them and they do not form a complete barrier.
    fr:
      question: "Une vigne perd ses raisins mûrs à cause des étourneaux et des chevreuils. Quelle paire de barrières physiques les tient le plus directement à l’écart ?"
      choices:
        - { text: "Des filets sur la zone des grappes et une clôture autour de la parcelle", correct: true }
        - { text: "Des manchons autour de chaque tronc et des rubans réfléchissants sous le feuillage", correct: false }
        - { text: "Des perchoirs à rapaces entre les rangs et un voile d’ombrage sous chaque grappe", correct: false }
        - { text: "Des fils bas autour des troncs et un travail du sol dans les inter-rangs", correct: false }
      explanation: |
        Bien posés, les filets empêchent physiquement les oiseaux d’atteindre les grappes, et la
        clôture joue le même rôle face au gros gibier. Les effaroucheurs visuels ou sonores peuvent
        aider, mais les animaux s’y habituent et ils ne forment pas une barrière complète.

  - id: vm-ipm-principle-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, pests, ipm]
    status: reviewed
    source_id: c06-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which approach best represents integrated pest management in a vineyard?"
      choices:
        - { text: "Identify and monitor pests, combine control methods, then treat selectively when justified", correct: true }
        - { text: "Apply a broad-spectrum insecticide on a fixed calendar from budbreak to harvest", correct: false }
        - { text: "Release natural enemies, then stop monitoring once they are established", correct: false }
        - { text: "Repeat the most effective insecticide at each new insect sighting to keep numbers down", correct: false }
      explanation: |
        IPM starts with correct identification, monitoring and a decision about whether intervention
        is warranted. Prevention and biological, cultural or physical controls are combined with a
        targeted pesticide when necessary, reducing harm to beneficial organisms, slowing resistance
        and limiting environmental impact.
    fr:
      question: "Quelle démarche illustre le mieux la protection intégrée au vignoble ?"
      choices:
        - { text: "Identifier et suivre les ravageurs, combiner les méthodes, traiter de façon ciblée si besoin", correct: true }
        - { text: "Appliquer un insecticide à large spectre selon un calendrier fixe, du débourrement aux vendanges", correct: false }
        - { text: "Lâcher des auxiliaires, puis arrêter la surveillance une fois qu’ils sont installés", correct: false }
        - { text: "Répéter l’insecticide le plus efficace à chaque insecte repéré pour contenir les populations", correct: false }
      explanation: |
        La protection intégrée commence par une identification correcte, une surveillance et une
        décision : faut-il intervenir ? Prévention et moyens biologiques, culturaux ou physiques se
        combinent avec un traitement ciblé si nécessaire, ce qui épargne les auxiliaires, freine les
        résistances et limite l’impact sur l’environnement.

  - id: vm-botrytis-laccase-colour-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, botrytis, winemaking]
    status: reviewed
    source_id: c06-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Botrytis-affected red-grape must browns rapidly when exposed to air. Which mechanism best explains the colour loss?"
      choices:
        - { text: "Fungal laccase oxidises phenolics and pigments when oxygen is present", correct: true }
        - { text: "A higher must pH shifts anthocyanins towards less intensely coloured forms", correct: false }
        - { text: "Red pigments adsorb to yeast lees and settle during alcoholic fermentation", correct: false }
        - { text: "Anthocyanins polymerise with tannins and precipitate slowly during maturation", correct: false }
      explanation: |
        Botrytis cinerea produces laccase, an enzyme that can cause oxidative spoilage when oxygen is
        available. Red pigments and other phenolics are vulnerable, so affected must may brown and
        lose colour; limiting oxygen and testing for laccase guide winery treatment.
    fr:
      question: "Un moût de raisins rouges atteints de botrytis brunit vite au contact de l’air. Quel mécanisme explique le mieux la perte de couleur ?"
      choices:
        - { text: "La laccase du champignon oxyde les polyphénols et les pigments en présence d’oxygène", correct: true }
        - { text: "Un pH plus élevé du moût fait passer les anthocyanes vers des formes moins colorées", correct: false }
        - { text: "Les pigments rouges se fixent sur les lies de levures et décantent pendant la fermentation", correct: false }
        - { text: "Les anthocyanes se polymérisent avec les tanins et précipitent lentement pendant l’élevage", correct: false }
      explanation: |
        Botrytis cinerea produit la laccase, une enzyme responsable de la casse oxydasique quand
        l’oxygène est disponible. Les anthocyanes et les autres polyphénols y sont sensibles : le moût
        brunit et perd sa couleur. Limiter l’oxygène et doser la laccase guident le travail au chai.

  - id: vm-noble-rot-conditions-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, botrytis, noble-rot]
    status: reviewed
    source_id: c06-0091
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which situation is most likely to produce noble rot rather than destructive Botrytis grey rot?"
      choices:
        - { text: "Ripe, healthy grapes; misty mornings start infection, then dry afternoons concentrate them", correct: true }
        - { text: "Unripe, wounded grapes kept wet by persistent rain throughout ripening", correct: false }
        - { text: "Compact ripe bunches that stay wet for days and begin leaking juice", correct: false }
        - { text: "Ripe, loose bunches in a dry, sunny autumn with no mists or humidity", correct: false }
      explanation: |
        Noble rot is a beneficial expression of Botrytis cinerea on ripe grapes. Moisture initiates
        infection, but subsequent dry conditions slow the fungus and promote water loss, concentrating
        sugar, acidity and flavour. Persistent wetness instead favours destructive grey rot. Autumn
        mists rising from the cool Ciron river in Sauternes are the classic example.
    fr:
      question: "Quelle situation favorise le plus la pourriture noble plutôt que la pourriture grise destructrice ?"
      choices:
        - { text: "Raisins mûrs et sains ; brumes matinales, puis après-midi secs et ensoleillés", correct: true }
        - { text: "Raisins encore verts et blessés, mouillés par des pluies persistantes jusqu’à la vendange", correct: false }
        - { text: "Grappes mûres et compactes, mouillées plusieurs jours, qui commencent à couler", correct: false }
        - { text: "Grappes mûres et aérées, automne sec et ensoleillé, sans brume ni humidité", correct: false }
      explanation: |
        La pourriture noble est la forme bénéfique de Botrytis cinerea sur raisins mûrs. L’humidité
        lance l’infection, puis le temps sec freine le champignon et fait perdre de l’eau aux baies,
        ce qui concentre sucre, acidité et arômes. Une humidité persistante favorise au contraire la
        pourriture grise. Les brumes d’automne montées du Ciron, à Sauternes, en sont l’exemple
        classique.

  - id: vm-powdery-mildew-sulphur-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, powdery-mildew]
    status: reviewed
    source_id: c06-0092
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which long-established vineyard fungicide is especially associated with powdery mildew control?"
      choices:
        - { text: "Sulphur", correct: true }
        - { text: "Bordeaux mixture", correct: false }
        - { text: "Copper hydroxide", correct: false }
        - { text: "Fenhexamid", correct: false }
      explanation: |
        Sulphur has long been used against grape powdery mildew and remains an important contact
        option. Product choice, timing, temperature restrictions and resistance strategy still matter;
        copper-based products are more closely associated with downy mildew control.
    fr:
      question: "Quel fongicide employé de longue date en viticulture est surtout associé à la lutte contre l’oïdium ?"
      choices:
        - { text: "Le soufre", correct: true }
        - { text: "La bouillie bordelaise", correct: false }
        - { text: "L’hydroxyde de cuivre", correct: false }
        - { text: "Le fenhexamid", correct: false }
      explanation: |
        Le soufre est utilisé contre l’oïdium depuis le XIXᵉ siècle et reste un produit de contact
        important. Le choix du produit, la date, les limites de température et la gestion des
        résistances comptent toujours ; les produits cuivrés visent plutôt le mildiou.

  - id: vm-downy-mildew-bordeaux-mixture-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, downy-mildew]
    status: reviewed
    source_id: c06-0093
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which traditional fungicide and target are correctly paired in viticulture?"
      choices:
        - { text: "Bordeaux mixture — downy mildew", correct: true }
        - { text: "Bordeaux mixture — powdery mildew", correct: false }
        - { text: "Sulphur dust — downy mildew", correct: false }
        - { text: "Sulphur dust — Botrytis bunch rot", correct: false }
      explanation: |
        Bordeaux mixture combines copper sulphate and lime; Alexis Millardet promoted it against
        downy mildew in the Médoc in the 1880s. Modern programmes must follow local labels and limits
        because repeated copper use can accumulate in soil and harm non-target organisms.
    fr:
      question: "Quel fongicide traditionnel et quelle cible sont correctement associés en viticulture ?"
      choices:
        - { text: "Bouillie bordelaise — mildiou", correct: true }
        - { text: "Bouillie bordelaise — oïdium", correct: false }
        - { text: "Soufre en poudre — mildiou", correct: false }
        - { text: "Soufre en poudre — pourriture grise", correct: false }
      explanation: |
        La bouillie bordelaise associe sulfate de cuivre et chaux ; Alexis Millardet l’a promue
        contre le mildiou dans le Médoc dans les années 1880. Les programmes actuels respectent les
        étiquettes et plafonds locaux, car le cuivre répété s’accumule dans le sol et nuit aux
        organismes non ciblés.

  - id: vm-spray-preharvest-interval-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, spraying, harvest]
    status: reviewed
    source_id: c06-0095
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A pesticide label specifies a 14-day preharvest interval. What does this require?"
      choices:
        - { text: "At least 14 days between the final application and harvest", correct: true }
        - { text: "At least 14 days between the final application and workers re-entering the block", correct: false }
        - { text: "At least 14 days between successive applications of that product", correct: false }
        - { text: "Harvest no later than 14 days after the final application", correct: false }
      explanation: |
        The preharvest interval is counted from the last application to harvest. It is distinct from
        the re-entry interval, which protects workers, and from any minimum gap between sprays.
        Following the label, approved rate and interval helps keep residues within legal limits; it
        does not promise that every chemical trace will be zero. Requirements vary by product and
        jurisdiction.
    fr:
      question: "L’étiquette d’un produit phytosanitaire indique un délai avant récolte (DAR) de 14 jours. Qu’est-ce que cela impose ?"
      choices:
        - { text: "Au moins 14 jours entre le dernier traitement et la vendange", correct: true }
        - { text: "Au moins 14 jours entre le dernier traitement et le retour des ouvriers dans la parcelle", correct: false }
        - { text: "Au moins 14 jours entre deux applications successives de ce produit", correct: false }
        - { text: "Vendanger au plus tard 14 jours après le dernier traitement", correct: false }
      explanation: |
        Le DAR se compte du dernier traitement à la récolte. Il se distingue du délai de rentrée, qui
        protège les ouvriers, et de l’intervalle minimal entre deux applications. Respecter
        l’étiquette, la dose et le délai maintient les résidus sous les limites légales, sans
        garantir l’absence de toute trace ; les règles varient selon le produit et le pays.

  - id: vm-virus-diagnosis-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, viruses]
    status: reviewed
    source_id: c06-0099
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Several vines show red or yellow leaves, weak growth and delayed ripening. What should the grower do next?"
      choices:
        - { text: "Agree tissue type and sampling season with a virus lab, then submit samples", correct: true }
        - { text: "Apply a foliar nutrient spray to the affected vines and reassess symptoms next season", correct: false }
        - { text: "Uproot the symptomatic vines at once and replant the gaps with young vines", correct: false }
        - { text: "Spray an insecticide against mealybugs, then wait to see whether the symptoms fade", correct: false }
      explanation: |
        Virus assays differ in the tissue and sampling window that give reliable detection, so the
        testing laboratory's protocol should guide collection. Red leaves can also come from nutrient
        deficiency or trunk injury: feeding, spraying or uprooting before a diagnosis acts on a guess,
        and replanting without knowing the cause risks reinfecting the new vines. Killing mealybugs
        can slow spread but does not cure vines already infected, so their symptoms will not fade.
    fr:
      question: "Plusieurs ceps montrent des feuilles rouges ou jaunes, une faible vigueur et une maturité retardée. Que doit faire le vigneron en priorité ?"
      choices:
        - { text: "Demander au laboratoire de virologie quel tissu prélever et quand, puis envoyer les échantillons", correct: true }
        - { text: "Pulvériser un engrais foliaire sur les ceps touchés et réévaluer les symptômes l’an prochain", correct: false }
        - { text: "Arracher aussitôt les ceps symptomatiques et combler les manquants avec de jeunes plants", correct: false }
        - { text: "Traiter contre les cochenilles avec un insecticide, puis attendre que les symptômes s’estompent", correct: false }
      explanation: |
        Selon le test, le tissu et la période d’échantillonnage qui permettent une détection fiable
        changent : c’est le protocole du laboratoire qui guide le prélèvement des échantillons. Des
        feuilles rouges peuvent aussi venir d’une carence ou d’une blessure du tronc ; fertiliser,
        traiter ou arracher avant le diagnostic revient à agir au hasard, et replanter sans connaître
        la cause expose les jeunes plants à une nouvelle infection. Éliminer les cochenilles peut
        freiner la propagation, mais ne guérit pas les ceps déjà infectés : leurs symptômes ne
        s’estomperont pas.

  - id: vm-leafroll-fruit-impact-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, viruses, leafroll]
    status: reviewed
    source_id: c06-0100
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fruit pattern is commonly associated with damaging grapevine leafroll disease?"
      choices:
        - { text: "Lower yield, delayed ripening, lower sugar and weaker colour in red grapes", correct: true }
        - { text: "Earlier ripening, higher sugar and deeper colour, with yield largely unchanged", correct: false }
        - { text: "Normal fruit composition, with symptoms confined to the trunk wood", correct: false }
        - { text: "Seedless shot berries accompanied by strongly fan-shaped leaf blades", correct: false }
      explanation: |
        Grapevine leafroll-associated viruses can reduce cluster weight and delay sugar and colour
        development. Severity varies, and white cultivars may lack the conspicuous red-leaf symptom;
        laboratory testing is required because fruit and leaf symptoms are not unique to leafroll.
        Fan-shaped leaves with shot berries point instead to fanleaf virus.
    fr:
      question: "Quels effets sur la récolte associe-t-on couramment à une forme grave de l’enroulement de la vigne ?"
      choices:
        - { text: "Rendement plus faible, maturité retardée, moins de sucre et moins de couleur chez les rouges", correct: true }
        - { text: "Maturité plus précoce, plus de sucre et une couleur plus intense, à rendement presque inchangé", correct: false }
        - { text: "Composition du raisin normale, avec des symptômes limités au bois du tronc", correct: false }
        - { text: "Baies millerandées sans pépins et feuilles nettement déformées en éventail", correct: false }
      explanation: |
        Les virus associés à l’enroulement réduisent le poids des grappes et retardent l’accumulation
        des sucres et de la couleur. La gravité varie, et les cépages blancs ne montrent pas toujours
        le rougissement typique des feuilles ; seul un test de laboratoire confirme le diagnostic.
        Feuilles en éventail et baies millerandées évoquent plutôt le court-noué.

  - id: vm-virus-vector-pairing-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, viruses, vectors]
    status: reviewed
    source_id: c06-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pairing correctly matches two grapevine virus diseases with their important natural vectors?"
      choices:
        - { text: "Fanleaf — dagger nematodes; leafroll — mealybugs and soft scales", correct: true }
        - { text: "Fanleaf — mealybugs and soft scales; leafroll — dagger nematodes", correct: false }
        - { text: "Fanleaf — sharpshooters and spittlebugs; leafroll — dagger nematodes", correct: false }
        - { text: "Fanleaf — dagger nematodes; leafroll — sharpshooters and spittlebugs", correct: false }
      explanation: |
        Vector relationships are virus-specific: dagger nematodes such as *Xiphinema index* can
        transmit grapevine fanleaf virus, whereas mealybugs and soft scales can spread important
        leafroll-associated viruses. Infected cuttings, grafts or other propagation material can
        also introduce viruses, which is why tested planting stock remains fundamental.
    fr:
      question: "Quelle paire associe correctement deux viroses de la vigne à leurs principaux vecteurs naturels ?"
      choices:
        - { text: "Court-noué — nématodes Xiphinema ; enroulement — cochenilles farineuses et lécanines", correct: true }
        - { text: "Court-noué — cochenilles farineuses et lécanines ; enroulement — nématodes Xiphinema", correct: false }
        - { text: "Court-noué — cicadelles et cercopes ; enroulement — nématodes Xiphinema", correct: false }
        - { text: "Court-noué — nématodes Xiphinema ; enroulement — cicadelles et cercopes", correct: false }
      explanation: |
        Chaque virus a ses vecteurs : des nématodes comme *Xiphinema index* transmettent le
        court-noué, tandis que les cochenilles farineuses et les lécanines propagent les principaux
        virus de l’enroulement. Boutures, greffons et plants infectés peuvent aussi introduire ces
        virus, d’où l’importance d’un matériel végétal testé.

  - id: vm-pierce-vector-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, bacteria, pierces-disease, vectors]
    status: reviewed
    source_id: c06-0105
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which insects can transmit *Xylella fastidiosa*, the bacterium that causes Pierce's disease in grapevines?"
      choices:
        - { text: "Xylem-feeding sharpshooters and spittlebugs", correct: true }
        - { text: "Phloem-feeding mealybugs and soft scales", correct: false }
        - { text: "Leaf-feeding grape leafhoppers and thrips", correct: false }
        - { text: "Fruit-feeding moth larvae and vinegar flies", correct: false }
      explanation: |
        *Xylella fastidiosa* inhabits the vine's water-conducting xylem. Sharpshooters and spittlebugs
        acquire and transmit it while feeding on xylem sap; mealybugs and scales are instead important
        vectors of some grapevine leafroll-associated viruses.
    fr:
      question: "Quels insectes peuvent transmettre *Xylella fastidiosa*, la bactérie responsable de la maladie de Pierce chez la vigne ?"
      choices:
        - { text: "Des cicadelles pisseuses et des cercopes, qui sucent la sève du xylème", correct: true }
        - { text: "Des cochenilles farineuses et des lécanines, qui sucent la sève du phloème", correct: false }
        - { text: "Des cicadelles vertes et des thrips, qui piquent surtout les feuilles", correct: false }
        - { text: "Des chenilles de tordeuses et des drosophiles, qui attaquent les baies", correct: false }
      explanation: |
        *Xylella fastidiosa* vit dans le xylème, les vaisseaux qui conduisent l’eau dans le cep. Les
        cicadelles pisseuses et les cercopes l’acquièrent et la transmettent en se nourrissant de
        cette sève ; les cochenilles sont plutôt vectrices de certains virus de l’enroulement.

  - id: vm-pierce-management-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, disease, bacteria, pierces-disease, management]
    status: reviewed
    source_id: c06-0106
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Several vines have laboratory-confirmed chronic Pierce's disease and severe symptoms. Which block strategy is most appropriate?"
      choices:
        - { text: "Rogue badly affected vines, manage vectors and replant with tested material under local movement rules", correct: true }
        - { text: "Hard-prune badly affected vines, manage vectors and retain symptom-free regrowth as clean material", correct: false }
        - { text: "Rogue badly affected vines, replant from symptomless neighbours and stop vector monitoring after removal", correct: false }
        - { text: "Keep badly affected vines, apply a copper bactericide and reassess their symptoms over the next season", correct: false }
      explanation: |
        No reliable vineyard treatment eliminates *Xylella fastidiosa* from a chronically infected vine.
        Removal reduces the local source of bacteria, while vector management limits new infections;
        tested planting material and plant-health movement rules reduce the chance of reintroduction.
    fr:
      question: "Plusieurs ceps présentent une maladie de Pierce chronique, confirmée au laboratoire, avec des symptômes graves. Quelle stratégie adopter pour la parcelle ?"
      choices:
        - { text: "Arracher les ceps très atteints, lutter contre les vecteurs et replanter des plants testés selon les règles locales", correct: true }
        - { text: "Recéper les ceps très atteints, lutter contre les vecteurs et garder les repousses saines comme matériel propre", correct: false }
        - { text: "Arracher les ceps très atteints, replanter à partir de voisins sans symptômes et cesser de surveiller les vecteurs", correct: false }
        - { text: "Garder les ceps très atteints, appliquer un bactéricide cuprique et réévaluer les symptômes la saison suivante", correct: false }
      explanation: |
        Aucun traitement au vignoble n’élimine *Xylella fastidiosa* d’un cep chroniquement infecté.
        L’arrachage supprime la source locale de bactéries, la lutte contre les vecteurs limite les
        nouvelles infections, et des plants testés, déplacés selon les règles sanitaires, réduisent
        le risque de réintroduction.

  - id: vm-sustainable-scope-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, sustainability, ipm]
    status: reviewed
    source_id: c06-0113
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which statement best describes the relationship between sustainable viticulture and integrated pest management?"
      choices:
        - { text: "Sustainability balances environmental, social and economic aims; IPM can be one pest-management component", correct: true }
        - { text: "Sustainability is another name for IPM; both centre on pest thresholds and pesticide choice", correct: false }
        - { text: "Sustainability is a statutory organic input list; IPM is the certification process that enforces it", correct: false }
        - { text: "Sustainability mainly concerns biodiversity; IPM separately sets the economic and social goals", correct: false }
      explanation: |
        Sustainable viticulture is a broad strategy that also considers business viability and people,
        not just pests or chemical use. IPM can advance its environmental goals by combining monitoring,
        prevention and several control methods, but the two terms are not synonyms. Unlike organic
        certification, sustainability does not itself impose one universal prohibited-input list.
    fr:
      question: "Quelle affirmation décrit le mieux le lien entre viticulture durable et protection intégrée ?"
      choices:
        - { text: "La durabilité équilibre objectifs environnementaux, sociaux et économiques ; la protection intégrée peut en être un volet", correct: true }
        - { text: "La durabilité est un autre nom de la protection intégrée ; toutes deux portent sur les seuils et le choix des produits", correct: false }
        - { text: "La durabilité est une liste légale d’intrants bio ; la protection intégrée est la certification qui la fait appliquer", correct: false }
        - { text: "La durabilité concerne surtout la biodiversité ; la protection intégrée fixe à part les objectifs économiques et sociaux", correct: false }
      explanation: |
        La viticulture durable est une stratégie large qui tient compte aussi de la rentabilité et
        des personnes, pas seulement des ravageurs ou des produits. La protection intégrée sert ses
        objectifs environnementaux en combinant surveillance, prévention et plusieurs méthodes de
        lutte, mais les deux termes ne sont pas synonymes. Contrairement au bio, la durabilité
        n’impose pas en soi une liste unique d’intrants interdits.

  - id: vm-organic-certification-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, organic, certification]
    status: reviewed
    source_id: c06-0116
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "A winegrower wants to market grapes as organic. Which description best captures what certification normally requires?"
      choices:
        - { text: "Meet the applicable production rules, authorised-input list and certification controls", correct: true }
        - { text: "Use naturally derived inputs, keep internal records and self-declare the crop organic", correct: false }
        - { text: "Cut synthetic inputs by a set percentage, keep conventional fertiliser and document IPM thresholds", correct: false }
        - { text: "Report water, energy and labour performance under a sustainability scheme", correct: false }
      explanation: |
        Organic standards are regulated or accredited systems, not a loose promise to use smaller
        quantities of familiar products. Exact permitted-input lists vary by jurisdiction: most
        synthetic inputs are restricted, some are specifically authorised, and some natural
        substances may also be prohibited.
    fr:
      question: "Un vigneron veut vendre ses raisins comme issus de l’agriculture biologique. Que suppose normalement la certification ?"
      choices:
        - { text: "Respecter les règles de production, la liste des intrants autorisés et les contrôles de certification", correct: true }
        - { text: "Utiliser des intrants d’origine naturelle, tenir un registre interne et se déclarer bio soi-même", correct: false }
        - { text: "Réduire les intrants de synthèse d’un pourcentage fixé, garder l’engrais conventionnel et suivre des seuils d’intervention", correct: false }
        - { text: "Publier ses résultats en eau, énergie et main-d’œuvre dans le cadre d’un label de durabilité", correct: false }
      explanation: |
        Le bio repose sur un cahier des charges réglementé et contrôlé par un organisme
        certificateur, pas sur une vague promesse d’utiliser moins de produits. Les listes d’intrants
        autorisés varient selon les pays : la plupart des produits de synthèse sont exclus, quelques-uns
        sont expressément autorisés, et certaines substances naturelles peuvent être interdites.

  - id: vm-organic-conversion-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, organic, certification, conversion]
    status: reviewed
    source_id: c06-0118
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which milestone normally determines when an established vineyard can market a crop as organic?"
      choices:
        - { text: "Completing the conversion period set by the applicable organic standard", correct: true }
        - { text: "One full season without synthetic nitrogen or herbicides", correct: false }
        - { text: "A soil test showing no detectable residue of previously used products", correct: false }
        - { text: "Adopting a sustainability plan covering labour, water and energy", correct: false }
      explanation: |
        During conversion, the grower follows organic methods but generally cannot yet sell the crop
        as organic. The exact rule is jurisdiction-specific: EU rules normally require three years
        before the first organic harvest from perennial crops, while USDA rules require 36 months
        without prohibited substances before harvest.
    fr:
      question: "Quelle étape détermine normalement à partir de quand un vignoble établi peut vendre sa récolte en bio ?"
      choices:
        - { text: "La fin de la période de conversion prévue par la réglementation bio applicable", correct: true }
        - { text: "Une saison complète sans azote de synthèse ni désherbant chimique sur la parcelle", correct: false }
        - { text: "Une analyse de sol sans résidu détectable des produits utilisés auparavant", correct: false }
        - { text: "L’adoption d’un plan de durabilité couvrant main-d’œuvre, eau et énergie", correct: false }
      explanation: |
        Pendant la conversion, le vigneron applique les méthodes bio mais ne peut généralement pas
        encore vendre sa récolte comme biologique. La règle dépend du pays : dans l’UE, trois ans
        avant la première récolte bio pour les cultures pérennes ; aux États-Unis (USDA), 36 mois
        sans substance interdite avant la récolte.

  - id: vm-biodynamic-core-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, biodynamic, organic, certification]
    status: reviewed
    source_id: c06-0120
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which description most accurately distinguishes biodynamic viticulture from organic viticulture alone?"
      choices:
        - { text: "It adds a whole-farm philosophy and prescribed preparations to organic methods", correct: true }
        - { text: "It replaces organic input rules with pest thresholds and allows synthetic fertilisers", correct: false }
        - { text: "It follows a lunar harvest calendar but sets no rules on soil or preparations", correct: false }
        - { text: "It is a winery certification covering additives, energy and packaging, not farming", correct: false }
      explanation: |
        Biodynamics grew from Rudolf Steiner's 1924 agriculture lectures and treats the farm as an
        interconnected organism. Demeter certification requires specified compost and spray
        preparations. Astronomical calendars are widely associated with practice, including later
        work by Maria Thun, but calendar use alone neither defines nor founded biodynamics.
    fr:
      question: "Qu’est-ce qui distingue le plus exactement la biodynamie de la seule viticulture biologique ?"
      choices:
        - { text: "Elle ajoute aux méthodes bio une vision du domaine comme organisme et des préparations prescrites", correct: true }
        - { text: "Elle remplace les règles bio par des seuils d’intervention et autorise les engrais de synthèse", correct: false }
        - { text: "Elle suit un calendrier lunaire pour les vendanges, sans règle sur le sol ni sur les préparations", correct: false }
        - { text: "C’est une certification de cave qui porte sur les additifs, l’énergie et l’emballage, pas sur la vigne", correct: false }
      explanation: |
        La biodynamie est née des conférences agricoles de Rudolf Steiner en 1924 et considère le
        domaine comme un organisme vivant. La certification Demeter impose des préparations précises,
        pour le compost comme en pulvérisation (bouse de corne, silice de corne). Les calendriers
        astronomiques, popularisés notamment par Maria Thun, sont très répandus, mais leur usage ne
        suffit pas à définir la biodynamie.

  - id: vm-harvest-hemisphere-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, growth-cycle, harvest]
    status: reviewed
    source_id: c06-0127
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which calendar pairing is a broad landmark for wine-grape harvest in temperate regions?"
      choices:
        - { text: "September–October in the Northern Hemisphere; March–April in the Southern Hemisphere", correct: true }
        - { text: "July–August in the Northern Hemisphere; January–February in the Southern Hemisphere", correct: false }
        - { text: "May–June in the Northern Hemisphere; November–December in the Southern Hemisphere", correct: false }
        - { text: "March–April in the Northern Hemisphere; September–October in the Southern Hemisphere", correct: false }
      explanation: |
        Harvest usually falls in autumn, roughly six months apart between hemispheres. These month
        ranges are only study landmarks: warm regions may start earlier, cool regions or late-harvest
        styles may finish later, and variety, site, season and intended wine style all affect timing.
    fr:
      question: "Quel repère calendaire situe en gros les vendanges dans les régions viticoles tempérées ?"
      choices:
        - { text: "Septembre–octobre dans l’hémisphère Nord ; mars–avril dans l’hémisphère Sud", correct: true }
        - { text: "Juillet–août dans l’hémisphère Nord ; janvier–février dans l’hémisphère Sud", correct: false }
        - { text: "Mai–juin dans l’hémisphère Nord ; novembre–décembre dans l’hémisphère Sud", correct: false }
        - { text: "Mars–avril dans l’hémisphère Nord ; septembre–octobre dans l’hémisphère Sud", correct: false }
      explanation: |
        Les vendanges tombent en automne, à environ six mois d’écart d’un hémisphère à l’autre. Ce ne
        sont que des repères : les régions chaudes commencent plus tôt, les régions fraîches et les
        vendanges tardives finissent plus tard, et le cépage, le site, le millésime et le style visé
        jouent aussi.

  - id: vm-budbreak-cultivar-order-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, growth-cycle, budbreak, variety]
    status: reviewed
    source_id: c06-0131
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which grouping best reflects broad differences in budbreak timing among these varieties?"
      choices:
        - { text: "Chardonnay and Pinot Noir generally earlier; Cabernet Sauvignon later", correct: true }
        - { text: "Cabernet Sauvignon and Pinot Noir generally earlier; Chardonnay later", correct: false }
        - { text: "Chardonnay and Cabernet Sauvignon generally earlier; Pinot Noir later", correct: false }
        - { text: "Cabernet Sauvignon generally earlier; Chardonnay and Pinot Noir later", correct: false }
      explanation: |
        Cultivar influences the heat requirement and timing of budbreak. Chardonnay and Pinot Noir
        tend to start early, which exposes them to spring frost in Chablis and Champagne, whereas
        Cabernet Sauvignon tends to start later. Site and season can shift the dates, and this
        comparison does not by itself predict the order of ripening.
    fr:
      question: "Quel regroupement reflète le mieux les écarts de date de débourrement entre ces cépages ?"
      choices:
        - { text: "Chardonnay et Pinot Noir plutôt précoces ; Cabernet Sauvignon plus tardif", correct: true }
        - { text: "Cabernet Sauvignon et Pinot Noir plutôt précoces ; Chardonnay plus tardif", correct: false }
        - { text: "Chardonnay et Cabernet Sauvignon plutôt précoces ; Pinot Noir plus tardif", correct: false }
        - { text: "Cabernet Sauvignon plutôt précoce ; Chardonnay et Pinot Noir plus tardifs", correct: false }
      explanation: |
        Le cépage influe sur les besoins en chaleur et la date du débourrement. Chardonnay et Pinot
        Noir démarrent tôt, ce qui les expose aux gelées de printemps à Chablis ou en Champagne ; le
        Cabernet Sauvignon débourre plus tard. Le site et l’année décalent les dates, et cet ordre ne
        prédit pas à lui seul l’ordre de maturité.

  - id: vm-green-shoot-positioning-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, canopy, trellis, shoot-positioning]
    status: reviewed
    source_id: c06-0137
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In a VSP block, what should determine the timing of each green-shoot-positioning pass?"
      choices:
        - { text: "Shoots reaching successive catch-wire levels while still flexible enough to guide", correct: true }
        - { text: "Primary buds reaching full budburst before the shoots begin rapid elongation", correct: false }
        - { text: "Inflorescences becoming visible while shoots remain below the catch wires", correct: false }
        - { text: "A fixed date after the local average last frost, set once for the whole estate", correct: false }
      explanation: |
        Positioning is triggered by canopy growth and trellis geometry, not one fixed phenological
        date. Shoots are guided as they reach successive catch wires, often in several passes around
        flowering and fruit set; exact timing varies with vigour, weather and trellis design.
    fr:
      question: "Dans une vigne palissée verticalement (VSP), qu’est-ce qui doit fixer le moment de chaque passage de relevage ?"
      choices:
        - { text: "L’arrivée des rameaux à chaque niveau de fils releveurs, tant qu’ils restent assez souples", correct: true }
        - { text: "Le débourrement complet des bourgeons principaux, avant que les rameaux ne s’allongent vite", correct: false }
        - { text: "L’apparition des inflorescences, tant que les rameaux restent sous les fils releveurs", correct: false }
        - { text: "Une date fixe après la dernière gelée moyenne locale, valable pour tout le domaine", correct: false }
      explanation: |
        Le relevage suit la pousse et la géométrie du palissage, pas un stade phénologique unique. On
        guide les rameaux à mesure qu’ils atteignent les fils successifs, souvent en plusieurs
        passages autour de la floraison et de la nouaison ; le calendrier exact dépend de la vigueur,
        de la météo et du palissage.

  - id: vm-millerandage-coulure-distinction-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, growth-cycle, fruit-set, millerandage, coulure]
    status: reviewed
    source_id: c06-0141
    review:
      fact_check: pass
      sources: [extension]
    en:
      question: "Which field observation most strongly distinguishes millerandage from coulure in a grapevine bunch?"
      choices:
        - { text: "The bunch contains normal berries alongside smaller, often seedless berries at different stages of maturity", correct: true }
        - { text: "Flowers or young berries abort, so the bunch carries fewer berries rather than a mixed berry population", correct: false }
        - { text: "Most berries set normally, but a shaded section of the bunch lags in ripening after véraison", correct: false }
        - { text: "Ripe berries split after rain, so damaged fruit shrivels while intact berries continue to ripen", correct: false }
      explanation: |
        Millerandage produces uneven berry development within one bunch. Deficient fertilisation can
        leave small berries with poorly developed seed traces, while some unfertilised ovaries may
        remain small and seedless; seedlessness is therefore common, not universal. Coulure instead
        removes potential fruit when flowers or young berries fall or fail to develop.
    fr:
      question: "Quelle observation au vignoble distingue le plus nettement le millerandage de la coulure dans une grappe ?"
      choices:
        - { text: "La grappe mêle des baies normales et des baies plus petites, souvent sans pépins, à des stades différents", correct: true }
        - { text: "Des fleurs ou de jeunes baies avortent : la grappe porte moins de baies, sans mélange de tailles", correct: false }
        - { text: "La plupart des baies nouent bien, mais une partie ombragée de la grappe mûrit en retard après la véraison", correct: false }
        - { text: "Des baies mûres éclatent après la pluie : les fruits abîmés se flétrissent, les autres continuent de mûrir", correct: false }
      explanation: |
        Le millerandage donne un développement inégal des baies dans une même grappe. Une
        fécondation incomplète laisse de petites baies aux pépins mal formés, et certains ovaires non
        fécondés restent petits et sans pépins : l’absence de pépins est fréquente, pas
        systématique. La coulure, elle, supprime des fruits quand les fleurs ou les jeunes baies
        tombent ou ne se développent pas.

  - id: vm-winter-freeze-damage-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, climate, winter-freeze, cold-injury]
    status: reviewed
    source_id: c06-0152
    review:
      fact_check: pass
      sources: [extension]
    en:
      question: "Which damage pattern is most characteristic of a severe winter freeze rather than a post-budbreak spring frost?"
      choices:
        - { text: "Injury to dormant buds and perennial wood, sometimes killing trunks or an exposed graft union", correct: true }
        - { text: "Death of tender green shoots and inflorescences after budbreak, with dormant wood largely spared", correct: false }
        - { text: "Disrupted fertilisation during flowering, leaving fewer berries but no direct injury to woody tissues", correct: false }
        - { text: "Berry splitting and greater rot pressure after heavy rain, with dormant buds and trunks remaining viable", correct: false }
      explanation: |
        Winter hardiness varies by cultivar and tissue. Temperatures below a vine's tolerance can
        kill dormant buds and injure the cambium of canes, trunks or the graft union, causing
        anything from loss of the next crop to retraining, replanting or vine death. Spring frost
        usually strikes after budbreak, when deacclimated green tissues are vulnerable at much less
        severe temperatures. In very cold regions such as Ontario, growers hill soil over the graft
        union in autumn to protect it.
    fr:
      question: "Quel type de dégât caractérise le mieux un gel d’hiver sévère, par opposition à une gelée de printemps après le débourrement ?"
      choices:
        - { text: "Bourgeons dormants et bois pérenne atteints, parfois jusqu’au tronc ou au point de greffe", correct: true }
        - { text: "Jeunes rameaux et inflorescences grillés après le débourrement, bois dormant largement épargné", correct: false }
        - { text: "Fécondation perturbée pendant la floraison : moins de baies, sans dégât direct sur le bois", correct: false }
        - { text: "Éclatement des baies et pourriture accrue après de fortes pluies, bourgeons et troncs restant viables", correct: false }
      explanation: |
        La résistance au froid varie selon le cépage et le tissu. Sous le seuil de tolérance du cep,
        le gel tue les bourgeons dormants et abîme le cambium des sarments, des troncs ou du point de
        greffe : de la perte de la récolte suivante jusqu’à la reformation du cep, la replantation ou
        la mort de la vigne. La gelée de printemps frappe surtout après le débourrement, quand les
        tissus verts, désendurcis, gèlent à des températures bien moins basses. Dans les régions très
        froides comme l’Ontario, on butte le point de greffe à l’automne pour le protéger.

  - id: vm-harvest-ripeness-monitoring-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, harvest, ripeness, sampling]
    status: reviewed
    source_id: c06-0159
    review:
      fact_check: pass
      sources: [extension]
    en:
      question: "Which monitoring plan gives the most defensible basis for deciding when to harvest a wine-grape block?"
      choices:
        - { text: "Repeat representative samples; track Brix, TA and pH; taste berries and check fruit health", correct: true }
        - { text: "Repeat samples from the ripest edge row; track Brix; pick at a fixed sugar target", correct: false }
        - { text: "Take one whole-cluster sample at véraison; measure Brix, TA and pH; project forward to harvest", correct: false }
        - { text: "Taste berries from roadside vines; judge colour and softness; skip lab analysis unless rot appears", correct: false }
      explanation: |
        Sampling berries across vines, clusters and canopy positions reduces selection bias, while
        repeated measurements show the direction of change. Brix, titratable acidity and pH track
        primary chemistry; tasting aromas, flavours, skins and seeds and checking berry condition
        add sensory, phenolic and sanitary information. The picking decision depends on variety,
        vintage risks and the intended wine style rather than one sugar number.
    fr:
      question: "Quel plan de suivi fonde le plus solidement la décision de vendanger une parcelle ?"
      choices:
        - { text: "Prélèvements représentatifs répétés ; suivi des sucres, de l’AT et du pH ; dégustation des baies et état sanitaire", correct: true }
        - { text: "Prélèvements répétés sur le rang de bordure le plus mûr ; suivi des sucres ; vendange à un seuil de sucre fixe", correct: false }
        - { text: "Une seule grappe prélevée à la véraison ; mesure des sucres, de l’AT et du pH ; projection jusqu’à la vendange", correct: false }
        - { text: "Dégustation de baies en bord de chemin ; couleur et souplesse ; pas d’analyse sauf apparition de pourriture", correct: false }
      explanation: |
        Prélever des baies sur plusieurs ceps, grappes et positions dans le feuillage limite les
        biais, et des mesures répétées montrent la tendance. Sucres, acidité totale et pH suivent la
        chimie de base ; goûter pulpe, pellicules et pépins et vérifier l’état sanitaire renseigne sur
        la maturité aromatique et phénolique. La date dépend du cépage, des risques du millésime et
        du style visé, pas d’un seul chiffre de sucre.

  - id: vm-premium-harvest-method-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, harvest, mechanisation, quality]
    status: reviewed
    source_id: c06-0169
    review:
      fact_check: pass
      sources: [extension, industry]
    en:
      question: "A premium still-wine producer has sound, evenly ripe fruit on level rows suited to a harvester. Which harvesting conclusion is best supported?"
      choices:
        - { text: "Machine harvesting suits the block, provided the fruit reaches the winery promptly", correct: true }
        - { text: "Hand harvesting is needed, because machine-picked fruit cannot be sorted afterwards", correct: false }
        - { text: "Hand harvesting is needed, because harvesters cannot work in the cool night hours", correct: false }
        - { text: "Machine harvesting suits the block, provided the fruit rests overnight before processing", correct: false }
      explanation: |
        Quality ambition alone does not dictate the picking method. Modern harvesters can work fast
        during cool night hours, and on-board or winery sorting can clean the load. Machine-picked
        fruit is partly broken, so delay invites oxidation and spoilage: prompt delivery matters.
        Hand picking remains preferable where steep access, bunch selection or intact whole bunches
        are integral to the production goal.
    fr:
      question: "Un producteur de vins tranquilles haut de gamme a des raisins sains, mûrs de façon homogène, sur des rangs plats adaptés à la machine. Quelle conclusion sur la vendange est la mieux fondée ?"
      choices:
        - { text: "La vendange mécanique convient, à condition que le raisin arrive vite au chai", correct: true }
        - { text: "La vendange manuelle s’impose, car le raisin récolté à la machine ne peut plus être trié", correct: false }
        - { text: "La vendange manuelle s’impose, car les machines ne peuvent pas travailler la nuit, au frais", correct: false }
        - { text: "La vendange mécanique convient, à condition de laisser le raisin reposer une nuit avant l’encuvage", correct: false }
      explanation: |
        L’ambition qualitative ne dicte pas à elle seule le mode de récolte. Les machines modernes
        travaillent vite pendant la fraîcheur de la nuit, et un tri embarqué ou au chai peut nettoyer
        la vendange. Le raisin récolté à la machine est en partie éclaté : toute attente favorise
        l’oxydation et les altérations, d’où l’importance d’une livraison rapide. La vendange
        manuelle reste préférable sur les pentes raides, pour les tris à la grappe ou quand le style
        exige des grappes entières.

  - id: vm-machine-harvest-fruit-fit-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, harvest, mechanisation, fruit-condition]
    status: reviewed
    source_id: c06-0171
    review:
      fact_check: pass
      sources: [extension, industry]
    en:
      question: "Which trial result makes a wine-grape block the strongest candidate for mechanical harvesting without excessive fruit damage?"
      choices:
        - { text: "Ripe berries detach at moderate settings with little rupture, and the fruit zone suits the picking head", correct: true }
        - { text: "Ripe berries detach easily but rupture extensively, although the existing trellis fits the picking head", correct: false }
        - { text: "Ripe berries detach with little rupture, but large cross-arms obstruct the picking head throughout the row", correct: false }
        - { text: "Ripe berries resist rupture but detach only at settings that damage vines and leave part of the crop", correct: false }
      explanation: |
        Mechanical suitability depends on a workable margin between the force needed to detach the
        berries and the force that ruptures them. Cultivar, maturity and fruit condition affect that
        margin, while trellis and canopy geometry must suit the picking head; machine settings then
        need matching to the block. These physical constraints are distinct from slope and access,
        the need for intact whole bunches, or subsequent MOG control.
    fr:
      question: "Quel résultat d’essai fait d’une parcelle la meilleure candidate à la vendange mécanique, sans abîmer excessivement le raisin ?"
      choices:
        - { text: "Les baies mûres se détachent à réglage modéré en éclatant peu, et la zone fructifère convient à la tête de récolte", correct: true }
        - { text: "Les baies mûres se détachent facilement mais éclatent beaucoup, même si le palissage convient à la tête de récolte", correct: false }
        - { text: "Les baies mûres se détachent en éclatant peu, mais de larges bras transversaux gênent la tête de récolte sur tout le rang", correct: false }
        - { text: "Les baies mûres éclatent peu mais ne se détachent qu’à des réglages qui abîment les ceps et laissent une partie de la récolte", correct: false }
      explanation: |
        L’aptitude à la machine dépend d’une marge entre la force qui détache les baies et celle qui
        les fait éclater. Cépage, maturité et état sanitaire jouent sur cette marge ; le palissage et
        le feuillage doivent convenir à la tête de récolte, puis on ajuste les réglages à la
        parcelle. Ces contraintes physiques sont distinctes de la pente et de l’accès, du besoin de
        grappes entières ou du tri des MOG par la suite.

  - id: vm-machine-harvest-mog-control-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, harvest, mechanisation, sorting]
    status: reviewed
    source_id: c06-0172
    review:
      fact_check: pass
      sources: [industry]
    en:
      question: "A machine-harvested load contains leaves and petioles as well as some damaged or diseased berries. Which response best controls the quality risk?"
      choices:
        - { text: "Tune settings and onboard cleaning, sort damaged berries at reception and pace picking to winery capacity", correct: true }
        - { text: "Raise the onboard fan speed to remove leaves and damaged berries, then send the load straight into tank", correct: false }
        - { text: "Run the harvester at full speed and leave all MOG and damaged berries to reception sorting", correct: false }
        - { text: "Lower shaker intensity to cut MOG, and skip reception sorting to save processing time", correct: false }
      explanation: |
        MOG means matter other than grapes, such as leaves, petioles, canes, wood or insects.
        Diseased or damaged berries are not MOG, but they add a separate quality risk that fans do
        not remove. Suitable harvester settings, onboard fans or sorting systems and reception-line
        sorting can all make the load cleaner. High throughput may create a winery bottleneck, but it
        does not make sorting categorically impossible.
    fr:
      question: "Une benne vendangée à la machine contient des feuilles et des pétioles, ainsi que des baies abîmées ou malades. Quelle réponse maîtrise le mieux le risque qualitatif ?"
      choices:
        - { text: "Régler machine et nettoyage embarqué, trier les baies abîmées à l’arrivée, adapter le débit au chai", correct: true }
        - { text: "Pousser les ventilateurs embarqués pour ôter feuilles et baies abîmées, puis envoyer la vendange droit en cuve", correct: false }
        - { text: "Vendanger à pleine vitesse et laisser tous les MOG et baies abîmées au tri de réception", correct: false }
        - { text: "Baisser l’intensité des secoueurs pour limiter les MOG et supprimer le tri de réception pour gagner du temps", correct: false }
      explanation: |
        Les MOG (matières autres que le raisin) désignent feuilles, pétioles, sarments, bois ou
        insectes. Les baies abîmées ou malades n’en font pas partie, mais posent un autre risque que
        les ventilateurs n’éliminent pas. Des réglages adaptés, des ventilateurs ou tables de tri
        embarqués et un tri à la réception rendent la vendange plus propre. Un débit trop élevé peut
        engorger le chai, sans rendre le tri impossible pour autant.

  - id: vm-machine-harvest-speed-window-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, harvest, mechanisation, weather]
    status: reviewed
    source_id: c06-0175
    review:
      fact_check: pass
      sources: [extension, industry]
    en:
      question: "A large, machine-accessible block is at target ripeness; heavy rain is forecast while warm weather is accelerating further ripening. Which advantage of machine harvesting matters most?"
      choices:
        - { text: "Clearing the block fast while the fruit stays in the harvest window", correct: true }
        - { text: "Selecting individual botrytised berries over several passes as their condition changes", correct: false }
        - { text: "Delivering intact whole bunches with stems for immediate whole-cluster pressing", correct: false }
        - { text: "Working steep terraces that standard over-row machines cannot safely enter", correct: false }
      explanation: |
        Machine harvesting can cover a large area quickly, which is valuable when rain threatens
        splitting, dilution or rot, or when fruit may soon move beyond the intended ripeness. The
        advantage depends on transport and winery capacity keeping pace with the harvester. It does
        not provide berry-by-berry selection, intact whole bunches or access to unsuitable terrain.
    fr:
      question: "Une grande parcelle accessible à la machine est à la maturité visée ; de fortes pluies sont annoncées et la chaleur accélère encore la maturation. Quel avantage de la vendange mécanique compte le plus ?"
      choices:
        - { text: "Vendanger vite la parcelle tant que le raisin reste à la maturité visée", correct: true }
        - { text: "Sélectionner une à une les baies botrytisées en plusieurs passages, selon leur état", correct: false }
        - { text: "Livrer des grappes entières et intactes, avec la rafle, pour un pressurage direct", correct: false }
        - { text: "Travailler des terrasses pentues où les enjambeurs classiques ne peuvent pas entrer", correct: false }
      explanation: |
        La machine couvre vite une grande surface, ce qui compte quand la pluie menace d’éclatement,
        de dilution ou de pourriture, ou quand le raisin risque de dépasser la maturité voulue.
        L’avantage suppose que le transport et le chai suivent le rythme. La machine ne permet ni le
        tri baie par baie, ni la livraison de grappes entières, ni l’accès aux terrains trop pentus.

  - id: vm-botrytised-fruit-handling-001
    type: mcq
    deck: Vineyard Management
    tags: [vineyard, harvest, noble-rot, handling]
    status: reviewed
    source_id: c06-0182
    review:
      fact_check: pass
      sources: [aoc-site, industry]
    en:
      question: "A producer wants to keep successive noble-rot selections separate, but the hand-picked berries are fragile and prone to leaking juice. Which transport plan is best?"
      choices:
        - { text: "Use separate shallow crates, avoid overfilling them and move each selection promptly with gentle handling", correct: true }
        - { text: "Use separate deep bins, fill them completely and move each selection promptly to reduce waiting time", correct: false }
        - { text: "Combine the selections in shallow crates, avoid overfilling them and sort the botrytis stages again at reception", correct: false }
        - { text: "Use separate shallow crates, hold them until picking ends and process all selections together as one lot", correct: false }
      explanation: |
        Botrytis perforates berry skins, and juice released from crushed fruit is vulnerable to
        oxidation and microbial deterioration. Small, shallow containers limit the weight pressing
        on the berries; gentle, prompt transport further reduces damage. Keeping the containers
        separate also preserves the picker's distinction between different stages or qualities of
        noble rot. Unlike Champagne handling, the aim here is not to retain whole bunches for white
        pressing but to protect fragile, selectively picked fruit and its lot identity.
    fr:
      question: "Un producteur veut garder séparées les tries successives de pourriture noble, mais les baies cueillies à la main sont fragiles et coulent facilement. Quel transport choisir ?"
      choices:
        - { text: "Des cagettes peu profondes et séparées, sans les remplir à ras bord, acheminées vite et avec douceur", correct: true }
        - { text: "Des bennes profondes et séparées, remplies à ras bord et acheminées vite pour limiter l’attente", correct: false }
        - { text: "Toutes les tries dans les mêmes cagettes peu profondes, sans les surcharger, puis un nouveau tri à la réception", correct: false }
        - { text: "Des cagettes peu profondes et séparées, gardées jusqu’à la fin de la cueillette puis pressées en un seul lot", correct: false }
      explanation: |
        Le botrytis perce la pellicule, et le jus des baies écrasées s’oxyde et s’altère vite. Des
        caisses petites et peu profondes limitent le poids qui pèse sur les baies ; un transport
        rapide et doux réduit encore les dégâts. Garder les caisses séparées préserve la distinction
        faite par le cueilleur entre stades ou qualités de pourriture noble. Contrairement à la
        Champagne, il ne s’agit pas de garder des grappes entières pour le pressurage, mais de
        protéger des baies fragiles, cueillies par tries, et l’identité de chaque lot.
