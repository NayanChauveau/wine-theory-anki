    source_id: c45-0021
    review:
      fact_check: pass
      sources: [trade-press, producer-site, liberty-wines-chambers-rosewood]
    en:
      question: "For the most luscious aged Muscats, how far may fermentation run before spirit is added?"
      choices:
        - { text: "To about 6–7% abv", correct: false }
        - { text: "To about 9–10% abv", correct: false }
        - { text: "To about 1–2% abv", correct: true }
        - { text: "To about 12% abv", correct: false }
      explanation: |
        Stopping so early keeps almost all the grape sugar. The neutral spirit then
        lifts the wine to a strength of roughly 17–18% abv.
    fr:
      question: "Pour les Muscats élevés les plus liquoreux, jusqu’où la fermentation peut-elle aller avant l’ajout d’alcool ?"
      choices:
        - { text: "Jusqu’à environ 6–7 % vol.", correct: false }
        - { text: "Jusqu’à environ 9–10 % vol.", correct: false }
        - { text: "Jusqu’à environ 1–2 % vol.", correct: true }
        - { text: "Jusqu’à environ 12 % vol.", correct: false }
      explanation: |
        Un arrêt aussi précoce conserve la quasi-totalité du sucre du raisin. L’eau-de-vie
        neutre porte ensuite le vin à environ 17–18 % vol.

  - id: fmuscat-aged-oxidative-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, maturation]
    status: reviewed
    source_id: c45-0022
    review:
      fact_check: pass
      sources: [known-fact, producer-site]
    en:
      question: "After fortification, what kind of maturation does a luscious Muscat made for long ageing undergo?"
      choices:
        - { text: "Ageing under flor for a few years", correct: false }
        - { text: "Bottle ageing soon after fortification", correct: false }
        - { text: "Oxidative ageing, sometimes for decades", correct: true }
        - { text: "Reductive ageing in sealed steel tanks", correct: false }
      explanation: |
        Many houses run a solera-like system, drawing off part of the oldest casks and
        refilling them with younger wine, so a bottle can contain material far older
        than its average age.
    fr:
      question: "Après le mutage, quel type d’élevage suit un Muscat liquoreux destiné à un long vieillissement ?"
      choices:
        - { text: "Un élevage sous voile pendant quelques années", correct: false }
        - { text: "Un vieillissement en bouteille peu après le mutage", correct: false }
        - { text: "Un élevage oxydatif, parfois pendant des décennies", correct: true }
        - { text: "Un élevage réducteur en cuves inox fermées", correct: false }
      explanation: |
        Beaucoup de maisons pratiquent un système proche de la solera : on soutire une
        partie des fûts les plus vieux et on les complète avec du vin plus jeune, si bien
        qu’une bouteille peut contenir des vins bien plus anciens que son âge moyen.

  - id: fmuscat-aged-vessels-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, maturation]
    status: reviewed
    source_id: c45-0023
    review:
      fact_check: pass
      sources: [known-fact, producer-site]
    en:
      question: "Which vessels are typical for maturing a luscious fortified Muscat over many years?"
      choices:
        - { text: "Small new oak barriques", correct: false }
        - { text: "Epoxy-lined concrete vats", correct: false }
        - { text: "Clay amphorae", correct: false }
        - { text: "Old oak casks, often large", correct: true }
      explanation: |
        Seasoned wood lets air in slowly without adding vanilla or toast. Over time
        the wine picks up the dry, nutty tang often called rancio.
    fr:
      question: "Quels contenants sont typiques pour élever un Muscat fortifié liquoreux pendant de nombreuses années ?"
      choices:
        - { text: "Petites barriques de chêne neuf", correct: false }
        - { text: "Cuves en béton revêtues d’époxy", correct: false }
        - { text: "Amphores en terre cuite", correct: false }
        - { text: "Fûts anciens, souvent grands", correct: true }
      explanation: |
        Le bois usagé laisse entrer l’air lentement sans apporter de vanille ni de toasté.
        Avec le temps, le vin prend une note sèche de noix, souvent appelée rancio.

