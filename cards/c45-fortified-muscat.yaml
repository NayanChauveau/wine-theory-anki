        - { text: "En jus, après un long débourbage à froid", correct: false }
      explanation: |
        Les pellicules apportent davantage d’arômes et de couleur ; avec une forme à peau
        rouge du Muscat à petits grains, c’est de là que vient la teinte rougeâtre du vin
        jeune.

  - id: fmuscat-early-fortify-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, winemaking]
