# yaml-language-server: $schema=../schema/cards.schema.json
# source: C45 (import/inbox/c45-fortified-muscat.yaml)
# deck: Fortified Muscat

cards:
  - id: fmuscat-family-traits-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, grapes]
    status: reviewed
    source_id: c45-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which pairing of acidity and aroma do the main Muscat grape varieties have in common?"
      choices:
        - { text: "Medium to high acidity, with citrus and green-apple aromas", correct: false }
        - { text: "Low to medium acidity, with orange-blossom and rose aromas", correct: true }
        - { text: "Low acidity, with lychee and sweet-spice aromas", correct: false }
        - { text: "Medium to high acidity, with honey and petrol-like aromas", correct: false }
      explanation: |
        The shared perfume comes from terpenes such as linalool and geraniol, which
        give Muscat wines their unmistakable smell of fresh grapes. Lychee and spice
        point to Gewurztraminer, petrol to aged Riesling.
    fr:
      question: "Quel couple acidité / arômes les principaux cépages Muscat ont-ils en commun ?"
      choices:
        - { text: "Acidité moyenne à élevée, arômes d’agrumes et de pomme verte", correct: false }
        - { text: "Acidité faible à moyenne, fleur d’oranger et rose", correct: true }
        - { text: "Acidité faible, arômes de litchi et d’épices douces", correct: false }
        - { text: "Acidité moyenne à élevée, arômes de miel et d’hydrocarbure", correct: false }
      explanation: |
        Ce parfum commun vient de terpènes comme le linalol et le géraniol, qui donnent
        aux Muscats leur odeur inimitable de raisin frais. Le litchi et les épices
        évoquent plutôt le Gewurztraminer, l’hydrocarbure un vieux Riesling.

  - id: fmuscat-climate-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, climate]
    status: reviewed
    source_id: c45-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which growing conditions generally suit Muscat grown for sweet fortified wine?"
      choices:
        - { text: "Cool, with a long and slow ripening season", correct: false }
        - { text: "Cool maritime, with frequent cloud cover", correct: false }
        - { text: "Warm to hot, with some cooling influence", correct: true }
        - { text: "Hot and dry, with little relief at night", correct: false }
      explanation: |
        Plenty of warmth is needed to build the high sugar these wines are made from.
        In the Vaucluse, for example, the vines of Beaumes-de-Venise climb the
        terraced slopes below the Dentelles de Montmirail.
    fr:
      question: "Quelles conditions de culture conviennent en général au Muscat destiné aux vins doux fortifiés ?"
      choices:
        - { text: "Fraîches, avec une maturation longue et lente", correct: false }
        - { text: "Maritimes et fraîches, souvent sous les nuages", correct: false }
        - { text: "Chaudes, tempérées par une influence fraîche", correct: true }
        - { text: "Très chaudes et sèches, sans répit la nuit", correct: false }
      explanation: |
        Il faut beaucoup de chaleur pour obtenir les fortes teneurs en sucre sur
        lesquelles reposent ces vins. Dans le Vaucluse, par exemple, les vignes de
        Beaumes-de-Venise grimpent sur les terrasses au pied des Dentelles de Montmirail.

  - id: fmuscat-cooling-benefit-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, climate]
    status: reviewed
    source_id: c45-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What does a cooling influence such as altitude or night breezes mainly do for ripening Muscat grapes?"
      choices:
        - { text: "Helps them keep acidity and aroma", correct: true }
        - { text: "Speeds up their sugar accumulation", correct: false }
        - { text: "Encourages noble rot on the bunches", correct: false }
        - { text: "Delays budburst past spring frosts", correct: false }
      explanation: |
        Sustained heat burns off malic acid through respiration and drives off
        volatile aroma compounds. Cooler nights slow both losses, so the grape keeps
        its freshness while the warm days still build sugar.
    fr:
      question: "Qu’apporte surtout une influence rafraîchissante, comme l’altitude ou les brises nocturnes, aux raisins de Muscat en maturation ?"
      choices:
        - { text: "Elle les aide à garder acidité et arômes", correct: true }
        - { text: "Elle accélère l’accumulation de leurs sucres", correct: false }
        - { text: "Elle favorise la pourriture noble des grappes", correct: false }
        - { text: "Elle retarde le débourrement après les gelées", correct: false }
      explanation: |
        Une chaleur continue consume l’acide malique par la respiration et fait s’échapper
        les composés aromatiques volatils. Des nuits plus fraîches freinent ces deux
        pertes : le raisin garde sa fraîcheur tandis que les journées chaudes continuent
        de produire du sucre.

  - id: fmuscat-young-profile-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, france, style]
    status: reviewed
    source_id: c45-0005
    review:
      fact_check: pass
      sources: [known-fact, inao-cdc-muscat-beaumes-de-venise]
    en:
      question: "Which profile best fits a young Muscat de Beaumes-de-Venise?"
      choices:
        - { text: "Deep amber, luscious, with raisin and toffee", correct: false }
        - { text: "Pale lemon, bone dry, with citrus and salt", correct: false }
        - { text: "Medium gold, sweet but rarely luscious, floral", correct: true }
        - { text: "Pale straw, off-dry, with bready yeast notes", correct: false }
      explanation: |
        It is a vin doux naturel bottled for its fresh grape perfume. A small share is
        rosé or red, made from the red-berried form of the same Muscat à Petits Grains.
    fr:
      question: "Quel profil correspond le mieux à un Muscat de Beaumes-de-Venise jeune ?"
      choices:
        - { text: "Ambre profond, liquoreux, notes de raisin sec et de caramel", correct: false }
        - { text: "Citron pâle, très sec, notes d’agrumes et de sel", correct: false }
        - { text: "Or moyen, doux mais rarement liquoreux, floral", correct: true }
        - { text: "Paille pâle, demi-sec, notes de levure et de pain", correct: false }
      explanation: |
        C’est un vin doux naturel (VDN) mis en bouteille pour son parfum de raisin frais.
        Une petite part est rosée ou rouge, issue de la forme à baies noires du même
        Muscat à petits grains.

  - id: fmuscat-young-aim-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, winemaking]
    status: reviewed
    source_id: c45-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the winemaker's main goal for a young, unaged fortified Muscat?"
      choices:
        - { text: "Nutty complexity from slow oxidation", correct: false }
        - { text: "Toasty richness from new oak barrels", correct: false }
        - { text: "Savoury texture from lees stirring", correct: false }
        - { text: "The purest possible varietal character", correct: true }
      explanation: |
        Every step serves the grape's own perfume, which fades with time. These wines
        are generally at their best within a few years of the vintage.
    fr:
      question: "Quel est le but premier du vinificateur pour un Muscat fortifié jeune, sans élevage ?"
      choices:
        - { text: "Une complexité de fruits secs née d’une lente oxydation", correct: false }
        - { text: "Une richesse toastée apportée par des fûts neufs", correct: false }
        - { text: "Une texture savoureuse obtenue par bâtonnage", correct: false }
        - { text: "Le caractère variétal le plus pur possible", correct: true }
      explanation: |
        Chaque étape sert le parfum propre du raisin, qui s’estompe avec le temps. Ces
        vins s’apprécient en général dans les quelques années qui suivent le millésime.

  - id: fmuscat-young-harvest-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, viticulture]
    status: reviewed
    source_id: c45-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When are grapes usually picked for a young, unaged fortified Muscat?"
      choices:
        - { text: "After partial raisining on the vine", correct: false }
        - { text: "When ripe and healthy, before shrivelling", correct: true }
        - { text: "Once noble rot has spread through the bunches", correct: false }
        - { text: "Slightly early, while acidity is still high", correct: false }
      explanation: |
        A warm site already delivers plenty of sugar at full ripeness, so there is no
        need to concentrate the berries further for this lighter, fresher style.
    fr:
      question: "Quand récolte-t-on d’ordinaire les raisins d’un Muscat fortifié jeune, sans élevage ?"
      choices:
        - { text: "Après un passerillage partiel sur pied", correct: false }
        - { text: "Mûrs et sains, avant qu’ils ne flétrissent", correct: true }
        - { text: "Une fois la pourriture noble installée", correct: false }
        - { text: "Un peu tôt, quand l’acidité est encore élevée", correct: false }
      explanation: |
        Un site chaud donne déjà beaucoup de sucre à pleine maturité : inutile de
        concentrer davantage les baies pour ce style plus léger et plus frais.

  - id: fmuscat-skin-contact-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, winemaking]
    status: reviewed
    source_id: c45-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Once the grapes reach the winery, how do makers of young fortified Muscat usually build aromatic intensity and richness?"
      choices:
        - { text: "Fermenting in new oak barrels", correct: false }
        - { text: "Full malolactic conversion before fortifying", correct: false }
        - { text: "Leaving the juice in contact with the skins", correct: true }
        - { text: "Stirring the lees after fortification", correct: false }
      explanation: |
        The skins also give a little phenolic texture to a wine that sees no oak. Some
        producers push the effect further by keeping the skins in through part of the
        fermentation.
    fr:
      question: "À la cave, comment les producteurs de Muscat fortifié jeune renforcent-ils en général l’intensité aromatique et la richesse ?"
      choices:
        - { text: "En fermentant en fûts de chêne neuf", correct: false }
        - { text: "Par une malolactique complète avant le mutage", correct: false }
        - { text: "Par une macération pelliculaire", correct: true }
        - { text: "Par un bâtonnage après le mutage", correct: false }
      explanation: |
        Les pellicules apportent aussi un peu de texture phénolique à un vin qui ne voit
        pas le bois. Certains producteurs vont plus loin en laissant les pellicules dans
        le moût pendant une partie de la fermentation.

  - id: fmuscat-young-ferment-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, winemaking]
    status: reviewed
    source_id: c45-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which fermentation regime suits a young fortified Muscat?"
      choices:
        - { text: "Warm, then fortified once the wine is dry", correct: false }
        - { text: "Cool, then fortified once the wine is dry", correct: false }
        - { text: "Warm, and stopped early by adding spirit", correct: false }
        - { text: "Cool, and stopped early by adding spirit", correct: true }
      explanation: |
        Low temperatures keep the volatile floral compounds in the wine instead of
        letting them escape with the carbon dioxide. The spirit goes in while much of
        the grape sugar is still unfermented.
    fr:
      question: "Quelle conduite de fermentation convient à un Muscat fortifié jeune ?"
      choices:
        - { text: "Chaude, puis mutage une fois le vin sec", correct: false }
        - { text: "Fraîche, puis mutage une fois le vin sec", correct: false }
        - { text: "Chaude, arrêtée tôt par ajout d’alcool", correct: false }
        - { text: "Fraîche, arrêtée tôt par ajout d’alcool", correct: true }
      explanation: |
        Les basses températures retiennent dans le vin les composés floraux volatils au
        lieu de les laisser partir avec le gaz carbonique. L’alcool est ajouté alors
        qu’une grande partie du sucre du raisin n’a pas encore fermenté.

  - id: fmuscat-vdn-spirit-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, france, winemaking]
    status: reviewed
    source_id: c45-0012
    review:
      fact_check: pass
      sources: [known-fact, inao-cdc-muscat-beaumes-de-venise]
    en:
      question: "What is added to fermenting Muscat to make a French vin doux naturel?"
      choices:
        - { text: "Aged grape brandy at about 40% abv", correct: false }
        - { text: "Neutral grape spirit, about 96% abv", correct: true }
        - { text: "Young grape spirit at about 77% abv", correct: false }
        - { text: "Distilled grape marc at about 60% abv", correct: false }
      explanation: |
        Spirit this strong does the job in a small dose, so the aromatic must is
        hardly diluted, and being neutral it adds no flavour to compete with the grape.
    fr:
      question: "Qu’ajoute-t-on au Muscat en fermentation pour élaborer un vin doux naturel (VDN) français ?"
      choices:
        - { text: "Eau-de-vie de vin vieillie en fût, à environ 40 % vol.", correct: false }
        - { text: "Alcool neutre de raisin, à environ 96 % vol.", correct: true }
        - { text: "Eau-de-vie de raisin jeune à environ 77 % vol.", correct: false }
        - { text: "Eau-de-vie de marc de raisin à environ 60 % vol.", correct: false }
      explanation: |
        Un alcool aussi fort agit à petite dose, ce qui dilue à peine le moût aromatique,
        et sa neutralité n’ajoute aucun goût qui concurrencerait le raisin.

  - id: fmuscat-young-storage-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, winemaking]
    status: reviewed
    source_id: c45-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is a young fortified Muscat kept between fortification and bottling so its primary fruit survives?"
      choices:
        - { text: "In new oak barriques, topped up", correct: false }
        - { text: "In glass demijohns left outdoors", correct: false }
        - { text: "In inert tanks, shielded from oxygen", correct: true }
        - { text: "In clay amphorae, left part-full", correct: false }
      explanation: |
        Even brief air contact dulls the floral top notes, so tanks are kept full or
        blanketed with inert gas. Demijohns in the sun are the opposite approach, used
        in Roussillon to build rancio character.
    fr:
      question: "Où conserve-t-on un Muscat fortifié jeune entre le mutage et la mise en bouteille, pour préserver son fruit primaire ?"
      choices:
        - { text: "En barriques neuves, ouillées", correct: false }
        - { text: "En bonbonnes de verre, en plein air", correct: false }
        - { text: "En cuves inertes, à l’abri de l’air", correct: true }
        - { text: "En amphores d’argile, à moitié vides", correct: false }
      explanation: |
        Même un bref contact avec l’air ternit les notes florales de tête : les cuves sont
        donc tenues pleines ou inertées. Les bonbonnes au soleil relèvent de la démarche
        inverse, pratiquée en Roussillon pour développer le rancio.

  - id: fmuscat-aged-profile-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, style]
    status: reviewed
    source_id: c45-0014
    review:
      fact_check: pass
      sources: [known-fact, producer-site, wine-australia-market-bulletin-65]
    en:
      question: "Which colour and sweetness range covers long-aged fortified Muscats?"
      choices:
        - { text: "Gold to amber, from off-dry to sweet", correct: false }
        - { text: "Amber to brown, from sweet to luscious", correct: true }
        - { text: "Tawny to brown, from dry to medium-sweet", correct: false }
        - { text: "Ruby to garnet, from sweet to luscious", correct: false }
      explanation: |
        Years in cask brown the wine and, through evaporation, concentrate it. The
        oldest, most luscious blends can hold well over 270 g/l of sugar.
    fr:
      question: "Quelle gamme de couleur et de sucrosité couvre les Muscats fortifiés de long élevage ?"
      choices:
        - { text: "De l’or à l’ambre, du demi-sec au doux", correct: false }
        - { text: "De l’ambre au brun, du doux au liquoreux", correct: true }
        - { text: "Du tuilé au brun, du sec au moelleux", correct: false }
        - { text: "Du rubis au grenat, du doux au liquoreux", correct: false }
      explanation: |
        Les années passées en fût brunissent le vin et, par évaporation, le concentrent.
        Les assemblages les plus vieux et les plus liquoreux peuvent dépasser largement
        270 g/l de sucre.

  - id: fmuscat-aged-setubal-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, portugal, style]
    status: reviewed
    source_id: c45-0015
    review:
      fact_check: pass
      sources: [known-fact, trade-press, decanter-do-setubal]
    en:
      question: "Which of these fortified Muscats is often aged for many years in wood before release?"
      choices:
        - { text: "Muscat de Beaumes-de-Venise", correct: false }
        - { text: "Moscatel de Valencia", correct: false }
        - { text: "Muscat de Saint-Jean-de-Minervois", correct: false }
        - { text: "Moscatel de Setúbal", correct: true }
      explanation: |
        After fortification the wine is usually left on its skins for several months,
        which deepens its aroma, then aged in cask; some older bottlings carry an
        age statement.
    fr:
      question: "Lequel de ces Muscats fortifiés est souvent élevé de nombreuses années sous bois avant sa commercialisation ?"
      choices:
        - { text: "Muscat de Beaumes-de-Venise", correct: false }
        - { text: "Moscatel de Valencia", correct: false }
        - { text: "Muscat de Saint-Jean-de-Minervois", correct: false }
        - { text: "Moscatel de Setúbal", correct: true }
      explanation: |
        Après le mutage, le vin reste en général plusieurs mois sur ses peaux, ce qui
        intensifie ses arômes, puis il est élevé en fût ; certaines cuvées plus anciennes
        portent une mention d’âge.

  - id: fmuscat-rutherglen-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, australia]
    status: reviewed
    source_id: c45-0016
    review:
      fact_check: pass
      sources: [known-fact, producer-site]
    en:
      question: "Which Australian region is most celebrated for luscious, long-aged fortified Muscat?"
      choices:
        - { text: "Barossa Valley", correct: false }
        - { text: "Rutherglen", correct: true }
        - { text: "Hunter Valley", correct: false }
        - { text: "Clare Valley", correct: false }
      explanation: |
        It lies in north-east Victoria near the Murray River. Houses such as Chambers
        Rosewood, Morris and Campbells keep stocks of old wine going back decades.
    fr:
      question: "Quelle région australienne est la plus réputée pour ses Muscats fortifiés liquoreux de long élevage ?"
      choices:
        - { text: "Barossa Valley", correct: false }
        - { text: "Rutherglen", correct: true }
        - { text: "Hunter Valley", correct: false }
        - { text: "Clare Valley", correct: false }
      explanation: |
        Elle se situe dans le nord-est du Victoria, près du fleuve Murray. Des maisons
        comme Chambers Rosewood, Morris et Campbells conservent des stocks de vins anciens
        remontant à plusieurs décennies.

  - id: fmuscat-rutherglen-style-levers-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, australia, winemaking]
    status: reviewed
    source_id: c45-0017
    review:
      fact_check: pass
      sources: [producer-site, wine-australia-market-bulletin-65]
    en:
      question: "Which set of decisions most shapes the style of a long-aged Australian fortified Muscat?"
      choices:
        - { text: "Clone choice, trellis type and irrigation regime", correct: false }
        - { text: "Yeast strain, oak origin and filtration", correct: false }
        - { text: "Pressing method, fining agent and closure", correct: false }
        - { text: "Picking date, fortification timing and ageing", correct: true }
      explanation: |
        Picking date sets how much sugar and grape character reach the winery, the
        moment of fortification decides how much of that sugar stays in the wine, and
        ageing builds colour, concentration and complexity. The Rutherglen, Classic,
        Grand and Rare tiers then grade the result largely by average age.
    fr:
      question: "Quel ensemble de décisions façonne le plus le style d’un Muscat fortifié australien de long élevage ?"
      choices:
        - { text: "Choix du clone, mode de palissage et régime d’irrigation", correct: false }
        - { text: "Souche de levure, origine du chêne et filtration", correct: false }
        - { text: "Mode de pressurage, collage et type de bouchage", correct: false }
        - { text: "Date de récolte, moment du mutage et élevage", correct: true }
      explanation: |
        La date de récolte fixe le sucre et le caractère du raisin qui arrivent au chai,
        le moment du mutage décide de la part de ce sucre qui reste dans le vin, et
        l’élevage construit couleur, concentration et complexité. Les niveaux Rutherglen,
        Classic, Grand et Rare classent ensuite le résultat surtout selon l’âge moyen.

  - id: fmuscat-luscious-raisining-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, viticulture]
    status: reviewed
    source_id: c45-0019
    review:
      fact_check: pass
      sources: [known-fact, trade-press]
    en:
      question: "How does the harvest for the most luscious aged Muscats usually differ from that for lighter styles?"
      choices:
        - { text: "Grapes are picked earlier to keep acidity", correct: false }
        - { text: "Some berries are left to shrivel on the vine", correct: true }
        - { text: "Bunches are held back until noble rot sets in", correct: false }
        - { text: "Grapes are frozen after picking to concentrate them", correct: false }
      explanation: |
        Losing water concentrates sugar and flavour in the berry. Growers often wait
        until only a share of the crop has started to raisin before picking.
    fr:
      question: "En quoi la récolte des Muscats élevés les plus liquoreux diffère-t-elle en général de celle des styles plus légers ?"
      choices:
        - { text: "On cueille plus tôt pour garder l’acidité", correct: false }
        - { text: "On laisse une partie des baies se flétrir sur pied", correct: true }
        - { text: "On attend que la pourriture noble s’installe", correct: false }
        - { text: "On congèle les raisins cueillis pour les concentrer", correct: false }
      explanation: |
        En perdant de l’eau, la baie concentre sucre et arômes. Les vignerons attendent
        souvent qu’une partie seulement de la récolte ait commencé à passeriller avant de
        vendanger.

  - id: fmuscat-raisining-risk-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, viticulture]
    status: reviewed
    source_id: c45-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What happens to a fortified Muscat when the grapes are heavily raisined before picking?"
      choices:
        - { text: "The must ends up too low in sugar", correct: false }
        - { text: "The wine loses much of its Muscat perfume", correct: true }
        - { text: "The wine takes on green, herbaceous notes", correct: false }
        - { text: "The colour turns pale and thin", correct: false }
      explanation: |
        Dried-fruit, cooked flavours take over from the floral grape notes. Producers
        aim for a balance, mixing shrivelled berries with plump ones.
    fr:
      question: "Qu’arrive-t-il à un Muscat fortifié quand les raisins sont fortement passerillés avant la récolte ?"
      choices:
        - { text: "Le moût finit trop pauvre en sucre", correct: false }
        - { text: "Le vin perd beaucoup de son parfum de Muscat", correct: true }
        - { text: "Le vin développe des notes vertes et herbacées", correct: false }
        - { text: "La robe devient pâle et manque d’éclat", correct: false }
      explanation: |
        Les arômes de fruits secs et de cuit prennent le pas sur les notes florales du
        raisin. Les producteurs cherchent l’équilibre en mêlant baies flétries et baies
        charnues.

  - id: fmuscat-aged-skins-001
    type: mcq
    deck: Fortified Muscat
    tags: [fortified-muscat, winemaking]
