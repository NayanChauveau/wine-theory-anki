# deck: Sparkling Production

cards:
  - id: sparkling-grape-profile-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, viticulture]
    status: reviewed
    source_id: c41-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which grape profile best suits a fresh, high-quality sparkling wine?
      choices:
        - { text: "High sugar, low acidity and jammy flavours", correct: false }
        - { text: "Low sugar, high acidity and ripe non-herbaceous flavours", correct: true }
        - { text: "High sugar, high tannin and dried-fruit flavours", correct: false }
        - { text: "Low sugar, low acidity and strongly vegetal flavours", correct: false }
      explanation: |
        A typical still base wine is around **10–11% abv** because the
        second fermentation adds roughly **1.2–1.3% abv**. Acidity supplies
        freshness, but flavour ripeness still matters: picking too early can
        leave overtly green notes.

    fr:
      question: Quel profil de raisin convient le mieux à un vin effervescent frais et de grande qualité ?
      choices:
        - { text: "Beaucoup de sucre, peu d’acidité et des arômes confiturés", correct: false }
        - { text: "Peu de sucre, beaucoup d’acidité et des arômes mûrs sans caractère herbacé", correct: true }
        - { text: "Beaucoup de sucre, beaucoup de tanins et des arômes de fruits secs", correct: false }
        - { text: "Peu de sucre, peu d’acidité et des arômes très végétaux", correct: false }
      explanation: |
        Un vin de base tranquille titre généralement autour de **10–11 % vol.**,
        car la seconde fermentation ajoute environ **1,2–1,3 % vol.** L’acidité
        apporte de la fraîcheur, mais la maturité aromatique reste essentielle :
        une vendange trop précoce peut laisser des notes franchement végétales.

  - id: sparkling-cool-climate-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, viticulture]
    status: reviewed
    source_id: c41-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do cool regions often suit grapes for sparkling wine?
      choices:
        - { text: "They preserve acidity while flavours ripen gradually", correct: true }
        - { text: "They lower acidity while flavours ripen gradually", correct: false }
        - { text: "They raise sugar rapidly while delaying flavour ripeness", correct: false }
        - { text: "They preserve acidity but keep flavours persistently herbaceous", correct: false }
      explanation: |
        Slow ripening gives growers a wider window in which sugar remains
        moderate and acidity stays high while unripe flavours diminish. In a
        warm region, sugar can rise and acidity can fall much faster.

    fr:
      question: Pourquoi les régions fraîches conviennent-elles souvent aux raisins destinés aux vins effervescents ?
      choices:
        - { text: "Elles préservent l’acidité tandis que les arômes mûrissent progressivement", correct: true }
        - { text: "Elles font baisser l’acidité tandis que les arômes mûrissent progressivement", correct: false }
        - { text: "Elles font monter rapidement le sucre tout en retardant la maturité aromatique", correct: false }
        - { text: "Elles préservent l’acidité mais maintiennent durablement des arômes herbacés", correct: false }
      explanation: |
        La maturation lente offre une fenêtre plus large pendant laquelle le
        sucre reste modéré et l’acidité élevée, tandis que les arômes végétaux
        s’atténuent. En région chaude, le sucre peut monter et l’acidité chuter
        beaucoup plus rapidement.

  - id: sparkling-warm-region-pick-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, viticulture]
    status: reviewed
    source_id: c41-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When sparkling-wine grapes are picked early in a warm region to retain acidity, what is the main risk?
      choices:
        - { text: "Excessively high potential alcohol", correct: false }
        - { text: "Green and herbaceous flavours", correct: true }
        - { text: "Very low acidity in the juice", correct: false }
        - { text: "Overripe and dried-fruit flavours", correct: false }
      explanation: |
        Early harvest can retain the low potential alcohol and high acidity
        needed for a base wine. The risk is that flavour development lags
        behind those analytical targets.

    fr:
      question: Lorsque des raisins pour effervescents sont vendangés tôt en région chaude afin de préserver l’acidité, quel est le principal risque ?
      choices:
        - { text: "Un degré alcoolique potentiel excessif", correct: false }
        - { text: "Des arômes verts et herbacés", correct: true }
        - { text: "Une acidité très faible dans le jus", correct: false }
        - { text: "Des arômes surmûris et de fruits secs", correct: false }
      explanation: |
        Une vendange précoce peut préserver le faible degré potentiel et
        l’acidité élevée recherchés dans un vin de base. Le risque est que la
        maturité aromatique n’ait pas encore rattrapé ces paramètres analytiques.

  - id: sparkling-harvest-method-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, viticulture]
    status: reviewed
    source_id: c41-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which harvest approach is most typical for premium traditional-method sparkling wine?
      choices:
        - { text: "Machine harvest to gather grapes as rapidly as possible", correct: false }
        - { text: "Hand harvest to deliver intact bunches", correct: true }
        - { text: "Late hand harvest to concentrate sugar", correct: false }
        - { text: "Selective hand harvest of only the ripest berries", correct: false }
      explanation: |
        Intact bunches and berries help limit skin contact before pressing.
        Machine harvesting can still be an efficient choice for inexpensive
        sparkling wine in warm areas where fruit must be gathered quickly.

    fr:
      question: Quel mode de vendange est le plus courant pour un effervescent haut de gamme élaboré par méthode traditionnelle ?
      choices:
        - { text: "Une vendange mécanique pour ramasser le plus vite possible", correct: false }
        - { text: "Une vendange manuelle pour livrer des grappes intactes", correct: true }
        - { text: "Une vendange manuelle tardive pour concentrer le sucre", correct: false }
        - { text: "Une vendange manuelle ne retenant que les baies les plus mûres", correct: false }
      explanation: |
        Des grappes et des baies intactes limitent le contact avec les peaux
        avant le pressurage. La vendange mécanique peut néanmoins être efficace
        pour des effervescents bon marché en région chaude, quand il faut
        ramasser rapidement.

  - id: sparkling-pressing-gentle-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, winemaking]
    status: reviewed
    source_id: c41-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are grapes commonly handled on arrival for a white sparkling base wine?
      choices:
        - { text: "Crushed, macerated and pressed at high pressure", correct: false }
        - { text: "Pressed promptly and gently, often as whole bunches", correct: true }
        - { text: "Destemmed and held warm before pressing", correct: false }
        - { text: "Dried after crushing and pressed several weeks later", correct: false }
      explanation: |
        Prompt, gentle pressing limits extraction of **colour and tannin**.
        That is especially important when black grapes are used to make a
        white sparkling wine.

    fr:
      question: Comment traite-t-on généralement les raisins à leur arrivée pour élaborer un vin de base effervescent blanc ?
      choices:
        - { text: "Ils sont foulés, macérés puis pressés à forte pression", correct: false }
        - { text: "Ils sont pressés rapidement et délicatement, souvent en grappes entières", correct: true }
        - { text: "Ils sont éraflés puis maintenus au chaud avant le pressurage", correct: false }
        - { text: "Ils sont séchés après foulage puis pressés plusieurs semaines plus tard", correct: false }
      explanation: |
        Un pressurage rapide et délicat limite l’extraction de **couleur et de
        tanins**. C’est particulièrement important lorsque des raisins noirs
        servent à produire un vin effervescent blanc.

  - id: sparkling-pressing-law-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, law, winemaking]
    status: reviewed
    source_id: c41-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which pressing parameter may be limited by a sparkling-wine appellation?
      choices:
        - { text: "The minimum skin-contact time and final juice colour", correct: false }
        - { text: "The maximum pressure and juice yield from a given grape weight", correct: true }
        - { text: "The required number and duration of individual press cycles", correct: false }
        - { text: "The permitted press type and minimum whole-bunch proportion", correct: false }
      explanation: |
        Yield limits discourage hard pressing for extra juice. Later press
        fractions generally contain more phenolics and may be less suitable
        for the finest white sparkling wines.

    fr:
      question: Quel paramètre de pressurage peut être limité par une appellation de vin effervescent ?
      choices:
        - { text: "La durée minimale de macération et la couleur finale du jus", correct: false }
        - { text: "La pression maximale et le rendement en jus pour un poids donné de raisins", correct: true }
        - { text: "Le nombre et la durée imposés de chaque cycle de pressurage", correct: false }
        - { text: "Le type de pressoir autorisé et la part minimale de grappes entières", correct: false }
      explanation: |
        Les limites de rendement découragent un pressurage trop poussé pour
        extraire davantage de jus. Les dernières fractions contiennent
        généralement plus de composés phénoliques et conviennent moins aux
        meilleurs effervescents blancs.

  - id: sparkling-five-methods-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, winemaking]
    status: reviewed
    source_id: c41-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which sparkling-wine production route creates bubbles by injecting carbon dioxide?
      choices:
        - { text: "Carbonation", correct: true }
        - { text: "Traditional method", correct: false }
        - { text: "Transfer method", correct: false }
        - { text: "Tank method", correct: false }
      explanation: |
        Traditional, transfer, tank and Asti methods all capture carbon
        dioxide produced by fermentation. Direct carbonation is the route
        that instead injects the gas into a still wine.

    fr:
      question: Quelle méthode d’élaboration crée les bulles en injectant du dioxyde de carbone ?
      choices:
        - { text: "La gazéification", correct: true }
        - { text: "La méthode traditionnelle", correct: false }
        - { text: "La méthode par transfert", correct: false }
        - { text: "La méthode en cuve close", correct: false }
      explanation: |
        Les méthodes traditionnelle, par transfert, en cuve close et Asti
        captent toutes le dioxyde de carbone produit par une fermentation. La
        gazéification l’injecte au contraire directement dans un vin tranquille.

  - id: sparkling-method-choice-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, winemaking]
    status: reviewed
    source_id: c41-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What most directly determines a producer’s choice of sparkling-wine method?
      choices:
        - { text: "Vineyard yield, vine age and harvest-team size", correct: false }
        - { text: "Applicable law, intended style and production cost", correct: true }
        - { text: "Base-wine colour, vineyard slope and bottle capacity", correct: false }
        - { text: "Press-cycle length, cellar humidity and closure supplier", correct: false }
      explanation: |
        European appellation rules may prescribe a method. Where the law
        allows a choice, desired flavour, production time, scale and price
        position all influence the decision.

    fr:
      question: Qu’est-ce qui détermine le plus directement le choix d’une méthode d’élaboration des vins effervescents ?
      choices:
        - { text: "Le rendement, l’âge des vignes et la taille de l’équipe de vendange", correct: false }
        - { text: "La réglementation, le style recherché et le coût de production", correct: true }
        - { text: "La couleur du vin de base, la pente et la contenance de la bouteille", correct: false }
        - { text: "La durée du pressurage, l’humidité de la cave et le fournisseur de bouchons", correct: false }
      explanation: |
        Une appellation européenne peut imposer une méthode. Lorsque le choix
        reste libre, le profil aromatique recherché, la durée de production,
        l’échelle et le positionnement tarifaire entrent aussi en jeu.

  - id: sparkling-traditional-definition-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What defines the traditional method of sparkling-wine production?
      choices:
        - { text: "The wine is carbonated immediately before bottling", correct: false }
        - { text: "Second fermentation occurs in the bottle eventually sold", correct: true }
        - { text: "Second fermentation occurs in a sealed pressure tank", correct: false }
        - { text: "Fermenting wine is filtered into a different bottle", correct: false }
      explanation: |
        The bottle used for the second fermentation remains the final bottle;
        riddling and disgorgement remove its yeast sediment. This labour- and
        time-intensive route is associated with many premium sparkling wines.

    fr:
      question: Qu’est-ce qui définit la méthode traditionnelle d’élaboration d’un vin effervescent ?
      choices:
        - { text: "Le vin est gazéifié juste avant la mise en bouteille", correct: false }
        - { text: "La seconde fermentation a lieu dans la bouteille ensuite commercialisée", correct: true }
        - { text: "La seconde fermentation a lieu dans une cuve close sous pression", correct: false }
        - { text: "Le vin en fermentation est filtré puis transféré dans une autre bouteille", correct: false }
      explanation: |
        La bouteille de la seconde fermentation reste la bouteille finale ; le
        remuage puis le dégorgement permettent d’en retirer le dépôt de levures.
        Cette voie longue et exigeante en main-d’œuvre est associée à de
        nombreux effervescents haut de gamme.

  - id: sparkling-traditional-economics-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which commercial trade-off is typical of the traditional method?
      choices:
        - { text: "Low production cost but little control over pressure", correct: false }
        - { text: "High time and labour costs but strong price potential", correct: true }
        - { text: "Short production time but compulsory long tank ageing", correct: false }
        - { text: "Low labour needs but mandatory hand bottling", correct: false }
      explanation: |
        Extended cellar storage and bottle-by-bottle sediment removal tie up
        capital and add cost. Premium positioning can compensate by allowing
        the finished wines to command higher prices.

    fr:
      question: Quel compromis économique caractérise généralement la méthode traditionnelle ?
      choices:
        - { text: "Un faible coût de production mais peu de maîtrise de la pression", correct: false }
        - { text: "Des coûts élevés, compensés par un potentiel de prix supérieur", correct: true }
        - { text: "Une production rapide mais un long élevage en cuve obligatoire", correct: false }
        - { text: "Peu de main-d’œuvre mais une mise en bouteille manuelle obligatoire", correct: false }
      explanation: |
        Le long stockage en cave et l’élimination du dépôt bouteille par
        bouteille immobilisent du capital et augmentent les coûts. Un
        positionnement haut de gamme peut les compenser par des prix plus élevés.

  - id: sparkling-traditional-sequence-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0020
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which sequence correctly follows preparation of a traditional-method blend?
      choices:
        - { text: "Riddling → tirage → second fermentation → disgorgement", correct: false }
        - { text: "Tirage → second fermentation → lees ageing → riddling → disgorgement", correct: true }
        - { text: "Disgorgement → lees ageing → tirage → second fermentation", correct: false }
        - { text: "Second fermentation → tirage → riddling → lees ageing", correct: false }
      explanation: |
        After disgorgement, the bottle is topped up, closed with its final
        cork and may receive further bottle ageing before release.

    fr:
      question: Quel enchaînement suit correctement la préparation d’un assemblage destiné à la méthode traditionnelle ?
      choices:
        - { text: "Remuage → tirage → seconde fermentation → dégorgement", correct: false }
        - { text: "Tirage → seconde fermentation → élevage sur lies → remuage → dégorgement", correct: true }
        - { text: "Dégorgement → élevage sur lies → tirage → seconde fermentation", correct: false }
        - { text: "Seconde fermentation → tirage → remuage → élevage sur lies", correct: false }
      explanation: |
        Après le dégorgement, la bouteille est complétée, fermée avec son
        bouchon définitif puis peut encore vieillir en bouteille avant sa
        commercialisation.

  - id: sparkling-base-fermentation-vessel-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, winemaking]
    status: reviewed
    source_id: c41-0021
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does primary fermentation most commonly occur for a traditional-method base wine?
      choices:
        - { text: "In large, old oak vats", correct: false }
        - { text: "In temperature-controlled stainless-steel tanks", correct: true }
        - { text: "In small, new oak barrels", correct: false }
        - { text: "In temperature-controlled concrete vessels", correct: false }
      explanation: |
        Stainless steel helps retain a neutral, fresh base. Some producers
        ferment a portion in oak vats or barrels to add texture and flavour.

    fr:
      question: Où se déroule le plus souvent la première fermentation d’un vin de base destiné à la méthode traditionnelle ?
      choices:
        - { text: "Dans de grands foudres anciens", correct: false }
        - { text: "Dans des cuves inox thermorégulées", correct: true }
        - { text: "Dans de petites barriques neuves", correct: false }
        - { text: "Dans des cuves en béton thermorégulées", correct: false }
      explanation: |
        L’inox aide à préserver un vin de base neutre et frais. Certains
        producteurs ferment néanmoins une partie de leurs vins en foudres ou
        en barriques pour apporter texture et arômes.

  - id: sparkling-base-wine-profile-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, winemaking]
    status: reviewed
    source_id: c41-0022
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the usual profile of a base wine before traditional-method secondary fermentation?
      choices:
        - { text: "Sweet, aromatic and low in acidity", correct: false }
        - { text: "Dry, fairly neutral and high in acidity", correct: true }
        - { text: "Oxidative, fortified and high in tannin", correct: false }
        - { text: "Off-dry, deeply coloured and low in alcohol", correct: false }
      explanation: |
        The base wine can taste lean on its own. Secondary fermentation,
        lees ageing and dosage later build texture and balance while the
        starting acidity preserves freshness.

    fr:
      question: Quel est le profil habituel d’un vin de base avant la seconde fermentation en méthode traditionnelle ?
      choices:
        - { text: "Doux, aromatique et peu acide", correct: false }
        - { text: "Sec, assez neutre et doté d’une acidité élevée", correct: true }
        - { text: "Oxydatif, muté et fortement tannique", correct: false }
        - { text: "Demi-sec, très coloré et peu alcoolisé", correct: false }
      explanation: |
        Le vin de base peut sembler maigre lorsqu’il est dégusté seul. La
        seconde fermentation, l’élevage sur lies et le dosage développeront
        ensuite la texture et l’équilibre, tandis que l’acidité initiale
        préservera la fraîcheur.

  - id: sparkling-base-wine-options-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, winemaking]
    status: reviewed
    source_id: c41-0023
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which choices can shape a base wine before blending and secondary fermentation?
      choices:
        - { text: "Malolactic conversion and maturation in oak", correct: true }
        - { text: "Disgorgement and final corking", correct: false }
        - { text: "Riddling and addition of expedition liqueur", correct: false }
        - { text: "Carbonation and immediate retail release", correct: false }
      explanation: |
        Malolactic conversion softens acidity and can add buttery notes;
        oak can contribute texture and spice. Producers may use either,
        both or neither according to the intended style.

    fr:
      question: Quels choix peuvent façonner un vin de base avant l’assemblage et la seconde fermentation ?
      choices:
        - { text: "La fermentation malolactique et l’élevage sous bois", correct: true }
        - { text: "Le dégorgement et le bouchage définitif", correct: false }
        - { text: "Le remuage et l’ajout de liqueur d’expédition", correct: false }
        - { text: "La gazéification et une commercialisation immédiate", correct: false }
      explanation: |
        La fermentation malolactique assouplit l’acidité et peut apporter des
        notes beurrées ; le bois peut donner de la texture et des épices. Le
        producteur peut retenir l’une de ces options, les deux, ou aucune,
        selon le style recherché.

  - id: sparkling-reserve-wine-use-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, blending]
    status: reviewed
    source_id: c41-0024
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why might a producer retain some sparkling base wine beyond the following year?
      choices:
        - { text: "To use it as a reserve component in later blends", correct: true }
        - { text: "To make its acidity increase through bottle pressure", correct: false }
        - { text: "To replace yeast during the next primary fermentation", correct: false }
        - { text: "To make later blends depend on a single harvest", correct: false }
      explanation: |
        Most base wine is used relatively soon, while retained parcels broaden
        the blending palette in later years and help reduce vintage variation.

    fr:
      question: Pourquoi un producteur conserve-t-il parfois une partie de son vin de base au-delà de l’année suivante ?
      choices:
        - { text: "Pour l’utiliser comme vin de réserve dans de futurs assemblages", correct: true }
        - { text: "Pour augmenter la pression finale grâce au vieillissement", correct: false }
        - { text: "Pour remplacer les levures lors de la prochaine première fermentation", correct: false }
        - { text: "Pour faire dépendre les assemblages futurs d’une seule récolte", correct: false }
      explanation: |
        La plupart des vins de base sont utilisés assez rapidement, tandis que
        les lots conservés élargissent la palette d’assemblage des années
        suivantes et atténuent les variations entre millésimes.

  - id: sparkling-blending-goals-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, blending]
    status: reviewed
    source_id: c41-0025
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What are the main aims of blending base wines for sparkling production?
      choices:
        - { text: "Higher pressure, darker colour and greater sweetness", correct: false }
        - { text: "Consistent style, improved balance and added complexity", correct: true }
        - { text: "Lower acidity, faster harvest and reduced bottle weight", correct: false }
        - { text: "Earlier disgorgement, stronger tannin and higher yield", correct: false }
      explanation: |
        A producer can combine varieties, vineyards, vintages and winemaking
        treatments. This is particularly important when a recognisable house
        style must be maintained despite annual variation.

    fr:
      question: Quels sont les principaux objectifs de l’assemblage des vins de base destinés aux effervescents ?
      choices:
        - { text: "Plus de pression, une couleur plus sombre et davantage de sucre", correct: false }
        - { text: "Un style régulier, un meilleur équilibre et plus de complexité", correct: true }
        - { text: "Moins d’acidité, une vendange plus rapide et une bouteille plus légère", correct: false }
        - { text: "Un dégorgement plus précoce, plus de tanins et un rendement supérieur", correct: false }
      explanation: |
        Le producteur peut combiner cépages, origines, années et choix de
        vinification. C’est particulièrement important lorsqu’il cherche à
        maintenir un style maison reconnaissable malgré la variation des
        millésimes.

  - id: sparkling-chardonnay-pinot-blend-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, blending, grapes]
    status: reviewed
    source_id: c41-0026
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which contribution is conventionally associated with Chardonnay and Pinot Noir in a sparkling blend?
      choices:
        - { text: "Chardonnay: red fruit and body; Pinot Noir: citrus and finesse", correct: false }
        - { text: "Chardonnay: citrus and finesse; Pinot Noir: red fruit and body", correct: true }
        - { text: "Chardonnay: tannin and spice; Pinot Noir: floral sweetness", correct: false }
        - { text: "Chardonnay: dried fruit; Pinot Noir: herbal acidity", correct: false }
      explanation: |
        Chardonnay is also associated with longevity, while Pinot Noir can
        strengthen structure. These are useful blending tendencies rather
        than fixed outcomes for every parcel.

    fr:
      question: Quelle contribution associe-t-on traditionnellement au Chardonnay et au Pinot Noir dans un assemblage effervescent ?
      choices:
        - { text: "Chardonnay : fruits rouges et corps ; Pinot Noir : agrumes et finesse", correct: false }
        - { text: "Chardonnay : agrumes et finesse ; Pinot Noir : fruits rouges et corps", correct: true }
        - { text: "Chardonnay : tanins et épices ; Pinot Noir : douceur florale", correct: false }
        - { text: "Chardonnay : fruits secs ; Pinot Noir : acidité herbacée", correct: false }
      explanation: |
        Le Chardonnay est également associé à la longévité, tandis que le
        Pinot Noir peut renforcer la structure. Ce sont des tendances utiles
        pour l’assemblage, pas des résultats immuables pour chaque lot.

  - id: sparkling-old-reserve-flavour-001
    type: mcq
