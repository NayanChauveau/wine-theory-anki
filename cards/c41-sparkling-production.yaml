        - { text: "Primary green-herb flavours", correct: false }
        - { text: "Newly extracted grape tannin", correct: false }
      explanation: |
        Mature reserve material adds an evolved layer that a young base wine
        cannot supply, making the final blend more complex and helping define
        a producer’s style.

    fr:
      question: Que peut apporter un vin de réserve âgé à un assemblage effervescent ?
      choices:
        - { text: "Des arômes évolués de fruits secs", correct: true }
        - { text: "Des arômes de banane tout juste fermentée", correct: false }
        - { text: "Des arômes végétaux primaires", correct: false }
        - { text: "Des tanins nouvellement extraits des raisins", correct: false }
      explanation: |
        Un vin de réserve évolué apporte une dimension qu’un jeune vin de base
        ne peut pas fournir. Il complexifie l’assemblage final et contribue à
        définir le style du producteur.

  - id: sparkling-oak-component-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, blending]
    status: reviewed
    source_id: c41-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which blending component can add breadth and spice to a sparkling wine?
      choices:
        - { text: "A parcel matured in oak", correct: true }
        - { text: "A young parcel fermented in stainless steel", correct: false }
        - { text: "A later press fraction rich in phenolics", correct: false }
        - { text: "A high-acid parcel matured without oxygen", correct: false }
      explanation: |
        Oak-matured wine is generally one component rather than the entire
        blend, allowing texture and spice to be introduced without masking
        freshness.

    fr:
      question: Quel composant d’assemblage peut apporter de l’ampleur et des notes épicées à un vin effervescent ?
      choices:
        - { text: "Un lot élevé sous bois", correct: true }
        - { text: "Un jeune lot fermenté en cuve inox", correct: false }
        - { text: "Une fraction de presse tardive riche en composés phénoliques", correct: false }
        - { text: "Un lot très acide élevé à l’abri de l’oxygène", correct: false }
      explanation: |
        Le vin élevé sous bois ne représente généralement qu’une partie de
        l’assemblage. Il apporte ainsi texture et épices sans masquer la
        fraîcheur.

  - id: sparkling-parcel-fermentation-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, blending]
    status: reviewed
    source_id: c41-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How can a sparkling-wine producer maximise later blending options?
      choices:
        - { text: "Co-ferment parcels from different sites at harvest", correct: false }
        - { text: "Ferment many grape parcels separately", correct: true }
        - { text: "Blend all reserve wines before assessing the new vintage", correct: false }
        - { text: "Use one fermentation vessel for each grape variety", correct: false }
      explanation: |
        Separate lots preserve differences in variety, origin and treatment.
        The blender can then select among them for balance, complexity and
        stylistic consistency.

    fr:
      question: Comment un producteur d’effervescents peut-il multiplier ses possibilités d’assemblage ?
      choices:
        - { text: "Cofermenter dès la vendange des parcelles de sites différents", correct: false }
        - { text: "Fermenter séparément de nombreux lots de raisins", correct: true }
        - { text: "Assembler tous les vins de réserve avant d’évaluer la nouvelle récolte", correct: false }
        - { text: "N’utiliser qu’une cuve de fermentation par cépage", correct: false }
      explanation: |
        La séparation des lots préserve les différences de cépage, d’origine
        et de vinification. L’assembleur peut ensuite choisir parmi eux pour
        obtenir équilibre, complexité et régularité stylistique.

  - id: sparkling-tirage-contents-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0031
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the liqueur de tirage add to a traditional-method blend?
      choices:
        - { text: "Wine, sugar, yeast, nutrients and a clarifying agent", correct: true }
        - { text: "Wine, dosage syrup, sulphur dioxide and oak extract", correct: false }
        - { text: "Grape spirit, sugar, tannin and a colouring agent", correct: false }
        - { text: "Reserve wine, carbon dioxide, acid and bentonite only", correct: false }
      explanation: |
        The sugar and yeast initiate the bottle fermentation. The clarifying
        aid helps the resulting sediment move cleanly during riddling.

    fr:
      question: Qu’apporte la liqueur de tirage à un assemblage destiné à la méthode traditionnelle ?
      choices:
        - { text: "Du vin, du sucre, des levures, des nutriments et un agent de clarification", correct: true }
        - { text: "Du vin, une liqueur de dosage, du dioxyde de soufre et un extrait de chêne", correct: false }
        - { text: "De l’alcool vinique, du sucre, des tanins et un colorant", correct: false }
        - { text: "Du vin de réserve, du dioxyde de carbone, de l’acide et uniquement de la bentonite", correct: false }
      explanation: |
        Le sucre et les levures déclenchent la prise de mousse en bouteille.
        L’agent de clarification aide ensuite le dépôt à se déplacer proprement
        pendant le remuage.

  - id: sparkling-second-fermentation-setup-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0032
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which setup allows traditional-method secondary fermentation to proceed?
      choices:
        - { text: "Upright crown-capped bottles in a warm cellar", correct: false }
        - { text: "Horizontal crown-capped bottles in a cool, steady cellar", correct: true }
        - { text: "Horizontal cork-sealed bottles in a cool, steady cellar", correct: false }
        - { text: "Inverted crown-capped bottles in a warm cellar", correct: false }
      explanation: |
        A small plastic cup inside the crown cap later receives the yeast
        sediment. Cool, constant conditions favour a slow, controlled
        fermentation and maturation.

    fr:
      question: Quelles conditions permettent la prise de mousse en méthode traditionnelle ?
      choices:
        - { text: "Des bouteilles debout sous capsule couronne dans une cave chaude", correct: false }
        - { text: "Des bouteilles couchées sous capsule couronne dans une cave fraîche et stable", correct: true }
        - { text: "Des bouteilles couchées sous bouchon définitif dans une cave fraîche et stable", correct: false }
        - { text: "Des bouteilles renversées sous capsule couronne dans une cave chaude", correct: false }
      explanation: |
        Le petit obturateur en plastique placé sous la capsule recueillera plus
        tard le dépôt de levures. Des conditions fraîches et constantes
        favorisent une fermentation et une maturation lentes et maîtrisées.

  - id: sparkling-second-fermentation-result-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0033
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What changes during traditional-method secondary fermentation in bottle?
      choices:
        - { text: "Alcohol falls while dissolved carbon dioxide builds pressure", correct: false }
        - { text: "Alcohol rises while dissolved carbon dioxide builds pressure", correct: true }
        - { text: "Alcohol stays stable while injected carbon dioxide builds pressure", correct: false }
        - { text: "Alcohol rises while carbon dioxide escapes before bottling", correct: false }
      explanation: |
        Fermentation adds about **1.2–1.3% abv** and produces carbon dioxide
        that cannot escape. The finished pressure is typically around
        **five to six atmospheres**.

    fr:
      question: Que se passe-t-il pendant la prise de mousse en bouteille selon la méthode traditionnelle ?
      choices:
        - { text: "Le degré baisse tandis que le dioxyde de carbone dissous crée la pression", correct: false }
        - { text: "Le degré monte tandis que le dioxyde de carbone dissous crée la pression", correct: true }
        - { text: "Le degré reste stable tandis que du dioxyde de carbone injecté crée la pression", correct: false }
        - { text: "Le degré monte tandis que le dioxyde de carbone s’échappe avant la mise", correct: false }
      explanation: |
        La fermentation ajoute environ **1,2–1,3 % vol.** et produit du
        dioxyde de carbone qui ne peut pas s’échapper. La pression finale
        atteint généralement **cinq à six atmosphères**.

  - id: sparkling-autolysis-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, lees-ageing]
    status: reviewed
    source_id: c41-0035
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is yeast autolysis during sparkling-wine lees ageing?
      choices:
        - { text: "Living yeast consumes dosage after disgorgement", correct: false }
        - { text: "Dead yeast cells break down and release compounds into wine", correct: true }
        - { text: "Grape skins release colour during bottle fermentation", correct: false }
        - { text: "Acid crystals dissolve and create carbon dioxide", correct: false }
      explanation: |
        Autolysis develops **bread, biscuit and toast** notes, which become
        more pronounced with longer lees ageing. The process can continue for
        several years before the yeast sediment becomes largely inert.

    fr:
      question: Qu’est-ce que l’autolyse des levures pendant l’élevage sur lies d’un vin effervescent ?
      choices:
        - { text: "Les levures vivantes consomment le dosage après le dégorgement", correct: false }
        - { text: "Les cellules de levures mortes se décomposent et libèrent des composés dans le vin", correct: true }
        - { text: "Les peaux libèrent leur couleur pendant la prise de mousse", correct: false }
        - { text: "Les cristaux d’acide se dissolvent et créent du dioxyde de carbone", correct: false }
      explanation: |
        L’autolyse développe des notes de **pain, biscuit et pain grillé**, qui
        s’accentuent avec la durée sur lies. Le phénomène peut se poursuivre
        plusieurs années avant que le dépôt ne devienne largement inerte.

  - id: sparkling-inert-lees-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, lees-ageing]
    status: reviewed
    source_id: c41-0039
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why may a traditional-method wine remain on its lees after most autolysis has occurred?
      choices:
        - { text: "The sealed bottle can preserve freshness for years", correct: true }
        - { text: "The lees keep increasing alcohol after sugar is exhausted", correct: false }
        - { text: "The lees progressively soften acidity through malolactic conversion", correct: false }
        - { text: "The lees raise pressure long after fermentation has stopped", correct: false }
      explanation: |
        Ageing before disgorgement protects the wine from oxygen. This can
        retain freshness while allowing gradual integration of its lees-aged
        character.

    fr:
      question: Pourquoi un vin élaboré par méthode traditionnelle peut-il rester sur lies après l’essentiel de l’autolyse ?
      choices:
        - { text: "La bouteille fermée peut préserver sa fraîcheur pendant des années", correct: true }
        - { text: "Les lies continuent d’augmenter le degré une fois le sucre épuisé", correct: false }
        - { text: "Les lies réduisent progressivement l’acidité par fermentation malolactique", correct: false }
        - { text: "Les lies augmentent la pression bien après la fin de la fermentation", correct: false }
      explanation: |
        L’élevage avant dégorgement protège le vin de l’oxygène. Il peut ainsi
        conserver sa fraîcheur tout en intégrant progressivement son caractère
        d’élevage sur lies.

  - id: sparkling-riddling-purpose-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0041
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do riddling and disgorgement work together?
      choices:
        - { text: "Riddling dissolves lees; disgorgement starts fermentation", correct: false }
        - { text: "Riddling gathers lees at the neck; disgorgement expels them", correct: true }
        - { text: "Riddling adds dosage; disgorgement increases pressure", correct: false }
        - { text: "Riddling filters the wine; disgorgement adds yeast", correct: false }
      explanation: |
        The bottle is gradually moved from horizontal to inverted, encouraging
        sediment to collect in the cup beneath the crown cap. It can then be
        removed with minimal loss of wine.

    fr:
      question: Comment le remuage et le dégorgement se complètent-ils ?
      choices:
        - { text: "Le remuage dissout les lies ; le dégorgement lance la fermentation", correct: false }
        - { text: "Le remuage rassemble les lies dans le col ; le dégorgement les expulse", correct: true }
        - { text: "Le remuage ajoute le dosage ; le dégorgement augmente la pression", correct: false }
        - { text: "Le remuage filtre le vin ; le dégorgement ajoute les levures", correct: false }
      explanation: |
        La bouteille passe progressivement de la position couchée à la position
        renversée, ce qui rassemble le dépôt dans l’obturateur sous la capsule
        couronne. Il peut alors être retiré avec une perte minimale de vin.

  - id: sparkling-hand-riddling-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0044
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which description matches traditional hand riddling?
      choices:
        - { text: "Bottles are turned weekly while remaining horizontal", correct: false }
        - { text: "Bottles on pupitres are twisted and raised a little each day", correct: true }
        - { text: "Bottles are inverted once and left still until disgorgement", correct: false }
        - { text: "Bottles are rolled upright without being tilted or twisted", correct: false }
      explanation: |
        A **pupitre** is the A-frame rack used for the process. Manual riddling
        is labour-intensive and typically takes around four to six weeks.

    fr:
      question: Quelle description correspond au remuage manuel traditionnel ?
      choices:
        - { text: "Les bouteilles sont tournées chaque semaine tout en restant couchées", correct: false }
        - { text: "Sur pupitre, elles sont tournées et relevées un peu chaque jour", correct: true }
        - { text: "Elles sont renversées une fois puis laissées immobiles jusqu’au dégorgement", correct: false }
        - { text: "Elles roulent jusqu’à la verticale sans être inclinées ni tournées", correct: false }
      explanation: |
        Le **pupitre** est le support en forme de A utilisé pour cette opération.
        Le remuage manuel demande beaucoup de travail et dure généralement
        autour de quatre à six semaines.

  - id: sparkling-gyropalette-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0049
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does a gyropalette do in traditional-method production?
      choices:
        - { text: "Presses whole bunches in small pneumatic batches", correct: false }
        - { text: "Rotates and tilts a cage of bottles to collect sediment", correct: true }
        - { text: "Freezes bottle necks immediately after tirage", correct: false }
        - { text: "Injects dosage through the crown cap during ageing", correct: false }
      explanation: |
        A hydraulic arm moves a cage holding hundreds of bottles. Mechanical
        riddling treats a large batch in about a week, with far less labour.

    fr:
      question: Quel est le rôle d’une gyropalette dans la méthode traditionnelle ?
      choices:
        - { text: "Presser les grappes entières par petits lots pneumatiques", correct: false }
        - { text: "Faire tourner et incliner des bouteilles pour rassembler le dépôt", correct: true }
        - { text: "Geler les cols immédiatement après le tirage", correct: false }
        - { text: "Injecter le dosage à travers la capsule pendant l’élevage", correct: false }
      explanation: |
        Un bras hydraulique déplace une cage contenant des centaines de
        bouteilles. Il traite un grand lot en environ une semaine et demande
        beaucoup moins de main-d’œuvre.

  - id: sparkling-disgorgement-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0053
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What happens during the usual disgorgement process for a traditional-method wine?
      choices:
        - { text: "The frozen neck deposit is expelled when the crown cap is removed", correct: true }
        - { text: "The warm neck deposit is dissolved by rotating the upright bottle", correct: false }
        - { text: "The lees are filtered out while the wine remains in its original bottle", correct: false }
        - { text: "The sediment is trapped by a cork inserted before secondary fermentation", correct: false }
      explanation: |
        The inverted bottle neck is frozen, trapping the collected sediment
        in a small plug. When the crown cap is removed, internal pressure
        ejects the plug and the plastic insert with little loss of wine.

    fr:
      question: Que se passe-t-il lors du dégorgement habituel d’un vin élaboré par méthode traditionnelle ?
      choices:
        - { text: "Le dépôt pris dans le glaçon du col est expulsé à l’ouverture de la capsule", correct: true }
        - { text: "Le dépôt tiède du col est dissous en faisant tourner la bouteille debout", correct: false }
        - { text: "Les lies sont filtrées tandis que le vin reste dans sa bouteille d’origine", correct: false }
        - { text: "Le dépôt est retenu par un bouchon posé avant la prise de mousse", correct: false }
      explanation: |
        Le col de la bouteille renversée est gelé, ce qui emprisonne le dépôt
        dans un petit glaçon. À l’ouverture de la capsule couronne, la pression
        interne expulse ce glaçon et l’obturateur avec une faible perte de vin.

  - id: sparkling-expedition-liqueur-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, dosage]
    status: reviewed
    source_id: c41-0056
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the liqueur d’expédition added after disgorgement?
      choices:
        - { text: "A wine-and-sugar mixture used for topping up and dosage", correct: true }
        - { text: "A yeast-and-sugar mixture used to start bottle fermentation", correct: false }
        - { text: "A grape-spirit mixture used to stop bottle fermentation", correct: false }
        - { text: "A wine-and-yeast mixture used to restart autolysis", correct: false }
      explanation: |
        It replaces wine lost at disgorgement. Its sugar is the **dosage**,
        which balances acidity; the liquid component also gives the producer
        a final opportunity to tune the house style.

    fr:
      question: Qu’est-ce que la liqueur d’expédition ajoutée après le dégorgement ?
      choices:
        - { text: "Un mélange de vin et de sucre servant à compléter la bouteille et à doser", correct: true }
        - { text: "Un mélange de levures et de sucre destiné à lancer la prise de mousse", correct: false }
        - { text: "Un mélange d’alcool vinique destiné à arrêter la fermentation en bouteille", correct: false }
        - { text: "Un mélange de vin et de levures destiné à relancer l’autolyse", correct: false }
      explanation: |
        Elle remplace le vin perdu au dégorgement. Son sucre constitue le
        **dosage**, qui équilibre l’acidité ; sa partie liquide donne aussi au
        producteur une dernière possibilité d’ajuster son style maison.

  - id: sparkling-zero-dosage-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, dosage, law]
    status: reviewed
    source_id: c41-0058
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: What does Brut Nature or Zéro Dosage indicate on an EU sparkling wine?
      choices:
        - { text: "Under 3 g/L sugar, with no sugar added after secondary fermentation", correct: true }
        - { text: "Up to 6 g/L sugar, with dosage permitted after secondary fermentation", correct: false }
        - { text: "Up to 12 g/L sugar, with dosage required after secondary fermentation", correct: false }
        - { text: "Over 12 g/L sugar, with no restriction on post-fermentation dosage", correct: false }
      explanation: |
        The bottle may still be topped up with wine after disgorgement. The
        restriction concerns adding **sugar** after the secondary fermentation.

    fr:
      question: Que signifie Brut Nature ou Zéro Dosage sur un vin effervescent de l’Union européenne ?
      choices:
        - { text: "Moins de 3 g/L de sucre, sans ajout de sucre après la seconde fermentation", correct: true }
        - { text: "Jusqu’à 6 g/L de sucre, avec dosage autorisé après la seconde fermentation", correct: false }
        - { text: "Jusqu’à 12 g/L de sucre, avec dosage obligatoire après la seconde fermentation", correct: false }
        - { text: "Plus de 12 g/L de sucre, sans restriction sur le dosage après fermentation", correct: false }
      explanation: |
        La bouteille peut tout de même être complétée avec du vin après le
        dégorgement. L’interdiction porte sur l’ajout de **sucre** après la
        seconde fermentation.

  - id: sparkling-post-disgorgement-closure-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, traditional-method]
    status: reviewed
    source_id: c41-0054
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which sequence normally follows disgorgement of a traditional-method wine?
      choices:
        - { text: "Add tirage, fit a crown cap and begin lees ageing", correct: false }
        - { text: "Top up, add dosage if required, then cork and wire", correct: true }
        - { text: "Riddle again, filter the bottle and add fresh yeast", correct: false }
        - { text: "Transfer to tank, restart fermentation and recork", correct: false }
      explanation: |
        Modern lines complete these operations in seconds to limit pressure
        loss and oxidation. The wire cage holds the compressed cork securely
        against the wine’s internal pressure.

    fr:
      question: Quel enchaînement suit normalement le dégorgement d’un vin élaboré par méthode traditionnelle ?
      choices:
        - { text: "Ajouter la liqueur de tirage, poser une capsule et commencer l’élevage sur lies", correct: false }
        - { text: "Compléter, doser si nécessaire, puis poser le bouchon et le muselet", correct: true }
        - { text: "Remuer de nouveau, filtrer la bouteille puis ajouter des levures fraîches", correct: false }
        - { text: "Transférer en cuve, relancer la fermentation puis reboucher", correct: false }
      explanation: |
        Les chaînes modernes réalisent ces opérations en quelques secondes afin
        de limiter la perte de pression et l’oxydation. Le muselet maintient le
        bouchon comprimé face à la pression interne du vin.

  - id: sparkling-cork-security-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, packaging]
    status: reviewed
    source_id: c41-0062
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does a sparkling-wine cork form and maintain a secure seal?
      choices:
        - { text: "It expands after light insertion and needs no external restraint", correct: false }
        - { text: "It is strongly compressed into the neck and held by a wire cage", correct: true }
        - { text: "It is glued to the glass and covered with a crown cap", correct: false }
        - { text: "It is frozen before insertion and secured by bottle pressure", correct: false }
      explanation: |
        Before insertion, the cork’s cross-section is much wider than the
        bottle opening. Compression makes the seal; the **muselet** prevents
        pressure from forcing the cork out.

    fr:
      question: Comment le bouchon d’un vin effervescent assure-t-il une fermeture étanche et sûre ?
      choices:
        - { text: "Il se dilate après une légère insertion et ne demande aucun maintien extérieur", correct: false }
        - { text: "Il est fortement comprimé dans le col puis maintenu par un muselet", correct: true }
        - { text: "Il est collé au verre puis recouvert d’une capsule couronne", correct: false }
        - { text: "Il est gelé avant insertion puis retenu par la pression", correct: false }
      explanation: |
        Avant insertion, la section du bouchon est bien plus large que
        l’ouverture de la bouteille. La compression assure l’étanchéité ; le
        **muselet** empêche la pression d’expulser le bouchon.

  - id: sparkling-post-disgorgement-ageing-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, maturation]
    status: reviewed
    source_id: c41-0066
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is a sparkling wine often held for a period after disgorgement?
      choices:
        - { text: "To let the expedition liqueur integrate with the wine", correct: true }
        - { text: "To allow riddling to move the lees into the neck", correct: false }
        - { text: "To begin the bottle’s secondary alcoholic fermentation", correct: false }
        - { text: "To increase pressure by warming the sealed bottle", correct: false }
      explanation: |
        Several months can help the wine settle after disgorgement and make
        the dosage feel integrated. Some premium wines also benefit from
        longer post-disgorgement maturation.

    fr:
      question: Pourquoi conserve-t-on souvent un vin effervescent quelque temps après son dégorgement ?
      choices:
        - { text: "Pour laisser la liqueur d’expédition s’intégrer au vin", correct: true }
        - { text: "Pour permettre au remuage de déplacer les lies dans le col", correct: false }
        - { text: "Pour commencer la seconde fermentation alcoolique en bouteille", correct: false }
        - { text: "Pour augmenter la pression en réchauffant la bouteille fermée", correct: false }
      explanation: |
        Quelques mois peuvent aider le vin à se remettre du dégorgement et
        rendre le dosage plus fondu. Certains effervescents haut de gamme
        bénéficient aussi d’une maturation plus longue après dégorgement.

  - id: sparkling-disgorgement-date-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, labelling]
    status: reviewed
    source_id: c41-0068
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which optional label detail best helps a buyer judge the post-lees age of a non-vintage sparkling wine?
      choices:
        - { text: "Harvest-start date", correct: false }
        - { text: "Tirage date", correct: false }
        - { text: "Disgorgement date", correct: true }
        - { text: "Base-wine bottling date", correct: false }
      explanation: |
        Most non-vintage wines do not reveal a harvest year. A disgorgement
        date shows when lees ageing ended and helps distinguish a recent
        release from a bottle that has spent longer under its final cork.

    fr:
      question: Quelle mention facultative aide le mieux à estimer le temps écoulé depuis la fin de l’élevage sur lies d’un effervescent non millésimé ?
      choices:
        - { text: "La date de début des vendanges", correct: false }
        - { text: "La date de tirage", correct: false }
        - { text: "La date de dégorgement", correct: true }
        - { text: "La date de mise du vin de base", correct: false }
      explanation: |
        La plupart des vins non millésimés n’indiquent pas d’année de récolte.
        La date de dégorgement montre quand l’élevage sur lies a pris fin et
        aide à distinguer une sortie récente d’une bouteille restée plus
        longtemps sous son bouchon définitif.

  - id: sparkling-transfer-purpose-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, transfer-method]
    status: reviewed
    source_id: c41-0069
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the defining practical aim of the transfer method?
      choices:
        - { text: "Retain bottle fermentation while avoiding individual riddling and disgorgement", correct: true }
        - { text: "Replace bottle fermentation with direct carbon-dioxide injection", correct: false }
        - { text: "Keep the entire process in one tank from juice to bottling", correct: false }
        - { text: "Stop a single fermentation early to preserve residual sugar", correct: false }
      explanation: |
        Production mirrors the traditional method through secondary
        fermentation in bottle. The bottles are then emptied under pressure
        so sediment can be removed from the combined wine in bulk.

    fr:
      question: Quel est l’objectif pratique qui définit la méthode par transfert ?
      choices:
        - { text: "Conserver la prise de mousse en bouteille sans remuage ni dégorgement individuels", correct: true }
        - { text: "Remplacer la prise de mousse en bouteille par une injection de dioxyde de carbone", correct: false }
        - { text: "Maintenir tout le processus dans une seule cuve, du jus à la mise", correct: false }
        - { text: "Arrêter une fermentation unique assez tôt pour conserver du sucre résiduel", correct: false }
      explanation: |
        La production suit la méthode traditionnelle jusqu’à la prise de mousse
        en bouteille. Les bouteilles sont ensuite vidées sous pression afin que
        le dépôt soit retiré en une seule opération sur le vin réuni.

  - id: sparkling-transfer-sequence-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, transfer-method]
    status: reviewed
    source_id: c41-0072
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which sequence follows bottle fermentation in the transfer method?
      choices:
        - { text: "Riddle bottles → freeze necks → disgorge each bottle → recork", correct: false }
        - { text: "Empty under pressure → filter in tank → adjust dosage → rebottle", correct: true }
        - { text: "Open bottles → aerate in vat → add tirage → rebottle", correct: false }
        - { text: "Inject carbon dioxide → filter in bottle → add yeast → recork", correct: false }
      explanation: |
        Pressure is maintained throughout transfer, filtration and rebottling
        so the dissolved carbon dioxide is retained.

    fr:
      question: Quel enchaînement suit la prise de mousse en bouteille dans la méthode par transfert ?
      choices:
        - { text: "Remuer → geler les cols → dégorger chaque bouteille → reboucher", correct: false }
        - { text: "Vider sous pression → filtrer en cuve → ajuster le dosage → remettre en bouteille", correct: true }
        - { text: "Ouvrir les bouteilles → aérer en cuve → ajouter la liqueur de tirage → remettre en bouteille", correct: false }
        - { text: "Injecter du gaz → filtrer en bouteille → ajouter des levures → reboucher", correct: false }
      explanation: |
        La pression est maintenue pendant le transfert, la filtration et la
        remise en bouteille afin de conserver le dioxyde de carbone dissous.

  - id: sparkling-transfer-economics-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, transfer-method]
    status: reviewed
    source_id: c41-0073
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a major commercial advantage of the transfer method?
      choices:
        - { text: "It combines bottle-fermented character with efficient batch processing", correct: true }
        - { text: "It eliminates both secondary fermentation and pressure-resistant equipment", correct: false }
        - { text: "It permits bottle-by-bottle dosage changes within one filtered batch", correct: false }
        - { text: "It requires longer hand riddling but lowers the cost of glass", correct: false }
      explanation: |
        Bulk filtration and rebottling reduce labour and cost while making a
        large batch consistent. Quality can remain good because the second
        fermentation still takes place in bottle.

    fr:
      question: Quel est l’un des principaux avantages commerciaux de la méthode par transfert ?
      choices:
        - { text: "Elle associe le caractère d’une prise de mousse en bouteille à un traitement efficace par lots", correct: true }
        - { text: "Elle supprime à la fois la seconde fermentation et tout équipement résistant à la pression", correct: false }
        - { text: "Elle permet de modifier le dosage bouteille par bouteille dans un même lot filtré", correct: false }
        - { text: "Elle impose un remuage manuel plus long mais réduit le coût du verre", correct: false }
      explanation: |
        La filtration et la remise en bouteille en vrac réduisent le travail et
        les coûts tout en homogénéisant un grand lot. La qualité peut rester
        bonne puisque la seconde fermentation a bien lieu en bouteille.

  - id: sparkling-transfer-label-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, transfer-method, labelling]
    status: reviewed
    source_id: c41-0074
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why is a transfer-method wine still bottle-fermented even though it is sold in a fresh bottle?
      choices:
        - { text: "Its secondary fermentation occurred in a bottle before bulk transfer", correct: true }
        - { text: "Its primary fermentation occurred in the bottle eventually sold", correct: false }
        - { text: "Its dosage fermented after the final bottle received its cork", correct: false }
        - { text: "Its carbon dioxide was injected after wine entered the final bottle", correct: false }
      explanation: |
        The bottle used for secondary fermentation is emptied under pressure;
        the filtered wine is later filled into a fresh bottle. It therefore
        lacks the traditional method’s same-bottle continuity.

    fr:
      question: Pourquoi un vin élaboré par transfert reste-t-il fermenté en bouteille alors qu’il est vendu dans une nouvelle bouteille ?
      choices:
        - { text: "Sa seconde fermentation a eu lieu en bouteille avant le transfert en vrac", correct: true }
        - { text: "Sa première fermentation a eu lieu dans la bouteille ensuite commercialisée", correct: false }
        - { text: "Son dosage a fermenté après la pose du bouchon définitif", correct: false }
        - { text: "Son dioxyde de carbone a été injecté après l’entrée dans la bouteille finale", correct: false }
      explanation: |
        La bouteille de la seconde fermentation est vidée sous pression ; le
        vin filtré est ensuite conditionné dans une nouvelle bouteille. Il n’y
        a donc pas la continuité de bouteille propre à la méthode traditionnelle.

  - id: sparkling-tank-style-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, tank-method]
    status: reviewed
    source_id: c41-0076
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which wine style is particularly well suited to the tank method?
      choices:
        - { text: "An aromatic, fruit-led wine intended for early drinking", correct: true }
        - { text: "A deeply autolytic wine requiring long individual bottle ageing", correct: false }
        - { text: "An oxidative wine matured for years in partly filled barrels", correct: false }
        - { text: "A tannic red requiring extended skin maceration after tirage", correct: false }
      explanation: |
        Pressurised tanks preserve primary fruit and floral aromas, making the
        method suitable for grapes such as Muscat and Riesling and styles such
        as Prosecco. It is also faster and less labour-intensive.

    fr:
      question: Quel style de vin convient particulièrement bien à la méthode en cuve close ?
      choices:
        - { text: "Un vin aromatique et fruité destiné à être bu jeune", correct: true }
        - { text: "Un vin très autolytique exigeant un long élevage dans chaque bouteille", correct: false }
        - { text: "Un vin oxydatif élevé plusieurs années en fûts partiellement remplis", correct: false }
        - { text: "Un rouge tannique exigeant une longue macération après le tirage", correct: false }
      explanation: |
        Les cuves sous pression préservent les arômes primaires de fruit et de
        fleurs. La méthode convient donc à des cépages comme le Muscat ou le
        Riesling et à des styles comme le Prosecco. Elle est aussi plus rapide
        et moins exigeante en main-d’œuvre.

  - id: sparkling-tank-quality-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, tank-method]
    status: reviewed
    source_id: c41-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which combination gives the tank method its best chance of producing high-quality wine?
      choices:
        - { text: "Long bottle-lees ageing followed by hand riddling", correct: false }
        - { text: "Sound fruit with tight temperature and oxygen control", correct: true }
        - { text: "Hard pressing followed by extended skin contact", correct: false }
        - { text: "Oxidative barrel ageing before direct carbonation", correct: false }
      explanation: |
        Method should match intended style. Tank production is not designed
        to imitate long lees-aged traditional-method wine, but it can express
        aromatic grapes and fresh fruit with precision.

    fr:
      question: Quelle combinaison donne à la méthode en cuve close les meilleures chances de produire un vin de grande qualité ?
      choices:
        - { text: "Un long élevage sur lies en bouteille suivi d’un remuage manuel", correct: false }
        - { text: "Un bon raisin et une maîtrise précise de la température et de l’oxygène", correct: true }
        - { text: "Un pressurage poussé suivi d’un long contact avec les peaux", correct: false }
        - { text: "Un élevage oxydatif en fût avant une gazéification directe", correct: false }
      explanation: |
        La méthode doit correspondre au style recherché. La cuve close n’imite
        pas un vin longtemps élevé sur lies en bouteille, mais elle peut
        exprimer avec précision les cépages aromatiques et le fruit frais.

  - id: sparkling-tank-base-treatment-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, tank-method]
    status: reviewed
    source_id: c41-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How is a fruit-led base wine commonly prepared for the tank method?
      choices:
        - { text: "In stainless steel, usually without malolactic conversion or oak ageing", correct: true }
        - { text: "In new oak, normally with full malolactic conversion and oxidation", correct: false }
        - { text: "In bottle, with prolonged lees ageing before primary fermentation", correct: false }
        - { text: "In open vats, with warm maceration to maximise tannin extraction", correct: false }
      explanation: |
        Temperature-controlled stainless steel protects varietal fruit and
        floral notes. Avoiding oak and malolactic conversion helps keep those
        aromas clear and the acidity fresh.

    fr:
      question: Comment prépare-t-on généralement un vin de base fruité destiné à la méthode en cuve close ?
      choices:
        - { text: "En inox, le plus souvent sans fermentation malolactique ni élevage sous bois", correct: true }
        - { text: "En barriques neuves, avec fermentation malolactique complète et oxydation", correct: false }
        - { text: "En bouteille, avec un long élevage sur lies avant la première fermentation", correct: false }
        - { text: "En cuves ouvertes, avec une macération chaude pour extraire un maximum de tanins", correct: false }
      explanation: |
        L’inox thermorégulé protège les arômes variétaux de fruit et de fleurs.
        Éviter le bois et la fermentation malolactique aide à garder ces arômes
        nets et l’acidité fraîche.

  - id: sparkling-tank-second-fermentation-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, tank-method]
    status: reviewed
    source_id: c41-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does the tank method create and retain its carbon dioxide?
      choices:
        - { text: "During primary fermentation in an open vat", correct: false }
        - { text: "During secondary fermentation in a sealed pressure tank", correct: true }
        - { text: "During ageing in individually sealed bottles", correct: false }
        - { text: "During bottling by direct gas injection", correct: false }
      explanation: |
        Yeast, sugar and nutrients are added before the tank is sealed. After
        fermentation, the wine is filtered and bottled under pressure so the
        dissolved gas is not lost.

    fr:
      question: Où la méthode en cuve close crée-t-elle puis retient-elle le dioxyde de carbone ?
      choices:
        - { text: "Pendant la première fermentation dans une cuve ouverte", correct: false }
        - { text: "Pendant la seconde fermentation dans une cuve close sous pression", correct: true }
        - { text: "Pendant l’élevage dans des bouteilles fermées individuellement", correct: false }
        - { text: "Pendant la mise par injection directe de gaz", correct: false }
      explanation: |
        Levures, sucre et nutriments sont ajoutés avant la fermeture de la
        cuve. Après la fermentation, le vin est filtré puis mis en bouteille
        sous pression afin de conserver le gaz dissous.

  - id: sparkling-tank-autolysis-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, tank-method, lees-ageing]
    status: reviewed
    source_id: c41-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do most tank-method wines show little autolytic character?
      choices:
        - { text: "They are normally removed from the lees relatively quickly", correct: true }
        - { text: "Pressure prevents yeast from forming any sediment", correct: false }
        - { text: "Cool tank fermentation prevents yeast cells from breaking down", correct: false }
        - { text: "Their second fermentation occurs without viable yeast", correct: false }
      explanation: |
        Producers seeking more yeast-derived flavour can stir the lees with
        paddles, but this is uncommon because the method is usually chosen to
        retain primary fruit.

    fr:
      question: Pourquoi la plupart des vins élaborés en cuve close présentent-ils peu de caractère autolytique ?
      choices:
        - { text: "Ils sont généralement séparés des lies assez rapidement", correct: true }
        - { text: "La pression empêche les levures de former le moindre dépôt", correct: false }
        - { text: "La fermentation fraîche en cuve empêche les cellules de levures de se décomposer", correct: false }
        - { text: "Leur seconde fermentation se déroule sans levures viables", correct: false }
      explanation: |
        Un producteur qui recherche davantage de notes levurées peut remettre
        les lies en suspension à l’aide de pales, mais cette pratique reste
        rare car la méthode vise généralement à préserver le fruit primaire.

  - id: sparkling-asti-definition-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, asti-method]
    status: reviewed
    source_id: c41-0086
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How does the classic Asti tank process preserve sweetness and Muscat aromatics?
      choices:
        - { text: "A single pressure-tank fermentation is stopped by chilling and filtration", correct: true }
        - { text: "A bottle fermentation is followed by transfer to a pressure tank", correct: false }
        - { text: "A dry base wine is carbonated immediately before bottling", correct: false }
        - { text: "A second bottle fermentation is stopped by disgorgement", correct: false }
      explanation: |
        This classic process gives a sweet, aromatic style by stopping the
        must fermentation while residual sugar remains. Current **Asti DOCG**
        rules also permit drier styles and traditional-method production.

    fr:
      question: Comment le procédé classique d’Asti en cuve préserve-t-il le sucre et les arômes du Muscat ?
      choices:
        - { text: "Une seule fermentation sous pression est arrêtée par refroidissement et filtration", correct: true }
        - { text: "Une prise de mousse en bouteille est suivie d’un transfert en cuve sous pression", correct: false }
        - { text: "Un vin de base sec est gazéifié juste avant la mise", correct: false }
        - { text: "Une seconde fermentation en bouteille est arrêtée par dégorgement", correct: false }
      explanation: |
        Ce procédé classique donne un style doux et aromatique en arrêtant la
        fermentation du moût alors qu’il reste du sucre. Le cahier des charges
        actuel d’**Asti DOCG** autorise aussi des styles plus secs et la méthode
        traditionnelle.

  - id: sparkling-asti-process-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, asti-method]
    status: reviewed
    source_id: c41-0089
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which sequence describes the classic Asti tank process?
      choices:
        - { text: "Store chilled juice → ferment in tank → seal tank → chill and filter under pressure", correct: true }
        - { text: "Ferment dry in tank → bottle with tirage → riddle → disgorge", correct: false }
        - { text: "Ferment in bottle → empty into tank → filter → rebottle under pressure", correct: false }
        - { text: "Ferment dry in barrel → inject gas → sweeten after bottling", correct: false }
      explanation: |
        Carbon dioxide can escape early in fermentation; the tank is then
        sealed to retain it. Once the desired balance of alcohol and residual
        sugar is reached, chilling stops fermentation before sterile filtration.

    fr:
      question: Quel enchaînement décrit le procédé classique d’Asti en cuve ?
      choices:
        - { text: "Conserver le jus au froid → fermenter en cuve → fermer la cuve → refroidir et filtrer sous pression", correct: true }
        - { text: "Fermenter jusqu’à sec en cuve → tirer en bouteille → remuer → dégorger", correct: false }
        - { text: "Fermenter en bouteille → vider en cuve → filtrer → remettre sous pression en bouteille", correct: false }
        - { text: "Fermenter jusqu’à sec en fût → injecter du gaz → édulcorer après la mise", correct: false }
      explanation: |
        Le dioxyde de carbone peut d’abord s’échapper ; la cuve est ensuite
        fermée pour le retenir. Une fois l’équilibre recherché entre alcool et
        sucre résiduel atteint, le refroidissement arrête la fermentation avant
        une filtration stérile.

  - id: sparkling-carbonation-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, carbonation]
    status: reviewed
    source_id: c41-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How are bubbles created by the carbonation method?
      choices:
        - { text: "Carbon dioxide is injected into still wine before pressure bottling", correct: true }
        - { text: "Yeast ferments added sugar in the bottle sold to the consumer", correct: false }
        - { text: "Yeast ferments added sugar in a sealed tank before filtration", correct: false }
        - { text: "A single fermentation is stopped while natural sugar remains", correct: false }
      explanation: |
        This is the cheapest route and retains the base wine’s primary fruit,
        so it can suit inexpensive wines made from strongly aromatic grapes.

    fr:
      question: Comment les bulles sont-elles créées par gazéification ?
      choices:
        - { text: "Du dioxyde de carbone est injecté dans un vin tranquille avant la mise sous pression", correct: true }
        - { text: "Les levures fermentent du sucre ajouté dans la bouteille vendue au consommateur", correct: false }
        - { text: "Les levures fermentent du sucre ajouté en cuve close avant filtration", correct: false }
        - { text: "Une fermentation unique est arrêtée alors que du sucre naturel subsiste", correct: false }
      explanation: |
        C’est la voie la moins coûteuse et elle conserve le fruit primaire du
        vin de base. Elle peut donc convenir à des vins bon marché issus de
        cépages très aromatiques.

  - id: sparkling-eu-sweetness-label-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, dosage, law]
    status: reviewed
    source_id: c41-0094
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: What do EU terms such as Brut, Sec and Demi-Sec communicate on sparkling wine?
      choices:
        - { text: "The wine’s sugar-content category", correct: true }
        - { text: "The duration of lees ageing", correct: false }
        - { text: "The pressure reached in bottle", correct: false }
        - { text: "The method of secondary fermentation", correct: false }
      explanation: |
        The terms belong to a legally defined scale. Counter-intuitively,
        **Extra Dry** is sweeter than **Brut**, and **Sec** is sweeter again.

    fr:
      question: Que communiquent les mentions Brut, Sec et Demi-Sec sur un vin effervescent de l’Union européenne ?
      choices:
        - { text: "La catégorie de teneur en sucre du vin", correct: true }
        - { text: "La durée de l’élevage sur lies", correct: false }
        - { text: "La pression atteinte dans la bouteille", correct: false }
        - { text: "La méthode de seconde fermentation", correct: false }
      explanation: |
        Ces mentions appartiennent à une échelle définie par la réglementation.
        Contrairement à ce que son nom suggère, **Extra Dry** est plus doux que
        Brut, et Sec est encore plus doux.

  - id: sparkling-sweetness-order-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, dosage, law]
    status: reviewed
    source_id: c41-0095
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: Which EU sparkling-wine sequence runs from driest to sweetest?
      choices:
        - { text: "Brut Nature → Extra Brut → Brut → Extra Dry → Sec → Demi-Sec → Doux", correct: true }
        - { text: "Extra Brut → Brut Nature → Brut → Sec → Extra Dry → Demi-Sec → Doux", correct: false }
        - { text: "Brut Nature → Brut → Extra Brut → Extra Dry → Demi-Sec → Sec → Doux", correct: false }
        - { text: "Brut Nature → Extra Brut → Extra Dry → Brut → Sec → Doux → Demi-Sec", correct: false }
      explanation: |
        The naming is not intuitive: **Extra Dry** follows Brut on the sweeter
        side. The final three steps are Sec, Demi-Sec and Doux.

    fr:
      question: Quel ordre va du vin effervescent le plus sec au plus doux dans l’Union européenne ?
      choices:
        - { text: "Brut Nature → Extra Brut → Brut → Extra Dry → Sec → Demi-Sec → Doux", correct: true }
        - { text: "Extra Brut → Brut Nature → Brut → Sec → Extra Dry → Demi-Sec → Doux", correct: false }
        - { text: "Brut Nature → Brut → Extra Brut → Extra Dry → Demi-Sec → Sec → Doux", correct: false }
        - { text: "Brut Nature → Extra Brut → Extra Dry → Brut → Sec → Doux → Demi-Sec", correct: false }
      explanation: |
        Les termes ne sont pas intuitifs : **Extra Dry** se trouve du côté
        plus doux après Brut. Les trois derniers niveaux sont Sec, Demi-Sec
        puis Doux.

  - id: sparkling-non-vintage-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, labelling]
    status: reviewed
    source_id: c41-0098
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does non-vintage usually mean for a sparkling wine?
      choices:
        - { text: "It blends wine from more than one harvest year", correct: true }
        - { text: "It comes from one year that is omitted from the label", correct: false }
        - { text: "It contains no reserve wine from earlier harvests", correct: false }
        - { text: "It is bottled without lees ageing or dosage", correct: false }
      explanation: |
        Non-vintage is commonly a producer’s standard house-style bottling.
        Blending across years helps maintain that style despite vintage
        variation.

    fr:
      question: Que signifie généralement « non millésimé » pour un vin effervescent ?
      choices:
        - { text: "Il assemble des vins provenant de plusieurs années de récolte", correct: true }
        - { text: "Il provient d’une seule année qui n’est simplement pas indiquée", correct: false }
        - { text: "Il ne contient aucun vin de réserve d’années antérieures", correct: false }
        - { text: "Il est mis sans élevage sur lies ni dosage", correct: false }
      explanation: |
        Le non-millésimé constitue souvent la cuvée de référence du producteur.
        L’assemblage de plusieurs années aide à maintenir ce style maison
        malgré les variations entre millésimes.

  - id: sparkling-champagne-vintage-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, champagne, labelling]
    status: reviewed
    source_id: c41-0100
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: What does a stated vintage year mean on a bottle of Champagne?
      choices:
        - { text: "All grapes used were harvested in that year", correct: true }
        - { text: "Most grapes came from that year, with older reserves permitted", correct: false }
        - { text: "The wine was disgorged and released in that year", correct: false }
        - { text: "The oldest reserve wine in the blend came from that year", correct: false }
      explanation: |
        Vintage Champagne is made exclusively from grapes harvested in the
        year shown. Most Champagne is non-vintage and blends multiple years.

    fr:
      question: Que signifie l’indication d’une année sur une bouteille de Champagne ?
      choices:
        - { text: "Tous les raisins utilisés ont été vendangés cette année-là", correct: true }
        - { text: "La majorité des raisins vient de cette année, avec des vins de réserve autorisés", correct: false }
        - { text: "Le vin a été dégorgé puis commercialisé cette année-là", correct: false }
        - { text: "Le plus vieux vin de réserve de l’assemblage vient de cette année-là", correct: false }
      explanation: |
        Un Champagne millésimé provient exclusivement de raisins récoltés
        pendant l’année indiquée. La majorité des Champagnes sont non
        millésimés et assemblent plusieurs années.

  - id: sparkling-vintage-rules-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, labelling]
    status: reviewed
    source_id: c41-0101
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why must the meaning of “vintage” be checked against the rules of each sparkling-wine appellation?
      choices:
        - { text: "Some regions permit a small proportion of wine from other years", correct: true }
        - { text: "Some regions use vintage to indicate the disgorgement year", correct: false }
        - { text: "Some regions use vintage to guarantee a minimum sweetness", correct: false }
        - { text: "Some regions use vintage to identify the fermentation method", correct: false }
      explanation: |
        EU labelling generally requires at least **85%** of the grapes to come
        from the stated year, excluding tirage and expedition liqueurs.
        Appellations can be stricter: Champagne requires the harvest itself
        to supply all the grapes.

    fr:
      question: Pourquoi faut-il vérifier le sens de « millésimé » dans le règlement de chaque appellation de vin effervescent ?
      choices:
        - { text: "Certaines régions autorisent une petite part de vin provenant d’autres années", correct: true }
        - { text: "Certaines régions utilisent le millésime pour indiquer l’année de dégorgement", correct: false }
        - { text: "Certaines régions utilisent le millésime pour garantir une douceur minimale", correct: false }
        - { text: "Certaines régions utilisent le millésime pour identifier la méthode de fermentation", correct: false }
      explanation: |
        Dans l’Union européenne, au moins **85 %** des raisins doivent en
        principe provenir de l’année indiquée, hors liqueurs de tirage et
        d’expédition. Une appellation peut être plus stricte : en Champagne,
        tous les raisins utilisés doivent provenir de l’année affichée.

  - id: sparkling-champagne-vintage-premium-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, champagne, labelling]
    status: reviewed
    source_id: c41-0102
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is a vintage Champagne intended to express?
      choices:
        - { text: "It is selected to express the character of a particular harvest", correct: true }
        - { text: "The house’s most consistent blend across several harvests", correct: false }
        - { text: "The identity of one village regardless of harvest year", correct: false }
        - { text: "A fixed dosage category used for the house’s standard wine", correct: false }
      explanation: |
        Champagne has meaningful year-to-year variation, and producers choose
        which years to declare. In regions with less vintage variation, a year
        on the label may carry less prestige by itself.

    fr:
      question: Qu’est-ce qu’un Champagne millésimé cherche à exprimer ?
      choices:
        - { text: "Il est sélectionné pour exprimer le caractère d’une récolte particulière", correct: true }
        - { text: "L’assemblage le plus régulier de la maison sur plusieurs récoltes", correct: false }
        - { text: "L’identité d’un seul village, quelle que soit l’année de récolte", correct: false }
        - { text: "Une catégorie de dosage fixe utilisée pour la cuvée standard", correct: false }
      explanation: |
        La Champagne connaît de réelles variations entre années et les
        producteurs choisissent les millésimes qu’ils déclarent. Dans une
        région où ces variations sont moindres, l’année portée sur l’étiquette
        peut être moins prestigieuse à elle seule.

  - id: sparkling-rose-production-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, rose, winemaking]
    status: reviewed
    source_id: c41-0104
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which pair describes the principal ways to obtain colour in rosé sparkling wine?
      choices:
        - { text: "Blending red and white base wines, or short skin maceration", correct: true }
        - { text: "Blending white wine with spirit, or extended lees ageing", correct: false }
        - { text: "Adding caramel before tirage, or ageing in new oak", correct: false }
        - { text: "Oxidising white juice, or increasing the pressing pressure", correct: false }
      explanation: |
        Appellation rules decide which route is permitted; some require
        maceration. For blended rosé Champagne, still red Champagne is added
        to white base wines **before** the second fermentation.

    fr:
      question: Quelles sont les deux principales façons d’obtenir la couleur d’un vin effervescent rosé ?
      choices:
        - { text: "Assembler des vins de base rouges et blancs, ou pratiquer une courte macération", correct: true }
        - { text: "Assembler un vin blanc et de l’alcool, ou prolonger l’élevage sur lies", correct: false }
        - { text: "Ajouter du caramel avant le tirage, ou élever le vin en barriques neuves", correct: false }
        - { text: "Oxyder un jus blanc, ou augmenter la pression de pressurage", correct: false }
      explanation: |
        Le règlement de l’appellation détermine les voies autorisées ; certaines
        imposent la macération. Pour un Champagne rosé d’assemblage, du vin
        rouge tranquille de Champagne est ajouté aux vins de base blancs
        **avant** la prise de mousse.

  - id: sparkling-blanc-de-blancs-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, labelling]
    status: reviewed
    source_id: c41-0107
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Blanc de Blancs indicate on a sparkling wine?
      choices:
        - { text: "It was made only from white grape varieties", correct: true }
        - { text: "It was made only from colourless juice of black grapes", correct: false }
        - { text: "It was made without dosage after disgorgement", correct: false }
        - { text: "It was made exclusively in stainless-steel tanks", correct: false }
      explanation: |
        The term describes grape colour, not a production method or sweetness
        level. It does not universally mean Chardonnay; the permitted white
        varieties depend on the region.

    fr:
      question: Que signifie Blanc de Blancs sur un vin effervescent ?
      choices:
        - { text: "Il est élaboré uniquement à partir de cépages blancs", correct: true }
        - { text: "Il est élaboré uniquement avec le jus incolore de raisins noirs", correct: false }
        - { text: "Il est élaboré sans dosage après le dégorgement", correct: false }
        - { text: "Il est élaboré exclusivement en cuves inox", correct: false }
      explanation: |
        La mention décrit la couleur des raisins, pas une méthode de production
        ni un niveau de douceur. Elle ne signifie pas partout Chardonnay : les
        cépages blancs autorisés dépendent de la région.

  - id: sparkling-blanc-de-noirs-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, labelling]
    status: reviewed
    source_id: c41-0097
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does Blanc de Noirs indicate on a sparkling wine?
      choices:
        - { text: "A white wine made only from black grape varieties", correct: true }
        - { text: "A rosé wine made by blending red and white finished wines", correct: false }
        - { text: "A white wine darkened by extended maturation in oak", correct: false }
        - { text: "A red wine whose colour was removed after fermentation", correct: false }
      explanation: |
        Prompt, gentle pressing limits contact between juice and black skins,
        so the wine remains white. The term does not by itself prescribe a
        particular fermentation method.

    fr:
      question: Que signifie Blanc de Noirs sur un vin effervescent ?
      choices:
        - { text: "Un vin blanc élaboré uniquement à partir de cépages noirs", correct: true }
        - { text: "Un vin rosé issu de l’assemblage de vins finis rouges et blancs", correct: false }
        - { text: "Un vin blanc assombri par un long élevage sous bois", correct: false }
        - { text: "Un vin rouge dont la couleur a été retirée après fermentation", correct: false }
      explanation: |
        Un pressurage rapide et délicat limite le contact entre le jus et les
        peaux noires, de sorte que le vin reste blanc. La mention n’impose pas
        à elle seule une méthode de fermentation particulière.

  - id: sparkling-prestige-cuvee-001
    type: mcq
    deck: Sparkling Production
    tags: [sparkling, labelling, market]
    status: reviewed
    source_id: c41-0108
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does “prestige cuvée” generally identify in a sparkling-wine producer’s range?
      choices:
        - { text: "The flagship wine positioned at the top of the range", correct: true }
        - { text: "The standard non-vintage wine made in the largest volume", correct: false }
        - { text: "The lowest-dosage wine regardless of fruit quality", correct: false }
        - { text: "The transfer-method wine released with the least ageing", correct: false }
      explanation: |
        It is a market category rather than one universal production formula.
        Producers build these wines around scarcity, reputation and a strong
        association with luxury and celebration.
    fr:
      question: Que désigne généralement « cuvée de prestige » dans la gamme d’un producteur de vins effervescents ?
      choices:
        - { text: "La cuvée emblématique placée au sommet de la gamme", correct: true }
        - { text: "La cuvée non millésimée standard produite dans le plus grand volume", correct: false }
        - { text: "La cuvée au dosage le plus faible, quelle que soit la qualité du raisin", correct: false }
        - { text: "La cuvée élaborée par transfert et commercialisée après l’élevage le plus court", correct: false }
      explanation: |
        Il s’agit d’une catégorie commerciale, pas d’une formule de production
        universelle. Les producteurs construisent ces cuvées autour de la
        rareté, de la réputation et d’une image liée au luxe et à la célébration.
