        - { text: "Le degré est proche, car les deux partent d'une maturité Kabinett", correct: false }
        - { text: "Il est plus alcoolisé, car les sucres résiduels augmentent l'alcool mesuré", correct: false }
      explanation: |
        **Il est moins alcoolisé.** L'arrêt de la fermentation préserve du sucre qui aurait autrement été transformé en alcool ; une fermentation jusqu'à sec augmente le degré final.

  - id: germany-kabinett-sweet-001
