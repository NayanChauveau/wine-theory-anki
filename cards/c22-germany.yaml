        - { text: "Riesling is neither the most planted grape nor the prestige lead", correct: true }
        - { text: "Riesling is illegal east of the Rhine", correct: false }
        - { text: "Franken may plant only Riesling", correct: false }
      explanation: |
        **Riesling is neither the most planted grape nor the
        prestige lead.** Silvaner holds both roles in Franken.
        LWG figures still put Riesling around one twentieth of
        the area.

  - id: germany-franken-silvaner-001
    type: mcq
    deck: Germany
    tags: [germany, franken, grapes]
    status: reviewed
    source_id: c22-0128
    review:
      fact_check: pass
