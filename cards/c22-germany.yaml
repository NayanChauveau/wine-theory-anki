        - { text: "Adding spirit or concentrating by freezing", correct: false }
        - { text: "Malolactic conversion or new-oak ageing", correct: false }
      explanation: |
        **Stopping fermentation or adding Süssreserve.** Arresting fermentation is generally preferred for quality; Süssreserve is unfermented grape must, not table sugar.
    fr:
      question: "Quelles sont les deux méthodes permettant de donner des sucres résiduels à un Kabinett allemand ?"
      choices:
        - { text: "Arrêter la fermentation ou ajouter du moût concentré rectifié", correct: false }
        - { text: "Arrêter la fermentation ou ajouter une Süssreserve", correct: true }
        - { text: "Ajouter de l'alcool ou concentrer par le froid", correct: false }
        - { text: "Faire la fermentation malolactique ou élever en fût neuf", correct: false }
      explanation: |
        **Arrêter la fermentation ou ajouter une Süssreserve.** L'arrêt de la fermentation est généralement privilégié pour les vins de qualité ; la Süssreserve est un moût de raisin non fermenté, et non du sucre de table.

  - id: germany-stop-ferment-001
    type: mcq
