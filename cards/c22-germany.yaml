        - { text: "The Mosel only, ending at Trier", correct: false }
        - { text: "No river at all", correct: false }
      explanation: |
        **The Rhine, to the Swiss border.** A narrow, broken
        strip along the river holds most of the hectares.
        Bodensee and Tauberfranken are smaller outliers.

  - id: germany-kaiserstuhl-tuniberg-001
    type: mcq
