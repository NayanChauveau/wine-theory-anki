        - { text: "Silvaner", correct: true }
        - { text: "Trollinger", correct: false }
        - { text: "Portugieser", correct: false }
      explanation: |
        **Silvaner.** It is the Franken flagship, and it now
        also leads the hectares. The German Silvaner heartland
        is Rheinhessen plus Franken, not the Mosel.

  - id: germany-silvaner-early-001
    type: mcq
    deck: Germany
    tags: [germany, grapes, silvaner]
    status: reviewed
    source_id: c22-0129
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Relative to Riesling, when does Silvaner typically flower and ripen?
      choices:
        - { text: "Later, like Riesling on a north slope", correct: false }
        - { text: "Earlier", correct: true }
        - { text: "The two grapes are legally identical", correct: false }
        - { text: "Silvaner is a black grape", correct: false }
      explanation: |
        **Earlier.** An early cycle is why growers put Silvaner
        on Franken's warmest ground.

  - id: germany-silvaner-frost-001
    type: mcq
    deck: Germany
    tags: [germany, grapes, silvaner]
    status: reviewed
    source_id: c22-0129
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Because Silvaner moves early in the season, what vineyard risk is high?
      choices:
        - { text: "It never breaks bud, so frost cannot matter", correct: false }
        - { text: "Spring frost damage", correct: true }
        - { text: "A legal ban on planting on slopes", correct: false }
        - { text: "Only sunburn, never cold", correct: false }
      explanation: |
        **Spring frost damage.** Early budburst leaves the
        shoots exposed when an April frost still comes.

  - id: germany-franken-warm-sites-001
    type: mcq
    deck: Germany
    tags: [germany, franken, silvaner]
    status: reviewed
    source_id: c22-0130
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Franken growers typically plant Silvaner on which sites?
      choices:
        - { text: "The coldest north-facing flats", correct: false }
        - { text: "The warmest sites", correct: true }
        - { text: "Only indoor glasshouses", correct: false }
        - { text: "Any frost hollow, because the grape is late", correct: false }
      explanation: |
        **The warmest sites.** Early flowering needs heat, and
        those sites are what let Franken Silvaner ripen fully.

  - id: germany-franken-silvaner-ripe-001
    type: mcq
    deck: Germany
    tags: [germany, franken, silvaner]
    status: reviewed
    source_id: c22-0131
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: On Franken's warmest slopes, Silvaner can reach which ripeness, compared with most other German plantings?
      choices:
        - { text: "It never ripens, by law", correct: false }
        - { text: "A ripeness seldom seen elsewhere in Germany", correct: true }
        - { text: "Only ice-wine sugars, every vintage", correct: false }
        - { text: "No sugar at all", correct: false }
      explanation: |
        **A ripeness seldom seen elsewhere in Germany.** Heat
        on those slopes gives the dry, rich Franken bottle.
        Rheinhessen holds many Silvaner hectares; Franken is
        the ripeness address.

  - id: germany-franken-wurzburg-001
    type: mcq
    deck: Germany
    tags: [germany, franken]
    status: reviewed
    source_id: c22-0132
    review:
