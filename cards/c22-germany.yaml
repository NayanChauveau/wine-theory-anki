cards:
  - id: germany-climate-001
    type: mcq
    deck: Germany
    tags: [germany, climate]
    status: reviewed
    source_id: c22-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate type best describes Germany's principal wine regions?"
      choices:
        - { text: "Cool maritime", correct: false }
        - { text: "Cool continental", correct: true }
        - { text: "Warm continental", correct: false }
        - { text: "Mediterranean", correct: false }
      explanation: |
        **Cool continental.** A short growing season and marked vintage variation make successful aspect and slope especially important.
    fr:
      question: "Quel type de climat caractérise le mieux les principales régions viticoles allemandes ?"
      choices:
        - { text: "Maritime frais", correct: false }
        - { text: "Continental frais", correct: true }
        - { text: "Continental chaud", correct: false }
        - { text: "Méditerranéen", correct: false }
      explanation: |
        **Continental frais.** La saison végétative courte et la forte variation entre millésimes rendent l'exposition et la pente particulièrement importantes.

  - id: germany-rainfall-001
    type: mcq
    deck: Germany
    tags: [germany, climate]
    status: reviewed
    source_id: c22-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "At which stages can rain be especially damaging in German vineyards?"
      choices:
        - { text: "Budburst and véraison", correct: false }
        - { text: "Flowering and harvest", correct: true }
        - { text: "Véraison and leaf fall", correct: false }
        - { text: "Dormancy and pruning", correct: false }
      explanation: |
        **Flowering and harvest.** Rain can disrupt fruit set early in the season and promote dilution or rot as grapes approach picking.
    fr:
      question: "À quels stades la pluie peut-elle être particulièrement dommageable dans les vignobles allemands ?"
      choices:
        - { text: "Débourrement et véraison", correct: false }
        - { text: "Floraison et vendanges", correct: true }
        - { text: "Véraison et chute des feuilles", correct: false }
        - { text: "Dormance et taille", correct: false }
      explanation: |
        **Floraison et vendanges.** La pluie peut perturber la nouaison en début de saison, puis favoriser la dilution ou la pourriture à l'approche de la récolte.

  - id: germany-baden-warm-001
    type: mcq
    deck: Germany
    tags: [germany, baden, climate]
    status: reviewed
    source_id: c22-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which German Anbaugebiet has the warmest overall climate?"
      choices:
        - { text: "Mosel", correct: false }
        - { text: "Baden", correct: true }
        - { text: "Rheingau", correct: false }
        - { text: "Nahe", correct: false }
      explanation: |
        **Baden.** Its southerly position and warm districts such as Kaiserstuhl favour fuller wines and make Spätburgunder especially important.
    fr:
      question: "Quel Anbaugebiet allemand possède globalement le climat le plus chaud ?"
      choices:
        - { text: "Mosel", correct: false }
        - { text: "Baden", correct: true }
        - { text: "Rheingau", correct: false }
        - { text: "Nahe", correct: false }
      explanation: |
        **Baden.** Sa position méridionale et des secteurs chauds comme le Kaiserstuhl favorisent des vins plus corsés et donnent une place majeure au Spätburgunder.

  - id: germany-ripen-acid-001
    type: mcq
    deck: Germany
    tags: [germany, climate]
    status: reviewed
    source_id: c22-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Germany's long, cool ripening season typically affect grape composition?"
      choices:
        - { text: "Low sugar and low acidity", correct: false }
        - { text: "Ripe sugar with retained acidity", correct: true }
        - { text: "High sugar with rapidly falling acidity", correct: false }
        - { text: "Ripe tannin with persistently low sugar", correct: false }
      explanation: |
        **Ripe sugar with retained acidity.** Slow ripening can build flavour and sugar without the rapid acid loss associated with hotter climates.
    fr:
      question: "Comment la maturation longue et fraîche de l'Allemagne influence-t-elle généralement la composition des raisins ?"
      choices:
        - { text: "Peu de sucre et peu d'acidité", correct: false }
        - { text: "Sucres mûrs et acidité préservée", correct: true }
        - { text: "Beaucoup de sucre et acidité en forte baisse", correct: false }
        - { text: "Tanins mûrs mais sucres toujours faibles", correct: false }
      explanation: |
        **Sucres mûrs et acidité préservée.** La maturation lente permet de développer les arômes et les sucres sans la chute rapide d'acidité observée sous des climats plus chauds.

  - id: germany-botrytis-all-001
    type: mcq
    deck: Germany
    tags: [germany, sweet]
    status: reviewed
    source_id: c22-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are botrytised German sweet wines not produced reliably every year?"
      choices:
        - { text: "They require a suitably humid autumn", correct: true }
        - { text: "They require grapes frozen on the vine", correct: false }
        - { text: "They require a hot and completely dry autumn", correct: false }
        - { text: "They require compulsory fortification", correct: false }
      explanation: |
        **They require a suitably humid autumn.** Noble rot needs moist conditions to establish, followed by weather that allows berries to shrivel without destructive grey rot.
    fr:
      question: "Pourquoi les vins doux botrytisés allemands ne peuvent-ils pas être produits régulièrement chaque année ?"
      choices:
        - { text: "Ils exigent un automne suffisamment humide", correct: true }
        - { text: "Ils exigent des raisins gelés sur pied", correct: false }
        - { text: "Ils exigent un automne chaud et totalement sec", correct: false }
        - { text: "Ils exigent un mutage obligatoire", correct: false }
      explanation: |
        **Ils exigent un automne suffisamment humide.** La pourriture noble a besoin d'humidité pour s'installer, puis d'un temps permettant aux baies de se flétrir sans évoluer vers la pourriture grise.

  - id: germany-vintage-rain-001
    type: mcq
    deck: Germany
    tags: [germany, climate]
    status: reviewed
    source_id: c22-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which factor best explains Germany's marked vintage variation?"
      choices:
        - { text: "Annual changes in temperature and rainfall", correct: true }
        - { text: "Permanent differences in vineyard soil", correct: false }
        - { text: "The fixed orientation of each slope", correct: false }
        - { text: "The grape variety planted in each parcel", correct: false }
      explanation: |
        **Annual changes in temperature and rainfall.** In a cool climate, small differences in warmth and rain can strongly affect ripeness, disease pressure and harvest conditions.
    fr:
      question: "Quel facteur explique le mieux les fortes variations entre millésimes en Allemagne ?"
      choices:
        - { text: "Les variations annuelles de température et de pluie", correct: true }
        - { text: "Les différences permanentes entre les sols", correct: false }
        - { text: "L'orientation fixe de chaque coteau", correct: false }
        - { text: "Le cépage planté dans chaque parcelle", correct: false }
      explanation: |
        **Les variations annuelles de température et de pluie.** Sous un climat frais, de faibles écarts de chaleur et de précipitations influencent fortement la maturité, les maladies et les conditions de récolte.

  - id: germany-site-margin-001
    type: mcq
    deck: Germany
    tags: [germany, climate]
    status: reviewed
    source_id: c22-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why are steep, south-facing slopes valuable in Germany's coolest wine regions?"
      choices:
        - { text: "They maximise sunlight and warmth", correct: true }
        - { text: "They retain more cold air overnight", correct: false }
        - { text: "They delay ripening through extra shade", correct: false }
        - { text: "They increase soil fertility and vigour", correct: false }
      explanation: |
        **They maximise sunlight and warmth.** Slope and aspect can determine whether grapes reach full ripeness in Germany's coolest sites.
    fr:
      question: "Pourquoi les coteaux pentus exposés au sud sont-ils précieux dans les régions allemandes les plus fraîches ?"
      choices:
        - { text: "Ils maximisent l'ensoleillement et la chaleur", correct: true }
        - { text: "Ils retiennent davantage d'air froid la nuit", correct: false }
        - { text: "Ils retardent la maturité par un ombrage accru", correct: false }
        - { text: "Ils augmentent la fertilité et la vigueur", correct: false }
      explanation: |
        **Ils maximisent l'ensoleillement et la chaleur.** Dans les sites allemands les plus frais, la pente et l'exposition peuvent déterminer si les raisins atteignent leur pleine maturité.

  - id: germany-best-site-001
    type: mcq
    deck: Germany
    tags: [germany]
    status: reviewed
    source_id: c22-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which site combination is generally most favourable in Germany's coolest regions?"
      choices:
        - { text: "Gentle north-facing slopes with deep clay", correct: false }
        - { text: "Steep southerly slopes with stony soils", correct: true }
        - { text: "Flat east-facing sites with fertile loam", correct: false }
        - { text: "Low west-facing sites with heavy clay", correct: false }
      explanation: |
        **Steep southerly slopes with stony soils.** They intercept more sunlight, drain well and can store heat in a climate where ripening is often the limiting factor.
    fr:
      question: "Quelle combinaison de site est généralement la plus favorable dans les régions allemandes les plus fraîches ?"
      choices:
        - { text: "Pentes douces au nord sur argiles profondes", correct: false }
        - { text: "Coteaux pentus au sud sur sols pierreux", correct: true }
        - { text: "Terrains plats à l'est sur limons fertiles", correct: false }
        - { text: "Bas de coteau à l'ouest sur argiles lourdes", correct: false }
      explanation: |
        **Coteaux pentus au sud sur sols pierreux.** Ils captent davantage de soleil, se drainent bien et peuvent emmagasiner de la chaleur là où la maturité constitue souvent le facteur limitant.

  - id: germany-handwork-001
    type: mcq
    deck: Germany
    tags: [germany, viticulture]
    status: reviewed
    source_id: c22-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which working method is most practical on Germany's steepest vineyard slopes?"
      choices:
        - { text: "Standard tractors and trailed harvesters", correct: false }
        - { text: "Hand labour supported by winches", correct: true }
        - { text: "Large over-row harvesters", correct: false }
        - { text: "High-clearance straddle tractors", correct: false }
      explanation: |
        **Hand labour supported by winches.** Extreme gradients restrict conventional machinery, increasing both labour needs and production costs.
    fr:
      question: "Quelle méthode de travail est la plus adaptée aux coteaux viticoles allemands les plus pentus ?"
      choices:
        - { text: "Tracteurs standards et machines tractées", correct: false }
        - { text: "Travail manuel assisté par des treuils", correct: true }
        - { text: "Grandes machines à vendanger enjambeuses", correct: false }
        - { text: "Tracteurs enjambeurs à grand dégagement", correct: false }
      explanation: |
        **Travail manuel assisté par des treuils.** Les pentes extrêmes limitent l'emploi des machines conventionnelles, ce qui accroît les besoins en main-d'œuvre et les coûts de production.

  - id: germany-stake-train-001
    type: mcq
    deck: Germany
    tags: [germany, viticulture]
    status: reviewed
    source_id: c22-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vine-training system is traditional on Germany's steepest slopes?"
      choices:
        - { text: "Single-stake training", correct: true }
        - { text: "Geneva Double Curtain", correct: false }
        - { text: "Pergola training", correct: false }
        - { text: "Untrained bush vines", correct: false }
      explanation: |
        **Single-stake training.** Each head-pruned vine has its own stake, a layout suited to narrow, irregular terraces where wire trellises and tractors are difficult to use.
    fr:
      question: "Quel système de conduite est traditionnel sur les coteaux allemands les plus pentus ?"
      choices:
        - { text: "Conduite sur échalas individuel", correct: true }
        - { text: "Geneva Double Curtain", correct: false }
        - { text: "Conduite en pergola", correct: false }
        - { text: "Gobelet sans support", correct: false }
      explanation: |
        **Conduite sur échalas individuel.** Chaque vigne taillée en tête possède son propre tuteur, une disposition adaptée aux terrasses étroites et irrégulières où palissage et tracteurs sont difficiles à employer.

  - id: germany-river-sun-001
    type: mcq
    deck: Germany
    tags: [germany, climate]
    status: reviewed
    source_id: c22-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a river directly increase the solar energy received by nearby German vineyards?"
      choices:
        - { text: "By reflecting sunlight onto the slopes", correct: true }
        - { text: "By increasing afternoon cloud cover", correct: false }
        - { text: "By creating shade across the valley", correct: false }
        - { text: "By lowering the sun's angle", correct: false }
      explanation: |
        **By reflecting sunlight onto the slopes.** This extra radiation assists ripening on well-positioned vineyards beside the Mosel and Rhine.
    fr:
      question: "Comment un fleuve peut-il augmenter directement l'énergie solaire reçue par les vignobles allemands voisins ?"
      choices:
        - { text: "En réfléchissant la lumière vers les coteaux", correct: true }
        - { text: "En renforçant les nuages l'après-midi", correct: false }
        - { text: "En projetant de l'ombre dans la vallée", correct: false }
        - { text: "En abaissant l'angle du soleil", correct: false }
      explanation: |
        **En réfléchissant la lumière vers les coteaux.** Ce rayonnement supplémentaire favorise la maturité des vignobles bien situés au bord de la Mosel et du Rhin.

  - id: germany-river-frost-001
    type: mcq
    deck: Germany
    tags: [germany, climate]
    status: reviewed
    source_id: c22-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can a large, flowing river reduce spring-frost risk in a nearby German vineyard?"
      choices:
        - { text: "By moderating temperature and encouraging air movement", correct: true }
        - { text: "By delaying budburst through permanent shade", correct: false }
        - { text: "By increasing cold-air pooling on the valley floor", correct: false }
        - { text: "By keeping the surrounding soil frozen", correct: false }
      explanation: |
        **By moderating temperature and encouraging air movement.** The effect is local; low-lying frost pockets can still be vulnerable.
    fr:
      question: "Comment un grand cours d'eau peut-il réduire le risque de gel printanier dans un vignoble allemand voisin ?"
      choices:
        - { text: "En modérant la température et en favorisant la circulation de l'air", correct: true }
        - { text: "En retardant le débourrement par un ombrage permanent", correct: false }
        - { text: "En renforçant l'accumulation d'air froid en fond de vallée", correct: false }
        - { text: "En maintenant gelés les sols environnants", correct: false }
      explanation: |
        **En modérant la température et en favorisant la circulation de l'air.** L'effet reste local : les cuvettes où s'accumule l'air froid peuvent demeurer vulnérables.

  - id: germany-must-weight-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which measurement underpins Germany's Prädikat categories at harvest?"
      choices:
        - { text: "Titratable acidity", correct: false }
        - { text: "Must weight", correct: true }
        - { text: "Berry pH", correct: false }
        - { text: "Phenolic ripeness", correct: false }
      explanation: |
        **Must weight.** It estimates dissolved solids, chiefly sugar, and therefore potential alcohol; it does not prescribe the wine's final sweetness.
    fr:
      question: "Quelle mesure fonde les catégories Prädikat allemandes au moment de la récolte ?"
      choices:
        - { text: "Acidité totale", correct: false }
        - { text: "Poids du moût", correct: true }
        - { text: "pH des baies", correct: false }
        - { text: "Maturité phénolique", correct: false }
      explanation: |
        **Poids du moût.** Il estime les matières dissoutes, principalement les sucres, et donc l'alcool potentiel ; il ne détermine pas la douceur finale du vin.

  - id: germany-harvest-spread-001
    type: mcq
    deck: Germany
    tags: [germany, viticulture]
    status: reviewed
    source_id: c22-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How long can selective harvesting for several German Prädikat levels extend?"
      choices:
        - { text: "One or two days", correct: false }
        - { text: "Several weeks or even months", correct: true }
        - { text: "Exactly one calendar week", correct: false }
        - { text: "Only until the first rain", correct: false }
      explanation: |
        **Several weeks or even months.** Early picks may supply lighter wines, while fruit for noble-sweet wine or Eiswein remains on the vine much longer.
    fr:
      question: "Combien de temps les vendanges sélectives destinées à plusieurs niveaux de Prädikat peuvent-elles s'étendre ?"
      choices:
        - { text: "Un ou deux jours", correct: false }
        - { text: "Plusieurs semaines, voire plusieurs mois", correct: true }
        - { text: "Exactement une semaine", correct: false }
        - { text: "Seulement jusqu'à la première pluie", correct: false }
      explanation: |
        **Plusieurs semaines, voire plusieurs mois.** Les premières tries peuvent fournir les vins les plus légers, tandis que les raisins destinés aux liquoreux ou à l'Eiswein restent beaucoup plus longtemps sur pied.

  - id: germany-one-vineyard-range-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What can one German vineyard produce from a single vintage when its fruit is picked and sorted selectively?"
      choices:
        - { text: "Only one Prädikat level", correct: false }
        - { text: "Several Qualität and Prädikat lots", correct: true }
        - { text: "Only dry Qualitätswein", correct: false }
        - { text: "Only botrytised Prädikatswein", correct: false }
      explanation: |
        **Several Qualität and Prädikat lots.** Differences in ripeness and berry condition allow one site to supply more than one legal category and style.
    fr:
      question: "Que peut produire un même vignoble allemand au cours d'un millésime lorsque ses raisins sont récoltés et triés sélectivement ?"
      choices:
        - { text: "Un seul niveau de Prädikat", correct: false }
        - { text: "Plusieurs lots de Qualität et de Prädikat", correct: true }
        - { text: "Uniquement du Qualitätswein sec", correct: false }
        - { text: "Uniquement du Prädikatswein botrytisé", correct: false }
      explanation: |
        **Plusieurs lots de Qualität et de Prädikat.** Les écarts de maturité et d'état sanitaire permettent à un site d'alimenter plusieurs catégories légales et plusieurs styles.

  - id: germany-multipass-001
    type: mcq
    deck: Germany
    tags: [germany, viticulture]
    status: reviewed
    source_id: c22-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which harvesting approach best separates fruit for different Prädikat levels?"
      choices:
        - { text: "One pass followed by blending", correct: false }
        - { text: "Several selective passes through the rows", correct: true }
        - { text: "One pass at identical ripeness", correct: false }
        - { text: "Mechanical harvesting before full ripeness", correct: false }
      explanation: |
        **Several selective passes through the rows.** Successive tries allow pickers to take each bunch or berry when it reaches the required ripeness and condition.
    fr:
      question: "Quelle méthode de vendange sépare le mieux les raisins destinés à différents niveaux de Prädikat ?"
      choices:
        - { text: "Un passage suivi d'un assemblage", correct: false }
        - { text: "Plusieurs tries successives dans les rangs", correct: true }
        - { text: "Un passage à maturité identique", correct: false }
        - { text: "Une vendange mécanique avant pleine maturité", correct: false }
      explanation: |
        **Plusieurs tries successives dans les rangs.** Elles permettent de prélever chaque grappe ou chaque baie lorsqu'elle atteint la maturité et l'état recherchés.

  - id: germany-sort-after-001
    type: mcq
    deck: Germany
    tags: [germany, viticulture]
    status: reviewed
    source_id: c22-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How can grapes picked on the same day still be divided into different Prädikat lots?"
      choices:
        - { text: "By sorting for ripeness and condition", correct: true }
        - { text: "By separating berries by skin colour", correct: false }
        - { text: "By assigning lots after bottling", correct: false }
        - { text: "By ageing each lot in a different bottle", correct: false }
      explanation: |
        **By sorting for ripeness and condition.** Selection in the vineyard or on a sorting table can separate fruit with different must weights or levels of botrytis.
    fr:
      question: "Comment des raisins récoltés le même jour peuvent-ils encore être répartis entre différents lots de Prädikat ?"
      choices:
        - { text: "Par un tri selon la maturité et l'état sanitaire", correct: true }
        - { text: "En séparant les baies selon la couleur de leur pellicule", correct: false }
        - { text: "En attribuant les lots après la mise en bouteille", correct: false }
        - { text: "En élevant chaque lot dans une bouteille différente", correct: false }
      explanation: |
        **Par un tri selon la maturité et l'état sanitaire.** La sélection à la vigne ou sur table peut séparer des raisins présentant différents poids de moût ou degrés de botrytisation.

  - id: germany-dry-trend-001
    type: mcq
    deck: Germany
    tags: [germany]
    status: reviewed
    source_id: c22-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which style has gained the greatest share of modern German wine production?"
      choices:
        - { text: "Medium-sweet wine", correct: false }
        - { text: "Dry wine", correct: true }
        - { text: "Noble-sweet wine", correct: false }
        - { text: "Fortified wine", correct: false }
      explanation: |
        **Dry wine.** Domestic demand has made trocken styles central to modern German production, even though residually sweet wines remain important.
    fr:
      question: "Quel style a le plus gagné en importance dans la production allemande moderne ?"
      choices:
        - { text: "Vin demi-doux", correct: false }
        - { text: "Vin sec", correct: true }
        - { text: "Vin liquoreux", correct: false }
        - { text: "Vin fortifié", correct: false }
      explanation: |
        **Vin sec.** La demande intérieure a placé les styles trocken au cœur de la production moderne, sans faire disparaître les vins contenant des sucres résiduels.

  - id: germany-dry-market-001
    type: mcq
    deck: Germany
    tags: [germany]
    status: reviewed
    source_id: c22-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which market has chiefly driven Germany's move toward dry wine?"
      choices:
        - { text: "The German domestic market", correct: true }
        - { text: "The British export market", correct: false }
        - { text: "The United States export market", correct: false }
        - { text: "The Scandinavian export market", correct: false }
      explanation: |
        **The German domestic market.** Changing preferences among German drinkers encouraged producers to make a much larger proportion of trocken wines.
    fr:
      question: "Quel marché a principalement entraîné l'évolution de l'Allemagne vers les vins secs ?"
      choices:
        - { text: "Le marché intérieur allemand", correct: true }
