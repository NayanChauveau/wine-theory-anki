        - { text: "Fortified only", correct: false }
        - { text: "Sweetness is illegal in Pfalz", correct: false }
      explanation: |
        **Dry.** Trocken is the habit, not a legal ban. A
        Prädikat on the label still ranks must weight at
        harvest, not residual sugar in the bottle.

  - id: germany-baden-body-001
