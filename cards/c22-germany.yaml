        - { text: "Always thin, green and sparkling red", correct: false }
        - { text: "Fortified only, like Port", correct: false }
      explanation: |
        **The fullest-bodied, with the highest alcohol.** Extra
        heat ripens sugar that cooler Mosel or Ahr sites do not
        reach as easily.

  - id: germany-baden-spread-001
