        - { text: "South-facing slopes around Würzburg", correct: true }
        - { text: "Only the Mosel walls at Piesport", correct: false }
        - { text: "Indoor terraces in Berlin", correct: false }
      explanation: |
        **South-facing slopes around Würzburg.** The Stein and
        Leiste are named, checkable sites on that town side of
        the Main. Iphofen and Escherndorf are other good
        addresses, not a second capital.

  - id: germany-franken-style-001
    type: mcq
    deck: Germany
    tags: [germany, franken]
    status: reviewed
    source_id: c22-0133
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: The best Franken Silvaner is typically which sweetness and palate pair?
      choices:
        - { text: "Sparkling red, with no fruit", correct: false }
        - { text: "Dry, with a rich mid-palate and an earthy note", correct: true }
        - { text: "Fortified only", correct: false }
        - { text: "Always lusciously sweet, like TBA", correct: false }
      explanation: |
        **Dry, with a rich mid-palate and an earthy note.**
        Quieter fruit than Riesling; dry is the habit, not a
        ban on sweeter bottlings.

  - id: germany-bocksbeutel-001
    type: mcq
    deck: Germany
    tags: [germany, franken]
    status: reviewed
    source_id: c22-0134
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Franken Silvaner is often packed in which distinctive bottle?
      choices:
        - { text: "A tall, thin Alsace flute only", correct: false }
        - { text: "A flattened, flask-shaped bottle (Bocksbeutel)", correct: true }
        - { text: "A heavy Port bottle with a whitewash", correct: false }
        - { text: "No bottle — it must be sold in barrel", correct: false }
      explanation: |
        **A flattened, flask-shaped bottle (Bocksbeutel).** The
        squat flask is the Franken pack, not a quality rank and
        not a Prädikat.

  - id: germany-franken-gg-001
    type: mcq
    deck: Germany
    tags: [germany, franken]
    status: reviewed
    source_id: c22-0135
    review:
      fact_check: pass
      sources: [aoc-site]
    en:
      question: Which four grapes may a Franken VDP Grosses Gewächs be made from?
      choices:
        - { text: "Only Müller-Thurgau and Elbling", correct: false }
        - { text: "Silvaner, Riesling, Weißburgunder and Spätburgunder", correct: true }
        - { text: "Any grape, including Dornfelder", correct: false }
        - { text: "Grauburgunder only", correct: false }
      explanation: |
        **Silvaner, Riesling, Weißburgunder and
        Spätburgunder.** That is the VDP Franken Grosse Lage
        list. Grauburgunder is allowed at Erste Lage, not for
        Grosses Gewächs. GG is a VDP term, not a legal-ladder
        rung.

  - id: germany-landwein-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0136
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: "Which German term marks the PGI tier, below Qualitätswein?"
      choices:
        - { text: Only Trockenbeerenauslese, correct: false }
        - { text: Landwein, correct: true }
        - { text: Premier Cru Classé, correct: false }
        - { text: A legal seventh Prädikat above TBA, correct: false }
      explanation: |
        **Landwein.** It is the PGI class, below the PDO pair
        Qualitätswein and Prädikatswein. It is not a sweetness
        name.

  - id: germany-deutscher-wein-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0137
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: German wine with no geographical indication is labelled as which class?
      choices:
        - { text: "Qualitätswein", correct: false }
        - { text: "Deutscher Wein", correct: true }
        - { text: "Only as Vin de France, by law", correct: false }
        - { text: "Grosses Gewächs, a legal Prädikat", correct: false }
      explanation: |
        **Deutscher Wein.** Fruit can come from anywhere in
        Germany. Qualitätswein and Prädikatswein need an
        Anbaugebiet. Grosses Gewächs is a VDP tag, not this
        class.

  - id: germany-13-anbaugebiete-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0138
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: Qualitätswein and Prädikatswein are confined to how many Anbaugebiete?
      choices:
        - { text: "Two, Mosel and nothing else", correct: false }
        - { text: "13", correct: true }
        - { text: One nationwide zone, correct: false }
        - { text: "Fifty, one per village", correct: false }
      explanation: |
        **13.** Each Anbaugebiet is a PDO wrapper for
        Qualitätswein and Prädikatswein, from the Ahr to
        Sachsen.

  - id: germany-pdo-varieties-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0139
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Unlike many French AOCs, a German Anbaugebiet PDO is generally not tied to what?
      choices:
        - { text: "A map, or any place name", correct: false }
        - { text: "A short, legally fixed list of grape varieties", correct: true }
        - { text: "Any wine at all — PDO is illegal in Germany", correct: false }
        - { text: "A bottle, because German wine is sold only in barrel", correct: false }
      explanation: |
        **A short, legally fixed list of grape varieties.**
        Many grapes may be planted in one Anbaugebiet. France
        often locks an AOC to a few varieties; Germany does
        not use that model.

  - id: germany-varietal-label-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0140
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: German bottles usually name the wine how, besides any place?
      choices:
        - { text: "Only by barrel toast, never by grape", correct: false }
        - { text: "By grape variety", correct: true }
        - { text: "Variety names are illegal on German labels", correct: false }
        - { text: "Only as a sparkling red blend, with no variety", correct: false }
      explanation: |
        **By grape variety.** Varietal labelling is the habit,
        not a legal must. If a variety is named, most of the
        wine has to be that grape.

  - id: germany-label-must-weight-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0140
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Next to a grape name, German quality classes are sorted by which harvest measure?
      choices:
        - { text: "Bottle sweetness, read as if Prädikat were residual sugar", correct: false }
        - { text: "Minimum must weight at harvest", correct: true }
        - { text: "Years in new oak", correct: false }
        - { text: "VDP vineyard ranks, as if they were the law", correct: false }
      explanation: |
        **Minimum must weight at harvest.** That is the
        Prädikat idea. A Spätlese can be trocken; the word
        does not fix sweetness in the bottle.

  - id: germany-pdo-two-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0141
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: German PDO wine is split into which two legal classes?
      choices:
        - { text: "Only Deutscher Wein and nothing else", correct: false }
        - { text: "Qualitätswein and Prädikatswein", correct: true }
        - { text: "Premier Cru and Grand Cru, as in Burgundy", correct: false }
        - { text: "Grosses Gewächs and a legal seventh Prädikat", correct: false }
      explanation: |
        **Qualitätswein and Prädikatswein.** Those are the two
        PDO rungs. Deutscher Wein and Landwein sit below them.
        Grosses Gewächs is a VDP extra, not a third legal
        class.

  - id: germany-six-pradikat-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0142
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: Prädikatswein is divided into how many Prädikat rungs?
      choices:
        - { text: "Two, dry and sweet only", correct: false }
        - { text: "Six", correct: true }
        - { text: "One, identical to Qualitätswein", correct: false }
        - { text: "Twenty, one per village", correct: false }
      explanation: |
        **Six.** Kabinett, Spätlese, Auslese, Beerenauslese,
        Eiswein and Trockenbeerenauslese, ranked by must
        weight at harvest, not by residual sugar.

  - id: germany-pdo-one-region-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0143
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: Fruit for a German PDO bottle must come from how many Anbaugebiete?
      choices:
        - { text: "Any mix of all 13, in one vat", correct: false }
        - { text: "Only one", correct: true }
        - { text: "At least four, by law", correct: false }
        - { text: "None — PDO wine may not name a region", correct: false }
      explanation: |
        **Only one.** A Qualitätswein or Prädikatswein cannot
        blend Mosel fruit with Pfalz fruit and keep one PDO
        name.

  - id: germany-label-region-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0144
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: A Qualitätswein or Prädikatswein label has to name which geographic unit?
      choices:
        - { text: Only the winemaker's first name, correct: false }
        - { text: "The Anbaugebiet / specified region", correct: true }
        - { text: A French département, correct: false }
        - { text: No place name is allowed, correct: false }
      explanation: |
        **The Anbaugebiet / specified region.** Qualitätswein
        and Prädikatswein have to name that one region.

  - id: germany-label-pradikat-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0144
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: Besides the Anbaugebiet, what extra word must a Prädikatswein label carry?
      choices:
        - { text: "A VDP Grosses Gewächs stamp, by law", correct: false }
        - { text: "The Prädikat rung", correct: true }
        - { text: "The word Halbtrocken, on every bottle", correct: false }
        - { text: "Nothing else may be printed", correct: false }
      explanation: |
        **The Prädikat rung.** Kabinett through
        Trockenbeerenauslese has to be stated. That rung is
        must weight at harvest, not a sweetness recipe.
        Varietal naming is common, not this required extra.

  - id: germany-trocken-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0145
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: On a German label, Trocken tells you the wine is which sweetness?
      choices:
        - { text: "Lusciously sweet, like TBA", correct: false }
        - { text: "Dry", correct: true }
        - { text: "Fortified only", correct: false }
        - { text: "Trocken is a harvest-weight Prädikat, not a sweetness word", correct: false }
      explanation: |
        **Dry.** Trocken is a residual-sugar term. It can sit
        on Qualitätswein or on Kabinett, Spätlese or Auslese.
        It is not itself a Prädikat.

  - id: germany-halbtrocken-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0145
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: On a German label, Halbtrocken points to which sweetness band?
      choices:
        - { text: "Bone dry, with no residual sugar allowed", correct: false }
        - { text: "Off-dry to medium", correct: true }
        - { text: "A legal seventh Prädikat above TBA", correct: false }
        - { text: "Only a sparkling red", correct: false }
      explanation: |
        **Off-dry to medium.** Halbtrocken is a defined
        residual-sugar band, not a must-weight class.

  - id: germany-feinherb-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0146
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which unofficial word do some German estates print instead of Halbtrocken?
      choices:
        - { text: "Premier Cru Classé", correct: false }
        - { text: "Feinherb", correct: true }
        - { text: "Grosses Gewächs, as if it were a sweetness term", correct: false }
        - { text: "Deutscher Wein only", correct: false }
      explanation: |
        **Feinherb.** It signals a lightly sweet style in the
        Halbtrocken neighbourhood, without being a legal class.

  - id: germany-feinherb-why-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0146
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why do some German producers print Feinherb rather than Halbtrocken?
      choices:
        - { text: "Feinherb is a higher legal Prädikat than TBA", correct: false }
        - { text: "They feel Halbtrocken reads as a cheaper style", correct: true }
        - { text: "Halbtrocken is illegal on every German bottle", correct: false }
        - { text: "Feinherb is required on all Riesling, by law", correct: false }
      explanation: |
        **They feel Halbtrocken reads as a cheaper style.**
        Feinherb is a marketing word, not a cleaner legal
        definition.

  - id: germany-feinherb-legal-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0147
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: What residual-sugar limits does German law set for the word Feinherb?
      choices:
        - { text: "Exactly 12 g/L, on every bottle", correct: false }
        - { text: "None — Feinherb has no legal definition", correct: true }
        - { text: "The same band as Trockenbeerenauslese", correct: false }
        - { text: "Feinherb may be used only on red Sekt", correct: false }
      explanation: |
        **None — Feinherb has no legal definition.** Halbtrocken
        does have limits. Feinherb does not.

  - id: germany-sweetness-clues-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0148
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Besides words such as Trocken or Feinherb, what else on a German label can hint at residual sugar?
      choices:
        - { text: "The Prädikat alone, which fixes bottle sweetness", correct: false }
        - { text: "Alcohol strength, and whether the wine is Beerenauslese, Trockenbeerenauslese or Eiswein", correct: true }
        - { text: "Only the colour of the capsule", correct: false }
        - { text: "Nothing — sweetness may never be inferred", correct: false }
      explanation: |
        **Alcohol strength, and whether the wine is
        Beerenauslese, Trockenbeerenauslese or Eiswein.** Those
        three Prädikate stay sweet. Kabinett, Spätlese, Auslese
        and Qualitätswein can be dry or sweeter; lower alcohol
        often means leftover sugar. Prädikat still ranks must
        weight, not a sweetness recipe.

  - id: germany-lage-name-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0149
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: When a German label names a vineyard, the usual order is which pair?
      choices:
        - { text: "Grape first, then the winemaker's nickname", correct: false }
        - { text: "Village name, then vineyard name", correct: true }
        - { text: "Only a French cru classé rank", correct: false }
        - { text: "Vineyard names are illegal", correct: false }
      explanation: |
        **Village name, then vineyard name.** Piesporter
        Goldtröpfchen is the named, checkable pattern — village
        stem plus site. That pattern does not, by itself, prove
        a single Einzellage.

  - id: germany-grosslage-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0150
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: Why can a German village-plus-site name fail to prove fruit from one vineyard?
      choices:
        - { text: "Every named site is a single vineyard, by law", correct: false }
        - { text: "A Großlage can wear the same village-plus-name pattern as an Einzellage", correct: true }
        - { text: "Place names are banned on German bottles", correct: false }
        - { text: "Only the price, and never the wording, may appear", correct: false }
      explanation: |
        **A Großlage can wear the same village-plus-name
        pattern as an Einzellage.** Piesporter Michelsberg
        covered many sites; Piesporter Goldtröpfchen is one
        vineyard. Price and producer were the practical clues.
        From the 2026 harvest, Bereich and Großlage names must
        be prefixed with Region, so the lookalike is being
        closed.
