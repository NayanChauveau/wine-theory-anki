        - { text: "A peat bog", correct: false }
        - { text: "A coral atoll", correct: false }
      explanation: |
        **An extinct volcano.** Dark volcanic soils on those
        slopes hold heat that a cool German year still needs.

  - id: germany-kaiserstuhl-south-001
