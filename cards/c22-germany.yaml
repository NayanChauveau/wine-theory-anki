    fr:
      question: "Qu'est-ce que le VDP dans le contexte de la classification des vins allemands ?"
      choices:
        - { text: "L'autorité fédérale qui rédige la loi viticole", correct: false }
        - { text: "Une association privée de domaines axés sur la qualité", correct: true }
        - { text: "L'AOP réservée à tous les effervescents allemands", correct: false }
        - { text: "Le laboratoire qui attribue chaque niveau de Prädikat", correct: false }
      explanation: |
        **Une association privée de domaines axés sur la qualité.** Sa pyramide Gutswein–Ortswein–Erste Lage–Grosse Lage s'applique à ses membres. Elle reste distincte de la loi viticole, bien qu'elle l'ait influencée.

