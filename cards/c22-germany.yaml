        - { text: "It guarantees a higher final alcohol level", correct: false }
        - { text: "It removes all residual sugar", correct: false }
        - { text: "It triggers malolactic conversion", correct: false }
      explanation: |
        **It preserves a more integrated sugar-acid balance.** The wine retains part of its own fermenting sugar rather than being sweetened with unfermented must after fermentation.
    fr:
      question: "Pourquoi préfère-t-on souvent arrêter la fermentation plutôt qu'ajouter une Süssreserve pour un Kabinett doux haut de gamme ?"
      choices:
        - { text: "Cette méthode préserve un équilibre sucre-acidité plus intégré", correct: true }
        - { text: "Elle garantit un degré d'alcool final plus élevé", correct: false }
        - { text: "Elle élimine tous les sucres résiduels", correct: false }
        - { text: "Elle déclenche la fermentation malolactique", correct: false }
      explanation: |
        **Cette méthode préserve un équilibre sucre-acidité plus intégré.** Le vin conserve une partie de ses propres sucres en fermentation au lieu d'être adouci après celle-ci avec du moût non fermenté.

