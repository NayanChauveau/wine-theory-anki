  - id: germany-grosslage-001
    type: mcq
    deck: Germany
    tags: [germany, law]
    status: reviewed
    source_id: c22-0150
    review:
      fact_check: pass
      sources: [spec]
    en:
      question: Why could a pre-2026 German village-plus-site name fail to prove fruit from one vineyard?
      choices:
        - { text: "A Bereich could omit every geographic name", correct: false }
        - { text: "A Großlage could resemble an Einzellage on the label", correct: true }
        - { text: "An Ortswein had to name several villages", correct: false }
        - { text: "An Einzellage could use only the region name", correct: false }
      explanation: |
        **A Großlage could resemble an Einzellage on the label.** Piesporter
        Michelsberg covered many sites, whereas Piesporter Goldtröpfchen is a
        single vineyard. From the 2026 harvest, *Region* must precede Bereich
        and Großlage names, removing much of this ambiguity.
    fr:
      question: "Pourquoi un nom allemand associant village et site antérieur à 2026 pouvait-il ne pas prouver une origine parcellaire unique ?"
      choices:
        - { text: "Un Bereich pouvait omettre tout nom géographique", correct: false }
        - { text: "Une Großlage pouvait ressembler à une Einzellage sur l'étiquette", correct: true }
        - { text: "Un Ortswein devait nommer plusieurs villages", correct: false }
        - { text: "Une Einzellage ne pouvait utiliser que le nom régional", correct: false }
      explanation: |
        **Une Großlage pouvait ressembler à une Einzellage sur l'étiquette.** Piesporter Michelsberg couvrait de nombreux sites, tandis que Piesporter Goldtröpfchen est un vignoble individuel. À partir du millésime 2026, *Region* doit précéder les noms de Bereich et de Großlage, ce qui réduit fortement cette ambiguïté.

