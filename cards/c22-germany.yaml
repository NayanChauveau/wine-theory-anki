        - { text: Only the Ahr valley, correct: false }
      explanation: |
        **Kaiserstuhl and Tuniberg.** Statistik-BW still puts
        those two near a third of Baden's hectares. Colmar sits
        opposite across the Rhine on the Alsace bank; that is a
        location check, not the reason the share is large.

  - id: germany-kaiserstuhl-volcano-001
