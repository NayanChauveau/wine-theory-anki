        - { text: "Muscadet Sèvre-et-Maine", correct: true }
        - { text: "Savennières", correct: false }
        - { text: "Pouilly-Fumé", correct: false }
      explanation: |
        **Muscadet Sèvre-et-Maine** is the volume heart — the communes
        between the Sèvre and the Maine.

  - id: loire-muscadet-profile-001
    type: mcq
