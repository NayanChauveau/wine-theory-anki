        - { text: "Sparkling wine", correct: true }
        - { text: "Vin jaune", correct: false }
        - { text: "Fortified red", correct: false }
      explanation: |
        **Sparkling** — **Vouvray** and **Saumur / Crémant de Loire** need
        that high acid, modest sugar.

