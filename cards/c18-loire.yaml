        - { text: "12% ABV", correct: true }
        - { text: "There is no maximum", correct: false }
        - { text: "8%, like a German Kabinett", correct: false }
      explanation: |
        **12% ABV** is the cap. That is why chaptalisation talk and the
        lean profile travel together.

  - id: loire-muscadet-vessels-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0078
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Where does Muscadet usually sit between harvest and bottle now?
      choices:
        - { text: "Only new 225 L barriques, toasted heavy", correct: false }
        - { text: "Stainless steel or concrete; the old large oak is less common", correct: true }
        - { text: "Amphorae only, by AOC law", correct: false }
        - { text: "A solera in Jerez", correct: false }
      explanation: |
        **Steel or concrete** is the modern default. Large old oak still
        exists; it is not new-oak flavour.

  - id: loire-muscadet-age-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0079
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Are most Muscadet bottles built for a decade in the cellar?
      choices:
        - { text: "Yes — every sur lie must age 15 years", correct: false }
        - { text: "No — the volume style is meant to drink young", correct: true }
        - { text: "They are legally sold only after 20 years", correct: false }
        - { text: "Vintage dating is banned", correct: false }
      explanation: |
        **Drink young** for the volume wine. A few **cru communal** lots
        (**Luneau-Papin**, **Gadais**) can go longer; that is not the
        supermarket tank.

  - id: loire-sur-lie-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0080
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the Nantais speciality mention on a Muscadet Sèvre-et-Maine label?
      choices:
        - { text: "Vendange Tardive", correct: false }
        - { text: "Sur lie", correct: true }
        - { text: "Grand Cru Classé", correct: false }
        - { text: "SGN", correct: false }
      explanation: |
        **Sur lie.** Lees through the winter, bottled in spring, a bit
        more texture and a prickle of CO₂.

  - id: loire-sur-lie-bottle-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0081
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What is the earliest a Muscadet sur lie may be bottled?
      choices:
        - { text: "The same night as the pick", correct: false }
        - { text: "From 1 March after the vintage, after a winter on lees", correct: true }
        - { text: "After ten years in new oak", correct: false }
        - { text: "Only in January of year five", correct: false }
      explanation: |
        **From 1 March** after harvest, and it must have stayed on lees
        until then. Bottling can continue later that year.

  - id: loire-sur-lie-winter-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0082
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Through which season does sur lie Muscadet stay on lees before the first legal bottling?
      choices:
        - { text: "An hour, then it is filtered", correct: false }
        - { text: "Winter", correct: true }
        - { text: "Twenty years, like a vintage Port", correct: false }
        - { text: "Lees contact is banned", correct: false }
      explanation: |
        **Winter** — harvest through to the first legal bottling date.
        Long enough for texture, not a decade of élevage.

  - id: loire-lees-texture-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0083
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What do winter lees do to Muscadet?
      choices:
        - { text: "They strip all acid and add vanilla oak", correct: false }
        - { text: "They give a richer texture", correct: true }
        - { text: "They turn the wine red", correct: false }
        - { text: "They force a mandatory malo", correct: false }
      explanation: |
        **Richer texture** (and often a faint spritz). The fruit stays
        quiet; the mouthfeel is the point.

  - id: loire-sur-lie-handle-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0084
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: How do cellars keep sur lie Muscadet delicate?
      choices:
        - { text: "Weekly pump-overs and new-oak toast", correct: false }
        - { text: "By handling the wine as little as possible", correct: true }
        - { text: "By boiling the must", correct: false }
        - { text: "By blending in Syrah", correct: false }
      explanation: |
        **Minimal handling** — rack less, keep the lees blanket, bottle
        from the tank. Rough treatment kills the point.

  - id: loire-cf-fit-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, grapes]
    status: reviewed
    source_id: c18-0085
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does Cabernet Franc ripen in a cool Loire vintage when Cabernet Sauvignon often does not?
      choices:
        - { text: "It flowers and ripens late, like Cabernet Sauvignon", correct: false }
        - { text: "It flowers and ripens early", correct: true }
        - { text: "It is a white grape", correct: false }
        - { text: "INAO heats the vineyards", correct: false }
      explanation: |
        **Early flowering and ripening.** That is why Chinon and
        Saumur-Champigny can be red in a year that would leave Cabernet
        Sauvignon green.

  - id: loire-cf-style-gate-001
    type: mcq
    deck: France::Loire
