        - { text: "Sancerre and Menetou-Salon", correct: false }
        - { text: "Muscadet and Gros Plant", correct: false }
      explanation: |
        **Bonnezeaux** and **Quarts de Chaume** (the latter a grand cru).

  - id: loire-qdc-bonn-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
