        - { text: "Dry, medium alcohol, high acid, light body, subtle green fruit", correct: true }
        - { text: "Sweet, full, and botrytised every year", correct: false }
        - { text: "Tannic red, like Chinon", correct: false }
      explanation: |
        **Dry, medium alcohol, high acid, light, subtle green fruit.** A
        seafood wine. Not Chenin weight.

  - id: loire-muscadet-abv-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0077
