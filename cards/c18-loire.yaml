        - { text: "Côte-Rôtie", correct: false }
        - { text: "Vin jaune", correct: false }
      explanation: |
        **Muscadet.** The grape is Melon; the label word is the AOC
        family.

  - id: loire-muscadet-widest-001
    type: mcq
    deck: France::Loire
