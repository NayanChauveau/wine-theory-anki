        - { text: "Sand gives light, fruity, early wine; clay-limestone slopes give fuller, more tannic bottles", correct: true }
        - { text: "Soil type is illegal to mention", correct: false }
        - { text: "Both soils make only rosé", correct: false }
      explanation: |
        **Sand = light, early; clay/limestone slopes = fuller, more
        tannic.** Same grape, two Chinons in one commune.

  - id: loire-cf-oak-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0090
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Do Touraine Cabernet Francs see oak?
      choices:
        - { text: "Never — INAO bans any wood", correct: false }
        - { text: "Some domaines age in oak; it is not automatic", correct: true }
        - { text: "Always 100% new barrique, like a white Pessac", correct: false }
        - { text: "Only if the wine is sparkling", correct: false }
      explanation: |
        **Some do.** **Baudry** and others use barrels on the slope
        cuvées; the sandy early wine often stays in tank.

  - id: loire-cf-age-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0091
    review:
      fact_check: pass
