        - { text: "The far west, mostly south of the river around Nantes", correct: true }
        - { text: "Only north of Sancerre", correct: false }
        - { text: "Inside Anjou, around Angers", correct: false }
      explanation: |
        **Far west, mostly south of the Loire**, around Nantes. That is
        Muscadet country, not Vouvray.

  - id: loire-nantais-name-001
    type: mcq
