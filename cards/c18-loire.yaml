      choices:
        - { text: "Ugni Blanc and Trebbiano only", correct: false }
        - { text: "Muscadet and Melon de Bourgogne", correct: true }
        - { text: "Chenin and Pineau de la Loire", correct: false }
        - { text: "It has no synonym", correct: false }
      explanation: |
        **Melon de Bourgogne** is the grape; **Muscadet** is the wine
        (and a casual synonym). Same plant, two words.

  - id: loire-melon-fit-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, grapes]
    status: reviewed
    source_id: c18-0071
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why does Melon cope with the Nantais?
      choices:
        - { text: "It buds late and needs a long Mediterranean autumn", correct: false }
        - { text: "It ripens early, so it can finish in a cool maritime strip", correct: true }
        - { text: "It only ripens in January", correct: false }
        - { text: "It is a red grape that loves drought", correct: false }
      explanation: |
        **Early ripening** lets it finish in the Nantais. Winter wood is
        relatively hardy, but **early budbreak still leaves spring frost
        as a risk** — not a frost-proof grape.

  - id: loire-nantais-where-001
