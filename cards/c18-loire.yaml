cards:
  - id: loire-subregions-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "From east to west, what is the correct order of the Loire's four main wine regions?"
      choices:
        - { text: "Nantais → Anjou-Saumur → Touraine → Central Vineyards", correct: false }
        - { text: "Central Vineyards → Touraine → Anjou-Saumur → Nantais", correct: true }
        - { text: "Touraine → Central Vineyards → Nantais → Anjou-Saumur", correct: false }
        - { text: "Anjou-Saumur → Nantais → Central Vineyards → Touraine", correct: false }
      explanation: |
        Sancerre lies in the inland Central Vineyards, while the Nantais reaches the Atlantic around Nantes.
    fr:
      question: "D’est en ouest, dans quel ordre se succèdent les quatre grandes régions viticoles de la Loire ?"
      choices:
        - { text: "Pays nantais → Anjou-Saumur → Touraine → Vignobles du Centre", correct: false }
        - { text: "Vignobles du Centre → Touraine → Anjou-Saumur → Pays nantais", correct: true }
        - { text: "Touraine → Vignobles du Centre → Pays nantais → Anjou-Saumur", correct: false }
        - { text: "Anjou-Saumur → Pays nantais → Vignobles du Centre → Touraine", correct: false }
      explanation: |
        Sancerre se situe dans les Vignobles du Centre, à l’intérieur des terres, tandis que le Pays nantais s’étend autour de Nantes, près de l’Atlantique.
  - id: loire-no-generic-aoc-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which statement about regional Loire appellations is correct?"
      choices:
        - { text: "AOC Loire covers all still wines in the valley", correct: false }
        - { text: "There is no single generic AOC for all still Loire wines", correct: true }
        - { text: "Crémant de Loire is the generic still-wine AOC", correct: false }
        - { text: "Touraine AOC covers every Loire vineyard", correct: false }
      explanation: |
        Still wines use regional or local AOCs such as Touraine, Sancerre and Muscadet. Val de Loire is an IGP, not a valley-wide AOC.
    fr:
      question: "Quelle affirmation sur les appellations régionales de la Loire est juste ?"
      choices:
        - { text: "L’AOC Loire couvre tous les vins tranquilles de la vallée", correct: false }
        - { text: "Il n’existe pas d’AOC générique unique pour tous les vins tranquilles de Loire", correct: true }
        - { text: "Crémant de Loire est l’AOC générique des vins tranquilles", correct: false }
        - { text: "L’AOC Touraine couvre tout le vignoble ligérien", correct: false }
      explanation: |
        Les vins tranquilles portent des AOC régionales ou locales comme Touraine, Sancerre ou Muscadet. Val de Loire est une IGP, pas une AOC couvrant toute la vallée.
  - id: loire-igp-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which regional IGP covers much of the Loire valley?
      choices:
        - { text: "Côtes de la Charité", correct: false }
        - { text: "Val de Loire", correct: true }
        - { text: "Coteaux de Tannay", correct: false }
        - { text: "Urfé", correct: false }
      explanation: |
        **Val de Loire** is the broad regional IGP. The other choices are
        smaller IGPs associated with more limited areas of the wider Loire.

    fr:
      question: "Quelle IGP couvre une grande partie de la vallée de la Loire ?"
      choices:
        - { text: "Pays d’Oc", correct: false }
        - { text: "Val de Loire", correct: true }
        - { text: "Côtes de Gascogne", correct: false }
        - { text: "Méditerranée", correct: false }
      explanation: |
        L’IGP Val de Loire offre un cadre régional plus souple que les nombreuses AOC locales de la vallée.
  - id: loire-igp-style-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why might a producer use the Val de Loire IGP rather than a local AOC?"
      choices:
        - { text: "To make fortified wine under compulsory flor", correct: false }
        - { text: "To gain more flexibility over grapes and style", correct: true }
        - { text: "To claim grand cru status across the valley", correct: false }
        - { text: "To avoid naming the vintage on any bottle", correct: false }
      explanation: |
        IGP rules can offer more freedom over varieties and production choices. The wines are commonly accessible, fresh and fruit-led.
    fr:
      question: "Pourquoi un producteur peut-il choisir l’IGP Val de Loire plutôt qu’une AOC locale ?"
      choices:
        - { text: "Pour élaborer obligatoirement un vin fortifié sous voile", correct: false }
        - { text: "Pour disposer de davantage de liberté sur les cépages et le style", correct: true }
        - { text: "Pour revendiquer un grand cru dans toute la vallée", correct: false }
        - { text: "Pour interdire toute mention du millésime", correct: false }
      explanation: |
        Les règles de l’IGP peuvent laisser davantage de liberté sur les cépages et les choix de production. Les vins sont souvent accessibles, frais et fruités.
  - id: loire-climate-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, climate]
    status: reviewed
    source_id: c18-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does the Loire's climate change from the Nantais to the Central Vineyards?"
      choices:
        - { text: "From continental in the west to strongly maritime in the east", correct: false }
        - { text: "From maritime in the west to increasingly continental inland", correct: true }
        - { text: "From Mediterranean in the west to alpine in the east", correct: false }
        - { text: "It remains uniformly maritime throughout", correct: false }
      explanation: |
        Atlantic influence is strongest around Nantes and weakens eastward; inland areas have greater seasonal and vintage variation.
    fr:
      question: "Comment le climat évolue-t-il du Pays nantais aux Vignobles du Centre ?"
      choices:
        - { text: "De continental à l’ouest à fortement maritime à l’est", correct: false }
        - { text: "De maritime à l’ouest à de plus en plus continental vers l’intérieur", correct: true }
        - { text: "De méditerranéen à l’ouest à alpin à l’est", correct: false }
        - { text: "Il reste uniformément maritime partout", correct: false }
      explanation: |
        L’influence atlantique est maximale autour de Nantes puis diminue vers l’est ; les secteurs intérieurs connaissent des écarts saisonniers et des variations de millésime plus marqués.
  - id: loire-anjou-climate-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, climate]
    status: reviewed
    source_id: c18-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What helps make much of Anjou relatively warm and dry within the Loire?"
      choices:
        - { text: "Exposure to unbroken Atlantic winds", correct: false }
        - { text: "Shelter from the Mauges hills", correct: true }
        - { text: "High altitude above the tree line", correct: false }
        - { text: "A strong Mediterranean sea influence", correct: false }
      explanation: |
        The Mauges reduce the effect of humid westerly winds, creating a rain-shadow effect over much of the vineyard.
    fr:
      question: "Qu’est-ce qui contribue au climat relativement chaud et sec d’une grande partie de l’Anjou ?"
      choices:
        - { text: "Une exposition directe aux vents atlantiques", correct: false }
        - { text: "La protection offerte par les reliefs des Mauges", correct: true }
        - { text: "Une altitude supérieure à la limite des arbres", correct: false }
        - { text: "Une forte influence de la mer Méditerranée", correct: false }
      explanation: |
        Les Mauges atténuent les vents humides d’ouest et créent un effet d’abri sur une grande partie du vignoble.
  - id: loire-touraine-climate-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, climate]
    status: reviewed
    source_id: c18-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Atlantic influence change across Touraine?"
      choices:
        - { text: "It strengthens steadily toward the east", correct: false }
        - { text: "It weakens eastward, increasing continental influence", correct: true }
        - { text: "It disappears west of Tours", correct: false }
        - { text: "It is replaced by Mediterranean influence", correct: false }
      explanation: |
        Touraine remains broadly oceanic, but the Atlantic influence weakens east of Tours and the annual temperature range increases.
    fr:
      question: "Comment l’influence atlantique évolue-t-elle à travers la Touraine ?"
      choices:
        - { text: "Elle se renforce régulièrement vers l’est", correct: false }
        - { text: "Elle diminue vers l’est, où l’influence continentale augmente", correct: true }
        - { text: "Elle disparaît à l’ouest de Tours", correct: false }
        - { text: "Elle est remplacée par une influence méditerranéenne", correct: false }
      explanation: |
        La Touraine reste globalement océanique, mais l’influence atlantique s’atténue à l’est de Tours et l’amplitude thermique annuelle augmente.
  - id: loire-vintage-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, climate]
    status: reviewed
    source_id: c18-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why can adjacent Loire vintages differ markedly in style and quality?"
      choices:
        - { text: "Annual variation in frost, rain and summer warmth", correct: true }
        - { text: "A compulsory change of grape variety each year", correct: false }
        - { text: "A fixed five-year rotation of appellation rules", correct: false }
        - { text: "Identical weather but different bottle shapes", correct: false }
      explanation: |
        In a cool, northerly region, frost, rain, hail and the warmth of the growing season strongly affect ripeness, yields and disease pressure.
    fr:
      question: "Pourquoi deux millésimes ligériens successifs peuvent-ils être très différents en style et en qualité ?"
      choices:
        - { text: "À cause des variations annuelles de gel, de pluie et de chaleur estivale", correct: true }
        - { text: "Parce que le cépage doit changer chaque année", correct: false }
        - { text: "À cause d’une rotation quinquennale des règles d’appellation", correct: false }
        - { text: "Parce que le temps est identique mais les bouteilles diffèrent", correct: false }
      explanation: |
        Dans cette région fraîche et septentrionale, le gel, la pluie, la grêle et la chaleur du cycle végétatif influencent fortement la maturité, les rendements et la pression des maladies.
  - id: loire-fungal-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, climate]
    status: reviewed
    source_id: c18-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vineyard risk increases most directly during wet Loire growing seasons?"
      choices:
        - { text: "Fungal disease", correct: true }
        - { text: "Sunburn", correct: false }
        - { text: "Drought stress", correct: false }
        - { text: "Smoke taint", correct: false }
      explanation: |
        Mildew and bunch rot become more difficult to control when rain and humidity persist, especially around flowering and ripening.
    fr:
      question: "Quel risque viticole augmente le plus directement lors des saisons humides en Loire ?"
      choices:
        - { text: "Les maladies cryptogamiques", correct: true }
        - { text: "Les brûlures du soleil", correct: false }
        - { text: "Le stress hydrique", correct: false }
        - { text: "Les goûts de fumée", correct: false }
      explanation: |
        Le mildiou et les pourritures deviennent plus difficiles à maîtriser lorsque pluie et humidité persistent, notamment autour de la floraison et de la maturation.
  - id: loire-best-sites-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which site is generally most favourable for ripening grapes in the cool Loire climate?"
      choices:
        - { text: "A south-facing, well-drained mid-slope", correct: true }
        - { text: "A shaded north-facing valley floor", correct: false }
        - { text: "A flat site prone to cold-air pooling", correct: false }
        - { text: "A fertile, waterlogged riverbank", correct: false }
      explanation: |
        Sunny slopes intercept more light and drain cold air and water better than valley floors, reducing frost risk and improving ripening.
    fr:
      question: "Quel site favorise généralement le mieux la maturation des raisins dans le climat frais de la Loire ?"
      choices:
        - { text: "Un coteau bien drainé exposé au sud", correct: true }
        - { text: "Un fond de vallée ombragé exposé au nord", correct: false }
        - { text: "Une parcelle plane où s’accumule l’air froid", correct: false }
        - { text: "Une rive fertile et gorgée d’eau", correct: false }
      explanation: |
        Les coteaux ensoleillés reçoivent davantage de lumière et évacuent mieux l’eau et l’air froid que les fonds de vallée, ce qui réduit le risque de gel et favorise la maturation.
  - id: loire-main-grapes-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, grapes]
    status: reviewed
    source_id: c18-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which group contains four key Loire grape varieties?"
      choices:
        - { text: "Sauvignon Blanc, Chenin Blanc, Melon and Cabernet Franc", correct: true }
        - { text: "Chardonnay, Viognier, Syrah and Grenache", correct: false }
        - { text: "Riesling, Gewurztraminer, Pinot Gris and Muscat", correct: false }
        - { text: "Semillon, Marsanne, Mourvèdre and Carignan", correct: false }
      explanation: |
        These four anchor the main regional styles: Centre-Loire Sauvignon, Touraine and Anjou Chenin and Cabernet Franc, and Nantais Melon.
    fr:
      question: "Quel groupe réunit quatre cépages essentiels de la Loire ?"
      choices:
        - { text: "Sauvignon Blanc, Chenin Blanc, Melon et Cabernet Franc", correct: true }
        - { text: "Chardonnay, Viognier, Syrah et Grenache", correct: false }
        - { text: "Riesling, Gewurztraminer, Pinot Gris et Muscat", correct: false }
        - { text: "Sémillon, Marsanne, Mourvèdre et Carignan", correct: false }
      explanation: |
        Ces quatre cépages structurent les grands styles régionaux : Sauvignon du Centre-Loire, Chenin et Cabernet Franc de Touraine et d’Anjou, et Melon du Pays nantais.
  - id: loire-sb-where-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, grapes]
    status: reviewed
    source_id: c18-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "In which two Loire regions is Sauvignon Blanc especially important?"
      choices:
        - { text: "Central Vineyards and Touraine", correct: true }
        - { text: "Nantais and western Anjou", correct: false }
        - { text: "Saumur and the Layon valley", correct: false }
        - { text: "Nantais and Savennières", correct: false }
      explanation: |
        It produces the celebrated whites of Sancerre and Pouilly-Fumé and large volumes of fruity Touraine blanc.
    fr:
      question: "Dans quelles deux régions ligériennes le Sauvignon Blanc est-il particulièrement important ?"
      choices:
        - { text: "Vignobles du Centre et Touraine", correct: true }
        - { text: "Pays nantais et Anjou occidental", correct: false }
        - { text: "Saumur et vallée du Layon", correct: false }
        - { text: "Pays nantais et Savennières", correct: false }
      explanation: |
        Il donne les célèbres blancs de Sancerre et de Pouilly-Fumé ainsi que d’importants volumes de Touraine blanc fruité.
  - id: loire-central-size-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which Loire region forms the relatively small, renowned eastern zone around Sancerre?
      choices:
        - { text: "Touraine", correct: false }
        - { text: "The Central Vineyards", correct: true }
        - { text: "Anjou-Saumur", correct: false }
        - { text: "The Nantais", correct: false }
      explanation: |
        The **Central Vineyards** include Sancerre, Pouilly-Fumé,
        Menetou-Salon, Quincy and Reuilly.

    fr:
      question: "Quelle région ligérienne forme une petite zone orientale particulièrement renommée ?"
      choices:
        - { text: "La Touraine", correct: false }
        - { text: "Les Vignobles du Centre", correct: true }
        - { text: "L’Anjou-Saumur", correct: false }
        - { text: "Le Pays nantais", correct: false }
      explanation: |
        Les Vignobles du Centre occupent une superficie relativement limitée autour d’appellations réputées comme Sancerre et Pouilly-Fumé.
  - id: loire-central-aocs-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0015
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Which pair of Central Vineyard AOCs face each other across the Loire?
      choices:
        - { text: "Vouvray and Savennières", correct: false }
        - { text: "Sancerre and Pouilly-Fumé", correct: true }
        - { text: "Muscadet Sèvre-et-Maine and Coteaux du Layon", correct: false }
        - { text: "Chinon and Bourgueil", correct: false }
      explanation: |
        **Sancerre** lies mainly on the left bank and **Pouilly-Fumé** on
        the right. Menetou-Salon, Quincy and Reuilly also belong to the Centre-Loire.

    fr:
      question: "Quelles deux AOC des Vignobles du Centre se font face de part et d’autre de la Loire ?"
      choices:
        - { text: "Vouvray et Savennières", correct: false }
        - { text: "Sancerre et Pouilly-Fumé", correct: true }
        - { text: "Muscadet Sèvre-et-Maine et Coteaux du Layon", correct: false }
        - { text: "Chinon et Bourgueil", correct: false }
      explanation: |
        Sancerre se trouve principalement sur la rive gauche et Pouilly-Fumé sur la rive droite. Menetou-Salon, Quincy et Reuilly appartiennent aussi au Centre-Loire.
  - id: loire-sancerre-soil-001
    type: mcq
    deck: France::Loire
    tags: [france, loire, soil]
    status: reviewed
    source_id: c18-0016
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which soil combination is characteristic of Sancerre and Pouilly-Fumé?"
      choices:
        - { text: "Limestone-rich soils, marl and flint", correct: true }
        - { text: "Deep fertile alluvium throughout", correct: false }
        - { text: "Granite and schist throughout", correct: false }
        - { text: "Volcanic basalt and slate", correct: false }
      explanation: |
        The classic local categories include caillottes (stony limestone), terres blanches (Kimmeridgian marl) and silex (flint-rich soils).
    fr:
      question: "Quelle association de sols caractérise Sancerre et Pouilly-Fumé ?"
      choices:
        - { text: "Sols calcaires, marnes et silex", correct: true }
        - { text: "Alluvions profondes et fertiles partout", correct: false }
        - { text: "Granite et schiste partout", correct: false }
        - { text: "Basalte volcanique et ardoise", correct: false }
      explanation: |
        Les catégories classiques comprennent les caillottes calcaires, les terres blanches marneuses du Kimméridgien et les sols riches en silex.
  - id: loire-central-style-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best describes a typical Centre-Loire Sauvignon Blanc?"
      choices:
        - { text: "Dry, high in acidity, with citrus, green fruit and mineral notes", correct: true }
        - { text: "Off-dry, low in acidity, with tropical fruit and new oak", correct: false }
        - { text: "Sweet, full-bodied and dominated by noble rot", correct: false }
        - { text: "Low in acidity, deeply coloured and tannic", correct: false }
      explanation: |
        Sancerre and Pouilly-Fumé are usually dry and refreshing. Fruit, floral and flinty or smoky notes vary with site and production choices.
    fr:
      question: "Quel profil décrit le mieux un Sauvignon Blanc typique du Centre-Loire ?"
      choices:
        - { text: "Sec, vif, avec des notes d’agrumes, de fruits verts et une expression minérale", correct: true }
        - { text: "Demi-sec, peu acide, tropical et marqué par le bois neuf", correct: false }
        - { text: "Doux, corsé et dominé par la pourriture noble", correct: false }
        - { text: "Peu acide, très coloré et tannique", correct: false }
      explanation: |
        Sancerre et Pouilly-Fumé sont généralement secs et rafraîchissants. Les notes fruitées, florales, fumées ou de silex varient selon le site et les choix de production.
  - id: loire-chavignol-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0018
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Les Monts Damnés, a noted steep vineyard, overlooks which Sancerre village?"
      choices:
        - { text: "Bué", correct: false }
        - { text: "Chavignol", correct: true }
        - { text: "Verdigny", correct: false }
        - { text: "Ménétréol-sous-Sancerre", correct: false }
      explanation: |
        The south-facing Monts Damnés slope rises above Chavignol and is a useful example of a distinguished Sancerre site.
    fr:
      question: "Les Monts Damnés, coteau réputé et très pentu, dominent quel village de Sancerre ?"
      choices:
        - { text: "Bué", correct: false }
        - { text: "Chavignol", correct: true }
        - { text: "Verdigny", correct: false }
        - { text: "Ménétréol-sous-Sancerre", correct: false }
      explanation: |
        Le coteau des Monts Damnés, exposé au sud, domine Chavignol et constitue un bon exemple de site réputé à Sancerre.
  - id: loire-sancerre-age-001
    type: mcq
    deck: France::Loire
    tags: [france, loire]
    status: reviewed
    source_id: c18-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the usual drinking window for most Sancerre and Pouilly-Fumé?"
      choices:
        - { text: "Young, while their fruit and acidity are vivid", correct: true }
        - { text: "Only after at least ten years in bottle", correct: false }
        - { text: "After compulsory oxidative ageing", correct: false }
        - { text: "Only in the year of harvest", correct: false }
      explanation: |
        Most examples emphasise youthful freshness, although concentrated wines from top sites and producers can develop well in bottle.
    fr:
      question: "Quand boit-on généralement la plupart des Sancerre et Pouilly-Fumé ?"
      choices:
        - { text: "Jeunes, lorsque leur fruit et leur fraîcheur sont éclatants", correct: true }
        - { text: "Seulement après au moins dix ans de bouteille", correct: false }
        - { text: "Après un élevage oxydatif obligatoire", correct: false }
        - { text: "Uniquement pendant l’année de récolte", correct: false }
      explanation: |
        La majorité privilégie la fraîcheur de jeunesse, même si des vins concentrés issus de grands sites et de bons producteurs peuvent bien évoluer en bouteille.
  - id: loire-fresh-winemaking-001
    type: mcq
