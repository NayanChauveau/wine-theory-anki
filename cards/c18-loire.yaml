        - { text: "No — the best can evolve for many years", correct: true }
        - { text: "Only if recorked every six months", correct: false }
        - { text: "Ageing is banned", correct: false }
      explanation: |
        **No — the best can evolve for many years.** Slope Chinon from
        **Joguet** or **Baudry** is not the picnic sand cuvée.

  - id: loire-saumur-reds-001
