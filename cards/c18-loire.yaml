        - { text: "Quarts de Chaume", correct: false }
        - { text: "There is no Muscadet AOC", correct: false }
      explanation: |
        Generic **Muscadet** is the broadest line. **Sèvre-et-Maine** is
        smaller on the map and bigger in the cases that matter.

  - id: loire-sevre-maine-vol-001
    type: mcq
