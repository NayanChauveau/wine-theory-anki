        - { text: "Green, herbaceous notes from the unripe berries", correct: true }
        - { text: "The acid disappears", correct: false }
        - { text: "The wine must be red", correct: false }
      explanation: |
        **Green, herbaceous aromas** from the hard berries mixed in.
        Multiple passes are the fix, not a flavour additive.

  - id: loire-chenin-tries-001
