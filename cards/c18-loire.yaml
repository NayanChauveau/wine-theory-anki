        - { text: "A legal colour chart", correct: false }
        - { text: "Whether it is bottled in Germany", correct: false }
      explanation: |
        **Ripeness at harvest.** Barely ripe → bubbles; ripe → dry still;
        shrivelled / botrytised → sweet.

  - id: loire-chenin-sparkling-001
