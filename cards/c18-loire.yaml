        - { text: "Site climate, soil, and the cellar choices", correct: true }
        - { text: "A legal single clone and no oak ever", correct: false }
        - { text: "Whether it is labelled Muscadet", correct: false }
      explanation: |
        **Climate, soil, winemaking.** Sand vs clay-limestone, and whether
        the grower uses oak, split a Chinon more than the grape name.

