      choices:
        - { text: "They are cheap everyday rosés only", correct: false }
        - { text: "Among the great sweet wines, when the vintage cooperates", correct: true }
        - { text: "They are sparkling only, like Saumur", correct: false }
        - { text: "They are German Prädikat names", correct: false }
      explanation: |
        **Among the great sweet wines** — tiny, botrytised, not every
        year. **Quarts de Chaume** is the Loire’s grand-cru sweet AOC.

  - id: loire-melon-names-001
    type: mcq
    deck: France::Loire
