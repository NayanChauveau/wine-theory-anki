    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: What does the sheltered Layon fold do in the vineyard?
      choices:
        - { text: "It stops any rot, like Savennières wind", correct: false }
        - { text: "It encourages noble rot", correct: true }
        - { text: "It forces a legal dry wine only", correct: false }
        - { text: "It is too cold for Chenin", correct: false }
      explanation: |
        **Noble rot.** Mist from the Layon plus a dry afternoon is the
        Sauternes-shaped pattern, on Chenin not Sémillon.

  - id: loire-layon-crus-001
    type: mcq
