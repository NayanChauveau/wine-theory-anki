        - { text: "Muscadet and Gros Plant", correct: false }
        - { text: "Quarts de Chaume and Bonnezeaux", correct: false }
      explanation: |
        **Bourgueil** and **Saint-Nicolas-de-Bourgueil**, north bank,
        opposite Chinon’s south-bank story.

