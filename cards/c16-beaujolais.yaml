  - id: beaujolais-crushed-fruit-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, winemaking]
    status: reviewed
    source_id: c16-0027
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does traditional maceration time commonly differ between Nouveau and cru Beaujolais?"
      choices:
        - { text: "About 4–6 days for Nouveau versus roughly 10–15 days for the crus", correct: true }
        - { text: "About 10–15 days for Nouveau versus roughly 4–6 days for the crus", correct: false }
        - { text: "About one month for both Nouveau and the crus", correct: false }
        - { text: "No skin maceration for Nouveau versus one year for the crus", correct: false }
      explanation: |
        A short maceration preserves the light, immediate fruit needed for rapid-release Nouveau. Longer
        maceration for cru wines extracts more colour and tannin, increasing structure and ageing potential.
    fr:
      question: "Comment la durée de macération traditionnelle diffère-t-elle généralement entre le Nouveau et les crus du Beaujolais ?"
      choices:
        - { text: "Environ 4 à 6 jours pour le Nouveau, contre approximativement 10 à 15 jours pour les crus", correct: true }
        - { text: "Environ 10 à 15 jours pour le Nouveau, contre approximativement 4 à 6 jours pour les crus", correct: false }
        - { text: "Environ un mois aussi bien pour le Nouveau que pour les crus", correct: false }
        - { text: "Aucune macération pelliculaire pour le Nouveau, contre un an pour les crus", correct: false }
      explanation: |
        Une macération courte préserve le fruit léger et immédiat recherché pour le Nouveau commercialisé
        rapidement. Une macération plus longue pour les crus extrait davantage de couleur et de tanins,
        augmentant la structure et le potentiel de garde.
  - id: beaujolais-oak-vessel-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, winemaking]
    status: reviewed
    source_id: c16-0028
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When oak is used for Beaujolais, which vessel is traditionally well suited to preserving fruit character?"
      choices:
        - { text: "A large, older oak vat or foudre", correct: true }
        - { text: "A new 225-litre barrique for every parcel", correct: false }
        - { text: "A small American-oak barrel with heavy toast", correct: false }
        - { text: "A sealed cask used for biological ageing under flor", correct: false }
      explanation: |
        Large, relatively neutral wooden vessels allow gentle oxygen exposure without imposing strong
        vanilla or toast flavours. Some ambitious cru producers do use smaller barrels, but new-oak flavour
        is not the regional norm.
    fr:
      question: "Lorsque le bois est utilisé pour un Beaujolais, quel contenant traditionnel convient bien à la préservation du fruit ?"
      choices:
        - { text: "Une grande cuve de bois ancienne ou un foudre", correct: true }
        - { text: "Une barrique neuve de 225 litres pour chaque parcelle", correct: false }
        - { text: "Un petit fût de chêne américain fortement chauffé", correct: false }
        - { text: "Un fût fermé destiné à un élevage biologique sous voile", correct: false }
      explanation: |
        Les grands contenants de bois relativement neutres permettent une légère exposition à l’oxygène sans
        imposer de puissantes notes de vanille ou de toast. Certains producteurs ambitieux de crus utilisent
        de plus petits fûts, mais le goût du bois neuf n’est pas la norme régionale.
  - id: beaujolais-oak-why-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, winemaking]
    status: reviewed
    source_id: c16-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Why do many Beaujolais producers avoid a strong new-oak influence?"
      choices:
        - { text: "Pronounced oak can mask Gamay’s fresh fruit and floral aromas", correct: true }
        - { text: "New oak prevents malolactic fermentation in every vintage", correct: false }
        - { text: "Gamay develops excessive acidity whenever it touches new wood", correct: false }
        - { text: "The appellations prohibit all barrels smaller than a foudre", correct: false }
      explanation: |
        Fruit purity and perfume are central to most Beaujolais styles. Neutral vessels, whether tank,
        concrete or older wood, retain those qualities; oak use is a stylistic choice rather than a general
        prohibition.
    fr:
      question: "Pourquoi de nombreux producteurs du Beaujolais évitent-ils une forte influence du bois neuf ?"
      choices:
        - { text: "Un boisé prononcé peut masquer le fruit frais et les arômes floraux du Gamay", correct: true }
        - { text: "Le bois neuf empêche toute fermentation malolactique quel que soit le millésime", correct: false }
        - { text: "Le Gamay développe une acidité excessive dès qu’il touche du bois neuf", correct: false }
        - { text: "Les appellations interdisent tous les fûts plus petits qu’un foudre", correct: false }
      explanation: |
        La pureté du fruit et le parfum sont essentiels dans la plupart des styles de Beaujolais. Les
        contenants neutres, qu’il s’agisse de cuves, de béton ou de bois ancien, préservent ces qualités ;
        l’usage du bois relève d’un choix stylistique, non d’une interdiction générale.
