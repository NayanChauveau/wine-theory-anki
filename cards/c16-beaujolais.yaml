        Beaujolais Villages couvre des vignobles de coteau dans 38 communes de la moitié nord du Beaujolais.
        Son aire entoure les zones des dix crus ou se trouve à proximité.
  - id: beaujolais-villages-hills-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, soil]
    status: reviewed
    source_id: c16-0019
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which landscape and soil pattern is characteristic of Beaujolais Villages?"
      choices:
        - { text: "Hillsides with varied poor soils including granite, gneiss, schist and blue stone", correct: true }
        - { text: "A uniform alluvial plain of deep fertile clay beside the Saône", correct: false }
        - { text: "A single chalk plateau covered by shallow white limestone soils", correct: false }
        - { text: "Steep river terraces formed exclusively from dark slate", correct: false }
      explanation: |
        The Villages area is hilly and geologically diverse. Granite-derived sands are important, but
        gneiss, schist, sandstone and blue stone also occur; elevation and drainage help limit vigour.
    fr:
      question: "Quel paysage et quel ensemble de sols caractérisent Beaujolais Villages ?"
      choices:
        - { text: "Des coteaux aux sols pauvres variés, notamment granite, gneiss, schiste et pierres bleues", correct: true }
        - { text: "Une plaine alluviale uniforme d’argiles profondes et fertiles près de la Saône", correct: false }
        - { text: "Un unique plateau crayeux couvert de sols calcaires blancs peu profonds", correct: false }
        - { text: "Des terrasses fluviales escarpées constituées exclusivement d’ardoise sombre", correct: false }
      explanation: |
        L’aire Villages est vallonnée et géologiquement diverse. Les sables issus du granite sont
        importants, mais on trouve aussi du gneiss, du schiste, du grès et des pierres bleues ; l’altitude
        et le drainage contribuent à limiter la vigueur.
