        - { text: "Brouilly and Chiroubles", correct: false }
        - { text: "Régnié and Saint-Amour", correct: false }
        - { text: "Fleurie and Beaujolais Villages", correct: false }
      explanation: |
        The tannin and concentration of Morgon and Moulin-à-Vent allow top wines to develop for years.
