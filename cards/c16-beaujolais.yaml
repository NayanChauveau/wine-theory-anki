        - { text: "31 December five years after the harvest", correct: false }
      explanation: |
        The primeur or Nouveau designation may be used only until 31 August of the year following the
        harvest. This is a labelling deadline, not a claim that the wine becomes undrinkable on that date.
    fr:
      question: "Jusqu’à quelle date un millésime peut-il conserver la mention « Nouveau » ou « primeur » ?"
      choices:
        - { text: "Jusqu’au 31 août de l’année suivant la vendange", correct: true }
        - { text: "Jusqu’au 31 décembre de l’année de la vendange", correct: false }
        - { text: "Jusqu’au troisième jeudi de novembre de l’année de la vendange", correct: false }
        - { text: "Jusqu’au 31 décembre de la cinquième année suivant la vendange", correct: false }
      explanation: |
        La mention « primeur » ou « Nouveau » ne peut être utilisée que jusqu’au 31 août de l’année suivant
        la vendange. Il s’agit d’une limite d’étiquetage, non d’une affirmation selon laquelle le vin
        deviendrait imbuvable à cette date.
  - id: beaujolais-nouveau-tier-001
