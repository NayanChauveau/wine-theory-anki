    en:
      question: How do some Beaujolais producers keep brighter fruit aromas on more serious wines?
      choices:
        - { text: "Five years in new oak and no fruit in the blend", correct: false }
        - { text: "A dose of semi-carbonic maceration, or a share of whole bunches", correct: true }
        - { text: "Mandatory chaptalisation to 16% alcohol", correct: false }
        - { text: "Ageing under flor for two years", correct: false }
      explanation: |
        Even when the base is crushed-fruit ferment, a **semi-carbonic step** or **whole
        bunches** can lift the red-fruit perfume without turning the wine into Nouveau.
