        Les tanins et la concentration de Morgon et Moulin-à-Vent permettent aux meilleures cuvées d’évoluer
        pendant plusieurs années. Un Morgon mûr peut développer une complexité terreuse et savoureuse
        traditionnellement décrite comme proche du Pinot.
