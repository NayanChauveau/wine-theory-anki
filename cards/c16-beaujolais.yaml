    en:
      question: If a Beaujolais sees oak, what vessel is typical?
      choices:
        - { text: "100% new 225 L barriques for every litre", correct: false }
        - { text: "Large vats rather than small new casks", correct: true }
        - { text: "Chestnut amphorae required by the AOC", correct: false }
        - { text: "Sherry butts under flor", correct: false }
      explanation: |
        When oak is used it is usually **large, often older vats**. The point is a gentle
        oxidative frame, not a vanilla-toast overlay.

  - id: beaujolais-oak-why-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, winemaking]
    status: draft
    source_id: c16-0029
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: Why are large vats preferred over new barriques for most Beaujolais?
      choices:
        - { text: "The AOC bans any wood that is not brand new", correct: false }
        - { text: "The wines are not meant to taste of new oak", correct: true }
        - { text: "Gamay cannot ferment in wood at all", correct: false }
        - { text: "Small casks are illegal in the Saône department", correct: false }
      explanation: |
        The fruit and (for Nouveau) carbonic aromas are the point. **New-oak flavour is
        rarely the aim**, so big, neutral-ish vats make more sense than a full barrique
        programme.

