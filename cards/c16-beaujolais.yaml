    en:
      question: "Why are careful hand harvesting and intact bunches important to traditional Beaujolais vinification?"
      choices:
        - { text: "They preserve whole berries for intracellular fermentation during semi-carbonic maceration", correct: true }
        - { text: "They maximise crushing before the grapes enter the fermentation vat", correct: false }
        - { text: "They allow the grapes to dry fully before alcoholic fermentation", correct: false }
        - { text: "They remove every stem before the grapes reach the winery", correct: false }
      explanation: |
        Semi-carbonic maceration depends on a substantial proportion of intact berries in whole bunches.
        Rough mechanical harvesting would break berries and undermine the intracellular phase that promotes
        fresh fruit aromas.
    fr:
      question: "Pourquoi une vendange manuelle soignée et des grappes intactes sont-elles importantes pour la vinification traditionnelle du Beaujolais ?"
      choices:
        - { text: "Elles préservent des baies entières pour la macération semi-carbonique", correct: true }
        - { text: "Elles maximisent l’écrasement des raisins avant leur entrée en cuve", correct: false }
        - { text: "Elles permettent aux raisins de sécher entièrement avant la fermentation alcoolique", correct: false }
        - { text: "Elles retirent toutes les rafles avant l’arrivée des raisins au chai", correct: false }
      explanation: |
        La macération semi-carbonique dépend d’une proportion importante de baies intactes au sein de
        grappes entières. Une vendange mécanique brutale écraserait les baies et compromettrait la phase
        intracellulaire qui favorise les arômes de fruit frais.
