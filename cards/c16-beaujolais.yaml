    fr:
      question: "Quels niveaux d’appellation peuvent utiliser la mention « Nouveau » ou « primeur » ?"
      choices:
        - { text: "Beaujolais et Beaujolais Villages uniquement", correct: true }
        - { text: "Les dix crus uniquement", correct: false }
        - { text: "Beaujolais et les dix crus, mais pas Villages", correct: false }
        - { text: "Beaujolais Villages et les dix crus, mais pas le Beaujolais régional", correct: false }
      explanation: |
        Le Nouveau peut être produit en Beaujolais ou en Beaujolais Villages. Les dix AOC de cru sont
        commercialisées sous leur propre nom et ne peuvent pas utiliser la mention « Nouveau ».
  - id: beaujolais-nouveau-aroma-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, nouveau]
    status: reviewed
    source_id: c16-0017
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile is most typical of Beaujolais Nouveau?"
      choices:
        - { text: "Light-bodied and low in tannin, with fresh red fruit and banana or candy-like fermentation aromas", correct: true }
        - { text: "Full-bodied and high in tannin, with black fruit and pronounced new-oak aromas", correct: false }
        - { text: "Sweet and high in alcohol, with raisined fruit and oxidative walnut aromas", correct: false }
        - { text: "Medium-bodied and high in tannin, with leather and forest-floor bottle-age aromas", correct: false }
      explanation: |
        Short semi-carbonic maceration produces a pale, supple, intensely fruity wine. Depending on yeast
        and fermentation conditions, banana, kirsch, pear-drop or sweet-spice aromas may accompany the fresh
        red fruit.
    fr:
      question: "Quel profil est le plus typique d’un Beaujolais Nouveau ?"
      choices:
        - { text: "Léger et peu tannique, avec des fruits rouges frais et des arômes fermentaires de banane ou de bonbon", correct: true }
        - { text: "Corsé et très tannique, avec fruits noirs et arômes prononcés de bois neuf", correct: false }
        - { text: "Doux et fortement alcoolisé, avec fruits passerillés et arômes oxydatifs de noix", correct: false }
        - { text: "Moyennement corsé et très tannique, avec cuir et sous-bois issus de la garde en bouteille", correct: false }
      explanation: |
        Une courte macération semi-carbonique produit un vin pâle, souple et intensément fruité. Selon les
        levures et les conditions de fermentation, des notes de banane, de kirsch, de bonbon anglais ou
        d’épices douces peuvent accompagner le fruit rouge frais.
  - id: beaujolais-villages-location-001
