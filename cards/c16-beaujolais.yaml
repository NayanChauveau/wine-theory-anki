cards:
  - id: beaujolais-climate-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, climate]
    status: reviewed
    source_id: c16-0001
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which climate pattern best describes Beaujolais?"
      choices:
        - { text: "A moderate continental climate with warm summers and a risk of autumn rain", correct: true }
        - { text: "A cool maritime climate with mild, wet summers and little seasonal variation", correct: false }
        - { text: "A hot Mediterranean climate with severe summer drought and mild winters", correct: false }
        - { text: "A cold continental climate with very short summers and persistent winter snow", correct: false }
      explanation: |
        Beaujolais lies immediately south of the Mâconnais and has a moderate continental climate. Warm
        summers can ripen Gamay, while spring frost and rain near harvest remain important hazards.
    fr:
      question: "Quel régime climatique décrit le mieux le Beaujolais ?"
      choices:
        - { text: "Un climat continental modéré, aux étés chauds et exposé aux pluies d’automne", correct: true }
        - { text: "Un climat maritime frais, aux étés doux et humides et aux faibles variations saisonnières", correct: false }
        - { text: "Un climat méditerranéen chaud, marqué par une forte sécheresse estivale et des hivers doux", correct: false }
        - { text: "Un climat continental froid, aux étés très courts et aux neiges hivernales persistantes", correct: false }
      explanation: |
        Le Beaujolais se situe immédiatement au sud du Mâconnais et possède un climat continental modéré.
        Les étés chauds permettent au Gamay de mûrir, tandis que le gel printanier et les pluies proches des
        vendanges restent des risques importants.
  - id: beaujolais-gamay-early-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, gamay]
    status: reviewed
    source_id: c16-0002
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How does Gamay’s growth cycle affect its suitability for Beaujolais?"
      choices:
        - { text: "Early ripening helps it avoid autumn rain, but early budding increases spring-frost risk", correct: true }
        - { text: "Late ripening protects it from spring frost, but prevents full ripeness in most years", correct: false }
        - { text: "Early budding and late ripening remove both frost and harvest-rain risks", correct: false }
        - { text: "Late budding and early ripening make frost and harvest rain equally unimportant", correct: false }
      explanation: |
        Gamay both buds and ripens early. Early ripening suits the moderate climate and can bring harvest
        forward, while early budding exposes young shoots to spring frost.
    fr:
      question: "Comment le cycle végétatif du Gamay influence-t-il son adaptation au Beaujolais ?"
      choices:
        - { text: "Sa maturité précoce aide à éviter les pluies d’automne, mais son débourrement précoce accroît le risque de gel printanier", correct: true }
        - { text: "Sa maturité tardive le protège du gel printanier, mais empêche généralement une pleine maturité", correct: false }
        - { text: "Son débourrement précoce et sa maturité tardive suppriment à la fois le gel et les pluies de vendange", correct: false }
        - { text: "Son débourrement tardif et sa maturité précoce rendent négligeables le gel et les pluies de vendange", correct: false }
      explanation: |
        Le Gamay débourre et mûrit tôt. Sa maturité précoce convient au climat modéré et peut avancer la
        vendange, tandis que son débourrement précoce expose les jeunes pousses au gel printanier.
  - id: beaujolais-gamay-yield-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, gamay]
    status: reviewed
    source_id: c16-0003
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is the likely result if vigorous Gamay is allowed to crop too heavily?"
      choices:
        - { text: "High yields can dilute fruit concentration and produce thin wine", correct: true }
        - { text: "High yields naturally increase tannin and produce long-lived wine", correct: false }
        - { text: "High yields delay budding and eliminate spring-frost risk", correct: false }
        - { text: "High yields concentrate sugar while preserving very high acidity", correct: false }
      explanation: |
        Gamay is naturally vigorous and fertile. Pruning, planting density and canopy or crop management are
        needed because excessive yields reduce concentration and flavour intensity.
    fr:
      question: "Quel résultat est probable si le Gamay vigoureux produit une récolte trop abondante ?"
      choices:
        - { text: "Des rendements élevés peuvent diluer le fruit et donner un vin maigre", correct: true }
        - { text: "Des rendements élevés augmentent naturellement les tanins et donnent un vin de garde", correct: false }
        - { text: "Des rendements élevés retardent le débourrement et suppriment le risque de gel printanier", correct: false }
        - { text: "Des rendements élevés concentrent le sucre tout en maintenant une acidité très forte", correct: false }
      explanation: |
        Le Gamay est naturellement vigoureux et fertile. La taille, la densité de plantation et la gestion
        de la végétation ou de la récolte sont importantes, car des rendements excessifs réduisent la
        concentration et l’intensité aromatique.
  - id: beaujolais-granite-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, soil]
    status: reviewed
    source_id: c16-0004
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which broad soil contrast is found between northern and southern Beaujolais?"
      choices:
        - { text: "The north has many sandy granite-derived soils; the south has more clay and limestone", correct: true }
        - { text: "The north is mainly chalk; the south is mainly volcanic basalt", correct: false }
        - { text: "The north is mainly deep alluvium; the south is mainly pure granite", correct: false }
        - { text: "The north is mainly sand dunes; the south is mainly slate terraces", correct: false }
      explanation: |
        Northern Beaujolais includes many poor, well-drained soils derived from granite, along with schist,
        blue stone and other rocks. Southern Beaujolais more often has clay-rich and sometimes
        limestone-derived soils; neither half is geologically uniform.
    fr:
      question: "Quel grand contraste pédologique existe entre le nord et le sud du Beaujolais ?"
      choices:
        - { text: "Le nord compte beaucoup de sols sableux issus du granite ; le sud davantage d’argiles et de calcaires", correct: true }
        - { text: "Le nord est surtout crayeux ; le sud surtout constitué de basalte volcanique", correct: false }
        - { text: "Le nord est surtout formé d’alluvions profondes ; le sud de granite pur", correct: false }
        - { text: "Le nord est surtout couvert de dunes sableuses ; le sud de terrasses d’ardoise", correct: false }
      explanation: |
        Le nord du Beaujolais comprend de nombreux sols pauvres et bien drainés issus du granite, mais aussi
        des schistes, des pierres bleues et d’autres roches. Le sud présente plus souvent des sols argileux
        et parfois calcaires ; aucune des deux moitiés n’est géologiquement uniforme.
  - id: beaujolais-gobelet-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, viticulture]
    status: reviewed
    source_id: c16-0005
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which vine-training system is traditional in Beaujolais?"
      choices:
        - { text: "Low, free-standing gobelet training", correct: true }
        - { text: "High pergola training", correct: false }
        - { text: "Single Guyot on a high trellis", correct: false }
        - { text: "Geneva Double Curtain training", correct: false }
      explanation: |
        Traditional Beaujolais vines are head trained and spur pruned in a low gobelet form. This dense,
        free-standing system suits manual work and the harvesting of intact bunches.
    fr:
      question: "Quel système de conduite de la vigne est traditionnel en Beaujolais ?"
      choices:
        - { text: "Le gobelet bas et autoportant", correct: true }
        - { text: "La pergola haute", correct: false }
        - { text: "Le Guyot simple sur un palissage haut", correct: false }
        - { text: "La lyre ouverte de type Geneva Double Curtain", correct: false }
      explanation: |
        Les vignes traditionnelles du Beaujolais sont conduites en gobelet bas, taillées en coursons autour
        d’une tête. Ce système dense et autoportant convient au travail manuel et à la récolte de grappes
        intactes.
  - id: beaujolais-gobelet-form-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, viticulture]
    status: reviewed
    source_id: c16-0006
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is a traditional Beaujolais gobelet vine formed?"
      choices:
        - { text: "Short spurs radiate from a head and the upright shoots may be tied together", correct: true }
        - { text: "One long cane is laid horizontally on a fruiting wire each year", correct: false }
        - { text: "Permanent cordons run along wires above a wide tractor row", correct: false }
        - { text: "Four long canes are trained overhead to form a pergola", correct: false }
      explanation: |
        Gobelet uses spur pruning around a short head. The season’s shoots may be gathered and tied upright,
        providing support without a full wire trellis.
    fr:
      question: "Comment est formé un gobelet traditionnel du Beaujolais ?"
      choices:
        - { text: "De courts coursons rayonnent autour d’une tête et les rameaux dressés peuvent être attachés ensemble", correct: true }
        - { text: "Un long bois est couché chaque année sur un fil fructifère horizontal", correct: false }
        - { text: "Des cordons permanents courent sur des fils au-dessus d’un large rang pour tracteur", correct: false }
        - { text: "Quatre longs bois sont conduits au-dessus de la vigne pour former une pergola", correct: false }
      explanation: |
        Le gobelet repose sur une taille courte en coursons autour d’une tête basse. Les rameaux de l’année
        peuvent être rassemblés et attachés verticalement, ce qui les soutient sans palissage complet.
  - id: beaujolais-mechanisation-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, viticulture]
    status: reviewed
    source_id: c16-0007
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which change makes a Beaujolais vineyard easier to mechanise?"
      choices:
        - { text: "Training the vines on wires with wider, tractor-accessible rows", correct: true }
        - { text: "Keeping dense, free-standing gobelet vines without posts", correct: false }
        - { text: "Tying every shoot into one compact bundle above the vine head", correct: false }
        - { text: "Maintaining very narrow rows on the steepest slopes", correct: false }
      explanation: |
        Wire-trained vines and wider rows allow tractors to pass for trimming, spraying and other
        operations. Traditional dense gobelet vineyards are much more dependent on manual work.
    fr:
      question: "Quel changement facilite la mécanisation d’un vignoble du Beaujolais ?"
      choices:
        - { text: "Palissage sur fils avec des rangs plus larges accessibles au tracteur", correct: true }
        - { text: "Maintien de gobelets denses et autoportants sans piquets", correct: false }
        - { text: "Regroupement de tous les rameaux en un faisceau compact au-dessus de la tête", correct: false }
        - { text: "Conservation de rangs très étroits sur les pentes les plus fortes", correct: false }
      explanation: |
        Des vignes palissées sur fils et des rangs plus larges permettent le passage des tracteurs pour le
        rognage, les traitements et d’autres opérations. Les gobelets traditionnels très denses exigent
        beaucoup plus de travail manuel.
  - id: beaujolais-gamay-profile-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, gamay]
    status: reviewed
    source_id: c16-0008
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which profile best describes a typical red Beaujolais made from Gamay?"
      choices:
        - { text: "Light to medium-bodied, high in acidity and low in tannin, with red-fruit aromas", correct: true }
        - { text: "Full-bodied, low in acidity and high in tannin, with black-fruit aromas", correct: false }
        - { text: "Light-bodied, low in acidity and high in tannin, with dried-fruit aromas", correct: false }
        - { text: "Full-bodied, high in acidity and low in tannin, with pronounced new-oak aromas", correct: false }
      explanation: |
        Gamay commonly gives bright raspberry, strawberry and cherry fruit, lively acidity and relatively
        low tannin. Cru wines can be more concentrated and structured, but the grape retains its
        fresh-fruited identity.
    fr:
      question: "Quel profil décrit le mieux un Beaujolais rouge typique issu du Gamay ?"
      choices:
        - { text: "Léger à moyennement corsé, très acide et peu tannique, avec des arômes de fruits rouges", correct: true }
        - { text: "Corsé, peu acide et très tannique, avec des arômes de fruits noirs", correct: false }
        - { text: "Léger, peu acide et très tannique, avec des arômes de fruits secs", correct: false }
        - { text: "Corsé, très acide et peu tannique, avec des arômes prononcés de bois neuf", correct: false }
      explanation: |
        Le Gamay donne généralement des notes éclatantes de framboise, de fraise et de cerise, une acidité
        vive et relativement peu de tanins. Les crus peuvent être plus concentrés et structurés, tout en
        conservant l’identité fruitée et fraîche du cépage.
  - id: beaujolais-hierarchy-count-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, appellation]
    status: reviewed
    source_id: c16-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "How is the Beaujolais appellation hierarchy commonly organised?"
      choices:
        - { text: "Regional Beaujolais, Beaujolais Villages, then ten named crus", correct: true }
        - { text: "Regional Beaujolais, Premier Cru, then Grand Cru", correct: false }
        - { text: "Beaujolais Villages, five crus, then two Grands Crus", correct: false }
        - { text: "One regional appellation with no more specific geographical levels", correct: false }
      explanation: |
        The practical ladder has three levels: Beaujolais, Beaujolais Villages and the ten northern crus.
        Legally this represents twelve AOCs in total, with no Burgundy-style Premier Cru or Grand Cru tier.
    fr:
      question: "Comment la hiérarchie des appellations du Beaujolais est-elle généralement organisée ?"
      choices:
        - { text: "Beaujolais régional, Beaujolais Villages, puis dix crus nommés", correct: true }
        - { text: "Beaujolais régional, Premier Cru, puis Grand Cru", correct: false }
        - { text: "Beaujolais Villages, cinq crus, puis deux Grands Crus", correct: false }
        - { text: "Une seule appellation régionale sans niveau géographique plus précis", correct: false }
      explanation: |
        La hiérarchie pratique comprend trois niveaux : Beaujolais, Beaujolais Villages et les dix crus du
        nord. Juridiquement, cela représente douze AOC au total, sans niveau Premier Cru ou Grand Cru de
        type bourguignon.
  - id: beaujolais-hierarchy-top-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, appellation]
    status: reviewed
    source_id: c16-0009
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which wines form the most geographically specific level of the Beaujolais hierarchy?"
      choices:
        - { text: "The ten crus, labelled with their individual cru names", correct: true }
        - { text: "Beaujolais Nouveau, labelled with its release date", correct: false }
        - { text: "Beaujolais Supérieur, labelled as a separate cru", correct: false }
        - { text: "All wines produced on the eastern Saône plain", correct: false }
      explanation: |
        Each cru is a separate AOC and appears under its own name, such as Fleurie, Morgon or Moulin-à-Vent.
        Nouveau is a primeur style within Beaujolais or Beaujolais Villages, not a higher rank.
    fr:
      question: "Quels vins constituent le niveau géographique le plus précis de la hiérarchie du Beaujolais ?"
      choices:
        - { text: "Les dix crus, étiquetés sous leur nom individuel", correct: true }
        - { text: "Le Beaujolais Nouveau, étiqueté avec sa date de sortie", correct: false }
        - { text: "Le Beaujolais Supérieur, étiqueté comme un cru distinct", correct: false }
        - { text: "Tous les vins produits dans la plaine orientale de la Saône", correct: false }
      explanation: |
        Chaque cru est une AOC distincte et apparaît sous son propre nom, comme Fleurie, Morgon ou
        Moulin-à-Vent. Le Nouveau est un style primeur de Beaujolais ou de Beaujolais Villages, et non un
        rang supérieur.
  - id: beaujolais-generic-plain-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, geography]
    status: reviewed
    source_id: c16-0010
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Where is the regional Beaujolais AOC concentrated relative to the crus?"
      choices:
        - { text: "Mainly in the southern vineyard and along the eastern side toward the Saône", correct: true }
        - { text: "Mainly on the highest granite slopes at the northern end of the region", correct: false }
        - { text: "Entirely within the ten cru production areas", correct: false }
        - { text: "Entirely west of the Monts du Beaujolais", correct: false }
      explanation: |
        Regional Beaujolais is especially associated with the southern hills and vineyards extending along
        the Saône side. Soils there are often richer in clay and sometimes limestone, whereas the ten crus
        are concentrated farther north.
    fr:
      question: "Où l’AOC régionale Beaujolais se concentre-t-elle par rapport aux crus ?"
      choices:
        - { text: "Surtout dans le sud du vignoble et sur son côté oriental vers la Saône", correct: true }
        - { text: "Surtout sur les plus hauts coteaux granitiques à l’extrémité nord", correct: false }
        - { text: "Entièrement à l’intérieur des aires des dix crus", correct: false }
        - { text: "Entièrement à l’ouest des monts du Beaujolais", correct: false }
      explanation: |
        L’AOC régionale Beaujolais est particulièrement associée aux collines méridionales et aux vignes qui
        longent le côté de la Saône. Les sols y sont souvent plus argileux et parfois calcaires, tandis que
        les dix crus se concentrent plus au nord.
  - id: beaujolais-carbonic-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, winemaking]
    status: reviewed
    source_id: c16-0011
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which technique is most characteristic of traditional red-wine production in Beaujolais?"
      choices:
        - { text: "Semi-carbonic maceration of intact whole bunches", correct: true }
        - { text: "Long oxidative ageing under a film of yeast", correct: false }
        - { text: "Fermentation of fully dried grapes", correct: false }
        - { text: "Direct pressing followed by barrel fermentation", correct: false }
      explanation: |
        Whole bunches are placed in the vat without added carbon dioxide. Juice released at the bottom
        begins yeast fermentation, generating carbon dioxide that triggers intracellular fermentation in
        intact berries above: the Beaujolais semi-carbonic method.
    fr:
      question: "Quelle technique caractérise le plus la production traditionnelle des vins rouges du Beaujolais ?"
      choices:
        - { text: "La macération semi-carbonique de grappes entières intactes", correct: true }
        - { text: "Un long élevage oxydatif sous un voile de levures", correct: false }
        - { text: "La fermentation de raisins entièrement séchés", correct: false }
        - { text: "Le pressurage direct suivi d’une fermentation en barrique", correct: false }
      explanation: |
        Les grappes entières sont placées en cuve sans ajout de dioxyde de carbone. Le jus libéré au fond
        commence à fermenter avec les levures et produit le gaz qui déclenche une fermentation
        intracellulaire dans les baies intactes situées au-dessus : c’est la méthode semi-carbonique
        beaujolaise.
  - id: beaujolais-nouveau-plain-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, nouveau]
    status: reviewed
    source_id: c16-0012
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "Which part of Beaujolais is most associated with the high-volume regional wines used for Nouveau?"
      choices:
        - { text: "The southern and eastern sectors of the regional Beaujolais AOC", correct: true }
        - { text: "The ten northern cru areas exclusively", correct: false }
        - { text: "The highest slopes around Chiroubles exclusively", correct: false }
        - { text: "The vineyards of Moulin-à-Vent and Morgon exclusively", correct: false }
      explanation: |
        Much Nouveau comes from the broader regional appellation, whose vineyards are concentrated in the
        south and along the eastern side toward the Saône. Beaujolais Villages may also produce Nouveau, but
        the crus may not.
    fr:
      question: "Quelle partie du Beaujolais est la plus associée aux vins régionaux de volume utilisés pour le Nouveau ?"
      choices:
        - { text: "Les secteurs méridionaux et orientaux de l’AOC régionale Beaujolais", correct: true }
        - { text: "Exclusivement les aires des dix crus du nord", correct: false }
        - { text: "Exclusivement les pentes les plus élevées autour de Chiroubles", correct: false }
        - { text: "Exclusivement les vignobles de Moulin-à-Vent et de Morgon", correct: false }
      explanation: |
        Une grande partie du Nouveau provient de l’appellation régionale, dont les vignobles se concentrent
        au sud et sur le côté oriental vers la Saône. Beaujolais Villages peut également produire du
        Nouveau, mais pas les crus.
  - id: beaujolais-nouveau-purpose-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, nouveau]
    status: reviewed
    source_id: c16-0013
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "What is Beaujolais Nouveau designed for?"
      choices:
        - { text: "Release within weeks of harvest and consumption while its primary fruit is fresh", correct: true }
        - { text: "Long maturation in oak followed by at least a decade in bottle", correct: false }
        - { text: "Extended skin maceration to build high tannin and long ageing potential", correct: false }
        - { text: "Oxidative maturation to develop nutty tertiary aromas before sale", correct: false }
      explanation: |
        Nouveau is a primeur wine made and bottled rapidly for immediate enjoyment. Its appeal is fresh
        fruit and fermentation-derived aroma rather than tannin, oak or bottle development.
    fr:
      question: "Dans quel but le Beaujolais Nouveau est-il élaboré ?"
      choices:
        - { text: "Être commercialisé quelques semaines après la vendange et bu pendant que son fruit primaire est frais", correct: true }
        - { text: "Subir un long élevage sous bois suivi d’au moins dix ans en bouteille", correct: false }
        - { text: "Recevoir une longue macération afin de développer beaucoup de tanins et un fort potentiel de garde", correct: false }
        - { text: "Être élevé de façon oxydative pour développer des arômes tertiaires de noix avant la vente", correct: false }
      explanation: |
        Le Nouveau est un vin primeur élaboré et mis en bouteille rapidement pour être apprécié
        immédiatement. Son attrait repose sur le fruit frais et les arômes fermentaires, non sur les tanins,
        le bois ou l’évolution en bouteille.
  - id: beaujolais-nouveau-release-001
    type: mcq
    deck: France::Beaujolais
    tags: [france, beaujolais, nouveau]
    status: reviewed
    source_id: c16-0014
    review:
      fact_check: pass
      sources: [known-fact]
    en:
      question: "When may Beaujolais Nouveau first be released for sale?"
      choices:
        - { text: "On the third Thursday of November following the harvest", correct: true }
        - { text: "On the first Thursday of October following the harvest", correct: false }
        - { text: "On 1 January in the year after the harvest", correct: false }
        - { text: "After twelve months of maturation following the harvest", correct: false }
      explanation: |
        The third Thursday of November is the authorised and internationally promoted release date for
        Beaujolais Nouveau and Beaujolais Villages Nouveau.
    fr:
      question: "À partir de quand le Beaujolais Nouveau peut-il être commercialisé ?"
      choices:
        - { text: "Le troisième jeudi de novembre suivant la vendange", correct: true }
        - { text: "Le premier jeudi d’octobre suivant la vendange", correct: false }
        - { text: "Le 1er janvier de l’année suivant la vendange", correct: false }
        - { text: "Après douze mois d’élevage suivant la vendange", correct: false }
      explanation: |
        Le troisième jeudi de novembre est la date autorisée et promue internationalement pour la sortie du
        Beaujolais Nouveau et du Beaujolais Villages Nouveau.
  - id: beaujolais-nouveau-deadline-001
