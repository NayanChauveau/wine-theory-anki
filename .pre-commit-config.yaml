repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: schema
        name: JSON Schema in sync
        language: system
        entry: uv run wset3-anki schema --check
        pass_filenames: false
      - id: validate-cards
        name: Validate card YAML
        language: system
        entry: uv run wset3-anki validate
        pass_filenames: false
        files: ^cards/.*\.ya?ml$
