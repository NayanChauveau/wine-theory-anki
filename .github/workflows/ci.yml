name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Quality gate
        run: make check
      - name: Build packages
        run: uv run wset3-anki build --lang all --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: anki-packages
          path: dist/*.apkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anki-packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wset3-vin-en.apkg
            dist/wset3-vin-fr.apkg
          generate_release_notes: true
