  - 'c20: one inverted key (srhone-syrah-trellis-001) that passed earlier review'
  - 'c20: many joke/absurd foils and absolute cue words (all/only/always/cannot) leaving the key as the only sensible
    option'
  - 'c17: half-true foils built from real rules (grand cru hand harvest, 2021 sweetness labelling)'
  - 'c17: the 51 grand cru count leaked through stems/foils of sibling cards'
  - FR calques of savoury/gamey/fortified (savoureux, structure animale, fortifié)
  web_checks: none needed; all judged from knowledge
  validate: uv run wset3-anki validate -> 3517 card(s) OK; EN/FR correct indexes match on all 150 cards
