summary:
  total: 167
  wrong: 2
  fix: 4
  minor: 21
  ok: 140
  verified_on_web_no_change:
    - "santorini-styles-allowed-001 / santorini-assyrtiko-fame-001: 85 % Assyrtiko minimum is current (raised from 75 % by the 2022 amendment)"
    - "nemea-altitude-range-001 / nemea-mid-slope-001: 250-800 m and 350-600 m match Wines of Greece zones (WSET materials quote 230-900 / 450-650; card figures defensible as 'approximate')"
    - "Tokaj 2013 rules (120 g/L, 18 months wood, 6-puttonyos 150 g/L, Aszú Eszencia gone, Eszencia 450 g/L) consistent with the 2026 EU-approved amendment as reported"
  riskiest_patterns:
    - "Half-true foils where a second regional speciality exists (Muskateller in Steiermark, Vin Jaune vs Fino, local-only red blends)"
    - "FR calques of 'savoury' (savoureux) and 'to dryness' (jusqu’à sécheresse)"
    - "Key always in 2nd position and often the longest/only qualified choice; 'Only/All/must' foils (Austria law cards, Tokaj style cards)"
    - "Heavy near-duplication around Lake Neusiedl botrytis (4 cards) and Tokaj 2013 sugar thresholds (5-6 cards) — keys of one card appear in the Why of another"
    - "Tokaj legal cards depend on a specification amended again in 2026 (EU 2026/1556); full text not read — release dates and puttonyos optionality worth a recheck against the consolidated spec"
