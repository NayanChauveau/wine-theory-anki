# Final audit — c23 Austria (76), c24 Tokaj (62), c25 Greece (29) = 167 cards
# Web checks (untrusted, used only to confirm figures): PDO Santorini 85 % Assyrtiko (2022 amendment),
# Nemea altitude zones (Wines of Greece 260-350 / 350-600 / 600-800 m), Tokaj 2026 spec amendment
# (EU 2026/1556: Aszú 18 months cask, Szamorodni 6 months, Aszúeszencia abolished, Szamorodni split dry/sweet).
# Could not open the full amended Tokaj specification; puttonyos-optional status assumed unchanged (still used on 2026 labels).
