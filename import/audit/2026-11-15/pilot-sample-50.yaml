      EN explanation: Malic acid is respired faster the warmer it is, so cold nights slow that loss while warm days build sugar and flavour. The ranges to the west also keep the area fairly dry, which limits rot.
      FR explanation: L’acide malique est d’autant plus vite consommé par la respiration qu’il fait chaud : des nuits froides freinent cette perte, tandis que les journées chaudes accumulent sucres et arômes. Les chaînes de montagnes à l’ouest gardent aussi la zone assez sèche, ce qui limite la pourriture.
