  - id: france-nested-aoc-001
    file: cards/c12-france-introduction.yaml
    verdict: fix
    issues:
      - "Key just restates the stem (why can areas overlap? because areas can overlap)"
      - "Joke foils with cue words: 'every vineyard automatically', 'must always', 'EU law requires every parcel to belong to France and another country'"
      - "Key is the only sensible sentence; no knowledge needed"
    proposed_fix: |
      EN question: A parcel lies inside the Gevrey-Chambertin village area. Which broader appellation can its Pinot Noir also claim, provided it meets that appellation's rules?
      EN choices: Bourgogne (correct, keep index 0) / Côte de Beaune-Villages / Mâcon / Beaujolais-Villages
      EN explanation: French appellation areas are nested: a village or cru area sits inside a broader regional one. The wine may claim only a designation whose grape, yield and production rules it meets, which is how growers declassify a lot to the regional name.
      FR question: Une parcelle se trouve dans l’aire villages de Gevrey-Chambertin. Quelle appellation plus large son Pinot Noir peut-il aussi revendiquer, s’il en respecte les règles ?
      FR choices: Bourgogne (correct) / Côte de Beaune-Villages / Mâcon / Beaujolais-Villages
      FR explanation: Les aires d’appellation françaises sont emboîtées : une aire communale ou de cru se situe dans une aire régionale plus large. Le vin ne peut revendiquer qu’une appellation dont il respecte les règles de cépage, de rendement et de production ; c’est ainsi qu’un lot est replié en appellation régionale.
    checked: [knowledge]
