    verdict: fix
    issues:
      - "Stem gives the key away: 'shreds' / 'déchire' points to hail; foil 'Persistent rain without ice' / 'sans glace' points to it again"
      - "Why: Burgundy's hail defence is mainly a network of silver-iodide cloud-seeding generators plus nets, not 'anti-hail cannon'"
      - "FR: 'déchire les récoltes', 'ont tapé' are awkward/colloquial"
    proposed_fix: |
      EN question: Besides spring frost, which weather hazard most regularly cuts crops on the Côte d’Or in summer?
      EN choices: A long drought / Hail (correct, index 1) / Sunburn on exposed bunches / Persistent summer rain
      EN explanation: Storms track along the Côte. **2012–2014** battered Volnay and Meursault three years running; cloud-seeding generators and hail nets are now part of the landscape.
      FR question: Outre le gel de printemps, quel aléa climatique ampute le plus régulièrement les récoltes de la Côte d’Or en été ?
      FR choices: Une longue sécheresse / La grêle (correct) / L’échaudage des grappes exposées / Des pluies estivales persistantes
      FR explanation: Les orages longent la Côte. De **2012 à 2014**, Volnay et Meursault ont été frappés trois années de suite ; générateurs à iodure d’argent et filets paragrêle font désormais partie du paysage.
