summary:
  counts:
    ok: 25
    minor: 17
    fix: 8
    wrong: 0
  common_issue_types:
    - "Foils eliminable without the fact: other-class or joke foils (about 12 cards)"
    - "Stem or wording gives the key away, or key restates the stem (4 cards)"
    - "Cue words in foils only: only / always / any / guarantee (4 cards)"
    - "Explanation defects: wrong mechanism or detail (2), restates key or omits the named subject (4)"
    - "FR: calques or small drifts (6 cards); only 1 changes meaning enough to matter"
  facts:
    - "No keyed answer was wrong and no foil was fully correct in 50 cards"
    - "2 factual slips, both in explanations (malic acid 'lost at night'; 'anti-hail cannon'), plus 1 half-true FR foil"
    - "No web lookup was needed; the sample had few doubtful figures or dates"
  full_audit_estimate:
    worthwhile: "Yes for quality, low yield for facts"
    expected_change_rate: "About 15% of cards need a real fix (roughly 500 of 3,500; with n=50 the plausible range is about 7-28%), and a further 30-35% have optional style polish"
    expected_wrong_rate: "Under 2% keyed-answer errors (0 of 50 seen; cannot rule out a few dozen deck-wide)"
    riskiest:
      - "Early-wave regional chapters with single-fact 'which/where' stems and other-region foils: c12 France intro, c13 Bordeaux, c15 Burgundy, c17 Alsace, c18 Loire, c21 Southern France, c28 Central Italy, c34 Pacific Northwest"
      - "Law / classification cards (which statement, which category), where foils rely on 'only'"
      - "Explanations that state a mechanism (respiration, oxidation, ripening); this is where factual slips appeared"
      - "Older cards with a casual voice (c13, c15), which also carry the weakest French"
    lowest_risk: "Structured profile cards (acid/body/tannin grids), numeric cards with ordered foils, and theory chapters c01-c06"
    suggestion: "Prioritise fix-level defects (giveaways, cue words, mechanism claims in Why) with a cheap automated pre-filter for 'only/always/never/guarantee' in foils and key-longest-by-50%; skip minor-only polish"
