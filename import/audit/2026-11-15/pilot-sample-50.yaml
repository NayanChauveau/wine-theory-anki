      - "Joke foil with cue word: 'It only makes sweet wine'"
      - "FR calques: 'l’épine tannique' (not wine French), 'fruit floral', 'légèreté' for 'lift'"
    proposed_fix: |
      EN foil 4: "More colour and a later ripening date"
      FR foil 4: "Plus de couleur et une maturité plus tardive"
      FR choice 2: "Moins de corps et de tanin, un fruit plus floral"
      FR explanation: Le Cabernet Franc apporte **parfum et fraîcheur**, pas la charpente tannique. Vendangé trop tôt, il devient végétal — le même piège que le Cabernet Sauvignon, mais il mûrit plus tôt.
      (EN Why: add 'It ripens earlier and gives less colour than Cabernet Sauvignon' to cover the new foil.)
    checked: [knowledge]
