summary:
  counts:
    minor: 28
    fix: 62
    ok: 22
    wrong: 0
  riskiest_patterns:
  - 'Joke or out-of-frame foils (flor, fortification, bottle shape, by-law figures, other regions or colours) on
    roughly half the cards: key reachable without the fact'
  - Hedged key (some/uncommon/selectively) against absolute foils with only/all/every/always
  - 'EN and FR versions drifting apart: different stems or foil sets on igp, touraine-aoc, chenin-shape, vouvray-where,
    layon-crus'
  - Self-answering stems (Coteaux du Layon -> the Layon; Touraine city -> Tours)
  - No factual key errors found; legal figures (12% abv, 1 March sur lie, 3/7/10 g/L rosé sugars) match current
    specifications from knowledge, no web check needed
