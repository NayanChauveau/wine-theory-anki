    - "Key visibly longer than the foils on description cards (Boutenac, Viognier oak, Cornas style)"
    - "Over-engineered half-true foils (Provence mesoclimates) that cannot be separated from the key"
    - "FR calques of 'savoury' (savoureux/savoureuse) and 'mature' (mûrs)"
    - "Soft figures presented as fixed: Hermitage white share, Languedoc AOC 40/40/20, Les Baux commune count, Pays d’Oc 'five départements'"
