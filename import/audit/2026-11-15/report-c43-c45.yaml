  edited_cards: [sherry-cream-base-001, sherry-criadera-count-001, port-robotic-lagar-verdict-001]
  web_lookups: 2
  riskiest_patterns:
    - "Named anecdotes in explanations ageing badly with regulation changes (Oloroso Dulce label term). Keys were sound; the risk sits in the Why."
    - "Occasional absolute-word foils (always / every / compulsory / banned) that let the hedged key stand out."
    - "A few binary questions padded with one throwaway foil, mostly in Port."
    - "FR drift is rare: one dropped 'only', one extra clause; no key/index mismatch."
