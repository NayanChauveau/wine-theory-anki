cards:
  - id: vine-hybrid-rootstock-001
    file: cards/c03-the-vine.yaml
    verdict: fix
    issues:
      - "Stem and Why called interspecific rootstock parents (riparia x rupestris, berlandieri x rupestris) 'crosses'; this contradicts vine-hybrid-001, which teaches that parents from different Vitis species make a hybrid"
      - "Foil 4 (fruit for most European quality appellations) drops without knowledge (left alone)"
    change: "EN stem + Why: 'crosses among' -> 'hybrids between' / 'Hybrids such as'; FR stem + Why: 'croisements' -> 'hybrides'. Choices and index unchanged."
    checked: [knowledge]
  - id: vine-head-graft-how-001
    file: cards/c03-the-vine.yaml
    verdict: fix
    issues:
      - "Why said shoots below the graft are rootstock shoots; on a top-worked vine the trunk below the new graft is the OLD scion variety, so those shoots are old-variety (or rootstock only if below the original union)"
    change: "EN + FR Why: shoots below the new graft 'belong to the old variety or to the rootstock'. Choices unchanged."
    checked: [knowledge]
