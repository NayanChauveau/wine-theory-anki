# Suivi relecture — difficulté (leurres) + sens français
#
# Ce n’est PAS le ledger d’import EN (`progress.yaml`). Ne pas y écrire
# `done` / `split` depuis ce fichier.
#
# Deux barres, pas un fact-check (voir import/AGENT_PLAYBOOK.md
# « Study-card quality ») :
#   credibility — les fausses propositions sont-elles pickables pour un WSET 3 ?
#   sense       — la phrase française veut-elle vraiment dire quelque chose ?
#
# Statuts carte :
#   pending      — pas encore lu
#   agent-pass   — critic agent OK sur les deux barres ; relecture humaine ouverte
#   agent-fixed  — agent a réécrit (EN+FR alignés) ; relecture humaine ouverte
#   human-ok     — toi, après relecture (mettre human: ok)
#   hold         — en attente d’une décision
#
# Comment relire : ouvrir cards/<file>.yaml, cocher human: ok carte par carte
# ou chapter status: human-ok quand tout le chapitre est bon.
# Agents : mettre à jour ce fichier après chaque lot CREDIBILITY / SENSE.
# Lots ≤ 40 cartes. Un chapitre à la fois.

