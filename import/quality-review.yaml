# Suivi relecture — pas le ledger d’import EN (`progress.yaml`).
#
# Brief des barres (isolation, leurres, longueur, Why, sens FR) :
#   import/STUDY_CARD_QUALITY.md
#
# Barres (pas un fact-check) :
#   isolation   — carte autonome (pas « cette / that »)
#   credibility — leurres pickables pour un WSET 3
#   length      — la clé n’est pas visiblement la plus longue
#   why         — pas de recopiage de la bonne réponse
#   sense       — le français veut dire quelque chose
#
# Statuts carte :
#   pending      — pas encore lu
#   agent-pass   — critic agent OK sur les deux barres ; relecture humaine ouverte
#   agent-fixed  — agent a réécrit (EN+FR alignés) ; relecture humaine ouverte
#   human-ok     — toi, après relecture (mettre human: ok)
#   hold         — en attente d’une décision
#
# Comment relire : ouvrir cards/<file>.yaml, cocher human: ok carte par carte
# ou chapter status: human-ok quand tout le chapitre est bon.
# Agents : mettre à jour ce fichier après chaque lot (voir STUDY_CARD_QUALITY.md).
# Lots ≤ 40 cartes. Un chapitre à la fois.

